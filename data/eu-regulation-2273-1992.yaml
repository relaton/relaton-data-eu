title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2273/92 of 3 August 1992 re-establishing
    the levying of customs duties on products of category 20 (order No 40.0200), originating
    in Sri Lanka, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2273/92 de la Commission du 3 août 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    20 (numéro d'ordre 40.0200) originaires du Sri Lanka bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2273/92 DER KOMMISSION vom 3. August 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie Nr. 20 (laufende Nummer 40.0200) mit
    Ursprung in Sri Lanka, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2273/92 af 3. august 1992 om genindførelse
    af opkrævning af told for varer under kategori 20 (løbenummer 40.0200), som
    har oprindelse i Sri Lanka og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2273/92 της Επιτροπής
    της 3ης Αυγούστου 1992 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    20 (αύξων αριθμός 40.0200), καταγωγής Σρι Λάνκα,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2273/92 DELLA COMMISSIONE del 3 agosto 1992 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti della categoria n. 20
    (numero d'' ordine 40.0200) originari dello Sri Lanka, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2273/92 VAN DE COMMISSIE van 3 augustus 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 20 (volgnummer 40.0200), van oorsprong uit Sri Lanka, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2273/92 DA COMISSÃO de 3 de Agosto de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria 20 (número
    de ordem 40.0200), originários do Sri Lanka, beneficiários das preferências
    pautais previstas no Regulamento (CEE) no 3832/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2273/92 DE LA COMISIÓN de 3 de agosto de 1992 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los productos de la categoría no 20 (número de orden 40.0200), originarios
    de Sri Lanka, beneficiarios de las preferencias arancelarias previstas por el
    Reglamento (CEE) no 3832/90 del Consejo #'
