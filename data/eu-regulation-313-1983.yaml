title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 313/83 of 7 February 1983 re-establishing
    the levying of customs duties on other goat and kid skin leather, falling within
    subheading 41.04 B II and originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 313/83 de la Commission du 7 février 1983 portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    de caprins, de la sous-position 41.04 B II du tarif douanier commun, originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 313/83 der Kommission vom 7. Februar 1983 zur Wiedereinführung
    der Erhebung der Zölle für anderes Ziegen- und Zickelleder der Tarifstelle 41.04
    B II, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3377/82 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 313/83 af 7. februar 1983 om genindførelse
    af opkrævning af told for andre tilfælde læder af gede- og gedekidsskind, henhørende
    under pos. 41.04 B II og med oprindelse i Indien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 313/83 της Επιτροπής
    της 7ης Φεβρουαρίου 1983 περί αποκαταστάσεως
    της εφαρμογής των δασμών για τα έτερα δέρματα
    αιγοειδών της διακρίσεως 41.04 Β ΙΙ του Κοινού
    Δασμολογίου, καταγωγής Ινδίας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3377/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 313/83 della Commissione del 7 febbraio 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle altre pelli caprine, della sottovoce
    41.04 B II della tariffa doganale comune, originarie dell' India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 313/83 van de Commissie van 7 februari 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander geiteleder,
    alsmede voorgelooide huiden en vellen van geiten, van postonderverdeling 41.04
    B II, van oorsprong uit India, waarvoor de in Verordening (EEG) nr. 3377/82 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
