  content: COMMISSION REGULATION (EEC) No 1080/93 of 30 April 1993 re-establishing
    the levying of customs duties on products falling within CN codes 8527, 8528 and
    8529, originating in Malaysia, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1080/93 de la Commission du 30 avril 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes NC 8527, 8528 et 8529 originaires de Malaysia, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
