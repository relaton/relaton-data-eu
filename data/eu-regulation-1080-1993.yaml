    in Malaysia, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1080/93 af 30. april 1993 om genindførelse
