title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 1975 authorizing the Italian Republic
    to apply protective measures in trade within the Community in wines falling within
    CCT subheading 22.05 C, coming from Greece
  type: main
- language: fr
  script: Latn
  content: '76/67/CEE: Décision de la Commission, du 22 décembre 1975, autorisant
    la République italienne à appliquer des mesures de protection concernant les
    échanges intra- communautaires de vins, de la sous-position 22.05C du Tarif douanier
    commun, provenant de Grèce'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Dezember 1975, mit der die Italienische
    Republik ermächtigt wird, Schutzmaßnahmen betreffend den innergemeinschaftlichen
    Handel von Weinen der Tarifstelle 22.05 C des Gemeinsamen Zolltarifs mit Herkunft
    aus Griechenland anzuwenden
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. december 1975 hvorved Den italienske Republik
    bemyndiges til at anvende beskyttelsesforanstaltninger vedrørende handelen inden
    for Fællesskabet med vine under pos. 22.05 C i den fælles toldtarif indført
    fra Grækenland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 1975, che autorizza la Repubblica
    italiana ad applicare delle misure di protezione negli scambi intracomunitari
    di vini, della sottovoce 22.05 C della tariffa doganale comune, provenienti dalla
    Grecia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 december 1975 tot machtiging van de
    Italiaanse Republiek om beschermende maatregelen te treffen bij het intra-communautaire
    handelsverkeer van wijn van post 22.05 C van het gemeenschappelijk douanetarief,
    van herkomst uit Griekenland
