title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2822/94 of 21 November 1994 re-establishing
    the levying of customs duties on certain industrial products originating in Pakistan
    and Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2822/94 de la Commission du 21 novembre 1994 portant
    rétablissement de la perception des droits de douane applicables à certains
    produits industriels originaires du Pakistan et du Brésil bénéficiaires des
    préférences tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2822/94 DER KOMMISSION vom 21. November 1994 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte gewerbliche Waren mit Ursprung in Pakistan
    und Brasilien, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2822/94 af 21. november 1994 om genindførelse
    af opkrævning af told for visse industrivarer med oprindelse i Pakistan og Brasilien,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2822/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 21ης Νοεμβρίου 1994 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών σε ορισμένα βιομηχανικά
    προϊόντα, καταγωγής Πακιστάν και Βραζιλίας,
    δικαιούχων των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2822/94 DELLA COMMISSIONE del 21 novembre 1994 che
    ripristina la riscossione dei dazi doganali a taluni prodotti industriali originari
    del Brasile e del Pakistan, beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2822/94 VAN DE COMMISSIE van 21 november 1994 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde industrieprodukten
    van oorsprong uit Pakistan en Brazilië, waarvoor de in Verordening (EEG) nr.
    3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2822/94 DA COMISSÃO de 21 de Novembro de 1994 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a certos produtos
    industriais originários do Paquistão e do Brasil, beneficiários das preferências
    pautais previstas no Regulamento (CEE) nº 3831/90 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 2822/94 DE LA COMISIÓN de 21 de noviembre de 1994
    relativo al restablecimiento de la percepción de los derechos de aduana aplicables
    a determinados productos industriales originarios de Pakistán y Brasil, beneficiarios
    de las preferencias arancelarias previstas por el Reglamento (CEE) nº 3831/90
    del Consejo
