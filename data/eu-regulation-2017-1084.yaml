  script: Latn
  content: Komisjoni määrus (EL) 2017/1084, 14. juuni 2017, millega muudetakse määrust
    (EL) nr 651/2014 sadama- ja lennujaamataristule antava abi, kultuuri edendamiseks
    ja kultuuripärandi säilitamiseks antavast abist teavitamise künnise, spordi-
    ja mitmeotstarbelise vaba aja veetmise taristule antava abi ja äärepoolseimaid
    piirkondi käsitlevate regionaalse tegevusabi kavade osas ning millega muudetakse
    määrust (EL) nr 702/2014 abikõlblike kulude arvutamise osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2017/1084, annettu 14 päivänä kesäkuuta 2017,
    asetuksen (EU) N:o 651/2014 muuttamisesta satama- ja lentoasemainfrastruktuurille
    myönnettävän tuen, kulttuurin ja kulttuuriperinnön edistämiseen ja urheiluinfrastruktuurille
    ja monikäyttöiselle vapaa-ajan infrastruktuurille myönnettävään tukeen sovellettavien
    ilmoituskynnysarvojen sekä syrjäisimmillä alueilla sovellettavien alueellisten
    toimintatukiohjelmien osalta ja asetuksen (EU) N:o 702/2014 muuttamisesta tukikelpoisten
    kustannusten laskennan osalta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) 2017/1084 оd 14. lipnja 2017. o izmjeni Uredbe (EU)
    br. 651/2014 u vezi s potporama za infrastrukture luka i zračnih luka, pragova
    za prijavu potpora za kulturu i očuvanje baštine i za potpore za sportsku i
    višenamjensku rekreativnu infrastrukturu te regionalnih operativnih programa
    potpora za najudaljenije regije i o izmjeni Uredbe (EU) br. 702/2014 u vezi s
    izračunavanjem prihvatljivih troškova
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1084 rendelete (2017. június 14.) a 651/2014/EU
    rendeletnek a kikötői és repülőtéri infrastruktúrákra irányuló támogatás,
    a kultúrát és a kulturális örökség megőrzését előmozdító támogatásra
    és a sportlétesítményekre és multifunkcionális szabadidős létesítményekre
    nyújtott támogatásra vonatkozó bejelentési határértékek, továbbá a legkülső
    régiókban biztosított regionális működési támogatási programok tekintetében,
    valamint a 702/2014/EU rendeletnek a támogatható költségek összegének meghatározása
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2017/1084 della Commissione, del 14 giugno 2017, che modifica
    il regolamento (UE) n. 651/2014 per quanto riguarda gli aiuti alle infrastrutture
    portuali e aeroportuali, le soglie di notifica applicabili agli aiuti alla cultura
    e alla conservazione del patrimonio e agli aiuti alle infrastrutture sportive
    e alle infrastrutture ricreative multifunzionali, nonché i regimi di aiuti a
    finalità regionale al funzionamento nelle regioni ultraperiferiche, e modifica
    il regolamento (UE) n. 702/2014 per quanto riguarda il calcolo dei costi ammissibili
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2017/1084 (2017. gada 14. jūnijs), ar ko Regulu
