title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2017/1084 of 14 June 2017 amending Regulation
    (EU) No 651/2014 as regards aid for port and airport infrastructure, notification
    thresholds for aid for culture and heritage conservation and for aid for sport
    and multifunctional recreational infrastructures, and regional operating aid schemes
    for outermost regions and amending Regulation (EU) No 702/2014 as regards the
    calculation of eligible costs
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2017/1084 de la Commission du 14 juin 2017 modifiant le
    règlement (UE) n° 651/2014 en ce qui concerne les aides aux infrastructures
    portuaires et aéroportuaires, les seuils de notification applicables aux aides
    en faveur de la culture et de la conservation du patrimoine et aux aides en faveur
    des infrastructures sportives et des infrastructures récréatives multifonctionnelles,
    ainsi que les régimes d'aides au fonctionnement à finalité régionale en faveur
    des régions ultrapériphériques, et modifiant le règlement (UE) n° 702/2014
    en ce qui concerne le calcul des coûts admissibles
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2017/1084 der Kommission vom 14. Juni 2017 zur Änderung
    der Verordnung (EU) Nr. 651/2014 in Bezug auf Beihilfen für Hafen- und Flughafeninfrastrukturen,
    in Bezug auf Anmeldeschwellen für Beihilfen für Kultur und die Erhaltung des
    kulturellen Erbes und für Beihilfen für Sportinfrastrukturen und multifunktionale
    Freizeitinfrastrukturen sowie in Bezug auf regionale Betriebsbeihilferegelungen
    für Gebiete in äußerster Randlage und zur Änderung der Verordnung (EU) Nr.
    702/2014 in Bezug auf die Berechnung der beihilfefähigen Kosten
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2017/1084 на Комисията от 14 юни
    2017 година за изменение на Регламент (ЕС) № 651/2014
    по отношение на помощите за пристанищните
    и летищните инфраструктури, праговете за уведомяване
    за помощи за култура и опазване на културното
    наследство и помощи за спортни и мултифункционални
    инфраструктури за отдих, както и относно схемите
    за регионална оперативна помощ за най-отдалечените
    региони и за изменение на Регламент (ЕС) № 702/2014
    по отношение на изчисляването на допустимите
    разходи
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2017/1084 ze dne 14. června 2017, kterým se mění
    nařízení (EU) č. 651/2014, pokud jde o podporu na přístavní a letištní
    infrastrukturu, prahové hodnoty oznamovací povinnosti pro podporu na kulturu
    a zachování kulturního dědictví a pro podporu na sportovní a multifunkční
    rekreační infrastrukturu a režimy regionální provozní podpory pro nejvzdálenější
    regiony, a mění se nařízení (EU) č. 702/2014, pokud jde o výpočet způsobilých
    nákladů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2017/1084 af 14. juni 2017 om ændring af
    forordning (EU) nr. 651/2014 for så vidt angår støtte til havne- og lufthavnsinfrastruktur,
    anmeldelsestærskler for støtte til kultur og bevarelse af kulturarv samt støtte
    til sportsinfrastruktur og multifunktionel infrastruktur til rekreative aktiviteter
    samt regionale driftsstøtteordninger for regionerne i den yderste periferi og
    om ændring af forordning (EU) nr. 702/2014 for så vidt angår beregning af støtteberettigede
    omkostninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2017/1084 της Επιτροπής, της
