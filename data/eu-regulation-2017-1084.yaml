    i infrastrukturę portów lotniczych, progów powodujących obowiązek zgłoszenia
    pomocy na kulturę i zachowanie dziedzictwa kulturowego, pomocy na infrastrukturę
    sportową i wielofunkcyjną infrastrukturę rekreacyjną, a także programów
    regionalnej pomocy operacyjnej skierowanych do regionów najbardziej oddalonych
    oraz zmieniające rozporządzenie (UE) nr 702/2014 w odniesieniu do obliczania
    kosztów kwalifikowalnych
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2017/1084 da Comissão, de 14 de junho e 2017, que altera
    o Regulamento (UE) n.° 651/2014 no que se refere aos auxílios às infraestruturas
    portuárias e aeroportuárias, aos limiares de notificação para os auxílios
    a favor da cultura e da conservação do património e para os auxílios a infraestruturas
    desportivas e recreativas multifuncionais, bem como aos regimes de auxílio regional
    ao funcionamento nas regiões ultraperiféricas e que altera o Regulamento (UE)
    n.° 702/2014 no que se refere ao cálculo dos custos elegíveis
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2017/1084 al Comisiei din 14 iunie 2017 de modificare
    a Regulamentului (UE) nr. 651/2014 în ceea ce privește ajutoarele pentru infrastructurile
    portuare și aeroportuare, pragurile de notificare pentru ajutoarele pentru cultură
    și pentru conservarea patrimoniului, ajutoarele pentru infrastructurile sportive
    și pentru infrastructurile de agrement multifuncționale, precum și schemele
    de ajutoare regionale de exploatare pentru regiunile ultraperiferice și de modificare
    a Regulamentului (UE) nr. 702/2014 în ceea ce privește calcularea costurilor
    eligibile
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2017/1084 zo 14. júna 2017, ktorým sa mení
