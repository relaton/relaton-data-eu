    infraštruktúru, stropy vymedzujúce notifikačnú povinnosť pri pomoci na kultúru
    a zachovanie kultúrneho dedičstva a pri pomoci na športovú a multifunkčnú
    rekreačnú infraštruktúru, ako aj schémy regionálnej prevádzkovej pomoci
    pre najvzdialenejšie regióny, a ktorým sa mení nariadenie (EÚ) č. 702/2014
    z hľadiska výpočtu oprávnených nákladov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2017/1084 z dne 14. junija 2017 o spremembi Uredbe
    (EU) št. 651/2014, kar zadeva pomoč za pristaniško in letališko infrastrukturo,
    pragove za priglasitev za pomoč za kulturo in ohranjanje kulturne dediščine
    in pomoč za športno in večnamensko rekreacijsko infrastrukturo ter sheme regionalne
    pomoči za tekoče poslovanje za najbolj oddaljene regije, in o spremembi Uredbe
    (EU) št. 702/2014, kar zadeva izračun upravičenih stroškov
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2017/1084 de la Comisión, de 14 de junio de 2017, por
    el que se modifica el Reglamento (UE) n.° 651/2014 en lo relativo a las ayudas
    a infraestructuras portuarias y aeroportuarias, los umbrales de notificación
    para las ayudas a la cultura y la conservación del patrimonio y para las ayudas
    a infraestructuras deportivas y recreativas multifuncionales, así como los regímenes
    de ayudas de funcionamiento de finalidad regional, y por el que se modifica el
    Reglamento (UE) n.° 702/2014 en lo relativo al cálculo de los costes subvencionables
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2017/1084 av den 14 juni 2017 om ändring
    av förordning (EU) nr 651/2014 vad gäller stöd till hamn- och flygplatsinfrastruktur,
    vad gäller tröskelvärden för anmälan av stöd till kultur och bevarande av
    kulturarvet och stöd till idrottsinfrastruktur och multifunktionell rekreationsinfrastruktur
    samt vad gäller stödordningar för regionalt driftstöd i de yttersta randområdena
    och om ändring av förordning (EU) nr 702/2014 vad gäller beräkningen av stödberättigande
    kostnader
