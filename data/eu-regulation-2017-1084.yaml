    paziņošanas robežvērtībām atbalstam kultūrai un kultūrvēsturiskā mantojuma
    saglabāšanai un atbalstam sporta un multifunkcionālai atpūtas infrastruktūrai
    un reģionālā darbības atbalsta shēmām tālākajos reģionos un ar ko Regulu
    (ES) Nr. 702/2014 groza attiecībā uz attiecināmo izmaksu aprēķinu
  type: main
- language: lt
  script: Latn
  content: 2017 m. birželio 14 d. Komisijos reglamentas (ES) 2017/1084, kuriuo dėl
    pagalbos uostų ir oro uostų infrastruktūrai, dėl pranešimo apie pagalbą
    kultūrai ir paveldo išsaugojimui ir pagalbą sporto ir daugiafunkcėms laisvalaikio
    infrastruktūroms ribų ir dėl atokiausiems regionams skirtų regioninės veiklos
    pagalbos schemų iš dalies keičiamas Reglamentas (ES) Nr. 651/2014 ir dėl tinkamų
    finansuoti išlaidų apskaičiavimo iš dalies keičiamas Reglamentas (ES) Nr.
    702/2014
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2017/1084 tal-14 ta' Ġunju 2017 li jemenda
    r-Regolament (UE) Nru 651/2014 f'dak li għandu x'jaqsam ma' għajnuna għal infrastruttura
    tal-port u tal-ajruport, livelli limitu ta' notifika għal għajnuna għall-kultura
    u l-konservazzjoni tal-patrimonju u għajnuna għall-infrastrutturi għall-isport
    u għar-rikreazzjoni multifunzjonali, u l-iskemi ta' għajnuna operatorja reġjonali
    għar-reġjuni ultraperiferiċi u li jemenda r-Regolament (UE) Nru 702/2014 f'dak
    li jirrigwarda l-kalkolu tal-ispejjeż eliġibbli
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2017/1084 van de Commissie van 14 juni 2017 tot wijziging
    van Verordening (EU) nr. 651/2014 wat betreft steun voor haven- en luchthaveninfrastructuur,
    aanmeldingsdrempels voor steun voor cultuur en instandhouding van het erfgoed
    en voor steun voor sportinfrastructuur en multifunctionele recreatieve infrastructuur,
    en regelingen inzake regionale exploitatiesteun voor ultraperifere gebieden, en
    tot wijziging van Verordening (EU) nr. 702/2014 wat betreft de berekening van
    de in aanmerking komende kosten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2017/1084 z dnia 14 czerwca 2017 r. zmieniające
