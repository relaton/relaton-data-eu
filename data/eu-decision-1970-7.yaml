title:
- language: fr
  script: Latn
  content: Décision du Conseil du 20 décembre 1969, portant dérogation à la décision,
    du 9 octobre 1961, relative à l'uniformisation de la durée des accords commerciaux
    avec les pays tiers, en ce qui concerne les accords conclus entre l'Italie et
    Formose d'autre part, sur le commerce des textiles de coton
  type: main
- language: de
  script: Latn
  content: '70/7/EWG: Entscheidung des Rates vom 20. Dezember 1969 über eine Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen mit dritten Ländern hinsichtlich der zwischen Italien und der
    Vereinigten Arabischen Republik sowie zwischen Italien und Formosa geschlossenen
    Abkommen über den Handel mit Baumwollspinnstoffen'
  type: main
- language: it
  script: Latn
  content: '70/7/CEE: Decisione del Consiglio, del 20 dicembre 1969, recante deroga
    alla decisione del 9 ottobre 1961, relativa all''uniformazione della durata degli
    accordi commerciali con i paesi terzi per quanto riguarda taluni accordi fra l''Italia
    e la Repubblica araba unita, da un lato, e fra l''Italia e Formosa, dall''altro,
    sul commercio dei tessili di cotone'
  type: main
- language: nl
  script: Latn
  content: '70/7/EEG: Beschikking van de Raad van 20 december 1969 houdende afwijking
    van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden met derde landen, voor wat betreft akkoorden inzake de handel
    in katoentextiel tussen Italië en de Verenigde Arabische Republiek enerzijds
    en Italië en Formosa anderzijds'
  type: main
