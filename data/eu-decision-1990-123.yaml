title:
- language: en
  script: Latn
  content: '90/123/EEC: Commission Decision of 7 March 1990 approving the draft measures
    presented by Italy for implementation of Article 3b of Regulation (EEC) No 857/84
    adopting general rules for the application of the levy referred to in Article
    5c of Regulation (EEC) No 804/68 in the milk and milk products sector (Only the
    Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/123/CEE: Décision de la Commission du 7 mars 1990 portant approbation
    du projet de mise en oeuvre en Italie de l''article 3 ter du règlement (CEE)
    n° 857/84 portant règles générales pour l''application du prélèvement visé
    à l''article 5 quater du règlement (CEE) n 804/68 dans le secteur du lait et
    des produits laitiers (Le texte en langue italienne est le seul faisant foi)'
  type: main
