title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2023/95 of 21 August 1995 adapting by way
    of a temporary measure the special arrangements for importing cereal substitute
    products and processed cereal and rice products as provided for in Regulation
    (EEC) No 2245/90 with a view to the implementation of the Agreement on Agriculture
    concluded during the Uruguay Round of multilateral trade negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2023/95 de la Commission, du 21 août 1995, relatif
    à l' adaptation transitoire des régimes spéciaux à l' importation des produits
    de substitution de céréales et produits transformés à base de céréales et
    de riz prévu au règlement (CEE) nº 2245/90 en vue de la mise en oeuvre de l'
    accord sur l' agriculture conclu dans le cadre des négociations commerciales
    multilatérales du cycle d' Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2023/95 der Kommission vom 21. August 1995 zur übergangsweisen
    Anpassung der in der Verordnung (EWG) Nr. 2245/90 vorgesehenen Sonderregelungen
    für die Einfuhr von Getreidesubstitutionserzeugnissen und Verarbeitungserzeugnissen
    aus Getreide und Reis zur Anwendung des im Rahmen der multilateralen Handelsverhandlungen
    der Uruguay-Runde getroffenen Übereinkommens über die Landwirtschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2023/95 af 21. august 1995 om midlertidig
    tilpasning af særordningerne for indførsel af kornsubstitutter og produkter
    forarbejdet på basis af korn og ris som fastsat i forordning (EØF) nr. 2245/90
    med henblik på iværksættelsen af den landbrugsaftale, der er indgået i forbindelse
    med de multilaterale handelsforhandlinger under Uruguay-runden
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2023/95 της Επιτροπής
    της 21ης Αυγούστου 1995 για τη μεταβατική προσαρμογή
    των ειδικών καθεστώτων κατά την εισαγωγή προϊόντων
    υποκατάστασης σιτηρών και μεταποιημένων προϊόντων
    με βάση σιτηρά και ρύζι όπως προβλέπεται στον
    κανονισμό (ΕΟΚ) αριθ. 2245/90 με την προοπτική της
    εφαρμογής της συμφωνίας για τη γεωργία η οποία
    συνάφθηκε στο πλαίσιο των πολυμερών εμπορικών
    διαπραγματεύσεων του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2023/95, annettu 21 päivänä elokuuta 1995,
    asetuksessa (ETY) N:o 2245/90 säädettyjen viljankorvikkeiden sekä viljasta
    ja riisistä valmistettujen tuotteiden erityisten tuontijärjestelmien väliaikaisesta
    mukauttamisesta Uruguayn kierroksen monenvälisten kauppaneuvottelujen osana tehdyn
    maataloutta koskevan sopimuksen täytäntöönpanemiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2023/95 della Commissione, del 21 agosto 1995, relativo
    all' adattamento transitorio dei regimi speciali all' importazione dei prodotti
    di sostituzione dei cereali e dei prodotti trasformati a base di cereali e di
    riso previsti dal regolamento (CEE) n. 2245/90 ai fini dell' attuazione dell'
    accordo sull' agricoltura concluso nel quadro dei negoziati commerciali multilaterali
    dell' Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2023/95 van de Commissie van 21 augustus 1995 betreffende
