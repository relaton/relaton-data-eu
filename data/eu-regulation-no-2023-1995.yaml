    comerciales multilaterales de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2023/95 av den 21 augusti 1995 om en
    tillfällig anpassning av de särskilda bestämmelserna för import av ersättningsprodukter
    för spannmål och produkter framställda av spannmål och ris i förordning (EEG)
