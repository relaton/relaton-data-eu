    op basis van granen en rijst met het oog op de tenuitvoerlegging van de in het
    kader van de multilaterale handelsbesprekingen van de Uruguay- Ronde gesloten
    landbouwovereenkomst
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2023/95 da Comissão, de 21 de Agosto de 1995, relativo
    à adaptação transitória dos regimes especiais à importação dos produtos
    de substituição de cereais e produtos transformados à base de cereais e arroz
    previsto no Regulamento (CEE) nº 2245/90 com vista à aplicação do acordo sobre
