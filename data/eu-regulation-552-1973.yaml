  content: Regulation (EEC) No 552/73 of the Commission of 21 February 1973 amending
    Regulation (EEC) No 473/73 authorizing the United Kingdom to grant aid as a transitional
    measure for sugar to be consumed in its territory
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 552/73 de la Commission, du 21 février 1973, modifiant
