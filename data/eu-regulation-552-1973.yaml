    für Zucker, der zum Verbrauch auf seinem Hoheitsgebiet bestimmt ist, vorübergehend
    eine Beihilfe zu gewähren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 552/73 af 21. februar 1973 om ændring
