title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 998/79 of 21 May 1979 re-establishing the
    levying of customs duties on image projectors (other than cinematographic projectors)
    ; photographic (except cinematographic) enlargers and reducers, falling within
    heading No 90.09 and originating in Singapore, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 998/79 de la Commission, du 21 mai 1979, portant rétablissement
    de la perception des droits de douane applicables aux appareils de projection
    fixe, etc., de la position tarifaire 90.09, originaires de Singapour, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 998/79 der Kommission vom 21. Mai 1979 zur Wiedereinführung
    des Zollsatzes für Stehbildwerfer usw., der Tarifnummer 90.09, mit Ursprung in
    Singapur, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 998/79 af 21. maj 1979 om genindførelse
    af opkrævning af toldafgifter for lysbilledapparater, etc.. henhørende under
    pos. 90.09 i den fælles toldtarif, som har oprindelse Singapore og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordninq (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 998/79 della Commissione, del 21 maggio 1979, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi da proiezione
    fissa, ecc., della voce 90.09 della tariffa doganale comune, originari di Singapore
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 998/79 van de Commissie van 21 mei 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op projectietoestellen
    voor niet bewegende beelden, enz., van post 90.09, van oorsprong uit Singapore,
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
