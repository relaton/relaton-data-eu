    některé druhy směrnice Rady 66/401/EHS, 66/402/EHS, 68/193/EHS, 1999/105/ES,
    2002/54/ES, 2002/55/ES a 2002/57/ES týkající se uvádění osiva pícnin, osiva
    obilovin, révového vegetativního množitelského materiálu, reprodukčního
