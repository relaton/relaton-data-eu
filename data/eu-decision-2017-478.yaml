title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/478 of 16 March 2017 releasing
    certain Member States from the obligation to apply to certain species Council
    Directives 66/401/EEC, 66/402/EEC, 68/193/EEC, 1999/105/EC, 2002/54/EC, 2002/55/EC
    and 2002/57/EC on the marketing of fodder plant seed, cereal seed, material for
    the vegetative propagation of the vine, forest reproductive material, beet seed,
    vegetable seed and seed of oil and fibre plants respectively, and repealing Commission
    Decision 2010/680/EU (notified under document C(2017) 1662)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/478 de la Commission du 16 mars 2017 dispensant
    certains États membres de l'obligation d'appliquer à certaines espèces les
    directives 66/401/CEE, 66/402/CEE, 68/193/CEE, 1999/105/CE, 2002/54/CE, 2002/55/CE
    et 2002/57/CE du Conseil concernant la commercialisation, respectivement, des
    semences de plantes fourragères, des semences de céréales, des matériels de
    multiplication végétative de la vigne, des matériels forestiers de reproduction,
    des semences de betteraves, des semences de légumes et des semences de plantes
    oléagineuses et à fibres, et abrogeant la décision 2010/680/UE de la Commission
    [notifiée sous le numéro C(2017) 1662]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/478 der Kommission vom 16. März 2017
    zur Entbindung bestimmter Mitgliedstaaten von der Verpflichtung, die Richtlinien
    66/401/EWG, 66/402/EWG, 68/193/EWG, 1999/105/EG, 2002/54/EG, 2002/55/EG und 2002/57/EG
    des Rates über den Verkehr mit Futterpflanzensaatgut, Getreidesaatgut, vegetativem
    Vermehrungsgut von Reben, forstlichem Vermehrungsgut, Betarübensaatgut, Gemüsesaatgut
    bzw. Saatgut von Öl- und Faserpflanzen auf bestimmte Arten anzuwenden und zur
    Aufhebung der Entscheidung 2010/680/EU der Kommission (Bekannt gegeben unter Aktenzeichen
    C(2017) 1662)
  type: main
