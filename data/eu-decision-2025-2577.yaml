    Reino Unido, no que diz respeito à Irlanda do Norte, nos termos do Regulamento
    (UE) n.o 952/2013 do Parlamento Europeu e do Conselho para a utilização de outros
    meios que não técnicas de processamento eletrónico de dados para o intercâmbio
    e o armazenamento de informações destinadas à versão 3 do Sistema de Controlo
    das Importações 2 [notificada com o número C(2025) 8768]
  type: main
