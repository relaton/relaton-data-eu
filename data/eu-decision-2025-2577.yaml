    miembros y el Reino Unido en lo que respecta a Irlanda del Norte de conformidad
    con el Reglamento (UE) n.o 952/2013 del Parlamento Europeo y del Consejo para
    utilizar medios distintos de las técnicas de tratamiento electrónico de datos
    para el intercambio y almacenamiento de información con respecto a la entrega
