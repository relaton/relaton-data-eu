    Unit în ceea ce privește Irlanda de Nord în temeiul Regulamentului (UE) nr.
    952/2013 al Parlamentului European și al Consiliului de a utiliza alte mijloace
    decât tehnicile de prelucrare electronică a datelor pentru schimbul și stocarea
    informațiilor pentru versiunea 3 a sistemului de control al importurilor 2 [notificată
    cu numărul C(2025) 8768]
