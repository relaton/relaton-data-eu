    do Irlandii Północnej na podstawie rozporządzenia Parlamentu Europejskiego
    i Rady (UE) nr 952/2013 dotyczące stosowania sposobów innych niż techniki elektronicznego
    przetwarzania danych do wymiany i przechowywania informacji w ramach wersji 3
