title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/2577 of 18 December 2025 granting
    a derogation requested by certain Member States and the United Kingdom in respect
    of Northern Ireland pursuant to Regulation (EU) No 952/2013 of the European Parliament
    and of the Council to use means other than electronic data-processing techniques
    for the exchange and storage of information for Release 3 of the Import Control
    System 2 (notified under document C(2025) 8768)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/2577 de la Commission du 18 décembre
    2025 accordant une dérogation demandée par certains États membres et par le
    Royaume-Uni en ce qui concerne l’Irlande du Nord en application du règlement
    (UE) no 952/2013 du Parlement européen et du Conseil relative à l’utilisation
    de moyens autres que des procédés informatiques de traitement des données pour
    l’échange et le stockage d’informations aux fins de la version 3 du système
    de contrôle des importations 2 [notifiée sous le numéro C(2025) 8768]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/2577 der Kommission vom 18. Dezember
