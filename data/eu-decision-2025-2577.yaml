    952/2013 des Europäischen Parlaments und des Rates beantragten abweichenden Regelung
    für die Nutzung anderer Mittel als solcher der elektronischen Datenverarbeitung
    zum Austausch und zur Speicherung von Informationen für Release 3 des Einfuhrkontrollsystems
    2 (Bekannt gegeben unter Aktenzeichen C(2025) 8768)
  type: main
