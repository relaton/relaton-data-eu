id: EUDecision1980347
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/347/EEC: Commission Decision of 3 March 1980 authorizing Ireland not
    to apply Community treatment to blouses and shirt-blouses, knitted, crocheted
    or woven, falling within subheadings ex 60.05 A II and ex 61.02 B II of the Common
    Customs Tariff (category 7), originating in South Korea and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/347/CEE: Décision de la Commission, du 3 mars 1980, autorisant l''Irlande
    à exclure du traitement communautaire les chemisiers, blouses-chemisiers et blouses,
    de bonneterie ou tissés, des sous-positions ex 60.05 A II et ex 61.02 B II du
    tarif douanier commun (catégorie 7), originaires de Corée du Sud et mis en libre
    pratique dans les autres Etats membres (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/347/EWG: Entscheidung der Kommission vom 3. März 1980, mit der Irland
    ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken oder Geweben
    der Tarifstellen ex 60.05 A II und ex 61.02 B II des Gemeinsamen Zolltarifs, Kategorie
    7, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/347/EØF: Kommissionens beslutning af 3. marts 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage skjorter, skjortebluser og
    bluser af trikotage eller vævede, som henhører under pos. ex 60.05 A II og ex
    61.02 B II i den fælles toldtarif (kategori 7), har oprindelse i Sydkorea og
    frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/347/CEE: Decisione della Commissione, del 3 marzo 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, camicette e bluse
    a maglia, o tessute, delle sottovoci ex 60.05 A II ed ex 61.02 B II della tariffa
    doganale comune, categoria 7, originarie della Corea del Sud e messe in libera
    pratica negli altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/347/EEG: Beschikking van de Commissie van 3 maart 1980 waarbij Ierland
    wordt gemachtigd blouses en hemdblouses, van brei- of haakwerk of geweven, van
    de posten ex 60.05 A II en ex 61.02 B II van het gemeenschappelijk douanetarief
    (categorie 7), van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Engelse taal is authentiek)'
  type: main
