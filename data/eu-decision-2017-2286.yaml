    elismeréséről (az értesítés a C(2017) 8082. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/2286 della Commissione, del 6 dicembre
    2017, sul riconoscimento dei requisiti del sistema di gestione ambientale Eco-Lighthouse
    come conformi ai requisiti corrispondenti del sistema di ecogestione e audit (EMAS),
    ai sensi dell'articolo 45 del regolamento (CE) n. 1221/2009 del Parlamento europeo
    e del Consiglio, sull'adesione volontaria delle organizzazioni a un sistema comunitario
    di ecogestione e audit [notificata con il numero C(2017) 8082]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/2286 (2017. gada 6. decembris),
