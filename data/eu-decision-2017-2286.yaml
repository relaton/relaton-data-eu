title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/2286 of 6 December 2017 on the
    recognition of the requirements of the Eco-Lighthouse environmental management
    system as complying with the corresponding requirements of the eco-management
    and audit scheme (EMAS) in accordance with Article 45 of Regulation (EC) No 1221/2009
    of the European Parliament and of the Council on the voluntary participation by
    organisations in a Community eco-management and audit scheme (notified under document
    C(2017) 8082)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/2286 de la Commission du 6 décembre 2017
    concernant la reconnaissance des exigences du système de management environnemental
    Eco-Lighthouse comme satisfaisant aux exigences correspondantes du système de
    management environnemental et d'audit (EMAS), conformément à l'article 45 du
    règlement (CE) n° 1221/2009 du Parlement européen et du Conseil concernant
    la participation volontaire des organisations à un système communautaire de
    management environnemental et d'audit [notifiée sous le numéro C(2017) 8082]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/2286 der Kommission vom 6. Dezember 2017
    über die Anerkennung der Übereinstimmung der Anforderungen des Umweltmanagementsystems
    Eco-Lighthouse mit den entsprechenden Anforderungen des Gemeinschaftssystems für
    Umweltmanagement und Umweltbetriebsprüfung (EMAS) gemäß Artikel 45 der Verordnung
    (EG) Nr. 1221/2009 des Europäischen Parlaments und des Rates über die freiwillige
    Teilnahme von Organisationen an einem Gemeinschaftssystem für Umweltmanagement
    und Umweltbetriebsprüfung (Bekannt gegeben unter Aktenzeichen C(2017) 8082)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/2286 на Комисията
