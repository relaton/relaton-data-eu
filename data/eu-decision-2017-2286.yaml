    atitinkančiais atitinkamus aplinkosaugos vadybos ir audito sistemos (EMAS) reikalavimus
    pagal Europos Parlamento ir Tarybos reglamento (EB) Nr. 1221/2009 dėl organizacijų
    savanoriško Bendrijos aplinkosaugos vadybos ir audito sistemos (EMAS) taikymo
    45 straipsnį (pranešta dokumentu Nr. C(2017) 8082)
  type: main
