    по околна среда Eco-Lighthouse като съответстващи
    на съответните изисквания на Схемата за управление
    по околна среда и одит (EMAS) в съответствие с
    член 45 от Регламент (ЕО) № 1221/2009 на Европейския
    парламент и на Съвета относно доброволното
    участие на организации в Схемата на Общността
    за управление по околна среда и одит (нотифицирано
    под номер С(2017) 8082)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/2286 ze dne 6. prosince 2017
    o uznávání souladu požadavků systému environmentálního řízení Eco-lighthouse
    s odpovídajícími požadavky systému pro environmentální řízení podniků
    a audit (EMAS) podle článku 45 nařízení Evropského parlamentu a Rady (ES)
    č. 1221/2009 o dobrovolné účasti organizací v systému Společenství pro
    environmentální řízení podniků a audit (oznámeno pod číslem C(2017) 8082)
  type: main
- language: da
  script: Latn
