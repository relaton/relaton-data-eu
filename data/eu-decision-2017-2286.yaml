    ympäristöasioiden hallinta- ja auditointijärjestelmän (EMAS-järjestelmän)
    vastaavien vaatimusten mukaisiksi organisaatioiden vapaaehtoisesta osallistumisesta
    yhteisön ympäristöasioiden hallinta- ja auditointijärjestelmään annetun
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1221/2009 45 artiklan mukaisesti
    (tiedoksiannettu numerolla C(2017) 8082)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/2286 оd 6. prosinca 2017. o priznavanju
    usklađenosti zahtjeva sustava upravljanja okolišem Eco-Lighthouse s odgovarajućim
    zahtjevima sustava upravljanja okolišem i neovisnog ocjenjivanja (EMAS) u skladu
    s člankom 45. Uredbe (EZ) br. 1221/2009 Europskog parlamenta i Vijeća o dobrovoljnom
