    rendszerben való önkéntes részvételéről szóló 1221/2009/EK európai parlamenti
    és tanácsi rendelet 45. cikkének megfelelően az Eco-Lighthouse környezetvédelmi
    vezetési rendszer követelményeinek a környezetvédelmi vezetési és hitelesítési
