  content: Regulation (EU) No 1297/2013 of the European Parliament and of the Council
    of 11 December 2013 amending Council Regulation (EC) No 1083/2006 as regards certain
    provisions relating to financial management for certain Member States experiencing
    or threatened with serious difficulties with respect to their financial stability,
    to the decommitment rules for certain Member States, and to the rules on payments
    of the final balance
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 1297/2013 du Parlement européen et du Conseil du
    11 décembre 2013 modifiant le règlement (CE) n ° 1083/2006 du Conseil en ce
    qui concerne certaines dispositions ayant trait à la gestion financière pour
    certains États membres qui connaissent ou risquent de connaître de graves difficultés
    quant à leur stabilité financière, aux règles de dégagement pour certains
    États membres et aux règles de paiement du solde final
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 1297/2013 des Europäischen Parlaments und des Rates
