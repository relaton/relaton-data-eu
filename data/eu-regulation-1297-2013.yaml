    11 dicembre 2013 , recante modifica del regolamento (CE) n. 1083/2006 del Consiglio
    per quanto attiene a talune disposizioni relative alla gestione finanziaria per
    alcuni Stati membri che si trovano o rischiano di trovarsi in gravi difficoltà
    relativamente alla loro stabilità finanziaria, alle norme di disimpegno per alcuni
    Stati membri, e alle norme relative ai pagamenti del saldo finale
  type: main
