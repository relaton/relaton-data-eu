    no que diz respeito a determinadas disposições de gestão financeira aplicáveis
    a certos Estados-Membros afetados ou ameaçados por graves dificuldades de estabilidade
    financeira, às regras de anulação das autorizações aplicáveis a certos Estados-Membros
    e às regras relativas a pagamentos do saldo final
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 1297/2013 al Parlamentului European și al Consiliului
    din 11 decembrie 2013 de modificare a Regulamentului (CE) nr. 1083/2006 al Consiliului
    în ceea ce privește anumite dispoziții referitoare la gestiunea financiară
    pentru anumite state membre care sunt afectate sau amenințate de dificultăți
    grave cu privire la stabilitatea lor financiară, la normele privind dezangajarea
    pentru anumite state membre și la normele privind plata soldului final
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) č. 1297/2013 z 11. decembra
    2013 , ktorým sa mení nariadenie Rady (ES) č. 1083/2006, pokiaľ ide o určité
    ustanovenia týkajúce sa finančného riadenia v prípade určitých členských
    štátov, ktoré majú závažné ťažkosti so svojou finančnou stabilitou alebo
