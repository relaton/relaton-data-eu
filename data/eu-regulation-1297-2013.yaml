    in Bezug auf Vorkehrungen für die finanzielle Abwicklung bei bestimmten, hinsichtlich
    ihrer Finanzstabilität von Schwierigkeiten betroffenen bzw. von gravierenden
    Schwierigkeiten bedrohten Mitgliedstaaten, in Bezug auf Vorschriften für die
    Aufhebung der Mittelbindung bei bestimmten Mitgliedstaaten und auf die Bestimmungen
    über die Restzahlung
  type: main
