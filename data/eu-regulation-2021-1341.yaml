    e altera o anexo II desse regulamento
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/1341 al Comisiei din 23 aprilie 2021 de
    completare a Regulamentului (UE) 2019/2144 al Parlamentului European și al Consiliului
    prin stabilirea unor norme detaliate privind procedurile specifice de încercare
    și cerințele tehnice pentru omologarea de tip a autovehiculelor în ceea ce
    privește sistemele de avertizare cu privire la somnolența și lipsa de atenție
    a conducătorului lor și de modificare a anexei II la regulamentul menționat
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/1341 z 23. apríla 2021, ktorým
