    podrobných pravidiel týkajúcich sa osobitných skúšobných postupov a technických
    požiadaviek na typové schvaľovanie motorových vozidiel vzhľadom na systémy
    varovania vodiča pred ospalosťou a stratou pozornosti a ktorým sa mení príloha
    II k uvedenému nariadeniu
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1341 z dne 23. aprila 2021 o dopolnitvi
    Uredbe (EU) 2019/2144 Evropskega parlamenta in Sveta z določitvijo podrobnih
    pravil v zvezi s posebnimi preskusnimi postopki in tehničnimi zahtevami za homologacijo
