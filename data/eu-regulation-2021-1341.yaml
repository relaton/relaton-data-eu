  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1341 of 23 April 2021 supplementing
    Regulation (EU) 2019/2144 of the European Parliament and of the Council by laying
    down detailed rules concerning the specific test procedures and technical requirements
    for the type-approval of motor vehicles with regard to their driver drowsiness
    and attention warning systems and amending Annex II to that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1341 de la Commission du 23 avril 2021
    complétant le règlement (UE) 2019/2144 du Parlement européen et du Conseil
    en établissant des règles détaillées relatives aux procédures d’essai et
    aux prescriptions techniques spécifiques pour la réception par type des véhicules
    à moteur en ce qui concerne leurs systèmes d’avertissement de somnolence et
    de perte d’attention du conducteur et modifiant l’annexe II dudit règlement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1341 der Kommission vom 23. April 2021
    zur Ergänzung der Verordnung (EU) 2019/2144 des Europäischen Parlaments und
    des Rates durch Festlegung detaillierter Vorschriften für die spezifischen Prüfverfahren
    und technischen Anforderungen für die Typgenehmigung von Kraftfahrzeugen hinsichtlich
    ihrer Warnsysteme bei Müdigkeit und nachlassender Aufmerksamkeit des Fahrers
    sowie zur Änderung von Anhang II der genannten Verordnung
  type: main
- language: bg
  script: Cyrl
