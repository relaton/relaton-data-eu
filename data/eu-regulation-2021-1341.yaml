    pozornost voznika ter o spremembi Priloge II k navedeni uredbi
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/1341 de la Comisión de 23 de abril de 2021
    por el que se completa el Reglamento (UE) 2019/2144 del Parlamento Europeo y del
    Consejo mediante el establecimiento de normas detalladas sobre los procedimientos
    de ensayo y los requisitos técnicos específicos para la homologación de tipo
    de los vehículos de motor por lo que respecta a sus sistemas de advertencia de
    somnolencia y pérdida de atención del conductor, y por el que se modifica el
    anexo II de dicho Reglamento
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/1341 av den 23 april 2021
