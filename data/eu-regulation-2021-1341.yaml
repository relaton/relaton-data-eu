  script: Latn
  content: Regolamento delegato (UE) 2021/1341 della Commissione del 23 aprile 2021
    che integra il regolamento (UE) 2019/2144 del Parlamento europeo e del Consiglio
    stabilendo norme dettagliate concernenti le procedure di prova e i requisiti tecnici
    specifici per l’omologazione dei veicoli a motore per quanto riguarda i sistemi
    di avviso di disattenzione e stanchezza del conducente e che modifica l’allegato
    II di tale regolamento
  type: main
- language: lv
  script: Latn
