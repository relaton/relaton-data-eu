    чрез определяне на подробни правила относно
    специфичните процедури за изпитване и техническите
    изисквания за одобряване на типа на моторни
    превозни средства по отношение на системите
    им за предупреждение за сънливостта и вниманието
    на водача и за изменение на Приложение II към
    посочения регламент
  type: main
- language: cs
  script: Latn
