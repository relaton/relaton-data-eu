  content: '93/501/EEC: Commission Decision of 3 September 1993 amending the addendum
    to the Community support framework for Community structural assistance in the
    improvement of the conditions under which agricultural and forestry products are
    processed and marketed in Germany (excluding the five new Länder) (Only the German
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/501/CEE: Décision de la Commission du 3 septembre 1993 concernant
