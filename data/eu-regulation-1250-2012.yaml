    medidas restritivas específicas de combate ao terrorismo dirigidas contra determinadas
    pessoas e entidades
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1250/2012 al Comisiei din
