    opatřeních namířených proti některým osobám a subjektům s cílem bojovat
    proti terorismu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 1250/2012 af 20. december
    2012 om ændring af Rådets forordning (EF) nr. 2580/2001 om specifikke restriktive
    foranstaltninger mod visse personer og enheder med henblik på at bekæmpe terrorisme
  type: main
- language: el
  script: Grek
