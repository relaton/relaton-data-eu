title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1250/2012 of 20 December 2012
    amending Council Regulation (EC) No 2580/2001 on specific restrictive measures
    directed against certain persons and entities with a view to combating terrorism
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 1250/2012 de la Commission du 20 décembre
    2012 modifiant le règlement (CE) n ° 2580/2001 du Conseil concernant l'adoption
    de mesures restrictives spécifiques à l'encontre de certaines personnes et entités
    dans le cadre de la lutte contre le terrorisme
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1250/2012 der Kommission vom 20. Dezember
    2012 zur Änderung der Verordnung (EG) Nr. 2580/2001 des Rates über spezifische,
    gegen bestimmte Personen und Organisationen gerichtete restriktive Maßnahmen
    zur Bekämpfung des Terrorismus
  type: main
- language: bg
  script: Cyrl
