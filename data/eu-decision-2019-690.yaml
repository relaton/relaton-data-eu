title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/690 of 30 April 2019 on a measure
    taken by Sweden pursuant to Directive 2006/42/EC of the European Parliament and
    of the Council prohibiting the placing on the market of wind turbine models SWT-2.3-101
    and SWT-3.0-113 and withdrawing the machines already placed on the market (notified
    under document C(2019) 3118)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/690 de la Commission du 30 avril 2019
    relative à une mesure prise par la Suède, en application de la directive 2006/42/CE
    du Parlement européen et du Conseil, interdisant la mise sur le marché des modèles
    d'éoliennes SWT-2.3-101 et SWT-3.0-113 et portant retrait des machines déjà
    mises sur le marché [notifiée sous le numéro C(2019) 3118]
  type: main
- language: de
  script: Latn
