    Rady 2006/42/ES, kterým se zakazuje uvádění na trh větrných turbín modelů
    SWT–2.3–101 a SWT–3.0–113 a stahují strojní zařízení již uvedená
    na trh (oznámeno pod číslem C(2019) 3118)
  type: main
