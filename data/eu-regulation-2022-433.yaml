title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/433 of 15 March 2022 imposing
    definitive countervailing duties on imports of stainless steel cold-rolled flat
    products originating in India and Indonesia and amending Implementing Regulation
    (EU) 2021/2012 imposing a definitive anti-dumping duty and definitively collecting
    the provisional duty imposed on imports of stainless steel cold-rolled flat products
    originating in India and Indonesia
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/433 de la Commission du 15 mars 2022
    instituant des droits compensateurs définitifs sur les importations de produits
    plats laminés à froid en aciers inoxydables originaires de l’Inde et d’Indonésie
    et modifiant le règlement d’exécution (UE) 2021/2012 instituant un droit antidumping
    définitif et portant perception définitive du droit provisoire institué sur
    les importations de produits plats laminés à froid en aciers inoxydables originaires
    de l’Inde et d’Indonésie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/433 der Kommission vom 15. März 2022
    zur Einführung endgültiger Ausgleichszölle auf die Einfuhren kaltgewalzter
    Flacherzeugnisse aus nicht rostendem Stahl mit Ursprung in Indien und Indonesien
    und zur Änderung der Durchführungsverordnung (EU) 2021/2012 zur Einführung
    eines endgültigen Antidumpingzolls und zur endgültigen Vereinnahmung des vorläufigen
    Zolls auf die Einfuhren von kaltgewalzten Flacherzeugnissen aus nicht rostendem
    Stahl mit Ursprung in Indien und Indonesien
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/433 на Комисията
    от 15 март 2022 година за налагане на окончателни
    изравнителни мита върху вноса на студеновалцовани
    плоски продукти от неръждаема стомана с произход
    от Индия и Индонезия и за изменение на Регламент
    за изпълнение (ЕС) 2021/2012 за налагане на окончателно
    антидъмпингово мито и окончателно събиране
    на временното мито, наложено върху вноса на
    студеновалцовани плоски продукти от неръждаема
    стомана с произход от Индия и Индонезия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/433 ze dne 15. března 2022,
    kterým se ukládá konečné vyrovnávací clo na dovoz plochých za studena
    válcovaných výrobků z korozivzdorné oceli pocházejících z Indie a Indonésie
    a kterým se mění prováděcí nařízení (EU) 2021/2012, kterým se ukládá
    konečné antidumpingové clo a s konečnou platností se vybírá prozatímní
    clo uložené na dovoz plochých za studena válcovaných výrobků z korozivzdorné
    oceli pocházejících z Indie a Indonésie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/433 af 15. marts 2022
    om indførelse af en endelig udligningstold på importen af koldvalsede flade
    produkter af rustfrit stål med oprindelse i Indien og Indonesien og om ændring
    af Kommissionens gennemførelsesforordning (EU) 2021/2012 om indførelse af en
    endelig antidumpingtold og endelig opkrævning af den midlertidige told på importen
    af koldvalsede flade produkter af rustfrit stål med oprindelse i Indien og Indonesien
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/433 της Επιτροπής
    της 15ης Μαρτίου 2022 για την επιβολή οριστικών
    αντισταθμιστικών δασμών στις εισαγωγές πλατέων
    προϊόντων ψυχρής έλασης από ανοξείδωτο χάλυβα
    καταγωγής Ινδίας και Ινδονησίας και για την
    τροποποίηση του εκτελεστικού κανονισμού (ΕΕ)
    2021/2012 για την επιβολή οριστικού δασμού αντιντάμπινγκ
    και την οριστική είσπραξη του προσωρινού δασμού
