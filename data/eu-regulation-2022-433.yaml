    ψυχρής έλασης από ανοξείδωτο χάλυβα καταγωγής
    Ινδίας και Ινδονησίας
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/433, 15. märts 2022, millega kehtestatakse
    lõplik tasakaalustav tollimaks Indiast ja Indoneesiast pärit roostevabast terasest
    lehtvaltstoodete impordi suhtes ning muudetakse rakendusmäärust (EL) 2021/2012,
    millega kehtestatakse Indiast ja Indoneesiast pärit roostevabast terasest lehtvaltstoodete
    impordi suhtes lõplik dumpinguvastane tollimaks ja nõutakse lõplikult sisse
    kõnealuse impordi suhtes kehtestatud ajutine tollimaks
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/433, annettu 15 päivänä
    maaliskuuta 2022, lopullisten tasoitustullien käyttöönotosta Intiasta ja Indonesiasta
    peräisin olevien ruostumattomasta teräksestä valmistettujen kylmävalssattujen
    levyvalmisteiden tuonnissa ja lopullisen polkumyyntitullin käyttöönotosta Intiasta
    ja Indonesiasta peräisin olevien ruostumattomasta teräksestä valmistettujen
    kylmävalssattujen levyvalmisteiden tuonnissa ja kyseisessä tuonnissa käyttöön
    otetun väliaikaisen tullin lopullisesta kantamisesta annetun täytäntöönpanoasetuksen
    (EU) 2021/2012 muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/433 ón gCoimisiún an 15 Márta
    2022 lena bhforchuirtear dleachtanna frithchúitimh cinntitheacha ar allmhairí
    táirgí cruach dosmálta cothroma fuar-rollta de thionscnamh na hIndia agus na
    hIndinéise agus lena leasaítear Rialachán Cur Chun Feidhme (AE) 2021/2012 lena
    bhforchuirtear dleacht frithdhumpála chinntitheach agus lena mbailítear go cinntitheach
    an dleacht shealadach arna forchur ar allmhairí táirgí cruach dosmálta cothroma
    fuar-rollta de thionscnamh na hIndia agus na hIndinéise
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/433 оd 15. ožujka 2022. o uvođenju
    konačnih kompenzacijskih pristojbi na uvoz hladnovaljanih plosnatih proizvoda
    od nehrđajućeg čelika podrijetlom iz Indije i Indonezije i o izmjeni Provedbene
    uredbe (EU) 2021/2012 o uvođenju konačne antidampinške pristojbe i konačnoj
    naplati privremene pristojbe uvedene na uvoz hladnovaljanih plosnatih proizvoda
    od nehrđajućeg čelika podrijetlom iz Indije i Indonezije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/433 végrehajtási rendelete (2022. március 15.)
    az Indiából és az Indonéziából származó, rozsdamentes acélból készült
    hidegen síkhengerelt termékek behozatalára vonatkozó végleges kiegyenlítő
    vám kivetéséről, valamint az Indiából és az Indonéziából származó,
    rozsdamentes acélból készült hidegen síkhengerelt termékek behozatalára
    vonatkozó végleges dömpingellenes vám kivetéséről és a kivetett ideiglenes
    vám végleges beszedéséről szóló (EU) 2021/2012 végrehajtási rendelet
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/433 della Commissione del 15 marzo
    2022 che istituisce dazi compensativi definitivi sulle importazioni di prodotti
    piatti di acciaio inossidabile laminati a freddo originari dell'India e dell'Indonesia
    e che modifica il regolamento di esecuzione (UE) 2021/2012 che istituisce un dazio
    antidumping definitivo e riscuote definitivamente il dazio provvisorio istituito
    sulle importazioni di prodotti piatti di acciaio inossidabile laminati a freddo
    originari dell'India e dell'Indonesia
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/433 (2022. gada 15. marts), ar
    kuru nosaka galīgos kompensācijas maksājumus Indijas un Indonēzijas izcelsmes
    plakanu nerūsējošā tērauda auksto velmējumu importam un groza Īstenošanas
    regulu (ES) 2021/2012, ar kuru nosaka galīgo antidempinga maksājumu un galīgi
    iekasē pagaidu maksājumu, kas noteikts Indijas un Indonēzijas izcelsmes plakanu
    nerūsējošā tērauda auksto velmējumu importam
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/433 2022 m. kovo 15 d. kuriuo
    importuojamiems Indijos ir Indonezijos kilmės plokštiems šaltai valcuotiems
    nerūdijančiojo plieno produktams nustatomi galutiniai kompensaciniai muitai
    ir iš dalies keičiamas Įgyvendinimo reglamentas (ES) 2021/2012, kuriuo importuojamiems
    Indijos ir Indonezijos kilmės plokštiems šaltai valcuotiems nerūdijančiojo
    plieno produktams nustatomas galutinis antidempingo muitas ir galutinai surenkamas
    laikinasis muitas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/433 tal-15
    ta’ Marzu 2022 li jimponi dazji kumpensatorji definittivi fuq l-importazzjonijiet
    ta’ prodotti tal-azzar inossidabbli llaminati ċatti fil-kiesaħ li joriġinaw
    mill-Indja u mill-Indoneżja u li jemenda r-Regolament ta’ Implimentazzjoni
    (UE) 2021/2012 li jimponi dazju anti-dumping definittiv u li jiġbor b’mod definittiv
    id-dazju anti-dumping provviżorju impost fuq l-importazzjonijiet ta’ prodotti
    tal-azzar inossidabbli llaminati ċatti fil-kiesaħ li joriġinaw mill-Indja u
    mill-Indoneżja
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/433 van de Commissie van 15 maart 2022
    tot instelling van definitieve compenserende rechten op koudgewalste platte producten
    van roestvrij staal van oorsprong uit India en Indonesië en tot wijziging van
    Uitvoeringsverordening (EU) 2021/2012 tot instelling van een definitief antidumpingrecht
    en tot definitieve inning van het voorlopige recht op koudgewalste platte producten
    van roestvrij staal van oorsprong uit India en Indonesië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/433 z dnia 15 marca 2022 r.
    nakładające ostateczne cło wyrównawcze na przywóz płaskich wyrobów ze stali
    nierdzewnej walcowanych na zimno pochodzących z Indii i Indonezji i zmieniające
    rozporządzenie wykonawcze (UE) 2021/2012 nakładające ostateczne cło antydumpingowe
    i stanowiące o ostatecznym pobraniu cła tymczasowego nałożonego na przywóz
    płaskich wyrobów ze stali nierdzewnej walcowanych na zimno pochodzących z Indii
    i Indonezji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/433 da Comissão de 15 de março de
    2022 que institui direitos de compensação definitivos sobre as importações
    de produtos planos de aço inoxidável laminados a frio originários da Índia
    e da Indonésia e que altera o Regulamento de Execução (UE) 2021/2012 que institui
    um direito anti-dumping definitivo e estabelece a cobrança definitiva do direito
    provisório instituído sobre as importações de produtos planos de aço inoxidável
    laminados a frio originários da Índia e da Indonésia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/433 al Comisiei din 15 martie
    2022 de instituire a unor taxe compensatorii definitive la importurile de produse
    plate din oțeluri inoxidabile laminate la rece originare din India și din Indonezia
    și de modificare a Regulamentului de punere în aplicare (UE) 2021/2012 de instituire
    a unei taxe antidumping definitive și de percepere definitivă a taxei provizorii
    instituite asupra importurilor de produse plate din oțeluri inoxidabile laminate
    la rece originare din India și Indonezia
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/433 z 15. marca 2022, ktorým
    sa ukladajú konečné vyrovnávacie clá na dovoz plochých výrobkov z nehrdzavejúcej
    ocele valcovaných za studena s pôvodom v Indii a Indonézii a mení vykonávacie
    nariadenie (EÚ) 2021/2012, ktorým sa ukladá konečné antidumpingové clo a
    s konečnou platnosťou vyberá predbežné clo uložené na dovoz plochých výrobkov
    z nehrdzavejúcej ocele valcovaných za studena s pôvodom v Indii a Indonézii
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/433 z dne 15. marca 2022 o uvedbi dokončnih
    izravnalnih dajatev na uvoz hladno valjanih ploščatih izdelkov iz nerjavnega
    jekla s poreklom iz Indije in Indonezije ter spremembi Izvedbene uredbe (EU) 2021/2012
    o uvedbi dokončne protidampinške dajatve in dokončnem pobiranju začasne dajatve
    na uvoz hladno valjanih ploščatih izdelkov iz nerjavnega jekla s poreklom iz
    Indije in Indonezije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/433 de la Comisión de 15 de marzo de
    2022 por el que se establecen derechos compensatorios definitivos sobre las importaciones
    de productos planos de acero inoxidable laminados en frío originarios de la India
    e Indonesia y se modifica el Reglamento de Ejecución (UE) 2021/2012, por el que
    se establece un derecho antidumping definitivo y se percibe definitivamente el
    derecho provisional establecido sobre las importaciones de productos planos de
    acero inoxidable laminados en frío originarios de la India e Indonesia
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/433 av den 15 mars 2022
    om införande av slutgiltiga utjämningstullar på import av kallvalsade platta
    produkter av rostfritt stål med ursprung i Indien och Indonesien och om ändring
    av genomförandeförordning (EU) 2021/2012 om införande av en slutgiltig antidumpningstull
    och slutgiltigt uttag av den provisoriska tull som införts på import av kallvalsade
    platta produkter av rostfritt stål med ursprung i Indien och Indonesien
  type: main
