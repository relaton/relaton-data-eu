    der KN-Codes 18061030 und 18061090 mit Ursprung in den überseeischen Ländern
    und Gebieten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2423/1999 af 15. november 1999 om beskyttelsesforanstaltninger
