- language: en
  script: Latn
  content: Commission Regulation (EC) No 2423/1999 of 15 November 1999 introducing
    safeguard measures in respect of sugar falling within CN code 1701 and mixtures
    of sugar and cocoa falling within CN codes 18061030 and 18061090 originating in
    the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2423/1999 de la Commission, du 15 novembre 1999, instaurant
    des mesures de sauvegarde concernant le sucre du code NC 1701 et les mélanges
    de sucre et de cacao relevant des codes NC 18061030 et 18061090 originaires des
    pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
