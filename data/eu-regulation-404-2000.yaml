title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 404/2000 of 23 February 2000 amending Regulation
    (EC) No 2455/1999 establishing the standard import values for determining the
    entry price of certain fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 404/2000 de la Commission, du 23 février 2000, rectifiant
    le règlement (CE) n° 2455/1999 établissant des valeurs forfaitaires à l'importation
    pour la détermination du prix d'entrée de certains fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 404/2000 der Kommission vom 23. Februar 2000 zur Berichtigung
    der Verordnung (EG) Nr. 2455/1999 zur Festlegung pauschaler Einfuhrwerte für
    die Bestimmung der im Sektor Obst und Gemüse geltenden Einfuhrpreise
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 404/2000 af 23. februar 2000 til berigtigelse
    af forordning (EF) nr. 2455/1999 om faste importværdier med henblik på fastsættelsen
    af indgangsprisen for visse frugter og grøntsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 404/2000 της Επιτροπής,
    της 23ης Φεβρουαρίου 2000, σχετικά με τη διόρθωση
    του κανονισμού (ΕΚ) αριθ. 2455/1999 όσον αφορά τον
    καθορισμό των κατ' αποκοπή τιμών κατά την εισαγωγή
    για τον καθορισμό της τιμής εισόδου ορισμένων
    οπωροκηπευτικών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 404/2000, annettu 23 päivänä helmikuuta 2000,
    tuonnin kiinteistä arvoista tiettyjen hedelmien ja vihannesten tulohinnan määrittämiseksi
    annetun asetuksen (EY) N:o 2455/1999 oikaisemisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 404/2000 della Commissione, del 23 febbraio 2000, che
    rettifica il regolamento (CE) n. 2455/1999 recante fissazione dei valori forfettari
    all'importazione ai fini della determinazione del prezzo di entrata di alcuni
    ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 404/2000 van de Commissie van 23 februari 2000 houdende
    rectificatie van Verordening (EG) nr. 2455/1999 tot vaststelling van forfaitaire
    invoerwaarden voor de bepaling van de invoerprijzen van bepaalde soorten groenten
    en fruit
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 404/2000 da Comissão, de 23 de Fevereiro de 2000,
    que rectifica o Regulamento (CE) n.° 2455/1999 que estabelece valores forfetários
    de importação para a determinação do preço de entrada de certos frutos e
    produtos hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 404/2000 de la Comisión, de 23 de febrero de 2000,
    por el que se rectifica el Reglamento (CE) n° 2455/1999 por los que se establecen
    valores globales de importación para la determinación del precio de entrada
    de determinadas frutas y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 404/2000 av den 23 februari 2000 om ändring
    av förordning (EG) nr 2455/1999 om fastställande av schablonvärden vid import
    för bestämning av ingångspriset för vissa frukter och grönsaker
  type: main
