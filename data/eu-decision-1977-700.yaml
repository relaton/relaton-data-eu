id: EUDecision1977700
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 April 1977 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to knitted or crocheted jerseys, pullovers, slip-overs, twinsets
    cardigans, bed-jackets and jumpers, other than of silk, of noil or of other waste
    silk or of flax or ramie, falling within heading No ex 60.05 of the Common Customs
    Tariff, originating in the Socialist Republic of Romania and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/700/CEE: Décision de la Commission, du 21 avril 1977, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chandails, "pull-overs", "slip-overs",
    "twinsets", gilets, vestes et blouses de bonneterie, autres qu''en soie, schappe
    ou bourrette ou en lin ou ramie, de la position Ex 60.05 du Tarif douanier commun,
    originaires de la République socialiste de Roumanie et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. April 1977, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Sozialistischen Republik Rumänien stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Pullover, Slipover, Twinsets, Westen,
    Blusen und dergleichen aus Gewirken, andere als aus Seide, Schappeseide, Bourretteseide
    oder aus Flachs oder Hanf, der Tarifnummer ex 60.05 des Gemeinsamen Zolltarifs,
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. april 1977 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage sweatere, pullovere, slipovere, cardigans, cardigansæt, jumpere, trøjer,
    veste og bluser af trikotage, bortset fra sådanne varer af natursilke, herunder
    schappesilke eller bourettesilke, samt hør og ramie, som henhører under pos.
    ex 60.05 i den fælles toldtarif, har oprindelse i den socialistike republik Rumænien
    og frit kan omsættes i de andre medlemstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 aprile 1977, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario maglie, pullovers, slip-overs, twinsets, giubbotti,
    giacche e bluse a maglia, non di seta, cascami di seta, lino o ramiè, della voce
    ex 60.05 della tariffa doganale comune, originari della Repubblica socialista
    di Romania e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 april 1977 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden, worden gemachtigd
    truien, pullovers, slipovers, jumpers, twinsets, vesten, jasjes en blouses van
    brei- of haakwerk, andere dan van zijde, vlokzijde of bourrette, of van vlas of
    ramee, van post ex 60.05 van het gemeenschappelijk douanetarief, van oorsprong
    uit de Socialistische Republiek Roemenië en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
