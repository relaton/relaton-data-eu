id: EUDecision19791024
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/1024/EEC: Commission Decision of 22 November 1979 authorizing the Kingdom
    of Belgium and the Grand Duchy of Luxembourg not to apply Community treatment
    to tomatoes, falling within subheading 07.01 M I of the Common Customs Tariff,
    originating in Spain (including the Canary Islands) and in free circulation in
    the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/1024/CEE: Décision de la Commission, du 22 novembre 1979, autorisant
    le Royaume de Belgique et le Grand- Duché de Luxembourg à exclure du traitement
    communautaire les tomates de la sous-position 07.01 M I du tarif douanier commun,
    originaires de l''Espagne (y compris des îles Canaries) et mises en libre pratique
    dans les autres États membres (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/1024/EWG: Entscheidung der Kommission vom 22. November 1979, mit der
    das Königreich Belgien und das Großherzogtum Luxemburg ermächtigt werden, aus
    Spanien (einschließlich Kanarische Inseln) stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Tomaten der Tarifstelle 07.01 M I des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/1024/EØF: Kommissionens beslutning af 22. november 1979 om bemyndigelse
    af kongeriget Belgien og storhertugdømmet Luxembourg til fra fællesskabsbehandling
    at undtage tomater, som henhører under pos. 07.01 M I i den fælles toldtarif,
    har oprindelse i Spanien (herunder De kanariske Øer) og frit kan omsættes i
    de øvrige medlemsstater (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/1024/CEE: Decisione della Commissione, del 22 novembre 1979, che autorizza
    il Regno del Belgio e il Granducato del Lussemburgo ad escludere dal trattamento
    comunitario i pomodori della sottovoce 07.01 M I della tariffa doganale comune,
    originari della Spagna (ivi comprese le isole Canarie) e messi in libera pratica
    negli altri Stati membri (I testi in lingua francese e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/1024/EEG: Beschikking van de Commissie van 22 november 1979 waarbij
    het Koninkrijk België en het Groothertogdom Luxemburg worden gemachtigd tomaten
    van post 07.01 M I van het gemeenschappelijk douanetarief, van oorsprong uit Spanje
    (de Canarische eilanden inbegrepen) en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
