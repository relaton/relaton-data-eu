title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1619/2000 of 24 July 2000 determining the
    extent to which the applications for import licences submitted in July 2000 for
    certain dairy products under certain tariff quotas opened by Regulation (EC) No
    1374/98 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1619/2000 de la Commission du 24 juillet 2000 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 2000 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 1374/98 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1619/2000 der Kommission vom 24. Juli 2000 zur Festlegung
    des Umfangs, in dem den im Juli 2000 gestellten Anträgen auf Erteilung von Lizenzen
    für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung (EG)
    Nr. 1374/98 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1619/2000 af 24. juli 2000 om, i hvilket
    omfang de ansøgninger om importlicenser, som er indgivet i juli 2000 vedrørende
    visse mejeriprodukter inden for de toldkontingenter, der blev åbnet ved forordning
    (EF) nr. 1374/98, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1619/2000 της Επιτροπής,
    της 24ης Ιουλίου 2000, που καθορίζει το κατά πόσον
    μπορούν να γίνουν δεκτές οι αιτήσεις πιστοποιητικών
    εισαγωγής που υπεβλήθησαν τον Ιούλιο 2000 για
    ορισμένα γαλακτοκομικά προϊόντα στο πλαίσιο
    ορισμένων δασμολογικών ποσοστώσεων που θεσπίσθηκαν
    με τον κανονισμό (ΕΚ) αριθ. 1374/98
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1619/2000, annettu 24 päivänä heinäkuuta
    2000, asetuksessa (EY) N:o 1374/98 avattuihin tariffikiintiöihin kuuluville maitotuotteille
    heinäkuussa 2000 käyttöön otettujen tuontitodistusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1619/2000 della Commissione, del 24 luglio 2000, che
    stabilisce in quale misura possano essere accettate le domande di titoli di importazione
    presentate nel mese di luglio 2000 per determinati prodotti lattiero-caseari nell'ambito
    di taluni contingenti tariffari aperti dal regolamento (CE) n. 1374/98
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1619/2000 van de Commissie van 24 juli 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen voor invoercertificaten
    die in juli 2000 voor bepaalde melkproducten zijn ingediend in het kader van bepaalde
    tariefcontingenten, geopend bij Verordening (EG) nr. 1374/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1619/2000 da Comissão, de 24 de Julho de 2000, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Julho de 2000 para certos produtos lácteos no âmbito de determinados
    contingentes pautais abertos pelo Regulamento (CE) n.° 1374/98
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1619/2000 de la Comisión, de 24 de julio de 2000,
    por el que se determina en qué medida pueden aceptarse las solicitudes de certificados
    de importación presentadas en julio de 2000 para determinados productos lácteos
    en virtud de los contingentes arancelarios abiertos mediante el Reglamento (CE)
    n° 1374/98
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1619/2000 av den 24 juli 2000 om fastställande
    av i vilken utsträckning de ansökningar kan godtas som lämnades in i juli 2000
    om importlicens för vissa mjölkprodukter inom ramen för vissa tullkvoter enligt
    förordning (EG) nr 1374/98
