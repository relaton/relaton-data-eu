  script: Latn
  content: Commission Regulation (EEC) No 787/87 of 19 March 1987 fixing the difference
    in white sugar prices to be used in calculating the levy for processed fruit and
    vegetable products and for wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 787/87 de la Commission, du 19 mars 1987, fixant la
    différence de prix du sucre blanc applicable pour le calcul du prélèvement
    dans le secteur des produits transformés à base de fruits et légumes et dans
    le secteur viti-vinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 787/87 der Kommission vom 19. März 1987 zur Festsetzung
    des bei der Berechnung der Abschöpfung für Verarbeitungserzeugnisse aus Obst
    und Gemüse und auf dem Weinsektor zu berücksichtigenden Unterschieds zwischen
    Weißzuckerpreisen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 787/87 af 19. marts 1987 om fastsættelse
    af den prisforskel for hvidt sukker, som anvendes ved afgiftsberegningen for produkter
    forarbejdet på basis af frugt og grønsager og for vin
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 787/87 της Επιτροπής
    της 19ης Μαρτίου 1987 περί καθορισμού της διαφοράς
    των τιμών της λευκής ζάχαρης η οποία λαμβάνεται
    υπόψη για τον υπολογισμό της εισφοράς στον
    τομέα των μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά και στον αμπελοοινικό τομέα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 787/87 della Commissione, del 19 marzo 1987, che fissa
    la differenza di prezzo dello zucchero bianco applicabile per il calcolo del prelievo
    nel settore dei prodotti trasformati a base di ortofrutticoli e nel settore vitivinicolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 787/87 van de Commissie van 19 maart 1987 tot vaststelling
    van het prijsverschil voor witte suiker dat wordt toegepast bij de berekening
    van de heffing in de sector van op basis van groenten en fruit verwerkte produkten
    en in de wijnsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 787/87 da Comissão, de 19 de Março de 1987, que
    fixa a diferença de preço do açúcar branco aplicável para o cálculo do direito
    nivelador no sector dos produtos transformados à base de frutos e produtos hortícolas
    e no sector vitivinícola
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 787/87 de la Comisión, de 19 de marzo de 1987, por
