title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1469/98 of 9 July 1998 determining to what
    extent applications for import rights for calves not exceeding 80 kilograms lodged
    pursuant to Regulation (EC) No 1144/98 can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1469/98 de la Commission du 9 juillet 1998 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au titre du règlement (CE) n° 1144/98 relatif à l'importation de
    veaux n'excédant pas 80 kilogrammes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1469/98 der Kommission vom 9. Juli 1998 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Einfuhrrechte von höchstens 80 kg wiegenden
    Rindern gemäß der Verordnung (EG) Nr. 1144/98 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1469/98 af 9. juli 1998 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importrettigheder for
    kalve på ikke over 80 kg i henhold til forordning (EF) nr. 1144/98 kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1469/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 9ης Ιουλίου 1998 για τον καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως δικαιωμάτων εισαγωγής που υποβάλλονται,
    βάσει του κανονισμού (ΕΚ) αριθ. 1144/98, για την
    εισαγωγή μόσχων που δεν υπερβαίνουν τα 80 χιλιόγραμμα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1469/98, annettu 9 päivänä heinäkuuta 1998,
    asetuksen (EY) N:o 1144/98 mukaisesti jätettyjen enintään 80 kilogramman painoisia
    vasikoita koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1469/98 della Commissione del 9 luglio 1998 che stabilisce
    in che misura possono essere accolte le domande di diritti di importazione presentate
    nel quadro del regolamento (CE) n. 1144/98 per l'importazione di vitelli di peso
    non superiore a 80 chilogrammi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1469/98 van de Commissie van 9 juli 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om rechten tot invoer
    die zijn ingediend op grond van Verordening (EG) nr. 1144/98 betreffende de invoer
    van kalveren van maximaal 80 kg
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1469/98 da Comissão de 9 de Julho de 1998 que determina
    em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) nº 1144/98 relativo à importação
    de vitelos de peso não superior a 80 quilogramas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1469/98 de la Comisión de 9 de julio de 1998 por el
