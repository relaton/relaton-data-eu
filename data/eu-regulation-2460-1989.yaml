    4259/88 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2460/89 DELLA COMMISSIONE del 10 agosto 1989 che
    ripristina la riscossione dei dazi doganali applicabili ai guanti a maglia della
    categoria di prodotti n. 10 (numero d'' ordine 40.0100), ai manufatti per l''
    arredamento esclusi quelli a maglia della categoria di prodotti n. 40 (numero
    d'' ordine 40.0400) e agli indumenti esterni diversi da quelli a maglia, della
    categoria di prodotti n. 161 (numero d'' ordine 42.1610), originari della Cina
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 4259/88
    del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2460/89 VAN DE COMMISSIE van 10 augustus 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op handschoenen,
    wanten en dergelijke artikelen van brei- of haakwerk van de categorie van produkten
    nr. 10 (volgnummer 40.0100), artikelen voor stoffering, andere dan brei- of haakwerk,
    van de categorie van produkten nr. 40 (volgnummer 40.0400) en kleding, andere
    dan van brei- of haakwerk, van de categorie van produkten nr. 161 (volgnummer
    42.1610), van oorsprong uit China, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 4259/88 van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2460/89 DA COMISSÃO de 10 de Agosto de 1989 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis às luvas e semelhantes
    de malha, da categoria de produtos 10 (nº de ordem 40.0100), aos artefactos para
    guarnição de interiores com excepção dos de malha, da categoria de produtos
