title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2460/89 of 10 August 1989 re-establishing
    the levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    products of category 10 (order No 40.0100), furnishing articles, other than knitted
    or crocheted, products of category 40 (order No 40.0400), and clothing, other
    than knitted or crocheted, products of category 161 (order No 42.1610), originating
    in China, to which the preferential tariff arrangements set out in Regulation
    (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2460/89 de la Commission du 10 août 1989 portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    de bonneterie de la catégorie de produits n° 10 (numéro d'ordre 40.0100), aux
    articles d'ameublement autres qu'en bonneterie de la catégorie de produits n°
    40 (numéro d'ordre 40.0400) et aux vêtements autres qu'en bonneterie de la catégorie
    de produits n° 161 (numéro d'ordre 42.1610), originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2460/89 DER KOMMISSION vom 10. August 1989 zur Wiedereinführung
    des Zollsatzes für Handschuhe aus Gewirken der Warenkategorie Nr. 10 (lfd. Nr.
    40.0100); Waren zur Innenausstattung, andere als aus Gewirken, der Warenkategorie
    Nr. 40 (lfd. Nr. 40.0400) sowie Kleidung, andere als aus Gewirken, der Warenkategorie
    Nr. 161 (lfd. Nr. 42.1610) mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2460/89 af 10. august 1989 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer, af trikotage, under
    varekategori nr. 10 (løbenummer 40.0100), gardiner o.lign., ikke af trikotage,
    under varekategori nr. 40 (løbenummer 40.0400), samt beklædningsgenstande, under
    varekategori nr. 161 (løbenummer 42.1610), som har oprindelse i Kina og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2460/89 της Επιτροπής
