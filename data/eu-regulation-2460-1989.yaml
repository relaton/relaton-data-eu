    a los guantes y similares de punto de la categoría de productos no 10 (número
    de orden 40.0100); artículos de moblaje, de tejido de la categoría de productos
    no 40 (número de orden 40.0400); prendas no de punto de la categoría de productos
    no 161 (número de orden 42.1610) originarias de China, beneficiaria de las preferencias
