title:
- language: fr
  script: Latn
  content: Décision 65/495/CEE de la Commission, du 27 octobre 1965, portant prorogation
    de huit décisions, prises en application de la décision du Conseil du 4 avril
    1962, autorisant certains États membres à percevoir des taxes compensatoires
    sur les importations de certaines marchandises résultant de la transformation
    de produits agricoles, en provenance d'autres États membres
  type: main
- language: de
  script: Latn
  content: '65/495/EWG: Entscheidung der Kommission vom 27. Oktober 1965 zur Verlängerung
    von acht Entscheidungen, die in Anwendung des Ratsbeschlusses vom 4. April 1962,
    durch den einzelne Mitgliedstaaten zur Erhebung von Ausgleichsabgaben bei der
    Einfuhr von bestimmten landwirtschaftlichen Verarbeitungserzeugnissen aus anderen
    Mitgliedstaaten ermächtigt werden, getroffen wurden'
  type: main
- language: it
  script: Latn
  content: '65/495/CEE: Decisione della Commissione, del 27 ottobre 1965, che proroga
    le 8 decisioni prese in applicazione della decisione del Consiglio del 4 aprile
    1962 che autorizzano alcuni Stati membri a riscuotere tasse di compensazione all''importazione
    di alcuni prodotti, risultanti dalla trasformazione di prodotti agricoli, da altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/495/EEG: Beschikking van de Commissie van 27 oktober 1965 houdende
    verlenging van acht beschikkingen ter toepassing van het besluit van de Raad van
    4 april 1962 waarbij aan enkele Lid-Staten machtiging werd verleend tot het innen
    van compenserende heffingen op de invoer van bepaalde uit de verwerking van landbouwgrondstoffen
    verkregen produkten uit andere Lid-Staten'
  type: main
