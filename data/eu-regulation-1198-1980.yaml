title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1198/80 of 12 May 1980 re-establishing the
    levying of customs duties on angles, shapes and sections, falling within subheadings
    73.11 A II, III, IV a) 2, b) and originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1198/80 de la Commission, du 12 mai 1980, portant
    rétablissement de la perception des droits de douane applicables aux profilés,
    des sous-positions 73.11 A II, III et IV a) 2 et b) du tarif douanier commun,
    originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1198/80 der Kommission vom 12. Mai 1980 zur Wiedereinführung
    des Zollsatzes für Profile der Tarifstellen 73.11 A II, III, IV a) 2 und b),
    mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1198/80 af 12. maj 1980 om genindførelse
    af opkrævning af toldafgifter for profiler, under underpos. 73.11 A II, III,
    IV a) 2 b), som har oprindelse i Rumænien, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1198/80 della Commissione, del 12 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai profilati delle sottovoci
    73.11 A II, III, IV a) 2 e b) della tariffa doganale comune, originari della Romania,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1198/80 van de Commissie van 12 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op profielijzer,
    van de posten 73.11 A II, III, IV a) 2 en IV b), van oorsprong uit Roemenië,
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
