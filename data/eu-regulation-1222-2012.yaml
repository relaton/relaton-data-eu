    (UE) n. ° 1178/2010 e (UE) n. ° 90/2011, no respeitante às datas de emissão
    dos certificados de exportação em 2013 nos setores do açúcar e isoglicose
    extraquota, da carne de suíno, da carne de bovino, dos ovos e da carne de aves
    de capoeira, e o Regulamento (UE) n. ° 1272/2009, no respeitante ao prazo de
    exame das propostas de compra de trigo mole a preço fixo no quadro da intervenção
    pública
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1222/2012 al Comisiei din
    14 decembrie 2012 de derogare de la regulamentele (CE) nr. 2305/2003, (CE) nr.
    969/2006, (CE) nr. 1067/2008, (CE) nr. 1964/2006, de la Regulamentul de punere
    în aplicare (UE) nr. 480/2012, de la regulamentele (CE) nr. 828/2009 și (CE)
    nr. 1918/2006 cu privire la datele de depunerea cererilor și de eliberare a licențelor
    de import în 2013 în cadrul contingentelor tarifare privind cerealele, orezul,
    zahărul și uleiul de măsline, de derogare de la regulamentele (CE) nr. 951/2006,
    (CE) nr. 1518/2003, (CE) nr. 382/2008, (UE) nr. 1178/2010 și (UE) nr. 90/2011
    cu privire la datele de eliberare a licențelor de export în 2013 în sectoarele
    zahărului și al izoglucozei în afara cotei, al cărnii de porc, al cărnii
    de vită și de mânzat, al ouălor și al cărnii de pui și de derogare de la
    Regulamentul (UE) nr. 1272/2009 privind perioada de examinare a ofertelor pentru
    achiziționarea grâului comun la preț fix în cadrul intervenției publice
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1222/2012 zo 14. decembra 2012
    , ktorým sa ustanovuje odchýlka od nariadení (ES) č. 2305/2003, (ES) č. 969/2006,
    (ES) č. 1067/2008, (ES) č. 1964/2006, vykonávacieho nariadenia (EÚ) č. 480/2012,
    nariadení (ES) č. 828/2009 a (ES) č. 1918/2006, pokiaľ ide o termíny podávania
    žiadostí a vydávania dovozných povolení na rok 2013 v rámci colných kvót
    na obilniny, ryžu, cukor a olivový olej, a ktorým sa ustanovuje odchýlka od
    nariadení (ES) č. 951/2006, (ES) č. 1518/2003, (ES) č. 382/2008, (EÚ) č.
    1178/2010 a (EÚ) č. 90/2011, pokiaľ ide o termíny vydávania vývozných povolení
    na rok 2013 v sektoroch cukru a izoglukózy mimo kvóty, bravčového mäsa, hovädzieho
    mäsa, vajec a hydinového mäsa, a ktorým sa ustanovuje odchýlka od nariadenia
    (EÚ) č. 1272/2009, pokiaľ ide o lehotu na preskúmanie ponúk na nákup pšenice
    obyčajnej za pevne stanovenú cenu v rámci verejnej intervencie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1222/2012 z dne 14. decembra 2012 o
    odstopanju od uredb (ES) št. 2305/2003, (ES) št. 969/2006, (ES) št. 1067/2008,
    (ES) št. 1964/2006, od Izvedbene uredbe (EU) št. 480/2012, od uredb (ES) št.
    828/2009 in (ES) št. 1918/2006, glede datumov za vložitev zahtevkov in izdajo
    uvoznih dovoljenj za leto 2013 v okviru tarifnih kvot za žita, riž, sladkor
    in oljčno olje, o odstopanju od uredb (ES) št. 951/2006, (ES) št. 1518/2003,
    (ES) št. 382/2008, (EU) št. 1178/2010 in (EU) št. 90/2011, glede datumov za
    izdajo izvoznih dovoljenj za leto 2013 v sektorjih izvenkvotnega sladkorja in
    izvenkvotne izoglukoze, prašičjega mesa, govejega in telečjega mesa, jajc in
    perutninskega mesa, ter o odstopanju od Uredbe (EU) št. 1272/2009 glede roka
    za proučitev ponudb za odkup navadne pšenice po fiksni ceni v okviru javne intervencije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 1222/2012 de la Comisión, de 14 de
    diciembre de 2012 , por el que se establecen excepciones a los Reglamentos (CE)
    n ° 2305/2003, (CE) n ° 969/2006, (CE) n ° 1067/2008, (CE) n ° 1964/2006,
    al Reglamento de Ejecución (UE) n ° 480/2012, y a los Reglamentos (CE) n °
    828/2009 y (CE) n ° 1918/2006, en lo que respecta a las fechas de presentación
    de solicitudes y expedición de certificados de importación en 2013 en el marco
    de los contingentes arancelarios de cereales, arroz, azúcar y aceite de oliva,
    y por el que se establecen excepciones a los Reglamentos (CE) n ° 951/2006, (CE)
    n ° 1518/2003, (CE) n ° 382/2008, (UE) n ° 1178/2010 y (UE) n ° 90/2011 en
    lo relativo a la expedición de certificados de exportación en 2013 en los sectores
    del azúcar y la isoglucosa al margen de cuota, de la carne de porcino, de la
    carne de vacuno, de los huevos y de la carne de aves de corral, y por el que se
    establecen excepciones al Reglamento (UE) n ° 1272/2009 en lo relativo al plazo
    de estudio de las ofertas para la compra a precio fijo de trigo blando en el marco
    del régimen de intervención pública
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1222/2012 av den 14 december
    2012 om undantag från förordningarna (EG) nr 2305/2003, (EG) nr 969/2006, (EG)
    nr 1067/2008, (EG) nr 1964/2006, genomförandeförordning (EU) nr 480/2012 och
    förordningarna (EG) nr 828/2009 och (EG) nr 1918/2006 vad gäller tidpunkterna
    för inlämning av ansökningar om importlicenser och för utfärdande av importlicens
    under 2013 inom ramen för tullkvoterna för spannmål, ris, socker och olivolja,
    om undantag från förordningarna (EG) nr 951/2006, (EG) nr 1518/2003, (EG) nr
    382/2008, (EU) nr 1178/2010 och (EU) nr 90/2011 vad gäller tidpunkterna för
    utfärdande av exportlicenser under 2013 inom sektorerna för utomkvotssocker
    och utomkvotsisoglukos, griskött, nötkött, ägg och fjäderfäkött samt om
    undantag från förordning (EU) nr 1272/2009 vad gäller tidsfristen för bedömning
    av erbjudna kvantiteter för uppköp av vanligt vete till fast pris inom ramen
    för offentlig intervention
