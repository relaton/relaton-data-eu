title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 2537/70 de la Commission, du 16 décembre 1970, supprimant
    la taxe compensatoire à l'importation de mandarines, satsumas, clémentines,
    tangérines et autres hybrides similaires d'agrumes en provenance d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2537/70 der Kommission vom 16. Dezember 1970 zur Aufhebung
    der Ausgleichsabgabe bei der Einfuhr von Mandarinen, Satsumas, Clementinen, Tangerinen
    und anderen ähnlichen Kreuzungen von Zitrusfrüchten mit Herkunft aus Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2537/70 della Commissione, del 16 dicembre 1970, che
    sopprime la tassa di compensazione all'importazione di mandarini, satsumas, clementine,
    tangerine e altri ibridi similari d'agrumi in provenienza dalla Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2537/70 van de Commissie van 16 december 1970 houdende
    intrekking van de compenserende heffing op de invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten uit
    Spanje
  type: main
