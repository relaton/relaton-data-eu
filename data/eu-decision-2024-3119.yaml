---
id: EUDecision20243119
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/3119 of 16 December 2024 amending
    Implementing Decision (EU) 2023/110 by prolonging the period of application of
    emergency measures regarding confirmed cases of infestation with the small hive
    beetle in France and Italy and by adding the Region of Sicily in Italy to the
    Annex thereof as a zone subject to emergency measures (notified under document
    C(2024) 8783)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/3119 de la Commission du 16 décembre
    2024 modifiant la décision d’exécution (UE) 2023/110 en prolongeant la période
    d’application des mesures d’urgence concernant des cas confirmés d’infestation
    par le petit coléoptère des ruches en France et en Italie et en ajoutant la
    région de la Sicile en Italie à l’annexe de ladite décision en tant que zone
    faisant l’objet de ces mesures d’urgence [notifiée sous le numéro C(2024)
    8783]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/3119 der Kommission vom 16. Dezember
    2024 zur Änderung des Durchführungsbeschlusses (EU) 2023/110 zur Verlängerung
    der Geltungsdauer der Sofortmaßnahmen im Zusammenhang mit bestätigten Fällen
    eines Befalls mit dem Kleinen Bienenbeutenkäfer in Frankreich und Italien sowie
    zur Aufnahme der italienischen Region Sizilien in die Liste der Zonen, für die
    Sofortmaßnahmen gelten, im Anhang des Beschlusses (Bekannt gegeben unter Aktenzeichen
    C(2024) 8783)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2024/3119 на Комисията
    от 16 декември 2024 година за изменение на Решение
    за изпълнение (ЕС) 2023/110 чрез удължаване на срока
    на прилагане на спешните мерки във връзка с
    потвърдени случаи на опаразитяване с малък
    кошерен бръмбар във Франция и Италия и чрез
    добавяне в приложението към него на региона
    Сицилия в Италия като зона, по отношение на
    която се прилагат спешни мерки (нотифицирано
    под номер С(2024) 8783)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2024/3119 ze dne 16. prosince 2024,
    kterým se mění prováděcí rozhodnutí (EU) 2023/110 prodloužením doby použitelnosti
    mimořádných opatření týkajících se potvrzených případů infestace lesknáčkem
    úlovým ve Francii a Itálii a doplněním regionu Sicílie v Itálii do přílohy
    uvedeného rozhodnutí jakožto oblasti podléhající mimořádným opatřením
    (oznámeno pod číslem C(2024) 8783)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/3119 af 16. december
    2024 om ændring af gennemførelsesafgørelse (EU) 2023/110 ved at forlænge anvendelsesperioden
    for hasteforanstaltninger for så vidt angår bekræftede tilfælde af infestering
    med lille stadebille i Frankrig og Italien og ved at tilføje regionen Sicilien
    i Italien til bilaget hertil som en zone, der er omfattet af hasteforanstaltninger
    (meddelt under nummer C(2024) 8783)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2024/3119 της Επιτροπής,
    της 16ης Δεκεμβρίου 2024, για την τροποποίηση
    της εκτελεστικής απόφασης (ΕΕ) 2023/110 ώστε να
    παραταθεί η περίοδος εφαρμογής των έκτακτων
    μέτρων όσον αφορά επιβεβαιωμένα κρούσματα
    προσβολής από τον μικρό κάνθαρο των κυψελών
    στη Γαλλία και την Ιταλία και να προστεθεί
    η περιφέρεια της Σικελίας στην Ιταλία στο παράρτημα
    της εκτελεστικής απόφασης ως ζώνη που υπόκειται
    στα έκτακτα μέτρα [κοινοποιηθείσα υπό τον αριθμό
    C(2024) 8783]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2024/3119, 16. detsember 2024, millega muudetakse
    rakendusotsust (EL) 2023/110, pikendades erakorraliste meetmete kohaldamisaega
    seoses väikese tarumardika nakkuse kinnitatud juhtumitega Prantsusmaal ja Itaalias
    ning lisades Itaalia Sitsiilia maakonna kõnealuse otsuse lisasse tsoonina, mille
    suhtes kohaldatakse erakorralisi meetmeid (teatavaks tehtud numbri C(2024) 8783
    all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2024/3119, annettu 16 päivänä
    joulukuuta 2024, täytäntöönpanopäätöksen (EU) 2023/110 muuttamisesta pidentämällä
    Ranskassa ja Italiassa vahvistettuihin pienen pesäkuoriaisen esiintymiin liittyvien
    kiireellisten toimenpiteiden soveltamisaikaa ja lisäämällä Sisilian alue Italiassa
    sen liitteeseen alueena, jossa sovelletaan kiireellisiä toimenpiteitä (tiedoksiannettu
    numerolla C(2024) 8783)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2024/3119 ón gCoimisiún an 16 Nollaig
    2024 lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2023/110 trí shíneadh a
    chur le tréimhse chur i bhfeidhm na mbeart éigeandála i ndáil le cásanna
    inmhíolaithe leis an gciaróg choirceoige bheag atá deimhnithe sa Fhrainc agus
    san Iodáil agus trí Réigiún na Sicile san Iodáil a chur leis an Iarscríbhinn
    a ghabhann leis mar chrios atá faoi réir bearta éigeandála (tugadh fógra
    faoi leis an doiciméad C(2024) 8783)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2024/3119 оd 16. prosinca 2024. o izmjeni
    Provedbene odluke (EU) 2023/110 produljenjem razdoblja primjene hitnih mjera u
    pogledu potvrđenih slučajeva zaraze malim kornjašem košnice u Francuskoj i
    Italiji te dodavanjem regije Sicilija u Italiji u Prilogu toj odluci kao zone
    koja podliježe hitnim mjerama (priopćeno pod brojem dokumenta C(2024) 8783)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/3119 végrehajtási határozata (2024. december
    16.) az (EU) 2023/110 végrehajtási határozatnak a kis kaptárbogárral való
    fertőzöttség franciaországi és olaszországi megerősített eseteire vonatkozó
    vészhelyzeti intézkedések alkalmazási időszakának meghosszabbítása tekintetében,
    valamint az olaszországi Szicília régió vészhelyzeti intézkedések hatálya
    alá tartozó körzetként az említett határozat mellékletébe való felvétele
    tekintetében történő módosításáról (az értesítés a C(2024) 8783. számú
    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2024/3119 della Commissione, del 16 dicembre
    2024, che modifica la decisione di esecuzione (UE) 2023/110 prorogando il periodo
    di applicazione delle misure di emergenza per quanto riguarda i casi confermati
    di infestazione da piccolo coleottero dell’alveare in Francia e in Italia e
    aggiungendo la regione Sicilia in Italia nell’allegato di tale decisione come
    zona oggetto di misure di emergenza [notificata con il numero C(2024) 8783]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2024/3119 (2024. gada 16. decembris),
    ar ko Īstenošanas lēmumu (ES) 2023/110 groza, pagarinot ārkārtas pasākumu
    piemērošanas periodu attiecībā uz apstiprinātiem mazās stropu vaboles invāzijas
    gadījumiem Francijā un Itālijā un pievienojot minētā lēmuma pielikumam
    Sicīlijas reģionu Itālijā kā zonu, kurai piemēro ārkārtas pasākumus (izziņots
    ar dokumenta numuru C(2024) 8783)
  type: main
- language: lt
  script: Latn
  content: 2024 m. gruodžio 16 d. Komisijos įgyvendinimo sprendimas (ES) 2024/3119,
    kuriuo dėl neatidėliotinų priemonių, susijusių su patvirtintais užsikrėtimo
    bitiniais žvilgvabaliais atvejais Prancūzijoje ir Italijoje, taikymo laikotarpio
    pratęsimo ir Italijos Sicilijos regiono įterpimo į priedą kaip zonos, kurioje
    taikomos neatidėliotinos priemonės, iš dalies keičiamas Įgyvendinimo sprendimas
    (ES) 2023/110 (pranešta dokumentu Nr. C(2024) 8783)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/3119 tas-16
    ta’ Diċembru 2024 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2023/110
    billi testendi l-perjodu ta’ applikazzjoni tal-miżuri ta’ emerġenza fir-rigward
    ta’ każijiet ikkonfermati ta’ infestazzjoni bil-ħanfusa żgħira tal-ġabsala
    fi Franza u fl-Italja u billi żżid ir-Reġjun ta’ Sqallija fl-Italja mal-Anness
    tiegħu bħala żona soġġetta għal miżuri ta’ emerġenza (notifikata bid-dokument
    C(2024) 8783)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2024/3119 van de Commissie van 16 december 2024
    tot wijziging van Uitvoeringsbesluit (EU) 2023/110 teneinde de toepassingsduur
    te verlengen van de noodmaatregelen met betrekking tot bevestigde gevallen van
    infestatie met de kleine kastkever in Frankrijk en Italië en de regio Sicilië
    in Italië aan de bijlage toe te voegen als gebied waar noodmaatregelen gelden
    (Kennisgeving geschied onder nummer C(2024) 8783)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2024/3119 z dnia 16 grudnia 2024 r. zmieniająca
    decyzję wykonawczą (UE) 2023/110 poprzez przedłużenie okresu stosowania środków
    nadzwyczajnych w odniesieniu do potwierdzonych przypadków zarażenia małym chrząszczem
    ulowym we Francji i we Włoszech oraz poprzez dodanie regionu Sycylia we Włoszech
    do załącznika do tej decyzji jako strefy objętej nadzwyczajnymi środkami (notyfikowana
    jako dokument nr C(2024) 8783)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2024/3119 da Comissão, de 16 de dezembro de
    2024, que altera a Decisão de Execução (UE) 2023/110 prorrogando o período
    de aplicação das medidas de emergência relativas a casos confirmados de infestação
    pelo pequeno besouro das colmeias em França e Itália e acrescentando a região
    da Sicília em Itália ao respetivo anexo como zona sujeita a medidas de emergência
    [notificada com o número C(2024) 8783]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2024/3119 a Comisiei din 16 decembrie
    2024 de modificare a Deciziei de punere în aplicare (UE) 2023/110 prin prelungirea
    perioadei de aplicare a măsurilor de urgență privind cazurile confirmate de
    infestare cu gândacul mic de stup în Franța și în Italia și prin adăugarea
    regiunii Sicilia din Italia în anexa la aceasta ca zonă care face obiectul măsurilor
    de urgență [notificată cu numărul C(2024) 8783]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2024/3119 zo 16. decembra 2024,
    ktorým sa mení vykonávacie rozhodnutie (EÚ) 2023/110 predĺžením obdobia
    uplatňovania núdzových opatrení v súvislosti s potvrdenými prípadmi zamorenia
    blyskáčikom úľovým vo Francúzsku a v Taliansku a doplnením talianskeho
    regiónu Sicília do jeho prílohy ako pásmo, na ktoré sa vzťahujú núdzové
    opatrenia [oznámené pod číslom C(2024) 8783]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2024/3119 z dne 16. decembra 2024 o spremembi
    Izvedbenega sklepa (EU) 2023/110 zaradi podaljšanja obdobja uporabe ukrepov v
    nujnih primerih v zvezi s potrjenimi primeri infestacije z malim panjskim hroščem
    v Franciji in Italiji ter vključitve italijanske dežele Sicilija v Prilogo k
    navedenemu sklepu kot območja, za katero veljajo ukrepi v nujnih primerih (notificirano
    pod dokumentarno številko C(2024) 8783)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2024/3119 de la Comisión, de 16 de diciembre
    de 2024, por la que se modifica la Decisión de Ejecución (UE) 2023/110 prorrogando
    el período de aplicación de las medidas de emergencia en relación con los casos
    confirmados de infestación por el pequeño escarabajo de la colmena en Francia
    e Italia y añadiendo la región de Sicilia (Italia) en su anexo como zona sujeta
    a medidas de emergencia [notificada con el número C(2024) 8783]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2024/3119 av den 16 december 2024
    om ändring av genomförandebeslut (EU) 2023/110 genom förlängning av tillämpningsperioden
    för nödåtgärder avseende bekräftade angrepp av lilla kupskalbaggen i Frankrike
    och Italien och genom att lägga till regionen Sicilien i Italien till bilagan
    som en zon som omfattas av nödåtgärder [delgivet med nr C(2024) 8783]
  type: main
