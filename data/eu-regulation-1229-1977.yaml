title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1229/77 of 8 June 1977 re-establishing the
    levying of customs duties on spoons, forks, fish-eaters, etc., of stainless steel,
    falling within subheading 82.14 A, originating in developing countries to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3021/76
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1229/77 de la Commission, du 8 juin 1977, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, fourchettes, pelles à tarte, etc., en acier inoxydable, de la sous-position
    tarifaire 82.14 A, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1229/77 der Kommission vom 8. Juni 1977 zur Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen, Gabeln, Tortenschaufeln usw., aus
    rostfreiem Stahl, der Tarifstelle 82.14 A, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1229/77 af 8. juni 1977 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler, fiskeknive, etc., af rustfri
    stål, under underposition 82.14 A, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1229/77 della Commissione, dell'8 giugno 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai cuccchiai, cucchiaioni,
    forchette, ecc., di acciaio inossidabile, della sottovoce doganale 82.14 A, originari
    dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1229/77 van de Commissie van 8 juni 1977 houdende
    wederinstelling van de heffing van de douanerechten voor lepels, pollepels, enz.
    van roestvrij staal, van post 82.14 A, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad tariefpreferenties
    werden geopend
  type: main
