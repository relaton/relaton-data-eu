title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 966/2010 of 27 October 2010 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 91/2009 on imports of certain iron or steel fasteners
    originating in the People’s Republic of China by imports of certain iron or
    steel fasteners consigned from Malaysia, whether declared as originating in Malaysia
    or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 966/2010 de la Commission du 27 octobre 2010 portant
    ouverture d’une enquête sur le contournement possible des mesures antidumping
    instituées par le règlement (CE) n ° 91/2009 du Conseil sur les importations
    de certains éléments de fixation en fer ou en acier originaires de la République
    populaire de Chine par des importations de certains éléments de fixation en
    fer ou en acier expédiés de Malaisie, qu’ils aient ou non été déclarés
    originaires de ce pays, et soumettant ces importations à enregistrement
  type: main
