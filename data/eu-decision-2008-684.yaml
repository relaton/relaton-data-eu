title:
- language: en
  script: Latn
  content: '2008/684/EC: Commission Decision of 19 August 2008 amending Decision 2006/133/EC
    requiring Member States temporarily to take additional measures against the dissemination
    of Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (the pine wood
    nematode) as regards areas in Portugal, other than those in which it is known
    not to occur (notified under document number C(2008) 4407)'
  type: main
- language: fr
  script: Latn
  content: '2008/684/CE: Décision de la Commission du 19 août 2008 modifiant la
    décision 2006/133/CE exigeant des États membres qu’ils prennent provisoirement
    des mesures supplémentaires contre la propagation de Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al. (nématode du pin) à partir des zones du Portugal
    autres que celles où son absence est attestée [notifiée sous le numéro C(2008)
    4407]'
  type: main
- language: de
  script: Latn
  content: '2008/684/EG: Entscheidung der Kommission vom 19. August 2008 zur Änderung
    der Entscheidung 2006/133/EG zur Verpflichtung der Mitgliedstaaten, vorübergehend
    zusätzliche Maßnahmen gegen die Verbreitung von Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al. (dem Kiefernfadenwurm) gegenüber anderen Gebieten Portugals
    zu treffen als denjenigen, in denen dieser Schadorganismus bekanntermaßen nicht
    vorkommt (Bekannt gegeben unter Aktenzeichen K(2008) 4407)'
