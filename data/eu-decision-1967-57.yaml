title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 décembre 1966, portant octroi au Royaume
    de Belgique et au Grand-Duché de Luxembourg d'un contingent tarifaire pour les
    pilchards de l'espèce "sardina ocellata", frais, réfrigérés ou congelés,
    destinés à l'industrie de la conserve de poissons
  type: main
- language: de
  script: Latn
  content: '67/57/EWG: Entscheidung der Kommission vom 21. Dezember 1966 über die
    Gewährung eines Zollkontingents für Pilchards der Art sardina ocellata, frisch,
    gekühlt oder gefroren, für die Fischkonservenindustrie, an das Königreich Belgien
    und das Großherzogtum Luxemburg'
  type: main
- language: it
  script: Latn
  content: '67/57/CEE: Decisione della Commissione, del 21 dicembre 1966, che concede
    al Regno del Belgio ed al Granducato del Lussemburgo un contingente tariffario
    per le sarde della specie sardina ocellata, fresche, refrigerate o congelate,
    destinate all''industria conserviera dei pesci'
  type: main
- language: nl
  script: Latn
  content: '67/57/EEG: Beschikking van de Commissie van 21 december 1966 houdende
    toekenning van een tariefcontingent aan het Koninkrijk België en het Groothertogdom
    Luxemburg voor pilchards van de soort "sardina ocellata", vers, gekoeld of bevroren,
    bestemd voor de visconservenindustrie'
  type: main
