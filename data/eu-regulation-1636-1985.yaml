    et (CEE) no 616/85 concernant la poursuite des actions destinées à élargir
    les marchés dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1636/85 der Kommission vom 17. Juni 1985 zur Änderung
