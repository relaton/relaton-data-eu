    615/85 und (EWG) Nr. 616/85 betreffend die Fortführung der Maßnahmen zur Erweiterung
    der Märkte für Milch und Milcherzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1636/85 af 17. juni 1985 om ændring
    af fristerne for indgåelse af de kontrakter, der er omhandlet i forordning (EØF)
    nr. 615/85 og (EØF) nr. 616/85 vedrørende videreførelse af foranstaltninger
    til udvidelse af markederne for mælk og mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1636/85 της Επιτροπής
    της 17ης Ιουνίου 1985 που τροποποιεί τις προθεσμίες
    για τη σύναψη των συμβάσεων που αναφέρονται
    στους κανονισμούς (ΕΟΚ) αριθ. 615/85 και (ΕΟΚ) αριθ.
    616/85 σχετικά με τη συνέχιση των ενεργειών που
    προορίζονται να διευρύνουν τις αγορές στον
    τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1636/85 della Commissione del 17 giugno 1985 che modifica
    i termini per la conclusione dei contratti previsti dai regolamenti (CEE) n. 615/85
    e (CEE) n. 616/85 per quanto concerne la prosecuzione delle azioni distinate ad
    ampliare i mercati del settore del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1636/85 van de Commissie van 17 juni 1985 tot wijziging
    van de termijnen voor het sluiten van de contracten bedoeld in de Verordeningen
    (EEG) nr. 615/85 en (EEG) nr. 616/85 betreffende de voortzetting van de acties
    ter verruiming van de markten in de sector melk en zuivelprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1636/85 da Comissão, de 17 de Junho de 1985, que
    altera os preços para a celebração dos contratos referidos nos Regulamentos
    (CEE) n.° 615/85 e (CEE) n.° 616/85 que dizem respeito à continuação das
    acções destinadas a alargar os mercados no sector do leite e dos produtos lácteos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1636/85 de la Comisión, de 17 de junio de 1985, por
    el que se modifican los plazos para la celebración de los contratos contemplados
    en los Reglamentos (CEE) n° 615/85 y (CEE) n° 616/85 relativos a la continuación
    de las acciones destinadas a ampliar los mercados en el sector de la leche y de
    los productos lácteos
