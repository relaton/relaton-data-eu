id: EURegulation20211232
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EU) 2021/1232 of the European Parliament and of the Council
    of 14 July 2021 on a temporary derogation from certain provisions of Directive
    2002/58/EC as regards the use of technologies by providers of number-independent
    interpersonal communications services for the processing of personal and other
    data for the purpose of combating online child sexual abuse
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2021/1232 du Parlement européen et du Conseil du 14 juillet
    2021 relatif à une dérogation temporaire à certaines dispositions de la directive
    2002/58/CE en ce qui concerne l’utilisation de technologies par les fournisseurs
    de services de communications interpersonnelles non fondés sur la numérotation
    pour le traitement de données à caractère personnel et d’autres données
    aux fins de la lutte contre les abus sexuels commis contre des enfants en ligne
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2021/1232 des Europäischen Parlaments und des Rates vom
    14. Juli 2021 über eine vorübergehende Ausnahme von bestimmten Vorschriften
    der Richtlinie 2002/58/EG hinsichtlich der Verwendung von Technologien durch Anbieter
    nummernunabhängiger interpersoneller Kommunikationsdienste zur Verarbeitung personenbezogener
    und anderer Daten zwecks Bekämpfung des sexuellen Missbrauchs von Kindern im
    Internet
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2021/1232 на Европейския парламент
    и на Съвета от 14 юли 2021 година относно временна
    дерогация от някои разпоредби на Директива
    2002/58/ЕО по отношение на използването на технологии
    от доставчици на междуличностни съобщителни
    услуги без номерà за обработване на лични и
    други данни за целите на борбата с онлайн сексуалното
    насилие над деца
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2021/1232 ze dne 14. července
    2021 o dočasné odchylce od některých ustanovení směrnice 2002/58/ES, pokud
    jde o používání technologií poskytovateli interpersonálních komunikačních
    služeb nezávislých na číslech ke zpracování osobních a jiných údajů
    pro účely boje proti pohlavnímu zneužívání dětí on-line
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2021/1232 af 14. juli 2021
    om en midlertidig undtagelse fra visse bestemmelser i direktiv 2002/58/EF, for
    så vidt angår den anvendelse af teknologier til behandling af personoplysninger
    og andre data, der foretages af udbydere af nummeruafhængige interpersonelle
    kommunikationstjenester med det formål at bekæmpe seksuelt misbrug af børn
    online
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2021/1232.του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 14ης Ιουλίου 2021 περί
    προσωρινής παρεκκλίσεως από ορισμένες διατάξεις
    της οδηγίας 2002/58/ΕΚ όσον αφορά τη χρήση τεχνολογιών
    από παρόχους υπηρεσιών διαπροσωπικών επικοινωνιών
    ανεξαρτήτως αριθμών για την επεξεργασία προσωπικών
    και άλλων δεδομένων, προς καταπολέμηση της
    σεξουαλικής κακοποίησης παιδιών στο διαδίκτυο
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2021/1232, 14. juuli 2021,
    ajutise erandi kohta direktiivi 2002/58/EÜ teatavatest sätetest seoses tehnoloogiaga,
    mida numbrivaba isikutevahelise side teenuste osutajad kasutavad isikuandmete
    ja muude andmete töötlemiseks, et võidelda veebis toimuva laste seksuaalse
    kuritarvitamise vastu
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2021/1232, annettu 14 päivänä
    heinäkuuta 2021, tilapäisestä poikkeuksesta direktiivin 2002/58/EY tiettyihin
    säännöksiin siltä osin kuin on kyse teknologioista, joita numeroista riippumattomien
    henkilöiden välisten viestintäpalvelujen tarjoajat käyttävät henkilötietojen
    ja muiden tietojen käsittelyyn verkossa tapahtuvan lasten seksuaalisen hyväksikäytön
    torjumiseksi
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2021/1232 ó Pharlaimint na hEorpa agus ón gComhairle
    an 14 Iúil 2021 maidir le maolú sealadach ar fhorálacha áirithe de Threoir
    2002/58/CE a mhéid a bhaineann le húsáid teicneolaíochtaí ag soláthraithe
    seirbhísí cumarsáide idirphearsanta neamhspleách ar uimhir chun sonraí pearsanta
    agus sonraí eile a phróiseáil chun mí-úsáid ghnéasach leanaí ar líne
    a chomhrac
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2021/1232 Europskog parlamenta i Vijeća od 14. srpnja 2021.
    o privremenom odstupanju od određenih odredbi Direktive 2002/58/EZ u pogledu
    tehnologija koje pružatelji brojevno neovisnih interpersonalnih komunikacijskih
    usluga upotrebljavaju za obradu osobnih i drugih podataka u svrhu borbe protiv
    seksualnog zlostavljanja djece na internetu
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2021/1232 rendelete (2021. július
    14.) a 2002/58/EK irányelv bizonyos rendelkezéseitől a technológiáknak a
    számfüggetlen személyközi hírközlési szolgáltatásokat nyújtó szolgáltatók
    által a gyermekek online szexuális bántalmazása elleni küzdelem céljából
    a személyes és egyéb adatok kezelésére történő használata tekintetében
    való ideiglenes eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2021/1232 del Parlamento europeo e del Consiglio del 14
    luglio 2021 relativo a una deroga temporanea a talune disposizioni della direttiva
    2002/58/CE per quanto riguarda l’uso di tecnologie da parte dei fornitori di
    servizi di comunicazione interpersonale indipendenti dal numero per il trattamento
    di dati personali e di altro tipo ai fini della lotta contro gli abusi sessuali
    online sui minori
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2021/1232 (2021. gada 14. jūlijā)
    par pagaidu atkāpi no konkrētiem Direktīvas 2002/58/EK noteikumiem attiecībā
    uz tehnoloģiju izmantošanu, ko veic numurneatkarīgu starppersonu sakaru pakalpojumu
    sniedzēji, lai apstrādātu persondatus un citus datus nolūkā apkarot seksuālu
    vardarbību pret bērniem tiešsaistē
  type: main
- language: lt
  script: Latn
  content: Europos Parlamento ir Tarybos reglamentas (ES) 2021/1232 2021 m. liepos
    14 d. dėl laikinos nukrypti nuo tam tikrų Direktyvos 2002/58/EB nuostatų, kiek
    tai susiję su numeriu nesiejamo asmenų tarpusavio ryšio paslaugų teikėjų
    naudojamų technologijų naudojimo asmens ir kitiems duomenims tvarkyti kovos
    su seksualine prievarta prieš vaikus internete tikslais, leidžiančios nuostatos
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2021/1232.tal-Parlament Ewropew u tal-Kunsill tal-14 ta’
    Lulju 2021 dwar deroga temporanja minn ċerti dispożizzjonijiet tad-Direttiva
    2002/58/KE fir-rigward tal-użu ta’ teknoloġiji minn fornituri tas-servizzi
    tal-komunikazzjonijiet interpersonali indipendenti min-numri għall-ipproċessar
    ta’ data personali u data oħra għall-iskop tal-ġlieda kontra l-abbuż sesswali
    tat-tfal online
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2021/1232 van het Europees Parlement en de Raad van 14
    juli 2021 betreffende een tijdelijke afwijking van sommige bepalingen van Richtlijn
    2002/58/EG ten aanzien van het gebruik van technologieën door aanbieders van
    nummeronafhankelijke interpersoonlijke communicatiediensten voor de verwerking
    van persoonsgegevens en andere gegevens ten behoeve van de bestrijding van online
    seksueel misbruik van kinderen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2021/1232 z dnia 14
    lipca 2021 r. w sprawie tymczasowego odstępstwa od niektórych przepisów dyrektywy
    2002/58/WE w odniesieniu do wykorzystywania technologii przez dostawców usług
    łączności interpersonalnej niewykorzystujących numerów do przetwarzania danych
    osobowych i innych danych do celów zwalczania niegodziwego traktowania dzieci
    w celach seksualnych w internecie
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2021/1232 do Parlamento Europeu e do Conselho de 14 de
    julho de 2021 relativo a uma derrogação temporária de determinadas disposições
    da Diretiva 2002/58/CE no que respeita à utilização de tecnologias por prestadores
    de serviços de comunicações interpessoais independentes do número para o tratamento
    de dados pessoais e outros para efeitos de combate ao abuso sexual de crianças
    em linha
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2021/1232 al Parlamentului European și al Consiliului
    din 14 iulie 2021 privind o derogare temporară de la anumite dispoziții ale
    Directivei 2002/58/CE în ceea ce privește utilizarea tehnologiilor de către
    furnizorii de servicii de comunicații interpersonale care nu se bazează pe numere
    pentru prelucrarea datelor cu caracter personal și a altor date în scopul combaterii
    abuzului sexual online asupra copiilor
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2021/1232 zo 14. júla 2021
    o dočasnej výnimke z určitých ustanovení smernice 2002/58/ES, pokiaľ ide
    o používanie technológií poskytovateľmi interpersonálnych komunikačných
    služieb nezávislých od číslovania na spracúvanie osobných a iných údajov
    na účely boja proti online sexuálnemu zneužívaniu detí
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2021/1232 Evropskega parlamenta in Sveta z dne 14. julija 2021
    o začasnem odstopanju od nekaterih določb Direktive 2002/58/ES glede uporabe
    tehnologij s strani ponudnikov medosebnih komunikacijskih storitev, neodvisnih
    od številke, za obdelavo osebnih in drugih podatkov za namene boja proti spolni
    zlorabi otrok na spletu
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2021/1232 del Parlamento Europeo y del Consejo de 14 de
    julio de 2021 por el que se establece una excepción temporal a determinadas disposiciones
    de la Directiva 2002/58/CE en lo que respecta al uso de tecnologías por proveedores
    de servicios de comunicaciones interpersonales independientes de la numeración
    para el tratamiento de datos personales y de otro tipo con fines de lucha contra
    los abusos sexuales de menores en línea
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2021/1232 av den 14 juli
    2021 om ett tillfälligt undantag från vissa bestämmelser i direktiv 2002/58/EG
    vad gäller användning av teknik hos tillhandahållare av nummeroberoende interpersonella
    kommunikationstjänster för behandling av personuppgifter och andra uppgifter
    i syfte att bekämpa sexuella övergrepp mot barn på nätet
  type: main
