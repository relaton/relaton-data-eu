title:
- language: en
  script: Latn
  content: '76/34/EEC: Commission Decision of 12 December 1975 authorizing the Kingdom
    of Denmark to waive the provisions relating to the wrapping of beef quarters subject
    to intervention measures (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '76/34/CEE: Décision de la Commission, du 12 décembre 1975, autorisant
    le Royaume de Danemark à déroger aux dispositions relatives à l''emballage
    des quartiers de viande bovine soumis à des mesures d''intervention (Le texte
    en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '76/34/EWG: Entscheidung der Kommission vom 12. Dezember 1975 zur Ermächtigung
    des Königreichs Dänemark, von den Bestimmungen über die Verpackung der unter
    Interventionsmaßnahmen fallenden Rindfleischviertel abzuweichen (Nur der dänische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '76/34/EØF: Kommissionens Beslutning af 12. december 1975 om bemyndigelse
    af kongeriget Danmark til at afvige fra bestemmelserne vedrørende indpakning
    af oksefjerdinger, der er undergivet interventionsforanstaltninger (Kun den danske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '76/34/ΕΟΚ : Απόφαση της Επιτροπής, της 12ης
    Δεκεμβρίου 1975, με την οποία επιτρέπεται στο
    Βασίλειο της Δανίας να αποκλίνει από τις διατάξεις
    σχετικά με τη συσκευασία τεταρτημορίων βοΐου
    κρέατος που υπόκεινται σε μέτρα παρέμβασης
    (Το κείμενο στην δανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '76/34/CEE: Decisione della Commissione, del 12 dicembre 1975, che autorizza
    il Regno di Danimarca a derogare alle disposizioni relative all''imballaggio delle
    carni bovine presentate in quarti, soggette a misure d''intervento (Il testo in
    lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '76/34/EEG: Beschikking van de Commissie van 12 december 1975 waarbij het
    Koninkrijk Denemarken wordt gemachtigd af te wijken van de bepalingen inzake de
    verpakking van voor- en achtervoeten van runderen waarop interventiemaatregelen
    van toepassing zijn (Slechts de tekst in de Deense taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '76/34/CEE: Decisión de la Comisión, de 12 de diciembre de 1975, por
    la que se autoriza al Reino de Dinamarca a establecer excepciones a las disposiciones
    relativas al envasado de los cuartos de carne de vacuno sometidos a medidas de
    intervención (El texto en lengua danesa es el único auténtico)'
  type: main
