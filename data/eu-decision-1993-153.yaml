title:
- language: en
  script: Latn
  content: '93/153/EEC: Commission Decision of 9 February 1993 on the eligibility
    of expenditure to be incurred in 1993 by Germany, Spain, Greece, Ireland, Italy,
    the Netherlands and the United Kingdom for the purpose of ensuring compliance
    with the Community system for the conservation and management of fishery resources
    (Only the Spanish, German, English, French, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/153/CEE: Décision de la Commission, du 9 février 1993, relative à
    l''éligibilité des dépenses à effectuer par l''Allemagne, l''Espagne, la Grèce,
    l''Irlande, l''Italie, les Pays-Bas et le Royaume-Uni au cours de l''année 1993
    pour assurer le respect du régime communautaire de conservation et de gestion
    des ressources de pêche (Les textes en langues espagnole, allemande, anglaise,
    française, italienne et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/153/EWG: Entscheidung der Kommission vom 9. Februar 1993 über die
    Erstattungsfähigkeit von Ausgaben Deutschlands, Spaniens, Griechenlands, Irlands,
    Italiens, der Niederlande und des Vereinigten Königreichs im Jahr 1993 zur Gewährleistung
    der Einhaltung der gemeinschaftlichen Regelung für die Erhaltung und Bewirtschaftung
    der Fischereiressourcen (Nur der spanische, deutsche, englische, französische,
    italienische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/153/EØF: Kommissionens beslutning af 9. februar 1993 om refusionsberettigelsen
    for udgifter afholdt i 1993 af Tyskland, Spanien, Grækenland, Irland, Italien,
    Nederlandene og Det Forenede Kongerige for at sikre overholdelse af fællesskabsordningen
    for bevarelse og forvaltning af fiskeressourcerne (Kun den spanske, tyske, engelske,
    franske, italienske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 9ης Φεβρουαρίου
    1993 σχετικά με την επιλεξιμότητα των δαπανών
    που θα πραγματοποιηθούν εντός του 1993 από τη
    Γερμανία, την Ισπανία, την Ελλάδα, την Ιρλανδία,
    την Ιταλία, τις Κάτω Χώρες και το Ηνωμένο Βασίλειο
    για την εφαρμογή του κοινοτικού καθεστώτος
    διατήρησης και διαχείρισης των αλιευτικών
    πόρων (Τα κείμενα στην ισπανική, γερμανική,
    αγγλική, γαλλική, ιταλική και ολλανδική γλώσσα
    είναι τα μόνα αυθεντικά)
  type: main
- language: it
  script: Latn
  content: '93/153/CEE: Decisione della Commissione, del 9 febbraio 1993, relativa
    all''imputabilità delle spese (da sostenersi) nel 1993 dalla Germania, dalla
    Spagna, dalla Grecia, dall''Irlanda, dall''Italia, dai Paesi Bassi e dal Regno
    Unito per garantire il rispetto del regime comunitario di conservazione e di gestione
    delle risorse della pesca (Il testi in lingua spagnola, tedesca, inglese, francese,
    italiana e olandese sono i soli facenti fede)'
  type: main
