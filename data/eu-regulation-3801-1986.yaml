  content: Commission Regulation (EEC) No 3801/86 of 12 December 1986 fixing for 1987,
    the quotas for imports into Portugal of certain pigmeat products from Spain and
    certain detailed rules for the application thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3801/86 de la Commission du 12 décembre 1986 fixant,
