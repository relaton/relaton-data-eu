    determinados produtos do sector da carne de suíno provenientes de Espanha e determinadas
    regras para a sua aplicação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3801/86 de la Comisión de 12 de diciembre de 1986
    por el que se establecen los contingentes para 1987 aplicables a las importaciones
    en Portugal de determinados productos del sector de la carne de porcino procedentes
    de España y determinadas normas para su aplicación
  type: main
