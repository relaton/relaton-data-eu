    de certains produits du secteur de la viande de porc en provenance d' Espagne
    et certaines modalités pour leur application
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3801/86 der Kommission vom 12. Dezember 1986 zur Festlegung
    der 1987 in Portugal anwendbaren Kontingente für die Einfuhr bestimmter Schweinefleischerzeugnisse
    aus Spanien und diesbezüglicher Durchführungsbestimmungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3801/86 af 12. december 1986 om fastsættelse
    af kontingenterne for 1987 for indførsel til Portugal af visse svinekødprodukter
    fra Spanien og visse bestemmelser for deres anvendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3801/86 της Επιτροπής
    της 12ης Δεκεμβρίου 1986 που καθορίζει, για το
    1987, τις ποσοστώσεις που εφαρμόζονται κατά την
    εισαγωγή στην Πορτογαλία ορισμένων προϊόντων
    του τομέα του χοιρείου κρέατος προέλευσης
    Ισπανίας, και ορισμένες λεπτομέρειες για την
    εφαρμογή τους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3801/86 della Commissione del 12 dicembre 1986 che
    fissa, per il 1987, i contingenti applicabili alle importazioni in Portogallo
    di taluni prodotti del settore delle carni suine provenienti dalla Spagna e stabilisce
    le relative modalità di applicazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3801/86 van de Commissie van 12 december 1986 tot
    vaststelling van de contingenten voor 1987 die Portugal voor bepaalde produkten
    van de sector varkensvlees uit Spanje mag toepassen, en van uitvoeringsbepalingen
    terzake
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3801/86 da Comissão de 12 de Dezembro de 1986 que
