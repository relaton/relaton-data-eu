title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2899/2000 of 21 December 2000 fixing the
    standard values to be used in calculating the financial compensation and the advance
    pertaining thereto in respect of fishery products withdrawn from the market during
    the 2001 fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2899/2000 de la Commission du 21 décembre 2000 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 2001 intervenant dans le calcul de la compensation financière
    et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2899/2000 der Kommission vom 21. Dezember 2000 zur
    Festsetzung des Pauschalwerts für das Fischwirtschaftsjahr 2001 für die aus
    dem Handel genommenen Fischereierzeugnisse, der zur Berechnung des finanziellen
    Ausgleichs und des entsprechenden Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2899/2000 af 21. december 2000 om fastsættelse
    af den forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet i
    fangståret 2001, og som indgår i beregningen af den finansielle udligning og
    det tilsvarende forskud
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2899/2000 της Επιτροπής,
    της 21ης Δεκεμβρίου 2000, περί καθορισμού της
    κατ' αποκοπή αξίας των προϊόντων αλιείας που
    αποσύρονται από την αγορά κατά την αλιευτική
    περίοδο 2001, η οποία υπεισέρχεται στον υπολογισμό
    της χρηματικής αντισταθμίσεως και της σχετικής
    προκαταβολής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2899/2000, annettu 21 päivänä joulukuuta 2000,
    kalastusvuoden 2001 aikana markkinoilta vedettyjen kalastustuotteiden taloudellisen
    korvauksen ja sen ennakon laskennassa käytettävästä kiinteästä arvosta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2899/2000 della Commissione, del 21 dicembre 2000,
    che fissa, ai fini del calcolo della compensazione finanziaria e dell'anticipo
    corrispondente, il valore forfettario dei prodotti della pesca ritirati dal mercato
    nella campagna di pesca 2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2899/2000 van de Commissie van 21 december 2000 betreffende
    de vaststelling van de forfaitaire waarde van de in het visseizoen 2001 uit de
    markt genomen visserijproducten die in aanmerking wordt genomen voor de berekening
    van de financiële vergoeding en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2899/2000 da Comissão, de 21 de Dezembro de 2000,
    que fixa, para efeitos do cálculo da compensação financeira e do adiantamento
    que lhe diz respeito, o valor forfetário dos produtos da pesca retirados do mercado
    durante a campanha de pesca de 2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2899/2000 de la Comisión, de 21 de diciembre de 2000,
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 2001, que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2899/2000 av den 21 december 2000 om
    fastställande av det schablonvärde som skall användas vid beräkningen av den
    ekonomiska ersättningen och tillhörande förskott för de fiskeriprodukter som
    återtagits från marknaden under fiskeåret 2001
  type: main
