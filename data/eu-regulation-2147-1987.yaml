    40.0550), van oorsprong uit Mexico, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3925/86 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2147/87 da Comissão de 20 de Julho de 1987 que
