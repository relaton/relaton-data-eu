title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2147/87 of 20 July 1987 re-establishing
    the levying of customs duties on discontinuous synthetic textile fibres, products
    of category 55 (code 40.0550), originating in Mexico, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2147/87 de la Commission du 20 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux fibres textiles
    synthétiques discontinues, de la catégorie 55 (code 40.0550), originaires du
    Mexique, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2147/87 der Kommission vom 20. Juli 1987 zur Wiedereinführung
    des Zollsatzes für synthetische und künstliche Spinnfasern der Warenkategorie
    Nr. 55 (Kennziffer 40.0550) mit Ursprung in Mexiko, dem die in der Verordnung
    (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2147/87 af 20. juli 1987 om genindførelse
    af opkrævning af toldafgifter for syntetiske korte kemofibre under varekategori
    nr. 55 (kode 40.0550), som har oprindelse i Mexico og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
