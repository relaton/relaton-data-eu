    fiocco della categoria di prodotti n. 55 (codice 40.0550), originari del Messico,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3925/86
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2147/87 van de Commissie van 20 juli 1987 houdende
