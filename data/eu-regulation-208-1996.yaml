title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 208/96 of 2 February 1996 determining the
    loss of income and the premiums applicable per ewe and per female goat in the
    Member States and the payment of the specific aid for sheep and goat farming in
    certain less-favoured areas of the Community for the 1995 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 208/96 de la Commission, du 2 février 1996, déterminant,
    pour les États membres et pour la campagne 1995, la perte de revenu et le montant
    de la prime payable par brebis et par chèvre et le versement de l'aide spécifique
    à l'élevage ovin et caprin dans certaines zones défavorisées de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 208/96 der Kommission vom 2. Februar 1996 über den
