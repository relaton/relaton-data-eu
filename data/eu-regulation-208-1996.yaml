    maksettavasta erityisestä tuesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 208/96 della Commissione, del 2 febbraio 1996, che
    stabilisce, per gli Stati membri e per la campagna 1995, la perdita di reddito
    e il premio pagabile per pecora e per capra e il versamento dell'aiuto specifico
    a favore dell'allevamento ovino e caprino in talune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 208/96 van de Commissie van 2 februari 1996 tot vaststelling,
