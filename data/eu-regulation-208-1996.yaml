    die je Mutterschaf und Ziege zu zahlende Prämie und die in benachteiligten Gebieten
    der Gemeinschaft für die Schaf- und Ziegenfleischerzeugung zu gewährende Sonderbeihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 208/96 af 2. februar 1996 om fastsættelse
    for medlemsstaterne for produktionsåret 1995 af indtægtstabet og det præmiebeløb,
    der skal betales pr. moderfår og pr. ged, og af udbetalingen af den særlige
    støtte til fåre- og gedeopdræt i visse ugunstigt stillede områder i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 208/96 της Επιτροπής,
    της 2ας Φεβρουαρίου 1996, που καθορίζει για τα
    κράτη μέλη και για περίοδο εμπορίας 1995 την
    απώλεια εισοδήματος καθώς και το ποσό της πριμοδότησης
    που καταβάλλεται ανά προβατίνα και ανά αίγα
    και την πληρωμή της ειδικής ενίσχυσης στην
    εκτροφή προβάτων και αιγών σε ορισμένες μειονεκτικές
    ζώνες της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 208/96, annettu 2 päivänä helmikuuta 1996,
