title:
- language: en
  script: Latn
  content: '80/809/EEC: Commission Decision of 30 July 1980 authorizing certain Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of oak wood originating in the USA (Only the French, German,
    Italian, Dutch and Danish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/809/CEE: Décision de la Commission, du 30 juillet 1980, autorisant
    certains Etats membres à prévoir des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil, pour le bois de chêne originaire des Etats-Unis
    d''Amérique (Les textes en langues française, allemande, italienne, néerlandaise
    et danoise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/809/EWG: Entscheidung der Kommission vom 30. Juli 1980 zur Ermächtigung
    bestimmter Mitgliedstaaten, für Eichenholz mit Ursprung in den Vereinigten Staaten
    von Amerika Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des
    Rates vorzusehen (Nur der französische, deutsche, italienische, niederländische
    und dänische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/809/EØF: Kommissionens beslutning af 30. juli 1980 om bemyndigelse
    af visse medlemsstater til at undtage egetræ med oprindelse i Amerikas forenede
    Stater fra visse bestemmelser i Rådets direktiv 77/93/EØF (Kun den franske,
    tyske, italienske, nederlandske og danske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/809/CEE: Decisione della Commissione, del 30 luglio 1980, che autorizza
    gli Stati membri a prevedere deroghe a determinate disposizioni della direttiva
    77/93/CEE del Consiglio per il legname di quercia originario degli Stati Uniti
    d''America (I testi in lingua francese, tedesca, italiana, olandese e danese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/809/EEG: Beschikking van de Commissie van 30 juli 1980 houdende machtiging
    van bepaalde Lid-Staten om afwijkingen toe te staan van sommige bepalingen van
    Richtlijn 77/93/EEG van de Raad, ten aanzien van eikehout van oorsprong uit de
    Verenigde Staten van Amerika (Slechts de teksten in de Franse, Duitse, Italiaanse,
    Nederlandse en de Deense taal zijn authentiek)'
