title:
- language: en
  script: Latn
  content: Regulation (EEC) No 236/75 of the Commission of 30 January 1975 fixing
    the rates of the refunds applicable from 1 February 1975 to certain cereals and
    rice products exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 236/75 de la Commission, du 30 janvier 1975, fixant
    les taux des restitutions applicables, à compter du 1er février 1975, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 236/75 der Kommission vom 30. Januar 1975 zur Festsetzung
    der ab 1. Februar 1975 geltenden Erstattungssätze bei der Ausfuhr bestimmter
    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 236/75 af 30. januar 1975 om fastsættelse
    af de restitutionssatser, der fra 1. februar 1975 skal anvendes for visse produkter
    fra korn- og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 236/75 della Commissione, del 30 gennaio 1975, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 febbraio 1975,
    a taluni prodotti dei settori dei cereali e del riso esportati sotto forma di
    merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 236/75 van de Commissie van 30 januari 1975 houdende
    vaststelling van de restituties die met ingang van 1 februari 1975 worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goederen
  type: main
