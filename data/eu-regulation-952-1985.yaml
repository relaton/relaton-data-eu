title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 952/85 of 11 April 1985 providing for the
    grant of private storage aid fixed at a standard rate in advance in respect of
    carcases, half-carcases, hindquarters and forequarters of beef
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 952/85 de la Commission du 11 avril 1985 prévoyant
    l' octroi d' une aide au stockage privé de carcasses, de demi-carcasses, de quartiers
    arrière et de quartiers avant, fixée forfaitairement à l' avance, dans le secteur
    de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 952/85 der Kommission vom 11. April 1985 zur Gewährung
    einer im voraus pauschal festgesetzten Beihilfe zur privaten Lagerhaltung von
    Schlachtkörpern, halben Schlachtkörpern, Hintervierteln und Vordervierteln von
    Rindern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 952/85 af 11. april 1985 om ydelse
    af en skønsmæssigt forudfastsat støtte til privat oplagring af hele og halve
    kroppe og for- og bagfjerdinger i oksekødsektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 952/85 της Επιτροπής
    της 11ης Απριλίου 1985 για την πρόβλεψη χορήγησης
    ενίσχυσης που προκαθορίζεται κατ' αποκοπή
    στην ιδιωτική αποθεματοποίηση σφαγίων, ημιμορίων
    σφαγίου, οπισθίων και εμπροσθίων τεταρτημορίων
    στον τομέα του βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 952/85 della Commissione dell' 11 aprile 1985 recante
    concessione di un aiuto fissato forfettariamente in anticipo all' ammasso privato
    di carcasse, mezzene, quarti anteriori e quarti posteriori nel settore delle carni
    bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 952/85 van de Commissie van 11 april 1985 inzake
    de toekenning van een vooraf forfaitair vastgesteld steunbedrag voor de particuliere
    opslag van hele geslachte dieren, halve geslachte dieren, achtervoeten en voorvoeten
    van runderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 952/85 da Comissão, de 11 de Abril de 1985, que
    prevê a concessão de uma ajuda à armazenagem privada de carcaças, meias carcaças,
    quartos traseiros e quartos dianteiros, estipulada antecipadamente num valor fixo,
    no sector da carne de bovino
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 952/85 de la Comisión, de 11 de abril de 1985, por
    el que se prevé la concesión de una ayuda al almacenamiento privado de canales,
    medias canales, cuartos traseros y cuartos delanteros, fijada por anticipado a
    tanto alzado, en el sector de la carne de vacuno
  type: main
