title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1078/88 of 25 April 1988 re-establishing
    the levying of customs duties on men' s or boys' suits and ensembles, other than
    knitted or crocheted, products of category No 16 (order No 40.0160), originating
    in India to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1078/88 de la Commission du 25 avril 1988 portant
    rétablissement de la perception des droits de douane applicables aux costumes,
    complets et ensembles, autres que de bonneterie, pour hommes et garçonnets, de
    la catégorie de produits n° 16 (numéro d' ordre 40.0160), originaires de l'
    Inde, bénéficiaire des préférences tarifaires prévues par le règlement (CEE)
    n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1078/88 der Kommission vom 25. April 1988 zur Wiedereinführung
    des Zollsatzes für Anzüge und Kombinationen, andere als aus Gewirken, für Männer
    und Knaben der Warenkategorie Nr. 16 (lfd. Nummer 40.0160 mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1078/88 af 25. april 1988 om genindførelse
