    d' ordine 40.0160), originari dell' India beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1078/88 van de Commissie van 25 april 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kostuums
    en combinaties, andere dan van brei- of haakwerk, voor heren en jongens, van de
    categorie van produkten nr. 16 (volgnummer 40.0160), van oorsprong uit India,
