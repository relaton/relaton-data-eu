  content: Council Regulation (EEC) No 2223/86 of 14 July 1986 amending Regulation
    (EEC) No 3035/80 laying down general rules for granting export refunds on certain
    agricultural products exported in the form of goods not covered by Annex II to
    the Treaty, and the criteria for fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2223/86 du Conseil du 14 juillet 1986 modifiant le
