---
id: EUDecision2014195
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: "(2014/195/EU): Council Decision of 17 February 2014 authorising Member States to sign, ratify or accede to the Cape Town Agreement of 2012 on the Implementation of the Provisions of the Torremolinos Protocol of 1993 relating to the Torremolinos International Convention for the Safety of Fishing Vessels, 1977"
  type: main
- language: fr
  script: Latn
  content: "(2014/195/UE): Décision du Conseil du 17 février 2014 autorisant les États membres à signer ou ratifier l'accord du Cap de 2012 sur la mise en œuvre des dispositions du protocole de Torremolinos de 1993 relatif à la convention internationale de Torremolinos de 1977 sur la sécurité des navires de pêche, ou à y adhérer"
  type: main
- language: de
  script: Latn
  content: "(2014/195/EU): Beschluss des Rates vom 17. Februar 2014 zur Ermächtigung der Mitgliedstaaten, das Übereinkommen von Kapstadt von 2012 über die Durchführung der Bestimmungen des Torremolinos-Protokolls von 1993 zu dem Internationalen Übereinkommen von Torremolinos über die Sicherheit von Fischereifahrzeugen von 1977 zu unterzeichnen, zu ratifizieren oder ihm beizutreten"
  type: main
- language: bg
  script: Cyrl
  content: "(2014/195/ЕС): Решение на Съвета от 17 февруари 2014 година за оправомощаване на държавите членки да подпишат, ратифицират или се присъединят към Споразумението от Кейптаун от 2012 г. за прилагането на разпоредбите на Протокола от Торемолинос от 1993 г. във връзка с Международната конвенция от Торемолинос за безопасността на риболовните кораби, 1977 г."
  type: main
- language: cs
  script: Latn
  content: "(2014/195/EU): Rozhodnutí Rady ze dne 17. února 2014 , kterým se členské státy zmocňují k podpisu, ratifikaci nebo přistoupení k Dohodě z Kapského Města z roku 2012 o provedení ustanovení protokolu z Torremolinos z roku 1993 týkajícího se Mezinárodní úmluvy z Torremolinos o bezpečnosti rybářských plavidel z roku 1977"
  type: main
- language: da
  script: Latn
  content: "(2014/195/EU): Rådets afgørelse af 17. februar 2014 om bemyndigelse af medlemsstaterne til at undertegne, ratificere eller tiltræde Cape Town-aftalen fra 2012 om gennemførelse af bestemmelserne i Torremolinosprotokollen af 1993 til den internationale Torremolinoskonvention om fiskeskibes sikkerhed, 1977"
  type: main
- language: el
  script: Grek
  content: "(2014/195/ΕΕ): Απόφαση του Συμβουλίου, της 17ης Φεβρουαρίου 2014 , με την οποία εξουσιοδοτούνται τα κράτη μέλη να υπογράψουν, να επικυρώσουν ή να προσχωρήσουν στη Συμφωνία του Κέιπ Τάουν του 2012 για την εφαρμογή των διατάξεων του πρωτοκόλλου του Torremolinos 1993 σχετικά με τη Διεθνή Σύμβαση Torremolinos του 1977 για την ασφάλεια των αλιευτικών σκαφών"
  type: main
- language: et
  script: Latn
  content: "(2014/195/EL): Nõukogu otsus, 17. veebruar 2014 , millega volitatakse liikmesriike allkirjastama 2012. aasta Kaplinna lepingut (1977. aasta Torremolinose kalapüügilaevade ohutuse rahvusvahelise konventsiooniga seotud 1993. aasta protokolli sätete rakendamise kohta), seda ratifitseerima või sellega ühinema"
  type: main
- language: fi
  script: Latn
  content: "(2014/195/EU): Neuvoston päätös, annettu 17 päivänä helmikuuta 2014 , jäsenvaltioiden valtuuttamisesta allekirjoittamaan ja ratifioimaan vuoden 2012 Kapkaupungin sopimus Torremolinoksessa 1977 tehtyyn kalastusalusten turvallisuutta koskevaan kansainväliseen yleissopimukseen liittyvän vuonna 1993 tehdyn Torremolinoksen pöytäkirjan määräysten täytäntöönpanosta tai liittymään siihen"
  type: main
- language: hr
  script: Latn
  content: "(2014/195/EU): Odluka Vijeća od 17. veljače 2014. kojom se države članice ovlašćuju za potpisivanje, ratificiranje ili pristupanje Sporazumu iz Cape Towna iz 2012. o provedbi odredaba Torremolinos protokola iz 1993. na Torremolinos međunarodnu konvenciju o sigurnosti ribarskih brodova iz 1977."
  type: main
- language: hu
  script: Latn
  content: "(2014/195/EU): A Tanács határozata ( 2014. február 17. ) a tagállamoknak a halászhajók biztonságáról szóló, 1977. évi torremolinosi nemzetközi egyezményhez csatolt 1993. évi torremolinosi jegyzőkönyv rendelkezéseinek végrehajtására vonatkozó 2012. évi fokvárosi megállapodás aláírására, megerősítésére vagy az ahhoz történő csatlakozásra történő felhatalmazásáról"
  type: main
- language: it
  script: Latn
  content: "(2014/195/UE): Decisione del Consiglio, del 17 febbraio 2014 , che autorizza gli Stati membri a firmare, ratificare o aderire all'accordo di Città del Capo del 2012 sull'attuazione delle disposizioni del protocollo di Torremolinos del 1993 relativo alla convenzione internazionale di Torremolinos del 1977 sulla sicurezza delle navi da pesca"
  type: main
- language: lv
  script: Latn
  content: "(2014/195/ES): Padomes Lēmums ( 2014. gada 17. februāris ), ar ko dalībvalstis tiek pilnvarotas parakstīt vai ratificēt 2012. gada Keiptaunas nolīgumu par 1993. gada Torremolinosas protokola, kas attiecas uz 1977. gada Torremolinosas Starptautisko konvenciju par zvejas kuģu drošību, noteikumu īstenošanu vai pievienoties tam"
  type: main
- language: lt
  script: Latn
  content: "(2014/195/ES): 2014 m. vasario 17 d. Tarybos sprendimas, kuriuo valstybėms narėms leidžiama pasirašyti ir ratifikuoti 2012 m. Keiptauno susitarimą dėl 1977 m. Tarptautinės Toremolinoso konvencijos dėl žvejybos laivų saugos 1993 m. Toremolinoso protokolo nuostatų įgyvendinimo arba prie šio Susitarimo prisijungti"
  type: main
- language: mt
  script: Latn
  content: "(2014/195/UE): Deċiżjoni tal-Kunsill tas- 17 ta' Frar 2014 li tawtorizza lill-Istati Membri biex iffirmaw, jirratifikaw jew jaċċedu għall-Ftehim ta' Cape Town tal-2012 dwar l-implimentazzjoni tad-dispożizzjonijiet tal-Protokoll ta' Torremolinos tal-1993 relatat mal-Konvenzjoni Internazzjonali ta' Torremolinos għas-Sikurezza tal-Bastimenti tas-Sajd, 1977"
  type: main
- language: nl
  script: Latn
  content: "(2014/195/EU): Besluit van de Raad van 17 februari 2014 waarbij de lidstaten worden gemachtigd om de Overeenkomst van Kaapstad van 2012 inzake de tenuitvoerlegging van de bepalingen van het Protocol van Torremolinos van 1993 inzake het Internationaal Verdrag van Torremolinos voor de beveiliging van vissersvaartuigen van 1977 te ondertekenen, te bekrachtigen of ertoe toe te treden"
  type: main
- language: pl
  script: Latn
  content: "(2014/195/UE): Decyzja Rady z dnia 17 lutego 2014 r. upoważniająca państwa członkowskie do podpisania i ratyfikowania Porozumienia kapsztadzkiego z 2012 r. w sprawie wdrożenia postanowień protokołu z Torremolinos z 1993 r. odnoszącego się do Międzynarodowej konwencji z Torremolinos o bezpieczeństwie statków rybackich z 1977 r. lub do przystąpienia do tego porozumienia"
  type: main
- language: pt
  script: Latn
  content: "(2014/195/UE): Decisão do Conselho, de 17 de fevereiro de 2014 , que autoriza os Estados-Membros a assinar, ratificar ou aderir ao Acordo da Cidade do Cabo, de 2012, sobre a aplicação das disposições do Protocolo de Torremolinos de 1993 relativo à Convenção Internacional de Torremolinos de 1977 para a segurança dos navios de pesca"
  type: main
- language: ro
  script: Latn
  content: "(2014/195/UE): Decizia Consiliului din 17 februarie 2014 de autorizare a statelor membre pentru a semna, a ratifica sau a adera la Acordul de la Cape Town din 2012 privind punerea în aplicare a dispozițiilor Protocolului de la Torremolinos din 1993 referitor la Convenția internațională de la Torremolinos pentru siguranța navelor de pescuit din 1977"
  type: main
- language: sk
  script: Latn
  content: "(2014/195/EÚ): Rozhodnutie Rady, zo 17. novembra 2014 , ktorým sa členské štáty oprávňujú podpísať a ratifikovať Dohodu z Kapského mesta z roku 2012 o vykonávaní ustanovení protokolu z Torremolinosu z roku 1993 týkajúceho sa Medzinárodného dohovoru o bezpečnosti rybárskych plavidiel z Torremolinosu z roku 1977 alebo k nej pristúpiť"
  type: main
- language: sl
  script: Latn
  content: "(2014/195/EU): Sklep Sveta z dne 17. februarja 2014 o pooblastitvi držav članic, da podpišejo, ratificirajo ali pristopijo h Capetownskemu sporazumu iz leta 2012 o izvajanju določb Protokola iz Torremolinosa iz leta 1993, ki se nanaša na Mednarodno konvencijo iz Torremolinosa o varnosti ribiških plovil iz leta 1977"
  type: main
- language: es
  script: Latn
  content: "(2014/195/UE): Decisión del Consejo, de 17 de febrero de 2014 , por la que se autoriza a los Estados miembros a firmar, ratificar o adherirse al Acuerdo de Ciudad del Cabo de 2012 sobre la aplicación de las disposiciones del Protocolo de Torremolinos de 1993 relativo al Convenio internacional de Torremolinos para la seguridad de los buques pesqueros de 1977"
  type: main
- language: sv
  script: Latn
  content: "(2014/195/EU): Rådets beslut av den 17 februari 2014 om att bemyndiga medlemsstaterna att underteckna, ratificera eller ansluta sig till 2012 års Kapstadenavtal om tillämpningen av bestämmelserna i 1993 års Torremolinosprotokoll om internationella Torremolinoskonventionen om säkerhet på fiskefartyg från 1977"
  type: main
