title:
- language: en
  script: Latn
  content: '1999/806/EC: Council Decision of 29 November 1999 authorising the Italian
    Republic to apply or to continue to apply reductions in, or exemptions from, excise
    duties on certain mineral oils used for specific purposes, in accordance with
    the procedure provided for in Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '1999/806/CE: Décision du Conseil, du 29 novembre 1999, autorisant la
    République italienne à appliquer ou à continuer d''appliquer des réductions
    ou des exonérations de droits d''accises sur certaines huiles minérales utilisées
    à des fins spécifiques, conformément à la procédure prévue par l''article
    8, paragraphe 4, de la directive 92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '1999/806/EG: Entscheidung des Rates vom 29. November 1999 zur Ermächtigung
    der Italienischen Republik, für bestimmte Mineralöle mit besonderen Verwendungszwecken
    Verbrauchsteuerermäßigungen oder -befreiungen einzuführen oder beizubehalten
    (Verfahren gemäß Artikel 8 Absatz 4 der Richtlinie 92/81/EWG)'
  type: main
- language: da
  script: Latn
  content: '1999/806/EF: Rådets beslutning af 29. november 1999 om tilladelse til
    Den Italienske Republik til i overensstemmelse med proceduren i artikel 8, stk.
    4, i direktiv 92/81/EØF at anvende eller fortsat anvende reducerede punktafgiftssatser
    eller eventuelt fritagelse fra disse i forbindelse med visse mineralolier til
    specifikke formål'
  type: main
- language: el
  script: Grek
  content: '1999/806/ΕΚ: Απόφαση του Συμβουλίου, της 29ης
    Νοεμβρίου 1999, που εξουσιοδοτεί την Ιταλική
    Δημοκρατία να χορηγήσει ή να διατηρήσει μειώσεις
    ή απαλλαγές από τους ειδικούς φόρους κατανάλωσης
    επί ορισμένων πετρελαιοειδών που χρησιμοποιούνται
    για ειδικούς σκοπούς, με τη διαδικασία του
    άρθρου 8 παράγραφος 4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '1999/806/EY: Neuvoston päätös, tehty 29 päivänä marraskuuta 1999,
    luvan antamisesta Italian tasavallalle soveltaa tai soveltaa edelleen valmisteveron
    alennuksia tai valmisteverovapautuksia tiettyihin erityistarkoituksiin käytettyihin
    kivennäisöljyihin direktiivin 92/81/ETY 8 artiklan 4 kohdassa tarkoitetun menettelyn
    mukaisesti'
  type: main
- language: it
  script: Latn
  content: '1999/806/CE: Decisione del Consiglio, del 29 novembre 1999, che autorizza
    la Repubblica italiana ad applicare o a continuare ad applicare ad alcuni oli
    minerali utilizzati a fini specifici esenzioni o riduzioni d''accisa, conformemente
    alla procedura di cui all''articolo 8, paragrafo 4, della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '1999/806/EG: Beschikking van de Raad van 29 november 1999 waarbij de Italiaanse
    Republiek wordt gemachtigd om in overeenstemming met de procedure van artikel
    8, lid 4, van Richtlijn 92/81/EEG verlaagde accijnstarieven of vrijstelling van
    accijnzen toe te passen of te blijven toepassen op bepaalde minerale oliën die
    voor bijzondere doeleinden worden gebruikt'
  type: main
- language: pt
  script: Latn
  content: '1999/806/CE: Decisão do Conselho, de 29 de Novembro de 1999, que autoriza
    a República Italiana a aplicar ou a continuar a aplicar a certos óleos minerais
    utilizados para fins específicos, reduções ou isenções do imposto especial
    sobre o consumo, nos termos do n.o 4 do artigo 8.o da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '1999/806/CE: Decisión del Consejo, de 29 de noviembre de 1999, por la
    que se autoriza a la República Italiana a aplicar o seguir aplicando reducciones
    o exenciones del impuesto especial sobre determinados hidrocarburos utilizados
    con fines específicos, de conformidad con el procedimiento previsto en el apartado
    4 del artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '1999/806/EG: Rådets beslut av den 29 november 1999 om tillåtelse i enlighet
    med förfarandet i artikel 8.4 i direktiv 92/81/EEG för Republiken Italien att
    tillämpa eller fortsätta att tillämpa regler om nedsättning av eller befrielse
    från punktskatter på vissa mineraloljor som används för särskilda ändamål'
  type: main
