title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 143/85 of 18 January 1985 concerning the
    quantity of high-quality beef and veal from the United States of America and from
    Canada that may be imported under the arrangements laid down in Regulation (EEC)
    No 142/85 for 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 143/85 de la Commission du 18 janvier 1985 concernant
    la quantité de viandes bovines de haute qualité des États-Unis d' Amérique
    et du Canada pouvant être importée dans le cadre du régime prévu par le règlement
    (CEE) no 142/85 pour l' année 1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 143/85 der Kommission vom 18. Januar 1985 über die
    Menge hochwertigen Rindfleisches aus den Vereinigten Staaten von Amerika und Kanada,
    die im Rahmen der durch die Verordnung (EWG) Nr. 142/85 für 1985 vorgesehenen
    Regelung eingeführt werden darf
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 143/85 af 18. januar 1985 om de mængder
    oksekød af høj kvalitet fra USA og Canada, der kan indføres inden for rammerne
    af ordningen i henhold til forordning (EØF) nr. 142/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 143/85 της Επιτροπής
    της 18ης Ιανουαρίου 1985 που αφορά την ποσότητα
    βοείου κρέατος εκλεκτής ποιότητας, προελεύσεως
    Ηνωμένων Πολιτειών Αμερικής και Καναδά, που
    μπορεί να εισαχθεί στο πλαίσιο του καθεστώτος
    που προβλέπεται από τον κανονισμό (ΕΟΚ) αριθ.
    142/85 για το έτος 1985
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 143/85 della Commissione del 18 gennaio 1985 relativo
    al quantitativo di carni bovine di qualità pregiata degli Stati Uniti d' America
    e del Canada che può essere importato nell' ambito del regime previsto dal regolamento
    (CEE) n. 142/85 per il 1985
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 143/85 van de Commissie van 18 januari 1985 betreffende
    de hoeveelheid rundvlees van hoge kwaliteit die in 1985 uit de Verenigde Staten
    van Amerika en uit Canada mag worden ingevoerd in het kader van de bij Verordening
    (EEG) nr. 142/85 vastgestelde regeling
