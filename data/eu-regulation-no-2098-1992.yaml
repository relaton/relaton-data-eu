title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2098/92 of 24 July 1992 amending Regulation
    (EEC) No 1616/92 laying down detailed rules applicable to the free supply of food
    products to the population of Albania as provided for in Council Regulation (EEC)
    No 1567/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2098/92 de la Commission, du 24 juillet 1992, modifiant
