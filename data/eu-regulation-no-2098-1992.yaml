    fourniture gratuite de denrées alimentaires destinées aux populations de l'Albanie
    prévue par le règlement (CEE) n 1567/92
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2098/92 der Kommission vom 24. Juli 1992 zur Änderung
