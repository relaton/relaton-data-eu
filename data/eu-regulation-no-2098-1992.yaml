    von Nahrungsmitteln an die Bevölkerung von Albanien nach der Verordnung (EWG)
    Nr. 1567/92 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2098/92 af 24. juli 1992 om ændring
    af forordning (EØF) nr. 1616/92 om gennemførelsesbestemmelser vedrørende de
    i Rådets forordning (EØF) nr. 1567/92 fastsatte gratis leverancer af levnedsmidler
    bestemt til befolkningen i Albanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2098/92 της Επιτροπής
    της 24ης Ιουλίου 1992 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1616/92 που καθορίζει τις
    λεπτομέρειες εφαρμογής για τη δωρεάν προμήθεια
    τροφίμων που προορίζονται για τους πληθυσμούς
    της Αλβανίας, που προβλέπεται στον κανονισμό
    (ΕΟΚ) αριθ. 1567/92 του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n° 2098/92 della Commissione, del 24 luglio 1992, che
    modifica il regolamento (CEE) n. 1616/92 che stabilisce le modalità della fornitura
    gratuita di derrate alimentari alla popolazione dell'Albania, conformemente al
    regolamento (CEE) n. 1567/92 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2098/92 van de Commissie van 24 juli wijziging van
