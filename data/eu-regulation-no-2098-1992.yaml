    de kosteloze levering van levensmiddelen, bestemd voor de bevolking van Albanië,
    in het kader van Verordening (EEG) nr. 1567/92 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2098/92 da Comissão, de 24 de Julho de 1992, que
    altera o Regulamento (CEE) nº 1616/92, que define as regras aplicáveis para
    o fornecimento gratuito de géneros alimentícios destinados à população da
    Albânia previsto pelo Regulamento (CEE) nº 1567/92 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2098/92 de la Comisión, de 24 de 1992, por el que
