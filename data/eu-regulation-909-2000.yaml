    der Quotenabtretung sowie des Anhangs V zur Festlegung der Einzelheiten für die
    Berechnung des veränderlichen Teilbetrags der Prämie im Rohtabaksektor
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 909/2000 ze dne 2. května 2000, kterým se
