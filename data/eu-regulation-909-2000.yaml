title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 909/2000 of 2 May 2000 amending Regulation
    (EC) No 2848/98 as regards the allocation of additional production quota statements,
    the transfer of quotas, and Annex V setting out the rules for calculating the
    variable part of the premium for raw tobacco
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 909/2000 de la Commission, du 2 mai 2000, modifiant
    le règlement (CE) nº 2848/98 dans le secteur du tabac brut en ce qui concerne
    l'attribution d'attestations complémentaires de quotas de production, la cession
    de quotas de production ainsi que l'annexe V, où les modalités de calcul de
    la partie variable de la prime sont fixées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 909/2000 der Kommission vom 2. Mai 2000 zur Änderung
