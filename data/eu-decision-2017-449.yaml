  content: Council Decision (EU) 2017/449 of 7 March 2017 on the position to be adopted,
    on behalf of the European Union, in the 60th session of the Commission on Narcotic
    Drugs on the scheduling of substances under the Single Convention on Narcotic
    Drugs of 1961, as amended by the 1972 Protocol, and the Convention on Psychotropic
    Substances of 1971
  type: main
