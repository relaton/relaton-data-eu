title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 536/2004 of 23 March 2004 determining the
    extent to which applications lodged in March 2004 for import licences for certain
    poultrymeat products under the regime provided for in Council Regulation (EC)
    No 774/94 opening and providing for the administration of certain Community tariff
    quotas for poultrymeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 536/2004 de la Commission du 23 mars 2004 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en mars 2004 pour certains produits à base de viande de volaille peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande de volaille et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 536/2004 der Kommission vom 23. März 2004 über die
    Festsetzung des Umfangs, in dem die im März 2004 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Geflügelfleischerzeugnisse entsprechend der Regelung der Verordnung
    (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher Zollkontingente
    für Geflügelfleisch und andere landwirtschaftliche Erzeugnisse genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 536/2004 af 23. marts 2004 om fastsættelse
