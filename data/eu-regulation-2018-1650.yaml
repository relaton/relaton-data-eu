title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2018/1650 of 5 November 2018 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entries for Canada, Russia
    and the United States in the list of third countries, territories, zones or compartments
    from which certain poultry commodities may be imported into or transit through
    the Union in relation to highly pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2018/1650 de la Commission du 5 novembre 2018
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives au Canada, à la Russie et aux États-Unis sur la liste des pays tiers,
    territoires, zones ou compartiments en provenance desquels certains produits de
    volailles peuvent être importés dans l'Union ou transiter par celle-ci, pour
    ce qui est de l'influenza aviaire hautement pathogène
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2018/1650 der Kommission vom 5. November
