    der Einträge zu Kanada, Russland und den Vereinigten Staaten in der Liste von
    Drittländern, Gebieten, Zonen und Kompartimenten, aus denen bestimmte Geflügelwaren
    in die Union eingeführt bzw. durch die Union durchgeführt werden dürfen, in
    Bezug auf die hochpathogene Aviäre Influenza
  type: main
