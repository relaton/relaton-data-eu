title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/193 of 28 January 2026 amending
    Implementing Decision (EU) 2021/1182 as regards harmonised standards for neurosurgical
    implants, biological evaluation of medical devices, clinical investigation of
    medical devices for human subjects, non-active surgical implants, sterilization
    of health care products, biocompatibility evaluation of breathing gas pathways
    in healthcare applications and small-bore connectors for liquids and gases in
    healthcare applications
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/193 de la Commission du 28 janvier 2026
    modifiant la décision d’exécution (UE) 2021/1182 en ce qui concerne les normes
    harmonisées relatives aux implants neurochirurgicaux, à l’évaluation biologique
    des dispositifs médicaux, à l’investigation clinique des dispositifs médicaux
    pour sujets humains, aux implants chirurgicaux non actifs, à la stérilisation
    des produits de santé, à l’évaluation de la biocompatibilité des chemins
    de gaz respiratoire utilisés dans le domaine de la santé et aux raccords de
    petite taille pour liquides et gaz utilisés dans le domaine de la santé
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/193 der Kommission vom 28. Januar 2026
    zur Änderung des Durchführungsbeschlusses (EU) 2021/1182 hinsichtlich harmonisierter
    Normen für neurochirurgische Implantate, die biologische Beurteilung von Medizinprodukten,
    die klinische Prüfung von Medizinprodukten an Menschen, nichtaktive chirurgische
    Implantate, die Sterilisation von Produkten für die Gesundheitsfürsorge, die
    Beurteilung der Biokompatibilität der Atemgaswege bei medizinischen Anwendungen
    und Verbindungsstücke mit kleinem Durchmesser für Flüssigkeiten und Gase in
    medizinischen Anwendungen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/193 на Комисията
    от 28 януари 2026 година за изменение на Решение
    за изпълнение (ЕС) 2021/1182 по отношение на хармонизираните
    стандарти за неврохирургични импланти, биологично
    преценяване на медицински изделия, клинично
    изпитване на медицински изделия върху хора,
    неактивни хирургични импланти, стерилизация
    на продукти за здравеопазването, преценяване
    на биологичната съвместимост по пътя на преминаване
    на дихателните смеси за целите на здравеопазването
    и съединители с малки отвори за течности и
    газ за използване в здравеопазването
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/193 ze dne 28. ledna 2026, kterým
    se mění prováděcí rozhodnutí (EU) 2021/1182, pokud jde o harmonizované
    normy pro neurochirurgické implantáty, biologické hodnocení prostředků zdravotnické
    techniky, klinické zkoušky zdravotnických prostředků pro humánní účely,
    neaktivní chirurgické implantáty, sterilizaci výrobků pro zdravotní péči,
    hodnocení biokompatibility cest dýchacího plynu ve zdravotní péči a konektory
    s malým vnitřním průměrem pro kapaliny a plyny používané ve zdravotnictví
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/193 af 28. januar 2026
    om ændring af gennemførelsesafgørelse (EU) 2021/1182 for så vidt angår harmoniserede
    standarder for neurokirurgiske implantater, biologisk vurdering af medicinsk udstyr,
    klinisk afprøvning af medicinsk udstyr til mennesker, ikke-aktive kirurgiske
    implantater, sterilisation af sundhedsprodukter, evaluering af biokompatibiliteten
    for respiratorisk udstyr til medicinsk brug og konnektorer med lille diameter
    til væsker og gasser i sundhedsapplikationer
  type: main
- language: el
  script: Grek
