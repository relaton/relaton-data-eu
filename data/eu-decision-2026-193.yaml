    implantus, medicīnisko ierīču bioloģisko novērtēšanu, cilvēkiem paredzēto
    medicīnisko ierīču klīnisko izpēti, neaktīvos ķirurģiskos implantus, veselības
    aprūpes līdzekļu sterilizāciju, elpošanas gāzu ceļu biosaderības novērtējumu
    veselības aprūpes lietojumos un neliela diametra medicīniskos savienotājus,
    kas paredzēti šķidrumiem un gāzēm, groza Īstenošanas lēmumu (ES) 2021/1182
  type: main
