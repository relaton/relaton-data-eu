    normas harmonizadas relativas aos implantes neurocirúrgicos, à avaliação biológica
    dos dispositivos médicos, à investigação clínica de dispositivos médicos
    em participantes humanos, aos implantes cirúrgicos não ativos, à esterilização
    de produtos de saúde, à avaliação da biocompatibilidade das vias dos gases
    respiratórios em aplicações de saúde e aos conectores de pequeno diâmetro
    para líquidos e gases para utilização em cuidados de saúde
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2026/193 a Comisiei din 28 ianuarie
    2026 de modificare a Deciziei de punere în aplicare (UE) 2021/1182 în ceea ce
    privește standardele armonizate pentru implanturile neurochirurgicale, evaluarea
    biologică a dispozitivelor medicale, investigația clinică a dispozitivelor
    medicale pentru subiecți umani, implanturile chirurgicale inactive, sterilizarea
    dispozitivelor pentru îngrijirea sănătății, evaluarea biocompatibilității
    căilor de gaz pentru respirație în aplicații de îngrijire a sănătății
    și racordurile mici pentru lichide și gaze în aplicații de îngrijire a sănătății
  type: main
