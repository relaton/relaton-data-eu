  script: Latn
  content: Decisión de Ejecución (UE) 2026/193 de la Comisión, de 28 de enero de
    2026, por la que se modifica la Decisión de Ejecución (UE) 2021/1182 en lo que
    respecta a las normas armonizadas para los implantes neuroquirúrgicos, la evaluación
    biológica de productos sanitarios, la investigación clínica de productos sanitarios
    para humanos, los implantes quirúrgicos no activos, la esterilización de productos
    para el cuidado de la salud, la evaluación de la biocompatibilidad de conductos
    de gases respiratorios en aplicaciones sanitarias y de conectores de diámetro
