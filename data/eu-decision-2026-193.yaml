    az orvostechnikai eszközök biológiai értékelésére, az orvostechnikai eszközök
    humánklinikai vizsgálatára, a nem aktív sebészeti implantátumokra, az egészségügyi
    termékek sterilizálására, a légzésigáz-útvonalak biokompatibilitásának
    egészségügyi alkalmazásokban való értékelésére, valamint az egészségügyi
    alkalmazásokban használt folyadékoknál és gázoknál alkalmazott kis átmérőjű
    csatlakozókra vonatkozó harmonizált szabványok tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/193 della Commissione, del 28 gennaio
    2026, che modifica la decisione di esecuzione (UE) 2021/1182 per quanto riguarda
    norme armonizzate per gli impianti neurochirurgici, la valutazione biologica dei
    dispositivi medici, l’indagine clinica dei dispositivi medici per soggetti umani,
    gli impianti chirurgici non attivi, la sterilizzazione dei prodotti sanitari,
    la valutazione della biocompatibilità dei percorsi di gas respirabili in applicazioni
    sanitarie e i connettori di piccole dimensioni per liquidi e gas in applicazioni
    sanitarie
  type: main
- language: lv
