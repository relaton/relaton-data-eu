    bioloogilist hindamist, inimesel tehtavaid meditsiiniseadmete kliinilisi uuringuid,
    mitteaktiivseid kirurgilisi implantaate, tervishoiutoodete steriliseerimist, meditsiinis
    kasutatavate hingamisgaasiahelate biosobivuse hindamist ning meditsiinis kasutatavaid,
    vedelike ja gaaside jaoks ette nähtud väikseavalisi liitmikke käsitlevate harmoneeritud
    standardite osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2026/193, annettu 28 päivänä
    tammikuuta 2026, täytäntöönpanopäätöksen (EU) 2021/1182 muuttamisesta siltä
    osin kuin on kyse neurokirurgisia implantteja, terveydenhuollon laitteiden ja
    tarvikkeiden biologista arviointia, lääkinnällisten laitteiden kliinisiä tutkimuksia,
    ei-aktiivisia kirurgisia implantteja, terveydenhuollon tuotteiden sterilointia,
    terveydenhuollon käyttöön tarkoitettujen hengityskaasuputkien bioyhteensopivuuden
    arviointia sekä terveydenhuollossa nesteiden ja kaasujen kuljettamisessa käytettäviä
    pienikaliiperisia liittimiä koskevista yhdenmukaistetuista standardeista
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2026/193 ón gCoimisiún an 28 Eanáir 2026
    lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2021/1182 a mhéid a bhaineann
    le caighdeáin chomhchuibhithe maidir le hionphlanduithe néaramháinliachta,
    meastóireacht bhitheolaíoch ar fheistí leighis, imscrúdú cliniciúil ar fheistí
    leighis le haghaidh daoine, ionphlanduithe máinliachta neamhghníomhacha, steiriliú
    táirgí cúraim sláinte, meastóireacht bhith-chomhoiriúnachta ar chonairí
    gáis análaithe i bhfeidhmeanna cúraim sláinte agus nascóirí mionchró le
    haghaidh leachtanna agus gás i bhfeidhmeanna cúraim sláinte
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2026/193 оd 28. siječnja 2026. o izmjeni
    Provedbene odluke (EU) 2021/1182 u pogledu usklađenih normi za neurokirurške
    implantate, biološku procjenu medicinskih proizvoda, klinička ispitivanja medicinskih
    proizvoda za ljude, neaktivne kirurške implantate, sterilizaciju medicinskih
    proizvoda, vrednovanje biološke kompatibilnosti dijelova za dovod respiratornog
    plina za primjenu u zdravstvu i spojnike malog promjera za tekućine i plinove
    za primjenu u zdravstvu
  type: main
