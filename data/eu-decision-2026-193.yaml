  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2026/193 av den 28 januari 2026
    om ändring av genomförandebeslut (EU) 2021/1182 vad gäller harmoniserade standarder
    för neurokirurgiska implantat, biologisk utvärdering av medicintekniska produkter,
    klinisk prövning av medicintekniska produkter, icke-aktiva kirurgiska implantat,
    sterilisering av medicintekniska produkter, utvärderingar av biokompatibilitet
    av respiratoriska gasvägar i medicintekniska tillämpningar och finkalibriga
    kopplingar för vätskor och gaser inom hälso- och sjukvård
