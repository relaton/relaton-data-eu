  script: Latn
  content: Uitvoeringsbesluit (EU) 2026/193 van de Commissie van 28 januari 2026 tot
    wijziging van Uitvoeringsbesluit (EU) 2021/1182 wat betreft geharmoniseerde normen
    voor neurochirurgische implantaten, de biologische evaluatie van medische hulpmiddelen,
    klinisch onderzoek van medische hulpmiddelen voor gebruik bij mensen, niet-actieve
    chirurgische implantaten, sterilisatie van producten voor de gezondheidszorg,
    biocompatibiliteitsbeoordeling van ademhalingsgassen in gezondheidstoepassingen,
    en connectoren van kleine afmeting voor vloeistoffen en gassen voor toepassing
