  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2026/193 z 28. januára 2026, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2021/1182, pokiaľ ide o harmonizované
    normy pre neurochirurgické implantáty, biologické hodnotenie zdravotníckych
    pomôcok, klinické skúšanie zdravotníckych pomôcok na humánne použitie,
    neaktívne chirurgické implantáty, sterilizáciu výrobkov zdravotnej starostlivosti,
    hodnotenie biokompatibility ciest dýchacích plynov v zdravotníckych aplikáciách
    a spojky s malým priemerom na kvapaliny a plyny v aplikáciách zdravotnej starostlivosti
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2026/193 z dne 28. januarja 2026 o spremembi
    Izvedbenega sklepa (EU) 2021/1182 glede harmoniziranih standardov za nevrokirurške
    vsadke (implantate), biološko ovrednotenje medicinskih pripomočkov, klinične
    raziskave medicinskih pripomočkov za ljudi, neaktivne kirurške vsadke (implantate),
    sterilizacijo izdelkov za zdravstveno nego, ovrednotenje biokompatibilnosti vdihanega
    plina za uporabo v zdravstvu ter priključke z majhnim premerom za tekočine in
    pline za uporabo v zdravstvu
  type: main
