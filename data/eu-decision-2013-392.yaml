  content: '2013/392/: Council Decision of 22 July 2013 fixing the date of effect
    of Decision 2008/633/JHA concerning access for consultation of the Visa Information
    System (VIS) by designated authorities of Member States and by Europol for the
    purposes of the prevention, detection and investigation of terrorist offences
    and of other serious criminal offences'
  type: main
- language: fr
  script: Latn
