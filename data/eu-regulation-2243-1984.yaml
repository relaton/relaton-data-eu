title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2243/84 of 31 July 1984 re-establishing
    the levying of customs duties on other industrial and occupational clothing, products
    of category 76 (code 0760), originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2243/84 de la Commission du 31 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux autres vêtements
    de travail de la catégorie 76 (code 0760), originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2243/84 der Kommission vom 31. Juli 1984 über die
    Wiedereinführung des Zollsatzes für andere Arbeits- und Berufskleidung der Warenkategorie
    Nr. 76 (Kennziffer 0760) mit Ursprung in Thailand, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2243/84 af 31. juli 1984 om genindførelse
    af opkrævning af toldafgifter for anden arbejds- og beskyttelsesbeklædning,
    under varekategori nr. 76 (kode 0760), som har oprindelse i Thailand og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2243/84 της Επιτροπής
    της 31ης Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα έτερα
    ενδύματα εργασίας, προϊόντα της κατηγορίας
    76 (κωδικός 0760), καταγωγής Ταϋλάνδης, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3570/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2243/84 della Commissione del 31 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili ad altri indumenti da lavoro, della
    categoria di prodotti n. 76 (codice 0760), originari della Tailandia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2243/84 van de Commissie van 31 juli 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere werk-
    en bedrijfskleding, van de categorie van produkten nr. 76 (codenummer 0760), van
    oorsprong uit Thailand waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3570/83 van de Raad
  type: main
