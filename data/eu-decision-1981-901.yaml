title:
- language: en
  script: Latn
  content: '81/901/EEC: Commission Decision of 13 November 1981 accepting the undertaking
    given by the Government of Brazil in connection with the anti-subsidy proceeding
    concerning imports of certain kinds of women'' s shoes originating in that country
    and terminating the proceeding in respect of them'
  type: main
- language: fr
  script: Latn
  content: '81/901/CEE: Décision de la Commission, du 13 novembre 1981, portant acceptation
    de l'' engagement souscrit par le gouvernement du Brésil dans le cadre de la
    procédure antisubventions concernant les importations de certaines chaussures
    pour femmes, originaires de ce pays, et portant clôture de cette procédure à
    leur égard'
  type: main
- language: de
  script: Latn
  content: '81/901/EWG: Beschluß der Kommission vom 13. November 1981 über die Annahme
    der Verpflichtung, die die Regierung Brasiliens im Rahmen des Antidumpingverfahrens
    betreffend die Einfuhren bestimmter Damenschuhe mit Ursprung in diesem Land eingegangen
    ist, und über die Einstellung dieses Verfahrens'
  type: main
- language: da
  script: Latn
  content: '81/901/EØF: Kommissionens afgørelse af 13. november 1981 om godtagelse
    af tilsagn afgivet af Brasiliens regering i forbindelse med antisubsidieproceduren
    vedrørende indførsel af visse damesko med oprindelse i Brasilien og om slutning
    af denne procedure for disse varers vedkommende'
  type: main
- language: el
  script: Grek
  content: '81/901/EOK: Απόφαση τής Επιτροπής τής 13ης Νοεμβρίου
    1981 περί αποδοχής τής αναλήψεως υποχρεώσεως
    εκ μέρους τής κυβερνήσεως τής Βραζιλίας στό
    πλαίσιο τής διαδικασίας αντιεπιδοτήσεως σχετικά
    μέ τίς εισαγωγές ορισμένων γυναικείων υποδημάτων
    καταγωγής Βραζιλίας καί περί περατώσεως τής
    σχετικής διαδικασίας'
  type: main
- language: it
  script: Latn
  content: '81/901/CEE: Decisione della Commissione, del 13 novembre 1981, che accetta
    l'' impegno assunto dal governo del Brasile, nel quadro della procedura antisovvenzioni
    relativa alle importazioni di alcune calzature per donna originarie di questo
    paese, e chiude detta procedura nei loro confronti'
  type: main
- language: nl
  script: Latn
  content: '81/901/EEG: Besluit van de Commissie van 13 november 1981 houdende aanvaarding
    van de verbintenis die door de Regering van Brazilië is aangegaan in het kader
    van de anti-subsidieprocedure betreffende de invoer van bepaalde damesschoenen
    van oorsprong uit dit land en houdende beëindiging van deze procedure ten aanzien
    van dit land'
  type: main
