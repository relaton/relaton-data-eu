type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 May 1978 authorizing the French Republic not
    to apply Community treatment to cotton yarn, not put up for retail sale, falling
    within heading No 55.05 of the Common Customs Tariff (NIMEXE codes 55.05-13, 19,
    21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67, 69, 72, 78, 92,
    98), originating in South Korea and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/488/CEE: Décision de la Commission, du 17 mai 1978, autorisant la
    République française à exclure du traitement communautaire les fils de coton
    non conditionnés pour la vente au détail, de la position 55.05 du Tarif douanier
    commun (code Nimexe 55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48,
    52, 58, 61, 65, 67, 69, 72, 78, 92, 98), originaires de la Corée du Sud et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. Mai 1978, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Baumwollgarne, nicht in Aufmachungen für den Einzelverkauf,
    der Tarifnummer 55.05 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 55.05-13,
    19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67, 68, 72, 78,
    92, 98) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 17. maj 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage garn af bomuld, ikke i detailsalgsoplægninger,
    som henhører under pos. 55.05 (NIMEXE-kode 55.05-13, 19, 21, 25, 27, 29, 33,
    35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67, 69, 72, 78, 92, 98) i den fælles
    toldtarif, har oprindelse i Sydkorea og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 maggio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i filati di cotone non preparati
    per la vendita al minuto della voce 55.05 della tariffa doganale comune (codice
    Nimexe 55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65,
    67, 69, 72, 78, 92, 98), originari della Corea del Sud e messi in libera pratica
    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 mei 1978 waarbij de Franse Republiek
    wordt gemachtigd garens van katoen, niet gereed voor de verkoop in het klein,
    van post 55.05 (NIMEXE-code 55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45,
    46, 48, 52, 58, 61, 65, 67, 69, 72, 78, 92, 98) van het gemeenschappelijk douanetarief,
    van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
