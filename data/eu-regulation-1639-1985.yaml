title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1639/85 of 17 June 1985 fixing, in respect
    of the Skagerrak and the Kattegat, the period falling between 1 July and 29 September
    1985 when fishing for sprat by vessels with an overall length of less than 80
    feet (24,38 m) is prohibited
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1639/85 de la Commission du 17 juin 1985 fixant, en
    ce qui concerne le Skagerrak et le Kattegat, les périodes exactes, entre le 1er
    juillet et le 29 septembre 1985, durant lesquelles la pêche au sprat par des
    bateaux d' une longueur totale inférieure à 80 pieds (24,38 mètres) est interdite
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1639/85 der Kommission vom 17. Juni 1985 zur Festlegung
    der genauen Zeiträume zwischen dem 1. Juli und dem 29. September 1985, in denen
    der Sprottenfang im Skagerrak und Kattegat für Schiffe mit einer Gesamtlänge
    von weniger als 80 Fuß verboten ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1639/85 af 17. juni 1985 om fastsættelse
    for Skagerrak og Kattegat af de perioder mellem den 1. juli og den 29. september
    1985, hvor fiskeri efter brisling fra fartøjer med en længde overalt på under
    80 fod (24,38 m) er forbudt
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1639/85 της Επιτροπής
    της 17ης Ιουνίου 1985 που καθορίζει, όσον αφορά
    το Skagerrak και το Kattegat, τις περιόδους, μεταξύ 1ης
    Ιουλίου και 29 Σεπτεμβρίου 1985, κατά τις οποίες
    απαγορεύεται η αλιεία σαρδελόρεγγας από σκάφη
    με συνολικό μήκος μικρότερο από 80 πόδια (24,38
    m)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1639/85 della Commissione del 17 giugno 1985 che fissa,
    per lo Skagerrak e il Kattegat, i periodi esatti, tra il 1o luglio e il 29 settembre
    1985, in cui la pesca degli spratti è vietata ai pescherecci di lunghezza fuori
    tutto inferiore a 80 piedi (24,38 m)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1639/85 van de Commissie van 17 juni 1985 tot vaststelling,
    voor het Skagerrak en het Kattegat, van de in het tijdsbestek van 1 juli tot en
    met 29 september 1985 begrepen tijdvakken waarin de sprotvisserij voor vaartuigen
    met een lengte over alles van minder dan 80 voet (24,38 meter) is verboden
  type: main
