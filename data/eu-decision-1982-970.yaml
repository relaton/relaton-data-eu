- language: fr
  script: Latn
  content: '82/970/CEE: Décision de la Commission, du 30 décembre 1982, constatant
    que l''importation de l''appareil dénommé "Matec - Pulse Modulator and Receiver,
    model 6600" peut être faite en franchise des droits du tarif douanier commun'
  type: main
