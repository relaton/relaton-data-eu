title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1098/79 of 1 June 1979 re-establishing the
    levying of customs duties on other made up textile articles, falling within heading
    No ex 62.05 and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1098/79 de la Commission, du 1er juin 1979, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, de la position ex 62.05 du tarif douanier commun, originaires
    de la Corée du Sud bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1098/79 der Kommission vom 1. Juni 1979 über die
    Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben
    der Tarifnummer ex 62.05, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1098/79 af 1. juni 1979 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer, henhørende
    under pos. ex 62.05 i den fælles toldtarif, som har oprindelse i Sydkorea og
    omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr.
    3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1098/79 della Commissione, del 1° giugno 1979, che
    ripristina la riscossione dei dazi doganali applicabili agli altri manufatti confezionati
    di tessuti, della voce doganale ex 62.05, originari della Corea del Sud, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1098/79 van de Commissie van 1 juni 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geconfectioneerde
    artikelen van weefsels, van post ex 62.05, van oorsprong uit Zuid-Korea, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3157/78
    van de Raad
  type: main
