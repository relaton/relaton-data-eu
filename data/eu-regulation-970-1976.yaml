title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 970/76 of 27 April 1976 re-establishing
    the levying of customs duties on cycles, not motorized, falling within heading
    No 87.10, originating in Yugoslavia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 970/76 de la Commission, du 27 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux vélocipèdes
    sans moteur, de la position tarifaire 87.10, originaires de la Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 970/76 der Kommission vom 27. April 1976 zur Wiedereinführung
    des Zollsatzes für Fahrräder, ohne Motor, der Tarifnummer 87.10, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17.
    November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 970/76 af 27. april 1976 om genindførelse
    af opkrævning af toldafgifter for cykler uden motor, under position 87.10, som
    har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 970/76 della Commissione, del 27 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai velocipedi senza motore,
    della voce doganale n. 87.10 originari della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre
    1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 970/76 van de Commissie van 27 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op rijwielen
    zonder motor, van post 87.10, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
