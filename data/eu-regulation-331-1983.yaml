title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 331/83 of 9 February 1983 on a decision
    to make no award in respect of the 22nd partial invitation to tender for raw sugar
    issued in connection with the principal standing invitation to tender referred
    to in Regulation (EEC) No 2013/82
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 331/83 de la Commission, du 9 février 1983, portant
    décision de ne pas donner suite à la vingt-deuxième adjudication partielle
    de sucre brut effectuée dans le cadre de l'adjudication permanente principale
    visée au règlement (CEE) n 2013/82
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 331/83 der Kommission vom 9. Februar 1983 über die
    Entscheidung, der im Rahmen der in der Verordnung (EWG) Nr. 2013/82 genannten
    Hauptdauerausschreibung durchgeführten 22. Teilausschreibung für Rohzucker nicht
    stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 331/83 af 9. februar 1983 om ikke at
    gennemføre den 22. del-licitation for råsukker, der er afholdt inden for rammerne
    af den løbende tillægslicitation omhandlet i forordning (EØF) nr. 2013/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 331/83 της Επιτροπής
