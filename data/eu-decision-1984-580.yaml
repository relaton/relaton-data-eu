title:
- language: en
  script: Latn
  content: '84/580/EEC: Commission Decision of 19 November 1984 repealing Commission
    Decision 83/435/EEC and establishing that the apparatus described as ''Theta -
    Quench and Deformation Dilatometer, model Dilatronic IIIS'' may be imported free
    of import duties'
  type: main
- language: fr
  script: Latn
  content: '84/580/CEE: Décision de la Commission du 19 novembre 1984 abrogeant la
    décision 83/435/CEE de la Commission et constatant que l''appareil dénommé
    "THETA - Quench and Deformation Dilatometer, model Dilatronic IIIS" peut être
    importé en franchise des droits à l''importation'
  type: main
- language: de
  script: Latn
  content: '84/580/EWG: Entscheidung der Kommission vom 19. November 1984, mit der
    die Entscheidung 83/435/EWG der Kommission aufgehoben und festgestellt wird, daß
    das Gerät ,,Theta - Quench and Deformation Dilatometer, Model Dilatronic IIIS"
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '84/580/EØF: Kommissionens beslutning af 19. november 1984 om ophævelse
    af Kommissionens beslutning 83/435/EØF og om fastslåelse af, at indførsel af
    apparatet "Theta - Quench and Deformation Dilatometer, model Dilatronic IIIS"
    kan ske med fritagelse for told'
  type: main
- language: el
  script: Grek
  content: '84/580/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Νοεμβρίου 1984 για την κατάργηση της απόφασης
    83/435/ΕΟΚ της Επιτροπής και για τη διαπίστωση
    ότι η συσκευή με την ονομασία «Theta — Quench and deformation
    Dilatometer, model Dilatronic III S» δύναται να εισαχθεί με
    ατέλεια εισαγωγικών δασμών'
  type: main
- language: it
  script: Latn
  content: '84/580/CEE: Decisione della Commissione del 19 novembre 1984 che abroga
    la decisione 83/435/CEE della Commissione e constata che l''apparecchio denominato
    "Theta - Quench and Deformation Dilatometer, model Dilatronic III S" può essere
    importato in franchigia dai dazi all''importazione'
  type: main
- language: nl
  script: Latn
  content: '84/580/EEG: Beschikking van de Commissie van 19 november 1984 houdende
    intrekking van Beschikking 83/435/EEG van de Commissie en waarbij wordt vastgesteld
    dat het apparaat genaamd ,,THETA - Quench and Deformation Dilatometer, model Dilatronic
    IIIS" met vrijstelling van invoerrechten mag worden ingevoerd'
