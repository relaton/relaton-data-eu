  content: Commission Regulation (EEC) No 3945/89 of 20 December 1989 fixing certain
    indicative ceilings and certain additional detailed rules for the application
    of the supplementary trade mechanism to fruit and vegetables as regards broad-leaf
    endives
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 3945/89 de la Commission, du 20 décembre 1989, fixant
