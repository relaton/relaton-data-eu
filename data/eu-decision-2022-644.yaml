id: EUDecision2022644
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/644 of 12 April 2022 on the position to be adopted
    on behalf of the European Union within the International Maritime Organization’s
    Maritime Safety Committee during its 105th session and within the International
    Maritime Organization’s Facilitation Committee during its 46th session as regards
    the adoption of amendments to the resolutions on performance standards in relation
    to equipment used in the Global Maritime Distress and Safety System and of amendments
    to the Annex to the Convention on Facilitation of International Maritime Traffic
    (FAL)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/644 du Conseil du 12 avril 2022 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité de la sécurité
    maritime de l’Organisation maritime internationale lors de sa 105e session et
    au sein du comité de la simplification des formalités de l’Organisation maritime
    internationale lors de sa 46e session, en ce qui concerne l’adoption de modifications
    des résolutions concernant les normes de performance relatives aux équipements
    utilisés dans le système mondial de détresse et de sécurité en mer et de
    modifications de l’annexe de la convention visant à faciliter le trafic maritime
    international (convention FAL)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/644 des Rates vom 12. April 2022 über den Standpunkt,
    der im Namen der Europäischen Union im Schiffssicherheitsausschuss der Internationalen
    Seeschifffahrtsorganisation auf seiner 105. Tagung und im Ausschuss zur Erleichterung
    der Formalitäten der Internationalen Seeschifffahrtsorganisation auf seiner 46.
    Tagung zu der Annahme von Änderungen der Entschließungen über Leistungsanforderungen
    für Ausrüstung, die im Rahmen des weltweiten Seenot- und Sicherheitsfunksystems
    eingesetzt wird, sowie von Änderungen des Anhangs des Übereinkommens zur Erleichterung
    des internationalen Seeverkehrs (FAL-Übereinkommen) zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/644 на Съвета от 12 април 2022
    година за позицията, която трябва да се заеме
    от името на Европейския съюз в рамките на Комитета
    по морска безопасност към Международната морска
    организация на 105-ата му сесия и в рамките на
    Комитета за улесняване на корабоплаването
    към Международната морска организация на 46-ата
    му сесия по отношение на приемането на изменения
    на резолюциите относно стандартите за експлоатационните
    показатели във връзка с оборудването, използвано
    в Световната морска система за бедствие и безопасност,
    и на изменения на приложението към Конвенцията
    за улесняване на международното морско корабоплаване
    (FAL)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/644 ze dne 12. dubna 2022 o postoji, který
    má být jménem Evropské unie zaujat na 105. zasedání Výboru pro námořní
    bezpečnost Mezinárodní námořní organizace a na 46. zasedání Výboru Mezinárodní
    námořní organizace pro usnadnění formalit, pokud jde o přijetí změn rezolucí
    o výkonnostních normách týkajících se zařízení používaných v rámci
    globálního námořního tísňového a bezpečnostního systému a změn přílohy
    Úmluvy o usnadnění mezinárodní námořní dopravy
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/644 af 12. april 2022 om den holdning, der
    skal indtages på Den Europæiske Unions vegne i Den Internationale Søfartsorganisations
    Komité for Sikkerhed på Søen på dens 105. samling og i Udvalget til Lettelse
    af Samfærdselen under Den Internationale Søfartsorganisation på dets 46. samling
    for så vidt angår vedtagelsen af ændringer af resolutionerne om præstationsnormer
    for udstyr, der anvendes i det globale maritime nød- og sikkerhedssystem, og
    om ændringer af bilaget til konventionen om lettelse af international samfærdsel
    ad søvejen (FAL-konventionen)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2022/644 του Συμβουλίου της 12ης
    Απριλίου 2022 για τη θέση που πρέπει να ληφθεί
    εξ ονόματος της Ευρωπαϊκής Ένωσης στο πλαίσιο
    της Επιτροπής Ναυτικής Ασφάλειας του Διεθνούς
    Ναυτιλιακού Οργανισμού κατά την 105η σύνοδό
    της και στο πλαίσιο της Επιτροπής Διευκολύνσεων
    του Διεθνούς Ναυτιλιακού Οργανισμού κατά την
    46η σύνοδό της όσον αφορά την έκδοση τροποποιήσεων
    των ψηφισμάτων για τα πρότυπα επιδόσεων σχετικά
    με τον εξοπλισμό που χρησιμοποιείται στο παγκόσμιο
    ναυτιλιακό σύστημα κινδύνου και ασφάλειας
    και τροποποιήσεων του παραρτήματος της Σύμβασης
    περί διευκολύνσεως της διεθνούς ναυτιλιακής
    κινήσεως (FAL)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2022/644, 12. aprill 2022, Euroopa Liidu nimel võetava
    seisukoha kohta Rahvusvahelises Mereorganisatsiooni meresõiduohutuse komitees
    selle 105. istungjärgul ja Rahvusvahelise Mereorganisatsiooni mereliikluse hõlbustamise
    komitees selle 46. istungjärgul seoses toimivusstandardeid käsitlevate resolutsioonide,
    mis on seotud ülemaailmses merehäda ja -ohutuse süsteemis kasutatavate seadmetega,
    ning rahvusvahelise mereliikluse hõlbustamise konventsiooni (FAL konventsioon)
    lisa muudatuste vastuvõtmisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2022/644, annettu 12 päivänä huhtikuuta 2022,
    Kansainvälisen merenkulkujärjestön meriturvallisuuskomitean 105. kokouksessa
    ja Kansainvälisen merenkulkujärjestön meriliikenteen helpottamiskomitean 46.
    kokouksessa Euroopan unionin puolesta esitettävästä kannasta maailmanlaajuisessa
    merihätä- ja turvallisuusjärjestelmässä käytettävien laitteiden suorituskykynormeja
    koskeviin päätöslauselmiin tehtävien muutosten hyväksymiseen ja kansainvälisen
    meriliikenteen helpottamista koskevan yleissopimuksen liitteeseen tehtävien muutosten
    hyväksymiseen
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2022/644 ón gComhairle an 12 Aibreán 2022 maidir leis an
    seasamh atá le glacadh thar ceann an Aontais Eorpaigh i gCoiste Muir-Shábháilteachta
    na hEagraíochta Muirí Idirnáisiúnta le linn an 105ú seisiún dá chuid agus
    i gCoiste Éascaíochta na hEagraíochta Muirí Idirnáisiúnta le linn an 46ú
    seisiún dá chuid, a mhéid a bhaineann le leasuithe a ghlacadh ar na rúin maidir
    le caighdeáin feidhmíochta i ndáil le trealamh a úsáidtear sa Chóras Domhanda
    Guaise agus Sábháilteachta Muirí agus le leasuithe a ghlacadh ar an Iarscríbhinn
    a ghabhann leis an gCoinbhinsiún maidir le hÉascú Muirthrácht Idirnáisiúnta
    (FAL)
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/644 od 12. travnja 2022. o stajalištu koje treba
    zauzeti u ime Europske unije u okviru Odbora za pomorsku sigurnost Međunarodne
    pomorske organizacije na njegovoj 105. sjednici i u okviru Odbora za olakšice
    Međunarodne pomorske organizacije na njegovoj 46. sjednici u pogledu donošenja
    izmjena rezolucija o izvedbenim normama u pogledu opreme koja se upotrebljava
    u okviru Svjetskog pomorskog sustava za pogibelj i sigurnost i o donošenju izmjena
    Priloga Konvenciji o olakšicama u međunarodnom pomorskom prometu (FAL)
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/644 határozata (2022. április 12.) a Nemzetközi
    Tengerészeti Szervezet Tengerészeti Biztonsági Bizottságában annak 105. ülésszakán
    és a Nemzetközi Tengerészeti Szervezet Tehermentesítő Bizottságában annak
    46. ülésszakán az általános tengeri vészjelző és biztonsági rendszerben
    használt felszerelésekkel kapcsolatos teljesítményszabványokról szóló
    határozatokat érintő módosítások és a nemzetközi tengeri forgalom könnyítéséről
    szóló egyezmény (FAL) mellékletét érintő módosítások elfogadása tekintetében
    az Európai Unió által képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/644 del Consiglio del 12 aprile 2022 relativa alla
    posizione da adottare a nome dell'Unione europea in sede di comitato per la sicurezza
    marittima dell'Organizzazione marittima internazionale in occasione della sua
    105a sessione e in sede di comitato di facilitazione dell'Organizzazione marittima
    internazionale in occasione della sua 46a sessione per quanto riguarda l'adozione
    di modifiche delle risoluzioni sulle norme di prestazione relative all'equipaggiamento
    utilizzato nel Sistema mondiale di soccorso e sicurezza in mare e alle modifiche
    dell’allegato della convenzione sulla facilitazione del traffico marittimo internazionale
    (FAL)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2022/644 (2022. gada 12. aprīlis) par nostāju, kas
    Eiropas Savienības vārdā jāieņem Starptautiskās Jūrniecības organizācijas
    Kuģošanas drošības komitejas 105. sesijā un Starptautiskās Jūrniecības
    organizācijas Atvieglošanas komitejas 46. sesijā attiecībā uz grozījumu
    pieņemšanu rezolūcijās par veiktspējas standartiem saistībā ar Globālajā
    jūras avāriju un drošības sistēmā lietoto aprīkojumu, un grozījumiem Konvencijas
    par starptautiskās jūras satiksmes atvieglošanu (FAL) pielikumā
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2022/644 2022 m. balandžio 12 d. dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi Tarptautinės jūrų organizacijos
    Jūrų saugumo komitete per jo 105-ąją sesiją ir Tarptautinės jūrų organizacijos
    Sąlygų lengvinimo komitete per jo 46-ąją sesiją, kiek tai susiję su rezoliucijų
    dėl naudojimo charakteristikų standartų, susijusių su įranga, naudojama Globalinėje
    jūrų avarinio ryšio ir saugumo sistemoje, dalinių pakeitimų priėmimu ir
    Konvencijos dėl tarptautinės jūrų laivybos sąlygų lengvinimo (FAL konvencijos)
    priedo dalinių pakeitimų priėmimu
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2022/644 tat-12 ta’ April 2022 dwar il-pożizzjoni
    li għandha tiġi adottata f'isem l-Unjoni Ewropea fi ħdan il-Kumitat tas-Sikurezza
    Marittima tal-Organizzazzjoni Marittima Internazzjonali matul il-105 sessjoni
    tiegħu u fi ħdan il-Kumitat ta’ Faċilitazzjoni tal-Organizzazzjoni Marittima
    Internazzjonali matul is-46 sessjoni tiegħu fir-rigward tal-adozzjoni ta' emendi
    għar-riżoluzzjonijiet dwar l-istandards tal-prestazzjoni relatati mat-tagħmir
    użat fis-Sistema Marittima Globali għall-Periklu u s-Sigurtà u ta’ emendi
    għall-Anness għall-Konvenzjoni dwar il-Faċilitazzjoni tat-Traffiku Marittimu
    Internazzjonali (FAL)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2022/644 van de Raad van 12 april 2022 betreffende het standpunt
    dat namens de Europese Unie moet worden ingenomen in de Maritieme Veiligheidscommissie
    van de Internationale Maritieme Organisatie tijdens de 105e zitting daarvan en
    in de Vereenvoudigingscommissie van de Internationale Maritieme Organisatie tijdens
    de 46e zitting daarvan wat betreft de vaststelling van wijzigingen van de resoluties
    betreffende prestatienormen voor in het wereldwijde maritieme nood- en veiligheidssysteem
    gebruikte uitrusting en van wijzigingen van de bijlage bij het Verdrag inzake
    het vergemakkelijken van het internationale verkeer ter zee (FAL)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/644 z dnia 12 kwietnia 2022 r. w sprawie stanowiska,
    jakie ma być przyjęte w imieniu Unii Europejskiej w ramach Komitetu Bezpieczeństwa
    na Morzu Międzynarodowej Organizacji Morskiej podczas 105. posiedzenia i Komitetu
    Ułatwień Międzynarodowej Organizacji Morskiej podczas 46. posiedzenia w sprawie
    przyjęcia zmian do rezolucji w sprawie standardów eksploatacyjnych dotyczących
    sprzętu używanego w światowym morskim systemie łączności alarmowej i bezpieczeństwa
    oraz odnośnie do zmian w załączniku do Konwencji o ułatwieniu międzynarodowego
    obrotu morskiego (konwencji FAL)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/644 do Conselho de 12 de abril de 2022 relativa à posição
    a tomar, em nome da União Europeia, no âmbito do Comité de Segurança Marítima
    da Organização Marítima Internacional, durante a sua 105.a sessão, e no âmbito
    do Comité de Facilitação da Organização Marítima Internacional, durante
    a sua 46.a sessão, relativamente à adoção de alterações às resoluções
    sobre normas de desempenho para o equipamento usado no Sistema Mundial de Socorro
    e Segurança Marítima, e de alterações ao anexo da Convenção sobre a Facilitação
    do Tráfego Marítimo Internacional (FAL)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/644 a Consiliului din 12 aprilie 2022 privind poziția
    care urmează să fie adoptată, în numele Uniunii Europene, în cadrul Comitetului
    pentru siguranță maritimă al Organizației Maritime Internaționale cu ocazia
    celei de a 105-a sesiuni a acestuia și în cadrul Comitetului de facilitare al
    Organizației Maritime Internaționale cu ocazia celei de a 46-a sesiuni a acestuia,
    în ceea ce privește adoptarea unor modificări ale rezoluțiilor privind standardele
    de performanță în legătură cu echipamentele utilizate în Sistemul mondial
    pentru caz de sinistru și pentru siguranța navigației pe mare și a unor modificări
    ale anexei la Convenția privind facilitarea traficului maritim internațional
    (FAL)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/644 z 12. apríla 2022 o pozícii, ktorá sa
    má v mene Európskej únie prijať vo Výbore Medzinárodnej námornej organizácie
    pre námornú bezpečnosť počas svojho 105. zasadnutia a vo Výbore Medzinárodnej
    námornej organizácie pre uľahčenie medzinárodnej námornej dopravy počas
    svojho 46. zasadnutia, pokiaľ ide o prijatie zmien rezolúcií o výkonnostných
    normách pre zariadenia používané v globálnom námornom núdzovom a bezpečnostnom
    systéme, ako aj prijatie zmien prílohy k Dohovoru o uľahčení medzinárodnej
    námornej dopravy (FAL)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/644 z dne 12. aprila 2022 o stališču, ki se v imenu
    Evropske unije zavzame v Odboru za pomorsko varnost Mednarodne pomorske organizacije
    na 105. zasedanju in v Odboru za olajšave Mednarodne pomorske organizacije na
    46. zasedanju glede sprejetja sprememb resolucij o standardih delovanja opreme,
    ki se uporablja v univerzalnem pomorskem sistemu za varnost in stisko na morju,
    in sprememb priloge h Konvenciji o olajšavah v mednarodnem pomorskem prometu
    (FAL)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/644 del Consejo de 12 de abril de 2022 relativa a la
    posición que debe adoptarse en nombre de la Unión Europea en el Comité de Seguridad
    Marítima de la Organización Marítima Internacional, durante su 105.o período
    de sesiones y en el Comité de Facilitación de la Organización Marítima Internacional,
    durante su 46.o período de sesiones, con respecto a la adopción de enmiendas
    a las resoluciones sobre las normas de funcionamiento de los equipos utilizados
    en el Sistema Mundial de Socorro y Seguridad Marítimos, así como de enmiendas
    al anexo del Convenio para facilitar el tráfico marítimo internacional (FAL)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/644 av den 12 april 2022 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i Internationella sjöfartsorganisationens
    sjösäkerhetskommitté vid dess 105:e möte och i Internationella sjöfartsorganisationens
    kommitté för förenkling av formaliteterna vid dess 46:e möte vad gäller antagandet
    av ändringar av de resolutioner om prestandastandarder för utrustning som används
    i det globala nödsignals- och säkerhetssystemet till sjöss och ändringar av
    bilagan till konventionen om förenkling av formaliteterna i internationell sjöfart
    (FAL-konventionen)
