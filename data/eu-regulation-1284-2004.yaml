    van ovoalbumine, en tot wijziging van Verordening (EG) nr. 1484/95
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1284/2004 z dnia 13 lipca 2004 r. ustalające
