    ainsi que pour l’ovalbumine et modifiant le règlement (CE) n° 1484/95
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1284/2004 der Kommission vom 13. Juli 2004 zur Festsetzung
