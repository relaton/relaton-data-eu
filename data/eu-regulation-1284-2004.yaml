    uova nonché per l’ovoalbumina e che modifica il regolamento (CE) n. 1484/95
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1284/2004 (2004. gada 13. jūlijs), ar ko nosaka
