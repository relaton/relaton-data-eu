title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1284/2004 of 13 July 2004 fixing representative
    prices in the poultrymeat and egg sectors and for egg albumin, and amending Regulation
    (EC) No 1484/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1284/2004 de la Commission du 13 juillet 2004 fixant
