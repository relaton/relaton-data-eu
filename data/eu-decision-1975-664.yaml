---
id: EUDecision1975664
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 7 May 1975 authorizing the Italian Republic not
    to apply Community treatment to woven cotton fabrics other than gauze or terry
    towelling and similar terry fabrics falling within heading No ex 55.09 of the
    Common Customs Tariff, originating in the Republic of Korea, the Islamic Republic
    of Pakistan or Taiwan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/664/CEE: Décision de la Commission, du 7 mai 1975, autorisant la République
    italienne à exclure du traitement communautaire les tissus de coton autres qu''à
    point de gaze ou boucles du genre éponge, écrus, de la position Ex 55.09 du
    Tarif douanier commun, originaires de la République de Corée, de la République
    islamique du Pakistan et de Taiwan, mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 7. Mai 1975, mit der die Italienische Republik
    ermächtigt wird, andere Gewebe aus Baumwolle als rohe Drehergewebe oder Schlingengewebe
    (Frottiergewebe) der Tarifstelle ex 55.09 des Gemeinsamen Zolltarifs mit Ursprung
    in der Republik Korea, der Islamischen Republik Pakistan und Taiwan, die sich
    in den anderen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 7. maj 1975 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage vævede stoffer af bomuld undtagen
    drejervævet stof af bomuld eller håndklædefrotterstof og lignende frotterstof
    af bomuld, ubleget, som henhører under pos. ex 55.09 i den fælles toldtarif,
    har oprindelse i republikken Korea, Den islamitiske republik Pakistan og Taiwan
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 7 maggio 1975, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di cotone diversi
    da quelli a punto di garza o ricci del tipo spugna, greggi, della voce ex 55.09
    della tariffa doganale comune, originari della Repubblica di Corea, della Repubblica
    islamica del Pakistan e di Taiwan, e messi in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 7 mei 1975 waarbij de Italiaanse Republiek
    wordt gemachtigd de weefsels van katoen, andere dan die met gaasbinding of van
    bad- of frotteerstof (lussendoek), ongebleekt, van tariefpost ex 55.09 van het
    gemeenschappelijk douanetarief, van oorsprong uit de Republiek Korea, de Islamitische
    Republiek Pakistan en Taiwan, welke in de overige Lid-Staten in het vrije verkeer
    zijn gebracht, van de communautaire behandeling uit te sluiten
  type: main
