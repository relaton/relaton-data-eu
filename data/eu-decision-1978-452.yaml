type: standard
title:
- language: en
  script: Latn
  content: 'Commission Decision of 3 May 1978 authorizing Ireland not to apply Community
    treatment to certain undergarments, knitted or crocheted, not elastic or rubberized:
    T-shirts of cotton falling within heading No ex 60.04 of the Common Customs Tariff
    (NIMEXE code 60.04-01), originating in Macao and in free circulation in the other
    Member States'
  type: main
- language: fr
  script: Latn
  content: '78/452/CEE: Décision de la Commission, du 3 mai 1978, autorisant l''Irlande
    à exclure du traitement communautaire certains sous-vêtements de bonneterie
    non élastique ni caoutchoutée ("T-shirts" de coton), de la position Ex 60.04
    du Tarif douanier commun (code Nimexe 60.04-01), originaires de Macao et mis en
    libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 3. Mai 1978, mit der Irland ermächtigt
    wird, aus Macau stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche gewisse Unterkleidung aus Gewirken, weder gummielastisch noch kautschutiert:
    T-Shirts aus Baumwolle, der Tarifnummer ex 60.04 (NIMEXE-Kennziffer 60.04-01)
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 3. maj 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage visse underbeklædningsgenstande af trikotage,
    ikke elastisk eller gummeret: T-shirts af bomuld, som henhører under pos. ex
    60.04 (nimexe 60.04-01) i den fælles toldtarif, har oprindelse i Macao, og frit
    kan omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 maggio 1978, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario talune sottovesti a maglia non elastica
    né gommata, T-shirts di cotone, della voce ex 60.04 della tariffa doganale comune
    (Nimexe 60.04-01), originari di Macao e messi in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 3 mei 1978 waarbij Ierland wordt gemachtigd
    bepaalde onderkleding van niet-elastisch of van niet-gegummeerd brei- of haakwerk:
    T-shirts van katoen van post ex 60.04 (NIMEXE 60.04-01) van het gemeenschappelijk
    douanetarief van oorsprong uit Macao en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
