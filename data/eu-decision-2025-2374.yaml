    a opta sesiuni a Reuniunii părților la Convenția de la Aarhus în ceea ce privește
    comunicarea ACCC/C/2015/128 referitoare la accesul la justiție în cazul deciziilor
    privind ajutoarele de stat, comunicarea ACCC/C/2013/96 referitoare la proiectele
    de interes comun, comunicarea ACCC/C/2014/121 referitoare la Directiva 2010/75/UE
