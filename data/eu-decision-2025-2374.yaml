    k spravodlivosti v súvislosti s rozhodnutiami o štátnej pomoci, oznámenie
    ACCC/C/2013/96 týkajúce sa projektov spoločného záujmu, oznámenie ACCC/C/2014/121
    týkajúce sa smernice Európskeho parlamentu a Rady 2010/75/EÚ a oznámenie
