- language: en
  script: Latn
  content: Council Decision (EU) 2025/2374 of 4 November 2025 on the position to be
    taken on behalf of the European Union at the eighth session of the Meeting of
    the Parties to the Aarhus Convention regarding communications ACCC/C/2015/128
    concerning access to justice regarding State aid decisions, ACCC/C/2013/96 concerning
    Projects of Common Interest, ACCC/C/2014/121 concerning Directive 2010/75/EU of
    the European Parliament and of the Council and ACCC/C/2010/54 concerning National
    Energy Action Plans
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/2374 du Conseil du 4 novembre 2025 relative à la position
    à prendre, au nom de l’Union européenne, lors de la huitième session de la
    réunion des parties à la convention d’Aarhus en ce qui concerne la communication
    ACCC/C/2015/128 concernant l’accès à la justice en lien avec les décisions
    en matière d’aides d’État, la communication ACCC/C/2013/96 concernant les
    projets d’intérêt commun, la communication ACCC/C/2014/121 concernant la directive
    2010/75/UE du Parlement européen et du Conseil et la communication ACCC/C/2010/54
    concernant les plans d’action nationaux en matière d’énergies renouvelables
  type: main
- language: de
  script: Latn
