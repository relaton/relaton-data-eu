title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2791/77 of 15 December 1977 laying down
    detailed rules for the granting of subsidies for certain liqueur wines produced
    in the Community and similar to the liqueur wine marketed as 'Cyprus sherry'
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2791/77 de la Commission, du 15 décembre 1977, fixant
    les modalités d' application pour l' octroi d' aide à certains vins de liqueur
    d' origine communautaire similaires au vin de liqueur commercialisé sous la mention
    "Cyprus sherry"
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2791/77 der Kommission vom 15. Dezember 1977 mit Durchführungsbestimmungen
    für die Beihilfen für Likörweine mit Ursprung in der Gemeinschaft, die dem
    unter der Bezeichnung ,,Cyprus Sherry' ' vermarkteten Likörwein gleichartig sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2791/77 af 15. december 1977 om fastsættelse
    af nærmere bestemmelser for ydelse af støtte til visse hedvine med oprindelse
    i Fællesskabet svarende til hedvin, som bringes i omsætning under betegnelsen
    "Cyprus Sherry"
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2791/77 della Commissione, del 15 dicembre 1977, che
    fissa le modalità di applicazione per la concessione di aiuti a taluni vini liquorosi
    di origine comunitaria simili al vino liquoroso commercializzato con la menzione
    "Cyprus sherry"
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2791/77 van de Commissie van 15 december 1977 tot
    vaststelling van de wijze van steunverlening voor bepaalde likeurwijnen van oorsprong
    uit de Gemeenschap die overeenkomen met de onder de benaming ,,Cyprus sherry'
    ' in de handel gebrachte likeurwijn
