title:
- language: en
  script: Latn
  content: '94/451/EC: Commission Decision of 27 June 1994 authorizing the United
    Kingdom to exempt certain transport operations from the application of the provisions
    of Council Regulation (EEC) No 3820/85 on the harmonization of certain social
    legislation relating to road transport and Council Regulation (EEC) No 3821/85
    on recording equipment in road transport (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/451/CE: Décision de la Commission du 27 juin 1994 habilitant le Royaume-Uni
    à dispenser certaines opérations de transport de l''application des dispositions
    du règlement (CEE) n° 3820/85 du Conseil relatif à l''harmonisation de certaines
    dispositions en matière sociale dans le domaine des transports par route et du
    règlement (CEE) n° 3821/85 du Conseil concernant l''appareil de contrôle dans
    le domaine des transports par route (Le texte en langue anglaise est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '94/451/EG: Entscheidung der Kommission vom 27. Juni 1994 durch den das
    Vereinigte Königreich ermächtigt wird, bestimmte Beförderungstätigkeiten von
    der Anwendung der Bestimmungen der Verordnung (EWG) Nr. 3820/85 des Rates über
    die Harmonisierung bestimmter Sozialvorschriften im Straßenverkehr und der Verordnung
    (EWG) Nr. 3821/85 des Rates über das Kontrollgerät im Straßenverkehr zu befreien
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/451/EF: Kommissionens beslutning af 27. juni 1994 om bemyndigelse af
    Det Forenede Kongerige til at undtage nogle former for transport fra anvendelsen
    af forordning (EØF) nr. 3820/85 om harmonisering af visse bestemmelser på det
    sociale område inden for vejtransport og forordning (EØF) nr. 3821/85 om kontrolapparatet
    inden for vejtransport (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '94/451/ΕΚ: Απόφαση της Επιτροπής της 27ης Ιουνίου
    1994 που επιτρέπει στο Ηνωμένο Βασίλειο να χορηγήσει
    για ορισμένες μεταφορές παρέκκλιση από την
    εφαρμογή των διατάξεων του κανονισμού (ΕΟΚ)
    αριθ. 3820/85 του Συμβουλίου σχετικά με την εναρμόνιση
    ορισμένων διατάξεων κοινωνικού χαρακτήρα
    στον τομέα των οδικών μεταφορών και του κανονισμού
    (ΕΟΚ) αριθ. 3821/85 του Συμβουλίου σχετικά με τη
    συσκευή ελέγχου στον τομέα των οδικών μεταφορών
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '94/451/CE: Decisione della Commissione del 27 giugno 1994 che autorizza
    il Regno Unito a dispensare alcune operazioni di trasporto dall''applicazione
    delle disposizioni del regolamento (CEE) n. 3820/85 del Consiglio relativo all''armonizzazione
    di alcune disposizioni in materia sociale nel settore dei trasporti su strada
    e del regolamento (CEE) n. 3821/85 del Consiglio relativo all''apparecchio di
    controllo nel settore dei trasporti su strada (Il testo in lingua inglese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '94/451/EG: Beschikking van de Commissie van 27 juni 1994 tot machtiging
    van het Verenigd Koninkrijk om bepaald vervoer vrij te stellen van de toepassing
    van de bepalingen van Verordening (EEG) nr. 3820/85 van de Raad tot harmonisatie
    van bepaalde voorschriften van sociale aard voor het wegvervoer en Verordening
    (EEG) nr. 3821/85 van de Raad betreffende het controleapparaat in het wegvervoer
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '94/451/CE: Decisão da Comissão de 27 de Junho de 1994 relativa ao pedido
    apresentado pelo Reino Unido à Comissão tendo em vista autorizar este Estado-membro
    a dispensar determinadas operações de transporte do âmbito de aplicação do
    Regulamento (CEE) n° 3820/85 do Conselho, relativo à harmonização de determinadas
    disposições em matéria social no domínio dos transportes rodoviários, e do
    Regulamento (CEE) n° 3821/85 do Conselho, relativo à introdução de um aparelho
