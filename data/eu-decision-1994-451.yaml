  type: main
- language: es
  script: Latn
  content: '94/451/CE: Decisión de la Comisión de 27 de junio de 1994 por la que
    se habilita al Reino Unido a dispensar algunas operaciones de transporte de la
    aplicación de las disposiciones del Reglamento (CEE) n° 3820/85 del Consejo
    relativo a la armonización de determinadas disposiciones en materia social en
    el sector de los transportes por carretera y del Reglamento (CEE) n° 3821/85
    del Consejo relativo al aparato de control en el sector de los transportes por
    carretera (El texto en lengua inglesa es el único auténtico)'
