    29.15 A I des Gemeinsamen Zolltarifs mit Ursprung in China, dem die in der Verordnung
    (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 333/86 af 14. februar 1986 om genindførelse
