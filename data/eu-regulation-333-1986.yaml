title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 333/86 of 14 February 1986 re-establishing
    the levying of customs duties applicable to oxalic acid and its salts and esters
    falling within subheading No 29.15 AI originating in China to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 333/86 de la Commission du 14 février 1986 portant
    rétablissement de la perception des droits de douane applicables au acide oxalique,
    ses sels et ses esters, de la sous-position 29.15 A I du tarif douanier commun,
    originaires de Chine, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3599/85 du Conseil
  type: main
