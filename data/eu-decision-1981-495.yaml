title:
- language: en
  script: Latn
  content: '81/495/EEC: Council Decision of 6 July 1981 amending Decision 76/557/EEC
    regarding the inclusion of certain disaster-stricken communes in Italy among the
    mountain areas within the meaning of Directive 75/268/EEC on mountain and hill
    farming and farming in certain less-favoured areas'
  type: main
- language: fr
  script: Latn
  content: '81/495/CEE: Décision du Conseil, du 6 juillet 1981, modifiant la décision
    76/557/CEE concernant l'' assimilation de certaines communes sinistrées en Italie
    aux zones de montagne au sens de la directive 75/268/CEE sur l'' agriculture de
    montagne et de certaines zones défavorisées'
  type: main
- language: de
  script: Latn
  content: '81/495/EWG: Entscheidung des Rates vom 6. Juli 1981 zur Änderung der
    Entscheidung 76/557/EWG über die Gleichstellung gewisser erdbebengeschädigter
    Gemeinden in Italien mit den Berggebieten im Sinne der Richtlinie 75/268/EWG über
    die Landwirtschaft in Berggebieten und in bestimmten benachteiligten Gebieten'
  type: main
- language: da
  script: Latn
  content: '81/495/EØF: Rådets beslutning af 6. juli 1981 om ændring af beslutning
    76/557/EØF om at ligestille visse katastroferamte kommuner i Italien med bjergområder
    i henhold til direktiv 75/268/EØF om landbrug i bjergområder og i visse ugunstigt
    stillede områder'
  type: main
- language: el
  script: Grek
