title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3033/89 of 9 October 1989 re-establishing
    the levying of customs duties on gelatines and derivatives thereof falling within
    CN code 3503 00 10 originating in Colombia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3033/89 de la Commission du 9 octobre 1989 portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés du code NC 3503 00 10, originaires de Colombie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3033/89 DER KOMMISSION vom 9. Oktober 1989 zur Wiedereinführung
    der Erhebung der Zölle für Gelatine und ihre Derivate des KN-Code 3503 00 10
    mit Ursprung in Kolumbien, dem die in der Verordnung (EWG) Nr. 4257/88 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3033/89 af 9. oktober 1989 om genindførelse
    af opkrævning af told for gelatine og gelatinederivater henhørende under KN-kode
    3503 00 10 og med oprindelse i Colombia, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3033/89 της Επιτροπής
    της 9ης Οκτωβρίου 1989 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ζελατίνες
    και τα παράγωγά τους του κωδικού ΣΟ 3505 00 10, καταγωγής
    Κολομβίας, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 4257/88 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3033/89 DELLA COMMISSIONE del 9 ottobre 1989 che
    ripristina la riscossione dei dazi doganali applicabili alle gelatine e loro derivati
    del codice NC 3503 00 10 originari della Colombia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 4257/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3033/89 VAN DE COMMISSIE van 9 oktober 1989 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gelatine en
    derivaten daarvan, van GN-code 3503 00 10, van oorsprong uit Colombia, waarvoor
    de in Verordening (EEG) nr. 4257/88 van de Raad vermelde tariefpreferenties zijn
    verleend #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3033/89 DA COMISSAO de 9 de Outubro de 1989 que restabelece
