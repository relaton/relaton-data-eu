    do codigo NC 3503 00 10, originarios da Colômbia, beneficiaria das preferências
    pautais previstas pelo Regulamento (CEE) n* 4257/88 do Conselho
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3033/89 DE LA COMISIÓN de 9 de octubre de 1989 relativo
