title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3511/80 of 23 December 1980 derogating in
    respect of the countries of the Association of South East Asian Nations from Articles
    1, 6 and 12 of Commission Regulation (EEC) No 3510/80 of 23 December 1980 on the
    definition of the concept of originating products for purposes of the application
    of tariff preferences granted by the European Economic Community in respect of
    certain products from developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3511/80 de la Commission, du 23 décembre 1980, portant
    dérogation, pour les pays de l' Association des nations de l' Asie du Sud-Est,
    aux articles 1er, 6 et 12 du règlement (CEE) n° 3510/80 de la Commission, du
    23 décembre 1980, relatif à la définition de la notion de produits originaires
    pour l' application de préférences tarifaires accordées par la Communauté
    économique européenne à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3511/80 der Kommission vom 23. Dezember 1980 über
    die zugunsten der Assoziation der südostasiatischen Länder vorgesehene Abweichung
    von den Artikeln 1, 6 und 12 der Verordnung (EWG) Nr. 3510/80 der Kommission vom
    23. Dezember 1980 über die Begriffsbestimmung des Warenursprungs bei der Anwendung
    der von der Europäischen Wirtschaftsgemeinschaft für bestimmte Waren aus Entwicklungsländern
    gewährten Zollpräferenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3511/80 af 23. december 1980 om undtagelse
