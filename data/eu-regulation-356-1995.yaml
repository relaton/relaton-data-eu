    im Bereich der gemeinsamen Handelspolitik zur Ausübung der Rechte der Gemeinschaft
    nach internationalen Handelsregeln, insbesondere den im Rahmen der Welthandelsorganisation
    Vereinbarten Regeln
  type: main
