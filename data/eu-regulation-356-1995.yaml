  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 356/95 del Consiglio del 20 febbraio 1995 che modifica
    il regolamento (CE) n. 3286/94 che stabilisce le procedure Comunitàrie nel settore
    della politica commerciale comune al fine di garantire l'esercizio dei diritti
    della Comunità nell'ambito delle norme commerciali internazionali, in particolare
    di quelle istituite sotto gli auspici dell'Organizzazione mondiale del commercio
    (OMC)
  type: main
