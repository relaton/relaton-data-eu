title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 356/95 of 20 February 1995 amending Regulation
    (EC) No 3286/94 laying down Community procedures in the field of the common commercial
    policy in order to ensure the exercise of the Community's rights under international
    trade rules, in particular those established under the auspices of the World Trade
    Organization (WTO)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 356/95 du Conseil du 20 février 1995 portant modification
    du règlement (CE) n° 3286/94 arrêtant des procédures communautaires en matière
    de politique commerciale commune en vue d'assurer l'exercice par la Communauté
    des droits qui lui sont conférés par les règles du commerce international,
    en particulier celles instituées sous l'égide de l'Organisation mondiale du
    commerce (OMC)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 356/95 des Rates vom 20. Februar 1995 zur Änderung
