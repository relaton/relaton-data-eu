    des catégories 4 (numéro d' ordre 40.0040), 21 (numéro d' ordre 40.0210) et
    37 (numéro d' ordre 40.0370), originaires de l' Indonésie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) nº 3832/90 du Conseil
  type: main
- language: de
  script: Latn
