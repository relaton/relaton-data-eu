  content: Commission Regulation (EEC) No 1590/91 of 12 June 1991 re-establishing
    the levying of customs duties on products of categories 4, 21 and 37 (order Nos
    40.0040, 40.0210 and 40.0370), originating in Indonesia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1590/91 de la Commission, du 12 juin 1991, portant
