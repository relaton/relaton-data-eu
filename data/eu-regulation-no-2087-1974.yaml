- language: en
  script: Latn
  content: Regulation (EEC) No 2087/74 of the Council of 2 August 1974 increasing
    the Community tariff quota opened for 1974 by Regulation (EEC) No 3593/73 for
    certain plywoods of coniferous species falling within heading No ex 44.15 of the
    Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2087/74 du Conseil, du 2 août 1974, portant augmentation
    du volume du contingent tarifaire communautaire ouvert, pour l'année 1974, par
    le règlement (CEE) n° 3593/73, pour certains bois contre- plaqués de conifères
    de la position EX 44.15 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2087/74 des Rates vom 2. August 1974 zur Aufstockung
    des durch die Verordnung (EWG) Nr. 3593/73 für das Jahr 1974 eröffneten Gemeinschaftszollkontingents
    für bestimmtes Sperrholz aus Nadelholz der Tarifnummer ex 44.15 des Gemeinsamen
    Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2087/74 af 2. august 1974 om forhøjelse
