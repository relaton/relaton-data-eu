- language: en
  script: Latn
  content: Commission Decision (EU) 2024/775 of 4 March 2024 on relief from import
    duties and VAT exemption on importation granted for goods to be distributed or
    made available free of charge to persons fleeing Russia’s military aggression
    against Ukraine and to persons in need in Ukraine (notified under document C(2024)
    1333)
  type: main
- language: fr
  script: Latn
