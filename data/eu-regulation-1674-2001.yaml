    da parte degli organismi d'intervento e alla fissazione degli importi correttori,
    delle maggiorazioni e delle detrazioni da applicare, per il periodo di consegna
    all'intervento della campagna 2000/01
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1674/2001 van de Commissie van 21 augustus 2001 tot
    afwĳking van Verordening (EG) nr. 708/98 betreffende de overname van padie door
    de interventiebureaus en houdende vaststelling van de toe te passen correctiebedragen,
