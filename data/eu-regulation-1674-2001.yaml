    korjausmäärien sekä hinnankorotusten ja -alennusten vahvistamisesta annetusta
    asetuksesta (EY) N:o 708/98 poikkeamisesta markkinointivuonna 2000/2001
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1674/2001 della Commissione, del 21 agosto 2001, che
