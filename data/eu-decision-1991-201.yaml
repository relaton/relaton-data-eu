title:
- language: en
  script: Latn
  content: '91/201/EEC: Commission Decision of 11 March 1991 on the establishment
    of the Community support framework for Community structural assistance on the
    improvement of the conditions under which fishery and aquaculture products are
    processed and marketed in Spain (with the exception of the following regions:
    Andalucía, Asturias, Castilla y León, Castilla-La-Mancha, Ceuta y Melilla, Comunidad
    Valencia, Extremadura, Galicia, Canarias, Murcia) (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/201/CEE: Décision de la Commission du 11 mars 1991 concernant l''établissement
    du cadre communautaire d''appui pour les interventions structurelles communautaires
    relatives à l''amélioration des conditions de transformation et de commercialisation
    des produits de la pêche et de l''aquaculture en Espagne (à l''exception des
    régions suivantes: Andalucía, Asturias, Castilla y León, Castilla-La Mancha,
    Ceuta y Melilla, Comunidad Valenciana, Extremadura, Galicia, Canarias, Murcia)
    (Le texte en langue espagnole est le seul faisant foi.)'
  type: main
