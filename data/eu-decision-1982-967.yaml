  script: Latn
  content: '82/967/EEC: Commission Decision of 30 December 1982 establishing that
    the apparatus described as ''Dionex - Ion Chromatograph, model 10'' may be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/967/CEE: Décision de la Commission, du 30 décembre 1982, constatant
    que l''importation de l''appareil dénommé "Dionex - Ion Chromatograph, model
    10" peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
