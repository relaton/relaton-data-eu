title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2338/80 of 8 September 1980 re-establishing
    the levying of customs duties on umbrellas and sunshades, etc., falling within
    heading No 66.01 and originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2338/80 de la Commission, du 8 septembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles, etc., de la position 66.01 du tarif douanier commun, originaires
    des pays en voie de développement bénéficaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2338/80 der Kommission vom 8. September 1980 zur Wiedereinführung
    des Zollsatzes für Regenschirme und Sonnenschirme, einschließlich Stockschirme,
    Schirmzelte und dergleichen, der Tarifnummer 66.01, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2338/80 af 8. september 1980 om genindførelse
    af opkrævning af toldafgifter for paraplyer og parasoller, etc., under pos 66.01,
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2338/80 della Commissione, dell' 8 settembre 1980,
    che ripristina la riscossione dei dazi doganali applicabili agli ombrelli (da
    pioggia e da sole), ecc., della voce 66.01 della tariffa doganale comune, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2338/80 van de Commissie van 8 september 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor paraplu' s en parasols,
    alsmede wandelstokparaplu' s, tuinparasols, parasoltenten en dergelijke van post
    66.01, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
