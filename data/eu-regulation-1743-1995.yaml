  content: COMMISSION REGULATION (EC) No 1743/95 of 17 July 1995 deciding not to accept
    tenders submitted in response to the 140th partial invitation to tender opened
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1743/95 DE LA COMMISSION du 17 juillet 1995 disposant
    de ne pas donner suite aux offres déposées à la suite de la cent quarantième
    adjudication partielle effectuée dans le cadre des mesures générales d'intervention
    conformément au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1743/95 DER KOMMISSION vom 17. Juli 1995 über den
    Beschluß, den zur 140. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1743/95 af 17. juli 1995 om ikke at tage
    den 140. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    i henhold til forordning (EØF) nr. 1627/89 til følge
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1743/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 17ης Ιουλίου 1995 για να μην δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για τον 140ο
    μερικό διαγωνισμό που πραγματοποιείται στο
    πλαίσιο των γενικών μέτρων παρεμβάσεως σύμφωνα
    με τον κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1743/95, annettu 17 päivänä heinäkuuta 1995,
    asetuksessa (ETY) N:o 1627/89 säädettyjen interventiota koskevien yleisten toimenpiteiden
    mukaisesti toteutetun sadannen neljännenkymmenennen osittaisen tarjouskilpailun
    ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1743/95 DELLA COMMISSIONE del 17 luglio 1995 che decide
    di non dare seguito alle offerte presentate per la centoquarantesima gara parziale
    effettuata nel quadro delle misure generali di intervento a norma del regolamento
    (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1743/95 VAN DE COMMISSIE van 17 juli 1995 houdende
    het besluit om geen gevolg te geven aan de offertes voor de 140e deelinschrijving
    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1743/95 DA COMISSÃO de 17 de Julho de 1995 que rejeita
    as propostas apresentadas na sequência do centésimo quadragésimo concurso parcial
    realizado no âmbito das medidas gerais de intervenção em conformidade com o
    Regulamento (CEE) nº 1627/89
  type: main
