  content: Council Regulation (EEC) No 2993/83 of 24 October 1983 again amending Articles
    6 and 17 of the Protocol concerning the definition of the concept of 'originating
    products' and methods of administrative cooperation to the Cooperation Agreement
    between the European Economic Community and the Arab Republic of Egypt
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2993/83 du Conseil du 24 octobre 1983 modifiant une
    nouvelle fois les articles 6 et 17 du protocole relatif à la définition de la
    notion de "produits originaires" et aux méthodes de coopération administrative
    de l'accord de coopération entre la Communauté économique européenne et la
    République Arabe d'Égypte
  type: main
- language: de
  script: Latn
