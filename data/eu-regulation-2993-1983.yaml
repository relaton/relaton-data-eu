    accordo di cooperazione tra la Comunità economica europea e la Repubblica araba
    d' Egitto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2993/83 van de Raad van 24 oktober 1983 tot hernieuwde
