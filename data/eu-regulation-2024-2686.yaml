- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2686 of 17 October 2024 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2022/558 on imports of certain graphite
    electrode systems originating in the People’s Republic of China by imports of
    artificial graphite in blocks or cylinders originating in the People’s Republic
    of China and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2686 de la Commission du 17 octobre
    2024 portant ouverture d’une enquête relative à un éventuel contournement
    des mesures antidumping instituées par le règlement d’exécution (UE) 2022/558
    sur les importations de certains systèmes d’électrodes en graphite originaires
    de la République populaire de Chine par des importations de graphite artificiel
    en blocs ou en cylindres originaires de ce même pays, et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2686 der Kommission vom 17. Oktober
