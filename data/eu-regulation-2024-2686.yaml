    mit der Durchführungsverordnung (EU) 2022/558 der Kommission eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren bestimmter Grafitelektrodensysteme mit Ursprung in der
    Volksrepublik China durch Einfuhren von künstlichem Grafit in Blöcken oder Zylindern
    mit Ursprung in der Volksrepublik China und zur zollamtlichen Erfassung dieser
    Einfuhren
  type: main
