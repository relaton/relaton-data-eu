title:
- language: en
  script: Latn
  content: '2004/624/EC: Commission Decision of 19 August 2004 amending Decision 1999/815/EC
    concerning measures prohibiting the placing on the market of toys and childcare
    articles intended to be placed in the mouth by children under three years of age
    made of soft PVC containing certain phthalates (notified under document number
    C(2004) 3071)'
  type: main
- language: fr
  script: Latn
  content: '2004/624/CE: Décision de la Commission du 19 août 2004 modifiant la
    décision 1999/815/CE concernant des mesures qui interdisent la mise sur le marché
    de jouets et articles de puériculture destinés à être mis en bouche par des
    enfants de moins de trois ans, fabriqués en PVC souple contenant certains phtalates
    [notifiée sous le numéro C(2004) 3071]'
  type: main
- language: de
  script: Latn
  content: '2004/624/EG: Entscheidung der Kommission vom 19. August 2004 zur Änderung
