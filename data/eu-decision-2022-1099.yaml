    izdanih v skladu z Uredbo (EU) 2021/953 Evropskega parlamenta in Sveta, da se
    olajša uveljavljanje pravice do prostega gibanja v Uniji
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1099 de la Comisión de 30 de junio de
