    la libre circulación dentro de la Unión, entre los certificados COVID-19 expedidos
    por el Reino de Baréin y los certificados expedidos de conformidad con el Reglamento
    (UE) 2021/953 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1099 av den 30 juni 2022 om
