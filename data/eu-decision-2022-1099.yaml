    на сертификатите за COVID-19, издадени от Кралство
    Бахрейн, със сертификатите, издадени в съответствие
    с Регламент (ЕС) 2021/953 на Европейския парламент
    и на Съвета, с цел улесняване на упражняването
    на правото на свободно движение в рамките на
    Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1099 ze dne 30. června 2022,
    kterým se za účelem usnadnění práva na volný pohyb v rámci Unie stanoví
    rovnocennost certifikátů týkajících se onemocnění COVID-19 vydaných Královstvím
    Bahrajn a certifikátů vydaných v souladu s nařízením Evropského parlamentu
    a Rady (EU) 2021/953
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1099 af 30. juni 2022
    om ækvivalens mellem de covid-19-certifikater, der udstedes af Kongeriget Bahrain,
    og de certifikater, der udstedes i overensstemmelse med Europa-Parlamentets og
    Rådets forordning (EU) 2021/953, med henblik på at lette udøvelsen af retten
    til fri bevægelighed inden for Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/1099 της Επιτροπής
    της 30ής Ιουνίου 2022 για τη θέσπιση της ισοδυναμίας,
    με σκοπό τη διευκόλυνση του δικαιώματος ελεύθερης
    κυκλοφορίας εντός της Ένωσης, των πιστοποιητικών
    COVID-19 που εκδίδονται από το Βασίλειο του Μπαχρέιν
    με τα πιστοποιητικά που εκδίδονται σύμφωνα
