    de Unie te faciliteren, van door het Koninkrijk Bahrein afgegeven COVID-19-certificaten
    met de overeenkomstig Verordening (EU) 2021/953 van het Europees Parlement en
    de Raad afgegeven certificaten
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1099 z dnia 30 czerwca 2022 r. ustanawiająca
    równoważność, w celu ułatwienia korzystania z prawa do swobodnego przemieszczania
    się w Unii, zaświadczeń COVID-19 wydawanych przez Królestwo Bahrajnu z zaświadczeniami
    wydawanymi zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2021/953
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1099 da Comissão de 30 de junho de 2022
    que estabelece a equivalência, a fim de facilitar o exercício do direito de
    livre circulação na União, dos certificados COVID-19 emitidos pelo Reino do
    Barém com os certificados emitidos em conformidade com o Regulamento (UE) 2021/953
    do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1099 a Comisiei din 30 iunie 2022
    de stabilire, cu scopul de a facilita exercitarea dreptului la liberă circulație
    pe teritoriul Uniunii, a echivalenței certificatelor privind COVID-19 eliberate
    de Regatul Bahrain cu certificatele eliberate în conformitate cu Regulamentul
    (UE) 2021/953 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1099 z 30. júna 2022, ktorým
    sa na účely uľahčenia práva na voľný pohyb v rámci Únie stanovuje rovnocennosť
    potvrdení súvisiacich s ochorením COVID-19 vydávaných Bahrajnským kráľovstvom
    s potvrdeniami vydávanými v súlade s nariadením Európskeho parlamentu a Rady
    (EÚ) 2021/953
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1099 z dne 30. junija 2022 o določitvi
