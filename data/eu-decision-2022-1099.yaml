    unutar Unije, COVID-19 potvrda koje izdaje Kraljevina Bahrein s potvrdama izdanima
    u skladu s Uredbom (EU) 2021/953 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1099 végrehajtási határozata (2022. június 30.)
