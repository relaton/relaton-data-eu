title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1099 of 30 June 2022 establishing
    the equivalence, for the purpose of facilitating the right of free movement within
    the Union, of COVID-19 certificates issued by the Kingdom of Bahrain to the certificates
    issued in accordance with Regulation (EU) 2021/953 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1099 de la Commission du 30 juin 2022
    établissant l’équivalence, aux fins de faciliter l’exercice du droit à
    la libre circulation au sein de l’Union, des certificats COVID-19 délivrés
    par le Royaume de Bahreïn avec les certificats délivrés conformément au règlement
    (UE) 2021/953 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1099 der Kommission vom 30. Juni 2022
    zur Feststellung der Gleichwertigkeit der vom Königreich Bahrain ausgestellten
    COVID-19-Zertifikate mit den nach der Verordnung (EU) 2021/953 des Europäischen
    Parlaments und des Rates ausgestellten Zertifikaten zwecks Erleichterung der Ausübung
    des Rechts auf Freizügigkeit innerhalb der Union
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/1099 на Комисията
