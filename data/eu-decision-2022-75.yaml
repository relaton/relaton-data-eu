    109)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/75 végrehajtási határozata (2022. január 17.)
    az európai területi együttműködési célkitűzés keretében az Európai
    Regionális Fejlesztési Alapból és az Unió külső finanszírozási eszközeiből
    támogatásban részesítendő Interreg programterületek ágak és Interreg programok
    szerint bontott jegyzékének megállapításáról (az értesítés a C(2022)
    109. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/75 della Commissione del 17 gennaio 2022
    che stabilisce l’elenco delle aree dei programmi Interreg destinate a ricevere
    sostegno dal Fondo europeo di sviluppo regionale e dagli strumenti di finanziamento
    esterno dell’Unione, suddivise per componente e per programma Interreg nell’ambito
    dell’obiettivo «Cooperazione territoriale europea» [notificata con il numero
    C(2022) 109]
  type: main
- language: lv
  script: Latn
