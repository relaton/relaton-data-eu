    fra Den Europæiske Fond for Regionaludvikling og Unionens eksterne finansieringsinstrumenter,
    opdelt efter indsatsområde og Interregprogram under målet om europæisk territorialt
    samarbejde (meddelt under nummer C(2022) 109)
  type: main
- language: el
  script: Grek
