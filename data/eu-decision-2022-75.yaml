    uit het Europees Fonds voor regionale ontwikkeling en externe financieringsinstrumenten
    van de Unie, uitgesplitst naar onderdeel en Interreg-programma in het kader van
    de doelstelling “Europese territoriale samenwerking” (Kennisgeving geschied
    onder nummer C(2022) 109)
  type: main
- language: pl
  script: Latn
