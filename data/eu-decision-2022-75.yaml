title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/75 of 17 January 2022 setting
    out the list of Interreg programme areas to receive support from the European
    Regional Development Fund and external financing instruments of the Union, broken
    down by strand and Interreg programme under the European territorial cooperation
    goal (notifed under document C(2022)109)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/75 de la Commission du 17 janvier 2022
    établissant la liste des zones couvertes par le programme Interreg devant bénéficier
    d’un soutien du Fonds européen de développement régional et des instruments
    de financement extérieur de l’Union, ventilées par volet et par programme
    Interreg au titre de l’objectif «Coopération territoriale européenne» [notifiée
    sous le numéro C(2022) 109]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/75 der Kommission vom 17. Januar 2022
    zur Festlegung der Liste der Interreg-Programmgebiete, die aus dem Europäischen
    Fonds für regionale Entwicklung und den Finanzierungsinstrumenten für das auswärtige
    Handeln der Union unterstützt werden sollen, aufgeschlüsselt nach Aktionsbereichen
    und Interreg-Programmen im Rahmen des Ziels „Europäische territoriale Zusammenarbeit“
    (Bekannt gegeben unter Aktenzeichen C(2022) 109)
  type: main
- language: bg
  script: Cyrl
