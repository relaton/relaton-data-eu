    от 17 януари 2022 година за определяне на списъка
    на програмните райони по Interreg, които да получат
    подкрепа от Европейския фонд за регионално
    развитие и инструментите на Съюза за външно
    финансиране, с разбивка по направления и програми
    по Interreg по цел „Европейско териториално сътрудничество“
    (нотифицирано под номер С(2022) 109)
  type: main
- language: cs
  script: Latn
