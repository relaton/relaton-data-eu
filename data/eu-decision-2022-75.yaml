    podpora z Evropského fondu pro regionální rozvoj a nástrojů Unie pro financování
    vnější činnosti, rozčleněný podle složek a programu Interreg v rámci
    cíle Evropská územní spolupráce (oznámeno pod číslem C(2022) 109)
  type: main
- language: da
  script: Latn
