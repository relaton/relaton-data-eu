  content: Règlement (CEE) n° 1812/69 de la Commission, du 12 septembre 1969, modifiant
    le règlement (CEE) n° 1667/69 relatif à certaines mesures à prendre dans le
    secteur du lait et des produits laitiers à la suite de la dévaluation du franc
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1812/69 der Kommission vom 12. September 1969 zur
    Änderung der Verordnung (EWG) Nr. 1667/69 betreffend bestimmte Maßnahmen auf
    dem Sektor Milch und Milcherzeugnisse infolge der Abwertung des französischen
    Franken
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1812/69 della Commissione, del 12 settembre 1969,
    che modifica il regolamento (CEE) n. 1667/69 relativo a talune misure da applicare
    nel settore del latte e dei prodotti lattiero-caseari in seguito alla svalutazione
    del franco francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1812/69 van de Commissie van 12 september 1969 houdende
    wijziging van Verordening (EEG) nr. 1667/69 betreffende ingevolge de devaluatie
    van de Franse frank in de sector melk en zuivelprodukten te nemen maatregelen
