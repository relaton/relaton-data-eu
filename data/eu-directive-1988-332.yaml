title:
- language: en
  script: Latn
  content: Council Directive 88/332/EEC of 13 June 1988 amending certain Directives
    on the marketing of seed and propagating material so as to provide for rules for
    applying the provisions relating to seed and propagating material satisfying less
    stringent requirements
  type: main
- language: fr
  script: Latn
  content: Directive 88/332/CEE du Conseil du 13 juin 1988 modifiant certaines directives
    concernant la commercialisation des semences et plants, en vue de prévoir des
    modalités d'application des dispositions relatives aux semences et plants répondant
    à des exigences réduites
  type: main
- language: de
  script: Latn
  content: Richtlinie 88/332/EWG des Rates vom 13. Juni 1988 zur Änderung bestimmter
    Richtlinien über den Verkehr mit Saat- und Pflanzgut hinsichtlich der Einführung
    von Anwendungsregeln für die Bestimmungen betreffend Saat- und Pflanzgut, das
    minderen Anforderungen entspricht
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 13 юни 1988 година за
    изменение на някои директиви за търговия със
    семена и посадъчен материал, за да се определят
    правила за приложението на разпоредбите относно
    семената и посадъчния материал, който отговаря
    на по-малко строги изисквания
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 13. června 1988, kterou se mění některé směrnice
    o uvádění osiva a sadby na trh, pokud jde o přijímání prováděcích pravidel
    k ustanovením o osivu a sadbě vyhovující méně přísným požadavkům
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 88/332/EØF af 13. juni 1988 om ændring af visse direktiver
    om handel med frø og plantemateriale med henblik på at fastsætte reglerne for
    anvendelsen af bestemmelserne om mindre strenge krav til frø og plantemateriale
  type: main
- language: el
  script: Grek
  content: Οδηγία 88/332/ΕΟΚ του Συμβουλίου της 13ης Ιουνίου
    1988 που τροποποιεί ορισμένες οδηγίες σχετικά
    με την εμπορία σπόρων προς σπορά και φυτών
    προς φύτευση προκειμένου να προβλεφθούν λεπτομέρειες
    εφαρμογής των διατάξεων που αφορούν τους σπόρους
    προς σπορά και τα φυτά προς φύτευση που πληρούν
    λιγότερο αυστηρούς όρους
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 13. juuni 1988, millega muudetakse teatud seemne ja
    paljundusmaterjali turustamist reguleerivaid direktiive, sätestamaks eeskirjad
    vähem rangetele nõuetele vastava seemne ja paljundusmaterjali kohta käivate
    sätete kohaldamiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 88/332/ETY, annettu 13 päivänä kesäkuuta 1988,
    tiettyjen siementen ja lisäysaineiston pitämisestä kaupan annettujen direktiivien
    muuttamisesta lievemmät vaatimukset täyttäviä siemeniä ja lisäysaineistoa
    koskevien säännösten soveltamissääntöjen antamiseksi
  type: main
- language: hr
  script: Latn
  content: '88/332/EEZ: Direktiva Vijeća od 13. lipnja 1988. o izmjeni određenih
    direktiva o stavljanju na tržište sjemena i reprodukcijskog materijala kako
    bi se utvrdila pravila za primjenu odredbi o sjemenu i reprodukcijskom materijalu
    koji udovoljavaju blažim zahtjevima'
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1988. június 13.) az alacsonyabb követelményeknek
    megfelelő vetőmagvakra és szaporítóanyagokra vonatkozó rendelkezések alkalmazási
    szabályainak bevezetésére tekintettel a vetőmagvak és szaporítóanyagok
    forgalmazásával kapcsolatos egyes irányelvek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 88/332/CEE del Consiglio del 13 giugno 1988 che modifica alcune
    direttive relative alla commercializzazione delle sementi e dei materiali di moltiplicazione,
    al fine di istituire modalità d'applicazione delle disposizioni concernenti le
    sementi ed i materiali di moltiplicazione rispondenti a requisiti ridotti
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1988. gada 13. jūnijs), kas groza noteiktas direktīvas
    par sēklu un pavairošanas materiāla tirdzniecību, nosakot normas to noteikumu
    piemērošanai sēklām un pavairošanas materiālam, kas atbilst mazāk stingrām
    prasībām
  type: main
- language: lt
  script: Latn
  content: 1988 m. birželio 13 d. Tarybos Direktyva iš dalies pakeičianti tam tikras
    direktyvas dėl prekybos sėkla ir dauginamąja medžiaga, siekiant numatyti nuostatų,
    susijusių su ne tokius griežtus reikalavimus atitinkančia sėkla ir dauginamąja
    medžiaga, taikymo taisykles
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill tat-13 ta’ Ġunju 1988 li temenda ċerta Direttivi
    dwar il-kummerċ taż-żerriegħa u l-materjali tal-propagazzjoni biex tipprovdi
    għal regoli għall-applikazzjoni tad-disposizzjonijiet rigward iż-żerriegħa
    u l-materjali tal-propagazzjoni li jissodisfaw ħtiġiet anqas stretti
  type: main
- language: nl
  script: Latn
  content: Richtlijn 88/332/EEG van de Raad van 13 juni 1988 tot wijziging van een
    aantal Richtlijnen betreffende het in de handel brengen van zaaizaad en pootgoed,
    ten einde te voorzien in toepassingsbepalingen voor de voorschriften inzake zaaizaad
    en pootgoed dat aan minder strenge eisen voldoet
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 13 czerwca 1988 r. zmieniająca niektóre dyrektywy
    w sprawie obrotu materiałem siewnym i materiałem rozmnożeniowym w celu ustalenia
    zasad stosowania przepisów odnoszących się do materiału siewnego i materiału
    rozmnożeniowego spełniających mniej surowe wymagania
  type: main
- language: pt
  script: Latn
  content: Directiva 88/332/CEE do Conselho de 13 de Junho de 1988 que altera determinadas
    directivas relativas à comercialização de sementes e propágulos de modo a
    estabelecer regras de execução para as disposições relativas às sementes
    e propágulos que satisfaçam exigências reduzidas
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 13 iunie 1988 de modificare a unor directive
    privind comercializarea semințelor și a materialului de înmulțire astfel încât
    să se prevadă norme de aplicare a dispozițiilor referitoare la semințele și
    materialul de înmulțire care satisfac cerințe mai puțin stringente
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 13. júna 1988, ktorou sa menia a dopĺňajú určité
    smernice o obchode s osivom a množiteľským materiálom s cieľom stanoviť
    pravidlá uplatňovania ustanovení týkajúcich sa osiva a množiteľského materiálu
    spĺňajúceho menej prísne požiadavky
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 13. junija 1988 o spremembi nekaterih direktiv o
    trženju semen in razmnoževalnega materiala, s čimer se določi pravila za uporabo
    določb v zvezi s semeni in razmnoževalnim materialom, ki izpolnjujejo manj stroge
    zahteve
  type: main
- language: es
  script: Latn
  content: Directiva 88/332/CEE del Consejo de 13 de junio de 1988 por la que se modifican
    determinadas Directivas relativas a la comercialización de semillas y plantones,
    a fin de establecer normas de desarrollo de las disposiciones relativas a semillas
    y plantones que respondan a requisitos reducidos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 88/332/EEG av den 13 juni 1988 om ändring av vissa direktiv
    om saluföring av utsäde och uppförökningsmaterial, i syfte att anta bestämmelser
    om regler för tillämpning av de bestämmelser avseende utsäde och uppförökningsmaterial
    som uppfyller mindre strikta krav
  type: main
