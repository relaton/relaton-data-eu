title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 20/81 of 1 January 1981 fixing, for the
    period from 1 January to 15 July 1981, the minimum purchase price applicable in
    Greece for oranges delivered for industrial processing and the financial compensation
    to be paid after processing
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 20/81 de la Commission, du 1er janvier 1981, fixant,
    pour la période du 1er janvier au 15 juillet 1981, le prix d' achat minimal des
    oranges livrées à l' industrie et le montant de la compensation financière
    après transformation de ces oranges applicables en Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 20/81 der Kommission vom 1. Januar 1981 zur Festsetzung
    des Mindestankaufspreises für an die Industrie gelieferte Apfelsinen und des
    finanziellen Ausgleichs nach deren Verarbeitung, die für den Zeitraum vom 1.
    Januar bis zum 15. Juli 1981 in Griechenland anwendbar sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 20/81 af 1. januar 1981 om fastsættelse
    for perioden fra den 1. januar til den 15. juli 1981 af den minimumskøbspris
    for appelsiner leveret til industrien og det udligningstilskud efter forarbejdning
    af disse appelsiner, som skal gælde i Grækenland
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 20/81 της Επιτροπής
    της 1ης Ιανουαρίου 1981 περί καθορισμού, για την
    περίοδο από την 1η Ιανουαρίου έως την 15η Ιουλίου
    1981, της ελάχιστης τιμής αγοράς των πορτοκαλιών
    που παραδίδονται στη βιομηχανία και του ποσού
    της χρηματικής αντισταθμίσεως μετά τη μεταποίηση
    των πορτοκαλιών αυτών οι οποίες εφαρμόζονται
    στην Ελλάδα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 20/81 della Commissione, del 1° gennaio 1981, che
    fissa, per il periodo dal 1° gennaio al 15 Iuglio 1981, il prezzo minimo d' acquisto
    delle arance consegnate all' industria e l' importo della compensazione finanziaria
    per la loro trasformazione applicabili in Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 20/81 van de Commissie van 1 januari 1981 tot vaststelling,
    voor het tijdvak van 1 januari tot en met 15 juli 1981, van de minimumprijs voor
    sinaasappelen bij levering aan de industrie, en het bedrag van de financiële
    compensatie bij de verwerking hiervan, die in Griekenland moeten worden toegepast
