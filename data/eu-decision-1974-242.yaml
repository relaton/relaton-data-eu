id: EUDecision1974242
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 April 1974 authorizing the Italian Republic to
    permit the marketing of 'certified seed of the second generation' of the varieties
    of rice 'Romeo', 'Rosa Marchetti' and 'Vialone nano', satisfying less stringent
    requirements, for a period which expires on 30 June 1974
  type: main
- language: fr
  script: Latn
  content: Décision 74/242/CEE de la Commission, du 22 avril 1974, autorisant la
    République italienne à admettre, pour une période expirant le 30 juin 1974,
    à la commercialisation des "semences certifiées de la deuxième reproduction"
    de riz des variétés "Rosa marchetti", "Romeo" et "Vialone nano", soumises à
    des exigences réduites
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. April 1974 zur Ermächtigung der Italienischen
    Republik, für einen Zeitraum, der am 30. Juni 1974 ausläuft, "Zertifiziertes
    Saatgut der zweiten Vermehrung" von Reis der Sorten "Rosa Marchetti", "Romeo"
    und "Vialone nano" mit minderen Anforderungen zum Verkehr zuzulassen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. april 1974 om bemyndigelse af Den italienske
    Republik til at tillade, at »certificeret sædekorn af anden generation«, som
    opfylder mindre strenge krav, af rissorterne »Romeo«, »Rosa Marchetti« og
    »Vialone nano« bringes i handelen i et tidsrum, der udløber den 30. juni 1974
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 aprile 1974, che autorizza la Repubblica
    italiana ad ammettere, per un periodo che scade il 30 giugno 1974, la commercializzazione
    di «sementi certificate» della seconda riproduzione di riso delle varietà «Romeo»,
    «Rosa Marchetti» e «Vialone nano», soggette a requisiti ridotti
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 april 1974 tot machtiging van de Italiaanse
    Republiek om voor een periode eindigend op 30 juni 1974 "gecertificeerd zaad van
    de tweede vermeerdering" van rijst van de rassen "Rosa Marchetti", "Romeo" en
    "Vialone nano", waaraan minder strenge eisen zijn gesteld, tot de handel toe te
    laten
  type: main
