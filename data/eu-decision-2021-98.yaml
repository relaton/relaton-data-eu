title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/98 of 28 January 2021 not approving
    esbiothrin as an existing active substance for use in biocidal products of product-type
    18
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/98 de la Commission du 28 janvier 2021
    refusant l’approbation de l’esbiothrine en tant que substance active existante
    destinée à être utilisée dans les produits biocides relevant du type de produits
    18
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/98 der Kommission vom 28. Januar 2021
    zur Nichtgenehmigung von Esbiothrin als alten Wirkstoff zur Verwendung in Biozidprodukten
    der Produktart 18
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/98 на Комисията
    от 28 януари 2021 година за неодобряване на есбиотрин
    като съществуващо активно вещество за употреба
    в биоциди от продуктов тип 18
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/98, ze dne 28. ledna 2021 o neschválení
    esbiothrinu jako stávající účinné látky pro použití v biocidních přípravcích
    typu 18
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/98 af 28. januar 2021
    om ikke at godkende esbiothrin som et eksisterende aktivstof til anvendelse i
    biocidholdige produkter af produkttype 18
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/98 της Επιτροπής
    της 28ης Ιανουαρίου 2021 για τη μη έγκριση της
    εσβιοθρίνης ως υπάρχουσας δραστικής ουσίας
    για χρήση σε βιοκτόνα του τύπου προϊόντων 18
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/98, 28. jaanuar 2021, millega jäetakse
    heaks kiitmata olemasoleva toimeaine esbiotriini kasutamine tooteliiki 18 kuuluvates
    biotsiidides
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/98, annettu 28 päivänä
    tammikuuta 2021, esbiotriinin hyväksymättä jättämisestä valmisteryhmään
    18 kuuluvissa biosidivalmisteissa käytettävänä vanhana tehoaineena
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2021/98 ón gCoimisiún an 28 Eanáir 2021
    gan eisbitrin a fhormheas mar shubstaint ghníomhach atá ann cheana lena húsáid
    i dtáirgí bithicídeacha de chineál táirge 18
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/98 оd 28. siječnja 2021. o neodobravanju
    esbiotrina kao postojeće aktivne tvari za uporabu u biocidnim proizvodima vrste
    18
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/98 végrehajtási határozata (2021. január 28.)
    az esbiotrin létező hatóanyag 18. terméktípusba tartozó biocid termékekben
    történő felhasználásának elutasításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/98 della Commissione del 28 gennaio 2021
    che non approva l’esbiotrina come principio attivo esistente ai fini del suo
    uso nei biocidi del tipo di prodotto 18
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/98 (2021. gada 28. janvāris),
    ar ko esbiotrīnu neapstiprina par 18. produkta veida biocīdos lietojamu esošu
    aktīvo vielu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/98 2021 m. sausio 28 d. kuriuo
    esbiotrinas patvirtinamas kaip esama veiklioji medžiaga 18-o tipo biocidiniams
    produktams gaminti
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/98 tat-28
    ta’ Jannar 2021 li ma tapprovax l-esbiotrin bħala sustanza attiva eżistenti
    għall-użu fil-prodotti bijoċidali tat-tip ta’ prodott 18
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/98 van de Commissie van 28 januari 2021 tot
    niet-goedkeuring van esbiothrin als bestaande werkzame stof voor gebruik in biociden
    van de productsoort 18
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/98 z dnia 28 stycznia 2021 r. w sprawie
    niezatwierdzenia esbiotryny jako istniejącej substancji czynnej do stosowania
    w produktach biobójczych należących do grupy produktowej 18
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/98 da Comissão de 28 de janeiro de 2021
    relativa à não aprovação da esbiotrina como substância ativa existente para
    utilização em produtos biocidas do tipo 18
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/98 a Comisiei din 28 ianuarie
    2021 de neaprobare a substanței esbiotrin ca substanță activă existentă destinată
    utilizării în produsele biocide din tipul de produs 18
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/98 z 28. januára 2021, ktorým
    sa neschvaľuje esbiotrín ako existujúca účinná látka na používanie v
    biocídnych výrobkoch typu 18
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/98 z dne 28. januarja 2021 o neodobritvi
    esbiotrina kot obstoječe aktivne snovi za uporabo v biocidnih proizvodih 18.
    vrste proizvodov
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/98 de la Comisión de 28 de enero de
    2021 por la que no se aprueba la esbiotrina como sustancia activa existente para
    su uso en biocidas del tipo 18
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/98 av den 28 januari 2021 om
    att inte godkänna esbiotrin som existerande verksamt ämne för användning i
    biocidprodukter i produkttyp 18
  type: main
