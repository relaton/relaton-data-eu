title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1960/91 of 21 June 1991 laying down detailed
    rules for the application of Article 43 of Council Regulation (EEC) No 4028/86
    as regards Community assistance granted in the form of interest rate reductions
    or contributions to guarantee funds
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1960/91 DE LA COMMISSION du 21 juin 1991 fixant les
    modalités d'' application des dispositions de l'' article 43 du règlement (CEE)
    no 4028/86 du Conseil en ce qui concerne le concours communautaire octroyé sous
    forme de bonification d'' intérêts ou de contribution à des fonds de garantie
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1960/91 DER KOMMISSION vom 21. Juni 1991 mit Durchführungsbestimmungen
    zu Artikel 43 der Verordnung (EWG) Nr. 4028/86 des Rates hinsichtlich der Gemeinschaftszuschüsse
    in Form von Zinsvergütungen oder Beiträgen zu Garantiefonds #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1960/91 af 21. juni 1991 om gennemførelsesbestemmelser
    til artikel 43 i Rådets forordning (EØF) nr. 4028/86 for så vidt angår den
    fællesskabsstøtte, der ydes i form af rentegodtgørelse eller kapitaltilførsel
    til garantifonde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1960/91 της Επιτροπής
    της 21ης Ιουνίου 1991 για τον καθορισμό των λεπτομερειών
    εφαρμογής των διατάξεων του άρθρου 43 του κανονισμού
    (ΕΟΚ) αριθ. 4028/86 του Συμβουλίου όσον αφορά την
    κοινοτική συνδρομή που χορηγείται υπό μορφή
    επιδοτήσεων επιτοκίου ή εισφοράς σε ταμεία
    εγγυήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) n. 1960/91 DELLA COMMISSIONE del 21 giugno 1991 che
    fissa le modalità di applicazione dell'' articolo 43 del regolamento (CEE) n.
    4028/86 per quanto riguarda il contributo comunitario consistente in un abbuono
    d'' interessi o in una sovvenzione a favore di fondi di garanzia #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1960/91 VAN DE COMMISSIE van 21 juni 1991 tot vaststelling
    van bepalingen ter uitvoering van artikel 43 van Verordening (EEG) nr. 4028/86
    van de Raad wat de verlening van communautaire financiële bijstand in de vorm
    van rentesubsidies of kapitaalbijdragen voor garantiefondsen betreft #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1960/91 DA COMISSÃO de 21 de Junho de 1991 que estabelece
    as normas de execução do disposto no artigo 43o do Regulamento (CEE) no 4028/86
    do Conselho no que diz respeito à contribuição comunitária concedida sob a
    forma de bonificação de juros ou de contribuição para fundos de garantia #'
  type: main
- language: es
