title:
- language: en
  script: Latn
  content: Council Directive 1999/20/EC of 22 March 1999 amending Directives 70/524/EEC
    concerning additives in feedingstuffs, 82/471/EEC concerning certain products
    used in animal nutrition, 95/53/EC fixing the principles governing the organisation
    of official inspections in the field of animal nutrition and 95/69/EC laying down
    the conditions and arrangements for approving and registering certain establishments
    and intermediaries operating in the animal feed sector
  type: main
- language: fr
  script: Latn
  content: Directive 1999/20/CE du Conseil du 22 mars 1999 modifiant les directives
    70/524/CEE concernant les additifs dans l'alimentation des animaux, 82/471/CEE
    concernant certains produits utilisés dans l'alimentation des animaux, 95/53/CE
    fixant les principes relatifs à l'organisation des contrôles officiels dans
    le domaine de l'alimentation animale et 95/69/CE établissant les conditions et
    modalités applicables à l'agrément et à l'enregistrement de certains établissements
    et intermédiaires dans le secteur de l'alimentation animale
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/20/EG des Rates vom 22. März 1999 zur Änderung der Richtlinien
    70/524/EWG über Zusatzstoffe in der Tierernährung, 82/471/EWG über bestimmte
    Erzeugnisse für die Tierernährung, 95/53/EG mit Grundregeln für die Durchführung
    der amtlichen Futtermittelkontrollen und 95/69/EG zur Festlegung der Bedingungen
    und Einzelheiten für die Zulassung und Registrierung bestimmter Betriebe und
    zwischengeschalteter Personen des Futtermittelsektors
  type: main
- language: bg
  script: Cyrl
  content: Директива 1999/20/ЕО на Съвета от 22 март 1999
