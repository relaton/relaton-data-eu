    относно някои продукти, използвани при храненето
    на животните, 95/53/ЕО относно определяне на принципите
    за организацията на официалния контрол в областта
    на храненето на животните, и 95/69/ЕО за определяне
    на условията и режима за одобрение и регистрация
    на някои предприятия и посредници в отрасъла
    за производство на фуражи
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 1999/20/ES ze dne 22. března 1999, kterou se mění směrnice
    70/524/EHS o doplňkových látkách v krmivech, 82/471/EHS o určitých produktech
    používaných k výživě zvířat, 95/53/ES, kterou se stanoví zásady organizace
    úředních kontrol v oblasti výživy zvířat a 95/69/ES, kterou se stanoví
    podmínky a postupy pro schvalování a registraci některých provozoven a dodavatelů
    působících v krmivářském odvětví
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 1999/20/EF af 22. marts 1999 om ændring af direktiv 70/524/EØF
    om tilsætningsstoffer til foderstoffer, direktiv 82/471/EØF om visse produkter,
    der anvendes i foderstoffer, direktiv 95/53/EF om principperne for tilrettelæggelse
