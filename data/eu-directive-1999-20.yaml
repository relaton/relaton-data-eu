    u hranidbi životinja, 95/53/EZ o određivanju načela organizacije službenih
    kontrola u području hranidbe životinja i 95/69/EZ o utvrđivanju uvjeta i mjera
    za odobravanje i registraciju određenih poduzeća i posrednika koji posluju u
    sektoru hrane za životinje
  type: main
- language: hu
  script: Latn
  content: A Tanács 1999/20/EK irányelve (1999. március 22.) a takarmány-adalékanyagokról
    szóló 70/524/EGK, a takarmányozási célra felhasznált egyes termékekről
    szóló 82/471/EGK, a takarmányozás hatósági ellenőrzésének megszervezésére
    irányadó elvek megállapításáról szóló 95/53/EK, valamint a takarmányozási
    ágazatban működő egyes létesítmények és közvetítők engedélyezésére
    és nyilvántartására vonatkozó feltételek és szabályok megállapításáról
    szóló 95/69/EK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/20/CE del Consiglio del 22 marzo 1999 che modifica le direttive
    70/524/CEE relativa agli additivi nell'alimentazione degli animali, 82/471/CEE
    relativa a taluni prodotti impiegati nell'alimentazione degli animali, 95/53/CE
    che fissa i principi relativi all'organizzazione dei controlli ufficiali nel settore
    dell'alimentazione animale e 95/69/CE che fissa le condizioni e le modalità per
    il riconoscimento e la registrazione di taluni stabilimenti e intermediari operanti
    nel settore dell'alimentazione degli animali
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 1999/20/EK, (1999. gada 22. marts), ar kuru groza Direktīvas
    70/524/EEK par barības piedevām, 82/471/EEK par dažiem produktiem, ko izmanto
    dzīvnieku ēdināšanā, 95/53/EK, ar ko nosaka principus, kuri reglamentē oficiālo
    pārbaužu organizēšanu dzīvnieku ēdināšanas jomā, un 95/69/EK, ar ko paredz
    ar ko paredz noteiktu uzņēmumu un starpnieku, kas darbojas dzīvnieku barības
    nozarē, apstiprināšanas un reģistrācijas nosacījumus un kārtību
  type: main
- language: lt
  script: Latn
  content: 1999 m. kovo 22 d. Tarybos direktyva 1999/20/EB, iš dalies keičianti
    Direktyvas 70/524/EEB dėl pašarų priedų, 82/471/EEB dėl tam tikrų produktų,
    naudojamų gyvūnams šerti, 95/53/EB, nustatančią principus, reglamentuojančius
    gyvūnų mitybos srityje atliekamų oficialių patikrinimų organizavimą, ir
    95/69/EB, nustatančią reikalavimus ir priemones, taikomas patvirtinant bei įregistruojant
    kai kurias įmones bei tarpininkus, veikiančius gyvūnų maitinimo sektoriuje
  type: main
- language: mt
  script: Latn
