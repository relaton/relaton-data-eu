  content: Neuvoston direktiivi 1999/20/EY, annettu 22 päivänä maaliskuuta 1999,
    rehujen lisäaineista annetun direktiivin 70/524/ETY, tietyistä eläinten ruokinnassa
    käytetyistä tuotteista annetun direktiivin 82/471/ETY, rehujen virallisen valvonnan
    järjestämistä koskevista periaatteista annetun direktiivin 95/53/EY ja tiettyjen
    rehualan tuotantolaitosten ja välittäjien hyväksymis- ja rekisteröintimenettelyssä
    sovellettavista vaatimuksista ja yksityiskohtaisista säännöistä annetun direktiivin
    95/69/EY muuttamisesta
  type: main
