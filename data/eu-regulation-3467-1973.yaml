  content: Regulation (EEC) No 3467/73 of the Council of 17 December 1973 on the temporary
    suspension of the autonomous Common Customs Tariff duty for mechanically propelled
    aircraft of an unladen weight exceeding 15 000 kg falling within subheading No
    ex 88.02 B II c)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3467/73 du Conseil, du 17 décembre 1973, portant
    suspension temporaire du droit autonome du tarif douanier commun pour les avions
    fonctionnant à l'aide d'une machine propulsive d'un poids à vide de plus de
    15 000 kilogrammes de la sous-position EX 88.02 B II C)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG Nr. 3467/73 des Rates vom 17. Dezember 1973 über die zeitweilige
