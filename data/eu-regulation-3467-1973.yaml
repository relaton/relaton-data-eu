    für maschinellen Antrieb mit einem Leergewicht von mehr als 15 000 kg der Tarifstelle
    ex 88.02 B II c)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3467/73 af 17. december 1973 om midlertidig
