    fremdrivningsmekanisme og med en egenvægt på over 15 000 kg under position ex
    88.02 B II c)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3467/73 del Consiglio, del 17 dicembre 1973, relativo
