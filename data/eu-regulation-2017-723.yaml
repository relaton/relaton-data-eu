    un Padomes Regulu (ES) Nr. 1306/2013 attiecībā uz integrēto administrācijas
    un kontroles sistēmu, maksājumu atteikšanas vai atsaukšanas nosacījumiem
    un administratīvajiem sodiem, kas piemērojami tiešo maksājumu, lauku attīstības
    atbalsta un savstarpējās atbilstības kontekstā
  type: main
