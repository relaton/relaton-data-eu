    des Rates in Bezug auf das integrierte Verwaltungs- und Kontrollsystem und die
    Bedingungen für die Ablehnung oder Rücknahme von Zahlungen sowie für Verwaltungssanktionen
    im Rahmen von Direktzahlungen, Entwicklungsmaßnahmen für den ländlichen Raum
    und der Cross-Compliance
  type: main
