    el Reglamento (UE) n.° 1306/2013 del Parlamento Europeo y del Consejo en lo que
    respecta al sistema integrado de gestión y control y a las condiciones sobre
    la denegación o retirada de los pagos y sobre las sanciones administrativas aplicables
