  script: Latn
  content: Regolamento delegato (UE) 2017/723 della Commissione, del 16 febbraio 2017,
    recante modifica del regolamento delegato (UE) n. 640/2014 che integra il regolamento
    (UE) n. 1306/2013 del Parlamento europeo e del Consiglio per quanto riguarda il
    sistema integrato di gestione e di controllo e le condizioni per il rifiuto o
    la revoca di pagamenti nonché le sanzioni amministrative applicabili ai pagamenti
    diretti, al sostegno allo sviluppo rurale e alla condizionalità
  type: main
