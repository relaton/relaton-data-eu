    papildomos Europos Parlamento ir Tarybos reglamento (ES) Nr. 1306/2013 nuostatos
    dėl integruotos administravimo ir kontrolės sistemos ir dėl išmokų neskyrimo
    arba atšaukimo sąlygų bei administracinių nuobaudų, taikomų tiesioginėms
