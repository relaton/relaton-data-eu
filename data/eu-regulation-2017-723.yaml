    (UE) n.° 1306/2013 do Parlamento Europeu e do Conselho no que diz respeito ao
    sistema integrado de gestão e de controlo e às condições de recusa ou retirada
    de pagamentos, bem como às sanções administrativas aplicáveis aos pagamentos
    diretos, ao apoio ao desenvolvimento rural e à condicionalidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2017/723 al Comisiei din 16 februarie 2017 de
    modificare a Regulamentului delegat (UE) nr. 640/2014 de completare a Regulamentului
    (UE) nr. 1306/2013 al Parlamentului European și al Consiliului în ceea ce privește
    Sistemul Integrat de Administrare și Control și condițiile pentru refuzarea
    sau retragerea plăților și pentru sancțiunile administrative aplicabile în
    cazul plăților directe, al sprijinului pentru dezvoltare rurală și al ecocondiționalității
  type: main
