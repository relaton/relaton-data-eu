  content: Commission Delegated Regulation (EU) 2017/723 of 16 February 2017 amending
    Delegated Regulation (EU) No 640/2014 supplementing Regulation (EU) No 1306/2013
    of the European Parliament and of the Council with regard to the integrated administration
    and control system and conditions for refusal or withdrawal of payments and administrative
    penalties applicable to direct payments, rural development support and cross compliance
  type: main
- language: fr
  script: Latn
  content: Règlement Délégué (UE) 2017/723 de la Commission du 16 février 2017
    modifiant le règlement délégué (UE) n° 640/2014 de la Commission complétant
    le règlement (UE) n° 1306/2013 du Parlement européen et du Conseil en ce qui
    concerne le système intégré de gestion et de contrôle, les conditions relatives
    au refus ou au retrait des paiements et les sanctions administratives applicables
    aux paiements directs, au soutien au développement rural et à la conditionnalité
  type: main
