title:
- language: en
  script: Latn
  content: '82/776/EEC: Commission Decision of 22 July 1982 on a Belgian Government
    aid scheme concerning the expansion of the production capacity of an undertaking
    manufacturing mineral water, hot spring water and soft drinks (Only the French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/776/CEE: Décision de la Commission, du 22 juillet 1982, concernant
    une aide que le gouvernement belge projette d''accorder en faveur de l''extension
    des capacités de production d''une entreprise fabriquant des eaux minérales
    et thermales et des limonades (Les textes en langues française et néerlandaise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/776/EWG: Entscheidung der Kommission vom 22. Juli 1982 über ein Beihilfevorhaben
    der belgischen Regierung zugunsten der Ausweitung der Produktionskapazität eines
    Mineral- und Thermalwässer sowie Limonaden herstellenden Unternehmens (Nur der
    französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/776/EØF: Kommissionens beslutning af 22. juli 1982 vedrørende støtte,
    som den belgiske regering har til hensigt at yde til udvidelse af produktionskapaciteten
    i en virksomhed, der fremstiller mineral- og termalvand samt limonade (Kun de
    franske og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/776/EOK: Απόφαση της Επιτροπής της 22ας Ιουλίου
    1982 περί της ενίσχυσης που σχεδιάζει να χορηγήσει
    η βελγική κυβέρνηση για την επέκταση της ικανότητας
    παραγωγής επιχείρησης που παρασκευάζει μεταλλικά
    και ιαματικά νερά και λεμονάδες (Τα κείμενα
    στη γαλλική και ολλανδική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '82/776/CEE: Decisione della Commissione, del 22 luglio 1982, concernente
    un aiuto che il governo belga intende accordare a favore dell''ampliamento delle
    capacità di produzione di un''impresa che produce acque minerali, termali e limonate
    (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '82/776/EEG: Beschikking van de Commissie van 22 juli 1982 betreffende
