title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/389 of 26 January 2024 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified oilseed rape Ms8, Rf3 and Ms8 × Rf3
    pursuant to Regulation (EC) No 1829/2003 of the European Parliament and of the
    Council (notified under document C(2024) 432)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/389 de la Commission du 26 janvier 2024
    renouvelant l’autorisation de mise sur le marché de produits contenant les
    colzas génétiquement modifiés Ms8, Rf3 et Ms8 × Rf3, consistant en ces colzas
    ou produits à partir de ceux-ci, en application du règlement (CE) no 1829/2003
    du Parlement européen et du Conseil [notifiée sous le numéro C(2024) 432]
  type: main
- language: de
  script: Latn
