    abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról
    (az értesítés a C(2024) 432. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2024/389 della Commissione, del 26 gennaio
    2024, che rinnova l’autorizzazione all’immissione in commercio di prodotti
    contenenti, costituiti o derivati da colza geneticamente modificata Ms8, Rf3 e
    Ms8 × Rf3 in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo
    e del Consiglio [notificata con il numero C(2024) 432]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2024/389 (2024. gada 26. janvāris),
