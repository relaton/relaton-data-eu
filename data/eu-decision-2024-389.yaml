    atļauju laist tirgū produktus, kas satur ģenētiski modificēto eļļas rapsi
    Ms8, Rf3 un Ms8 × Rf3, no tā sastāv vai ir no tā ražoti (paziņots ar dokumentu
    C(2024) 432)
  type: main
