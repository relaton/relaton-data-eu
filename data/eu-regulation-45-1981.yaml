title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 45/81 of 1 January 1981 laying down general
    rules concerning the components for protection of the processing industry in the
    cereals and rice sector and fixing the components applying in Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 45/81 Conseil, du 1er janvier 1981, déterminant les
    règles générales relatives aux éléments destinés à assurer, dans le secteur
    des céréales et du riz, la protection de l'industrie de transformation et fixant
    ceux pour la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 45/81 des Rates vom 1. Januar 1981 zur Festlegung
    der Grundregeln für die Bestandteile zum Schutz der Verarbeitungsindustrie auf
    dem Getreide- und Reissektor und zur Festsetzung dieser Bestandteile für Griechenland
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 45/81 af 1. januar 1981 om fastsættelse
    af de almindelige regler for beregningen af de elementer, der har til formål
    at beskytte forarbejdningsindustrien for korn og ris, og om fastsættelse af de
    elementer, der skal anvendes af Grækenland
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 45/81 του Συμβουλίου
    της 1ης Ιανουαρίου 1981 περί καθορισμού των γενικών
    κανόνων σχετικά με τα στοιχεία που αποβλέπουν
    στην εξασφάλιση, στον τομέα των σιτηρών και
    της όρυζας, της προστασίας της βιομηχανίας
    μεταποίησης και περί καθορισμού των στοιχείων
    αυτών για την Ελλάδα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 45/81 del Consiglio, del 1ºgennaio 1981, che stabilisce
    le norme generali riguardanti gli elementi destinati ad assicurare, nel settore
    dei cereali e del riso, la protezione dell'industria di trasformazione e che fissa
    tali elementi per la Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 45/81 van de Raad van 1 januari 1981 houdende algemene
    regels betreffende de elementen ter bescherming van de verwerkende industrie in
    de sector granen en rijst en tot vaststelling van genoemde elementen voor Griekenland
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 45/81 do Conselho, de 1 de Janeiro de 1981, que determina
    as regras gerais relativas aos elementos destinados a assegurar a protecção
    da indústria transformadora, no sector dos cereais e do arroz, e fixa estes elementos
    para a Grécia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 45/81 del Consejo, de 1 de enero de 1981, por el que
    se determinan las normas generales relativas a los elementos destinados a asegurar,
    en el sector de los cereales y del arroz, la protección de la industria de transformación
    y por el que se establecen los relativos a Grecia
  type: main
