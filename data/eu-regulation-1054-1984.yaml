title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1054/84 of 16 April 1984 extending the period
    of validity of the measures provided for by Regulation (EEC) No 3191/80 on transitional
    measures concerning non-recovery of the variable slaughter premium for sheepmeat
    and goatmeat products exported from the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1054/84 de la Commission du 16 avril 1984 prorogeant
    la durée de validité des mesures prévues par le règlement (CEE) no 3191/80
    relatif à des mesures transitoires en ce qui concerne la non-récupération de
    la prime variable à l' abattage pour les produits du secteur des viandes ovine
    et caprine exportées hors de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1054/84 der Kommission vom 16. April 1984 zur Berichtigung
    der Verordnung (EWG) Nr. 3191/80 mit Übergangsmaßnahmen über die Nichtwiedereinziehung
    der variablen Schlachtprämie bei Erzeugnissen des Schaf- und Ziegenfleischsektors,
    die aus der Gemeinschaft ausgeführt worden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1054/84 af 16. april 1984 om forlængelse
    af gyldighedsperioden for de foranstaltninger, der er fastsat ved forordning (EØF)
    nr. 3191/80 om overgangsforanstaltninger indebærende, at den variable slagtepræmie
    ikke tilbagebetales for produkter fra sektoren for fåre- og gedekød, som udføres
    fra Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1054/84 της Επιτροπής
    της 16ης Απριλίου 1984 περί παρατάσεως της διάρκειας
    της ισχύος των μέτρων που προβλέπονται από
    τον κανονισμό (ΕΟΚ) αριθ. 3191/80 περί μεταβατικών
    μέτρων περί της μη επανακτήσεως της μεταβλητής
    πριμοδοτήσεως για σφαγή, για τα προϊόντα του
    τομέα του προβείου και αιγείου κρέατος που
    εξάγονται εκτός της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1054/84 della Commissione del 16 aprile 1984 che proroga
    la durata di validità delle misure previste dal regolamento (CEE) n. 3191/80
    recante misure transitorie che autorizzano a non prelevare un importo pari al
    premio variabile alla macellazione per i prodotti del settore delle carni ovine
    e caprine esportati fuori della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1054/84 van de Commissie van 16 april 1984 houdende
    verlenging van de geldigheidsduur van de maatregelen vastgesteld bij Verordening
