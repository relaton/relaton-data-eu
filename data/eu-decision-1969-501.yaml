title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1969, portant prorogation de
    la décision de la Haute Autorité n° 1-64 concernant l'interdiction de l'alignement
    sur les offres de produits sidérurgiques et de fonte en provenance de pays ou
    territoires à commerce d'état
  type: main
- language: de
  script: Latn
  content: '69/501/EGKS: Entscheidung der Kommission vom 22. Dezember 1969 über die
    Verlängerung der Entscheidung Nr. 1/64 der Hohen Behörde betreffend das Verbot
    der Angleichung an Angebote von Stahlerzeugnissen und Roheisen aus Staatshandelsländern
    und Staatshandelsgebieten'
  type: main
- language: it
  script: Latn
  content: '69/501/CECA: Decisione della Commissione, del 22 dicembre 1969, relativa
    alla proroga della decisione dell''Alta Autorità n. 1/64 che vieta l''allineamento
    sulle offerte di prodotti siderurgici di ghisa provenienti da paesi e territori
    a commercio di Stato'
  type: main
- language: nl
  script: Latn
  content: '69/501/EGKS: Beschikking van de Commissie van 22 december 1969 houdende
    verlenging van de geldigheidsduur van Beschikking nr. 1-64 van de Hoge Autoriteit
    houdende verbod van aanpassing aan prijsaanbiedingen voor ijzer- en staalprodukten
    en ruwijzer uit landen en gebieden met staatshandel'
  type: main
