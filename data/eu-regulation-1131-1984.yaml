    and originating in Argentina, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1131/84 de la Commission du 25 avril 1984 portant rétablissement
