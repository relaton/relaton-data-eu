    iad ina bhfuil, atá comhdhéanta de, nó a tháirgtear as pónaire shoighe ghéinmhodhnaithe
    A5547-127 (ACS-GMØØ6-4) de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint
    na hEorpa agus ón gComhairle (a bhfuil fógra tugtha ina leith faoi dhoiciméad
