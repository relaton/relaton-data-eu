    от 22 февруари 2023 година за подновяване на разрешението
    за пускане на пазара на продукти, съдържащи,
    състоящи се или произведени от генетично модифицирана
    соя A5547-127 (ACS-GMØØ6-4), в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирадо под номер С(2023) 1126) (само текстът
    на немски език е автентичен)
  type: main
