title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/415 of 22 February 2023 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified soybean A5547-127 (ACS-GMØØ6-4) pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2023) 1126) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/415 de la Commission du 22 février
    2023 renouvelant l’autorisation de mise sur le marché de produits contenant
    du soja génétiquement modifié A5547-127 (ACS-GMØØ6-4), consistant en ce soja
    ou produits à partir de celui-ci, en application du règlement (CE) no 1829/2003
    du Parlement européen et du Conseil [notifiée sous le numéro C(2023) 1126]
    (Le texte en langue allemande est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/415 der Kommission vom 22. Februar 2023
    zur Erneuerung der Zulassung für das Inverkehrbringen von Erzeugnissen, die genetisch
    veränderte Sojabohnen der Sorte A5547-127 (ACS-GMØØ6-4) enthalten, aus ihnen
    bestehen oder aus ihnen gewonnen werden, gemäß der Verordnung (EG) Nr. 1829/2003
    des Europäischen Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen
    C(2023) 1126) (Nur der deutsche Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
