    1126) (Slechts de tekst in de Duitse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2023/415 z dnia 22 lutego 2023 r. odnawiająca
    zezwolenie na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną
    soję A5547-127 (ACS-GMØØ6-4), składających się z niej lub z niej wyprodukowanych
