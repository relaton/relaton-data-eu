  content: Uitvoeringsbesluit (EU) 2023/415 van de Commissie van 22 februari 2023
    tot verlenging van de vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met het genetisch gemodificeerde
    soja A5547-127 (ACS-GMØØ6-4) overeenkomstig Verordening (EG) nr. 1829/2003 van
