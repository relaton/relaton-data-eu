    odobrenja za stavljanje na tržište proizvoda koji sadržavaju genetski modificiranu
    soju A5547-127 (ACS-GMØØ6-4) ili se sastoje ili su proizvedeni od nje, u skladu
    s Uredbom (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem
    dokumenta C(2023) 1126) (Vjerodostojan je samo tekst na njemačkom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/415 végrehajtási határozata (2023. február 22.)
    a géntechnológiával módosított A5547-127 (ACS-GMØØ6-4) szójababot tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedélynek az 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti
    megújításáról (az értesítés a (2023) 1126. számú dokumentummal történt)
    (Csak a német nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/415 della Commissione del 22 febbraio
    2023 che rinnova l’autorizzazione all’immissione in commercio di prodotti
    contenenti, costituiti o derivati da soia geneticamente modificata A5547-127 (ACS-GMØØ6-4)
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2023) 1126] (Il testo in lingua tedesca è il solo
    facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2023/415 (2023. gada 22. februāris),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kas satur ģenētiski modificēto soju A5547-127
    (ACS-GMØØ6-4), no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta
    numuru C(2023) 1126) (Autentisks ir tikai teksts vācu valodā)
  type: main
- language: lt
