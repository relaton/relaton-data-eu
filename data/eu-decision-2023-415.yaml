    leidimas pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų
    sojų A5547–127 (ACS-GMØØ6–4) arba kurie iš jų sudaryti ar pagaminti (pranešta
    dokumentu Nr. C(2023) 1126) (Tekstas autentiškas tik vokiečių kalba)
  type: main
- language: mt
  script: Latn
