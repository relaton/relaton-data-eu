  script: Latn
  content: Decizia de punere în aplicare (UE) 2023/415 a Comisiei din 22 februarie
    2023 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin, constau în sau sunt fabricate din soia modificată genetic A5547-127
