    jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2023/415 da Comissão de 22 de fevereiro de
    2023 que renova a autorização de colocação no mercado de produtos que contenham,
    sejam constituídos por ou sejam produzidos a partir de soja geneticamente modificada
    A5547-127 (ACS-GMØØ6-4) nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento
    Europeu e do Conselho [notificada com o número C(2023) 1126] (Apenas faz fé
    o texto em língua alemã)
  type: main
