title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2133/82 of 30 July 1982 re-establishing
    the levying of customs duties on other bovine cattle leather and equine leather,
    falling within subheading 41.02 ex C and originating in Pakistan, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3601/81
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2133/82 de la Commission, du 30 juillet 1982, portant
    rétablissement de la perception des droits de douane applicables aux autres cuirs
    et peaux de bovins et peaux d' équidés, de la sous-position 41.02 ex C du tarif
    douanier commun, originaires du Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2133/82 der Kommission vom 30. Juli 1982 zur Wiedereinführung
    der Erhebung der Zölle für anderes Rind- und Kalbleder, Roßleder und Leder
    von anderen Einhufern der Tarifstelle 41.02 ex C mit Ursprung in Pakistan, dem
    die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2133/82 af 30. juli 1982 om genindførelse
    af opkrævning af told for andet læder af kvæghuder, henhørende under pos.
    41.02 ex C og med oprindelse i Pakistan, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2133/82 τής Επιτροπής
    τής 30ής Ιουλίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά σκύτη καί δέρματα
    βοοειδών (συμπεριλαμβανομένων καί τών βουβάλων)
    καί δέρματα ιπποειδών τής διακρίσεως 41. 02 ex
    Γ τού Κοινού Δασμολογίου, καταγωγής Πακιστάν,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2133/82 della Commissione, del 30 luglio 1982, che
    ripristina la riscossione dei dazi doganali applicabili agli altri cuoi e pelli
    di bovini e di equini, della sottovoce 41.02 ex C della tariffa doganale comune,
    originari del Pakistan beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2133/82 van de Commissie van 30 juli 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander leder
    en voorgelooide huiden en vellen, van runderen en van paarden en van paardachtigen
    van postonderverdeling 41.02 ex C van oorsprong uit Pakistan, waarvoor de in Verordening
    (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleende
  type: main
