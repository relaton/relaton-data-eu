    námornej organizácie pre námornú bezpečnosť na 102. zasadnutí, pokiaľ
    ide o prijatie zmien pravidiel 2, 14 a 18 a dodatkov I a VI prílohy VI k Medzinárodnému
    dohovoru o zabránení znečisťovaniu z lodí, častí A-1, B, B-1 a B-2 až
    B-4 kapitoly II-1 Medzinárodného dohovoru o bezpečnosti ľudského života
    na mori, častí A-1 a B-1 Medzinárodného kódexu bezpečnosti pre lode používajúce
    plyny alebo iné palivá s nízkou teplotou vzplanutia a rezolúcie A.658(16)
    o používaní a umiestňovaní odrazových materiálov na záchranných prostriedkoch
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2020/721 z dne 19. maja 2020 o stališču, ki se v imenu
    Evropske unije zastopa na 75. zasedanju Odbora za varstvo morskega okolja in 102.
    zasedanju Odbora za pomorsko varnost Mednarodne pomorske organizacije v zvezi
    s sprejetjem sprememb pravil 2, 14 in 18 ter dodatkov I in VI k Prilogi VI k Mednarodni
    konvenciji o preprečevanju onesnaževanja morja z ladij, delov A-1, B, B-1, B-2
    do B-4 poglavja II-1 Mednarodne konvencije o varstvu človeškega življenja na
    morju, delov A-1 in B-1 Mednarodnega kodeksa za varnost ladij, ki uporabljajo
    pline ali druga goriva z nizkim vnetiščem, in resolucije A.658(16) o uporabi
    in namestitvi retro-odsevnih materialov v reševalni opremi
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2020/721 del Consejo de 19 de mayo de 2020 relativa a la
    posición que debe adoptarse en nombre de la Unión Europea en el Comité de Protección
    del Medio Marino de la Organización Marítima Internacional, en su 75.o período
    de sesiones, y en el Comité de Seguridad Marítima de la Organización Marítima
    Internacional, en su 102.o período de sesiones, en lo relativo a la adopción
    de enmiendas a las reglas 2, 14 y 18 y a los apéndices I y VI del anexo VI del
    Convenio internacional para prevenir la contaminación por los buques, a las partes
    A-1, B, B-1 y B-2 a B-4 del capítulo II-1 del Convenio Internacional para la
    Seguridad de la Vida Humana en el Mar, a las partes A-1 y B-1 del Código internacional
    de seguridad para los buques que utilicen gases u otros combustibles de bajo punto
    de inflamación y a la Resolución A.658(16) sobre la utilización y la colocación
    de materiales retrorreflectantes en los dispositivos de salvamento
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2020/721 av den 19 maj 2020 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i Internationella sjöfartsorganisationens
    kommitté för skydd av den marina miljön vid dess 75:e möte och i Internationella
    sjöfartsorganisationens sjösäkerhetskommitté vid dess 102:a möte vad gäller
    antagandet av ändringar av reglerna 2, 14 och 18 och tilläggen I och VI i bilaga
    VI till den internationella konventionen till förhindrande av förorening från
    fartyg, delarna A-1, B, B-1, B-2 till B-4 i kapitel II-1 i den internationella
    konventionen om säkerheten för människoliv till sjöss, delarna A-1 och B-1
    I den internationella säkerhetskoden för fartyg som använder gaser eller andra
    bränslen med låg flampunkt och resolution A.658(16) om användning och montering
    av reflexmaterial på livräddningsutrustning
  type: main
