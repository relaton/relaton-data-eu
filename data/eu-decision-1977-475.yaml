  script: Latn
  content: '77/475/EEC: Council Decision of 25 July 1977 amending Decision 75/459/EEC
    on action by the European Social Fund for persons affected by employment difficulties
    and Decision 76/206/EEC on intervention by the European Social Fund in favour
    of persons occupied in the textile and clothing industries'
  type: main
- language: fr
  script: Latn
  content: '77/475/CEE: Décision du Conseil, du 25 juillet 1977, modifiant la décision
    75/459/CEE relative à l'' intervention du Fonds social européen en faveur de
    personnes touchées par les difficultés d'' emploi et la décision 76/206/CEE
    relative à l'' intervention du Fonds social européen en faveur de personnes
    occupées dans les secteurs du textile et de l'' habillement'
  type: main
- language: de
