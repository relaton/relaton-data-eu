    der schwierigen Arbeitsmarktlage betroffen sind, und des Beschlusses 76/206/EWG
    über Maßnahmen des Europäischen Sozialfonds zugunsten von auf dem Textil- und
    Bekleidungssektor beschäftigten Personen'
  type: main
