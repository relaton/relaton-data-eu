title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1135/81 of 29 April 1981 re-establishing
    the levying of customs duties on elastic fabrics and trimmings (other than knitted
    or crocheted goods), products of category 105 (code 1050), originating in China,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1135/81 de la Commission, du 29 avril 1981, portant
    rétablissement de la perception des droits de douane applicables aux tissus (autres
    que de bonneterie) élastiques, de la catégorie 105 (code 1050), originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1135/81 der Kommission vom 29. April 1981 über die
    Wiedereinführung des Zollsatzes für gummielastische Gewebe, ausgenommen Gewirke,
    der Warenkategorie Nr. 105 (Kennziffer 1050), mit Ursprung in China, dem die in
    der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1135/81 af 29. april 1981 om genindførelse
    af opkrævning af toldafgifter for elastiske tekstilstoffer (undtagen trikotagestof),
    under kategori 105 (kode 1050), som har oprindelse i Kina, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1135/81 τής Επιτροπής
    τής 29ης Απριλίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά υφάσματα
    (πλήν τών πλεκτών) ελαστικά, τών προϊόντων τής
    κατηγορίας αριθ. 105 (κώδικας 1050), καταγωγής Κίνας,
    δικαιούχων τών προβλεπομένων στόν κανονισμό
    (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1135/81 della Commissione, del 29 aprile 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti (diversi da
    quelli a maglia) elastici, della categoria di prodotti n. 105 (codice 1050), originari
    della Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1135/81 van de Commissie van 29 april 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elastische
    weefsels (met uitzondering van brei- en haakwerk) van de categorie van produkten
    nr. 105 (codenummer 1050), van oorsprong uit China, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3320/80 van de Raad
  type: main
