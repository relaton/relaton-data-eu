id: EUDecision1978722
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 3 August 1978 authorizing Ireland not to apply Community
    treatment to women's, girls' and infants' woven pyjamas and night dresses, of
    wool, of cotton or of man-made textile fibres, falling within heading No ex 61.04
    (NIMEXE codes 61.04-11, 13, 18) of the Common Customs Tariff, originating in Hong
    Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/722/CEE: Décision de la Commission, du 3 août 1978, autorisant l''Irlande
    à exclure du traitement communautaire les pyjamas et chemises de nuit tissés,
    pour femmes, fillettes et jeunes enfants, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles, de la position Ex 61.04 du Tarif douanier commun
    (codes Nimexe : 61.04-11; 13; 18), originaires de Hong-Kong et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. August 1978, mit der Irland ermächtigt
    wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Schlafanzüge und Nachthemden, aus Geweben, für Frauen, Mädchen
    und Kleinkinder, aus Wolle, Baumwolle, synthetischen oder künstlichen Spinnstoffen
    der Tarifnummer ex 61.04 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.04-11;
    13; 18) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 3. august 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage pyjamas og anden natbeklædning, vævede,
    til kvinder, piger og småbørn, af uld, bomuld eller kemofibre, som henhører
    under pos. ex 61.04 (NIMEXE-kode 61.04-11, 13, 18) i den fælles toldtarif, har
    oprindelse i Hongkong og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 3 agosto 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario pigiama e camicie da notte tessute per
    donna, per ragazza e per bambini, di lana, di cotone o di fibre tessili sintetiche
    o artificiali, della voce ex 61.04 (codice Nimexe: 61.04-11, 13, 18) della tariffa
    doganale comune, originari di Hong Kong e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 augustus 1978 waarbij Ierland wordt
    gemachtigd geweven pyjama's en nachthemden voor dames, meisjes en kinderen, van
    wol, van katoen of van synthetische of van kunstmatige textielvezels, van post
    ex 61.04 van het gemeenschappelijk douanetarief (NIMEXE-code 61.04-11, 13, 18),
    van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
