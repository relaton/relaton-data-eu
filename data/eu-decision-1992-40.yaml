title:
- language: en
  script: Latn
  content: '92/40/EEC: Commission Decision of 13 November 1991 amending Decision 90/90/EEC
    concerning the importation by Member States of live pigs, fresh pigmeat and pigmeat
    products from Austria and amending Decision 91/190/EEC concerning the animal health
    conditions and veterinary certificates for the import of domestic animals of the
    bovine and porcine species from Austria'
  type: main
- language: fr
  script: Latn
  content: '92/40/CEE: Décision de la Commission, du 13 novembre 1991, modifiant
    la décision 90/90/CEE relative à l'' importation par les Etats membres d'' animaux
    vivants de l'' espèce porcine, de viandes fraîches et de produits à base de
    ces viandes en provenance d'' Autriche et modifiant la décision 91/190/CEE concernant
    les conditions de police sanitaire et les certificats sanitaires requis à l''
    importation d'' animaux domestiques des espèces bovine et porcine en provenance
    d'' Autriche'
  type: main
- language: de
  script: Latn
  content: '92/40/EWG: Entscheidung der Kommission vom 13. November 1991 zur Änderung
    der Entscheidung 90/90/EWG betreffend die Einfuhr von Schweinen, frischem Schweinefleisch
    und Schweinefleischerzeugnissen aus Österreich in die Mitgliedstaaten und der
    Entscheidung 91/190/EWG über die Tiergesundheitsanforderungen und -bescheinigungen
    bei der Einfuhr von Rindern und Schweinen aus Österreich'
  type: main
- language: da
  script: Latn
  content: '92/40/EØF: Kommissionens beslutning af 13. november 1991 om ændring
    af beslutning 90/90/EØF om medlemsstaternes indførsel af levende svin, fersk
    svinekød og svinekødsprodukter fra Østrig og om ændring af beslutning 91/190/EØF
    om dyresundhedsmæssige bestemmelser og udstedelse af sundhedscertifikat for indførsel
    af kvæg og svin fra Østrig'
  type: main
- language: el
  script: Grek
  content: '92/40/ΕΟΚ : Απόφαση της Επιτροπής, της 13ης
    Νοεμβρίου 1991, για τροποποίηση της απόφασης
    90/90/ΕΟΚ όσον αφορά την εισαγωγή, εκ μέρους των
    κρατών μελών, ζωντανών χοίρων, νωπού χοιρείου
    κρέατος και προϊόντων με βάση το χοίρειο κρέας,
    προελεύσεως Αυστρίας, και για τροποποίηση
