    ζώων και της κτηνιατρικής πιστοποίησης για
    την εισαγωγή ζώων του βοείου και χοιρείου είδους
    από την Αυστρία'
  type: main
- language: it
  script: Latn
  content: '92/40/CEE: Decisione della Commissione, del 13 novembre 1991, che modifica
    la decisione 90/90/CEE relativa all'' importazione negli Stati membri di suini
    vivi, carni fresche suine e prodotti a base di carne suina provenienti dall''
    Austria nonché la decisione 91/190/CEE relativa alle norme di polizia sanitaria
    e ai certificati veterinari dui è subordinata l'' importazione di animali domestici
    delle specie bovina e suina dall'' Austria'
  type: main
- language: nl
  script: Latn
  content: '92/40/EEG: Beschikking van de Commissie van 13 november 1991 tot wijziging
    van Beschikking 90/90/EEG betreffende de invoer voor de Lid­Staten van levende
    varkens, vers varkensvlees en vleesprodukten daarvan uit Oostenrijk, en van Beschikking
    91/190/EEG betreffende gezondheidsvoorschriften en gezondheidscertificering voor
    de invoer van runderen en varkens ( huisdieren ) uit Oostenrijk'
  type: main
- language: pt
  script: Latn
  content: '92/40/CEE: Decisão da Comissão, de 13 de Novembro de 1991, que altera
    a Decisão 90/90/CEE, relativa à importação pelos Estados­membros de animais
    da espécie suína, de carnes frescas desses animais e de produtos à base dessas
    carnes provenientes da Áustria, e que altera a Decisão 91/190/CEE, relativa
    às condições de polícia sanitária e ao certificado exigido para a importação
    de animais domésticos das espécies bovina e suína provenientes da Áustria'
  type: main
- language: es
  script: Latn
  content: '92/40/CEE: Decisión de la Comisión, de 13 dee noviembre de 1991, por
    la que se modifica la Decisión 90/90/CEE relativa a la importación en los Estados
    miembros de cerdos vivos, carnes frescas de porcino y productos a base de carne
    de porcino procedentes de Austria y por la que se modifica la Decisión 91/190/CEE
    relativa a las condiciones y certificados zoosanitarios para la importación de
    animales domésticos de las especies bovina y porcina procedentes de Austria'
