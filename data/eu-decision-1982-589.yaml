title:
- language: en
  script: Latn
  content: '82/589/EEC: Commission Decision of 6 August 1982 establishing that the
    apparatus described as ''OKI - Reflex Klystron, model 55V11 and model 60V12''
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/589/CEE: Décision de la Commission, du 6 août 1982, constatant que
    l''importation des appareils "OKI - Reflex Klystron, model 55V11 and model 60V12"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/589/EWG: Entscheidung der Kommission vom 6. August 1982, mit der festgestellt
    wird, daß die Geräte ,,OKI- Reflex Klystron, model 55V11 and model 60V12" nicht
    unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt werden können'
  type: main
- language: da
  script: Latn
  content: '82/589/EØF: Kommissionens beslutning af 6. august 1982 om fastslåelse
    af, at indførsel af apparaterne "Oki- Reflex Klystron, model 55V11 and model
    60V12", ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/589/EOK: Απόφαση τής Επιτροπής τής 6ης Αυγούστου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «OKI — Reflex Klystron, model 55V11 and 60V12»
    δέν δύναται νά πραγματοποιηθεί ατελώς ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/589/CEE: Decisione della Commissione, del 6 agosto 1982, che stabilisce
    che l''importazione degli apparecchi denominati "OKI - Reflex Klystron, model
    55V11 and model 60V12" non può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/589/EEG: Beschikking van de Commissie van 6 augustus 1982 waarbij wordt
    vastgesteld dat de apparaten genaamd ,,Oki-Reflex Klystron, model 55V11 and model
    60V12" niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mogen worden ingevoerd'
