    separati intiżi għalihom
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 523/2012 van de Commissie van 20 juni 2012 tot wijziging
    van Verordening (EG) nr. 661/2009 van het Europees Parlement en de Raad wat betreft
    de opname van bepaalde reglementen van de Economische Commissie voor Europa van
    de Verenigde Naties met betrekking tot de typegoedkeuring van motorvoertuigen,
    aanhangwagens daarvan en daarvoor bestemde systemen, onderdelen en technische
    eenheden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 523/2012 z dnia 20 czerwca 2012 r. zmieniające
