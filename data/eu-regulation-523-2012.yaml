- language: en
  script: Latn
  content: Commission Regulation (EU) No 523/2012 of 20 June 2012 amending Regulation
    (EC) No 661/2009 of the European Parliament and of the Council as regards the
    inclusion of certain Regulations of the United Nations Economic Commission for
    Europe on the type-approval of motor vehicles, their trailers and systems, components
    and separate technical units intended therefor
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 523/2012 de la Commission du 20 juin 2012 modifiant
    le règlement (CE) n ° 661/2009 du Parlement européen et du Conseil eu égard
    à l’inclusion de certains règlements de la Commission économique pour l’Europe
    des Nations unies concernant l’homologation des véhicules à moteur, de leurs
    remorques et des systèmes, composants et entités techniques distinctes qui leur
    sont destinés
  type: main
