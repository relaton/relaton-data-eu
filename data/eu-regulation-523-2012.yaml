    előírásainak felvétele tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 523/2012 della Commissione, del 20 giugno 2012 , che
    modifica il regolamento (CE) n. 661/2009 del Parlamento europeo e del Consiglio
    al fine di includervi alcuni regolamenti della Commissione economica per l’Europa
    delle Nazioni Unite concernenti l’omologazione dei veicoli a motore, dei loro
    rimorchi nonché dei sistemi, dei componenti e delle entità tecniche a essi destinati
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 523/2012 ( 2012. gada 20. jūnijs ), ar ko groza
    Eiropas Parlamenta un Padomes Regulu (EK) Nr. 661/2009, lai iekļautu konkrētus
    Apvienoto Nāciju Organizācijas Eiropas Ekonomikas komisijas noteikumus par mehānisko
