    oraz przeznaczonych dla nich układów, części i oddzielnych zespołów technicznych
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 523/2012 da Comissão, de 20 de junho de 2012 ,
    que altera o Regulamento (CE) n. ° 661/2009 do Parlamento Europeu e do Conselho
    no que diz respeito à inclusão de determinados regulamentos da Comissão Económica
    para a Europa da Organização das Nações Unidas relativos à homologação
    de veículos a motor e seus reboques, sistemas, componentes e unidades técnicas
    a eles destinados
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 523/2012 al Comisiei din 20 iunie 2012 de modificare
    a Regulamentului (CE) nr. 661/2009 al Parlamentului European și al Consiliului
    referitor la includerea anumitor regulamente ale Comisiei Economice pentru Europa
    a Organizației Națiunilor Unite privind omologarea de tip a autovehiculelor,
    a remorcilor acestora, precum și a sistemelor, componentelor și unităților
    tehnice separate care le sunt destinate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 523/2012 z 20. júna 2012 , ktorým sa mení
    a dopĺňa nariadenie Európskeho parlamentu a Rady (ES) č. 661/2009, pokiaľ
    ide o zahrnutie určitých predpisov Európskej hospodárskej komisie Organizácie
    Spojených národov týkajúcich sa typového schvaľovania motorových vozidiel,
    ich prípojných vozidiel a systémov, komponentov a samostatných technických
    jednotiek určených pre tieto vozidlá
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 523/2012 z dne 20. junija 2012 o spremembi Uredbe
    (ES) št. 661/2009 Evropskega parlamenta in Sveta glede vključitve nekaterih
    pravilnikov Ekonomske komisije Združenih narodov za Evropo o homologaciji motornih
    vozil, njihovih priklopnikov ter sistemov, sestavnih delov in samostojnih tehničnih
    enot, namenjenih za taka vozila
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 523/2012 de la Comisión, de 20 de junio de 2012 ,
    por el que se modifica el Reglamento (CE) n ° 661/2009 del Parlamento Europeo
    y del Consejo, con respecto a la inclusión de determinados Reglamentos de la
    Comisión Económica para Europa de las Naciones Unidas, sobre la homologación
    de los vehículos de motor, sus remolques y sistemas, componentes y unidades técnicas
    independientes a ellos destinados
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 523/2012 av den 20 juni 2012 om ändring
    av Europaparlamentets och rådets förordning (EG) nr 661/2009 vad gäller införande
    av vissa föreskrifter från Förenta nationernas ekonomiska kommission för Europa
    för typgodkännande av motorfordon och deras släpvagnar samt av de system, komponenter
    och separata tekniska enheter som är avsedda för dem
