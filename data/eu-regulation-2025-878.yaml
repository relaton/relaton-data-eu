title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/878 of 3 February 2025 amending
    the regulatory technical standards laid down in Delegated Regulation (EU) 2022/2059,
    Delegated Regulation (EU) 2022/2060 and Delegated Regulation (EU) 2023/1577 as
    regards the technical details of back-testing and profit and loss attribution
    requirements, the criteria for assessing the modellability of risk factors, and
    the treatment of foreign-exchange risk and commodity risk in the non-trading book
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/878 de la Commission du 3 février 2025
    modifiant les normes techniques de réglementation définies dans le règlement
    délégué (UE) 2022/2059, le règlement délégué (UE) 2022/2060 et le règlement
    délégué (UE) 2023/1577 en ce qui concerne les détails techniques des exigences
    en matière de contrôles a posteriori et des exigences d’attribution des profits
    et pertes, les critères d’évaluation du caractère modélisable des facteurs
    de risque et le traitement du risque de change et du risque sur matières premières
    dans le portefeuille hors négociation
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/878 der Kommission vom 3. Februar 2025
    zur Änderung der in der Delegierten Verordnung (EU) 2022/2059, der Delegierten
    Verordnung (EU) 2022/2060 und der Delegierten Verordnung (EU) 2023/1577 festgelegten
    technischen Regulierungsstandards in Bezug auf die technischen Einzelheiten der
    Anforderungen an Rückvergleiche und die Gewinn- und Verlustzuweisung, die Kriterien
    für die Bewertung der Modellierbarkeit von Risikofaktoren und die Behandlung
    des Fremdwährungs- und des Warenpositionsrisikos im Anlagebuch
  type: main
- language: bg
  script: Cyrl
