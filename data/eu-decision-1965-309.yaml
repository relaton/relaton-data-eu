title:
- language: fr
  script: Latn
  content: Décision 65/309/CEE de la Commission, du 2 juin 1965, relative au recours
    de la République fédérale d'Allemagne à l'article 115 alinéa 1 du Traité
    pour exclure du traitement communautaire "les carpes fraîches, réfrigérées
    et congelées" originaires de Yougoslavie et mises en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '65/309/EWG: Entscheidung der Kommission vom 2. Juni 1965 betreffend den
    Antrag der Bundesrepublik Deutschland gemäß Artikel 115 Absatz (1) des Vertrages,
    um aus Jugoslawien stammende und in den übrigen Mitgliedstaaten in den freien
    Verkehr gebrachte Karpfen, frisch, gefroren oder gekühlt, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/309/CEE: Decisione della Commissione, del 2 giugno 1965, relativa al
    ricorso della Repubblica federale di Germania, ai sensi dell''articolo 115. primo
    comma, del Trattato, al fine di escludere dal trattamento comunitario le «carpe
    fresche, refrigerate o congelate» provenienti dalla Iugoslavia ed immesse in
    libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/309/EEG: Beschikking van de Commissie van 2 juni 1965 betreffende het
    verzoek van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste alinea,
    van het Verdrag karpers, vers, gekoeld en bevroren, die van oorsprong zijn uit
    Joegoslavië en in de andere Lid- Staten in het vrije verkeer zijn gebracht, van
    de communautaire behandeling uit te sluiten'
  type: main
