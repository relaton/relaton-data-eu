title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1076/2000 of 22 May 2000 amending Regulation
    (EC) No 952/2000 and increasing to 66 159 tonnes the amount of common wheat held
    by the Belgian intervention agency for which a standing invitation to tender for
    resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1076/2000 de la Commission du 22 mai 2000 modifiant
    le règlement (CE) n° 952/2000 et portant à 66 159 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur de blé tendre par l'organisme d'intervention
    belge
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1076/2000 der Kommission vom 22. Mai 2000 zur Änderung
    der Verordnung (EG) Nr. 952/2000 und zur Erhöhung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt von Weichweizen aus Beständen der belgischen
    Interventionsstelle auf 66 159 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1076/2000 af 22. maj 2000 om ændring
    af forordning (EF) nr. 952/2000 og om forhøjelse til 66 159 tons af den løbende
    licitation med henblik på videresalg på det indre marked af blød hvede, som
    det belgiske interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1076/2000 της Επιτροπής,
    της 22ας Μαΐου 2000, που τροποποιεί τον κανονισμό
    (ΕΚ) αριθ. 952/2000 και ορίζει σε 66 159 τόνους τη διαρκή
    δημοπρασία για τη μεταπώληση στην εσωτερική
    αγορά μαλακού σίτου που έχει στη διάθεσή του
    ο βελγικός οργανισμός παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1076/2000, annettu 22 päivänä toukokuuta 2000,
    asetuksen (EY) N:o 952/2000 muuttamisesta ja pysyvän tarjouskilpailun nostamisesta
    66 159 tonniin Belgian interventioelimen hallussaan pitämän vehnämäärän
    uudelleen myymiseksi sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1076/2000 della Commissione, del 22 maggio 2000, che
    modifica il regolamento (CE) n. 952/2000 e che porta a 66 159 t il quantitativo
    globale oggetto della gara permanente per la rivendita sul mercato interno di
    frumento tenero detenuto dall'organismo d'intervento belga
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1076/2000 van de Commissie van 22 mei 2000 tot wijziging
    van Verordening (EG) nr. 952/2000 teneinde de hoeveelheid waarop de permanente
    openbare inschrijving voor de verkoop op de interne markt van zachte tarwe uit
    de voorraden van het Belgische interventiebureau betrekking heeft, tot 66 159
    ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1076/2000 da Comissão, de 22 de Maio de 2000, que
    altera o Regulamento (CE) n.° 952/2000 e que eleva para 66 159 toneladas o concurso
    permanente para a revenda no mercado interno de trigo mole detido pelo organismo
    de intervenção belga
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1076/2000 de la Comisión, de 22 de mayo de 2000, por
