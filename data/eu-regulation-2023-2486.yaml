    de la contaminación, o a la protección y recuperación de la biodiversidad y
    los ecosistemas, y para determinar si dicha actividad económica no causa un perjuicio
    significativo a ninguno de los demás objetivos medioambientales, y por el que
    se modifica el Reglamento Delegado (UE) 2021/2178 de la Comisión en lo que respecta
    a la divulgación de información pública específica sobre esas actividades
    económicas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/2486 av den 27 juni 2023
    om komplettering av Europaparlamentets och rådets förordning (EU) 2020/852 genom
    fastställande av tekniska granskningskriterier för att avgöra under vilka villkor
    en ekonomisk verksamhet ska anses bidra väsentligt till hållbar användning
    och skydd av vatten och marina resurser, till omställning till en cirkulär ekonomi,
    till förebyggande och begränsning av föroreningar eller till skydd och återställande
    av biologisk mångfald och ekosystem och för att avgöra om den ekonomiska verksamheten
    inte orsakar någon betydande skada för något av de andra miljömålen samt
    om ändring av kommissionens delegerade förordning (EU) 2021/2178 vad gäller
    särskilda offentliga upplysningar för dessa ekonomiska verksamheter
  type: main
