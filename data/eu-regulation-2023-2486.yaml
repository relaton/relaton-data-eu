- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/2486 of 27 June 2023 supplementing
    Regulation (EU) 2020/852 of the European Parliament and of the Council by establishing
    the technical screening criteria for determining the conditions under which an
    economic activity qualifies as contributing substantially to the sustainable use
    and protection of water and marine resources, to the transition to a circular
    economy, to pollution prevention and control, or to the protection and restoration
    of biodiversity and ecosystems and for determining whether that economic activity
    causes no significant harm to any of the other environmental objectives and amending
    Commission Delegated Regulation (EU) 2021/2178 as regards specific public disclosures
    for those economic activities
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/2486 de la Commission du 27 juin 2023 complétant
    le règlement (UE) 2020/852 du Parlement européen et du Conseil par les critères
    d’examen technique permettant de déterminer à quelles conditions une activité
    économique peut être considérée comme contribuant substantiellement à l’utilisation
    durable et à la protection des ressources aquatiques et marines, à la transition
    vers une économie circulaire, à la prévention et à la réduction de la pollution,
    ou à la protection et à la restauration de la biodiversité et des écosystèmes,
    et si cette activité économique ne cause de préjudice important à aucun des
    autres objectifs environnementaux, et modifiant le règlement délégué (UE)
    2021/2178 de la Commission en ce qui concerne les informations à publier spécifiquement
    pour ces activités économiques
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/2486 der Kommission vom 27. Juni 2023 zur
    Ergänzung der Verordnung (EU) 2020/852 des Europäischen Parlaments und des Rates
    durch Festlegung der technischen Bewertungskriterien, anhand deren bestimmt wird,
    unter welchen Bedingungen davon auszugehen ist, dass eine Wirtschaftstätigkeit
    einen wesentlichen Beitrag zur nachhaltigen Nutzung und zum Schutz von Wasser-
    und Meeresressourcen, zum Übergang zu einer Kreislaufwirtschaft, zur Vermeidung
    und Verminderung der Umweltverschmutzung oder zum Schutz und zur Wiederherstellung
    der Biodiversität und der Ökosysteme leistet, und anhand deren bestimmt wird,
    ob diese Wirtschaftstätigkeit erhebliche Beeinträchtigungen eines der übrigen
    Umweltziele vermeidet, und zur Änderung der Delegierten Verordnung (EU) 2021/2178
    der Kommission in Bezug auf besondere Offenlegungspflichten für diese Wirtschaftstätigkeiten
  type: main
