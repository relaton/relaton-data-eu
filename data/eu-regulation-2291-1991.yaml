    en Moscatel aan de telers te betalen minimumprijs, alsmede van het bedrag van
    de steun bij de produktie van deze rozijnen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2291/91 DA COMISSÃO de 30 de Julho de 1991 que fixa,
