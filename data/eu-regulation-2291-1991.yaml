title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2291/91 of 30 July 1991 fixing for the 1991/92
    marketing year the minimum price to be paid to producers for unprocessed sultanas,
    currants and muscatels and the amount of production aid for dried grapes
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2291/91 DE LA COMMISSION du 30 juillet 1991 fixant,
    pour la campagne 1991/1992, le prix minimal à payer aux producteurs pour les
    sultanines, les raisins secs de Corinthe et les variétés Moscatel non transformés,
    ainsi que le montant de l'' aide à la production pour ces raisins secs #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2291/91 DER KOMMISSION vom 30. Juli 1991 zur Festsetzung
    des den Erzeugern unverarbeiteter Sultaninen, Korinthen und Moscatel zu zahlenden
    Mindestpreises sowie der Produktionsbeihilfe für getrocknete Korinthen im Wirtschaftsjahr
    1991/92 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2291/91 af 30. juli 1991 om fastsættelse
    for produktionsåret 1991/92 af den minimumspris, der skal betales producenten
    af uforarbejdede sultanas, korender og muskateller, samt af producentstøtten
    for disse tørrede druer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2291/91 της Επιτροπής
    της 30ής Ιουλίου 1991 που καθορίζει, για την περίοδο
    εμπορίας 1991/92, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για τις σουλτανίνες, τις κορινθιακές
    σταφίδες και τις μη μεταποιημένες ποικιλίες
    Moscatel, καθώς και το ποσό της ενίσχυσης στην παραγωγή
    για τις σταφίδες
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2291/91 DELLA COMMISSIONE del 30 luglio 1991 che
    fissa, per la campagna di commercializzazione 1991-1992, il prezzo minimo da pagare
    ai produttori di uva Sultanina, di uva secca di Corinto e di Moscatel non trasformate
    e l'' importo dell'' aiuto alla produzione per le dette uve #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2291/91 VAN DE COMMISSIE van 30 juli 1991 tot vaststelling
