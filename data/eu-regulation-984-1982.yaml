title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 984/82 of 27 April 1982 determining the
    extent to which applications lodged during the month of April 1982 for the issue
    of import licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 984/82 de la Commission, du 27 avril 1982, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées pendant le mois d'avril 1982 pour les viandes bovines
    congelées destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 984/82 der Kommission vom 27. April 1982 über den
    Umfang, in dem im Monat April 1982 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 984/82 af 27. april 1982 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i april måned 1982 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 984/82 της Επιτροπής
    της 27ης Απριλίου 1982 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν κατά την διάρκεια του μηνός Απριλίου
    του 1982, για τα κατεψυγμένα βόεια κρέατα που
    προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 984/82 della Commissione, del 27 aprile 1982, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1982 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 984/82 van de Commissie van 27 april 1982 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand april
    1982 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
