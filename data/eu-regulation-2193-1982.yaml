  content: Commission Regulation (EEC) No 2193/82 of 4 August 1982 laying down detailed
    rules implementing the system of aid for the use of grapes, grape must and concentrated
    grape must for the manufacture of grape juice and fixing the amounts of aid for
    the 1982/83 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2193/82 de la Commission, du 4 août 1982, portant
