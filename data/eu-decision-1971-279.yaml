title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 6 juillet 1971, autorisant la République
    française à exclure du traitement communautaire certains carreaux, pavés, dalles
    de pavement ou de revêtement, des positions 69.07 Ex A et B Ex II et 69.08 Ex
    A et B Ex II du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/279/EWG: Entscheidung der Kommission vom 6. Juli 1971, mit der die
    Französische Republik ermächtigt wird, die aus Japan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen gewissen Fliesen, gebrannten Pflastersteine,
    Boden- und Wandplatten der Tarifnummer 69.07 ex A und B ex II und 69.08 ex A und
    B ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/279/CEE: Decisione della Commissione, del 6 luglio 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario talune piastrelle,
    blocchetti e lastre da pavimentazione o da rivestimento delle voci 69.07 ex A,
    B ex II, 69.08 ex A e B ex II della tariffa doganale comune, originari del Giappone
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/279/EEG: Beschikking van de Commissie van 6 juli 1971 waarbij de Franse
    Republiek wordt gemachtigd bepaalde plavuizen, vloer- en wandtegels van de posten
    69.07 ex A en B ex II en 69.08 ex A en B ex II van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
