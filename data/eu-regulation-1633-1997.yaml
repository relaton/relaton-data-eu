title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1633/97 of 14 August 1997 amending Regulation
    (EC) No 1023/97 imposing a provisional anti-dumping duty on certain imports of
    flat pallets of wood originating in the Republic of Poland and accepting undertakings
    offered from certain exporters in connection with these imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1633/97 de la Commission du 14 août 1997 modifiant
    le règlement (CE) nº 1023/97 instituant un droit antidumping provisoire sur
    les importations de palettes simples, en bois, originaires de Pologne et portant
    acceptation des engagements offerts par certains exportateurs en ce qui concerne
    ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1633/97 der Kommission vom 14. August 1997 zur Änderung
    der Verordnung (EG) Nr. 1023/97 zur Einführung eines vorläufigen Antidumpingzolls
    auf bestimmte Einfuhren von Flachpaletten aus Holz mit Ursprung in der Republik
    Polen und zur Annahme der Verpflichtungsangebote bestimmter Ausführer im Zusammenhang
    mit diesen Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1633/97 af 14. august 1997 om ændring
    af forordning (EF) nr. 1023/97 om indførelse af en midlertidig antidumpingtold
    på importen af flade paller af træ med oprindelse i Republikken Polen og om
    godtagelse af tilsagn afgivet af visse eksportører i forbindelse med denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1633/97 της Επιτροπής
    της 14ης Αυγούστου 1997 για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1023/97 για την επιβολή προσωρινού δασμού
    αντιντάμπινγκ σε ορισμένες εισαγωγές απλών
    παλετών από ξύλο καταγωγής Πολωνίας και την
    αποδοχή αναλήψεων υποχρεώσεων από μέρους ορισμένων
    εξαγωγέων σχετικά με τις εν λόγω εισαγωγές
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1633/97, annettu 14 päivänä elokuuta 1997,
    Puolasta peräisin olevien puisten kaksipohjaisten kuormalavojen tiettyä tuontia
    koskevan väliaikaisen polkumyyntitullin käyttöönotosta ja tiettyjen viejien
    kyseisen tuonnin yhteydessä esittämien sitoumusten hyväksymisestä annetun
    asetuksen (EY) N:o 1023/97 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1633/97 della Commissione del 14 agosto 1997 che modifica
    il regolamento (CE) n. 1023/97 che impone un dazio antidumping provvisorio sulle
    importazioni di palette semplici di legno originarie della Repubblica di Polonia
    e che accetta gli impegni offerti da alcuni esportatori per quanto riguarda tali
    importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1633/97 van de Commissie van 14 augustus 1997 houdende
    wijziging van Verordening (EG) nr. 1023/97 tot instelling van een voorlopig antidumpingrecht
    op de invoer van vlakke houten laadborden van oorsprong uit Polen en tot aanvaarding
    van in verband met deze invoer door bepaalde exporteurs aangeboden verbintenissen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1633/97 da Comissão de 14 de Agosto de 1997 que altera
    o Regulamento (CE) nº 1023/97 que cria um direito anti-dumping provisório sobre
    certas importações de paletes simples de madeira originárias da Polónia e
    que aceita compromissos oferecidos por determinados exportadores no que diz respeito
    a estas importações
  type: main
- language: es
