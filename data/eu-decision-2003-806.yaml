    epävakauttavan keskittymisen ja leviämisen torjumiseen Kambodžassa koskevan
    yhteisen toiminnan 1999/34/YUTP täytäntöönpanemista koskevan päätöksen
    1999/730/YUTP voimassaolon jatkamisesta ja muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '2003/806/PESC: Decisione 2003/806/PESC del Consiglio, del 17 novembre
