    τροποποίηση της απόφασης 1999/730/ΚΕΠΠΑ για την
    εφαρμογή της κοινής δράσης 2002/589/ΚΕΠΠΑ σχετικά
    με τη συμβολή της Ευρωπαϊκής Ένωσης στην καταπολέμηση
    της αποσταθεροποιητικής συσσώρευσης και διάδοσης
    φορητών όπλων και ελαφρού οπλισμού στην Καμπότζη'
  type: main
- language: fi
  script: Latn
  content: '2003/806/YUTP: Neuvoston päätös 2003/806/YUTP, tehty 17 päivänä
