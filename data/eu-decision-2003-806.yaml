    1999/34/CE in vista di un contributo dell''Unione europea alla lotta contro l''accumulazione
    e la diffusione destabilizzanti di armi portatili e di armi leggere in Cambogia'
  type: main
- language: nl
  script: Latn
  content: '2003/806/GBVB: Besluit 2003/806/GBVB van de Raad van 17 november 2003
    tot verlenging en wĳziging van Besluit 1999/730/GBVB betreffende de uitvoering
    van Gemeenschappelĳk Optreden 1999/34/GBVB met het oog op een bĳdrage van de
