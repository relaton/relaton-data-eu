title:
- language: en
  script: Latn
  content: '2003/806/CFSP: Council Decision 2003/806/CFSP of 17 November 2003 extending
    and amending Decision 1999/730/CFSP implementing Joint Action 1999/34/CFSP with
    a view to a European Union contribution to combating the destabilising accumulation
    and spread of small arms and light weapons in Cambodia'
  type: main
- language: fr
  script: Latn
  content: '2003/806/PESC: Décision 2003/806/PESC du Conseil du 17 novembre 2003
    prorogeant et modifiant la décision 1999/730/PESC mettant en œuvre l''action
    commune 1999/34/PESC en vue d''une contribution de l''Union européenne à la
    lutte contre l''accumulation et la diffusion déstabilisatrices des armes légères
    et de petit calibre au Cambodge'
  type: main
- language: de
  script: Latn
  content: '2003/806/GASP: Beschluss 2003/806/GASP des Rates vom 17. November 2003
