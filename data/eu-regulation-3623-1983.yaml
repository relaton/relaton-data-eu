  content: Commission Regulation (EEC) No 3623/83 of 21 December 1983 fixing the difference
    in white sugar prices to be used in calculating the levy for processed fruit and
    vegetable products and for wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3623/83 de la Commission, du 21 décembre l983, fixant
