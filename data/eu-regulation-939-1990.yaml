    dei codici NC ex 7407 e 7411, originari del Messico, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3896/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 939/90 VAN DE COMMISSIE van 11 april 1990 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op staven, profielen,
