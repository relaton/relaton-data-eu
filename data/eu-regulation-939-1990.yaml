    ex 7407 και 7411, καταγωγής Μεξικού, δικαιούχου των
    προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ. 3896/89
    του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 939/90 DELLA COMMISSIONE dell'11 aprile 1990 che ripristina
