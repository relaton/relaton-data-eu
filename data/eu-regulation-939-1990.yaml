title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 939/90 of 11 April 1990 reintroducing the
    levying of the customs duties applicable to copper bars, rods, profiles, tubes
    and pipes of CN codes ex 7407 and 7411 originating in Mexico to which the preferential
    arrangements of Council Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 939/90 de la Commission du 11 avril 1990 portant rétablissement
    de la perception des droits de douane applicables aux barres, profilés, tubes
    et tuyaux en cuivre des codes NC ex 7407 et 7411, originaires du Mexique, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 939/90 DER KOMMISSION vom 11. April 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer Stangen (Staebe) und Profile, Rohre aus Kupfer der
    KN-Code ex 7407 und 7411 mit Ursprung in Mexiko, dem die in der Verordnung (EWG)
    Nr. 3896/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 939/90 af 11. april 1990 om genindførelse
    af opkrævning af told for stænger, profiler og rør af kobber, henhørende under
    KN-kode ex 7407 og 7411 og med oprindelse i Mexico, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3896/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 939/90 της Επιτροπής
