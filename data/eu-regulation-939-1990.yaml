    Mexico, waarvoor de in Verordening (EEG) nr. 3896/89 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 939/90 DA COMISSAO de 11 de Abril de 1990 que restabelece
