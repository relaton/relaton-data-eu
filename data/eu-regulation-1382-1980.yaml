  content: Commission Regulation (EEC) No 1382/80 of 5 June 1980 derogating from Regulation
    (EEC) No 486/80 as regards the calculation of the amount of the reduction of import
    duties for beef and veal products from the African, Caribbean and Pacific States
    for the period beginning 2 June 1980
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1382/80 de la Commission, du 5 juin 1980, portant
    dérogation au règlement (CEE) n° 486/80 en ce qui concerne le calcul des montants
    de diminution des droits à l' importation de produits du secteur de la viande
    bovine originaires des États d' Afrique, des Caraïbes et du Pacifique pour la
    période débutant le 2 juin 1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1382/80 der Kommission vom 5. Juni 1980 zur Abweichung
    von der Verordnung (EWG) Nr. 486/80 betreffend die Berechnung der Beträge zur
    Senkung der Eingangsabgaben für Rindfleischerzeugnisse mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean für den am 2. Juni 1980
    beginnenden Zeitraum
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1382/80 af 5. juni 1980 om undtagelse
    fra forordning (EØF) nr. 486/80 med hensyn til beregningen af de beløb, hvormed
    importafgiften nedsættes ved indførsel af oksekød fra lande i Afrika, Vestindien
    og Stillehavet i den periode, der begynder den 2. juni 1980
  type: main
- language: el
  script: Grek
