title:
- language: en
  script: Latn
  content: '73/375/EEC: Commission Decision of 4 October 1973 authorizing the French
    Republic not to apply Community treatment to prepared or preserved tunny (in hermetically
    closed containers) falling within heading No 16.04 ex E of the Common Customs
    Tariff, originating in USSR and in free circulation in Belgium'
  type: main
- language: fr
  script: Latn
  content: '73/375/CEE: Décision de la Commission, du 4 octobre 1973, autorisant
    la République française à exclure du traitement communautaire des préparations
    et conserves de thon (en récipients hermétiquement fermés), de la position
    16.04 ex E du tarif douanier commun, originaires d'' URSS et mis en libre pratique
    en Belgique'
  type: main
- language: de
  script: Latn
  content: '73/375/EWG: Entscheidung der Kommission vom 4. Oktober 1973, mit der die
    Französische Republik ermächtigt wird, aus der UdSSR stammende und in Belgien
    im freien Verkehr befindliche zubereitete und haltbar gemachte Thunfische (in
    hermetisch verschlossenen Behältern) der Tarifnummer 16.04 ex E des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '73/375/EØF: Kommissionens Beslutning af 4. oktober 1973 om bemyndigelse
    for Den franske Republik til fra fællesskabsbehandling at undtage tunfisk tilberedt
    eller konserveret, (i hermetisk lukket emballage) som henhører under position
    16.04 ex E i den fælles toldtarif, har oprindelse i USSR og frit kan omsættes
    i Belgien'
  type: main
- language: it
  script: Latn
  content: '73/375/CEE: Decisione della Commissione, del 4 ottobre 1973, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le preparazioni
    e conserve di tonno (in recipienti ermeticamente chiusi) della voce n. 16.04 ex
    E della tariffa doganale comune, originarie dell'' URSS e messe in libera pratica
    nel Belgio'
  type: main
- language: nl
  script: Latn
  content: '73/375/EEG: Beschikking van de Commissie van 4 oktober 1973 waarbij de
    Franse Republiek wordt gemachtigd bereidingen en conserven van tonijn, in hermetisch
    gesloten verpakkingen van post 16.04 ex E van het gemeenschappelijk douanetarief,
    van oorsprong uit de U.S.S.R. en in België in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten'
  type: main
