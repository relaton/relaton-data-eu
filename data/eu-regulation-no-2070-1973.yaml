  content: Regulation (EEC) No 2070/73 of the Commission of 30 July 1973 amending
    Regulation (EEC) No 1493/71 as regards the calculation of price increases and
    reductions applicable to intervention in rye
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2070/73 de la Commission, du 30 juillet 1973, modifiant
    le règlement (CEE) n° 1493/71 en ce qui concerne le calcul des bonifications
    et réfactions à appliquer au prix du seigle lors de la prise en charge à l'
    intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2070/73 der Kommission vom 30. Juli 1973 zur Änderung
    der Verordnung (EWG) Nr. 1493/71 bezüglich der Berechnung der bei der Intervention
    auf den Roggenpreis anzuwendenden Zu- und Abschläge
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2070/73 af 30. juli 1973 om ændring
    af forordning (EØF) nr. 1493/71 for så vidt angår beregningen af tillæg til
    og fradrag i rugprisen, i forbindelse med overtagelse ved intervention
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2070/73 della Commissione, del 30 luglio 1973, che
    modifica il regolamento (CEE) n. 1493/71 per quanto riguarda il calcolo delle
    maggiorazioni e detrazioni applicabili ai prezzi della segala all' atto della
    presa in consegna da parte degli organismi d' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2070/73 van de Commissie van 30 juli 1973 houdende
    wijziging van Verordening (EEG) nr. 1493/71 voor wat betreft de berekening van
    de bij overneming in interventie op de prijs van rogge toe te passen toeslagen
    en kortingen
