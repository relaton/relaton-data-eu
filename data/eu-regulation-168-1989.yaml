title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 168/89 of 24 January 1989 introducing a
    countervailing charge and suspending the preferential customs duty on imports
    of fresh sweet oranges originating in Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 168/89 de la Commission, du 24 janvier 1989, instituant
