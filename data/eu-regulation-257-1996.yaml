title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 257/96 of 12 February 1996 amending Regulation
    (EEC) No 3381/81 and Council Regulation (EEC) No 1442/88 as regards certain amounts
    whose values in ecus have been adjusted as a result of the abolition of the correcting
    factor for the agricultural conversion rates
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 257/96 de la Commission, du 12 février 1996, modifiant
    les règlements (CEE) nº 3388/81 et (CEE) nº 1442/88 du Conseil en ce qui concerne
    certains montants dont les valeurs en écus ont été adaptées en raison de la
    suppression du facteur de correction des taux de conversion agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 257/96 der Kommission vom 12. Februar 1996 zur Änderung
    der Verordnungen (EWG) Nr. 3388/81 und (EWG) Nr. 1442/88 des Rates hinsichtlich
    mehrerer, wegen Aufhebung des Berichtigungsfaktors der landwirtschaftlichen Umrechnungskurse
    angepaßter Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 257/96 af 12. februar 1996 om ændring
    af forordning (EØF) nr. 3388/81 og (EØF) nr. 1442/88 for så vidt angår visse
    beløb, hvis ecu- værdi er blevet justeret som følge af afskaffelsen af justeringsfaktoren
    for landbrugsomregningskurserne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 257/96 της Επιτροπής,
    της 12ης Φεβρουαρίου 1996, για τροποποίηση των
    κανονισμών (ΕΟΚ) αριθ. 3388/81 και (ΕΟΚ) αριθ. 1442/88
    του Συμβουλίου όσον αφορά ορισμένα ποσά των
    οποίων οι τιμές σε Ecu προσαρμόσθηκαν λόγω της
    καταργήσεως του διορθωτικού συντελεστή των
    γεωργικών ισοτιμιών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 257/96, annettu 12 päivänä helmikuuta 1996,
    asetuksen (ETY) N:o 3388/81 ja neuvoston asetuksen (ETY) N:o 1442/88 muuttamisesta
    tiettyjen sellaisten määrien osalta, joiden ecuina ilmoitettu arvo on mukautettu
    maatalouden muuntokurssien korjauskertoimen poistamisen vuoksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 257/96 della Commissione, del 12 febbraio 1996, che
    modifica i regolamenti (CEE) n. 3388/81 e (CEE) n. 1442/88 del Consiglio per quanto
    riguarda alcuni importi i cui valori in ecu sono stati adattati a causa della
    soppressione del coefficiente correttore dei tassi di conversione agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 257/96 van de Commissie van 12 februari 1996 tot wijziging
    van de Verordeningen (EEG) nr. 3388/81 en (EEG) nr. 1442/88 wat betreft bepaalde
    bedragen waarvan de waarden in ecu zijn aangepast in verband met de afschaffing
    van de correctiefactor voor de landbouwomrekeningskoersen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 257/96 da Comissão, de 12 de Fevereiro de 1996, que
    altera os Regulamentos (CEE) nº 3388/81 e (CEE) nº 1442/88 do Conselho no que
    diz respeito a determinados montantes cujos valores em ecus foram adaptados devido
    à supressão do factor de correcção das taxas de conversão agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 257/96 de la Comisión, de 12 de febrero de 1996, por
    el que se modifican los Reglamentos (CEE) ns 3388/81 y 1442/88 del Consejo en
    lo relativo a determinados importes cuyos valores en ecus se han adaptado al suprimirse
    el factor de corrección de los tipos de conversión agrarios
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 257/96 av den 12 februari 1996 om ändring
    av förordning (EEG) nr 3388/81 och rådets förordning (EEG) nr 1442/88 med avseende
    på vissa belopp vars värde i ecu har anpassats med hänsyn till avskaffandet
    av korrektionsfaktorn för jordbruksomräkningskurserna
  type: main
