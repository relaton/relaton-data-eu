title:
- language: en
  script: Latn
  content: '95/159/EC: Commission Decision of 20 April 1995 amending the information
    contained in the list in the Annex to Commission Regulation (EC) No 3206/94 establishing,
    for 1995, the list of vessels exceeding eight metres length overall and permitted
    to fish for sole within certain areas of the Community using beam trawls whose
    aggregate length exceeds nine metres'
  type: main
- language: fr
  script: Latn
  content: '95/159/CE: Décision de la Commission du 20 avril 1995 modifiant certaines
    informations sur la liste figurant à l''annexe du règlement (CE) n° 3206/94
    établissant pour 1995 la liste des bateaux dont la longueur hors tout dépasse
    huit mètres, autorisés à pêcher la sole dans certaines zones de la Communauté
    à l''aide de chaluts à perches dont la longueur totale dépasse neuf mètres'
  type: main
- language: de
  script: Latn
  content: '95/159/EG: Entscheidung der Kommission vom 20. April 1995 zur Änderung
    bestimmter Angaben in der Liste des Anhangs der Verordnung (EG) Nr. 3206/94 zur
    Festlegung der Liste für 1995 der Schiffe mit einer Länge über alles von mehr
    als 8 m, die in bestimmten Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtlänge
    mehr als 9 m beträgt, auf Seezunge fischen dürfen'
  type: main
- language: da
  script: Latn
  content: '95/159/EF: Kommissionens beslutning af 20. april 1995 om ændring af visse
    oplysninger i listen i bilaget til forordning (EF) nr. 3206/94 om listen for 1995
    over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter tunge
    i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl, hvis
    samlede bomlængde overstiger 9 m'
  type: main
- language: el
  script: Grek
  content: '95/159/ΕΚ: Απόφαση της Επιτροπής της 20ής Απριλίου
    1995 για τροποποίηση ορισμένων στοιχείων του
    καταλόγου που εμφαίνεται στο παράρτημα του
    κανονισμού (ΕΚ) αριθ. 3206/94 που καταρτίζει, για
    το 1995, τον κατάλογο των σκαφών άνω των οκτώ
    μέτρων τα οποία επιτρέπεται να αλιεύουν γλώσσα
    σε ορισμένες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα εννέα μέτρα'
  type: main
- language: fi
  script: Latn
  content: '95/159/EY: Komission päätös, tehty 20 päivänä huhtikuuta 1995, tietyillä
    yhteisön alueilla yhdeksän metrin kokonaispituuden ylittävän puomitroolin
    käyttöluvan kielikampelan (merianturan) kalastuksessa omaavien kahdeksan metrin
    kokonaispituuden ylittävien alusten vuotta 1995 koskevasta luettelosta annetun
    asetuksen (EY) N:o 3206/94 liitteessä olevan luettelon tiettyjen tietojen muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '95/159/CE: Decisione della Commissione del 20 aprile 1995 che modifica
    alcuni dati dell''elenco che figura nell''allegato del regolamento (CE) n. 3206/94
    che fissa l''elenco, per il 1995, dei pescherecci di lunghezza fuori tutto superiore
    a otto metri, autorizzati a pescare la sogliola in determinate zone della Comunità,
    utilizzando reti a strascico a pali, la cui lunghezza complessiva superi i nove
    metri'
  type: main
- language: nl
  script: Latn
  content: '95/159/EG: Beschikking van de Commissie van 20 april 1995 tot wijziging
    van bepaalde gegevens van de lijst in de bijlage bij Verordening (EG) nr. 3206/94
    tot vaststelling voor 1995 van de lijst van vaartuigen met een lengte over alles
    van meer dan 8 meter en die in bepaalde zones van de Gemeenschap met boomkorren
    waarvan de totale boomlengte meer dan 9 meter bedraagt, op tong mogen vissen'
  type: main
- language: pt
  script: Latn
  content: '95/159/CE: Decisão da Comissão de 20 de Abril de 1995 que altera certas
    informações da lista constante do anexo do Regulamento (CE) nº 3206/94 que
    estabelece para 1995 a lista dos navios com mais de oito metros de comprimento
    de fora a fora autorizados a pescar linguado em determinadas zonas da Comunidade,
    utilizando redes de arrasto de vara em que o comprimento total das varas seja
    superior a nove metros'
  type: main
- language: es
  script: Latn
  content: '95/159/CE: Decisión de la Comisión de 20 de abril de 1995 que modifica
    algunos datos de la lista que figura en el Anexo del Reglamento (CE) n° 3206/94
    por el que se establece para 1995 la lista de barcos cuya eslora total excede
    los ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizando artes de arrastre de vara cuya longitud total
    supere los nueve metros'
  type: main
- language: sv
  script: Latn
  content: '95/159/EG: Kommissionens beslut av den 20 april 1995 om ändring av vissa
    upplysningar på förteckningen i bilagan till förordning (EG) nr 3206/94 om
    upprättande för 1995 av förteckningen över fartyg med en största längd som
    överstiger åtta meter, vilka vid fiske av sjötunga inom vissa av gemenskapens
    områden har tillstånd att använda bomtrålar vars sammanlagda bomlängd överstiger
    nio meter'
  type: main
