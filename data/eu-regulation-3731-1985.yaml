    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη που είναι νηολογημένα στις νήσους Φερόε
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3731/85 del Consiglio del 20 dicembre 1985 che stabilisce,
