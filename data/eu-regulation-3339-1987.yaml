  content: Council Regulation (EEC) No 3339/87 of 4 November 1987 imposing a definitive
    anti-dumping duty on imports of urea originating in Libya and Saudi Arabia and
    accepting undertakings given in connection with imports of urea originating in
    Czechoslovakia, the German Democratic Republic, Kuwait, the USSR, Trinidad and
    Tobago and Yugoslavia and terminating these investigations
  type: main
