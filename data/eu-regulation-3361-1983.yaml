    d' intervention et à reporter à l' exercice 1984
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3361/83 der Kommission vom 29. November 1983 zur Festsetzung
    der Preise, die bei der Berechnung des Wertes der in Interventionslagerbeständen
    befindlichen und auf das Haushaltsjahr 1984 zu übertragenden landwirtschaftlichen
    Erzeugnisse zugrunde zu legen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3361/83 af 29. november 1983 om fastsættelse
