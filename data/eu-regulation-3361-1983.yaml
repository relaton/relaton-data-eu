    agricoli giacenti all' intervento da riportare all' esercizio 1984
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3361/83 van de Commissie van 29 november 1983 houdende
    vaststelling van de prijzen die moeten worden toegepast voor de berekening van
    de waarde van landbouwprodukten in interventievoorraden die moeten worden overgeboekt
    naar het begrotingsjaar 1984
