    καθιερώσεως του κώδικος και των τυπικών κανόνων
    που διέπουν τη μεταγραφή σε μορφή αναγνώσιμη
    από μηχανή των στοιχείων των ερευνών επί των
    φυτειών ορισμένων ειδών οπωροφόρων δένδρων
    και καθορισμού των ορίων των περιοχών παραγωγής
