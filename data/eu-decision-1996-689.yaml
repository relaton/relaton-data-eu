    viljelmiä koskevien tietojen keruun tulosten siirtoa koneellisesti luettavaan
    muotoon, sekä tuotantoalueiden rajoista näitä tietojen keruita varten tehdyn
    päätöksen 77/144/ETY muuttamisesta'
  type: main
- language: hr
  script: Latn
  content: '96/689/EZ: Odluka Komisije od 25. studenoga 1996. o izmjeni Odluke 77/144/EEZ
