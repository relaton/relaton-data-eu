    vonatkozó egységes kód és szabályok megállapításáról, valamint az e
    felmérések tárgyát képező termőterületek határainak megállapításáról
    szóló 77/144/EGK határozat módosításáról
  type: main
- language: it
  script: Latn
  content: '96/689/CE: Decisione della Commissione del 25 novembre 1996 che modifica
    la decisione 77/144/CEE che stabilisce il codice delle norme tipo per la trascrizione
    in una forma che si presti a lettura meccanografica dei risultati delle indagini
    sulla piantata di alcune specie di alberi da frutto nonché delle delimitazioni
    delle zone di produzione per queste indagini'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1996. gada 25. novembris), ar kuru groza Lēmumu 77/144/EEK,
    ar ko nosaka tipveida kodu un noteikumus, kas regulē dažu augļu koku sugu stādījumu
    apsekojumu datu transkripciju mašīnlasāmā formā, un nosaka ražošanas apgabalu
    robežas attiecībā uz šiem apsekojumiem
  type: main
- language: lt
  script: Latn
  content: 1996 m. lapkričio 25 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    77/144/EEB, nustatantį tipinį kodeksą bei taisykles, reguliuojančias kai kurių
    vaismedžių rūšių tyrimų duomenų perrašymą į automatizuotai nuskaitomą
    formą, bei nustatantį šių tyrimų gamybos plotų ribas
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-25 ta’ Novembru 1996 li temenda d-Deċiżjoni
    77/144/KEE li tistabbilixxi l-kodiċi standard u r-regoli li jiggvernaw it-traskrizzjoni
    f’forma li tinqara bil-magni tad-data ta’ l-istħarriġ taż-żoni ta’ tħawwil
    ta’ ċerti speċi ta’ siġar tal-frott, u tistabbilixxi l-limiti ta’ l-oqsma
    produttivi għal dawn l-istħarriġ
  type: main
- language: nl
  script: Latn
  content: '96/689/EG: Beschikking van de Commissie van 25 november 1996 tot wijziging
    van Beschikking 77/144/EEG ter vaststelling van de code en de standaardvoorschriften
    voor het omzetten in voor de machine leesbare vorm van de gegevens uit de statistische
    enquêtes teneinde het produktiepotentieel van bepaalde soorten fruitbomen vast
    te stellen, en om de grenzen van de produktiegebieden voor deze enquêtes vast
    te stellen'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 25 listopada 1996 r. zmieniająca decyzję 77/144/EWG
    ustanawiającą standardowy kod i zasady dotyczące przekształcania danych z
    badań statystycznych plantacji niektórych gatunków drzew owocowych na formę
    czytelną dla urządzeń i ustanawiająca granice obszarów upraw dla tych badań
  type: main
- language: pt
  script: Latn
  content: '96/689/CE: Decisão da Comissão de 25 de Novembro de 1996 que altera
    a Decisão 77/144/CEE, estabelecendo o código e as regras-tipo relativas à transcrição,
    em forma legível por máquina, dos dados dos inquéritos sobre as superfícies
    plantadas de certas espécies de árvores de fruto, e que fixa os limites das
    zonas de produção para estes inquéritos'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 25 noiembrie 1996 de modificare a Deciziei 77/144/CEE
    de stabilire a codului standard și a regulilor care reglementează transcrierea
    într-o formă care poate fi interpretată electronic a datelor anchetelor privind
    plantațiile de anumite specii de pomi fructiferi și de stabilire a limitelor
    zonelor de producție pentru aceste anchete
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 25. novembra 1996, ktorým sa mení a dopĺňa rozhodnutie
    77/144/EHS, ktorým sa stanovuje štandardný kód a pravidlá upravujúce prepis
    údajov z prieskumov sadov s určitými druhmi ovocných stromov do strojovo snímateľnej
    formy a ktorým sa stanovujú hranice produkčných oblastí pre tieto prieskumy
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 25. novembra 1996o spremembi Odločbe 77/144/EGS
    o standardni kodi in pravilih za transkripcijo podatkov statističnih raziskovanj
    intenzivnih sadovnjakov z nekaterimi vrstami sadnih dreves v strojno čitljivo
    obliko in o mejah pridelovalnih območij za ta raziskovanj
  type: main
- language: es
  script: Latn
  content: '96/689/CE: Decisión de la Comisión de 25 de noviembre de 1996 que modifica
    la Decisión 77/144/CEE, por la que se establecen el código y las normas tipo
    relativas a la transcripción en forma legible por máquina de los datos de las
    encuestas sobre las plantaciones de determinadas especies frutales y por la que
    determinan los límites de las zonas de producción de dichas encuestas'
  type: main
- language: sv
  script: Latn
  content: '96/689/EG: Kommissionens beslut av den 25 november 1996 om ändring av
    beslut 77/144/EEG om fastställande av en standardkod och bestämmelser för överföring
    till maskinläsbar form av data från de statistiska undersökningarna av odlingar
    med vissa slag av fruktträd samt om fastställandet av gränserna för produktionsområdena
    för dessa undersökningar'
