title:
- language: en
  script: Latn
  content: '96/689/EC: Commission Decision of 25 November 1996 amending Decision 77/144/EEC
    laying down the standard code and rules governing the transcription into a machine-readable
    form of the data of the surveys of plantations of certain species of fruit trees,
    and laying down the boundaries of the production areas for these surveys'
  type: main
- language: fr
  script: Latn
  content: '96/689/CE: Décision de la Commission du 25 novembre 1996 modifiant la
    décision 77/144/CEE établissant le code et les règles types relatifs à la
    transcription sous une forme lisible par machine des données des enquêtes sur
    les plantations de certaines espèces d''arbres fruitiers et fixant les limites
    des zones de production pour ces enquêtes'
  type: main
- language: de
  script: Latn
  content: '96/689/EG: Entscheidung der Kommission vom 25. November 1996 zur Änderung
    der Entscheidung 77/144/EWG bezüglich der Festlegung eines Kodes und einer Standardregelung
    zur Übertragung der Erhebungsdaten über Anlagen gewisser Obstarten in maschinenlesbarer
    Form und zur Festsetzung der Abgrenzungen der Produktionszonen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 25 ноември 1996 година
    за изменение на Решение 77/144/ЕИО относно определяне
    на стандартни кодове и правила относно изписване
    в машинно четивна форма на данните от изследванията
    на насажденията на някои видове плодни дървета
    и за определяне границите на производствените
    зони за тези изследвания
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 25. listopadu 1996, kterým se mění rozhodnutí
    77/144/EHS, kterým se stanoví standardní kódy a pravidla pro přepis údajů
    ze zjišťování sadů určitých druhů ovocných stromů do strojově čitelné
    formy a kterým se stanoví hranice pěstitelských oblastí pro tato zjišťování
  type: main
- language: da
  script: Latn
  content: '96/689/EF: Kommissionens Beslutning af 25. november 1996 om ændring af
    beslutning 77/144/EØF om fastsættelse af den kode og de standardregler, der
    gælder for omskrivning til maskinlæsbar form af resultaterne fra undersøgelserne
    af plantager med visse arter af frugttræer, og om fastsættelse af grænserne
    for produktionszonerne med henblik på disse undersøgelser'
  type: main
- language: el
  script: Grek
