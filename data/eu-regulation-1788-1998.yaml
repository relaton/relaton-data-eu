title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1788/98 of 14 August 1998 deciding not to
    accept tenders submitted in response to the 207th partial invitation to tender
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1788/98 de la Commission du 14 août 1998 disposant
