    mukaisesti toteutetun kahdennensadannenseitsemännen osittaisen tarjouskilpailun
    ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1788/98 della Commissione del 14 agosto 1998 che decide
