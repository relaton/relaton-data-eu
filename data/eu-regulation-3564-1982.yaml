    produits du secteur du sucre exportés sous forme de marchandises ne relevant
    pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3564/82 der Kommission vom 30. Dezember 1982 zur Festsetzung
