  script: Latn
  content: Commission Regulation (EEC) No 3564/82 of 30 December 1982 fixing the rates
    of the refunds applicable from 1 January 1983 to certain products in the sugar
    sector exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3564/82 de la Commission, du 30 décembre 1982, fixant
