title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2723/82 of 12 October 1982 amending Regulation
    (EEC) No 467/77 on the method and the rate of interest to be used for calculating
    the costs of financing intervention measures comprising buying in, storage and
    disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2723/82 de la Commission, du 12 octobre 1982, modifiant
    le règlement (CEE) n° 467/77 relatif à la méthode et au taux d' intérêt
    à appliquer pour le calcul des frais de financement des interventions consistant
    en achats, stockage et écoulement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2723/82 der Kommission vom 12. Oktober 1982 zur Änderung
    der Verordnung (EWG) Nr. 467/77 über die Methode und den Zinssatz, die bei der
    Berechnung der Finanzierungskosten für Interventionen in Form von Ankauf, Lagerung
    und Absatz anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2723/82 af 12. oktober 1982 om ændring
    af forordning (EØF) nr. 467/77 om den metode og den rentesats, der skal anvendes
    ved beregningen af finansieringsudgifter i forbindelse med interventioner i form
    af opkøb, oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2723/82 τής Επιτροπής
    τής 12ης Οκτωβρίου 1982 περί τροποποιήσεως τού
    κανονισμού (EOK) αριθ. 467/77 περί τής μεθόδου καί
    τού επιτοκίου πού πρέπει νά εφαρμοσθούν γιά
    τόν υπολογισμό τών εξόδων χρηματοδοτήσεως
    τών παρεμβάσεων, πού συνίστανται σέ αγορές,
    αποθεματοποίηση καί διάθεση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2723/82 della Commissione, del 12 ottobre 1982, che
    modifica il regolamento (CEE) n. 467/77, che stabilisce il metodo ed il tasso
    d' interesse da utilizzare per il calcolo delle spese di finanziamento degli interventi
    costituiti da acquisti, magazzinaggio e venditae
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2723/82 van de Commissie van 12 oktober 1982 tot
    wijziging van Verordening (EEG) nr. 467/77 met betrekking tot de methode en de
    rentevoet die dienen te worden toegepast bij de berekening van de financieringskosten
    van de interventies in de vorm van aankoop, opslag en afzetr
