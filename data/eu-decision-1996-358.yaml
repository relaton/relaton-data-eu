    pour la formation des agents nationaux associés aux activités de contrôle applicables
    à la politique commune de la pêche (Les textes en langues espagnole, allemande,
    anglaise, française, néerlandaise, portugaise, finnoise et suédoise sont les
    seuls faisant foi.)'
  type: main
