  script: Latn
  content: '96/358/EC: Commission Decision of 30 May 1996 on the eligibility of expenditure
    planned for 1996 by certain Member States for the training of national officials
    connected with control activities applicable to the common fisheries policy (Only
    the Spanish, German, English, French, Dutch, Portuguese, Finnish and Swedish texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/358/CE: Décision de la Commission du 30 mai 1996 relative à l''admissibilité
