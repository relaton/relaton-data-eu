  content: Regulation (EEC) No 3538/73 of the Council of 18 December 1973 on the use
    to be made of inward processing arrangements in trade in goods covered by Regulation
    (EEC) No 1059/69 between Member States of the Community as originally constituted
    and the new Member States and between the new Member States themselves
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3538/73 du Conseil, du 18 décembre 1973, relatif
