    8527, 8528 und 8529 der Kombinierten Nomenklatur mit Ursprung in Malaysia, dem
    die in der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1077/88 af 25. april 1988 om genindførelse
