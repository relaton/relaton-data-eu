  script: Latn
  content: Commission Regulation (EEC) No 1077/88 of 25 April 1988 re-establishing
    the levying of customs duties on reception apparatus for radio-telephony falling
    within CN codes 8527, 8528 and 8529, originating in Malaysia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1077/88 de la Commission du 25 avril 1988 portant
    rétablissement de la perception des droits de douane applicables aux appareils
    récepteurs pour la radiotéléphonie des codes NC 8527, 8528 et 8529, originaires
    de Malaysia, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1077/88 der Kommission vom 25. April 1988 zur Wiedereinführung
