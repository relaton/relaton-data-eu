title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3372/90 of 23 November 1990 amending Regulation
    (EEC) No 643/86 laying down detailed rules for the application of the supplementary
    trade mechanism to the live plants and floriculture products imported into Portugal
    concerning the target ceilings for ornamental plants for 1990
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3372/90 de la Commission du 23 novembre 1990 modifiant
    le règlement (CEE) n° 643/86 de la Commission déterminant les modalités d'application
    du mécanisme complémentaire aux échanges pour les produits du secteur des plantes
    vivantes et de la floriculture importés au Portugal, en ce qui concerne les plafonds
    indicatifs fixés pour les plantes ornementales, pour l'année 1990
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3372/90 DER KOMMISSION vom 23. November 1990 zur
    Änderung der Verordnung (EWG) Nr. 643/86 mit Durchführungsbestimmungen zum ergänzenden
    Handelsmechanismus für die nach Portugal eingeführten Erzeugnisse des Sektors
    lebende Pflanzen und Waren des Blumenhandels betreffend die Richtplafonds für
    Zierpflanzen für das Jahr 1990 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3372/90 af 23. november 1990 om ændring
    af forordning (EØF) nr. 643/86 om gennemførelsesbestemmelser til den supplerende
    mekanisme for samhandelen med levende planter og blomsterdyrkningens produkter
    importeret i Portugal vedrørende de vejledende lofter for 1990 for prydplanter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3372/90 της Επιτροπής
    της 23ης Νοεμβρίου 1990 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 643/86 που καθορίζει τις λεπτομέρειες
    εφαρμογής του συμπληρωματικού μηχανισμού
    στις συναλλαγές για τα προϊόντα του τομέα των
    ζωντανών φυτών και της ανθοκομίας που εισάγονται
    στην Πορτογαλία σε ότι αφορά τα ενδεικτικά
    όρια για το έτος 1990
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3372/90 DELLA COMMISSIONE del 23 novembre 1990 che
    modifica il regolamento (CEE) n. 643/86 che fissa le modalità d'' applicazione
    del meccanismo complementare applicabile agli scambi per i prodotti appartenenti
    al settore delle piante vive e della floricultura importati in Portogallo per
    quanto riguarda i massimali indicativi per le piante ornamentali per l'' anno
    1990 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3372/90 VAN DE COMMISSIE van 23 november 1990 houdende
    wijziging van Verordening (EEG) nr. 643/86 tot vaststelling van de uitvoeringsbepalingen
    inzake de aanvullende regeling voor het handelsverkeer voor produkten van de sector
    levende planten en produkten van de bloementeelt ingevoerd in Portugal wat betreft
    de indicatieve plafonds voor sierplanten voor 1990 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3372/90 DA COMISSÃO de 23 de Novembro de 1990 que
    altera o Regulamento (CEE) nº 643/86 da Comissão, que determina as regras de
    execução do mecanismo complementar às trocas comerciais para os produtos do
    sector das plantas vivas e produtos da floricultura, importados em Portugal, no
    que se refere aos limites indicativos previstos para o ano de 1990 para as plantas
    ornamentais #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3372/90 DE LA COMISIÓN de 23 de noviembre de 1990
    que modifica el Reglamento (CEE) no 643/86, por el que se establecen normas para
    la aplicación del mecanismo complementario aplicable a los intercambios para
    los productos del sector de las plantas vivas y de la floricultura importados
    en Portugal en lo que concierne a los límites máximos indicativos para el año
    1990 #'
  type: main
