title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/1061 of 31 May 2023 on the establishment
    of the list of travel documents of the Russian Federation issued in or to persons
    resident in regions or territories in Ukraine which are occupied by the Russian
    Federation or breakaway territories in Georgia which are not under the control
    of the Georgian government that are not accepted as valid travel documents for
    the purposes of issuing of a visa or of crossing the external borders
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/1061 de la Commission du 31 mai 2023
    relative à l’établissement de la liste des documents de voyage de la Fédération
    de Russie délivrés dans les régions ou les territoires d’Ukraine qui sont
    occupés par la Fédération de Russie ou dans les territoires séparatistes de
    Géorgie qui ne sont pas sous le contrôle du gouvernement géorgien, et des documents
    de voyage russes délivrés à des personnes y résidant, qui ne sont pas acceptés
    comme des documents de voyage valables aux fins de la délivrance d’un visa
    ou du franchissement des frontières extérieures
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/1061 der Kommission vom 31. Mai 2023
    zur Aufstellung der Liste der Reisedokumente der Russischen Föderation, die in
    von der Russischen Föderation besetzten Regionen oder Gebieten in der Ukraine
    oder abtrünnigen Gebieten in Georgien, die nicht unter der Kontrolle der georgischen
    Regierung stehen, oder für Personen mit Wohnsitz in diesen Regionen und Gebieten
    ausgestellt werden und nicht als gültige Reisedokumente für die Zwecke der Visumerteilung
    und des Überschreitens der Außengrenzen anerkannt werden
  type: main
- language: bg
  script: Cyrl
