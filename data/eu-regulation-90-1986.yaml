  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 90/86 della Commissione del 17 gennaio 1986 che concede,
    per la campagna 1985/1986, la possibilità di concludere contratti di magazzinaggio
    privato a lungo termine per il vino da tavola, il mosto di uve concentrato e il
    mosto di uve concentrato rettificato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 90/86 van de Commissie van 17 januari 1986 betreffende
    het openen van de mogelijkheid tot het sluiten van langlopende contracten voor
    de particuliere opslag van tafelwijn, druivemost, geconcentreerde druivemost en
    gerectificeerde geconcentreerde druivemost voor het wijnoogstjaar 1985/1986
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 90/86 da Comissão de 17 de Janeiro de 1986 que
    permite concluir contratos de armazenamento privado a longo prazo para o vinho
    de mesa, o mosto de uvas, o mosto de uvas concentrado e o mosto de uvas concentrado
    rectificado para a campanha de 1985/1986
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 90/85 de la Comisión de 17 de enero de 1986 por el
