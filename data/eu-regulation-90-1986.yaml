title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 90/86 of 17 January 1986 authorizing the
    conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1985/86 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 90/86 de la Commission du 17 janvier 1986 ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    le vin de table, le moût de raisins, le moût de raisins concentré et le moût
    de raisins concentré rectifié pour la campagne 1985/1986
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 90/86 der Kommission vom 17. Januar 1986 zur Eröffnung
    der Möglichkeit des Abschlusses von Verträgen für die langfristige private
    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifiziertem Traubenmost für das Wirtschaftsjahr 1985/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 90/86 af 17. januar 1986 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost,
    koncentreret druemost og rektificeret koncentreret druemost for produktionsåret
    1985/86
  type: main
- language: el
  script: Grek
