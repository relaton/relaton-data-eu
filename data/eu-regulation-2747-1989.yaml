    della Malaysia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 4257/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2747/89 VAN DE COMMISSIE van 12 september 1989 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op zakken van
    polymeren van ethyleen van GN-code 3923 21 00, van oorsprong uit Maleisië, waarvoor
