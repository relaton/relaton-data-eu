title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2747/89 of 12 September 1989 re-establishing
    the levying of customs duties on sacks and bags (including cones) of polymers
    of ethylene falling within CN code 3923 21 00 orinating in Malaysia to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 4257/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2747/89 de la Commission du 12 septembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux sacs, sachets,
    pochettes et cornets, en polymères de l'éthylène, du code NC 3923 21 00, originaires
    de la Malaysia, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2747/89 DER KOMMISSION vom 12. September 1989 zur
    Wiedereinführung der Erhebung der Zölle für Säcke und Beutel (einschließlich
    Tüten) aus Polymeren des Ethylens des KN-Code 3923 21 00 mit Ursprung in Malaysia,
    dem die in der Verordnung (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2747/89 af 12. september 1989 om genindførelse
    af opkrævning af told for sække og poser (herunder bæreposer og kræmmerhuse)
    af polymere af ethylen henhørende under KN-kode 3923 21 00 og med oprindelse
    i Malaysia, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2747/89 της Επιτροπής
    της 12ης Σεπτεμβρίου 1989 περί αποκαταστάσεως
    της εφαρμογής των δασμών για σάκους, σακουλάκια,
    τσαντάκια και χωνιά, από πολυμερή του αιθυλενίου,
    του κωδικού ΣΟ 3923 21 00, καταγωγής Μαλαισίας,
    δικαιούχου των προβλεπόμενων από τον κανονισμό
    (ΕΟΚ) αριθ. 4257/88 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2747/89 DELLA COMMISSIONE del 12 settembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili ai sacchi, sacchetti,
