title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1399/74 of the Commission of 5 June 1974 amending Regulation
    (EEC) No 2865/73 as regards the list of agencies and laboratories empowered to
    issue the document accompanying wines for direct human consumption imported from
    third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1399/74 de la Commission, du 5 juin 1974, modifiant
    le règlement (CEE) n° 2865/73 en ce qui concerne les listes des organismes et
    des laboratoires habilités à établir le document accompagnant les vins importés
    des pays tiers destinés à la consommation humaine directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1399/74 der Kommission vom 5. Juni 1974 zur Änderung
    der Verordnung (EWG) Nr. 2865/73 hinsichtlich der Verzeichnisse der Stellen und
    Laboratorien, die zur Ausstellung des Dokuments befugt sind, das aus Drittländern
    eingeführten und zum unmittelbaren menschlichen Verbrauch bestimmten Wein begleiten
    muß
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1399/74 af 5. juni 1974 om ændring
    af forordning (EØF) nr. 2865/73 om oprettelse af lister over de organer og laboratorier,
    som er berettigede til at udstede den attest, der skal ledsage vin, der fra tredjelande
    indføres til direkte menneskeligt forbrug
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1399/74 della Commissione, del 5 giugno 1974, recante
    modifica del regolamento (CEE) n. 2865/73 che stabilisce gli elenchi degli organismi
    e dei laboratori abilitati ad emettere il documento che accompagna i vini importati
    in provenienza dai paesi terzi e destinati al consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1399/74 van de Commissie van 5 juni 1974 tot wijziging
    van Verordening (EEG) nr. 2865/73 ten aanzien van de lijsten der instanties en
    laboratoria die bevoegd zijn om het document op te stellen dat uit derde landen
    ingevoerde wijn bestemd voor rechtstreekse menselijke consumptie vergezelt
  type: main
