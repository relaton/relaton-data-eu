    le modalità d' applicazione del regolamento (CEE) n. 1408/71 relativo all' applicazione
    dei regimi di sicurezza sociale ai lavoratori subordinati ed ai loro familiari
    che si spostano all' interno della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2901/80 van de Commissie van 10 november 1980 tot
