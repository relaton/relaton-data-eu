title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2901/80 of 10 November 1980 amending Annexes
    5 and 6 to Council Regulation (EEC) No 574/72 laying down the procedure for implementing
    Regulation (EEC) No 1408/71 on the application of social security schemes to employed
    persons and their families moving within the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2901/80 de la Commission, du 10 novembre 1980, modifiant
    les annexes 5 et 6 du règlement (CEE) n° 574/72 du Conseil fixant les modalités
    d' application du règlement (CEE) n° 1408/71 relatif à l' application des régimes
    de sécurité sociale aux travailleurs salariés et à leur famille qui se déplacent
    à l' intérieur de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2901/80 der Kommission vom 10. November 1980 zur Änderung
    der Anhänge 5 und 6 der Verordnung (EWG) Nr. 574/72 des Rates über die Durchführung
    der Verordnung (EWG) Nr. 1408/71 zur Anwendung der Systeme der sozialen Sicherheit
    auf Arbeitnehmer und deren Familien, die innerhalb der Gemeinschaft zu- und abwandern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2901/80 af 10. november 1980 om ændring
    af bilag 5 og 6 til Rådets forordning (EØF) nr. 574/72 om regler til gennemførelse
    af forordning (EØF) nr. 1408/71 om anvendelse af de sociale sikringsordninger
    på arbejdstagere og deres familiemedlemmer, der flytter inden for Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2901/80 της Επιτροπής
