    του κανονισμού (EOK) αριθ. 1408/71 περί εφαρμογής
    των συστημάτων κοινωνικής ασφαλίσεως στους
    μισθωτούς και στις οικογένειές τους που διακινούνται
    εντός της Κοινότητος»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2901/80 della Commissione, del 10 novembre 1980, che
