---
id: EUDecision1997136
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision of 17 February 1997 authorizing Member States to continue
    to apply to certain mineral oils, when used for specific purposes, existing reduced
    rates of excise duty or exemptions from excise duty in accordance with the procedure
    provided for in Article 8 (4) of Directive 92/81/EEC
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil du 17 février 1997 autorisant les États membres
    à continuer à appliquer à certaines huiles minérales utilisées à des fins
    spécifiques les réductions de taux d'accises ou les exonérations d'accises
    existantes, conformément à la procédure prévue à l'article 8 paragraphe 4
    de la directive 92/81/CEE
  type: main
- language: de
  script: Latn
  content: Entscheidung des Rates vom 17. Februar 1997 zur Ermächtigung bestimmter
    Mitgliedstaaten, gemäß dem Verfahren in Artikel 8 Absatz 4 der Richtlinie 92/81/EWG
    ermäßigte Verbrauchsteuersätze oder Verbrauchsteuerbefreiungen für Mineralöle
    mit bestimmten Verwendungszwecken beizubehalten
  type: main
- language: da
  script: Latn
  content: Rådets Beslutning af 17. februar 1997 om bemyndigelse af medlemsstaterne
    til i overensstemmelse med artikel 8, stk. 4, i direktiv 92/81/EØF fortsat at
    anvende de gældende punktafgiftsnedsættelser eller -fritagelser for visse typer
    mineralolie, der anvendes til særlige formål
  type: main
- language: el
  script: Grek
  content: '97/136/ΕΚ: Απόφαση του Συμβουλίου της 17ης
    Φεβρουαρίου 1997 περί εξουσιοδοτήσεως των κρατών
    μελών να εξακολουθήσουν να εφαρμόζουν σε ορισμένα
    πετρελαιοειδή, όταν χρησιμοποιούνται για συγκεκριμένους
    σκοπούς, τους ισχύοντες μειωμένους συντελεστές
    του ειδικού φόρου κατανάλωσης ή τις ισχύουσες
    απαλλαγές από το φόρο αυτό, σύμφωνα με τη διαδικασία
    που προβλέπεται στο άρθρο 8 παράγραφος 4 της
    οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '97/136/EY: Neuvoston päätös, tehty 17 päivänä helmikuuta 1997, luvan
    antamisesta jäsenvaltioille edelleen soveltaa tiettyihin erityistarkoituksiin
    käytettyihin kivennäisöljyihin valmisteveron alennuksia tai vapautuksia valmisteverosta
    direktiivin 92/81/ETY 8 artiklan 4 kohdassa säädetyn menettelyn mukaisesti'
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio del 17 febbraio 1997 che autorizza gli Stati membri
    a continuare ad applicare a determinati oli minerali utilizzati per fini specifici
    le riduzioni delle aliquote d'accisa o esenzioni dall'accisa già esistenti, secondo
    la procedura di cui all'articolo 8, paragrafo 4 della direttiva 92/81/CEE
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Raad van 17 februari 1997 waarbij de Lidstaten toestemming
    wordt verleend op bepaalde, voor specifieke doeleinden gebruikte minerale oliën
    bestaande verlagingen of vrijstellingen van het accijnsrecht te blijven toepassen
    overeenkomstig de procedure van artikel 8, lid 4, van Richtlijn 92/81/EEG
  type: main
- language: pt
  script: Latn
  content: Decisão do Conselho de 17 de Fevereiro de 1997 que autoriza determinados
    Estados-membros a continuarem a aplicar a certos óleos minerais, utilizados para
    fins específicos, as reduções da taxa ou as isenções do imposto especial
    de consumo em vigor, nos termos do procedimento previsto no nº 4 do artigo 8º
    da Directiva 92/81/CEE
  type: main
- language: es
  script: Latn
  content: Decisión del Consejo de 17 de febrero de 1997 por la que se autoriza a
    los Estados miembros a continuar aplicando a determinados hidrocarburos utilizados
    para fines específicos, las exenciones o reducciones de tipos del impuesto especial
    existentes, de conformidad con el procedimiento previsto en el apartado 4 del
    artículo 8 de la Directiva 92/81/CEE
  type: main
- language: sv
  script: Latn
  content: '97/136/EG: Rådets beslut av den 17 februari 1997 om tillåtelse för
    medlemsstater att i enlighet med det förfarande som föreskrivs i artikel 8.4
    i direktiv 92/81/EEG för vissa mineraloljor fortsätta att tillämpa nedsatta
    punktskattesatser eller befrielse från punktskatt, när dessa används för särskilda
    ändamål'
  type: main
