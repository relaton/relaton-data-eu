id: EURegulation24651995
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2465/95 of 23 October 1995 laying down certain
    detailed rules for the application of a tariff quota for live bovine animals weighing
    between 160 and 300 kilograms originating in certain third countries as provided
    for in Council Regulation (EC) No 2179/95, and repealing Regulation (EC) No 1842/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2465/95 de la Commission, du 23 octobre 1995, établissant
    certaines modalités d' application pour un contingent tarifaire d' animaux vivants
    de l' espèce bovine d' un poids de 160 à 300 kilogrammes, originaires de certains
    pays tiers prévu par le règlement (CE) nº 2179/95 et abrogeant le règlement
    (CE) nº 1842/95
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2465/95 der Kommission vom 23. Oktober 1995 zur Festlegung
    bestimmter Durchführungsbestimmungen zu den Zollkontingenten für die Einfuhr
    von lebenden Rindern mit einem Stückgewicht von 160 bis 300 kg mit Ursprung in
    bestimmten Drittländern gemäß der Verordnung (EG) Nr. 2179/95 und zur Aufhebung
    der Verordnung (EG) Nr. 1842/95
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2465/95 af 23. oktober 1995 om gennemførelsesbestemmelser
    for det toldkontingent for levende kvæg af en vægt på 160 til 300 kg med oprindelse
    i bestemte tredjelande, der er fastsat i Rådets forordning (EF) nr. 2179/95,
    og om ophævelse af forordning (EF) nr. 1842/95
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2465/95 της Επιτροπής
    της 23ης Οκτωβρίου 1995 για τον καθορισμό ορισμένων
    λεπτομερειών εφαρμογής της δασμολογικής ποσόστωσης
    ζώντων βοοειδών, βάρους 130 έως 300 χιλιογράμμων,
    καταγωγής ορισμένων τρίτων χωρών που προβλέπεται
    από τον κανονισμό (ΕΚ) αριθ. 2179/95 του Συμβουλίου
    και για την κατάργηση του κανονισμού (ΕΚ) αριθ.
    1842/95
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2465/95, annettu 23 päivänä lokakuuta 1995,
    asetuksessa (EY) N:o 2179/95 säädetyn, tietyistä kolmansista maista peräisin
    olevia 160-300 kilogramman painoisia eläviä nautaeläimiä koskevan tariffikiintiön
    soveltamista koskevista yksityiskohtaisista säännöistä ja asetuksen (EY) N:o
    1842/95 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2465/95 della Commissione, del 23 ottobre 1995, che
    stabilisce modalità di applicazione di un contingente tariffario di animali vivi
    della specie bovina, dai 160 ai 300 chilogrammi, originari di taluni paesi terzi,
    previsto dal regolamento (CE) n. 2179/95 del Consiglio, e che abroga il regolamento
    (CE) n. 1842/95
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2465/95 van de Commissie van 23 oktober 1995 tot vaststelling
    van een aantal nadere bepalingen voor een bij Verordening (EG) nr. 2179/95 vastgesteld
    tariefcontingent voor levende runderen met een gewicht van 160 tot 300 kg, van
    oorsprong uit bepaalde derde landen, en houdende intrekking van Verordening (EG)
    nr. 1842/95
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2465/95 da Comissão, de 23 de Outubro de 1995, que
    estabelece determinadas normas de execução relativas a um contingente pautal
    de bovinos vivos com um peso compreendido entre 160 e 300 quilogramas, originários
    de determinados países terceiros, previsto pelo Regulamento (CE) nº 2179/95,
    e que revoga o Regulamento (CE) nº 1842/95
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2465/95 de la Comisión, de 23 de octubre de 1995,
    por el que se establecen determinadas disposiciones de aplicación de un contingente
    arancelario de animales vivos de la especie bovina con un peso entre 160 y 300
    kilogramos, originarios de determinados terceros países, establecido por el Reglamento
    (CE) nº 2179/95 del Consejo, y por el que se deroga el Reglamento (CE) nº 1842/95
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2465/95 av den 23 oktober 1995 om vissa
    tillämpningsföreskrifter för en kvot för levande nötkreatur med en vikt av
    mellan 160 kg och 300 kg med ursprung i vissa tredje länder som föreskrivs i
    förordning (EG) nr 2179/95 och om upphävande av rådets förordning (EG) nr
    1842/95
  type: main
