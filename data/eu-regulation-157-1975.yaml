  content: Regulation (EEC) No 157/75 of the Commission of 23 January 1975 amending
    the amounts of certain variable components and accession compensatory amounts
    applicable during the first quarter of 1975 on the importation of goods covered
    by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 157/75 de la Commission, du 23 janvier 1975, modifiant
    les montants de certains éléments mobiles et de certains montants compensatoires
    adhésion applicables pendant le premier trimestre 1975 à l'importation des marchandises
    relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 157/75 der Kommission vom 23. Januar 1975 zur Berichtigung
    bestimmter beweglicher Teilbeträge und bestimmter Beitrittsausgleichsbeträge,
    die im ersten Vierteljahr 1975 bei der Einfuhr von Waren gelten, die unter die
    Verordnung (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 157/75 af 23. januar 1975 om berigtigelse
    af størrelsen af visse variable elementer og tiltrædelsesudligningsbeløb gældende
    i 1. kvartal 1975 ved indførsel af varer henhørende under forordning (EØF)
    nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 157/75 della Commissione, del 23 gennaio 1975, che
    rettifica gli importi di taluni elementi mobili e gli importi compensativi di
    «adesione» applicabili durante il primo trimestre del 1975 all'importazione
    delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 157/75 van de Commissie van 23 januari 1975 houdende
    verbetering van enkele variabele elementen en compenserende bedragen "toetreding"
    die gedurende het eerste kwartaal van 1975 toepasselijk zijn bij invoer van goederen
    die onder Verordening (EEG) nr. 1059/69 vallen
