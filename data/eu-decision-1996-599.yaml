title:
- language: en
  script: Latn
  content: '96/599/EC: Commission Decision of 9 October 1996 amending Decision 95/506/EC
    authorizing Member States temporarily to take additional measures against the
    dissemination of Pseudomonas solanacearum (Smith) Smith as regards the Kingdom
    of the Netherlands'
  type: main
- language: fr
  script: Latn
  content: '96/599/CE: Décision de la Commission du 9 octobre 1996 modifiant la décision
    95/506/CE autorisant les États membres à prendre provisoirement des mesures
    supplémentaires en vue de se protéger contre la propagation de Pseudomonas solanacearum
    (Smith) Smith en provenance du Royaume des Pays-Bas'
  type: main
- language: de
  script: Latn
  content: '96/599/EG: Entscheidung der Kommission vom 9. Oktober 1996 zur Änderung
    der Entscheidung 95/506/EG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    zusätzliche Maßnahmen gegen die Verbreitung von Pseudomonas solanacearum (Smith)
    Smith gegenüber dem Königreich der Niederlande zu treffen'
  type: main
- language: da
  script: Latn
  content: '96/599/EF: Kommissionens Beslutning af 9. oktober 1996 om ændring af
    beslutning 95/506/EF om bemyndigelse af medlemsstaterne til midlertidigt at træffe
    supplerende foranstaltninger mod spredning af Pseudomonas solanacearum (Smith)
    Smith, for så vidt angår Kongeriget Nederlandene'
  type: main
- language: el
  script: Grek
  content: '96/599/ΕΚ: Απόφαση της Επιτροπής της 9ης Οκτωβρίου
    1996 για τροποποίηση της απόφασης 95/506/ΕΚ η οποία
    επιτρέπει προσωρινά στα κράτη μέλη να λάβουν
    πρόσθετα μέτρα κατά της εξάπλωσης της Pseudomonas
    solanacearum (Smith) Smith όσον αφορά το Βασίλειο των Κάτω
    Χωρών'
  type: main
- language: fi
  script: Latn
  content: '96/599/EY: Komission päätös, tehty 9 päivänä lokakuuta 1996, luvan
    antamisesta jäsenvaltioille toteuttaa väliaikaisesti Alankomaiden kuningaskuntaa
    koskevia lisätoimenpiteitä Pseudomonas solanacearum (Smith) Smith-taudinaiheuttajan
    leviämisen estämiseksi tehdyn päätöksen 95/506/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '96/599/CE: Decisione della Commissione del 9 ottobre 1996 recante modifica
    della decisione 95/506/CE che autorizza gli Stati membri ad adottare, a titolo
    provvisorio, misure supplementari contro la propagazione dello Pseudomonas solanacearum
    (Smith) Smith relativamente al Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '96/599/EG: Beschikking van de Commissie van 9 oktober 1996 houdende wijziging
    van Beschikking 95/506/EG tot machtiging van bepaalde Lid-Staten om ten aanzien
    van het Koninkrijk der Nederlanden tijdelijk aanvullende maatregelen te nemen
    tegen de verspreiding van Pseudomonas solanacearum (Smith) Smith'
  type: main
- language: pt
  script: Latn
  content: '96/599/CE: Decisão da Comissão de 9 de Outubro de 1996 que altera a
    Decisão 95/506/CE que autoriza os Estados- membros a adoptar provisoriamente
    medidas adicionais contra a propagação de Pseudomonas solanacearum (Smith) Smith
    proveniente do Reino dos Países Baixos'
  type: main
- language: es
  script: Latn
  content: '96/599/CE: Decisión de la Comisión de 9 de octubre de 1996 que modifica
    la Decisión 95/506/CE por la que se autoriza a los Estados miembros para adoptar
    temporalmente, en lo que respecta al Reino de los Países Bajos, medidas complementarias
    contra la propagación de Pseudomonas solanacearum (Smith) Smith'
  type: main
- language: sv
  script: Latn
  content: '96/599/EG: Kommissionens beslut av den 9 oktober 1996 om ändring av beslut
    95/506/EG om tillstånd för medlemsstaterna att tillfälligt vidta tilläggsåtgärder
    för att förhindra spridning av Pseudomonas solanacearum (Smith) Smith från
    Nederländerna'
  type: main
