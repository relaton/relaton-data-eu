title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/3/EU of 18 October 2013 amending, for
    the purposes of adapting to technical progress, the Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    acetate marker for use in stereotactic head frames for use with CT (Computed Tomography)
    and MRI and in positioning systems for gamma beam and particle therapy equipment
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/3/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour les marqueurs à l’acétate de plomb dans les cadres stéréotaxiques utilisés
    en tomodensitométrie et en imagerie par résonance magnétique ainsi que dans
    les systèmes de positionnement des équipements de gammathérapie et d’hadronthérapie
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/3/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Bleiacetatmarker zur Verwendung in stereotaktischen Kopfrahmen
    bei der Computertomographie und der Magnetresonanztomographie sowie in Positionierungssystemen
    für Gammastrahlen- und Partikeltherapiegeräte
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/3/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на оловно-ацетатен
    маркер в стереотаксически рамки за глава, използвани
    при компютърна томография (CT) и магнитно-резонансна
    томография (MRI), както и при позициониращи системи
    на съоръжения за гама-терапия и адронна терапия
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/3/EU ze dne 18. října 2013
    , kterou se pro účely přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    marker z octanu olovnatého používaný do stereotaktických rámů pro fixaci
    hlavy používaných v počítačové tomografii (CT) a magnetické rezonanci
    (MRI) a v lokalizačních systémech ozařovačů pro gamaterapii a vybavení
    pro nukleární medicínu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/3/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU for så vidt angår en undtaget anvendelse af blyacetatmarkør i stereotaktiske
    hovedstøtter til brug ved CT (computertomografi) og MRI samt i positioneringssystemer
    til gammastråle- og partikelterapiudstyr
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/3/ΕΕ της Επιτροπής,
    της 18ης Οκτωβρίου 2013 , για την τροποποίηση,
    με σκοπό την προσαρμογή στην τεχνική πρόοδο,
    του παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, όσον αφορά
    εξαίρεση για τον οξικό μόλυβδο ως επισημαντή
    για χρήση σε στερεοτακτικά πλαίσια κεφαλής
    προοριζόμενα για CT (υπολογιστική τομογραφία)
    και MRI (μαγνητική τομογραφία) και σε συστήματα
    τοποθέτησης για θεραπευτικό εξοπλισμό δέσμης
    ακτινοβολίας γ και σωματίων
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/3/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb pliiatsetaatmarkeri
    kasutamist kompuutertomograafia ja magnetresonantstomograafia stereotaktilistes
    pearaamides ning gammakiiritusravi ja osakeste ravi seadmete positsioneerimissüsteemides
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/3/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen lyijyasetaattimarkkeria CT (tietokonetomografia)-
    ja MRI-kuvauksen stereotaktisissa pääkehyksissä ja gammasäde- ja hiukkashoitolaitteiden
    asettelujärjestelmissä koskevan poikkeuksen osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/3/EU оd 18. listopada 2013. o izmjeni,
    za potrebe prilagođivanja tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za olovni acetat za uporabu
    kao marker u stereotaktičkim okvirima za glavu pri uporabi sustava za CT (računalnu
    tomografiju) i MRI te u sustavima za pozicioniranje u opremi za terapiju gama
    snopom i česticama
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/3/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a CT- (komputertomográfiás) és MRI-berendezéseknél sztereotaxiás fejkeretekben,
    valamint gamma-sugár- és részecsketerápiás berendezések pozicionáló rendszereiben
    használt ólom-acetát jelölőanyagok mentesítése tekintetében, a műszaki
    fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/3/UE della Commissione, del 18 ottobre 2013 , che
    modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione relativa
    all’acetato di piombo utilizzato come marcatore nei caschi stereotassici usati
    per la TAC e la risonanza magnetica nonché nei sistemi di posizionamento delle
    apparecchiature gammaterapiche e adroterapiche
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/3/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svina acetāta
    marķierim izmantošanai stereotakses rāmjos, ko izmanto, veicot datortomogrāfiju
    un magnētiskās rezonanses caurskati, un gamma terapijas un hadronu terapijas
    iekārtu pozicionēšanas sistēmā
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/3/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    naudoti šviną švino acetato žymekliuose, skirtuose naudoti kompiuterinėje
    tomografijoje ir magnetinio rezonanso vaizdo sudarymo procedūroje naudojamuose
    stereotaksiniuose galvos rėmuose ir vietos nustatymo sistemose, naudojamose gama
    spindulių pluošto bei dalelių terapijos įrangoje
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/3/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għall-aċetat taċ-ċomb għall-użu bħala markatur fil-head-frames
    stereotattiċi għall-użu fis-CT (Computed Tomography) u fl-MRI u fis-sistemi
    ta’ pożizzjonament għat-tagħmir tat-terapija bir-raġġi gamma u t-terapija
    bil-partikoli
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/3/EU van de Commissie van 18 oktober 2013 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor loodacetaatmarker voor gebruik in stereotactische hoofdframes
    voor gebruik bij CT (computertomografie) en MRI en in positioneringssystemen voor
    gammastraling en deeltjestherapie
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/3/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    markeru zawierającego octan ołowiu stosowanego w stereotaktycznych ramach na
    głowę używanych w badaniach techniką tomografii komputerowej i rezonansu magnetycznego
    oraz w systemach lokalizacji w sprzęcie do leczenia promieniowaniem gamma i radioterapii
    cząsteczkowej
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/3/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho, no respeitante a uma isenção
    para marcadores de acetato de chumbo destinados a quadros estereotáxicos cranianos
    utilizados em tomografia computorizada e imagiologia por ressonância magnética
    e a sistemas de posicionamento para equipamentos de terapia por raios gama e de
    terapia com partículas
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/3/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare privind
    markerii acetatului de plumb utilizat în cadrele stereotactice pentru cap folosite
    în TC (tomografia computerizată) și RMN și în sistemele de poziționare pentru
    fasciculele de raze gamma și terapie cu acceleratori de particule
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/3/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre marker z octanu olovnatého
    používaný v stereotaktických rámoch na fixáciu hlavy pri počítačovej
    tomografii (CT) a magnetickej rezonancii (MRI) a v lokalizačných systémoch
    pre ožarovače na gamaterapiu a pre vybavenie na nukleárnu medicínu
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/3/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    pri uporabi svinčevega acetata kot markerja za uporabo v stereotaktičnih naglavnih
    obročih pri CT (računalniški tomografiji) in MRS ter pri sistemih določanja
    položaja za opremo za zdravljenje z gama žarki in delci zaradi prilagoditve
    tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/3/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el acetato de plomo utilizado como marcador en marcos estereotácticos de
    cabeza para TC (tomografía computarizada) e IRM y en sistemas de posicionamiento
    de equipos de gammaterapia y terapia de partículas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/3/EU av den 18 oktober 2013 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för blyacetatmarkör för
    användning i stereotaktiska huvudramar för användning med CT (datortomografi)
    och MRT samt i positioneringssystem för gammastrål- och partikelterapiutrustning
