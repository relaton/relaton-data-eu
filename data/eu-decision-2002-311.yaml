title:
- language: en
  script: Latn
  content: '2002/311/EC: Commission Decision of 24 April 2002 repealing Decision 1999/462/EC
    recognising in principle the completeness of the dossiers submitted for detailed
    examination in view of the possible inclusion of alanycarbe in Annex I to Council
    Directive 91/414/EEC concerning the placing of plant-protection products on the
    market (Text with EEA relevance) (notified under document number C(2002) 1522)'
  type: main
- language: fr
  script: Latn
  content: '2002/311/CE: Décision de la Commission du 24 avril 2002 abrogeant la
    décision 1999/462/CE reconnaissant en principe la conformité des dossiers transmis
    pour examen détaillé en vue de l''inscription éventuelle de l''alanycarbe à
    l''annexe I de la directive 91/414/CEE du Conseil concernant la mise sur le marché
    des produits phytopharmaceutiques (Texte présentant de l''intérêt pour l''EEE)
    [notifiée sous le numéro C(2002) 1522]'
  type: main
