id: EUDecision1978393
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 10 April 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to women's girls' and infants' woven and knitted or crocheted
    dresses, of wool, cotton or man-made textile fibres, falling within subheading
    ex 60.05 A II or ex 61.02 B of the Common Customs Tariff, originating in Hong
    Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/393/CEE: Décision de la Commission, du 10 avril 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les robes tissées et les robes de bonneterie
    pour femmes, fillettes et jeunes enfants, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles des sous-positions Ex 60.05 A II et Ex 61.02 B
    du Tarif douanier commun, originaires de Hong- Kong et mises en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. April 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Kleider aus Geweben und aus Gewirken, für Frauen, Mädchen und Kleinkinder,
    aus Wolle, Baumwolle oder aus synthetischen oder künstlichen Spinnstoffen der
    Tarifnummern ex 60.05 A II und ex 61.02 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 10. april 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage vævede kjoler og kjoler af trikotage til kvinder, piger og småbørn
    af uld, bomuld eller kemofibre, som henhører under pos. ex 60.05 A II og ex 61.02
    B i den fælles toldtarif, har oprindelse i Hongkong og frit kan omsættes i de
    andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 aprile 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario gli abiti interi tessuti ed a maglia per donna, per
    ragazzo e per bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali
    delle sottovoci ex 60.05 A II e ex 61.02 B della tariffa doganale comune, originari
    di Hong Kong e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 april 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    japonnen voor dames, meisjes en kinderen, geweven en van brei- of haakwerk, van
    wol, van katoen of van synthetische of kunstmatige vezels, van de posten ex 60.05
    A II en ex 61.02 B van het gemeenschappelijk douanetarief, van oorsprong uit Hong-Kong
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
