title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 214/94 of 31 January 1994 laying down detailed
    rules for the application of the Council Regulation (EC) No 130/94 with regard
    to the import arrangements for frozen beef falling within CN code 0202 and products
    falling within CN code 0206 29 91
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 214/94 de la Commission du 31 janvier 1994 portant
    modalités d'application du règlement (CE) n 130/94 du Conseil en ce qui concerne
    le régime d'importation de la viande bovine congelée relevant du code NC 0202
    et des produits relevant du code NC 0206 29 91
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 214/94 DER KOMMISSION vom 31. Januar 1994 mit Durchführungsbestimmungen
