    gefrorenes Rindfleisch des KN-Codes 0202 sowie für Waren des KN-Codes 0206 29
    91
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 214/94 af 31. januar 1994 om gennemførelsesbestemmelser
    til Rådets forordning (EF) nr. 130/94 så vidt angår importordningen for frosset
    oksekød henhørende under KN-kode 0202 og for varer henhørende under KN-kode
    0206 29 91
  type: main
- language: el
  script: Grek
