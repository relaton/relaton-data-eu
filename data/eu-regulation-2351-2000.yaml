    Ausfuhr von im Besitz der deutschen Interventionsstelle befindlichem Roggen auf
    450 392 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2351/2000 af 24. oktober 2000 om ændring
