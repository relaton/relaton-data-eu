title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République française à fixer
    les points de passage en frontière ou en douane ouverts aux importations de fruits
    et légumes en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission, mit der die Französische Republik ermächtigt
    wird, die offenen Grenz- oder Zollübergangsstellen für die Einfuhr von Obst
    und Gemüse aus den Mitgliedstaaten zu bestimmen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione che autorizza la Repubblica Francese a stabilire
    i punti di passaggio di confine o di dogana aperti alle importazioni di ortofrutticoli
    in provenienza dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie houdende machtiging van de Franse Republiek
    om de punten van grensovergang of douaneposten die geopend zijn voor de invoer
    van groenten en fruit afkomstig uit de andere Lid-Staten vast te stellen
  type: main
