  content: '82/142/EEC: Commission Decision of 5 February 1982 establishing that the
    apparatus described as ''Optronics photomation mark II, model P 1700'' may not
    be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/142/CEE: Décision de la Commission, du 5 février 1982, constatant
    que l''importation de l''appareil dénommé "Optronics - Photomation Mark II,
    model P 1700" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/142/EWG: Entscheidung der Kommission vom 5. Februar 1982, mit der festgestellt
    wird, daß das Gerät ,,OPTRONICS-Photomation Mark II, model P 1700" nicht unter
    Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/142/EØF: Kommissionens beslutning af 5. februar 1982 om fastslåelse
