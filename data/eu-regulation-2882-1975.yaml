title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2882/75 of the Council of 29 October 1975 on the opening,
    allocation and administration of a Community tariff quota for ferro-chromium containing
    not more than 0.10 % by weight of carbon and more than 30 % but not more than
    90 % by weight of chromium (super-refined ferro-chromium), falling within subheading
    ex 73.02 E I of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2882/75 du Conseil, du 29 octobre 1975, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de ferrochrome
    contenant en poids 0,10 % ou moins de carbone et plus de 30 % jusqu'à 90 % inclus
    de chrome (ferrochrome surraffiné) de la sous-position EX 73.02 E I du tarif
    douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2882/75 des Rates vom 29. Oktober 1975 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Ferrochrom mit
    einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und an
    Chrom von mehr als 30 bis 90 Gewichtshundertteilen (hochraffiniertes Ferrochrom)
    der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2882/75 af 29. oktober 1975 om åbning, fordeling
    og forvaltning af et fællesskabstoldkontingent for ferrochrom med et kulstofindhold
    på 0,10 vægtprocent eller derunder og med et indhold af chrom (overraffineret
    ferrochrom) på over 30, men højst 90 vægtprocent, henhørende under pos. ex
    73.02 E I i den fælles toldtarif
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2882/75 del Consiglio, del 29 ottobre 1975, relativo
    all'apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di ferro-cromo contenente, in peso, lo 0,10 % o meno di
    carbonio e oltre il 30 %, sino al 90 % incluso, di cromo (ferro-cromo superraffinato)
    della sottovoce ex 73.02 E I della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2882/75 van de Raad van 29 oktober 1975 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor ferrochroom, bevattende 0,10 of minder gewichtspercent koolstof en meer dan
    30 doch niet meer dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom),
    van onderverdeling ex 73.02 E I van het gemeenschappelijk douanetarief
  type: main
