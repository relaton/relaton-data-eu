title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 486/84 of 24 February 1984 re-establishing
    the levying of customs duties on certain made up textile articles, products of
    category 112 (code 1120) originating in Pakistan, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 486/84 de la Commission du 24 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    articles confectionnés en tissus, de la catégorie 112 (code 1120), originaires
    du Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 486/84 der Kommission vom 24. Februar 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte konfektionierte Waren aus Geweben
    der Warenkategorie Nr. 112 (Kennziffer 1120), mit Ursprung in Pakistan, dem die
    in der Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 486/84 af 24. februar 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte konfektionerede tekstilvarer under
    varekategori nr. 112 (kode 1120), som har oprindelse i Pakistan og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 486/84 της Επιτροπής
    της 24ης Φεβρουαρίου 1984 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένα
    είδη έτοιμα εξ υφασμάτων, προϊόντα της κατηγορίας
    112 (κωδικός 1120), καταγωγής Πακιστάν, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3570/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 486/84 della Commissione del 24 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili a taluni manufatti confezionati
    di tessuti della categoria di prodotti n. 112 (codice 1120), originari del Pakistan
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3570/83
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 486/84 van de Commissie van 24 februari 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    geconfectioneerde artikelen van weefsels van de categorie van produkten nr. 112
    (codenummer 1120), van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
  type: main
