title:
- language: en
  script: Latn
  content: Commission Directive 85/479/EEC of 14 October 1985 amending Directive 77/794/EEC
    laying down detailed rules for implementing certain provisions of Directive 76/308/EEC
    on mutual assistance for the recovery of claims resulting from operations forming
    part of the system of financing the European Agricultural Guidance and Guarantee
    Fund, and of agricultural levies and customs duties
  type: main
- language: fr
  script: Latn
  content: Directive 85/479/CEE de la Commission du 14 octobre 1985 modifiant la directive
    77/794/CEE fixant les modalités pratiques nécessaires à l'application de certaines
    dispositions de la directive 76/308/CEE concernant l'assistance mutuelle en matière
    de recouvrement des créances résultant d'opérations faisant partie du système
    de financement du Fonds européen d'orientation et de garantie agricole (FEOGA)
    ainsi que de prélèvements agricoles et de droits de douane
  type: main
- language: de
  script: Latn
  content: Richtlinie 85/479/EWG der Kommission vom 14. Oktober 1985 zur Änderung
