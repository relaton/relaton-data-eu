    zu bestimmten Artikeln der Richtlinie 76/308/EWG über die gegenseitige Unterstützung
    bei der Beitreibung von Forderungen im Zusammenhang mit Maßnahmen, die Bestandteil
    des Finanzierungssystems des Ausrichtungs- und Garantiefonds für die Landwirtschaft
    sind, sowie von Abschöpfungen und Zöllen
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 85/479/EØF af 14. oktober 1985 om ændring af direktiv
