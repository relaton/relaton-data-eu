title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2633/70 of the Commission of 23 December 1970 adding
    butteroil to the list of processed products coming under the special rules for
    payment of refunds laid down by Regulation (EEC) No 441/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2633/70 de la Commission, du 23 décembre 1970, admettant
    le butteroil à la liste des produits transformés auxquels s' applique le régime
    particulier du paiement des restitutions institué par le règlement (CEE) n°
    441/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2633/70 der Kommission vom 23. Dezember 1970 über
    die Zulassung von butteroil zu der Liste der Verarbeitungserzeugnisse, auf die
    die mit Verordnung (EWG) Nr. 441/69 eingeführte besondere Regelung für die Zahlung
    der Erstattungen angewandt wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2633/70 af 23. december 1970 om tilføjelse
    af butteroil på listen over de forarbejdede produkter, for hvilke den særlige
    restitutionsbetalingsordning, der er indført ved forordning (EØF) nr. 441/69
    finder anvendelse
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2633/70 della Commissione, del 23 dicembre 1970, che
    ammette il butteroil nella lista dei prodotti trasformati ai quali si applica
    il regime particolare del pagamento delle restituzioni istituito mediante regolamento
    (CEE) n. 441/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2633/70 van de Commissie van 23 december 1970 tot
    toelating van butteroil tot de lijst van verwerkte produkten, waarop de bij Verordening
    (EEG) nr. 441/69 ingevoerde bijzondere regeling voor de betaling van restituties
    wordt toegepast
