title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2093/91 of 15 July 1991 imposing a definitive
    anti-dumping duty on imports of small-screen colour television receivers originating
    in Hong Kong and the People's Republic of China and collecting definitively the
    provisional duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2093/91 du Conseil, du 15 juillet 1991, instituant
    un droit antidumping définitif sur les importations de petits appareils récepteurs
    de télévision couleur originaires de Hong-Kong et de la République populaire
    de Chine et portant perception définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2093/91 des Rates vom 15. Juli 1991 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren kleiner Farbfernsehempfangsgeräte
    mit Ursprung in Hongkong und der Volksrepublik China und zur endgültigen Vereinnahmung
    des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2093/91 af 15. juli 1991 om indførelse af
    en endelig antidumpingtold på importen af farvefjernsynsmodtagere med lille billedskærm
    med oprindelse i Hongkong og Den Kinesiske Folkerepublik og om endelig opkrævning
    af den midlertidige antidumpingtold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2093/91 του Συμβουλίου
    της 15ης Ιουλίου 1991 περί επιβολής οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές εγχρώμων
    συσκευών λήψεως για την τηλεόραση με μικρή
    οθόνη, καταγωγής Χονγκ Κονγκ και Λαϊκής Δημοκρατίας
    της Κίνας και περί οριστικής είσπραξης του
    προσωρινού δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2093/91, annettu 15 päivänä heinäkuuta 1991,
    lopullisen polkumyyntitullin käyttöön ottamisesta Hongkongista ja Kiinan kansantasavallasta
    peräisin olevien pienikokoisten väritelevisiovastaanottimien tuonnissa ja väliaikaisen
    tullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2093/91 del Consiglio, del 15 luglio 1991, che istituisce
    un dazio antidumping definitivo sulle importazioni di apparecchi riceventi per
    la televisione, a colori, con schermo di piccole dimensioni, originari di Hong
    Kong e della Repubblica popolare cinese e stabilisce la riscossione definitiva
    del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2093/91 van de Raad van 15 juli 1991 tot instelling
    van een definitief anti-dumpingrecht op de invoer van ontvangtoestellen voor kleurentelevisie
    met klein beeldscherm, van oorsprong uit Hong-Kong en de Volksrepubliek China,
    en tot definitieve inning van het voorlopige recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2093/91 do Conselho, de 15 de Julho de 1991, que
