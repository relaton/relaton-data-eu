title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2475/88 of 5 August 1988 amending Regulation
    (EEC) No 720/88 fixing, for the period 1 January to 31 December 1988, the maximum
    quantity of certain products of the oils and fats sector to be released for consumption
    and imported into Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2475/88 de la Commission du 5 août 1988 modifiant
    le règlement (CEE) n° 720/88 fixant pour la période allant du 1er janvier au
    31 décembre 1988 la quantité maximale de certains produits du secteur des matières
    grasses à mettre à la consommation et à importer au Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2475/88 der Kommission vom 5. August 1988 zur Änderung
