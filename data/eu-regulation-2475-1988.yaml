    des Fettsektors, die in Portugal zum freien Verkehr abzufertigen und in dieses
    Land einzuführen sind, für den Zeitraum vom 1. Januar bis zum 31. Dezember 1988
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2475/88 af 5. august 1988 om ændring
    af forordning (EØF) nr. 720/88 om fastsættelse for perioden 1. januar til 31.
    december 1988 af den største mængde af visse produkter inden for fedtstofsektoren,
    der kan overgå til frit forbrug i og importeres til Portugal
  type: main
- language: el
  script: Grek
