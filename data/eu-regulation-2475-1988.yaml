  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2475/88 della Commissione del 5 agosto 1988 che modifica
    il regolamento (CEE) n. 720/88 che fissa, per il periodo 1° gennaio-31 dicembre
    1988 la quantità massima di taluni prodotti nel settore dei grassi da mettere
    in consumo e da importare in Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2475/88 van de Commissie van 5 augustus 1988 houdende
    wijziging van Verordening (EEG) nr. 720/88 tot vaststelling, voor het tijdvak
    van 1 januari tot en met 31 december 1988, van de maximumhoeveelheid van bepaalde
    in Portugal in consumptie te brengen of in te voeren produkten van de sector oliën
    en vetten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2475/88 da Comissão de 5 de Agosto de 1988 que
    altera o Regulamento (CEE) n.° 720/88 que fixa, para o período compreendido
    entre 1 de Janeiro e 31 de Dezembro de 1988, a quantidade máxima de determinados
    produtos do sector das matérias gordas a introduzir no consumo e a importar em
    Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2475/88 de la Comisión de 5 de agosto de 1988 por
