    2019 renouvelant l’autorisation de mise sur le marché de produits contenant
    du coton génétiquement modifié LLCotton25 (ACS-GHØØ1-3), consistant en ce
    coton ou produits à partir de celui-ci, en application du règlement (CE) no
    1829/2003 du Parlement européen et du Conseil [notifiée sous le numéro C(2019)
    7481] (Le texte en langue allemande est le seul faisant foi.)
  type: main
