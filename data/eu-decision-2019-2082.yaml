  script: Latn
  content: Commission Implementing Decision (EU) 2019/2082 of 28 November 2019 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified cotton LLCotton25 (ACS-GHØØ1-3) pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2019) 7481) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
