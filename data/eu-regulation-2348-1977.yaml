title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2348/77 of 25 October 1977 re-establishing
    the levying of customs duties on image projectors (other than cinematographic
    projectors), photographic (except cinematographic) enlargers and reducers, falling
    within heading No 90.09, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2348/77 de la Commission, du 25 octobre 1977, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de projection fixé, appareils d'agrandissement ou de réduction photographiques
    de la position tarifaire 90.09, originaires des pays en voie de développement,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2348/77 der Kommission vom 25. Oktober 1977 zur Wiedereinführung
    des Zollsatzes für Stehbildwerfer, photographische Vergrößerungs- oder Verkleinerungsapparate,
    der Tarifnummer 90.09, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2348/77 af 25. oktober 1977 om genindførelse
    af opkrævning af toldafgifter for lysbilledapparater, forstørrelses- og formindskelsesapparater
    til fotografisk brug (undtagen kinematografiske), under pos. 90.09, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2348/77 della Commissione, del 25 ottobre 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi da proiezione
    fissa, apparecchi fotografici d'ingrandimento o di riduzione della voce doganale
    90.09, originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2348/77 van de Commissie van 25 oktober 1977 houdende
    wederinstelling van de heffing van de douanerechten voor projectietoestellen voor
    niet bewegende beelden; vergrotings- en verkleiningstoestellen voor de fotografie,
    van post 90.09, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad tariefpreferenties werden geopend
  type: main
