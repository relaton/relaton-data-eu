title:
- language: fr
  script: Latn
  content: Règlement n° 133/65/CEE de la Commission, du 28 septembre 1965, portant
    pour le quatrième trimestre 1965, adaptation et fixation des prix d'écluse pour
    les oeufs de volailles, les volailles vivantes et abattues, et fixation des prélèvements
    envers les pays tiers pour les oeufs de volailles en coquille, les volailles vivantes
    d'un poids n'excédant pas 185 grammes et les volailles abattues
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 133/65/EWG der Kommission vom 28. September 1965 über die
    Anpassung und Festsetzung der Einschleusungspreise für Eier von Hausgeflügel,
    lebendes und geschlachtetes Hausgeflügel sowie über die Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern für Eier in der Schale von Hausgeflügel, lebendes
    Hausgeflügel mit einem Gewicht von höchstens 185 Gramm und geschlachtetes Hausgeflügel
    für das 4. Vierteljahr 1965
  type: main
- language: it
  script: Latn
  content: Regolamento n. 133/65/CEE della Commissione, del 28 settembre 1965, che
    adatta e fissa per il quarto trimestre 1965 i prezzi limite per le uova di volatili,
    per i volatili da cortile vivi e macellati, e che fissa i prelievi nei confronti
    dei paesi terzi per le uova in guscio di volatili, per i volatili da cortile vivi
    di peso non superiore a 185 grammi e per i volatili da cortile macellati.
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 133/65/EEG van de Commissie van 28 september 1965 houdende
    aanpassing en vaststelling van de sluisprijzen voor eieren van pluimvee, levend
    en geslacht pluimvee, alsmede vaststelling van de heffingen ten opzichte van derde
    landen voor eieren in de schaal van pluimvee, voor levend pluimvee dat niet meer
    dan 185 gram weegt en voor geslacht pluimvee, voor het vierde kwartaal 1965
  type: main
