  content: Commission Regulation (EC) No 523/2005 of 1 April 2005 initiating a ‘new
    exporter’ review of Council Regulation (EC) No 1467/2004 imposing definitive
    anti-dumping duties on imports of polyethylene terephthalate (PET) originating,
