    decyzje wykonawcze 2013/648/UE i 2013/650/UE w odniesieniu do posiadacza zezwolenia
    na wprowadzanie do obrotu produktów zawierających niektóre rodzaje genetycznie
    zmodyfikowanej kukurydzy, składających się z niej lub z niej wyprodukowanych
    oraz jego przedstawiciela w Unii (notyfikowana jako dokument nr C(2021) 4317)
