    que altera as Decisões de Execução 2013/648/UE e 2013/650/UE no que diz respeito
    ao detentor da autorização e ao seu representante na União para a colocação
    no mercado de produtos que contenham, sejam constituídos por ou sejam produzidos
    a partir de determinado milho geneticamente modificado [notificada com o número
    C(2021) 4317] (Texto relevante para efeitos do EEE) (Apenas faz fé o texto na
