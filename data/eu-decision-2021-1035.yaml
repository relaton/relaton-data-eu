    des Zulassungsinhabers und seines Vertreters in der Union für das Inverkehrbringen
    von Erzeugnissen, die bestimmten genetisch veränderten Mais enthalten, aus ihm
    bestehen oder aus ihm hergestellt werden (Bekannt gegeben unter Aktenzeichen C(2021)
    4317) (Nur der niederländische Text ist verbindlich)
  type: main
