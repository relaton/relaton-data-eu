    kterým se mění prováděcí rozhodnutí 2013/648/EU a 2013/650/EU, pokud jde
    o držitele povolení a jeho zástupce v Unii pro uvádění produktů, které
    obsahují určitou geneticky modifikovanou kukuřici, sestávají z ní nebo jsou
    z ní vyrobeny, na trh (oznámeno pod číslem C(2021) 4317) (Text s významem
    pro EHP) (Pouze nizozemské znění je závazné)
