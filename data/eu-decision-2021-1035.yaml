- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1035 of 23 June 2021 amending
    Implementing Decisions 2013/648/EU and 2013/650/EU as regards the authorisation
    holder and its representative in the Union for the placing on the market of products
    containing, consisting of, or produced from certain genetically modified maize
    (notified under document C(2021) 4317) (Text with EEA relevance) (Only the Dutch
    text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1035 de la Commission du 23 juin 2021
    modifiant les décisions d’exécution 2013/648/UE et 2013/650/UE en ce qui concerne
    le titulaire de l’autorisation et son représentant dans l’Union pour la mise
    sur le marché de produits contenant certains maïs génétiquement modifiés,
    consistant en ces maïs ou produits à partir de ceux-ci [notifiée sous le numéro
    C(2021) 4317] (Texte présentant de l’intérêt pour l’EEE) (Le texte en langue
    néerlandaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
