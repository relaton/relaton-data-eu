    de modificare a Deciziilor de punere în aplicare (UE) 2013/648/UE și 2013/650/UE
    în ceea ce privește titularul autorizației și reprezentantul său în Uniune
    pentru introducerea pe piață a produselor care conțin, constau în sau sunt
    fabricate din anumite soiuri de porumb modificat genetic [notificată cu numărul
    C(2021) 4317] (Text cu relevanță pentru SEE) (Numai textul în limba neerlandeză
    este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/1035 z 23. júna 2021, ktorým
    sa menia vykonávacie rozhodnutia 2013/648/EÚ a 2013/650/EÚ, pokiaľ ide o držiteľa
    povolenia na umiestnenie na trh produktov, ktoré obsahujú určitú geneticky
    modifikovanú kukuricu, sú z nej zložené alebo vyrobené, a jeho zástupcu
    v Únii [oznámené pod číslom C(2021) 4317] (Text s významom pre EHP) (Iba
