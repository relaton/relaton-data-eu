    intézkedések Thaiföldön feladott kézi emelőkocsik és alapvető részegységeik
    behozatalával – tekintet nélkül arra, hogy azokat Thaiföldről származónak
    jelentették-e be – történő lehetséges kijátszására vonatkozó vizsgálat
    megindításáról, valamint e behozatalok nyilvántartásba vételi kötelezettségének
    előírásáról
  type: main
