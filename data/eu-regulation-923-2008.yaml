title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 923/2008 of 12 September 2008 initiating
    an investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Regulation (EC) No 1174/2005, as amended by Council Regulation
    (EC) No 684/2008, on imports of hand pallet trucks and their essential parts originating
    in the People’s Republic of China by imports of hand pallet trucks and their
    essential parts consigned from Thailand, whether declared as originating in Thailand
    or not and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 923/2008 de la Commission du 12 septembre 2008 portant
    ouverture d’une enquête sur un éventuel contournement des mesures antidumping
    instituées par le règlement (CE) n o 1174/2005 du Conseil, modifié par le règlement
    (CE) n o 684/2008, sur les importations de transpalettes à main et de leurs parties
    essentielles originaires de la République populaire de Chine par des importations
    de transpalettes à main et de leurs parties essentielles expédiés de Thaïlande,
    qu’ils aient ou non été déclarés originaires de ce pays, et soumettant ces
    importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 923/2008 der Kommission vom 12. September 2008 zur
    Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit der
    Verordnung (EG) Nr. 1174/2005 des Rates, geändert durch die Verordnung (EG) Nr.
    684/2008, eingeführten Antidumpingmaßnahmen gegenüber den Einfuhren manueller
    Palettenhubwagen und wesentlicher Teile davon mit Ursprung in der Volksrepublik
    China durch Einfuhren aus Thailand versandter manueller Palettenhubwagen und wesentlicher
    Teile davon, ob als Ursprungserzeugnis Thailands angemeldet oder nicht, und zur
    zollamtlichen Erfassung der letztgenannten Einfuhren
  type: main
