    rapports y afférents de certaines formes d'entreprises, modifiant la directive
    2006/43/CE du Parlement européen et du Conseil et abrogeant les directives 78/660/CEE
    et 83/349/CEE du Conseil
  type: main
- language: de
  script: Latn
