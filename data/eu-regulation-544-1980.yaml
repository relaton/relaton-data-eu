title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 544/80 of 3 March 1980 re-establishing the
    levying of customs duties on glass inners for vacuum flasks or for other vacuum
    vessels, falling within heading No 70.12 and originating in Yugoslavia, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 544/80 de la Commission, du 3 mars 1980, portant rétablissement
    de la perception des droits de douane applicables aux ampoules en verre pour récipients
    isolants, de la position 70.12 du tarif douanier commun, originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 544/80 der Kommission vom 3. März 1980 zur Wiedereinführung
    des Zollsatzes für Glaskolben für Isolierbehälter der Tarifnummer 70.12, mit
    Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 544/80 af 3. marts 1980 om genindførelse
    af opkrævning af toldafgifter for glaskolber til termoflasker og lignende isotermiske
    beholdere, under pos. 70.12, som har oprindelse i Jugoslavien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 544/80 della Commissione, del 3 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili alle ampolle di vetro per recipienti
    isolanti della voce n. 70.12 della tariffa doganale comune, originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 544/80 van de Commissie van 3 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op binnenflessen
    voor thermisch isolerende flessen, van post 70.12, van oorsprong uit Joegoslavïe
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
