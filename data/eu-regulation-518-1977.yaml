    τομέα των μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά, των γενικών κανόνων σχετικά
    με τη χορήγηση επιστροφών κατά την εξαγωγή
    για τα διάφορα πρόσθετα σάκχαρα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 518/77 annettu 14 päivänä maaliskuuta 1977
    erilaisten lisättyjen sokereiden vientitukien myöntämistä koskevien yleisten
    sääntöjen vahvistamisesta hedelmä- ja vihannesjalostealalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 518/77 del Consiglio, del 14 marzo 1977, che stabilisce,
    per il settore dei prodotti trasformati a base di ortofrutticoli, le norme generali
    relative alla concessione delle restituzioni all' esportazione per gli zuccheri
    diversi addizionati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 518/77 van de Raad van 14 maart 1977 houdende vaststelling,
    in de sector van op basis van groenten en fruit verwerkte produkten, van de algemene
    voorschriften inzake restitutie bij de uitvoer voor de verschillende soorten toegevoegde
    suiker
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 518/77 do Conselho, de 14 de Março de 1977, que
    estabelece para o sector dos produtos transformados à base de frutas e produtos
    hortícolas as regras gerais relativas à concessão das restituições à exportação
    a título dos diversos açúcares de adição
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 518/77 del Consejo, de 14 de marzo de 1977, por el
    que se establecen, para el sector de los productos transformados a base de frutas
    y hortalizas, las normas generales relativas a la concesión de las restituciones
    a la exportación en concepto de los diversos azúcares de adición
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 518/77 av den 14 mars 1977 om allmänna bestämmelser
