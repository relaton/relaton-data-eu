  content: Council Regulation (EEC) No 518/77 of 14 March 1977 laying down general
    rules for granting export refunds on the various added sugars in products processed
    from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 518/77 du Conseil, du 14 mars 1977, établissant,
    pour le secteur des produits transformés à base de fruits et légumes, les règles
    générales relatives à l' octroi des restitutions à l' exportation au titre
    des sucres divers d' addition
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 518/77 des Rates vom 14. März 1977 zur Festlegung
    der allgemeinen Regeln für die Gewährung von Ausfuhrerstattungen für die Verarbeitungserzeugnissen
    aus Obst und Gemüse zugesetzten Zuckerarten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 518/77 af 14. marts 1977 om fastlæggelse
    af almindelige regler om ydelse af eksportrestitutioner for så vidt angår de
    til forarbejdede produkter af frugt og grønsager tilsatte sukkerarter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 518/77 του Συμβουλίου
