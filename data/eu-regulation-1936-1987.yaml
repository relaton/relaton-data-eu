  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1936/87 della Commissione del 3 luglio 1987 che ripristina
    la riscossione dei dazi doganali applicabili a sottovesti a maglia della categoria
    di prodotti n. 13 (codice 40.0130) e a tessuti di fibre tessili sintetiche, greggi
    o imbianchiti della categoria di prodotti n. ex 3 (codice 40.0033) originari dell'
    India, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1936/87 van de Commissie van 3 juli 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op onderkleding
    van brei- of haakwerk van de categorie van produkten nr. 13 (codenummer 40.0130)
    en weefsels van synthetische stapelvezels, ongebleekt of gebleekt, van de categorie
