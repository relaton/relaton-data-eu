title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1936/87 of 3 July 1987 re-establishing the
    levying of customs duties on under garments, knitted or crocheted, products of
    category 13 (code 40.0130) and woven fabrics of synthetic fibres (discontinuous
    or waste), unbleached or bleached, products of category ex 3 (code 40.0033) originating
    in India to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1936/87 de la Commission du 3 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux sous-vêtements
    de bonneterie de la catégorie de produits n° 13 (code 40.0130) et aux tissus
    de fibres synthétiques discontinues, écrus ou blanchis, de la catégorie de
    produits n° ex 3 (code 40.0033), originaires de l' Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1936/87 der Kommission vom 3. Juli 1987 zur Wiedereinführung
    des Zollsatzes für Unterkleidung aus Gewirken der Warenkategorie Nr. 13 (Kennziffer
    40.0130) und Gewebe aus synthetischen Spinnfasern, roh oder gebleicht, der Warenkategorie
    Nr. ex 3 (Kennziffer 40.0033) mit Ursprung in Indien, dem die in der Verordnung
    (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1936/87 af 3. juli 1987 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage under
    varekategori nr. 13 (kode 40.0130) og vævet stof af korte kemofibre, syntetiske
    eller regenererede, ublegede og blegede under varekategori nr. ex 3 (kode 40.0033),
    som har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
