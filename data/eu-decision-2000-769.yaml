id: EUDecision2000769
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2000/769/EC: Commission Decision of 6 December 2000 prolonging for the
    fourth time the validity of Decision 1999/815/EC concerning measures prohibiting
    the placing on the market of toys and childcare articles intended to be placed
    in the mouth by children under three years of age made of soft PVC containing
    certain phthalates (notified under document number C(2000) 3719)'
  type: main
- language: fr
  script: Latn
  content: '2000/769/CE: Décision de la Commission du 6 décembre 2000 prolongeant
    pour la quatrième fois la validité de la décision 1999/815/CE concernant des
    mesures qui interdisent la mise sur le marché de jouets et articles de puériculture
    destinés à être mis en bouche par des enfants de moins de trois ans, fabriqués
    en PVC souple contenant certains phtalates [notifiée sous le numéro C(2000)
    3719]'
  type: main
- language: de
  script: Latn
  content: '2000/769/EG: Entscheidung der Kommission vom 6. Dezember 2000 über eine
    vierte Verlängerung der Geltungsdauer der Entscheidung 1999/815/EG über Maßnahmen
    zur Untersagung des Inverkehrbringens von Spielzeug- und Babyartikeln, die dazu
    bestimmt sind, von Kindern unter drei Jahren in den Mund genommen zu werden, und
    aus Weich-PVC bestehen, das bestimmte Weichmacher enthält (Bekannt gegeben unter
    Aktenzeichen K(2000) 3719)'
  type: main
- language: da
  script: Latn
  content: '2000/769/EF: Kommissionens beslutning af 6. december 2000 om fjerde forlængelse
    af gyldigheden af beslutning 1999/815/EF om forbud mod markedsføring af legetøj
    og småbørnsartikler, der er beregnet til at blive puttet i munden af børn under
    tre år, og som er fremstillet af blød pvc indeholdende visse phthalater (meddelt
    under nummer K(2000) 3719)'
  type: main
- language: el
  script: Grek
  content: '2000/769/ΕΚ: Απόφαση της Επιτροπής, της 6ης
    Δεκεμβρίου 2000, για την παράταση για τέταρτη
    φορά της ισχύος της απόφασης 1999/815/ΕΚ σχετικά
    με τα μέτρα που απαγορεύουν την διάθεση στην
    αγορά παιχνιδιών και προϊόντων παιδικής φροντίδας
    κατασκευασμένων από μαλακό PVC που περιέχει
    ορισμένους φθαλικούς εστέρες τα οποία κατά
    τη χρήση μπαίνουν στο στόμα παιδιών ηλικίας
    μικρότερης από τριών ετών [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 3719]'
  type: main
- language: fi
  script: Latn
  content: '2000/769/EY: Komission päätös, tehty 6 päivänä joulukuuta 2000,
    toimenpiteistä, joilla kielletään tiettyjä ftalaatteja sisältävien, pehmeästä
    PVC:stä valmistettujen, alle kolmivuotiaiden lasten suuhun pantavaksi tarkoitettujen
    lelujen ja lastentarvikkeiden markkinoille saattaminen, tehdyn päätöksen 1999/815/EY
    voimassaoloajan pidentämisestä neljännen kerran (tiedoksiannettu numerolla
    K(2000) 3719)'
  type: main
- language: it
  script: Latn
  content: '2000/769/CE: Decisione della Commissione, del 6 dicembre 2000, che proroga
    per la quarta volta la validità della decisione 1999/815/CE riguardante provvedimenti
    che vietano l''immissione sul mercato di giocattoli e articoli di puericultura
    destinati ad essere messi in bocca da bambini d''età inferiore a tre anni e fabbricati
    in PVC morbido contenente taluni ftalati [notificata con il numero C(2000) 3719]'
  type: main
- language: nl
  script: Latn
  content: '2000/769/EG: Beschikking van de Commissie van 6 december 2000 tot vierde
    verlenging van de geldigheidsduur van Beschikking 1999/815/EG betreffende maatregelen
    houdende verbod op het op de markt brengen van speelgoed- en kinderverzorgingsartikelen
    die bestemd zijn om door kinderen jonger dan drie jaar in de mond te worden gestopt
    en vervaardigd zijn van zacht PVC dat bepaalde ftalaten bevat (kennisgeving geschied
    onder nummer C(2000) 3719)'
  type: main
- language: pt
  script: Latn
  content: '2000/769/CE: Decisão da Comissão, de 6 de Dezembro de 2000, que prorroga
    pela quarta vez o período de validade da Decisão 1999/815/CE relativa a medidas
    de proibição da colocação no mercado de brinquedos e artigos de puericultura
    destinados a ser introduzidos na boca por crianças com menos de três anos de
    idade, fabricados em PVC maleável que contenha determinados ftalatos [notificada
    com o número C(2000) 3719]'
  type: main
- language: es
  script: Latn
  content: '2000/769/CE: Decisión de la Comisión, de 6 de diciembre de 2000, por
    la que se prolonga por cuarta vez la validez de la Decisión 1999/815/CE sobre
    medidas relativas a la prohibición de la comercialización de determinados juguetes
    y artículos de puericultura destinados a ser introducidos en la boca por niños
    menores de tres años y fabricados con PVC blando que contenga ciertos ftalatos
    [notificada con el número C(2000) 3719]'
  type: main
- language: sv
  script: Latn
  content: '2000/769/EG: Kommissionens beslut av den 6 december 2000 om förlängning
    för fjärde gången av beslut 1999/815/EG om åtgärder för att förbjuda utsläppandet
    på marknaden av leksaker och barnavårdsartiklar som är avsedda att stoppas
    i munnen av barn under tre års ålder, tillverkade i mjuk PVC-plast som innehåller
    vissa ftalater [delgivet med nr K(2000) 3719]'
