    Festsetzung der ab 1. Oktober 1982 geltenden Erstattungssätze bei der Ausfuhr
    bestimmter Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des
    Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2625/82 af 30. september 1982 om fastsættelse
