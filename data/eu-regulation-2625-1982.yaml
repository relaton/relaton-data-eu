  content: Commission Regulation (EEC) No 2625/82 of 30 September 1982 fixing the
    rates of the refunds applicable from 1 October 1982 to certain cereal and rice
    products exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2625/82 de la Commission, du 30 septembre 1982, fixant
