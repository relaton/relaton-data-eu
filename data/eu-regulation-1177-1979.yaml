title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1177/79 of 12 June 1979 laying down for 1979
    certain measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1177/79 du Conseil, du 12 juin 1979, fixant, pour
    1979, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1177/79 des Rates vom 12. Juni 1979 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter spanischer Flagge für 1979
  type: main
- language: da
  script: Latn
  content: Rådets forordning EØF) nr. 1177/79 af 12. juni 1979 om fastsættelse
    for 1979 af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der sejler under spanske flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1177/79 del Consiglio, del 12 giugno 1979, che dispone
    per il 1979 talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1177/79 van de Raad van 12 juni 1979 tot vaststelling
    van bepaalde maatregelen voor de instandhouding en het beheer van de visstand
    die voor 1979 van toepassing zijn op vaartuigen die de vlag van Spanje voeren
  type: main
