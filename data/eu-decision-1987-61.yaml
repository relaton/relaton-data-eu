id: EUDecision198761
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '87/61/EEC: Commission Decision of 19 December 1986 authorizing certain
    Member States to apply intra- Community surveillance to imports of products originating
    in third countries which have been put into free circulation in the Community
    and which may be the subject of protective measures under Article 115 of the Treaty
    (Only the Spanish, German, Greek, English, French, Italian and Dutch texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/61/CEE: Décision de la Commission du 19 décembre 1986 autorisant
    certains États membres à procéder à une surveillance intracommunautaire des
    importations de produits originaires de pays tiers, mis en libre pratique dans
    la Communauté, susceptibles de faire l''objet de mesures de protection au titre
    de l''article 115 du traité (Les textes en langues espagnole, allemande, grecque,
    anglaise, française, italienne et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/61/EWG: Entscheidung der Kommission vom 19. Dezember 1986 zur Ermächtigung
    bestimmter Mitgliedstaaten zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Drittländern stammenden, in der Gemeinschaft im freien
    Verkehr befindlichen Waren, die Schutzmaßnahmen gemäß Artikel 115 des Vertrages
    unterworfen werden können (Nur der spanische, deutsche, griechische, englische,
    französische, italienische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/61/EØF: Kommissionens beslutning af 19. december 1986 om bemyndigelse
    af visse af medlemsstaterne til at forlænge gyldighedsperioden for tilsyn inden
    for Fællesskabet med indførsel af produkter, der har oprindelse i tredjelande
    og er overgået til fri omsætning i Fællesskabet, og som ville kunne gøres
    til genstand for beskyttelsesforanstaltninger i henhold til traktatens artikel
    115 (Kun den spanske, tyske, graeske, engelske, franske, italienske og nederlandske
    udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '87/61/ΕΟΚ: Απόφαση της Επιτροπής της 19ης Δεκεμβρίου
    1986 περί χορηγήσεως αδείας σε ορισμένα κράτη
    μέλη να προβούν σε ενδοκοινοτική επιτήρηση
    των εισαγωγών προϊόντων, καταγωγής τρίτων
    χωρών, τα οποία τίθενται σε ελεύθερη κυκλοφορία
    στην Κοινότητα και τα οποία μπορούν να αποτελέσουν
    αντικείμενο των μέτρων προστασίας, δυνάμει
    του άρθρου 115 της συνθήκης (Τα κείμενα στην
    ισπανική, γερμανική, ελληνική, αγγλική, γαλλική,
    ιταλική και ολλανδική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '87/61/CEE: Decisione della Commissione del 19 dicembre 1986 che autorizza
    taluni Stati membri a procedere ad una sorveglianza intracomunitaria sulle importazioni
    di prodotti originari dei paesi terzi, messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell''articolo 115
    del trattato (Il testi in lingua spagnola, tedesca, greca, inglese, francese,
    italiana e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '87/61/EEG: Beschikking van de Commissie van 19 december 1986 houdende
    machtiging van bepaalde Lid-Staten om over te gaan tot een intracommunautair toezicht
    ten aanzien van de invoer van produkten van oorsprong uit derde landen die in
    de Gemeenschap in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn
    van beschermende maatregelen krachtens artikel 115 van het Verdrag (Slechts de
    teksten in de Spaanse, Duitse, Griekse, Engelse, Franse, Italiaanse en de Nederlandse
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/61/CEE: Decisão da Comissão de 19 de Dezembro de 1986 que autoriza
    certos Estados-membros a procederem a uma vigilância intracomunitária das importações
    de produtos originários de países terceiros introduzidos em livre prática na
    Comunidade, susceptíveis de serem objecto de medidas de protecção ao abrigo
    do artigo 115 do Tratado (Apenas fazem fé os textos nas línguas espanhola, alemã,
    grega, inglesa, francesa, italiana e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '87/61/CEE: Decisión de la Comisión de 19 de diciembre de 1986 por la
    que se autoriza a determinados Estados miembros a establecer medidas de vigilancia
    intracomunitaria en relación con las importaciones de productos originarios de
    terceros países despachados a libre práctica en la Comunidad, que pueden ser
    objeto de medidas de protección en virtud de lo dispuesto en el artículo 115
    del Tratado (Los textos en lenguas española, alemana, griega, inglesa, francesa,
    italiana y neerlandesa son los únicos auténticos)'
  type: main
