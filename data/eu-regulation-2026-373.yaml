    и 2-хидроксипропиламин (съотношение 1:1), като
    съществуващо активно вещество за употреба
    в биоциди от продуктови типове 2, 11 и 13, в съответствие
    с Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
