title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/373 of 20 February 2026 approving
    formaldehyde released from the reaction products of paraformaldehyde and 2-hydroxypropylamine
    (ratio 1:1) as an existing active substance for use in biocidal products of product-types
    2, 11 and 13 in accordance with Regulation (EU) No 528/2012 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/373 de la Commission du 20 février
    2026 approuvant le formaldéhyde libéré par les produits de la réaction du
    paraformaldéhyde et de la 2-hydroxypropylamine (ratio 1:1) en tant que substance
    active existante destinée à être utilisée dans des produits biocides relevant
    des types de produits 2, 11 et 13 conformément au règlement (UE) no 528/2012
    du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/373 der Kommission vom 20. Februar 2026
    zur Genehmigung von aus den Reaktionsprodukten von Paraformaldehyd und 2-Hydroxypropylamin
    (Verhältnis 1:1) freigesetztem Formaldehyd als altem Wirkstoff zur Verwendung
    in Biozidprodukten der Produktarten 2, 11 und 13 gemäß der Verordnung (EU) Nr.
    528/2012 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
