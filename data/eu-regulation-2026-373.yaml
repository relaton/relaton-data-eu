  script: Latn
  content: Prováděcí nařízení Komise (EU) 2026/373 ze dne 20. února 2026, kterým
    se schvaluje formaldehyd uvolněný z reakčních produktů paraformaldehydu a
    2-hydroxypropylaminu (poměr 1:1) jako stávající účinná látka pro použití
    v biocidních přípravcích typů 2, 11 a 13 v souladu s nařízením Evropského
    parlamentu a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2026/373 af 20. februar 2026
