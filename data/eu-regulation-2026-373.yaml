    og 2-hydroxypropylamin (i forholdet 1:1) som et eksisterende aktivstof til anvendelse
    i biocidholdige produkter af produkttype 2, 11 og 13 i overensstemmelse med Europa-Parlamentets
    og Rådets forordning (EU) nr. 528/2012
  type: main
- language: el
