title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3779/85 of 31 December 1985 establishing, for
    1986, certain measures for the conservation and management of fishery resources,
    applicable to vessels flying the flag of a Member State, other than Spain and
    Portugal, in waters falling under the sovereignty or within the jurisdiction of
    Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3779/85 du Conseil du 31 décembre 1985 fixant, pour
    1986, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon des États membres, à l' exception de
    l' Espagne et du Portugal, dans les eaux relevant de la souveraineté ou de la
    juridiction du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3779/85 des Rates vom 31. Dezember 1985 zur Festsetzung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für die Schiffe unter der Flagge der Mitgliedstaaten mit Ausnahme Spaniens und
    Portugals in den Gewässern unter der Hoheitsgewalt oder der Gerichtsbarkeit Portugals
    für 1986
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3779/85 af 31. december 1985 om fastsættelse
    for 1986 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører medlemsstaternes flag, bortset
    fra spansk og portugisisk flag, i de farvande, der henhører under Portugals højhedsområde
    eller jurisdiktion
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3779/85 του Συμβουλίου
    της 31ης Δεκεμβρίου 1985 για τον καθορισμό, για
    το 1986, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με σημαία των κρατών μελών, εκτός της
    Ισπανίας και της Πορτογαλίας, στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3779/85 del Consiglio del 31 dicembre 1985 che fissa,
    per il 1986, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera degli stati membri, esclusi la Spagna
    e il Portogallo, nelle acque soggette alla sovranità o alla giurisdizione del
    Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3779/85 van de Raad van 31 december 1985 tot vaststelling,
    voor 1986, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op vaartuigen die de vlag voeren van de Lid-Staten,
    met uitzondering van Spanje en Portugal, in de wateren die onder de soevereiniteit
    of de jurisdictie van Portugal vallen vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3779/85 do Conselho, de 31 de Dezembro de 1985,
    que fixa, para 1986, certas medidas de conservação e de gestão dos recursos
    da pesca aplicáveis aos navios que arvoram pavilhão dos Estados-membros, com
    excepção de Espanha e de Portugal, nas águas sob soberania ou jurisdição
    de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3779/85 del Consejo, de 31 de diciembre de 1985, por
    el que se fijan, para 1986, determinadas medidas de conservación y de gestión
    de los recursos de pesca aplicables a los buques que enarbolan pabellón de los
    Estados miembros, con excepción de España y de Portugal, en las aguas sometidas
    a la soberanía o a la jurisdicción de Portugal
