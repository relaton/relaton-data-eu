id: EUDecision1995389
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '95/389/EC: Commission Decision of 20 September 1995 authorizing Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directive 66/404/EEC and amending Commission
    Decision 94/751/EC authorizing Member States to permit temporarily the marketing
    of forest reproductive material not satisfying the requirements of Council Directives
    66/404/EEC and 71/161/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/389/CE: Décision de la Commission, du 20 septembre 1995, autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers de reproduction ne répondant pas aux exigences de la directive 66/404/CEE
    du Conseil, et modifiant la décision 94/751/CE autorisant les États membres
    à admettre temporairement la commercialisation de matériels forestiers de reproduction
    ne répondant pas aux exigences des directives 66/404/CEE et 71/161/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '95/389/EG: Entscheidung der Kommission vom 20. September 1995 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht, und
    zur Änderung der Entscheidung 94/751/EG zur Ermächtigung der Mitgliedstaaten,
    vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen
    der Richtlinien 66/404/EWG und 71/161/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '95/389/EF: Kommissionens beslutning af 20. september 1995 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF, og om ændring af beslutning
    94/751/EF om bemyndigelse af medlemsstaterne til midlertidigt at tillade handel
    med forstligt formeringsmateriale, der ikke opfylder kravene i Rådets direktiv
    66/404/EØF og 71/161/EØF'
  type: main
- language: el
  script: Grek
  content: '95/389/ΕΚ: Απόφαση της Επιτροπής της 20ής Σεπτεμβρίου
    1995 που επιτρέπει στα κράτη μέλη να εγκρίνουν
    προσωρινώς την εμπορία δασικού πολλαπλασιαστικού
    υλικού που δεν πληροί τις απαιτήσεις της οδηγίας
    66/404/ΕΟΚ του Συμβουλίου, και τροποποιεί την
    απόφαση 94/751/ΕΚ η οποία επιτρέπει στα κράτη
    μέλη να εγκρίνουν προσωρινώς την εμπορία του
    δασικού πολλαπλασιαστικού υλικού που δεν πληροί
    τις απαιτήσεις των οδηγιών 66/404/ΕΟΚ και 71/161/ΕΟΚ
    του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '95/389/EY: Komission päätös, tehty 20 päivänä syyskuuta 1995, luvan
    antamisesta jäsenvaltioille hyväksyä tilapäisesti sellaisen metsänviljelyaineiston
    pitäminen kaupan, joka ei täytä neuvoston direktiivin 66/404/ETY vaatimuksia,
    ja luvan antamisesta jäsenvaltioille hyväksyä tilapäisesti sellaisen metsänviljelyaineiston
    pitäminen kaupan, joka ei täytä neuvoston direktiivien 66/404/ETY ja 71/161/ETY
    vaatimuksia, annetun päätöksen 94/751/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '95/389/CE: Decisione della Commissione, del 20 settembre 1995, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    forestali di moltiplicazione non rispondenti ai requisiti prescritti dalla direttiva
    66/404/CEE del Consiglio e recante modifica della decisione 94/751/CE che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    forestali di moltiplicazione non rispondenti ai requisiti prescritti dalle direttive
    66/404/CEE e 71/161/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '95/389/EG: Beschikking van de Commissie van 20 september 1995 houdende
    machtiging van de Lid-Staten om tijdelijk toe te staan dat bosbouwkundig teeltmateriaal
    dat niet beantwoordt aan de vereisten van Richtlijn 66/404/EEG van de Raad in
    de handel wordt gebracht en houdende wijziging van Beschikking 94/751/EG tot machtiging
    van de Lid-Staten om tijdelijk toe te staan dat bosbouwkundig teeltmateriaal dat
    niet beantwoordt aan de vereisten van de Richtlijnen 66/404/EEG en 71/161/EEG
    van de Raad in de handel wordt gebracht'
  type: main
- language: pt
  script: Latn
  content: '95/389/CE: Decisão da Comissão, de 20 de Setembro de 1995, que autoriza
    os Estados-membros a permitir temporariamente a comercialização de materiais
    florestais de reprodução que não satisfaçam as exigências da Directiva 66/404/CEE
    do Conselho e que altera a Decisão 94/751/CE que autoriza os Estados- membros
    a permitir temporariamente a comercialização de materiais florestais de reprodução
    que não satisfaçam as exigências das Directivas 66/404/CEE e 71/161/CEE do
    Conselho'
  type: main
- language: es
  script: Latn
  content: '95/389/CE: Decisión de la Comisión, de 20 de septiembre de 1995, por
    la que se autoriza a los Estados miembros a permitir temporalmente la comercialización
    de material de reproducción forestal que no cumpla los requisitos de la Directiva
    66/404/CEE del Consejo y se modifica la Decisión 94/751/CE por la que se autoriza
    a los Estados miembros a permitir temporalmente la comercialización de material
    de reproducción forestal que no cumpla los requisitos de las Directivas 66/404/CEE
    y 71/161/CEE del Consejo'
  type: main
- language: sv
  script: Latn
  content: '95/389/EG: Kommissionens beslut av den 20 september 1995 om bemyndigande
    för medlemsstaterna att tillfälligt tillåta saluföring av skogsodlingsmaterial
    som inte uppfyller kraven enligt rådets direktiv 66/404/EEG och om ändring av
    beslut 94/751/EG om bemyndigande för medlemsstaterna att tillfälligt tillåta
    saluföring av skogsodlingsmaterial som inte uppfyller kraven enligt rådets direktiv
    66/404/EEG och 71/161/EEG'
  type: main
