title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1408/86 of 13 May 1986 derogating, as regards
    the wine-growing sector, from Regulation (EEC) No 410/86 on transitional measures
    to be adopted on account of the accession of Spain and Portugal in respect of
    trade in agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1408/86 de la Commission du 13 mai 1986 dérogeant,
    pour le secteur viti-vinicole, au règlement (CEE) n° 410/86, relatif aux mesures
    transitoires à prendre, du fait de l' adhésion de l' Espagne et du Portugal,
    concernant les échanges de produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1408/86 der Kommission vom 13. Mai 1986 zur Abweichung
    von der Verordnung (EWG) Nr. 410/86 über die aufgrund des Beitritts Spaniens
    und Portugals zu treffenden Übergangsmaßnahmen für den Handel mit landwirtschaftlichen
    Erzeugnissen für den Weinsektor
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1408/86 af 13. maj 1986 om en undtagelse
    for vin fra forordning (EØF) nr. 410/86 om de overgangsforanstaltninger, der
    på grund af Spaniens og Portugals tiltrædelse skal træffes med hensyn til samhandelen
    med landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1408/86 της Επιτροπής
    της 13ης Μαΐου 1986 που παρεκκλίνει, για τον αμπελοοινικό
    τομέα, από τον κανονισμό (ΕΟΚ) αριθ. 410/86 σχετικά
    με τα μεταβατικά μέτρα που πρέπει να ληφθούν,
    λόγω της προσχώρησης της Ισπανίας και της Πορτογαλίας,
    όσον αφορά τις συναλλαγές γεωργικών προϊόντων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1408/86 della Commissione del 13 maggio 1986 recante
    deroga, per il settore vitivinicolo, al regolamento (CEE) n. 410/86 relativo alle
    misure transitorie da adottare, in seguito all' adesione della Spagna e del Portogallo,
    per quando riguarda gli scambi di prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1408/86 van de Commissie van 13 mei 1986 houdende
    afwijking, ten aanzien van de wijnbouwsector, van Verordening (EEG) nr. 410/86
    betreffende de wegens de toetreding van Spanje en Portugal voor het handelsverkeer
    in landbouwprodukten te nemen overgangsmaatregelen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1408/86 da Comissão de 13 de Maio de 1986 que derroga,
    para o sector vitivinícola, o Regulamento (CEE) n.° 410/86, relativo às medidas
    transitórias a adoptar em razão da adesão de Espanha e de Portugal, respeitantes
    às trocas comerciais de produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1408/86 de la Comisión de 13 de mayo de 1986 declarando
    inaplicable, en el sector vitivinícola, el Reglamento (CEE) n° 410/86, relativo
    a las medidas transitorias que deberán adoptarse, debido a la adhesión de España
    y de Portugal, referente a los intercambios de productos agrícolas
  type: main
