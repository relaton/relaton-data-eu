  script: Latn
  content: Commission Regulation (EEC) No 1862/89 of 27 June 1989 re-establishing
    the levying of customs duties on footwear falling within CN codes 6404 and 6405
    90 10, originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
