title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1305/2002 of 18 July 2002 amending Regulation
    (EC) No 1115/2002 determining the extent to which applications lodged in June
    2002 for import licences for certain pigmeat sector products under the regime
    provided for by Council Regulation (EC) No 774/94 opening and providing for the
    administration of certain Community tariff quotas for pigmeat and certain other
    agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1305/2002 de la Commission du 18 juillet 2002 modifiant
    le règlement (CE) n° 1115/2002 déterminant la mesure dans laquelle les demandes
    de certificats d'importation introduites en juin 2002 pour certains produits du
    secteur de la viande de porc peuvent être acceptées dans le cadre du régime
    prévu par le règlement (CE) n° 774/94 du Conseil portant ouverture et mode
    de gestion de certains contingents tarifaires communautaires pour la viande porcine
    et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1305/2002 der Kommission vom 18. Juli 2002 zur Änderung
    der Verordnung (EG) Nr. 1115/2002 über die Festsetzung des Umfangs, in dem die
    im Juni 2002 gestellten Anträge auf Einfuhrlizenzen für bestimmte Erzeugnisse
    des Schweinefleischsektors entsprechend der Regelung der Verordnung (EG) Nr. 774/94
    des Rates zur Eröffnung und Verwaltung gemeinschaftlicher Zollkontingente für
    Schweinefleisch und bestimmte andere landwirtschaftliche Erzeugnisse genehmigt
    werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1305/2002 af 18. juli 2002 om ændring
    af forordning (EF) nr. 1115/2002 om fastsættelse af, i hvilket omfang der kan
    accepteres ansøgninger, der blev indgivet i juni 2002 om importlicenser for visse
    produkter inden for svinekødssektoren i forbindelse med Rådets forordning (EF)
    nr. 774/94 om åbning og forvaltning af en række EF-toldkontingenter for svinekød
    og visse andre landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1305/2002 της Επιτροπής,
    της 18ης Ιουλίου 2002, για με την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1115/2002 για καθορισμό ορίων
    εντός των οποίων δύνανται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Ιούνιο του
    2002 για πιστοποιητικά εισαγωγής για ορισμένα
    προϊόντα του τομέα του χοιρείου κρέατος βάσει
    του καθεστώτος που προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 774/94 του Συμβουλίου για το άνοιγμα
    και τον τρόπο διαχείρισης ορισμένων κοινοτικών
    δασμολογικών ποσοστώσεων για το χοίρειο κρέας
    και για ορισμένα άλλα γεωργικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1305/2002, annettu 18 päivänä heinäkuuta
    2002, kesäkuussa 2002 jätettyjen tiettyjä sianliha-alan tuotteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä tiettyjen sianlihaa ja tiettyjä
    muita maataloustuotteita koskevien yhteisön tariffikiintiöiden avaamisesta ja
    hallinnasta annetussa neuvoston asetuksessa (EY) N:o 774/94 säädetyn järjestelmän
    mukaisesti annetun asetuksen (EY) N:o 1115/2002 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1305/2002 della Commissione, del 18 luglio 2002, recante
    modifica del regolamento (CE) n. 1115/2002 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli d'importazione presentate nel mese di giugno
    2002 per taluni prodotti del settore delle carni suine nel quadro del regime previsto
    dal regolamento (CE) n. 774/94 del Consiglio recante apertura e modalità di gestione
    di alcuni contingenti tariffari comunitari di carni suine e di taluni altri prodotti
    agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1305/2002 van de Commissie van 18 juli 2002 houdende
    wĳziging van Verordening (EG) nr. 1115/2002 tot vaststelling van de mate waarin
    gevolg kan worden gegeven aan de aanvragen om invoercertificaten voor bepaalde
    producten in de sector varkensvlees, die in juni 2002 worden ingediend op grond
    van Verordening (EG) nr. 774/94 van de Raad houdende opening en vaststelling van
    de wĳze van beheer van communautaire tariefcontingenten voor varkensvlees en
    bepaalde andere landbouwproducten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1305/2002 da Comissão, de 18 de Julho de 2002, que
    altera o Regulamento (CE) n° 1115/2002, que determina em que medida podem ser
    aceites os pedidos de certificados de importação de determinados produtos do
    sector da carne de suíno apresentados em Junho de 2002 ao abrigo do regime previsto
    no Regulamento (CE) n.° 774/94 do Conselho, relativo à abertura e modo de gestão
    de determinados contingentes pautais comunitários de carne de suíno e outros
    produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1305/2002 de la Comisión, de 18 de julio de 2002,
    que modifica el Reglamento (CE) n° 1115/2002 por el que se determina la proporción
    en que se satisfarán las solicitudes de certificados de importación de algunos
    productos del sector de la carne de porcino presentadas en junio de 2002 al amparo
    del régimen previsto en el Reglamento (CE) n° 774/94 del Consejo relativo a
    la apertura y modo de gestión de determinados contingentes arancelarios comunitarios
    de carne de porcino y determinados productos agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1305/2002 av den 18 juli 2002 om ändring
    av förordning (EG) nr 1115/2002 om den utsträckning i vilken ansökningar om
    importlicens som inlämnas i juni 2002 skall beviljas för vissa produkter inom
    grisköttssektorn inom ramen för den ordning som fastställs genom rådets förordning
    (EG) nr 774/94 om öppnande och förvaltning av vissa gemenskapstullkvoter för
    griskött och vissa andra jordbruksprodukter
  type: main
