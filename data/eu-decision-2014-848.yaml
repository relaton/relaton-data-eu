    Statistiken für Jahre vor dem vorletzten Jahr zu verwenden und die Bemessungsgrundlage
    für die MwSt.-Eigenmittel bei bestimmten Gruppen von Umsätzen anhand von Schätzwerten
    zu ermitteln (Bekanntgegeben unter Aktenzeichen C(2014) 8929)'
