title:
- language: en
  script: Latn
  content: '2014/848/EU, Euratom: Commission Implementing Decision of 26 November
    2014 amending Decision 2010/4/EU, Euratom authorising Bulgaria to use statistics
    for years earlier than the last year but one, and to use certain approximate estimates
    for the calculation of the VAT own resources base (notified under document C(2014)
    8929)'
  type: main
- language: fr
  script: Latn
  content: '2014/848/UE, Euratom: Décision d''exécution de la Commission du 26 novembre
    2014 modifiant la décision 2010/4/UE, Euratom autorisant la Bulgarie à recourir
    à des statistiques relatives à des années antérieures à la pénultième année
    et à utiliser certaines estimations approximatives pour le calcul de la base
    des ressources propres provenant de la taxe sur la valeur ajoutée [notifiée
    sous le numéro C(2014) 8929]'
  type: main
- language: de
  script: Latn
  content: '2014/848/EU, Euratom: Durchführungsbeschluss der Kommission vom 26. November
