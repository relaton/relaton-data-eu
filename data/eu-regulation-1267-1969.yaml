  content: Regulation (EEC) No 1267/69 of the Council of 30 June 1969 laying down
    special provisions applicable to the importation into the Community from Greece
    of goods covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1267/69 du Conseil, du 30 juin 1969, fixant les dispositions
    particulières applicables lors de l' importation dans la Communauté, en provenance
    de la Grèce, des marchandises relevant du règlement (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1267/69 des Rates vom 30. Juni 1969 zur Festlegung
    der Sonderbestimmungen, die bei der Einfuhr von unter die Verordnung (EWG) Nr.
    1059/69 fallenden Waren aus Griechenland in die Gemeinschaft anwendbar sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1267/69 af 30. juni 1969 om fastsættelse
    af særlige bestemmelser, der finder anvendelse ved indførsel i Fællesskabet
    fra Grækenland af varer, som omfattes af forordning (EØF) nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1267/69 del Consiglio, del 30 giugno 1969, che fissa
    le disposizioni particolari applicabili all' importazione nella Comunità di merci
    soggette al regolamento (CEE) n. 1059/69 e provenienti dalla Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1267/69 van de Raad van 30 juni 1969 houdende vaststelling
    van de speciale voorschriften die van toepassing zijn bij de invoer in de Gemeenschap
    van onder Verordening (EEG) nr. 1059/69 vallende goederen van oorsprong uit Griekenland
