  script: Latn
  content: Council Decision (EU) 2020/681 of 18 May 2020 on the position to be taken
    on behalf of the European Union in the Committee on Services and Investment established
    under the Comprehensive Economic and Trade Agreement (CETA) between Canada, of
    the one part, and the European Union and its Member States, of the other part,
