  script: Latn
  content: Commission Delegated Regulation (EU) 2021/95 of 28 January 2021 amending
    Delegated Regulation (EU) 2020/592 on temporary exceptional measures derogating
    from certain provisions of Regulation (EU) No 1308/2013 of the European Parliament
    and of the Council to address the market disturbance in the fruit and vegetables
    and wine sectors caused by the COVID-19 pandemic and measures linked to it
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/95 de la Commission du 28 janvier 2021
    modifiant le règlement délégué (UE) 2020/592 relatif à des mesures temporaires
    exceptionnelles dérogeant à certaines dispositions du règlement (UE) no 1308/2013
    du Parlement européen et du Conseil en vue de remédier aux perturbations du
    marché dans le secteur des fruits et légumes et le secteur vitivinicole provoquées
    par la pandémie de COVID-19 et les mesures mises en place à cet égard
  type: main
- language: de
  script: Latn
