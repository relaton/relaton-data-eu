    1308/2013 del Parlamento europeo e del Consiglio per affrontare la turbativa del
    mercato nei settori ortofrutticolo e vitivinicolo causata dalla pandemia di COVID-19
    e dalle misure ad essa legate
  type: main
- language: lv
  script: Latn
