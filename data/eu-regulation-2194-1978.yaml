title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2194/78 of 20 September 1978 re-establishing
    the levying of customs duties on angles, shapes and sections, of iron or steel,
    etc., falling within subheadings 73.11 A II, III, IV a) 2 and IV b), originating
    in Romania, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2194/78 de la Commission, du 20 septembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux profilés
    en fer ou en acier, etc., des sous-positions tarifaires 73.11 A II, III, IV a)
    2 et IV b), originaires de Roumanie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2194/78 der Kommission vom 20. September 1978 zur
    Wiedereinführung des Zollsatzes für Profile aus Stahl usw. der Tarifstellen
    73.11 A II, III, IV a) 2 und IV b), mit Ursprung in Rumänien, dem die in der
    Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2194/78 af 20. september 1978 om genindførelse
    af opkrævning af toldafgifter for profiler af jern og stål, etc., under underposition
    73.11 A II, III, IV a) 2 og IV b), som har oprindelse i Rumænien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2194/78 della Commissione, del 20 settembre 1978,
    che ripristina la riscossione dei dazi doganali applicabili ai profilati di ferro
    o di acciaio, ecc., delle sottovoci 73.11 A II, A III, A IV a) 2 e A IV b) della
    tariffa doganale comune, originari della Romania, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2194/78 van de Commissie van 20 september 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op profielijzer
    en profielstaal, enz., van de posten 73.11 A II, III, IV a) 2 en IV b), van oorsprong
    uit Roemenië, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
