title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1878/79 of 24 August 1979 re-establishing
    the levying of customs duties on illuminating glassware, signalling glassware
    and optical elements of glass, etc., other, falling within subheading 70.14 A
    II and originating in Romania, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1878/79 de la Commission, du 24 août 1979, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d' éclairage, de signalisation et d' optique commune, etc., autres, de la sous-position
    70.14 A II du tarif douanier commun, originaire de Roumanie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1878/79 der Kommission vom 24. August 1979 zur Wiedereinführung
    des Zollsatzes für bestimmte Glaswaren für Beleuchtung, für Signalvorrichtungen
    oder zu optischen Zwecken usw., andere, der Tarifstelle 70.14 A II, mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1878/79 af 24. august 1979 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas, refleksglas, optiske
    artikler af glas, etc., andre, under underpositionen 70.14 A II, som har oprindelse
    i Rumænien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1878/79 della Commissione, del 24 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune, ecc., altri, della sottovoce 70.14 A II
    della tariffa doganale comune, originari della Romania beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1878/79 van de Commissie van 24 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas, enz., andere, van post 70.14 A II,
    van oorsprong uit Roemenië ten behoeve waarvan bij Verordening (EEG) nr. 3156/78
    van de Raad algemene tariefpreferenties werden geopend
  type: main
