title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/1752 of 23 November 2020 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for Australia in the
    list of third countries, territories, zones or compartments from which certain
    poultry commodities may be imported into or transit through the Union in relation
    to highly pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/1752 de la Commission du 23 novembre
    2020 modifiant l’annexe I du règlement (CE) no 798/2008 en ce qui concerne
    les mentions relatives à l’Australie sur la liste des pays tiers, territoires,
    zones ou compartiments en provenance desquels certains produits de volailles peuvent
    être importés dans l’Union ou transiter par celle-ci, quant à l’influenza
    aviaire hautement pathogène
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/1752 der Kommission vom 23. November
    2020 zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich
    des Eintrags zu Australien in der Liste der Drittländer, Gebiete, Zonen und Kompartimente,
    aus denen mit Blick auf die hochpathogene Aviäre Influenza die Einfuhr bestimmter
    Geflügelwaren in die Union und ihre Durchfuhr durch die Union zugelassen ist
  type: main
- language: bg
  script: Cyrl
