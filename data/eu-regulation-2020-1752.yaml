    pot fi importate în Uniune sau pot tranzita Uniunea în contextul riscului de
    gripă aviară înalt patogenă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/1752 z 23. novembra 2020, ktorým
