    hvorfra import til eller transit gennem Unionen af visse fjerkræprodukter er
    tilladt i forbindelse med højpatogen aviær influenza
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2020/1752 της Επιτροπής
