  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/1752 della Commissione del 23 novembre
    2020 che modifica l’allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa all’Australia nell’elenco di paesi terzi, loro territori,
    zone o compartimenti da cui determinati prodotti a base di pollame possono essere
    importati o transitare nell’Unione in relazione all’influenza aviaria ad alta
    patogenicità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/1752 (2020. gada 23. novembris),
    ar ko Regulas (EK) Nr. 798/2008 I pielikumu groza attiecībā uz ierakstu par
    Austrāliju to trešo valstu, teritoriju, zonu vai nodalījumu sarakstā, no kuriem
    saistībā ar augsti patogēnisko putnu gripu atļauts Savienībā importēt vai
    tranzītā caur to pārvadāt konkrētas mājputnu izcelsmes preces
  type: main
- language: lt
  script: Latn
