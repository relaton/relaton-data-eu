    Australijos įrašo trečiųjų šalių, teritorijų, zonų ar skyrių, iš kurių
    galima importuoti į Sąjungą ir vežti tranzitu per Sąjungą tam tikras naminių
    paukščių prekes, sąraše iš dalies keičiamas Reglamento (EB) Nr. 798/2008
    I priedas
  type: main
- language: mt
  script: Latn
