    leichte Nutzfahrzeuge mit konventionellem Verbrennungsmotor und bestimmte Personenkraftwagen
    und leichte Nutzfahrzeuge mit Hybridelektroantrieb verwendeten Technologie als
    innovative Technologie gemäß der Verordnung (EU) 2019/631 des Europäischen
    Parlaments und des Rates
