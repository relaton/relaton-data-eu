    állománygazdálkodási, állományvédelmi és ellenőrzési intézkedések
    megállapításáról, valamint az 1936/2001/EK, az 1984/2003/EK és az 520/2007/EK
    tanácsi rendelet módosításáról szóló (EU) 2022/2343 európai parlamenti
    és tanácsi rendelet módosításáról
  type: main
- language: it
  script: Latn
