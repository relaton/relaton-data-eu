    jistabbilixxi l-miżuri ta’ ġestjoni, ta’ konservazzjoni u ta’ kontroll
    li japplikaw fiż-Żona ta’ Kompetenza tal-Kummissjoni tat-Tonn tal-Oċean Indjan
