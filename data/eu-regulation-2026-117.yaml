    u (KE) Nru 520/2007
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2026/117 van de Commissie van 3 november
    2025 tot wijziging van Verordening (EU) 2022/2343 van het Europees Parlement en
    de Raad tot vaststelling van beheers-, instandhoudings- en controlemaatregelen
    die gelden in het bevoegdheidsgebied van de Commissie voor de tonijnvisserij in
