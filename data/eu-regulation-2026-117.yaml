    očuvanja i kontrole primjenjivih na području nadležnosti Komisije za tunu u
    Indijskom oceanu (IOTC) i o izmjeni uredbi Vijeća (EZ) br. 1936/2001, (EZ) br.
    1984/2003 i (EZ) br. 520/2007
  type: main
- language: hu
  script: Latn
