    kuriuo iš dalies keičiamas Europos Parlamento ir Tarybos reglamentas (ES) 2022/2343,
    kuriuo nustatomos Indijos vandenyno tunų komisijos (IOTC) kompetencijos rajone
    taikytinos valdymo, išsaugojimo ir kontrolės priemonės ir iš dalies keičiami
    Tarybos reglamentai (EB) Nr. 1936/2001, (EB) Nr. 1984/2003 ir (EB) Nr. 520/2007
  type: main
- language: mt
  script: Latn
