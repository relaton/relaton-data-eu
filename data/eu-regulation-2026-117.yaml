    de competência da Comissão do Atum do Oceano Índico (IOTC) e que altera os
    Regulamentos (CE) n.o 1936/2001, (CE) n.o 1984/2003 e (CE) n.o 520/2007 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2026/117 al Comisiei din 3 noiembrie 2025 de
    modificare a Regulamentului (UE) 2022/2343 al Parlamentului European și al Consiliului
    de stabilire a unor măsuri de gestionare, conservare și control aplicabile în
    zona de competență a Comisiei Tonului din Oceanul Indian (IOTC) și de modificare
    a Regulamentelor (CE) nr. 1936/2001, (CE) nr. 1984/2003 și (CE) nr. 520/2007
    ale Consiliului
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2026/117 z 3. novembra 2025, ktorým
    sa mení nariadenie Európskeho parlamentu a Rady (EÚ) 2022/2343, ktorým sa
    stanovujú riadiace, ochranné a kontrolné opatrenia platné v oblasti pôsobnosti
    Komisie pre tuniaky z Indického oceánu (IOTC) a ktorým sa menia nariadenia
    Rady (ES) č. 1936/2001, (ES) č. 1984/2003 a (ES) č. 520/2007
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2026/117 z dne 3. novembra 2025 o spremembi
    Uredbe (EU) 2022/2343 Evropskega parlamenta in Sveta o določitvi upravljalnih,
    ohranitvenih in nadzornih ukrepov, ki se uporabljajo na območju pristojnosti
    Komisije za tuna v Indijskem oceanu (IOTC), ter spremembi uredb Sveta (ES) št.
    1936/2001, (ES) št. 1984/2003 in (ES) št. 520/2007
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2026/117 de la Comisión, de 3 de noviembre de
    2025, por el que se modifica el Reglamento (UE) 2022/2343 del Parlamento Europeo
    y del Consejo por el que se establecen medidas de ordenación, conservación y
    control aplicables en la zona de competencia de la Comisión del Atún para el
