    kuru groza Eiropas Parlamenta un Padomes Regulu (ES) 2022/2343, ar ko nosaka pārvaldības,
    saglabāšanas un kontroles pasākumus, kuri piemērojami Indijas okeāna tunzivju
    komisijas (IOTC) kompetences apgabalā, un groza Padomes Regulas (EK) Nr. 1936/2001,
    (EK) Nr. 1984/2003 un (EK) Nr. 520/2007
  type: main
- language: lt
  script: Latn
