    recante modifica al regolamento (UE) 2022/2343 del Parlamento europeo e del Consiglio
    che stabilisce misure di gestione, conservazione e controllo applicabili nella
    zona di competenza della Commissione per il tonno dell’Oceano Indiano (IOTC)
    e che modifica i regolamenti (CE) n. 1936/2001, (CE) n. 1984/2003 e (CE) n. 520/2007
    del Consiglio
  type: main
- language: lv
  script: Latn
