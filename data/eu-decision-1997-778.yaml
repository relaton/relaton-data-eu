---
id: EUDecision1997778
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '97/778/EC: Commission Decision of 22 July 1997 drawing up a list of border
    inspection posts (BIPs) agreed for veterinary checks on products and animals from
    third countries, laying down detailed rules concerning the checks to be carried
    out by the experts of the Commission and repealing Decision 96/742/EC'
  type: main
- language: fr
  script: Latn
  content: '97/778/CE: Décision de la Commission du 22 juillet 1997 établissant
    une liste des postes d''inspection frontaliers agréés pour les contrôles vétérinaires
    sur les produits et animaux en provenance des pays tiers, définissant les modalités
    des contrôles à effectuer par les experts vétérinaires de la Commission et
    abrogeant la décision 96/742/CE'
  type: main
- language: de
  script: Latn
  content: '97/778/EG: Entscheidung der Kommission vom 22. Juli 1997 zur Festlegung
    eines Verzeichnisses der für die Veterinärkontrollen von Erzeugnissen und Tieren
    aus Drittländern zugelassenen Grenzkontrollstellen, zur Festlegung genauer Bestimmungen
    über die von den tierärztlichen Sachverständigen der Kommission durchzuführenden
    Kontrollen sowie zur Aufhebung der Entscheidung 96/742/EG'
  type: main
- language: da
  script: Latn
  content: '97/778/EF: Kommissionens beslutning af 22. juli 1997 om en liste over
    grænsekontrolsteder, der er godkendt til at føre veterinærkontrol med produkter
    og dyr fra tredjelande, om nærmere regler for den kontrol, som Kommissionens
    veterinærsagkyndige skal føre, og om ophævelse af beslutning 96/742/EF'
  type: main
- language: el
  script: Grek
  content: '97/778/ΕΚ: Απόφαση της Επιτροπής της 22ας Ιουλίου
    1997 για την κατάρτιση καταλόγου μεθοριακών
    σταθμών επιθεώρησης που είναι εγκεκριμένοι
    για τη διενέργεια κτηνιατρικών ελέγχων σε
    προϊόντα και ζώα από τρίτες χώρες, για καθορισμό
    λεπτομερών κανόνων όσον αφορά τους ελέγχους
    που πρέπει να διενεργούνται από τους εμπειρογνώμονες
    κτηνιάτρους της Επιτροπής και για ακύρωση
    της απόφασης 96/742/ΕΚ'
  type: main
- language: fi
  script: Latn
  content: '97/778/EY: Komission päätös, tehty 22 päivänä heinäkuuta 1997,
    kolmansista maista tuotavien tuotteiden ja eläinten eläinlääkärintarkastuksia
    varten hyväksyttyjen rajatarkastusasemien luettelosta, komission eläinlääkintäasiantuntijoiden
    suorittamia tarkastuksia koskevista yksityiskohtaisista säännöistä ja päätöksen
    96/742/EY kumoamisesta'
  type: main
- language: it
  script: Latn
  content: '97/778/CE: Decisione della Commissione del 22 luglio 1997 che stabilisce
    l''elenco dei posti d''ispezione frontalieri riconosciuti ai fini dei controlli
    veterinari sui prodotti e sugli animali provenienti dai paesi terzi, che definisce
    norme dettagliate sui controlli che debbono essere effettuati dagli esperti veterinari
    della Commissione e che abroga la decisione 96/742/CE'
  type: main
- language: nl
  script: Latn
  content: '97/778/EG: Beschikking van de Commissie van 22 juli 1997 tot vaststelling
    van een lijst van inspectieposten aan de grens die zijn erkend voor de veterinaire
    controles van producten en dieren uit derde landen, tot vaststelling van uitvoeringsbepalingen
    inzake de door de veterinaire deskundigen te verrichten controles en tot intrekking
    van Beschikking 96/742/EG'
  type: main
- language: pt
  script: Latn
  content: '97/778/CE: Decisão da Comissão de 22 de Julho de 1997 que estabelece
    uma lista dos postos de inspecção fronteiriços aprovados para a realização
    dos controlos veterinários de produtos e animais provenientes de países terceiros
    e as regras de execução dos controlos a efectuar pelos peritos veterinários
    da Comissão e que revoga a Decisão 96/742/CE'
  type: main
- language: es
  script: Latn
  content: '97/778/CE: Decisión de la Comisión de 22 de julio de 1997 por la que
    se establece la lista de puestos de inspección fronterizos autorizados para efectuar
    los controles veterinarios de los productos y animales procedentes de terceros
    países, así como las condiciones de los controles que deben efectuar los expertos
    veterinarios de la Comisión, y se deroga la Decisión 96/742/CE'
  type: main
- language: sv
  script: Latn
  content: '97/778/EG: Kommissionens beslut av den 22 juli 1997 om upprättande av
    en förteckning över gränskontrollstationer som godkänts för veterinärkontroller
    av produkter och djur från tredje land, om fastställande av närmare bestämmelser
    om de kontroller som skall utföras av kommissionens veterinärexperter och om
    upphävande av beslut 96/742/EG'
  type: main
