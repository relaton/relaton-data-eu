id: EURegulation13811993
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1381/93 of 4 June 1993 laying down detailed
    rules for applying the supplementary trade mechanism applicable to imports into
    Portugal of fresh fruit and vegetables and amendments to the application of Regulations
    concerning the supplementary trade mechanism for products processed from fruit
    and vegetables and of live trees and other plants, bulbs, roots and the like,
    cut flowers and ornamental foliage and the compensation mechanism on import of
    fruit and vegetables originating in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1381/93 de la Commission, du 4 juin 1993, établissant
    les modalités d'application du mécanisme complémentaire aux échanges applicable
    aux importations de fruits et légumes frais au Portugal et modifiant l'applicabilité
    de certains règlements relatifs au mécanisme complémentaire aux échanges pour
    les produits transformés à base de fruits et légumes et pour les produits du
    secteur des plantes vivantes et de la floriculture ainsi qu'au mécanisme de compensation
    à l'importation des fruits et légumes originaires du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1381/93 der Kommission vom 4. Juni 1993 mit Durchführungsbestimmungen
    zum ergänzenden Handelsmechanismus bei der Einfuhr von frischem Obst und Gemüse
    nach Portugal und zur Änderung der Anwendbarkeit bestimmter Verordnungen über
    den ergänzenden Handelsmechanismus für Verarbeitungserzeugnisse aus Obst und
    Gemüse sowie für bestimmte Erzeugnisse des Sektors lebende Pflanzen und Waren
    des Blumenhandels bzw. über den Ausgleichsmechanismus bei der Einfuhr von Obst
    und Gemüse aus Portugal
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1381/93 af 4. juni 1993 om gennemførelsesbestemmelser
    for den supplerende mekanisme for samhandelen, der gælder for indførsler til
    Portugal af friske frugter og grønsager og om ændret anvendelse af forordningerne
    om den supplerende mekanisme for samhandelen med produkter forarbejdet på basis
    af frugt og grønsager og udligningsmekanismen ved indførsel af frugt og grønsager
    og af levende planter og blomsterdyrkningens produkter med oprindelse i Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1381/93 της Επιτροπής
    της 4ης Ιουνίου 1993 περί λεπτομερών κανόνων
    για την εφαρμογή του συμπληρωματικού μηχανισμού
    κατά τις συναλλαγές, στις εισαγωγές στην Πορτογαλία,
    νωπών οπωροκηπευτικών και περί τροποποίησης
    της εφαρμογής ορισμένων κανονισμών που αφορούν
    το συμπληρωματικό μηχανισμό, κατά τις συναλλαγές
    για τα μεταποιημένα προϊόντα με βάση τα οπωροκηπευτικά
    και τα ζωντανά φυτά και προϊόντα ανθοκομίας,
    καθώς και τον αντισταθμιστικό μηχανισμό που
    εφαρμόζεται κατά την εισαγωγή οπωροκηπευτικών,
    καταγωγής Πορτογαλίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1381/93, annettu 4 päivänä kesäkuuta 1993,
    täydentävän kaupan järjestelmän tuoreiden hedelmien ja vihannesten Portugaliin
    tuontiin sovellettavista yksityiskohtaisista säännöistä sekä tiettyjen täydentävän
    kaupan järjestelmän hedelmä- ja vihannesjalosteisiin, eläviin kasveihin ja
    kukkaviljelytuotteisiin soveltamista sekä Portugalista peräisin olevien hedelmien
    ja vihannesten tuonnin hyvitysmekanismia koskevien asetusten soveltamisalueen
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1381/93 della Commissione, del 4 giugno 1993, recante
    modalità di applicazione del meccanismo complementare agli scambi per le importazioni
    in Portogallo di ortofrutticoli freschi, nonché modifiche dell'applicabilità
    di taluni regolamenti riguardanti, da un lato, il meccanismo complementare agli
    scambi di prodotti trasformati a base di ortofrutticoli, di prodotti della floricoltura
    e di piante vive e, dell'altro, il meccanismo di compensazione all'importazione
    di ortofrutticoli dal Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1381/93 van de Commissie van 4 juni 1993 houdende
    nadere voorschriften voor de toepassing van de aanvullende regeling voor het handelsverkeer
    voor de invoer van verse groenten en fruit in Portugal, en tot wijziging van de
    toepasbaarheid van enkele verordeningen betreffende de aanvullende regeling voor
    het handelsverkeer van op basis van groenten en fruit verwerkte produkten en van
    levende planten en produkten van de bloementeelt en betreffende het mechanisme
    van compenserende bedragen bij de invoer van groenten en fruit, van oorsprong
    uit Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1381/93 da Comissão, de 4 de Junho de 1993, que
    estabelece normas de execução do mecanismo complementar das trocas comerciais
    aplicáveis à importação em Portugal de frutas e produtos hortícolas frescos
    e modifica a aplicabilidade de determinados regulamentos relativos ao mecanismo
    complementar das trocas comerciais aplicável à importação de produtos transformados
    à base de frutas e produtos hortícolas, de plantas vivas e de produtos de floricultura,
    e ao mecanismo de compensação na importação de frutas e produtos hortícolas
    provenientes de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1381/93 de la Comisión, de 4 de junio de 1993, por
    el que se establecen las disposiciones de aplicación del mecanismo complementario
    aplicable a las importaciones en Portugal de frutas y hortalizas frescas, y por
    el que se modifica la aplicabilidad de determinados Reglamentos referentes al
    mecanismo complementario aplicable a los intercambios de productos transformados
    a base de frutas y hortalizas y a los poductos del sector de las plantas vivas
    y productos de la floricultura y al mecanismo de compensación a la importación
    de frutas y hortalizas originarios de Portugal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 1381/93 av den 4 juni 1993 om tillämpningsföreskrifter
    för den kompletterande handelsmekanismen för import av färska frukter och grönsaker
    till Portugal och om ändringar i fråga om tillämpningen av förordningarna
    om den kompletterande handelsmekanismen för produkter beredda av frukt och grönsaker
    och för levande träd och andra levande växter, lökar, rötter o.dyl., snittblommor
    och snittgrönt samt om utjämningsmekanismen vid import av frukt och grönsaker
    med ursprung i Portugal
  type: main
