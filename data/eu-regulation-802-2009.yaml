    licencí na produkty odvětví cukru v rámci některých celních kvót a preferenčních
    dohod
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 802/2009 af 2. september 2009 om konstatering
    af, at visse grænser, hvad angår udstedelse af importlicenser for sukkerprodukter
    i forbindelse med visse toldkontingenter og præferenceaftaler, ikke længere
    er nået
  type: main
- language: el
  script: Grek
