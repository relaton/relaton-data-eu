  script: Latn
  content: Commission Regulation (EC) No 802/2009 of 2 September 2009 establishing
    that certain limits for issuing import licences for sugar products under tariff
    quotas and preferential agreements are no longer reached
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 802/2009 de la Commission du 2 septembre 2009 établissant
    que certaines limites concernant la délivrance de certificats d'importation pour
    des produits du secteur du sucre dans le cadre des contingents tarifaires et accords
    préférentiels ne sont plus atteintes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 802/2009 der Kommission vom 2. September 2009 zur Feststellung,
