title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 407/2008 of 7 May 2008 amending Council Regulation
    (EC) No 2007/2000 introducing exceptional trade measures for countries and territories
    participating in or linked to the European Union's Stabilisation and Association
    process
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 407/2008 de la Commission du 7 mai 2008 modifiant le
    règlement (CE) n° 2007/2000 du Conseil introduisant des mesures commerciales
    exceptionnelles en faveur des pays et territoires participants et liés au processus
    de stabilisation et d'association mis en œuvre par l'Union européenne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 407/2008 der Kommission vom 7. Mai 2008 zur Änderung
