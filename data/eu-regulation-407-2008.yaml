    comerciale excepționale în favoarea țărilor și teritoriilor participante
    și legate de procesul de stabilizare și asociere pus în aplicare de către
    Uniunea Europeană
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 407/2008 zo 7. mája 2008 , ktorým sa mení
