    obchodní opatření pro země a území účastnící se procesu stabilizace
    a přidružení zavedeného Evropskou unií či s tímto procesem spjaté
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 407/2008 af 7. maj 2008 om ændring af
    Rådets forordning (EF) nr. 2007/2000 om exceptionelle handelsforanstaltninger
