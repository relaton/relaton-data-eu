title:
- language: en
  script: Latn
  content: '90/407/EEC: Council Decision of 27 July 1990 on the conclusion of an Agreement
    in the form of an exchange of letters concerning the provisional application of
    the Protocol setting out the fishing rights and financial compensation provided
    for in the Agreement between the Government of the Republic of Senegal and the
    European Economic Community on fishing off the coast of Senegal for the period
    from 1 May 1990 to 30 April 1992'
  type: main
- language: fr
  script: Latn
  content: '90/407/CEE: Décision du Conseil du 27 juillet 1990 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les droits de pêche et la contrepartie financière prévus
    dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République du Sénégal concernant la pêche au large de la côte sénégalaise,
    pour la période du 1er mai 1990 au 30 avril 1992'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DES RATES vom 27. Juli 1990 ueber den Abschluss des Abkommens
    in Form eines Briefwechsels ueber die vorlaeufige Anwendung des Protokolls zur
    Festlegung der Fischereirechte und des finanziellen Ausgleichs nach dem Abkommen
    zwischen der Europaeischen Wirtschaftsgemeinschaft und der Regierung der Republik
    Senegal ueber die Fischerei vor der senegalesischen Kueste fuer die Zeit vom 1.
    Mai 1990 bis zum 30. April 1992 (90/407/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS AFGOERELSE af 27. juli 1990 om indgaaelse af aftalen i form af
    brevveksling om midlertidig anvendelse af protokollen om fastsaettelse af de fiskerirettigheder
    og den finansielle godtgoerelse, der er omhandlet i aftalen mellem Det Europaeiske
    OEkonomiske Faellesskab og regeringen for Republikken Senegal om fiskeri ud for
    Senegal, for perioden 1. maj 1990 til 30. april 1992 (90/407/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/407/ΕΟΚ: Απόφαση του Συμβουλίου της 27ης
    Ιουλίου 1990 για τη σύναψη συμφωνίας υπό μορφή
    ανταλλαγής επιστολών, σχετικά με την προσωρινή
    εφαρμογή του πρωτοκόλλου για τον καθορισμό
    των τελών αλιείας και της χρηματικής αντιπαροχής
    που προβλέπονται στη συμφωνία μεταξύ της Ευρωπαϊκής
    Οικονομικής Κοινότητας και της κυβέρνησης
    της Δημοκρατίας της Σενεγάλης, για την περίοδο
    από 1ης Μαΐου 1990 έως 30 Απριλίου 1992'
  type: main
- language: it
  script: Latn
  content: DECISIONE DEL CONSIGLIO del 27 luglio 1990 concernente la conclusione dell'accordo
    in forma di scambio di lettere relativo all'applicazione provvisoria del protocollo
    che fissa i diritti di pesca e la compensazione finanziaria previste nell'accordo
    tra la Comunità economica europea ed il governo della Repubblica del Senegal
    sulla pesca al largo della costa senegalese, per il periodo dal 1o maggio 1990
    al 30 aprile 1992 (90/407/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE RAAD van 27 juli 1990 betreffende de sluiting van de Overeenkomst
    in de vorm van een briefwisseling inzake de voorlopige toepassing van het Protocol
    tot vaststelling van de visserijrechten en de financiële tegenprestatie bedoeld
    in de Overeenkomst tussen de Regering van de Republiek Senegal en de Europese
    Economische Gemeenschap inzake de visserij voor de Senegalese kust, voor de periode
    van 1 mei 1990 tot en met 30 april 1992 (90/407/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DO CONSELHO de 27 de Julho de 1990 relativa à celebraçao do Acordo
