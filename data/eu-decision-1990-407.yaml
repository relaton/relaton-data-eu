    a Comunidade Economica Europeia e o Governo da Republica do Senegal respeitante
    à pesca ao largo da costa senegalesa, para o periodo compreendido entre 1 de
    Maio de 1990 e 30 de Abril de 1992 (90/407/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DEL CONSEJO de 27 de julio de 1990 relativa a la celebracion del
    Acuerdo en forma del Canje de Notas sobre la aplicacion provisional del Protocolo
    por el que se fijan los derechos de pesca y la compensacion financiera previstos
    en el Acuerdo entre la Comunidad Economica Europea y el Gobierno de la Republica
    del Senegal relativo a la pesca frente a la costa senegalesa, para el periodo
    comprendido entre el 1 de mayo de 1990 y el 30 de abril de 1992 (90/407/CEE)
