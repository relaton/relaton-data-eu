title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3502/87 of 20 November 1987 amending the
    Annex to Regulation (EEC) No 2333/87 fixing, until the end of the 1987/88 marketing
    year, the accession compensatory amounts applicable to cereals and rice and the
    coefficients to be used for the calculation of the amounts applicable to certain
    processed products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3502/87 de la Commission du 20 novembre 1987 modifiant
    l' annexe du règlement (CEE) n° 2333/87, fixant les montants compensatoires
    "adhésion" applicables dans le secteur des céréales et du riz jusqu' à la
    fin de la campagne 1987/1988 ainsi que les coefficients à retenir pour le calcul
    des montants applicables à certains produits tranformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3502/87 der Kommission vom 20. November 1987 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 2333/87 zur Festsetzung der im Wirtschaftsjahr
    1987/88 geltenden Beitrittsausgleichsbeträge für Reis sowie der Koeffizienten
    für die Berechnung der auf bestimmte Verarbeitungserzeugnisse anzuwendenden Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3502/87 af 20. november 1987 om ændring
    af bilaget til forordning (EØF) nr. 2333/87 om fastsættelse af tiltrædelsesudligningsbeløbene
    for korn og ris indtil udgangen af høståret 1987/88 og af de koefficienter,
    der skal lægges til grund ved beregning af beløbene for visse forarbejdede produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3502/87 της Επιτροπής
    της 20ής Νοεμβρίου 1987 που τροποποιεί το παράρτημα
    του κανονισμού (ΕΟΚ) αριθ. 2333/87 για τον καθορισμό
    των εξισωτικών ποσών προσχώρησης που εφαρμόζονται
    στον τομέα του ρυζιού για την περίοδο 1987/88 καθώς
    και των συντελεστών που λαμβάνονται υπόψη
    για τον υπολογισμό των ποσών που εφαρμόζονται
    σε ορισμένα μεταποιημένα προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3502/87 della Commissione del 20 novembre 1987 che
    modifica l' allegato del regolamento (CEE) n. 2333/87 che fissa gli importi compensativi
    adesione applicabili nei settori dei cereali e del riso sino alla fine della campagna
    1987/1988 nonché i coefficienti da prendere in considerazione per il calcolo
    degli importi applicabili a taluni prodotti trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3502/87 van de Commissie van 20 november 1987 tot
    wijziging van de bijlage van Verordening (EEG) nr. 2333/87 tot vaststelling voor
    het verkoopseizoen 1987/1988 van de compenserende bedragen toetreding voor de
    sector rijst, alsmede van de coëfficiënten voor de berekening van de bedragen
    die gelden voor sommige verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3502/87 da Comissão de 20 de Novembro de 1987 que
    altera o anexo do Regulamento (CEE) n.° 2333/87 que fixa os montantes compensatórios
    de adesão aplicáveis nos sectores dos cereais e do arroz até ao final da campanha
    de 1987/1988, bem como os coeficientes a utilizar para o cálculo dos montantes
    aplicáveis a determinados produtos transformados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3502/87 de la Comisión de 20 de noviembre de 1987
    por el que se modifica el Anexo del Reglamento (CEE) n° 2333/87 por el que se
    fijan los montantes compensatorios de adhesión 1987/88, así como los coeficientes
    que deberán utilizarse para el cálculo de los montantes aplicables a determinados
    productos transformados
  type: main
