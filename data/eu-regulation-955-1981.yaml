title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 955/81 of 7 April 1981 re-establishing the
    levying of customs duties on woven fabrics of man-made textile fibres and rubberized
    textile woven fabrics, products of category 92 (code 0920), originating in Singapore,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 955/81 de la Commission, du 7 avril 1981, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles synthétiques ou artificielles et tissus caoutchoutés de la catégorie
    92 (code 0920), originaires de Singapour, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 955/81 der Kommission vom 7. April 1981 über die
    Wiedereinführung des Zollsatzes für Gewebe aus synthetischen oder künstlichen
    Spinnfäden und kautschutierte Gewebe der Warenkategorie Nr. 92 (Kennziffer 0920),
    mit Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3320/80 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 955/81 af 7. april 1981 om genindførelse
    af opkrævning af toldafgifter for vævet stof af endeløse kemofibre og tekstilstoffer,
    under kategori 92, (kode 0920), som har oprindelse i Singapore og omfattes af
    de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 955/81 τής Επιτροπής
    τής 7ης Απριλίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά υφάσματα
    εκ συνθετικών ή τεχνητών υφαντικών ινών καί
    υφάσματα συνδεδυασμένα μετά καουτσούκ, τών
    προϊόντων τής κατηγορίας αριθ. 92 (κώδικας 0920),
    καταγωγής Σιγκαπούρης, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 955/81 della Commissione, del 7 aprile 1981, che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili sintetiche
    o artificiali e tessuti gommati della categoria di prodotti n. 92 (codice n. 0920),
    originari di Singapore, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 955/81 van de Commissie van 7 april 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische of van kunstmatige continuvezels en gegummeerde weefsels, van
    de categorie van produkten nr. 92 (codenummer 0920), van oorsprong uit Singapore
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3320/80 van de Raad
  type: main
