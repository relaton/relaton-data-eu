  script: Latn
  content: Commission Implementing Regulation (EU) 2018/184 of 7 February 2018 amending
    Implementing Regulation (EU) No 540/2011 as regards the extension of the approval
    periods of the active substances FEN 560 (also called fenugreek or fenugreek seed
    powder) and sulfuryl fluoride
  type: main
- language: fr
  script: Latn
