    modifiant le règlement d'exécution (UE) n° 540/2011 en ce qui concerne la prolongation
    des périodes d'approbation des substances actives FEN 560 (également dénommé
    fenugrec ou graines de fenugrec en poudre) et fluorure de sulfuryle
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2018/184 der Kommission vom 7. Februar 2018
    zur Änderung der Durchführungsverordnung (EU) Nr. 540/2011 hinsichtlich der
    Verlängerung des Genehmigungszeitraums für die Wirkstoffe FEN 560 (auch bezeichnet
    als Bockshornklee oder Bockshornkleesamen-Pulver) und Sulfurylfluorid
  type: main
