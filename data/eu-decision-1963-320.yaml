title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 mai 1963, autorisant la République fédérale
    d'Allemagne à différer le rapprochement des droits prévus dans son tarif douanier
    vers ceux du Tarif douanier commun en ce qui concerne les pommes de terre, autres,
    non dénommées, et les légumes à cosse secs
  type: main
- language: de
  script: Latn
  content: '63/320/EWG: Entscheidung der Kommission vom 13. Mai 1963, mit der die
    Bundesrepublik Deutschland ermächtigt wird, die Angleichung der in ihrem Zolltarif
    vorgesehenen Zollsätze an die Zollsätze des Gemeinsamen Zolltarifs für andere
    Kartoffeln der Tarifnummer 07.01 A III b und trockene Hülsenfrüchte (Tarifnummer
    07.05) aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '63/320/CEE: Decisione della Commissione del 13 maggio 1963 che autorizza
    la Repubblica federale di Germania a differire il ravvicinamento dei dazi previsti
    nella sua tariffa doganale comune per quanto riguarda le patate, altre, non nominate,
    ed i legumi da granella secchi, sgranati anche decorticati o spezzati'
  type: main
- language: nl
  script: Latn
  content: '63/320/EEG: Beschikking van de Commissie van 13 mei 1963 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd de aanpassing van de rechten van haar douanetarief
    aan die van het gemeenschappelijk douanetarief voor aardappelen, andere, overige,
    en voor gedroogde peulgroenten uit te stellen'
  type: main
