  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2521/98 della Commissione del 24 novembre 1998 che
    modifica il regolamento (CE) n. 577/97 recante talune modalità di applicazione
    del regolamento (CE) n. 2991/94 del Consiglio che stabilisce norme per i grassi
    da spalmare e del regolamento (CEE) n. 1898/97 del Consiglio relativo alla protezione
    della denominazione del latte e dei prodotti lattiero-caseari all'atto della loro
    commercializzazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2521/98 (1998. gada 24. novembris), ar kuru groza
    Regulu (EK) Nr. 577/97, ar ko paredz dažus sīki izstrādātus noteikumus, lai
    piemērotu Padomes Regulu (EK) Nr. 2991/94, ar ko nosaka standartus ziežamajiem
    taukiem, un Padomes Regulu (EEK) Nr. 1898/87 par piena un piena produktu tirdzniecībā
    izmantoto apzīmējumu aizsardzību
  type: main
- language: lt
