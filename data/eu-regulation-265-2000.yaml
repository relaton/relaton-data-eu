title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 265/2000 of 3 February 2000 determining the
    extent to which the applications for import licences submitted in January 2000
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 1374/98 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 265/2000 de la Commission, du 3 février 2000, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 2000 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 1374/98 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 265/2000 DER KOMMISSION vom 3. Februar 2000 zur Festlegung
    des Umfangs, in dem den im Januar 2000 gestellten Anträgen auf Erteilung von
    Lizenzen für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung
    (EG) Nr. 1374/98 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 265/2000 af 3. februar 2000 om, i hvilket
