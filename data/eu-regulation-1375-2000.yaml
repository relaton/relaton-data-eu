title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1375/2000 of 28 June 2000 amending Regulation
    (EEC) No 2282/90 laying down detailed rules for increasing the consumption and
    utilisation of apples and the consumption of citrus fruit
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1375/2000 de la Commission du 28 juin 2000 modifiant
    le règlement (CEE) nº 2282/90 portant modalités d'application des mesures destinées
    à accroître la consommation et l'utilisation de pommes ainsi que la consommation
    d'agrumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1375/2000 der Kommission vom 28. Juni 2000 zur Änderung
    der Verordnung (EWG) Nr. 2282/90 mit Bestimmungen zur Durchführung von Maßnahmen
    zur Steigerung des Verbrauchs und der Verwendung von Äpfeln sowie des Verbrauchs
    von Zitrusfrüchten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1375/2000 af 28. juni 2000 om ændring
    af forordning (EØF) nr. 2282/90 om gennemførelsesbestemmelser for foranstaltninger
    med henblik på at øge forbruget og anvendelsen af æbler samt forbruget af citrusfrugter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1375/2000 της Επιτροπής,
    της 28ης Ιουνίου 2000, για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2282/90 για τις λεπτομέρειες εφαρμογής
    των μέτρων που αποσκοπούν στην αύξηση της κατανάλωσης
    και της χρησιμοποίησης μήλων καθώς και της
    κατανάλωσης εσπεριδοειδών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1375/2000, annettu 28 päivänä kesäkuuta 2000,
    yksityiskohtaisista säännöistä omenoiden kulutuksen ja käytön sekä sitrushedelmien
    kulutuksen lisäämiseksi tarkoitettujen toimenpiteiden soveltamisesta annetun
    asetuksen (ETY) N:o 2282/90 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1375/2000 della Commissione, del 28 giugno 2000, che
    modifica il regolamento (CEE) n. 2282/90 recante modalità di applicazione delle
    misure intese ad aumentare il consumo e l'uso delle mele nonché il consumo degli
    agrumi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1375/2000 van de Commissie van 28 juni 2000 tot wijziging
    van Verordening (EEG) nr. 2282/90 houdende bepalingen ter uitvoering van de maatregelen
    om de consumptie en het gebruik van appelen en de citrusconsumptie te doen toenemen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1375/2000 da Comissão, de 28 de Junho de 2000, que
    altera o Regulamento (CEE) n.o 2282/90 que estabelece as regras de execução
    das medidas destinadas a aumentar o consumo e a utilização de maçãs, bem como
    o consumo de citrinos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1375/2000 de la Comisión, de 28 de junio de 2000,
    que modifica el Reglamento (CEE) nº 2282/90 por el que se establecen las disposiciones
    de aplicación de las medidas destinadas a aumentar el consumo y la utilización
    de manzanas, así como el consumo de cítricos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1375/2000 av den 28 juni 2000 om ändring
    av förordning (EEG) nr 2282/90 om närmare bestämmelser avsedda att öka konsumtionen
    och användningen av äpplen samt konsumtionen av citrusfrukt
