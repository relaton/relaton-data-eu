    Uredbom (EU) 2017/745 Europskog parlamenta i Vijeća, postojanih organskih onečišćujućih
    tvari, određenih tekućih tvari ili smjesa, nonilfenola i ispitnih metoda za
    azo bojila
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/2096 rendelete (2020. december 15.) a vegyi anyagok
    regisztrálásáról, értékeléséről, engedélyezéséről és korlátozásáról
    (REACH) szóló 1907/2006/EK európai parlamenti és tanácsi rendelet XVII. mellékletének
    a rákkeltő, mutagén vagy reprodukciót károsító (CMR) anyagok, az (EU) 2017/745
    európai parlamenti és tanácsi rendelet hatálya alá tartozó eszközök, a
    környezetben tartósan megmaradó szerves szennyező anyagok, egyes folyékony
    anyagok vagy keverékek, a nonilfenol, valamint az azoszínezékek vizsgálati
    módszerei tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2020/2096 della Commissione del 15 dicembre 2020 recante
    modifica dell’allegato XVII del regolamento (CE) n. 1907/2006 del Parlamento
    europeo e del Consiglio concernente la registrazione, la valutazione, l’autorizzazione
    e la restrizione delle sostanze chimiche (REACH), per quanto riguarda le sostanze
    cancerogene, mutagene o tossiche per la riproduzione (CMR), i dispositivi disciplinati
    dal regolamento (UE) 2017/745 del Parlamento europeo e del Consiglio, gli inquinanti
    organici persistenti, determinate sostanze o miscele liquide, il nonilfenolo e
    i metodi di prova per i coloranti azoici
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2020/2096 (2020. gada 15. decembris), ar ko attiecībā
