    evalvaciji, avtorizaciji in omejevanju kemikalij (REACH) glede rakotvornih, mutagenih
    ali strupenih snovi za razmnoževanje (CMR), pripomočkov iz Uredbe (EU) 2017/745
    Evropskega parlamenta in Sveta, obstojnih organskih onesnaževal, nekaterih tekočih
