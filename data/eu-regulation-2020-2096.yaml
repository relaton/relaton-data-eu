    (CMR), ierīcēm, kuras aptver Eiropas Parlamenta un Padomes Regula (ES) 2017/745,
    noturīgiem organiskajiem piesārņotājiem, noteiktām šķidrām vielām vai
    maisījumiem, nonilfenolu un azokrāsvielu testēšanas metodēm groza Eiropas
    Parlamenta un Padomes Regulas (EK) Nr. 1907/2006, kas attiecas uz ķimikāliju
    reģistrēšanu, vērtēšanu, licencēšanu un ierobežošanu (REACH), XVII pielikumu
  type: main
- language: lt
  script: Latn
