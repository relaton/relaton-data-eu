  content: Kommissionens förordning (EU) 2020/2096 av den 15 december 2020 om ändring
    av bilaga XVII till Europaparlamentets och rådets förordning (EG) nr 1907/2006
    om registrering, utvärdering, godkännande och begränsning av kemikalier (Reach)
    vad gäller cancerframkallande, mutagena eller reproduktionstoxiska ämnen (CMR-ämnen),
