    u tal-Kunsill dwar ir-reġistrazzjoni, il-valutazzjoni, l-awtorizzazzjoni u r-restrizzjoni
    ta’ sustanzi kimiċi (REACH), fir-rigward ta’ sustanzi karċinoġeniċi, mutaġeniċi
    jew tossiċi għar-riproduzzjoni (CMR), tagħmir kopert mir-Regolament (UE) 2017/745
