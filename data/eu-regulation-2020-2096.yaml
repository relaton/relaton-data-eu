    Europeo y del Consejo, relativo al registro, la evaluación, la autorización
    y la restricción de las sustancias y mezclas químicas (REACH), en lo que se
    refiere a las sustancias carcinógenas, mutágenas o tóxicas para la reproducción
    (sustancias CMR), los productos contemplados por el Reglamento (UE) 2017/745 del
    Parlamento Europeo y del Consejo, los contaminantes orgánicos persistentes, determinadas
