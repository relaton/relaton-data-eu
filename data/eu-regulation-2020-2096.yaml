title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2020/2096 of 15 December 2020 amending Annex
    XVII to Regulation (EC) No 1907/2006 of the European Parliament and of the Council
    concerning the Registration, Evaluation, Authorisation and Restriction of Chemicals
    (REACH), as regards carcinogenic, mutagenic or reproductive toxicant (CMR) substances,
    devices covered by Regulation (EU) 2017/745 of the European Parliament and of
    the Council, persistent organic pollutants, certain liquid substances or mixtures,
    nonylphenol and testing methods for azocolourants
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2020/2096 de la Commission du 15 décembre 2020 modifiant
    l’annexe XVII du règlement (CE) no 1907/2006 du Parlement européen et du Conseil
    concernant l’enregistrement, l’évaluation et l’autorisation des substances
    chimiques, ainsi que les restrictions applicables à ces substances (REACH), en
    ce qui concerne les substances cancérogènes, mutagènes ou toxiques pour la
    reproduction (CMR), les dispositifs relevant du règlement (UE) 2017/745 du Parlement
    européen et du Conseil, les polluants organiques persistants, certaines substances
    ou certains mélanges liquides, le nonylphénol et les méthodes d’essai pour
    les colorants azoïques
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2020/2096 der Kommission vom 15. Dezember 2020 zur Änderung
    von Anhang XVII der Verordnung (EG) Nr. 1907/2006 des Europäischen Parlaments
    und des Rates zur Registrierung, Bewertung, Zulassung und Beschränkung chemischer
    Stoffe (REACH) in Bezug auf krebserzeugende, erbgutverändernde oder fortpflanzungsgefährdende
    Stoffe, unter die Verordnung (EU) 2017/745 des Europäischen Parlaments und des
    Rates fallende Produkte, persistente organische Schadstoffe, bestimmte flüssige
    Stoffe oder Gemische, Nonylphenol und Prüfverfahren für Azofarbstoffe
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2020/2096 на Комисията от 15 декември
    2020 година за изменение на приложение XVII към
    Регламент (ЕО) № 1907/2006 на Европейския парламент
    и на Съвета относно регистрацията, оценката,
    разрешаването и ограничаването на химикали
    (REACH) по отношение на канцерогенните, мутагенните
    или токсичните за репродукцията (CMR) вещества,
    изделията в обхвата на Регламент (ЕС) 2017/745 на
