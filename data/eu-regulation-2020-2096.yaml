    relativo ao registo, avaliação, autorização e restrição dos produtos químicos
    (REACH), no que respeita às substâncias cancerígenas, mutagénicas ou tóxicas
    para a reprodução (CMR), aos dispositivos abrangidos pelo Regulamento (UE) 2017/745
