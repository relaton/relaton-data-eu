  content: Règlement (CEE) n° 2152/70 du Conseil, du 27 octobre 1970, relatif au
    montant forfaitaire pour l'huile d'olive n'ayant pas subi un processus de raffinage,
    entièrement obtenue en Grèce et transportée directement de ce pays dans la
    Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2152/70 des Rates vom 27. Oktober 1970 über den Pauschbetrag
    für nicht raffiniertes Olivenöl, das vollständig in Griechenland erzeugt wurde
    und aus diesem Land unmittelbar in die Gemeinschaft befördert wird
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2152/70 del Consiglio, del 27 ottobre 1970, relativo
    all'ammontare forfetario per l'olio d'oliva che non abbia subito un processo di
    raffinazione, totalmente ottenuto in Grecia e trasportato direttamente da tale
    paese nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2152/70 van de Raad van 27 oktober 1970 betreffende
    het forfaitaire bedrag voor olijfolie die niet aan een raffinageproces onderworpen
    is geweest en die geheel en al in Griekenland is voortgebracht en rechtstreeks
    van dit land naar de Gemeenschap wordt vervoerd
  type: main
