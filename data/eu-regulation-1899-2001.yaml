    auf die Einfuhren von Hartplatten mit Ursprung in Bulgarien, Estland, Lettland,
    Litauen, Polen und Russland und zur endgültigen Vereinnahmung der vorläufigen
    Zölle
  type: main
- language: da
  script: Latn
