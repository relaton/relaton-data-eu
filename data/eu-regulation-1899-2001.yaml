  content: Council Regulation (EC) No 1899/2001 of 27 September 2001 amending Regulation
    (EC) No 194/1999 imposing definitive anti-dumping duties on imports of hardboard
    originating in Bulgaria, Estonia, Latvia, Lithuania, Poland and Russia and definitively
    collecting the provisional duties imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1899/2001 du Conseil du 27 septembre 2001 modifiant
    le règlement (CE) n° 194/1999 instituant un droit antidumping définitif sur
    les importations de panneaux durs originaires de Bulgarie, d'Estonie, de Lettonie,
    de Lituanie, de Pologne et de Russie et portant perception définitive du droit
    provisoirement institué
  type: main
- language: de
  script: Latn
