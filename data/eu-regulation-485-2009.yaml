    kull proċedura tal-Komunità għal iffissar ta’ limiti massimi ta’ residwi
    ta’ prodotti mediċinali veterinarji fi prodotti tal-ikel ta’ oriġini mill-annimali,
    għal dak li huwa aċidu tiludroniku u l-fumarat tal-ħadid
  type: main
