    processo comunitário para o estabelecimento de limites máximos de resíduos
    de medicamentos veterinários nos alimentos de origem animal, no que se refere
    ao ácido tiludrónico e ao fumarato de ferro
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 485/2009 al Comisiei din 9 iunie 2009 de modificare
    a anexei II la Regulamentul (CEE) nr. 2377/90 al Consiliului de stabilire a unei
    proceduri comunitare pentru stabilirea limitelor maxime de reziduuri de produse
    medicinale veterinare în alimentele de origine animală, în ceea ce privește
    acidul tiludronic și fumaratul de fier
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 485/2009 z 9. júna 2009 , ktorým sa mení
