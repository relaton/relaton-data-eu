title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 485/2009 of 9 June 2009 amending Annex II
    to Council Regulation (EEC) No 2377/90 laying down a Community procedure for the
    establishment of maximum residue limits of veterinary medicinal products in foodstuffs
    of animal origin, as regards tiludronic acid and iron fumarate
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CE) n o 485/2009 de la Commission du 9 juin 2009 modifiant
    l’annexe II du règlement (CEE) n o 2377/90 du Conseil établissant une procédure
    communautaire pour la fixation des limites maximales de résidus de médicaments
    vétérinaires dans les aliments d’origine animale en ce qui concerne les substances
    suivantes: l’acide tiludronique et le fumarate ferrique'
  type: main
- language: de
  script: Latn
