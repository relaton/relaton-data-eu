    Nr. 2377/90, ar ko nosaka Kopienas procedūru veterināro zāļu maksimāli pieļaujamo
    atlieku daudzumu noteikšanai dzīvnieku izcelsmes produktos
  type: main
- language: lt
  script: Latn
  content: 2009 m. birželio 9 d. Komisijos reglamentas (EB) Nr. 485/2009, iš dalies
