    una procedura comunitaria per la determinazione dei limiti massimi di residui
    di medicinali veterinari negli alimenti di origine animale per quanto riguarda
    l’acido tiludronico e il fumarato di ferro
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 485/2009 ( 2009. gada 9. jūnijs ), ar ko attiecībā
