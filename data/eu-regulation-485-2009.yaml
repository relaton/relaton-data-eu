  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 485/2009 z dnia 9 czerwca 2009 r. zmieniające
    załącznik II do rozporządzenia Rady (EWG) nr 2377/90 ustanawiającego wspólnotową
    procedurę dla określania maksymalnego limitu pozostałości weterynaryjnych
    produktów leczniczych w środkach spożywczych pochodzenia zwierzęcego w odniesieniu
    do kwasu tiludronowego i fumaranu żelaza
  type: main
- language: pt
  script: Latn
