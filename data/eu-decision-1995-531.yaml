title:
- language: en
  script: Latn
  content: '95/531/EC: Commission Decision of 29 November 1995 amending, because of
    the accession of Austria, Finland and Sweden, Commission Decision No 77/144/EEC
    laying down the standard code and rules governing the transcription into a machine-readable
    form of the data of the surveys of plantations of certain species of fruit trees,
    and laying down the boundaries of the production areas for these surveys'
  type: main
- language: fr
  script: Latn
  content: '95/531/CE: Décision de la Commission, du 29 novembre 1995, modifiant
    en raison de l''adhésion de l''Autriche, de la Finlande et de la Suède la décision
    77/144/CEE de la Commission établissant le code et les règles types relatifs
    à la transcription sous une forme lisible par machine des données des enquêtes
    sur les plantations de certaines espèces d''arbres fruitiers et fixant les limites
    des zones de production pour ces enquêtes'
  type: main
- language: de
  script: Latn
  content: '95/531/EG: Entscheidung der Kommission vom 29. November 1995 anläßlich
    des Beitritts Österreichs, Finnlands und Schwedens zwecks Änderung der Entscheidung
    77/144/EWG zur Festlegung eines Standardcodes und einer Regelung für die Übertragung
    der Erhebungsdaten über Anlagen gewisser Obstarten in maschinenlesbare Form und
    zur Festsetzung der Abgrenzungen der Produktionszonen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 29 ноември 1995 година
    за изменение, поради присъединяването на Австрия,
    Финландия и Швеция, на Решение 77/144/ЕИО на Комисията
    относно определяне на стандартни кодове и
    правила относно изписване в машинно четивна
    форма на данните от изследванията на насажденията
    от определени видове плодни дървета и за определяне
    границите на производствените зони за тези
    изследвания
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. listopadu 1995, kterým se z důvodu přistoupení
    Rakouska, Finska a Švédska mění rozhodnutí 77/144/EHS ze dne 22. prosince
    1976, kterým se stanoví standardní kódy a pravidla pro přepis údajů ze
    zjišťování sadů určitých druhů ovocných stromů do strojově čitelné
    formy a kterým se stanoví hranice pěstitelských oblastí pro tato zjišťování
  type: main
- language: da
  script: Latn
  content: '95/531/EF: Kommissionens beslutning af 29. november 1995 om ændring af
    beslutning 77/144/EØF om fastsættelse af den standardkode og de regler, der
    gælder for omskrivning til maskinlæsbar form af resultaterne af undersøgelseme
    af plantager med visse arter af frugttræer, og om fastsættelse af grænserne
    for produktionszonerne med henblik på disse undersøgelser, på grund af Østrigs,
    Finlands og Sveriges tiltrædelse'
  type: main
- language: el
  script: Grek
  content: '95/531/ΕΚ: Απόφαση της Επιτροπής, της 29ης Νοεμβρίου
