    za takva istraživanja'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1995. november 29.) az egyes gyümölcsfafaj-ültetvények
    összeírása adatainak gépileg olvasható formába történő átírására
    vonatkozó egységes kód és szabályok megállapításáról, valamint e felmérések
    tárgyát képező termőterületek határainak megállapításáról szóló
    77/144/EGK bizottsági határozat Ausztria, Finnország és Svédország csatlakozása
    miatt történő módosításáról
  type: main
- language: it
  script: Latn
  content: '95/531/CE: Decisione della Commissione, del 29 novembre 1995, che modifica,
    a motivo dell''adesione dell''Austria, della Finlandia e della Svezia, la decisione
    della Commissione 77/144/CEE che stabilisce il codice delle norme tipo per la
    trascrizione in una forma che si presti a lettura meccanografica dei risultati
    delle indagini sulle piantagioni di alcune specie di alberi da frutto nonché
    le delimitazioni delle zone di produzione per queste indagini'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1995. gada 29. novembris), kurš sakarā ar Austrijas,
    Somijas un Zviedrijas pievienošanos groza Komisijas Lēmumu 77/144/EEK, ar ko
    nosaka tipveida kodu un noteikumus, kas regulē dažu augļu koku sugu stādījumu
    apsekojumu datu transkripciju mašīnlasāmā formā, un nosaka ražošanas apgabalu
    robežas attiecībā uz šiem apsekojumiem
  type: main
- language: lt
  script: Latn
  content: 1995 m. lapkričio 29 d. Komisijos sprendimas dėl Austrijos, Suomijos
    ir Švedijos stojimo iš dalies pakeičiantis Komisijos sprendimą 77/144/EEB,
    nustatantį tipinį kodeksą bei taisykles, reguliuojančias kai kurių vaismedžių
    rūšių sodinių tyrimų duomenų perrašymą į automatizuotai nuskaitomą formą,
    bei nustatantį šių tyrimų gamybos plotų ribas
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-22 ta’ Novembru 1995 li temenda, minħabba
    l-adeżjoni ta’ l-Awstrija, l-Finlandja u l-Isvezja, id-Deċiżjoni tal-Kummissjoni
    Nru 77/144/KEE li tniżżel il-kodiċi standard u r-regoli li jirregolaw it-traskrizzjoni
    f’forma li tinqara bil-magni, tad-data ta’ l-istħarriġ ta’ żoni ta’
    tħawwil ta’ ċerti speċi ta’ siġar tal-frott, u tniżżel il-limiti taż-żoni
    produttivi għal dan l-istħarriġ
  type: main
- language: nl
  script: Latn
  content: '95/531/EG: Beschikking van de Commissie van 29 november 1995 tot wijziging,
    in verband met de toetreding van Oostenrijk, Finland en Zweden, van Beschikking
    77/144/EEG houdende de standaardcode en de voorschriften voor het omzetten in
    voor de machine leesbare vorm van de gegevens uit de statistische enquêtes teneinde
    het produktiepotentieel van bepaalde soorten fruitbomen vast te stellen, en om
    de grenzen van de produktiegebieden voor deze enquêtes vast te stellen'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 29 listopada 1995 r. zmieniająca, z powodu przystąpienia
    Austrii, Finlandii i Szwecji, decyzję Komisji 77/144/EWG ustanawiającą standardowy
    kod i zasady dotyczące przekształcania danych z badań statystycznych plantacji
    niektórych gatunków drzew owocowych na formę czytelną dla urządzeń i ustanawiającą
    granice obszarów upraw dla tych badań
  type: main
- language: pt
  script: Latn
  content: '95/531/CE: Decisão da Comissão, de 29 de Novembro de 1995, que altera,
    devido à adesão da Áustria, da Finlândia e da Suécia, a Decisão 77/144/CEE
    da Comissão, que estabelece o código e as regras-tipo relativas à transcrição,
    sob forma legível por máquina, dos dados dos inquéritos sobre as plantações
    de certas espécies de árvores de fruto e que fixa os limites das zonas de produção
    para estes inquéritos'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 29 noiembrie 1995 de modificare, ca urmare a aderării
    Austriei, Finlandei și Suediei, a Deciziei 77/144/CEE de stabilire a codului
    standard și a regulilor care reglementează transcrierea într-o formă care
    poate fi interpretată electronic a datelor anchetelor privind plantațiile de
    anumite specii de pomi fructiferi și de stabilire a limitelor zonelor de producție
    pentru aceste anchete
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 29. novembra 1995, ktoré mení a dopĺňa vzhľadom
    k pristúpeniu Rakúska, Fínska a Švédska rozhodnutie Komisie č. 77/144/EHS
    stanovujúce štandardný kód a pravidlá, ktorými sa bude riadiť prepis údajov
    o porastoch určitých druhov ovocných stromov do strojovo snímateľnej formy,
    a stanovujúce aj hranice produkčných oblastí pre tieto prehľady
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 29. novembra 1995 o spremembi Odločbe 77/144/EGS
    o standardni kodi in pravilih za transkripcijo podatkov iz raziskovanj o intenzivnih
    sadovnjakih nekaterih vrst sadnih dreves v strojno čitljivo obliko in o mejah
    proizvodnih območij za ta raziskovanja zaradi pristopa Avstrije, Finske in Švedske
  type: main
- language: es
  script: Latn
  content: '95/531/CE: Decisión de la Comisión, de 29 de noviembre de 1995, por
    la que se modifica, con motivo de la adhesión de Austria, de Finlandia y de Suecia,
    la Decisión 77/144/CEE de la Comisión, por la que se establecen el código y
    las normas tipo relativas a la transcripción en forma legible por máquina de
    los datos de las encuestas sobre las plantaciones de determinadas especies frutales
    y por la que se determinan los límites de las zonas de produción de dichas encuestas'
  type: main
- language: sv
  script: Latn
  content: '95/531/EG: Kommissionens beslut av den 29 november 1995 om ändring, med
    anledning av Österrikes, Finlands och Sveriges anslutning, av beslut 77/144/EEG
    om fastställandet av en kod och standardregler för överföring till maskinläsbar
    form av undersökningsresultat om odlingar med vissa slag av fruktträd, samt
    om fastställandet av gränserna för produktionsområdena i dessa undersökningar'
