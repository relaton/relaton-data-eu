title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3915/91 of 19 December 1991 on the procedures
    for applying Decision No 7/91 of the EEC-Andorra Joint Committee introducing a
    derogation from the definition of originating products to take into account the
    special situation of the Principality of Andorra regarding its output of certain
    processed agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 3915/91 du Conseil, du 19 décembre 1991, concernant
    les modalités d' application de la décision nº 7/91 du comité mixte CEE-Andorre
    portant dérogation à la définition de produits originaires pour tenir compte
    de la situation particulière de la principauté d' Andorre en ce qui concerne
    sa production de certains produits agricoles transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3915/91 des Rates vom 19. Dezember 1991 mit Durchführungsmodalitäten
    zu dem Beschluß Nr. 7/91 des Gemischten Ausschusses EWG-Andorra betreffend die
    Abweichung von der Begriffsbestimmung für Ursprungserzeugnisse zur Berücksichtigung
    der besonderen Lage des Fürstentums Andorra bezüglich der Herstellung bestimmter
    landwirtschaftlicher Verarbeitungserzeugnisse
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3915/91 af 19. december 1991 om gennemførelsesbestemmelserne
    til afgørelse nr. 7/91 vedtaget af Den Blandede Komité EØF-Andorra om fravigelse
    fra definitionen af begrebet »varer med oprindelsesstatus« for at tage hensyn
    til den særlige situation, som gør sig gældende for Fyrstendømmet Andorra
    for så vidt angår landets produktion af visse forarbejdede landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3915/91 του Συμβουλίου
    της 19ης Δεκεμβρίου 1991 σχετικά με τις λεπτομέρειες
    εφαρμογής της απόφασης αριθ. 7/91 της μεικτής
    επιτροπής ΕΟΚ- Ανδόρας για παρέκκλιση από τον
    ορισμό των προϊόντων καταγωγής για να ληφθεί
    υπόψη η ιδιαίτερη κατάσταση του Πριγκιπάτου
    της Ανδόρας όσον αφορά την παραγωγή ορισμένων
    μεταποιημένων γεωργικών προϊόντων
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3915/91, annettu 19 päivänä joulukuuta 1991,
    alkuperätuotteiden käsitteen määritelmää koskevasta poikkeuksesta Andorran
    ruhtinaskunnan erityisaseman huomioon ottamiseksi sen tiettyjen valmistettujen
    maataloustuotteiden tuotannon osalta tehdyn ETY-Andorra-sekakomitean päätöksen
    N:o 7/91 soveltamista koskevista yksityiskohtaisista säännöistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3915/91 del Consiglio, del 19 dicembre 1991, concernente
    le modalità d' applicazione della decisione n. 7/91 del comitato misto CEE-Andorra
    che deroga alla definizione di prodotti originari per tener conto della particolare
    situazione del Principato di Andorra in materia di produzione di taluni prodotti
    agricoli trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3915/91 van de Raad van 19 december 1991 betreffende
    de uitvoeringsbepalingen van Besluit nr. 7/91 van het Gemengd Comité EEG-Andorra
    houdende afwijking van de definitie van het begrip "produkten van oorsprong" ten
    einde rekening te houden met de bijzondere situatie van het Prinsdom Andorra wat
    de vervaardiging van bepaalde verwerkte landbouwprodukten betreft
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3915/91 do Conselho, de 19 de Dezembro de 1991, relativo
    às modalidades de aplicação da Decisão nº 7/91 do Comité Misto CEE-Andorra
    que estabelece uma derrogação da definição de produtos originários para ter
    em conta a situação particular do Principado de Andorra no que diz respeito
    à sua produção de certos produtos agrícolas transformados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 3915/91 del Consejo, de 19 de diciembre de 1991, relativo
    a las normas de desarrollo de la Decisión nº 7/91 del Comité mixto CEE-Andorra
    por el que se establece una excepción a la definición de productos originarios
    para tener en cuenta la situación específica del Principado de Andorra por lo
    que respecta a su producción de determinados productos agrarios transformados
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 3915/91 av den 19 december 1991 om tillämpningsförfarandena
    för beslut nr 7/91 fattat av Gemensamma kommittén för EEG-Andorra, om avvikelse
    från definitionen av begreppet "ursprungsvaror" för att ta hänsyn till Andorras
    speciella situation beträffande landets produktion av vissa bearbetade jordbruksprodukter
  type: main
