title:
- language: en
  script: Latn
  content: '79/273/EEC: Commission Decision of 19 February 1979 authorizing the French
    Republic not to apply Community treatment to men'' s and boys'' woven overcoats,
    raincoats and other coats, cloaks and capes, other than those of category 14 A,
    of wool, of cotton or of man-made textile fibres, falling within heading No ex
    61.01 of the Common Customs Tariff (NIMEXE codes 61.01-41, 42, 44, 46, 47) (category
    14 B), originating in Romania and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/273/CEE: Décision de la Commission, du 19 février 1979, autorisant
    la République française à exclure du traitement communautaire les pardessus,
    imperméables et autres manteaux, y compris les capes, tissés, pour hommes et
    garçonnets, autres que ceux de la catégorie 14 A, de laine, de coton ou de fibres
    textiles synthétiques ou artificielles de la position ex 61.01 du tarif douanier
    commun (codes Nimexe: 61.01-41, 42, 44, 46, 47) catégorie 14 B, originaires de
    Roumanie et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/273/EWG: Entscheidung der Kommission vom 19. Februar 1979, mit der
    die Französische Republik ermächtigt wird, aus Rumänien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Mäntel und Umhänge aus
    Geweben, für Männer und Knaben, andere als Waren der Kategorie 14 A, aus Wolle,
    Baumwolle oder synthetischen oder künstlichen Spinnstoffen, für Männer und
    Knaben, der Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.01-41; 42; 44; 46; 47) (Kategorie 14 B) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/273/EØF: Kommissionens beslutning af 19. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage frakker, kapper
    og slag, vævede, bortset fra varer under kategori 14 A, af uld, bomuld eller
    syntetiske eller regenererede fibre, som henhører under pos. ex 61.01 i den fælles
    toldtarif (NIMEXE-nummer 61.01-41, 42, 44, 46, 47; kategori 14 B), har oprindelse
    i Rumænien og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/273/CEE: Decisione della Commissione, del 19 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i cappotti, soprabiti,
    mantelli e simili, tessuti, per uomo e per ragazzo, diversi da quelli della categoria
    14 A, di lana, di cotone, o di fibre tessili sintetiche o artificiali, della voce
    ex 61.01 della tariffa doganale comune (codice Nimexe: 61.01-41, 42, 44, 46, 47),
    categoria 14 B, originari della Romania e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/273/EEG: Beschikking van de Commissie van 19 februari 1979 waarbij
    de Franse Republiek wordt gemachtigd overjassen, regenjassen en andere jassen,
    capes voor heren en jongens, andere dan die van categorie 14 A, van wol, van katoen,
    of van synthetische of van kunstmatige textielvezels, van post ex 61.01 van het
    gemeenschappelijk douanetarief (NIMEXE-code 61.01-41, 42, 44, 46, 47) (categorie
    14 B), van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten'
  type: main
