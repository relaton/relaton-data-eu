id: EURegulation15071980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1507/80 of 16 June 1980 re-establishing
    the levying of customs duties on carpets, carpeting, rugs, mats and matting, of
    sisal, of other fibres, etc., products of category 142 (code 1420), originating
    in developing countries, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1507/80 de la Commission, du 16 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux tapis de
    poils grossiers, de sisal, de chanvre, etc., de la catégorie 142 (code 1420),
    originaires des pays et territoires en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1507/80 der Kommission vom 16. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Teppiche aus großen Tierhaaren, aus Sisal, Hanf usw., der
    Warenkategorie Nr. 142 (Kennziffer 1420), mit Ursprung in Entwicklungländern,
    denen die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1507/80 af 16. juni 1980 om genindførelse
    af opkrævning af toldafgifter for gulvtæpper af grove dyrehår, sisal, hamp
    og andre agavefibre, etc., under kategori 142 (kode 1420), som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1507/80 della Commissione, del 16 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di peli grossolani,
    di sisal, di altre fibre della famiglia delle agavi ecc., della categoria di prodotti
    n. 142 (codice 1420), originari dei paesi in via di sviluppo beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1507/80 van de Commissie van 16 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tapijten
    van grof haar, van sisal, van andere vezels van de agavefamilie of van manillahennep
    enz., van de categorie van produkten nr. 142 (codenummer 1420), van oorsprong
    uit de ontwikkelingslanden en -gebieden ten behoeve waarvan bij Verordening (EEG)
    nr. 2894/79 van de Raad tariefpreferenties werden geopend
  type: main
