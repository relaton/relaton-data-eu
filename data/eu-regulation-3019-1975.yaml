id: EURegulation30191975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3019/75 of the Commission of 18 November 1975 re-establishing
    the levying of the customs duties on worked monumental or building stone, falling
    within heading No 68.02, originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December 1974
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3019/75 de la Commission, du 18 novembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    en pierres de taille ou de construction, de la position tarifaire 68.02, originaires
    de l'Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3019/75 der Kommission vom 18. November 1975 zur Wiedereinführung
    des Zollsatzes für bearbeitete Werksteine und Waren daraus (einschließlich Würfel
    und Steinchen für Mosaike), ausgenommen Waren der Tarifnummer 68.01 und des Kapitels
    69, der Tarifnummer 68.02, mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3019/75 af 18. november 1975 om genindførelse
    af opkrævning af toldafgifter for bearbejdede monument- og bygningssten samt
    varer af monument- og bygningssten under position 68.02, som har oprindelse i
    Indien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3019/75 della Commissione, del 18 novembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori di pietre da
    taglio o da costruzione, della voce doganale n. 68.02, originari dell'India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3019/75 van de Commissie van 18 november 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op werken van
    steen, bewerkte steen daaronder begrepen, met uitzondering van de goederen bedoeld
    bij post 68.01 en bij een der posten van hoofdstuk 69; blokjes voor mozaïeken,
    van post 68.02, van oorsprong uit India, ten behoeve waarvan bij Verordening (EEG)
    nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties werden
    geopend
  type: main
