title:
- language: en
  script: Latn
  content: '79/495/EEC: Commission Decision of 2 May 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s and boys''shirts, woven, of wool, cotton
    or man-made textile fibres, falling within heading No ex 61.03 of the Common Customs
    Tariff (NIMEXE codes 61.03-11, 15, 19) (category 8), originating in Romania and
    in free circulation in the other Member States (Only the French and Dutch texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/495/CEE: Décision de la Commission, du 2 mai 1979, autorisant le Royaume
    de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les chemises et chemisettes, tissées, pour hommes
    et garçonnets, de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    de la position ex 61.03 du tarif douanier commun (codes Nimexe: 61.03-11, 15,
    19) (catégorie 8), originaires de Roumanie et mises en libre pratique dans les
    autres États membres (Les textes en langues française et néerlandaise sont
    les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/495/EWG: Entscheidung der Kommission vom 2. Mai 1979, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, aus Geweben, für
    Männer und Knaben, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern
    61.03-11; 15; 19) (Kategorie 8), von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/495/EØF: Kommissionens beslutning af 2. maj 1979 om bemyndigelse af
    kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til
    fra fællesskabsbehandling at undtage vævede skjorter (herunder sports- og arbejdsskjorter)
    til mænd og drenge, af uld, bomuld eller syntetiske eller regenererede fibre,
    som henhører under pos. ex 61.03 i den fælles tildtarif (NIMEXE-nummer 61.03-11,
    15, 19 ; kategori 8), har oprindelse i Rumænien og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/495/CEE: Decisione della Commissione, del 2 maggio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le camicie e camicette, tessute, per
    uomo e per ragazzo, di lana, di cotone o di fibre tessili sintetiche o artificiali,
    della voce ex 61.03 della tariffa doganale comune (codici Nimexe: 61.03-11, 15,
    19) (categoria 8), originarie della Romania e messe in libera pratica negli altri
    Stati membri (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/495/EEG: Beschikking van de Commissie van 2 mei 1979 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd overhemden en sporthemden voor heren en jongens, geweven van wol, van
    katoen of van synthetische of kunstmatige textielvezels, van post ex 61.03 van
    het gemeenschappelijk douanetarief (NIMEXE-code 61.03-11, 15, 19) (categorie 8),
    van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de teksten in de Franse
    en de Nederlandse taal zijn authentiek)'
