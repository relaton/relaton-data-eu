id: EURegulation28001986
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2800/86 of 9 September 1986 imposing a provisional
    anti-dumping duty on imports of certain deep freezers originating in the USSR,
    accepting the undertakings in connection with the investigation of imports of
    certain deep freezers originating in Yugoslavia or in the German Democratic Republic
    and terminating the investigation, and terminating the proceeding concerning imports
    of certain deep freezers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2800/86 de la Commission du 9 septembre 1986 instituant
    un droit antidumping provisoire sur les importations de certains congélateurs
    originaires d' Union soviétique, portant acceptation des engagements souscrits
    dans le cadre de l' enquête concernant les importations de certains congélateurs
    originaires de Yougoslavie et de République démocratique allemande et portant
    clôture de l' enquête, et portant clôture de la procédure à l' égard des
    importations de certains congélateurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2800/86 der Kommission vom 9. September 1986 zur Einführung
    eines vorläufigen Antidumpingzolls auf die Einfuhren bestimmter Gefrier- und
    Tiefkühlgeräte mit Ursprung in der UdSSR, zur Annahme von Verpflichtungen im
    Rahmen des Verfahrens betreffend die Einfuhren bestimmter Gefrier- und Tiefkühlgeräte
    mit Ursprung in Jugoslawien und der Deutschen Demokratischen Republik und zur
    Einstellung des Verfahrens gegenüber den Einfuhren bestimmter Gefrier- und Tiefkühlgeräte
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2800/86 af 9. september 1986 om indførelse
    af en midlertidig antidumpingtold på importen af visse frysere med oprindelse
    i Sovjetunionen, om godtagelse af tilsagn afgivet i forbindelse med antidumpingundersøgelsen
    vedrørende importen af visse frysebokse og -skabe med oprindelse i Jugoslavien
    og Den tyske demokratiske Republik, og om afslutning af denne undersøgelse, samt
    om afslutning af proceduren vedrørende importen af visse frysebokse og -skabe
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2800/86 της Επιτροπής
    της 9ης Σεπτεμβρίου 1986 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    καταψυκτών καταγωγής ΕΣΣΔ, για την αποδοχή
    της ανάληψης υποχρεώσεων που προτάθηκε στα
    πλαίσια της έρευνας σχετικά με τις εισαγωγές
    ορισμένων καταψυκτών καταγωγής Γιουγκοσλαβίας
    και Λαϊκής Δημοκρατίας της Γερμανίας, για την
    περάτωση της έρευνας και για την περάτωση της
    διαδικασίας έναντι των εισαγωγών ορισμένων
    καταψυκτών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2800/86 della Commissione del 9 settembre 1986 che
    istituisce un dazio antidumping provvisorio sulle importazioni di alcuni tipi
    di congelatori originari dell' URSS, accetta gli impegni assunti nell' ambito
    della procedura relativa alle importazioni di alcuni tipi di congelatori originari
    della Iugoslavia e della Repubblica democratica tedesca e chiude la procedura
    stessa, nonché chiude la procedura relativa alle importazioni di alcuni tipi
    di congelatori
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2800/86 van de Commissie van 9 september 1986 houdende
    instelling van een voorlopig anti-dumpingrecht op de invoer van bepaalde diepvriezers
    van oorsprong uit de Sovjetunie, houdende aanvaarding van de verbintenissen die
    zijn aangegaan in het kader van het onderzoek met betrekking tot de invoer van
    bepaalde diepvriezers van oorsprong uit Joegoslavië en de Duitse Democratische
    Republiek en houdende beëindiging van het onderzoek, alsook houdende beëindiging
    van de procedure met betrekking tot de invoer van bepaalde diepvriezers
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2800/86 da Comissão de 9 de Setembro de 1986 que
    institui um direito "anti-dumping" provisório sobre as importações de certos
    congeladores originários da União Soviética, que aceita compromissos no âmbito
    de um inquérito relativo às importações de certos congeladores originários
    da Jugoslávia e da República Democrática Alemã e que encerra o inquérito
    e o processo relativo às importações de certos congeladores
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2800/86 de la Comisión de 9 de septiembre de 1986
    por el que se establece un derecho antidumping provisional sobre las importaciones
    de determinados congeladores originarios de la Unión Soviética, por el que se
    aceptan los compromisos ofrecidos en el marco de la investigación relativa a
    las importaciones de determinados congeladores originarios de Yugoslavia y de
    la República Democrática Alemana y se da por concluida la investigación, y
    por el que se da por concluido el procedimiento en relación con las importaciones
    de determinados congeladores
  type: main
