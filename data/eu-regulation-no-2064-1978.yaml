title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2064/78 of 31 August 1978 fixing the rates
    of the refunds applicable from 1 September 1978 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2064/78 de la Commission, du 31 août 1978, fixant les
    taux des restitutions applicables, à compter du 1er septembre 1978, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2064/78 der Kommission vom 31. August 1978 zur Festsetzung
    der ab 1. September 1978 geltenden Erstattungssätze bei der Ausfuhr bestimmter
    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2064/78 af 31. august 1978 om fastsættelse
    af re restitutionssatser, der fra 1. september 1978 skal anvendes for visse produkter
    fra korn og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2064/78 della Commissione, del 31 agosto 1978, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 settembre 1978,
    a taluni prodotti dei settori dei cereali e del riso esportati sotto forma di
    merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2064/78 van de Commissie van 31 augustus 1978 houdende
    vaststelling van de restituties die met ingang van 1 september 1978 worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goederen
