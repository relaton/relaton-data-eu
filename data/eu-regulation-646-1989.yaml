  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 646/89 della Commissione del 14 marzo 1989 che sostituisce
    in taluni regolamenti relativi alla classificazione di merci i codici stabiliti
    in base alla nomenclatura della tariffa doganale comune in vigore al 31 dicembre
    1987 con quelli stabiliti in base alla nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 646/89 (1989. gada 14. marts), ar ko aizstāj
    kodus, kas noteikti, pamatojoties uz kopējā muitas tarifa nomenklatūru, kura
    stājās spēkā 1987. gada 31. decembrī, ar tiem kodiem, kas noteikti, pamatojoties
    uz kopējo nomenklatūru, dažās regulās attiecībā uz preču klasifikāciju
  type: main
- language: lt
  script: Latn
  content: 1989 m. kovo 14 d. Komisijos reglamentas (EEB) Nr. 646/89 kai kuriuose
    reglamentuose dėl prekių klasifikavimo pakeičiantis Bendrojo muitų tarifo
    nomenklatūros, galiojusios 1987 m. gruodžio 31 d., pagrindu nustatytus kodus
    į Kombinuotosios nomenklatūros pagrindu nustatytus kodus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummisjoni (KEE) Nru 646/89 tal-14 ta' Marzu 1989 li
