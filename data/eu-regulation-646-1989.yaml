title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 646/89 of 14 March 1989 replacing the codes
    established on the basis of the Common Customs Tariff nomenclature in force on
    31 December 1987 with those established on the basis of the combined nomenclature
    in certain Regulations concerning the classification of goods
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 646/89 de la Commission du 14 mars 1989 remplaçant
    dans certains règlements relatifs au classement de marchandises les codes établis
    sur la base de la nomenclature du tarif douanier commun en vigueur au 31 décembre
    1987 par ceux établis sur base de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 646/89 der Kommission vom 14. März 1989 mit der die
    in bestimmten Verordnungen zur Einreihung der Waren auf der Basis des am 31. Dezember
    1987 geltenden Code durch die Code der Kombinierten Nomenklatur ersetzt werden
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 646/89 на Комисията от 14
    март 1989 година относно замяната на кодовете,
    определени съгласно номенклатурата на Общата
    митническа тарифа в сила от 31 декември 1987 година,
    с кодовете, определени съгласно Комбинираната
    номенклатура, в определени регламенти относно
    класирането на стоки
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 646/89 ze dne 14. března 1990, kterým se
    v některých nařízení týkajících se zařazení zboží nahrazují kódy
    stanovené na základě nomenklatury společného celního sazebníku platné
    k 31. prosinci 1987 kódy stanovenými na základě kombinované nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 646/89 af 14. marts 1989 om ændring
    i visse forordninger om tarifering af varer af de koder, der er fastlagt på grundlag
    af Den Fælles Toldtarifs nomenklatur pr. 31. december 1987, til de koder, som
    er fastlagt på grundlag af Den Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 646/89 της Επιτροπής
    της 14ης Μαρτίου 1989 για την αντικατάσταση σε
    ορισμένους κανονισμούς σχετικούς με την κατάταξη
    εμπορευμάτων των κωδικών που θεσπίστηκαν βάσει
    της ονοματολογίας του κοινού δασμολογίου που
    άρχισε να ισχύει στις 31 Δεκεμβρίου 1987 από τους
    κωδικούς που θεσπίστηκαν βάσει της συνδυασμένης
    ονοματολογίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 646/89, 14. märts 1989, millega asendatakse
