    1987, z oznakami, določenimi na podlagi kombinirane nomenklature iz nekaterih
    uredb v zvezi z uvrstitvijo blaga
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 646/89 de la Comisión de 14 de marzo de 1989 por
