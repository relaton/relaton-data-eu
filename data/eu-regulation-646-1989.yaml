    perusteella vahvistettujen koodien korvaamisesta yhdistetyn nimikkeistön perusteella
    vahvistetuilla koodeilla tietyissä tavaroiden luokittelua koskevissa asetuksissa
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EEZ) br. 646/89 od 14. ožujka 1989. o zamjeni oznaka
    utvrđenih na temelju nomenklature Zajedničke carinske tarife koja je bila na
    snazi 31. prosinca 1987. oznakama koje su utvrđene na temelju kombinirane nomenklature
    u određenim uredbama o razvrstavanju robe
  type: main
- language: hu
  script: Latn
  content: A Bizottság 646/89/EGK rendelete (1989. március 14.) az 1987. december
    31-én hatályos közös vámtarifa szerinti nómenklatúra alapján meghatározott
    kódoknak az áruk besorolásáról szóló egyes rendeletekben foglalt Kombinált
