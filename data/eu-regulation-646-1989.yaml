    koodid koondnomenklatuuril põhinevate koodidega teatavates kaupade klassifitseerimist
    käsitlevates määrustes
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 646/89, annettu 14 päivänä maaliskuuta 1989,
