    na základe nomenklatúry Spoločného colného sadzobníka, ktorý je v účinnosti
    od 31. decembra 1987, kódmi ustanovenými na základe kombinovanej nomenklatúry
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 646/89 z dne 14. marca 1989 o nadomestitvi oznak,
