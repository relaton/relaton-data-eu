    w dniu 31 grudnia 1987 r. kodami ustanowionymi na podstawie Nomenklatury Scalonej,
    w niektórych rozporządzeniach dotyczących klasyfikacji towarów
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 646/89 da Comissão de 14 de Março de 1989 que substitui,
    em certos regulamentos relativos à classificação de mercadorias, os códigos
    estabelecidos com base na nomenclatura da pauta aduaneira comum, em vigor em 31
    de Dezembro de 1987, pelos códigos estabelecidos com base na Nomenclatura Combinada
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 646/89 al Comisiei din 14 martie 1989 de înlocuire
    în unele regulamente cu privire la clasificarea mărfurilor a codurilor stabilite
    pe baza nomenclaturii Tarifului Vamal Comun în vigoare la 31 decembrie 1987 cu
    cele stabilite pe baza Nomenclaturii Combinate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 646/89 zo 14. marca 1989, ktorým sa v určitých
