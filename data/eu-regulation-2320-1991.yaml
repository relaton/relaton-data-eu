title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2320/91 of 31 July 1991 laying down the
    detailed rules for the second free supply of bone-in beef to the Soviet Union
    as provided for in Council Regulation (EEC) No 598/91 on urgent action for the
    supply of agricultural and medical products intended for the people of the Soviet
    Union and amending Regulation (EEC) No 569/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2320/91 de la Commission, du 31 juillet 1991, fixant
    certaines modalités relatives à la deuxième livraison gratuite de viande bovine
    avec os à l'Union soviétique conformément au règlement (CEE) n° 598/91 du
    Conseil relatif à l'action d'urgence pour la fourniture de produits agricoles
    destinés à la population d'Union soviétique et modifiant le règlement (CEE)
    n° 569/88
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2320/91 der Kommission vom 31. Juli 1991 mit bestimmten
    Durchführungsbestimmungen für die zweite kostenlose Lieferung von Rindfleisch
    mit Knochen nach der Sowjetunion gemäß der Verordnung (EWG) Nr. 598/91 des Rates
    über eine Dringlichkeitsmaßnahme zur Lieferung landwirtschaftlicher Erzeugnisse
    für die Bevölkerung der Sowjetunion sowie zur Änderung der Verordnung (EWG)
    Nr. 569/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2320/91 af 31. juli 1991 om visse gennemførelsesbestemmelser
    for anden gratis levering af ikke-udbenet oksekød til Sovjetunionen i henhold
    til Rådets forordning (EØF) nr. 598/91 om en hasteaktion vedrørende levering
    af landbrugsprodukter bestemt til befolkningen i Sovjetunionen, og om ændring
    af forordning (EØF) nr. 569/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2320/91 της Επιτροπής
    της 31ης Ιουλίου 1991 που καθορίζει ορισμένες
    λεπτομέρειες σχετικά με τη δεύτερη δωρεάν
    παροχή βοείου κρέατος με κόκαλα στη Σοβιετική
    Ένωση σύμφωνα με τον κανονισμό (ΕΟΚ) αριθ. 598/91
    του Συμβουλίου σχετικά με την ανάληψη επείγουσας
    δράσης για την προμήθεια γεωργικών προϊόντων
    που προορίζονται για τον πληθυσμό της Σοβιετικής
    Ένωσης και που τροποποιεί τον κανονισμό (ΕΟΚ)
    αριθ. 569/88
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2320/91 della Commissione, del 31 luglio 1991, che
    stabilisce talune modalità della seconda fornitura gratuita di carni bovine non
    disossate all'Unione Sovietica ai sensi del regolamento (CEE) n. 598/91 del Consiglio
    relativo ad un'azione d'urgenza per la fornitura di prodotti agricoli e medicinali
    destinati alla popolazione dell'Unione Sovietica e che modifica il regolamento
    (CEE) n. 569/88
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2320/91 van de Commissie van 31 juli 1991 tot vaststelling
    van nadere bepalingen inzake de tweede kosteloze levering van rundvlees met been
    aan de Sowjetunie op grond van Verordening (EEG) nr. 598/91 van de Raad betreffende
    een noodmaatregel voor de levering van landbouwprodukten, bestemd voor de bevolking
    van de Sowjetunie, en tot wijziging van Verordening (EEG) nr. 569/88
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2320/91 da Comissão, de 31 de Julho de 1991, que
    estabelece certas normas de execução para o segundo fornecimento gratuito de
    carne de bovino com osso à União Soviética, tal como previsto no Regulamento
    (CEE) nº 598/91 do Conselho, relativo a uma acção de urgência para o fornecimento
    de produtos agrícolas destinados à população da União Soviética e que altera
    o Regulamento (CEE) nº 569/88
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2320/91 de la Comisión, de 31 de julio de 1991, por
    el que se establecen algunas normas de desarrollo para la segunda operación de
    suministro gratuito de carne de vacuno sin deshuesar a la Unión Soviética, de
    acuerdo con lo dispuesto en el Reglamento (CEE) nº 598/91 del Consejo relativo
    a una acción de urgencia para el suministro de productos agrícolas destinados
    a la población de la Unión Soviética y por el que se modifica el Reglamento
    (CEE) nº 569/88
