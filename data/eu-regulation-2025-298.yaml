  content: Commission Delegated Regulation (EU) 2025/298 of 31 October 2024 supplementing
    Regulation (EU) 2023/1114 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the methodology to estimate the number
    and value of transactions associated to uses of asset-referenced tokens and of
    e-money tokens denominated in a currency that is not an official currency of a
    Member State as a means of exchange
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/298 de la Commission du 31 octobre 2024
    complétant le règlement (UE) 2023/1114 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant la méthode d’estimation
    du nombre et de la valeur des transactions associées à des utilisations de jetons
    se référant à un ou des actifs, et de jetons de monnaie électronique libellés
    dans une monnaie qui n’est pas une monnaie officielle d’un État membre, comme
    moyen d’échange
  type: main
