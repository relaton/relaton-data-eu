    die Schätzung der Zahl und des Werts von Transaktionen, bei denen vermögenswertereferenzierte
    Token und E-Geld-Token, die auf eine Währung lauten, die keine amtliche Währung
    eines Mitgliedstaats ist, als Tauschmittel verwendet werden
