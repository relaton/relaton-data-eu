id: EUDecision1979680
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/680/EEC: Commission Decision of 18 July 1979 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, falling within heading No 60.02 of the
    Common Customs Tariff (NIMEXE codes 60.02-40, 50, 60, 70, 80) (categories 10 and
    11), originating in Hong Kong and in free circulation in the other Member States
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/680/CEE: Décision de la Commission, du 18 juillet 1979, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée, de la position 60.02 du tarif douanier
    commun (codes Nimexe : 60.02-40, 50, 60, 70, 80) (catégories 10 et 11), originaire
    de Hong-kong et mise en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/680/EWG: Entscheidung der Kommission vom 18. Juli 1979, mit der die
    Französische Republik ermächtigt wird, aus Hongkong stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, der Tarifnummer 60.02 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    60.02-40, 50, 60, 70, 80) (Kategorien 10 und 11) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/680/EØF: Kommissionens beslutning af 18. juli 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, af trikotage, ikke elastisk eller gummeret, som henhører under pos.
    60.02 i den fælles toldtarif (NIMEXE-nummer 60.02-40, 50, 60, 70, 80 ; kategori
    10 og 11), har oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/680/CEE: Decisione della Commissione, del 18 luglio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, della voce 60.02 della tariffa doganale comune (codici
    Nimexe: 60.02-40, 50, 60, 70, 80), categorie 10-11, originari di Hong Kong e messi
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/680/EEG: Beschikking van de Commissie van 18 juli 1979 waarbij de Franse
    Republiek wordt gemachtigd handschoenen, wanten en dergelijke artikelen, van niet-
    elastisch of van niet-gegummeerd brei- of haakwerk, van post 60.02 van het gemeenschappelijk
    douanetarief (NIMEXE-code 60.02-40, 50, 60, 70, 80) (categorie 10 en 11), van
    oorsprong uit Hong-Kong en in de overige Lid- Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
