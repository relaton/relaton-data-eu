  content: Commission Regulation (EEC) No 1048/85 of 24 April 1985 correcting Regulation
    (EEC) No 1011/85 amending Regulation (EEC) No 926/85 increasing to 600 000 tonnes
    the quantity of common wheat held by the French intervention agency for which
    a standing invitation to tender for export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1048/85 de la Commission, du 24 avril 1985, rectifiant
    le règlement (CEE) n 1011/85 modifiant le règlement (CEE) n 926/85 et portant
    à 600 000 tonnes l'adjudication permanente pour l'exportation de froment tendre
    détenu par l'organisme d'intervention français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1048/85 der Kommission vom 24. April 1985 zur Berichtigung
    der Verordnung (EWG) Nr. 1011/85 zur Änderung der Verordnung (EWG) Nr. 926/85
    und zur Erhöhung der Dauerausschreibung zur Ausfuhr von im Besitz der französischen
    Interventionsstelle befindlichem Weichweizen auf 600 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1048/85 af 24. april 1985 om berigtigelse
    af forordning (EØF) nr. 1011/85 om ændring af forordning (EØF) nr. 926/85 om
    forhøjelse til 600 000 tons af den løbende licitation med henblik på eksport
    af blød hvede, som er i det franske interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
