title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3320/93 of 2 December 1993 amending Regulation
    (EEC) No 266/93 with regard to the notification to the Commission by the relevant
    Greek authority of the total quantities of certain fresh fruit and vegetables
    covered by admissible applications for special temporary compensation
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3320/93 de la Commission du 2 décembre 1993 modifiant
    le règlement (CEE) n° 266/93 en ce qui concerne la communication à la Commission
    par l'autorité grecque compétente des quantités globales de certains fruits
    et légumes frais faisant l'objet d'une demande recevable d'indemnité spéciale
    temporaire
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3320/93 DER KOMMISSION vom 2. Dezember 1993 zur Änderung
    der Verordnung (EWG) Nr. 266/93 hinsichtlich der Mitteilung der Gesamtmengen an
    frischem, durch einen gültigen Antrag auf Gewährung der besonderen befristeten
    Entschädigung gebundenen Obst und Gemüse durch die zuständige griechische Behörde
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3320/93 af 2. december 1993 om ændring
    af forordning (EØF) nr. 266/93, for så vidt angår de oplysninger, den græske
    myndighed meddeler Kommissionen om de samlede mængder frugt og grøntsager, for
    hvilke der er indgivet ansøgninger, som kan antages, om midlertidig særlig godtgørelse
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3320/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 2ας Δεκεμβρίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 266/93 όσον αφορά τη ανακοίνωση
    προς την Επιτροπή από την αρμόδια ελληνική
    αρχή των συνολικών ποσοτήτων ορισμένων νωπών
    οπωροκηπευτικών για τα οποία έχει γίνει αποδεκτή
    η αίτηση για προσωρινή ειδική αποζημίωση
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3320/93 DELLA COMMISSIONE del 2 dicembre 1993 che modifica
    il regolamento (CEE) n. 266/93 per quanto riguarda la comunicazione alla Commissione,
    da parte dell' autorità greca competente, dei quantitativi complessivi di taluni
    ortofrutticoli freschi oggetto di domande di indennità speciale temporanea ammissibili
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3320/93 VAN DE COMMISSIE van 2 december 1993 tot wijziging
    van Verordening (EEG) nr. 266/93 ten aanzien van de mededeling aan de Commissie,
    door de bevoegde Griekse autoriteit, van de totale hoeveelheden van bepaalde soorten
    verse groenten en fruit waarvoor ontvankelijke aanvragen voor de bijzondere en
    tijdelijke compensatie zijn ingediend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3320/93 DA COMISSÃO de 2 de Dezembro de 1993 que
    altera o Regulamento (CEE) nº 266/93 no respeitante à comunicação à Comissão,
    pela autoridade grega competente, das quantidades totais de certas frutas e produtos
    hortícolas frescos que tenham sido objecto de pedidos admissíveis do concessão
    da indemnização especial temporária
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3320/93 DE LA COMISIÓN de 2 de diciembre de 1993 por
    el que se modifica el Reglamento (CEE) nº 266/93 en lo que se refiere a la comunicación
    a la Comisión, por la autoridad griega competente, de las cantidades globales
    de determinadas frutas y hortalizas frescas por las que se hayan presentado solicitudes
    admisibles de indemnización especial temporal
  type: main
