    sintetici della categoria di prodotti n. 33 (numero d'ordine 40.0330) originari
    della Tailandia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2540/90 VAN DE COMMISSIE van 31 augustus 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    vervaardigd van strippen of dergelijke, van de categorie van produkten nr. 33
    (volgnummer 40.0330), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2540/90 DA COMISSAO de 31 de Agosto de 1990 que restabelece
