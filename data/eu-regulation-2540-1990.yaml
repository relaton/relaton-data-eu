title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2540/90 of 31 August 1990 reintroducing
    the levying of the customs duties applicable to woven fabrics of synthetic filament
    yarn products of category No 33 (order No 40.0330) originating in Thailand, to
    which the preferential tariff arrangements of Council Regulation (EEC) No 3897/89
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2540/90 de la Commission du 31 août 1990 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fils de filaments synthétiques de la catégorie de produits n° 33 (numéro d'ordre
    40.0330) originaires de la Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2540/90 DER KOMMISSION vom 31. August 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Gewebe aus Garnen aus synthetischen Filamenten
    der Warenkategorie Nr. 33 (laufende Nummer 40.0330) mit Ursprung in Thailand,
    dem die in der Verordnung (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2540/90 af 31. august 1990 om genindførelse
    af opkrævning af toldafgifter for stoffer af garn af syntetiske filamenter, under
    varekategori 33 (løbenummer 40.0330), som har oprindelse i Thailand og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2540/90 της Επιτροπής
    της 31ης Αυγούστου 1990 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών στα υφάσματα,
    από συνθετικά υφαντικά νημάτια της κατηγορίας
    των προϊόντων αριθ. 33 ( αύξων αριθ. 40.0330 ), καταγωγής
    Ταϊλάνδης, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3897/89 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2540/90 DELLA COMMISSIONE del 31 agosto 1990 che ripristina
