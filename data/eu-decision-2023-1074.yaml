  script: Latn
  content: Council Decision (EU) 2023/1074 of 25 May 2023 authorising the opening
    of negotiations for a protocol between the European Union and the Republic of
    Kazakhstan amending the Enhanced Partnership and Cooperation Agreement between
    the European Union and its Member States, of the one part, and the Republic of
    Kazakhstan, of the other part, as regards the protection of geographical indications
    for agricultural products and foodstuffs, wines and spirits
  type: main
- language: fr
