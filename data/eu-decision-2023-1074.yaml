    et la République du Kazakhstan modifiant l’accord de partenariat et de coopération
    renforcé entre l’Union européenne et ses États membres, d’une part, et
    la République du Kazakhstan, d’autre part, en ce qui concerne la protection
    des indications géographiques des produits agricoles, des denrées alimentaires,
    des vins et des spiritueux
  type: main
