title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1742 of 21 June 2024 extending
    the derogation from Council Regulation (EC) No 1967/2006 as regards the minimum
    distance from the coast and depth for shore seines fishing in territorial waters
    of France adjacent to the coast of Occitanie and the coast of Provence-Alpes-Côte
    d’Azur
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1742 de la Commission du 21 juin 2024
    prolongeant la dérogation au règlement (CE) no 1967/2006 du Conseil en ce qui
    concerne la distance de la côte et la profondeur minimales pour les sennes de
    plage pêchant dans les eaux territoriales de la France adjacentes à la côte
    de l’Occitanie et à la côte de la Provence-Alpes-Côte d’Azur
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/1742 der Kommission vom 21. Juni 2024
    zur Verlängerung der Ausnahme von der Verordnung (EG) Nr. 1967/2006 des Rates
    hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe für
    Strandwaden, die in an die Küste von Occitanie und Provence-Alpes-Côte d’Azur
    angrenzenden Hoheitsgewässern Frankreichs fischen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/1742 на Комисията
    от 21 юни 2024 година за удължаване на срока на
    дерогацията от Регламент (ЕО) № 1967/2006 на Съвета
    по отношение на минималното разстояние от
    брега и дълбочината за риболов с брегови грибове
    в териториалните води на Франция, прилежащи
    към бреговата линия на Окситания и Прованс-Алпи-Лазурен
    бряг
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/1742 ze dne 21. června 2024,
    kterým se prodlužuje platnost odchylky od nařízení Rady (ES) č. 1967/2006,
    pokud jde o minimální vzdálenost od pobřeží a minimální hloubku moře
    pro pobřežní nevody lovící v teritoriálních vodách Francie přiléhajících
    k pobřeží Occitanie a pobřeží Provence-Alpes-Côte d’Azur
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/1742 af 21. juni 2024
    om forlængelse af fravigelsen af Rådets forordning (EF) nr. 1967/2006 for så
    vidt angår mindsteafstanden fra kysten og mindstedybden for fiskeri med strandvod
    i franske territorialfarvande, der grænser op til kysten i Occitanien og Provence-Alpes-Côte
    d'Azur
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/1742 της Επιτροπής,
    της 21ης Ιουνίου 2024, για την παράταση της παρέκκλισης
    από τον κανονισμό (ΕΚ) αριθ. 1967/2006 του Συμβουλίου
    όσον αφορά την ελάχιστη απόσταση από την ακτή
    και το ελάχιστο βάθος θάλασσας που οφείλουν
    να τηρούν οι πεζότρατες που αλιεύουν στα χωρικά
    ύδατα της Γαλλίας που γειτνιάζουν με τις ακτές
    των περιφερειών Occitanie και Provence-Alpes-Côte d’Azur
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2024/1742, 21. juuni 2024, millega pikendatakse
    erandit nõukogu määrusest (EÜ) nr 1967/2006 seoses Occitanie ja Provence-Alpes-Côte
    d’Azuri ranniku äärsetes Prantsusmaa territoriaalvetes kaldanootadega püügi
    vähima lubatud kaugusega kaldast ja vee sügavusega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2024/1742, annettu 21 päivänä
    kesäkuuta 2024, neuvoston asetuksesta (EY) N:o 1967/2006 myönnetyn, vähimmäisetäisyyttä
    rannikolta ja veden vähimmäissyvyyttä koskevan poikkeuksen voimassaolon jatkamisesta
    kalastettaessa rannalta vedettävillä nuotilla Ranskan aluevesillä Oksitanian
    ja Provence-Alpes-Côte d’Azurin rannikoiden edustalla
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/1742 ón gCoimisiún an 21 Meitheamh
    2024 lena gcuirtear síneadh leis an maolú ar Rialachán (CE) Uimh. 1967/2006
    ón gComhairle a mhéid a bhaineann leis an bhfad íosta ón gcósta agus an doimhneacht
    le haghaidh saighní cladaigh lena ndéantar iascaireacht in uiscí teorann na
    Fraince cóngarach do chósta Occitanie agus cósta Provence-Alpes-Côte d’Azur
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/1742 оd 21. lipnja 2024. o produljenju
    odstupanja od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu najmanje udaljenosti
    od obale i najmanje dubine za obalne mreže potegače kojima se obavlja ribolov
    u teritorijalnim vodama Francuske uz obale Okcitanije i regije Provence-Alpes-Côte
    d’Azur
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/1742 végrehajtási rendelete (2024. június 21.)
    az 1967/2006/EK tanácsi rendelettől az Occitanie és Provence-Alpes-Côte d’Azur
    partjainál lévő francia felségvizeken folytatott halászatban alkalmazott
    parti kerítőhálók telepítésének parttól számított minimális távolsága
    és minimális mélysége tekintetében engedélyezett eltérés meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/1742 della Commissione, del 21 giugno
    2024, che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto riguarda la distanza minima dalla costa e la profondità minima per le
    sciabiche da spiaggia operanti nelle acque territoriali della Francia adiacenti
    alla costa dell’Occitania e alla costa della Provenza-Alpi-Costa Azzurra
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/1742 (2024. gada 21. jūnijs),
    ar ko pagarina to atkāpi no Padomes Regulas (EK) Nr. 1967/2006, kura attiecībā
    uz minimālo attālumu no krasta un minimālo dziļumu piešķirta kuģiem, kas
    izmanto no krasta velkamos vadus Oksitānijas krastam un Provansas-Alpu-Kotdazīras
    krastam piegulošajos Francijas teritoriālajos ūdeņos
  type: main
- language: lt
  script: Latn
  content: 2024 m. birželio 21 d. Komisijos įgyvendinimo reglamentas (ES) 2024/1742,
    kuriuo pratęsiamas nuostatos, leidžiančios nukrypti nuo Tarybos reglamento
    (EB) Nr. 1967/2006 nuostatų dėl minimalaus atstumo nuo kranto ir minimalaus
    jūros gylio, taikomos žvejybai kranto traukiamaisiais tinklais Prancūzijos
    teritoriniuose vandenyse greta Oksitanijos ir Provanso-Alpių-Žydrojo Kranto
    regiono pakrančių, galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/1742 tal-21
    ta’ Ġunju 2024 li jestendi d-deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    f’dak li għandu x’jaqsam mad-distanza minima mill-kosta u mal-fond għas-sajd
    bit-tartaruni tax-xatt f’ilmijiet territorjali ta’ Franza kontigwi mal-kosta
    ta’ Occitanie u mal-kosta ta’ Provence-Alpes-Côte d’Azur
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/1742 van de Commissie van 21 juni 2024
    tot verlenging van de afwijking van Verordening (EG) nr. 1967/2006 van de Raad
    wat betreft de minimumafstand van de kust en de minimumzeediepte voor de visserij
    met landzegens in de territoriale wateren van Frankrijk voor de kust van Occitanië
    en de kust van Provence-Alpes-Côte d’Azur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/1742 z dnia 21 czerwca 2024
    r. przedłużające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w zakresie
    minimalnych odległości od brzegu i minimalnej głębokości morza dla niewodów
    dobrzeżnych stosowanych do połowów na wodach terytorialnych Francji przyległych
    do wybrzeży Oksytanii i Prowansji-Alp-Lazurowego Wybrzeża
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/1742 da Comissão, de 21 de junho de
    2024, que prorroga a derrogação do Regulamento (CE) n.o 1967/2006 do Conselho
    no respeitante à distância mínima da costa e à profundidade mínima para as
    redes envolventes-arrastantes de alar para a praia utilizadas em águas territoriais
    de França adjacentes à costa da Occitânia e à costa da Provença-Alpes-Côte
    d’Azur
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/1742 al Comisiei din 21 iunie
    2024 de prelungire a derogării de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește distanța minimă față de coastă și adâncimea pentru
    năvoadele de plajă utilizate pentru pescuit în apele teritoriale ale Franței
    adiacente coastei Occitaniei și coastei Provence-Alpes-Côte d’Azur
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/1742 z 21. júna 2024, ktorým
    sa predlžuje platnosť výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ
    ide o minimálnu vzdialenosť od pobrežia a minimálnu hĺbku mora v prípade
    lovu pobrežnými záťahovými sieťami v pobrežných vodách Francúzska v
    blízkosti pobrežia regiónov Occitanie a Provence-Alpes-Côte d’Azur
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/1742 z dne 21. junija 2024 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede najmanjše oddaljenosti od
    obale in globine za obalne potegalke, ki lovijo v teritorialnih vodah Francije,
    ki mejijo na obalo območij Occitanie in Provence-Alpes-Côte d’Azur
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/1742 de la Comisión, de 21 de junio
    de 2024, por el que se prorroga la excepción al Reglamento (CE) n.o 1967/2006
    del Consejo en lo relativo a la distancia mínima de la costa y la profundidad
    de la pesca con jábegas en aguas territoriales de Francia adyacentes a la costa
    de Occitania y a la costa de Provenza-Alpes-Costa Azul
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/1742 av den 21 juni 2024
    om förlängning av undantaget från rådets förordning (EG) nr 1967/2006 vad
    gäller minimiavstånd från kusten och minimidjup för fiske med landvad/not
    i Frankrikes territorialvatten vid kusten i Occitanie och kusten i Provence-Alpes-Côte
    d’Azur
