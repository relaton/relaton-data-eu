id: EUDecision1976652
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 June 1976 authorizing the United Kingdom not
    to apply Community treatment to certain woven fabrics of synthetic textile fibres
    (polypropylene), falling within subheading 51.04 ex A of the Common Customs Tariff,
    originating in Czechoslovakia and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/652/CEE: Décision de la Commission, du 24 juin 1976, autorisant le
    Royaume-Uni à exclure du traitement communautaire certains tissus de fibres synthétiques
    (polypropylène), de la sous-position 51.04 Ex A du Tarif douanier commun, originaires
    de Tchécoslovaquie et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. Juni 1976, mit der das Vereinigte Königreich
    ermächtigt wird, aus der Tschechoslowakei stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus synthetischen Spinnfäden (Polypropylen)
    der Tarifstelle 51.04 ex A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 24. juni 1976 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage visse vævede stoffer af kemofibre
    (polypropylen), som henhører under pos. 51.04 ex A i den fælles toldtarif, har
    oprindelse i Tjekkoslovakiet og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 giugno 1976, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario taluni tessuti di fibre sintetiche
    (polipropilene) di cui alla sottovoce 51.04 ex A della tariffa doganale comune,
    originari della Cecoslovacchia e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 juni 1976 waarbij het Verenigd Koninkrijk
    wordt gemachtigd sommige weefsels van synthetische vezels (polypropyleen) van
    post 51.04 ex A van het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
