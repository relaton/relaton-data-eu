    a aplicar medidas em derrogação do artigo 26.o, n.o 1, alínea a), e do artigo
    168.o da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre o valor
    acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2385 a Consiliului din 6 decembrie
