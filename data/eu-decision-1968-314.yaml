title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 juillet 1968, portant prorogation de la
    décision du 14 avril 1965, autorisant la République italienne à exclure du
    traitement communautaire les piles électriques originaires du Japon et mises
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '68/314/EWG: Entscheidung der Kommission vom 5. Juli 1968 zur Verlängerung
    der Geltungsdauer der Entscheidung vom 14. April 1965, mit der die Italienische
    Republik ermächtigt worden war, Primärelemente und Primärbatterien japanischen
    Ursprungs, die sich in den anderen Mitgliedstaaten im freien Verkehr befinden,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '68/314/CEE: Decisione della Commissione, del 5 luglio 1968, che proroga
    la decisione del 14 aprile 1965 con la quale si autorizza la Repubblica italiana
    ad escludere dal trattamento comunitario le «pile elettriche» originarie del
    Giappone e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '68/314/EEG: Beschikking van de Commissie van 5 juli 1968 houdende verlenging
    van de beschikking van 14 april 1965 betreffende het verzoek van de Italiaanse
    Republiek om elektrische elementen en elektrische batterijen, die van oorsprong
    zijn uit Japan en in de andere Lid-Staten in het vrije verkeer zijn gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
