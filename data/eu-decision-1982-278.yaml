title:
- language: en
  script: Latn
  content: '82/278/EEC: Commission Decision of 22 April 1982 establishing that the
    apparatus described as ''Beckman - ultracentrifuge, model L8-80'', may not be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/278/CEE: Décision de la Commission, du 22 avril 1982, constatant que
    l''importation de l''appareil dénommé "Beckman-ultracentrifuge, model L8-80"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/278/EWG: Entscheidung der Kommission vom 22. April 1982, mit der festgestellt
    wird, daß das Gerät ,,Beckman-Ultracentrifuge, model L8-80" , nicht unter Befreiung
    von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/278/EØF: Kommissionens beslutning af 22. april 1982 om fastslåelse
    af, at indførsel af apparatet "Beckman - Ultracentrifuge, model L8-80" ikke kan
    ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/278/EOK: Απόφαση τής Επιτροπής τής 22ας Απριλίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Beckman — Ultracentrifuge, model L8-80» δέν
    δύναται νά πραγματοποιηθεί ατελώς ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/278/CEE: Decisione della Commissione, del 22 aprile 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Beckman - Ultracentrifuge, model
    L8-80" non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/278/EEG: Beschikking van de Commissie van 22 april 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Beckman-Ultracentrifuge, model L8-80" niet
    met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag worden
    ingevoerd'
