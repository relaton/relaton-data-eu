title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1407/78 of 26 June 1978 fixing a countervailing
    charge on imports into Belgium, the Federal Republic of Germany, Luxembourg and
    the Netherlands of alcohol of agricultural origin produced in France and on imports
    into Belgium and Luxembourg of spirit vinegar produced in France
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1407/78 de la Commission, du 26 juin 1978, portant
    fixation d'une taxe compensatoire sur les importations en Belgique, en République
    fédérale d'Allemagne, au Luxembourg et aux Pays-Bas d'alcool éthylique d'origine
    agricole obtenu en France et sur les importations en Belgique et au Luxembourg
    de vinaigre d'alcool obtenu en France
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1407/78 der Kommission vom 26. Juni 1978 zur Festsetzung
    einer Ausgleichsabgabe für die Einfuhr von in Frankreich hergestelltem Äthylalkohol
    landwirtschaftlichen Ursprungs nach Belgien, der Bundesrepublik Deutschland, Luxemburg
    und den Niederlanden sowie für die Einfuhr von in Frankreich hergestelltem Alkoholessig
    nach Belgien und Luxemburg
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1407/78 af 26. juni 1978 om fastsættelse
    af en udligningsafgift ved indførsel til Belgien, Forbundsrepublikken Tyskland,
    Luxembourg og Nederlandene af ethanol fremstillet i Frankrig af landbrugsprodukter
    og ved indførsel til Belgien og Luxembourg af spriteddike fremstillet i Frankrig
  type: main
- language: el
  script: Grek
