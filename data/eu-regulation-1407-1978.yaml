  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1407/78 della Commissione, del 26 giugno 1978, che
    fissa una tassa di compensazione sulle importazioni in Belgio, nella Repubblica
    federale di Germania, nel Lussemburgo e nei Paesi Bassi di alcole etilico di origine
    agricola ottenuto in Francia e sulle importazioni in Belgio e nel Lussemburgo
    di aceto di alcole ottenuto in Francia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1407/78 van de Commissie van 26 juni 1978 houdende
    vaststelling van een compenserende heffing op de invoer in België, de Bondsrepubliek
    Duitsland, Luxemburg en Nederland van in Frankrijk uit landbouwprodukten verkregen
    ethylacohol en op de invoer in België en Luxemburg van in Frankrijk verkregen
