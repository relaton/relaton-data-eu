title:
- language: en
  script: Latn
  content: '94/918/EC: Council Decision of 15 December 1994 adopting a specific programme
    for research and technological development, including demonstration, to be carried
    out for the European Community, on the one hand, by the JRC and, on the other,
    by means of activities within the framework of a competitive approach and intended
    for scientific and technical support to Community policies (1995 to 1998)'
  type: main
- language: fr
  script: Latn
  content: '94/918/CE: Décision du Conseil, du 15 décembre 1994, arrêtant un programme
    spécifique de recherche, de développement technologique et de démonstration
    à exécuter pour la Communauté européenne, d''une part par le CCR et, d''autre
    part, au moyen d''activités s''inscrivant dans le cadre d''une approche concurrentielle,
    et destinées à un soutien scientifique et technique aux politiques communautaires
    (1995-1998)'
  type: main
