title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 506/85 of 27 February 1985 specifying the
    extent to which applications lodged in February 1985 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 506/85 de la Commission, du 27 février 1985, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de février 1985 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 506/85 der Kommission vom 27. Februar 1985 über das
    Ausmaß, in dem den im Februar 1985 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 506/85 af 27. februar 1985 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i februar
    1985 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 506/85 της Επιτροπής
    της 27ης Φεβρουαρίου 1985 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Φεβρουάριο του 1985, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 506/85 della Commissione, del 27 febbraio 1985, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di febbraio 1985 per giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 506/85 van de Commissie van 27 februari 1985 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in februari 1985
    ingediende aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
