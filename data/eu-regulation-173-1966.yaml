  content: Règlement n° 173/66/CEE de la Commission du 7 novembre 1966 relatif à
    la détermination du prix CAF et du prix franco frontière des huiles d'olive
    n'ayant pas subi un processus de raffinage ainsi que la fixation des prélèvements
    applicables à ces produits
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 173/66/EWG der Kommission vom 7. November 1966 über die
    Ermittlung des cif-Preises, des Frei- Grenze-Preises und der Abschöpfungen für
    nicht raffinierte Olivenöle
  type: main
- language: it
  script: Latn
  content: Regolamento n. 173/66/CEE della Commissione, del 7 novembre 1966, che determina
    il prezzo cif e il prezzo franco frontiera degli oli d'oliva che non hanno subito
    un processo di raffinazione e fissa i prelievi applicabili a questi prodotti
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 173/66/EEG van de Commissie van 7 november 1966 betreffende
    de vaststelling van de c.i.f.- prijs en de prijs franco-grens voor olijfolie welke
    niet aan een raffinageproces onderworpen is geweest, alsmede betreffende de heffingen
    die op dit produkt van toepassing zijn
