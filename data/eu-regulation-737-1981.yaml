title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 737/81 of 23 March 1981 re-establishing
    the levying of customs duties on woven tarpaulins, sails, awnings and sunblinds,
    products of category 109 (code 1090), originating in South Korea, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3320/80
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 737/81 de la Commission, du 23 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux bâches,
    voiles d' embarquement et stores d' extérieur, tissés, de la catégorie de produits
    n° 109 (code 1090), originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 737/81 der Kommission vom 23. März 1981 über die
    Wiedereinführung des Zollsatzes für Planen, Segel und Markisen, aus Geweben,
    der Warenkategorie Nr. 109 (Kennziffer 1090), mit Ursprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 737/81 af 23. marts 1981 om genindførelse
    af opkrævning af toldafgifter for presenninger, sejl og markiser, vævede, under
    kategori 109 (kode 1090), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 737/81 τής Επιτροπής
    τής 23ης Μαρτίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών, γιά καλύμματα,
    ιστία, σκηνές καί εξωτερικά προπετάσματα, τών
    προϊόντων τής κατηγορίας 109 (κώδικας 1090), καταγωγής
    Νοτίου Κορέας, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 737/81 della Commissione, del 23 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili ai copertoni, vele per imbarcazioni
    e tende per l' esterno, tessuti, della categoria di prodotti n. 109 (codice 1090),
    originari della Corea del Sud, beneficiaria delle prefenrenze tariffarie previste
    dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 737/81 van de Commissie van 23 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    dekkleden, scheepszeilen, zonneschermen voor winkelpuien en dergelijke van de
    categorie van produkten nr. 109 (codenummer 1090), van oorsprong uit Zuid-Korea,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3320/80 van de Raad
  type: main
