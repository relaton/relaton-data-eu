type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2142/74 of the Commission of 13 August 1974 re-establishing
    the levying of customs duties on undergarments, knitted or crocheted, not elastic
    or rubberized, of cotton, falling within subheading 60.04 A, originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3503/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2142/74 de la Commission, du 13 août 1974, portant
    rétablissement de la perception des droits de douane applicables aux sous-vêtements
    de bonneterie non élastique ni caoutchoutée, de coton de la sous- position tarifaire
    60.04 A, originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2142/74 der Kommission vom 13. August 1974 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Baumwolle, der Tarifstelle 60.04 A, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2142/74 af 13. august 1974 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage, ikke
    elastik eller gummeret, af bomuld, under underposition 60.04 A, med oprindelse
    i udviklingslande og som omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2142/74 della Commissione, del 13 agosto 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti a maglia
    non elastica né gommata, di cotone, della sottovoce doganale n. 60.04 A originarie
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3503/73 del Consiglio del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2142/74 van de Commissie van 13 augustus 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op onderkleding
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, van katoen, van onderverdeling
    60.04 A, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 3503/73 van de Raad van 18 december 1973 algemene tariefpreferenties
    werden geopend
  type: main
