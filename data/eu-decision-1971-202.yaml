title:
- language: en
  script: Latn
  content: '71/202/EEC: Commission Decision of 12 May 1971 empowering Member States
    to take interim protective measures with regard to the importation of certain
    products originating in third countries and put into free circulation in other
    Member States'
  type: main
- language: fr
  script: Latn
  content: '71/202/CEE: Décision de la Commission, du 12 mai 1971, autorisant les
    États membres à prendre des mesures de protection conservatoires à l'' égard
    de l'' importation de certains produits originaires des pays tiers et mis en libre
    pratique dans un autre État membre'
  type: main
- language: de
  script: Latn
  content: '71/202/EWG: Entscheidung der Kommission vom 12. Mai 1971, mit der die
    Mitgliedstaaten ermächtigt werden, Sicherungsmaßnahmen bei der Einfuhr bestimmter
    aus dritten Ländern stammender und in einem anderen Mitgliedstaat im freien Verkehr
    befindlicher Waren zu treffen'
  type: main
- language: da
  script: Latn
  content: '71/202/EØF: Kommissionens beslutning af 12. maj 1971 ved hvilken medlemslandene
    bemyndiges til at træffe foreløbige beskyttelsesforanstaltninger ved indførslen
    af visse fra tredjelande hidrørende varer, der er i fri omsætning i en anden
    medlemsstat'
  type: main
- language: it
  script: Latn
  content: '71/202/CEE: Decisione della Commissione, del 12 maggio 1971, che autorizza
    gli Stati membri a prendere misure conservative di difesa nei confronti dell''
    importazione di certi prodotti originari dei paesi terzi e immessi in libera pratica
    in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/202/EEG: Beschikking van de Commissie van 12 mei 1971 waarbij de Lid-Staten
    worden gemachtigd beschermende maatregelen te treffen ten aanzien van de invoer
    van bepaalde produkten van oorsprong uit derde landen die in een andere Lid-Staat
    in het vrije verkeer worden gebracht'
  type: main
