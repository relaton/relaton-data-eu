id: EUDecision1973235
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 July 1973 authorizing the Italian Republic not
    to apply Community treatment to sewing machine heads for industrial use falling
    within heading No 84.41 A I ex b), ex II of the Common Customs Tariff, originating
    in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/235/CEE de la Commission, du 25 juillet 1973, autorisant la
    République italienne à exclure du traitement communautaire les têtes de machines
    à coudre à usage industriel, de la position 84.01 A I Ex B), Ex II du Tarif
    douanier commun, originaires du Japon et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. Juli 1973, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Nähmaschinenköpfe für Industriebedarf, der Tarifnummer
    84.41 A I ex b), ex II des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 25. juli 1973 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage symaskinhoveder til industriel
    brug, som henhører under position 84.41 A I ex b), ex II i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 25 luglio 1973, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le teste di macchine da cucire
    a uso industriale della voce n. 84.41 A I ex b), ex II, della tariffa doganale
    comune, originarie del Giappone e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 juli 1973 waarbij de Italiaanse Republiek
    wordt gemachtigd koppen van naaimachines voor industrieel gebruik van post 84.41
    A I ex b), ex II van het gemeenschappelijk douanetarief, van oorsprong uit Japan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
