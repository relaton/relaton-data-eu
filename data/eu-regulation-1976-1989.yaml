title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1976/89 of 3 July 1989 re-establishing the
    levying of customs duties on footwear with outer soles and uppers of rubber or
    of plastics falling within CN codes 6401 and 6402 originating in the Philippines
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1976/89 de la Commission du 3 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    étanches à semelles extérieures et dessus en caoutchouc ou en matière plastique,
    des codes NC 6401 et 6402, originaires des Philippines, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1976/89 DER KOMMISSION vom 3. Juli 1989 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe mit Laufsohlen und Oberteil aus Kautschuk
    oder Kunststoff der KN-Code 6401 und 6402 mit Ursprung auf den Philippinen, denen
    die in der Verordnung (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1976/89 af 3. juli 1989 om genindførelse
    af opkrævning af told for fodtøj med ydersål og overdel af gummi eller plast
    henhørende under KN-kode 6401 og 6402 og med oprindelse i Filippinerne, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1976/89 της Επιτροπής
    της 3ης Ιουλίου 1989 περί αποκαταστάσεως της
    εφαρμογής των δασμών για υποδήματα αδιάβροχα
    που έχουν εξωτερικά πέλματα και το πάνω μέρος
    από καουτσούκ ή από πλαστική ύψη των κωδικών
    ΣΟ 6401 και 6402, καταγωγής Φιλιππίνων, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    4257/88 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1976/89 DELLA COMMISSIONE del 3 luglio 1989 che ripristina
    la riscossione dei dazi doganali applicabili alle calzature impermeabili con suole
    esterne e tomaie di gomma o di materia plastica, dei codici NC 6401 e 6402, originarie
    delle Filippine, beneficiarie delle preferenze tariffarie previste dal regolamento
    (CEE) n. 4257/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1976/89 VAN DE COMMISSIE van 3 juli 1989 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel met
    buitenzool en bovendeel van rubber of van kunststof, van de GN-codes 6401 en 6402,
    van oorsprong uit de Filippijnen, waarvoor de in Verordening (EEG) nr. 4257/88
    van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 1976/89 DA COMISSÃO de 3 de Julho de 1989 que restabelece
