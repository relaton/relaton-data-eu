title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 482/87 of 17 February 1987 reintroducing
    the levying of the customs duties applicable to wrought bars, rods, angles, shapes
    and sections of aluminium, aluminium wire falling under heading 76.02 of the Common
    Customs Tariff, originating in Venezuela, benefiting from the tariff preferences
    provided for by Council Regulation (EEC) No 3924/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 482/87 de la Commission du 17 février 1987 portant
    rétablissement de la perception des droits de douane applicables aux barres,
    profilés et fils de section pleine, en aluminium, de la position 76.02 du tarif
    douanier commun, originaires du Venezuela, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 482/87 der Kommission vom 17. Februar 1987 zur Wiedereinführung
