    der Tarifnummer 76.02 des Gemeinsamen Zolltarifs mit Ursprung in Venezuela, dem
    die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 482/87 af 17. februar 1987 om genindførelse
