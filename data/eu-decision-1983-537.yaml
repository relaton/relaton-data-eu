title:
- language: en
  script: Latn
  content: '83/537/EEC: Commission Decision of 27 October 1983 authorizing France
    and Italy temporarily to take additional measures to protect themselves against
    the introduction of ''Erwinia amylovora'' (Only the French and Italian texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/537/CEE: Décision de la Commission du 27 octobre 1983 autorisant la
    France et l''Italie à prendre provisoirement des dispositions complémentaires
    en vue de se préserver contre l''introduction d''"Erwinia amylovora" (Les textes
    en langues française et italienne sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/537/EWG: Entscheidung der Kommission vom 27. Oktober 1983 zur Ermächtigung
    Frankreichs und Italiens, vorübergehend ergänzende Maßnahmen zum Schutz gegen
    die Einschleppung von Erwinia amylovora zu treffen (Nur der französische und
    italienische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/537/EØF: Kommissionens beslutning af 27. oktober 1983 om bemyndigelse
    af Frankrig og Italien til midlertidigt at træffe supplerende foranstaltninger
    til beskyttelse mod indslæbning af Erwinia amylovora (Kun den franske og italienske
    udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '83/537/ΕΟΚ: Απόφαση της Επιτροπής της 27ης
    Οκτωβρίου 1983 που επιτρέπει στη Γαλλία και στην
    Ιταλία να λάβουν προσωρινά συμπληρωματικά
    μέτρα για να προστατευθούν από την εισαγωγή
    της Erwinia amylovora (Τα κείμενα στην γαλλική και ιταλική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '83/537/CEE: Decisione della Commissione del 27 ottobre 1983 che autorizza
    la Francia e l''Italia ad adottare provvisoriamente disposizioni complementari
    per premunirsi contro l''introduzione di Erwinia amylovora (I testi in lingua
    francese e italiana sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '83/537/EEG: Beschikking van de Commissie van 27 oktober 1983 tot machtiging
    van Frankrijk en Italië om voorlopig aanvullende maatregelen te nemen ten einde
    het binnendringen op hun grondgebied van Erwinia amylovora tegen te gaan (Slechts
    de teksten in de Franse en de Italiaanse taal zijn authentiek)'
  type: main
