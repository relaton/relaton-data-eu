    Markt und dessen Verwendung gemäß Artikel 55 Absatz 1 der Verordnung (EU) Nr.
    528/2012 des Europäischen Parlaments und des Rates zu gestatten (Bekannt gegeben
    unter Aktenzeichen C(2021) 3037) (Nur der englische Text ist verbindlich)
