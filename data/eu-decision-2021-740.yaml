title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/740 of 4 May 2021 concerning
    the extension of the action taken by the United Kingdom Health and Safety Executive
    permitting the making available on the market and use of the biocidal product
    Isopropanol Solution in accordance with Article 55(1) of Regulation (EU) No 528/2012
    of the European Parliament and of the Council (notified under document C(2021)
    3037) (Only the English text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/740 de la Commission du 4 mai 2021 concernant
    la prorogation de la mesure prise par le Health and Safety Executive du Royaume-Uni
    autorisant la mise à disposition sur le marché et l’utilisation du produit
    biocide «Isopropanol Solution» conformément à l’article 55, paragraphe 1,
    du règlement (UE) no 528/2012 du Parlement européen et du Conseil [notifiée
    sous le numéro C(2021) 3037] (Le texte en langue anglaise est le seul faisant
    foi.)
