title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 2 décembre 1963, relative au recours de
    la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire certains produits originaires de pays tiers et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '63/671/EWG: Entscheidung der Kommission vom 2. Dezember 1963 über den
    Antrag der Französischen Republik auf Genehmigung der Anwendung von Artikel 115
    Absatz (1) des Vertrages, um gewisse aus Drittländern stammende und in den anderen
    Mitgliedstaaten zum freien Verkehr zugelassene Erzeugnisse von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '63/671/CEE: Decisione della Commissione del 2 dicembre 1963 relativa al
    ricorso presentato dalla Repubblica francese ai sensi dell''articolo 115, comma
    1 del Trattato, per escludere dal trattamento comunitario alcuni prodotti originari
    di paesi terzi, messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/671/EEG: Beschikking van de Commissie van 2 december 1963 betreffende
    de verzoeken van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten van oorsprong uit derde landen, die in de andere
    Lid-Staten in het vrije verkeer zijn gebracht, van communautaire behandeling uit
    te sluiten'
  type: main
