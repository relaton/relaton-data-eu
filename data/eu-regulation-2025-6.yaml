title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/6 of 6 January 2025 prohibiting
    the introduction into the Union of specimens of certain species of wild fauna
    and flora in accordance with Council Regulation (EC) No 338/97 on the protection
    of species of wild fauna and flora by regulating trade therein and repealing Commission
    Implementing Regulation (EU) 2023/2770
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/6 de la Commission du 6 janvier 2025
    interdisant l’introduction dans l’Union de spécimens de certaines espèces
    de faune et de flore sauvages conformément au règlement (CE) no 338/97 du Conseil
    relatif à la protection des espèces de faune et de flore sauvages par le contrôle
    de leur commerce et abrogeant le règlement d’exécution (UE) 2023/2770 de la
    Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/6 der Kommission vom 6. Januar 2025
    zum Verbot der Einfuhr von Exemplaren bestimmter Arten wild lebender Tiere und
    Pflanzen in die Union gemäß der Verordnung (EG) Nr. 338/97 des Rates über den
    Schutz von Exemplaren wild lebender Tier- und Pflanzenarten durch Überwachung
    des Handels und zur Aufhebung der Durchführungsverordnung (EU) 2023/2770 der
    Kommission
  type: main
- language: bg
