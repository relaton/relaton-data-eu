    hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/6 della Commissione, del 6 gennaio
    2025, che vieta l’introduzione nell’Unione di esemplari di talune specie di
    flora e fauna selvatiche in conformità del regolamento (CE) n. 338/97 del Consiglio
