id: EURegulation15211978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1521/78 of 30 June 1978 re-establishing
    the levying of the customs duties on other illuminating glassware, signalling
    glassware and optical elements of glass, not optically worked nor of optical glass,
    falling within subheading 70.14 B, originating in Hong Kong to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1521/78 de la Commission, du 30 juin 1978, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d'éclairage, de signalisation et d'optique commune, autres, de la sous- position
    tarifaire 70.14 B, originaires de Hong-Kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1521/78 der Kommission vom 30. Juni 1978 zur Wiedereinführung
    des Zollsatzes für andere Glaswaren für Beleuchtung, für Signalvorrichtungen
    oder zu optischen Zwecken der Tarifstelle 70.14 B, mit Ursprung in Hongkong, dem
    die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1521/78 af 30. juni 1978 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas; refleksglas; optiske
    artikler af glas, i andre tilfælde, under underposition 70.14 B, som har oprindelse
    i Hongkong og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1521/78 della Commissione, del 30 giugno 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune, altri, della sottovoce doganale 70.14 B,
    originari di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1521/78 van de Commissie van 30 juni 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen van glas; optische elementen van gewoon glas,
    niet optisch bewerkt, van post 70.14 B, van oorsprong uit Hong-Kong, ten behoeve
    waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
