id: EUDecision19801198
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 27 November 1980 authorizing the French Republic
    not to apply Community treatment to parkas, anoraks, windcheaters, waisted jackets
    and the like, woven, originating in the Philippines (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 27 novembre 1980, autorisant la République
    française à exclure du traitement communautaire les "parkas", anoraks, blousons
    et similaires, tissés, originaires des Philippines (Le texte en langue française
    est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 27. November 1980 zur Ermächtigung der
    Französischen Republik, aus den Philippinen stammende Parkas, Anoraks, Windjacken
    und dergleichen, aus Geweben, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 27. november 1980 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage parca-coats, anorakker, vindjakker,
    blousonjakker og lignende, vævede, med oprindelse i Filippinerne (Kun den franske
    udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 27 novembre 1980, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario eskimo, giacche a vento e giubbotti
    con o senza cappuccio e simili, tessuti, originari delle Filippine (Il testo in
    lingua francese è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 27 november 1980 houdende machtiging van
    de Franse Republiek om parka's, anoraks, windjakken en dergelijke, geweven, van
    oorsprong uit de Filippijnen van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)
  type: main
