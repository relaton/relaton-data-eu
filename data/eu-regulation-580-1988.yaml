title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 580/88 of 29 February 1988 establishing, for
    the period from 1 March to 30 June 1988, certain measures for the conservation
    and management of fishery resources applicable to vessels flying the Japanese
    flag in waters falling under the sovereignty or jurisdiction of Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 580/88 du Conseil du 29 février 1988 fixant, pour
    la période du 1er mars au 30 juin 1988, certaines mesures de conservation et
    de gestion des ressources de pêche applicables aux navires battant pavillon japonais
    dans les eaux sous souveraineté ou sous juridiction du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 580/88 des Rates vom 29. Februar 1988 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter japanischer Flagge in den der Hoheitsgewalt oder der Gerichtsbarkeit
    Portugals unterstehenden Gewässern für die Zeit vom 1. März bis zum 30. Juni
    1988
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 580/88 af 29. februar 1988 om fastsættelse,
    for perioden 1. marts til 30. juni 1988, af visse foranstaltninger til bevarelse
    og forvaltning af fiskeressourcerne for fartøjer, der fører japansk flag, i
    farvandene under Portugals højhedsområde eller jurisdiktion
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 580/88 του Συμβουλίου
    της 29ης Φεβρουαρίου 1988 για τον καθορισμό, κατά
    το διάστημα από την 1η Μαρτίου έως τις 30 Ιουνίου
    1988, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων, που εφαρμόζονται για
    τα σκάφη υπό ιαπωνική σημαία στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 580/88 del Consiglio del 29 febbraio 1988 che stabilisce
    per il periodo dal 1° marzo al 30 giugno 1988 talune misure di conservazione
    e di gestione delle risorse ittiche applicabili alle navi battenti bandiera giapponese
    nelle acque soggette alla sovranità o alla giurisdizione del Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 580/88 van de Raad van 29 februari 1988 tot vaststelling,
    voor het tijdvak van 1 maart tot en met 30 juni 1988, van bepaalde maatregelen
    voor de instandhouding en het beheer van de visbestanden welke gelden voor vaartuigen
    die de vlag van Japan voeren en vissen in de wateren die onder de soevereiniteit
    of de jurisdictie van Portugal vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 580/88 do Conselho de 29 de Fevereiro de 1988 que
    fixa, para o período compreendido entre 1 de Março e 30 de Junho de 1988, determinadas
    medidas de conservação e de gestão dos recursos da pesca aplicáveis aos navios
    arvorando pavilhão japonês nas águas sob soberania ou jurisdição de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 580/88 del Consejo de 29 de febrero de 1988 por el
    que se establecen para el período comprendido entre el 1 de marzo y el 30 de
    junio de 1988 determinadas medidas de conservación y de gestión de los recursos
    de la pesca, aplicables a los barcos que naveguen bajo pabellón japonés en las
    aguas sometidas a la soberanía o a la jurisdicción de Portugal
  type: main
