id: EUDecision198422
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '84/22/EEC: Commission Decision of 22 December 1983 authorizing the Italian
    Republic to extend intra- Community surveillance in respect of imports of bananas
    originating in certain third countries and put into free circulation in the other
    Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/22/CEE: Décision de la Commission du 22 décembre 1983 autorisant
    la République italienne à proroger les mesures de surveillance intracommunautaire
    à l''égard des importations de bananes originaires de certains pays tiers et
    mises en libre pratique dans les autres Etats membres (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/22/EWG: Entscheidung der Kommission vom 22. Dezember 1983 zur Ermächtigung
    Italiens zur Verlängerung einer innergemeinschaftlichen Überwachung der Einfuhren
    von aus bestimmten Drittländern stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Bananen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/22/EØF: Kommissionens beslutning af 22. december 1983 om bemyndigelse
    af Den italienske Republik til at forlænge foranstaltninger med henblik på tilsyn
    inden for Fællesskabet med indførsel af bananer, der har oprindelse i visse
    tredjelande, og som er overgået til fri omsætning i de øvrige medlemsstater
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/22/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1983 περί χορηγήσεως αδείας στην Ιταλική Δημοκρατία
    να παρατείνει την ενδοκοινοτική επιτήρηση
    όσον αφορά τις εισαγωγές μπανανών καταγωγής
    ορισμένων τρίτων χωρών οι οποίες τίθενται
    σε ελεύθερη κυκλοφορία στα άλλα κράτη μέλη
    (Το κείμενο στην ιταλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/22/CEE: Decisione della Commissione del 22 dicembre 1983 che autorizza
    la Repubblica italiana a prorogare le misure di sorveglianza intracomunitaria
    nei confronti delle banane originarie di taluni paesi terzi e messe in libera
    pratica negli altri Stati membri (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '84/22/EEG: Beschikking van de Commissie van 22 december 1983 waarbij de
    Italiaanse Republiek wordt gemachtigd maatregelen inzake intracommunautair toezicht
    te verlengen ten aanzien van bananen van oorsprong uit bepaalde derde landen en
    in de andere Lid-Staten in het vrije verkeer gebracht (Slechts de tekst in de
    Italiaanse taal is authentiek)'
  type: main
