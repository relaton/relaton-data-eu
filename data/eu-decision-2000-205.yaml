    conclusione di un accordo in forma di scambio di lettere tra la Comunità europea
    e il Regno del Marocco riguardante talune modifiche degli allegati 2, 3, 4 e 6
    dell''accordo euromediterraneo che istituisce un''associazione tra le Comunità
    europee e i loro Stati membri, da una parte, e il Regno del Marocco, dall''altra'
  type: main
