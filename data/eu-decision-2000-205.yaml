title:
- language: en
  script: Latn
  content: '2000/205/EC: Council Decision of 28 February 2000 concerning the conclusion
    of an Agreement in the form of an Exchange of Letters between the European Community
    and the Kingdom of Morocco concerning certain amendments to Annexes 2, 3, 4 and
    6 to the Euro-Mediterranean Agreement establishing an association between the
    European Communities and their Member States, of the one part, and the Kingdom
    of Morocco, of the other part'
  type: main
- language: fr
  script: Latn
  content: '2000/205/CE: Décision du Conseil du 28 février 2000 relative à la conclusion
