    az Európai Közösségek és azok tagállamai, és másrészről a Marokkói
    Királyság közötti társulást létrehozó euro-mediterrán megállapodás
    2., 3., 4., és 6. mellékletének egyes módosításairól szóló megállapodás
    megkötéséről
  type: main
- language: it
  script: Latn
