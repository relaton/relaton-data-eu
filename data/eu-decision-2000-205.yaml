    et le Royaume du Maroc concernant certaines modifications des annexes 2, 3, 4
    et 6 de l''accord euro-méditerranéen établissant une association entre les
    Communautés européennes et leurs États membres, d''une part, et le Royaume
    du Maroc, d''autre part'
  type: main
- language: de
