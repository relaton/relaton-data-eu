title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1713/1999 of 30 July 1999 determining the
    extent to which applications lodged in July 1999 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 1474/95 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1713/1999 de la Commission, du 30 juillet 1999, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1999 pour certains produits du secteur des oeufs et de la viande de
    volaille dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96 peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1713/1999 der Kommission vom 30. Juli 1999 über die
    Festsetzung des Umfangs, in dem die im Juli 1999 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1713/1999 af 30. juli 1999 om fastsættelse
