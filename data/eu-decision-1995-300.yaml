    alueilla ja neuvoston päätöksen 89/21/ETY kumoamisesta tehdyn päätöksen
    94/887/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '95/300/CE: Decisione della Commissione, del 26 luglio 1995, recante modifica
