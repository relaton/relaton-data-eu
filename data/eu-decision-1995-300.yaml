  content: '95/300/EC: Commission Decision of 26 July 1995 amending Decision 94/887/EC
    derogating from prohibitions relating to African swine fever for certain areas
    in Spain and repealing Council Decision 89/21/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/300/CE: Décision de la Commission, du 26 juillet 1995, modifiant la
    décision 94/887/CE dérogeant aux interdictions liées à la peste porcine africaine
    pour certaines parties du territoire de l'' Espagne et abrogeant la décision
    89/21/CEE du Conseil'
  type: main
- language: de
  script: Latn
