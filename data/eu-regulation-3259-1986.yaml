  content: Commission Regulation (EEC) No 3259/86 of 27 October 1986 re-establishing
    the levying of customs duties on electrical capacitors, fixed or variable, falling
    within heading No 85.18, originating in Malaysia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
