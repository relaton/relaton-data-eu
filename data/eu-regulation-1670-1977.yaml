title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1670/77 of 22 July 1977 re-establishing
    the levying of the customs duties on heavy oils falling within subheadings 27.10
    C I c), II c), III c) and d), originating in Venezuela, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1670/77 de la Commission, du 22 juillet 1977, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole lourdes, des sous-positions tarifaires 27.10 C I c), II c), III c) et
    d), originaires du Venezuela bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1670/77 der Kommission vom 22. Juli 1977 zur Wiedereinführung
    des Zollsatzes für Schweröle der Tarifstellen 27.10 C I c), II c), III c) und
    d), mit Ursprung in Venezuela, dem die in der Verordnung (EWG) Nr. 3021/ 76 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1670/77 af 22. juli 1977 om genindførelse
    af opkrævning af toldafgifter for tunge olier under underposition 27.10 C I c),
    II c), III c) og d), som har oprindelse i Venezuela og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1670/77 della Commissione, del 22 luglio 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli oli pesanti delle
    sottovoci doganali 27.10 C I c), C II c), C III c), d), originari del Venezuela
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1670/77 van de Commissie van 22 juli 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op zware oliën,
    van post 27.10 C I c), II c), III c) en d), van oorsprong uit Venezuela, ten behoeve
    waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
