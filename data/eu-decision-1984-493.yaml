title:
- language: en
  script: Latn
  content: '84/493/EEC: Commission Decision of 8 October 1984 concerning the zones
    referred to in Article 2 (3) of Regulation (EEC) No 2616/80 instituting a specific
    Community regional development measure contributing to overcoming constraints
    on the development of new economic activities in certain zones adversely affected
    by restructuring of the steel industry (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/493/CEE: Décision de la Commission du 8 octobre 1984 relative aux
    zones visées à l''article 2 paragraphe 3 du règlement (CEE) n° 2616/80 instituant
    une action communautaire spécifique de développement régional contribuant à
    l''élimination des obstacles au développement de nouvelles activités économiques
    dans certaines zones affectées par la restructuration de l''industrie sidérurgique
    (Les textes en langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/493/EWG: Entscheidung der Kommission vom 8. Oktober 1984 bezüglich
    der Gebiete gemäß Artikel 2 Absatz 3 der Verordnung (EWG) Nr. 2616/80 zur Einführung
    einer spezifischen Gemeinschaftsmaßnahme zur regionalen Entwicklung im Hinblick
    auf die Beseitigung von Entwicklungshemmnissen für neue Wirtschaftszweige in
    bestimmten von der Umstrukturierung der Eisen- und Stahlindustrie betroffenen
    Gebieten (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/493/EØF: Kommissionens beslutning af 8. oktober 1984 om de områder,
    der er omhandlet i artikel 2, stk. 3, i forordning (EØF) nr. 2616/80 om gennemførelse
    af en særlig fællesskabsaktion med henblik på regionaludvikling, der skal bidrage
    til at fjerne hindringerne for udviklingen af nye økonomiske aktiviteter i visse
    områder, der er berørt af strukturomlægningen i jern- og stålindustrien (Kun
    de franske og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '84/493/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Οκτωβρίου
    1984 για τις ζώνες οι οποίες αναφέρονται στο
    άρθρο 2 παράγραφος 3 του κανονισμού (ΕΟΚ) αριθ.
    2616/80 περί ανάληψης ειδικής κοινοτικής ενέργειας
    περιφερειακής ανάπτυξης για τη συμβολή στην
    εξάλειψη των εμποδίων στην ανάπτυξη νέων οικονομικών
    δραστηριοτήτων σε ορισμένες ζώνες που θίγονται
    από την αναδιάρθρωση της βιομηχανίας σιδήρου
    και χάλυβα (Τα κείμενα στη γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '84/493/CEE: Decisione della Commissione dell''8 ottobre 1984 relativa
    alle zone di cui all''articolo 2, paragrafo 3, del regolamento (CEE) n. 2616/80
    che istituisce un''azione comunitaria specifica di sviluppo regionale per contribuire
    ad eliminare gli ostacoli allo sviluppo di nuove attività economiche in talune
    zone colpite dalla ristrutturazione dell''industria siderurgica (I testi in lingua
    francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '84/493/EEG: Beschikking van de Commissie van 8 oktober 1984 betreffende
    de gebieden als bedoeld in artikel 2, lid 3, van Verordening (EEG) nr. 2616/80
    tot instelling van een specifieke communautaire actie voor regionale ontwikkeling
    om bij te dragen tot de uitschakeling van de hinderpalen voor de ontwikkeling
    van nieuwe economische activiteiten in sommige door de herstructurering van de
    ijzer- en staalindustrie getroffen zones (Slechts de teksten in de Franse en de
    Nederlandse taal zijn authentiek)'
