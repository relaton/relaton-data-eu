---
id: EURegulation20232485
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/2485 of 27 June 2023 amending
    Delegated Regulation (EU) 2021/2139 establishing additional technical screening
    criteria for determining the conditions under which certain economic activities
    qualify as contributing substantially to climate change mitigation or climate
    change adaptation and for determining whether those activities cause no significant
    harm to any of the other environmental objectives
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/2485 de la Commission du 27 juin 2023 modifiant
    le règlement délégué (UE) 2021/2139 par des critères d’examen technique
    supplémentaires permettant de déterminer à quelles conditions certaines activités
    économiques peuvent être considérées comme contribuant substantiellement à
    l’atténuation du changement climatique ou à l’adaptation à celui-ci et
    si ces activités ne causent de préjudice important à aucun des autres objectifs
    environnementaux
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/2485 der Kommission vom 27. Juni 2023 zur
    Änderung der Delegierten Verordnung (EU) 2021/2139 durch Festlegung zusätzlicher
    technischer Bewertungskriterien, anhand deren bestimmt wird, unter welchen Bedingungen
    davon auszugehen ist, dass bestimmte Wirtschaftstätigkeiten einen wesentlichen
    Beitrag zum Klimaschutz oder zur Anpassung an den Klimawandel leisten, und anhand
    deren bestimmt wird, ob diese Tätigkeiten erhebliche Beeinträchtigungen eines
    der übrigen Umweltziele vermeiden
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/2485 на Комисията
    от 27 юни 2023 година за изменение на Делегиран
    регламент (ЕС) 2021/2139, с който се установяват
    допълнителни технически критерии за проверка
    с цел определяне на условията, при които дадени
    икономически дейности се квалифицират като
    допринасящи съществено за смекчаването на
    изменението на климата или за адаптирането
    към изменението на климата, и с цел определяне
    дали тези икономически дейности не нанасят
    значителни вреди във връзка с постигането
    на някоя от другите екологични цели
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/2485 ze dne 27. června
    2023, kterým se mění nařízení v přenesené pravomoci (EU) 2021/2139 stanovující
    další technická screeningová kritéria pro určení toho, za jakých podmínek
    se určité hospodářské činnosti kvalifikují jako významně přispívající
    ke zmírňování změny klimatu nebo k přizpůsobování se změně klimatu,
    a toho, zda tyto hospodářské činnosti významně nepoškozují některý z
    dalších environmentálních cílů
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/2485 af 27. juni 2023 om
    ændring af delegeret forordning (EU) 2021/2139 om fastsættelse af yderligere
    tekniske screeningskriterier til bestemmelse af de betingelser, hvorunder visse
    økonomiske aktiviteter kvalificeres som bidragende væsentligt til modvirkning
    af klimaændringer eller tilpasning til klimaændringer, og til fastlæggelse
    af, hvorvidt sådanne aktiviteter er til væsentlig skade for nogle af de andre
    miljømål
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2023/2485
    της Επιτροπής, της 27ης Ιουνίου 2023, για την τροποποίηση
    του κατ’ εξουσιοδότηση κανονισμού (ΕΕ) 2021/2139
    με τη θέσπιση τεχνικών κριτηρίων ελέγχου για
    τον προσδιορισμό των προϋποθέσεων υπό τις
    οποίες ορισμένες οικονομικές δραστηριότητες
    θεωρείται ότι συμβάλλουν σημαντικά στον μετριασμό
    της κλιματικής αλλαγής ή στην προσαρμογή στην
    κλιματική αλλαγή και για τον προσδιορισμό
    του κατά πόσον αυτές οι οικονομικές δραστηριότητες
    δεν βλάπτουν σημαντικά οποιονδήποτε από τους
    άλλους περιβαλλοντικούς στόχους
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2023/2485, 27. juuni 2023, millega
    muudetakse delegeeritud määrust (EL) 2021/2139, kehtestades täiendavad tehnilised
    sõelumiskriteeriumid, millega määratakse kindlaks, millistel tingimustel võib
    teatavat majandustegevust pidada kliimamuutuste leevendamisele või nendega kohanemisele
    oluliselt kaasa aitavaks, ja mille alusel otsustatakse, ega see majandustegevus
    ei kahjusta oluliselt muid keskkonnaeesmärke
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2023/2485, annettu 27 päivänä kesäkuuta
    2023, asetuksen (EU) 2021/2139 muuttamisesta vahvistamalla täydentäviä teknisiä
    arviointikriteereitä, joilla määritetään, millä edellytyksillä taloudellista
    toimintaa pidetään ilmastonmuutoksen hillintää tai ilmastonmuutokseen sopeutumista
    merkittävästi edistävänä ja aiheuttaako kyseinen taloudellinen toiminta merkittävää
    haittaa millekään muulle ympäristötavoitteelle
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2023/2485 ón gCoimisiún an 27 Meitheamh 2023
    lena leasaítear Rialachán Tarmligthe (AE) 2021/2139 lena mbunaítear critéir
    scagtha theicniúla bhreise chun na coinníollacha a chinneadh faoina bhfuil gníomhaíochtaí
    eacnamaíocha áirithe cáilithe mar rannchuidiú substaintiúil le maolú ar
    an athrú aeráide nó le hoiriúnú don athrú aeráide agus chun a chinneadh
    cé acu a dhéantar nó nach ndéantar dochar suntasach leis na gníomhaíochtaí
    eacnamaíocha sin d’aon cheann de na cuspóirí comhshaoil eile
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/2485 оd 27. lipnja 2023. o izmjeni
    Delegirane uredbe (EU) 2021/2139 utvrđivanjem dodatnih kriterija tehničke provjere
    na temelju kojih se određuje pod kojim se uvjetima smatra da određene ekonomske
    djelatnosti znatno pridonose ublažavanju klimatskih promjena ili prilagodbi klimatskim
    promjenama i nanose li te djelatnosti bitnu štetu kojem drugom okolišnom cilju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/2485 felhatalmazáson alapuló rendelete (2023.
    június 27.) az (EU) 2021/2139 felhatalmazáson alapuló rendeletnek az éghajlatváltozás
    mérsékléséhez és az éghajlatváltozáshoz való alkalmazkodáshoz lényegesen
    hozzájáruló és az egyéb környezeti célkitűzéseket jelentősen nem sértő
    gazdasági tevékenységekkel szemben támasztott követelmények meghatározásához
    szükséges további technikai vizsgálati kritériumok tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/2485 della Commissione, del 27 giugno 2023,
    che modifica il regolamento delegato (UE) 2021/2139 fissando i criteri di vaglio
    tecnico supplementari che consentono di determinare a quali condizioni si possa
    considerare che talune attività economiche contribuiscono in modo sostanziale
    alla mitigazione dei cambiamenti climatici o all’adattamento ai cambiamenti
    climatici e se non arrecano un danno significativo a nessun altro obiettivo ambientale
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/2485 (2023. gada 27. jūnijs), ar
    ko Deleģēto regulu (ES) 2021/2139 groza, ieviešot papildu tehniskās pārbaudes
    kritērijus, pēc kuriem nosaka, ar kādiem nosacījumiem konkrētas saimnieciskās
    darbības ir uzskatāmas par tādām, kas būtiski sekmē klimata pārmaiņu mazināšanu
    vai pielāgošanos klimata pārmaiņām, un pēc kuriem nosaka, vai šīs darbības
    nenodara būtisku kaitējumu kādam no pārējiem vidiskajiem mērķiem
  type: main
- language: lt
  script: Latn
  content: 2023 m. birželio 27 d. Komisijos deleguotasis reglamentas (ES) 2023/2485,
    kuriuo dėl papildomų techninės analizės kriterijų, pagal kuriuos nustatoma,
    kokiomis sąlygomis tam tikra ekonominė veikla laikytina svariai prisidedančia
    prie klimato kaitos švelninimo arba prisitaikymo prie jos ir ar ta ekonominė
    veikla nedaro reikšmingos žalos kitiems aplinkos tikslams, iš dalies keičiamas
    Deleguotasis reglamentas (ES) 2021/2139
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/2485 tas-27 ta’ Ġunju 2023
    li jemenda r-Regolament Delegat (UE) 2021/2139 billi jistabbilixxi l-kriterji
    tekniċi ta’ skrinjar addizzjonali biex jiġu ddeterminati l-kundizzjonijiet
    li skonthom ċerti attivitajiet ekonomiċi jikkwalifikaw bħala li jikkontribwixxu
    sostanzjalment għall-mitigazzjoni tat-tibdil fil-klima jew għall-adattament
    għat-tibdil fil-klima u sabiex jiġi ddeterminat jekk dawk l-attivitajiet ma
    jikkawżawx ħsara sinifikanti lil xi wieħed mill-objettivi ambjentali l-oħra
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/2485 van de Commissie van 27 juni 2023
    tot wijziging van Gedelegeerde Verordening (EU) 2021/2139 door vaststelling van
    aanvullende technische screeningcriteria om de voorwaarden te bepalen waaronder
    specifieke economische activiteiten kunnen worden aangemerkt als substantieel
    bijdragend aan de mitigatie van klimaatverandering of de adaptatie aan klimaatverandering,
    en om uit te maken of die activiteiten niet ernstig afbreuk doen aan een van de
    andere milieudoelstellingen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/2485 z dnia 27 czerwca 2023
    r. zmieniające rozporządzenie delegowane (UE) 2021/2139 ustanawiające dodatkowe
    techniczne kryteria kwalifikacji służące określeniu warunków, na jakich niektóre
    rodzaje działalności gospodarczej kwalifikują się jako wnoszące istotny wkład
    w łagodzenie zmian klimatu lub w adaptację do zmian klimatu, a także określeniu,
    czy działalność ta nie wyrządza poważnych szkód względem żadnego z pozostałych
    celów środowiskowych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/2485 da Comissão, de 27 de junho de 2023,
    que altera o Regulamento Delegado (UE) 2021/2139 mediante o estabelecimento de
    critérios técnicos de avaliação adicionais para determinar em que condições
    determinadas atividades económicas são qualificadas como contribuindo substancialmente
    para a mitigação das alterações climáticas ou para a adaptação às alterações
    climáticas e estabelecer se essas atividades não prejudicam significativamente
    o cumprimento de nenhum dos outros objetivos ambientais
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/2485 al Comisiei din 27 iunie 2023 de modificare
    a Regulamentului delegat (UE) 2021/2139 prin stabilirea unor criterii tehnice
    de examinare suplimentare pentru a determina condițiile în care anumite activități
    economice se califică drept activități care contribuie în mod substanțial
    la atenuarea schimbărilor climatice sau la adaptarea la schimbările climatice
    și pentru a stabili dacă activitățile respective nu aduc prejudicii semnificative
    vreunuia dintre celelalte obiective de mediu
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/2485 z 27. júna 2023, ktorým
    sa mení delegované nariadenie (EÚ) 2021/2139 stanovením dodatočných technických
    kritérií preskúmania na určenie podmienok, za ktorých sa určité hospodárske
    činnosti označujú za významne prispievajúce k zmierneniu zmeny klímy alebo
    adaptácii na zmenu klímy, a na určenie toho, či tieto činnosti výrazne nenarúšajú
    plnenie niektorého z iných environmentálnych cieľov
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/2485 z dne 27. junija 2023 o spremembi
    Delegirane uredbe (EU) 2021/2139 z določitvijo dodatnih tehničnih meril za pregled
    za določitev pogojev, pod katerimi se šteje, da določene gospodarske dejavnosti
    bistveno prispevajo k blažitvi podnebnih sprememb ali prilagajanju podnebnim
    spremembam, in za ugotavljanje, ali te gospodarske dejavnosti ne škodujejo bistveno
    kateremu od drugih okoljskih ciljev
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/2485 de la Comisión, de 27 de junio de 2023,
    que modifica el Reglamento Delegado (UE) 2021/2139 por el que se establecen criterios
    técnicos de selección adicionales para determinar las condiciones en las que
    se considera que una actividad económica contribuye de forma sustancial a la
    mitigación del cambio climático o a la adaptación al mismo, y para determinar
    si esa actividad económica no causa un perjuicio significativo a ninguno de los
    demás objetivos medioambientales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/2485 av den 27 juni 2023
    om ändring av delegerad förordning (EU) 2021/2139 om fastställande av ytterligare
    tekniska granskningskriterier för att avgöra under vilka villkor vissa ekonomiska
    verksamheter ska anses bidra väsentligt till begränsningen av eller anpassningen
    till klimatförändringarna och för att avgöra om dessa verksamheter inte orsakar
    någon betydande skada för något av de andra miljömålen
  type: main
