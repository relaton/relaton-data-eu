title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 944/80 of 14 April 1980 re-establishing
    the levying of customs duties on other made up textile articles, products of category
    112 (code 1120), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 944/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, de la catégorie 112 (code 1120), originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 944/80 der Kommission vom 14. April 1980 über die
    Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben
    der Warenkategorie Nr. 112 (Kennziffer 1120), mit Ursprung in China, dem die in
    der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 944/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer under varekategori
    nr. 112 (kode 1120), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 944/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli altri manufatti confezionati
    di tessuti, della categoria di prodotti n. 112 (codice 1120), originari della
    Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 944/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geconfectioneerde
    artikelen van weefsels van de categorie van produkten nr. 112 (codenummer 1120),
    van oorsprong uit China waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
