title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1081/96 of 14 June 1996 establishing a reference
    method for the detection of cows' milk and caseinate in cheeses made from ewes'
    milk, goats' milk or buffalos' milk or mixtures of ewes', goats' and buffalos'
    milk and repealing Regulation (EEC) No 690/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1081/96 de la Commission du 14 juin 1996 établissant
