    nei formaggi prodotti con latte di pecora, con latte di capra o con latte di bufala
    o con miscele di tali latti e che abroga il regolamento (CEE) n. 690/92
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1081/96 van de Commissie van 14 juni 1996 tot vaststelling
    van een referentiemethode voor de opsporing van koemelk en koemelkcaseïnaat in
