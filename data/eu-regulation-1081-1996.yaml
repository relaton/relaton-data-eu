    Ziegen- oder Büffelmilch oder Mischungen von Schaf-, Ziegen- und Büffelmilch
    sowie zur Aufhebung der Verordnung (EWG) Nr. 690/92
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1081/96 af 14. juni 1996 om en referencemetode
