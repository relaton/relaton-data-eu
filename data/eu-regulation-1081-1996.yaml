    της 14ης Ιουνίου 1996 που αφορά τη θέσπιση μεθόδου
    αναφοράς για την ανίχνευση αγελαδινού γάλακτος
    και, καζεϊνικών αλάτων σε τυριά από πρόβειο,
    κατσικίσιο ή βουβαλίσιο γάλα ή από μείγματα
    πρόβειου, κατσικίσιου και βουβαλίσιου γάλακτος
    και περί κατάργησης του κανονισμού (ΕΟΚ) αριθ.
    690/92
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1081/96, annettu 14 päivänä kesäkuuta 1996,
