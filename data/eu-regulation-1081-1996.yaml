    dans les fromages à base de lait de brebis, de lait de chèvre ou de lait de
    bufflonne ou de mélanges de lait de brebis, de chèvre et de bufflonne et abrogeant
    le règlement (CEE) nº 690/92
  type: main
- language: de
  script: Latn
