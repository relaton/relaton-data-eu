id: EUDecision1989420
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '89/420/EEC: Commission Decision of 3 July 1989 recognizing Spain as an
    officially swine-fever free Member State within the context of eradication, and
    amending for the second time Decision 81/400/EEC establishing the status of Member
    States as regards classical swine fever with a view to its eradication'
  type: main
- language: fr
  script: Latn
  content: '89/420/CEE: Décision de la Commission du 3 juillet 1989 reconnaissant
    l''Espagne comme État membre officiellement indemne de peste porcine dans le
    cadre de l''éradication et portant deuxième modification de la décision 81/400/CEE
    établissant le statut des États membres en ce qui concerne la peste porcine
    classique en vue de son éradication'
  type: main
- language: de
  script: Latn
  content: '89/420/EWG: Entscheidung der Kommission vom 3. Juli 1989 zur Anerkennung
    Spaniens als amtlich schweinepestfrei im Rahmen der Seuchentilgung und zur zweiten
    Änderung der Entscheidung 81/400/EWG über die Festlegung des Status der Mitgliedstaaten
    hinsichtlich der Ausmerzung der klassischen Schweinepest'
  type: main
- language: da
  script: Latn
  content: '89/420/EØF: Kommissionens Beslutning af 3. juli 1989 om anerkendelse
    af Spanien som værende officielt fri for svinepest i forbindelse med udryddelsen
    af denne sygdom og om anden ændring af beslutning 81/400/EØF om fastlæggelse
    af medlemsstaternes status i forbindelse med udryddelse af klassisk svinepest'
  type: main
- language: el
  script: Grek
  content: '89/420/ΕΟΚ: Απόφαση της Επιτροπής της 3ης Ιουλίου
    1989 για την αναγνώριση της Ισπανίας ως κράτους
    μέλους επίσημα απαλλαγμένου από την πανώλη
    των χοίρων στο πλαίσιο του προγράμματος εξάλειψης
    της ασθένειας αυτής και για τη δεύτερη τροποποίηση
    της απόφασης 81/400/ΕΟΚ περί καθορισμού του καθεστώτος
    των κρατών μελών όσον αφορά την κλασική πανώλη
    των χοίρων με στόχο την εξάλειψή της'
  type: main
- language: fi
  script: Latn
  content: '89/420/ETY: Komission päätös, tehty 3 päivänä heinäkuuta 1989,
    Espanjan vahvistamisesta virallisesti sikarutosta vapaaksi jäsenvaltioksi taudin
    hävittämisen yhteydessä ja jäsenvaltioiden aseman vahvistamisesta klassisen
    sikaruton hävittämisen yhteydessä tehdyn päätöksen 81/400/ETY muuttamisesta
    toisen kerran'
  type: main
- language: it
  script: Latn
  content: '89/420/CEE: Decisione della Commissione del 3 luglio 1989 che nel contesto
    del piano di eradicazione riconosce ufficialmente indenne dalla peste suina il
    territorio della Spagna e modifica per la seconda volta la decisione 81/400/CEE,
    che stabilisce lo status degli Stati membri nei confronti della peste suina classica
    in vista dell''eradicazione di tale malattia'
  type: main
- language: nl
  script: Latn
  content: '89/420/EEG: Beschikking van de Commissie van 3 juli 1989 waarbij Spanje
    als officieel vrij van varkenspest wordt erkend in het kader van de uitroeiing
    van die ziekte en houdende tweede wijziging van Beschikking 81/400/EEG houdende
    vaststelling van de status van de Lid-Staten ten aanzien van de uitroeiing van
    klassieke varkenspest'
  type: main
- language: pt
  script: Latn
  content: '89/420/CEE: Decisão da Comissão de 3 de Julho de 1989 que reconhece
    o Reino de Espanha como um Estado-membro oficialmente indemne de peste suína,
    no contexto da erradicação da doença, e altera pela segunda vez a Decisão
    81/400/CEE, que estabelece o estatuto dos Estados-membros relativo à peste suína
    clássica para erradicação desta'
  type: main
- language: es
  script: Latn
  content: '89/420/CEE: Decisión de la Comisión de 3 de julio de 1989 por la que
    en el marco de un plan de erradicación, se reconoce a España como Estado miembro
    oficialmente indemne de peste porcina, y se modifica por segunda vez la Decisión
    81/400/CEE por la que se establece el estatuto de los Estados miembros en lo que
    respecta a la peste porcina clásica a fin de lograr su erradicación'
  type: main
- language: sv
  script: Latn
  content: '89/420/EEG: Kommissionens beslut av den 3 juli 1989 om att förklara Spanien
    officiellt fritt från svinpest i samband med bekämpningen av denna sjukdom samt
    om andra ändringen av beslut 81/400/EEG om fastställande av medlemsstaternas
    status ifråga om bekämpningen av klassisk svinpest'
  type: main
