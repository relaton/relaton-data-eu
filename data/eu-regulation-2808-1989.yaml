title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2808/89 of 18 September 1989 imposing a definitive
    anti-dumping duty on imports of calcium metal originating in the people's Republic
    of China and the Soviet Union and definitively collecting the provisional anti-dumping
    duty imposed on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2808/89 du Conseil du 18 septembre 1989 instituant
    un droit antidumping définitif sur les importations de calcium-métal originaires
    de la République populaire de Chine et d'Union soviétique et portant perception
    définitive du droit antidumping provisoire institué sur ces importations
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2808/89 DES RATES vom 18. September 1989 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Calcium-Metall mit Ursprung
    in der Volksrepublik China und der Sowjetunion und zur endgültigen Vereinnahmung
    der vorläufigen Antidumpingzölle auf diese Einfuhren #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2808/89 af 18. september 1989 om indførelse
    af en endelig antidumpingtold på importen af calciummetal med oprindelse i Den
    Kinesiske Folkerepublik og Sovjetunionen og om endelig opkrævning af den midlertidige
    antidumpingtold på denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2808/89 του Συμβουλίου
    της 18ης Σεπτεμβρίου 1989 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές μεταλλικού
    ασβεστίου καταγωγής Λαϊκής Δημοκρατίας της
    Κίνας και Σοβιετικής Ένωσης και την οριστική
    είσπραξη του προσωρινού δασμού αντιντάμπινγκ
    που επιβάλλεται στις εισαγωγές αυτές
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2808/89 DEL CONSIGLIO del 18 settembre 1989 che istituisce
    un dazio antidumping definitivo sulle importazioni di calcio metallico originario
    della Repubblica popolare cinese e dell'' Unione Sovietica e che decide la riscossione
    definitiva del dazio antidumping provvisorio istituito su dette importazioni #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2808/89 VAN DE RAAD van 18 september 1989 tot instelling
