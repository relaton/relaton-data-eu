id: EUDecision1978769
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 September 1978 authorizing Ireland not to apply
    Community treatment to jerseys, pullovers, slip-overs, twinsets, cardigans, bedjackets
    and jumpers, of wool, of cotton or of man-made textile fibres, falling within
    subheading ex 60.05 A of the Common Customs Tariff (NIMEXE codes 60.05-01; 27;
    28; 29; 30; 33; 36; 37; 38), originating in Taiwan and in free circulation in
    the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/769/CEE: Décision de la Commission, du 11 septembre 1978, autorisant
    l''Irlande à exclure du traitement communautaire les chandails, "pull-overs",
    "slip-overs", "twinsets", gilets et vestes, de laine, de coton, de fibres textiles
    synthétiques ou artificielles, de la position Ex 60.05 A du Tarif douanier commun
    (codes Nimexe : 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38), originaires de Taiwan
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. September 1978, mit der Irland ermächtigt
    wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Pullover, Slipover, Twinsets, Westen und dergleichen, aus Wolle, Baumwolle,
    synthetischen oder künstlichen Spinnstoffen, der Tarifstelle ex 60.05 A des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 60.05-01; 27; 28; 29; 30; 33; 36; 37; 38) von der
    Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 11. september 1978 om bemyndigelse af Irland
    til fra fællesskabsbehandling at undtage sweatere, pullovere, slipovere, cardigansæt,
    veste og trøjer af uld, bomuld eller syntetiske eller regenererede fibre, som
    henhører under pos. ex 60.05 A i den fælles toldtarif (NIMEXE-kode 60.05-01,
    27, 28, 29, 30, 33, 36, 37, 38), har oprindelse i Taiwan og frit kan omsættes
    i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, dell''11 settembre 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario maglie, pullover, slip-over, twinset,
    giubbotti, giacche e bluse, di lana, di cotone o di fibre sintetiche o artificiali,
    della sottovoce ex 60.05 A della tariffa doganale comune (codice Nimexe: 60.05-01,
    27, 28, 29, 30, 33, 36, 37, 38), originari di Taiwan e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 september 1978 waarbij Ierland wordt
    gemachtigd truien, jumpers, pull-overs en slip-overs, twinsets, vesten en jasjes,
    van wol, van katoen of van synthetische of van kunstmatige textielvezels, van
    post ex 60.05 A van het gemeenschappelijk douanetarief (NIMEXE-code 60.05-01,
    27, 28, 29, 30, 33, 36, 37, 38), van oorsprong uit Taiwan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
