title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 90/87 of 14 January 1987 amending Regulation
    (EEC) No 1677/85 as regards the fixing of the correcting factor to be used to
    calculate the monetary compensatory amounts applicable for certain agricultural
    products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 90/87 de la Commission du 14 janvier 1987 portant
    modification du règlement (CEE) n° 1677/85 en ce qui concerne la fixation du
    facteur de correction à retenir pour le calcul des montants compensatoires monétaires
    applicables pour certains produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 90/87 der Kommission vom 14. Januar 1987 zur Änderung
    der Verordnung (EWG) Nr. 1677/85 betreffend die Festsetzung des Berichtigungsfaktors,
    der bei der Berechnung der bei bestimmten landwirtschaftlichen Erzeugnissen anwendbaren
    Währungsausgleichsbeträge zu berücksichtigen ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 90/87 af 14. januar 1987 om ændring
    af forordning (EØF) nr. 1677/85 for så vidt angår den justeringsfaktor, der
    skal lægges til grund ved beregning af de monetære udligningsbeløb for visse
    landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 90/87 της Επιτροπής
    της 14ης Ιανουαρίου 1987 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1677/85 σχετικά με τον καθορισμό του
    διορθωτικού συντελεστή που λαμβάνεται υπόψη
    για τον υπολογισμό των νομισματικών εξισωτικών
    ποσών που εφαρμόζονται για ορισμένα γεωργικά
    προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 90/87 della Commissione del 14 gennaio 1987 che modifica
    il regolamento (CEE) n. 1677/85 per quanto riguarda la fissazione del coefficiente
    correttore da applicare in sede di calcolo degli importi compensativi monetari
    per taluni prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 90/87 van de Commissie van 14 januari 1987 tot wijziging
    van Verordening (EEG) nr. 1677/85 ten aanzien van de vaststelling van de correctiefactor
    die in aanmerking wordt genomen bij de berekening van de voor bepaalde landbouwprodukten
    toe te passen monetaire compenserende bedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 90/87 da Comissão de 14 de Janeiro de 1987 que
    altera pela quarta vez o Regulamento (CEE) n.° 1677/85 no que diz respeito à
    fixação do factor de correcção a tomar em consideração para o cálculo dos
    montantes compensatórios monetários aplicáveis para determinados produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 90/87 de la Comisión de 14 de enero de 1987 por el
    que se modifica el Reglamento (CEE) n° 1677/85 en lo que respecta a la fijación
    del factor de corrección que habrá de tenerse en cuenta para el cálculo de
    los montantes compensatorios monetarios aplicables a determinados productos agrícolas
  type: main
