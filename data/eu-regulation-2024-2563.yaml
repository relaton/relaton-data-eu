  content: Commission Implementing Regulation (EU) 2024/2563 of 24 September 2024
    amending Implementing Regulation (EU) 2022/1646 as regards additional content
    of the national risk-based control plans and the national randomised surveillance
    plan, the submission of those plans and data by Member States and minimum sampling
    frequencies
  type: main
- language: fr
  script: Latn
