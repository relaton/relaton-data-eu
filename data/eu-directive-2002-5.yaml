  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2002/5/EÜ, 30. jaanuar 2002, millega muudetakse II
    lisa direktiivis 90/642/EMÜ teatavates taimset päritolu saadustes, sealhulgas
    puu- ja köögiviljas, sisalduvate ja nende pinnal esinevate pestitsiidide jääkide
    piirnormide kehtestamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2002/5/EY, annettu 30 päivänä tammikuuta 2002,
    neuvoston direktiivin 90/642/ETY liitteen II muuttamisesta kasvikunnasta peräisin
    olevissa tietyissä tuotteissa ja niiden pinnalla, mukaan luettuina hedelmät
    ja vihannekset, olevien torjunta-ainejäämien enimmäismäärien osalta
  type: main
- language: hu
  script: Latn
