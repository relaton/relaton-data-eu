    massimi għall-fdalijiet tal-pestiċidi ġewwa u fuq ċerti prodotti li joriġinaw
    mill-pjanti, inklużi l-frott u l-ħxejjex ta’ l-ikel
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2002/5/EG van de Commissie van 30 januari 2002 houdende wĳziging
    van bĳlage II bĳ Richtlĳn 90/642/EEG van de Raad betreffende de vaststelling
    van maximumgehalten aan residuen van bestrĳdingsmiddelen in en op bepaalde producten
    van plantaardige oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2002/5/WE z dnia 30 stycznia 2002 r. zmieniająca załącznik
    II do dyrektywy Rady 90/642/EWG w odniesieniu do ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów w niektórych produktach pochodzenia roślinnego,
    w tym w owocach i warzywach, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/5/CE da Comissão, de 30 de Janeiro de 2002, que altera
    o anexo II da Directiva 90/642/CEE do Conselho, relativa à fixação de limites
    máximos de resíduos de substâncias activas de produtos fitofarmacêuticos permitidos
    à superfície ou no interior de determinados produtos agrícolas de origem vegetal,
    incluindo frutos e produtos hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2002/5/CE a Comisiei din 30 ianuarie 2002 de modificare a anexei
    II la Directiva 90/642/CEE a Consiliului în ceea ce privește stabilirea conținuturilor
    maxime de reziduuri de pesticide din și de pe anumite produse de origine vegetală,
    inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2002/5/ES z 30. januára 2002, ktorou sa mení a dopĺňa
    príloha II k smernici 90/642/EHS týkajúcej sa stanovenia maximálnych limitov
    rezíduí pesticídov v a na určitých produktoch rastlinného pôvodu, vrátane
    ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2002/5/ES z dne 30. januarja 2002 o spremembi Priloge
    II k Direktivi Sveta 90/642/EGS o določitvi najvišjih mejnih vrednosti ostankov
    pesticidov v in na nekaterih proizvodih rastlinskega izvora, vključno s sadjem
    in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2002/5/CE de la Comisión, de 30 de enero de 2002, por la que
    se modifica el anexo II de la Directiva 90/642/CEE del Consejo en lo relativo
    a la fijación de los límites máximos de residuos de plaguicidas en determinados
    productos de origen vegetal, incluidas las frutas y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2002/5/EG av den 30 januari 2002 om ändring av
