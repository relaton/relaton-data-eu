    της οδηγίας 90/642/ΕΟΚ του Συμβουλίου, όσον αφορά
    τον καθορισμό των ανώτατων ορίων υπολειμμάτων
    φυτοφαρμάκων πάνω και μέσα σε ορισμένα προϊόντα
    φυτικής προέλευσης, συμπεριλαμβανομένων των
