    pesticidů v některých produktech rostlinného původu, včetně ovoce a zeleniny,
    a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2002/5/EF af 30. januar 2002 om ændring af bilag
    II til Rådets direktiv 90/642/EØF om fastsættelse af maksimalgrænseværdier
    for pesticidrester på og i visse produkter af vegetabilsk oprindelse, herunder
    frugt og grøntsager
  type: main
- language: el
  script: Grek
