    tam tikruose augalinės kilmės produktuose ir ant jų, įskaitant vaisius ir
    daržoves, nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2002/5/KE tat-30 ta’ Jannar 2002 li temenda
