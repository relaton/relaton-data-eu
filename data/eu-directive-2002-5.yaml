title:
- language: en
  script: Latn
  content: Commission Directive 2002/5/EC of 30 January 2002 amending Annex II to
    Council Directive 90/642/EEC as regards the fixing of maximum levels for pesticide
    residues in and on certain products of plant origin, including fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2002/5/CE de la Commission du 30 janvier 2002 modifiant l'annexe
    II de la directive 90/642/CEE du Conseil, en ce qui concerne la fixation de teneurs
    maximales pour les résidus de pesticides respectivement sur et dans certains
    produits d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/5/EG der Kommission vom 30. Januar 2002 zur Änderung von
    Anhang II der Richtlinie 90/642/EWG des Rates über die Festsetzung von Höchstgehalten
    an Rückständen von Schädlingsbekämpfungsmitteln auf und in bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2002/5/ЕО на Комисията от 30 януари
    2002 година за изменение на приложение II към
    Директива 90/642/ЕИО на Съвета относно определянето
    на максимални количества на остатъци от пестициди
    във и върху някои продукти от растителен произход,
    включително плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2002/5/ES ze dne 30. ledna 2002, kterou se mění příloha
