title:
- language: en
  script: Latn
  content: '79/583/EEC: Commission Decision of 23 May 1979 authorizing the United
    Kingdom not to apply Community treatment to yarn of discontinuous or waste synthetic
    fibres not put up for retail sale, falling within subheading ex 56.05 A of the
    Common Customs Tariff (NIMEXE codes 56.05-03, 05, 07, 09, 11, 13, 15, 19, 21,
    23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46, 47) (category 22), originating
    in the German Democratic Republic and in free circulation in the other Member
    States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/583/CEE: Décision de la Commission, du 23 mai 1979, autorisant le
    Royaume-Uni à exclure du traitement communautaire les fils de fibres textiles
    synthétiques discontinues non conditionnés pour la vente au détail, de la sous-position
    ex 56.05 A du tarif douanier commun (codes Nimexe: 56.05-03, 05, 07, 09, 11, 13,
    15, 19, 21, 23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46, 47) (catégorie 22),
    originaires de la République démocratique allemande et mis en libre pratique
    dans les autres Etats membres (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '79/583/EWG: Entscheidung der Kommission vom 23. Mai 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus der Deutschen Demokratischen Republik
    stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Garne
    aus synthetischen Spinnfasern, nicht in Aufmachungen für den Einzelverkauf, der
    Tarifstelle ex 56.05 A des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 56.05-03,
    05, 07, 09, 11, 13, 15, 19, 21, 23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46,
    47), Kategorie 22, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/583/EØF: Kommissionens beslutning af 23. maj 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage garn af korte
    syntetiske fibre, eller af affald af kemofibre, ikke i detailsalgsoplægninger,
    som henhører under pos. ex 56.05 A i den fælles toldtarif (NIMEXE-nummer 56.05-03,
    05, 07, 09, 11, 13, 15, 19, 21, 23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46,
    47 ; kategori 22), har oprindelse i Den tyske demokratiske Republik og frit kan
    omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/583/CEE: Decisione della Commissione, del 23 maggio 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario i filati di fibre sintetiche
    in fiocco, non preparati per la vendita al minuto, della sottovoce ex 56.05 A
    della tariffa doganale comune (codici Nimexe: 56.05-03, 05, 07, 09, 11, 13, 15,
    19, 21, 23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46, 47) (categoria 22), originari
    della Repubblica democratica tedesca e messi in libera pratica negli altri Stati
    membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/583/EEG: Beschikking van de Commissie van 23 mei 1979 waarbij het Verenigd
    Koninkrijk wordt gemachtigd garens van synthetische stapelvezels, niet gereed
    voor de verkoop in het klein, van post ex 56.05 A van het gemeenschappelijk douanetarief
    (NIMEXE-code 56.05-03, 05, 07, 09, 11, 13, 15, 19, 21, 23, 25, 28, 32, 34, 36,
