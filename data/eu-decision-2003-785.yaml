title:
- language: en
  script: Latn
  content: '2003/785/EC: Decision of the European Parliament and of the Council of
    9 October 2003 on the mobilisation of the EU Solidarity Fund in accordance with
    point 3 of the Interinstitutional Agreement of 7 November 2002 between the European
    Parliament, the Council and the Commission on the financing of the European Union
    Solidarity Fund, supplementing the Interinstitutional Agreement of 6 May 1999
    on budgetary discipline and improvement of the budgetary procedure (damage caused
    by the Prestige oil tanker, by the earthquake in Molise and Apulia, and by the
    eruption of Mount Etna)'
  type: main
- language: fr
  script: Latn
  content: '2003/785/CE: Décision du Parlement européen et du Conseil du 9 octobre
    2003 concernant la mobilisation du Fonds de solidarité de l''Union européenne,
    en application du point 3 de l''accord interinstitutionnel du 7 novembre 2002
    entre le Parlement européen, le Conseil et la Commission sur le financement du
    Fonds de solidarité de l''Union européenne complétant l''accord interinstitutionnel
    du 6 mai 1999 sur la discipline budgétaire et l''amélioration de la procédure
    budgétaire (dommages causés par le naufrage du pétrolier Prestige, par le tremblement
    de terre en Molise et en Apulie et par l''éruption de l''Etna)'
  type: main
- language: de
  script: Latn
  content: '2003/785/EG: Beschluss des Europäischen Parlaments und des Rates vom
    9. Oktober 2003 über die Inanspruchnahme des Solidaritätsfonds der Europäischen
    Union gemäß Nummer 3 der Interinstitutionellen Vereinbarung vom 7. November
    2002 zwischen dem Europäischen Parlament, dem Rat und der Kommission über die
    Finanzierung des Solidaritätsfonds der Europäischen Union zur Ergänzung der
    Interinstitutionellen Vereinbarung vom 6. Mai 1999 über die Haushaltsdisziplin
    und die Verbesserung des Haushaltsverfahrens (durch den Öltanker Prestige, das
    Erdbeben in Molise in Apulien und den Ausbruch des Ätna verursachte Schäden)'
  type: main
- language: da
  script: Latn
  content: '2003/785/EF: Europa-Parlamentets og Rådets afgørelse af 9. oktober 2003
