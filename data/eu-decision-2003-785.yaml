    punkt 3 i den interinstitutionelle aftale af 7. november 2002 mellem Europa-Parlamentet,
    Rådet og Kommissionen om finansieringen af Den Europæiske Unions Solidaritetsfond,
    som supplerer den interinstitutionelle aftale af 6. maj 1999 om budgetdisciplin
    og forbedring af budgetproceduren (skaderne forårsaget af olietankeren Prestiges
    forlis, jordskælvet i Molise og Apulia samt Etnas udbrud)'
  type: main
