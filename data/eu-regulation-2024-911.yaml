title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/911 of 15 December 2023 supplementing
    Directive 2009/65/EC of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the information to be notified in
    relation to the cross-border activities of management companies and undertakings
    for collective investment in transferable securities (UCITS)
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/911 de la Commission du 15 décembre 2023
    complétant la directive 2009/65/CE du Parlement européen et du Conseil par des
    normes techniques de réglementation précisant les informations à communiquer
    en ce qui concerne les activités transfrontières des sociétés de gestion et
    des organismes de placement collectif en valeurs mobilières (OPCVM)
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/911 der Kommission vom 15. Dezember 2023
    zur Ergänzung der Richtlinie 2009/65/EG des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung der Angaben, die zu
    den grenzüberschreitenden Tätigkeiten von Verwaltungsgesellschaften und Organismen
    für gemeinsame Anlagen in Wertpapieren (OGAW) zu übermitteln sind
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/911 на Комисията
    от 15 декември 2023 година за допълнение на Директива
    2009/65/ЕО на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за уточняване на информацията, която трябва
    да бъде съобщавана във връзка с трансграничните
    дейности на управляващите дружества и предприятията
    за колективно инвестиране в прехвърлими ценни
    книжа (ПКИПЦК)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/911 ze dne 15. prosince
    2023, kterým se doplňuje směrnice Evropského parlamentu a Rady 2009/65/ES,
    pokud jde o regulační technické normy upřesňující informace, které mají
    být oznamovány v souvislosti s přeshraničními činnostmi správcovských
    společností a subjektů kolektivního investování do převoditelných cenných
    papírů (SKIPCP)
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/911 af 15. december 2023
    om supplerende regler til Europa-Parlamentets og Rådets direktiv 2009/65/EF for
    så vidt angår reguleringsmæssige tekniske standarder til præcisering af, hvilke
    oplysninger der skal meddeles i forbindelse med grænseoverskridende aktiviteter,
    der udøves af administrationsselskaber og institutter for kollektiv investering
    i værdipapirer (investeringsinstitutter)
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2024/911
    της Επιτροπής, της 15ης Δεκεμβρίου 2023, για τη
    συμπλήρωση της οδηγίας 2009/65/ΕΚ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
    τα ρυθμιστικά τεχνικά πρότυπα που προσδιορίζουν
    τις πληροφορίες που πρέπει να κοινοποιούνται
    σε σχέση με τις διασυνοριακές δραστηριότητες
    εταιρειών διαχείρισης και οργανισμών συλλογικών
    επενδύσεων σε κινητές αξίες (ΟΣΕΚΑ)
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2024/911, 15. detsember 2023, millega
    täiendatakse Euroopa Parlamendi ja nõukogu direktiivi 2009/65/EÜ regulatiivsete
    tehniliste standarditega, millega määratakse kindlaks teave, mis tuleb esitada
