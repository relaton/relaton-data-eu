    a mhéid a bhaineann le caighdeáin theicniúla rialála lena sonraítear an fhaisnéis
    atá le fógairt i ndáil le gníomhaíochtaí trasteorann cuideachtaí bainistíochta
    agus gnóthas le haghaidh comhinfheistíocht in urrúis inaistrithe (GCUI)
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/911 оd 15. prosinca 2023. o dopuni
    Direktive 2009/65/EZ Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda za određivanje podataka koji se trebaju dostaviti u vezi s prekograničnim
    aktivnostima društava za upravljanje i subjekata za zajednička ulaganja u prenosive
    vrijednosne papire (UCITS)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/911 felhatalmazáson alapuló rendelete (2023. december
    15.) a 2009/65/EK európai parlamenti és tanácsi irányelvnek az alapkezelő
    társaságok és az átruházható értékpapírokkal foglalkozó kollektív befektetési
    vállalkozások (ÁÉKBV) határokon átnyúló tevékenységeivel kapcsolatban
    bejelentendő információkat meghatározó szabályozástechnikai standardok
    tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2024/911 della Commissione, del 15 dicembre 2023,
    che integra la direttiva 2009/65/CE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione che specificano le informazioni
    da notificare circa le attività transfrontaliere delle società di gestione e
    degli organismi d’investimento collettivo in valori mobiliari (OICVM)
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2024/911 (2023. gada 15. decembris),
    ar ko Eiropas Parlamenta un Padomes Direktīvu 2009/65/EK papildina attiecībā
    uz regulatīvajiem tehniskajiem standartiem, kuros precizēta informācija, kas
    jāpaziņo saistībā ar pārvaldības sabiedrību un pārvedamu vērtspapīru
    kolektīvo ieguldījumu uzņēmumu (PVKIU) pārrobežu darbībām
  type: main
- language: lt
  script: Latn
  content: 2023 m. gruodžio 15 d. Komisijos deleguotasis reglamentas (ES) 2024/911,
    kuriuo Europos Parlamento ir Tarybos direktyva 2009/65/EB papildoma techniniais
    reguliavimo standartais, kuriais patikslinama praneština informacija apie valdymo
    įmonių ir kolektyvinio investavimo į perleidžiamus vertybinius popierius subjektų
    (KIPVPS) tarpvalstybinę veiklą
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2024/911 tal-15 ta’ Diċembru
    2023 li jissupplimenta d-Direttiva 2009/65/KE tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji li jispeċifikaw l-informazzjoni
    li għandha tiġi notifikata fir-rigward tal-attivitajiet transfruntieri tal-kumpaniji
    maniġerjali u tal-impriżi ta’ investiment kollettiv f’titoli trasferibbli
    (UCITS)
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2024/911 van de Commissie van 15 december
    2023 tot aanvulling van Richtlijn 2009/65/EG van het Europees Parlement en de
    Raad met technische reguleringsnormen tot vaststelling van de informatie waarvan
    moet worden kennisgegeven met betrekking tot grensoverschrijdende activiteiten
    van beheermaatschappijen en instellingen voor collectieve belegging in effecten
    (icbe’s)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2024/911 z dnia 15 grudnia 2023
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady 2009/65/WE w odniesieniu
    do regulacyjnych standardów technicznych określających informacje, które należy
    przekazywać w związku z transgraniczną działalnością spółek zarządzających
    i przedsiębiorstw zbiorowego inwestowania w zbywalne papiery wartościowe (UCITS)
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2024/911 da Comissão, de 15 de dezembro de 2023,
    que complementa a Diretiva 2009/65/CE do Parlamento Europeu e do Conselho no que
    respeita às normas técnicas de regulamentação que especificam as informações
    a notificar em relação às atividades transfronteiras das sociedades gestoras
    e dos organismos de investimento coletivo em valores mobiliários (OICVM)
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2024/911 al Comisiei din 15 decembrie 2023 de
    completare a Directivei 2009/65/CE a Parlamentului European și a Consiliului
    în ceea ce privește standardele tehnice de reglementare care precizează informațiile
    care trebuie notificate în legătură cu activitățile transfrontaliere ale
    societăților de administrare și ale organismelor de plasament colectiv în
    valori mobiliare (OPCVM)
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2024/911 z 15. decembra 2023, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady 2009/65/ES, pokiaľ ide o regulačné
    technické predpisy, ktorými sa spresňujú informácie, ktoré sa majú oznamovať
    v súvislosti s cezhraničnými činnosťami správcovských spoločností a podnikov
    kolektívneho investovania do prevoditeľných cenných papierov (PKIPCP)
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/911 z dne 15. decembra 2023 o dopolnitvi
    Direktive 2009/65/ES Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi o določitvi podatkov, ki jih je treba predložiti v zvezi s čezmejnimi
    dejavnostmi družb za upravljanje in kolektivnih naložbenih podjemov za vlaganja
    v prenosljive vrednostne papirje (KNPVP)
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2024/911 de la Comisión, de 15 de diciembre de
    2023, por el que se completa la Directiva 2009/65/CE del Parlamento Europeo y
    del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    la información que debe notificarse en relación con las actividades transfronterizas
    de las sociedades de gestión y de los organismos de inversión colectiva en valores
    mobiliarios (OICVM)
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2024/911 av den 15 december 2023
    om komplettering av Europaparlamentets och rådets direktiv 2009/65/EG vad gäller
    tekniska tillsynsstandarder som anger de uppgifter som ska anmälas avseende gränsöverskridande
    verksamhet i förvaltningsbolag och företag för kollektiva investeringar i överlåtbara
    värdepapper (fondföretag)
