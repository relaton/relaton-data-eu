title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2507/85 of 4 September 1985 re-establishing
    the levying of customs duties on watch movements (including stop-watch movements),
    assembled, falling within heading No 91.07, originating in Hong Kong, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3562/84
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2507/85 de la Commission du 4 septembre 1985 portant
    rétablissement de la perception des droits de douane applicables aux mouvements
    de montres terminés, de la position 91.07 du tarif douanier commun, originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2507/85 der Kommission vom 4. September 1985 zur Wiedereinführung
    der Erhebung der Zölle für Kleinuhrwerke, gangfertig, der Tarifnummer 91.07
    des Gemeinsamen Zolltarifs, mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2507/85 af 4. september 1985 om genindførelse
    af opkrævning af told for lommeurværker i færdigstand, henhørende under pos.
    91.07 i den fælles toldtarif og med oprindelse i Hongkong, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2507/85 της Επιτροπής
    της 4ης Σεπτεμβρίου 1985 περί αποκαταστάσεως
    της εφαρμογής των δασμών για τους μηχανισμούς
    μικρού μεγέθους ωρολογίων συνηρμολογημένους,
    της κλάσεως 91.07 του Κοινού Δασμολογίου, καταγωγής
    Χονγκ Κονγκ, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2507/85 della Commissione del 4 settembre 1985 che
    ripristina la riscossione dei dazi doganali applicabili ai movimenti finiti per
    orologi tascabili della voce 91.07 della tariffa doganale comune, originari di
    Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2507/85 van de Commissie van 4 september 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op horlogeuurwerken,
    volledig gemonteerd, van post 91.07 van het gemeenschappelijk douanetarief, van
    oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
