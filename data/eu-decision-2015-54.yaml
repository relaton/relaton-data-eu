  content: Απόφαση (ΕΕ, Ευρατόμ) 2015/54 του Συμβουλίου
    και της Επιτροπής, της 17ης Νοεμβρίου 2014 , σχετικά
    με τη θέση που πρόκειται να ληφθεί εξ ονόματος
    της Ευρωπαϊκής Ένωσης και της Ευρωπαϊκής Κοινότητας
    Ατομικής Ενέργειας στο πλαίσιο του συμβουλίου
    σύνδεσης που συγκροτήθηκε με τη συμφωνία σύνδεσης
    μεταξύ της Ευρωπαϊκής Ένωσης και της Ευρωπαϊκής
    Κοινότητας Ατομικής Ενέργειας και των κρατών
    μελών τους, αφενός, και της Γεωργίας, αφετέρου,
    σε σχέση με λήψη αποφάσεων του συμβουλίου σύνδεσης
    για τη θέσπιση του εσωτερικού κανονισμού του
    συμβουλίου σύνδεσης, της επιτροπής σύνδεσης
    και δύο υποεπιτροπών, τη συγκρότηση δύο υποεπιτροπών
    και την ανάθεση ορισμένων εξουσιών από το συμβούλιο
    σύνδεσης στην επιτροπή σύνδεσης στη σύνθεσή
    της για τα εμπορικά θέματα
