title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 394/2011 of 20 April 2011 amending Regulation
    (EC) No 748/2009 on the list of aircraft operators that performed an aviation
    activity listed in Annex I to Directive 2003/87/EC of the European Parliament
    and of the Council on or after 1 January 2006 specifying the administering Member
    State for each aircraft operator as regards the expansion of the Union emission
    trading scheme to EEA-EFTA countries
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 394/2011 de la Commission du 20 avril 2011 modifiant
    le règlement (CE) n ° 748/2009 concernant la liste des exploitants d'aéronefs
    ayant exercé une activité aérienne visée à l’annexe I de la directive 2003/87/CE
    du Parlement européen et du Conseil à compter du 1 er janvier 2006 et précisant
    l’État membre responsable de chaque exploitant d’aéronefs, compte tenu de
    l'extension du système d'échange de quotas d'émission de l'UE aux pays de l'AELE
    membres de l'EEE
  type: main
- language: de
  script: Latn
