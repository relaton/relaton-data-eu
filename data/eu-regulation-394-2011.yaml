    sind, mit Angabe — angesichts der Einbeziehung der EWR-/EFTA-Länder in das
    Emissionshandelssystem der EU — des für die einzelnen Luftfahrzeugbetreiber
    zuständigen Verwaltungsmitgliedstaats
  type: main
