  type: main
- language: es
  script: Latn
  content: Decisión n° 1/54, de 7 de enero de 1954, por la que se modifica la Decisión
    n° 30/53, de 2 de mayo de 1953, relativa a las prácticas prohibidas por el apartado
    1 del artículo 60 del Tratado en el mercado común del carbón y del acero
