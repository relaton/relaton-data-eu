  content: 'ECSC High Authority: Décision No 1-54 of 7 January 1954 amending Décision
    No 30-53 of 2 May 1953 concerning practices prohibited by Article 60 (1) of the
    Treaty in the common market for coal and steel'
  type: main
- language: fr
  script: Latn
  content: 'CECA Haute Autorité: Décision n° 1-54 du 7 janvier 1954 modifiant la
    décision n° 30-53 du 2 mai 1953 relative aux pratiques interdites par l''article
    60 § 1 du Traité dans le marché commun du Charbon et de l''Acier'
  type: main
- language: de
  script: Latn
  content: 'EGKS Hohe Behörde: Entscheidung Nr. 1/54 über die Änderung der Entscheidung
    Nr. 30/53 vom 2. Mai 1953 über die innerhalb des gemeinsamen Marktes von Kohle
    und Stahl durch Artikel 60 § 1 des Vertrages verbotenen Praktiken vom 7. Januar
    1954'
  type: main
- language: da
  script: Latn
  content: 'EKSF Høje Myndighed: Beslutning nr.1/54 af 7. januar 1954 om ændring
    af beslutning nr. 30/53 af 2. maj 1953 om de fremgangsmåder, som i henhold til
    traktatens artikel 60, stk. 1, er forbudt inden for det fælles marked for kul
    og stål'
  type: main
- language: el
  script: Grek
  content: 'ΕΚΑΧ Ανωτάτη Αρχή: Απόφαση αριθ. 1-54 της
    7ης Ιανουαρίου 1954 περί τροποποιήσεως της αποφάσεως
    αριθ. 30-53 της 2ας Μαΐου 1953 περί απηγορευμένων,
    κατά το άρθρο 60 παράγραφος 1 της συνθήκης, πρακτικών
    στην κοινή αγορά άνθρακος και χάλυβος'
  type: main
- language: it
  script: Latn
  content: 'CECA Alta Autorità: Décisione n. 1-54 del 7 gennaio 1954 portante modifica
    della décisione n. 30-53 del 2 maggio 1953, relativa alle pratiche vietate dall''articolo
    60 § 1 del Trattato nel mercato comune del carbone e dell''acciaio'
  type: main
- language: nl
  script: Latn
  content: 'EGKS Hoge Autoriteit: Beschikking nr. 1-54 van 7 Januari 1954 houdende
    wijziging van Beschikking nr. 30-53 van 2 Mei 1953 terzake van de praktijken,
    welke krachtens artikel 60 § 1 van het Verdrag verboden zijn op de gemeenschappelijke
    markt voor kolen en staal'
  type: main
- language: pt
  script: Latn
  content: Decisão n° 1-54, de 7 de Janeiro de 1954, que altera a Decisão n° 30-53,
