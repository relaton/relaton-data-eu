id: EUDecision1978394
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 10 April 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to blouses, knitted, crocheted or woven, for women, girls
    and infants, falling within subheading ex 60.05 A II or ex 61.02 B of the Common
    Customs Tariff, originating in Romania and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '78/394/CEE: Décision de la Commission, du 10 avril 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemisiers de bonneterie ou tissés
    pour femmes, fillettes et jeunes enfants des sous-positions Ex 60.05 A II et Ex
    61.02 B du Tarif douanier commun, originaires de Roumanie et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. April 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Blusen aus Gewirken oder Geweben für Frauen, Mädchen und
    Kleinkinder, der Tarifnummern ex 60.05 A II und ex 61.02 B des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 10. april 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage skjorter af trikotage eller vævede til kvinder, piger og småbørn,
    som henhører under pos. ex 60.05 A II og ex 61.02 B i den fælles toldtarif,
    har oprindelse i Rumænien, og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 aprile 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le camicie a maglia o tessute per donna, ragazza e
    per bambini, delle sottovoci ex 60.05 A II e ex 61.02 B della tariffa doganale
    comune, originarie della Romania e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 april 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    blouses van brei- en haakwerk of geweven, voor vrouwen, meisjes en kinderen, van
    de posten ex 60.05 A II en ex 61.02 B van het gemeenschappelijk douanetarief,
    van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
