---
id: EUDecision1997367
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '97/367/EC: Commission Decision of 30 May 1997 establishing that the exploitation
    of geographical areas for the purpose of exploring for or extracting oil or gas
    does not constitute in the United Kingdom an activity defined in Article 2 (2)
    (b) (i) of Council Directive 93/38/EEC and that entities carrying on such an activity
    are not to be considered in the United Kingdom as operating under special or exclusive
    rights within the meaning of Article 2 (3) (b) of the Directive (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/367/CE: Décision de la Commission du 30 mai 1997 constatant que l''exploitation
    d''aires géographiques dans le but de prospecter ou d''extraire du pétrole ou
    du gaz ne constitue pas au Royaume-Uni une activité visée à l''article 2 paragraphe
    2 point b) i) de la directive 93/38/CEE du Conseil, et que les entités exerçant
    cette activité ne sont pas considérées au Royaume-Uni comme bénéficiant de
    droits spéciaux ou exclusifs au sens de l''article 2 paragraphe 3) point b) de
    cette directive (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/367/EG: Entscheidung der Kommission vom 30. Mai 1997 wonach die Nutzung
    eines geographisch abgegrenzten Gebiets zum Zweck der Suche nach oder der Förderung
    von Erdöl oder Gas im Vereinigten Königreich nicht als Tätigkeit im Sinne von
    Artikel 2 Absatz 2 Buchstabe b) Ziffer i) der Richtlinie 93/38/EWG des Rates gilt
    und die eine solche Tätigkeit ausübenden Auftraggeber im Vereinigten Königreich
    als nicht im Besitz von besonderen oder ausschließlichen Rechten im Sinne von
    Artikel 2 Absatz 3 Buchstabe b) der genannten Richtlinie gelten (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/367/EF: Kommissionens beslutning af 30. maj 1997 om konstatering af,
    at udnyttelse af geografiske områder med henblik på efterforskning efter eller
    udvinding af olie eller gas ikke i Det Forenede Kongerige betragtes som virksomhed,
    der er omhandlet i artikel 2, stk. 2, litra b), nr. i), i Rådets direktiv 93/38/EØF,
    og at foretagender, der udøver denne virksomhed, ikke i Det Forenede Kongerige
    anses for at have særlige eller eksklusive rettigheder i medfør af direktivets
    artikel 2, stk. 3, litra b) (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/367/ΕΚ: Απόφαση της Επιτροπής της 30ής Μαΐου
    1997 με την οποία διαπιστώνεται ότι η εκμετάλλευση
    μιας συγκεκριμένης γεωγραφικής περιοχής με
    σκοπό την αναζήτηση, συλλογή ή εξόρυξη πετρελαίου
    ή αερίου δεν αποτελεί στο Ηνωμένο Βασίλειο
    δραστηριότητα αναφερόμενη στο άρθρο 2 παράγραφος
    2 στοιχείο β) σημείο i) της οδηγίας 93/38/ΕΟΚ του
    Συμβουλίου και ότι δεν θεωρείται ότι φορείς
    που επιδίδονται σε τέτοια δραστηριότητα στο
    Ηνωμένο Βασίλειο απολαύουν ειδικών ή αποκλειστικών
    δικαιωμάτων κατά την έννοια του άρθρου 2 παράγραφος
    3 στοιχείο β) της εν λόγω οδηγίας (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/367/EY: Komission päätös, tehty 30 päivänä toukokuuta 1997, jossa
    todetaan, että maantieteellisten alueiden hyödyntämistä öljyn tai kaasun
    etsimiseksi tai talteen ottamiseksi ei pidetä Yhdistyneessä kuningaskunnassa
    annetun neuvoston direktiivin 93/38/ETY 2 artiklan 2 kohdan b alakohdan i alakohdassa
    tarkoitettuna toimintana ja että tällaista toimintaa harjoittavien yksiköiden
    ei Yhdistyneessä kuningaskunnassa katsota toimivan direktiivin 2 artiklan 3 kohdan
    b alakohdassa tarkoitetuin erityis- tai yksinoikeuksin (Ainoastaan englanninkielinen
    teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/367/CE: Decisione della Commissione del 30 maggio 1997 che constata
    che lo sfruttamento di aree geografiche ai fini della prospezione o estrazione
    di petrolio o di gas naturale non costituisce nel Regno Unito un''attività di
    cui all''articolo 2, paragrafo 2, lettera b), punto i) della direttiva 93/38/CEE
    del Consiglio e che gli enti che esercitano tale attività non sono da considerarsi
    nel Regno Unito quali enti che fruiscono di diritti speciali o esclusivi ai sensi
    dell''articolo 2, paragrafo 3, lettera b) della menzionata direttiva (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/367/EG: Beschikking van de Commissie van 30 mei 1997 waarin wordt vastgesteld
    dat de exploitatie van geografische gebieden met het oogmerk van prospectie of
    winning van aardolie of gas in het Verenigd Koninkrijk geen activiteit is in de
    zin van artikel 2, lid 2, onder b), i), van Richtlijn 93/38/EEG en dat de diensten
    die een zodanige activiteit uitoefenen in het Verenigd Koninkrijk niet worden
    geacht bijzondere of uitsluitende rechten te genieten in de zin van artikel 2,
    lid 3, onder b), van de richtlijn (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '97/367/CE: Decisão da Comissão de 30 de Maio de 1997 que estabelece
    que a exploração de zonas geográficas para fins de prospecção ou extracção
    de petróleo ou gás não constitui, no Reino Unido, uma actividade referida no
    n° 2, subalínea i) da alínea b), do artigo 2º da Directiva 93/38/CEE do Conselho;
    e que as entidades que exercem tais actividades não são consideradas, no Reino
    Unido, como beneficiando de direitos especiais ou exclusivos na acepção do n°
    3, alínea b), do artigo 2º da referida Directiva (Apenas faz fé o texto em
    língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '97/367/CE: Decisión de la Comisión de 30 de mayo de 1997 por la que
    se establece que la explotación de zonas geográficas para la prospección o
    extracción de petróleo o gas no constituye en el Reino Unido una actividad contemplada
    en el inciso i) de la letra b) del apartado 2 del artículo 2 de la Directiva
    93/38/CEE del Consejo y que las entidades que ejerzan tal actividad no se consideran
    en el Reino Unido beneficiarias de derechos especiales o exclusivos a efectos
    de lo previsto en la letra b) del apartado 3 del artículo 2 de dicha Directiva
    (El texto en lengua inglesa es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '97/367/EG: Kommissionens beslut av den 30 maj 1997 om att utnyttjande
    av ett geografiskt område i syfte att undersöka förekomsten av eller utvinna
    olja eller gas inte i Förenade kungariket är en av de verksamheter som anges
    i artikel 2.2 b i i rådets direktiv 93/38/EEG och att enheter som bedriver sådan
    verksamhet inte i Förenade kungariket skall anses åtnjuta särskilda rättigheter
    eller ensamrätt enligt artikel 2.3 b i samma direktiv (Endast den engelska texten
    är giltig)'
  type: main
