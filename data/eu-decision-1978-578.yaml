type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 June 1978 authorizing the French Republic not
    to apply Community treatment to articles of apparel and under garments for men
    and women excluding woven shirt-blouses, falling within Chapter ex 61 of the Common
    Customs Tariff, originating in Poland and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '78/578/CEE: Décision de la Commission, du 28 juin 1978, autorisant la
    République française à exclure du traitement communautaire les vêtements et
    sous-vêtements pour hommes et pour femmes, à l''exception des chemisiers tissés,
    du chapitre Ex 61 du Tarif douanier commun, originaires de Pologne et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Juni 1978, mit der die Französische
    Republik ermächtigt wird, aus Polen stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidung und Unterkleidung für Männer und Frauen,
    andere als Hemdblusen, des Kapitels ex 61 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 28. juni 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage beklædningsgenstande og underbeklædningsgenstande
    til mænd og kvinder, bortset fra vævede skjortebluser, som henhører under kapitel
    ex 61 i den fælles toldtarif, har oprindelse i Polen og frit kan omsættes i
    de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 giugno 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli indumenti esterni e sottovesti
    per uomo e per donna, ad eccezione delle camicie tessute del capitolo ex 61 della
    tariffa doganale comune, originari della Polonia e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 juni 1978 waarbij de Franse Republiek
    wordt gemachtigd kleding en onderkleding voor heren en dames, andere dan hemdblouses,
    van hoofdstuk ex 61 van het gemeenschappelijk douanetarief, van oorsprong uit
    Polen en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
