  script: Latn
  content: Commission Directive 2010/46/EU of 2 July 2010 amending Directives 2003/90/EC
    and 2003/91/EC setting out implementing measures for the purposes of Article 7
    of Council Directives 2002/53/EC and 2002/55/EC respectively, as regards the characteristics
    to be covered as a minimum by the examination and the minimum conditions for examining
    certain varieties of agricultural plant species and vegetable species
  type: main
- language: fr
  script: Latn
  content: Directive 2010/46/UE de la Commission du 2 juillet 2010 modifiant les directives
