    7 des directives du Conseil 2002/53/CE et 2002/55/CE en ce qui concerne les caractères
    minimaux à prendre en compte et les conditions minimales à remplir lors de l’examen
    de certaines variétés des espèces de plantes agricoles et de légumes
  type: main
- language: de
  script: Latn
