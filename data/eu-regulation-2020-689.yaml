    în ceea ce privește normele privind supravegherea, programele de eradicare și
    statutul de indemn de boală pentru anumite boli listate și emergente (Text cu
    relevanță pentru SEE)
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2020/689 zo 17. decembra 2019, ktorým
