title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2020/689 of 17 December 2019 supplementing
    Regulation (EU) 2016/429 of the European Parliament and of the Council as regards
    rules for surveillance, eradication programmes, and disease-free status for certain
    listed and emerging diseases (Text with EEA relevance)
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2020/689 de la Commission du 17 décembre 2019
    complétant le règlement (UE) 2016/429 du Parlement européen et du Conseil en
    ce qui concerne les règles applicables à la surveillance, aux programmes d’éradication
    et au statut «indemne» de certaines maladies répertoriées et émergentes (Texte
    présentant de l’intérêt pour l’EEE)
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2020/689 der Kommission vom 17. Dezember 2019
