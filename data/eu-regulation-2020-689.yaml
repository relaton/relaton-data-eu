    no que diz respeito a regras em matéria de vigilância, programas de erradicação
    e estatuto de indemnidade de doença para certas doenças listadas e doenças
    emergentes (Texto relevante para efeitos do EEE)
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2020/689 al Comisiei din 17 decembrie 2019 de
