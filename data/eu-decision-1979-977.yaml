title:
- language: en
  script: Latn
  content: '79/977/EEC: Commission Decision of 31 October 1979 authorizing the French
    Republic not to apply Community treatment to men''s and boys''woven overcoats,
    raincoats and other coats, cloaks and capes, other than those of category 14 A,
    of wool, of cotton or of man-made textile fibres, falling within subheading ex
    61.01 B of the Common Customs Tariff (NIMEXE codes 61.01-41, 42, 44, 46, 47) (category
    14 B), originating in Romania and in free circulation in the other Member States
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/977/CEE: Décision de la Commission, du 31 octobre 1979, autorisant
    la République française à exclure du traitement communautaire les pardessus,
    imperméables et autres manteaux, y compris les capes, tissés, pour hommes et
    garçonnets, autres que ceux de la catégorie 14 A, de laine, de coton ou de fibres
    textiles synthétiques ou artificielles, de la sous-position ex 61.01 B du tarif
    douanier commun (codes Nimexe: 61.01-41, 42, 44, 46, 47) (catégorie 14 B), originaires
    de Roumanie et mis en libre pratique dans les autres Etats membres (Le texte en
    langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/977/EWG: Entscheidung der Kommission vom 31. Oktober 1979, mit der
    die Französische Republik ermächtigt wird, aus Rumänien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Mäntel und Umhänge aus
    Geweben, für Männer und Knaben, andere als Waren der Kategorie 14 A, aus Wolle,
    Baumwolle oder synthetischen oder künstlichen Spinnstoffen, der Tarifstelle ex
    61.01 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.01-41, 42, 44, 46, 47)
    (Kategorie 14 B) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/977/EØF: Kommissionens beslutning af 31. oktober 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage frakker, kapper
    og slag, vævede, bortset fra varer under kategori 14 A, af uld, bomuld eller
    syntetiske eller regenererede fibre, som henhører under pos. ex 61.01 B i den
    fælles toldtarif (NIMEXE-nummer 61.01-41, 42, 44, 46, 47 ; kategori 14 B), har
    oprindelse i Rumænien og frit kan omsættes i de øvrige medlemsstater (Kun den
    franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/977/CEE: Decisione della Commissione, del 31 ottobre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i cappotti, soprabiti,
    mantelli e simili, tessuti, per uomo e per ragazzo, diversi da quelli della categoria
    14 A, di lana, di cotone o di fibre tessili sintetiche o artificiali, della sottovoce
    ex 61.01 B della tariffa doganale comune (codici Nimexe: 61.01-41, 42, 44, 46,
    47), categoria 14 B, originari della Romania e messi in libera pratica negli altri
    Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/977/EEG: Beschikking van de Commissie van 31 oktober 1979 waarbij de
    Franse Republiek wordt gemachtigd overjassen, regenjassen en andere jassen, capes
    voor heren en jongens, andere dan die van categorie 14 A, van wol, van katoen
    of van synthetische of van kunstmatige textielvezels van post ex 61.01 B van het
    gemeenschappelijk douanetarief (NIMEXE-code 61.01-41, 42, 44, 46, 47) (categorie
    14 B), van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Franse taal is authentiek)'
