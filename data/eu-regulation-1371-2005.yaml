    dajatev na uvoz določene zrnato usmerjene elektropločevine s poreklom iz Rusije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1371/2005 del Consejo, de 19 de agosto de 2005, por
    el que se impone un derecho antidumping definitivo sobre las importaciones de
    productos laminados planos de acero magnético al silicio, de grano orientado,
    originarios de Estados Unidos de América y de Rusia, y que deroga el Reglamento
