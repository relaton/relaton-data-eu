    silīcijtērauda plakanu velmējumu importu apliek ar galīgo antidempinga maksājumu
    un atceļ Regulu (EK) Nr. 151/2003, ar ko ievieš galīgo antidempinga ievedmuitas
    nodokli Krievijas izcelsmes konkrēta veida elektriskām loksnēm ar orientētu
    graudu
  type: main
- language: lt
  script: Latn
