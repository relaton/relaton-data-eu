    tuonnissa annetun asetuksen (EY) N:o 151/2003 kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1371/2005/EK rendelete 2005. augusztus 19. az Amerikai Egyesült
    Államokból és Oroszországból származó szilícium-elektromos acélból készült
    szemcseorientált síkhengerelt termékek behozatalát érintő végleges dömpingellenes
    vám kivetéséről és az Oroszországból származó egyes szemcseorientált
    elektromos lemezek behozatalát érintő végleges dömpingellenes vám kivetéséről
    szóló 151/2003/EK rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1371/2005 del Consiglio, del 19 agosto 2005, che istituisce
    un dazio antidumping definitivo sulle importazioni di lamiere e nastri di acciai
    al silicio detti magnetici, laminati a freddo e a grani orientati originari degli
    Stati Uniti e della Russia e che abroga il regolamento (CE) n. 151/2003 che istituisce
    un dazio antidumping definitivo sulle importazioni di alcuni tipi di lamiere dette
    magnetiche, a grani orientati, originarie della Russia
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1371/2005 (2005. gada 19. augusts), ar ko Amerikas
