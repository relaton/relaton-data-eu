    laminados planos, de grãos orientados, de aço ao silício, denominado «magnético»,
    originários dos Estados Unidos da América e da Rússia e que revoga o Regulamento
    (CE) n.° 151/2003 que institui um direito anti-dumping definitivo sobre as importações
    de determinadas chapas «magnéticas» de grãos orientados originárias da Rússia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1371/2005 al Consiliului din 19 august 2005 de instituire
    a unui drept antidumping definitiv asupra importurilor de produse laminate plate
    din oțeluri cu siliciu numite „magnetice” cu grăunți orientați din Statele
    Unite ale Americii și din Rusia și de abrogare a Regulamentului (CE) nr. 151/2003
    al Consiliului de instituire a unui drept antidumping definitiv asupra importurilor
    unor tole numite „magnetice” cu grăunți orientați originare din Rusia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1371/2005 z 19. augusta 2005, ktorým sa ukladá
    konečné antidumpingové clo na dovozy plochých valcovaných výrobkov s orientovanou
    štruktúrou z kremíkovej elektroocele s pôvodom v Spojených štátoch amerických
    a v Rusku a ktorým sa ruší nariadenie (ES) č. 151/2003, ktorým sa ukladá
    konečné antidumpingové clo na dovozy určitých elektroplechov s orientovanou
    štruktúrou s pôvodom v Rusku
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1371/2005 z dne 19. avgusta 2005 o uvedbi dokončne
