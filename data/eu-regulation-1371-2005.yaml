  content: Neuvoston asetus (EY) N:o 1371/2005, annettu 19. elokuuta 2005, lopullisen
    polkumyyntitullin käyttöönotosta Amerikan yhdysvalloista ja Venäjältä peräisin
    olevien piiseosteisesta sähköteknisestä teräksestä valmistettujen suuntaisrakeisten
    levyvalmisteiden tuonnissa sekä lopullisen polkumyyntitullin käyttöönotosta
