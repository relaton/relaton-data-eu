title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1371/2005 of 19 August 2005 imposing a definitive
    anti-dumping duty on imports of grain oriented flat-rolled products of silicon-electrical
    steel originating in the United States of America and Russia and repealing Regulation
    (EC) No 151/2003 imposing a definitive anti-dumping duty on imports of certain
    grain oriented electrical sheets originating in Russia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1371/2005 du Conseil du 19 août 2005 instituant un
    droit antidumping définitif sur les importations de produits laminés plats en
    aciers au silicium dits «magnétiques» à grains orientés originaires des États-Unis
    d'Amérique et de Russie et abrogeant le règlement (CE) n° 151/2003 du Conseil
    instituant un droit antidumping définitif sur les importations de certaines tôles
    dites «magnétiques» à grains orientés originaires de Russie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1371/2005 des Rates vom 19. August 2005 zur Einführung
