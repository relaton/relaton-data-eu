title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2727/77 of 7 December 1977 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes falling within heading No 69.11, originating
    in developing countries to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2727/77 de la Commission, du 7 décembre 1977, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en porcelaine, de la position tarifaire
    69.11, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2727/77 der Kommission vom 7. Dezember 1977 zur Wiedereinführung
    des Zollsatzes für Geschirr, Haushalts- und Toilettengegenstände, aus Porzellan,
    der Tarifnummer 69.11, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2727/77 af 7. december 1977 om genindførelse
    af opkrævning af toldafgifter for bordservice samt husholdnings- og toiletartikler,
    af porcelæn, under position 69.11 som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2727/77 della Commissione, del 7 dicembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili al vasellame e oggetti
    di uso domestico o da toletta, di porcellana, della voce doganale 69.11, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2727/77 van de Commissie van 7 december 1977 houdende
    wederinstelling van de heffing van de douanerechten voor vaatwerk, huishoudelijke
    artikelen en toiletartikelen, van andere keramische stoffen, van post 69.11, van
    oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG)
    nr. 3021/76 van de Raad tariefpreferenties werden geopend
  type: main
