    und rektifizierte konzentrierte Traubenmoste, die im Weinwirtschaftsjahr 1980/81
    für die Weinbereitung verwendet werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3348/80 af 23. december 1980 om ændring
