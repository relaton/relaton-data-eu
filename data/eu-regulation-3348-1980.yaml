  content: Commission Regulation (EEC) No 3348/80 of 23 December 1980 amending Regulation
    (EEC) No 2726/80 on the granting of aid for concentrated grape must and rectified
    concentrated grape must used in wine-making during the 1980/81 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3348/80 de la Commission, du 23 décembre 1980, modifiant
    le règlement (CEE) n° 2726/80 relatif à l' octroi d' une aide aux moûts de
    raisins concentrés et moûts de raisins concentrés rectifiés utilisés en vinification
    au cours de la campagne viticole 1980/1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3348/80 der Kommission vom 23. Dezember 1980 zur Änderung
