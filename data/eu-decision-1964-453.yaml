title:
- language: fr
  script: Latn
  content: Décision 64/453/CEE de la Commission, du 8 juillet 1964, relative au recours
    de la République fédérale d'Allemagne à l'article 115 alinéa 1 du Traité,
    pour exclure du traitement communautaire le café, non torréfié, non décaféiné,
    de la position 09.01 A I A du Tarif douanier commun, originaire des pays autres
    que les états africains et malgache et les pays et territoires d'outre-mer associés
    à la Communauté économique européenne et mis en libre pratique dans les pays
    du Benelux
  type: main
- language: de
  script: Latn
  content: '64/453/EWG: Entscheidung der Kommission vom 8. Juli 1964 über den Antrag
    der Bundesrepublik Deutschland gemäß Artikel 115 Absatz (1) des Vertrages, nicht
    entkoffeinierten, nicht gerösteten Kaffee der Tarifnummer 09.01 A I a des Gemeinsamen
    Zolltarifs aus anderen Ländern als den assoziierten afrikanischen Staaten und
    Madagaskar und den mit der Gemeinschaft assoziierten überseeischen Ländern und
    Hoheitsgebieten, der in den Benelux-Ländern in den freien Verkehr gebracht worden
    ist von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '64/453/CEE: Decisione della Commissione, dell''8 luglio 1964, relativa
    al ricorso presentato dalla Repubblica federale di Germania, ai sensi dell''articolo
    115, comma 1 del Trattato, per escludere dal trattamento comunitario il caffè,
    non torrefatto, non decaffeinizzato, di cui alla voce 09.01 A I a) della tariffa
    doganale comune, originario da paesi che non siano gli Stati africani e malgascio
    ed i paesi e territori d''oltremare associati alla CEE, e messo in libera pratica
    nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '64/453/EEG: Beschikking van de Commissie van 8 juli 1964 betreffende het
    verzoek van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste alinea,
    van het Verdrag, koffie, ongebrand, waaruit geen cafeïne is verwijderd, van post
    09.01 A I a van het gemeenschappelijk douanetarief, van oorsprong uit andere landen
    dan de geassocieerde Afrikaanse staten en Madagaskar en de met de Europese Economische
    Gemeenschap geassocieerde landen en gebieden overzee, die in de Beneluxlanden
    in het vrije verkeer is gebracht, van communautaire behandeling uit te sluiten'
  type: main
