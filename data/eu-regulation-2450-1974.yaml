    les droits additionnels applicables, pendant le quatrième trimestre de l'année
    1974, à l'importation des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2450/74 der Kommission vom 25. September 1974 zur
