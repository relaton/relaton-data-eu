title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1408/2004 of 2 August 2004 initiating a «new
    exporter» review of Council Regulation (EC) No 2605/2000 imposing definitive
    anti-dumping duties on imports of certain electronic weighing scales (REWS) originating,
    inter alia, in the People's Republic of China, repealing the duty with regard
    to imports from two exporters in this country and making these imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1408/2004 de la Commission du 2 août 2004 portant
    ouverture d'un réexamen au titre de «nouvel exportateur» du règlement (CE)
    n° 2605/2000 du Conseil instituant des droits antidumping définitifs sur les
    importations de certaines balances électroniques originaires, entre autres, de
    la République populaire de Chine, abrogeant le droit en ce qui concerne les produits
    de deux exportateurs de ce pays et soumettant les importations de ces produits
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1408/2004 der Kommission vom 2. August 2004 zur Einleitung
