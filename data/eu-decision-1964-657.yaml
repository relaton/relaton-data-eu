title:
- language: fr
  script: Latn
  content: Décision 64/657/CEE de la Commission, du 6 novembre 1964, portant augmentation
    du volume du contingent tarifaire octroyé à la République italienne pour les
    morues, y compris stockfisch et klippfisch, simplement salées ou en saumure ou
    séchées, entières, décapitées ou tronçonnées
  type: main
- language: de
  script: Latn
  content: '64/657/EWG: Entscheidung der Kommission vom 6. November 1964 zur Erhöhung
    des der Italienischen Republik gewährten Zollkontingents für Kabeljau, einschließlich
    Stocktisch und Klippfisch, nur gesalzen, in Salzlake oder getrocknet, ganz, ohne
    Kopf oder zerteilt'
  type: main
- language: it
  script: Latn
  content: '64/657/CEE: Decisione della Commissione, del 6 novembre 1964, che aumenta
    il volume del contingente tariffario concesso alla Repubblica italiana per i merluzzi,
    compresi lo stoccafisso e il baccalà, semplicemente salati o in salamoia o secchi,
    interi, decapitati o in pezzi'
  type: main
- language: nl
  script: Latn
  content: '64/657/EEG: Beschikking van de Commissie van 6 november 1964 tot vergroting
    van het aan de Italiaanse Republiek toegekende tariefcontingent voor kabeljauw,
    stokvis en klipvis daaronder begrepen, enkel gezouten, gepekeld of gedroogd, ook
    indien ontdaan van kop of in moten gesneden'
  type: main
