id: EUDecision1974139
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 13 March 1974 authorizing the French Republic not
    to apply Community treatment to knives with cutting blades, serrated or not (including
    pruning knives), except knives with handle in ivory or in gilded or silvered base
    metal falling within heading No ex 82.09 of the Common Customs Tariff, originating
    in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 74/139/CEE de la Commission, du 13 mars 1974, autorisant la République
    française à exclure du traitement communautaire les couteaux à lame tranchante
    ou dentelée, y compris les serpettes fermantes (à l'exception des couteaux à
    manche en ivoire ou en métaux communs dorés ou argentés), de la position Ex
    82.09 du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. März 1974, mit der die Französische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Messer mit schneidender oder gezahnter Klinge, einschließlich
    Klappmesser für den Gartenbau (mit Ausnahme von Messern mit Griff aus Elfenbein
    oder aus vergoldetem oder versilbertem unedlem Metall), der Tarifnummer ex 82.09
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 13. marts 1974 om bemyndigelse for Den franske
    Republik fra fællesskabsbehandling at undtage knive, med skærende eller savtakket
    æg (herunder beskæreknive), borset fra knive med skafter af elfenben eller uædelt
    metal, der er forgyldt eller forsølvet, som henhører under position ex 82.09
    i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 marzo 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i coltelli a lama trinciante
    o dentata, compresi i roncoli chiudibili (eccetto i coltelli a manico d'avorio
    o di metalli comuni dorati o argentati), della voce ex 82.09 della tariffa doganale
    comune, originari del Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 maart 1974 waarbij de Franse Republiek
    wordt gemachtigd bepaalde messen van post ex 82.09 van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
