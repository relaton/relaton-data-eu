title:
- language: en
  script: Latn
  content: '98/187/EC: Commission Decision of 27 February 1998 authorising the Member
    States exceptionally to provide for derogations from certain provisions of Council
    Directive 77/93/EEC in respect of plants of Vitis L., other than fruits, originating
    in Latvia'
  type: main
- language: fr
  script: Latn
  content: '98/187/CE: Décision de la Commission du 27 février 1998 autorisant les
    États membres à prévoir à titre exceptionnel des dérogations à certaines
    dispositions de la directive 77/93/CEE du Conseil pour les végétaux de Vitis
    L., à l''exception des fruits, originaires de Lettonie'
  type: main
- language: de
  script: Latn
  content: '98/187/EG: Entscheidung der Kommission vom 27. Februar 1998 zur Ermächtigung
    der Mitgliedstaaten, für Vitis L., außer Früchten, mit Ursprung in Lettland
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '98/187/EF: Kommissionens beslutning af 27. februar 1998 om bemyndigelse
    af medlemsstaterne til i særlige tilfælde at indrømme undtagelser fra visse
    bestemmelser i Rådets direktiv 77/93/EØF for planter af Vitis L., dog ikke frugter,
    med oprindelse i Letland'
  type: main
- language: el
  script: Grek
  content: '98/187/ΕΚ: Απόφαση της Επιτροπής της 27ης Φεβρουαρίου
    1998 που επιτρέπει κατ'' εξαίρεση στα κράτη μέλη
    να προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου σχετικά
    με τα φυτά Vitis L., άλλα πλην των καρπών, καταγωγής
    Λετονίας'
  type: main
- language: fi
  script: Latn
  content: '98/187/EY: Komission päätös, tehty 27 päivänä helmikuuta 1998, luvan
