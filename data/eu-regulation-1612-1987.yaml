    42.1240) mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 3925/86 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1612/87 af 9. juni 1987 om genindførelse
