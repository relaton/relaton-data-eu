  script: Latn
  content: Commission Regulation (EEC) No 1612/87 of 9 June 1987 re-establishing the
    levying of customs duties on synthetic textile fibres (discontinuous), products
    of category 124 (code 42.1240), originating in Mexico, to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1612/87 de la Commission du 9 juin 1987 portant rétablissement
    de la perception des droits de douane applicables aux fibres textiles synthétiques
    discontinues, de la catégorie de produits n° 124 (code 42.1240), originaires
    du Mexique, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
