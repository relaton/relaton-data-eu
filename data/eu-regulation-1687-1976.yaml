title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1687/76 of 30 June 1976 laying down common
    detailed rules for verifying the use and/or destination of products from intervention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1687/76 de la Commission, du 30 juin 1976, établissant
    les modalités communes de contrôle de l' utilisation et/ou de la destination
    de produits provenant de l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1687/76 der Kommission vom 30. Juni 1976 zur Festlegung
    der gemeinsamen Durchführungsbestimmungen für die Überwachung der Verwendung
    und/oder Bestimmung von Erzeugnissen aus den Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1687/76 af 30. juni 1976 om fælles
    gennemførelsesbestemmelser for kontrol med anvendelse af og/eller bestemmelse
    for produkter fra intervention
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1687/76 της Επιτροπής
    της 30ής Ιουνίου 1976 περί καθορισμού κοινών λεπτομερειών
    ελέγχου της χρησιμοποιήσεως και/ή του προορισμού
    προϊόντων που προέρχονται από την παρέμβαση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1687/76 della Commissione, del 30 giugno 1976, che
    stabilisce modalità comuni di controllo dell' utilizzazione e/o della destinazione
    di prodotti provenienti dall' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1687/76 van de Commissie van 30 juni 1976 tot vaststelling
    van gemeenschappelijke bepalingen inzake de controle op het gebruik en/of de bestemming
    van produkten uit interventie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1687/76 da Comissão, de 30 de Junho de 1976, que
    estabelece as modalidades comuns de controlo da utilização e/ou do destino de
    produtos provenientes da intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1687/76 de la Comisión, de 30 de junio de 1976, por
    el que se establecen las modalidades comunes de control de la utilización y/o
    del destino de los productos procedentes de la intervención
  type: main
