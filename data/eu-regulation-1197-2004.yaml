title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1197/2004 of 29 June 2004 determining the
    extent to which applications lodged in June 2004 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 593/2004 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1197/2004 de la Commission du 29 juin 2004 déterminant
    la mesure dans laquelle les demandes de certificats d’importation introduites
    en juin 2004 pour certains produits du secteur des œufs et de la viande de volaille
    dans le cadre des règlements (CE) n° 593/2004 et (CE) n° 1251/96 peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1197/2004 der Kommission vom 29. Juni 2004 über die
    Festsetzung des Umfangs, in dem die im Juni 2004 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 593/2004 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1197/2004 ze dne 29. června 2004, kterým
    se stanoví rozsah, v němž mohou být přijímány žádosti o dovozní licence
    na některé výrobky z odvětví vajec a drůbežího masa podané v červnu
    2004 na základě nařízení (ES) č. 593/2004 a (ES) č. 1251/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1197/2004 af 29. juni 2004 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juni
    2004 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 593/2004 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EK) αριθ. 1197/2004 της Επιτροπής,
    της 29ης Ιουνίου 2004, για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Ιούνιο του 2004 για πιστοποιητικά
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών στα πλαίσια
    των κανονισμών (ΕΚ) αριθ. 593/2004 και (ΕΚ) αριθ.
    1251/96
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1197/2004, 29. juuni 2004, millega määratakse
    kindlaks, millises ulatuses võib heaks kiita määruste (EÜ) nr 593/2004 ja
    (EÜ) nr 1251/96 alusel juunis 2004 esitatud teatavate muna- ja kodulinnulihasektorite
    toodete impordilitsentsi taotlusi
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1197/2004, annettu 29 päivänä kesäkuuta 2004,
    määrättyyn järjestelmään liittyvien kesäkuussa 2004 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 593/2004 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1197/2004/EK rendelete (2004. június 29.) az 593/2004/EK
    és az 1251/96/EK rendeletben foglalt keretek között, a tojás- és a baromfihús-ágazat
    egyes termékeire vonatkozó behozatali engedélyek iránt 2004 júniusában benyújtott
    kérelmek elfogadhatósága mértékének meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1197/2004 della Commissione, del 29 giugno 2004, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d’importazione
    presentate nel mese di giugno 2004 per taluni prodotti del settore delle uova
    e del pollame nel quadro dei regolamenti (CE) n. 593/2004 e (CE) n. 1251/96
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1197/2004 (2004. gada 29. jūnijs), ar ko nosaka
    apmēru, kādā var pieņemt 2004. gada jūnijā iesniegtos dažu mājputnu un
    olu nozares produktu importa atļauju pieteikumus, saskaņā ar shēmām, kas
    ir paredzētas Regulās (EK) Nr. 593/2004 un (EK) Nr. 1251/96
  type: main
- language: lt
  script: Latn
  content: 2004 m. birželio 29 d. Komisijos reglamentas (EB) Nr. 1197/2004, nustatantis
    sąlygas, kuriomis galima priimti importo pažymėjimų prašymus, įvestus 2004
    m. birželio mėn. kai kuriems paukštienos ir kiaušinių sektorių produktams
    pagal Reglamentus (EB) Nr. 593/2004 ir (EB) Nr. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1197/2004 van de Commissie van 29 juni 2004 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sectoren eieren en slachtpluimvee, die in juni 2004
    worden ingediend op grond van de Verordeningen (EG) nr. 593/2004 en (EG) nr. 1251/96
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1197/2004 z dnia 29 czerwca 2004 r. określające
    stopień, w jakim mogą zostać przyjęte wnioski złożone w czerwcu 2004 r.
    o pozwolenia na przywóz niektórych produktów z sektorów jaj i mięsa drobiowego
    w ramach rozporządzeń (WE) nr 593/2004 i nr 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1197/2004 da Comissão, de 29 de Junho de 2004, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Junho de 2004 ao abrigo dos Regulamentos (CE) n.° 593/2004 e (CE) n.° 1251/96
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1197/2004 z 29. júna 2004, ktoré určuje
    rozsah, v ktorom možno prijať žiadosti o dovozné povolenia predložené v
    júna 2004 na niektoré produkty v sektore vajec a hydinového mäsa v rámci
    nariadení (ES) č. 593/2004 a (ES) č. 1251/96
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1197/2004 z dne 29. junija 2004 o določitvi
    obsega, v katerem se lahko sprejmejo zahtevki, vloženi junija 2004 za uvozna
    dovoljenja za nekatere proizvode iz sektorjev jajc in perutninskega mesa v skladu
    z uredbama (ES) št. 593/2004 in (ES) št. 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1197/2004 de la Comisión, de 29 de junio de 2004,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de los huevos y de
    la carne de aves de corral presentadas en el mes de junio de 2004 al amparo de
    los Reglamentos (CE) n° 593/2004 y (CE) n° 1251/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1197/2004 av den 29 juni 2004 om fastställande
    av i vilken utsträckning de ansökningar om importlicens för vissa äggprodukter
    samt fjäderfäkött som ges in under juni 2004 inom ramen för förordningarna
    (EG) nr 593/2004 och (EG) nr 1251/96 kan godtas
