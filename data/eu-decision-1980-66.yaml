type: standard
title:
- language: en
  script: Latn
  content: '80/66/EEC: Commission Decision of 19 December 1979 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, other than those of category 10, of wool,
    of cotton or of man-made textile fibres, falling within heading No ex 60.02 of
    the Common Customs Tariff (NIMEXE codes 60.02-50, 60, 70, 80) (category 11), originating
    in Malaysia and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/66/CEE: Décision de la Commission, du 19 décembre 1979, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée, autre que celle de la catégorie 10,
    de laine, de coton ou de fibres textiles synthétiques ou artificielles de la
    position ex 60.02 du tarif douanier commun (codes Nimexe: 60.02-50, 60, 70, 80)
    (catégorie 11), originaire de Malaysia et mise en libre pratique dans les autres
    Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/66/EWG: Entscheidung der Kommission vom 19. Dezember 1979, mit der
    die Französische Republik ermächtigt wird, aus Malaysia stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken,
    weder gummielastisch noch kautschutiert, andere als Waren der Kategorie 10, aus
    Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen der Tarifnummer
    ex 60.02 des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 60.02-50 ; 60 ; 70 ;
    80), Kategorie 11, von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/66/EØF: Kommissionens beslutning af 19. december 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, ikke elastiske, bortset fra varer i kategori 10, af uld, bomuld eller
    syntetiske eller regenererede fibre, som henhører under pos. ex 60.02 i den fælles
    toldtarif (NIMEXE-nummer 60.02-50, 60, 70, 80; kategori 11), har oprindelse i
    Malaysia og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/66/CEE: Decisione della Commissione, del 19 dicembre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario guanti a maglia
    non elastica né gommata, diversi da quelli della categoria 10, di lana, di cotone
    o di fibre tessili sintetiche o artificiali, della voce n. ex 60.02 della tariffa
    doganale comune (codici Nimexe : 60.02-50, 60, 70, 80), categoria 11, originari
    della Malaysia e messi in libera pratica negli altri Stati membri (Il testo in
    lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/66/EEG: Beschikking van de Commissie van 19 december 1979 waarbij de
    Franse Republiek wordt gemachtigd handschoenen, wanten en dergelijke van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, andere dan die van categorie 10, van
    wol, van katoen of van synthetische of kunstmatige textielvezels, van post ex
    60.02 van het gemeenschappelijk douanetarief (NIMEXE- code 60.02-50, 60, 70, 80)
    (categorie 11), van oorsprong uit Maleisië en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
