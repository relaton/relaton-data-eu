  content: Regulation (EEC) No 291/73 of the Commission of 31 January 1973 fixing
    the refunds applicable from 1 February 1973 to certain milk products exported
    in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 291/73 de la Commission, du 31 janvier 1973, fixant
    les taux des restitutions applicables, à compter du 1er février 1973, à certains
    produits laitiers exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 291/73 der Kommission vom 31. Januar 1973 zur Festsetzung
