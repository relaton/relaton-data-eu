---
id: EUDirective2021802
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2021/802 of 12 March 2021 amending
    the Annex to Council Framework Decision 2004/757/JHA as regards the inclusion
    of the new psychoactive substances methyl 3,3-dimethyl-2-{[1-(pent-4-en-1-yl)-1H-indazole-3-carbonyl]amino}butanoate
    (MDMB-4en-PINACA) and methyl 2-{[1-(4-fluorobutyl)-1H-indole-3-carbonyl]amino}-3,3-dimethylbutanoate
    (4F-MDMB-BICA) in the definition of ‘drug’
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2021/802 de la Commission du 12 mars 2021 modifiant
    l’annexe de la décision-cadre 2004/757/JAI du Conseil en ce qui concerne l’inclusion
    des nouvelles substances psychoactives méthyl 3,3-diméthyl-2-{[1-(pent-4-en-1-yl)-1H-indazole-3-carbonyl]amino}butanoate
    (MDMB-4en-PINACA) et méthyl 2-{[1-(4-fluorobutyl)-1H-indole-3-carbonyl]amino}-3,3-butanoate
    de diméthyle (4F-MDMB-BICA) dans la définition du terme «drogue»
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2021/802 der Kommission vom 12. März 2021 zur
    Änderung des Anhangs des Rahmenbeschlusses 2004/757/JI des Rates im Hinblick
    auf die Aufnahme der neuen psychoaktiven Substanzen Methyl-3,3-dimethyl-2-{[1-(pent-4-en-1-yl)-1H-indazol-3-carbonyl]amino}Butanoat
    (MDMB-4en-PINACA) und Methyl-2-{[1-(4-fluorbutyl)-1H-indol-3-carbonyl]amino}-3,3-Dimethylbutanoat
    (4F-MDMB-BICA) in die Definition von Drogen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2021/802 на Комисията
    от 12 март 2021 година за изменение на приложението
    към Рамково решение 2004/757/ПВР на Съвета във
    връзка с включването на новите психоактивни
    вещества метил 3,3-диметил-2-{[1-(пент-4-ен-1-ил)-1H
    -индазол-3-карбонил]амино}бутаноат (MDMB-4en-PINACA)
    и метил 2-{[1-(4-флуоробутил)-1 H-индол-3-карбонил]амино}-3,3-диметил-4-диметилбутаноат
    (4F-MDMB-BICA) в определението за „наркотици“
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2021/802 ze dne 12. března
    2021, kterou se mění příloha rámcového rozhodnutí Rady 2004/757/SVV, pokud
    jde o zahrnutí nových psychoaktivních látek methyl 3,3-dimethyl-2-{[1-(pent-4-en-1-yl)-1H-indazol-3-karbonyl]amino}butanoát
    (MDMB-4en-PINACA) a methyl 2-{[1-(4-fluorobutyl)-1H-indol-3-karbonyl]amino}-3,3-dimethylbutanoát
    (4F-MDMB-BICA) do definice drogy
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2021/802 af 12. marts 2021 om ændring
    af bilaget til Rådets rammeafgørelse 2004/757/RIA, hvad angår inkluderingen
    af de nye psykoaktive stoffer methyl 3,3-dimethyl-2-{[1-(pent-4-en-1-yl)-1H-indazol-3-carbonyl]amino}butanoat
    (MDMB-4en-PINACA) og methyl 2-{[1-(4-fluorobutyl)-1H-indol-3-carbonyl]amino}-3,3-dimethylbutanoat
    (4F-MDMB-BICA) i definitionen af »narkotika«
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (EE) 2021/802 της
    Επιτροπής της 12ης Μαρτίου 2021 για την τροποποίηση
    του παραρτήματος της απόφασης-πλαισίου 2004/757/ΔΕΥ
    του Συμβουλίου όσον αφορά την υπαγωγή των νέων
    ψυχοδραστικών ουσιών 3,3-διμεθυλο-2-{[1-(πεντ-4-εν-1-υλο)-1H-ινδαζολο-3-καρβονυλο]αμινο}βουτανοϊκό
    μεθύλιο (MDMB-4en-PINACA) και 2-{[1-(4-φθοροβουτυλο)-1H-ινδολο-3-καρβονυλο]αμινο}-3,3-διμεθυλοβουτανοϊκό
    μεθύλιο (4F-MDMB-BICA) στον ορισμό των «ναρκωτικών»
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2021/802, 12. märts 2021, millega
    muudetakse nõukogu raamotsuse 2004/757/JSK lisa uute psühhoaktiivsete ainete
    metüül-3,3-dimetüül-2-{[1-(pent-4-een-1-üül)-1H-indasool-3-karbonüül]amino}butanaat
    (MDMB-4en-PINACA) ja metüül-2-{[1-(4-fluorobutüül)-1H-indool-3-karbonüül]amino}-3,3-dimetüülbutanoaat
    (4F-MDMB-BICA) lisamiseks uimasti määratlusse
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2021/802, annettu 12 päivänä maaliskuuta
    2021, neuvoston puitepäätöksen 2004/757/YOS liitteen muuttamisesta uusien psykoaktiivisten
    aineiden metyyli-3,3-dimetyyli-2-{[1-(pent-4-en-1-yyli)-1H-indatsoli-3-karbonyyli]amino}butanoaatti
    (MDMB-4en-PINACA) ja metyyli-2-{[1-(4-fluorobutyyli)-1H-indoli-3-karbonyyli]amino}-3,3-dimetyylibutanoaatti
    (4F-MDMB-BICA) huumausaineen määritelmään sisällyttämisen osalta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2021/802 ón gCoimisiún an 12 Márta 2021 lena
    leasaítear an Iarscríbhinn a ghabhann le Cinneadh Réime 2004/757/CGB ón gComhairle
    a mhéid a bhaineann leis na substaintí sícighníomhacha nua 3,3-démheitil-2-{[1-(peint-4-éin-1-il)-1H-iondasól-3-carbóinil]aimín}bútánóáit
    mheitile (MDMB-4en-PINACA) agus 2-{[1-(4-fluarabúitil)-1H-iondól-3-carbóinil]aimín}-3,3-démheitiolbútánóáit
    mheitile (4F-MDMB-BICA) a áireamh sa sainmhíniú ar “dhruga”
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/802 оd 12. ožujka 2021. o izmjeni
    Priloga Okvirnoj odluci Vijeća 2004/757/PUP u pogledu obuhvaćanja novih psihoaktivnih
    tvari metil 3,3-dimetil-2-{[1-(pent-4-en-1-il)-1H-indazol-3-karbonil]amino}butanoata
    (MDMB-4en-PINACA) i metil 2-{[1-(4-fluorbutil)-1H-indol-3-karbonil]amino}-3,3-dimetilbutanoata
    (4F-MDMB-BICA) definicijom „droge”
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/802 felhatalmazáson alapuló irányelve (2021.
    március 12.) a 2004/757/IB tanácsi kerethatározat mellékletének a „kábítószer”
    fogalommeghatározását a metil-3,3-dimetil-2-{[1-(pent-4-én-1-il)-1H-indazol-3-karbonil]amino}butanoát
    (MDMB-4en-PINACA) és a metil-2-{[1-(4-fluorbutil)-1H-indol-3-karbonil]amino}-3,3-dimetilbutanoát
    (4F-MDMB-BICA) új pszichoaktív anyaggal kiegészítő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2021/802 della Commissione del 12 marzo 2021 che
    modifica l’allegato della decisione quadro 2004/757/GAI del Consiglio per quanto
    riguarda l’inclusione delle nuove sostanze psicoattive metil 3,3-dimetil-2-{[1-(penta-4-en-1-il)-1H-indazolo-3-carbonil]ammino}butanoato
    (MDMB-4en-PINACA) e metil 2-{[1-(4-fluorobutil)-1H-indolo-3-carbonil]ammino}-3,3-dimetilbutanoato
    (4F-MDMB-BICA) nella definizione di«stupefacenti»
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2021/802 (2021. gada 12. marts),
    ar kuru attiecībā uz jauno psihoaktīvo vielu metil-3,3-dimetil-2-{[1-(pent-4-ēn-1-il)-1H-indazol-3-karbonil]amino}butanoāta
    (MDMB-4ēn-PINACA) un metil-2-{[1-(4-fluorbutil)-1H-indol-3-karbonil]amino}-3,3-dimetilbutanoāta
    (4F-MDMB-BICA) iekļaušanu “narkotiskās vielas” definīcijā groza Padomes
    Pamatlēmuma 2004/757/TI pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2021/802 2021 m. kovo 12 d. kuria
    dėl naujų psichoaktyviųjų medžiagų metil 3,3-dimetil-2-{[1-(pent-4-en-1-il)-1H-indazol-3-karbonil]amino}butanoato
    (MDMB-4en-PINACA) ir metil 2-{[1-(4-fluorbutil)-1H-indol-3-karbonil]amino}-3,3-dimetilbutanoato
    (4F-MDMB-BICA) įtraukimo į termino „narkotikas“ apibrėžtį iš dalies
    keičiamas Tarybos pamatinio sprendimo 2004/757/TVR priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2021/802 tat-12 ta’ Marzu 2021
    li temenda l-Anness tad-Deċiżjoni Kwadru tal-Kunsill 2004/757/GAI fir-rigward
    tal-inklużjoni tas-sustanzi psikoattivi ġodda l-metil 3,3-dimetil-2-{[1-(pent-4-en-1-yl)-1H-indażolu-3-karbonil]amino}butanoat
    (MDMB-4en-PINACA) u l-metil 2-{[1-(4-fluworobutil)-1H-indol-3-karbonil]amino}-3,3-dimetilbutanoat
    (4F-MDMB-BICA) fid-definizzjoni ta’ “droga”
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2021/802 van de Commissie van 12 maart 2021
    tot wijziging van de bijlage bij Kaderbesluit 2004/757/JBZ wat betreft het opnemen
    van de nieuwe psychoactieve stoffen methyl 3,3-dimethyl-2-{[1-(pent-4-een-1-yl)-1H-indazool-3-carbonyl]amino}butanoaat
    (MDMB-4en-PINACA) en methyl 2-{[1-(4-fluorbutyl)-1H-indool-3-carbonyl]amino}-3,3-dimethylbutanoaat
    (4F-MDMB-BICA) in de definitie van “drug”
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2021/802 z dnia 12 marca 2021 r. zmieniająca
    załącznik do decyzji ramowej Rady 2004/757/WSiSW w odniesieniu do włączenia
    nowych substancji psychoaktywnych 3,3-dimetylo-2-(1-(pent-4-en-1-ylo)-1H-indazolo-3-karbonylo]amino]butanianu
    metylu (MDMB-4en-PINACA) oraz 2-[1-(4-fluorobutylo)-1H-indolo-3-karbonylo]amino]-3,3-dimetylobutanianu
    metylu (4F-MDMB-BICA) do definicji narkotyku
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2021/802 da Comissão de 12 de março de 2021 que
    altera o anexo da Decisão-Quadro 2004/757/JAI do Conselho no respeitante à inclusão
    das novas substâncias psicoativas 3,3-dimetil-2-{[1-(pent-4-en-1-il)-1H-indazole-3-carbonil]amino}butanoato
    de metilo (MDMB-4en-PINACA) e 2-{[1-(4-fluorobutil)-1H-indole-3-carbonil]amino}-3,3-dimetilbutanoato
    de metilo (4F-MDMB-BICA) na definição de «droga»
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2021/802 a Comisiei din 12 martie 2021 de modificare
    a anexei la Decizia-cadru 2004/757/JAI a Consiliului în ceea ce privește includerea
    noilor substanțe psihoactive metil 3,3-dimetil-2-{[1-(pent-4-en-1-il)-1H-indazol-3-carbonil]amino}butanoat
    (MDMB-4en-PINACA) și metil 2-{[1-(4-fluorobutil)-1H-indol-3-carbonil]amino}-3,3-dimetilbutanoat
    (4F-MDMB-BICA) în definiția termenului „drog”
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2021/802 z 12. marca 2021, ktorou sa
    mení príloha k rámcovému rozhodnutiu Rady 2004/757/SVV, pokiaľ ide o zaradenie
    nových psychoaktívnych látok metyl-3,3-dimetyl-2-{[1-(pent-4-én-1-yl)-1H-indazol-3-karbonyl]amino}butanoát
    (MDMB-4en-PINACA) a metyl-2-{[1-(4-fluórbutyl)-1H-indol-3-karbonyl]amino}-3,3-dimetylbutanoát
    (4F-MDMB-BICA) do vymedzenia pojmu drogy
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/802 z dne 12. marca 2021 o spremembi
    Priloge k Okvirnemu sklepu 2004/757/JHA glede vključitve novih psihoaktivnih
    snovi metil 3,3-dimetil-2-{[1-(pent-4-en-1-il)-1H-indazol-3-karbonil]amino}butanoat
    (MDMB-4en-PINACA) in metil 2-{[1-(4-fluorobutil)-1H-indol-3-karbonil]amino}-3,3-dimetilbutanoat
    (4F-MDMB-BICA) v opredelitev pojma „prepovedana droga“
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2021/802 de la Comisión de 12 de marzo de 2021
    por la que se modifica el anexo de la Decisión Marco 2004/757/JAI del Consejo
    en lo que respecta a la inclusión de las nuevas sustancias psicotrópicas metilo
    3,3-dimetil-2-{[1-pent-4-en-1-il)-1H-indazol-3-carbonil]amino}butanoato (MDMB-4en-PINACA)
    y metilo 2-{[1-4-fluorobutil)-1H-indol-3-carbonil]amino}-3,3-dimetilbutanoato
    (4F-MDMB-BICA) en la definición de «droga»
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2021/802 av den 12 mars 2021 om
    ändring av bilagan till rådets rambeslut 2004/757/RIF vad gäller inkluderandet
    av de nya psykoaktiva substanserna metyl 3,3-dimetyl-2-{[1-(pent-4-en-1-yl)-1H-indazol-3-karbonyl]amino}butanoat
    (MDMB-4en-PINACA) och metyl 2-{[1-(4-fluorobutyl)-1H-indol-3-karbonyl]amino}-3,3-dimetylbutanoat
    (4F-MDMB-BICA) i definitionen av narkotika
  type: main
