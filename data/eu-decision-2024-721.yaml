title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2024/721 of 27 February 2024 establishing, pursuant
    to Directive 2000/60/EC of the European Parliament and of the Council, the values
    of the Member State monitoring system classifications as a result of the intercalibration
    exercise and repealing Commission Decision (EU) 2018/229 (notified under document
    C(2024) 1113)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/721 de la Commission du 27 février 2024 établissant,
    conformément à la directive 2000/60/CE du Parlement européen et du Conseil,
    les valeurs pour les classifications du système de contrôle des États membres
    à la suite de l’exercice d’interétalonnage et abrogeant la décision (UE)
    2018/229 de la Commission [notifiée sous le numéro C(2024) 1113]
  type: main
