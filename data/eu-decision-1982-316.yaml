title:
- language: en
  script: Latn
  content: '82/316/EEC: Commission Decision of 11 May 1982 authorizing Italy to suspend
    the issuing of import documents in respect of certain textile products originating
    in Turkey (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/316/CEE: Décision de la Commission, du 11 mai 1982, autorisant l''Italie
    à suspendre la délivrance de documents d''importation pour certains produits
    textiles originaires de Turquie (Le texte en langue italienne est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '82/316/EWG: Entscheidung der Kommission vom 11. Mai 1982, mit der Italien
    ermächtigt wird, die Erteilung von Einfuhrpapieren für bestimmte Textilwaren
    mit Ursprung in der Türkei auszusetzenv (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/316/EØF: Kommissionens beslutning af 11. maj 1982 om bemyndigelse
    af Italien til at suspendere udstedelsen af importdokumenter for visse tekstilvarer
    med oprindelse i Tyrkiets (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/316/EOK: Απόφαση τής Επιτροπής τής 11ης Μαΐου
    1982 περί χορηγήσεως αδείας στήν Ιταλία νά αναστείλει
    τήν έκδοση εγγράφων εισαγωγής γιά ορισμένα
    κλωστοϋφαντουργικά προϊόντα καταγωγής Τουρκίας
    (Το κείμενο στην ιταλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/316/CEE: Decisione della Commissione, dell''11 maggio 1982, che autorizza
    l''Italia a sospendere il rilascio dei documenti d''importazione per alcuni prodotti
    tessili originari della Turchia (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '82/316/EEG: Beschikking van de Commissie van 11 mei 1982 waarbij Italië
    gemachtigd wordt de afgifte van invoerdocumenten voor bepaalde textielprodukten
    van oorsprong uit Turkije op te schorsenl (Slechts de tekst in de Italiaanse taal
    is authentiek)'
