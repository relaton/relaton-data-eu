title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2024/2099 of 31 July 2024 confirming the participation
    of Ireland in Regulation (EU) 2024/1347 of the European Parliament and of the
    Council on standards for the qualification of third-country nationals or stateless
    persons as beneficiaries of international protection, for a uniform status for
    refugees or for persons eligible for subsidiary protection and for the content
    of the protection granted
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/2099 de la Commission du 31 juillet 2024 confirmant
    la participation de l’Irlande au règlement (UE) 2024/1347 du Parlement européen
    et du Conseil concernant les normes relatives aux conditions que doivent remplir
    les ressortissants des pays tiers ou les apatrides pour pouvoir bénéficier d’une
    protection internationale, à un statut uniforme pour les réfugiés ou les personnes
    pouvant bénéficier de la protection subsidiaire et au contenu de cette protection
  type: main
- language: de
  script: Latn
