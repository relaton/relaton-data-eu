    und des Rates über Normen für die Anerkennung von Drittstaatsangehörigen oder
    Staatenlosen als Personen, denen internationaler Schutz gewährt wurde, für einen
    einheitlichen Status für Flüchtlinge oder für Personen mit Anspruch auf subsidiären
    Schutz und für den Inhalt des gewährten Schutzes
  type: main
