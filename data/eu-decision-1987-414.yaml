title:
- language: en
  script: Latn
  content: '87/414/EEC: Commission Decision of 31 July 1987 repealing Decision 85/16/EEC
    authorizing the Italian Republic to continue to apply certain protective measures
    pursuant to Article 108 (3) of the Treaty (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/414/CEE: Décision de la Commission du 31 juillet 1987 abrogeant la
    décision 85/16/CEE autorisant la République italienne à poursuivre l''application
    de certaines mesures de sauvegarde conformément à l''article 108 paragraphe
    3 du traité CEE (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/414/EWG: Entscheidung der Kommission vom 31. Juli 1987 zur Aufhebung
    der Entscheidung 85/16/EWG, mit der die Italienische Republik ermächtigt wird,
    die Anwendung bestimmer Schutzmaßnahmen gemäß Artikel 108 Absatz 3 des EWG-Vertrags
    fortzusetzen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/414/EØF: Kommissionens beslutning af 31. juli 1987 om ophævelse af
    beslutning 85/16/EØF om bemyndigelse af Den Italienske Republik til fortsat at
    anvende visse beskyttelsesforanstaltninger i henhold til EØF- Traktatens artikel
    108, stk. 3 (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/414/ΕΟΚ: Απόφαση της Επιτροπής της 31ης
    Ιουλίου 1987 για την κατάργηση της απόφασης 85/16/ΕΟΚ
    με την οποία εξουσιοδοτείται η Ιταλική Δημοκρατία
    να συνεχίσει την εφαρμογή ορισμένων μέτρων
    διασφάλισης, σύμφωνα με το άρθρο 108 παράγραφος
    3 της συνθήκης ΕΟΚ (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/414/CEE: Decisione della Commissione del 31 luglio 1987 che abroga
    la decisione 85/16/CEE che autorizza la Repubblica italiana a proseguire l''applicazione
    di talune misure di salvaguardia conformemente all''articolo 108, paragrafo 3
    del trattato CEE (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/414/EEG: Beschikking van de Commissie van 31 juli 1987 houdende intrekking
    van Beschikking 85/16/EEG waarbij de Italiaanse Republiek overeenkomstig artikel
    108, lid 3, van het Verdrag wordt gemachtigd de toepassing van bepaalde vrijwaringsmaatregelen
    voort te zetten (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/414/CEE: Decisão da Comissão de 31 de Julho de 1987 que revoga a
    Decisão 85/16/CEE que autoriza a República Italiana a prosseguir a aplicação
    de certas medidas de protecção em conformidade com o nº 3 do artigo 108 do
    Tratado CEE (Apenas faz fé o texto em língua italiana)'
  type: main
- language: es
  script: Latn
  content: '87/414/CEE: Decisión de la Comisión de 31 de julio de 1987 por la que
    se deroga la Decisión 85/16/CEE, de 19 de diciembre de 1984, por la que se autoriza
    a la República Italiana a continuar la aplicación de determinadas medidas de
    salvaguardia de conformidad con el apartado 3 del artículo 108 del Tratado CEE
    (El texto en lengua italiana es el único auténtico)'
