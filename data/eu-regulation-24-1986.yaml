title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 24/86 of 7 January 1986 re-establishing
    the levying of customs duties applicable to polyethylene of a density of 0,94
    g/cm³ or more falling within subheading 39.02 C I ex a), originating in Saudi
    Arabia, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 24/86 de la Commission du 7 janvier 1986 portant rétablissement
    de la perception des droits de douane applicables au polyéthylène d' une masse
    volumique égale ou supérieure à 0,94 g/cm³, de la sous-position 39.02 C I
    ex a) du tarif douanier commun, originaire de l' Arabie Saoudite, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 24/86 der Kommission vom 7. Januar 1986 zur Wiedereinführung
