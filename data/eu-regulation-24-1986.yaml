    mehr der Tarifstelle 39.02 C I ex a) des Gemeinsamen Zolltarifs mit Ursprung in
    Saudi-Arabien, die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 24/86 af 7. januar 1986 om genindførelse
