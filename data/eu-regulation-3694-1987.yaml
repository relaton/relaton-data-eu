    aus Drittländern und diesbezüglicher Durchführungsbestimmungen sowie zur Aufhebung
    der Verordnung (EWG) Nr. 176/87
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3694/87 af 10. december 1987 om fastsættelse
    for 1988 af kontingentet for import til Spanien af tamkaninkød fra tredjelande
    og af visse bestemmelser for dets anvendelse samt om ophævelse af forordning
    (EØF) nr. 176/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3694/87 της Επιτροπής
