  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3694/87 della Commissione del 10 dicembre 1987 che
    fissa il contingente applicabile nel 1988 alle importazioni in Spagna delle carni
    di conigli domestici provenienti dai paesi terzi, stabilisce le relative modalità
    di applicazione e abroga il regolamento (CEE) n. 176/87
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3694/87 van de Commissie van 10 december 1987 tot
    vaststelling van het contingent voor 1988 dat Spanje kan toepassen bij invoer
    van vlees van tamme konijnen uit derde landen, en van uitvoeringsbepalingen ter
    zake, alsmede tot intrekking van Verordening (EEG) nr. 176/87
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3694/87 da Comissão de 10 de Dezembro de 1987 que
    fixa, para o ano de 1988, o contingente aplicável à importação em Espanha
    de carne de coelho doméstico proveniente de países terceiros e determinadas
    regras para a sua aplicação e que revoga o Regulamento (CEE) n.° 176/87
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3694/87 de la Comisión de 10 de diciembre de 1987
    por el que se establecen para 1988, el contingente aplicable a la importación
