    της εγγραφής στον κατάλογο των τρίτων χωρών
    από τις οποίες τα κράτη μέλη επιτρέπουν την
    εισαγωγή ζώων του βοείου και χοιρείου είδους
    και νωπών κρεάτων'
  type: main
- language: it
  script: Latn
  content: '86/157/CEE: Decisione della Commissione del 7 maggio 1986 recante sospensione,
