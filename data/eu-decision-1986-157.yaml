title:
- language: en
  script: Latn
  content: '86/157/EEC: Commission Decision of 7 May 1986 suspending the inclusion
    of certain countries on the list of third countries from which the Member States
    authorize imports of bovine animals, swine and fresh meat'
  type: main
- language: fr
  script: Latn
  content: '86/157/CEE: Décision de la Commission du 7 mai 1986 portant suspension
    pour certains pays de l'' inscription à la liste des pays tiers en provenance
    desquels les États membres autorisent l'' importation d'' animaux des espèces
    bovine et porcine et des viandes fraîches'
  type: main
- language: de
  script: Latn
  content: '86/157/EWG: Entscheidung der Kommission vom 7. Mai 1986 zur Aussetzung
    der Eintragung bestimmter Länder in der Liste der Drittländer, aus denen die
    Mitgliedstaaten die Einfuhr von Rindern und Schweinen und von frischem Fleisch
    zulassen'
  type: main
- language: da
  script: Latn
  content: '86/157/EØF: Kommissionens beslutning af 7. maj 1986 om suspension for
    visse lande af opførelse på listen over de tredjelande, hvorfra medlemsstaterne
    tillader indførsel af kvæg og svin samt fersk kød'
  type: main
- language: el
  script: Grek
  content: '86/157/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Μαΐου
