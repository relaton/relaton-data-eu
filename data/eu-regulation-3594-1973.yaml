  content: Regulation (EEC) No 3594/73 of the Council of 28 December 1973 on the opening,
    allocation and administration of a Community tariff quota for hand woven fabrics
    of silk, waste silk other than noil, and cotton, falling within subheadings Nos
    ex 50.09 and ex 55.09 of the Common Customs Tariff
  type: main
