    Handwebstühlen hergestellte Gewebe aus Seide oder Schappeseide und aus Baumwolle
    der Tarifnummern ex 50.09 und ex 55.09 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
