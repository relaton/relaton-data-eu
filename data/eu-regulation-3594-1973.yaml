    ouverture, répartition et mode de gestion des contingents tarifaires communautaires
    de tissus de soie ou de bourre de soie (schappe) et de tissus de coton, tissés
    sur métiers à main, des positions EX 50.09 et EX 55.09 du tarif douanier commun
  type: main
- language: de
  script: Latn
