id: EUDecision1976295
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 30 January 1976 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to electric motors falling within heading No ex 85.01 of the
    Common Customs Tariff, originating in Czechoslovakia and put into free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: 76/295/CEE. Décision de la Commission, du 30 janvier 1976, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les moteurs électriques de la position
    Ex 85.01 du Tarif douanier commun, originaires de Tchécoslovaquie et mis en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. Januar 1976, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Tschechoslowakei stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Elektromotoren der Tarifnummer ex 85.01 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 30. januar 1976 om bemyndigelse til kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage elektriske motorer, som henhører under pos. ex 85.01 i den fælles
    toldtarif, har oprindelse i Tjekkoslovakiet og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 gennaio 1976, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i motori elettrici della voce ex 85.01 della tariffa
    doganale comune, originari della Cecoslovacchia e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 januari 1976 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd elektromotoren van post ex 85.01 van het gemeenschappelijk douanetarief,
    van oorsprong uit Tsjechoslowakije en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
