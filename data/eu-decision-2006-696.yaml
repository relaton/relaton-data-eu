---
id: EUDecision2006696
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2006/696/EC: Commission Decision of 28 August 2006 laying down a list
    of third countries from which poultry, hatching eggs, day-old chicks, meat of
    poultry, ratites and wild game-birds, eggs and egg products and specified pathogen-free
    eggs may be imported into and transit through the Community and the applicable
    veterinary certification conditions, and amending Decisions 93/342/EEC, 2000/585/EC
    and 2003/812/EC (notified under document number C (2006) 3821)'
  type: main
- language: fr
  script: Latn
  content: '2006/696/CE: Décision de la Commission du 28 août 2006 établissant
    une liste des pays tiers en provenance desquels les volailles, les œufs à couver,
    les poussins d’un jour, les viandes de volaille, de ratite et de gibier à plumes
    sauvage, les œufs et ovoproduits et les œufs exempts de micro-organismes pathogènes
    spécifiés peuvent être importés et transiter dans la Communauté ainsi que
    les conditions applicables en matière de certification vétérinaire, et modifiant
    les décisions 93/342/CEE, 2000/585/CE et 2003/812/CE [notifiée sous le numéro
    C(2006) 3821)]'
  type: main
- language: de
  script: Latn
  content: '2006/696/EG: Entscheidung der Kommission vom 28. August 2006 zur Erstellung
    der Liste von Drittländern, aus denen die Einfuhr von Hausgeflügel, Bruteiern
    und Eintagsküken, von Fleisch von Hausgeflügel, Laufvögeln und Wildgeflügel
    sowie von Eiern, Eiprodukten und spezifiziert pathogenfreien Eiern in die Gemeinschaft
    und die Durchfuhr dieser Tiere und Erzeugnisse durch die Gemeinschaft zugelassen
    ist, zur Festlegung der diesbezüglichen Veterinärbescheinigungen und zur Änderung
    der Entscheidungen 93/342/EWG, 2000/585/EG und 2003/812/EG (Bekannt gegeben unter
    Aktenzeichen K(2006) 3821)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 28 август 2006 година
    за определяне на списъци на трети страни, от
    които е разрешен вносът и транзитът през Общността
    на домашни птици, яйца за люпене, еднодневни
    пилета, месо от домашни птици, щраусови и дивечови
    птици, яйца и яйчни продукти и яйца, свободни
    от определени патогени и приложимите условия
    за ветеринарно сертифициране, и за изменение
    на решения 93/342/ЕИО, 2000/585/ЕО и 2003/812/ЕО (нотифицирано
    под номер C (2006) 3821)
  type: main
- language: cs
  script: Latn
  content: '2006/696/ES: Rozhodnutí Komise ze dne 28. srpna 2006 , kterým se stanoví
    seznam třetích zemí, z nichž lze do Společenství dovážet a přes jeho
    území přepravovat drůbež, násadová vejce, jednodenní kuřata, maso drůbeže,
    ptáků nadřádu běžci a volně žijící pernaté zvěře, vejce a vaječné
    výrobky a vejce prostá specifikovaných patogenních původců, a příslušné
    podmínky pro vydání veterinárního osvědčení a kterým se pozměňují
    rozhodnutí 93/342/EHS, 2000/585/ES a 2003/812/ES (oznámeno pod číslem K(2006)
    3821)'
  type: main
- language: da
  script: Latn
  content: '2006/696/EF: Kommissionens beslutning af 28. august 2006 om en liste over
    tredjelande, hvorfra fjerkræ, rugeæg, daggamle kyllinger, kød af fjerkræ,
    strudsefugle og vildtlevende fjervildt, æg og ægprodukter og specifikt patogenfrie
    æg kan importeres til og føres i transit gennem Fællesskabet, om betingelser
    for udstedelse af veterinærcertifikat og om ændring af beslutning 93/342/EØF,
    2000/585/EF og 2003/812/EF (meddelt under nummer K(2006) 3821)'
  type: main
- language: el
  script: Grek
  content: '2006/696/ΕΚ: Απόφαση της Επιτροπής, της 28ης
    Αυγούστου 2006 , για την κατάρτιση καταλόγου
    τρίτων χωρών από τις οποίες πουλερικά, αυγά
    επώασης, νεοσσοί μιας ημέρας, κρέας πουλερικών,
    στρουθιονίδες και άγρια θηράματα, αυγά και
    προϊόντα αυγών και αυγά απαλλαγμένα από ειδικά
    παθογόνα τα οποία μπορούν να εισαχθούν και
    να διαμετακομισθούν μέσω της Κοινότητας και
    των εφαρμοστέων όρων κτηνιατρικής πιστοποίησης
    καθώς και για την τροποποίηση των αποφάσεων
    93/342/ΕΟΚ, 2000/585/ΕΚ και 2003/812/ΕΚ [κοινοποιηθείσα
    υπό τον αριθμό Ε(2006) 3821]'
  type: main
- language: et
  script: Latn
  content: '2006/696/EÜ: Komisjoni otsus, 28. august 2006 , millega kehtestatakse
    nende kolmandate riikide loetelu, millest võib importida ühendusse ja vedada
    läbi ühenduse kodulinde, haudemune, ühepäevaseid tibusid, kodulindude, silerinnaliste
    lindude ja looduslike jahilindude liha, mune ja munatooteid ning määratletud
    patogeenivabasid mune, ja kohaldatavad veterinaarsertifikaatide nõuded ning muudetakse
    otsuseid 93/342/EMÜ, 2000/585/EÜ ja 2003/812/EÜ (teatavaks tehtud numbri K(2006)
    3821 all)'
  type: main
- language: fi
  script: Latn
  content: '2006/696/EY: Komission päätös, tehty 28 päivänä elokuuta 2006 ,
    sellaisten kolmansien maiden luettelon vahvistamisesta, joista saa tuoda yhteisöön
    tai kuljettaa yhteisön kautta siipikarjaa, siitosmunia, untuvikkoja ja siipikarjan,
    sileälastaisten lintujen ja luonnonvaraisten riistalintujen lihaa, munia ja munatuotteita
    sekä erikseen määritellyistä taudinaiheuttajista vapaita munia, sekä sovellettavista
    eläinlääkärintodistuksia koskevista vaatimuksista ja päätösten 93/342/ETY,
    2000/585/EY ja 2003/812/EY muuttamisesta (tiedoksiannettu numerolla K(2006) 3821)'
  type: main
- language: hu
  script: Latn
  content: '2006/696/EK: A Bizottság határozata ( 2006. augusztus 28. ) azon harmadik
    országok jegyzékének megállapításáról, ahonnan baromfi, keltetőtojás,
    naposcsibe, baromfihús, laposmellű futómadár és vadon élő szárnyasvad
    húsa, tojás és tojástermékek és specifikus kórokozóktól mentes tojás
    behozható a Közösségbe és átszállítható a Közösségen, valamint az
    állatorvosi bizonyítványokra alkalmazandó feltételek megállapításáról,
    és a 93/342/EGK, a 2000/585/EK és a 2003/812/EK határozat módosításáról
    (az értesítés a C(2006) 3821. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2006/696/CE: Decisione della Commissione, del 28 agosto 2006 , che istituisce
    un elenco di paesi terzi da cui sono consentiti le importazioni e il transito
    nella Comunità di pollame, uova da cova, pulcini di un giorno, carni di pollame,
    ratiti e selvaggina da penna selvatica, uova e ovoprodotti e uova esenti da organismi
    patogeni specifici, definisce le condizioni di certificazione veterinaria applicabili
    e modifica le decisioni 93/342/CEE, 2000/585/CE e 2003/812/CE [notificata con
    il numero C(2006) 3821]'
  type: main
- language: lv
  script: Latn
  content: '2006/696/EK: Komisijas Lēmums ( 2006. gada 28. augusts ) par to trešo
    valstu saraksta izveidošanu, no kurām drīkst ievest un tranzītā caur Kopienu
    pārvadāt mājputnus, inkubējamas olas, diennakti vecus cāļus, mājputnu,
    skrējējputnu un savvaļas medījamo putnu gaļu, olas un olu produktus un noteiktas
    bezpatogēnu olas, un par spēkā esošajiem veterinārās sertifikācijas noteikumiem
    un Lēmuma 93/342/EEK, Lēmuma 2000/585/EK un Lēmuma 2003/812/EK grozījumiem
    (izziņots ar dokumenta numuru K(2006) 3821)'
  type: main
- language: lt
  script: Latn
  content: '2006/696/EB: 2006 m. rugpjūčio 28 d. Komisijos sprendimas, nustatantis
    trečiųjų šalių, iš kurių leidžiama importuoti į Bendriją ir per ją
    tranzitu vežti naminius paukščius, perinti skirtus kiaušinius, vienadienius
    paukščių jauniklius, paukštieną, Ratitae genties paukščius ir laukinius
    medžiojamuosius paukščius, kiaušinius ir kiaušinių produktus, nurodytais
    patogenais neužkrėstus kiaušinius, sąrašą bei taikytinas veterinarinio sertifikavimo
    sąlygas ir iš dalies keičiantis Sprendimus 93/342/EEB, 2000/585/EB ir 2003/812/EB
    (pranešta dokumentu Nr. C(2006) 3821)'
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni tat- 28 ta' Awwissu 2006 li tistabbilixxi lista
    ta' pajjiżi terzi li minnhom tjur, bajd għat-tifqis, flieles ta' ġurnata, laħam
    ta' tjur, ta' ratiti u ta' tjur selvaġġi tal-kaċċa, bajd u prodotti tal-bajd
    u bajd speċifikat bħala liberu mill-patoġeni jistgħu jiġu importati ġewwa
    u jgħaddu mill-Komunità u l-kondizzjonijiet applikabbli għaċ-ċertifikazzjoni
    veterinarja, u li temenda d-Deċiżjonijiet 93/342/KEE, 2000/585/KE u 2003/812/KE
    (innotifikata taħt dokument numru C (2006) 3821)
  type: main
- language: nl
  script: Latn
  content: '2006/696/EG: Beschikking van de Commissie van 28 augustus 2006 tot vaststelling
    van een lijst van derde landen waaruit pluimvee, broedeieren, eendagskuikens,
    vlees van pluimvee, loopvogels en vrij vederwild, eieren en eiproducten en van
    specifieke pathogenen vrije eieren (SPF-eieren) kunnen worden ingevoerd in en
    doorgevoerd door de Gemeenschap en van de toepasselijke voorschriften inzake veterinaire
    certificering, en tot wijziging van de Beschikkingen 93/342/EEG, 2000/585/EG en
    2003/812/EG (Kennisgeving geschied onder nummer C(2006) 3821)'
  type: main
- language: pl
  script: Latn
  content: '2006/696/WE: Decyzja Komisji z dnia 28 sierpnia 2006 r. ustanawiająca
    wykaz państw trzecich, z których dopuszczalny jest przywóz do i tranzyt przez
    terytorium Wspólnoty drobiu, jaj wylęgowych, jednodniowych piskląt, mięsa
    drobiu, ptaków bezgrzebieniowych i dzikich ptaków łownych, jaj i przetworów
    jajecznych oraz jaj wolnych od określonych czynników chorobotwórczych, oraz
    stosowne warunki wystawiania świadectw weterynaryjnych oraz zmieniająca decyzje
    93/342/EWG, 2000/585/WE i 2003/812/WE (notyfikowana jako dokument nr C(2006) 3821)'
  type: main
- language: pt
  script: Latn
  content: '2006/696/CE: Decisão da Comissão, de 28 de Agosto de 2006 , que estabelece
    uma lista de países terceiros a partir dos quais se autoriza a importação e
    o trânsito na Comunidade de aves de capoeira, ovos para incubação, pintos do
    dia, carne de aves de capoeira, de ratites e de aves de caça selvagens, ovos,
    ovoprodutos e ovos isentos de organismos patogénicos especificados, bem como
    as condições de certificação veterinária aplicáveis, e que altera as Decisões
    93/342/CEE, 2000/585/CE e 2003/812/CE [notificada com o número C(2006) 3821]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 28 august 2006 de stabilire a unei liste a țărilor
    terțe din care pot fi importate și din care pot tranzita în cadrul Comunității
    păsările de curte, ouăle destinate incubației, puii de o zi, carnea de pasăre,
    de ratită și de vânat sălbatic cu pene, ouăle și produsele din ouă și
    ouăle fără microorganisme patogene specificate, cât și a condițiilor aplicabile
    în materie de certificare sanitar-veterinară și de modificare a Deciziilor
    93/342/CEE, 2000/585/CE și 2003/812/CE [notificată cu numărul C(2006) 3821]
  type: main
- language: sk
  script: Latn
  content: '2006/696/ES: Rozhodnutie Komisie z 28. augusta 2006 , ktorým sa ustanovuje
    zoznam tretích krajín, z ktorých sa môže dovážať do Spoločenstva a prepravovať
    cez Spoločenstvo hydina, násadové vajcia, jednodňové kurčatá, mäso z hydiny,
    vtákov nadradu bežce a z voľne žijúcej pernatej zveri, vajcia a výrobky
    z vajec a vajcia bez obsahu špecifikovaných patogénov, a uplatniteľné podmienky
    týkajúce sa veterinárneho osvedčenia a ktorým sa menia a dopĺňajú rozhodnutia
    93/342/EHS, 2000/585/ES a 2003/812/ES [oznámené pod číslom K(2006) 3821]'
  type: main
- language: sl
  script: Latn
  content: '2006/696/ES: Odločba Komisije z dne 28. avgusta 2006 o določitvi seznama
    tretjih držav, iz katerih se dovoli uvoz perutnine, valilnih jajc, enodnevnih
    piščancev, perutninskega mesa, ratitov in divjih ptic, jajc in jajčnih izdelkov
    ter jajc, prostih specifičnih patogenih organizmov, v Skupnost in njihov tranzit
    skozi Skupnost, o veljavnih pogojih za izdajo veterinarskih spričeval in o spremembi
    odločb 93/342/EGS, 2000/585/ES in 2003/812/ES (notificirano pod dokumentarno
    številko C(2006) 3821)'
  type: main
- language: es
  script: Latn
  content: '2006/696/CE: Decisión de la Comisión, de 28 de agosto de 2006 , por
    la que se establece una lista de terceros países desde los cuales pueden importarse
    a la Comunidad, o transitar por ella, aves de corral, huevos para incubar, pollitos
    de un día, carne de aves de corral, rátidas y aves silvestres de caza, huevos,
    ovoproductos y huevos sin gérmenes patógenos específicos, así como las condiciones
    aplicables a los certificados zoosanitarios, y por la que se modifican las Decisiones
    93/342/CEE, 2000/585/CE y 2003/812/CE [notificada con el número C(2006) 3821]'
  type: main
- language: sv
  script: Latn
  content: '2006/696/EG: Kommissionens beslut av den 28 augusti 2006 om fastställande
    av en förteckning över de tredjeländer från vilka fjäderfä, kläckägg,
    dagsgamla kycklingar, kött av fjäderfä, ratiter och frilevande fjädervilt
    samt ägg, äggprodukter och specifikt patogenfria ägg får importeras till och
    transiteras genom gemenskapen samt gällande villkor för veterinärintyg och
    om ändring av besluten 93/342/EEG, 2000/585/EG och 2003/812/EG [delgivet med
    nr K(2006) 3821]'
  type: main
