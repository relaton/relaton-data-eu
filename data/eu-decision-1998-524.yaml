title:
- language: en
  script: Latn
  content: '98/524/EC: Commission Decision of 28 July 1998 amending Decision 94/279/EC
    on the indicative allocation by Member States of the commitment appropriations
    from the Structural Funds for the agricultural part of Objective 5a except for
    those fields covered by Objective 1 as defined in Council Regulation (EEC) No
    2052/88 for the period 1994 to 1999 (notified under document number C(1998) 2330)'
  type: main
- language: fr
  script: Latn
  content: '98/524/CE: Décision de la Commission du 28 juillet 1998 modifiant la
    décision 94/279/CE établissant, pour la période 1994-1999, la répartition
    indicative par État membre des crédits d''engagement des Fonds structurels pour
    la partie agricole de l''objectif nº 5 a) hors de l''objectif nº 1 tel que défini
    par le règlement (CEE) nº 2052/88 du Conseil [notifiée sous le numéro C(1998)
    2330]'
  type: main
- language: de
  script: Latn
  content: '98/524/EG: Entscheidung der Kommission vom 28. Juli 1998 zur Änderung
    der Entscheidung 94/279/EG mit Richtgrößen für die Aufteilung der Verpflichtungsermächtigungen
    der Strukturfonds auf die einzelnen Mitgliedstaaten im Rahmen des nicht unter
    Ziel 1 fallenden landwirtschaftlichen Teils von Ziel 5a, wie in der Verordnung
    (EWG) Nr. 2052/88 des Rates definiert, im Zeitraum 1994 bis 1999 (Bekanntgegeben
    unter Aktenzeichen K(1998) 2330)'
  type: main
- language: da
  script: Latn
  content: '98/524/EF: Kommissionens beslutning af 28. juli 1998 om ændring af beslutning
    94/279/EF om fastsættelse for perioden 1994-1999 af den vejledende fordeling
    på medlemsstaterne af strukturfondenes forpligtelsesbevillinger for landbrugsdelen
    af mål nr. 5a i regioner uden for mål nr. 1 som fastlagt ved Rådets forordning
    (EØF) nr. 2052/88 (meddelt under nummer K(1998) 2330)'
  type: main
- language: el
  script: Grek
  content: '98/524/ΕΚ: Απόφαση της Επιτροπής της 28ης Ιουλίου
    1998 για τροποποίηση της απόφασης 94/279/ΕΚ, για
    τον καθορισμό, για την περίοδο 1994-1999, της ενδεικτικής
    κατανομής ανά κράτος μέλος των πιστώσεων ανάληψης
    των διαρθρωτικών ταμείων για το γεωργικό μέρος
    του στόχου 5α εκτός στόχου 1, όπως έχει καθοριστεί
    από τον κανονισμό (ΕΚ) αριθ. 2052/88 του Συμβουλίου
    [κοινοποιηθείσα υπό τον αριθμό Ε(1998) 2330]'
  type: main
- language: fi
  script: Latn
  content: '98/524/EY: Komission päätös, tehty 28 päivänä heinäkuuta 1998,
    rakennerahastojen maksusitoumusmäärärahojen ohjeellisesta jakautumisesta jäsenvaltioittain
    ajanjaksolla 1994 - 1999, siltä osin kuin neuvoston antamassa asetuksessa (ETY)
    N:o 2052/88 määritetty tavoite 1 ei kata tavoiteen 5 a maatalouden osuutta tehdyn
    päätöksen 94/279/EY muuttamisesta (tiedoksiannettu numerolla K(1998) 2330)'
  type: main
- language: it
  script: Latn
  content: '98/524/CE: Decisione della Commissione del 28 luglio 1998 che modifica
    la decisione 94/279/CE, recante la ripartizione indicativa per Stato membro degli
    stanziamenti di impegno dei Fondi strutturali per la parte agricola dell''obiettivo
    n. 5 a) ad esclusione dell''obiettivo n. 1, definito dal regolamento (CEE) n.
    2052/88 del Consiglio, per il periodo 1994-1999 [notificata con il numero C(1998)
    2330]'
  type: main
- language: nl
  script: Latn
  content: '98/524/EG: Beschikking van de Commissie van 28 juli 1998 houdende wijziging
