  script: Latn
  content: KOMISSION ASETUS (EY) N:o 239/96, annettu 8 päivänä helmikuuta 1996,
    yhteisön sekä Puolan tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian
