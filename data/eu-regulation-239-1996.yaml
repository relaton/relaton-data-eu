title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 239/96 of 8 February 1996 determining the
    extent to which applications lodged in January 1996 for import certificates for
    fresh, chilled or frozen beef under the import arrangements provided for in the
    European Agreements between the Community and the Republic of Poland, the Republic
    of Hungary, the Czech Republic, the Slovak Republic, Bulgaria and Romania can
    be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 239/96 DE LA COMMISSION du 8 février 1996 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 1996 pour les viandes bovines fraîches, réfrigérées
    ou congelées dans le cadre des régimes d'importation prévus par les accords
    européens entre la Communauté et la république de Pologne, la république de
    Hongrie, la République tchèque, la Slovaquie, la Bulgarie et la Roumanie
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 239/96 DER KOMMISSION vom 8. Februar 1996 zur Festsetzung
    des Umfangs, in dem die im Januar 1996 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Europäischen Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik, der Slowakei, Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 239/96 af 8. februar 1996 om fastsættelse
