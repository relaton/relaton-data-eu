type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2307/75 of the Commission of 9 September 1975 re-establishing
    the levying of customs duties on embroidery, in the piece, in strips or in motifs,
    falling within heading No 58.10, originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3046/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2307/75 de la Commission, du 9 septembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux broderies
    en pièces, en bandes ou en motifs de la position tarifaire 58.10 originaires
    de la Corée du Sud bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2307/75 der Kommission vom 9. September 1975 über
    die Wiedereinführung des Zollsatzes für Stickereien als Meterware oder als Motiv,
    der Tarifnummer 58.10, mit Ursprung in Südkorea, dem die in der Verordnung (EWG)
    Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2307/75 af 9. september 1975 om genindførelse
    af opkrævning af toldafgifter for broderier, i løbende længder, strimler eller
    motiver under position 58.10, som har oprindelse i Sydkorea og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3046/74 af 2.
    december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2307/75 della Commissione, del 9 settembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai ricami in pezza, in
    strisce o in motivi, della voce doganale 58.10, originari della Corea del Sud,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3046/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2307/75 van de Commissie van 9 september 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op borduurwerk,
    aan het stuk, in banden of in de vorm van motieven van post 58.10, van oorsprong
    uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3046/74 van de Raad van 2 december 1974
  type: main
