title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/1200 of 18 April 2024 concerning
    the renewal of the authorisation of a preparation of Bifidobacterium animalis
    ssp. animalis DSM 16284, Ligilactobacillus salivarius DSM 16351 and Enterococcus
    faecium DSM 21913 as a feed additive for chickens for fattening, chickens reared
    for laying and minor poultry species for fattening and reared for laying or breeding,
    the authorisation of that preparation as a feed additive for use in feed and in
    water for drinking for chickens reared for breeding, turkeys for fattening and
    turkeys reared for breeding (holder of authorisation: Biomin GmbH) and repealing
    Implementing Regulations (EU) No 544/2013 and (EU) 2015/1105'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/1200 de la Commission du 18 avril
    2024 concernant le renouvellement de l’autorisation d’une préparation de
    Bifidobacterium animalis ssp. animalis DSM 16284, de Ligilactobacillus salivarius
    DSM 16351 et d’Enterococcus faecium DSM 21913 en tant qu’additif dans l’alimentation
    des poulets d’engraissement, des poulettes destinées à la ponte et des espèces
    mineures de volailles destinées à l’engraissement et élevées pour la ponte
    ou la reproduction, ainsi que l’autorisation de cette préparation en tant qu’additif
    pour l’alimentation et l’eau d’abreuvement des poulets élevés pour la
    reproduction, des dindes d’engraissement et des dindons élevés pour la reproduction
    (titulaire de l’autorisation: Biomin GmbH) et abrogeant les règlements d’exécution
    (UE) no 544/2013 et (UE) 2015/1105'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2024/1200 der Kommission vom 18. April 2024
    zur Verlängerung der Zulassung einer Zubereitung aus Bifidobacterium animalis
    ssp. animalis DSM 16284, Ligilactobacillus salivarius DSM 16351 und Enterococcus
    faecium DSM 21913 als Futtermittelzusatzstoff für Masthühner, Junghennen, Mastgeflügelarten
    von geringerer wirtschaftlicher Bedeutung und Jungtiere von Lege- oder Zuchtgeflügelarten
    von geringerer wirtschaftlicher Bedeutung, zur Zulassung dieser Zubereitung als
    Futtermittelzusatzstoff zur Verwendung in Futtermitteln und über Tränkwasser
    für Junghühner für die Zucht, Masttruthühner und Jungtruthühner für die
    Zucht (Zulassungsinhaber: Biomin GmbH) und zur Aufhebung der Durchführungsverordnungen
    (EU) Nr. 544/2013 und (EU) 2015/1105'
  type: main
- language: bg
  script: Cyrl
