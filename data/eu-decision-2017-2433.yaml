    na mocy Układu o stowarzyszeniu między Unią Europejską i Europejską Wspólnotą
    Energii Atomowej oraz ich państwami członkowskimi, z jednej strony, a Gruzją,
    z drugiej strony, w odniesieniu do zastąpienia Protokołu I do tego Układu,
    dotyczącego definicji pojęcia „produkty pochodzące” oraz metod współpracy
    administracyjnej, nowym protokołem, który odwołuje się do Regionalnej konwencji
