    douane, opgericht bij de Associatieovereenkomst tussen de Europese Unie en de
    Europese Gemeenschap voor Atoomenergie en hun lidstaten, enerzijds, en Georgië,
    anderzijds, over de vervanging van Protocol I bij deze overeenkomst betreffende
    de definitie van het begrip „producten van oorsprong” en methoden van administratieve
    samenwerking door een nieuw protocol waarin naar de Regionale Conventie betreffende
    de pan-Euromediterrane preferentiële oorsprongsregels wordt verwezen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2017/2433 z dnia 18 grudnia 2017 r. w sprawie stanowiska,
