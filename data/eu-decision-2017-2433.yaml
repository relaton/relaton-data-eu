    sporazumom med Evropsko unijo in Evropsko skupnostjo za atomsko energijo in njunimi
    državami članicami na eni strani ter Republiko Gruzijo na drugi strani, glede
    nadomestitve Protokola I k navedenemu sporazumu o opredelitvi pojma „izdelki
    s poreklom“ in načinih upravnega sodelovanja z novim protokolom, ki se sklicuje
