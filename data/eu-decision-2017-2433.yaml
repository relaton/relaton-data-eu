title:
- language: en
  script: Latn
  content: Council Decision (EU) 2017/2433 of 18 December 2017 on the position to
    be adopted on behalf of the European Union within the Customs Sub-Committee established
    by the Association Agreement between the European Union and the European Atomic
    Energy Community and their Member States, of the one part, and Georgia, of the
    other part, as regards the replacement of Protocol I to that Agreement, concerning
    the definition of the concept of ‘originating products’ and methods of administrative
    cooperation, by a new protocol which refers to the Regional Convention on pan-Euro-Mediterranean
    preferential rules of origin
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2017/2433 du Conseil du 18 décembre 2017 relative à la
    position à prendre au nom de l'Union européenne au sein du sous-comité douanier
    institué par l'accord d'association entre l'Union européenne et la Communauté
    européenne de l'énergie atomique et leurs États membres, d'une part, et la
    Géorgie, d'autre part, sur le remplacement du protocole I de cet accord, concernant
    la définition de la notion de «produits originaires» et les méthodes de coopération
    administrative, par un nouveau protocole qui fait référence à la convention
    régionalesur les règles d'origine préférentielles paneuro-méditerranéennes
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2017/2433 des Rates vom 18. Dezember 2017 über den im Namen
    der Europäischen Union im Zoll-Unterausschuss, der gemäß dem Assoziierungsabkommen
    zwischen der Europäischen Union und der Europäischen Atomgemeinschaft und ihren
    Mitgliedstaaten einerseits und Georgien andererseits eingesetzt wurde, hinsichtlich
    der Ersetzung des Protokolls Nr. I dieses Abkommens über die Bestimmung des Begriffs
    „Erzeugnisse mit Ursprung in“ oder „Ursprungserzeugnisse“ und über die
    Methoden der Zusammenarbeit der Verwaltungen durch ein neues Protokoll, das hinsichtlich
    der Ursprungsregeln auf das Regionale Übereinkommen über Pan-Europa-Mittelmeer-Präferenzursprungsregeln
    Bezug nimmt, zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2017/2433 на Съвета от 18 декември
    2017 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Митническия подкомитет, създаден по силата
    на Споразумението за асоцииране между Европейския
    съюз и Европейската общност за атомна енергия
    и техните държави членки, от една страна, и
    Грузия, от друга страна, във връзка със замяната
    на Протокол I относно определението на понятието
    „продукти с произход“ и методите на административно
    сътрудничество към посоченото споразумение
    с нов протокол, в който се съдържа препратка
    към Регионалната конвенция за паневросредиземноморските
    преференциални правила за произход
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2017/2433 ze dne 18. prosince 2017 o postoji, který
    má být jménem Evropské unie zaujat v Podvýboru pro cla zřízeném Dohodou
    o přidružení mezi Evropskou unií a Evropským společenstvím pro atomovou
    energii a jejich členskými státy na jedné straně a Gruzií na straně druhé,
    pokud jde o nahrazení protokolu I k uvedené dohodě o definici pojmu „původní
    produkty“ a o metodách správní spolupráce novým protokolem, který odkazuje
    na Regionální úmluvu o celoevropsko-středomořských preferenčních pravidlech
    původu
  type: main
