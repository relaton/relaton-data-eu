id: EUDirective200696
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 2006/96/EC of 20 November 2006 adapting certain Directives
    in the field of free movement of goods, by reason of the accession of Bulgaria
    and Romania
  type: main
- language: fr
  script: Latn
  content: Directive 2006/96/CE du Conseil du 20 novembre 2006 portant adaptation
    de certaines directives dans le domaine de la libre circulation des marchandises,
    en raison de l'adhésion de la Bulgarie et de la Roumanie
  type: main
- language: de
  script: Latn
  content: Richtlinie 2006/96/EG des Rates vom 20. November 2006 zur Anpassung bestimmter
    Richtlinien im Bereich freier Warenverkehr anlässlich des Beitritts Bulgariens
    und Rumäniens
  type: main
- language: bg
  script: Cyrl
  content: Директива 2006/96/ЕО на Съвета от 20 ноември
    2006 година за адаптиране на някои директиви
    в областта на свободното движение на стоки
    поради присъединяването на България и Румъния
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 2006/96/ES ze dne 20. listopadu 2006 , kterou se z důvodu
    přistoupení Bulharska a Rumunska upravují některé směrnice v oblasti volného
    pohybu zboží
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 2006/96/EF af 20. november 2006 om tilpasning af visse
    direktiver vedrørende frie varebevægelser på grund af Bulgariens og Rumæniens
    tiltrædelse
  type: main
- language: el
  script: Grek
  content: Οδηγία 2006/96/ΕΚ του Συμβουλίου, της 20ής Νοεμβρίου
    2006 , για την προσαρμογή ορισμένων οδηγιών στον
    τομέα της ελεύθερης κυκλοφορίας των εμπορευμάτων,
    λόγω της προσχώρησης της Βουλγαρίας και της
    Ρουμανίας
  type: main
- language: et
  script: Latn
  content: Nõukogu Direktiiv 2006/96/EÜ, 20. november 2006 , millega kohandatakse
    teatavaid direktiive kaupade vaba liikumise valdkonnas seoses Bulgaaria ja Rumeenia
    ühinemisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 2006/96/EY, annettu 20 päivänä marraskuuta 2006
    , tiettyjen direktiivien mukauttamisesta tavaroiden vapaan liikkuvuuden alalla
    Bulgarian ja Romanian liittymisen johdosta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2006/96/EK irányelve ( 2006. november 20. ) az áruk szabad
    mozgása területén elfogadott egyes irányelveknek Bulgária és Románia csatlakozására
    tekintettel történő kiigazításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2006/96/CE del Consiglio, del 20 novembre 2006 , che adegua determinate
    direttive sulla libera circolazione delle merci, a motivo dell'adesione della
    Bulgaria e della Romania
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 2006/96/EK ( 2006. gada 20. novembrī ), ar ko pielāgo
    dažas direktīvas preču brīvas aprites jomā saistībā ar Bulgārijas un Rumānijas
    pievienošanos
  type: main
- language: lt
  script: Latn
  content: 2006 m. lapkričio 20 d. Tarybos Direktyva 2006/96/EB dėl Bulgarijos ir
    Rumunijos stojimo adaptuojanti kai kurias direktyvas laisvo prekių judėjimo
    srityje
  type: main
- language: mt
  script: Latn
  content: '2006/96/KE: Direttiva tal-Kunsill 2006/96/KE ta'' l- 20 ta’ Novembru
    2006 li tadatta ċerti Direttivi fil-qasam tal-moviment liberu ta'' merkanzija,
    minħabba l-adeżjoni tal-Bulgarija u r-Rumanija'
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2006/96/EG van de Raad van 20 november 2006 tot aanpassing van
    een aantal richtlijnen op het gebied van vrij verkeer van goederen in verband
    met de toetreding van Bulgarije en Roemenië
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 2006 /96/WE z dnia 20 listopada 2006 r. dostosowująca niektóre
    dyrektywy w dziedzinie swobodnego przepływu towarów, w związku z przystąpieniem
    Bułgarii i Rumunii
  type: main
- language: pt
  script: Latn
  content: Directiva 2006/96/CE do Conselho, de 20 de Novembro de 2006 , que adapta
    determinadas directivas no domínio da livre circulação de mercadorias, em virtude
    da adesão da Bulgária e da Roménia
  type: main
- language: ro
  script: Latn
  content: Directiva 2006/96/CE a Consiliului din 20 noiembrie 2006 de adaptare a
    anumitor directive în domeniul liberei circulații a mărfurilor, având în
    vedere aderarea Bulgariei și a României
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 2006/96/ES z 20. novembra 2006 , ktorou sa z dôvodu pristúpenia
    Bulharska a Rumunska upravujú určité smernice v oblasti voľného pohybu tovaru
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 2006/96/ES z dne 20. novembra 2006 o prilagoditvi nekaterih
    direktiv na področju prostega pretoka blaga zaradi pristopa Bolgarije in Romunije
  type: main
- language: es
  script: Latn
  content: Directiva 2006/96/CE del Consejo, de 20 de noviembre de 2006 , por la que
    se adaptan determinadas directivas en el ámbito de la libre circulación de mercancías,
    con motivo de la adhesión de Bulgaria y Rumanía
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 2006/96/EG av den 20 november 2006 om anpassning av vissa
    direktiv när det gäller fri rörlighet för varor med anledning av Bulgariens
    och Rumäniens anslutning
  type: main
