title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 485/84 of 24 February 1984 re-establishing
    the levying of customs duties on certain women' s, girls' and infants' suits and
    costumes of knitted or crocheted fabrics, products of category 74 (code 0740)
    originating in Thailand, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 485/84 de la Commission du 24 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    costumes-tailleurs et ensembles en bonneterie pour femmes, fillettes et jeunes
    enfants, de la catégorie 74 (code 0740), originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 485/84 der Kommission vom 24. Februar 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Kostüme und Hosenanzüge aus
    Gewirken, für Frauen, Mädchen und Kleinkinder, der Warenkategorie Nr. 74 (Kennziffer
    0740), mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3570/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 485/84 af 24. februar 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte dragter og kostumer og sæt af trikotage
    til kvinder, piger og småbørn under varekategori nr. 74 (kode 0740), som har
    oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 485/84 της Επιτροπής
    της 24ης Φεβρουαρίου 1984 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένα
    κοστούμια—ταγιέρ και σύνολα, πλεκτά, για γυναίκες,
    κορασίδες και μικρά παιδιά, προϊόντα της κατηγορίας
    74 (κωδικός 0740), καταγωγής Ταϋλάνδης, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3570/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 485/84 della Commissione del 24 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili a taluni abiti a giacca
    e completi a maglia per donna, per ragazza e per bambini, della categoria di prodotti
    n. 74 (codice 0740), originari della Tailandia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 485/84 van de Commissie van 24 februari 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    mantelpakken en broekpakken van brei- of haakwerk, voor dames, meisjes en kinderen,
    van de categorie van produkten nr. 74 (codenummer 0740), van oorsprong uit Thailand,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3570/83 van de Raad
