title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1428/92 of 1 June 1992 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for export after processing, amending Regulation (EEC) No
    569/88 and repealing Regulation (EEC) No 2911/91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1428/92 de la Commission du 1er juin 1992 relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines détenues par certains organismes d'intervention et destinées
    à être exportées après transformation, modifiant le règlement (CEE) n° 569/88
    et abrogeant le règlement (CEE) n° 2911/91
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1428/92 DER KOMMISSION vom 1. Juni 1992 über den
    Verkauf von Rindfleisch aus Interventionsbeständen nach der Verordnung (EWG)
    Nr. 2539/84 zur Ausfuhr nach seiner Verarbeitung, zur Änderung der Verordnung
    (EWG) Nr. 569/88 und zur Aufhebung der Verordnung (EWG) Nr. 2911/91 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1428/92 af 1. juni 1992 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på eksport efter forarbejdning, om ændring af forordning (EØF)
    nr. 569/88 og om ophævelse af forordning (EØF) nr. 2911/91 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1428/92 της Επιτροπής
    της 1ης Ιουνίου 1992 σχετικά με την πώληση, βάσει
    διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που κατέχεται
    από ορισμένους οργανισμούς παρεμβάσεως και
    προορίζεται να εξαχθεί, μετά από μεταποίηση,
    με την τροποποίηση του κανονισμού (ΕΟΚ) αριθ.
    569/88 και με την κατάργηση του κανονισμού (ΕΟΚ)
    αριθ. 2911/91
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1428/92 DELLA COMMISSIONE del 1o giugno 1992 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d'' intervento e destinate all''
    esportazione, previa trasformazione, recante modifica del regolamento (CEE) n.
    569/88 e abrogazione del regolamento (CEE) n. 2911/91 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1428/92 VAN DE COMMISSIE van 1 juni 1992 betreffende
    de verkoop, overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure,
    van door bepaalde interventiebureaus opgeslagen rundvlees dat na verwerking wordt
    uitgevoerd, houdende wijziging van Verordening (EEG) nr. 569/88 en tot intrekking
    van Verordening (EEG) nr. 2911/91 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1428/92 DA COMISSÃO de 1 de Junho de 1992 relativo
    à venda, no âmbito do procedimento definido no Regulamento (CEE) no 2539/84,
    de carne de bovino na posse de certos organismos de intervenção e destinada
    a ser exportada, após transformação, e que altera o Regulamento (CEE) no 569/88
    e revoga o Regulamento (CEE) no 2911/91 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1428/92 DE LA COMISIÓN de 1 de junio de 1992 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carne de vacuno en poder de determinados organismos de intervención y destinada
    a ser exportada tras su transformación, por el que se modifica el Reglamento
    (CEE) no 569/88 y se deroga el Reglamento (CEE) no 2911/91 #'
