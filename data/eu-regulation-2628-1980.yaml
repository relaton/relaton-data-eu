  content: Commission Regulation (EEC) No 2628/80 of 14 October 1980 amending Regulation
    (EEC) No 1845/80 on the granting of re-storage aid for table wine for which a
    storage contract was concluded during the 1979/80 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2628/80 de la Commission, du 14 octobre 1980, modifiant
    le règlement (CEE) n° 1845/80 relatif à l' octroi d' une aide au relogement
    du vin de table pour lequel un contrat de stockage a été conclu pendant la campagne
    1979/1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2628/80 der Kommission vom 14. Oktober 1980 zur Änderung
    der Verordnung (EWG) Nr. 1845/80 über die Gewährung einer Beihilfe zur Umlagerung
    von Tafelwein, für den im Weinwirtschaftsjahr 1979/80 ein Lagervertrag abgeschlossen
    worden ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2628/80 af 14. oktober 1980 om ændring
    af forordning (EØF) nr. 1845/80 om ydelse af en støtte til omlagring af bordvin,
    for hvilken der er indgået oplagringskontrakt i vinproduktionsåret 1979/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2628/80 τής Επιτροπής
