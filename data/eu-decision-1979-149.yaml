title:
- language: en
  script: Latn
  content: '79/149/EEC: Commission Decision of 21 December 1978 on the reimbursement
    by the Guidance Section of the EAGGF to Ireland of expenditure incurred during
    1976 on aids and premiums relating to the modernization of farms including those
    in the less-favoured farming areas (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/149/CEE: Décision de la Commission, du 21 décembre 1978, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", à l''Irlande des dépenses effectuées pendant
    l''année 1976 pour les aides et primes relatives à la modernisation des exploitations
    agricoles, y compris dans les zones agricoles défavorisées (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/149/EWG: Entscheidung der Kommission vom 21. Dezember 1978 über die
    Rückvergütung durch den EAGFL, Abteilung Ausrichtung, der im Jahr 1976 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an Irland (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/149/EØF: Kommissionens beslutning af 21. december 1978 om refusion
    gennem EUGFL, udviklingssektionen, til Irland af udgifter, som er afholdt i løbet
    af året 1976 til støtte og præmier vedrørende modernisering af landbrugsbedrifter,
    også i ugunstigt stillede områder (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/149/CEE: Decisione della Commissione, del 21 dicembre 1978, relativa
    al rimborso da parte del FEAOG, sezione orientamento, all''Irlanda delle spese
    effettuate durante il 1976 per gli aiuti ed i premi relativi all''ammodernamento
    delle aziende agricole, comprese quelle nelle zone agricole svantaggiate (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/149/EEG: Beschikking van de Commissie van 21 december 1978 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan Ierland voor de in 1976 verrichte
    uitgaven voor steun en premies met betrekking tot de modernisering van landbouwbedrijven
    waaronder mede begrepen die in probleemgebieden in de landbouw (Slechts de tekst
    in de Engelse taal is authentiek)'
