title:
- language: en
  script: Latn
  content: 'Regulation (EEC) No 1595/73 of the Commission of 14 June 1973 re-establishing
    the Common Customs Tariff duties on appliances, apparatus, accessories and requisites
    for gymnastics or other athletics, or for sports and outdoor games (other than
    articles falling within heading No 97.04): tennis rackets and other, falling within
    heading No 97.06 B and C originating in Pakistan, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2762/72 of 19 December 1972
    apply'
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CEE) n° 1595/73 de la Commission, du 14 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux articles et engins pour les jeux de plein air, la gymnastique, l'' athlétisme
    et autres sports, à l'' exclusion des articles du n° 97.04: raquettes de tennis
    et autres, des sous-positions tarifaires 97.06 B et C, originaires du Pakistan,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2762/72 du Conseil du 19 décembre 1972'
  type: main
- language: de
  script: Latn
  content: 'Verordnung (EWG) Nr. 1595/73 der Kommission vom 14. Juni 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Geräte für Freiluftspiele, Leichtathletik,
    Gymnastik und andere Sportarten, ausgenommen Waren der Tarifnummer 97.04: Tennisschläger
    und andere, der Tarifstellen 97.06 B und C, mit Ursprung in Pakistan, dem die
    in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens Forordning (EØF) nr. 1595/73 af 14. juni 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for redskaber og rekvisitter til udendørsspil
    samt til gymnastik, atletik og andre sportsgrene (bortset fra varer henhørende
    under pos. 97.04) : tennisketsjere, i andre tilfælde underposition 97.06 B, C,
    som har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972'
  type: main
- language: it
  script: Latn
  content: 'Regolamento (CEE) n. 1595/73 della Commissione, del 14 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    oggetti ed attrezzi per giuochi all'' aperto, da ginnastica, da atletica ed altri
    sport, diversi da quelli della voce n. 97.04: racchette da tennis e altri delle
    sottovoci doganali n. 97.06 B e C originari del Pakistan beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre
    1972'
  type: main
- language: nl
  script: Latn
  content: 'Verordening (EEG) nr. 1595/73 van de Commissie van 14 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op artikelen en toestellen voor openluchtspelen voor gymnastiek,
    voor atletiek en voor andere sporten, met uitzondering van de artikelen bedoeld
    bij post 97.04 : tennisrackets en andere, van onderverdeling 97.06 B en C, van
    oorsprong uit Pakistan, ten behoeve waarvan bij Verordening (EEG) 2762/72 van
    de Raad van 19 december 1972 algemene tariefpreferenties werden geopend'
  type: main
