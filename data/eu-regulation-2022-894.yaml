title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/894 of 7 June 2022 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2017/141 on imports of certain stainless
    steel tube and pipe butt-welding fittings, whether or not finished, originating
    in the People’s Republic of China by imports of certain stainless steel tube
    and pipe butt-welding fittings, whether or not finished, consigned from Malaysia,
    whether declared as originating in Malaysia or not, and making such imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/894 de la Commission du 7 juin 2022
    ouvrant une enquête concernant un éventuel contournement des mesures antidumping
    instituées par le règlement d’exécution (UE) 2017/141 sur les importations
    de certains accessoires de tuyauterie en aciers inoxydables à souder bout à
    bout, finis ou non, originaires de la République populaire de Chine par des importations
    de certains accessoires de tuyauterie en aciers inoxydables à souder bout à
    bout, finis ou non, expédiés de Malaisie, qu’ils aient ou non été déclarés
    originaires de ce pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/894 der Kommission vom 7. Juni 2022
    zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit
    der Durchführungsverordnung (EU) 2017/141 eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren bestimmter Rohrformstücke, Rohrverschlussstücke und
    Rohrverbindungsstücke aus nicht rostendem Stahl zum Stumpfschweißen, auch als
    Fertigwaren, mit Ursprung in der Volksrepublik China durch aus Malaysia versandte
    Einfuhren bestimmter Rohrformstücke, Rohrverschlussstücke und Rohrverbindungsstücke
    aus nicht rostendem Stahl zum Stumpfschweißen, auch als Fertigwaren, ob als Ursprungserzeugnisse
    Malaysias angemeldet oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
