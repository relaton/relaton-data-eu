  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/894 de la Comisión de 7 de junio de
    2022 por el que se abre una investigación sobre la posible elusión de las medidas
    antidumping impuestas por el Reglamento de Ejecución (UE) 2017/141 a las importaciones
    de determinados accesorios de tubería de acero inoxidable para soldadura a tope,
