  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/894 zo 7. júna 2022, ktorým
    sa začína prešetrovanie týkajúce sa možného obchádzania antidumpingových
    opatrení uložených vykonávacím nariadením (EÚ) 2017/141 na dovoz určitého
    príslušenstva na rúry a rúrky z nehrdzavejúcej ocele používaného na zváranie
