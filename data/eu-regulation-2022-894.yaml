  script: Latn
  content: Uitvoeringsverordening (EU) 2022/894 van de Commissie van 7 juni 2022 tot
    opening van een onderzoek naar de mogelijke ontwijking van de bij Uitvoeringsverordening
    (EU) 2017/141 ingestelde antidumpingmaatregelen ten aanzien van de invoer van
    bepaalde roestvrijstalen hulpstukken voor buisleidingen, door stomplassen te bevestigen,
