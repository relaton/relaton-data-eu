    na zváranie na tupo, tiež dokončeného, odosielaného z Malajzie, bez ohľadu
    na to, či má alebo nemá deklarovaný pôvod v Malajzii, a ktorým sa zavádza
    registrácia takéhoto dovozu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/894 z dne 7. junija 2022 o začetku
    preiskave glede možnega izogibanja protidampinškim ukrepom, uvedenim z Izvedbeno
    uredbo (EU) 2017/141 za uvoz nekaterega pribora (fitingov) iz nerjavnega jekla
    za soležno varjenje cevi, dokončanega ali nedokončanega, s poreklom iz Ljudske
    republike Kitajske, z uvozom nekaterega pribora (fitingov) iz nerjavnega jekla
    za soležno varjenje cevi, dokončanega ali nedokončanega, poslanega iz Malezije,
