  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/894 av den 7 juni 2022
    om inledande av en undersökning av ett eventuellt kringgående av de antidumpningsåtgärder
    som införts genom genomförandeförordning (EU) 2017/141 på import av vissa
    stumsvetsrördelar av rostfritt stål, även inte färdigbearbetade, med ursprung
