title:
- language: en
  script: Latn
  content: '95/380/EC: Commission Decision of 18 September 1995 amending Commission
    Decisions 94/432/EC, 94/433/EC and 94/434/EC laying down detailed rules for the
    application of Council Directives 93/23/EEC on the statistical surveys to be carried
    out on pig production, 93/24/EEC on the statistical surveys to be carried out
    on bovine animal production and 93/25/EEC on the statistical surveys to be carried
    out on sheep and goat stocks'
  type: main
- language: fr
  script: Latn
  content: '95/380/CE: Décision de la Commission, du 18 septembre 1995, modifiant
    les décisions 94/432/CE, 94/433/CE et 94/434/CE établissant des dispositions
    d''application des directives du Conseil 93/23/CEE en ce qui concerne les enquêtes
    statistiques sur le cheptel et la production du secteur porcin, 93/24/CEE en ce
    qui concerne les enquêtes statistiques sur le cheptel et la production du secteur
    bovin et 93/25/CEE en ce qui concerne les enquêtes statistiques sur le cheptel
    et la production du secteur des ovins et des caprins'
  type: main
- language: de
  script: Latn
  content: '95/380/EG: Entscheidung der Kommission vom 18. September 1995 zur Änderung
    der Entscheidungen 94/432/EG, 94/433/EG und 94/434/EG mit Anwendungsbestimmungen
    zur Richtlinie 93/23/EWG des Rates betreffend die statistischen Erhebungen über
    die Schweineerzeugung, zur Richtlinie 93/24/EWG betreffend die statistischen Erhebungen
    über die Rindererzeugung und zur Richtlinie 93/25/EWG des Rates betreffend die
    statistischen Erhebungen über Bestand und Erzeugung des Schaf- und Ziegensektors'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 18. září 1995, kterým se mění rozhodnutí
    Komise 94/432/ES, 94/433/ES a 94/434/ES, kterými se stanoví prováděcí pravidla
    ke směrnicím Rady 93/23/EHS o statistických zjišťováních chovu prasat,
    93/24/EHS o statistických zjišťováních chovu skotu a 93/25/EHS o statistických
    zjišťováních chovu ovcí a koz
  type: main
- language: da
  script: Latn
  content: '95/380/EF: Kommissionens beslutning af 18. september 1995 om ændring
    af beslutning 94/432/EF, 94/433/EF og 94/434/EF om gennemførelsesbestemmelser
    til Rådets direktiv 93/23/EØF om statistiske undersøgelser af svineproduktionen,
    93/24/EØF om statistiske undersøgelser af hornkvægproduktionen og 93/25/EØF
    om statistiske undersøgelser af fåre- og gedeproduktionen'
  type: main
- language: el
  script: Grek
