    στον τομέα του ζωικού κεφαλαίου βοοειδών και
    της παραγωγής βοοειδών και 93/25/ΕΟΚ όσον αφορά
    τις στατιστικές έρευνες στον τομέα του ζωικού
    κεφαλαίου αιγοπροβάτων και της παραγωγής αιγοπροβάτων'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 18. september 1995, millega muudetakse komisjoni otsuseid
    nr 94/432/EÜ, 94/433/EÜ ja 94/434/EÜ, millega kehtestatakse nõukogu direktiivi
    93/23/EMÜ üksikasjalikud rakenduseeskirjad seakasvatuse statistiliste vaatluste
    kohta, 93/24/EMÜ üksikasjalikud rakenduseeskirjad veisekasvatuse statistiliste
    vaatluste kohta ja 93/25/EMÜ üksikasjalikud rakenduseeskirjad lamba- ja kitsekasvatuse
    statistiliste vaatluste kohta
  type: main
- language: fi
  script: Latn
  content: '95/380/EY: Komission päätös, tehty 18 päivänä syyskuuta 1995, sikatuotantoa
    koskevien tilastotietojen keruusta annetun neuvoston direktiivin 93/23/ETY, nautaeläintuotantoa
    koskevien tilastotietojen keruusta annetun neuvoston direktiivin 93/24/ETY sekä
    lammas- ja vuohituotantoa koskevien tilastotietojen keruusta annetun neuvoston
    direktiivin 93/25/ETY soveltamista koskevista yksityiskohtaisista säännöistä
    tehtyjen päätösten 94/432/EY, 94/433/EY ja 94/434/EY muuttamisesta'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1995. szeptember 18.) a sertéstenyésztésre
    vonatkozó statisztikai felmérésekről szóló 93/23/EGK tanácsi irányelv,
    a szarvasmarhafélék tenyészésére vonatkozó statisztikai felmérésekről
    szóló 93/24/EGK tanácsi irányelv, valamint a juh- és kecskeállományokra
    vonatkozó statisztikai felmérésekről szóló 93/25/EGK tanácsi irányelv
    alkalmazására vonatkozó részletes szabályok megállapításáról szóló
    94/432/EK, 94/433/EK és 94/434/EK bizottsági határozat módosításáról
  type: main
- language: it
  script: Latn
  content: '95/380/CE: Decisione della Commissione, del 18 settembre 1995, che modifica
    le decisioni della Commissione 94/432/CE, 94/433/CE e 94/434/CE recanti disposizioni
    d''attuazione delle direttive del Consiglio 93/23/CEE, riguardo alle indagini
    statistiche sulla produzione del settore suino, 93/24/CEE, riguardo alle indagini
    statistiche sulla produzione di bovini, e 93/25/CEE, riguardo alle indagini statistiche
    sul patrimonio ovino e caprino'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1995. gada 18. septembris), ar ko groza Komisijas Lēmumus
    94/432/EK, 94/433/EK un 94/434/EK, kuri nosaka sīkākus piemērošanas noteikumus
    Padomes direktīvai 93/23/EEK par veicamajiem statistiskas pārskatiem attiecībā
    uz cūkkopību, 93/24/EEK par veicamajiem statistiskas pārskatiem attiecībā
    uz liellopu ražošanu un 93/25/EEK par veicamajiem statistiskas pārskatiem attiecībā
    uz aitu un kazu populāciju
  type: main
- language: lt
  script: Latn
  content: 1995 m. rugsėjo 18 d. Komisijos sprendimas, iš dalies keičiantis sprendimus
    94/432/EB, 94/433/EB ir 94/434/EB, nustatančius išsamias Tarybos direktyvų
    93/23/EEB dėl statistinių kiaulininkystės tyrimų, 93/24/EEB dėl statistinių
    galvijininkystės tyrimų ir 93/25/EEB dėl atliktinų avių ir ožkų bandų
    statistinių tyrimų taikymo taisykles
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-18 ta’ Settembru 1995 li temenda d-Deċiżjonijiet
    tal-Kummissjoni 94/432/KE, 94/433/KE u 94/434/KE li jniżżlu regoli dettaljati
    għall-applikazzjoni tad-Direttivi tal-Kunsill 93/23/KEE fuq l-istħarriġ statistiku
    li għandu jitwettaq fuq il-produzzjoni tal-majjali, 93/24/KEE dwar l-istħarriġ
    statistiku li għand jitwettaq fuq il-produzzjoni ta’ annimali bovini u 93/25/KEE
    l-istħarriġ statistiku li għandu jitwettaq fuq il-ħażniet tan-nagħaġ u
    tal-mogħoż (Test b’rilevanza għall- Ftehim EE)
  type: main
- language: nl
  script: Latn
  content: '95/380/EG: Beschikking van de Commissie van 18 september 1995 tot wijziging
    van de Beschikkingen 94/432/EG, 94/433/EG en 94/434/EG houdende toepassingsbepalingen
    van de Richtlijnen 93/23/EEG van de Raad betreffende de statistische enquêtes
    op het gebied van de varkensproduktie, 93/24/EEG van de Raad betreffende de statistische
    enquêtes op het gebied van de rundveeproduktie en 93/25/EEG van de Raad betreffende
    de statistische enquêtes op het gebied van de schapen- en geitenproduktie'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 18 września 1995 r. zmieniająca decyzje Komisji
    94/432/WE, 94/433/WE i 94/434/WE ustanawiające szczegółowe zasady stosowania
    dyrektyw Rady 93/23/EWG w sprawie prowadzenia badań statystycznych dotyczących
    produkcji świń, 93/24/EWG w sprawie prowadzenia badań statystycznych dotyczących
    produkcji bydła i 93/25/EWG w sprawie prowadzenia badań statystycznych dotyczących
    pogłowia owiec i kóz
  type: main
- language: pt
  script: Latn
  content: '95/380/CE: Decisão da Comissão, de 18 de Setembro de 1995, que altera
    as Decisões 94/432/CE, 94/433/CE e 94/434/CE da Comissão, que estabelecem disposições
    de aplicação das Directivas do Conselho 93/23/CEE, relativa aos inquéritos
    estatísticos a efectuar no domínio da produção de suínos, 93/24/CEE, relativa
    aos inquéritos estatísticos a efectuar no domínio da produção de bovinos,
    e 93/25/CEE, relativa aos inquéritos estatísticos a efectuar no domínio da
    produção de ovinos e caprinos'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 18. septembra 1995, ktoré mení a dopĺňa rozhodnutia
    Komisie 94/432/ES, 94/433/ES a 94/434/ES, stanovujúce podrobné pravidlá pre
    uplatňovanie smerníc Rady 93/23/EHS o štatistických zisťovaniach, ktoré
    sa majú vykonávať ohľadne produkcie ošípaných, 93/24/EHS o štatistických
    zisťovaniach, ktoré sa majú vykonávať ohľadne produkcie hovädzieho dobytka
    a 93/25/EHS o štatistických zisťovaniach, ktoré sa majú vykonávať ohľadne
    stavov oviec a kôzText významný pre Európsky hospodársky priestor
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 18. septembra 1995 o spremembi odločb Komisije
    94/432/ES, 94/433/ES in 94/434/ES o podrobnih pravilih za uporabo direktiv Sveta
    93/23/EGS o statističnih raziskovanjih, ki se izvajajo v prašičereji, 93/24/EGS
    o statističnih raziskovanjih v govedoreji ter 93/25/EGS o statističnih raziskovanjih
    o staležu ovac in koz
  type: main
- language: es
  script: Latn
  content: '95/380/CE: Decisión de la Comisión, de 18 de septiembre de 1995, por
    la que se modifican las Decisiones de la Comisión 94/432/CE, 94/433/CE y 94/434/CE,
    por las que se establecen disposiciones de aplicación, respectivamente, de las
    Directivas del Consejo 93/23/CEE relativa a la realización de encuestas estadísticas
    en el sector porcino, 93/24/CEE relativa a la realización de encuestas estadísticas
    en el sector bovino y 93/25/CEE relativa a la realización de encuestas estadísticas
    en los sectores ovino y caprino'
  type: main
- language: sv
  script: Latn
  content: '95/380/EG: Kommissionens beslut av den 18 september 1995 om ändring av
    beslut nr 94/432/EG, 94/433/EG och 94/434/EG om tillämpningsföreskrifter för
    rådets direktiv 93/23/EEG om statistiska undersökningar av grisproduktionen,
    93/24/EEG om genomförande av statistika undersökningar om produktion av nötkreatur
    och 93/25/EEG om statistiska undersökningar av får- och getbesättningar'
