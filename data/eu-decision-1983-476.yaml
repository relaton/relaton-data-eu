title:
- language: en
  script: Latn
  content: Commission Decision of 12 September 1983 on provisional payment of the
    Community financial participation for 1982 and of an advance on that financial
    participation for 1983 in inspection and surveillance operations in the maritime
    waters of Ireland (Only the English text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 12 septembre 1983 relative au versement provisoire
    de la participation financière de la Communauté au titre de l'année 1982 et
    d'une avance sur cette participation au titre de l'année 1983, aux opérations
    d'inspection et de surveillance des eaux maritimes de l'Irlande (Le texte en langue
    anglaise est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. September 1983 über die vorläufige
    Überweisung der finanziellen Beteiligung der Gemeinschaft für das Jahr 1982
    und einer Vorauszahlung dieser Beteiligung für das Jahr 1983 an Kontroll- und
    Überwachungsmaßnahmen in den Meeresgewässern Irlands (Nur der englische Text
    ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 12. september 1983 om foreløbig betaling af
    det finansielle bidrag fra Fællesskabet for 1982 samt om et forskud på dette
    bidrag for 1983 til inspektion og overvågning i Irlands farvande (Kun den engelske
    udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 12ης Σεπτεμβρίου
    1983 περί προσωρινής καταβολής της οικονομικής
    συμμετοχής της Κοινότητας για το 1982 και προκαταβολής
    από αυτή τη συμμετοχή, για το 1983, για τις επιχειρήσεις
    επιθεωρήσεως και επιτηρήσεως των θαλασσίων
    υδάτων της Ιρλανδίας (Το κείμενο στην αγγλική
    γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione del 12 settembre 1983 relativa al versamento
    provvisorio della partecipazione finanziaria della Comunità per l'anno 1982,
    e di un anticipo su tale partecipazione per l'anno 1983, alle operazioni di ispezione
    e sorveglianza delle acque marittime dell'Irlanda (Il testo in lingua inglese
    è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 september 1983 inzake de voorlopige
    betaling van de financiële bijdrage van de Gemeenschap in 1982 en van een voorschot
