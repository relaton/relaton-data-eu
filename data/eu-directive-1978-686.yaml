    tandheelkunde, tevens houdende maatregelen tot vergemakkelijking van de daadwerkelijke
    uitoefening van het recht van vestiging en vrij verrichten van diensten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 25 lipca 1978 r. dotycząca wzajemnego uznawania
    dyplomów, świadectw i innych dokumentów potwierdzających posiadanie kwalifikacji
    osób wykonujących zawód lekarza dentysty, łącznie ze środkami mającymi
