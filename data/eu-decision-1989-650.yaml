  script: Latn
  content: '89/650/EEC: Council Decision of 19 December 1989 on the conclusion of
    the Agreement in the form of an exchange of letters concerning the provisional
    application of the protocol laying down the conditions relating to fishing provided
    for in the Agreement on fisheries between the European Economic Community, on
    the one hand, and the government of Denmark and the home rule government of Greenland,
    on the other hand, for the period from 1 January 1990 to 31 December 1994'
  type: main
