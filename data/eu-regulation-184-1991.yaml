- language: en
  script: Latn
  content: Commission Regulation (EEC) No 184/91 of 25 January 1991 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    (STM) to trade in fruit and vegetable between Spain and the Community as constituted
    on 31 December 1985 as regards tomatoes, lettuce, broad-leaf endives, carrots,
    artichokes, table grapes, melons and strawberries
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 184/91 DE LA COMMISSION du 25 janvier 1991 fixant
    certaines modalités additionnelles pour l'' application du mécanisme complémentaire
    aux échanges (MCE) dans le secteur des fruits et légumes entre l'' Espagne et
    la Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les
    tomates, les laitues, les chicorées scaroles, les carottes, les artichauts, les
    raisins de table, les melons et les fraises #'
  type: main
