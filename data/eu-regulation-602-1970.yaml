  content: Règlement (CEE) n° 602/70 de la Commission, du 31 mars 1970, diminuant
    le montant prévu à l'article 4 du règlement (CEE) n° 1661/69 dont est diminuée
    l'aide pour les graines oléagineuses triturées en France
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 602/70 der Kommission vom 31. März 1970 zur Verminderung
    des in Artikel 4 der Verordnung (EWG) Nr. 1661/69 vorgesehenen Betrages, um den
    in Frankreich die Beihilfe für verarbeitete Ölsaaten verringert wird
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 602/70 della Commissione, del 31 marzo 1970, che diminuisce
    l'importo detratto ai sensi dell'articolo 4 del regolamento (CEE) n. 1661/69 dall'integrazione
    per i semi oleosi triturati in Francia
  type: main
- language: nl
  script: Latn
