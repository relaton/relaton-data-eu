title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 1er décembre 1971, autorisant la République
    française à exclure du traitement communautaire les appareils d'enregistrement
    et de reproduction du son, de la position 92.11 A III du Tarif douanier commun,
    originaires du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/13/EWG: Entscheidung der Kommission vom 1. Dezember 1971, mit der die
    Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Tonaufnahme- und Tonwiedergabegeräte
    der Tarifnummer 92.11 A III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/13/CEE: Decisione della Commissione, del 1 dicembre 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    misti di registrazione e di riproduzione del suono, della voce 92.11 A III della
    tariffa doganale comune originari del Giappone e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/13/EEG: Beschikking van de Commissie van 1 december 1971 waarbij de
    Franse Republiek wordt gemachtigd gecombineerde opname- en weergavetoestellen,
    van post 92.11 A III van het gemeenschappelijk douanetarief, van oorsprong uit
    Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
