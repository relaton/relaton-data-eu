title:
- language: en
  script: Latn
  content: '81/614/EEC: Commission Decision of 22 June 1981 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to woven fabrics of synthetic fibres (discontinuous
    or waste) originating in Romania (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/614/CEE: Décision de la Commission, du 22 juin 1981, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les tissus de fibres textiles synthétiques
    discontinues, originaires de Roumanie (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/614/EWG: Entscheidung der Kommission vom 22. Juni 1981 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande, aus Rumänien stammende Gewebe aus synthetischen Spinnfasern von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/614/EØF: Kommissionens beslutning af 22. juni 1981 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage vævet stof af korte kemofibre, syntetiske
    eller regenererede, med oprindelse i Rumænien (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/614/ΕΟΚ: Απόφαση τής Επιτροπής τής 22ας
    Ιουνίου 1981 περί χορηγήσεως αδείας στό Βασίλειο
    τού Βελγίου, στό Μεγάλο Δουκάτο τού Λουξεμβούργου
    καί στό Βασίλειο τών Κάτω Χωρών νά εξαιρέσουν
    από τήν κοινοτική μεταχείριση τά υφάσματα
    εκ μή συνεχών συνθετικών υφαντικών ινών καταγωγής
    Ρουμανίας (Τα κείμενα στην γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/614/CEE: Decisione della Commissione, del 22 giugno 1981, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i tessuti di fibre tessili sintetiche
    in fiocco originari della Romania (Il testi in lingua francese e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '81/614/EEG: Beschikking van de Commissie van 22 juni 1981 houdende machtiging
    van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der
    Nederlanden om weefsels van synthetische stapelvezels van oorsprong uit Roemenië
    van de communautaire behandeling uit te sluiten (Slechts de teksten in de Franse
    en de Nederlandse taal zijn authentiek)'
