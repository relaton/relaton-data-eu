title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1884/84 of 2 July 1984 re-establishing the
    levying of customs duties on gelatin and gelatin derivatives, falling within subheading
    35.03 ex B and originating in Colombia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1884/84 de la Commission du 2 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés, de la sous-position 35.03 ex B du tarif douanier commun, originaires
    de Colombie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1884/84 der Kommission vom 2. Juli 1984 zur Wiedereinführung
    der Erhebung der Zölle für Gelatine und ihre Derivate der Tarifstelle 35.03
    ex B mit Ursprung in Kolumbien, dem die in der Verordnung (EWG) Nr. 3569/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1884/84 af 2. juli 1984 om genindførelse
    af opkrævning af told for gelatine og derivater deraf, henhørende under pos.
    35.03 ex B og med oprindelse i Colombia, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1884/84 της Επιτροπής
    της 2ας Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ζελατίνες και τα παράγωγα
    αυτών, της διακρίσεως 35.03 ex B του Κοινού Δασμολογίου,
    καταγωγής Κολομβίας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1884/84 della Commissione del 2 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili alle gelatine e loro derivati della
    sottovoce 35.03 ex B della tariffa doganale comune, originari della Colombia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1884/84 van de Commissie van 2 juli 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gelatine en
    derivaten daarvan van tariefpostonderverdeling 35.03 ex B, van oorsprong uit Colombia,
    waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
