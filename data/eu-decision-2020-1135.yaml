  content: Council Decision (CFSP) 2020/1135 of 30 July 2020 appointing the European
    Union Special Representative in Kosovo (This designation is without prejudice
    to positions on status, and is in line with UNSCR 1244/1999 and the ICJ Opinion
    on the Kosovo declaration of independence.)
  type: main
- language: fr
  script: Latn
