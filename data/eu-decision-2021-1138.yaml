title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1138 of 7 July 2021 approving
    national plans and amendments thereto, as regards Bulgaria and Romania, for the
    implementation of the validation systems in accordance with Council Regulation
    (EC) No 1224/2009 (notified under document C(2021) 5158) (Only the Bulgarian and
    Romanian texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1138 de la Commission du 7 juillet 2021
    approuvant les plans nationaux et leurs modifications, en ce qui concerne la Bulgarie
    et la Roumanie, pour la mise en œuvre des systèmes de validation conformément
    au règlement (CE) no 1224/2009 du Conseil [notifiée sous le numéro C(2021)
    5158] (Les textes en langues bulgare et roumaine sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1138 der Kommission vom 7. Juli 2021
    zur Genehmigung nationaler Pläne und ihrer Änderungen in Bezug auf Bulgarien
    und Rumänien zur Umsetzung der Validierungssysteme gemäß der Verordnung (EG)
    Nr. 1224/2009 des Rates (Bekannt gegeben unter Aktenzeichen C(2021) 5158) (Nur
    der bulgarische und der rumänische Text sind verbindlich)
  type: main
- language: bg
