    de table dans les échanges entre les États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2565/77 der Kommission vom 22. November 1977 zur Ermächtigung
    des Königreichs Dänemark zur Aufhebung der auf Tafeläpfel im Handel zwischen
    den Mitgliedstaaten anzuwendenden Zollsätze
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2565/77 af 22. november 1977 om bemyndigelse
