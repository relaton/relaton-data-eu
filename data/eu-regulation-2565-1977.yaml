  content: Commission Regulation (EEC) No 2565/77 of 22 November 1977 authorizing
    the Kingdom of Denmark to abolish the customs duties applicable to dessert apples
    in trade between Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2565/77 de la Commission, du 22 novembre 1977, autorisant
