    mele da tavola negli scambi tra gli Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2565/77 van de Commissie van 22 november 1977 waarbij
    het Koninkrijk Denemarken wordt gemachtigd tot afschaffing van de douanerechten
    toepasselijk op tafelappelen in het handelsverkeer tussen Lid-Staten
