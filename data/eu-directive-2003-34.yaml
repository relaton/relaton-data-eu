    relativa à limitação da colocação no mercado e da utilização de algumas
    substâncias e preparações perigosas (substâncias classificadas como cancerígenas,
    mutagénicas ou tóxicas para a reprodução — c/m/r)
  type: main
- language: ro
  script: Latn
  content: Directiva 2003/34/CE a Parlamentului European și a Consiliului din 26
    mai 2003 de efectuare a celei de-a douăzeci și treia modificări a Directivei
    76/769/CEE a Consiliului referitoare la restricțiile privind introducerea pe
    piață și utilizarea anumitor substanțe și preparate periculoase (substanțe
    clasificate drept cancerigene, mutagene sau substanțe toxice pentru reproducere
    – c/m/r)
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2003/34/ES z 26. mája 2003, ktorou
    sa mení a dopĺňa po dvadsiaty tretíkrát smernica Rady 76/769/EHS o aproximácii
    zákonov, iných právnych predpisov a správnych opatrení členských štátov
    vzťahujúcich sa na obmedzenia uvádzania na trh a používania niektorých nebezpečných
