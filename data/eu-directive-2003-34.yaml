  content: Directive 2003/34/EC of the European Parliament and of the Council of 26
    May 2003 amending for the 23rd time Council Directive 76/769/EEC relating to restrictions
    on the marketing and use of certain dangerous substances and preparations (substances
    classified as carcinogens, mutagens or substances toxic to reproduction — c/m/r)
  type: main
