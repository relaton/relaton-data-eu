  content: Commission Regulation (EEC) No 2827/87 of 22 September 1987 re-establishing
    the levying of customs duties on other articles for electrical light fittings,
    falling within subheadings 70.14 A II and B originating in South Korea, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3924/86
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2827/87 de la Commission du 22 septembre 1987 portant
