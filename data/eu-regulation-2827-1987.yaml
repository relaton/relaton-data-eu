    pour l' équipement des appareils d' éclairage électrique, des sous-positions
    70.14 A II et B du tarif douanier commun, originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
