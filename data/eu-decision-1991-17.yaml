title:
- language: en
  script: Latn
  content: '91/17/EEC: Commission Decision of 18 December 1990 on the eligibility
    of expenditure to be incurred in 1991 by Spain, Ireland and Portugal for the purpose
    of ensuring compliance with the Community system for the conservation and management
    of fishery resources (only the Spanish, English and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/17/CEE: Décision de la Commission du 18 décembre 1990 relative à
    l''éligibilité des dépenses à effectuer par l''Espagne, l''Irlande et le Portugal
    au cours de l''année 1991 pour assurer le respect du régime communautaire de
    conservation et de gestion des ressources de pêche (Les textes en langues espagnole,
    anglaise et portugaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 18. Dezember 1990 über die Erstattungsfähigkeit
    von Ausgaben Spaniens, Irlands und Portugals im Jahr 1991 zur Gewährleistung
    der Einhaltung der gemeinschaftlichen Regelung für die Erhaltung und Bewirtschaftung
    der Fischereiressourcen (Nur der spanische, der englische und der portugiesische
    Text sind verbindlich) (91/17/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 18. december 1990 om refusionsberettigelsen
    af udgifter i 1991 for Spanien, Irland og Portugal til at sikre overholdelse af
    fællesskabsordningen for bevarelse og forvaltning af fiskeressourcerne (Kun de
    spanske, engelske og portugisiske udgaver er autentiske) (91/17/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/17/ΕΟΚ: Απόφαση της Επιτροπής της 18ης Δεκεμβρίου
    1990 σχετικά με την επιλεξιμότητα των δαπανών
    που θα πραγματοποιηθούν εντός του 1991 από την
    Ισπανία, την Ιρλανδία και την Πορτογαλία για
    την εφαρμογή του κοινοτικού καθεστώτος διατήρησης
    και διαχείρισης των αλιευτικών πόρων'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 18 dicembre 1990 relativa all'' imputabilità
    della Comunità alle spese dovendo essere sostenute nel 1991 dalla Spagna, dall''
    Irlanda e dal Portogallo per garantire il rispetto del regime comunitario di conservazione
    e di gestione delle risorse dalla pesca (I testi in lingua spagnola, inglese e
    portoghese sono i soli facenti fede) (91/17/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 18 december 1990 inzake de financierbaarheid
    van in 1991 gedane uitgaven door Spanje, Ierland en Portugal om de communautaire
    regeling voor de instandhouding en het beheer van de visbestanden te doen naleven
    (Slechts de teksten in de Spaanse, de Engelse en de Portugese taal zijn authentiek)
    (91/17/EEG) #'
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 18 de Dezembro de 1990 relativa à elegibilidade
    das despesas suportadas durante o ano de 1991 por Espanha, Irlanda e Portugal
    com o objectivo de assegurar a observância do regime comunitário de conservação
    e de gestão dos recursos da pesca (Apenas fazem fé os textos em língua espanhola,
    inglesa e portuguesa) (91/17/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 18 de diciembre de 1990 relativa a la admisibilidad
