title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2931 of 27 November 2024 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Prunus avium, Prunus canescens, Prunus cerasus, Prunus pseudocerasus and Prunus
    spinosa originating in the United Kingdom, and Implementing Regulation (EU) 2020/1213
    as regards the phytosanitary measures for the introduction of those plants for
    planting into the Union
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2931 de la Commission du 27 novembre
    2024 modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne
    certains végétaux destinés à la plantation appartenant aux espèces Prunus
    avium, Prunus canescens, Prunus cerasus, Prunus pseudocerasus et Prunus spinosa
    et en provenance du Royaume-Uni, et le règlement d’exécution (UE) 2020/1213
    en ce qui concerne les mesures phytosanitaires préalables à l’introduction
    de ces végétaux destinés à la plantation dans l’Union
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2931 der Kommission vom 27. November
    2024 zur Änderung der Durchführungsverordnung (EU) 2018/2019 hinsichtlich einiger
    zum Anpflanzen bestimmter Pflanzen von Prunus avium, Prunus canescens, Prunus
    cerasus, Prunus pseudocerasus und Prunus spinosa mit Ursprung im Vereinigten Königreich
    sowie zur Änderung der Durchführungsverordnung (EU) 2020/1213 hinsichtlich der
    Pflanzenschutzmaßnahmen für das Einführen dieser zum Anpflanzen bestimmten
    Pflanzen in die Union
  type: main
- language: bg
  script: Cyrl
