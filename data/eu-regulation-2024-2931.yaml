    uit het Verenigd Koninkrijk afkomstige voor opplant bestemde planten van de soorten
    Prunus avium, Prunus canescens, Prunus cerasus, Prunus pseudocerasus en Prunus
    spinosa, en tot wijziging van Uitvoeringsverordening (EU) 2020/1213 betreffende
    de fytosanitaire maatregelen voor het binnenbrengen in de Unie van die voor opplant
    bestemde planten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/2931 z dnia 27 listopada 2024
    r. zmieniające rozporządzenie wykonawcze (UE) 2018/2019 w odniesieniu do niektórych
    przeznaczonych do sadzenia roślin gatunków Prunus avium, Prunus canescens, Prunus
    cerasus, Prunus pseudocerasus i Prunus spinosa pochodzących ze Zjednoczonego
    Królestwa oraz zmieniające rozporządzenie wykonawcze (UE) 2020/1213 w odniesieniu
    do środków fitosanitarnych do celów wprowadzania tych roślin przeznaczonych
    do sadzenia do Unii
  type: main
