    растения за засаждане от видовете Prunus avium, Prunus
    canescens, Prunus cerasus, Prunus pseudocerasus и Prunus spinosa с произход
    от Обединеното кралство и за изменение на Регламент
    за изпълнение (ЕС) 2020/1213 по отношение на фитосанитарните
    мерки за въвеждането на тези растения за засаждане
    в Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/2931 ze dne 27. listopadu 2024,
    kterým se mění prováděcí nařízení (EU) 2018/2019, pokud jde o některé
    rostliny k pěstování druhů Prunus avium, Prunus canescens, Prunus cerasus,
    Prunus pseudocerasus a Prunus spinosa pocházející ze Spojeného království,
    a prováděcí nařízení (EU) 2020/1213, pokud jde o fytosanitární opatření
    pro dovoz uvedených rostlin k pěstování do Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/2931 af 27. november
    2024 om ændring af gennemførelsesforordning (EU) 2018/2019 for så vidt angår
    visse planter til plantning af Prunus avium, Prunus canescens, Prunus cerasus,
    Prunus pseudocerasus og Prunus spinosa med oprindelse i Det Forenede Kongerige
    og af gennemførelsesforordning (EU) 2020/1213 for så vidt angår de plantesundhedsmæssige
    foranstaltninger for indførsel til Unionen af disse planter til plantning
  type: main
