    Yhdistyneestä kuningaskunnasta peräisin olevien Prunus avium-, Prunus canescens-,
    Prunus cerasus-, Prunus pseudocerasus- ja Prunus spinosa -lajien istutettaviksi
    tarkoitettujen kasvien osalta ja täytäntöönpanoasetuksen (EU) 2020/1213 muuttamisesta
    siltä osin kuin on kyse kyseisten istutettaviksi tarkoitettujen kasvien tuomista
    unioniin koskevista kasvinsuojelutoimenpiteistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/2931 ón gCoimisiún an 27 Samhain
    2024 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 a mhéid a bhaineann
    le plandaí áirithe Prunus avium, Prunus canescens, Prunus cerasus, Prunus pseudocerasus
    agus Prunus spinosa le haghaidh plandú de thionscnamh na Ríochta Aontaithe,
    agus lena leasaítear Rialachán Cur Chun Feidhme (AE) 2020/1213 a mhéid a bhaineann
    leis na bearta fíteashláintíochta chun na plandaí sin le haghaidh plandú
    a thabhairt isteach san Aontas
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/2931 оd 27. studenoga 2024. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrsta Prunus
    avium, Prunus canescens, Prunus cerasus, Prunus pseudocerasus i Prunus spinosa
    podrijetlom iz Ujedinjene Kraljevine i Provedbene uredbe (EU) 2020/1213 u pogledu
    fitosanitarnih mjera za unos tog bilja za sadnju u Uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/2931 végrehajtási rendelete (2024. november 27.)
    az (EU) 2018/2019 végrehajtási rendeletnek a Prunus avium, a Prunus canescens,
    a Prunus cerasus, a Prunus pseudocerasus és a Prunus spinosa bizonyos, az Egyesült
    Királyságból származó, ültetésre szánt növényei tekintetében, valamint
    az (EU) 2020/1213 végrehajtási rendeletnek az említett, ültetésre szánt
    növények Unióba való behozatalára vonatkozó növényegészségügyi intézkedések
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/2931 della Commissione, del 27 novembre
    2024, recante modifica del regolamento di esecuzione (UE) 2018/2019 per quanto
    riguarda alcune piante da impianto di Prunus avium, Prunus canescens, Prunus cerasus,
    Prunus pseudocerasus e Prunus spinosa originarie del Regno Unito e del regolamento
    di esecuzione (UE) 2020/1213 per quanto riguarda le misure fitosanitarie per l’introduzione
    nell’Unione di tali piante da impianto
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/2931 (2024. gada 27. novembris),
    ar ko attiecībā uz Apvienotās Karalistes izcelsmes noteiktiem stādāmiem Prunus
    avium, Prunus canescens, Prunus cerasus, Prunus pseudocerasus un Prunus spinosa
    augiem groza Īstenošanas regulu (ES) 2018/2019 un attiecībā uz fitosanitārajiem
    pasākumiem minēto stādāmo augu ievešanai Savienībā groza Īstenošanas
    regulu (ES) 2020/1213
  type: main
- language: lt
  script: Latn
  content: 2024 m. lapkričio 27 d. Komisijos įgyvendinimo reglamentas (ES) 2024/2931,
    kuriuo dėl tam tikrų Jungtinės Karalystės kilmės sodinti skirtų Prunus avium,
    Prunus canescens, Prunus cerasus, Prunus pseudocerasus ir Prunus spinosa augalų
    iš dalies keičiamas Reglamentas (ES) 2018/2019 ir dėl fitosanitarinių priemonių,
    taikomų tiems į Sąjungą įvežamiems sodinti skirtiems augalams, iš dalies
    keičiamas Įgyvendinimo reglamentas (ES) 2020/1213
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/2931 tas-27
    ta’ Novembru 2024 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2018/2019
    fir-rigward ta’ ċerti pjanti għat-tħawwil ta’ Prunus avium, Prunus canescens,
    Prunus cerasus, Prunus pseudocerasus u Prunus spinosa li joriġinaw mir-Renju
    Unit, u r-Regolament ta’ Implimentazzjoni (UE) 2020/1213 fir-rigward tal-miżuri
    fitosanitarji għall-introduzzjoni ta’ dawk il-pjanti għat-tħawwil fit-territorju
    tal-Unjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/2931 van de Commissie van 27 november
