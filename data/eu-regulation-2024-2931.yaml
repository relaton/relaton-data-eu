    de 2024, que altera o Regulamento de Execução (UE) 2018/2019, no que diz respeito
    a determinados vegetais para plantação de Prunus avium, Prunus canescens, Prunus
    cerasus, Prunus pseudocerasus e Prunus spinosa originários do Reino Unido, e
    o Regulamento de Execução (UE) 2020/1213, no que diz respeito às medidas fitossanitárias
    para a introdução desses vegetais para plantação na União
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/2931 al Comisiei din 27 noiembrie
    2024 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante destinate plantării din speciile Prunus avium,
    Prunus canescens, Prunus cerasus, Prunus pseudocerasus și Prunus spinosa originare
    din Regatului Unit și a Regulamentului de punere în aplicare (UE) 2020/1213
    în ceea ce privește măsurile fitosanitare vizând introducerea în Uniune a
    plantelor respective destinate plantării
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/2931 z 27. novembra 2024, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    určené na výsadbu patriace k druhom Prunus avium, Prunus canescens, Prunus
    cerasus, Prunus pseudocerasus a Prunus spinosa pochádzajúce zo Spojeného kráľovstva,
    a ktorým sa mení vykonávacie nariadenie (EÚ) 2020/1213, pokiaľ ide o rastlinolekárske
    opatrenia v súvislosti so vstupom uvedených rastlín určených na výsadbu
    do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/2931 z dne 27. novembra 2024 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Prunus avium,
    Prunus canescens, Prunus cerasus, Prunus pseudocerasus in Prunus spinosa s poreklom
    iz Združenega kraljestva ter Izvedbene uredbe (EU) 2020/1213 glede fitosanitarnih
    ukrepov za vnos navedenih rastlin za saditev v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/2931 de la Comisión, de 27 de noviembre
    de 2024, por el que se modifican el Reglamento de Ejecución (UE) 2018/2019 en
    lo que respecta a determinados vegetales para plantación de Prunus avium, Prunus
    canescens, Prunus cerasus, Prunus pseudocerasus y Prunus spinosa originarios del
    Reino Unido, y el Reglamento de Ejecución (UE) 2020/1213 en lo que respecta a
    las medidas fitosanitarias para la introducción de dichos vegetales para plantación
    en la Unión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/2931 av den 27 november
    2024 om ändring av genomförandeförordning (EU) 2018/2019 vad gäller vissa
    växter för plantering av Prunus avium, Prunus canescens, Prunus cerasus, Prunus
    pseudocerasus och Prunus spinosa med ursprung i Förenade kungariket, och om ändring
    av genomförandeförordning (EU) 2020/1213 vad gäller växtskyddsåtgärder för
    införsel av dessa växter för plantering till unionen
