title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1040 of 29 June 2022 amending
    Annexes VI and XV to Implementing Regulation (EU) 2021/404 as regards the lists
    of third countries, territories or zones thereof authorised for the entry into
    the Union of certain captive birds and germinal products thereof and meat products
    from poultry
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1040 de la Commission du 29 juin 2022
    modifiant les annexes VI et XV du règlement d’exécution (UE) 2021/404 en ce
    qui concerne les listes des pays tiers et territoires, ou des zones de pays tiers
    ou territoire, en provenance desquels l’entrée dans l’Union de certains oiseaux
    captifs et de leurs produits germinaux et des produits à base de viande de volaille
    est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1040 der Kommission vom 29. Juni 2022
    zur Änderung der Anhänge VI und XV der Durchführungsverordnung (EU) 2021/404
    hinsichtlich der Listen von Drittländern, Gebieten und Zonen derselben, aus denen
    der Eingang von in Gefangenschaft gehaltenen Vögeln und Zuchtmaterial von in
    Gefangenschaft gehaltenen Vögeln sowie Fleischerzeugnissen von Geflügel in die
    Union zulässig ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1040 на Комисията
    от 29 юни 2022 година за изменение на приложения
    VI и XV към Регламент за изпълнение (ЕС) 2021/404 по
    отношение на списъците на трети държави, територии
    или зони от тях, от които е разрешено въвеждането
    в Съюза на определени птици, отглеждани в плен,
    зародишни продукти от тях и месни продукти
    от домашни птици
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1040 ze dne 29. června 2022,
    kterým se mění přílohy VI a XV prováděcího nařízení (EU) 2021/404,
    pokud jde o seznamy třetích zemí, území nebo jejich oblastí, z nichž je
    povolen vstup některých ptáků chovaných v zajetí a jejich zárodečných
    produktů a masných výrobků z drůbeže do Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1040 af 29. juni 2022
    om ændring af bilag VI og XV til gennemførelsesforordning (EU) 2021/404 for
    så vidt angår listerne over tredjelande, territorier eller zoner deri, hvorfra
    det er tilladt at indføre visse fugle i fangenskab og avlsmateriale deraf og
    kødprodukter af fjerkræ til Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/1040 της Επιτροπής
