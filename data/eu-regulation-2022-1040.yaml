    Chun Feidhme (AE) 2021/404 a mhéid a bhaineann leis na liostaí de thríú tíortha,
    de chríocha nó de chriosanna de thríú tír nó de chríoch atá údaraithe
    i dtaca le héin áirithe i mbraighdeanas agus táirgí geirmeacha díobh agus
    táirgí feola ó éanlaith chlóis a theacht isteach san Aontas
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1040 оd 29. lipnja 2022. o izmjeni
    priloga VI. i XV. Provedbenoj uredbi (EU) 2021/404 u pogledu popisa trećih zemalja,
    područja ili njihovih zona iz kojih je odobren ulazak u Uniju određenih ptica
    u zatočeništvu i njihovih zametnih proizvoda te mesnih proizvoda peradi
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1040 végrehajtási rendelete (2022. június 29.)
    az (EU) 2021/404 végrehajtási rendelet VI. és XV. mellékletének az egyes
    fogságban tartott madarak és szaporítóanyagaik, valamint baromfiból származó
    húskészítmények Unióba történő beléptetése tekintetében engedélyezett
    harmadik országok, területek vagy azok körzetei jegyzékei tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1040 della Commissione del 29 giugno
    2022 che modifica gli allegati VI e XV del regolamento di esecuzione (UE) 2021/404
    per quanto riguarda gli elenchi di paesi terzi, territori o loro zone da cui è
    autorizzato l’ingresso nell’Unione di determinati volatili in cattività e
    del relativo materiale germinale e di prodotti a base di carne ottenuti da pollame
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1040 (2022. gada 29. jūnijs),
    ar ko attiecībā uz tādu trešo valstu, teritoriju vai to zonu sarakstiem, no
    kurām atļauts Savienībā ievest noteiktus nebrīvē turētus putnus, to reproduktīvos
    produktus un mājputnu gaļas produktus, groza Īstenošanas regulas (ES) 2021/404
    VI un XV pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/1040 2022 m. birželio 29
    d. kuriuo dėl trečiųjų šalių, teritorijų arba jų zonų, iš kurių leidžiama
    į Sąjungą įvežti tam tikrus nelaisvėje laikomus paukščius, jų genetinės
    medžiagos produktus ir naminių paukščių mėsos gaminius, sąrašų iš dalies
    keičiami Įgyvendinimo reglamento (ES) 2021/404 VI ir XV priedai
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1040 tad-29
    ta’ Ġunju 2022 li jemenda l-Annessi VI u XV tar-Regolament ta’ Implimentazzjoni
    (UE) 2021/404 rigward il-listi tal-pajjiżi terzi, tat-territorji jew taż-żoni
    tagħhom li minnhom huma awtorizzati jidħlu fl-Unjoni ċerti għasafar miżmuma
    u prodotti ġerminali tagħhom u prodotti tal-laħam tal-pollam
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1040 van de Commissie van 29 juni 2022
    tot wijziging van de bijlagen VI en XV bij Uitvoeringsverordening (EU) 2021/404
    wat betreft de lijsten van derde landen, gebieden of zones daarvan waaruit de
    binnenkomst in de Unie van bepaalde in gevangenschap levende vogels, levende producten
    daarvan en vleesproducten van pluimvee, is toegestaan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1040 z dnia 29 czerwca 2022
    r. w sprawie zmiany załączników VI i XV do rozporządzenia wykonawczego (UE)
    2021/404 w odniesieniu do wykazów państw trzecich, terytoriów lub ich stref,
    z których dozwolone jest wprowadzanie do Unii określonych ptaków żyjących
    w niewoli i ich materiału biologicznego oraz produktów mięsnych z drobiu
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/1040 da Comissão de 29 de junho de
    2022 que altera os anexos VI e XV do Regulamento de Execução (UE) 2021/404 no
    que diz respeito às listas de países terceiros, territórios ou respetivas zonas
    autorizados para a entrada na União de determinadas aves em cativeiro e respetivos
    produtos germinais e de produtos à base de carne de aves de capoeira
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1040 al Comisiei din 29 iunie
    2022 de modificare a anexelor VI și XV la Regulamentul de punere în aplicare
    (UE) 2021/404 în ceea ce privește listele cu țările terțe, teritoriile sau
    zonele din acestea autorizate pentru introducerea în Uniune a anumitor păsări
    captive și a materialului germinativ provenit de la acestea, precum și a produselor
    din carne de pasăre
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1040 z 29. júna 2022, ktorým
    sa menia prílohy VI a XV k vykonávaciemu nariadeniu (EÚ) 2021/404, pokiaľ
    ide o zoznamy tretích krajín, území alebo ich pásiem, z ktorých sa povoľuje
    vstup určitých vtákov chovaných v zajatí a ich zárodočných produktov a
    mäsových produktov z hydiny do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/1040 z dne 29. junija 2022 o spremembi
    prilog VI in XV k Izvedbeni uredbi (EU) 2021/404 glede seznamov tretjih držav,
    njihovih ozemelj ali območij, s katerih je dovoljen vstop nekaterih ptic v ujetništvu
    in njihovega zarodnega materiala ter mesnih proizvodov perutnine v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1040 de la Comisión de 29 de junio
    de 2022 por el que se modifican los anexos VI y XV del Reglamento de Ejecución
    (UE) 2021/404 en lo que respecta a las listas de terceros países, territorios,
    o zonas de estos, autorizados a introducir en la Unión determinadas aves en cautividad
    y sus productos reproductivos, así como productos cárnicos de aves de corral
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/1040 av den 29 juni 2022
    om ändring av bilagorna VI och XV till genomförandeförordning (EU) 2021/404
    vad gäller förteckningarna över tredjeländer, territorier eller zoner däri
    från vilka vissa fåglar i fångenskap och avelsmaterial från fåglar i fångenskap
    och köttprodukter från fjäderfä får föras in till unionen
