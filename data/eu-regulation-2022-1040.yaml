    παραρτημάτων VI και XV του εκτελεστικού κανονισμού
    (ΕΕ) 2021/404 όσον αφορά τους καταλόγους τρίτων
    χωρών, εδαφών ή ζωνών αυτών από τις οποίες/τα
    οποία επιτρέπεται η είσοδος, στην Ένωση, ορισμένων
    πτηνών σε αιχμαλωσία, ζωικού αναπαραγωγικού
    υλικού τέτοιων πτηνών, και προϊόντων με βάση
    το κρέας από πουλερικά
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/1040, 29. juuni 2022, millega muudetakse
    rakendusmääruse (EL) 2021/404 VI ja XV lisa selliste kolmandate riikide, territooriumide
    või nende tsoonide loetelude osas, millest on lubatud liitu tuua teatavaid tehistingimustes
    peetavaid linde ja nende paljundusmaterjali ning kodulindudelt saadud lihatooteid
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/1040, annettu 29 päivänä
    kesäkuuta 2022, täytäntöönpanoasetuksen (EU) 2021/404 liitteiden VI ja XV
    muuttamisesta siltä osin kuin on kyse sellaisten kolmansien maiden, alueiden
    tai niiden vyöhykkeiden luetteloista, joista tiettyjen vankeudessa pidettävien
    lintujen ja niiden sukusolujen ja alkioiden sekä siipikarjasta saatavien lihavalmisteiden
    tulo unioniin on sallittua
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/1040 ón gCoimisiún an 29 Meitheamh
