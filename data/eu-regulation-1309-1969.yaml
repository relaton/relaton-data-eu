  content: Règlement (CEE) n 1309/69 de la Commission, du 8 juillet 1969, déterminant
    les montants des éléments mobiles rectifiés applicables à compter du 10 juillet
    1969, à l'importation dans la Communauté de certaines marchandises relevant
    du règlement (CEE) n 1059/69 du Conseil, fabriquées à partir de riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1309/69 der Kommission vom 8. Juli 1969 zur Festsetzung
    der Höhe der ab 10. Juli 1969 bei der Einfuhr der unter die Verordnung (EWG)
    Nr. 1059/69 des Rates fallenden, aus Reis hergestellten Waren anwendbaren Teilbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1309/69 della Commissione, dell' 8 luglio 1969, che
    determina gli importi degli elementi mobili rettificati applicabili dal 10 luglio
    1969 all'importazione nella Comunità di talune merci fabbricate con riso alle
    quali si applica il regolamento (CEE) n.1059/69 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1309/69 van de Commissie van 8 juli 1969 tot vaststelling
