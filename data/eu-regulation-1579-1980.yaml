id: EURegulation15791980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1579/80 of 19 June 1980 imposing a provisional
    anti-dumping duty on mechanical alarm clocks (other than travel alarms) originating
    in the German Democratic Republic and the USSR, and repealing a national anti-dumping
    duty on mechanical alarm clocks originating in China imposed under the transitional
    provisions of the Act of Accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1579/80 de la Commission, du 19 juin 1980, instituant
    un droit anti-"dumping" provisoire sur les réveils et pendulettes-réveils mécaniques
    (autres que les réveils et pendulettes de voyage), originaires de la République
    démocratique allemande et d' Union soviétique et abrogeant un droit anti-"dumping"
    national sur les réveils et pendulettes-réveils mécaniques, originaires de
    Chine, institué au titre des dispositions transitoires de l' acte d' adhésion
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1579/80 der Kommission vom 19. Juni 1980 über die
    Einführung eines vorläufigen Antidumpingzolls auf mechanische Wecker (ausgenommen
    Reisewecker) und Uhren mit Weckerwerk mit Ursprung in der Deutschen Demokratischen
    Republik und der UdSSR und die Aufhebung eines gemäß den Übergangsbestimmungen
    der Beitrittsakte eingeführten einzelstaatlichen Antidumpingzolls auf mechanische
    Wecker und Uhren mit Weckerwerk mit Ursprung in China
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1579/80 af 19. juni 1980 om indførelse
    af en midlertidig antidumpingtold på mekaniske vækkeure (bortset fra rejseure)
    med oprindelse i Den tyske demokratiske Republik og Sovjetunionen og om ophævelse
    af en national antidumpingtold på mekaniske vækkeure med oprindelse i Kina,
    indført i henhold til overgangsbestemmelserne i tiltrædelsesakten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1579/80 della Commissione, del 19 giugno 1980, che
    introduce un dazio antidumping provvisorio sulle sveglie e pendolette-sveglie
    meccaniche (diverse dalle sveglie da viaggio) originarie della Repubblica democratica
    tedesca e dell' Unione Sovietica, e che annulla un dazio nazionale antidumping
    sulle sveglie e pendolette-sveglie meccaniche originarie della Cina imposto a
    norma delle disposizioni transitorie dell' atto di adesione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1579/80 van de Commissie van 19 juni 1980 houdende
    instelling van een voorlopig anti-dumpingrecht op mechanische wekkers (andere
    dan reiswekkers) van oorsprong uit de Duitse Democratische Republiek en de Sowjetunie,
    en houdende intrekking van een nationaal anti-dumpingrecht op mechanische wekkers
    van oorsprong uit China, ingesteld krachtens de overgangsbepalingen van de Toetredingsakte
  type: main
