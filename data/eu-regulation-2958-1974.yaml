title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2958/74 of the Commission of 22 November 1974 re-establishing
    the levying of customs duties on electrical capacitors, fixed or variable, falling
    within heading No 85.18, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2958/74 de la Commission, du 22 novembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux condensateurs
    électriques, fixés, variables ou ajustables, de la position tarifaire 85.18,
    originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2958/74 der Kommission vom 22. November 1974 zur Wiedereinführung
    des Zollsatzes für elektrische Festkondensatoren, der Tarifnummer 85.18, mit
    Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3501/73
    des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2958/74 af 22. november 1974 om genindførelse
    af opkrævning af toldafgifter for elektriske kondensatorer, faste eller variable,
    under position 85.18, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2958/74 della Commissione, del 22 novembre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili, della voce doganale n. 85.18, originari dei paesi
    in via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2958/74 van de Commissie van 22 november 1974 houdende
    wederinstelling van de heffing van de douanerechten voor elektrische condensatoren
    (vaste condensatoren, draaicondensatoren en regelbare of instelbare condensatoren),
    van post 85.18, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 3501/73 van de Raad van 18 december 1973 tariefpreferenties
    werden geopend
  type: main
