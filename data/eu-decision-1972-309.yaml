title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 août 1972, portant publication de la
    version actuelle de l'annexe I du règlement (CEE) n° 1025/70 du Conseil du 25
    mai 1970, portant établissement d'un régime commun applicable aux importations
    de pays tiers
  type: main
- language: de
  script: Latn
  content: '72/309/EWG: Beschluß der Kommission vom 10. August 1972 zur Bekanntmachung
    der geltenden Fassung des Anhangs I der Verordnung (EWG) Nr. 1025/70 des Rates
    vom 25. Mai 1970 zur Festlegung einer gemeinsamen Regelung für die Einfuhr aus
    dritten Ländern'
  type: main
- language: it
  script: Latn
  content: '72/309/CEE: Decisione della Commissione, del 10 agosto 1972, recante pubblicazione
    della versione attuale dell''allegato I al regolamento (CEE) n. 1025/70 del Consiglio,
    del 25 maggio 1970, che istituisce un regime comune applicabile alle importazioni
    da paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '72/309/EEG: Besluit van de Commissie van 10 augustus 1972 tot bekendmaking
    van de geldige versie van bijlage I van verordening (EEG) nr. 1025/70 van de Raad
    van 25 mei 1970 houdende de totstandbrenging van een gemeenschappelijke regeling
    voor de invoer uit derde landen'
