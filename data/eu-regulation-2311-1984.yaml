title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2311/84 of 7 August 1984 re-establishing
    the levying of customs duties on choline chloride, falling within subheading 29.24
    B I and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2311/84 de la Commission du 7 août 1984 portant rétablissement
    de la perception des droits de douane applicables au chlorure de choline, de la
    sous-position 29.24 B I du tarif douanier commun, originaire de Roumanie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2311/84 der Kommission vom 7. August 1984 zur Wiedereinführung
    der Erhebung der Zölle für Cholinchlorid der Tarifstelle 29.24 B I mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2311/84 af 7. august 1984 om genindførelse
    af opkrævning af told for cholinchlorid, henhørende under pos. 29.24 B I og
    med oprindelse i Rumænien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
