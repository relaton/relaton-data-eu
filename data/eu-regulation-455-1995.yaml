    i industrija
  type: main
- language: hu
  script: Latn
  content: A Bizottság 455/95/EK Rendelete (1995. február 28.) a vaj intervenciós
    hivatalok által történő felvásárlásának tekintetében az 1547/87/EGK és
    az 1589/87/EGK rendelet módosításáról, valamint bizonyos fogyasztói kategóriák
    és iparágak részére a csökkentett áron történő vajbeszerzéshez és értékesítéshez
    nyújtott támogatás tekintetében a 2191/81/EGK és az 570/88/EGK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 455/95 della Commissione del 28 febbraio 1995 che modifica
    i regolamenti (CEE) n. 1547/87 e (CEE) n. 1589/87 per quanto riguarda l'acquisto
    di burro da parte degli organismi d'intervento e i regolamenti (CEE) n. 2191/81
    e (CEE) n. 570/88 per quanto riguarda la concessione di un aiuto all'acquisto
    di burro e la vendita a prezzo ridotto di burro a determinate categorie di consumatori
    e di industrie
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 455/95 (1995. gada 28. februāris), ar ko groza
    Regulas (EEK) Nr. 1547/87 un (EEK) Nr. 1589/87 attiecībā uz intervences aģentūru
    sviesta iepirkumiem un Regulas (EEK) Nr. 2191/81 un (EEK) Nr. 570/88 attiecībā
    uz atbalsta piešķiršanu noteiktu kategoriju patērētājiem un nozarēm sviesta
    pirkšanai un pārdošanai par pazeminātu cenu
  type: main
- language: lt
  script: Latn
  content: 1995 m. vasario 28 d. Komisijos Reglamentas (EB) Nr. 455/95 iš dalies
