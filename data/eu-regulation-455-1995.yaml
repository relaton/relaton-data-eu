    agentūrų vykdomo sviesto supirkimo ir Reglamentus (EEB) Nr. 2191/81 bei (EEB)
    Nr. 570/88 dėl pagalbos suteikimo perkant ir parduodant sviestą mažesne kaina
    tam tikrų kategorijų vartotojams ir pramonės įmonėms
  type: main
