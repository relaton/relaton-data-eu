    von Butter durch die Interventionsstellen sowie der Verordnungen (EWG) Nr. 2191/81
    und (EWG) Nr. 570/88 hinsichtlich der Gewährung einer Beihilfe für den Kauf
    von Butter und des Verkaufs von verbilligter Butter an bestimmte Verbrauchergruppen
    und Verarbeitungsindustrien
  type: main
