title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 455/95 of 28 February 1995 amending Regulation
    (EEC) No 1547/87 and (EEC) No 1589/87 as regards the buying-in of butter by the
    intervention agencies and Regulations (EEC) No 2191/81 and (EEC) No 570/88 as
    regards the grant of aid for the purchase and sale of butter at a reduced price
    to certain categories of consumers and industries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 455/95 de la Commission du 28 février 1995 modifiant
    les règlements (CEE) n° 1547/87 et (CEE) n 1589/87 en ce qui concerne l'achat
    de beurre par les organismes d'intervention et les règlements (CEE) n° 2191/81
    et (CEE) n° 570/88 en ce qui concerne l'octroi d'une aide à l'achat de beurre
    et la vente à prix réduit de beurre à certaines catégories de consommateurs
    et d'industries
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 455/95 der Kommission vom 28. Februar 1995 zur Änderung
