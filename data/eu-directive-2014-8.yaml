    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii kasutamist joodistes,
    millega joodetakse trükkplaatidele digitaalseid kaadmiumtelluriid- ja kaadmium-tsinktelluriid-jadadetektoreid
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/8/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    lyijyä juotoksissa, joita käytetään digitaalisten kadmiumtelluridi- ja kadmiumsinkkitelluridi-ilmaisimien
    liittämiseen piirilevyihin
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/8/EU оd 18. listopada 2013. o izmjeni,
    u svrhe prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća s obzirom na izuzeće za olovo u lemovima za montažu digitalnih
    detektora polja s kadmij teluridom i kadmij cink teluridom na tiskane pločice
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/8/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a digitális kadmium-tellurid és kadmium-cink-tellurid sordetektorok nyomtatott
    áramköri lapokra való szereléséhez használt forraszanyagokban lévő ólom
    mentesítése tekintetében, a műszaki fejlődéshez történő hozzáigazítás
    céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/8/UE della Commissione, del 18 ottobre 2013 , che
    modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione relativa
    al piombo nelle saldature usate per l’assemblaggio di circuiti stampati utilizzati
    per montare moduli digitali di rivelatori, quali i rivelatori digitali con tellururo
    di cadmio e tellururo di cadmio-zinco
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/8/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam lodmetālos,
    lai kadmija-telurīda un kadmija-cinka-telurīda digitālo matricu detektorus
    uzmontētu uz drukātās shēmas platēm
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/8/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    naudoti šviną lydmetaliuose, kuriais kadmio telūrido ir kadmio-cinko telūrido
    skaitmeniniai matriciniai detektoriai tvirtinami prie spausdintinių plokščių
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/8/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal ċomb fl-istann għall-immuntar tad-ditekters diġitali tat-tellurur
    tal-kadmju u tat-tellurur tal-kadmju u ż-żingu mal-bordijiet taċ-ċirkwit stampati
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/8/EU van de Commissie van 18 oktober 2013 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood in soldeer voor het aanbrengen van digitale cadmiumtelluride-
    en cadmiumzinktelluridearraydetectoren op printplaten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/8/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu w stopach lutowniczych stosowanych przy mocowaniu detektorów z matrycą
    cyfrową, wykonanych z tellurku kadmowego lub tellurku kadmowo-cynkowego, do płytek
    obwodów drukowanych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/8/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para chumbo em soldas para a montagem de detetores digitais de telureto de cádmio
    e de telureto de cádmio e zinco em placas de circuito impresso
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/8/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul din aliajele de lipit pentru montarea detectorilor digitali din telurură
    de cadmiu și telurură de cadmiu-zinc pe plăcile cu circuite imprimate
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/8/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre používanie olova v
    spájkach používaných na montáž detektorov z digitálnych polí z teluridu
    kadmia a teluridu kadmia a zinku na dosky plošných spojov
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/8/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za svinec v spajkah za pritrditev digitalnih kadmij-teluridnih in kadmij-cink-teluridnih
    detektorjev na plošče tiskanega vezja zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/8/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo en soldaduras de montaje de detectores digitales de telururo de
    cadmio y telururo de cadmio-zinc en circuitos impresos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/8/EU av den 18 oktober 2013 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för bly i lödmetall för
    montering av digitala arraydetektorer av kadmiumtellurid och kadmiumzinktellurid
    på kretskort
