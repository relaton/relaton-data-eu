title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/8/EU of 18 October 2013 amending, for
    the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    in solders for mounting cadmium telluride and cadmium zinc telluride digital array
    detectors to printed circuit boards
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/8/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb dans les soudures servant au montage des détecteurs numériques
    au tellurure de cadmium ou au tellurure de cadmium et de zinc sur les cartes de
    circuits imprimés
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/8/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei in Loten zur Befestigung digitaler Cadmiumtellurid- und
    Cadmiumzinktellurid-Arraydetektoren auf Leiterplatten
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/8/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово
    в припои за монтиране на цифрови матрични детектори
    от кадмиев телурид и кадмиев цинков телурид
    към печатни платки
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/8/EU ze dne 18. října 2013
    , kterou se z důvodu přizpůsobení technickému pokroku mění příloha IV
    směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro olovo
    v pájkách používaných k montáži digitálních detektorů z teluridu kadmia
    a z teluridu kadmia-zinku na desky tištěných spojů
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/8/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU for så vidt angår indrømmelse af en undtagelse for bly i loddemateriale
    til montering af digitale array-detektorer af cadmiumtellurid og cadmiumzinktellurid
    på printplader
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/8/ΕΕ της Επιτροπής,
    της 18ης Οκτωβρίου 2013 , για την τροποποίηση,
    με σκοπό την προσαρμογή στην τεχνική πρόοδο,
    του παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
