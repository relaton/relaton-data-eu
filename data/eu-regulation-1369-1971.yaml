  content: Règlement (CEE) n° 1369/71 de la Commission, du 29 juin 1971, portant
    répartition des contingents quantitatifs communautaires à l'exportation pour
    certains déchets et cendres de métaux non ferreux (cuivre, plomb, aluminium)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1369/71 der Kommission vom 29. Juni 1971 betreffend
    die Aufteilung von mengenmäßigen Ausfuhrkontingenten der Gemeinschaft für bestimmte
    Bearbeitungsabfälle und Aschen von NE-Metallen (Kupfer, Blei und Aluminium)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1369/71 della Commissione, del 29 giugno 1971, che
    ripartisce i contingenti quantitativi comunitari all'esportazione per alcuni cascami
    e ceneri di metalli non ferrosi (rame, piombo, alluminio)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1369/71 van de Commissie van 29 juni 1971 betreffende
    de verdeling van kwantitatieve communautaire uitvoercontingenten voor bepaalde
    afvallen en assen van non-ferrometalen (koper, lood, aluminium)
  type: main
