  content: Commission Regulation (EC) No 616/2009 of 13 July 2009 implementing Council
    Directive 2005/94/EC as regards the approval of poultry compartments and other
    captive birds compartments with respect to avian influenza and additional preventive
    biosecurity measures in such compartments
  type: main
- language: fr
  script: Latn
