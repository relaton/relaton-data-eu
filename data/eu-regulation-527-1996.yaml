title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 527/96 of 25 March 1996 temporarily suspending
    the autonomous Common Customs Tariff duties and progressively introducing the
    Common Customs Tariff duties on imports of certain industrial products into the
    Canary Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 527/96 du Conseil, du 25 mars 1996, portant suspension
    temporaire des droits autonomes du tarif douanier commun et portant introduction
    progressive des droits du tarif douanier commun lors de l'importation d'un certain
    nombre de produits industriels aux îles Canaries
  type: main
- language: de
  script: Latn
