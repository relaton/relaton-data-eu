    Aussetzung der autonomen Zollsätze des Gemeinsamen Zolltarifs und zur schrittweisen
    Einführung der Zollsätze des Gemeinsamen Zolltarifs bei der Einfuhr bestimmter
    gewerblicher Waren auf die Kanarischen Inseln
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 527/96 af 25. marts 1996 om midlertidig suspension
