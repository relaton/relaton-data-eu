title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1443/95 of 26 June 1995 determining, for
    the 1995 marketing year, the estimated loss of income and the estimated level
    of the premium payable per ewe and per female goat and fixing the first advance
    payment for this premium and an advance payment of the specific aid for sheep
    and goat farming in certain less favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1443/95 de la Commission, du 26 juin 1995, déterminant,
    pour la campagne 1995, la perte estimée de revenu, le montant estimé de la prime
    payable par brebis et par chèvre, ainsi que fixant le montant du premier acompte
    de cette prime ainsi que le montant d' un acompte sur l' aide spécifique à l'
    élevage ovin et caprin dans certaines zones défavorisées de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1443/95 der Kommission vom 26. Juni 1995 zur Bestimmung
    des für das Wirtschaftsjahr 1995 zu gewährenden Einkommensausfalls und der je
    Mutterschaf und Ziege zu gewährenden Prämie, des ersten Vorschusses auf diese
    Prämie sowie eines Vorschusses auf die Sonderbeihilfe für die Schaf- und Ziegenhaltung
    in bestimmten benachteiligten Gebieten der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1443/95 af 26. juni 1995 om fastsættelse
    for produktionsåret 1995 af det anslåede indkomsttab, det anslåede præmiebeløb,
    der skal betales pr. moderfår og moderged, det første forskud på dette præmiebeløb
    samt acontobeløbet på den særlige støtte til fåre- og gedeopdræt i visse
    ugunstigt stillede områder i Fællesskabet
  type: main
- language: el
  script: Grek
