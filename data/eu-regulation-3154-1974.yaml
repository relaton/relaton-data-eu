  content: Regulation (EEC) No 3154/74 of the Commission of 13 December 1974 derogating
    as regards the final individual invitation to tender for 1974 from Regulation
    (EEC) No 1259/72 on the disposal of butter at a reduced price to certain Community
    processing undertakings
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3154/74 de la Commission, du 13 décembre 1974, dérogeant
    au règlement (CEE) n° 1259/72 relatif à la mise à disposition de beurre à
    prix réduit à certaines entreprises de transformation de la Communauté en ce
    qui concerne les adjudications particulières pour la fin de l'année 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3154/74 der Kommission vom 13. Dezember 1974 zur Abweichung
    von der Verordnung (EWG) Nr. 1259/72 über den Absatz von Butter zu herabgesetzten
    Preisen an bestimmte Verarbeitungsbetriebe in der Gemeinschaft hinsichtlich der
    Einzelausschreibungen zum Ende des Jahres 1974
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3154/74 af 13. december 1974 om undtagelse
    fra forordning (EØF) nr. 1259/72 om afsætning af smør til nedsatte priser til
    visse forarbejdningsvirksomheder inden for Fællesskabet for så vidt angår de
    særlige licitationer for slutningen af året 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3154/74 della Commissione, del 13 dicembre 1974, recante
    deroga, per quanto concerne le gare particolari previste per la fine del 1974,
    al regolamento (CEE) n. 1259/72, che prevede di mettere a disposizione di talune
    imprese di trasformazione della Comunità burro a prezzo ridotto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3154/74 van de Commissie van 13 december 1974 houdende
    afwijking van Verordening (EEG) nr. 1259/72 betreffende het ter beschikking stellen
    van boter tegen verlaagde prijs aan bepaalde verwerkende industrieën in de Gemeenschap
    met betrekking tot de bijzondere verkopen bij inschrijving voor het eind van het
    jaar 1974
