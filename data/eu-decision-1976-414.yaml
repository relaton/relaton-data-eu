title:
- language: en
  script: Latn
  content: '76/414/EEC: Commission Decision of 5 March 1976 authorizing the Italian
    Republic not to apply Community treatment to concentrated orange juice, falling
    within heading No ex 20.07 of the Common Customs Tariff, originating in the Republic
    of South Africa and in free circulation in the Federal Republic of Germany'
  type: main
- language: fr
  script: Latn
  content: '76/414/CEE: Décision de la Commission, du 5 mars 1976, autorisant la
    République italienne à exclure du traitement communautaire les jus concentrés
    d''orange, de la position ex 20.07 du tarif douanier commun, originaires de la
    République d''Afrique du Sud et mis en libre pratique en République fédérale
    d''Allemagne'
  type: main
- language: de
  script: Latn
  content: '76/414/EWG: Entscheidung der Kommission vom 5. März 1976, mit der die
    Italienische Republik ermächtigt wird, aus der Republik Südafrika stammende
    und in der Bundesrepublik Deutschland im freien Verkehr befindliche konzentrierte
    Orangensäfte der Tarifnummer ex 20.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '76/414/EØF: Kommissionens beslutning af 5. marts 1976 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage safter af
    appelsiner, koncentreret, som henhører under pos. ex 20.07 i den fælles toldtarif,
    har oprindelse i Den sydafrikanske Republik, og frit kan omsættes i Forbundsrepublikken
    Tyskland'
  type: main
- language: it
  script: Latn
  content: '76/414/CEE: Decisione della Commissione, del 5 marzo 1976, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i succhi concentrati
    d'' arancia della voce ex 20.07 della tariffa doganale comune, originari della
    Repubblica del Sudafrica e messi in libera pratica nella Repubblica federale di
    Germania'
  type: main
- language: nl
  script: Latn
  content: '76/414/EEG: Beschikking van de Commissie van 5 maart 1976 waarbij de Italiaanse
    Republiek wordt gemachtigd geconcentreerd sinaasappelsap van post ex 20.07 van
    het gemeenschappelijk douanetarief, van oorsprong uit de Republiek Zuid-Afrika
    en in de Bondsrepubliek Duitsland in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
