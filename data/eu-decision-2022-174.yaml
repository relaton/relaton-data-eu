id: EUDecision2022174
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/174 of 8 February 2022 determining,
    for a limited period of time, that the regulatory framework applicable to central
    counterparties in the United Kingdom of Great Britain and Northern Ireland is
    equivalent, in accordance with Regulation (EU) No 648/2012 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/174 de la Commission du 8 février 2022
    reconnaissant, pour une durée limitée, l’équivalence du cadre réglementaire
    applicable aux contreparties centrales au Royaume-Uni de Grande-Bretagne et d’Irlande
    du Nord, en vertu du règlement (UE) no 648/2012 du Parlement européen et du
    Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/174 der Kommission vom 8. Februar 2022
    zur Feststellung der Gleichwertigkeit des für zentrale Gegenparteien im Vereinigten
    Königreich Großbritannien und Nordirland geltenden Rechtsrahmens gemäß der
    Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments und des Rates für einen
    begrenzten Zeitraum
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/174 на Комисията
    от 8 февруари 2022 година за признаване за ограничен
    срок на еквивалентността на регулаторната
    уредба, приложима по отношение на централните
    контрагенти в Обединеното кралство Великобритания
    и Северна Ирландия, в съответствие с Регламент
    (ЕС) № 648/2012 на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/174 ze dne 8. února 2022, kterým
    se na omezenou dobu stanoví, že právní rámec použitelný na ústřední
    protistrany ve Spojeném království Velké Británie a Severního Irska je v
    souladu s nařízením Evropského parlamentu a Rady (EU) č. 648/2012 rovnocenný
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/174 af 8. februar 2022
    om fastlæggelse af, at de reguleringsmæssige rammer, som finder anvendelse på
    centrale modparter i Det Forenede Kongerige Storbritannien og Nordirland, i en
    begrænset periode er ækvivalente, i overensstemmelse med Europa-Parlamentets
    og Rådets forordning (EU) nr. 648/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/174 της Επιτροπής
    της 8ης Φεβρουαρίου 2022 που προσδιορίζει, για
    περιορισμένο χρονικό διάστημα, ότι το κανονιστικό
    πλαίσιο που εφαρμόζεται στους κεντρικούς αντισυμβαλλομένους
    στο Ηνωμένο Βασίλειο της Μεγάλης Βρετανίας
    και της Βόρειας Ιρλανδίας είναι ισοδύναμο,
    σύμφωνα με τον κανονισμό (ΕΕ) αριθ. 648/2012 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/174, 8. veebruar 2022, millega Suurbritannia
    ja Põhja-Iiri Ühendkuningriigi kesksete vastaspoolte suhtes kohaldatavat õigusraamistikku
    käsitatakse piiratud ajavahemikul samaväärsena kooskõlas Euroopa Parlamendi
    ja nõukogu määrusega (EL) nr 648/2012
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/174, annettu 8 päivänä
    helmikuuta 2022, Ison-Britannian ja Pohjois-Irlannin yhdistyneessä kuningaskunnassa
    oleviin keskusvastapuoliin sovellettavan sääntelykehyksen vastaavuuden vahvistamisesta
    määräajaksi Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 648/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/174 ón gCoimisiún an 8 Feabhra 2022
    lena gcinntear, ar feadh tréimhse theoranta, go bhfuil an creat rialála is infheidhme
    i leith contrapháirtithe lárnacha i Ríocht Aontaithe na Breataine Móire agus
    Thuaisceart Éireann coibhéiseach, i gcomhréir le Rialachán (AE) Uimh. 648/2012
    ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/174 оd 8. veljače 2022. o utvrđivanju
    vremenski ograničene istovrijednosti regulatornog okvira koji se u Ujedinjenoj
    Kraljevini Velike Britanije i Sjeverne Irske primjenjuje na središnje druge ugovorne
    strane, u skladu s Uredbom (EU) br. 648/2012 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/174 végrehajtási határozata (2022. február 8.)
    a 648/2012/EU európai parlamenti és tanácsi rendeletnek megfelelően a Nagy-Britannia
    és Észak-Írország Egyesült Királyságában a központi szerződő felekre
    alkalmazandó szabályozási keretrendszer korlátozott idejű egyenértékűségének
    a megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/174 della Commissione dell'8 febbraio
    2022 che stabilisce, per un periodo di tempo limitato, che il quadro normativo
    applicabile alle controparti centrali del Regno Unito di Gran Bretagna e Irlanda
    del Nord è equivalente, in conformità del regolamento (UE) n. 648/2012 del Parlamento
    europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/174 (2022. gada 8. februāris),
    ar ko uz ierobežotu laikposmu nosaka, ka tiesiskais regulējums, ko piemēro
    centrālajiem darījumu partneriem Lielbritānijas un Ziemeļīrijas Apvienotajā
    Karalistē, ir līdzvērtīgs saskaņā ar Eiropas Parlamenta un Padomes Regulu
    (ES) Nr. 648/2012
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/174 2022 m. vasario 8 d. kuriuo
    ribotam laikotarpiui nustatoma, kad pagrindinėms sandorio šalims Jungtinėje
    Didžiosios Britanijos ir Šiaurės Airijos Karalystėje taikoma reguliavimo sistema
    yra lygiavertė pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 648/2012
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/174 tat-8
    ta’ Frar 2022 li tiddetermina, għal perjodu ta’ żmien limitat, li l-qafas
    regolatorju applikabbli għall-kontropartijiet ċentrali fir-Renju Unit tal-Gran
    Brittanja u l-Irlanda ta’ Fuq huwa ekwivalenti, f’konformità mar-Regolament
    (UE) Nru 648/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/174 van de Commissie van 8 februari 2022 waarbij
    voor een beperkte periode wordt bepaald dat het regelgevingskader voor centrale
    tegenpartijen in het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland
    gelijkwaardig is, in overeenstemming met Verordening (EU) nr. 648/2012 van het
    Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/174 z dnia 8 lutego 2022 r. stwierdzająca,
    na ograniczony okres, że ramy regulacyjne mające zastosowanie do kontrahentów
    centralnych w Zjednoczonym Królestwie Wielkiej Brytanii i Irlandii Północnej
    są równoważne zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE)
    nr 648/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/174 da Comissão de 8 de fevereiro de
    2022 que determina, por um período limitado, que o quadro regulamentar aplicável
    às contrapartes centrais no Reino Unido da Grã-Bretanha e da Irlanda do Norte
    é equivalente, em conformidade com o Regulamento (UE) n.o 648/2012 do Parlamento
    Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/174 a Comisiei din 8 februarie
    2022 de stabilire, pentru o perioadă limitată, a echivalenței cadrului de reglementare
    aplicabil contrapărților centrale din Regatul Unit al Marii Britanii și Irlandei
    de Nord, în conformitate cu Regulamentul (UE) nr. 648/2012 al Parlamentului European
    și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/174 z 8. februára 2022, ktorým
    sa na obmedzený čas určuje, že regulačný rámec uplatniteľný na centrálne
    protistrany v Spojenom kráľovstve Veľkej Británie a Severného Írska je rovnocenný
    podľa nariadenia Európskeho parlamentu a Rady (EÚ) č. 648/2012
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/174 z dne 8. februarja 2022 o določitvi,
    da je regulativni okvir, ki se uporablja za centralne nasprotne stranke v Združenem
    kraljestvu Velika Britanija in Severna Irska, za omejeno obdobje enakovreden v
    skladu z Uredbo (EU) št. 648/2012 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/174 de la Comisión de 8 de febrero de
    2022 por la que se declara, para un período de tiempo limitado, la equivalencia
    del marco normativo aplicable a las entidades de contrapartida central del Reino
    Unido de Gran Bretaña e Irlanda del Norte, de conformidad con el Reglamento (UE)
    n.o 648/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/174 av den 8 februari 2022
    om fastställande, under en begränsad tid, av att den rättsliga ramen för centrala
    motparter i Förenade konungariket Storbritannien och Nordirland är likvärdig
    i enlighet med Europaparlamentets och rådets förordning (EU) nr 648/2012
