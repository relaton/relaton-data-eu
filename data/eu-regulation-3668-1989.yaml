title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3668/89 of 7 December 1989 re-establishing
    the levying of customs duties on nuts, of iron or steel, falling within CN codes
    7318 16 30, 7318 16 91 and 7318 16 99, originating in Singapore, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 4257/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3668/89 de la Commission du 7 décembre 1989 portant
