  script: Latn
  content: Regulation (EEC) No 1492/70 of the Council of 20 July 1970 extending to
    other imports the Annex to Regulation (EEC) No 109/70 establishing common rules
    for imports from state-trading countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1492/70 du Conseil, du 20 juillet 1970, étendant
    à d' autres importations l' annexe au règlement (CEE) n° 109/70, portant établissement
    d' un régime commun applicable aux importations de pays à commerce d' État
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1492/70 des Rates vom 20. Juli 1970 zur Ausdehnung
    des Anhangs der Verordnung (EWG) Nr. 109/70 zur Festlegung einer gemeinsamen Regelung
    für die Einfuhr aus Staatshandelsländern auf weitere Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning nr. 1492/70/EØF af 20. juli 1970 om udvidelse med yderligere
