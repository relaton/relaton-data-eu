    ordning af indførslen fra statshandelslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1492/70 del Consiglio, del 20 luglio 1970, che estende
    ad altre importazioni l' allegato del regolamento (CEE) n. 109/70, che istituisce
    un regime comune applicabile alle importazioni a commercio di Stato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1492/70 van de Raad van 20 juli 1970 inzake uitbreiding
    met nieuwe produkten van de bijlage bij Verordening (EEG) nr. 109/70 van de Raad
    houdende totstandbrenging van een gemeenschappelijke regeling voor de invoer uit
    landen met staatshandel
