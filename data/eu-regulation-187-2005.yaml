  type: main
- language: hu
  script: Latn
  content: A Tanács 187/2005/EK rendelete (2005. február 2.) az Oszáma bin Ládennel,
    az Al-Qaida hálózattal és a tálibokkal összeköttetésben álló egyes személyekkel
    és szervezetekkel szemben meghatározott szigorító intézkedések bevezetéséről
    és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről szóló
    881/2002/EK tanácsi rendelet 43. alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 187/2005 della Commissione, del 2 febbraio 2005, recante
    quarantatreesima modifica del regolamento (CE) n. 881/2002 che impone specifiche
    misure restrittive nei confronti di determinate persone ed entità associate a
    Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento (CE)
    n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
