title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/391 of 26 January 2024 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize Bt11 × MIR162 × MIR604 × MON 89034 × 5307 × GA21
