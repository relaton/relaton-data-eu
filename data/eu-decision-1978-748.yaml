---
id: EUDecision1978748
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 August 1978 authorizing the French Republic not
    to apply Community treatment to men's and boys' shirts, woven, of wool, of cotton
    or of man-made textile fibres, falling within heading No 61.03 (NIMEXE codes 61.03-11,
    15, 19) of the Common Customs Tariff, originating in Pakistan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/748/CEE: Décision de la Commission, du 25 août 1978, autorisant la
    République française à exclure du traitement communautaire les chemises et
    chemisettes tissées, pour hommes et garçonnets, de laine, de coton ou de fibres
    textiles synthétiques ou artificielles, de la position Ex 61.03 du Tarif douanier
    commun (codes Nimexe : 61.03-11; 15; 19), originaires du Pakistan et mises en
    libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. August 1978, mit der die Französische
    Republik ermächtigt wird, aus Pakistan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, aus Geweben,
    für Männer und Knaben, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.03-11; 15; 19) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 25. august 1978 om bemyndigelse af den franske
    republik til fra fællesskabshandling at undtage vævede skjorter (herunder sports-
    og arbejdsskjorter) til mænd og drenge, af uld, bomuld eller syntetiske eller
    regenererede fibre, som henhører under pos. ex 61.03 i den fælles toldtarif
    (NIMEXE-kode 61.03-11, 15, 19) har oprindelse i Pakistan og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 25 agosto 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario camicie e camicette, tessute,
    per uomo e per ragazzo, di lana, di cotone o di fibre tessili sintetiche o artificiali
    della voce ex 61.03 della tariffa doganale comune (codice Nimexe: 61.03-11, 15,
    19), originarie del Pakistan e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 augustus 1978 waarbij de Franse Republiek
    wordt gemachtigd overhemden en sporthemden, voor heren en jongens, geweven van
    wol of katoen, of van synthetische of van kunstmatige textielvezels, van post
    ex 61.03 van het gemeenschappelijk douanetarief (NIMEXE-code 61.03-11, 15, 19),
    van oorsprong uit Pakistan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
