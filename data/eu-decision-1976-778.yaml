id: EUDecision1976778
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 August 1976 authorizing the Italian Republic
    not to apply Community treatment to radio receivers, whether or not combined with
    a sound reproducer, falling within subheading ex 85.15 A III of the Common Customs
    Tariff, originating in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/778/CEE: Décision de la Commission, du 25 août 1976, autorisant la
    République italienne à exclure du traitement communautaire les appareils récepteurs
    de radio, même combinés avec un appareil de reproduction du son, de la sous-position
    Ex 85.15 A III du Tarif douanier commun, originaires du Japon et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. August 1976, mit der die Italienische
    Republik ermächtigt wird, die aus Japan stammenden und in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Empfangsgeräte, auch mit Tonaufnahme- oder Tonwiedergabegeräten
    kombiniert, der Tarifstelle ex 85.15 A III des Gemeinsamen Zolltarifs von der
    Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 25. august 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage radiomodtagere, også kombineret
    med lydgengivere, som henhører under position ex 85.15 A III i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 25 agosto 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario gli apparecchi radioriceventi
    anche combinati con un apparecchio di riproduzione del suono, della sottovoce
    ex 85.15 A III della tariffa doganale comune, originari del Giappone e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 augustus 1976 waarbij de Italiaanse
    Republiek wordt gemachtigd radio-ontvangtoestellen, ook indien met ingebouwd toestel
    voor het weergeven van geluid, van post ex 85.15 A III van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
