type: standard
title:
- language: en
  script: Latn
  content: '78/1000/EEC: Commission Decision of 24 November 1978 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to knitted or crocheted trousers (except shorts),
    other than babies'' , of wool, of cotton or of man-made textile fibres, falling
    within subheading ex 60.05 A II of the Common Customs Tariff (NIMEXE codes 60.05-61,
    62, 64), originating in Taiwan and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/1000/CEE: Décision de la Commission, du 24 novembre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les pantalons de bonneterie (à l''exception
    des "shorts"), autres que pour bébés, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles de la sous-position ex 60.05 A II du tarif douanier
    commun (codes Nimexe: 60.05-61; 62; 64), originaires de T''ai-wan et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/1000/EWG: Entscheidung der Kommission vom 24. November 1978, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Hosen aus Gewirken (ausgenommen Shorts), andere
    als für Säuglinge, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen, der Tarifnummer ex 60.05 A II des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    60.05-61; 62; 64) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/1000/EØF: Kommissionens beslutning af 24. november 1978 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage benklæder af trikotage (bortset fra
    shorts), andre end til spædbørn, af uld, bomuld eller kemofibre, som henhører
    under pos. ex 60.05 A II i den fælles toldtarif (NIMEXE-kode 60.05-61, 62, 64),
    har oprindelse i Taiwan og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/1000/CEE: Decisione della Commissione, del 24 novembre 1978, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i pantaloni a maglia (esclusi gli short),
    non per bambini piccoli (bébés), di lana, di cotone o di fibre tessili sintetiche
    o artificiali della voce ex 60.05 A II della tariffa doganale comune (codice Nimexe
    60.05-61, 62, 64), originari di Taiwan e messi in libera pratica negli altri Stati
    membri'
  type: main
- language: nl
  script: Latn
  content: '78/1000/EEG: Beschikking van de Commissie van 24 november 1978 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd broeken van brei- of haakwerk (uitgezonderd shorts), andere
    dan voor baby'' s van wol, van katoen of van synthetische of van kunstmatige textielvezels
    van post ex 60.05 A II van het gemeenschappelijk douanetarief (NIMEXE-code : 60.05-61
    ; 62 ; 64), van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
