title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 298/96 of 16 February 1996 amending Regulation
    (EEC) No 920/89 laying down quality standards for carrots, citrus fruit and dessert
    apples and pears as regards the list of apple varieties and repealing in part
    Regulation (EC) No 3064/94 as regards the varieties of typically Swedish apples
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 298/96 de la Commission, du 16 février 1996, modifiant
    le règlement (CEE) nº 920/89 fixant des normes de qualité pour les carottes,
    les agrumes et les pommes et poires de table, en ce qui concerne la liste des
    variétés de pommes, et abrogeant pour partie le règlement (CE) nº 3064/94
    en ce qui concerne les variétés de pommes typiquement suédoises
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 298/96 der Kommission vom 16. Februar 1996 zur Änderung
    der Verordnung (EWG) Nr. 920/89 zur Festsetzung der Qualitätsnormen für Möhren,
    Zitrusfrüchte sowie Tafeläpfel und -birnen hinsichtlich der Apfelsortenliste
    und zur Abweichung von der Verordnung (EG) Nr. 3064/94 hinsichtlich der für Schweden
    typischen Apfelsorten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 298/96 af 16. februar 1996 om ændring
    af forordning (EØF) nr. 920/89 om fastsættelse af kvalitetsnormer for gulerødder,
    citrusfrugter og spiseæbler og -pærer, for så vidt angår listen over æblesorter,
    og om ophævelse af en del af forordning (EF) nr. 3064/94, for så vidt angår
    visse typisk svenske æblesorter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 298/96 της Επιτροπής,
    της 16ης Φεβρουαρίου 1996, για τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 920/89 για τον καθορισμό
    των κανόνων ποιότητας για τα καρότα, τα εσπεριδοειδή
    και τα επιτραπέζια μήλα και αχλάδια, όσον αφορά
    τον κατάλογο των ποικιλιών μήλων και για κατάργηση
    μέρους του κανονισμού (ΕΚ) αριθ. 3064/94 όσον αφορά
    ορισμένες τυπικές σουηδικές ποικιλίες μήλων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 298/96, annettu 16 päivänä helmikuuta 1996,
    porkkanoiden, sitrushedelmien ja syötäviksi tarkoitettujen omenoiden ja päärynöiden
    laatuvaatimuksista annetun asetuksen (ETY) N:o 920/89 muuttamisesta omenalajikkeiden
    luettelon osalta sekä asetuksen (EY) N:o 3064/94 osittaisesta kumoamisesta tyypillisesti
    ruotsalaisten omenalajikkeiden osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 298/96 della Commissione, del 16 febbraio 1996, che
    modifica il regolamento (CEE) n. 920/89 che stabilisce le norme di qualità per
    le carote, gli agrumi e le mele e pere da tavola, per quanto riguarda l'elenco
    delle varietà di mele e che abroga, in parte, il regolamento (CE) n. 3064/94
    per quanto riguarda le varietà di mele tipicamente svedesi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 298/96 van de Commissie van 16 februari 1996 houdende
    wijziging van Verordening (EEG) nr. 920/89 tot vaststelling van kwaliteitsnormen
    voor wortelen, citrusvruchten en tafelappelen en -peren, ten aanzien van de lijst
    van appelvariëteiten, en houdende gedeeltelijke intrekking van Verordening (EEG)
    nr. 3064/94 betreffende typisch Zweedse appelvariëteiten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 298/96 da Comissão, de 16 de Fevereiro de 1996, que
    altera o Regulamento (CEE) nº 920/89, que fixa as normas de qualidade para as
    cenouras, os citrinos e as maçãs e pêras de mesa, no que diz respeito à lista
    das variedades de maçãs e que revoga parcialmente o Regulamento (CE) nº 3064/94
    no que diz respeito às variedades de maçãs tipicamente suecas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 298/96 de la Comisión, de 16 de febrero de 1996, que
    modifica el Reglamento (CEE) nº 920/89, por el que se establecen normas de calidad
    para las zanahorias, los cítricos y las manzanas y peras de mesa, en lo referente
    a la lista de variedades de manzanas, y por el que se deroga parcialmente el Reglamento
