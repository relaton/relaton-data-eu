    το οποίο πρέπει να μειωθεί κατά την εισφορά
    που εφαρμόζεται στην όρυζα που εισάγεται από
    την Αραβική Δημοκρατία της Αιγύπτου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 19/83 della Commissione, del 5 gennaio 1983, che fissa
