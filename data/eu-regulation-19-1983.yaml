  content: Commission Regulation (EEC) No 19/83 of 5 January 1983 fixing the amount
    by which the levy on imports of rice from the Arab Republic of Egypt is to be
    reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 19/83 de la Commission, du 5 janvier 1983, fixant le
    montant dont doit être diminué le prélèvement applicable au riz importé de
    la république arabe d'Égypte
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 19/83 der Kommission vom 5. Januar 1983 zur Festsetzung
    des Betrages, um den die bei der Einfuhr von Reis aus der Arabischen Republik
    Ägypten in die Gemeinschaft anzuwendende Abschöpfung zu vermindern ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 19/83 af 5. januar 1983 om fastsættelse
    af det beløb, som skal trækkes fra afgiften på ris indført fra Den arabiske
    republik Egypten.
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 19/83 της Επιτροπής
