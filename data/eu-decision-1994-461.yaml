  script: Latn
  content: '94/461/EC: Commission Decision of 11 July 1994 amending Decisions 94/143/EC,
    94/187/EC, 94/309/EC, 94/344/EC, 94/446/EEC and 94/435/EC laying down the animal
    health requirements and certification for the import of certain products covered
    by Council Directive 92/118/EEC'
