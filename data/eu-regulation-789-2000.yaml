---
id: EURegulation7892000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 789/2000 of 14 April 2000 deducting from
    the quantitative limit on imports of textile goods pertaining to category 4 originating
    in the People's Republic of China an amount corresponding to that imported into
    the European Community in circumvention of the Agreement between the European
    Community and the People's Republic of China on trade in MFA textile products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 789/2000 de la Commission, du 14 avril 2000, déduisant
    de la limite quantitative fixée pour les importations de produits textiles de
    la catégorie 4 originaires de la République populaire de Chine un volume équivalent
    aux produits importés dans la Communauté européenne en contournement de l'accord
    entre la Communauté européenne et la République populaire de Chine sur le commerce
    des produits textiles AMF
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 789/2000 der Kommission vom 14. April 2000 zur Kürzung
    der Höchstmenge für die Einfuhren von Textilwaren der Kategorie 4 mit Ursprung
    in der Volksrepublik China entsprechend der unter Umgehung des Abkommens zwischen
    der Europäischen Gemeinschaft und der Volksrepublik China über den Handel mit
    MFA-Textilwaren in die Europäische Gemeinschaft eingeführten Menge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 789/2000 af 14. april 2000 om afskrivning
    på det kvantitative importloft for tekstilvarer af kategori 4 med oprindelse
    i Folkerepublikken Kina af en mængde svarende til den, der er indført i Fællesskabet
    ved omgåelse af aftalen mellem Det Europæiske Fællesskab og Folkerepublikken
    Kina om handel med MFA-tekstilvarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 789/2000 της Επιτροπής,
    της 14ης Απριλίου 2000, για την αφαίρεση, από το
    ποσοτικό όριο στις εισαγωγές κλωστοϋφαντουργικών
    προϊόντων της κατηγορίας 4 καταγωγής Λαϊκής
    Δημοκρατίας της Κίνας, ποσότητας που αντιστοιχεί
    σε εκείνη που έχει εισαχθεί στην Ευρωπαϊκή
    Κοινότητα με καταστρατήγηση της συμφωνίας
    μεταξύ της Ευρωπαϊκής Κοινότητας και της Λαϊκής
    Δημοκρατίας της Κίνας σχετικά με το εμπόριο
    κλωστοϋφαντουργικών προϊόντων που καλύπτονται
    από τη συμφωνία πολυινών (ΣΠΙ)
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 789/2000, annettu 14 päivänä huhtikuuta 2000,
    Euroopan yhteisön ja Kiinan kansantasavallan tekstiilituotteiden kauppaa koskevan
    MFA-sopimuksen määräyksiä kiertäen Euroopan yhteisöön tuotua määrää
    vastaavan määrän vähentämisestä Kiinan kansantasavallasta peräisin olevien
    4 luokan tekstiilituotteiden tuonnin määrällisestä rajoituksesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 789/2000 della Commissione, del 14 aprile 2000, che
    detrae dal limite quantitativo sulle importazioni di prodotti tessili della categoria
    4 originarie della Repubblica popolare cinese un quantitativo corrispondente a
    quello importato nella Comunità europea eludendo l'accordo tra la Comunità europea
    e la Repubblica popolare cinese sul commercio dei prodotti tessili coperti dall'accordo
    multifibre
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 789/2000 van de Commissie van 14 april 2000 waarbij
    het kwantitatieve maximum voor de invoer van textielproducten vallende onder categorie
    4, van oorsprong uit de Volksrepubliek China, worden verminderd met de hoeveelheid
    die in de Europese Gemeenschap is ingevoerd in strijd met de overeenkomst tussen
    de Europese Gemeenschap en de Volksrepubliek China die in het kader van de Multivezelregeling
    is gesloten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 789/2000 da Comissão, de 14 de Abril de 2000, que
    deduz do limite quantitativo à importação de produtos têxteis pertencentes
    à categoria 4 originários da República Popular da China um montante correspondente
    ao dos produtos importados na Comunidade Europeia em violação do Acordo entre
    a Comunidade Europeia e a República Popular da China sobre o comércio de produtos
    têxteis AMF
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 789/2000 de la Comisión, de 14 de abril de 2000, por
    el que se deduce de los límites cuantitativos a la importación de productos
    textiles pertenecientes a la categoría 4 originarios de la República Popular
    de China una cantidad correspondiente a los productos importados en la Comunidad
    Europea eludiendo las disposiciones del Acuerdo entre la Comunidad Europea y la
    República Popular de China sobre el comercio de productos textiles AMF
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 789/2000 av den 14 april 2000 om avdrag
    från den kvantitativa begränsningen av import av textilvaror i kategori 4, med
    ursprung i Folkrepubliken Kina, med en kvantitet som motsvarar den import till
    Europeiska gemenskapen avseende vilken avtalet mellan Europeiska gemenskapen och
    Folkrepubliken Kina om handel med textilprodukter som omfattas av MFA-avtalet
    kringgåtts
  type: main
