title:
- language: en
  script: Latn
  content: '2000/670/EC: Commission Decision of 19 October 2000 authorising Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directives 66/404/EEC and 71/161/EEC (notified
    under document number C(2000) 2825)'
  type: main
- language: fr
  script: Latn
  content: '2000/670/CE: Décision de la Commission du 19 octobre 2000 autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers de reproduction ne répondant pas aux exigences des directives 66/404/CEE
    et 71/161/CEE du Conseil [notifiée sous le numéro C(2000) 2825]'
  type: main
- language: de
  script: Latn
  content: '2000/670/EG: Entscheidung der Kommission vom 19. Oktober 2000 zur Ermächtigung
