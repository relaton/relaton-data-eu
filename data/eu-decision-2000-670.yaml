    66/404/CEE e 71/161/CEE del Consiglio [notificata con il numero C(2000) 2825]'
  type: main
- language: nl
  script: Latn
  content: '2000/670/EG: Beschikking van de Commissie van 19 oktober 2000 tot machtiging
