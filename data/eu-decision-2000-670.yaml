    pitäminen kaupan, joka ei täytä neuvoston direktiivien 66/404/ETY ja 71/161/ETY
    vaatimuksia (tiedoksiannettu numerolla K(2000) 2825)'
  type: main
- language: it
  script: Latn
  content: '2000/670/CE: Decisione della Commissione, del 19 ottobre 2000, che autorizza
