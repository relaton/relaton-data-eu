    das den Anforderungen der Richtlinien 66/404/EWG und 71/161/EWG des Rates nicht
    entspricht (Bekannt gegeben unter Aktenzeichen K(2000) 2825)'
  type: main
- language: da
  script: Latn
  content: '2000/670/EF: Kommissionens beslutning af 19. oktober 2000 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF og 71/161/EØF (meddelt
    under nummer K(2000) 2825)'
  type: main
- language: el
  script: Grek
  content: '2000/670/ΕΚ: Απόφαση της Επιτροπής, της 19ης
