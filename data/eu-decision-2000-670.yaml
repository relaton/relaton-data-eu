    δασικού πολλαπλασιαστικού υλικού που δεν πληροί
    τις απαιτήσεις των οδηγιών του Συμβουλίου
    66/404/ΕΟΚ και 71/161/ΕΟΚ [κοινοποιηθείσα υπό τον
    αριθμό Ε(2000) 2825]'
  type: main
- language: fi
  script: Latn
  content: '2000/670/EY: Komission päätös, tehty 19 päivänä lokakuuta 2000,
