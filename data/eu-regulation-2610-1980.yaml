title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2610/80 of 10 October 1980 re-establishing
    the levying of customs duties on handkerchiefs, products of category 89 (code
    0890), originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2610/80 de la Commission, du 10 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes, de la catégorie de produits n° 89 (code 0890), originaires de
    Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2610/80 der Kommission vom 10. Oktober 1980 über
    die Wiedereinführung des Zollsatzes für Taschentücher der Warenkategorie Nr.
    89 (Kennziffer 0890) mit Ursprung in China, dem die in der Verordnung (EWG) Nr.
    2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2610/80 af 10. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, under kategori 89 (kode 0890),
    som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2610/80 della Commissione, del 10 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai fazzoletti da naso
    e da taschino della categoria di prodotti n. 89 (codice 0890), originari della
    Cina, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2610/80 van de Commissie van 10 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakdoeken
    van de categorie van produkten nr. 89 (codenummer 0890), van oorsprong uit China,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
