title:
- language: en
  script: Latn
  content: '78/360/EEC: Commission Decision of 31 March 1978 authorizing certain Member
    States to sell butter at a reduced price in the form of concentrated butter (Only
    the German, French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/360/CEE: Décision de la Commission, du 31 mars 1978, autorisant plusieurs
    États membres à vendre du beurre à prix réduit sous forme de beurre concentré
    (Les textes en langues allemande, française et néerlandaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '78/360/EWG: Entscheidung der Kommission vom 31. März 1978 zur Ermächtigung
    einiger Mitgliedstaaten, Butter in Form von Butterreinfett zu ermäßigten Preisen
    zu verkaufen (Nur der deutsche, französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/360/EØF: Kommissionens beslutning af 31. marts 1978 om bemyndigelse
    til flere medlemsstater til af sælge smør til nedsat pris i form af koncentreret
    smør (Kun de tyske, franske og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '78/360/ΕΟΚ: Απόφαση της Επιτροπής, της 31ης
    Μαρτίου 1978, με την οποία επιτρέπεται σε περισσότερα
    κράτη μέλη να πωλήσουν βούτυρο σε μειωμένη
    τιμή υπό τη μορφή συμπυκνωμένου βουτύρου (Τα
    κείμενα στη γερμανική, γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '78/360/CEE: Decisione della Commissione, del 31 marzo 1978, che autorizza
    alcuni Stati membri a vendere burro a prezzo ridotto sotto forma di burro concentrato
    (Il testi in lingua tedesca, francese e olandese sono il soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '78/360/EEG: Beschikking van de Commissie van 31 maart 1978 tot machtiging
    van verschillende Lid-Staten om boter tegen verlaagde prijs in de vorm van boterconcentraat
