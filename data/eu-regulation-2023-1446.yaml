    do C20, flonikamid (IKI-220), giberelinska kislina, giberelini, halosulfuron-metil,
    hidrolizirane beljakovine, železov sulfat, magnezijev fosfid, maltodekstrin,
    metamitron, rastlinska olja / olje nageljnovih žbic, rastlinska olja / olje navadne
    ogrščice, rastlinska olja / olje zelene mete, piretrini, sulkotrion, tebukonazol
    in sečnina
