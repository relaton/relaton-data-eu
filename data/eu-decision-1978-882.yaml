    e la qualificazione professionale delle persone che lavorano nell'' agricoltura'
  type: main
- language: nl
  script: Latn
  content: '78/882/EEG: Beschikking van de Commissie van 13 oktober 1978 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk Denemarken
    van de gedurende het jaar 1976 gedane uitgaven voor steun met betrekking tot de
    sociaal-economische voorlichting en de scholing van personen die in de landbouw
    werkzaam zijn'
