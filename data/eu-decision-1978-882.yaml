title:
- language: en
  script: Latn
  content: '78/882/EEC: Commission Decision of 13 October 1978 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of Denmark of expenditure
    incurred during 1976 on aids relating to the provision of socio-economic guidance
    for and the acquisition of occupational skills by persons engaged in agriculture'
  type: main
- language: fr
  script: Latn
  content: '78/882/CEE: Décision de la Commission, du 13 octobre 1978, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole, section
    "orientation", au Royaume de Danemark des dépenses effectuées pendant l''année
    1976 pour les aides relatives à l''information socio-économique et à la qualification
    professionnelle des personnes travaillant dans l''agriculture'
  type: main
- language: de
  script: Latn
  content: '78/882/EWG: Entscheidung der Kommission vom 13. Oktober 1978 über die
    Rückvergütung der im Jahr 1976 für die sozio-ökonomische Information und die
    berufliche Qualifikation der in der Landwirtschaft tätigen Personen geleisteten
    Ausgaben durch den EAGFL, Abteilung Ausrichtung, an das Königreich Dänemark'
  type: main
- language: da
  script: Latn
  content: '78/882/EØF: Kommissionens beslutning af 13. oktober 1978 om refusion
    gennem EUGFL, udviklingssektionen, til kongeriget Danmark af de udgifter, som
    er afholdt i løbet af året 1976 til støtte vedrørende social og erhvervsmæssig
    vejledning og faglige kvalifikationer hos de personer, som arbejder i landbruget'
  type: main
- language: it
  script: Latn
  content: '78/882/CEE: Decisione della Commissione, del 13 ottobre 1978, relativa
