  content: Commission Regulation (EEC) No 2055/85 of 24 July 1985 altering one corrective
    factor to be used for calculation of the monetary compensatory amounts applicable
    on certain agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2055/85 de la Commission du 24 juillet 1985 portant
    modification du facteur de correction à retenir pour le calcul des montants compensatoires
    monétaires applicables pour certains produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2055/85 der Kommission vom 24. Juli 1985 zur Änderung
    des Berichtigungsfaktors, der bei der Berechnung der bei bestimmten landwirtschaftlichen
    Erzeugnissen anwendbaren Währungsausgleichsbeträge zu berücksichtigen ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2055/85 af 24. juli 1985 om ændring
    af den koefficient, der skal lægges til grund ved beregning af de monetære udligningsbeløb
    for visse landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2055/85 της Επιτροπής
