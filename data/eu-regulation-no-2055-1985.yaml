    συντελεστή που λαμβάνεται υπόψη για τον υπολογισμό
    των νομισματικών εξισωτικών ποσών που εφαρμόζονται
    για ορισμένα γεωργικά προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2055/85 della Commissione del 24 luglio 1985 che modifica
    il coefficiente correttivo da utilizzare per il calcolo degli importi compensativi
    monetari applicabili per taluni prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2055/85 van de Commissie van 24 juli 1985 tot wijziging
