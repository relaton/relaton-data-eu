title:
- language: fr
  script: Latn
  content: Décision 64/526/CEE de la Commission, du 9 septembre 1964, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire certains produits originaires de pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '64/526/EWG: Entscheidung der Kommission vom 9. September 1964 über die
    Inanspruchnahme von Artikel 115 Absatz (1) des Vertrages durch die Französische
    Republik, um bestimmte aus dritten Ländern stammende und in den anderen Mitgliedstaaten
    in den freien Verkehr gebrachte Erzeugnisse von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '64/526/CEE: Decisione della Commissione, del 9 settembre 1964, relativa
    al ricorso presentato dalla Repubblica francese ai sensi dell''art. 115, comma
    1 del Trattato, per escludere dal trattamento comunitario taluni prodotti originari
    di paesi terzi, messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/526/EEG: Beschikking van de Commissie van 9 september 1964 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
