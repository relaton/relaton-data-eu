    af Bacillus subtilis (LMG-S 15136) som fodertilsætningsstof til fjerkræ, fravænnede
    smågrise og slagtesvin og om ændring af forordning (EF) nr. 1259/2004, (EF)
    nr. 1206/2005, (EF) nr. 322/2009 og (EF) nr. 516/2007 (indehaver af godkendelsen
    er Beldem, en afdeling af Puratos NV)
