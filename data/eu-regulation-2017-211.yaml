    se povolení přípravku endo-1,4-beta-xylanázy (EC 3.2.1.8) z Bacillus subtilis
    (LMG-S 15136) jako doplňkové látky pro drůbež, odstavená selata a výkrm
    prasat, kterým se mění nařízení (ES) č. 1259/2004, (ES) č. 1206/2005,
    (ES) č. 322/2009 a zrušuje nařízení (ES) č. 516/2007 (držitel povolení
    Beldem, divize Puratos NV)
  type: main
