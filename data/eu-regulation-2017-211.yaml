    прасета за угояване, за изменение на регламенти
    (ЕО) № 1259/2004, (ЕО) № 1206/2005 и (ЕО) № 322/2009 и за отмяна
    на Регламент (ЕО) № 516/2007 (притежател на разрешението
    Beldem, подразделение на Puratos NV)
  type: main
