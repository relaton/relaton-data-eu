title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/211 of 7 February 2017 concerning
    the authorisation of a preparation of endo-1,4-beta-xylanase (EC 3.2.1.8) produced
    by Bacillus subtilis (LMG-S 15136) as a feed additive for poultry, weaned piglets
    and pigs for fattening, and amending Regulations (EC) No 1259/2004, (EC) No 1206/2005,
    and (EC) No 322/2009 and repealing Regulation (EC) No 516/2007 (holder of authorisation
    Beldem, a division of Puratos NV)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2017/211 de la Commission du 7 février
    2017 concernant l''autorisation d''une préparation d''endo-1,4-bêta-xylanase
    (EC 3.2.1.8) produite par Bacillus subtilis (LMG-S 15136) en tant qu''additif
    pour l''alimentation des volailles, des porcelets sevrés et des porcs à l''engrais,
    modifiant les règlements (CE) n° 1259/2004, (CE) n° 1206/2005 et (CE) n° 322/2009,
    et abrogeant le règlement (CE) n° 516/2007 (titulaire de l''autorisation: Beldem,
    une division de Puratos NV)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2017/211 der Kommission vom 7. Februar 2017
    zur Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase (EC 3.2.1.8), gewonnen
    aus Bacillus subtilis (LMG-S 15136), als Futtermittelzusatzstoff für Geflügel,
    entwöhnte Ferkel und Mastschweine und zur Änderung der Verordnungen (EG) Nr.
    1259/2004, (EG) Nr. 1206/2005 und (EG) Nr. 322/2009 sowie zur Aufhebung der Verordnung
    (EG) Nr. 516/2007 (Zulassungsinhaber: Beldem, ein Unternehmen von Puratos NV)'
  type: main
