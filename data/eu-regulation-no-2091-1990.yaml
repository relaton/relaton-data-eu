title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2091/90 of 20 July 1990 determining the
    extent to which applications lodged in July 1990 for import licences for certain
    poultrymeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2091/90 de la Commission, du 20 juillet 1990, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juillet 1990 pour certaines viandes de volaille
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2091/90 der Kommission vom 20. Juli 1990 über das
    Ausmaß, in dem den im Juli 1990 für die Einfuhr von bestimmtem Geflügelfleisch
    eingereichten Lizenzanträgen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2091/90 af 20. juli 1990 om fastlæggelse
    af, i hvilket omfang de ansøgninger om udstedelse af importlicenser, der er indgivet
    i juli 1990 for visse former for fjerkrækød, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2091/90 της Επιτροπής
    της 20ής Ιουλίου 1990 για τον καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν τον Ιούλιο 1990 για ορισμένα κρέατα
    πουλερικών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2091/90 della Commissione, del 20 luglio 1990, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di luglio 1990 per alcune carni di pollame
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2091/90 van de Commissie van 20 juli 1990 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 1990 ingediende aanvragen
    om invoercertificaten voor bepaalde soorten slachtpluimvee
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2091/90 da Comissão, de 20 de Julho de 1990, que
    determina em que medida pode ser dado seguimento aos pedidos de concessão de
    certificados de importação apresentados no mês de Julho de 1990 para determinada
    carne de aves de capoeira
  type: main
- language: es
