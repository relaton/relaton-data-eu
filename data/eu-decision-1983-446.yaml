title:
- language: en
  script: Latn
  content: '83/446/EEC: Commission Decision of 17 August 1983 authorizing the French
    Republic to introduce intra- Community surveillance in respect of imports of tableware
    and other articles of a kind commonly used for domestic or toilet purposes, of
    stoneware, originating in South Korea (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/446/CEE: Décision de la Commission du 17 août 1983 autorisant le
    République française à instaurer une surveillance intracommunautaire à l''égard
    des importations de vaisselle et articles de ménage ou de toilette en grès originaires
    de la Corée du Sud (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/446/EWG: Entscheidung der Kommission vom 17. August 1983 zur Ermächtigung
    der Französischen Republik, eine innergemeinschaftliche Überwachung der Einfuhren
    von Geschirr sowie Haushalts- oder Toilettengegenständen aus Steinzeug mit Ursprung
    in Südkorea einzuführen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/446/EØF: Kommissionens beslutning af 17. august 1983 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med importen
    af bordservice og husholdnings- eller toiletartikler af stentøj med oprindelse
    i Sydkorea (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/446/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
    Αυγούστου 1983 περί εξουσιοδοτήσεως της Γαλλικής
    Δημοκρατίας να θεσπίσει μία διακοινοτική επιτήρηση
    σχετικά με επιτραπέζια σκεύη και είδη οικιακής
    χρήσης ή ευπρεπισμού από ψευδοπορσελάνη καταγωγής
    Νοτίου Κορέας (Το κείμενο στην γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/446/CEE: Decisione della Commissione del 17 agosto 1983 che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria nei confronti
    delle importazioni di vasellame e oggetti di uso domestico o da toletta, di gres,
    originari della Corea del Sud (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '83/446/EEG: Beschikking van de Commissie van 17 augustus 1983 houdende
    machtiging van de Franse Republiek om een intracommunautair toezicht in te stellen
    ten aanzien van de invoer van vaatwerk, huishoudelijke artikelen en toiletartikelen
    van gres van oorsprong uit Zuid-Korea (Slechts de tekst in de Franse taal is authentiek)'
