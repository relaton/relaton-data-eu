title:
- language: en
  script: Latn
  content: Council Directive (EU) 2024/1499 of 7 May 2024 on standards for equality
    bodies in the field of equal treatment between persons irrespective of their racial
    or ethnic origin, equal treatment in matters of employment and occupation between
    persons irrespective of their religion or belief, disability, age or sexual orientation,
    equal treatment between women and men in matters of social security and in the
    access to and supply of goods and services, and amending Directives 2000/43/EC
    and 2004/113/EC
  type: main
- language: fr
  script: Latn
  content: Directive (UE) 2024/1499 du Conseil du 7 mai 2024 relative aux normes applicables
    aux organismes pour l’égalité de traitement dans les domaines de l’égalité
    de traitement entre les personnes sans distinction de race ou d’origine ethnique,
    de l’égalité de traitement entre les personnes en matière d’emploi et de
    travail sans distinction de religion ou de convictions, de handicap, d’âge
    ou d’orientation sexuelle et de l’égalité de traitement entre les femmes
    et les hommes en matière de sécurité sociale ainsi que dans l’accès à des
    biens et services et la fourniture de biens et services, et modifiant les directives
    2000/43/CE et 2004/113/CE
  type: main
- language: de
  script: Latn
  content: Richtlinie (EU) 2024/1499 des Rates vom 7. Mai 2024 über Standards für
    Gleichbehandlungsstellen im Bereich der Gleichbehandlung von Personen ungeachtet
    ihrer Rasse oder ethnischen Herkunft, der Gleichbehandlung von Personen in Beschäftigung
    und Beruf ungeachtet ihrer Religion oder Weltanschauung, einer Behinderung, ihres
    Alters oder ihrer sexuellen Ausrichtung sowie von Frauen und Männern im Bereich
    der sozialen Sicherheit und im Bereich des Zugangs zu und der Versorgung mit Gütern
    und Dienstleistungen und zur Änderung der Richtlinien 2000/43/EG und 2004/113/EG
  type: main
- language: bg
  script: Cyrl
  content: Директива (ЕС) 2024/1499 на Съвета от 7 май 2024
    година относно стандартите за органите по
    въпросите на равенството в областта на равното
    третиране на лицата, независимо от тяхната
    раса или етнически произход, равното третиране
    на лицата по въпросите на заетостта и професиите,
    независимо от тяхната религия или убеждения,
    увреждане, възраст или сексуална ориентация,
    равното третиране на жените и мъжете по въпросите
    на социалното осигуряване и достъпа и предоставянето
    на стоки и услуги, и за изменение на директиви
    2000/43/ЕО и 2004/113/ЕО
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady (EU) 2024/1499 ze dne 7. května 2024 o standardech pro
    orgány pro rovné zacházení v oblasti rovného zacházení s osobami bez ohledu
    na jejich rasu nebo etnický původ, rovného zacházení s osobami v otázkách
    zaměstnání a povolání bez ohledu na jejich náboženské vyznání nebo přesvědčení,
    zdravotní postižení, věk nebo sexuální orientaci, rovného zacházení se
    ženami a muži v otázkách sociálního zabezpečení a v přístupu ke zboží
    a službám a jejich poskytování a o změně směrnic 2000/43/ES a 2004/113/ES
