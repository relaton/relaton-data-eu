    de tratament între persoane, fără deosebire de rasă sau origine etnică, în
    domeniul egalității de tratament în materie de încadrare în muncă și de
    ocupare a forței de muncă, indiferent de religie sau convingeri, handicap, vârstă
    sau orientare sexuală și în domeniul egalității de tratament între femei
    și bărbați în materie de securitate socială și în ceea ce privește accesul
    la bunuri și servicii și furnizarea de bunuri și servicii și de modificare
    a Directivelor 2000/43/CE și 2004/113/CE
