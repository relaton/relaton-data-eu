    έλεγχοι εγγράφων σε απόσταση από συνοριακούς
    σταθμούς ελέγχου
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2019/2123, 10. oktoober 2019, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2017/625 selles osas,
    millistel juhtudel ja tingimustel võib teatavate kaupade identsus- ja füüsilist
    kontrolli teha kontrollipunktis ning dokumentide kontrolli mujal kui piiripunktis
  type: main
- language: fi
  script: Latn
  content: Komission Delegoitu Asetus (EU) 2019/2123, annettu 10 päivänä lokakuuta
    2019, Euroopan parlamentin ja neuvoston asetuksen (EU) 2017/625 täydentämisestä
    siltä osin kuin on kyse säännöistä, jotka koskevat sitä, missä tapauksissa
    ja millä edellytyksin tiettyjä tavaroita koskevia tunnistustarkastuksia ja fyysisiä
    tarkastuksia voidaan suorittaa valvontapisteissä ja asiakirjatarkastuksia voidaan
    suorittaa etäällä rajatarkastusasemista
  type: main
- language: hr
  script: Latn
  content: Delegirana Uredba Komisije (EU) 2019/2123 оd 10. listopada 2019. o dopuni
    Uredbe (EU) 2017/625 Europskog parlamenta i Vijeća u pogledu pravila za utvrđivanje
    u kojim slučajevima i pod kojim uvjetima se provjere identiteta i fizičke provjere
    određene robe mogu obavljati na kontrolnim točkama, a provjere dokumentacije
    na udaljenosti od graničnih kontrolnih postaja
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/2123 felhatalmazáson alapuló rendelete (2019.
    október 10.) az (EU) 2017/625 európai parlamenti és tanácsi rendeletnek a
    bizonyos áruk esetében az ellenőrző pontokon elvégezhető azonossági és
    fizikai ellenőrzések, illetve a határállomástól távol is elvégezhető
    okmányellenőrzések eseteire és feltételeire vonatkozó szabályok tekintetében
    történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2019/2123 della Commissione del 10 ottobre 2019
    che integra il regolamento (UE) 2017/625 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme per i casi e le condizioni in cui i controlli di
    identità e i controlli fisici su alcune merci possono essere eseguiti presso
    i punti di controllo e i controlli documentali possono essere eseguiti a distanza
    dai posti di controllo frontalieri
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2019/2123 (2019. gada 10. oktobris),
    ar ko attiecībā uz noteikumiem par to, kādos gadījumos un ar kādiem nosacījumiem
    identitātes un fiziskās kontrolpārbaudes noteiktām precēm var veikt kontrolpunktos
    un dokumentu kontrolpārbaudes – attālināti no robežkontroles punktiem, papildina
    Eiropas Parlamenta un Padomes Regulu (ES) 2017/625
  type: main
- language: lt
  script: Latn
  content: Komisijos Deleguotasis Reglamentas (ES) 2019/2123 2019 m. spalio 10 d.
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2017/625 papildomas atvejų,
    kuriais tam tikrų prekių tapatumo ir fiziniai patikrinimai gali būti atliekami
    kontrolės punktuose, o dokumentų patikrinimai – toliau nuo pasienio kontrolės
    postų esančiose vietose, ir sąlygų, kuriomis jie gali būti atliekami, taisyklėmis
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat Tal-Kummissjoni (UE) 2019/2123 tal-10 ta’ Ottubru
