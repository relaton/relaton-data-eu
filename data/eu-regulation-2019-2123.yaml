    fir-rigward tar-regoli għall-każijiet meta l-verifiki identitarji u l-verifiki
    fiżiċi fuq ċerti oġġetti jistgħu jitwettqu f’punti ta’ kontroll u l-verifiki
    dokumentarji jistgħu jitwettqu ’l bogħod mill-postijiet ta’ kontroll fuq
    il-fruntieri u l-kundizzjonijiet li bihom isiru dawn il-verifiki
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2019/2123 van de Commissie van 10 oktober
    2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en
    de Raad wat betreft de regels voor de gevallen waarin en de voorwaarden waaronder
    op controlepunten overeenstemmingscontroles en materiële controles op bepaalde
    goederen kunnen worden uitgevoerd, en voor de gevallen waarin en de voorwaarden
    waaronder documentencontroles op afstand van de grenscontroleposten kunnen worden
    uitgevoerd
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Delegowane Komisji (UE) 2019/2123 z dnia 10 października
    2019 r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2017/625
    w odniesieniu do przepisów dotyczących przypadków, w których kontrole identyfikacyjne
    i kontrole bezpośrednie niektórych towarów mogą być przeprowadzane w punktach
    kontroli, a kontrole dokumentacji mogą być przeprowadzane w pewnej odległości
    od punktów kontroli granicznej, oraz warunków, na jakich może się to odbywać
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2019/2123 da Comissão de 10 de outubro de 2019
    que completa o Regulamento (UE) 2017/625 do Parlamento Europeu e do Conselho no
    que se refere às regras relativas aos casos e condições em que os controlos
    de identidade e os controlos físicos de determinadas mercadorias podem ser efetuados
    em pontos de controlo e os controlos documentais podem ser efetuados à distância
    dos postos de controlo fronteiriços
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2019/2123 al Comisiei din 10 octombrie 2019 de
    completare a Regulamentului (UE) 2017/625 al Parlamentului European și al Consiliului
    în ceea ce privește normele pentru cazurile și condițiile în care se pot
    efectua controale de identitate și controale fizice vizând anumite mărfuri
    la punctele de control și în care se pot efectua controale documentare la distanță
    de posturile de inspecție la frontieră
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2019/2123 z 10. októbra 2019, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2017/625, pokiaľ ide
    o pravidlá, v ktorých prípadoch a za akých podmienok sa môžu vykonávať
    identifikačné a fyzické kontroly určitého tovaru na kontrolných miestach,
    ako aj dokladové kontroly vo vzdialenosti od hraničnej kontrolnej stanice
  type: main
- language: sl
  script: Latn
  content: Delegirana Uredba Komisije (EU) 2019/2123 z dne 10. oktobra 2019 o dopolnitvi
    Uredbe (EU) 2017/625 Evropskega parlamenta in Sveta glede pravil v zvezi s tem,
    v katerih primerih in pod katerimi pogoji se identifikacijski in fizični pregledi
    nekaterega blaga lahko izvajajo na kontrolnih točkah, dokumentacijski pregledi
    pa v oddaljenosti od mejnih kontrolnih točk
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2019/2123 de la Comisión de 10 de octubre de
    2019 por el que se completa el Reglamento (UE) 2017/625 del Parlamento Europeo
    y del Consejo en lo relativo a las normas para los casos y las condiciones en
    que pueden efectuarse controles de identidad y físicos a determinadas mercancías
    en puntos de control, y en que pueden efectuarse controles documentales a distancia
    de los puestos de control fronterizos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2019/2123 av den 10 oktober 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/625 vad
    gäller bestämmelser om i vilka fall och på vilka villkor identitetskontroll
    och fysisk kontroll av vissa varor får utföras vid kontrollställen och dokumentkontroll
    får utföras någon annanstans än vid gränskontrollstationer
