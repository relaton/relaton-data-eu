title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2019/2123 of 10 October 2019 supplementing
    Regulation (EU) 2017/625 of the European Parliament and of the Council as regards
    rules for the cases where and the conditions under which identity checks and physical
    checks on certain goods may be performed at control points and documentary checks
    may be performed at distance from border control posts
  type: main
- language: fr
  script: Latn
  content: Règlement Délégué (UE) 2019/2123 de la Commission du 10 octobre 2019
    complétant le règlement (UE) 2017/625 du Parlement européen et du Conseil en
    ce qui concerne les règles applicables aux cas et aux conditions dans lesquels
    les contrôles d’identité et les contrôles physiques de certains biens peuvent
    être effectués à des points de contrôle et les contrôles documentaires peuvent
    être effectués à distance au départ de postes de contrôle frontaliers
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2019/2123 der Kommission vom 10. Oktober 2019
    zur Ergänzung der Verordnung (EU) 2017/625 des Europäischen Parlaments und des
    Rates hinsichtlich Vorschriften darüber, in welchen Fällen und unter welchen
    Bedingungen bei bestimmten Waren Nämlichkeitskontrollen und Warenuntersuchungen
    an Kontrollstellen durchgeführt sowie Dokumentenprüfungen in Entfernung von
    Grenzkontrollstellen durchgeführt werden können
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2019/2123 на Комисията
    от 10 октомври 2019 година за допълнение на Регламент
    (ЕС) 2017/625 на Европейския парламент и на Съвета
    по отношение на случаите и условията, при които
    проверките за идентичност и физическите проверки
    на някои стоки може да се извършват на контролни
    пунктове, а проверките на документи може да
    се извършват на разстояние от граничните контролни
    пунктове
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2019/2123 ze dne 10. října
    2019, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2017/625,
    pokud jde o pravidla týkající se toho, ve kterých případech a za jakých
    podmínek mohou být kontroly totožnosti a fyzické kontroly u určitého zboží
    prováděny na kontrolních místech a ve kterých případech a za jakých podmínek
    mohou být kontroly dokladů prováděny dálkově mimo stanoviště hraniční
    kontroly
  type: main
- language: da
  script: Latn
  content: Kommissionens Delegerede Forordning (EU) 2019/2123 af 10. oktober 2019
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2017/625
    for så vidt angår regler for, i hvilke tilfælde og på hvilke betingelser der
    kan foretages identitetskontrol og fysisk kontrol af visse varer på kontrolsteder
    og dokumentkontrol kan foretages i en vis afstand fra grænsekontrolsteder
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2019/2123
    της Επιτροπής της 10ης Οκτωβρίου 2019 για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2017/625 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά τους κανόνες
    για τις περιπτώσεις στις οποίες και τους όρους
    υπό τους οποίους μπορούν να διενεργούνται
    έλεγχοι ταυτότητας και φυσικοί έλεγχοι σε
