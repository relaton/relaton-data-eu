title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/768 of 9 June 2020 amending Decision (EU) 2016/915
    as regards the reference period intended to be used for measuring the growth of
    CO2 emissions, to take account of the consequences of the COVID-19 pandemic in
    the context of CORSIA
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/768 du Conseil du 9 juin 2020 modifiant la décision
    (UE) 2016/915 en ce qui concerne la période de référence destinée à mesurer
    la croissance des émissions de CO2, afin de tenir compte des conséquences de
    la pandémie de COVID-19 dans le contexte du CORSIA
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/768 des Rates vom 9. Juni 2020 zur Änderung des Beschlusses
    (EU) 2016/915 des Rates hinsichtlich des — im Zusammenhang mit CORSIA — für
    die Messung des Anstiegs der CO2-Emissionen zu verwendenden Bezugszeitraums unter
    Berücksichtigung der Folgen der COVID-19-Pandemie
  type: main
- language: bg
  script: Cyrl
