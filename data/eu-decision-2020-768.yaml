    měření růstu emisí CO2, s cílem zohlednit důsledky pandemie COVID-19 v
    souvislosti se systémem CORSIA
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2020/768 af 9. juni 2020 om ændring af afgørelse
    (EU) 2016/915 for så vidt angår den referenceperiode, der påtænkes anvendt
    til måling af væksten i CO2-emissioner, for at tage hensyn til konsekvenserne
    af covid-19-pandemien i forbindelse med CORSIA
  type: main
