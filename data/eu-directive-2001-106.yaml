id: EUDirective2001106
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Directive 2001/106/EC of the European Parliament and of the Council of
    19 December 2001 amending Council Directive 95/21/EC concerning the enforcement,
    in respect of shipping using Community ports and sailing in the waters under the
    jurisdiction of the Member States, of international standards for ship safety,
    pollution prevention and shipboard living and working conditions (port State control)
  type: main
- language: fr
  script: Latn
  content: Directive 2001/106/CE du Parlement européen et du Conseil du 19 décembre
    2001 modifiant la directive 95/21/CE du Conseil concernant l'application aux navires
    faisant escale dans les ports de la Communauté ou dans les eaux relevant de la
    juridiction des États membres, des normes internationales relatives à la sécurité
    maritime, à la prévention de la pollution et aux conditions de vie et de travail
    à bord des navires (contrôle par l'État du port)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2001/106/EG des Europäischen Parlaments und des Rates vom 19.
    Dezember 2001 zur Änderung der Richtlinie 95/21/EG des Rates zur Durchsetzung
    internationaler Normen für die Schiffssicherheit, die Verhütung von Verschmutzung
    und die Lebens- und Arbeitsbedingungen an Bord von Schiffen, die Gemeinschaftshäfen
    anlaufen und in Hoheitsgewässern der Mitgliedstaaten fahren (Hafenstaatkontrolle)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2001/106/ЕО на Европейския парламент
    и на Съвета от 19 декември 2001 година за изменение
    на Директива 95/21/ЕО относно прилагането по
    отношение на кораби, които използват пристанища
    на Общността и плават във води под юрисдикцията
    на държавите-членки, на международните стандарти
    за безопасност на корабоплаването, предотвратяване
    на замърсяването и за условията на живот и
    работа на борда на корабите (държавен пристанищен
    контрол)
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2001/106/ES ze dne 19. prosince
    2001, kterou se mění směrnice Rady 95/21/ES o uplatňování mezinárodních
    norem pro bezpečnost lodí, zabránění znečištění a životní a pracovní
    podmínky na lodích, které využívají přístavy Společenství a plují ve
    výsostných vodách členských států (státní přístavní inspekce)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2001/106/EF af 19. december 2001
    om ændring af Rådets direktiv 95/21/EF om håndhævelse over for skibe, der
    anløber Fællesskabets havne og sejler i farvande under medlemsstaternes jurisdiktion,
    af internationale standarder for skibes sikkerhed, for forureningsforebyggelse
    samt for leve- og arbejdsvilkår om bord (havnestatskontrol)
  type: main
- language: el
  script: Grek
  content: Οδηγία 2001/106/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 19ης Δεκεμβρίου 2001, που
    τροποποιεί την οδηγία 95/21/ΕΚ του Συμβουλίου
    για την επιβολή, σχετικά με τη ναυσιπλοΐα που
    συνεπάγεται χρήση κοινοτικών λιμένων ή διέλευση
    από ύδατα υπό τη δικαιοδοσία κράτους μέλους,
    των διεθνών προτύπων για την ασφάλεια των πλοίων,
    την πρόληψη της ρύπανσης και τις συνθήκες διαβίωσης
    και εργασίας επί των πλοίων (έλεγχος του κράτους
    του λιμένα)
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2001/106/EÜ, 19. detsember 2001,
    millega muudetakse nõukogu direktiivi 95/21/EÜ laevaohutust, reostuse vältimist
    ning elu- ja töötingimusi laevadel käsitlevate rahvusvaheliste standardite
    rakendamise kohta ühenduse sadamaid kasutavate ja liikmesriikide jurisdiktsiooni
    all olevates vetes sõitvate laevade suhtes (sadamariigi kontroll)
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2001/106/EY, annettu 19 päivänä
    joulukuuta 2001, alusturvallisuutta, saastumisen ehkäisemistä ja alusten asumis-
    ja työskentelyolosuhteita koskevien kansainvälisten standardien soveltamisesta
    yhteisön satamia käyttäviin ja jäsenmaiden lainkäyttövaltaan kuuluvilla
    vesillä purjehtiviin aluksiin (satamavaltioiden suorittama valvonta) annetun
    neuvoston direktiivin 95/21/EY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2001/106/EK irányelve (2001. december
    19.) a Közösség kikötőiben és a tagállamok felségvizein történő hajózás
    tekintetében a hajózás biztonságára, a környezetszennyezés megelőzésére
    és a fedélzeti élet- és munkakörülményekre vonatkozó nemzetközi előírások
    végrehajtásáról (kikötő szerinti illetékes állam hatósága által végzett
    ellenőrzés) szóló 95/21/EK tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2001/106/CE del Parlamento europeo e del Consiglio, del 19 dicembre
    2001, che modifica la direttiva 95/21/CE del Consiglio relativa all'attuazione
    di norme internazionali per la sicurezza delle navi, la prevenzione dell'inquinamento
    e le condizioni di vita e di lavoro a bordo, per le navi che approdano nei porti
    comunitari e che navigano nelle acque sotto la giurisdizione degli Stati membri
    (controllo dello Stato di approdo)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2001/106/EK (2001. gada 19. decembris),
    ar kuru groza Direktīvu 95/21/EK, kas nosaka, kā kuģošanai Kopienas ostās
    un dalībvalstu jurisdikcijai pakļautos ūdeņos piemērot starptautiskos standartus
    attiecībā uz kuģu drošību, piesārņojuma novēršanu un dzīves un darba
    apstākļiem uz kuģiem (ostas valsts kontrole)
  type: main
- language: lt
  script: Latn
  content: 2001 m. gruodžio 19 d., Europos Parlamento ir Tarybos direktyva 2001/106/EB
    iš dalies pakeičianti Tarybos Direktyvą 95/21/EB dėl laivo saugumo, taršos
    prevencijos ir darbo bei gyvenimo sąlygų laivuose tarptautinių standartų taikymo
    laivams, atplaukiantiems į Bendrijos uostus ir plaukiojantiems valstybių narių
    jurisdikcijai priklausančiuose vandenyse (uosto valstybės kontrolė)
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 2001/106/KE tal-Parlament Ewropew u tal-Kunsill tad-19 ta'
    Diċembru 2001 li temenda d-Direttiva tal-Kunsill 95/21/KE rigward l-infurzar,
    fil-każ tal-bastimenti li jużaw il-portijiet tal-Komunità u jbaħħru fl-ibħra
    taħt il-ġurisdizzjoni ta' l-Istati Membri, ta' standards internazzjonali għas-sigurtà
    tal-bastimenti, il-prevenzjoni tat-tniġġis u l-kondizzjonijiet tal-ħajja abbord
    u tax-xogħol (il-kontroll portwali ta' l-Istat)
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2001/106/EG van het Europees Parlement en de Raad van 19 december
    2001 houdende wĳziging van Richtlĳn 95/21/EG van de Raad betreffende de naleving,
    met betrekking tot de schepen die gebruikmaken van havens in de Gemeenschap en
    varen in de onder de jurisdictie van de lidstaten vallende wateren, van internationale
    normen op het gebied van de veiligheid van schepen, voorkoming van verontreiniging
    en leef- en werkomstandigheden aan boord (havenstaatcontrole)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2001/106/WE Parlamentu Europejskiego i Rady z dnia 19 grudnia
    2001 r. zmieniająca dyrektywę Rady 95/21/WE dotyczącą przestrzegania, w odniesieniu
    do żeglugi morskiej korzystającej ze wspólnotowych portów oraz żeglugi morskiej
    po wodach znajdujących się pod jurysdykcją Państw Członkowskich, międzynarodowych
    norm bezpieczeństwa statków i zapobiegania zanieczyszczeniom oraz pokładowych
    warunków życia i pracy (kontrola państwa portu)
  type: main
- language: pt
  script: Latn
  content: Directiva 2001/106/CE do Parlamento Europeu e do Conselho, de 19 de Dezembro
    de 2001, que altera a Directiva 95/21/CE do Conselho relativa à aplicação,
    aos navios que escalem os portos da Comunidade ou naveguem em águas sob jurisdição
    dos Estados-Membros, das normas internacionais respeitantes à segurança da navegação,
    à prevenção da poluição e às condições de vida e de trabalho a bordo dos
    navios (inspecção pelo Estado do porto)
  type: main
- language: ro
  script: Latn
  content: Directiva 2001/106/CE a Parlamentului European și a Consiliului din 19
    decembrie 2001 de modificare a Directivei 95/21/CE a Consiliului privind aplicarea
    standardelor internaționale pentru siguranța navelor, prevenirea poluării,
    asigurarea condițiilor de muncă și viață (controlul statului de port) la
    navele care utilizează porturile comunitare și navighează în apele aflate
    sub jurisdicția statelor membre
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2001/106/ES z 19. decembra 2001,
    ktorá mení a dopĺňa smernicu Rady 95/21/ES, týkajúcu sa presadzovania medzinárodných
    štandardov pre bezpečnosť lodí, ochranu proti znečisteniu a životné a pracovné
    podmienky na lodiach (prístavná štátna kontrola) vzhľadom k lodnej preprave,
    ktorá využíva prístavy spoločenstva a plaví sa vo vodách pod jurisdikciou
    členských štátov
  type: main
- language: sl
  script: Latn
  content: Direktiva 2001/106/ES Evropskega parlamenta in Sveta z dne 19. decembra
    2001 o spremembi Direktive Sveta 95/21/ES o uveljavitvi mednarodnih standardov
    za varnost ladij, preprečevanje onesnaževanja ter pogoje za življenje in delo
    na ladjah, ki uporabljajo pristanišča Skupnosti in plujejo v vodah v pristojnosti
    držav članic (pomorska inšpekcija)
  type: main
- language: es
  script: Latn
  content: Directiva 2001/106/CE del Parlamento Europeo y del Consejo, de 19 de diciembre
    de 2001, por la que se modifica la Directiva 95/21/CE del Consejo sobre el cumplimiento
    de las normas internacionales de seguridad marítima, prevención de la contaminación
    y condiciones de vida y de trabajo a bordo, por parte de los buques que utilicen
    los puertos comunitarios o las instalaciones situadas en aguas bajo jurisdicción
    de los Estados miembros (control del Estado del puerto)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2001/106/EG av den 19 december
    2001 om ändring av rådets direktiv 95/21/EG om tillämpning av internationella
    normer för säkerhet på fartyg, förhindrande av förorening samt boende- och
    arbetsförhållanden ombord på fartyg som anlöper gemenskapens hamnar och framförs
    i medlemsstaternas territorialvatten (hamnstatskontroll)
  type: main
