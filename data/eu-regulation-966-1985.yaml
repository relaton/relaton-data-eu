title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 966/85 of 11 April 1985 re-establishing
    the levying of customs duties on watch cases and parts of watch cases, falling
    within heading No 91.09 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 966/85 de la Commission du 11 avril 1985 portant rétablissement
    de la perception des droits de douane applicables aux boîtes de montres du no
    91.01 et leurs parties, de la position 91.09 du tarif douanier commun, originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 966/85 der Kommission vom 11. April 1985 zur Wiedereinführung
    der Erhebung der Zölle für Gehäuse für Uhren der Tarifnummer 91.01 und Teile
    davon, der Tarifnummer 91.09, mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 966/85 af 11. april 1985 om genindførelse
    af opkrævning af told for kasser til de i pos. 91.01 omhandlede ure samt dele
    dertil, henhørende under pos. 91.09 og med oprindelse i Hongkong, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 966/85 της Επιτροπής
    της 11ης Απριλίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τα κελύφη ωρολογίων
    της κλάσεως 91.01 και μέρη αυτών, της κλάσεως
    91.09 του Κοινού Δασμολογίου, καταγωγής Χονγκ
    Κονγκ, δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 966/85 della Commissione dell' 11 aprile 1985 che
    ripristina la riscossione dei dazi doganali applicabili alle casse per orologi
    delle voce n. 91.01 e loro parti, della voce 91.09 della tariffa doganale comune,
    originarie di Hong Kong beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 966/85 van de Commissie van 11 april 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kasten voor
    horloges bedoeld bij post 91.01, alsmede delen daarvan, van tariefpost 91.09,
    van oorsprong uit Hong-Kong waarvoor de in Verordening (EEG) nr. 3562/84 van de
    Raad vermelde tariefpreferenties zijn verleend
  type: main
