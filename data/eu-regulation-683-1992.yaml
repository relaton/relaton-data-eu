    ισοτιμιών της αγοράς που θα εφαρμοσθούν σε
    ορισμένα ποσά στα πλαίσια της κοινής γεωργικής
    πολιτικής και κυρίως για τον υπολογισμό των
    νομισματικών εξισωτικών ποσών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 683/92 della Commissione, del 19 marzo 1992, che fissa
