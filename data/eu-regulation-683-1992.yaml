    montantes no âmbito da política agrícola comum e, nomeadamente, para o cálculo
    dos montantes compensatórios monetários
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 683/92 de la Comisión, de 19 de marzo de 1992, por
    el que se fijan los tipos representativos del mercado aplicables a determinados
    importes en el marco de la política agraria común y, en particular, al cálculo
    de los montantes compensatorios monetarios
  type: main
