    politica agricola comune, in particolare per il calcolo degli importi compensativi
    monetari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 683/92 van de Commissie van 19 maart 1992 tot vaststelling
    van de representatieve marktkoersen die moeten worden toegepast voor bepaalde
    bedragen in het kader van het gemeenschappelijk landbouwbeleid, en met name voor
    de berekening van de monetaire compenserende bedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 683/92 da Comissão, de 19 de Março de 1992, que
