title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1562/85 of 7 June 1985 laying down detailed
    rules for the application of measures to encourage the processing of oranges and
    the marketing of products processed from lemons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1562/85 de la Commission du 7 juin 1985 portant modalités
    d' application des mesures visant à promouvoir la transformation des oranges
    et la commercialisation des produits transformés à base de citrons
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1562/85 der Kommission vom 7. Juni 1985 mit Durchführungsbestimmungen
    zu den Maßnahmen zur Förderung der Apfelsinenverarbeitung und der Vermarktung
    von Verarbeitungserzeugnissen aus Zitronen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1562/85 af 7. juni 1985 om gennemførelsesbestemmelser
    til foranstaltningerne til fremme af forarbejdning af appelsiner og afsætning
    af produkter forarbejdet på basis af citroner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1562/85 της Επιτροπής
    της 7ης Ιουνίου 1985 περί των λεπτομερειών εφαρμογής
    των μέτρων για την προώθηση της μεταποίησης
    πορτοκαλιών και της εμπορίας των μεταποιημένων
    προϊόντων με βάση τα λεμόνια
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1562/85 della Commissione del 7 giugno 1985 che stabilisce
    le modalità di applicazione delle misure intese a promuovere la trasformazione
    delle arance e la commercializzazione dei prodotti trasformati a base di limoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1562/85 van de Commissie van 7 juni 1985 houdende
    uitvoeringsbepalingen ten aanzien van de maatregelen ter bevordering van de verwerking
    van sinaasappelen en de afzet van op basis van citroenen verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1562/85 da Comissão, de 7 de Junho de 1985, que
    estabelece as modalidades de aplicação das medidas destinadas a promover a transformação
    das laranjas e a comercialização dos produtos transformados à base de limões
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1562/85 de la Comisión, de 7 de junio de 1985, por
    el que se establecen las modalidades de aplicación de las medidas destinadas
    a promover la transformación de naranjas y la comercialización de los productos
    transformados a base de limones
  type: main
