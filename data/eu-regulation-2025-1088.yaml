  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1088 of 2 June 2025 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Alnus cordata, Alnus glutinosa and Alnus incana originating in the United Kingdom
    and Implementing Regulation (EU) 2020/1213 as regards the phytosanitary measures
    for the introduction of those plants for planting into the Union territory
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1088 de la Commission du 2 juin 2025
    modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne certains
    végétaux destinés à la plantation appartenant aux espèces Alnus cordata,
    Alnus glutinosa et Alnus incana et originaires du Royaume-Uni et le règlement
    d’exécution (UE) 2020/1213 en ce qui concerne les mesures phytosanitaires préalables
    à l’introduction de ces végétaux destinés à la plantation sur le territoire
    de l’Union
  type: main
