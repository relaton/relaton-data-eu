title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2624/91 of 2 September 1991 re-establishing
    the levying of customs duties on products falling within CN code 2930 90 10, originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2624/91 DE LA COMMISSION du 2 septembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2930 90 10 originaires de la Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2624/91 DER KOMMISSION vom 2. September 1991 zur
