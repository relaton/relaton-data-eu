title:
- language: en
  script: Latn
  content: Council Decision of 14 December 2000 implementing Joint Action 1999/34/CFSP
    with a view to a European Union contribution to combating the destabilising accumulation
    and spread of small arms and light weapons in South Ossetia
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil du 14 décembre 2000 mettant en oeuvre l'action commune
    1999/34/PESC en vue d'une contribution de l'Union européenne à la lutte contre
    l'accumulation et la diffusion déstabilisatrices d'armes légères et de petit
    calibre en Ossétie du Sud
  type: main
- language: de
  script: Latn
  content: Beschluss des Rates vom 14. Dezember 2000 zur Durchführung der Gemeinsamen
    Aktion 1999/34/GASP betreffend einen Beitrag der Europäischen Union zur Bekämpfung
    der destabilisierenden Anhäufung und Verbreitung von Kleinwaffen und leichten
    Waffen in Südossetien
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse af 14. december 2000 om gennemførelse af fælles aktion
    1999/34/FUSP med henblik på Den Europæiske Unions bidrag til bekæmpelse af
    destabiliserende ophobning og spredning af håndskydevåben og lette våben i
    Sydossetien
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου, της 14ης Δεκεμβρίου
    2000, περί εφαρμογής της κοινής δράσης 1999/34/ΚΕΠΠΑ
    σχετικά με τη συμβολή της Ευρωπαϊκής Ένωσης
    στην καταπολέμηση της αποσταθεροποιητικής
    συσσώρευσης και διάδοσης φορητών όπλων και
    ελαφρού οπλισμού στη Νότια Οσσετία
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös, tehty 14 päivänä joulukuuta 2000, Euroopan unionin
    osallistumisesta käsiaseiden ja kevyiden aseiden epävakauttavan keskittymisen
    ja leviämisen torjumiseen hyväksytyn yhteisen toiminnan 1999/34/YUTP täytäntöönpanosta
    Etelä-Ossetiassa (2000/803/YUTP)
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio, del 14 dicembre 2000, che attua l'azione comune
    1999/34/PESC sul contributo dell'Unione europea alla lotta contro l'accumulazione
    e la diffusione destabilizzanti di armi portatili e di armi leggere nell'Ossezia
    meridionale
  type: main
- language: nl
  script: Latn
  content: Besluit van de Raad van 14 december 2000 tot uitvoering van Gemeenschappelijk
    Optreden 1999/34/GBVB met het oog op een bijdrage van de Europese Unie aan de
    bestrijding van de destabiliserende accumulatie en verspreiding van handvuurwapens
    en lichte wapens in Zuid-Ossetië
  type: main
- language: pt
  script: Latn
  content: Decisão do Conselho, de 14 de Dezembro de 2000, que executa a Acção
    Comum 1999/34/PESC relativa ao contributo da União Europeia para o combate à
    acumulação e proliferação desestabilizadoras de armas de pequeno calibre e
    armas ligeiras na Ossécia do Sul
  type: main
- language: es
  script: Latn
  content: Decisión del Consejo, de 14 de diciembre de 2000, por la que se aplica
    la Acción común 1999/34/PESC con vistas a una contribución de la Unión Europea
    para combatir la acumulación desestabilizadora y la proliferación de armas ligeras
    y de pequeño calibre en Osetia del Sur
  type: main
- language: sv
  script: Latn
  content: Rådets beslut av den 14 december 2000 om genomförande av gemensam åtgärd
    1999/34/GUSP inför ett bidrag från Europeiska unionen för att bekämpa den
    destabiliserande anhopningen och spridningen av lätta vapen och handeldvapen
    i Sydossetien (2000/803/GUSP)
