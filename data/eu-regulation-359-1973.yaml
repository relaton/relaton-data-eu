title:
- language: en
  script: Latn
  content: Regulation (EEC) No 359/73 of the Commission of 31 January 1973 authorizing
    the United Kingdom to suspend in part the customs duties on certain products derived
    from pears not containing added sugar and imported from other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 359/73 de la Commission, du 31 janvier 1973, autorisant
    le Royaume-Uni à suspendre partiellement les droits de douane applicables à
    certains produits à base de poires sans addition de sucre importés en provenance
    des autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 359/73 der Kommission vom 31. Januar 1973 zur Ermächtigung
    des Vereinigten Königreichs, die Zölle auf bestimmte, aus anderen Mitgliedstaaten
    eingeführte Erzeugnisse aus Birnen, ohne Zusatz von Zucker, teilweise auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 359/73 af 31. januar 1973 om bemyndeligelse
    af Det forenede Kongerige til delvis at suspendere tolden på visse af pærer
    fremstillede varer, uden sukkertilsætning og indført fra andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 359/73 della Commissione, del 31 gennaio 1973, che
    autorizza il Regno Unito a sospendere parzialmente i dazi doganali applicabili
    ad alcuni prodotti a base di pere senza addizione di zuccheri importati in provenienza
    dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 359/73 van de Commissie van 31 januari 1973 waarbij
    het Verenigd Koninkrijk wordt gemachtigd tot gedeeltelijke schorsing van de douanerechten
    op bepaalde uit andere Lid-Staten ingevoerde produkten op basis van peren, zonder
    toevoeging van suiker
  type: main
