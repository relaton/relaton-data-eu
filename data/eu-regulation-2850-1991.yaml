  content: Commission Regulation (EEC) No 2850/91 of 27 September 1991 laying down
    certain, additional detailed rules for the application of the supplementary trade
    mechanism (STM) to trade in fruit and vegetables between Spain and the Community
    as constituted on 31 December 1985 as regards certain fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CEE) No 2850/91 DE LA COMMISSION du 27 septembre 1991 fixant
