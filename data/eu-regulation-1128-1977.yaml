title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1128/77 of 27 May 1977 re-establishing the
    levying of customs duties on cotton yarn, not put up for retail sale, falling
    within subheading 55.05 A, originating in Yugoslavia to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1128/77 de la Commission, du 27 mai 1977, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton non conditionnés pour la vente au détail, de la sous-position tarifaire
    55.05 A, originaires de la Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1128/77 der Kommission vom 27. Mai 1977 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne, nicht in Aufmachungen für
    den Einzelverkauf, der Tarifstelle 55.05 A, mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 3022/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1128/77 af 27. maj 1977 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, ikke i detailsalgsoplægninger,
    under underposition 55.05 A, som har oprindelse i Jugoslavien, og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1128/77 della Commissione, del 27 maggio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di cotone, non
    preparati per la vendita al minuto, della sottovoce doganale 55.05 A, originari
    della Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3022/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1128/77 van de Commissie van 27 mei 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op garens van
    katoen, niet gereed voor de verkoop in het klein, van post 55.05 A, van oorsprong
    uit Joegoslavië waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3022/76 van de Raad
  type: main
