title:
- language: en
  script: Latn
  content: '78/946/EEC: Commission Decision of 31 October 1978 authorizing Ireland
    not to apply Community treatment to men'' s and boys'' woven breeches, shorts
    and trousers (including slacks); women'' s, girls'' and infants'' woven trousers
    and slacks, of wool, of cotton or of man-made textile fibres, falling within heading
    No ex 61.01 or subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes
    61.01-62, 64, 66, 72, 74, 76; 61.02-66, 68, 72), originating in Singapore and
    in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/946/CEE: Décision de la Commission, du 31 octobre 1978, autorisant
    l'' Irlande à exclure du traitement communautaire les culottes, "shorts" et pantalons,
    tissés, pour hommes et garçonnets, pantalons, tissés, pour femmes, fillettes
    et jeunes enfants, de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    de la position ex 61.01 et de la sous-position ex 61.02 B du tarif douanier commun
    (codes Nimexe : 61.01-62; 64; 66; 72; 74; 76 - 61.02-66; 68; 72), originaires
    de Singapour et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/946/EWG: Entscheidung der Kommission vom 31. Oktober 1978, mit der
    Irland ermächtigt wird, aus Singapur stammende und in den úbrigen Mitgliedstaaten
    im freien Verkehr befindliche Shorts und andere kurze Hosen und lange Hosen aus
    Geweben fúr Mánner und Knaben, lange Hosen aus Geweben fúr Frauen, Mádchen
    und Kleinkinder, aus Wolle, Baumwolle, synthetischen oder kúnstlichen Spinnstoffen,
    der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.01-62; 64; 66; 72; 74; 76; 61.02-66; 68; 72) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/946/EØF: Kommissionens beslutning af 31. oktober 1978 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage shorts og andre korte benklæder
    til mænd og drenge, vævede; lange benklæder til kvinder, piger og småbørn,
    vævede, af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 61.01 og 61.02 B i den fælles toldtarif (NIMEXE-kode 61.01-62,
    64, 66, 72, 74, 76 - 61.02-66, 68, 72), har oprindelse i Singapore og frit kan
    omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/946/CEE: Decisione della Commissione, del 31 ottobre 1978, che autorizza
    l'' Irlanda ad escludere dal trattamento comunitario calzoncini, shorts e pantaloni,
    tessuti per uomo e per ragazzo, pantaloni tessuti, per donna, per ragazza e per
    bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali, della
    voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale comune (codice
    Nimexe: 61.01-62; 64; 66; 72; 74; 76; 61.02-66; 68; 72), originari di Singapore
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/946/EEG: Beschikking van de Commissie van 31 oktober 1978 waarbij Ierland
    wordt gemachtigd shorts en andere korte broeken, lange broeken, geweven, voor
    heren en jongens, lange broeken, geweven van wol, van katoen of van synthetische
    of van kunstmatige textielvezels voor dames, meisjes en kinderen, van de posten
    ex 61.01 en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01-62,
    64, 66, 72, 74, 76 en 61.02-66, 68, 72), van oorsprong uit Singapore en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
