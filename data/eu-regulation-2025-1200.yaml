  content: Reglamento de Ejecución (UE) 2025/1200 de la Comisión, de 12 de junio
    de 2025, por el que se modifican los anexos V, XIII y XIV del Reglamento de Ejecución
    (UE) 2021/404 en lo que concierne a las entradas correspondientes a Canadá, a
    Esuatini, al Reino Unido y a los Estados Unidos en las listas de terceros países,
    territorios, o zonas de estos, desde los que se permite la entrada en la Unión
    de partidas de aves de corral y productos reproductivos de aves de corral, carne
    fresca de bovinos y de ungulados de caza de cría y silvestres y carne fresca
