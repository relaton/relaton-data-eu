  content: Commission Implementing Regulation (EU) 2025/1200 of 12 June 2025 amending
    Annexes V, XIII and XIV to Implementing Regulation (EU) 2021/404 as regards the
    entries for Canada, Eswatini, the United Kingdom and the United States in the
    lists of third countries, territories or zones thereof authorised for the entry
    into the Union of consignments of poultry and germinal products of poultry, fresh
    meat of bovine animals, farmed and wild game ungulates and fresh meat of poultry
    and game birds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1200 de la Commission du 12 juin 2025
    modifiant les annexes V, XIII et XIV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives au Canada, à l’Eswatini, aux États-Unis
    et au Royaume-Uni dans les listes des pays tiers et territoires ou des zones de
    pays tiers ou de territoire en provenance desquels l’entrée dans l’Union
    d’envois de volailles, de produits germinaux de volailles, de viandes fraîches
    de bovins, d’ongulés d’élevage et d’ongulés sauvages, et de viandes fraîches
    de volailles et de gibier à plumes est autorisée
  type: main
