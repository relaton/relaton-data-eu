    ide o zápisy týkajúce sa Kanady, Eswatini, Spojeného kráľovstva a Spojených
    štátov amerických v zoznamoch tretích krajín, území alebo ich pásiem,
    z ktorých sa povoľuje vstup zásielok hydiny a zárodočných produktov hydiny,
    čerstvého mäsa z hovädzieho dobytka, kopytníkov z farmových chovov a voľne
    žijúcich kopytníkov a čerstvého mäsa z hydiny a pernatej zveri do Únie
