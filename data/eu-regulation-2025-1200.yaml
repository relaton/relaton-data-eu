    prilog V, XIII in XIV k Izvedbeni uredbi (EU) 2021/404 glede vnosov za Kanado,
    Esvatini, Združeno kraljestvo in Združene države Amerike na seznamih tretjih
    držav, njihovih ozemelj ali območij, s katerih je dovoljen vstop pošiljk perutnine
    in zarodnega materiala perutnine, pošiljk svežega mesa goveda ter gojenih in
    divjih kopitarjev ter pošiljk svežega mesa perutnine in pernate divjadi v Unijo
  type: main
