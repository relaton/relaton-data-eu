title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1461/81 of 27 May 1981 determining the extent
    to which applications lodged between 30 April and 8 May 1981 for the issue of
    import licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1461/81 de la Commission, du 27 mai 1981, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d' importation déposées entre le 30 avril et le 8 mai 1981 pour les viandes
    bovines congelées destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1461/81 der Kommission vom 27. Mai 1981 über den
    Umfang, in dem den zwischen dem 30. April und 8. Mai 1981 eingereichten Anträgen
    auf Einfuhrlizenzen für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1461/81 af 27. maj 1981 om fastsættelse
    af, i hvilken udstrækning anmodningen om udstedelse af importlicens, indgivet
    mellem den 30. april og den 8. maj 1981 for frosset oksekød til forarbejdning,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1461/81 τής Επιτροπής
    τής 27ης Μαΐου 1981 περί καθορισμού σέ ποιό βαθμό
    μπορεί νά δοθεί συνέχεια στίς αιτήσεις γιά
    τήν έκδοση πιστοποιητικών εισαγωγής, πού υποβλήθηκαν
    μεταξύ τής 30ής Απριλίου καί τής 8ης Μαΐου 1981,
    γιά τά κατεψυγμένα βόεια κρέατα πού προορίζονται
    γιά μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1461/81 della Commissione, del 27 maggio 1981, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'
    importazione presentate fra il 30 aprile e l' 8 maggio 1981 per le carni bovine
    congelate destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1461/81 van de Commissie van 27 mei 1981 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de tussen 30 april en
    8 mei 1981 ingediende aanvràgen om afgifte van invoercertificaten voor bevroren
    rundvlees bestemd voor verwerking
  type: main
