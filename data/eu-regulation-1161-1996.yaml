    (ΕΟΚ) αριθ. 2999/92 όσον αφορά τις λεπτομέρειες
    εφαρμογής του ειδικού καθεστώτος για τον εφοδιασμό
    της Μαδέρας με προϊόντα του τομέα των μεταποιημένων
    οπωροκηπευτικών και για τον καθορισμό του
    ισοζυγίου εφοδιασμού για την περίοδο από 1ης
    Ιουλίου 1996 έως 30 Ιουνίου 1997
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1161/96, annettu 26 päivänä kesäkuuta 1996,
    Madeiran hedelmä- ja vihannesjalosteiden tuotteiden hankintaa koskevien erityisjärjestelyjen
    soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 2999/92 muuttamisesta ja hankintaa koskevan ennakkoarvion määrittämisestä
    ajanjaksolle 1 päivästä heinäkuuta 1996 30 päivään kesäkuuta 1997
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1161/96 della Commissione del 26 giugno 1996 recante
    modifica del regolamento (CEE) n. 2999/92 relativo alle modalità di applicazione
    del regime specifico di approvvigionamento di prodotti trasformati a base di ortofrutticoli
    per Madera, e che stabilisce il bilancio di approvvigionamento per il periodo
    dal 1o luglio 1996 al 30 giugno 1997
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1161/96 van de Commissie van 26 juni 1996 tot aanpassing
    van Verordening (EEG) nr. 2999/92 houdende bepalingen ter uitvoering van de specifieke
    regeling voor de voorziening van Madeira met produkten van de sector verwerkte
    groenten en fruit, en ter vaststelling van de voorzieningsbalans voor de periode
    van 1 juli 1996 tot en met 30 juni 1997
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n 1161/96 da Comissão de 26 de Junho de 1996 que altera
    o Regulamento (CEE) nº 2999/92, que estabelece normas de execução do regime
    específico de abastecimento da Madeira em produtos do sector dos produtos transformados
    à base de frutas e produtos hortícolas, e determina a estimativa das necessidades
    de abastecimento para o período compreendido entre 1 de Julho de 1996 e 30 de
    Junho de 1997
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1161/96 de la Comisión de 26 de junio de 1996 por el
