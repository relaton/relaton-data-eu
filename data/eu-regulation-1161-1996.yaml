title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1161/96 of 26 June 1996 amending Regulation
    (EEC) No 2999/92 laying down detailed rules for the application of the specific
    measures for the supply of processed fruit and vegetables to Madeira and to determine
    the forecast supply balance for the period 1 July 1996 to 30 June 1997
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1161/96 de la Commission du 26 juin 1996 modifiant le
    règlement (CEE) nº 2999/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement de Madère en produits du secteur des fruits et légumes
    transformés et déterminant le bilan d'approvisionnement pour la période du
    1er juillet 1996 au 30 juin 1997
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1161/96 der Kommission vom 26. Juni 1996 zur Änderung
