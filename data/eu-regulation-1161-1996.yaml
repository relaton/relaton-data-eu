    für die Versorgung von Madeira mit Verarbeitungserzeugnissen aus Obst und Gemüse
    und zur Errichtung der Versorgungsbilanz für den Zeitraum vom 1. Juli 1996 bis
    30. Juni 1997
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1161/96 af 26. juni 1996 om ændring
