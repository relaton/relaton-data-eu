  content: Commission Regulation (EC) No 171/2002 of 30 January 2002 determining the
    extent to which the applications for import licences submitted in January 2002
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 2535/2001 can be accepted
  type: main
- language: fr
  script: Latn
