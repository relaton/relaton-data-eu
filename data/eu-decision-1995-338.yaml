title:
- language: en
  script: Latn
  content: '95/338/EC: Commission Decision of 26 July 1995 amending Chapter 1 of Annex
    II to Council Directive 92/118/EEC laying down animal health and public health
    requirements governing trade in and imports into the Community of products not
    subject to the said requirements laid down in specific Community rules referred
    to in Annex A (I) to Directive 89/662/EEC and, as regards pathogens, to Directive
    90/425/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/338/CE: Décision de la Commission, du 26 juillet 1995, modifiant l''annexe
    II chapitre 1er de la directive 92/118/CEE du Conseil définissant les conditions
    de police sanitaire ainsi que les conditions sanitaires régissant les échanges
    et les importations dans la Communauté de produits non soumis, en ce qui concerne
    lesdites conditions, aux réglementations communautaires spécifiques visées
    à l''annexe A chapitre Ier de la directive 89/662/CEE et, en ce qui concerne
    les pathogènes, de la directive 90/425/CEE'
  type: main
- language: de
  script: Latn
  content: '95/338/EG: Entscheidung der Kommission vom 26. Juli 1995 zur Änderung
    von Anhang II Kapitel 1 der Richtlinie 92/118/EWG des Rates vom 17. Dezember 1992
    über die tierseuchenrechtlichen und gesundheitlichen Bedingungen für den Handel
    mit Erzeugnissen tierischen Ursprungs in der Gemeinschaft sowie für ihre Einfuhr
    in die Gemeinschaft, soweit sie diesbezüglich nicht den spezifischen Gemeinschaftsregelungen
    nach Anhang A Kapitel I der Richtlinie 89/662/EWG und - in bezug auf Krankheitserreger
    - der Richtlinie 90/425/EWG unterliegen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 26 юли 1995 година
    за изменение на глава 1 на приложение II към
    Директива 92/118/ЕИО на Съвета за определяне на
    ветеринарно-санитарните и здравните изисквания
    относно търговията и вноса в Общността на продукти,
    които не са подчинени по отношение на посочените
    изисквания на специалните правила на Общността,
    посочени в глава I от приложение А към Директива
    89/662/ЕИО и по отношение на патогените на Директива
    90/425/ЕИО
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 26. července 1995, kterým se mění kapitola
    1 přílohy II směrnice Rady 92/118/EHS o veterinárních a hygienických předpisech
    pro obchod s produkty živočišného původu ve Společenství a jejich dovoz
    do Společenství, pokud se na ně nevztahují zvláštní předpisy Společenství
    uvedené v kapitole I přílohy A směrnice 89/662/EHS, a pokud jde o patogenní
    původce, směrnice 90/425/EHS
  type: main
- language: da
  script: Latn
  content: '95/338/EF: Kommissionens beslutning af 26. juli 1995 om ændring af bilag
    II, kapitel 1, til Rådets direktiv 92/118/EØF om dyresundhedsmæssige og sundhedsmæssige
    betingelser for samhandel med og indførsel til Fællesskabet af produkter, der
    for så vidt angår disse betingelser ikke er underlagt specifikke fællesskabsbestemmelser,
    som omhandlet i bilag A, kapitel I, i direktiv 89/662/EØF, og for så vidt angår
    patogener, i direktiv 90/425/EØF'
  type: main
- language: el
  script: Grek
  content: '95/338/ΕΚ: Απόφαση της Επιτροπής της 26ης Ιουλίου
    1995 για τροποποίηση του παραρτήματος ΙΙ κεφάλαιο
    1 της οδηγίας 95/118/ΕΟΚ του Συμβουλίου για τον
    καθορισμό των όρων υγειονομικού ελέγχου καθώς
    και των υγειονομικών όρων που διέπουν το εμπόριο
    και τις εισαγωγές στην Κοινότητα προϊόντων
    που δεν υπόκεινται, όσον αφορά τους προαναφερόμενους
    όρους, στις ειδικές κοινοτικές ρυθμίσεις που
    αναφέρονται στο κεφάλαιο Ι του παραρτήματος
    Α της οδηγίας 89/662/ΕΟΚ και, όσον αφορά τους παθογόνους
    παράγοντες, της οδηγίας 90/425/ΕΟΚ'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 26. juuli 1995, millega muudetakse nõukogu direktiivi
    92/118/EMÜ II lisa 1. peatükki, milles sätestatakse selliste toodete ühendusesisest
    kaubandust ja ühendusse importimist reguleerivad loomade ja inimeste tervishoiunõuded,
    mille suhtes ei kohaldata direktiivi 89/662/EMÜ A lisa 1. peatükis ja patogeenide
    puhul direktiivis 90/425/EMÜ osutatud ühenduse erieeskirjades sätestatud nõudeid
  type: main
- language: fi
  script: Latn
  content: '95/338/EY: Komission päätös, tehty 26 päivänä heinäkuuta 1995,
    eläinten terveyttä ja kansanterveyttä koskevista vaatimuksista sellaisten tuotteiden
    yhteisön sisäisessä kaupassa ja yhteisöön tuonnissa, joita eivät koske direktiivin
    89/662/ETY ja, taudinaiheuttajien osalta, direktiivin 90/425/ETY liitteessä A
    olevassa I luvussa mainittujen erityisten yhteisön säädösten kyseiset vaatimukset
    17 päivänä joulukuuta 1992 annetun neuvoston direktiivin 92/118/ETY liitteessä
    II olevan 1 luvun muuttamisesta'
  type: main
- language: hr
  script: Latn
  content: '95/338/EZ: Odluka Komisije od 26. srpnja 1995. o izmjeni Priloga II. poglavlja
    1. Direktive Vijeća 92/118/EEZ o utvrđivanju zahtjeva za zdravlje životinja
    i zahtjeva za javno zdravlje kojima se uređuje trgovina i uvoz u Zajednicu proizvoda
    koji ne podliježu navedenim zahtjevima utvrđenim u posebnim pravilima Zajednice
    iz Priloga A dijela I. Direktive 89/662/EEZ te, s obzirom na patogene tvari, iz
    Direktive 90/425/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1995. július 26.) a 89/662/EGK irányelv, illetve
    a kórokozók tekintetében a 90/425/EGK irányelv A. mellékletének I. pontjában
    felsorolt külön közösségi szabályokban megállapított állat-egészségügyi
    és közegészségügyi követelmények hatálya alá nem tartozó termékek Közösségen
    belüli kereskedelmére és a Közösségbe történő behozatalára irányadó
    állat-egészségügyi és közegészségügyi követelmények megállapításáról
    szóló, 1992. december 17-i 92/118/EGK tanácsi irányelv II. melléklete 1.
    fejezetének módosításáról
  type: main
- language: it
  script: Latn
  content: '95/338/CE: Decisione della Commissione, del 26 luglio 1995, recante modifica
    dell''allegato II, capitolo 1 della direttiva 92/118/CEE del Consiglio, che stabilisce
    le condizioni sanitarie e di polizia sanitaria per gli scambi e le importazioni
    nella Comunità di prodotti non soggetti, per quanto riguarda tali condizioni,
    alle normative Comunitàrie specifiche di cui all''allegato A, capitolo I della
    direttiva 89/662/CEE e, per quanto riguarda i patogeni, alla direttiva 90/425/CEE'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1995. gada 26. jūlijs), ar ko groza Padomes Direktīvas
    92/118/EEK II pielikuma 1. nodaļu, ar kuru nosaka dzīvnieku veselības un sabiedrības
    veselības aizsardzības prasības, kas reglamentē to produktu tirdzniecību
    un importu Kopienā, kuri nav pakļauti minētajām prasībām, kas nosacītas
    īpašos Kopienas noteikumos, kuri minēti Direktīvas 89/662/EEK A pielikuma
    I daļā, un attiecībā uz patogēniem – Direktīvā 90/425/EEK
  type: main
- language: lt
  script: Latn
  content: 1995 m. liepos 26 d. Komisijos sprendimas, iš dalies pakeičiantis Tarybos
    direktyvos 92/118/EEB, nustatančios gyvūnų sveikatos ir visuomenės sveikatos
    reikalavimus, reglamentuojančius produktų, kuriems netaikomi minėti reikalavimai,
    išdėstyti specialiose Bendrijos taisyklėse, nurodytose Direktyvos 89/662/EEB
    A priedo I dalyje ir, ligų sukėlėjų atveju, Direktyvoje 90/425/EEB, prekybą
    ir jų importą į Bendriją, II priedo 1 skyrių
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-26 ta' Lulju 1995 li temenda l-Kapitolu
    1 ta' l-Anness II tad-Direttiva tal-Kunsill 92/118/KEE li tistabbilixxi l-ħtiġiet
    tas-saħħa ta' l-annimali u s-saħħa pubblika li jirregolaw il-Kummerċ fi u
    l-importazzjoni fil-Komunità tal-prodotti mhux suġġetti għall-imsemmija ħtiġiet
    stabbiliti fir-regoli speċifiċi tal-Komunità li hemm referenza dwarhom fl-Anness
    A (I) tad-Direttiva 89/662/KEE u, fir-rigward ta' patoġeni, tad-Direttiva 90/425/KEETest
    b'relevanza ŻEE
  type: main
- language: nl
  script: Latn
  content: '95/338/EG: Beschikking van de Commissie van 26 juli 1995 tot wijziging
    van bijlage II, hoofdstuk I, bij Richtlijn 92/118/EEG van de Raad tot vaststelling
    van de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer
    en de invoer in de Gemeenschap van produkten waarvoor ten aanzien van deze voorschriften
    geen specifieke communautaire regelgeving geldt als bedoeld in bijlage A, hoofdstuk
    I, van Richtlijn 89/662/EEG, en, wat ziekteverwekkers betreft, van Richtlijn 90/425/EEG'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 26 lipca 1995 r. zmieniająca rozdział 1 załącznika
    II do dyrektywy Rady 92/118/EWG ustanawiającej warunki zdrowotne zwierząt i
    zdrowia publicznego regulujące handel i przywóz do Wspólnoty produktów nieobjętych
    wyżej wymienionymi warunkami ustanowionymi w szczególnych zasadach wspólnotowych
    określonych w załącznika A pkt I do dyrektywy 89/662/EWG oraz w zakresie czynników
    chorobotwórczych do dyrektywy 90/425/EWG
  type: main
- language: pt
  script: Latn
  content: '95/338/CE: Decisão da Comissão, de 26 de Julho de 1995, que altera o
    capítulo 1 do anexo II da Directiva 92/118/CEE do Conselho, de 17 de Dezembro
    de 1992, que define as condições sanitárias e de polícia sanitária que regem
    o comércio e as importações na Comunidade de produtos não sujeitos, no que
    respeita às referidas condições, às regulamentações comunitárias específicas
    referidas no capítulo 1 do anexo A da Directiva 89/662/CEE e, no que respeita
    aos agentes patogénicos, da Directiva 90/425/CEE'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 26 iulie 1995 de modificare a capitolului 1 din anexa
    II la Directiva 92/118/CEE a Consiliului de stabilire a condițiilor de sănătate
    publică și animală care reglementează schimburile și importurile în Comunitate
    de produse care nu intră sub incidența condițiilor menționate stabilite de
    normele comunitare speciale indicate în anexa A punctul I la Directiva 89/662/CEE
    și, cu privire la agenții patogeni, la Directiva 90/425/CEE
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 26. júla 1995, ktorým sa mení a dopĺňa kapitola
    I prílohy II smernice Rady 92/118/EHS stanovujúcej požiadavky kladené na zdravie
    zvierat a na zdravie ľudí, ktorými sa riadi obchod v a dovozy do spoločenstva
    produktov, ktoré nie sú predmetom daných požiadaviek stanovených v osobitných
    pravidlách spoločenstva, uvedených v prílohe A (I) smernice 89/662/EHS a,
    pokiaľ ide o patogény, smernice 90/425/EHS
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 26. julija 1995 o spremembi Poglavja 1 Priloge
    II k Direktivi Sveta 92/118/EGS o zahtevah zdravstvenega varstva živali in javnozdravstvenega
    varstva, ki urejajo trgovino in uvoz v Skupnost za proizvode, ki niso predmet
    navedenih zahtev, določenih v posebnih pravilih Skupnosti iz Priloge A(I) Direktive
    89/662/EGS, glede povzročiteljev bolezni pa v Direktivi 90/425/EGS
  type: main
- language: es
  script: Latn
  content: '95/338/CE: Decisión de la Comisión, de 26 de julio de 1995, que modifica
    el capítulo 1 del Anexo II de la Directiva 92/118/CEE del Consejo, de 17 de diciembre
    de 1992, por la que se establecen las condiciones de policía sanitaria y sanitarias
    aplicables a los intercambios y a las importaciones en la Comunidad de productos
    no sometidos, con respecto a estas condiciones, a las normativas comunitarias
    específicas a que se refiere el capítulo I del Anexo A de la Directiva 89/662/CEE
    y, por lo que se refiere a los patógenos, de la Directiva 90/425/CEE'
  type: main
- language: sv
  script: Latn
  content: '95/338/EG: Kommissionens beslut av den 26 juli 1995 om ändring av kapitel
    1 i bilaga II till rådets direktiv 92/118/EEG av den 17 december 1992 om djurhälso-
    och hygienkrav för handel inom gemenskapen med produkter, som inte omfattas av
    sådana krav i de särskilda gemenskapsbestämmelser som avses i bilaga A.I till
    direktiv 89/662/EEG och, i fråga om patogener, i direktiv 90/425/EEG, samt för
    import till gemenskapen av sådana produkter'
