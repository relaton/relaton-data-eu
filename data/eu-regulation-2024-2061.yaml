    ze stonků ašitaby) na trh jako nové potraviny a kterým se mění prováděcí
    nařízení (EU) 2017/2470
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/2061 af 30. juli 2024
