title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2061 of 30 July 2024 authorising
    the placing on the market of the juice of the stems of the Angelica keiskei plant
    (Ashitaba stem juice) as a novel food and amending Implementing Regulation (EU)
    2017/2470
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2061 de la Commission du 30 juillet
    2024 autorisant la mise sur le marché du jus des tiges de la plante Angelica
    keiskei (jus de tiges d’Ashitaba) en tant que nouvel aliment et modifiant le
    règlement d’exécution (UE) 2017/2470
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2061 der Kommission vom 30. Juli 2024
    zur Genehmigung des Inverkehrbringens des Safts aus den Stängeln der Pflanze
    Angelica keiskei (Ashitaba-Stängelsaft) als neuartiges Lebensmittel und zur Änderung
    der Durchführungsverordnung (EU) 2017/2470
  type: main
- language: bg
  script: Cyrl
