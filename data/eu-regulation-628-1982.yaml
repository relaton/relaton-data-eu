  content: Commission Regulation (EEC) No 628/82 of 17 March 1982 re-establishing
    the levying of customs duties on methenamine (INN) (hexamethylenetetramine), falling
    within subheading 29.26 B II a) and originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 628/82 de la Commission, du 17 mars 1982, portant
    rétablissement de la perception des droits de douane applicables à la méthénamine
    (DCI) (hexaméthylènetétramine), de la sous-position 29.26 B II a) du tarif
    douanier commun, originaire de Roumanie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 628/82 der Kommission vom 17. März 1982 zur Wiedereinführung
    der Erhebung der Zölle für Methenamin (INN) (Hexamethylentetramin) der Tarifstelle
    29.26 B II a), mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr.
    3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 628/82 af 17. marts 1982 om genindførelse
    af opkrævning af told for methenamin (INN) (hexamethylentetramin), henhørende
    under pos. 29.26 B II a) og med oprindelse i Rumænien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
