  script: Latn
  content: Commission Regulation (EC) No 1604/94 of 30 June 1994 reintroducing the
    levying of the customs duties applicable to certain textile products originating
    in India, Pakistan, Indonesia, Thailand and China, to which the preferential tariff
    arrangements of Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
