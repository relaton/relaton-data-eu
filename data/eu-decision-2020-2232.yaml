  script: Latn
  content: Council Decision (EU) 2020/2232 of 22 December 2020 on the position to
    be taken on behalf of the European Union within the Joint Committee established
    by the Agreement on the withdrawal of the United Kingdom of Great Britain and
    Northern Ireland from the European Union and the European Atomic Energy Community
    as regards the adoption of a decision establishing a list of 25 persons who are
    willing and able to serve as members of an arbitration panel under the Agreement
    and on a reserve list of persons who are willing and able to serve as Union members
    of an arbitration panel under the Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/2232 du Conseil du 22 décembre 2020 relative à la
