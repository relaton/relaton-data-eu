    institué par l’accord sur le retrait du Royaume-Uni de Grande-Bretagne et d’Irlande
    du Nord de l’Union européenne et de la Communauté européenne de l’énergie
    atomique en ce qui concerne l’adoption d’une décision dressant une liste
    de vingt-cinq personnes disposées et aptes à siéger comme membres d’un groupe
    spécial d’arbitrage au titre de l’accord et concernant une liste de réserve
