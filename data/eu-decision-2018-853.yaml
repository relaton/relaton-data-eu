  script: Latn
  content: Decision (EU) 2018/853 of the European Parliament and of the Council of
    30 May 2018 amending Regulation (EU) No 1257/2013 and Directives 94/63/EC and
    2009/31/EC of the European Parliament and of the Council and Council Directives
    86/278/EEC and 87/217/EEC as regards procedural rules in the field of environmental
    reporting and repealing Council Directive 91/692/EEC
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2018/853 du Parlement européen et du Conseil du 30 mai
    2018 modifiant le règlement (UE) no 1257/2013 et les directives 94/63/CE et 2009/31/CE
    du Parlement européen et du Conseil ainsi que les directives 86/278/CEE et 87/217/CEE
    du Conseil, en ce qui concerne les règles de procédure en matière de rapports
    sur l’environnement et abrogeant la directive 91/692/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: Beschlusses (EU) 2018/853 des Europäischen Parlaments und des Rates vom
    30. Mai 2018 zur Änderung der Verordnung (EU) Nr. 1257/2013 und der Richtlinien
    94/63/EG und 2009/31/EG des Europäischen Parlaments und des Rates und der Richtlinien
    86/278/EWG und 87/217/EWG des Rates in Bezug auf Verfahrensvorschriften auf dem
    Gebiet der Umweltberichterstattung und zur Aufhebung der Richtlinie 91/692/EWG
    des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2018/853 на Европейския парламент
