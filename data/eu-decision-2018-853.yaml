    fil-qasam tal-ambjent u li tħassar id-Direttiva tal-Kunsill 91/692/KEE
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2018/853 van het Europees Parlement en de Raad van 30 mei
    2018 tot wijziging van Verordening (EU) nr. 1257/2013 en Richtlijnen 94/63/EG
    en 2009/31/EG van het Europees Parlement en de Raad en Richtlijnen 86/278/EEG
    en 87/217/EEG van de Raad wat betreft procedureregels inzake rapportage op milieugebied
    en tot intrekking van Richtlijn 91/692/EEG van de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja Parlamentu Europejskiego i Rady (UE) 2018/853 z dnia 30 maja 2018
    r. zmieniająca rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 1257/2013
    oraz dyrektywy Parlamentu Europejskiego i Rady 94/63/WE i 2009/31/WE, jak również
    dyrektywy Rady 86/278/EWG i 87/217/EWG, w odniesieniu do przepisów proceduralnych
    w zakresie sprawozdawczości w dziedzinie środowiska oraz uchylająca dyrektywę
    Rady 91/692/EWG
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2018/853 do Parlamento Europeu e do Conselho, de 30 de maio
    de 2018, que altera o Regulamento (UE) n.o 1257/2013 e as Diretivas 94/63/CE e
    2009/31/CE do Parlamento Europeu e do Conselho e as Diretivas 86/278/CEE e 87/217/CEE
    do Conselho, no que se refere a normas processuais no domínio da apresentação
    de relatórios ambientais e que revoga a Diretiva 91/692/CEE do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2018/853 a Parlamentului European și a Consiliului din 30
    mai 2018 de modificare a Regulamentului (UE) nr. 1257/2013, a Directivelor 94/63/CE
    și 2009/31/CE ale Parlamentului European și ale Consiliului și a Directivelor
    86/278/CEE și 87/217/CEE ale Consiliului în ceea ce privește normele procedurale
    în domeniul raportării cu privire la mediu și de abrogare a Directivei 91/692/CEE
    a Consiliului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Európskeho parlamentu a Rady (EÚ) 2018/853 z 30. mája 2018,
    ktorým sa mení nariadenie Európskeho parlamentu a Rady (EÚ) č. 1257/2013,
    smernice Európskeho parlamentu a Rady 94/63/ES a 2009/31/ES a smernice Rady 86/278/EHS
    a 87/217/EHS, pokiaľ ide o procesné pravidlá týkajúce sa podávania správ
    v oblasti životného prostredia, a ktorým sa zrušuje smernica Rady 91/692/EHS
  type: main
- language: sl
  script: Latn
  content: Sklep (EU) 2018/853 Evropskega parlamenta in Sveta z dne 30. maja 2018
