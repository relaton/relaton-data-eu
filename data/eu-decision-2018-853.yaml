    Mejju 2018 li temenda r-Regolament (UE) Nru 1257/2013 u d-Direttivi 94/63/KE u
    2009/31/KE tal-Parlament Ewropew u tal-Kunsill u d-Direttivi tal-Kunsill 86/278/KEE
