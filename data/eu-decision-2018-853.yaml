  script: Latn
  content: Decisión (UE) 2018/853 del Parlamento Europeo y del Consejo, de 30 de
    mayo de 2018, por la que se modifican el Reglamento (UE) n.o 1257/2013 y las Directivas
    94/63/CE y 2009/31/CE del Parlamento Europeo y del Consejo y las Directivas 86/278/CEE
    y 87/217/CEE del Consejo, en lo que atañe a las normas de procedimiento en el
