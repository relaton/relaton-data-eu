    parlamenta i Vijeća te direktiva Vijeća 86/278/EEZ i 87/217/EEZ u pogledu postupovnih
    pravila u području izvješćivanja o okolišu i o stavljanju izvan snage Direktive
    Vijeća 91/692/EEZ
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2018/853 határozata (2018. május
    30.) az 1257/2013/EU európai parlamenti és tanácsi rendeletnek, a 94/63/EK
    és a 2009/31/EK európai parlamenti és tanácsi irányelvnek, valamint a 86/278/EGK
    és a 87/217/EGK tanácsi irányelvnek a környezetvédelmi jelentéstételre
    vonatkozó eljárási szabályok tekintetében történő módosításáról,
    valamint a 91/692/EGK tanácsi irányelv hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2018/853 del Parlamento europeo e del Consiglio, del 30
    maggio 2018, recante modifica del regolamento (UE) n. 1257/2013 e delle direttive
    94/63/CE e 2009/31/CE del Parlamento europeo e del Consiglio e delle direttive
    86/278/CEE e 87/217/CEE del Consiglio per quanto riguarda le norme procedurali
    in materia di elaborazione delle relazioni in materia ambientale e che abroga
    la direttiva 91/692/CEE del Consiglio
  type: main
- language: lv
  script: Latn
