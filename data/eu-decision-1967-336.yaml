title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 mai 1967, portant extension du champ
    d'application de sa décision du 17 juillet 1962 instituant des méthodes de coopération
    administrative spéciales pour l'application des prélèvements intracommunautaires,
    institués dans le cadre de la politique agricole commune, aux marchandises visées
    par le règlement n° 160/66/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: '67/336/EWG: Entscheidung der Kommission vom 19. Mai 1967, mit der der
    Anwendungsbereich ihrer Entscheidung vom 17. Juli 1962 - die besondere Methoden
    der Zusammenarbeit der Verwaltungen zur Anwendung der im Rahmen der gemeinsamen
    Agrarpolitik vorgesehenen innergemeinschaftlichen Abschöpfungen einführte -
    auf die unter die Verordnung Nr. 160/66/EWG des Rates fallenden Waren ausgedehnt
    wird'
  type: main
- language: it
  script: Latn
  content: '67/336/CEE: Decisione della Commissione, del 19 maggio 1967, che porta
    estensione del campo di applicazione della sua decisione del 17 luglio 1962, relativa
    ai metodi speciali di cooperazione amministrativa per l''applicazione dei prelievi
    intracomunitari istituiti nell''ambito della politica agricola comune, alle merci
    di cui al regolamento n. 160/66/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '67/336/EEG: Beschikking van de Commissie van 19 mei 1967 waarbij het toepassingsgebied
    van de beschikking van 17 juli 1962 tot invoering van bijzondere methoden van
    administratieve samenwerking inzake de toepassing van de in het kader van het
    gemeenschappelijk landbouwbeleid ingestelde intracommunautaire heffingen wordt
    uitgebreid tot de bij Verordening Nr. 160/66/EEG van de Raad bedoelde goederen'
  type: main
