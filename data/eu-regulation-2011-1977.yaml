title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2011/77 of 9 September 1977 re-establishing
    the levying of customs duties on monoethylene glycol and monopropylene falling
    within subheading 29.04 C ex I, originating in Romania to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2011/77 de la Commission, du 9 septembre 1977, portant
    rétablissement de la perception des droits de douane applicables au monoéthylènéglycol
    et au monopropylènéglycol, de la sous-position tarifaire 29.04 C EX I, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2011/77 der Kommission vom 9. September 1977 zur Wiedereinführung
    des Zollsatzes für Monoäthylenglykol und Monopropylenglykol der Tarifstelle
    29.04 C ex I mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3021/76
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2011/77 af 9. september 1977 om genindførelse
    af opkrævning af toldafgifter for monoethylenglycol, monopropylenglycol, under
    underposition 29.04 C ex I, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2011/77 della Commissione, del 9 settembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili al glicole monoetilenico
    ed al glicole monopropilenico, della sottovoce doganale n. 29.04 C ex I, originari
    della Romania beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2011/77 van de Commissie van 9 september 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op monoethyleenglycol
    en monopropyleenglycol, van post 29.04 C ex I, van oorsprong uit Roemenië, ten
    behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
