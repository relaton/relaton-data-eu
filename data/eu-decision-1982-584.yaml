    μέ τήν ονομασία «Summagraphics — Digitaliser, model ID-17» δέν
    δύναται νά πραγματοποιηθεί ατελώς ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/584/CEE: Decisione della Commissione, del 6 agosto 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Summagraphics - Digitaliser,
    model ID-17" non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/584/EEG: Beschikking van de Commissie van 6 augustus 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Summagraphics-Digitaliser, model ID-17"
    niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag
    worden ingevoerd'
