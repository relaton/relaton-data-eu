  content: '82/584/EEC: Commission Decision of 6 August 1982 establishing that the
    apparatus described as ''Summagraphics - Digitalizer, model ID-17'' may not be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/584/CEE: Décision de la Commission, du 6 août 1982, constatant que
    l''importation de l''appareil dénommé "Summagraphics - Digitaliser, model ID-17"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/584/EWG: Entscheidung der Kommission vom 6. August 1982, mit der festgestellt
    wird, daß das Gerät ,,Summagraphics-Digitaliser, model ID-17" nicht unter Befreiung
    von Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/584/EØF: Kommissionens beslutning af 6. august 1982 om fastslåelse
    af, at indførsel af apparatet "Summagraphics-Digitaliser, model ID-17" ikke kan
    ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/584/EOK: Απόφαση τής Επιτροπής τής 6ης Αυγούστου
