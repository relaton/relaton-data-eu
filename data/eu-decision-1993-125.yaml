    de medidas de salvaguardia de acuerdo con lo dispuesto en el artículo 5 del Reglamento
    (CEE) nº 3577/92 por el que se aplica el principio de libre prestación de servicios
    a los transportes marítimos dentro de los Estados miembros (cabotaje marítimo)
