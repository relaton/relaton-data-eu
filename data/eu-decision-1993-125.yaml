    έγκριση από την Επιτροπή των μέτρων διασφάλισης
    βάσει του άρθρου 5 του κανονισμού (ΕΟΚ) αριθ.
    3577/92 του Συμβουλίου για την εφαρμογή της αρχής
    της ελεύθερης κυκλοφορίας των υπηρεσιών στις
    θαλάσσιες μεταφορές στο εσωτερικό των κρατών
    μελών (θαλάσσιες ενδομεταφορές) (Το κείμενο
    στην ισπανική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/125/CEE: Decisione della Commissione, del 17 febbraio 1993, in merito
    alla richiesta, presentata dalla Spagna, che la Commissione adotti misure di salvaguardia
    ai sensi dell''articolo 5 del regolamento (CEE) n. 3577/92 del Consiglio concernente
    l''applicazione del principio della libera prestazione dei servizi ai trasporti
    marittimi fra Stati membri (cabotaggio marittimo) (Il testo in lingua spagnola
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/125/EEG: Beschikking van de Commissie van 17 februari 1993 betreffende
    het verzoek van Spanje tot vaststelling door de Commissie van vrijwaringsmaatregelen
    op grond van artikel 5 van Verordening (EEG) nr. 3577/92 houdende toepassing van
    het beginsel van het vrij verrichten van diensten op het zeevervoer binnen de
    Lid-Staten (cabotage in het zeevervoer) (Slechts de tekst in de Spaanse taal is
    authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/125/CEE: Decisão da Comissão, de 17 de Fevereiro de 1993, relativa
