title:
- language: en
  script: Latn
  content: '93/125/EEC: Commission Decision of 17 February 1993 on Spain''s request
    for adoption by the Commission of safeguard measures under Article 5 of Regulation
    (EEC) No 3577/92 against applying the principle of freedom to provide services
    to maritime transport within Member States (maritime cabotage) (Only the Spanish
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/125/CEE: Décision de la Commission, du 17 février 1993, faisant suite
    à la demande espagnole d''adoption par la Commission de mesures de sauvegarde
    en vertu des dispositions de l''article 5 du règlement (CEE) nº 3577/92 du Conseil
    concernant l''application du principe de la libre circulation des services aux
    transports maritimes à l''intérieur des États membres (cabotage maritime) (Le
    texte en langue espagnole est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/125/EWG: Entscheidung der Kommission vom 17. Februar 1993 zum Antrag
    Spaniens auf Annahme von Schutzmaßnahmen durch die Kommission aufgrund von Artikel
    5 der Verordnung (EWG) Nr. 3577/92 zur Anwendung des Grundsatzes des freien Dienstleistungsverkehrs
    auf den Seeverkehr in den Mitgliedstaaten (Seekabotage) (Nur der spanische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/125/EØF: Kommissionens beslutning af 17. februar 1993 i anledning
    af Spaniens anmodning om, at Kommissionen vedtager beskyttelsesforanstaltninger
    i henhold til artikel 5 i forordning 3577/92 om anvendelse af princippet om fri
    udveksling af tjenesteydelser inden for søtransport i medlemsstaterne (cabotagesejlads)
    (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/125/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
