title:
- language: en
  script: Latn
  content: '91/37/EEC: Commission Decision of 20 December 1990 authorizing the Federal
    Republic of Germany and the Hellenic Republic to restrict the marketing of seed
    of certain varieties of agricultural plant species and amending certain Decisions
    authorizing the Federal Republic of Germany to restrict the marketing of seed
    of certain varieties of agricultural plant species (Only the German and Greek
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/37/CEE: Décision de la Commission du 20 décembre 1990 autorisant
    la République fédérale d''Allemagne et la République hellénique à restreindre
    la commercialisation des semences de certaines variétés des espèces de plantes
    agricoles, et modifiant certaines décisions autorisant la République fédérale
    d''Allemagne à restreindre la commercialisation des semences de certaines variétés
    des espèces de plantes agricoles (Les textes en langues allemande et grecque
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '91/37/EWG: Entscheidung der Kommission vom 20. Dezember 1990 zur Ermächtigung
    der Bundesrepublik Deutschland und der Griechischen Republik, den Verkehr mit
    Saatgut bestimmter Sorten landwirtschaftlicher Pflanzenarten zu beschränken und
    zur Änderung bestimmter Entscheidungen zur Ermächtigung der Bundesrepublik Deutschland,
    den Verkehr mit Saatgut bestimmter Sorten landwirtschaftlicher Pflanzenarten zu
    beschränken (Nur der deutsche und der griechische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/37/EØF: Kommissionens Beslutning af 20. december 1990 om bemyndigelse
    af Forbundsrepublikken Tyskland og Den Hellenske Republik til at begrænse handelen
    med frø af visse sorter af landbrugsplantearter og om ændring af nogle beslutninger
    om bemyndigelse af Forbundsrepublikken Tyskland til at begrænse handelen med
    frø af visse sorter af landbrugsplantearter (Kun den tyske og den græske udgaver
    er autentiske)'
  type: main
- language: el
  script: Grek
  content: '91/37/ΕΟΚ: Απόφαση της Επιτροπής της 20ής Δεκεμβρίου
    1990 που επιτρέπει στην Ομοσπονδιακή Δημοκρατία
    της Γερμανίας και στην Ελληνική Δημοκρατία
    να θέσουν περιορισμούς στην εμπορία ορισμένων
    σπόρων προς σπορά ποικιλιών γεωργικών φυτών
    και τροποποιεί ορισμένες αποφάσεις που επιτρέπουν
    στην Ομοσπονδιακή Δημοκρατία της Γερμανίας
    να θέσει περιορισμούς στην εμπορία σπόρων
    προς σπορά ορισμένων ποικιλιών γεωργικών φυτών
    (Τα κείμενα στη γερμανική και ελληνική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '91/37/CEE: Decisione della Commissione del 20 dicembre 1990 che autorizza
    la Repubblica federale di Germania e la Repubblica ellenica a sottoporre a restrizioni
    la commercializzazione delle sementi di talune varietà di specie di piante agricole
    e che modifica alcune decisioni che autorizzano la Repubblica federale di Germania
    a sottoporre a restrizioni la commercializzazione delle sementi di alcune varietà
    di specie di piante agricole (Il testo in lingua tedesca e quello in lingua greca
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '91/37/EEG: Beschikking van de Commissie van 20 december 1990 tot machtiging
    van de Bondsrepubliek Duitsland en van de Helleense Republiek om de handel in
    zaaizaad van bepaalde rassen van landbouwgewassen te beperken en tot wijziging
    van een aantal beschikkingen tot machtiging van de Bondsrepubliek Duitsland om
    de handel in zaaizaad van bepaalde rassen van landbouwgewassen te beperken (Slechts
    de teksten in de Duitse en de Griekse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '91/37/CEE: Decisão da Comissão de 20 de Dezembro de 1990 que autoriza
    a República Federal da Alemanha e a República Helénica a aplicar restrições
    à comercialização de sementes de determinadas variedades de espécies de plantas
    agrícolas e que altera certas decisões que autorizam a República Federal da
    Alemanha a aplicar restrições à comercialização de sementes de determinadas
    variedades de espécies de plantas agrícolas (Apenas fazem fé os textos nas
    línguas alemã e grega)'
  type: main
- language: es
  script: Latn
  content: '91/37/CEE: Decisión de la Comisión de 20 de diciembre de 1990 por la
    que se autoriza a la República Federal de Alemania y a la República Helénica
    para limitar la comercialización de semillas de determinadas variedades de especies
    de plantas agrícolas y se modifican determinadas Decisiones por las que se autoriza
    a la República Federal de Alemania para limitar la comercialización de semillas
    de determinadas variedades de especies de plantas agrícolas (Los textos en las
    lenguas alemana y griega son los únicos auténticos)'
