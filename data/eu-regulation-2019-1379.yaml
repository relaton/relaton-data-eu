    fra Indonesien, Malaysia, Sri Lanka, Tunesien, Cambodja, Pakistan og Filippinerne,
    uanset om varen er angivet med oprindelse i disse lande eller ej, efter en udløbsundersøgelse
    i henhold til artikel 11, stk. 2, i forordning (EU) 2016/1036
  type: main
