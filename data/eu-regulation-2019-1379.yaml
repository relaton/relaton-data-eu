    przeglądu wygaśnięcia na podstawie art. 11 ust. 2 rozporządzenia (UE) 2016/1036
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/1379 da Comissão, de 28 de agosto
