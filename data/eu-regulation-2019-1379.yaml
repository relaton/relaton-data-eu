    de biciclete expediate din Indonezia, Malaysia, Sri Lanka, Tunisia, Cambodgia,
    Pakistan și Filipine, indiferent dacă au fost sau nu declarate ca fiind originare
    din aceste țări, în urma unei reexaminări efectuate în perspectiva expirării
    măsurilor în temeiul articolului 11 alineatul (2) din Regulamentul (UE) 2016/1036
  type: main
- language: sk
  script: Latn
