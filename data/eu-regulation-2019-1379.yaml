    ja Filippiineiltä lähetettyjen polkupyörien tuontia, riippumatta siitä, onko
    niiden alkuperämaaksi ilmoitettu Indonesia, Malesia, Sri Lanka, Tunisia, Kambodža,
    Pakistan ja Filippiinit, asetuksen (EU) 2016/1036 11 artiklan 2 kohdan mukaisen
    toimenpiteiden voimassaolon päättymistä koskevan tarkastelun jälkeen
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/1379 оd 28. kolovoza 2019. o uvođenju
    konačne antidampinške pristojbe na uvoz bicikala podrijetlom iz Narodne Republike
    Kine, kako je proširena na uvoz bicikala poslanih iz Indonezije, Malezije, Šri
    Lanke, Tunisa, Kambodže, Pakistana i Filipina, bez obzira na to imaju li deklarirano
    podrijetlo iz tih zemalja, nakon revizije zbog isteka mjere u skladu s člankom
    11. stavkom 2. Uredbe (EU) 2016/1036
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1379 végrehajtási rendelete (2019. augusztus 28.)
    a Kínai Népköztársaságból származó kerékpárok behozatalára vonatkozó,
    az Indonéziában, Malajziában, Srí Lankán, Tunéziában, Kambodzsában, Pakisztánban
    és a Fülöp-szigeteken feladott, akár ezekből az országokból származóként,
    akár nem ilyenként bejelentett kerékpárok behozatalára is kiterjesztett végleges
    dömpingellenes vámnak az (EU) 2016/1036 rendelet 11. cikkének (2) bekezdése
    szerinti hatályvesztési felülvizsgálatot követő kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/1379 della Commissione, del 28 agosto
    2019, che istituisce un dazio antidumping definitivo sulle importazioni di biciclette
    originarie della Repubblica popolare cinese esteso alle importazioni di biciclette
    spedite dall'Indonesia, dalla Malaysia, dallo Sri Lanka, dalla Tunisia, dalla
    Cambogia, dal Pakistan e dalle Filippine, indipendentemente dal fatto che siano
    o no dichiarate originarie di tali paesi, a seguito di un riesame in previsione
    della scadenza a norma dell'articolo 11, paragrafo 2, del regolamento (UE) 2016/1036
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/1379 (2019. gada 28. augusts),
    ar ko pēc termiņbeigu pārskatīšanas, kas veikta, ievērojot Regulas (ES)
    2016/1036 11. panta 2. punktu, nosaka galīgo antidempinga maksājumu Ķīnas
    Tautas Republikas izcelsmes velosipēdu importam, attiecinot to uz tādu velosipēdu
    importu, kas nosūtīti no Indonēzijas, Malaizijas, Šrilankas, Tunisijas, Kambodžas,
    Pakistānas un Filipīnām, neatkarīgi no tā, vai šiem velosipēdiem ir deklarēta
    šo valstu izcelsme
  type: main
- language: lt
  script: Latn
  content: 2019 m. rugpjūčio 28 d. Komisijos įgyvendinimo reglamentas (ES) 2019/1379,
    kuriuo pagal Reglamento (ES) 2016/1036 11 straipsnio 2 dalį atlikus priemonių
    galiojimo termino peržiūrą importuojamiems Kinijos Liaudies Respublikos kilmės
    dviračiams nustatomas galutinis antidempingo muitas, taip pat taikomas importuojamiems
    iš Indonezijos, Malaizijos, Šri Lankos, Tuniso, Kambodžos, Pakistano ir Filipinų
    siunčiamiems dviračiams, deklaruojamiems arba nedeklaruojamiems kaip šių šalių
    kilmės
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/1379 tat-28 ta'
