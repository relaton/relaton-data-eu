title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2040/88 of 8 July 1988 adding an entry for
    nectarines to Annex XV to Regulation (EEC) No 3587/86 fixing the conversion factors
    to be applied to the buying-in prices for fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2040/88 de la Commission du 8 juillet 1988 complétant
    l' annexe XV du règlement (CEE) n° 3587/86, fixant les coefficients d' adaptation
    à appliquer aux prix d' achat dans le secteur des fruits et légumes en ce qui
    concerne les nectarines et les brugnons
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2040/88 der Kommission vom 8. Juli 1988 zur Ergänzung
    von Anhang XV der Verordnung (EWG) Nr. 3587/86 zur Festsetzung der Anpassungskoeffizienten
    für die Ankaufspreise auf dem Sektor Obst und Gemüse bezüglich Nektarinen und
    Brugnolen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2040/88 af 8. juli 1988 om tillæg
    til bilag XV til forordning (EØF) nr. 3587/86 om fastsættelse af de tilpasningskoefficienter,
    der skal anvendes på opkøbspriserne for frugt og grønsager, for så vidt angår
    nektariner og blodferskner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2040/88 της Επιτροπής
    της 8ης Ιουλίου 1988 για συμπλήρωση του παραρτήματος
    XV του κανονισμού (ΕΟΚ) αριθ. 3587/86 για τον καθορισμό
    των συντελεστών προσαρμογής που θα εφαρμοστούν
    στις τιμές αγοράς στον τομέα των οπωροκηπευτικών
    όσον αφορά τα νεκταρίνια και τα brugnons
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 2040/88, annettu 8 päivänä heinäkuuta 1988,
    ostohintoihin sovellettavista mukautuskertoimista hedelmä- ja vihannesalalla
    annetun asetuksen (ETY) N:o 3587/86 liitteen XV täydentämisestä nektariinien
    ja Brugnole-lajikkeen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2040/88 della Commissione dell' 8 luglio 1988 che
    completa l' allegato XV del regolamento (CEE) n. 3587/86 che fissa i coefficienti
    di adattamento da applicare ai prezzi di acquisto nel settore degli ortofrutticoli,
    in ordine alle nettarine e alle pesche noci
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2040/88 van de Commissie van 8 juli 1988 tot aanvulling
    van bijlage XV bij Verordening (EEG) nr. 3587/86 tot vaststelling van de aanpassingscoëfficiënten
    die op de aankoopprijzen in de sector groenten en fruit moeten worden toegepast,
    met betrekking tot nectarines en bloedperziken
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2040/88 da Comissão de 8 de Julho de 1988 que completa
    o Anexo XV do Regulamento (CEE) n.° 3587/86 que fixa os coeficientes de adaptação
    a aplicar aos preços de compra no sector das frutas e produtos hortícolas, no
    que diz respeito às nectarinas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2040/88 de la Comisión de 8 de julio de 1988 por
    el que se completa el Anexo XV del Reglamento (CEE) n° 3587/86 por el que se
    fijan los coeficientes de adaptación que se han de aplicar a los precios de compra
    del sector de las frutas y hortalizas en lo relativo a nectarinas y bruñones
  type: main
- language: sv
