---
id: EUDecision2020503
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2020/503 of 3 April 2020 amending Decision 2014/312/EU
    in order to extend the derogation for zinc oxide to allow its use as a preservative
    stabilizer to cover ‘in-can preservation’ and preservation of ‘tinting pastes’
    (notified under document C(2020) 1979)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/503 de la Commission du 3 avril 2020 modifiant la décision
    2014/312/UE afin d’étendre la dérogation relative à l’oxyde de zinc en
    vue d’autoriser l’utilisation de cette substance comme stabilisant pour conservateur
    pour le «stockage en pot» et les «pâtes à teinter» [notifiée sous le numéro
    C(2020) 1979]
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/503 der Kommission vom 3. April 2020 zur Änderung
    des Beschlusses 2014/312/EU zwecks Verlängerung der Ausnahme für Zinkoxid zwecks
    dessen Einsatz als Konservierungsmittelstabilisator für die „Topf-Konservierung“
    und die Konservierung von „Abtönpasten“ (Bekannt gegeben unter Aktenzeichen
    C(2020) 1979)
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2020/503 на Комисията от 3 април
    2020 година за изменение на Решение 2014/312/ЕС с
    оглед на разширение на дерогацията за цинковия
    оксид с цел да се разреши употребата му като
    стабилизатор за консерванти, за да се обхване
    „консервирането на продукти в затворени съдове“
    и консервирането на „пасти за тониране“ (нотифицирано
    под номер С(2020) 1979)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise (EU) 2020/503 ze dne 3. dubna 2020, kterým se mění
    rozhodnutí 2014/312/EU s cílem rozšířit odchylku pro oxid zinečnatý a tím
    umožnit jeho používání jako stabilizátoru konzervantů i pro „konzervaci
    výrobků v plechových obalech“ a pro konzervaci „tónovacích past“ (oznámeno
    pod číslem C(2020) 1979)
  type: main
- language: da
  script: Latn
  content: Kommissionens afgørelse (EU) 2020/503 af 3. april 2020 om ændring af
    afgørelse 2014/312/EU med henblik på at udvide undtagelsen for brugen af zinkoxid
    som konserverende stabiliseringsmiddel til at omfatte »konservering i beholdere«
    og konservering af »tonepasta« (meddelt under nummer C(2020) 1979)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2020/503 της Επιτροπής της 3ης Απριλίου
    2020 για την τροποποίηση της απόφασης 2014/312/ΕΕ
    με σκοπό να επεκταθεί η παρέκκλιση για το οξείδιο
    του ψευδαργύρου ώστε να επιτρέπεται η χρήση
    του ως σταθεροποιητή συντηρητικών για «συσκευασμένα
    είδη» και «πάστες χρωματισμού» [κοινοποιηθείσα
    υπό τον αριθμό C(2020) 1979]
  type: main
- language: et
  script: Latn
  content: Komisjoni Otsus (EL) 2020/503, 3. aprill 2020, millega muudetakse otsust
    2014/312/EL eesmärgiga laiendada tsinkoksiidi suhtes kehtestatud erandit, et
    võimaldada selle aine kasutamist säilitusaine stabilisaatorina ka suletud nõus
    säilitamisel ja toonimispastade säilitamisel (teatavaks tehtud numbri C(2020)
    1979 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös (EU) 2020/503, annettu 3 päivänä huhtikuuta 2020,
    päätöksen 2014/312/EU muuttamisesta sinkkioksidia koskevan poikkeuksen laajentamiseksi
    koskemaan sen käyttöä säilöntäaineiden stabilointiaineena suljetuissa astioissa
    tapahtuvassa säilönnässä ja sävytyspastojen säilönnässä (tiedoksiannettu
    numerolla C(2020) 1979)
  type: main
- language: hr
  script: Latn
  content: Odluka Komisije (EU) 2020/503 оd 3. travnja 2020. o izmjeni Odluke 2014/312/EU
    radi proširenja odstupanja za cinkov oksid kako bi se dopustila njegova primjena
    kao stabilizatora konzervansa i za „konzerviranje gotovih proizvoda” i konzerviranje
    „pasta za nijansiranje” (priopćeno pod brojem dokumenta C(2020) 1979)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/503 határozata (2020. április 3.) a 2014/312/EU
    határozat cink-oxidra vonatkozó eltéréseinek a cink-oxid „tartályban forgalomba
    hozott készítmények” és a „színezőpaszták” esetén tartósítószer-stabilizátorként
    való alkalmazására irányuló kiterjesztése érdekében történő módosításáról
    (az értesítés a C(2020) 1979. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2020/503 della Commissione del 3 aprile 2020 che modifica
    la decisione 2014/312/UE al fine di estendere la deroga relativa all’ossido
    di zinco al fine di consentirne l’utilizzo quale stabilizzante di preservanti
    nella «preservazione di prodotti in scatola» e nella preservazione di «paste
    coloranti» [notificata con il numero C(2020) 1979]
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (ES) 2020/503 (2020. gada 3. aprīlis), ar ko groza Lēmumu
    2014/312/ES nolūkā paplašināt izņēmuma piemērošanas tvērumu attiecībā
    uz cinka oksīdu, lai to varētu izmantot par konservantu stabilizatoru arī “konservēšanai
    tarā” un “tonēšanas pastu” konservēšanai (izziņots ar dokumenta numuru
    C(2020) 1979)
  type: main
- language: lt
  script: Latn
  content: Komisijos sprendimas (ES) 2020/503 2020 m. balandžio 3 d. kuriuo iš dalies
    keičiamas Sprendimas 2014/312/ES siekiant išplėsti išimties taikymo cinko
    oksidui sritį, kad jį būtų galima naudoti kaip konservantinį stabilizatorių
    supakuotų produktų ir atspalvio suteikimo pastų konservantuose (pranešta dokumentu
    Nr. C(2020) 1979)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni (UE) 2020/503 tat-3 ta’ April 2020 li temenda
    d-Deċiżjoni 2014/312/UE sabiex tiġi estiża d-deroga għall-ossidu taż-żingu
    biex tippermetti li l-użu tiegħu bħala stabbilizzatur tal-preżervattivi jkopri
    l-“preżervazzjoni ta’ ġol-bottijiet” u l-preżervazzjoni ta’ “pejsts
    li jagħtu l-lewn” (notifikata bid-dokument C(2020) 1979)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2020/503 van de Commissie van 3 april 2020 tot wijziging van
    Besluit 2014/312/EU om de uitzondering voor zinkoxide voor gebruik als stabilisator
    voor conserveringsmiddelen uit te breiden tot “in-blik-conservering” en “conservering
    van kleurpasta’s” (kennisgeving geschied onder nummer C(2020) 1979)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji (UE) 2020/503 z dnia 3 kwietnia 2020 r. zmieniająca decyzję
    2014/312/UE w celu przedłużenia odstępstwa dla tlenku cynku, aby umożliwić
    jego stosowanie jako stabilizatora środka konserwującego w celu uwzględnienia
    „konserwacji produktów w opakowaniach zamkniętych” i konserwacji „past
    barwiących” (notyfikowana jako dokument nr C(2020) 1979)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2020/503 da Comissão de 3 de abril de 2020 que altera a
    Decisão 2014/312/UE a fim de alargar a derrogação relativa ao óxido de zinco
    para permitir a sua utilização como estabilizador de conservantes utilizados
    na «conservação de enlatados» e na conservação de «pastas para afinação
    de cor» [notificada com o número C(2020) 1979]
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2020/503 a Comisiei din 3 aprilie 2020 de modificare a Deciziei
    2014/312/UE pentru a extinde derogarea privind oxidul de zinc, astfel încât
    utilizarea acestuia ca stabilizator pentru produsele de protecție să acopere
    și „protecția în interiorul recipientelor” și protecția „pastelor de
    nuanțare” [notificată cu numărul C(2020) 1979]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie (EÚ) 2020/503 z 3. apríla 2020, ktorým sa mení
    rozhodnutie 2014/312/EÚ s cieľom rozšíriť výnimku pre oxid zinočnatý tak,
    aby sa mohol používať ako konzervačný stabilizátor, a zahrnúť do tejto
    výnimky jeho použitie ako „konzervačného prostriedku používaného počas
    skladovania výrobkov na ochranu výrobkov potláčaním mikrobiálnej kontaminácie“
    a ako konzervačného prostriedku používaného v „tónovacích pastách“
    [oznámené pod číslom C(2020) 1979]
  type: main
- language: sl
  script: Latn
  content: Sklep Komisije (EU) 2020/503 z dne 3. aprila 2020 o spremembi Sklepa 2014/312/EU
    zaradi razširitve izvzetja za cinkov oksid, da se v njegovo uporabo kot stabilizatorja
    za konzervanse dovoli vključitev uporabe kot „konzervansa v vsebnikih“ in
    konzervansa za „paste za niansiranje“ (notificirano pod dokumentarno številko
    C(2020) 1979)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2020/503 de la Comisión de 3 de abril de 2020 que modifica
    la Decisión 2014/312/UE al objeto de ampliar la excepción relativa al óxido
    de zinc con miras a autorizar su uso como estabilizador de conservantes para «productos
    envasados» y para «pastas de tintado» [notificada con el número C(2020) 1979]
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut (EU) 2020/503 av den 3 april 2020 om ändring av beslut
    2014/312/EU för att utvidga undantaget för zinkoxid så att dess användning
    som konserverande stabiliseringsmedel även får innefatta ”konservering av
    burkförpackade produkter” och konservering av ”färgbrytningspastor” [delgivet
    med nr C(2020) 1979]
