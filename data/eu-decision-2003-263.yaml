title:
- language: en
  script: Latn
  content: '2003/263/EC: Council Decision of 27 March 2003 on the signature and conclusion
    of a Protocol adjusting the trade aspects of the Europe Agreement establishing
    an association between the European Communities and their Member States, of the
    one part, and the Republic of Poland, of the other part, to take account of the
    outcome of negotiations between the parties on new mutual agricultural concessions'
  type: main
- language: fr
  script: Latn
  content: '2003/263/CE: Décision du Conseil du 27 mars 2003 relative à la signature
    et à la conclusion d''un protocole d''adaptation des aspects commerciaux de l''accord
    européen établissant une association entre les Communautés européennes et
    leurs États membres, d''une part, et la République de Pologne, d''autre part,
    pour tenir compte des résultats des négociations entre les parties concernant
    l''établissement de nouvelles concessions agricoles réciproques'
  type: main
- language: de
  script: Latn
  content: '2003/263/EG: Beschluss des Rates vom 27. März 2003 über die Unterzeichnung
    und den Abschluss eines Protokolls zur Anpassung der Handelsaspekte des Europa-Abkommens
    zur Gründung einer Assoziation zwischen den Europäischen Gemeinschaften und
    ihren Mitgliedstaaten einerseits und der Republik Polen andererseits zur Berücksichtigung
    der Ergebnisse der Verhandlungen zwischen den Parteien über neue gegenseitige
    Zugeständnisse im Agrarbereich'
  type: main
- language: da
  script: Latn
  content: '2003/263/EF: Rådets afgørelse af 27. marts 2003 om undertegnelse og
    indgåelse af en protokol om tilpasning af handelsaspekterne i Europaaftalen om
    oprettelse af en associering mellem De Europæiske Fællesskaber og deres medlemsstater
    på den ene side og Republikken Polen på den anden side for at tage hensyn til
    resultatet af parternes forhandlinger om yderligere gensidige indrømmelser på
    landbrugsområdet'
  type: main
- language: el
  script: Grek
  content: '2003/263/ΕΚ: Απόφαση του Συμβουλίου, της 27ης
    Μαρτίου 2003, σχετικά με την υπογραφή και τη σύναψη
    πρωτοκόλλου για την προσαρμογή των εμπορικών
    πτυχών της ευρωπαϊκής συμφωνίας σύνδεσης μεταξύ
    των Ευρωπαϊκών Κοινοτήτων και των κρατών μελών
    τους, αφενός, και της Δημοκρατίας της Πολωνίας,
    αφετέρου, ώστε να ληφθούν υπόψη τα αποτελέσματα
    των διαπραγματεύσεων μεταξύ των μερών για
    νέες αμοιβαίες γεωργικές παραχωρήσεις'
  type: main
- language: fi
  script: Latn
  content: '2003/263/EY: Neuvoston päätös, tehty 27 päivänä maaliskuuta 2003,
    Euroopan yhteisöjen ja niiden jäsenvaltioiden sekä Puolan tasavallan välisestä
    assosiaatiosta tehdyn Eurooppa-sopimuksen kauppaa koskevien määräysten mukauttamisesta
    uusia keskinäisiä maatalousmyönnytyksiä koskevien neuvottelujen tulosten huomioon
    ottamiseksi tehtävän pöytäkirjan allekirjoittamisesta ja tekemisestä'
  type: main
- language: it
  script: Latn
  content: '2003/263/CE: Decisione del Consiglio, del 27 marzo 2003, relativa alla
    firma e alla conclusione di un protocollo di adeguamento degli aspetti commerciali
    dell''accordo europeo che istituisce un''associazione tra le Comunità europee
    e i loro Stati membri, da una parte, e la Repubblica di Polonia, dall''altra,
    per tenere conto dei risultati dei negoziati tra le parti riguardanti nuove concessioni
    reciproche nel settore agricolo'
  type: main
- language: nl
  script: Latn
  content: '2003/263/EG: Besluit van de Raad van 27 maart 2003 inzake de ondertekening
    en sluiting van een protocol tot aanpassing van de handelsaspecten van de Europaovereenkomst
    waarbĳ een associatie tot stand wordt gebracht tussen de Europese Gemeenschappen
    en hun lidstaten, enerzĳds, en de Republiek Polen, anderzĳds, in verband met
    de resultaten van de onderhandelingen over nieuwe wederzĳdse landbouwconcessies'
  type: main
- language: pt
  script: Latn
  content: '2003/263/CE: Decisão do Conselho, de 27 de Março de 2003, relativa à
    assinatura e celebração de um Protocolo de adaptação dos aspectos comerciais
    do Acordo Europeu que cria uma associação entre as Comunidades Europeias e os
    seus Estados-Membros, por um lado, e a República da Polónia, por outro, de forma
    a ter em conta os resultados das negociações entre as partes no que respeita
    a novas concessões agrícolas recíprocas'
  type: main
- language: es
  script: Latn
  content: '2003/263/CE: Decisión del Consejo, de 27 de marzo de 2003, relativa a
    la firma y celebración de un Protocolo de adaptación de los aspectos comerciales
    del Acuerdo Europeo por el que se crea una asociación entre las Comunidades Europeas
    y sus Estados miembros, por una parte, y la República de Polonia, por otra, a
    fin de atender al resultado de las negociaciones entre las Partes sobre nuevas
    concesiones agrícolas recíprocas'
  type: main
- language: sv
  script: Latn
  content: '2003/263/EG: Rådets beslut av den 27 mars 2003 om undertecknande och
    ingående av ett protokoll om anpassning av handelsaspekterna i Europaavtalet
    om upprättandet av en associering mellan Europeiska gemenskaperna och deras medlemsstater,
    å ena sidan, och Republiken Polen, å andra sidan, för att beakta resultatet
    av förhandlingarna mellan parterna om nya ömsesidiga jordbruksmedgivanden'
