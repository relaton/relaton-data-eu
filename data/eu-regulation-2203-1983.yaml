title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2203/83 of 1 August 1983 re-establishing
    the levying of customs duties on twine, cordage, ropes and cables, products of
    category 90 (code 0900) and originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2203/83 de la Commission du 1er août 1983 portant
    rétablissement de la perception des droits de douane applicables aux ficelles,
    cordes et cordages de la catégorie de produits 90 (code 0900), originaires de
    Corée du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2203/83 der Kommission vom 1. August 1983 über die
    Wiedereinführung des Zollsatzes für Bindfäden, Seile und Taue der Warenkategorie
    Nr. 90 (Kennziffer 0900), mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2203/83 af 1. august 1983 om genindførelse
    af opkrævning af toldafgifter for sejlgarn, reb og tovværk, under kategori nr.
    90 (kode 0900), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2203/83 της Επιτροπής
    της 1ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τους σπάγγους,
    σχοινιά και χονδρά σχοινιά, προϊόντα της κατηγορίας
    90 (κώδικας 0900), καταγωγής Νότιας Κορέας, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2203/83 della Commissione del 1o agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili allo spago, corde e funi, della categoria
    di prodotti n. 90 (codice 0900), originari della Corea del Sud, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2203/83 van de Commissie van 1 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bindgaren,
    touw en kabel van de categorie van produkten nr. 90 (codenummer 0900), van oorsprong
    uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3378/82 van de Raad
  type: main
