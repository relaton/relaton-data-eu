    97.05 des Gemeinsamen Zolltarifs mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3454/87 af 18. november 1987 om genindførelse
