- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3454/87 of 18 November 1987 re-establishing
    the levying of customs duties on entertainment and festivities articles falling
    within heading No 97.05, originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3454/87 de la Commission du 18 novembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux articles
    pour divertissements et fêtes de la position 97.05 du tarif douanier commun,
    originaires de Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3454/87 der Kommission vom 18. November 1987 zur Wiedereinführung
