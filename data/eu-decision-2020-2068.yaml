- language: en
  script: Latn
  content: Council Decision (EU) 2020/2068 of 7 December 2020 on the position to be
    taken on behalf of the European Union within the Stabilisation and Association
    Council established by the Stabilisation and Association Agreement between the
    European Union and the European Atomic Energy Community, of the one part, and
    Kosovo (This designation is without prejudice to positions on status, and is in
    line with UNSCR 1244/1999 and the ICJ Opinion on the Kosovo declaration of independence.),
    of the other part, as regards the amendment of that Agreement by replacing Protocol
    III thereto concerning the concept of ‘originating products’
  type: main
