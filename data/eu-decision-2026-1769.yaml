    avec la Suisse en vue d’autoriser les transports de cabotage lors de la prestation
    de services de transport international de voyageurs par autocars et autobus dans
    les régions frontalières entre les deux pays
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/1769 des Europäischen Parlaments und des Rates vom
