  content: Decision (EU) 2026/1769 of the European Parliament and of the Council of
    14 July 2026 empowering Austria to amend its bilateral road transport agreement
    with Switzerland with a view to authorising cabotage operations in the course
    of the provision of international passenger transport services by coach and bus
    in the border regions between the two countries
  type: main
- language: fr
  script: Latn
