title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1659/69 de la Commission, du 22 août 1969, relatif
    à des adjudications permanentes pour le beurre de stock détenu par les organismes
    d'intervention modifiant notamment le règlement (CEE) n° 1033/69 et clôturant
    l'adjudication permanente visée au règlement (CEE) n° 1034/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1659/69 der Kommission vom 22. August 1969 betreffend
    Dauerausschreibungen von Butter aus Beständen der Interventionsstellen, insbesondere
    zur Änderung der Verordnung (EWG) Nr. 1033/69 und zur Beendigung der in der Verordnung
    (EWG) Nr. 1034/69 vorgesehenen Dauerausschreibung
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1659/69 della Commissione, del 22 agosto 1969, relativo
    alle aste permanenti per il burro di ammasso in possesso degli organismi di intervento,
    che modifica in particolare il regolamento (CEE) n. 1033/69 e che pone termine
    alle aste permanenti di cui al regolamento (CEE) n. 1034/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1659/69 van de Commissie van 22 augustus 1969 betreffende
    de permanente verkopen bij inschrijving voor boter in het bezit van de interventiebureaus,
    met name tot wijziging van Verordening (EEG) nr. 1033/69 en tot beëindiging van
    de bij Verordening (EEG) nr. 1034/69 vastgestelde permanente verkoop bij inschrijving
  type: main
