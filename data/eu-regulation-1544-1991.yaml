title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1544/91 of 6 June 1991 amending Regulation
    (EEC) No 641/86 laying down detailed rules for the application of the supplementary
    trade mechanism to importation into Portugal of the products processed from fruit
    and vegetables listed in Annex XXII to the Act of Accession
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1544/91 DE LA COMMISSION du 6 juin 1991 modifiant
    le règlement (CEE) no 641/86 déterminant les modalités d'' application du mécanisme
    complémentaire aux échanges pour le secteur des produits transformés à base
    de fruits et légumes importés au Portugal visés à l'' annexe XXII de l'' acte
    d'' adhésion #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1544/91 DER KOMMISSION vom 6. Juni 1991 zur Änderung
    der Verordnung (EWG) Nr. 641/86 mit Durchführungsbestimmungen zum ergänzenden
    Handelsmechanismus für die in Anhang XXII der Beitrittsakte aufgeführten, in
    Portugal eingeführten Erzeugnisse des Sektors Verarbeitungserzeugnisse aus Obst
    und Gemüse #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1544/91 af 6. juni 1991 om ændring
    af forordning (EØF) nr. 641/86 om gennemførelsesbestemmelser til den supplerende
    mekanisme for samhandelen for så vidt angår produkter forarbejdet på basis
    af frugt og grønsager, der indføres til Portugal og er omhandlet i bilag XXII
    til tiltrædelsesakten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1544/91 της Επιτροπής
    της 6ης Ιουνίου 1991 για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 641/86 σχετικά με τον καθορισμό των
    λεπτομερειών εφαρμογής του συμπληρωματικού
    μηχανισμού στις συναλλαγές για τα προϊόντα
    του τομέα μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά που εισάγονται στην Πορτογαλία,
    που αναφέρονται στο παράρτημα ΧΧΙΙ της πράξης
    προσχώρησης
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1544/91 DELLA COMMISSIONE del 6 giugno 1991 recante
    modifica del regolamento (CEE) n. 641/86 che fissa le modalità di applicazione
    del meccanismo complementare applicabile agli scambi per i prodotti del settore
    dei prodotti trasformati a base di ortofrutticoli importati in Portogallo che
    figurano nell'' allegato XXII dell'' atto di adesione #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1544/91 VAN DE COMMISSIE van 6 juni 1991 tot wijziging
    van Verordening (EEG) nr. 641/86 tot vaststelling van uitvoeringsbepalingen inzake
    de aanvullende regeling voor het handelsverkeer voor de in bijlage XXII bij de
    Toetredingsakte genoemde produkten van de sector van op basis van groenten en
    fruit verwerkte produkten, die in Portugal worden ingevoerd #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1544/91 DA COMISSAO, DE 6 DE JUNHO DE 1991, QUE
    ALTERA O REGULAMENTO ( CEE ) NO 641/86 QUE DETERMINA AS REGRAS DE EXECUCAO DO
    MECANISMO COMPLEMENTAR AS TROCAS COMERCIAIS PARA O SECTOR DOS PRODUTOS TRANSFORMADOS
    A BASE DE FRUTAS E DE PRODUTOS HORTICOLAS IMPORTADOS EM PORTUGAL REFERIDOS NO
    ANEXO XXII DO ACTO DE ADESAO
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1544/91 DE LA COMISIÓN de 6 de junio de 1991 que
    modifica el Reglamento (CEE) no 641/86 que determina las modalidades de aplicación
    del mecanismo complementario sobre los intercambios para el sector de productos
    transformados a base de frutas y hortalizas importados en Portugal que se mencionan
    en el Anexo XXII del Acta de adhesión #'
