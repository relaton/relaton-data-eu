title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1422/96 of 22 July 1996 determining the Member
    States in which the campaigns to promote the consumption of grape juice may be
    carried out in respect of the 1995/96 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1422/96 de la Commission du 22 juillet 1996 déterminant
    les États membres dans lesquels les campagnes promotionnelles en faveur de la
    consommation de jus de raisins peuvent être réalisées au titre de la campagne
    1995/1996
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1422/96 der Kommission vom 22. Juli 1996 zur Bestimmung
    der Mitgliedstaaten, in denen im Wirtschaftsjahr 1995/96 Werbekampagnen zur Förderung
    des Traubensaftverbrauchs durchgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1422/96 af 22. juli 1996 om bestemmelse
    af de medlemsstater, i hvilke der kan gennemføres salgskampagner til fremme af
    forbruget af druesaft i produktionsåret 1995/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1422/96 της Επιτροπής
    της 22ας Ιουλίου 1996 που καθορίζει τα κράτη μέλη
    στα οποία είναι δυνατόν να πραγματοποιηθούν
    οι διαφημιστικές εκστρατείες υπέρ της κατανάλωσης
    χυμού σταφυλής κατά την περίοδο 1995/96
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1422/96, annettu 22 päivänä heinäkuuta 1996,
    niiden jäsenvaltioiden vahvistamisesta, joissa voidaan toteuttaa rypäletäysmehun
    markkinointivuoteen 1995/96 liittyvä myynninedistämiskampanja
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1422/96 della Commissione del 22 luglio 1996 che stabilisce
    gli Stati membri nei quali sono organizzate campagne promozionali a favore del
    consumo di succo d'uva per la campagna 1995/1996
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1422/96 van de Commissie van 22 juli 1996 houdende
    vaststelling in welke Lid-Staten in het wijnoogstjaar 1995/1996 de reclamecampagnes
    tot stimulering van het verbruik van druivesap zullen worden gevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n 1422/96 da Comissão de 22 de Julho de 1996 que determina
    os Estados-membros em que podem ser realizadas, a título da campanha de 1995/1996,
    as campanhas de promoção do consumo de sumo de uva
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1422/96 de la Comisión de 22 de julio de 1996 por el
    que se determinan los Estados miembros en los que pueden realizarse, con cargo
    a la campaña 1995/96, campañas de promoción en favor del consumo de zumo de
    uva
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1422/96 av den 22 juli 1996 om fastställande
