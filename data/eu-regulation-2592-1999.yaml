  script: Latn
  content: Komission asetus (EY) N:o 2592/1999, annettu 8 päivänä joulukuuta 1999,
    väliaikaisten polkumyynti- ja tasoitustullien käyttöön ottamisesta Norjasta
    peräisin olevan viljellyn merilohen tuonnissa annetun asetuksen (EY) N:o 929/1999
    muuttamisesta annetun asetuksen (EY) N:o 1826/1999 muuttamisesta, kyseisen lohen
    tuontia koskevien väliaikaisten polkumyynti- ja tasoitustullien käyttöönotosta
    tiettyjen viejien osalta, kyseisen lohen tuontia koskevien polkumyynnin ja tukien
    vastaisten menettelyjen yhteydessä esitettyjen sitoumusten hyväksymisestä tehdyn
    päätöksen 97/634/EY muuttamisesta ja kyseisen lohen tuontia koskevien lopullisten
    polkumyynti- ja tasoitustullien käyttöönotosta annetun neuvoston asetuksen
    (EY) N:o 772/1999 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2592/1999 della Commissione, dell'8 dicembre 1999,
    recante modifica del regolamento (CE) n. 1826/1999 che modifica il regolamento
    (CE) n. 929/1999 che istituisce dazi antidumping e dazi compensativi provvisori
    sulle importazioni di salmone d'allevamento dell'Atlantico originario della Norvegia
    per quanto riguarda taluni esportatori, istituisce dazi antidumping e dazi compensativi
    provvisori sulle importazioni di tale salmone per quanto riguarda taluni esportatori,
    modifica la decisione 97/634/CE che accetta gli impegni offerti in relazione ai
    procedimenti antidumping e antisovvenzioni riguardo alle importazioni di tale
    salmone e modifica il regolamento (CE) n. 772/1999 del Consiglio che impone dazi
    antidumping e dazi compensativi definitivi sulle importazioni di tale salmone
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2592/1999 van de Commissie van 8 december 1999 tot
    wijziging van Verordening (EG) nr. 1826/1999 tot wijziging van Verordening (EG)
    nr. 929/1999 tot instelling van een voorlopig antidumpingrecht en een voorlopig
    compenserend recht op de invoer van gekweekte Atlantische zalm van oorsprong uit
    Noorwegen, tot wijziging van Besluit 97/634/EG tot aanvaarding van verbintenissen
    die in het kader van de antidumping- en antisubsidieprocedures betreffende deze
    zalm waren aangeboden en tot wijziging van Verordening (EG) nr. 772/1999 van de
    Raad tot instelling van definitieve antidumpingrechten en compenserende rechten
    op de invoer van deze zalm
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2592/1999 da Comissão, de 8 de Dezembro de 1999,
    que altera o Regulamento (CE) n.o 1826/1999 que altera o Regulamento (CE) n.o
    929/1999 que institui direitos anti-dumping e de compensação provisórios sobre
    as importações de salmão do Atlântico de viveiro originário da Noruega no
    que respeita a certos exportadores, que institui direitos anti-dumping e de compensação
    provisórios sobre as importações desse salmão no que respeita a certos exportadores,
    que altera a Decisão 97/634/CE relativa à aceitação de compromissos oferecidos
    no âmbito de processos anti-dumping e anti-subvenções respeitantes às importações
    desse salmão e que altera o Regulamento (CE) n.o 772/1999 do Conselho que cria
    direitos anti-dumping e de compensação definitivos sobre as importações desse
    salmão
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2592/1999 de la Comisión, de 8 de diciembre de 1999,
    por el que se modifica el Reglamento (CE) nº 1826/1999 por el que se modifica
    el Reglamento (CE) nº 929/1999 por el que se establecen derechos antidumping
    y compensatorios provisionales sobre las importaciones de salmón atlántico de
    piscifactoría originario de Noruega con respecto a determinados importadores,
    por el que se establecen derechos antidumping y compensatorios provisionales sobre
    las importaciones de dicho salmón con respecto a determinados importadores, por
    el que se modifica la Decisión 97/634/CE por la que se aceptan los compromisos
    ofrecidos con respecto a los procedimientos antidumping y antisubvenciones relativos
    a las importaciones de dicho salmón y por el que se modifica el Reglamento (CE)
    nº 772/1999 del Consejo por el que se establecen derechos antidumping y compensatorios
    definitivos sobre las importaciones del mismo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2592/1999 av den 8 december 1999 om ändring
    av förordning (EG) nr 1826/1999 om ändring av förordning (EG) nr 929/1999 rörande
    införande, vad gäller vissa exportörer, av preliminära antidumpnings- och
    utjämningstullar på import av odlad atlantlax med ursprung i Norge och om införande
    av preliminära antidumpnings- och utjämningstullar på import av sådan lax
    från vissa exportörer, om ändring av beslut 97/634/EG rörande godtagande av
    åtaganden som gjorts i samband med antidumpnings- och antisubventionsförfarandena
    rörande import av sådan lax samt om ändring av rådets förordning (EG) nr
    772/1999 rörande införande av slutgiltiga antidumpnings- och utjämningstullar
    på import av sådan lax
