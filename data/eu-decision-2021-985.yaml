---
id: EUDecision2021985
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/985 of 3 June 2021 correcting
    the Spanish language version of Decision 2004/842/EC concerning implementing rules
    whereby Member States may authorise the placing on the market of seed belonging
    to varieties for which an application for entry in the national catalogue of varieties
    of agricultural plant species or vegetable species has been submitted (notified
    under document C(2021) 3869)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/985 de la Commission du 3 juin 2021
    rectifiant la version en langue espagnole de la décision 2004/842/CE relative
    aux modalités d’exécution selon lesquelles les États membres peuvent autoriser
    la commercialisation de semences appartenant à des variétés pour lesquelles
    une demande d’inscription au catalogue national des variétés des espèces
    de plantes agricoles et des espèces de légumes a été présentée [notifiée
    sous le numéro C(2021) 3869]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/985 der Kommission vom 3. Juni 2021 zur
    Berichtigung der spanischen Sprachfassung der Entscheidung 2004/842/EG über Durchführungsbestimmungen,
    nach denen die Mitgliedstaaten das Inverkehrbringen von Saatgut der Sorten genehmigen
    können, für die die Aufnahme in den einzelstaatlichen Sortenkatalog für landwirtschaftliche
    Pflanzenarten oder für Gemüsearten beantragt wurde (Bekannt gegeben unter Aktenzeichen
    C(2021) 3869)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/985 на Комисията
    от 3 юни 2021 година за поправка на текста на испански
    език на Решение 2004/842/ЕО относно правилата за
    изпълнение, с които държавите членки могат
    да разрешават предлагането на пазара на семена,
    които принадлежат към сортовете, за които е
    подадено заявление за вписване в националния
    каталог на сортовете на земеделските растителни
    видове (нотифицирано под номер С(2021) 3869)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/985 ze dne 3. června 2021, kterým
    se opravuje španělské znění rozhodnutí 2004/842/ES o prováděcích pravidlech,
    podle nichž mohou členské státy povolit uvádění na trh osiva těch odrůd,
    pro které byly předloženy žádosti o zapsání do katalogu odrůd druhů zemědělských
    rostlin nebo druhů zeleniny členského státu (oznámeno pod číslem C(2021)
    3869)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/985 af 3. juni 2021 om
    berigtigelse af den spanske udgave af beslutning 2004/842/EF om gennemførelsesbestemmelser,
    hvorefter medlemsstaterne kan tillade markedsføring af frø tilhørende sorter,
    for hvilke der er indgivet en ansøgning om opførelse på den nationale sortsliste
    over landbrugsplantearter eller grøntsagsarter (meddelt under nummer C(2021)
    3869)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2021/985 της Επιτροπής
    της 3ης Ιουνίου 2021 για τη διόρθωση της ισπανικής
    γλωσσικής έκδοσης της απόφασης 2004/842/ΕΚ σχετικά
    με κανόνες εφαρμογής βάσει των οποίων τα κράτη
    μέλη μπορούν να επιτρέπουν τη διάθεση στο εμπόριο
    σπόρων ποικιλίας για την οποία έχει ήδη υποβληθεί
    αίτηση εγγραφής στον εθνικό κατάλογο ποικιλιών
    καλλιεργούμενων φυτικών ειδών ή κηπευτικών
    ειδών [κοινοποιηθείσα υπό τον αριθμό C(2021) 3869]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/985, 3. juuni 2021, millega parandatakse
    otsuse 2004/842/EÜ (rakenduseeskirjade kohta, mille alusel liikmesriigid võivad
    lubada turule viia nende sortide seemneid, mille kohta on esitatud taotlus riiklikku
    põllumajandustaimesortide või köögiviljasortide kataloogi kandmiseks) hispaaniakeelset
    teksti (teatavaks tehtud numbri C(2021) 3869 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/985, annettu 3 päivänä
    kesäkuuta 2021, täytäntöönpanosäännöistä, joiden nojalla jäsenvaltiot
    voivat antaa luvan saattaa markkinoille sellaisten lajikkeiden siemeniä, joista
    on tehty viljelykasvilajien tai vihanneslajien kansalliseen lajikeluetteloon lisäämistä
    koskeva hakemus, tehdyn päätöksen 2004/842/EY espanjankielisen toisinnon oikaisemisesta
    (tiedoksiannettu numerolla C(2021) 3869)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2021/985 ón gCoimisiún an 3 Meitheamh
    2021 lena gceartaítear an leagan Spáinnise de Chinneadh 2004/842/CE maidir le
    rialacha cur chun feidhme lena bhféadfaidh na Ballstáit údarú a thabhairt
    síol a chur ar an margadh de chineál a ndearnadh iarratas ar é a chur isteach
    i gcatalóg náisiúnta na gcineálacha speiceas plandaí nó speiceas glasraí
    (Tugadh fógra dó faoi dhoiciméid C(2021)3869)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/985 оd 3. lipnja 2021. o izmjeni
    španjolske jezične verzije Odluke 2004/842/EZ o provedbenim pravilima kojima
    države članice mogu odobriti stavljanje na tržište sjemena koje pripada sortama
    za koje je podnesen zahtjev za unos u nacionalni katalog sorata poljoprivrednih
    biljnih vrsta ili vrsta povrća (priopćeno pod brojem dokumenta C(2021) 3869)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/985 végrehajtási határozata (2021. június 3.)
    a mezőgazdasági növényfajok vagy a zöldségfajok nemzeti fajtajegyzékébe
    való felvétel iránti kérelem tárgyát képező vetőmagfajták forgalomba
    hozatalának tagállamok általi engedélyezésére vonatkozó végrehajtási
    szabályokról szóló 2004/842/EK határozat spanyol nyelvi változatának helyesbítéséről
    (az értesítés a C(2021) 3869. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/985 della Commissione del 3 giugno 2021
    che rettifica la versione in lingua spagnola della decisione 2004/842/CE relativa
    alle norme di applicazione con cui gli Stati membri possono autorizzare la commercializzazione
    di sementi appartenenti a varietà per le quali sia stata presentata una domanda
    di iscrizione nel catalogo nazionale delle varietà delle specie di piante agricole
    o delle specie di ortaggi [notificata con il numero C(2021) 3869]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/985 (2021. gada 3. jūnijs),
    ar ko labo spāņu valodas versiju Lēmumam 2004/842/EK par īstenošanas noteikumiem,
    ar ko dalībvalstis var atļaut laist tirgū tādu šķirņu sēklas, par kurām
    ir iesniegts pieteikums iekļaušanai valsts lauksaimniecības augu šķirņu
    vai dārzeņu šķirņu katalogā (izziņots ar dokumenta numuru C(2021) 3869)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/985 2021 m. birželio 3 d.
    kuriuo ištaisoma Sprendimo 2004/842/EB dėl įgyvendinimo taisyklių, kuriomis
    remdamosi valstybės narės gali leisti teikti į rinką sėklas, priklausančias
    veislėms, dėl kurių buvo pateiktos paraiškos jas įtraukti į žemės ūkio
    augalų rūšių veislių ar daržovių rūšių veislių nacionalinį katalogą,
    teksto redakcija ispanų kalba (pranešta dokumentu Nr. C(2021) 3869)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/985 tat-3
    ta’ Ġunju 2021 li tikkoreġi l-verżjoni bl-Ispanjol tad-Deċiżjoni 2004/842/KE
    rigward l-implimentar tar-regolamentazzjoni li biha l-Istati Membri jistgħu jawtorizzaw
    it-tqegħid fis-suq ta’ żerriegħa li tappartjeni għal varjetajiet li għalihom
    ġiet sottomessa applikazzjoni għad-dħul fil-katalogu nazzjonali ta’ varjetajiet
    ta’ speċi ta’ pjanti agrikoli jew speċi veġetali (notifikata bid-dokument
    C(2021) 3869)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/985 van de Commissie van 3 juni 2021 tot rectificatie
    van de Spaanse taalversie van Beschikking 2004/842/EG tot vaststelling van uitvoeringsregels
    volgens welke de lidstaten toestemming kunnen geven voor het in de handel brengen
    van zaai- of pootgoed van rassen waarvoor de opname in de nationale rassenlijst
    voor landbouw- of groentegewassen is aangevraagd (Kennisgeving geschied onder
    nummer C(2021) 3869)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/985 z dnia 3 czerwca 2021 r. w sprawie
    sprostowania hiszpańskiej wersji językowej decyzji 2004/842/WE w sprawie przepisów
    wykonawczych, na mocy których państwa członkowskie mogą zezwolić na wprowadzenie
    do obrotu materiału siewnego należącego do odmiany, dla której złożono wniosek
    o włączenie do krajowego katalogu odmian gatunków roślin rolniczych lub katalogu
    odmian gatunków warzyw (notyfikowana jako dokument nr C(2021) 3869)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/985 da Comissão de 3 de junho de 2021
    que retifica a versão em língua espanhola da Decisão 2004/842/CE que diz respeito
    às normas de execução segundo as quais os Estados-Membros podem autorizar a
    colocação no mercado de sementes pertencentes a variedades para as quais foi
    apresentado um pedido de inscrição no catálogo nacional de variedades de espécies
    agrícolas ou de espécies hortícolas [notificada com o número C(2021) 3869]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/985 a Comisiei din 3 iunie 2021
    de rectificare a versiunii în limba spaniolă a Deciziei 2004/842/CE privind
    modalitățile de aplicare conform cărora statele membre pot autoriza comercializarea
    semințelor aparținând unor soiuri pentru care s-a depus o cerere de înscriere
    în catalogul național al soiurilor de plante agricole și de specii de legume
    [notificată cu numărul C(2021) 3869]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/985 z 3. júna 2021, ktorým
    sa opravuje španielske jazykové znenie rozhodnutia 2004/842/ES o vykonávacích
    pravidlách, podľa ktorých môžu členské štáty udeľovať oprávnenia na
    uvádzanie na trh osiva patriaceho do odrôd, na ktoré bola podaná žiadosť
    o zápis do štátneho katalógu poľnohospodárskych rastlinných druhov alebo
    zeleninových druhov [oznámené pod číslom C(2021) 3869]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/985 z dne 3. junija 2021 o popravku
    španske jezikovne različice Odločbe 2004/842/ES o pravilih za izvajanje, po
    katerih lahko države članice dovolijo dajanje v promet semen tistih sort, za
    katere je bila vložena prošnja za vpis v nacionalni katalog sort poljščin
    ali zelenjadnic (notificirano pod dokumentarno številko C(2021) 3869)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/985 de la Comisión de 3 de junio de
    2021 que corrige la versión en lengua española de la Decisión 2004/842/CE,
    relativa a disposiciones de aplicación por las que los Estados miembros pueden
    autorizar la comercialización de semillas pertenecientes a variedades para las
    que se haya presentado una solicitud de inscripción en el catálogo nacional
    de variedades de especies de plantas agrícolas y hortícolas [notificada con
    el número C(2021) 3869]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/985 av den 3 juni 2021 om rättelse
