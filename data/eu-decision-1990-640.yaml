title:
- language: en
  script: Latn
  content: '90/640/EEC: Council Decision of 3 December 1990 authorizing the Federal
    Republic of Germany to grant an exemption from Articles 14 and 15 of the Sixth
    Directive 77/388/EEC on the harmonization of the laws of the Member States relating
    to turnover taxes for Soviet armed forces stationed on the territory of the Federal
    Republic of Germany'
  type: main
- language: fr
  script: Latn
  content: '90/640/CEE: Décision du Conseil, du 3 décembre 1990, autorisant la République
    fédérale d''Allemagne à appliquer aux troupes soviétiques stationnées sur
    le territoire de la République fédérale d''Allemagne une dérogation aux articles
    14 et 15 de la sixième directive 77/388/CEE en matière d''harmonisation des
    législations des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '90/640/EWG: Entscheidung des Rates vom 3. Dezember 1990 zur Ermächtigung
    der Bundesrepublik Deutschland, für die im Gebiet der Bundesrepublik Deutschland
    stationierten sowjetischen Truppen von den Artikeln 14 und 15 der Sechsten Richtlinie
    77/388/EWG zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über
    die Umsatzsteuern abzuweichen'
  type: main
- language: da
  script: Latn
  content: '90/640/EØF: Rådets Beslutning af 3. december 1990 om bemyndigelse af
    Forbundsrepublikken Tyskland til at fravige artikel 14 og 15 i sjette direktiv
    77/388/EØF om harmonisering af medlemsstaternes lovgivning om omsætningsafgifter
    for så vidt angår de sovjetiske styrker, der er stationeret på Forbundsrepublikken
    Tysklands område'
  type: main
- language: el
  script: Grek
  content: '90/640/ΕΟΚ: Απόφαση του Συμβουλίου της 3ης
    Δεκεμβρίου 1990 που επιτρέπει στην Ομοσπονδιακή
    Δημοκρατία της Γερμανίας να εφαρμόσει στα
    σοβιετικά στρατεύματα που σταθμεύουν στο έδαφος
    της Ομοσπονδιακής Δημοκρατίας της Γερμανίας,
    παρέκκλιση από τα άρθρα 14 και 15 της έκτης οδηγίας
    77/388/ΕΟΚ για την εναρμόνιση των νομοθεσιών των
    κρατών μελών, των σχετικών με τους φόρους κύκλου
    εργασιών'
  type: main
- language: it
  script: Latn
  content: '90/640/CEE: Decisione del Consiglio, del 3 dicembre 1990, che autorizza
    la Repubblica Federale di Germania ad applicare alle truppe sovietiche stazionate
    sul territorio della Repubblica Federale di Germania una deroga agli articoli
    14 e 15 della sesta direttiva 77/388/CEE in materia di armonizzazione delle legislazioni
    degli Stati membri relative alle imposte sulla cifra d''affari'
  type: main
- language: nl
  script: Latn
  content: '90/640/EEG: Beschikking van de Raad van 3 december 1990 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd een afwijking van de artikelen 14 en 15 van de Zesde
    Richtlijn 77/388/EEG betreffende de harmonisatie van de wetgevingen der Lid-Staten
    inzake omzetbelasting toe te passen voor Sowjet-troepen die op het grondgebied
    van de Bondsrepubliek Duitsland zijn gelegerd'
  type: main
