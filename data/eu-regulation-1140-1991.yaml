    σε ορισμένες παράκτιες περιοχές της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1140/91 della Commissione del 30 aprile 1991 recante
    modifica dell'elenco allegato al regolamento (CEE) n. 55/87 che fissa l'elenco
    dei pescherecci di lunghezza fuori tutto superiore a otto metri, autorizzati ad
    usare reti a strascico a pali in determinate zone della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1140/91 van de Commissie van 30 april 1991 houdende
    wijziging van de lijst in de bijlage bij Verordening (EEG) nr. 55/87 tot vaststelling
    van de lijst van vaartuigen met een lengte over alles van meer dan 8 meter en
    die in bepaalde zones van de Gemeenschap mogen vissen met de boomkor
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1140/91 da Comissão de 30 de Abril de 1991 que altera
    a lista anexa ao Regulamento (CEE) nº 55/87, que estabelece a lista dos navios
    com mais de oito metros de comprimento de fora a fora autorizados a utilizar redes
    de arrasto de vara em determinadas zonas da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1140/91 de la Comisión de 30 de abril de 1991 por
    el que se modifica la lista aneja al Reglamento (CEE) n° 55/87 por el que se
    establece la lista de barcos cuya eslora total exceda los ocho metros y a los
    que se permite faenar utilizando artes de arrastre de vara dentro de determinadas
    zonas de la Comunidad
