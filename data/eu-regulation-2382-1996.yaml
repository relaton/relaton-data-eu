  content: Council Regulation (EC) No 2382/96 of 9 December 1996 repealing Regulations
    (EEC) No 990/93 and (EC) No 2471/94 and concerning the termination of restrictions
    on economic and financial relations with the Federal Republic of Yugoslavia (Serbia
    and Montenegro), the United Nations Protected Areas in the Republic of Croatia
    and those areas of the Republic of Bosnia and Herzegovina under the control of
    Bosnian Serb forces
  type: main
- language: fr
  script: Latn
