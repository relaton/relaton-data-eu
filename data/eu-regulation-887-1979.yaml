title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 887/79 of 3 May 1979 re-establishing the
    levying of customs duties on fibre building board of wood or other vegetable material,
    falling within heading No 44.11 and originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 887/79 de la Commission, du 3 mai 1979, portant rétablissement
    de la perception des droits de douane applicables aux panneaux de fibres de bois
    ou d' autres matières végétales, de la position 44.11 du tarif douanier commun,
    originaires du Brésil, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 887/79 der Kommission vom 3. Mai 1979 zur Wiedereinführung
    des Zollsatzes für Platten aus Fasern von Holz oder anderen pflanzlichen Stoffen
    der Tarifnummer 44.11, mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 887/79 af 3. maj 1979 om genindførelse
    af opkrævning af toldafgifter for træfiberplader og fiberplader af andre vegetabilske
    materialer, henhørende under pos. 44.11 i den fælles toldtarif, som har oprindelse
    i Brasilien og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 887/79 della Commissione, del 3 maggio 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai pannelli di fibre di legno o di
    altre materie vegetali, della voce doganale 44.11, originari del Brasile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 887/79 van de Commissie van 3 mei 1979 houdende wederinstelling
    van de heffing van de invoerrechten van toepassing op platen van houtvezels of
    van andere plantaardige vezels, van post 44.11, van oorsprong uit Brazilië, ten
    behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
