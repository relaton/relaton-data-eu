title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2385/96 of 16 December 1996 amending Regulation
    (EEC) No 3046/92 laying down provisions implementing Council Regulation (EEC)
    No 3330/91 on the statistics relating to the trading of goods between Member States
    and amending it by simplifying the concept of net mass
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2385/96 de la Commission du 16 décembre 1996 modifiant
    le règlement (CEE) nº 3046/92 fixant certaines dispositions d'application du
    règlement (CEE) nº 3330/91 du Conseil relatif aux statistiques des échanges
    de biens entre États membres et modifiant ce dernier, en ce qui concerne la simplification
    de la mention de la masse nette
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2385/96 der Kommission vom 16. Dezember 1996 zur Änderung
    der Verordnung (EWG) Nr. 3046/92 zur Festlegung gewisser Durchführungsbestimmungen
    für die Verordnung (EWG) Nr. 3330/91 des Rates über die Statistiken des Warenverkehrs
    zwischen den Mitgliedstaaten und zur Änderung letzterer im Hinblick auf die Vereinfachung
    der Angabe der Eigenmasse
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 2385/96 af 16. december 1996 om ændring
    af forordning (EØF) nr. 3046/92 om gennemførelsesbestemmelser til Rådets forordning
    (EØF) nr. 3330/91 om statistikker over udveksling af goder mellem medlemsstater
    og om ændring af nævnte forordning med hensyn til forenkling af angivelsen af
    nettomassen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2385/96 της Επιτροπής
    της 16ης Δεκεμβρίου 1996 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3046/92 περί καθορισμού διατάξεων εφαρμογής
    του κανονισμού (ΕΟΚ) αριθ. 3330/91 του Συμβουλίου
    για τις στατιστικές των συναλλαγών αγαθών
    μεταξύ κρατών μελών και για τροποποίηση του
    εν λόγω κανονισμού, όσον αφορά την απλούστευση
    της αναφοράς της καθαρής μάζας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2385/96, annettu 16 päivänä joulukuuta 1996,
    jäsenvaltioiden välisen tavarakaupan tilastoista annetun neuvoston asetuksen
    (ETY) N:o 3330/91 soveltamissäännösten vahvistamisesta ja mainitun asetuksen
    muuttamisesta annetun asetuksen (ETY) N:o 3046/92 muuttamisesta nettomassan maininnan
    yksinkertaistamisen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2385/96 della Commissione del 16 dicembre 1996 che
    modifica il regolamento (CEE) n. 3046/92 recante disposizioni d'applicazione del
    regolamento (CEE) n. 3330/91 del Consiglio relativo alle statistiche degli scambi
    di beni tra Stati membri e che modifica quest'ultimo per quanto riguarda la semplificazione
    dell'indicazione della massa netta
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2385/96 van de Commissie van 16 december 1996 tot
    wijziging van Verordening (EEG) nr. 3046/92 tot vaststelling van bepalingen ter
    uitvoering van Verordening (EEG) nr. 3330/91 van de Raad betreffende de statistieken
    van het goederenverkeer tussen Lid-Staten en tot wijziging van die verordening
    met betrekking tot de vereenvoudiging van de vermelding van de nettomassa
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2385/96 da Comissão de 16 de Dezembro de 1996 que
    altera o Regulamento (CEE) nº 3046/92 da Comissão que fixa certas disposições
    de aplicação do Regulamento (CEE) nº 3330/91 do Conselho, relativo às estatísticas
    das trocas de bens entre Estados-membros, e que altera este último no que se
    refere à simplificação da menção da massa líquida
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2385/96 de la Comisión de 16 de diciembre de 1996
    por el que se modifica el Reglamento (CEE) nº 3046/92 por el que se fijan disposiciones
    de aplicación del Reglamento (CEE) nº 3330/91 del Consejo relativo a las estadísticas
    de intercambios de bienes entre Estados miembros y por el que se modifica el mismo,
    en lo que concierne a la simplificación de la indicación de la masa neta
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2385/96 av den 16 december 1996 om ändring
