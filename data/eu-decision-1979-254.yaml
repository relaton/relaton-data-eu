title:
- language: en
  script: Latn
  content: '79/254/EEC: Commission Decision of 16 February 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to women''s, girls''and infants''(other than babies'')
    woven and knitted or crocheted dresses, of wool, of cotton or of man-made textile
    fibres, falling within subheadings ex 60.05 A II and ex 61.02 B of the Common
    Customs Tariff (NIMEXE codes 60.05-41, 42, 43, 44; 61.02-48, 52, 53, 54) (category
    26), originating in Taiwan and in free circulation in the other Member States
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/254/CEE: Décision de la Commission, du 16 février 1979, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les robes tissées et robes de bonneterie
    pour femmes, fillettes et jeunes enfants (autres que bébés), de laine, de coton
    ou de fibres textiles synthétiques ou artificielles, des sous- positions ex 60.05
    A II et ex 61.02 B du tarif douanier commun (codes Nimexe: 60.05-41, 42, 43, 44;
    61.02-48, 52, 53, 54) catégorie 26, originaires de T''ai-wan et mises en libre
    pratique dans les autres États membres (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/254/EWG: Entscheidung der Kommission vom 16. Februar 1979, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Kleider aus Geweben und aus Gewirken, für Frauen,
    Mädchen und Kleinkinder (ausgenommen Säuglinge), aus Wolle, Baumwolle oder aus
    synthetischen oder künstlichen Spinnstoffen, der Tarifstellen ex 60.05 A II und
    ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern: 60.05-41; 42; 43; 44
    und 61.02-48; 52; 53; 54) (Kategorie 26) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/254/EØF: Kommissionens beslutning af 16. februar 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage vævede kjoler og kjoler af trikotage,
    til kvinder, piger og småbørn (undtagen spædbørn), af uld, bomuld eller kemofibre,
    som henhører under pos. ex 60.05 A II og ex 61.02 B i den fælles toldtarif (NIMEXE-nummer
    60.05-41, 42, 43, 44 - 61.02- 48, 52, 53, 54) kategori 26, har oprindelse i Taiwan
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/254/CEE: Decisione della Commissione, del 16 febbraio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario gli abiti interi tessuti ed a maglia,
    per donna, per ragazza e per bambini, diversi dai bambini piccoli (bébés), di
    lana, di cotone o di fibre tessili sintetiche o artificiali, delle sottovoci ex
    60.05 A II e ex 61.02 B della tariffa doganale comune (codice Nimexe: 60.05-41,
    42, 43, 44; 61.02-48, 52, 53, 54), categoria 26, originari di Taiwan e messi in
    libera pratica negli altri Stati membri (I testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/254/EEG: Beschikking van de Commissie van 16 februari 1979 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd japonnen voor dames, meisjes en kinderen (andere dan die voor
    baby''s), geweven en van brei- of haakwerk, van wol, van katoen of van synthetische
    of kunstmatige vezels, van de posten ex 60.05 A II en ex 61.02 B van het gemeenschappelijk
    douanetarief (NIMEXE- code 60.05-41, 42, 43, 44 en 61.02-48, 52, 53, 54) (categorie
    26), van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
