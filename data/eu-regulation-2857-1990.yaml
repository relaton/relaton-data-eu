  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2857/90 DELLA COMMISSIONE del 3 ottobre 1990 relativo
    alla vendita, a prezzi fissati forfettariamente in anticipo, di talune carni bovine
    provenienti dalle scorte di intervento destinate alla trasformazione nell'ambito
    di un programma di aiuto organizzato da uno Stato membro e recante abrogazione
    del regolamento (CEE) no 731/88
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2857/90 VAN DE COMMISSIE van 3 oktober 1990 inzake
    de verkoop, tegen vooraf forfaitair vastgestelde prijzen, van rundvlees uit interventievoorraden
    voor verwerking in het kader van een door een Lid-Staat opgezet voedselhulpprogramma
    en houdende intrekking van Verordening (EEG) nr. 731/88
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2857/90 DA COMISSAO de 3 de Outubro de 1990 relativo
    à venda a preço fixado forfetaria e antecipadamente, com vista à transformaçao,
    no âmbito de um programa de auxilio organizado por um Estado-membro, de determinadas
    carnes de bovino provenientes das existências de intervençao e que revoga o
    Regulamento (CEE) n* 731/88
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2857/90 DE LA COMISION de 3 de octubre de 1990 relativo
    a la venta, a precio fijado a tanto alzado anticipado, de determinadas carnes
    de vacuno procedentes de las existencias de intervencion, para su posterior transformacion
    y exportacion, en el marco de los programas de ayuda organizados por un Estado
    miembro y por el que se deroga el Reglamento (CEE) no 731/88
