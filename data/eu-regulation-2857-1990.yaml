title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2857/90 of 3 October 1990 on the sale at
    prices fixed at a standard rate in advance of certain beef from intervention stocks
    for processing under an aid programme organized by a Member State and repealing
    Regulation (EEC) No 731/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2857/90 de la Commission du 3 octobre 1990 relatif
    à la vente à prix fixé forfaitairement à l'avance, en vue de leur transformation
    dans le cadre d'un programme d'aide organisé par un État membre, de certaines
    viandes bovines provenant des stocks d'intervention et abrogeant le règlement
    (CEE) n° 731/88
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2857/90 DER KOMMISSION vom 3. Oktober 1990 ueber den
    Verkauf von bestimmtem Rindfleisch aus Interventionsbestaenden zu pauschal im
    voraus festgesetzten Preisen zur Verarbeitung im Rahmen eines einzelstaatlichen
    Hilfsprogramms und zur Aufhebung der Verordnung (EWG) Nr. 731/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2857/90 af 3. oktober 1990 om salg
    til forudfastsat pris af visse former for oksekød fra interventionslagre med
    henblik på forarbejdning som led i et af en medlemsstat tilrettelagt støtteprogram
    og om ophævelse af forordning (EØF) nr. 731/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2857/90 της 3ης Οκτωβρίου
