id: EURegulation15031980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1503/80 of 16 June 1980 re-establishing
    the levying of customs duties on filament lamps for lighting, falling within subheading
    85.20 A and originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1503/80 de la Commission, du 16 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux lampes et
    tubes à incadescence pour l' éclairage, de la sous-position 85.20 A du tarif
    douanier commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1503/80 der Kommission vom 16. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Glühlampen für elektrische Beleuchtung, der Tarifstelle
    85.20 A, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2789/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1503/80 af 16. juni 1980 om genindførelse
    af opkrævning af toldafgifter for glødelamper til belysning, under pos. 85.20
    A, som har oprindelse i Hongkong og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1503/80 della Commissione, del 16 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle lampade e tubi a
    incandescenza per l' illuminazione, della sottovoce 85.20 A della tariffa doganale
    comune, originari di Hong Kong beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1503/80 van de Commissie van 16 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op gloeilampen
    en gloeibuizen, voor verlichtingsdoeleinden, van post 85.20 A, van oorsprong uit
    Hong-Kong ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
