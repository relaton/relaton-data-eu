    των παρεμβάσεων που συνίστανται σε αγορές,
    αποθεματοποίηση και διάθεση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 400/85 della Commissione del 15 febbraio 1985 che
    modifica il regolamento (CEE) n. 467/77 che stabilisce il metodo ed il tasso d'
    interesse da utilizzare per il calcolo delle spese di finanziamento degli interventi
    costituiti da acquisti, magazzinaggio e vendita
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 400/85 van de Commissie van 15 februari 1985 houdende
    wijziging van Verordening (EEG) nr. 467/77 met betrekking tot de methode en de
    rentevoet die dienen te worden toegepast bij de berekening van de financieringskosten
    voor interventies in de vorm van aankoop, opslag en afzet
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 400/85 da Comissão, de 15 de Fevereiro de 1985,
    que altera o Regulamento (CEE) n.° 467/77 relativo ao método e taxa de juro
    a aplicar no cálculo das despesas de financiamento das intervenções que consistem
    em compras, armazenamentos e escoamentos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 400/85 de la Comisión, de 15 de febrero de 1985,
    por el que se modifica el Reglamento (CEE) n° 467/77 relativo al método y al
    tipo de interés que deben aplicarse para calcular los gastos de financiación
    de las intervenciones consistentes en la compra, almacenamiento y venta
  type: main
