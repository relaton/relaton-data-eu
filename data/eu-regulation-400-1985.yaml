- language: en
  script: Latn
  content: Commission Regulation (EEC) No 400/85 of 15 February 1985 amending Regulation
    (EEC) No 467/77 on the method and the rate of interest to be used for calculating
    the costs of financing intervention measures comprising buying in, storage and
    disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 400/85 de la Commission du 15 février 1985 modifiant
    le règlement (CEE) no 467/77 relatif à la méthode et au taux d' intérêt à
    appliquer pour le calcul des frais de financement des interventions consistant
    en achat, stockage et écoulement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 400/85 der Kommission vom 15. Februar 1985 zur Änderung
    der Verordnung (EWG) Nr. 467/77 über die Methode und den Zinssatz, die bei der
    Berechnung der Finanzierungskosten für Interventionen in Form von Ankauf, Lagerung
    und Absatz anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 400/85 af 15. februar 1985 om ændring
    af forordning (EØF) nr. 467/77 om den metode og den rentesats, der skal anvendes
    ved beregningen at finansieringsudgifter i forbindelse med interventioner i form
    af opkøb, oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 400/85 της Επιτροπής
    της 15ης Φεβρουαρίου 1985 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 467/77 σχετικά με τη
    μέθοδο και το επιτόκιο που πρέπει να εφαρμοστούν
