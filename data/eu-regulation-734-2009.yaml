title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 734/2009 of 11 August 2009 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 1858/2005 on imports of steel ropes and cables originating
    in the People’s Republic of China by imports of steel ropes and cables consigned
    from the Republic of Korea and Malaysia, whether declared as originating in the
    Republic of Korea and Malaysia or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 734/2009 de la Commission du 11 août 2009 portant
    ouverture d'une enquête relative à un éventuel contournement des mesures antidumping
    instituées par le règlement (CE) n o 1858/2005 du Conseil sur les importations
    de câbles en acier originaires de la République populaire de Chine par des importations
    de câbles en acier expédiés de la République de Corée et de la Malaisie,
    qu'ils aient ou non été déclarés originaires de la République de Corée et
    de la Malaisie, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 734/2009 der Kommission vom 11. August 2009 zur Einleitung
