    (EG) Nr. 1858/2005 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren von Kabeln und Seilen aus Stahl mit Ursprung in der Volksrepublik China
    durch Einfuhren von aus der Republik Korea und aus Malaysia versandten Kabeln
    und Seilen aus Stahl, ob als Ursprungserzeugnisse der Republik Korea oder Malaysias
    angemeldet oder nicht, und zur zollamtlichen Erfassung der letztgenannten Einfuhren
  type: main
