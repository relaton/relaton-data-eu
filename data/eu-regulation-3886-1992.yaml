    (CEE) n. 805/68, relativo all'organizzazione comune dei mercati nel settore delle
    carni bovine, e che abroga i regolamenti (CEE) n. 1244/82 e (CEE) n. 714/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3886/92 van de Commissie van 23 december 1992 tot
    vaststelling van de uitvoeringsbepalingen inzake de premieregelingen waarin is
    voorzien bij Verordening (EEG) nr. 805/68 van de Raad houdende een gemeenschappelijke
    ordening der markten in de sector rundvlees, en tot intrekking van de Verordeningen
