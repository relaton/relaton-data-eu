title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3886/92 of 23 December 1992 laying down
    detailed rules for the application of the premium schemes provided for in Council
    Regulation (EEC) No 805/68 on the common organization of the market in beef and
    repealing Regulations (EEC) No 1244/82 and (EEC) No 714/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3886/92 de la Commission, du 23 décembre 1992, établissant
    modalités d'application relatives aux régimes de primes prévus par le règlement
    (CEE) n° 805/68 du Conseil portant organisation commune des marchés dans le
    secteur de la viande bovine, et abrogeant les règlements (CEE) n° 1244/82 et
    (CEE) n° 714/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3886/92 der Kommission vom 23. Dezember 1992 mit Durchführungsvorschriften
