    Marktorganisation für Rindfleisch und zur Aufhebung der Verordnungen (EWG) Nr.
    1244/82 und (EWG) Nr. 714/89
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3886/92 af 23. december 1992 om gennemførelsesbestemmelser
