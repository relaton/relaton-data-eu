    felhasznált, az Aspergillus niger (CBS 109.713) által termelt endo-1,4-béta-xilanázt
    és az Aspergillus niger (DSM 18404) által termelt endo-1,4-béta-glükanázt
    tartalmazó készítmény minimális tartalma tekintetében történő módosításáról
    (az engedély jogosultja: BASF SE)'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1070/2014 della Commissione, del 10 ottobre
    2014 , recente modifica del regolamento di esecuzione (UE) n. 271/2009 della Commissione
    per quanto concerne il tenore minimo del preparato di endo-1,4-beta-xilanasi prodotto
    da Aspergillus niger (CBS 109.713) e di endo-1,4-beta-glucanasi prodotto da Aspergillus
    niger (DSM 18404) come additivo per mangimi per galline ovaiole (titolare dell'autorizzazione
    BASF SE)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1070/2014 ( 2014. gada 10. oktobris
    ), ar ko groza Regulu (EK) Nr. 271/2009 attiecībā uz no Aspergillus niger iegūtas
    endo-1,4-beta-ksilanāzes (CBS 109.713) un no Aspergillus niger iegūtas endo-1,4-beta-glikanāzes
    (DSM 18404) preparātu kā barības piedevas dējējvistām minimālo saturu (atļaujas
    turētājs BASF SE )
  type: main
- language: lt
  script: Latn
  content: 2014 m. spalio 10 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1070/2014,
    kuriuo dėl endo-1,4-beta-ksilanazės, gaunamos iš Aspergillus niger (CBS 109.713),
    ir endo-1,4-beta-gliukanazės, gaunamos iš Aspergillus niger (DSM 18404), preparato,
    naudojamo kaip vištoms dedeklėms skirto pašarų priedo (leidimo turėtojas
    – bendrovė BASF SE), mažiausio kiekio iš dalies keičiamas Reglamentas (EB)
    Nr. 271/2009
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) Nru 1070/2014 tal-
    10 ta' Ottubru 2014 li jemenda r-Regolament (KE) Nru 271/2009 fir-rigward tal-kontenut
    minimu tal-preparazzjoni ta' endo-1,4-beta-ksilanażi prodotta minn Aspergillus
    niger (CBS 109.713) u endo-1,4-beta-glukanażi prodotta minn Aspergillus niger
    (DSM 18404) bħala addittiv fl-għalf għat-tiġieġ tal-bajd (id-detentur tal-awtorizzazzjoni
    BASF SE)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1070/2014 van de Commissie van 10 oktober
