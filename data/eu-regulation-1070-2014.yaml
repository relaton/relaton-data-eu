    přípravku endo-1,4-beta-xylanázy z Aspergillus niger (CBS 109.713) a endo-1,4-beta-glukanázy
    z Aspergillus niger (DSM 18404) jako doplňkové látky pro nosnice (držitel
    povolení BASF SE)
  type: main
