    prípravku z endo-1,4- β -xylanázy produkovanej hubou Aspergillus niger (CBS
    109.713) a endo-1,4- β -glukanázy produkovanej hubou Aspergillus niger (DSM
    18404) ako kŕmnej doplnkovej látky pre nosnice (držiteľ povolenia BASF SE)
  type: main
