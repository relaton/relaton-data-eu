  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 1070/2014, 10. oktoober 2014 , millega
    muudetakse määrust (EÜ) nr 271/2009 seoses Aspergillus niger 'ist (CBS 109.713)
