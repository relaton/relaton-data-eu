    haltija BASF SE)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 1070/2014 оd 10. listopada 2014. o
    izmjeni Uredbe (EZ) br. 271/2009 u pogledu najmanje dopuštene količine pripravka
    endo-1,4-beta-ksilanaze dobivenog od Aspergillus niger (CBS 109.713) i endo-1,4-beta-glukanaze
    dobivenog od Aspergillus niger (DSM 18404) kao dodatka hrani za životinje za
    kokoši nesilice (nositelj odobrenja BASF SE)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság 1070/2014/EU végrehajtási rendelete ( 2014. október 10.
