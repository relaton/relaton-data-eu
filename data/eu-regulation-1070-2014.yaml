    legkippen (vergunninghouder BASF SE)
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) nr 1070/2014 z dnia 10 października
    2014 r. zmieniające rozporządzenie Komisji (UE) nr 271/2009 w odniesieniu do
