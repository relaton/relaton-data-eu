title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1070/2014 of 10 October 2014
    amending Regulation (EC) No 271/2009 as regards the minimum content of the preparation
    of endo-1,4-beta-xylanase produced by Aspergillus niger (CBS 109.713) and endo-1,4-beta-glucanase
    produced by Aspergillus niger (DSM 18404) as a feed additive for laying hens (holder
    of authorisation BASF SE)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) n ° 1070/2014 de la Commission du 10 octobre
    2014 modifiant le règlement (CE) n ° 271/2009 en ce qui concerne la teneur minimale
    de la préparation d''endo-1,4-bêta-xylanase produite par Aspergillus niger (CBS
    109.713) et d''endo-1,4-bêta-glucanase produite par Aspergillus niger (DSM 18404)
    en tant qu''additif pour l''alimentation des poules pondeuses (titulaire de l''autorisation:
    BASF SE)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) Nr. 1070/2014 der Kommission vom 10. Oktober
    2014 zur Änderung der Verordnung (EG) Nr. 271/2009 hinsichtlich des Mindestgehalts
    an der Zubereitung aus Endo-1,4-beta-Xylanase, gewonnen aus Aspergillus niger
    (CBS 109.713), und Endo-1,4-beta-Glucanase, gewonnen aus Aspergillus niger (DSM
    18404), als Zusatzstoff in Futtermitteln für Legehennen (Zulassungsinhaber: BASF
    SE)'
  type: main
- language: bg
  script: Cyrl
