title:
- language: en
  script: Latn
  content: '2001/861/EC: Commission Decision of 27 November 2001 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of Laminarin and Novaluron in Annex I to Council Directive
    91/414/EEC concerning the placing of plant-protection products on the market (Text
    with EEA relevance) (notified under document number C(2001) 3761)'
  type: main
- language: fr
  script: Latn
  content: '2001/861/CE: Décision de la Commission du 27 novembre 2001 reconnaissant
    en principe la conformité du dossier transmis pour examen détaillé en vue de
    l''inscription éventuelle de la laminarine et du novaluron à l''annexe I de
    la directive 91/414/CEE du Conseil concernant la mise sur le marché des produits
    phytopharmaceutiques (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2001) 3761]'
  type: main
- language: de
  script: Latn
  content: '2001/861/EG: Entscheidung der Kommission vom 27. November 2001 zur grundsätzlichen
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von Laminarin und Novaluron in Anhang I
    der Richtlinie 91/414/EWG des Rates über das Inverkehrbringen von Pflanzenschutzmitteln
    eingereicht wurden (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen
    K(2001) 3761)'
  type: main
