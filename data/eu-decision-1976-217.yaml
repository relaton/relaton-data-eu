title:
- language: en
  script: Latn
  content: '76/217/EEC: Commission Decision of 30 December 1975 extending for the
    Federal Republic of Germany in respect of a certain number of varieties the period
    after which seeds and propagating material of varieties of agricultural plant
    species are no longer subject to any marketing restrictions relating to variety'
  type: main
- language: fr
  script: Latn
  content: '76/217/CEE: Décision de la Commission, du 30 décembre 1975, visant à
    prolonger, en ce qui concerne la République fédérale d''Allemagne, le délai
    à l''expiration duquel les semences et plants de variétés des espèces de plantes
    agricoles ne sont plus soumis à aucune restriction de commercialisation quant
    à la variété, pour un certain nombre de variétés'
  type: main
- language: de
  script: Latn
  content: '76/217/EWG: Entscheidung der Kommission vom 30. Dezember 1975, die betreffend
    die Bundesrepublik Deutschland für einige Sorten die Frist verlängert, nach
    deren Ablauf Saat- und Pflanzgut von Sorten landwirtschaftlicher Pflanzenarten
    keinen Verkehrsbeschränkungen hinsichtlich der Sorte mehr unterliegt'
  type: main
- language: da
  script: Latn
  content: '76/217/EØF: Kommissionens Beslutning af 30. december 1975 om forlængelse,
    for så vidt angår Forbundsrepublikken Tyskland for et vist antal sorter, af
    den frist, ved udløbet af hvilken frø og formeringsmateriale af landbrugsplantearter
    ikke længere underkastes handelsrestriktioner med hensyn til sorten'
  type: main
- language: it
  script: Latn
  content: '76/217/CEE: Decisione della Commissione, del 30 dicembre 1975,che proroga,
    per quanto concerne la Repubblica federale di Germania, il termine alla scadenza
    del quale le sementi di piante di varietà delle specie di piante agricole non
    sono più soggette a restrizioni di commercializzazione per ciò che riguarda
    la varietà, per un certo numero di varietà'
  type: main
- language: nl
  script: Latn
  content: '76/217/EEG: Beschikking van de Commissie van 30 december 1975 houdende
    verlenging voor de Bondsrepubliek Duitsland van de termijn, na afloop waarvan
    zaaizaad en pootgoed van rassen van landbouwgewassen aan geen enkele handelsbeperking
    ten aanzien van het ras meer worden onderworpen'
  type: main
