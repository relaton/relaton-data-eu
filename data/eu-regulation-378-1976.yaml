id: EURegulation3781976
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 378/76 of 20 February 1976 amending for
    the third time Regulation (EEC) No 1143/74 as regards the amount of subsidies
    for wine products similar to the wine products exported under the label of 'Cyprus
    Sherry' produced in the Community as originally constituted and consigned to Ireland
    or to the United Kingdom during the period 1 January to 30 June 1976
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 378/76 de la Commission, du 20 février 1976, modifiant
    pour la troisième fois le règlement (CEE) n° 1143/74 en ce qui concerne le
    montant des aides pour les produits vinicoles similaires au produit exporté sous
    la mention "cyprus sherry" produits dans la Communauté dans sa composition originaire
    et expédiés au cours de la période allant du 1er janvier au 30 juin 1976 vers
    l'Irlande et le Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 378/76 der Kommission vom 20. Februar 1976 zur dritten
    Änderung der Verordnung (EWG) Nr. 1143/74 bezüglich der Höhe der Beihilfen
    für Weinbauerzeugnisse, die dem unter der Bezeichnung ,,Cyprus sherry" ausgeführten
    Weinbauerzeugnis gleichartig sind, in der Gemeinschaft in ihrer ursprünglichen
    Zusammensetzung erzeugt und in der Zeit vom 1. Januar bis 30. Juni 1976 nach Irland
    und dem Vereinigten Königreich ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 378/76 af 20. februar 1976 om den tredje
    ændring af forordning (EØF) nr. 1143/74 for så vidt angår størrelsen af støtte
    til vinprodukter, som svarer til vinprodukter, der udføres under betegnelsen
    »Cyprus Sherry«, og som er fremstillet inden for Fællesskabet i dets oprindelige
    udstrækning og afsendt til Irland og Det forenede Kongerige i tidsrummet fra
    den 1. januar til den 30. juni 1976
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 378/76 della Commissione, del 20 febbraio 1976, recante
    terza modifica del regolamento (CEE) n. 1143/74 per quanto riguarda l'importo
    degli aiuti per i prodotti vinicoli simili al prodotto vinicolo esportato con
    la menzione «Cyprus sherry», prodotti nella Comunità nella sua composizione
    originaria e spediti verso l'Irlanda e il Regno Unito nel periodo dal 1 gennaio
    al 30 giugno 1976
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 378/76 van de Commissie van 20 februari 1976 houdende
    derde wijziging van Verordening (EEG) nr. 1143/74 met betrekking tot het bedrag
    van de steun voor in de Gemeenschap in haar oorspronkelijke samenstelling geproduceerde
    wijnbouwprodukten van dezelfde aard als het wijnbouwprodukt dat onder de naam
    ,,Cyprus sherry" wordt uitgevoerd, die in de periode van 1 januari tot en met
    30 juni 1976 naar Ierland en het Verenigd Koninkrijk worden verzonden
  type: main
