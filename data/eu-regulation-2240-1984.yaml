title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2240/84 of 31 July 1984 re-establishing
    the levying of customs duties on women' s, girls' and infants' woven overcoats,
    raincoats, jackets and blazers, products of category 15 B (code 0155), originating
    in Singapore, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2240/84 de la Commission du 31 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux manteaux,
    imperméables et vestes, tissés, pour femmes, fillettes et jeunes enfants de
    la catégorie 15 B (code 0155), originaires de Singapour, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2240/84 der Kommission vom 31. Juli 1984 über die
    Wiedereinführung des Zollsatzes für Mäntel, Umhänge und Jacken aus Geweben,
    für Frauen, Mädchen und Kleinkinder, der Warenkategorie Nr. 15 B (Kennziffer
    0155) mit Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3570/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2240/84 af 31. juli 1984 om genindførelse
    af opkrævning af toldafgifter for frakker, jakker og blazere, vævede til kvinder,
    piger og småbørn, under varekategori nr. 51 B (kode 0155), som har oprindelse
    i Singapore og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2240/84 της Επιτροπής
    της 31ης Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα επανωφόρια,
    αδιάβροχα και σακκάκια υφασμένα, για γυναίκες,
    κορασίδες και μικρά παιδιά, προϊόντα της κατηγορίας
    15 Β (κωδικός 0155), καταγωγής Σιγκαπούρης, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3570/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2240/84 della Commissione del 31 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili ai cappotti, soprabiti e giacche,
    tessuti, per donna, per ragazza e per bambini, della categoria di prodotti n.
    15 B (codice 0155), originari di Singapore beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2240/84 van de Commissie van 31 juli 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op mantels,
    regenjassen en blazers en jasjes, geweven, van de categorie van produkten nr.
    15 B (codenummer 0155), van oorsprong uit Singapore waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
  type: main
