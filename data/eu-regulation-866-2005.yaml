  content: Council Regulation (EC) No 866/2005 of 6 June 2005 extending the definitive
    anti-dumping measures imposed by Regulation (EC) No 1470/2001 on imports of integrated
    electronic compact fluorescent lamps (CFL-i) originating in the People’s Republic
