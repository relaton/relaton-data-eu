title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 26/02/69, autorisant la République fédérale
    d'Allemagne à différer le relèvement du droit de son tarif national vers celui
    du Tarif douanier commun, en ce qui concerne l'importation de 21.000 tonnes d'aluminium
    brut
  type: main
- language: de
  script: Latn
  content: '69/85/EWG: Entscheidung der Kommission vom 26. Februar 1969, mit der die
    Bundesrepublik Deutschland ermächtigt wird, die Angleichung des Zollsatzes ihres
    nationalen Zolltarifs an den des Gemeinsamen Zolltarifs für die Einfuhr von 21
    000 Tonnen Rohaluminium aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '69/85/CEE: Decisione della Commissione, del 26 febbraio 1969, che, nel
    quadro di un contingente di 21.000 tonnellate di alluminio greggio, autorizza
    la Repubblica federale di Germania a differire l''innalzamento del dazio della
    sua tariffa nazionale al livello di quello della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '69/85/EEG: Beschikking van de Commissie van 26 februari 1969 waarbij de
    Bondsrepubliek Duitsland wordt gemachtigd de verhoging van het recht van haar
    nationale douanetarief naar het peil van het gemeenschappelijk douanetarief uit
    te stellen voor de invoer van 21.000 ton ruw aluminium'
  type: main
