  script: Latn
  content: '96/285/EC: Commission Decision of 12 April 1996 amending Decision 94/278/EC,
    drawing up a list of third countries from which Member States authorize the imports
    of certain products subject to Council Directive 92/118/EEC'
  type: main
- language: fr
  script: Latn
  content: '96/285/CE: Décision de la Commission, du 12 avril 1996, modifiant la
    décision 94/278/CE établissant la liste des pays tiers en provenance desquels
    les États membres autorisent l''importation de certains produits visés par la
    directive 92/118/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '96/285/EG: Entscheidung der Kommission vom 12. April 1996 zur Änderung
