title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3126/91 of 25 October 1991 amending Regulation
    (EEC) No 223/90 relating to the set-aside of arable land for non-food purposes
    referred to in Regulation (EEC) No 2328/91
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3126/91 DE LA COMMISSION du 25 octobre 1991 modifiant
    le règlement (CEE) no 223/90 en ce qui concerne les taux de cofinancement communautaire
    applicables à la mesure de retrait des terres à des fins non alimentaires visée
    par le règlement (CEE) no 2328/91 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3126/91 DER KOMMISSION vom 25. Oktober 1991 zur Änderung
    der Verordnung (EWG) Nr. 223/90 hinsichtlich der Sätze der gemeinschaftlichen
    Kofinanzierung für die Verwendung von Ackerflächen zu Nichtnahrungsmittelzwecken
    gemäß der Verordnung (EWG) Nr. 2328/91 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3126/91 af 25. oktober 1991 om ændring
    af forordning (EØF) nr. 223/90, for så vidt angår satserne for Fællesskabets
    medfinansiering af foranstaltningen med nedlæggelse af agerjord og anvendelse
    af jorden til andre formål end levnedsmiddelproduktion, omhandlet i forordning
    (EØF) nr. 2328/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3126/91 της Επιτροπής
    της 25ης Οκτωβρίου 1991 για την τροποποίηση του
    κανονισμού ( ΕΟΚ ) αριθ. 223/90 όσον αφορά τα ποσοστά
    της κοινοτικής συγχρηματοδότησης που εφαρμόζονται
    στα μέτρα σχετικά με την προσωρινή παύση καλλιέργειας
    γαιών για την χρησιμοποίησή τους στην παραγωγή
    προϊόντων που δεν προορίζονται για διατροφή,
    τα οποία αναφέρονται στον κανονισμό ( ΕΟΚ )
    αριθ. 2328/91
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 3126/91, annettu 25 päivänä lokakuuta 1991,
    asetuksen (ETY) N:o 223/90 muuttamisesta asetuksessa (ETY) N:o 2328/91 tarkoitettuun
    viljelymaan käyttämistä muuhun kuin elintarviketuotantoon koskevaan toimenpiteeseen
    sovellettavien yhteisön rahoitusosuuksien osalta
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3126/91 DELLA COMMISSIONE del 25 ottobre 1991 che
    modifica il regolamento (CEE) n. 223/90 per quanto concerne i tassi di cofinanziamento
    comunitario applicabili alle misure riguardanti il ritiro di seminativi dalla
    produzione e la loro destinazione a scopi non alimentari, di cui al regolamento
    (CEE) n. 2328/91 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3126/91 VAN DE COMMISSIE van 25 oktober 1991 tot
    wijziging van Verordening (EEG) nr. 223/90 ten aanzien van de percentages van
    de communautaire bijstand voor de in Verordening (EEG) nr. 2328/91 bedoelde maatregel
    inzake het uit produktie nemen van bouwland om het te gebruiken voor de teelt
    van niet-voedingsgewassen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3126/91 DA COMISSÃO de 25 de Outubro de 1991 que
    altera o Regulamento (CEE) no 223/90 no que diz respeito às taxas de co-financiamento
    comunitário aplicáveis à medida de retirada das terras para fins não alimentares
    a que diz respeito o Regulamento (CEE) no 2328/91 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3126/91 DE LA COMISIÓN de 25 de octubre de 1991 por
