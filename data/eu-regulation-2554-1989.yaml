    23 (lfd. Nr. 40.0230) mit Ursprung in Indonesien, dem die in der Verordnung (EWG)
    Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2554/89 af 23. august 1989 om genindførelse
