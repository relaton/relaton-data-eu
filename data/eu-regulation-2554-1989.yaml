title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2554/89 of 23 August 1989 re-establishing
    the levying of customs duties on yarn of staple or waste artificial fibres, products
    of category No 23 (order No 40.0230), originating in Indonesia to which the preferential
    tariff arrangements of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2554/89 de la Commission du 23 août 1989 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres artificielles discontinues de la catégorie de produits n° 23 (numéro
    d'ordre 40.0230) originaires de l'Indonésie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2554/89 DER KOMMISSION vom 23. August 1989 zur Wiedereinführung
