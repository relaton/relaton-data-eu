    καταγωγής Αλγερίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3545/81 del Consiglio, del 3 dicembre 1981, relativo
    alla conclusione dell' accordo sotto forma di scambio di lettere tra la Comunità
    economica europea e la Repubblica democratica popolare d' Algeria, che fissa,
    per il periodo 1° novembre 1981 - 31 ottobre 1982, l' importo aggiuntivo da detrarre
    dal prelievo applicabile all' importazione nella Comunità di olio di oliva non
    trattato originario dell' Algeria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3545/81 van de Raad van 3 december 1981 betreffende
    de sluiting van een Overeenkomst in de vorm van een briefwisseling tussen de Europese
    Economische Gemeenschap en de Democratische Volksrepubliek Algerije tot vaststelling,
    voor het tijdvak van 1 november 1981 tot en met 31 oktober 1982, van het aanvullend
    bedrag dat in mindering moet worden gebracht op de heffing die bij invoer in de
    Gemeenschap van toepassing is op niet-behandelde olijfolie van oorsprong uit Algerije
