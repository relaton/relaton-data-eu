title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 789/2007 of 4 July 2007 amending, for the
    eleventh time, Regulation (EC) No 1763/2004 imposing certain restrictive measures
    in support of effective implementation of the mandate of the International Criminal
    Tribunal for the former Yugoslavia (ICTY)
  type: main
- language: fr
  script: Latn
