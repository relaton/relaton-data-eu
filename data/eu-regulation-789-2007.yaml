    a anumitor măsuri restrictive în sprijinul punerii efective în aplicare a mandatului
    Tribunalului Penal Internațional pentru fosta Iugoslavie (TPII)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 789/2007 zo 4. júla 2007 , ktorým sa po jedenástykrát
