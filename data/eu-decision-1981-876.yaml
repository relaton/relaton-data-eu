title:
- language: en
  script: Latn
  content: '81/876/EEC: Commission Decision of 8 October 1981 establishing that the
    apparatus described as ''MKS transducer, model 223 A with power supply, model
    PDR-C-1 A, vacuum/pressure/flow/control, model 250 and control valve, model 251/50''
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/876/CEE: Décision de la Commission, du 8 octobre 1981, constatant
    que l''importation de l''appareil dénommé "MKS transducer, model 223 A with
    power supply, model PDR-C-1 A, vacuum/pressure/flow/control, model 250 and control
    valve, model 251-50" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '81/876/EWG: Entscheidung der Kommission vom 8. Oktober 1981, mit der festgestellt
    wird, daß das Gerät ,,MKS- Transducer, model 223 A with Power Supply, model
    PDR-C-1 A, Vacuum/Pressure/Flow/Control, model 250 and Control Valve, model 251-50"
    nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '81/876/EØF: Kommissionens beslutning af 8. oktober 1981 om fastslåelse
    af, at indførsel af apparatet "MKS- Transducer, model 223 A with Power Supply,
    model PDR-C-1 A, Vacuum/Pressure/Flow/Control, model 250 and Control Valve, model
    251-50" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '81/876/EOK: Απόφαση τής Επιτροπής τής 8ης Οκτωβρίου
    1981 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «MKS-Transducer, model 223 A with power supply,
    model PDR-C-1 A, vacuum/pressure/flow/control, model 250 and control valve, model
    251-50» δέν δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '81/876/CEE: Decisione della Commissione, dell''8 ottobre 1981, che stabilisce
    che l''importazione dell''apparecchio denominato "MKS transducer, model 223 A
    with power supply, model PDR-C-1 A, vacuum/pressure/flow/control, model 250 and
    control valve, model 251-50" non può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '81/876/EEG: Beschikking van de Commissie van 8 oktober 1981 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,MKS-Transducer, model 223 A with Power
    Supply, model PDR-C-1A, Vacuum/Pressure/Flow/Control, model 250 and Control Valve,
    model 251-50" niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
  type: main
