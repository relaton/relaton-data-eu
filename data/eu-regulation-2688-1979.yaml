title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2688/79 of 29 November 1979 re-establishing
    the levying of customs duties on yarn of synthetic textile fibres and other yarn
    of regenerated textile fibres, falling within subheading 51.01 A and B II and
    originating in developing countries, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2688/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques et autres fibres artificielles, etc., des sous-positions
    51.01 A et B II du tarif douanier commun, originaires des pays et territoires
    en voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2688/79 der Kommission vom 29. November 1979 zur Wiedereinführung
    des Zollsatzes für synthetische und künstliche Spinnfäden usw. der Tarifstellen
    51.01 A und B II mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 1195/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2688/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for garn af endeløse kemofibre, etc. under underposition
    51.01 A og B II, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2688/79 della Commissione, del 29 novembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di fibre tessili
    sintetiche ed artificiali continue, ecc., delle sottovoci doganali 51.01 A, B
    II, originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2688/79 van de Commissie van 29 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    synthetische of van kunstmatige continuvezels, enz. van post 51.01 A en B II,
    van oorsprong uit de ontwikkelingslanden en -gebieden ten behoeve waarvan bij
    Verordening (EEG) nr. 1195/79 van de Raad tariefpreferenties werden geopend
  type: main
