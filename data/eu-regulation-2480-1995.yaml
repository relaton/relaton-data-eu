  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2480/95 della Commissione, del 25 ottobre 1995, che
    modifica il regolamento (CE) n. 1501/95 che stabilisce modalità di applicazione
    del regolamento (CEE) n. 1766/92 del Consiglio, riguardo alla concessione delle
    restituzioni all'esportazione e alle misure da adottare in caso di turbative nel
    settore dei cereali
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2480/95 (1995. gada 25. oktobris), ar kuru groza
    Regulu (EK) Nr. 1501/95, ar ko paredz sīki izstrādātus noteikumus par to, kā
    piemērot Padomes Regulu (EEK) Nr. 1766/92 attiecībā uz labības eksporta kompensāciju
