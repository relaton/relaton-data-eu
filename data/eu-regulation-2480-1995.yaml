    reglamento (EEB) Nr. 1766/92 taikymo taisykles dėl eksporto grąžinamųjų išmokų
    už grūdus skyrimo ir priemonių, taikytinų esant trikdymams grūdų rinkoje
  type: main
- language: mt
  script: Latn
