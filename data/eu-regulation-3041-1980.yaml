title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3041/80 of 25 November 1980 fixing, in respect
    of certain maritime areas to the west of Scotland, the exact period, falling between
    1 October 1980 and 31 March 1981, when the use of trawls, Danish seines or similar
    nets as well as purse seines and ring nets is prohibited
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3041/80 de la Commission, du 25 novembre 1980, fixant,
    dans certaines zones maritimes à l' ouest de l' Écosse, la période exacte s'
    échelonnant du 1er octobre 1980 au 31 mars 1981, pendant laquelle l' utilisation
    de chaluts, de seines danoises ou filets similaires aussi bien que celle de seines
    tournantes ou de filets tournants est interdite
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3041/80 der Kommission vom 25. November 1980 über
    den genauen Zeitraum zwischen dem 1. Oktober 1980 und dem 31. März 1981, in dem
    in bestimmten Fischereigebieten westlich von Schottland die Verwendung von Schleppnetzen,
    Zugnetzen oder ähnlichen Netzen sowie Ringwaden und anderen Ringnetzen verboten
    ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3041/80 af 25. november 1980 om fastsættelse
    af den nøjagtige periode for visse havområder vest for Skotland mellem 1. oktober
    1980 og 31. marts 1981, i hvilken trawl, snurrevod eller lignende net samt snurpenot
    og ringnet ikke må anvendes
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3041/80 της Επιτροπής,
    της 25ης Νοεμβρίου 1980, περί καθορισμού σε ορισμένες
    θαλάσσιες ζώνες στα δυτικά της Σκωτίας, της
    επακριβούς περιόδου που εκτείνεται από 1ης
    Οκτωβρίου 1980 έως 31 Μαρτίου 1981, κατά τη διάρκεια
    της οποίας απαγορεύεται η χρήση τράτας διχτυών
    δανέζικης βιντσότρατας, ή παρόμοιων διχτυών
    καθώς και κυκλικών διχτυών τράτας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3041/80 della Commissione, del 25 novembre 1980, che
    determina, in talune zone marittime situate all' ovest della Scozia, il periodo
    preciso, che si estende dal 1° ottobre 1980 al 31 marzo 1981, durante il quale
    è vietato l' impiego di reti a strascico, di ciancioli danesi o reti analoghe
    nonché di ciancioli o di reti da circuizione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3041/80 van de Commissie van 25 november 1980 houdende
    vaststelling, voor bepaalde zeegebieden ten westen van Schotland, van de juiste
    periode tussen 1 oktober 1980 en 31 maart 1981 gedurende welke het gebruik van
    trawlnetten, Deense zegennetten (snurrevod) en soortgelijke netten, alsmede van
    ringzegens en andere ringnetten, verboden is
  type: main
