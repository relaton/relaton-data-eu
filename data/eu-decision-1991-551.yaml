title:
- language: en
  script: Latn
  content: '91/551/EEC: Commission Decision of 27 September 1991 calling upon the
    Kingdom of Spain to postpone the adoption of a draft regulation in respect of
    the labelling of confectionery containing polyalcohols (Only the Spanish text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/551/CEE: Décision de la Commission, du 27 septembre 1991, invitant
    le Royaume d''Espagne à surseoir à l''adoption d''un projet de réglementation
    concernant l''étiquetage de friandises contenant des polyoles (Le texte en langue
    espagnole est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '91/551/EWG: Entscheidung der Kommission vom 27. September 1991 mit der
    das Königreich Spanien aufgefordert wird, die Verabschiedung eines Entwurfs einer
    Regelung für die Etikettierung polyalkoholhaltiger Süßwaren zurückzustellen
    (Nur der spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/551/EØF: Kommissionens beslutning af 27. september 1991 om opfordring
    til Kongeriget Spanien om at udsætte vedtagelsen af et lovforslag vedrørende
    mærkning af slik med indhold af polyoler (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '91/551/ΕΟΚ: Απόφαση της Επιτροπής της 27ης
    Σεπτεμβρίου 1991 με την οποία καλείται το Βασίλειο
    της Ισπανίας να αναβάλει την έγκριση σχεδίου
    κανονισμού για την επισήμανση των μικρών γλυκισμάτων
    που περιέχουν πολυόλες (Το κείμενο στην ισπανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '91/551/CEE: Decisione della Commissione, del 27 settembre 1991, che invita
    il Regno di Spagna a rinviare l''adozione di un progetto di normativa concernente
    l''etichettatura di dolciumi contenenti polioli (Il testo in lingua spagnola è
    il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '91/551/EEG: Beschikking van de Commissie van 27 september 1991 houdende
    verzoek aan het Koninkrijk Spanje tot opschorting van de vaststelling van een
