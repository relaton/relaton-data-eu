  content: Council Implementing Decision of 22 December 2009 authorising the Republic
    of Austria to continue to apply a measure derogating from Article 168 of Directive
    2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution du Conseil du 22 décembre 2009 autorisant la République
    d'Autriche à proroger l'application d'une mesure dérogeant à l'article 168
    de la directive 2006/112/CE relative au système commun de taxe sur la valeur
    ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss des Rates vom 22. Dezember 2009 zur Ermächtigung
