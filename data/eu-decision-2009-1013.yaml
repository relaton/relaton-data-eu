  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit van de Raad van 22 december 2009 waarbij de Republiek
    Oostenrijk wordt gemachtigd een maatregel te blijven toepassen die afwijkt van
    artikel 168 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel
    van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady z dnia 22 grudnia 2009 r. upoważniająca Republikę
    Austrii do dalszego stosowania środka stanowiącego odstępstwo od art. 168 dyrektywy
    2006/112/WE w sprawie wspólnego systemu podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução do Conselho, de 22 de Dezembro de 2009 , que autoriza
    a República da Áustria a continuar a aplicar uma medida em derrogação ao artigo
    168. o da Directiva 2006/112/CE relativa ao sistema comum do imposto sobre o valor
    acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare a Consiliului din 22 decembrie 2009 de autorizare
    a Republicii Austria în vederea aplicării în continuare a unei măsuri de derogare
    de la articolul 168 din Directiva 2006/112/CE privind sistemul comun al taxei
    pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady z 22. decembra 2009 , ktorým sa Rakúskej
    republike povoľuje naďalej uplatňovať opatrenie odchyľujúce sa od článku
    168 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Odločba sveta z dne 22. decembra 2009 o dovoljenju Republiki Avstriji,
