    bosbouwkundig teeltmateriaal tot de handel toe te laten dat niet aan de eisen
    van Richtlijn 66/404/EEG van de Raad voldoet'
  type: main
- language: pt
  script: Latn
  content: '80/756/CEE: Decisão da Comissão, de 17 de Julho de 1980, que altera
    a Decisão 80/266/CEE que autoriza os Estados-membros a admitirem temporariamente
    a comercialização de materiais florestais de reprodução que não correspondem
    às exigências da Directiva 66/404/CEE do Conselho'
  type: main
- language: es
