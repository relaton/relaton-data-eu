title:
- language: en
  script: Latn
  content: '80/756/EEC: Commission Decision of 17 July 1980 amending Decision 80/266/EEC
    authorizing Member States to permit temporarily the marketing of forestry reproductive
    material not complying with requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '80/756/CEE: Décision de la Commission, du 17 juillet 1980, modifiant
    la décision 80/266/CEE autorisant les États membres à admettre temporairement
    la commercialisation de matériels forestiers de reproduction ne répondant pas
    aux exigences de la directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '80/756/EWG: Entscheidung der Kommission vom 17. Juli 1980 zur Änderung
    der Entscheidung 80/266/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinie
    66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '80/756/EØF: Kommissionens beslutning af 17. juli 1980 om ændring af
    beslutning 80/266/EØF om bemyndigelse til medlemsstaterne til midlertidigt at
    tillade handel med forstligt formeringsmateriale, der ikke opfylder kravene i
    Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '80/756/ΕΟΚ: Απόφαση τής Επιτροπής τής 17ης
    Ιουλίου 1980 περί τροποποιήσεως τής αποφάσεως
    80/226/ΕΟΚ «περί παροχής αδείας στά Κράτη μέλη
    νά αποδέχονται προσωρινά τήν εμπορία τού δασικού
    πολλαπλασιαστικού υλικού πού δέν ανταποκρίνεται
    στίς απαιτήσεις τής οδηγίας 66/404/ΕΟΚ τού Συμβουλίου»'
  type: main
- language: it
  script: Latn
  content: '80/756/CEE: Decisione della Commissione, del 17 luglio 1980, recante modifica
    della decisione 80/266/CEE, che autorizza gli Stati membri ad ammettere temporaneamente
    la commercializzazione di materiali di riproduzione di alcune specie forestali
    che non corrispondono alle esigenze della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '80/756/EEG: Beschikking van de Commissie van 17 juli 1980 tot wijziging
