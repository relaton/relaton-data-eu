title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2271/92 of 3 August 1992 re-establishing
    the levying of customs duties on products of category 5 (order No 40.0050), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2271/92 de la Commission du 3 août 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    5 (numéro d'ordre 40.0050) originaires de l'Inde, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2271/92 DER KOMMISSION vom 3. August 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie Nr. 5 (laufende Nummer 40.0050) mit
    Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2271/92 af 3. august 1992 om genindførelse
    af opkrævning af told for varer under kategori 5 (løbenummer 40.0050), som har
    oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2271/92 της Επιτροπής
    της 3ης Αυγούστου 1992 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    5 (αύξων αριθμός 40.0050), καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2271/92 DELLA COMMISSIONE del 3 agosto 1992 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti della categoria n. 5
    (numero d'' ordine 40.0050) originari dell'' india, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio; #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2271/92 VAN DE COMMISSIE van 3 augustus 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 5 (volgnummer 40.0050), van oorsprong uit India, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90 van de
    Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2271/92 DA COMISSÃO de 3 de Agosto de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria 5 (número
    de ordem 40.0050), originários da Índia, beneficiários das preferências pautais
    previstas no Regulamento (CEE) no 3832/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2271/92 DE LA COMISIÓN de 3 de agosto de 1992 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los productos de la categoría no 5 (número de orden 40.0050), originarios
    de la India, beneficiarios de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 3832/90 del Consejo #'
