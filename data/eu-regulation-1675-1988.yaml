title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1675/88 of 15 June 1988 derogating, in regard
    to the period of validity of import documents, from Regulation (EEC) No 1184/86
    laying down detailed rules for the mechanisms for controlling the quantities of
    certain products in the oils and fats sector released for consumption in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1675/88 de la Commission du 15 juin 1988 portant dispositions
    dérogatoires au règlement (CEE) n° 1184/86 arrêtant les modalités du régime
    de contrôle des quantités mises à la consommation au Portugal de certains produits
    du secteur des matières grasses, pour ce qui est de la durée de validité des
    documents d' importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1675/88 der Kommission vom 15. Juni 1988 zur Abweichung
    von der Verordnung (EWG) Nr. 1184/86 mit Durchführungsbestimmungen für das System
    der Kontrolle der in Portugal zum freien Verkehr abgefertigten Mengen bei bestimmten
    Erzeugnissen des Fettsektors hinsichtlich der Gültigkeitsdauer der Einfuhrbescheinigung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1675/88 af 15. juni 1988 om undtagelse
    fra forordning (EØF) nr. 1184/86 om gennemførelsesbestemmelserne for kontrolordningen
    vedrørende de mængder af visse produkter inden for fedtstofsektoren, der overgår
    til frit forbrug i Portugal, for så vidt angår importdokumenternes gyldighedsperiode
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1675/88 της Επιτροπής
    της 15ης Ιουνίου 1988 για παρεκκλιτικές διατάξεις
    στον κανονισμό (ΕΟΚ) αριθ. 1184/86 για τη θέσπιση
    των λεπτομερειών του καθεστώτος ελέγχου των
    ποσοτήτων που τίθενται στην κατανάλωση στην
    Πορτογαλία ορισμένων προϊόντων του τομέα των
    λιπαρών ουσιών όσον αφορά τη διάρκεια της ισχύος
    των πιστοποιητικών εισαγωγής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1675/88 della Commissione del 15 giugno 1988 recante
    deroga al regolamento (CEE) n. 1184/86 che stabilisce le modalità di applicazione
    del regime di controllo dei quantitativi di taluni prodotti del settore dei grassi
    immessi in consumo in Portogallo in ordine alla validità dei documenti di importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1675/88 van de Commissie van 15 juni 1988 houdende
    afwijkende bepalingen, voor wat de geldigheidsduur van de invoerdocumenten betreft,
    van Verordening (EEG) nr. 1184/86 tot vaststelling van de uitvoeringsbepalingen
    van de controleregeling met betrekking tot de hoeveelheden van bepaalde in Portugal
    in consumptie gebrachte produkten van de sector oliën en vetten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1675/88 da Comissão de 15 de Junho de 1988 que
    estabelece disposições derrogatórias ao Regulamento (CEE) n.° 1184/86 que
    adopta as regras de execução do regime de controlo das quantidades introduzidas
    no consumo em Portugal de determinados produtos do sector das matérias gordas
    no que respeita ao prazo de eficácia dos documentos de importação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1675/88 de la Comisión de 15 de junio de 1988 por
    el que se establecen disposiciones derogatorias del Reglamento (CEE) n° 1184/86
    por el que se adoptan las modalidades del régimen de control de las cantidades
    despachadas al consumo en Portugal de determinados productos del sector de las
    materias grasas, por lo que respecta al período de validez de los documentos
    de importación
  type: main
