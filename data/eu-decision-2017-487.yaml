id: EUDecision2017487
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/487 of 17 March 2017 amending
    Decision 2005/51/EC as regards the period during which soil contaminated by pesticides
    or persistent organic pollutants may be introduced into the Union for decontamination
    purposes (notified under document C(2017) 1693)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/487 de la Commission du 17 mars 2017 modifiant
    la décision 2005/51/CE en ce qui concerne la période pendant laquelle de la
    terre contaminée par des pesticides ou des polluants organiques persistants peut
    être introduite dans l'Union européenne à des fins de décontamination [notifiée
    sous le numéro C(2017) 1693]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/487 der Kommission vom 17. März 2017
    zur Änderung der Entscheidung 2005/51/EG hinsichtlich des Zeitraums, in dem von
    mit Pestiziden oder persistenten organischen Schadstoffen verseuchte Böden zu
    Dekontaminierungszwecken in die EU eingeführt werden dürfen (Bekannt gegeben
    unter Aktenzeichen C(2017) 1693)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/487 на Комисията
    от 17 март 2017 година за изменение на Решение
    2005/51/ЕО по отношение на периода, през който
    в Съюза може да бъде внасяна почва, заразена
    с пестициди или устойчиви органични замърсители,
    с цел обеззаразяване (нотифицирано под номер
    С(2017) 1693)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/487 ze dne 17. března 2017,
    kterým se mění rozhodnutí 2005/51/ES, pokud jde o období, během něhož
    může být zemina zamořená pesticidy nebo perzistentními organickými znečišťujícími
    látkami dovážena do Unie za účelem dekontaminace (oznámeno pod číslem
    C(2017) 1693)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/487 af 17. marts 2017
    om ændring af beslutning 2005/51/EF for så vidt angår den periode, hvor jord
    forurenet med pesticider eller persistente organiske miljøgifte kan indføres
    i Unionen med henblik på rensning (meddelt under nummer C(2017) 1693)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/487 της Επιτροπής,
    της 17ης Μαρτίου 2017, για την τροποποίηση της
    απόφασης 2005/51/ΕΚ όσον αφορά την περίοδο κατά
    τη διάρκεια της οποίας επιτρέπεται η εισαγωγή
    στην Ένωση χώματος μολυσμένου από παρασιτοκτόνα
    ή από ανθεκτικούς οργανικούς ρύπους προς απομόλυνση
    [κοινοποιηθείσα υπό τον αριθμό C(2017) 1693]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/487, 17. märts 2017, millega muudetakse
    otsust 2005/51/EÜ seoses ajavahemikuga, mille jooksul tohib tuua Euroopa Liitu
    pestitsiidide või püsivate orgaaniliste saasteainetega saastunud pinnast saastest
    puhastamise eesmärgil (teatavaks tehtud numbri C(2017) 1693 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/487, annettu 17 päivänä
    maaliskuuta 2017, päätöksen 2005/51/EY muuttamisesta siltä osin kuin on kyse
    ajanjaksosta, jonka kuluessa torjunta-aineiden tai pysyvien orgaanisten yhdisteiden
    saastuttamaa maa-ainesta saa tuoda unioniin dekontaminaatiotarkoituksiin (tiedoksiannettu
    numerolla C(2017) 1693)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/487 оd 17. ožujka 2017. o izmjeni
    Odluke 2005/51/EZ u pogledu razdoblja tijekom kojeg se tlo kontaminirano pesticidima
    ili postojanim organskim onečišćujućim tvarima smije unositi u Uniju za potrebe
    dekontaminacije (priopćeno pod brojem dokumenta C(2017) 1693)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/487 végrehajtási határozata (2017. március 17.)
    a 2005/51/EK határozatnak a peszticidek és a környezetben tartósan megmaradó
    szerves szennyező anyagok által szennyezett talajnak az Unióba, dekontaminálás
    céljára történő behozatalára engedélyezett időszak tekintetében történő
    módosításáról (az értesítés a C(2017) 1693. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/487 della Commissione, del 17 marzo 2017,
    che modifica la decisione 2005/51/CE per quanto riguarda il periodo durante il
    quale è possibile introdurre nell'Unione, a scopo di decontaminazione, terra
    contaminata da antiparassitari o da inquinanti organici persistenti [notificata
    con il numero C(2017) 1693]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/487 (2017. gada 17. marts), ar
    ko Lēmumu 2005/51/EK groza attiecībā uz periodu, kurā ar pesticīdiem vai
    noturīgiem organiskiem piesārņotājiem piesārņotu augsni var ievest Savienībā
    atsārņošanas nolūkā (izziņots ar dokumenta numuru C(2017) 1693)
  type: main
- language: lt
  script: Latn
  content: 2017 m. kovo 17 d. Komisijos įgyvendinimo sprendimas (ES) 2017/487, kuriuo
    dėl laikotarpio, kuriuo į Sąjungą leidžiama įvežti pesticidais ir patvariais
    organiniais teršalais užterštą dirvožemį, siekiant jį nukenksminti, iš
    dalies keičiamas Sprendimas 2005/51/EB (pranešta dokumentu Nr. C(2017) 1693)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/487 tas-17 ta'
    Marzu 2017 li temenda d-Deċiżjoni 2005/51/KE fir-rigward tal-perjodu li fih
    il-ħamrija li hija kkontaminata mill-pestiċidi jew minn sustanzi organiċi persistenti
    li jniġġsu, tista' tiġi introdotta fl-Unjoni għall-għanijiet ta' dekontaminazzjoni
    (notifikata bid-dokument C(2017) 1693)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/487 van de Commissie van 17 maart 2017 tot
    wijziging van Beschikking 2005/51/EG wat betreft de periode waarin door bestrijdingsmiddelen
    of persistente organische verontreinigende stoffen verontreinigde grond met het
    oog op reiniging in de Unie mag worden binnengebracht (Kennisgeving geschied onder
    nummer C(2017) 1693)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/487 z dnia 17 marca 2017 r. zmieniająca
    decyzję 2005/51/WE w odniesieniu do okresu, w jakim można wprowadzać do Unii
    glebę skażoną pestycydami lub trwałymi zanieczyszczeniami organicznymi w celu
    jej odkażenia (notyfikowana jako dokument nr C(2017) 1693)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/487 da Comissão, de 17 de março de 2017,
    que altera a Decisão 2005/51/CE no que diz respeito ao período durante o qual
    pode ser introduzido na União, para efeitos de descontaminação, solo contaminado
    com pesticidas ou poluentes orgânicos persistentes [notificada com o número
    C(2017) 1693]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/487 a Comisiei din 17 martie 2017
    de modificare a Deciziei 2005/51/CE cu privire la perioada în care pământul
    contaminat cu pesticide sau cu poluanți organici persistenți poate fi introdus
    în Uniune în scopul decontaminării [notificată cu numărul C(2017) 1693]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/487 zo 17. marca 2017, ktorým
    sa mení rozhodnutie 2005/51/ES, pokiaľ ide o obdobie, počas ktorého sa pôda
    kontaminovaná pesticídmi alebo perzistentnými organickými látkami môže
    zaviesť do Únie na účely dekontaminácie [oznámené pod číslom C(2017)
    1693]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/487 z dne 17. marca 2017 o spremembi
    Odločbe 2005/51/ES glede obdobja, v katerem se lahko za namene dekontaminacije
    v Unijo vnaša zemlja, onesnažena s pesticidi ali težko razgradljivimi organskimi
    snovmi (notificirano pod dokumentarno številko C(2017) 1693)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/487 de la Comisión, de 17 de marzo de
    2017, que modifica la Decisión 2005/51/CE en lo que respecta al período durante
    el cual puede introducirse en la Unión tierra contaminada con plaguicidas o contaminantes
    orgánicos persistentes a efectos de su descontaminación [notificada con el número
    C(2017) 1693]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/487 av den 17 mars 2017 om
    ändring av beslut 2005/51/EG vad gäller den period under vilken jord som förorenats
    av bekämpningsmedel eller långlivade organiska föroreningar får föras in
    till unionen för dekontaminering [delgivet med nr C(2017) 1693]
  type: main
