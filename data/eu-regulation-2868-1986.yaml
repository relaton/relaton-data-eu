    die Wiedereinführung des Zollsatzes für synthetische Spinnfäden der Warenkategorie
    Nr. 41 (Kennziffer 40.0410) mit Ursprung in Thailand, denen die in der Verordnung
    (EWG) Nr. 3600/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2868/86 af 16. september 1986 om genindførelse
