title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2868/86 of 16 September 1986 re-establishing
    the levying of customs duties on yarn of synthetic textile fibres (continuous),
    products of category 41 (code 40.0410), originating in Thailand, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3600/85
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2868/86 de la Commission du 16 septembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques continues de la catégorie de produits n° 41 (code
    40.0410), originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3600/85 du Conseil
  type: main
- language: de
  script: Latn
