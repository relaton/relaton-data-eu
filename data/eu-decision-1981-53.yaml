title:
- language: en
  script: Latn
  content: '81/53/EEC: Commission Decision of 19 January 1981 authorizing the French
    Republic not to apply Community treatment to colour television sets originating
    in Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/53/CEE: Décision de la Commission, du 19 janvier 1981, autorisant
    la République française à exclure du traitement communautaire les récepteurs
    de télévision en couleurs originaires de T''ai-wan (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/53/EWG: Entscheidung der Kommission vom 19. Januar 1981 zur Ermächtigung
    der Französischen Republik, aus Taiwan stammende Farb-Fernsehempfangsgeräte
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/53/EØF: Kommissionens beslutning af 19. januar 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage farvefjernsynsmodtagere
    med oprindelse i Taiwan (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/53/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης Ιανουαρίου
    1981 περί εξουσιοδοτήσεως τής Γαλλικής Δημοκρατίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    συσκευές λήψεως έγχρωμων εικόνων γιά τήν τηλεόραση
    καταγόμενες από τήν Ταϊβάν (Το κείμενο στην
    γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/53/CEE: Decisione della Commissione, del 19 gennaio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    per la televisione a colori originari di Taiwan (Il testo in lingua francese è
    il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/53/EEG: Beschikking van de Commissie van 19 januari 1981 houdende machtiging
