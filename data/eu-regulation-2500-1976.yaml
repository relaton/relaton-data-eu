type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2500/76 of 14 October 1976 re-establishing
    the levying of the customs duties on aniline and its salts, falling within subheading
    29.22 D ex I, originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2500/76 de la Commission, du 14 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables à l'aniline
    et ses sels, de la sous-position tarifaire 29.22 D EX I, originaires de Roumanie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2500/76 der Kommission vom 14. Oktober 1976 zur Wiedereinführung
    des Zollsatzes für Anilin und seine Salze der Tarifstelle 29.22 D ex I mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November
    1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2500/76 af 14. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for anilin samt salte deraf, under underposition
    29.22 D ex I, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2500/76 della Commissione, del 14 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili all'anilina e suoi sali,
    della sottovoce doganale 29.22 D ex I, originari della Romania, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2500/76 van de Commissie van 14 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op aniline en
    zouten daarvan van onderverdeling 29.22 D ex I, van oorsprong uit Roemenië, ten
    behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
