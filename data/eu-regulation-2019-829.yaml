    der Mitgliedstaaten, befristete Ausnahmen für amtliche Tests, für wissenschaftliche
    Zwecke oder für Bildungszwecke, Versuche, Sortenauslese bzw. Züchtungsvorhaben
    zuzulassen
  type: main
