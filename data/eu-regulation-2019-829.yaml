title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2019/829 of 14 March 2019 supplementing
    Regulation (EU) 2016/2031 of the European Parliament and of the Council on protective
    measures against pests of plants, authorising Member States to provide for temporary
    derogations in view of official testing, scientific or educational purposes, trials,
    varietal selections, or breeding
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2019/829 de la Commission du 14 mars 2019 complétant
    le règlement (UE) 2016/2031 du Parlement européen et du Conseil relatif aux
    mesures de protection contre les organismes nuisibles aux végétaux, autorisant
    les États membres à prévoir des dérogations temporaires compte tenu des analyses
    officielles, dans un but scientifique ou pédagogique, ou à des fins d'essai,
    de sélection variétale ou d'amélioration génétique
  type: main
- language: de
  script: Latn
