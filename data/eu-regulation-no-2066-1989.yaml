    Nr. 15 (lfd. Nr. 40.0150) mit Ursprung in Thailand, Kleider, für Frauen, der
    Warenkategorie Nr. 26 (lfd. Nr. 40.0260) mit Ursprung in Brasilien und lange Hosen,
    aus Gewirken, der Warenkategorie Nr. 28 (lfd. Nr. 40.0280) mit Ursprung in Malaysia,
    denen die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
