title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2066/89 of 10 July 1989 re-establishing
    the levying of customs duties on women's woven overcoats and raincoats, products
    of category No 15 (order No 40.0150), originating in Thailand, women's dresses,
    products of category No 26 (order No 40.0260), originating in Brazil, and trousers,
    knitted or crocheted, products of category No 28 (order No 40.0280), originating
    in Malaysia, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2066/89 de la Commission du 10 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux manteaux,
    imperméables, tissés, pour femmes, de la catégorie 15 (numéro d'ordre 40.0150),
    originaires de Thaïlande, aux robes pour femmes, de la catégorie 26 (numéro
    d'ordre 40.0260), originaires du Brésil, et aux pantalons, en bonneterie, de
    la catégorie 28 (numéro d'ordre 40.0280) originaires de Malaysia, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2066/89 DER KOMMISSION vom 10. Juli 1989 zur Wiedereinführung
