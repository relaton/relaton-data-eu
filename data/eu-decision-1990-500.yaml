title:
- language: en
  script: Latn
  content: '90/500/EEC: Commission Decision of 2 October 1990 amending decision 86/77/EEC
    approving certain food-aid operations carried out by humanitarian organisations
    and exempting them from monetary compensatory amounts (only the English text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/500/CEE: Décision de la Commission, du 2 octobre 1990, modifiant la
    décision 86/77/CEE relative à l''agrément d''opérations d''aide alimentaire
    réalisées par des organismes à but humanitaire, les dispensant de l''application
    des montants compensatoires monétaires (le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/500/EWG: Entscheidung der Kommission vom 2. Oktober 1990 zur Änderung
