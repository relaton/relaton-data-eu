    Organisationen und zu deren Freistellung von währungsausgleichsbeträgen (nur
    der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/500/EØF: Kommissionens beslutning af 2. oktober 1990 om ændring af
