title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1375/84 of 17 May 1984 amending Regulations
    (EEC) No 2191/81 and (EEC) No 2192/81 as regards the representative rate to be
    applied for the conversion into national currency of the aid for the purchase
    of butter by non-profit-making institutions and organizations and by the armed
    forces
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1375/84 de la Commission du 17 mai 1984 modifiant les
    règlements (CEE) no 2191/81 et (CEE) no 2192/81 en ce qui concerne le taux représentatif
    à appliquer pour la conversion en monnaie nationale de l' aide à l' achat de
    beurre par les institutions et les collectivités sans but lucratif et les forces
    armées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1375/84 der Kommission vom 17. Mai 1984 zur Änderung
    der Verordnungen (EWG) Nr. 2191/81 und (EWG) Nr. 2192/81 in bezug auf den anzuwendenden
    repräsentativen Kurs bei der Umrechnung der Beihilfe zum Ankauf von Butter durch
    gemeinnützige Einrichtungen und Streitkräfte in Landeswährung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1375/84 af 17. maj 1984 om ændring
    af forordning (EØF) nr. 2191/81 og 2192/81 for så vidt angår den repræsentative
    kurs, der skal anvendes ved omregning til national valuta af støtten til opkøb
    af smør foretaget af institutioner og samfund, der ikke arbejder med gevinst
    for øje, samt af de væbnede styrker
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1375/84 της Επιτροπής
    της 17ης Μαΐου 1984 για τροποποίηση των κανονισμών
    (ΕΟΚ) αριθ. 2191/81 και (ΕΟΚ) αριθ. 2192/81 όσον αφορά
    τον αντιπροσωπευτικό συντελεστή που εφαρμόζεται
    για τη μετατροπή σε εθνικό νόμισμα της ενίσχυσης
    για την αγορά βουτύρου από ιδρύματα και συλλόγους
    μη κερδοσκοπικού χαρακτήρα καθώς και από τις
    Ένοπλες Δυνάμεις
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1375/84 della Commissione del 17 maggio 1984 che modifica
    i regolamenti (CEE) n. 2191/81 e (CEE) n. 2192/81 per quanto riguarda il tasso
    rappresentativo da applicare per la conversione in moneta nazionale dell' aiuto
    concesso per il burro acquistato dalle istituzioni e collettività senza scopo
    di lucro, nonché dalle forze armate e corpi assimilati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1375/84 van de Commissie van 17 mei 1984 tot wijziging
    van de Verordeningen (EEG) nr. 2191/81 en (EEG) nr. 2192/81 met betrekking tot
    de representatieve koers die moet worden toegepast voor de omrekening in nationale
    munteenheid van de steun voor de aankoop van boter door instellingen en gemeenschappen
    zonder winstoogmerk en het leger
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1375/84 da Comissão, de 17 de Maio de 1984, que
    altera os Regulamentos (CEE) n.° 2191/81 e (CEE) n.° 2192/81 no que diz respeito
    à taxa representativa a aplicar para a conversão em moeda nacional da ajuda
    à compra de manteiga pelas instituições e colectividades sem fins lucrativos
    e pelas Forças Armadas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1375/84 de la Comisión, de 17 de mayo de 1984, por
    el que se modifican los Reglamentos (CEE) n° 2191/81 y (CEE) n° 2192/81 en lo
    referente al tipo representativo que se deberá aplicar para la conversión en
    moneda nacional de la ayuda para la compra de mantequilla por las instituciones
    y los organismos colectivos sin fin lucrativo y las fuerzas armadas
  type: main
