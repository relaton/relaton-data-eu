  script: Latn
  content: Commission Implementing Decision (EU) 2026/2141 of 25 September 2026 allowing
    the extension of the action taken by the Belgian Federal Public Service Health,
    Food Chain Safety and Environment permitting the making available on the market
    and use of the biocidal products Recrute Pro and Recrute HD in accordance with
    Regulation (EU) No 528/2012 of the European Parliament and of the Council (notified
    under document C(2026) 6678)
  type: main
- language: fr
  script: Latn
