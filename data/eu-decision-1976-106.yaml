title:
- language: en
  script: Latn
  content: Commission Decision of 18 December 1975 on the granting by the Guidance
    Section of the EAGGF to the Federal Republic of Germany of a payment on account
    in respect of expenditure incurred during 1973 on aids relating to the provision
    of socio-economic guidance for and the acquisition of occupational skills by persons
    engaged in agriculture
  type: main
- language: fr
  script: Latn
  content: '76/106/CEE: Décision de la Commission, du 18 décembre 1975, relative
    au versement par le FEOGA, section orientation, à la République fédérale d''Allemagne
    d''un acompte sur les dépenses effectuées pendant l''année 1973 pour les aides
    relatives à l''information socio- économique et à la qualification professionnelle
    des personnes travaillant dans l''agriculture'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Dezember 1975 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahre 1973 für
    die sozio-ökonomische Information und die berufliche Qualifikation der in der
    Landwirtschaft tätigen Personen geleisteten Ausgaben an die Bundesrepublik Deutschland
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. december 1975 om udbetaling gennem EUGFL,
    udviklingssektionen, til Forbundsrepublikken Tyskland af et acontobeløb for de
    udgifter, som er afholdt i løbet af året 1973 til støtte vedrørende social
    og erhvervsmæssig vejledning og faglige kvalifikationer hos de personer, som
    arbejder i landbruget
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 dicembre 1975, relativa al versamento
    da parte del FEAOG, sezione orientamento, alla Repubblica federale di Germania
    di un anticipo sulle spese effettuate durante il 1973 per gli aiuti concernenti
    l'informazione socio-economica e la qualificazione professionale delle persone
    che lavorano nell'agricoltura
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 december 1975 inzake de betaling door
    het E.O.G.F.L., afdeling Oriëntatie, aan de Bondsrepubliek Duitsland van een
    voorschot voor de gedurende het jaar 1973 gedane uitgaven voor de steun met betrekking
    tot de sociaal-economische voorlichting en de scholing van de personen die in
    de landbouw werkzaam zijn
  type: main
