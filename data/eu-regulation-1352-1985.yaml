title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1352/85 of 23 May 1985 re-establishing the
    levying of customs duties on certain men' s and boys' underpants and briefs, certain
    women' s, girls' and infants' knickers and briefs, products of category 13 (code
    40.0130), originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1352/85 de la Commission du 23 mai 1985 portant rétablissement
    de la perception des droits de douane applicables à certains slips et caleçons
    pour hommes et garçonnets et à certains slips et culottes pour femmes, fillettes
    et jeunes enfants, de la catégorie de produits no 13 (code 40.0130), originaires
    de Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1352/85 der Kommission vom 23. Mai 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Unterhosen und Slips, für Männer
    und Knaben, bestimmte Schlüpfer und dergleichen, für Frauen, Mädchen und Kleinkinder,
    der Warenkategorie Nr. 13 (Kennziffer 40.0130) mit Ursprung in Thailand, dem die
    in der Verordnung (EWG) Nr. 3563/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1352/85 af 23. maj 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte trusser og andre underbenklæder til
    mænd og drenge, bestemte trusser og andre underbenklæder til kvinder, piger
    og småbørn under varekateogri nr. 13 (kode 40.0130) som har oprindelse i Thailand
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1352/85 της Επιτροπής
    της 23ης Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    των τελωνειακών δασμών για ορισμένα σλιπ και
    εσώβρακα για άνδρες και παιδιά και για ορισμένα
    σλιπ και κυλότες για γυναίκες, κορασίδες και
    μικρά παιδιά, προϊόντα της κατηγορίας 13 (κωδικός
    40.0130), καταγωγής Ταϋλάνδης, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1352/85 della Commissione del 23 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad alcune mutande, mutandine e slip
    per uomo e per ragazzo, nonché per donna, per ragazza e per bambini, della categoria
    di prodotti n. 13 (codice 40.0130), originari della Tailandia beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1352/85 van de Commissie van 23 mei 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    slips en onderbroeken voor heren en jongens, bepaalde slips en broeken voor dames,
    meisjes en kinderen, van de categorie van produkten nr. 13 (codenummer 40.0130),
    van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3563/84 van de Raad
  type: main
