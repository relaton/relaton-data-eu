title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/473 of 31 March 2016 amending
    for the 244th time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with the ISIL (Da'esh) and Al-Qaeda organisations
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/473 de la Commission du 31 mars 2016
    modifiant pour la deux cent quarante-quatrième fois le règlement (CE) n° 881/2002
    du Conseil du 27 mai 2002 instituant certaines mesures restrictives spécifiques
    à l'encontre de certaines personnes et entités liées aux organisations EIIL
    (Daech) et Al-Qaida
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/473 der Kommission vom 31. März 2016
