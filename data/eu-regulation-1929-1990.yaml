title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1929/90 of 29 June 1990 derogating from the
    definition of the concept of "originating products" to take account of the special
    situation of the Netherlands Antilles with regard to chemical-proof overalls falling
    within CN code 6210 10 99
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1929/90 du Conseil du 29 juin 1990 portant dérogation
    à la définition de la notion de produits originaires pour tenir compte de la
    situation particulière des Antilles néerlandaises en ce qui concerne les combinaisons
    de protection contre les substances chimiques relevant du code NC 6210 10 99
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1929/90 DES RATES vom 29. Juni 1990 zur Abweichung
    von der Begriffsbestimmung fuer "Ursprungswaren" zur Beruecksichtigung der besonderen
    Lage der Niederlaendischen Antillen hinsichtlich chemisch bestaendiger Latzhosen
    des KN-Codes 6210 10 99
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1929/90 af 29. juni 1990 om undtagelse fra
    definitionen af begrebet "varer med oprindelsesstatus" for at tage hensyn til
    De Nederlandske Antillers særlige situation for så vidt angår kemikaliebestandige
    overalls henhørende under KN- kode 6210 10 99
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1929/90 του Συμβουλίου
    της 29ης Ιουνίου 1990 για την παροχή παρέκκλισης
    από τον ορισμό της έννοιας των " προϊόντων καταγωγής
    " ώστε να ληφθεί υπόψη η ειδική περίπτωση των
    Ολλανδικών Αντιλλών όσον αφορά τις φόρμες
    προστασίας από χημικούς παράγοντες που υπάγονται
    στον κωδικό ΣΟ 6210 10 99
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1929/90 DEL CONSIGLIO del 29 giugno 1990 recante deroga
    alla definizione di " prodotti originari " per tener conto della particolare situazione
    delle Antille olandesi per quanto concerne tute resistenti a prodotti chimici
    del codice NC 6210 10 99
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1929/90 VAN DE RAAD van 29 juni 1990 houdende afwijking
    van de definitie van het begrip "produkten van oorsprong" in verband met de bijzondere
    situatie van de Nederlandse Antillen ten aanzien van overalls voor bescherming
    tegen chemische stoffen van GN-code 6210 10 99
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1929/90 DO CONSELHO de 29 de Junho de 1990 que derroga
    a definiçao da noçao de produtos originarios para tomar em consideraçao a situaçao
    especial das Antilhas Holandesas em relaçao aos fatos-macaco à prova de produtos
    quimicos do codigo NC 6210 10 99
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1929/90 DEL CONSEJO de 29 de junio de 1990 por el que
    se establece una excepcion a la definicion del concepto de " productos originarios
    " para tomar en consideracion la situacion especial de las Antillas Neerlandesas
    en relacion con los monos de trabajo resistentes a los productos quimicos del
    codigo NC 6210 10 99
  type: main
