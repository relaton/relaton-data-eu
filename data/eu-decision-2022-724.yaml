    2021/953 európai parlamenti és tanácsi rendelettel összhangban kiállított
    igazolványokkal való egyenértékűségének az Unión belüli szabad mozgáshoz
    való jog előmozdítása céljából történő megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/724 della Commissione del 10 maggio 2022
    che stabilisce l’equivalenza, al fine di agevolare il diritto di libera circolazione
    all’interno dell’Unione, dei certificati COVID-19 rilasciati dalla Repubblica
    delle Seychelles ai certificati rilasciati in conformità del regolamento (UE)
    2021/953 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/724 (2022. gada 10. maijs), ar
