title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/724 of 10 May 2022 establishing
    the equivalence, for the purpose of facilitating the right of free movement within
    the Union, of COVID-19 certificates issued by the Republic of Seychelles to the
    certificates issued in accordance with Regulation (EU) 2021/953 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/724 de la Commission du 10 mai 2022
    établissant l’équivalence, aux fins de faciliter l’exercice du droit à
    la libre circulation au sein de l’Union, des certificats COVID-19 délivrés
    par la République des Seychelles avec les certificats délivrés conformément
    au règlement (UE) 2021/953 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/724 der Kommission vom 10. Mai 2022 zur
    Feststellung der Gleichwertigkeit der von der Republik Seychellen ausgestellten
    COVID-19-Zertifikate mit den nach der Verordnung (EU) 2021/953 des Europäischen
    Parlaments und des Rates ausgestellten Zertifikaten zwecks Erleichterung der Ausübung
    des Rechts auf Freizügigkeit innerhalb der Union
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/724 на Комисията
    от 10 май 2022 година за установяване на равностойност,
    с цел улесняване на упражняването на правото
    на свободно движение в рамките на Съюза, на
    сертификатите за COVID-19, издадени от Република
    Сейшели, със сертификатите, издадени в съответствие
    с Регламент (ЕС) 2021/953 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/724 ze dne 10. května 2022,
    kterým se za účelem usnadnění práva na volný pohyb v rámci Unie stanoví
    rovnocennost certifikátů týkajících se onemocnění COVID-19 vydaných Seychelskou
    republikou a certifikátů vydaných v souladu s nařízením Evropského parlamentu
    a Rady (EU) 2021/953
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/724 af 10. maj 2022 om
    ækvivalens mellem de covid-19-certifikater, der udstedes af Republikken Seychellerne,
    og de certifikater, der udstedes i overensstemmelse med Europa-Parlamentets og
    Rådets forordning (EU) 2021/953, med henblik på at lette udøvelsen af retten
    til fri bevægelighed inden for Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/724 της Επιτροπής
    της 10ης Μαΐου 2022 για τη θέσπιση της ισοδυναμίας,
    με σκοπό τη διευκόλυνση του δικαιώματος ελεύθερης
    κυκλοφορίας εντός της Ένωσης, των πιστοποιητικών
