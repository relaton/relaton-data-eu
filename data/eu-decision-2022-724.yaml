  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/724 van de Commissie van 10 mei 2022 houdende
    vaststelling van de gelijkwaardigheid, teneinde het recht van vrij verkeer binnen
    de Unie te faciliteren, van door de Republiek der Seychellen afgegeven COVID-19-certificaten
    met de overeenkomstig Verordening (EU) 2021/953 van het Europees Parlement en
    de Raad afgegeven certificaten
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/724 z dnia 10 maja 2022 r. ustanawiająca
    równoważność, w celu ułatwienia korzystania z prawa do swobodnego przemieszczania
    się w Unii, zaświadczeń COVID-19 wydawanych przez Republikę Seszeli z zaświadczeniami
    wydawanymi zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2021/953
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/724 da Comissão de 10 de maio de 2022
    que estabelece a equivalência, a fim de facilitar o exercício do direito de
    livre circulação na União, dos certificados COVID-19 emitidos pela República
    das Seicheles aos certificados emitidos em conformidade com o Regulamento (UE)
    2021/953 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/724 a Comisiei din 10 mai 2022
    de stabilire, în scopul de a facilita exercitarea dreptului la liberă circulație
    pe teritoriul Uniunii, a echivalenței certificatelor privind COVID-19 eliberate
    de Republica Seychelles cu certificatele eliberate în conformitate cu Regulamentul
    (UE) 2021/953 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/724 z 10. mája 2022, ktorým
    sa na účely uľahčenia práva na voľný pohyb v rámci Únie stanovuje rovnocennosť
    potvrdení súvisiacich s ochorením COVID-19 vydávaných Seychelskou republikou
    s potvrdeniami vydávanými v súlade s nariadením Európskeho parlamentu a Rady
    (EÚ) 2021/953
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/724 z dne 10. maja 2022 o določitvi
    enakovrednosti COVID-19 potrdil, ki jih izdaja Republika Sejšeli, in potrdil,
    izdanih v skladu z Uredbo (EU) 2021/953 Evropskega parlamenta in Sveta, da se
    olajša uveljavljanje pravice do prostega gibanja v Uniji
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/724 de la Comisión de 10 de mayo de
    2022 por la que se establece la equivalencia, a fin de facilitar el derecho a
    la libre circulación dentro de la Unión, entre los certificados COVID-19 expedidos
    por la República de Seychelles y los expedidos de conformidad con el Reglamento
    (UE) 2021/953 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/724 av den 10 maj 2022 om fastställande,
