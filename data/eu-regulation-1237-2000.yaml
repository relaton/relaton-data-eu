    minimumprijs en van het bedrag van de productiesteun voor perziken op siroop en/of
    op natuurlijk vruchtensap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1237/2000 da Comissão, de 14 de Junho de 2000, que
    fixa, para a campanha de comercialização de 2000/01, o preço mínimo a pagar
    aos produtores pelos pêssegos e o montante da ajuda à produção para os pêssegos
    em calda e/ou em sumo natural de frutas
  type: main
- language: es
