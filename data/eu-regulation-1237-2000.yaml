    des den Erzeugern für Pfirsiche zu zahlenden Mindestpreises und der für die
    Produktion von Pfirsichen in Sirup und/oder natürlichem Fruchtsaft zu gewährenden
    Beihilfe für das Wirtschaftsjahr 2000/01
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1237/2000 af 14. juni 2000 om fastsættelse
    for produktionsåret 2000/01 af den minimumspris, der skal betales producenterne
    for ferskner, samt produktionsstøtten for ferskner i sukkeropløsning og/eller
    i naturlig frugtsaft
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1237/2000 της Επιτροπής,
    της 14ης Ιουνίου 2000, για καθορισμό, για την περίοδο
    2000/2001, της ελάχιστης τιμής που καταβάλλεται
    στους παραγωγούς για τα ροδάκινα, και περί
    του ποσού της ενίσχυσης στην παραγωγή για τα
    διατηρημένα ροδάκινα σε σιρόπι ή/και σε φυσικό
    χυμό φρούτων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1237/2000, annettu 14 päivänä kesäkuuta 2000,
    tuottajille persikoista maksettavan vähimmäishinnan sekä sokeriliemeen ja/tai
    omaan liemeen säilöttyjen persikoiden tuotantotuen määrän vahvistamisesta
    markkinointivuodeksi 2000/2001
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1237/2000 della Commissione, del 14 giugno 2000, che
    fissa, per la campagna di commercializzazione 2000/2001, il prezzo minimo da pagare
    ai produttori di pesche e l'importo dell'aiuto alla produzione per le pesche sciroppate
    e/o conservate nel succo naturale di frutta
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1237/2000 van de Commissie van 14 juni 2000 tot vaststelling,
