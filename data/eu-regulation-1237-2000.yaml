title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1237/2000 of 14 June 2000 fixing for the
    2000/2001 marketing year the minimum price to be paid to producers for peaches
    and the amount of production aid for peaches in syrup and/or natural fruit juice
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1237/2000 de la Commission du 14 juin 2000 fixant le
    prix minimal à payer aux producteurs pour les pêches ainsi que le montant de
    l'aide à la production pour les pêches conservées au sirop et/ou au jus naturel
    de fruits, pour la campagne 2000/2001
  type: main
- language: de
  script: Latn
