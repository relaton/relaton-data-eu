    im Sektor Milch und Milcherzeugnisse nicht erhoben wird (Nur der griechische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/108/EØF: Kommissionens beslutning af 9. februar 1981 om ændring af
