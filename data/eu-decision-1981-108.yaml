  script: Latn
  content: '81/108/EEC: Commission Decision of 9 February 1981 amending Decision 77/711/EEC
    as regards the regions in which the co-responsibility levy introduced in respect
    of milk and milk products is not applicable (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/108/CEE: Décision de la Commission, du 9 février 1981, modifiant
    la décision 77/711/CEE en ce qui concerne les régions dans lesquelles le prélèvement
    de coresponsabilité instauré dans le secteur du lait et des produits laitiers
    n''est pas appliqué (Le texte en langue grecque est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/108/EWG: Entscheidung der Kommission vom 9. Februar 1981 zur Änderung
