title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2268/91 of 29 July 1991 derogating, for
    the 1990/91 marketing year, from certain time limits laid down in Regulation (EEC)
    No 2911/90 laying down detailed rules of application for aid for the production
    of dried grapes
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2268/91 DE LA COMMISSION du 29 juillet 1991 dérogeant
    pour la campagne 1990/1991 à certains délais prévus au règlement (CEE) no
    2911/90, fixant les modalités d'' application pour l'' octroi de l'' aide en
    faveur de la culture des raisins secs #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2268/91 DER KOMMISSION vom 29. Juli 1991 zur Abweichung
