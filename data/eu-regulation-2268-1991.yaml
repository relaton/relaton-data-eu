    für die Beihilfegewährung zugunsten des Anbaus bestimmter Sorten zur Trocknung
    bestimmter Weintrauben #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2268/91 af 29. juli 1991 om fravigelse
    for produktionsåret 1990/91 af visse frister, der er fastsat i forordning (EØF)
    nr. 2911/90 om gennemførelsesbestemmelser for ydelse af støtte for dyrkning
    af visse druesorter, der skal tørres
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2268/91 της Επιτροπής
    της 29ης Ιουλίου 1991 για παρέκκλιση, για την περίοδο
    1990/91, από ορισμένες προθεσμίες που προβλέπονται
    από τον κανονισμό (ΕΟΚ) αριθ. 2911/90 περί των λεπτομερειών
    εφαρμογής για τη χορήγηση ενίσχυσης για την
    καλλιέργεια ορισμένων ποικιλιών σταφυλιών
    που προορίζονται για αποξήρανση
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2268/91 DELLA COMMISSIONE del 29 luglio 1991 recante
    deroga, per la campagna 1990/1991, ad alcuni termini previsti dal regolamento
    (CEE) n. 2911/90 che stabilisce le modalità di applicazione per la concessione
    dell'' aiuto a favore della coltura di talune varietà di uve destinate all''
    essiccazione #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2268/91 VAN DE COMMISSIE van 29 juli 1991 houdende
    afwijking, voor het verkoopseizoen 1990/1991, van bepaalde termijnen die zijn
    vastgesteld bij Verordening (EEG) nr. 2911/90 tot vaststelling van de uitvoeringsbepalingen
    voor de toekenning van steun voor de teelt van bepaalde druivenrassen waarvan
    de druiven worden gedroogd #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2268/91 DA COMISSÃO de 29 de Julho de 1991 que derroga,
