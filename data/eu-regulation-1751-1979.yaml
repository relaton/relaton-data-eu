title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1751/79 of 8 August 1979 re-establishing
    the levying of customs duties on chamois-dressed leather, falling within heading
    No 41.06 and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1751/79 de la Commission, du 8 août 1979, portant
    rétablissement de la perception des droits de douane applicables aux cuirs et
    peaux chamoisés de la position tarifaire 41.06, originaires des pays en voie
    de développement bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1751/79 der Kommission vom 8. August 1979 zur Wiedereinführung
    des Zollsatzes für Sämischleder (Chamoisleder) der Tarifnummer 41.06, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1751/79 af 8. august 1979 om genindførelse
    af opkrævning af toldafgifter for semsgarvet læder (vaskeskind), henhørende
    under pos. 41.06 i den fælles toldtarif, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1751/79 della Commissione, dell' 8 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili a cuoio e pelli, scamosciati
    della voce 41.06 della tariffa doganale comune originari dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1751/79 van de Commissie van 8 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor zeemleer, van post 41.06,
    van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG)
    nr. 3156/78 van de Raad tariefpreferenties werden geopend
  type: main
