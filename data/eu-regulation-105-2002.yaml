title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 105/2002 of 18 January 2002 amending, for
    the eighth time, Council Regulation (EC) No 467/2001 prohibiting the export of
    certain goods and services to Afghanistan, strengthening the flight ban and extending
    the freeze of funds and other financial resources in respect of the Taliban of
    Afghanistan and repealing Regulation (EC) No 337/2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 105/2002 de la Commission du 18 janvier 2002 modifiant,
    pour la huitième fois, le règlement (CE) n° 467/2001 du Conseil interdisant
    l'exportation de certaines marchandises et de certains services vers l'Afghanistan,
    renforçant l'interdiction des vols et étendant le gel des fonds et d'autres
    ressources financières décidés à l'encontre des Taliban d'Afghanistan, et
    abrogeant le règlement (CE) n° 337/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 105/2002 der Kommission vom 18. Januar 2002 zur achten
    Änderung der Verordnung (EG) Nr. 467/2001 des Rates über das Verbot der Ausfuhr
    bestimmter Waren und Dienstleistungen nach Afghanistan, über die Ausweitung des
    Flugverbots und des Einfrierens von Geldern und anderen Finanzmitteln betreffend
    die Taliban von Afghanistan und zur Aufhebung der Verordnung (EG) Nr. 337/2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 105/2002 af 18. januar 2002 om ottende
    ændring af Rådets forordning (EF) nr. 467/2001 om forbud mod udførsel af visse
    varer og tjenesteydelser til Afghanistan, om styrkelse af flyveforbuddet og om
    udvidelse af indefrysningen af midler og andre økonomiske ressourcer over for
    Taliban i Afghanistan og om ophævelse af forordning (EF) nr. 337/2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 105/2002 της Επιτροπής,
    της 18ης Ιανουαρίου 2002, για την τροποποίηση,
    για όγδοη φορά, του κανονισμού (ΕΚ) αριθ. 467/2001
    του Συμβουλίου για την απαγόρευση της εξαγωγής
    ορισμένων αγαθών και υπηρεσιών στο Αφγανιστάν,
    την ενίσχυση της απαγόρευσης πτήσεων και την
    παράταση της δέσμευσης κεφαλαίων και άλλων
    οικονομικών πόρων όσον αφορά την Ταλιμπάν
    του Αφγανιστάν και την κατάργηση του κανονισμού
    (ΕΚ) αριθ. 337/2000
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 105/2002, annettu 18 päivänä tammikuuta 2002,
    Afganistaniin suuntautuvan tiettyjen tavaroiden ja palvelujen viennin kieltämisestä,
    Afganistanin Talebania koskevien lentokiellon ja varojen sekä muiden taloudellisten
    resurssien jäädyttämisen laajentamisesta ja asetuksen (EY) N:o 337/2000 kumoamisesta
    annetun neuvoston asetuksen (EY) N:o 467/2001 muuttamisesta kahdeksannen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 105/2002 della Commissione, del 18 gennaio 2002, che
    modifica per l'ottava volta il regolamento (CE) n. 467/2001 del Consiglio che
    vieta l'esportazione di talune merci e servizi in Afghanistan, inasprisce il divieto
    dei voli e estende il congelamento dei capitali e delle altre risorse finanziarie
    nei confronti dei talibani dell'Afghanistan, e abroga il regolamento (CE) n. 337/2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 105/2002 van de Commissie van 18 januari 2002 houdende
    achtste wĳziging van Verordening (EG) nr. 467/2001 van de Raad tot instelling
    van een verbod op de uitvoer van bepaalde goederen en diensten naar Afghanistan,
    tot versterking van het verbod op vluchten en verlenging van de bevriezing van
    tegoeden en andere financiële middelen ten aanzien van de Taliban van Afghanistan
    en tot intrekking van Verordening (EG) nr. 337/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 105/2002 da Comissão, de 18 de Janeiro de 2002,
    que altera, pela oitava vez, o Regulamento (CE) n.° 467/2001 do Conselho, que
    proíbe a exportação de certas mercadorias e de certos serviços para o Afeganistão,
    reforça a proibição de voos, prorroga o congelamento de fundos e de outros
    recursos financeiros aplicável aos talibã do Afeganistão e revoga o Regulamento
    (CE) n.° 337/2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 105/2002 de la Comisión, de 18 de enero de 2002, que
    modifica por octava vez el Reglamento (CE) n° 467/2001 del Consejo por el que
    se prohíbe la exportación de determinadas mercancías y servicios a Afganistán,
    se refuerza la prohibición de vuelos y se amplía la congelación de capitales
    y otros recursos financieros de los talibanes de Afganistán y por el que se deroga
    el Reglamento (CE) n° 337/2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 105/2002 av den 18 januari 2002 om ändring
    för åttonde gången av rådets förordning (EG) nr 467/2001 om förbud mot export
    av vissa varor och tjänster till Afghanistan, skärpning av flygförbudet och
    förlängning av spärrandet av tillgångar och andra finansiella medel beträffande
    talibanerna i Afghanistan och om upphävande av förordning (EG) nr 337/2000
  type: main
