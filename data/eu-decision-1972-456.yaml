title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 8 décembre 1972, relative à la méthode
    établissant le montant à déduire des aides payées en application de l'article
    10 du règlement (CEE) n 804/68 lorsque des aides sont également accordées au
    babeurre
  type: main
- language: de
  script: Latn
  content: '72/456/EWG: Entscheidung der Kommission vom 8. Dezember 1972 über die
    Methode zur Festsetzung der Beträge, die von den gemäß Artikel 10 der Verordnung
    (EWG) Nr. 804/68 gezahlten Beihilfen abzuziehen sind, wenn diese gleichzeitig
    für Buttermilch gewährt werden'
  type: main
- language: it
  script: Latn
  content: '72/456/CEE: Decisione della Commissione, dell''8 dicembre 1972, relativa
    al metodo di determinazione dell''importo da detrarre dagli aiuti pagati in applicazione
    dell''articolo 10 del regolamento (CEE) n. 804/68 quando siano concessi aiuti
    anche per il latticello'
  type: main
- language: nl
  script: Latn
  content: '72/456/EEG: Beschikking van de Commissie van 8 december 1972 betreffende
    de methode voor het berekenen van het bedrag dat wordt afgetrokken van de steun
    betaald ter uitvoering van artikel 10 van Verordening (EEG) nr. 804/68 wanneer
    de steun ook voor karnemelk wordt toegekend'
  type: main
