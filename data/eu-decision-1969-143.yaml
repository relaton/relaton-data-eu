title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 avril 1969 autorisant la République
    française à appliquer des mesures de protection au titre de l'article 115 alinéa
    1 du Traité, en ce qui concerne l'importation d'"animaux vivants de l'espèce
    ovine" et de "viande ovine", originaires des pays tiers et mis en libre pratique
    dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '69/143/EWG: Entscheidung der Kommission vom 24. April 1969, mit der die
    Französische Republik ermächtigt wird, nach Artikel 115 Absatz 1 des Vertrages
    Schutzmaßnahmen bei der Einfuhr von aus dritten Ländern stammenden und in anderen
    Mitgliedstaaten im freien Verkehr befindlichen "lebenden Schafen" und "Fleisch
    von Schafen" anzuwenden'
  type: main
- language: it
  script: Latn
  content: '69/143/CEE: Decisione della Commissione, del 24 aprile 1969, con cui si
    autorizza la Repubblica francese ad applicare delle misure di protezione ai sensi
    dell''articolo 115, paragrafo 1, del trattato, per quanto concerne l''importazione
    di «animali vivi della specie ovina» e di «carne ovina» originari dei paesi
    terzi ed immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '69/143/EEG: Beschikking van de Commissie van 24 april 1969 waarbij de
    Franse Republiek wordt gemachtigd om op grond van artikel 115, eerste alinea,
    van het Verdrag beschermende maatregelen toe te passen ten aanzien van de invoer
    van levende schapen en schapenvlees, van oorsprong uit derde landen en in andere
    Lid-Staten in het vrije verkeer gebracht'
  type: main
