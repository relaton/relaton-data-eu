---
id: EUDecision2020153
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/153 of 3 February 2020 prohibiting
    Lithuania to repeat granting authorisations under Article 53(1) of Regulation
    (EC) No 1107/2009 for the plant protection products containing the active substance
    thiamethoxam for use on spring rape against Phyllotreta spp. and/or Psylliodes
    spp. (notified under document C(2020) 464) (Only the Lithuanian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision D’exécution (UE) 2020/153 de la Commission du 3 février 2020
    interdisant à la Lituanie de renouveler l’octroi d’autorisations au titre
    de l’article 53, paragraphe 1, du règlement (CE) no 1107/2009 pour les produits
    phytopharmaceutiques contenant la substance active thiaméthoxame en vue de leur
    utilisation sur le colza de printemps afin de lutter contre Phyllotreta spp. ou
    Psylliodes spp. [notifiée sous le numéro C(2020) 464] (Le texte en langue lituanienne
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/153 der Kommission vom 3. Februar 2020
    über ein Verbot, mit dem Litauen die erneute Erteilung von Zulassungen gemäß
    Artikel 53 Absatz 1 der Verordnung (EG) Nr. 1107/2009 für Pflanzenschutzmittel
    mit dem Wirkstoff Thiamethoxam zur Anwendung bei Sommerraps gegen Phyllotreta
    spp. und/oder Psylliodes spp. untersagt wird (Bekannt gegeben unter Aktenzeichen
    C(2020) 464) (Nur der litauische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за Изпълнение (ЕС) 2020/153 на Комисията
    от 3 февруари 2020 година с което се забранява
    на Литва да издава отново разрешения съгласно
    член 53, параграф 1 от Регламент (ЕО) № 1107/2009 за
    продукти за растителна защита, съдържащи активното
    вещество тиаметоксам, за употреба върху пролетна
    репица срещу Phylloreta spp. и/или Psylliodes spp. (нотифицирано
    под номер C(2020) 464) (само текстът на литовски
    език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí Rozhodnutí Komise (EU) 2020/153 ze dne 3. února 2020, kterým
    se Litvě zakazuje opakovaně udělovat povolení podle čl. 53 odst. 1 nařízení
    (ES) č. 1107/2009 pro přípravky na ochranu rostlin obsahující účinnou látku
    thiamethoxam pro použití u řepky jarní proti škodlivým organismům Phyllotreta
    spp. a/nebo Psylliodes spp. (oznámeno pod číslem C(2020) 464) (Pouze litevské
    znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/153 af 3. februar 2020
    om forbud mod, at Litauen igen udsteder godkendelser i henhold til artikel 53,
    stk. 1, i forordning (EF) nr. 1107/2009 af plantebeskyttelsesmidler, der indeholder
    aktivstoffet thiamethoxam, til anvendelse på vårraps mod Phyllotreta spp. og/eller
    Psylliodes spp. (meddelt under nummer C(2020) 464) (Kun den litauiske udgave er
    autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2020/153 της Επιτροπής
    της 3ης Φεβρουαρίου 2020 η οποία απαγορεύει στη
    Λιθουανία να επαναλάβει τη χορήγηση αδειών
    σύμφωνα με το άρθρο 53 παράγραφος 1 του κανονισμού
    (ΕΚ) αριθ. 1107/2009 σε φυτοπροστατευτικά προϊόντα
    που περιέχουν τη δραστική ουσία thiamethoxam (θειαμεδοξάνη)
    για χρήση στην εαρινή κράμβη ενάντια στους
    επιβλαβείς οργανισμούς Phyllotreta spp. και/ή Psylliodes
    spp. [κοινοποιηθείσα υπό τον αριθμό C(2020) 464] (Το
    κείμενο στη λιθουανική γλώσσα είναι το μόνο
    αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/153, 3. veebruar 2020, millega keelatakse
    Leedul anda kooskõlas määruse (EÜ) nr 1107/2009 artikli 53 lõikega 1 uuesti
    luba toimeainet tiametoksaami sisaldavate taimekaitsevahendite kasutamiseks suvirapsi
    puhul Phyllotreta spp. ja/või Psylliodes spp. vastu (teatavaks tehtud numbri
    C(2020) 464 all) (Ainult leedukeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/153, annettu 3 päivänä
    helmikuuta 2020, Liettualle osoitettavasta kiellosta toistaa lupien myöntäminen
    asetuksen (EY) N:o 1107/2009 53 artiklan 1 kohdan nojalla tehoainetta tiametoksaami
    sisältäville kasvinsuojeluaineille käytettäväksi Brassica napus -kasvin pinnalla
    tuholaisten Phyllotreta spp. tai Psylliodes spp. torjuntaan (tiedoksiannettu numerolla
    C(2020) 464) (Ainoastaan liettuankielinen teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/153 оd 3. veljače 2020. o zabrani
    Litvi da ponovno izdaje odobrenja iz članka 53. stavka 1. Uredbe (EZ) br. 1107/2009
    za sredstva za zaštitu bilja koja sadržavaju aktivnu tvar tiametoksam za uporabu
    na proljetnoj repici protiv Phyllotreta spp. i/ili Psylliodes spp. (priopćeno
    pod brojem dokumenta C(2020) 464) (Vjerodostojan je samo tekst na litavskom jeziku)
  type: main
- language: hu
  script: Latn
  content: a Bizottság (EU) 2020/153 Végrehajtási Határozata (2020. február 3.)
    a tiametoxam hatóanyagot tartalmazó, a tavaszi repce esetében a Phyllotreta
    spp. és/vagy a Psylliodes spp. ellen használt növényvédő szerekre vonatkozó,
    az 1107/2009/EK rendelet 53. cikkének (1) bekezdése szerinti engedélyek Litvánia
    általi ismételt megadásának megtiltásáról (az értesítés a C(2020) 464.
    számú dokumentummal történt) (Csak a litván nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/153 della Commissione del 3 febbraio
    2020 che vieta alla Lituania di ripetere la concessione di autorizzazioni a norma
    dell'articolo 53, paragrafo 1, del regolamento (CE) n. 1107/2009 per i prodotti
    fitosanitari contenenti la sostanza attiva tiametoxam per l'uso sulla colza primaverile
    contro Phyllotreta spp e/o Psylliodes spp. [notificata con il numero C(2020) 464]
    (Il testo in lingua lituana è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas Lēmums (ES) 2020/153 (2020. gada 3. februāris),
    ar ko atbilstīgi Regulas (EK) Nr. 1107/2009 53. panta 1. punktam Lietuvai aizliedz
    atkārtoti piešķirt atļaujas augu aizsardzības līdzekļiem, kuri satur darbīgo
    vielu tiametoksāmu, lietošanai attiecībā uz vasaras rapsi pret Phyllotreta
    spp. un/vai Psylliodes spp. (izziņots ar dokumenta numuru C(2020) 464) (Autentisks
    ir tikai teksts lietuviešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos Įgyvendinimo Sprendimas (ES) 2020/153 2020 m. vasario 3 d. kuriuo
    Lietuvai draudžiama pagal Reglamento (EB) Nr. 1107/2009 53 straipsnio 1 dalį
    perregistruoti augalų apsaugos produktus, kurių sudėtyje yra veikliosios medžiagos
    tiametoksamo ir kurie skirti vasariniams rapsams apsaugoti nuo Phyllotreta spp.
    ir (arba) Psylliodes spp. (pranešta dokumentu Nr. C(2020) 464) (Tekstas autentiškas
    tik lietuvių kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/153 tat-3
    ta’ Frar 2020 li tipprojbixxi lil-Litwanja milli terġa’ tagħti awtorizzazzjonijiet
    skont l-Artikolu 53(1) tar-Regolament (KE) Nru 1107/2009 għall-prodotti għall-protezzjoni
    tal-pjanti li fihom is-sustanza attiva thiamethoxam għall-użu fuq il-lift tar-rebbiegħa
    kontra l-Phyllotreta spp. u/jew il-Psylloides spp. (notifikata bid-dokument C(2020)
    464) (It-test bil-Litwan biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/153 van de Commissie van 3 februari 2020 betreffende
    een verbod voor Litouwen om op grond van artikel 53, lid 1, van Verordening (EG)
    nr. 1107/2009 opnieuw toelatingen te verlenen voor gewasbeschermingsmiddelen met
    de werkzame stof thiamethoxam ter bestrijding van Phyllotreta spp. en/of Psylliodes
    spp. op zomerkoolzaad (kennisgeving geschied onder nummer C(2020) 464) (Slechts
    de tekst in de Litouwse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja Wykonawcza Komisji (UE) 2020/153 z dnia 3 lutego 2020 r. zakazująca
    Litwie ponownego udzielania zezwoleń, zgodnie z art. 53 ust. 1 rozporządzenia
    (WE) nr 1107/2009, na środki ochrony roślin zawierające substancję czynną
    tiametoksam do stosowania w odniesieniu do rzepaku przeciwko Phyllotreta spp.
    lub Psylliodes spp. (notyfikowana jako dokument nr C(2020) 464) (Jedynie tekst
    w języku litewskim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/153 da Comissão de 3 de fevereiro de
    2020 que proíbe a Lituânia de repetir a concessão de autorizações ao abrigo
    do artigo 53.o, n.o 1, do Regulamento (CE) n.o 1107/2009 para os produtos fitofarmacêuticos
    que contenham a substância ativa tiametoxame para utilização em colza de primavera
    contra Phyllotreta spp. e/ou Psylliodes spp. [notificada com o número C(2020)
    464] (Apenas faz fé o texto na língua lituana)
  type: main
- language: ro
  script: Latn
  content: Decizia de Punere în Aplicare (UE) 2020/153 a Comisiei din 3 februarie
    2020 prin care i se interzice Lituaniei să repete acordarea de autorizații în
    temeiul articolului 53 alineatul (1) din Regulamentul (CE) nr. 1107/2009 pentru
    produsele de protecție a plantelor care conțin substanța activă tiametoxam
    pentru utilizare pe rapița de primăvară împotriva Phyllotreta spp. și/sau
    Psilliodes spp. [notificată cu numărul C(2020) 464] (Numai textul în limba
    lituaniană este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie Rozhodnutie Komisie (EÚ) 2020/153 z 3. februára 2020, ktorým
    sa Litve zakazuje opakovane udeľovať autorizácie podľa článku 53 ods. 1
    nariadenia (ES) č. 1107/2009 pre prípravky na ochranu rastlín s obsahom účinnej
    látky tiametoxám na použitie pri repke olejke proti škodcom Phyllotreta spp.
    a/alebo Psylliodes spp. [oznámené pod číslom C(2020) 464] (Iba litovské znenie
    je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2020/153 z dne 3. februarja 2020 o prepovedi
    Litvi, da na podlagi člena 53(1) Uredbe (ES) št. 1107/2009 ponovno izda registracije
    fitofarmacevtskih sredstev, ki vsebujejo aktivno snov tiametoksam, za uporabo
    na spomladanski oljni repici proti Phyllotreta spp. in/ali Psylliodes spp. (notificirano
    pod dokumentarno številko C(2020) 464) (Besedilo v litovskem jeziku je edino
    verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/153 de la Comisión de 3 de febrero de
    2020 por la que se prohíbe a Lituania la concesión repetida de autorizaciones
    con arreglo al artículo 53, apartado 1, del Reglamento (CE) n.o 1107/2009 en
    relación con productos fitosanitarios que contienen la sustancia activa tiametoxam
    para su uso en la colza de primavera contra Phyllotreta spp. o Psylliodes spp.
    [notificada con el número C(2020) 464] (El texto en lengua lituana es el único
    auténtico)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2020/153 av den 3 februari 2020
    om förbud för Litauen att upprepa beviljandet av godkännanden enligt artikel
    53.1 i förordning (EG) nr 1107/2009 av växtskyddsmedel som innehåller det verksamma
    ämnet tiametoxam för användning på vårraps mot Phyllotreta spp. och/eller
    Psylliodes spp. [delgivet med nr C(2020) 464] (Endast den litauiska texten är
    giltig)
