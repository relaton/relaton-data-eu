    specialieji reikalavimai iš tam tikrų trečiųjų šalių importuojamiems tam
    tikriems maisto produktams, kurie gali būti užteršti aflatoksinais
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 274/2012 tas-
    27 ta’ Marzu 2012 li jemenda r-Regolament (KE) Nru 1152/2009 li jimponi kundizzjonijiet
    straordinarji għar-regolamentazzjoni tal-importazzjoni ta’ ċerti oġġetti
    tal-ikel minn ċerti pajjiżi terzi minħabba r-riskju ta’ kontaminazzjoni bl-aflatossini
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 274/2012 van de Commissie van 27 maart
    2012 tot wijziging van Verordening (EG) nr. 1152/2009 tot vaststelling van bijzondere
    voorwaarden voor de invoer van bepaalde levensmiddelen uit bepaalde derde landen
    in verband met het risico van verontreiniging met aflatoxinen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 274/2012 z dnia 27 marca 2012
    r. zmieniające rozporządzenie (WE) nr 1152/2009 nakładające specjalne warunki
    dotyczące przywozu niektórych środków spożywczych z niektórych państw trzecich
    w związku z ryzykiem zanieczyszczenia aflatoksynami
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 274/2012 da Comissão, de 27 de março
    de 2012 , que altera o Regulamento (CE) n. ° 1152/2009 que impõe condições
    especiais aplicáveis à importação de determinados géneros alimentícios provenientes
    de certos países terceiros devido ao risco de contaminação por aflatoxinas
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 274/2012 al Comisiei din 27
    martie 2012 de modificare a Regulamentului (CE) nr. 1152/2009 de impunere a unor
    condiții speciale aplicabile anumitor produse alimentare importate din anumite
    țări terțe din cauza riscurilor de contaminare a produselor respective cu aflatoxine
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 274/2012 z 27. marca 2012 , ktorým
    sa mení a dopĺňa nariadenie (ES) č. 1152/2009 o osobitných podmienkach dovozu
    určitých potravín z určitých tretích krajín v dôsledku rizika kontaminácie
    aflatoxínmi
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 274/2012 z dne 27. marca 2012 o spremembi
