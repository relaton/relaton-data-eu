    tuleneva saastamisohuga
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 274/2012, annettu 27 päivänä
    maaliskuuta 2012 , tietyistä kolmansista maista peräisin olevien tiettyjen elintarvikkeiden
    tuonnissa aflatoksiinipitoisuusriskien vuoksi käyttöön otettavista erityisehdoista
    annetun asetuksen (EY) N:o 1152/2009 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 274/2012 od 27. ožujka 2012. o izmjeni
