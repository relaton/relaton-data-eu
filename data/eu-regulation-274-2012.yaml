    podmínky dovozu některých potravin z některých třetích zemí v důsledku
    rizika kontaminace aflatoxiny
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 274/2012 af 27. marts
    2012 om ændring af forordning (EF) nr. 1152/2009 om indførelse af særlige betingelser
    for import af visse fødevarer fra visse tredjelande som følge af risiko for
    aflatoksinforurening
  type: main
- language: el
  script: Grek
