    kas piemērojami dažiem no konkrētām trešām valstīm importētiem pārtikas
    produktiem saistībā ar to piesārņojuma risku ar aflatoksīniem
  type: main
- language: lt
  script: Latn
  content: 2012 m. kovo 27 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 274/2012,
