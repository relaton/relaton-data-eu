title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 274/2012 of 27 March 2012 amending
    Regulation (EC) No 1152/2009 imposing special conditions governing the import
    of certain foodstuffs from certain third countries due to contamination risk by
    aflatoxins
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 274/2012 de la Commission du 27 mars
    2012 modifiant le règlement (CE) n ° 1152/2009 fixant des conditions particulières
    applicables à l’importation de certaines denrées alimentaires venant de certains
    pays tiers en raison du risque de contamination par les aflatoxines
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 274/2012 der Kommission vom 27. März
    2012 zur Änderung der Verordnung (EG) Nr. 1152/2009 mit Sondervorschriften für
    die Einfuhr bestimmter Lebensmittel aus bestimmten Drittländern wegen des Risikos
    einer Aflatoxin-Kontamination
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 274/2012 на Комисията
