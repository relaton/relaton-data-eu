    živil iz nekaterih tretjih držav, zaradi nevarnosti onesnaženja z aflatoksini
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 274/2012 de la Comisión, de 27 de marzo
    de 2012 , que modifica el Reglamento (CE) n ° 1152/2009 por el que se establecen
    condiciones específicas para la importación de determinados productos alimenticios
    de algunos terceros países debido al riesgo de contaminación de dichos productos
    por aflatoxinas
  type: main
- language: sv
  script: Latn
