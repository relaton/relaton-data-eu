  script: Latn
  content: Regolamento (CE) n. 1331/97 della Commissione del 10 luglio 1997 che deroga
    al regolamento (CE) n. 1223/94 della Commissione che stabilisce le modalità particolari
    di applicazione del regime dei titoli di fissazione anticipata per determinati
    prodotti agricoli esportati sotto forma di merci non comprese nell'allegato II
