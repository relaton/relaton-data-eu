    de execução do regime dos certificados de prefixação para certos produtos
    agrícolas exportados sob a forma de mercadorias não abrangidas pelo anexo II
    do Tratado, e ao Regulamento (CEE) nº 3665/87, que estabelece regras comuns de
    execução do regime das restituições à exportação para os produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1331/97 de la Comisión de 10 de julio de 1997 por
    el que se introduce una excepción al Reglamento (CE) nº 1223/94 por el que se
    establecen modalidades específicas de aplicación de régimen de los certificados
    de fijación anticipada para determinados productos agrícolas exportados en forma
    de mercancías no incluidas en el Anexo II del Tratado y por el que se introduce
    una excepción al Reglamento (CEE) nº 3665/87 por el que se establecen las modalidades
    comunes de aplicación del régimen de restituciones a la exportación de productos
    agrícolas
  type: main
- language: sv
  script: Latn
