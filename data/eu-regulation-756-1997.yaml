    avril 1997 pour certains produits à base de viande de porc dans le cadre du régime
    prévu par l'accord conclu par la Communauté avec la Slovénie peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 756/97 DER KOMMISSION vom 25. April 1997 über die
