  content: COMMISSION REGULATION (EC) No 756/97 of 25 April 1997 determining the extent
    to which applications lodged in April 1997 for import licences for certain pigmeat
    products under the regime provided for by the Agreement concluded by the Community
    with Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 756/97 DE LA COMMISSION du 25 avril 1997 déterminant
