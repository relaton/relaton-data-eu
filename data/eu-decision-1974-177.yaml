id: EUDecision1974177
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '74/177/EEC: Commission Decision of 21 December 1973 granting assistance
    from the European Social Fund, as provided for in Article 125 of the Treaty, to
    the French Republic for expenditure on vocational retraining and resettlement
    operations carried out by the Ministry of Labour, Employment and Population, the
    Ministry of Agriculture and the Ministry of War Victims'
  type: main
- language: fr
  script: Latn
  content: Décision 74/177/CEE de la Commission, du 21 décembre 1973, portant octroi
    du concours du Fonds social européen, prévu à l'article 125 du Traité, au
    bénéfice de la République française pour des dépenses relatives à des opérations
    de rééducation professionnelle et de réinstallation effectuées par le Ministère
    du travail, de l'emploi et de la population, le Ministère de l'agriculture et
    le Ministère des anciens combattants et victimes de guerre
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1973 zur Gewährung eines
    Zuschusses nach Artikel 125 EWGV aus dem Europäischen Sozialfonds an die Französische
    Republik zu Aufwendungen für vom "Ministère du travail, de l'emploi et de la
    population", vom "Ministère de l'agriculture" und vom "Ministère des anciens
    combattants et victimes de guerre" durchgeführte Berufsumschulungs- und Umsiedlungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1973 om ydelse af det i artikel
    125 i traktaten fastsatte tilskud fra Den europæiske Socialfond til Den franske
    Republik i forbindelse med omkostningerne vedrørende faglig omskoling og foranstaltninger
    i forbindelse med flytning, som er gennemført af "Ministère du Travail, de l'Emploi
    et de la Population" (ministeriet for arbejde, beskæftigelse og befolkning),
    af "Ministère de l'Agriculture" (landbrugsministeriet) og af "Ministère des
    anciens Combattants et Victimes de guerre" (ministeriet for krigsskaderamte)
  type: main
- language: it
  script: Latn
  content: '74/177/CEE: Decisione della Commissione, del 21 dicembre 1973, recante
    concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore della Repubblica francese per le spese concernenti
    operazioni di riqualificazione professionale e di nuova sistemazione effettuate
    dal «Ministère du travail, de l''emploi et de la population», dal «Ministère
    de l''agriculture» e dal «Ministère des anciens combattants et victimes de
    guerre»'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1973 houdende toekenning van
    een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel 125 van het
    Verdrag ten gunste van de Franse Republiek voor door het Ministerie van Arbeid,
    Werkgelegenheid en Bevolking, het Ministerie van Landbouw en het Ministerie van
    Oudstrijders en Oorlogsslachtoffers gemaakte herscholings- en verplaatsingskosten
  type: main
