  script: Latn
  content: '2003/245/EC: Commission Decision of 4 April 2003 on the requests received
    by the Commission to increase MAGP IV objectives to take into account improvements
    on safety, navigation at sea, hygiene, product quality and working conditions
    for vessels of more than 12 m in length overall (notified under document number
    C(2003) 1113)'
  type: main
- language: fr
  script: Latn
  content: '2003/245/CE: Décision de la Commission du 4 avril 2003 relative aux demandes
    reçues par la Commission d''accroître les objectifs du POP IV en vue d''améliorer
    la sécurité, la navigation en mer, l''hygiène, la qualité des produits et
    les conditions de travail pour les navires d''une longueur hors tout supérieure
    à 12 mètres [notifiée sous le numéro C(2003) 1113]'
  type: main
- language: de
  script: Latn
