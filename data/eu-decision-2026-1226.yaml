    de l’Iran à la guerre d’agression menée par la Russie contre l’Ukraine,
    ainsi qu’à des groupes armés et des entités au Moyen-Orient et dans la région
    de la mer Rouge, ainsi que des actions imputables à l’Iran qui compromettent
    la liberté de navigation au Moyen-Orient
  type: main
