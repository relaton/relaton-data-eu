title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2022/2425 of 5 December 2022 on the consistency
    of the performance targets contained in the revised draft performance plan submitted
    by Malta pursuant to Regulation (EC) No 549/2004 of the European Parliament and
    of the Council with the Union-wide performance targets for the third reference
    period (notified under document C(2022) 8743) (Only the English and Maltese texts
    are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2425 de la Commission du 5 décembre 2022 concernant
    la compatibilité des objectifs de performance contenus dans le projet de plan
    de performance révisé présenté par Malte en application du règlement (CE)
    no 549/2004 du Parlement européen et du Conseil avec les objectifs de performance
    à l’échelle de l’Union pour la troisième période de référence [notifiée
    sous le numéro C(2022) 8743] (Les textes en langues anglaise et maltaise sont
    les seuls faisant foi.)
  type: main
- language: de
  script: Latn
