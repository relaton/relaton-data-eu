    Kohärenz des gemäß der Verordnung (EG) Nr. 549/2004 des Europäischen Parlaments
    und des Rates von Malta vorgelegten überarbeiteten Leistungsplanentwurfs mit
    den unionsweit geltenden Leistungszielen für den dritten Bezugszeitraum (Bekannt
    gegeben unter Aktenzeichen C(2022) 8743) (Nur der englische und maltesische Text
    sind verbindlich)
  type: main
