  content: '91/278/EEC: Commission Decision of 2 May 1991 authorizing Germany to provide
    for exceptions from certain provisions of Council Directive 77/93/EEC, in respect
    of growing medium originating in the Soviet Union (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/278/CEE: Décision de la Commission du 2 mai 1991 autorisant l''Allemagne
    à prévoir des dérogations à certaines dispositions de la directive 77/93/CEE
    du Conseil pour un milieu de culture originaire de l''Union soviétique (Le texte
    en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 2. Mai 1991 zur Ermächtigung Deutschlands,
    für Nährsubstrat mit Ursprung in der UdSSR Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates vorzusehen (Nur der deutsche Text ist verbindlich)
    (91/278/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 2. maj 1991 om bemyndigelse af Tyskland til
    at fastsætte undtagelser fra visse bestemmelser i Rådets direktiv 77/93/EØF
    for så vidt angår vækstmedium med oprindelse i USSR (Kun den tyske udgave er
    autentisk) (91/278/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/278/ΕΟΚ: Απόφαση της Επιτροπής της 2ας Μαΐου
    1991 που επιτρέπει στη Γερμανία να προβλέπει
    παρεκκλίσεις από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ του Συμβουλίου, όσον αφορά το υπόστρωμα
    ανάπτυξης καταγωγής Σοβιετικής Ένωσης'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 2 maggio 1991 che autorizza la Germania
    a derogare a talune disposizioni della direttiva 77/93/CEE del Consiglio, per
    quanto riguarda il terreno di coltura originario dell'' URSS (Il testo in lingua
    tedesca è il solo facente fede) (91/278/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 2 mei 1991 tot machtiging van Duitsland
    om, met betrekking tot substraat van oorsprong uit de Sowjetunie, afwijkingen
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan (Slechts
    de tekst in de Duitse taal is authentiek) (91/278/EEG) #'
  type: main
