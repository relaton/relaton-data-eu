title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/256 of 13 February 2019 amending
    Implementing Regulation (EU) 2015/207 with regard to changes to the models for
    submission of the information on a major project, for the joint action plan, for
    the implementation reports for the Investment for growth and jobs goal and for
    the European territorial cooperation goal and correcting that Regulation with
    regard to data for the purpose of the performance review and performance framework
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/256 de la Commission du 13 février 2019
    modifiant le règlement (UE) 2015/207 en ce qui concerne les modèles de présentation
    des informations relatives aux grands projets, de plan d'action commun, de rapport
    de mise en œuvre pour les objectifs «Investissement pour la croissance et l'emploi»
    et «Coopération territoriale européenne», et rectifiant ce règlement en ce
    qui concerne les données aux fins de l'évaluation des performances et du cadre
    de performance
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/256 der Kommission vom 13. Februar 2019
    zur Änderung der Durchführungsverordnung (EU) 2015/207 im Hinblick auf Änderungen
    bei den Mustern für die Vorlage von Informationen zu einem Großprojekt, den
    gemeinsamen Aktionsplan, die Durchführungsberichte für das Ziel „Wachstum
    und Beschäftigung“ und das Ziel „Europäische territoriale Zusammenarbeit“
    sowie zur Berichtigung dieser Verordnung in Bezug auf die Daten für die Zwecke
    der Leistungsüberprüfung und den Leistungsrahmen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/256 на Комисията
    от 13 февруари 2019 година за изменение на Регламент
    (ЕС) 2015/207 чрез промени в образците за предоставяне
    на информация относно голям проект, съвместен
    план за действие, доклади за изпълнението по
    цел „Инвестиции за растеж и работни места“
    и по цел „Европейско териториално сътрудничество“,
    и за поправка на посочения регламент по отношение
    на данните за целите на прегледа на изпълнението
    и рамката на изпълнението
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/256 ze dne 13. února 2019, kterým
    se mění prováděcí nařízení (EU) 2015/207, pokud jde o změny vzorů pro
    předkládání informací o velkém projektu, pro společný akční plán, pro
    zprávy o provádění pro cíl Investice pro růst a zaměstnanost a pro cíl
    Evropská územní spolupráce, a kterým se uvedené nařízení opravuje, pokud
    jde o údaje pro účely přezkumu výkonnosti a výkonnostního rámce
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/256 af 13. februar 2019
    om ændring af gennemførelsesforordning (EU) 2015/207 for så vidt angår ændringer
    til modeller for indsendelse af oplysninger om et stort projekt, den fælles handlingsplan,
    gennemførelsesrapporterne vedrørende målet om investeringer i vækst og beskæftigelse
    og målet om europæisk territorialt samarbejde og om berigtigelse af samme forordning
    for så vidt angår data vedrørende resultatgennemgangen og resultatrammen
  type: main
