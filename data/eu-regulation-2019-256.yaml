    tar-rieżami tal-prestazzjoni u l-qafas tal-prestazzjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/256 van de Commissie van 13 februari 2019
    tot wijziging van Uitvoeringsverordening (EU) 2015/207 met betrekking tot wijzigingen
    van de modellen voor de indiening van de informatie over een groot project, het
    gezamenlijke actieplan, de uitvoeringsverslagen voor de doelstelling „investeren
    in groei en werkgelegenheid” en de doelstelling „Europese territoriale samenwerking”
    en tot rectificatie van die verordening met betrekking tot gegevens voor de evaluatie
    van de prestaties en het prestatiekader
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/256 z dnia 13 lutego 2019
    r. zmieniające rozporządzenie wykonawcze (UE) 2015/207 w odniesieniu do zmian
    wzorów służących do przekazywania informacji na temat dużych projektów wspólnego
    planu działania, do sprawozdań z wdrażania w ramach celów „Inwestycje na
    rzecz wzrostu i zatrudnienia” oraz „Europejska współpraca terytorialna”,
    a także wzorów sprawozdania z postępów i rocznych sprawozdań z kontroli oraz
    poprawiające to rozporządzenie w odniesieniu do danych do celów przeglądu
    skuteczności działania i ram wykonania
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/256 da Comissão, de 13 de fevereiro
    de 2019, que altera o Regulamento de Execução (UE) 2015/207 no que diz respeito
    às alterações dos modelos para a apresentação das informações relativas
    aos grandes projetos, para o plano de ação conjunto, para os relatórios de
    execução do objetivo de Investimento no Crescimento e no Emprego e do objetivo
    de Cooperação Territorial Europeia, e que retifica esse regulamento no que diz
    respeito aos dados para efeitos da análise do desempenho e do quadro de desempenho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/256 al Comisiei din 13 februarie
    2019 de modificare a Regulamentului de punere în aplicare (UE) 2015/207 în ceea
    ce privește modificările modelelor pentru transmiterea informațiilor privind
    un proiect major, planul de acțiune comun, rapoartele de implementare pentru
    obiectivul privind investițiile pentru creștere economică și locuri de muncă
    și pentru obiectivul de cooperare teritorială europeană, precum și de rectificare
    a respectivului regulament în ceea ce privește datele în scopul evaluării
    performanțelor și al cadrului de performanță
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/256 z 13. februára 2019, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2015/207, pokiaľ ide o zmeny formátov
    na predkladanie informácií o veľkom projekte, vzoru spoločného akčného
    plánu, vzoru správ o vykonávaní cieľa Investovanie do rastu a zamestnanosti
    a vzoru správ o vykonávaní cieľa Európska územná spolupráca a ktorým
    sa opravuje uvedené nariadenie, pokiaľ ide o údaje na účely preskúmania
    výkonnosti a výkonnostného rámca
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/256 z dne 13. februarja 2019 o spremembi
    Izvedbene uredbe (EU) 2015/207, kar zadeva spremembe vzorcev za predložitev informacij
    o velikem projektu, skupni akcijski načrt, poročila o izvajanju za cilj „naložbe
    za rast in delovna mesta“ in cilj „evropsko teritorialno sodelovanje“, ter
    o popravku navedene uredbe, kar zadeva podatke za namene pregleda uspešnosti
    in okvira uspešnosti
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/256 de la Comisión, de 13 de febrero
    de 2019, por el que se modifica el Reglamento de Ejecución (UE) 2015/207 en lo
    referente a cambios en los modelos relativos a la presentación de la información
    sobre un gran proyecto, el plan de acción conjunto, los informes de ejecución
    para el objetivo de inversión en crecimiento y empleo y el objetivo de cooperación
    territorial europea, y por el que se corrige dicho Reglamento en lo tocante a
    los datos para el examen del rendimiento y el marco de rendimiento
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2019/256 av den 13 februari
    2019 om ändring av genomförandeförordning (EU) 2015/207 vad gäller ändringar
    av modellerna för inlämning av uppgifter om större projekt, för den gemensamma
    handlingsplanen och för genomföranderapporterna om målet Investering för tillväxt
    och sysselsättning och målet Europeiskt territoriellt samarbete, och om rättelse
    av den förordningen vad gäller uppgifter för resultatöversynen och resultatramen
  type: main
