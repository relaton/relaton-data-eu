    fir-rigward tat-tibdil tal-mudelli għall-preżentazzjoni tal-informazzjoni dwar
    proġett maġġuri, għall-pjan ta' azzjoni konġunt, għar-rapporti ta' implimentazzjoni
    għall-Investiment bl-għan tat-tkabbir u l-impjiegi u bl-għan ta' kooperazzjoni
