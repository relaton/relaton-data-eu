    kopīgā rīcības plāna, īstenošanas ziņojumu par mērķi “Investīcijas
    izaugsmei un nodarbinātībai” un par mērķi “Eiropas teritoriālā sadarbība”
    paraugos groza Īstenošanas regulu (ES) 2015/207 un to labo attiecībā uz datiem
    darbības rezultātu izvērtēšanai un darbības rezultātu satvaru
  type: main
- language: lt
  script: Latn
  content: 2019 m. vasario 13 d. Komisijos įgyvendinimo reglamentas (ES) 2019/256,
    kuriuo dėl informacijos apie didelės apimties projektą teikimo, bendrojo veiksmų
    plano, investicijų į ekonomikos augimą ir darbo vietų kūrimą tikslo ir Europos
    teritorinio bendradarbiavimo tikslo įgyvendinimo ataskaitų modelių pakeitimų
    iš dalies keičiamas Įgyvendinimo reglamentas (ES) 2015/207 ir ištaisomos to
    reglamento nuostatos dėl veiklos rezultatų peržiūrai ir veiklos rezultatų
    planui skirtų duomenų
  type: main
- language: mt
  script: Latn
