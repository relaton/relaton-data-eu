  content: Komission täytäntöönpanoasetus (EU) 2019/256, annettu 13 päivänä
    helmikuuta 2019, täytäntöönpanoasetuksen (EU) 2015/207 muuttamisesta siltä
    osin kuin on kyse suurhanketta, yhteistä toimintasuunnitelmaa ja Investoinnit
    kasvuun ja työpaikkoihin -tavoitetta koskevista täytäntöönpanokertomuksista
    sekä Euroopan alueellinen yhteistyö -tavoitetta koskevien tietojen toimittamisessa
    käytettävien mallien muutoksista ja mainitun asetuksen oikaisemisesta siltä
    osin kuin on kyse tiedoista tulosten tarkastelua ja tuloskehystä varten
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/256 оd 13. veljače 2019. o izmjeni
    Provedbene uredbe (EU) 2015/207 u pogledu promjena u modelima za dostavljanje
    informacija o velikom projektu, za zajednički akcijski plan, za izvješća o
    provedbi za cilj „Ulaganje za rast i radna mjesta” te za cilj „Europska
    teritorijalna suradnja” i o ispravku te uredbe u pogledu podataka za reviziju
    uspješnosti i okvira uspješnosti
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/256 végrehajtási rendelete (2019. február 13.)
    az (EU) 2015/207 végrehajtási rendeletnek a nagyprojektekre vonatkozó információk
    benyújtásának formátuma, a közös cselekvési terv mintája és a „Beruházás
    a növekedésbe és munkahelyteremtésbe” célkitűzésre és az európai területi
    együttműködési célkitűzésre vonatkozó végrehajtási jelentések mintája
    tekintetében történő módosításáról, valamint az említett rendeletnek
    az eredményességi felülvizsgálathoz és az eredményességi kerethez használt
    adatok tekintetében történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/256 della Commissione, del 13 febbraio
    2019, che modifica il regolamento di esecuzione (UE) 2015/207 per quanto riguarda
    le modifiche dei modelli per la presentazione delle informazioni relative a un
    grande progetto, per il piano d'azione comune, per le relazioni di attuazione
    relative all'obiettivo Investimenti in favore della crescita e dell'occupazione
    e all'obiettivo di cooperazione territoriale europea e che rettifica tale regolamento
    per quanto riguarda i dati ai fini della revisione dell'efficacia e il quadro
    di riferimento dell'efficacia
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/256 (2019. gada 13. februāris),
