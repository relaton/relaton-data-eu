  content: Council Decision (EU) 2025/1251 of 16 June 2025 on the position to be taken
    on behalf of the European Union at the 17th session of the Committee of Technical
    Experts of the Intergovernmental Organisation for International Carriage by Rail
    (OTIF) as regards the revision of the Uniform Technical Prescriptions applicable
    to the subsystem ‘rolling stock – locomotives and passenger rolling stock’,
    to the accessibility of the rail system for persons with disabilities and persons
    with reduced mobility, to vehicle marking, to the subsystem ‘infrastructure’,
    and to the subsystem ‘Telematics applications for freight services’, and as
    regards the update of the Handbook for the implementation and application of the
    APTU and ATMF Uniform Rules
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1251 du Conseil du 16 juin 2025 relative à la position
    à prendre, au nom de l’Union européenne, lors de la 17e session de la Commission
    d’experts techniques de l’Organisation intergouvernementale pour les transports
    internationaux ferroviaires (OTIF) en ce qui concerne la révision des prescriptions
    techniques uniformes applicables au sous-système «Matériel roulant — Locomotives
    et matériel roulant destiné au transport de voyageurs», à l’accessibilité
    du système ferroviaire pour les personnes handicapées et les personnes à mobilité
    réduite, au marquage des véhicules, au sous-système «Infrastructure» et au
    sous-système «Applications télématiques au service du fret», ainsi qu’en
    ce qui concerne la mise à jour du Guide pour la mise en œuvre et l’application
    des règles uniformes APTU et ATMF
  type: main
