    (notified under document number C(1998) 3115)'
  type: main
- language: fr
  script: Latn
  content: '98/597/CE: Décision de la Commission du 15 octobre 1998 modifiant la
    décision 94/278/CE établissant la liste des pays tiers en provenance desquels
    les États membres autorisent l''importation de certains produits visés par la
    directive 92/118/CEE du Conseil [notifiée sous le numéro C(1998) 3115]'
  type: main
