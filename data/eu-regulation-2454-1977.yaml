title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2454/77 of 8 November 1977 re-establishing
    the levying, of customs duties on light petroleum oils, falling within subheading
    27.10 A III, originating in Romania to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2454/77 de la Commission, du 8 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole légères, de la sous-position tarifaire 27.10 A III, originaires de
    Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2454/77 der Kommission vom 8. November 1977 zur Wiedereinführung
    des Zollsatzes für Leichtöle der Tarifstelle 27.10 A III, mit Ursprung in Rumänien,
    dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2454/77 af 8. november 1977 om genindførelse
    af opkrævning af toldafgifter for lette olier, under underposition 27.10 A III,
    som har oprindelse i Rumænien og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2454/77 della Commissione, dell'8 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli oli di petrolio leggeri,
    della sottovoce doganale 27.10 A III, originari della Romania, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2454/77 van de Commissie van 8 november 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op lichte oliën,
    van post 27.10 A III, van oorsprong uit Roemenië, ten behoeve waarvan bij Verordening
    (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden geopend
  type: main
