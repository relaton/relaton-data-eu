title:
- language: en
  script: Latn
  content: '80/911/EEC: Commission Decision of 13 August 1980 authorizing the Italian
    Republic not to apply Community treatment to tuners, falling within heading No
    ex 85.15 A III of the Common Customs Tariff, originating in Japan and in free
    circulation in the other Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/911/CEE: Décision de la Commission, du 13 août 1980, autorisant la
    République italienne à exclure du traitement communautaire les "tuners" de la
    sous- position ex 85.15 A III du tarif douanier commun, originaires du Japon et
    mis en libre pratique dans les autres Etats membres (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/911/EWG: Entscheidung der Kommission vom 13. August 1980, mit der die
    Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche ,,Tuners''''der Tarifstelle ex 85.15
    A III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/911/EØF: Kommissionens beslutning af 13. august 1980 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage tuners til
    radiomodtagere, som henhører under pos. ex 85.15 A III i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i de øvrige medlemsstater (Kun den
    italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/911/CEE: Decisione della Commissione, del 13 agosto 1980, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i sintonizzatori
    radio della sottovoce ex 85.15 A III della tariffa doganale comune, oroginari
    del Giappone e messi in libera pratica negli atri Stati membri (Il testo in lingua
    italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/911/EEG: Beschikking van de Commissie van 13 augustus 1980 waarbij
    de Italiaanse Republiek wordt gemachtigd tuners, van post ex 85.15 A III van het
    gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Italiaanse taal is authentiek)'
