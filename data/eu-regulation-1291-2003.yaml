    означения в „Регистър на защитените наименования
    за произход и защитените географски указания“,
    предвиден в Регламент (ЕИО) № 2081/92 на Съвета
    за защита на географските указания и на наименованията
    за произход на селскостопанските и хранителните
    продукти („Pane di Altamura“)
  type: main
