title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1291/2003 of 18 July 2003 supplementing the
    Annex to Regulation (EC) No 2400/96 on the entry of certain names in the "Register
    of protected designation of origin and protected geographical indications" provided
    for in Council Regulation (EEC) No 2081/92 on the protection of geographical indications
    and designations of origin for agricultural products and foodstuffs (Pane di Altamura)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1291/2003 de la Commission du 18 juillet 2003 complétant
    l'annexe du règlement (CE) n° 2400/96 de la Commission relatif à l'inscription
    de certaines dénominations dans le "Registre des appellations d'origine protégées
    et des indications géographiques protégées" prévu au règlement (CEE) n°
    2081/92 du Conseil relatif à la protection des indications géographiques et
    des appellations d'origine des produits agricoles et des denrées alimentaires
    ("pane di Altamura")
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1291/2003 der Kommission vom 18. Juli 2003 zur Ergänzung
    des Anhangs der Verordnung (EG) Nr. 2400/96 zur Eintragung bestimmter Bezeichnungen
    in das Verzeichnis der geschützten Ursprungsbezeichnungen und der geschützten
    geografischen Angaben für Agrarerzeugnisse und Lebensmittel gemäß der Verordnung
    (EWG) Nr. 2081/92 des Rates zum Schutz von geografischen Angaben und Ursprungsbezeichnungen
    für Agrarerzeugnisse und Lebensmittel (Pane di Altamura)
  type: main
