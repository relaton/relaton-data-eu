title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3152/78 of 21 December 1978 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Spain for the period 1 to 31 January 1979
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3152/78 du Conseil, du 21 décembre 1978, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de l' Espagne pour la période allant du 1er au 31
    janvier 1979
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3152/78 des Rates vom 21. Dezember 1978 zur Festlegung
    bestimmter Übergangsmaßnahmen für die Zeit vom 1. bis zum 31. Januar 1979 zur
    Erhaltung und Bewirtschaftung der Fischbestände gegenüber Schiffen, die die
    Flagge Spaniens führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3152/78 af 21. december 1978 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der sejler under spansk flag, i perioden
    1. til 31. januar 1979
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3152/78 del Consiglio, del 21 dicembre 1978, che stabilisce
    talune misure provvisorie per la conservazione e la gestione delle risorse ittiche
    da applicare alle navi battenti bandiera della Spagna per il periodo dal 1° gennaio
    al 31 gennaio 1979
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3152/78 van de Raad van 21 december 1978 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    de visbestanden die van 1 tot en met 31 januari 1979 van toepassing zijn op vaartuigen
    die de vlag van Spanje voeren
  type: main
