    δημοπρασίας για τη θέση προς πώληση, με σκοπό
    τη μεταποίηση σε λιπαρά οξέα, του πυρηνελαίου
    που βρίσκεται στην κατοχή του ιταλικού οργανισμού
    παρέμβασης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 65/85 della Commissione del 10 gennaio 1985 relativo
    all' apertura di una gara per la vendita, ai fini della trasformazione in acidi
    grassi, dell' olio di sansa d' oliva detenuto dall' organismo d' intervento italiano
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 65/85 van de Commissie van 10 januari 1985 inzake
    het houden van een openbare inschrijving voor de verkoop, met het oog op verwerking
    tot vetzuren, van door het Italiaanse interventiebureau opgeslagen olie uit afvallen
    van olijven
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 65/85 da Comissão, de 10 de Janeiro de 1985, relativo
