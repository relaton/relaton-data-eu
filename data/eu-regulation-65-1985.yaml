title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 65/85 of 10 January 1985 opening an invitation
    to tender for the sale for processing into fatty acids of olive residue oil held
    by the Italian intervention agency
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 65/85 de la Commission du 10 janvier 1985 relatif à
    l' ouverture d' une adjudication pour la mise en vente pour la transformation
    en acides gras de l' huile de grignons d' olive détenue par l' organisme d' intervention
    italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 65/85 der Kommission vom 10. Januar 1985 zur Eröffnung
    einer Ausschreibung zum Verkauf von Oliventresteröl im Besitz der italienischen
    Interventionsstelle zwecks Verarbeitung zu Fettsäuren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 65/85 af 10. januar 1985 om åbning
    af en licitation med henblik på udbud til salg af olie af olivenpresserester,
    som det italienske interventionsorgan ligger inde med, og som skal forarbejdes
    til fedtsyre
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 65/85 της Επιτροπής
