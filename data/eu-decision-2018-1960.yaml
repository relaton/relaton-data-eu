title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/1960 of 10 December 2018 on
    a safeguard measure taken by Sweden pursuant to Directive 2006/42/EC of the European
    Parliament and of the Council, to prohibit the placing on the market a type of
    pinsetter machine and a supplementary kit to be used together with that type of
    pinsetter machine, manufactured by Brunswick Bowling & Billiards, and to withdraw
    those machines already placed on the market (notified under document C(2018) 8253)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/1960 de la Commission du 10 décembre
    2018 concernant une mesure de sauvegarde adoptée par la Suède conformément
    à la directive 2006/42/CE du Parlement européen et du Conseil pour interdire
    la mise sur le marché d'un type de machine à relever les quilles et d'un kit
    complémentaire destiné à être utilisé avec ce type de machine, fabriqués
    par Brunswick Bowling & Billiards, et retirer les machines déjà mises sur le
    marché [notifiée sous le numéro C(2018) 8253]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1960 der Kommission vom 10. Dezember
