    Parlaments und des Rates verhängte Maßnahme zum Verbot des Inverkehrbringens
    eines Typs einer Pinaufstellmaschine sowie des Zubehörs für diese Pinaufstellmaschine,
    hergestellt von Brunswick Bowling & Billards, und zur Rücknahme bereits in Verkehr
    gebrachter Maschinen (Bekannt gegeben unter Aktenzeichen C(2018) 8253)
