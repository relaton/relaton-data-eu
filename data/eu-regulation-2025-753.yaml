    le contenu, les méthodologies et la présentation des informations que publient
    volontairement les émetteurs d’obligations commercialisées en tant qu’obligations
    durables sur le plan environnemental ou d’obligations liées à la durabilité
    dans les modèles pour la publication périodique d’informations sur les post-émissions
  type: main
