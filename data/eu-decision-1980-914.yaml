id: EUDecision1980914
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/914/EEC: Commission Decision of 13 August 1980 authorizing the French
    Republic not to apply Community treatment to women''s, girls''and infants''woven
    overcoats, raincoats and other coats, cloaks and capes ; jackets and blazers,
    falling within heading No ex 61.02 B II of the Common Customs Tariff (category
    15 B), originating in Poland and in free circulation in the other Member States
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/914/CEE: Décision de la Commission, du 13 août 1980, autorisant la
    République française à exclure du traitement communautaire les manteaux, imperméables
    (y compris les capes) et vestes tissés pour femmes, fillettes et jeunes enfants,
    de la sous-position ex 61.02 B II du tarif douanier commun (catégorie 15 B),
    originaires de Pologne et mis en libre pratique dans les autres Etats membres
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/914/EWG: Entscheidung der Kommission vom 13. August 1980, mit der die
    Französische Republik ermächtigt wird, aus Polen stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Mäntel, Umhänge und Jacken, aus
    Geweben, für Frauen, Mädchen und Kleinkinder, der Tarifstelle ex 61.02 B II
    des Gemeinsamen Zolltarifs (Kategorie 15 B) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/914/EØF: Kommissionens beslutning af 13. august 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage frakker, kapper
    og slag, jakker og blazere, vævede til kvinder, piger og småbørn, som henhører
    under pos. ex 61.02 B II i den fælles toldtarif (kategori 15 B), har oprindelse
    i Polen og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/914/CEE: Decisione della Commissione, del 13 agosto 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i cappotti, soprabiti,
    mantelli e simili, e giacche, tessuti, per donna, per ragazza e per bambini della
    sottovoce ex 61.02 B II della tariffa doganale comune, categoria 15 B, originari
    della Polonia e messi in libera pratica negli altri Stati membri (Il testo in
    lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/914/EEG: Beschikking van de Commissie van 13 augustus 1980 waarbij
    de Franse Republiek wordt gemachtigd mantels, regenjassen en capes daaronder begrepen,
    blazers en jasjes, geweven, voor dames, meisjes en kinderen, van post ex 61.02
    B II van het gemeenschappelijk douanetarief (categorie 15 B), van oorsprong uit
    Polen en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
