  content: Council Regulation (EEC) No 3209/88 of 17 October 1988 amending Council
    Regulation (EEC) No 3035/80 laying down general rules for granting export refunds
    on certain agricultural products exported in the form of goods not covered by
    Annex II to the Treaty, and the criteria for fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3209/88 du Conseil du 17 octobre 1988 modifiant le
    règlement (CEE) n° 3035/80 établissant, pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l' annexe II du traité, les règles
    générales relatives à l' octroi des restitutions à l' exportation et les critères
    de fixation de leur montant
  type: main
- language: de
  script: Latn
