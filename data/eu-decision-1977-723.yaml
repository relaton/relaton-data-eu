---
id: EUDecision1977723
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 March 1977 authorizing the United Kingdom not
    to apply Community treatment to woven fabrics of synthetic textile fibres (polyester/cotton),
    falling within subheading 56.07 ex A of the Common Customs Tariff, originating
    in the Socialist Republic of Romania and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '77/723/CEE: Décision de la Commission, du 11 mars 1977, autorisant le
    Royaume-Uni à exclure du traitement communautaire les tissus de fibres textiles
    synthétiques (polyester/coton), de la sous-position 56.07 Ex A du Tarif douanier
    commun, originaires de la République socialiste de Roumanie et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. März 1977, mit der das Vereinigte
    Königreich ermächtigt wird, aus der Sozialistischen Republik Rumänien stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus synthetischen
    Spinnfasern (Polyester/Baumwolle) der Tarifstelle 56.07 ex A des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 11. marts 1977 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage vævede stoffer af syntetiske
    fibre (polyester/bomuld), som henhører under position 56.07 ex A i den fælles
    toldtarif, har oprindelse i Den socialistiske republik Rumænien og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 marzo 1977, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario i tessuti di fibre sintetiche (poliestere/cotone)
    della sottovoce 56.07 ex A della tariffa doganale comune, originari della Repubblica
    socialista di Romania e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 maart 1977 waarbij het Verenigd Koninkrijk
    wordt gemachtigd weefsels van synthetische vezels (polyester/katoen), van post
    56.07 ex A van het gemeenschappelijk douanetarief, van oorsprong uit de Socialistische
    Republiek Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
