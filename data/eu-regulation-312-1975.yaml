  content: Regulation (EEC) No 312/75 of the Commission of 7 February 1975 on a standing
    invitation to tender to determine subsidies for white sugar produced in excess
    of the maximum quota and in respect of which no export levy is to apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 312/75 de la Commission, du 7 février 1975, concernant
    une adjudication permanente pour la détermination de subventions à octroyer
    au sucre blanc produit au-delà du quota maximal auquel ne s'applique pas le prélèvement
    à l'exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 312/75 der Kommission vom 7. Februar 1975 über eine
    Dauerausschreibung zur Festsetzung der Subventionen für den über die Höchstquote
    hinaus erzeugten Weißzucker, auf den die Ausfuhrabschöpfung nicht anwendbar
    ist
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 312/75 af 7. februar 1975 om en løbende
    licitation med henblik på fastlæggelse af tilskud, som skal ydes for hvidt sukker,
    som er fremstillet ud over den maksimumskvote, for hvilken der ikke gælder nogen
    eksportafgift
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 312/75 della Commissione, del 7 febbraio 1975, relativo
    a una gara permanente per la determinazione di sovvenzioni da accordare allo zucchero
    bianco prodotto al di là della quota massima cui non si applica il prelievo all'esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 312/75 van de Commissie van 7 februari 1975 inzake
    een permanente inschrijving voor de vaststelling van subsidies die moeten worden
    verleend voor boven het maximumquotum geproduceerde witte suiker waarvoor de uitvoerheffing
    niet geldt
