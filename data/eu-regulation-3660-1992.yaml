    alla definizione della nozione di "prodotto originario" e ai metodi di cooperazione
    amministrativa applicabili per l' importazione nella Comunità di prodotti originari
    dei paesi in via di sviluppo, dei territori occupati e delle Repubbliche di Bosnia-Erzegovina,
    di Croazia e di Slovenia e dell' ex Repubblica iugoslava di Macedonia
  type: main
