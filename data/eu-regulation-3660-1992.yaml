title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3660/92 of 18 December 1992 amending Regulations
    (EEC) No 693/88, (EEC) No 809/88 and (EEC) No 343/92 on the definition of the
    concept of originating products and methods of administrative cooperation with
    regard to imports into the Community of products originating in developing countries,
    in the Occupied Territories and in the Republics of Bosnia-Herzegovina, Croatia
    and Slovenia and the former Yugoslav Republic of Macedonia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3660/92 de la Commission, du 18 décembre 1992, modifiant
    les règlements (CEE) n° 693/88, (CEE) n° 809/88 et (CEE) n 343/92, relatifs
    à la définition de la notion de "produit originaire" et aux méthodes de coopération
    administrative en ce qui concerne l'importation dans la Communauté de produits
    originaires des pays en développement, des territoires occupés et des Républiques
    de Bosnie-Herzégovine, de Croatie et de Slovénie et de l'ancienne République
    yougoslave de Macédoine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3660/92 der Kommission vom 18. Dezember 1992 zur Änderung
    der Verordnungen (EWG) Nr. 693/88, (EWG) Nr. 809/88 und (EWG) Nr. 343/92 über
    die Bestimmung des Begriffs "Waren mit Ursprung in" oder "Ursprungswaren" und
    über die Methoden der Zusammenarbeit der Verwaltungen bei der Einfuhr von Waren
    mit Ursprung in den Entwicklungsländern, den besetzten Gebieten und den Republiken
    Bosnien- Herzegowina, Kroatien und Slowenien sowie der ehemaligen Jugoslawischen
    Republik Mazedonien in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3660/92 af 18. december 1992 om ændring
    af forordning (EØF) nr. 693/88, (EØF) 809/88 og (EØF) 343/92 om definition
    af begrebet "varer med oprindelsesstatus" og om de metoder for administrativt
    samarbejde, der finder anvendelse i forbindelse med indførsel til Fællesskabet
    af varer med oprindelse i udviklingslandene, de besatte områder, republikkerne
    Bosnien-Hercegovina, Kroatien og Slovenien og den tidligere jugoslaviske republik
    Makedonien
  type: main
