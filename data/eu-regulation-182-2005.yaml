    160 kg masės gyvų galvijų kvotos, numatytos Reglamente (EB) Nr. 2124/2004,
    importo teises
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 182/2005 van de Commissie van 2 februari 2005 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    rechten op invoer voor het in Verordening (EG) nr. 2124/2004 bedoelde contingent
    voor van oorsprong uit Zwitserland met een gewicht van meer dan 160 kg levende
    runderen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 182/2005 z dnia 2 lutego 2005 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o prawa przywozowe złożone
    dla kwoty taryfowej żywego bydła o wadze przekraczającej 160 kg i pochodzącego
    ze Szwajcarii, przewidzianej w rozporządzeniu (WE) nr 2124/2004
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 182/2005 da Comissão, de 2 de Fevereiro de 2005,
    que determina em que medida pode ser dado seguimento aos pedidos de direitos de
    importação apresentados relativamente ao contingente de bovinos vivos com um
    peso superior a 160 kg originários da Suiça, previsto pelo Regulamento (CE)
    n.° 2124/2004
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 182/2005 z 2. februára 2005, ktorým sa určuje,
    do akej miery je možné vyhovieť žiadostiam o dovozné práva, predloženým
    v súvislosti s kvótou pre živý hovädzí dobytok s hmotnosťou vyššou ako
    160 kg a s pôvodom vo Švajčiarsku, ustanovenou v nariadení (ES) č. 2124/2004
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 182/2005 z dne 2. februarja 2005 o določitvi,
    v kakšnem obsegu se lahko ugodi zahtevkom za uvozne pravice, vloženim za kvoto
    za živa goveda s težo, ki presega 160 kg, in s poreklom iz Švice, predvideno
    z Uredbo (ES) št. 2124/2004
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 182/2005 de la Comisión, de 2 de febrero de 2005,
    por el que se determina en qué medida se podrá dar curso a las solicitudes de
    derechos de importación presentadas en relación con el contingente de animales
    vivos de especie bovina originarios de Suiza de un peso superior a 160 kilogramos
    previsto en el Reglamento (CE) n° 2124/2004
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 182/2005 av den 2 februari 2005 om i
    vilken utsträckning de ansökningar om importrättigheter kan beviljas som lämnats
    in för den kvot för levande nötkreatur med en vikt på mer än 160 kg med ursprung
    i Schweiz som fastställs i förordning (EG) nr 2124/2004
