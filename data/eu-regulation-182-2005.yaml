title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 182/2005 of 2 February 2005 determining the
    extent to which applications for import rights lodged in respect of the quota
    for live bovine animals of a weight exceeding 160 kg and originating in Switzerland,
    provided for in Regulation (EC) No 2124/2004, can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 182/2005 de la Commission du 2 février 2005 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées pour le contingent de bovins vivants d'un poids excédant 160 kg originaires
    de Suisse, prévu par le règlement (CE) n° 2124/2004
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 182/2005 der Kommission vom 2. Februar 2005 zur Bestimmung
    des Umfangs, in welchem den Anträgen auf Einfuhrrechte für das gemäß der Verordnung
    (EG) Nr. 2124/2004 vorgesehene Zollkontingent für lebende Rinder mit einem Stückgewicht
    von mehr als 160 kg mit Ursprung in der Schweiz stattgegeben werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 182/2005 ze dne 2. února 2005, kterým se
    stanoví, do jaké míry lze vyhovět žádostem o dovozní práva podaným pro
    kvóty pro pro dovoz živého skotu o hmotnosti vyšší než 160 kg podle nařízení
    (ES) č. 2124/2004
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 182/2005 af 2. februar 2005 om fastsættelse
    af, i hvilket omfang ansøgningerne om importrettigheder for import af levende
    kvæg med en vægt på over 160 kg og med oprindelse i Schweiz under det kontingentet,
    som er fastsat i forordning (EF) nr. 2124/2004, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 182/2005 της Επιτροπής,
    της 2ας Φεβρουαρίου 2005, για τον καθορισμό σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για δικαιώματα εισαγωγής που έχουν υποβληθεί
    για την ποσόστωση, βάσει του κανονισμού (ΕΚ)
    αριθ. 2124/2004, στον τομέα των ζώντων βοοειδών
    βάρους άνω των 160 χιλιογράμμων και καταγωγής
    Ελβετίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 182/2005, 2. veebruar 2005, millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordiõiguste taotlusi, mis on
    esitatud seoses määruses (EÜ) nr 2124/2004 Šveitsit pärit üle 160 kg kaaluvate
    elusveiste kvoodiga
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 182/2005, annettu 2 päivänä helmikuuta 2005,
    asetuksessa (EY) N:o 2124/2004 säädetyn, yli 160 kilogramman painoisia eläviä
    Sveitsistä peräisin olevia nautaeläimiä koskevan kiintiön mukaisesti jätettyjen
    tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 182/2005/EK rendelete (2005. február 2.) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni a 160 kilogrammnál nagyobb tömegű
    élő szarvasmarhafélékre a 2124/2004/EK rendeletben szabályozott kontingensére
    benyújtott behozatali jogok iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 182/2005 della Commissione, del 2 febbraio 2005, che
    stabilisce in quale misura possono essere accolte le domande di diritti d'importazione
    presentate per il contingente di bovini vivi di peso superiore a 160 kg originari
    della Svizzera previsto dal regolamento (CE) n. 2124/2004
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 182/2005 (2005. gada 2. februāris), ar ko nosaka,
