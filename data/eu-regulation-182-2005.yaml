    kuri iesniegti attiecībā uz kvotu dzīviem liellopiem, kuru svars pārsniedz
    160 kg un kuru izcelsme ir Šveicē, kas paredzēta Regulā (EK) Nr. 2124/2004
  type: main
- language: lt
  script: Latn
  content: 2005 m. vasario 2 d. Komisijos reglamentas (EB) Nr. 182/2005, nustatantis,
