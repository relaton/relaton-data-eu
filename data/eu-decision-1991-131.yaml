title:
- language: en
  script: Latn
  content: '91/131/EEC: Commission Decision of 11 March 1991 accepting undertakings
    offered by certain exporters in connection with the anti-dumping proceeding concerning
    imports of certain types of electronic microcircuits known as EPROMs (erasable
    programmable read only memories) originating in Japan and terminating the investigation
    with regard to these exporters'
  type: main
- language: fr
  script: Latn
  content: '91/131/CEE: Décision de la Commission du 11 mars 1991 portant acceptation
    d''engagements offerts par certains exportateurs dans le cadre de la procédure
    antidumping concernant les importations de certains types de microcircuits électroniques
    dits EPROMs (erasable programmable read only memories) originaires du Japon et
    portant clôture de l''enquête afférente à ces exportateurs'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 11. März 1991 über die Annahme der Verpflichtungsangebote
    bestimmter Ausführer im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    bestimmter EPROMs (Erasable Programmable Read Only Memories - Nur-Lese-Speicher)
    mit Ursprung in Japan und über die Einstellung des Verfahrens gegenüber diesen
    Ausführern (91/131/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 11. marts 1991 om godtagelse af tilsagn afgivet
    af visse eksportører i forbindelse med antidumpingproceduren vedrørende importen
    af visse typer elektroniske mikrokredsløb, såkaldte EPROMs (Erasable Programmable
    Read Only Memories) med oprindelse i Japan og om afslutning af undersøgelsen
    for så vidt angår disse eksportører (91/131/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/131/ΕΟΚ: Απόφαση της Επιτροπής της 11ης
    Μαρτίου 1991 για την αποδοχή των αναλήψεων υποχρεώσεων
    που έχουν προταθεί από ορισμένους εξαγωγείς
    όσον αφορά τη διαδικασία αντιντάμπινγκ σχετικά
    με τις εισαγωγές ορισμένων τύπων ηλεκτρονικών
    μικροκυκλωμάτων γνωστών ως EPROM ( διαγραφόμενες
    προγραμματιζόμενες μνήμες μόνο ανάγνωσης
    ), καταγωγής Ιαπωνίας και για την περάτωση της
    έρευνας όσον αφορά αυτούς τους εξαγωγείς'
  type: main
- language: it
  script: Latn
  content: '91/131/CEE: DECISIONE DELLA COMMISSIONE, DELL'' 11 MARZO 1991, RELATIVA
    ALL'' ACCETTAZIONE DEGLI IMPEGNI OFFERTI DA ALCUNI ESPORTATORI NELL'' AMBITO DELLA
    PROCEDURA ANTIDUMPING RIGUARDANTE LE IMPORTAZIONI DI ALCUNI TIPI DI MICROCIRCUITI
    ELETTRONICI, DETTI EPROM ( ERASABLE PROGRAMMABLE READ ONLY MEMORIES - MEMORIA
    A SOLA LETTURA CANCELLABILE E PROGRAMMABILE ) ORIGINARI DEL GIAPPONE E ALLA CHIUSURA
    DELL'' INCHIESTA RELATIVA A TALI ESPORTATORI'
  type: main
- language: nl
  script: Latn
  content: '91/131/EEG: BESLUIT VAN DE COMMISSIE VAN 11 MAART 1991 TOT AANVAARDING
    VAN DOOR BEPAALDE EXPORTEURS AANGEBODEN VERBINTENISSEN IN VERBAND MET DE ANTI-DUMPINGPROCEDURE
    BETREFFENDE DE INVOER VAN BEPAALDE TYPEN ELEKTRONISCHE MICROSCHAKELINGEN, DE ZOGENOEMDE
    EPROM'' S ( ERASABLE PROGRAMMABLE READ ONLY MEMORIES ), VAN OORSPRONG UIT JAPAN,
    EN TOT BEEINDIGING VAN HET ONDERZOEK TEN AANZIEN VAN DEZE EXPORTEURS'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 11 de Março de 1991 relativa à aceitação
    de compromissos oferecidos por certos exportadores no âmbito do processo anti-dumping
    respeitante às importações de certos tipos de microcircuitos electrónicos
    denominados EPROM (Erasable Programmable Read only Memories - memórias programáveis
    apagáveis exclusivamente para leitura), originários do Japão e ao encerramento
    do inquérito relativamente a estes exportadores (91/131/CEE) #'
  type: main
- language: es
  script: Latn
  content: '91/131/CEE: DECISION DE LA COMISION, DE 11 DE MARZO DE 1991, POR LA QUE
    SE ACEPTAN LOS COMPROMISOS OFRECIDOS POR DETERMINADOS EXPORTADORES EN RELACION
    CON EL PROCEDIMIENTO ANTIDUMPING RELATIVO A LA IMPORTACION DE DETERMINADOS TIPOS
    DE MICROCIRCUITOS ELECTRONICOS CONOCIDOS COMO EPROM ( MEMORIAS DE SOLO LECTURA
    PROGRAMABLES BORRABLES ) ORIGINARIAS DE JAPON Y POR LA QUE SE DA POR CONCLUIDA
    LA INVESTIGACION SOBRE DICHOS EXPORTADORES'
