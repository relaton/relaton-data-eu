title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3810/91 of 18 December 1991 laying down
    detailed rules for the application of the supplementary trade mechanism to trade
    in the beef and veal sector between the Community as constituted at 31 December
    1985 and Spain and Portugal and repealing Regulations (EEC) No 4026/89 and (EEC)
    No 3815/90
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CEE) No 3810/91 DE LA COMMISSION du 18 décembre 1991 déterminant
    les modalités d'application du mécanisme complémentaire aux échanges dans
    le secteur de la viande bovine de la Communauté dans sa composition au 31 décembre
    1985 vers l' Espagne et le Portugal et abrogeant les règlements (CEE) no 4026/89
    et (CEE) no 3815/90
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3810/91 DER KOMMISSION vom 18. Dezember 1991 mit Durchführungsbestimmungen
    zum ergänzenden Mechanismus für den Handel mit Rindfleisch zwischen der Gemeinschaft
    in ihrer Zusammensetzung vom 31. Dezember 1985 und Spanien und Portugal sowie
    zur Aufhebung der Verordnungen (EWG) Nr. 4026/89 und (EWG) Nr. 3815/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3810/91 af 18. december 1991 om de
    nærmere bestemmelser for anvendelse af den supplerende mekanisme for samhandelen
    i oksekødssektoren mellem Fællesskabet i dets sammensætning pr. 31. december
    1985 og Spanien og Portugal og om ophævelse af forordning (EØF) nr. 4026/89
    og (EØF) nr. 3815/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3810/91 της Επιτροπής
    της 18ης Δεκεμβρίου 1991 για τον καθορισμό των
    λεπτομερειών εφαρμογής του συμπληρωματικού
    μηχανισμού στις συναλλαγές ορισμένων προϊόντων
    στον τομέα του βοείου κρέατος τα οποία προέρχονται
    από την Κοινότητα, με τη σύνθεσή της στις 31
    Δεκεμβρίου 1985, και τα οποία προορίζονται για
    την Ισπανία και την Πορτογαλία, καθώς και για
    την κατάργηση των κανονισμών (ΕΟΚ) αριθ. 4026/89
    και (ΕΟΚ) αριθ. 3815/90
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3810/91 DELLA COMMISSIONE del 18 dicembre 1991 che
    determina le modalità d' applicazione del meccanismo complementare applicabile,
    nel settore delle carni bovine, agli scambi dei prodotti spediti dalla Comunità
    quale si componeva al 31 dicembre 1985 verso la Spagna e il Portogallo, e che
    abroga i regolamenti (CEE) n. 4026/89 e (CEE) n. 3815/90
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3810/91 VAN DE COMMISSIE van 18 december 1991 houdende
    vaststelling van de uitvoeringsbepalingen van de aanvullende regeling voor het
    handelsverkeer in de sector rundvlees tussen de Gemeenschap in haar samenstelling
    op 31 december 1985 en Spanje en Portugal en houdende intrekking van de Verordeningen
    (EEG) nr. 4026/89 en (EEG) nr. 3815/90
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 3810/91 DA COMISSÃO de 18 de Dezembro de 1991 que
    determina as regras de execução do mecanismo complementar aplicável às trocas
    comerciais no sector da carne de bovino entre a Comunidade na sua composição
    em 31 de Dezembro de 1985 e Espanha e Portugal e que revoga os Regulamentos (CEE)
    no 4026/89 e (CEE) no 3815/90
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3810/91 DE LA COMISIÓN de 18 de diciembre de 1991
    por el que se establecen las disposiciones de aplicación del mecanismo complementario
    de los intercambios en el sector de la carne de vacuno entre la Comunidad, en
    su composición de 31 de diciembre de 1985, y España y Portugal, y por el que
    se derogan los Reglamentos (CEE) nos 4026/89 y 3815/90 #'
  type: main
