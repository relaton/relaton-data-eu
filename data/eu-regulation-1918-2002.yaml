    delle disposizioni concernenti il certificato di controllo per l'importazione
    di prodotti provenienti da paesi terzi ai sensi dell'articolo 11 del regolamento
    (CEE) n. 2092/91 del Consiglio relativo al metodo di produzione biologico di prodotti
