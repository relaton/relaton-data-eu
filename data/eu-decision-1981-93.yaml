  content: '81/93/EEC: Commission Decision of 30 January 1981 establishing that the
    apparatus described as ''PAR - vibrating sample magnetometer, model 155'' may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/93/CEE: Décision de la Commission, du 30 janvier 1981, constatant
    que l''importation de l''appareil dénommé "PAR - Vibrating sample magnetometer,
    model 155" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
