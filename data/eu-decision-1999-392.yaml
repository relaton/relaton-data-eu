title:
- language: en
  script: Latn
  content: '1999/392/EC: Commission Decision of 31 May 1999 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of ZA 1296 (mesotrione), Iodosulfuron-methyl-sodium (AEF
    115008) Silthiopham (MON 65500) and Gliocladium catenulatum in Annex I to Council
    Directive 91/414/EEC concerning the placing of plant- protection products on the
    market (notified under document number C(1999) 1400)'
  type: main
- language: fr
  script: Latn
  content: '1999/392/CE: Décision de la Commission, du 31 mai 1999, reconnaissant
