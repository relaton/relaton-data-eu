title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1996/87 of 7 July 1987 fixing until the
    end of the 1987/88 marketing year the minimum purchase price for lemons delivered
    to the industry and the amount of financial compensation payable after their processing
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1996/87 de la Commission du 7 juillet 1987 fixant
    le prix d'achat minimal des citrons livrés à l'industrie et le montant de la
    compensation financière après transformation de ces citrons jusqu'à la fin
    de la campagne 1987/1988
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1996/87 DER KOMMISSION vom 7. Juli 1987 zur Festsetzung
    des Mindestankaufspreises für an die Industrie gelieferte Zitronen und des Betrages
    des finanziellen Ausgleichs nach Verarbeitung dieser Zitronen bis zum Abschluß
    des Wirtschaftsjahres 1987/1988 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1996/87 af 7. juli 1987 om fastsættelse
    for resten af høståret 1987/88 af minimumsopkøbsprisen for citroner, der leveres
    til industrien, og af størrelsen af udligningstilskuddet efter forarbejdning
    af disse citroner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1996/87 της Επιτροπής
    της 7ης Ιουλίου 1987 για τον καθορισμό της ελάχιστης
    τιμής αγοράς των λεμονιών που παραδίδονται
    στη βιομηχανία και του ποσού της χρηματικής
    αντισταθμίσεως μετά τη μεταποίηση των λεμονιών
    αυτών έως το τέλος της περίοδου εμπορίας 1987/88
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1996/87 DELLA COMMISSIONE del 7 luglio 1987 che fissa,
    fino alla fine della campagna 1987/1988, il prezzo d'' acquisto minimo dei limoni
    consegnati all'' industria e l'' importo della compensazione finanziaria concessa
    dopo la loro trasformazione #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1996/87 VAN DE COMMISSIE van 7 juli 1987 tot vaststelling
    van de minimumaankoopprijs van citroenen bij levering aan de industrie en van
    het bedrag van de financiële vergoeding na verwerking daarvan, tot het einde
    van het verkoopseizoen 1987/1988 #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1996/87 da Comissão de 7 de Julho de 1987 que fixa
    o preço mínimo de compra dos limões entregues à indústria e o montante da
    compensação financeira após transformação desses limões até ao final da
    campanha de 1987/1988
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1996/87 DE LA COMISIÓN de 7 de julio de 1987 por
    el que se fija el precio de compra mínimo de los limones entregados a la industria
    y el importe de la compensación financiera después de la transformación de
    dichos limones hasta el final de la campaña 1987/88 #'
  type: main
