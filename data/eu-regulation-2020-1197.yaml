    nos termos do Regulamento (UE) 2019/2152 do Parlamento Europeu e do Conselho relativo
    às estatísticas europeias das empresas que revoga 10 atos jurídicos no domínio
    das estatísticas das empresas
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/1197 al Comisiei din 30 iulie
