    un Padomes Regulu (ES) 2019/2152 par Eiropas uzņēmējdarbības statistiku, ar
    ko atceļ 10 tiesību aktus uzņēmējdarbības statistikas jomā
  type: main
- language: lt
  script: Latn
  content: 2020 m. liepos 30 d. Komisijos įgyvendinimo reglamentas (ES) 2020/1197,
