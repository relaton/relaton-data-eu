title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/1197 of 30 July 2020 laying
    down technical specifications and arrangements pursuant to Regulation (EU) 2019/2152
    of the European Parliament and of the Council on European business statistics
    repealing 10 legal acts in the field of business statistics
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/1197 de la Commission du 30 juillet
    2020 établissant des spécifications techniques et des modalités d’exécution
    en application du règlement (UE) 2019/2152 du Parlement européen et du Conseil
    relatif aux statistiques européennes d’entreprises, abrogeant dix actes juridiques
    dans le domaine des statistiques d’entreprises
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/1197 der Kommission vom 30. Juli 2020
    zur Festlegung technischer Spezifikationen und Einzelheiten nach der Verordnung
    (EU) 2019/2152 des Europäischen Parlaments und des Rates über europäische Unternehmensstatistiken,
    zur Aufhebung von zehn Rechtsakten im Bereich Unternehmensstatistiken
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/1197 на Комисията
    от 30 юли 2020 година за установяване на технически
