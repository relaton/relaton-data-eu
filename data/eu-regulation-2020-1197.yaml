    parlamentu a Rady (EÚ) 2019/2152 o európskych podnikových štatistikách, ktorým
    sa zrušuje 10 právnych aktov v oblasti podnikových štatistík
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2020/1197 z dne 30. julija 2020 o določitvi
