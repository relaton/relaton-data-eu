    Parlamentu Europejskiego i Rady (UE) 2019/2152 w sprawie europejskiej statystyki
    gospodarczej uchylającego 10 aktów prawnych w dziedzinie statystyki gospodarczej
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2020/1197 da Comissão, de 30 de julho de
