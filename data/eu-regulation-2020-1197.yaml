    verslo statistikos, kuriuo panaikinama 10 teisės aktų verslo statistikos srityje,
    nustatomos techninės specifikacijos ir tvarka
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/1197 tat-30
    ta’ Lulju 2020 li jistabbilixxi l-ispeċifikazzjonijiet u l-arranġamenti tekniċi
    skont ir-Regolament (UE) 2019/2152 tal-Parlament Ewropew u tal-Kunsill dwar l-istatistika
