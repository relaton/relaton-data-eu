    en tot intrekking van tien rechtshandelingen op het gebied van bedrijfsstatistieken
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2020/1197 z dnia 30 lipca 2020
