    Regulamentului (UE) 2019/2152 al Parlamentului European și al Consiliului privind
    statisticile europene de întreprindere și de abrogare a 10 acte juridice în
    domeniul statisticilor de întreprindere
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/1197 z 30. júla 2020, ktorým
