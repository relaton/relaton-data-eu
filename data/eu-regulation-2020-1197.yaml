    2019/2152 nojalla vahvistettavista teknisistä määrittelyistä ja järjestelyistä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/1197 оd 30. srpnja 2020. o utvrđivanju
