    (ЕС) 2019/2152 на Европейския парламент и на Съвета
    за европейската бизнес статистика и за отмяна
    на 10 правни акта в областта на бизнес статистиката
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/1197 ze dne 30. července 2020,
    kterým se stanoví technické specifikace a úprava podle nařízení Evropského
    parlamentu a Rady (EU) 2019/2152 o evropských podnikových statistikách a zrušení
    deseti právních aktů v oblasti podnikových statistik
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/1197 af 30. juli 2020
    om fastlæggelse af tekniske specifikationer og ordninger i henhold til Europa-Parlamentets
    og Rådets forordning (EU) 2019/2152 om europæisk erhvervsstatistik og om ophævelse
    af ti retsakter på området erhvervsstatistik
  type: main
- language: el
  script: Grek
