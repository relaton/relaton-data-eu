    parlamenta in Sveta o evropski poslovni statistiki in razveljavitvi desetih pravnih
    aktov na področju poslovne statistike
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2020/1197 de la Comisión, de 30 de julio
