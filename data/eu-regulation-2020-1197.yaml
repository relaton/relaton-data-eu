    europee sulle imprese, che abroga dieci atti giuridici nel settore delle statistiche
    sulle imprese
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/1197 (2020. gada 30. jūlijs),
