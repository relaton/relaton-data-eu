    auf die landwirtschaftlichen Erzeugnisse und bestimmte Verarbeitungserzeugnisse
    befristet anzuwendenden Umrechnungskurse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1224/96 af 28. juni 1996 om ændring
    af forordning (EF) nr. 1482/95 om fastsættelse af de omregningskurser, der skal
    anvendes i en overgangsperiode i forbindelse med den fælles toldtarif for landbrugsprodukter
    og visse varer, der er fremstillet ved forarbejdning af disse produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1224/96 της Επιτροπής
    της 28ης Ιουνίου 1996 για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1482/95 για τον καθορισμό
    των ισοτιμιών που θα εφαρμοσθούν προσωρινώς
    στο πλαίσιο του κοινού δασμολογίου για τα προϊόντα
    των γεωργικών τομέων και ορισμένα εμπορεύματα
    που προέρχονται από τη μεταποίηση των προϊόντων
    αυτών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1224/96, annettu 28 päivänä kesäkuuta 1996,
    maatalousalojen tuotteiden ja kyseisistä tuotteista ja jalostuksessa saatujen
    tiettyjen tavaroiden osalta yhteisessä tullitariffissa väliaikaisesti sovellettavista
    muuntokursseista annetun asetuksen (EY) N:o 1482/95 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1224/96 della Commissione del 28 giugno 1996 che modifica
    il regolamento (CE) n. 1482/95 che stabilisce i tassi di conversione da applicare
    in via transitoria nel quadro della tariffa doganale comune per i prodotti dei
    settori agricoli e per alcune merci ottenute dalla trasformazione di tali prodotti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1224/96 van de Commissie van 28 juni 1996 houdende
    wijziging van Verordening (EG) nr. 1482/95 tot vaststelling van de in het kader
    van het gemeenschappelijk douanetarief bij wijze van overgangsmaatregel toe te
    passen omrekeningskoersen voor landbouwprodukten en voor bepaalde door verwerking
    daarvan verkregen produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n 1224/96 da Comissão de 28 de Junho de 1996 que altera
    o Regulamento (CE) nº 1482/95 que determina as taxas de conversão a aplicar
    transitoriamente no âmbito da Pauta Aduaneira Comum para os produtos do sector
    agrícola e certas mercadorias resultantes da transformação desses produtos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1224/96 de la Comisión de 28 de junio de 1996 por el
    que se modifica el Reglamento (CE) nº 1482/95 por el que se determinan los tipos
    de conversión aplicables con carácter transitorio y con arreglo al arancel aduanero
    común a los productos del sector agrario y a determinadas mercancías procedentes
    de la transformación de dichos productos
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1224/96 av den 28 juni 1996 om ändring
