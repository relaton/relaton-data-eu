title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1224/96 of 28 June 1996 amending Regulation
    (EC) No 1482/95 determining as a transitional measure the conversion rates to
    be applied under the Common Customs Tariff to agricultural products and certain
    products obtained from the processing thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1224/96 de la Commission du 28 juin 1996 modifiant le
    règlement (CE) nº 1482/95 déterminant les taux de conversion à appliquer transitoirement
    dans le cadre du tarif douanier commun pour les produits des secteurs agricoles
    et certaines marchandises issues de la transformation de ces produits
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1224/96 der Kommission vom 28. Juni 1996 zur Änderung
