  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3558/85 della Commissione del 16 dicembre 1985 che
    modifica e proroga il regolamento (CEE) n. 2819/79 che sottopone ad un regime
    di sorveglianza comunitaria le importazioni di taluni prodotti tessili originari
    di alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3558/85 van de Commissie van 16 december 1985 tot
