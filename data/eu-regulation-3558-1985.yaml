  content: Commission Regulation (EEC) No 3558/85 of 16 December 1985 amending and
    extending Regulation (EEC) No 2819/79 making imports of certain textile products
    from certain third countries subject to Community surveillance
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3558/85 de la Commission du 16 décembre 1985 modifiant
    et prorogeant le règlement (CEE) no 2819/79 soumettant à un régime de surveillance
    communautaire les importations de certains produits textiles originaires de certains
    pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3558/85 der Kommission vom 16. Dezember 1985 zur Änderung
    und Verlängerung der Verordnung (EWG) Nr. 2819/79, mit der die Einfuhr bestimmter
    Textilwaren aus bestimmten Drittländern einer Gemeinschaftsüberwachung unterworfen
    wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3558/85 af 16. december 1985 om ændring
