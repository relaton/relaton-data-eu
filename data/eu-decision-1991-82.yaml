type: standard
title:
- language: en
  script: Latn
  content: '91/82/EEC, Euratom: Commission Decision of 4 February 1991 amending Decision
    90/177/Euratom, EEC authorizing Belgium not to take into account certain categories
    of transactions and to use certain approximate estimates for the calculation of
    the VAT own resources base (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/82/CEE, Euratom: Décision de la Commission, du 4 février 1991, modifiant
    la décision 90/177/Euratom, CEE autorisant la Belgique à ne pas tenir compte
    de certaines catégories d''opérations et à utiliser certaines estimations approximatives
    pour le calcul de la base des ressources propres provenant de la taxe sur la valeur
    ajoutée (Les textes en langues française et néerlandaise sont les seuls faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '91/82/EWG, Euratom: Entscheidung der Kommission vom 4. Februar 1991 zur
    Änderung der Entscheidung 90/177/Euratom, EWG, mit der Belgien ermächtigt wird,
    bei der Berechnung der Grundlage für die MwSt.- Eigenmittel bestimmte Gruppen
    von Umsätzen nicht zu berücksichtigen und die Grundlage bei bestimmten anderen
    Gruppen von Umsätzen anhand näherer Schätzungen zu ermitteln (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/82/EØF, Euratom: Kommissionens beslutning af 4. februar 1991 om ændring
    af beslutning 90/177/Euratom, EØF om bemyndigelse af Belgien til at beregne grundlaget
    for Fællesskabernes momsindtægter uden hensyntagen til visse transaktioner og,
    for andre transaktioners vedkommende, på basis af en tilnærmelsesvis vurdering
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '91/82/ΕΟΚ, Ευρατόμ: Απόφαση της Επιτροπής
    της 4ης Φεβρουαρίου 1991 για την τροποποίηση
    της απόφασης 90/177/Ευρατόμ, ΕΟΚ, με την οποία
    επιτρέπεται στο Βέλγιο να μη λαμβάνει υπόψη
    ορισμένες κατηγορίες δραστηριοτήτων και να
    χρησιμοποιεί κατά προσέγγιση εκτιμήσεις κατά
    τον υπολογισμό της βάσης των ιδίων πόρων που
    προέρχονται από το φόρο επί της προστιθέμενης
    αξίας (Τα κείμενα στην γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '91/82/CEE, Euratom: Decisione della Commissione, del 4 febbraio 1991,
    che modifica la decisione 90/177/Euratom, CEE che autorizza il Regno del Belgio
    a non tener conto di determinate categorie di operazioni e a ricorrere a talune
    valutazioni approssimative per il calcolo della base delle risorse proprie provenienti
    dall''imposta sul valore aggiunto (I testi in lingua francese e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '91/82/EEG, Euratom: Beschikking van de Commissie van 4 februari 1991 tot
    wijziging van Beschikking 90/177/Euratom, EEG, waarbij België wordt gemachtigd
    geen rekening te houden met bepaalde categorieën handelingen en gebruik te maken
    van ramingen voor de berekening van de grondslag van de eigen middelen uit de
    belasting over de toegevoegde waarde (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '91/82/CEE, Euratom: Decisão da Comissão, de 4 de Fevereiro de 1991,
    que altera a Decisão 90/177/Euratom, CEE, que autoriza a Bélgica a não ter
    em conta determinadas categorias de operações e a utilizar determinadas estimativas
    aproximativas para o cálculo da matéria colectável dos recursos próprios provenientes
    do Imposto sobre o Valor Acrescentado (Apenas fazem fé os textos nas línguas
    francesa e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '91/82/CEE, Euratom: Decisión de la Comisión, de 4 de febrero de 1991,
    por la que se modifica la Decisión 90/177/Euratom, CEE, por la que se autoriza
    a Bélgica a no tomar en consideración determinadas categorías de operaciones
    y a utilizar estimaciones aproximadas para el cálculo de la base de los recursos
    propios procedentes del Impuesto sobre el Valor Añadido (Los textos en lenguas
    francesa y neerlandesa son los únicos auténticos)'
  type: main
