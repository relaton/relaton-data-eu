title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1426/71 of the Council of 2 July 1971 laying down general
    rules for granting export refunds on products processed from fruit and vegetables
    and criteria for fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1426/71 du Conseil, du 2 juillet 1971, établissant,
    dans le secteur des produits transformés à base de fruits et légumes, les règles
    générales relatives à l' octroi des restitutions à l' exportation et aux critères
    de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1426/71 des Rates vom 2. Juli 1971 über die Grungregeln
    für die Gewährung der Erstattungen bei der Ausfuhr von Verarbeitungserzeugnissen
    aus Obst und Gemüse sowie die Kriterien für die Festsetzung der Erstattung
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1426/71 af 2. juli 1971 om de almindelige
    regler for ydelse af restitutioner ved udførsel af forarbejdede produkter af
    frugt og grønsager samt for kriterierne for restitutionens fastsættelse
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1426/71 del Consiglio, del 2 luglio 1971, che stabilisce
    nel settore dei prodotti trasformati a base di ortofrutticoli, le norme generali
    relative alla concessione delle restituzioni all' esportazione e ai criteri per
    la fissazione del loro ammontare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1426/71 van de Raad van 2 juli 1971 tot vaststelling
    van de algemene voorschriften betreffende de toekenning van de restituties bij
    uitvoer en de criteria voor de vaststelling van het bedrag van de restituties,
    in de sector van op basis van groenten en fruit verwerkte produkten
  type: main
