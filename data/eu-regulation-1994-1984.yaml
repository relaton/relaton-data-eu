title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1994/84 of 12 July 1984 amending for the
    sixth time Regulation (EEC) No 3183/80 laying down common detailed rules for the
    application of the system of import and export licences and advance fixing certificates
    for agricultural products and amending several Regulations laying down special
    rules for the application of the system of import and export licences
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1994/84 de la Commission du 12 juillet 1984 portant
    sixième modification du règlement (CEE) n° 3183/80 portant modalités communes
    d'application du régime de certificats d'importation, d'exportation et de préfixation
    pour les produits agricoles ainsi que modifiant plusieurs règlements portant
    modalités particulières d'application du régime des certificats d'importation
    et d'exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1994/84 der Kommission vom 12. Juli 1984 zur sechsten
    Änderung der Verordnung (EWG) Nr. 3183/80 über gemeinsame Durchführungsvorschriften
    für Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen für
    landwirtschaftliche Erzeugnisse und zur Änderung mehrerer Verordnungen mit besonderen
    Durchführungsbestimmungen zur Anwendung der Einfuhr- und Ausfuhrlizenzregelung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1994/84 af 12. juli 1984 om sjette
    ændring af forordning (EØF) nr. 3183/80 om fælles gennemførelsesbestemmelser
    for import- og eksportlicenser samt forudfastsættelsesattester for landbrugsvarer
    samt om ændring af flere forordninger om særlige gennemførelsesbestemmelser
    for import- og eksportlicenser
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1994/84 της Επιτροπής
    της 12ης Ιουλίου 1984 για έκτη τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3183/80 περί κοινών τρόπων
    εφαρμογής του καθεστώτος των πιστοποιητικών
    εισαγωγής, εξαγωγής και προκαθορισμού για
    τα γεωργικά προϊόντα, καθώς και για τροποποίηση
    διαφόρων κανονισμών σχετικά με τις ειδικές
    λεπτομέρειες εφαρμογής του καθεστώτος των
    πιστοποιητικών εισαγωγής και εξαγωγής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1994/84, annettu 12 päivänä heinäkuuta 1984,
    maataloustuotteiden tuonti-, vienti- ja ennakkovahvistustodistusten järjestelmän
    soveltamista koskevista yhteisistä yksityiskohtaisista säännöistä annetun
    asetuksen (ETY) N:o 3183/80 muuttamisesta kuudennen kerran sekä useiden tuonti-
    ja vientitodistusten järjestelmän soveltamista koskevista erityisistä yksityiskohtaisista
    säännöistä annettujen asetusten muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1994/84 della Commissione del 12 luglio 1984 recante
    sesta modifica del regolamento (CEE) n. 3183/80, che stabilisce le modalità comuni
    di applicazione del regime dei titoli d'importazione, di esportazione e di fissazione
    anticipata relativi ai prodotti agricoli, nonché modifica di vari regolamenti
    che stabiliscono le modalità particolari di applicazione del regime dei titoli
    d'importazione e di esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1994/84 van de Commissie van 12 juli 1984 houdende
    zesde wijziging van Verordening (EEG) nr. 3183/80 houdende gemeenschappelijke
    uitvoeringsbepalingen inzake het stelsel van invoer-, uitvoer- en voorfixatiecertificaten
    voor landbouwprodukten, en wijziging van verschillende verordeningen houdende
    bijzondere uitvoeringsbepalingen van het stelsel van invoer- en uitvoercertificaten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1994/84 da Comissão, de 12 de Julho de 1984, que
    estabelece sexta alteração do Regulamento (CEE) nº 3183/80 que estabelece as
    modalidades comuns de aplicação do regime de certificados de importação, de
    exportação e de prefixação para os produtos agrícolas e que altera vários
    regulamentos que estabelecem as modalidades especiais de aplicação do regime
    de certificados de importação e de exportação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1994/84 de la Comisión, de 12 de julio de 1984, por
    el que se modifica por sexta vez el Reglamento (CEE) n° 3181/80 por el que se
    establecen modalidades comunes de aplicación del régimen de certificados de
    importación, de exportación y de fijación anticipada para los productos agrícolas,
    y por el que se modifican asimismo varios Reglamentos por los que se establecen
    modalidades especiales de aplicación del régimen de certificados de importación
    y de exportación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 1994/84 av den 12 juli 1984 om sjätte
    ändringen av förordning (EEG) nr 3183/80 om gemensamma tillämpningsföreskrifter
    för systemet med import- och exportlicenser och förhandsfastställelselicens
    för jordbruksprodukter samt om ändring av flera förordningar om särskilda
    tillämpningsföreskrifter för systemet med import- och exportlicenser
  type: main
