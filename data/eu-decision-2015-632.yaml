    77/706/CEE du Conseil fixant un objectif communautaire de réduction de la consommation
    d'énergie primaire en cas de difficultés d'approvisionnement en pétrole brut
    et produits pétroliers et la décision 79/639/CEE de la Commission fixant les
    modalités de mise en œuvre de la décision 77/706/CEE du Conseil
  type: main
- language: de
  script: Latn
