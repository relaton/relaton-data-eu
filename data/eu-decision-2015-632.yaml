  content: Council Decision (EU) 2015/632 of 20 April 2015 repealing Council Decision
    77/706/EEC on the setting of a Community target for a reduction in the consumption
    of primary sources of energy in the event of difficulties in the supply of crude
    oil and petroleum products and Commission Decision 79/639/EEC laying down detailed
    rules for the implementation of Council Decision 77/706/EEC
  type: main
- language: fr
  script: Latn
