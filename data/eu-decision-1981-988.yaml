title:
- language: en
  script: Latn
  content: '81/988/EEC: Commission Decision of 30 October 1981 authorizing the French
    Republic to take protective measures with regard to imports of cotton yarn from
    Greece (Only the French and English texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/988/CEE: Décision de la Commission, du 30 octobre 1981, autorisant
    la République française à adopter des mesures de sauvegarde à l''importation
    des filés de coton en provenance de Grèce (Les textes en langues française
    et grecque sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/988/EWG: Entscheidung der Kommission vom 30. Oktober 1981, die die
    Französische Republik zur Anwendung von Schutzmaßnahmen bei der Einfuhr von
    Baumwollgarnen aus Griechenland ermächtigt (Nur der französische und griechische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/988/EØF: Kommissionens beslutning af 30. oktober 1981 om bemyndigelse
    til Den franske Republik til at træffe beskyttelsesforanstaltninger over for
    import af garn af bomuld fra Grækenland (Kun den franske og graeske udgave er
    autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/988/EOK: Απόφαση τής Επιτροπής τής 30ής Οκτωβρίου
    1981 παρέχουσα στή Γαλλική Δημοκρατία τήν έγκριση
    λήψεως μέτρων διασφαλίσεως έναντι τής εισαγωγής
    νημάτων βάμβακος προελεύσεως Ελλάδος (Τα κείμενα
    στην γαλλική και ελληνική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/988/CEE: Decisione della Commissione, del 30 ottobre 1981, che autorizza
    la Repubblica francese a disporre misure di salvaguardia all''importazione dei
    filati di cotone provenienti dalla Grecia (I testi in lingua francese e greca
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '81/988/EEG: Beschikking van de Commissie van 30 oktober 1981 waarbij de
    Franse Republiek wordt gemachtigd vrijwaringsmaatregelen te treffen ten opzichte
    van de invoer van garens van katoen, afkomstig uit Griekenland (Slechts de teksten
    in de Franse en de Griekse taal zijn authentiek)'
