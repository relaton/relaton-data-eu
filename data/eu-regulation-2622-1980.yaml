title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2622/80 of 13 October 1980 amending Regulation
    (EEC) No 2104/75 as regards certain special detailed rules for the application
    of the system of import licences in respect of products processed from fruit and
    vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2622/80 de la Commission, du 13 octobre 1980, modifiant
    le règlement (CEE) n° 2104/75 en ce qui concerne certaines modalités particulières
    d' application du régime des certificats d' importation dans le secteur des produits
    transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2622/80 der Kommission vom 13. Oktober 1980 zur Änderung
    der Verordnung (EWG) Nr. 2104/75 betreffend besondere Durchführungsbestimmungen
    für Einfuhrlizenzen für Verarbeitungserzeugnisse aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2622/80 af 13. oktober 1980 om ændring
    af forordning (EØF) nr. 2104/75 for så vidt angår visse særlige gennemførelsesbestemmelser
    for ordningen med importlicenser for produkter forarbejdet på basis af frugt
    og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 2622/80 της Επιτροπής,
