    ειδικά μέτρα εφαρμογής του καθεστώτος των
    πιστοποιητικών εισαγωγής στον τομέα των μεταποιημένων
    προϊόντων με βάση οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2622/80 della Commissione, del 13 ottobre 1980, che
    modifica il regolamento (CEE) n. 2104/75 per quanto riguarda talune modalità
    particolari d' applicazione del regime dei titoli d' importazione nel settore
    dei prodotti trasformati a base di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2622/80 van de Commissie van 13 oktober 1980 tot
