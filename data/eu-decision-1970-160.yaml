title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 février 1970, autorisant la République
    française à exclure du traitement communautaire les engrais minéraux ou chimiques
    azotés, de la position 31.02 B du Tarif douanier commun, originaires des pays
    de l'Est et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/160/EWG: Entscheidung der Kommission vom 5. Februar 1970 zur Ermächtigung
    der Französischen Republik, mineralische oder chemische Stickstoffdüngemittel
    der Tarifnummer 31.02 B des Gemeinsamen Zolltarifs mit Ursprung in den Staatshandelsländern,
    die sich in den übrigen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/160/CEE: Decisione della Commissione, del 5 febbraio 1970, con cui
    si autorizza la Repubblica francese a escludere dal trattamento comunitario i
    concimi minerali o chimici azotati, della voce 31.02 B della tariffa doganale
    comune, originari dei paesi dell''Est ed immessi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/160/EEG: Beschikking van de Commissie van 5 februari 1970 waarbij de
    Franse Republiek wordt gemachtigd minerale of chemische stikstofhoudende meststoffen
    van post 31.02 B van het gemeenschappelijk douanetarief, van oorsprong uit de
    Oostelijke landen en in de overige Lid- Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
