  content: '84/407/EEC: Commission Decision of 10 August 1984 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of certain
    kraft liner paper and board originating in Spain and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '84/407/CEE: Décision de la Commission du 10 août 1984 portant acceptation
