title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1593/95 of 30 June 1995 amending Regulation
    (EC) No 1432/94 with regard to the transitional adjustment of certain rules on
    imports to the Community of certain pigmeat in order to implement the Agricultural
    Agreement concluded during the Uruguay Round of negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1593/95 de la Commission, du 30 juin 1995, modifiant
    le règlement (CE) nº 1432/94 en ce qui concerne l' adaptation transitoire de
    certaines dispositions relatives aux importations dans la Communauté de certains
    produits du secteur de la viande de porc en vue de la mise en oeuvre de l' accord
    sur l' agriculture conclu dans le cadre des négociations du cycle d' Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1593/95 der Kommission vom 30. Juni 1995 zur Änderung
    der Verordnung (EG) Nr. 1432/94 zur übergangsweisen Anpassung mehrerer Bestimmungen
    betreffend die Einfuhr in die Gemeinschaft von Erzeugnissen des Sektors Schweinefleisch
    hinsichtlich der Anwendung des im Rahmen der multilateralen Handelsverhandlungen
    der Uruguay-Runde über die Landwirtschaft getroffenen Übereinkommens
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1593/95 af 30. juni 1995 om ændring
    af forordning (EF) nr. 1432/94 for så vidt angår midlertidig tilpasning af visse
    bestemmelser for indførsel til Fællesskabet af visse svinekøds produkter, med
    henblik på iværksættelsen af den landbrugsaftale, der er indgået i forbindelse
    med forhandlingerne under Uruguay-runden
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1593/95 της Επιτροπής
    της 30ής Ιουνίου 1995 για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1432/94 όσον αφορά την προσωρινή προσαρμογή
    ορισμένων διατάξεων που αφορούν τις εισαγωγές
    στην Κοινότητα ορισμένων προϊόντων του τομέα
    του χοιρείου κρέατος για την εφαρμογή της συμφωνίας
    επί της γεωργίας που συνήφθη στο πλαίσιο των
    διαπραγματεύσεων του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1593/95, annettu 30 päivänä kesäkuuta 1995,
    asetuksen (EY) N:o 1432/94 muuttamisesta tiettyjen sianliha-alan tuotteiden yhteisöön
    tuontia koskevien tiettyjen säännösten väliaikaisen mukautuksen osalta Uruguayn
    kierroksen yhteydessä käytyjen neuvotteluiden aikana tehdyn maataloussopimuksen
    täytäntöönpanemiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1593/95 della Commissione, del 30 giugno 1995, che
    modifica il regolamento (CE) n. 1432/94 per quanto concerne l' adeguamento transitorio
    di talune disposizioni relative alle importazioni nella Comunità di alcuni prodotti
    del settore delle carni suine ai fini dell' attuazione dell' accordo sull' agricoltura
    concluso nel quadro dei negoziati dell' Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1593/95 van de Commissie van 30 juni 1995 tot wijziging
    van Verordening (EG) nr. 1432/94 ten aanzien van de aanpassing, bij wijze van
    overgangsmaatregel, van een aantal bepalingen in verband met de invoer in de Gemeenschap
    van bepaalde produkten van de sector varkensvlees met het oog op de tenuitvoerlegging
    van de in het kader van de besprekingen van de Uruguay-Ronde gesloten Overeenkomst
    inzake de landbouw
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1593/95 da Comissão, de 30 de Junho de 1995, que
    altera o Regulamento (CE) nº 1432/94 no que diz respeito à adaptação transitória
    de certas disposições relativas às importações para a Comunidade de certos
    produtos do sector da carne de suíno com vista à aplicação do Acordo sobre
    a agricultura concluído no âmbito das negociações do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1593/95 de la Comisión, de 30 de junio de 1995, por
    el que, con vistas a la aplicación del Acuerdo agrícola celebrado en el marco
    de las negociaciones de la Ronda Uruguay, se modifica el Reglamento (CE) nº 1432/94
    para la adaptación transitoria de algunas disposiciones relativas a las importaciones
    en la Comunidad de ciertos productos del sector de la carne de porcino
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1593/95 av den 30 juni 1995 om ändring
    av förordning (EG) nr 1432/94 vad gäller en gradvis tillämpning av vissa bestämmelser
    för import till gemenskapen av vissa grisköttsprodukter och i syfte att genomföra
    det jordbruksavtal som slöts inom ramen för handelsförhandlingarna i Uruguayrundan
