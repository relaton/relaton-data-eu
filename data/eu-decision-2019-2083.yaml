  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/2083 ze dne 28. listopadu 2019
    o obnovení povolení pro uvádění produktů, které obsahují geneticky modifikovanou
    sóju MON 89788 (MON-89788-1), sestávají z ní nebo jsou z ní vyrobeny, na
    trh podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno
    pod číslem C(2019) 7482) (Pouze nizozemské a francouzské znění je závazné)
  type: main
