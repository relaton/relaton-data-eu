  script: Latn
  content: Decisão de Execução (UE) 2019/2083 da Comissão de 28 de novembro de
    2019 que renova a autorização de colocação no mercado de produtos que contenham,
    sejam constituídos por ou sejam produzidos a partir de soja geneticamente modificada
    MON 89788 (MON-89788-1) nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento
    Europeu e do Conselho [notificada com o número C(2019) 7482] (Apenas fazem fé
    os textos nas línguas francesa e neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/2083 a Comisiei din 28 noiembrie
    2019 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin, constau în sau sunt fabricate din soia modificată genetic MON 89788
    (MON-89788-1), în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului
    European și al Consiliului [notificată cu numărul C(2019) 7482] (Numai textele
    în limbile neerlandeză și franceză sunt autentice)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/2083 z 28. novembra 2019, ktorým
