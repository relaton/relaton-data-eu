  script: Latn
  content: Uitvoeringsbesluit (EU) 2019/2083 van de Commissie van 28 november 2019
    tot verlenging van de vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    soja MON 89788 (MON‐89788‐1) overeenkomstig Verordening (EG) nr. 1829/2003
