title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/2083 of 28 November 2019 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified soybean MON 89788 (MON-89788-1) pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2019) 7482) (Only the Dutch and French texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2019/2083 de la Commission du 28 novembre
    2019 renouvelant l’autorisation de mise sur le marché de produits contenant
    du soja génétiquement modifié MON 89788 (MON-89788-1), consistant en ce soja
    ou produits à partir de celui-ci, en application du règlement (CE) no 1829/2003
    du Parlement européen et du Conseil [notifiée sous le numéro C(2019) 7482]
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/2083 der Kommission vom 28. November
    2019 zur Erneuerung der Zulassung für das Inverkehrbringen von Erzeugnissen,
    die genetisch veränderte Sojabohnen der Sorte MON 89788 (MON-89788-1) enthalten,
    aus ihnen bestehen oder aus ihnen hergestellt werden, gemäß der Verordnung (EG)
    Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben unter
    Aktenzeichen C(2019) 7482) (Nur der französische und der niederländische Text
    sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2019/2083 на Комисията
    от 28 ноември 2019 година за подновяване на разрешението
    за пускане на пазара на продукти, съдържащи,
    състоящи се или произведени от генетично модифицирана
    соя MON 89788 (MON-89788-1), в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2019) 7482) (само текстовете
    на нидерландски и френски език са автентични)
  type: main
