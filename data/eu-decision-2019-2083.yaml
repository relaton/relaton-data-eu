    består af eller er fremstillet af genetisk modificeret MON 89788-sojabønne (MON-89788-1),
    i henhold til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt
    under nummer C(2019) 7482) (Kun den franske og den nederlandske udgave er autentiske)
  type: main
