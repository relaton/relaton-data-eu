  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/2083 оd 28. studenoga 2019. o produljenju
    odobrenja za stavljanje na tržište proizvoda koji sadržavaju genetski modificiranu
    soju MON 89788 (MON-89788-1), sastoje se ili su proizvedeni od nje, u skladu s
    Uredbom (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem
    dokumenta C(2019) 7482) (Vjerodostojni su samo tekstovi na francuskom i nizozemskom)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/2083 végrehajtási határozata (2019. november
    28.) a géntechnológiával módosított MON 89788 (MON-89788-1) szójababot tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról
    (az értesítés a C(2019) 7482. számú dokumentummal történt) (Csak a holland
    és a francia nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/2083 della Commissione del 28 novembre
    2019 che rinnova l’autorizzazione all’immissione in commercio di prodotti
    contenenti, costituiti o derivati da soia geneticamente modificata MON 89788 (MON-89788-1)
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2019) 7482] (I testi in lingua francese e neerlandese
    sono i soli facenti fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/2083 (2019. gada 28. novembris),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kas satur ģenētiski modificēto soju MON 89788
    (MON-89788-1), no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta
    numuru C(2019) 7482) (Autentisks ir tikai teksts franču un nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos igyvendinimo Sprendimas (ES) 2019/2083 2019 m. lapkričio 28
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 pratęsiamas
    leidimas pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų
    sojų MON 89788 (MON-89788-1), kurie iš jų sudaryti arba kurie iš jų pagaminti
    (pranešta dokumentu Nr. C(2019) 7482) (Tekstas autentiškas tik nyderlandų ir
    prancūzų kalbomis)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2019/2083 tat-28
