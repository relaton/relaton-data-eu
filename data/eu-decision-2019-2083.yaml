    que se compongan de soja modificada genéticamente MON 89788 (MON-89788-1), la
    contengan o se hayan producido a partir de ella, con arreglo al Reglamento (CE)
    n.o 1829/2003 del Parlamento Europeo y del Consejo [notificada con el número
    C(2019) 7482] (Los textos en lenguas francesa y neerlandesa son los únicos auténticos)
