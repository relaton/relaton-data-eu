    prodotti li jkun fihom il-fażola tas-sojja ġenetikament modifikata MON 89788
    (MON-89788-1), li jkunu jikkonsistu minnha, jew li jkunu magħmulin minnha, skont
    ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill (notifikata
