    povolenie umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú
    sóju MON 89788 (MON-89788-1), sú z nej zložené alebo vyrobené [oznámené
    pod číslom C(2019) 7482] (Iba francúzske a holandské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/2083 z dne 28. novembra 2019 o obnovitvi
