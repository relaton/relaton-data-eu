    89788 (MON-89788-1), so iz nje sestavljeni ali proizvedeni, v skladu z Uredbo
    (ES) št. 1829/2003 Evropskega parlamenta in Sveta (notificirano pod dokumentarno
    številko C(2019) 7482) (Besedilo v francoskem in nizozemskem jeziku je edino
