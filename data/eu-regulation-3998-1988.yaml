title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3998/88 of 21 December 1988 amending Regulation
    (EEC) No 643/86 laying down detailed rules for the application of the Supplementary
    Trade Mechanism to the live plants and floriculture products listed in Annex XXII
    to the Act of Accession and imported into Portugal concerning the target ceilings
    for the year 1989
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3998/88 de la Commission du 21 décembre 1988 modifiant
    le règlement (CEE) n° 643/86 de la Commission, du 28 février 1986, déterminant
    les modalités d'application du mécanisme complémentaire aux échanges pour
    les produits du secteur des plantes vivantes et de la floriculture importés au
    Portugal visées à l'annexe XXII de l'acte d'adhésion en ce qui concerne les
    plafonds indicatifs pour l'année 1989
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3998/88 DER KOMMISSION vom 21. Dezember 1988 zur
    Änderung der Verordnung (EWG) Nr. 643/86 mit Durchführungsbestimmungen zum ergänzenden
    Handelsmechanismus für die in Anhang XXII der Beitrittsakte aufgeführten, nach
    Portugal eingeführten Erzeugnisse des Sektors lebende Pflanzen und Waren des
    Blumenhandels betreffend die Richtplafonds für das Jahr 1989 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3998/88 af 21. december 1988 om ændring
    af forordning (EØF) nr. 643/86 om gennemførelsesbestemmelser til den supplerende
    mekanisme for samhandelen med levende planter og blomsterdyrkningens produkter
    importeret i Portugal, som omhandlet i bilag XXII til tiltrædelsesakten vedrørende
    de vejledende lofter for 1989
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3998/88 της Επιτροπής
    της 21ης Δεκεμβρίου 1988 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 643/86 που καθορίζει τις λεπτομέρειες
    εφαρμογής του συμπληρωματικού μηχανισμού
    στις συναλλαγές για τα προϊόντα του τομέα των
    ζωντανών φυτών και της ανθοκομίας που εισάγονται
    στην Πορτογαλία που αναφέρονται στο παράρτημα
    ΧΧΙΙ της πράξης προσχώρησης σε ό,τι αφορά τα
    ενδεικτικά όρια για το έτος 1989
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3998/88 DELLA COMMISSIONE del 21 dicembre 1988 che
    modifica il regolamento (CEE) n. 643/86 della Commissione, del 28 febbraio 1986,
    che fissa le modalità d'' applicazione del meccanismo complementare applicabile
    agli scambi per i prodotti appartenenti al settore delle piante vive e della floricoltura
    importati in Portogallo, menzionati nell'' allegato XXII dell'' atto di adesione
    per quanto riguardo i massimali indicativi per l'' anno 1989 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3998/88 VAN DE COMMISSIE van 21 december 1988 houdende
    wijziging van Verordening (EEG) nr. 643/86 tot vaststelling van de uitvoeringsbepalingen
    inzake de aanvullende regeling voor het handelsverkeer voor de in bijlage XXII
    van de Toetredingsakte genoemde produkten van de sector levende planten en produkten
    van de bloementeelt ingevoerd in Portugal wat betreft de indicatieve plafonds
    voor het jaar 1989 #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3998/88 DA COMISSAO de 21 de Dezembro de 1988 que
    altera o Regulamento (CEE) n* 643/86 da Comissao, de 28 de Fevereiro de 1986,
    que determina as regras de execuçao do mecanismo complementar às trocas comerciais
    para os produtos do sector das plantas vivas e produtos da floricultura importados
    em Portugal, referidos no Anexo XXII do Acto de Adesao no que se refere aos limites
    indicativos previstos para o ano de 1989
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3998/88 DE LA COMISIÓN de 21 de diciembre de 1988
    que modifica el Reglamento (CEE) no 643/86, por el que se establecen normas para
    la aplicación del mecanismo complementario aplicable a los intercambios para
    los productos del sector de las plantas vivas y de la floricultura importados
    en Portugal y mencionados en el Anexo XXII del Acta de adhesión en lo que concierne
    a los límites máximos indicativos para el año 1989 #'
