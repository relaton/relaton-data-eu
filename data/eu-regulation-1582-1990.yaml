    1989/1990, il quantitativo massimo di olio di girasole da immettere in consumo
    in Spagna e da esportare da tale Stato membro
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1582/90 VAN DE COMMISSIE van 13 juni 1990 tot wijziging
