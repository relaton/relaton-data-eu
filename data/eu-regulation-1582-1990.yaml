    abzufertigenden und aus diesem Mitgliedstaat auszufuehrenden Hoechstmengen Sonnenblumenoel
    fuer das Wirtschaftsjahr 1989/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1582/90 af 13. juni 1990 om ændring
