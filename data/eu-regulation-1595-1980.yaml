title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1595/80 of 24 June 1980 fixing, for the 1980/81
    sugar marketing year, the differential charge to be levied on raw preferential
    sugar and the differential amount to be granted in respect of raw cane sugar from
    the French overseas departments
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1595/80 du Conseil, du 24 juin 1980, fixant, pour
    la campagne sucrière 1980/1981, la cotisation différentielle à percevoir sur
    le sucre préférentiel brut et le montant différentiel à accorder au sucre
    de canne brut des départements français d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1595/80 des Rates vom 24. Juni 1980 zur Festsetzung
    der Differenzabgabe auf rohen Präferenzzucker und des Differenzbetrags für den
    in den französischen überseeischen Departements erzeugten Rohrohrzucker für
    das Zuckerwirtschaftsjahr 1980/81
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1595/80 af 24. juni 1980 om fastsættelse
    for sukkerproduktionsåret 1980/81 af den differenceafgift, der skal opkræves
    for præferenceråsukker, og det differencebeløb, som skal ydes til rørråsukker
    fra de franske oversøiske departementer
  type: main
- language: el
  script: Grek
