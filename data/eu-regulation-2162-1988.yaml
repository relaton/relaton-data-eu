title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2162/88 of 20 July 1988 laying down to what
    extent applications for issue of export licences submitted during July 1988 for
    beef and veal products which may benefit from special import treatment in a third
    country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2162/88 de la Commission, du 20 juillet 1988, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois juillet 1988 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2162/88 der Kommission vom 20. Juli 1988 über das
    Ausmaß, in dem den im Juli 1988 eingereichten Anträgen auf Ausfuhrlizenzen für
    Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2162/88 af 20. juli 1988 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i juli
    1988 for oksekødprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2162/88 της Επιτροπής
    της 20ής Ιουλίου 1988 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Ιούλιο 1988 για τα προϊόντα του
    τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2162/88 della Commissione, del 20 luglio 1988, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di luglio 1988 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2162/88 van de Commissie van 20 juli 1988 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 1988 ingediende aanvragen
    om uitvoercertificaten voor produkten van de sector rundvlees waarvoor een bijzondere
    behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2162/88 da Comissão, de 20 de Julho de 1988, que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Julho de 1988 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2162/88 de la Comisión, de 20 de julio de 1988, por
    el que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentadas en el mes de julio de 1988, para los productos del
    sector de la carne de bovino que se beneficien de un trato especial para su importación
    en un país tercero
  type: main
