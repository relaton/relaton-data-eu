  script: Latn
  content: '82/20/EEC: Commission Decision of 14 December 1981 amending the list of
    establishments in the Argentine Republic approved for the purpose of importing
    fresh beef and veal, sheepmeat and meat of domestic solipeds into the Community'
  type: main
- language: fr
  script: Latn
  content: '82/20/CEE: Décision de la Commission, du 14 décembre 1981, modifiant
