    dans la Communauté de viandes fraîches bovines, ovines et de solipèdes domestiques'
  type: main
- language: de
  script: Latn
  content: '82/20/EWG: Entscheidung der Kommission vom 14. Dezember 1981 zur Änderung
    der Liste der Betriebe in der Republik Argentinien, aus denen die Einfuhr von
    frischem Fleisch von Rindern und Schafen sowie von Einhufern (Haustieren) in die
    Gemeinschaft zugelassen ist'
  type: main
- language: da
  script: Latn
  content: '82/20/EØF: Kommissionens beslutning af 14. december 1981 om ændring
