title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 948/83 of 21 April 1983 re-establishing
    the levying of customs duties on other sheep and lamb skin leather, falling within
    subheading 41.03 B II and originating in Pakistan, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 948/83 de la Commission du 21 avril 1983 portant rétablissement
    de la perception des droits de douane applicables aux autres peaux d' ovins, non
    dénommées, de la sous-position 41.03 B II du tarif douanier commun, originaires
    du Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 948/83 der Kommission vom 21. April 1983 zur Wiedereinführung
    der Erhebung der Zölle für ein anderes Schaf- und Lammleder der Tarifstelle
    41.03 B II, mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3377/82
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 948/83 af 21. april 1983 om genindførelse
    af opkrævning af told for andet læder af fåre- og lammeskind, henhørende under
    pos. 41.03 B II og med oprindelse i Pakistan, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 948/83 της Επιτροπής
    της 21ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για έτερα δέρματα προβατοειδών,
    μη κατονομαζόμενα, της διακρίσεως 41.03 Β ΙΙ του
    Κοινού Δασμολογίου, καταγωγής Πακιστάν, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3377/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 948/83 della Commissione del 21 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle altre pelli ovine, non nominate,
    della sottovoce 41.03 B II della tariffa doganale comune, originarie del Pakistan,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 948/83 van de Commissie van 21 april 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op overig schapeleder
