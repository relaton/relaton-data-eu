title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 662/91 of 19 March 1991 amending Regulation
    (EEC) No 3813/90 laying down the level of the accession compensatory amounts for
    milk and milk products applicable between the Community of Ten and Portugal and
    third countries
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 662/91 DE LA COMMISSION du 19 mars 1991 modifiant
    le règlement (CEE) no 3813/90 arrêtant dans le secteur du lait et des produits
    laitiers le niveau des montants compensatoires « adhésion » dans les échanges
    entre la Communauté à dix et le Portugal et entre le Portugal et les pays tiers
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 662/91 DER KOMMISSION vom 19. März 1991 zur Änderung
    der Verordnung (EWG) Nr. 3813/90 zur Festsetzung der Beitrittsausgleichsbeträge
    für Milch und Milcherzeugnisse im Handel zwischen der Zehnergemeinschaft und
    Portugal sowie zwischen Portugal und Drittländern #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 662/91 af 19. marts 1991 om ændring
    af forordning (EØF) nr. 3813/90 om fastsættelse af tiltrædelsesudligningsbeløbene
    for mælk og mejeriprodukter i samhandelen mellem De Ti og Portugal og mellem
    Portugal og tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 662/91 της Επιτροπής
    της 19ης Μαρτίου 1991 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3813/90 με τον οποίο αποφασίζεται,
    στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων, το ύψος των εξισωτικών ποσών προσχώρησης
    στις εμπορικές συναλλαγές μεταξύ της Κοινότητας
    των Δέκα και της Πορτογαλίας και μεταξύ της
    Πορτογαλίας και των τρίτων χωρών
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 662/91 DELLA COMMISSIONE del 19 marzo 1991 recante
    modifica del regolamento (CEE) n. 3813/90 che fissa, nel settore del latte e dei
    prodotti lattiero-caseari, il livello degli importi compensativi adesione applicabile
    negli scambi tra la Comunità dei Dieci e il Portogallo, nonché tra il Portogallo
    e i paesi terzi #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 662/91 VAN DE COMMISSIE van 19 maart 1991 tot wijziging
    van Verordening (EEG) nr. 3813/90 tot vaststelling van het niveau van de in het
    handelsverkeer tussen de Gemeenschap van de Tien en Portugal en tussen Portugal
    en derde landen toe te passen compenserende bedragen toetreding in de sector melk
    en zuivelprodukten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 662/91 DA COMISSÃO de 19 de Março de 1991 que
    altera o Regulamento (CEE) nº 3813/90, que adopta, no sector do leite e dos produtos
    lácteos, o nível dos montantes compensatórios de adesão nas trocas comerciais
    entre a Comunidade dos Dez e Portugal e entre Portugal e os países terceiros
    #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 662/91 DE LA COMISIÓN de 19 de marzo de 1991 por
    el que se modifica el Reglamento (CEE) nº 3813/90 por el que se fija el nivel
    de los montantes compensatorios de adhesión del sector de la leche y de los productos
    lácteos aplicables a los intercambios entre la Comunidad de los Diez y Portugal
    y entre Portugal y los terceros países #'
