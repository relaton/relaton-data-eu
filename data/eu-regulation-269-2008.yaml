title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 269/2008 of 19 March 2008 prohibiting fishing
    for blue ling in ICES zones VI and VII (Community waters and waters not under
    the sovereignty or jurisdiction of third countries) by vessels flying the flag
    of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 269/2008 de la Commission du 19 mars 2008 interdisant
