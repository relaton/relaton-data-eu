title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1549 of 30 July 2025 correcting
    Implementing Regulations (EU) 2023/2210 and (EU) 2022/1365 as regards the conditions
    of use of the novel foods 3-Fucosyllactose produced by a derivative strain of
    Escherichia coli K-12 DH1 and Schizochytrium sp. oil rich in DHA and EPA
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1549 de la Commission du 30 juillet
    2025 rectifiant les règlements d’exécution (UE) 2023/2210 et (UE) 2022/1365
    en ce qui concerne les conditions d’utilisation des nouveaux aliments 3-fucosyllactose
    produit au moyen d’une souche dérivée d’Escherichia coli K-12 DH1 et huile
    extraite de Schizochytrium sp. à teneur élevée en DHA et EPA
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1549 der Kommission vom 30. Juli 2025
    zur Berichtigung der Durchführungsverordnungen (EU) 2023/2210 und (EU) 2022/1365
    hinsichtlich der Verwendungsbedingungen für die neuartigen Lebensmittel 3-Fucosyllactose
    aus einem abgeleiteten Stamm von Escherichia coli K-12 DH1 und DHA- und EPA-reiches
    Öl aus Schizochytrium sp.
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/1549 на Комисията
    от 30 юли 2025 година за поправка на регламенти
    за изпълнение (ЕС) 2023/2210 и (ЕС) 2022/1365 по отношение
    на условията на употреба на новите храни 3-фукозиллактоза,
    получена от производен щам на Escherichia coli K-12 DH1,
    и богато на DHA и EPA масло от Schizochytrium sp.
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/1549 ze dne 30. července 2025,
    kterým se mění prováděcí nařízení (EU) 2023/2210 a (EU) 2022/1365, pokud
    jde o podmínky použití nových potravin 3-fukosyllaktosy produkované derivovaným
    kmenem Escherichia coli K-12 DH1 a oleje z mikrořas Schizochytrium sp. bohatého
    na DHA a EPA
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/1549 af 30. juli 2025
    om berigtigelse af gennemførelsesforordning (EU) 2023/2210 og (EU) 2022/1365
    for så vidt angår anvendelsesbetingelserne for de nye fødevarer 3-fucosyllactose
    fremstillet af en afledt stamme af Escherichia coli K-12 DH1 og olie med højt
    indhold af DHA og EPA fremstillet af Schizochytrium sp.
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2025/1549 της Επιτροπής,
    της 30ής Ιουλίου 2025, για τη διόρθωση των εκτελεστικών
    κανονισμών (ΕΕ) 2023/2210 και (ΕΕ) 2022/1365 όσον αφορά
    τους όρους χρήσης των νέων τροφίμων 3-φουκοζυλολακτόζη
    που παράγεται με παράγωγο στέλεχος Escherichia coli
    K-12 DH1 και έλαιο από Schizochytrium sp., πλούσιο σε DHA
    και EPA
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2025/1549, 30. juuli 2025, millega parandatakse
    rakendusmäärusi (EL) 2023/2210 ja (EL) 2022/1365 seoses uuendtoitude Escherichia
    coli K-12 DH1 tuletatud tüve abil saadud 3-fukosüüllaktoosi ning mikrovetikast
    Schizochytrium sp. saadud DHA- ja EPA-rikka õli kasutustingimustega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2025/1549, annettu 30 päivänä
    heinäkuuta 2025, täytäntöönpanoasetusten (EU) 2023/2210 ja (EU) 2022/1365
    oikaisemisesta siltä osin kuin on kyse uuselintarvikkeiden Escherichia coli -kannasta
    K-12 DH1 johdetun kannan avulla tuotettu 3-fukosyllaktoosi ja Schizochytrium sp.
    -mikrolevästä valmistettu runsaasti DHA:ta ja EPA:ta sisältävä öljy käyttöedellytyksistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2025/1549 ón gCoimisiún an 30 Iúil
    2025 lena gceartaítear Rialacháin Cur Chun Feidhme (AE) 2023/2210 agus (AE)
    2022/1365 a mhéid a bhaineann le coinníollacha úsáide na mbianna núíosacha
    3-Fúcaishiollachtós arna tháirgeadh le tréithchineál díorthach de Escherichia
    coli K-12(DH1) agus ola Schizochytrium sp. atá saibhir in aigéad docaisiheicséanóch
    agus in aigéad icisipeintéanóch
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/1549 оd 30. srpnja 2025. o ispravku
    provedbenih uredaba (EU) 2023/2210 i (EU) 2022/1365 u pogledu uvjeta upotrebe
    nove hrane 3-fukozil laktoza proizvedena s izvedenim sojem Escherichia coli K-12
    DH1 i ulje od mikroalge Schizochytrium sp. bogato DHK-om i EPA-om
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1549 végrehajtási rendelete (2025. július 30.)
    az (EU) 2023/2210 és az (EU) 2022/1365 végrehajtási rendeletnek az Escherichia
    coli K-12 DH1 származékos törzsével előállított 3-fukozillaktóz és a
    DHA-ban és EPA-ban gazdag Schizochytrium sp. olaj új élelmiszer felhasználási
    feltételei tekintetében történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1549 della Commissione, del 30 luglio
    2025, che rettifica i regolamenti di esecuzione (UE) 2023/2210 e (UE) 2022/1365
    per quanto riguarda le condizioni d’uso dei nuovi alimenti 3-fucosillattosio
    prodotto da un ceppo derivato di Escherichia coli K-12 DH1 e olio ricco di DHA
    e di EPA derivato da Schizochytrium sp.
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1549 (2025. gada 30. jūlijs),
    ar ko attiecībā uz jauno pārtikas produktu 3-fukozillaktozes (iegūta no atvasināta
    Escherichia coli celma K-12 DH1) un ar DHA un EPA bagātas Schizochytrium sp.
    eļļas lietošanas nosacījumiem labo Īstenošanas regulas (ES) 2023/2210 un
    (ES) 2022/1365
  type: main
- language: lt
  script: Latn
  content: 2025 m. liepos 30 d. Komisijos įgyvendinimo reglamentas (ES) 2025/1549,
    kuriuo dėl naujų maisto produktų – 3-fukozillaktozės, pagamintos naudojant
    Escherichia coli K-12 DH1 išvestinę padermę, ir mikrodumblių Schizochytrium
    sp. aliejaus, kuriame gausu DHR ir EPR, – naudojimo sąlygų ištaisomi įgyvendinimo
    reglamentai (ES) 2023/2210 ir (ES) 2022/1365
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/1549 tat-30
    ta’ Lulju 2025 li jikkoreġi r-Regolamenti ta’ Implimentazzjoni (UE) 2023/2210
    u (UE) 2022/1365 fir-rigward tal-kundizzjonijiet tal-użu tal-ikel ġdid 3-Fukosillattożju
    prodott minn razza derivattiva ta’ Escherichia coli K-12 DH1 u ż-żejt tas-Schizochytrium
    sp. li fih ħafna DHA u EPA
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/1549 van de Commissie van 30 juli 2025
    tot rectificatie van de Uitvoeringsverordeningen (EU) 2023/2210 en (EU) 2022/1365
    wat betreft de gebruiksvoorwaarden voor de nieuwe voedingsmiddelen 3-fucosyllactose,
    geproduceerd door een afgeleide stam van Escherichia coli K-12 DH1, en olie van
    Schizochytrium sp. rijk aan DHA en EPA
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/1549 z dnia 30 lipca 2025
    r. w sprawie sprostowania rozporządzeń wykonawczych (UE) 2023/2210 i (UE) 2022/1365
    w odniesieniu do warunków stosowania nowej żywności 3-fukozylolaktoza wytwarzana
    przy użyciu pochodnego szczepu Escherichia coli K-12 DH1 i olej ze Schizochytrium
    sp. bogaty w DHA i EPA
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/1549 da Comissão, de 30 de julho de
    2025, que retifica os Regulamentos de Execução (UE) 2023/2210 e (UE) 2022/1365
    no que se refere às condições de utilização dos novos alimentos 3-fucosil-lactose
    produzida por uma estirpe derivada de Escherichia coli K-12 DH1 e óleo rico em
    DHA e EPA de Schizochytrium sp.
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1549 al Comisiei din 30 iulie
    2025 de rectificare a Regulamentelor de punere în aplicare (UE) 2023/2210 și
    (UE) 2022/1365 în ceea ce privește condițiile de utilizare a alimentelor noi
    3-fucozil-lactoză produsă de o tulpină derivată de Escherichia coli K-12 DH1
    și ulei de Schizochytrium sp. bogat în DHA și EPA
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/1549 z 30. júla 2025, ktorým
    sa opravujú vykonávacie nariadenia (EÚ) 2023/2210 a (EÚ) 2022/1365, pokiaľ
    ide o podmienky používania nových potravín 3-fukozyllaktóza produkovaná
    kmeňom derivovaným z Escherichia coli K-12 DH1 a olej z mikrorias Schizochytrium
    sp. s vysokým obsahom DHA a EPA
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1549 z dne 30. julija 2025 o popravku
    izvedbenih uredb (EU) 2023/2210 in (EU) 2022/1365 glede pogojev uporabe novih
    živil 3-fukozillaktoza, proizvedena z derivatnim sevom Escherichia coli K-12
    DH1, in olje iz Schizochytrium sp., bogato z DHA in EPA
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1549 de la Comisión, de 30 de julio
    de 2025, por el que se corrigen los Reglamentos de Ejecución (UE) 2023/2210 y
    (UE) 2022/1365 en lo que respecta a las condiciones de uso de los nuevos alimentos
    3-fucosil-lactosa producida por una cepa derivada de Escherichia coli K-12 (DH1)
    y aceite rico en DHA y EPA de Schizochytrium sp.
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/1549 av den 30 juli 2025
    om rättelse av genomförandeförordningarna (EU) 2023/2210 och (EU) 2022/1365
    vad gäller villkoren för användning av de nya livsmedlen 3-fukosyllaktos framställd
    av en derivatstam av Escherichia coli K-12 DH1 och DHA- och EPA-rik olja från
    Schizochytrium sp.
