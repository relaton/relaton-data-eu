title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2799/83 of 6 October 1983 re-establishing
    the levying of customs duties on image projectors (other than cinematographic
    projectors); photographic (except cinematographic) enlargers and reducers, falling
    within heading No 90.09 and originating in Singapore, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CEE) no 2799/83 de la Commission du 6 octobre 1983 portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de projection fixe: appareils d'' agrandissement ou de réduction photographiques,
    de la position 90.09 du tarif douanier commun, originaires de Singapour, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil'
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2799/83 der Kommission vom 6. Oktober 1983 zur Wiedereinführung
    der Erhebung der Zölle für Stehbildwerfer; photographische Vergrößerungs-
    oder Verkleinerungsapparate der Tarifnummer 90.09, mit Ursprung in Singapur, dem
    die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2799/83 af 6. oktober 1983 om genindførelse
    af opkrævning af told for lysbilledapparater, forstørrelses- og formindskelsesapparater
    til fotografisk brug (undtagen kinematografiske), henhørende under pos. 90.09
    og med oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2799/83 της Επιτροπής
    της 6ης Οκτωβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για μηχανήματα ακινήτου
    προβολής και μηχανήματα φωτογραφικών μεγεθύνσεων
    ή σμικρύνσεων, της κλάσεως 90.09 του Κοινού Δασμολογίου,
    καταγωγής Σιγκαπούρης, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2799/83 della Commissione del 6 ottobre 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli apparecchi da proiezione fissa
    e agli apparecchi fotografici d' ingrandimento o di riduzione, della voce 90.09
    della tariffa doganale comune, originari di Singapore beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2799/83 van de Commissie van 6 oktober 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op projectietoestellen
    voor niet bewegende beelden; vergrotings- en verkleiningstoestellen voor de fotografie,
    van tariefpost 90.09, van oorsprong uit Singapore, waarvoor de in Verordening
    (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
