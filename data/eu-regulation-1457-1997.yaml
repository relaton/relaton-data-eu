    régime commun applicable aux importations de produits textiles en provenance
    de certains pays tiers non couverts par des accords, protocoles ou autres arrangements
    bilatéraux, ou par d'autres régimes communautaires spécifiques d'importation
  type: main
- language: de
  script: Latn
