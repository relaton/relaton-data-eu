    gemeinsame Regelung der Einfuhren von Textilwaren aus bestimmten Drittländern,
    die nicht unter bilaterale Abkommen, Protokolle, andere Vereinbarungen oder eine
    spezifische gemeinschaftliche Einfuhrregelung fallen
  type: main
- language: da
  script: Latn
