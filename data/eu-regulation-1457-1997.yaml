  content: Commission Regulation (EC) No 1457/97 of 25 July 1997 amending Annexes
    III (B), IV and VI to Council Regulation (EC) No 517/94 on common rules for imports
    of textile products from certain third countries not covered by bilateral agreements,
    protocols or other arrangements, or by other specific Community import rules
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1457/97 de la Commission du 25 juillet 1997 modifiant
