title:
- language: en
  script: Latn
  content: Commission Directive 1999/64/EC of 23 June 1999 amending Directive 90/388/EEC
    in order to ensure that telecommunications networks and cable TV networks owned
    by a single operator are separate legal entities
  type: main
- language: fr
  script: Latn
  content: Directive 1999/64/CE de la Commission du 23 juin 1999 modifiant la directive
    90/388/CEE en vue de garantir que les réseaux de télécommunications et les
    réseaux câblés de télévision appartenant à un seul et même opérateur constituent
    des entités juridiques distinctes
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/64/EG der Kommission vom 23. Juni 1999 zur Änderung der
    Richtlinie 90/388/EWG im Hinblick auf die Organisation ein- und demselben Betreiber
    gehörender Telekommunikations- und Kabelfernsehnetze in rechtlich getrennten
    Einheiten
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 1999/64/EF af 23. juni 1999 om ændring af direktiv
    90/388/EØF med henblik på at sikre, at tele- og kabel-tv-net, der ejes af en
    enkelt operatør, adskilles i retlig henseende
  type: main
- language: el
  script: Grek
  content: Οδηγία 1999/64/ΕΚ της Επιτροπής της 23ης Ιουνίου
    1999 για τροποποίηση της οδηγίας 90/388/ΕΟΚ προκειμένου
    να εξασφαλισθεί ο νομικός διαχωρισμός της
    παροχής δικτύων τηλεπικοινωνιών από την παροχή
    δικτύων καλωδιακής τηλεόρασης που ανήκουν
    στον ίδιο φορέα
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 1999/64/EY, annettu 23 päivänä kesäkuuta 1999,
    direktiivin 90/388/ETY muuttamisesta sen varmistamiseksi, että operaattorin omistamat
    televerkot ja kaapelitelevisioverkot ovat erillisiä oikeudellisia yksiköitä
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/64/CE della Commissione del 23 giugno 1999 che modifica
    la direttiva 90/388/CEE al fine di garantire che le reti di telecomunicazioni
    e le reti televisive via cavo appartenenti ad un unico proprietario siano gestite
    da persone giuridiche distinte
  type: main
- language: nl
  script: Latn
  content: Richtlijn 1999/64/EG van de Commissie van 23 juni 1999 tot wijziging van
    Richtlijn 90/388/EEG teneinde ervoor te zorgen dat telecommunicatie- en kabeltelevisienetten
    die eigendom van eenzelfde exploitant zijn, gescheiden juridische eenheden vormen
  type: main
- language: pt
  script: Latn
  content: Directiva 1999/64/CE da Comissão de 23 de Junho de 1999 que altera a Directiva
    90/388/CEE no sentido de assegurar que as redes de telecomunicações e as redes
    de televisão por cabo propriedade de um único operador constituem entidades
    juridicamente distintas
  type: main
- language: es
  script: Latn
  content: Directiva 1999/64/CE de la Comisión de 23 de junio de 1999 por la que
    se modifica la Directiva 90/388/CEE con objeto de garantizar que las redes de
    telecomunicaciones y de televisión por cable propiedad de un único operador
    sean entidades jurídicas independientes
  type: main
- language: sv
