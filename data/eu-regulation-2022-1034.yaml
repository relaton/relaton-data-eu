    die Ausstellung, Überprüfung und Anerkennung interoperabler Zertifikate zur
    Bescheinigung von COVID-19-Impfungen und -Tests sowie der Genesung von einer COVID-19-Infektion
    (digitales COVID-Zertifikat der EU) mit der Zielsetzung der Erleichterung der
    Freizügigkeit während der COVID-19-Pandemie
  type: main
- language: bg
  script: Cyrl
