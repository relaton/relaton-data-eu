title:
- language: en
  script: Latn
  content: Regulation (EU) 2022/1034 of the European Parliament and of the Council
    of 29 June 2022 amending Regulation (EU) 2021/953 on a framework for the issuance,
    verification and acceptance of interoperable COVID-19 vaccination, test and recovery
    certificates (EU Digital COVID Certificate) to facilitate free movement during
    the COVID-19 pandemic
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/1034 du Parlement européen et du Conseil du 29 juin
    2022 modifiant le règlement (UE) 2021/953 relatif à un cadre pour la délivrance,
    la verification et l’acceptation de certificats COVID-19 interopérables de
    vaccination, de test et de rétablissement (certificat COVID numérique de l’UE)
    afin de faciliter la libre circulation pendant la pandémie de COVID-19
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/1034 des Europäischen Parlaments und des Rates vom
