    проверката и приемането на оперативно съвместими
    сертификати за ваксинация срещу, направено
    изследване за и преболедуване на COVID-19 (Цифров
    COVID сертификат на ЕС) с цел улесняване на свободното
    движение по време на пандемията от COVID-19
  type: main
