title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/363 of 11 October 2023 amending
    the regulatory technical standards laid down in Delegated Regulation (EU) 2015/2205
    as regards the transition to the TONA and SOFR benchmarks referenced in certain
    OTC derivative contracts
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/363 de la Commission du 11 octobre 2023
    modifiant les normes techniques de réglementation définies par le règlement
    délégué (UE) 2015/2205 en ce qui concerne la transition vers les indices de
    référence TONA et SOFR auxquels se réfèrent certains contrats dérivés de
    gré à gré
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/363 der Kommission vom 11. Oktober 2023
    zur Änderung der in der Delegierten Verordnung (EU) 2015/2205 festgelegten technischen
    Regulierungsstandards mit dem Ziel, der Umstellung auf die Referenzzinssätze
    TONA und SOFR bei bestimmten OTC-Derivatkontrakten Rechnung zu tragen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/363 на Комисията
