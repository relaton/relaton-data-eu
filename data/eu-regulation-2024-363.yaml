    v přenesené pravomoci (EU) 2015/2205, pokud jde o přechod na referenční hodnoty
    sazeb TONA a SOFR, na něž se odkazuje v některých OTC derivátových smlouvách
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/363 af 11. oktober 2023 om
