title:
- language: en
  script: Latn
  content: '2005/257/: Council Decision of 14 March 2005 amending Decision 2000/256/EC
    authorising the Kingdom of the Netherlands to apply a measure derogating from
    Article 11 of the Sixth Directive 77/388/EEC on the harmonisation of the laws
    of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '2005/257/: Décision du Conseil du 14 mars 2005 modifiant la décision
    2000/256/CE du Conseil autorisant le Royaume des Pays-Bas à appliquer une mesure
    dérogatoire à l’article 11 de la sixième directive 77/388/CEE en matière
    d’harmonisation des législations des États membres relatives aux taxes sur
    le chiffre d’affaires'
  type: main
- language: de
  script: Latn
  content: '2005/257/: Entscheidung des Rates vom 14. März 2005 zur Änderung der
    Entscheidung 2000/256/EG zur Ermächtigung des Königreichs der Niederlande zur
    Anwendung einer von Artikel 11 der Sechsten Richtlinie 77/388/EWG zur Harmonisierung
    der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern abweichenden
    Regelung'
  type: main
- language: cs
  script: Latn
  content: '2005/257/: Rozhodnutí Rady ze dne 14. března 2005, kterým se mění
    rozhodnutí 2000/256/ES, kterým se Nizozemskému království povoluje uplatňovat
    opatření odchylující se od článku 11 šesté směrnice 77/388/EHS o harmonizaci
    právních předpisů členských států týkajících se daní z obratu'
  type: main
- language: da
  script: Latn
  content: '2005/257/: Rådets beslutning af 14. marts 2005 om ændring af beslutning
    2000/256/EF om bemyndigelse af Kongeriget Nederlandene til at anvende en foranstaltning,
    der fraviger bestemmelserne i artikel 11 i sjette direktiv 77/388/EØF om harmonisering
    af medlemsstaternes lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '2005/257/: Απόφαση του Συμβουλίου, της 14ης Μαρτίου
    2005, για την τροποποίηση της απόφασης 2000/256/ΕΚ
    με την οποία επιτρέπεται στο Βασίλειο των Κάτω
    Χωρών να εφαρμόσει μέτρο παρέκκλισης από το
    άρθρο 11 της έκτης οδηγίας 77/388/ΕΟΚ περί εναρμονίσεως
    των νομοθεσιών των κρατών μελών των σχετικών
    με τους φόρους κύκλου εργασιών'
  type: main
- language: et
  script: Latn
  content: '2005/257/: Nõukogu otsus, 14. märts 2005, millega muudetakse otsust
    2000/256/EÜ, millega lubatakse Madalmaade Kuningriigil kohaldada meedet, mis
    kaldub kõrvale kuuenda direktiivi 77/388/EMÜ (kumuleeruvate käibemaksudega
    seotud liikmesriikide õigusaktide ühtlustamise kohta) artiklist 11'
  type: main
- language: fi
  script: Latn
  content: '2005/257/: Neuvoston päätös, tehty 14 päivänä maaliskuuta 2005,
    luvan antamisesta Alankomaiden kuningaskunnalle soveltaa jäsenvaltioiden liikevaihtoverolainsäädännön
    yhdenmukaistamisesta annetun kuudennen direktiivin (77/388/ETY) 11 artiklasta
    poikkeavaa toimenpidettä tehdyn päätöksen 2000/256/EY muuttamisesta'
  type: main
- language: hu
  script: Latn
  content: '2005/257/: A Tanács határozata (2005. március 14.) a tagállamok forgalmi
    adóra vonatkozó jogszabályainak összehangolásáról szóló 77/388/EGK hatodik
    tanácsi irányelv 11. cikkétől eltérő intézkedés alkalmazásának a Holland
    Királyság részére történő engedélyezéséről szóló 2000/256/EK határozat
    módosításáról'
  type: main
- language: it
  script: Latn
  content: '2005/257/: Decisione del Consiglio, del 14 marzo 2005, che modifica la
    decisione 2000/256/CE che autorizza il Regno dei Paesi Bassi ad applicare una
    deroga all’articolo 11 della sesta direttiva 77/388/CEE in materia di armonizzazione
    delle legislazioni degli Stati membri relative alle imposte sulla cifra d’affari'
  type: main
- language: lv
  script: Latn
  content: '2005/257/: Padomes Lēmums (2005. gada 14. marts), ar kuru groza Lēmumu
    2000/256/EK, ar ko Nīderlandes Karalistei atļauj piemērot pasākumu, atkāpjoties
    no 11. panta Sestajā direktīvā 77/388/EEK par to, kā saskaņojami dalībvalstu
    tiesību akti par apgrozījuma nodokļiem'
  type: main
- language: lt
  script: Latn
  content: '2005/257/: 2005 m. kovo 14 d. Tarybos sprendimas, iš dalies keičiantis
    Sprendimą 2000/256/EB, leidžiantį Nyderlandų Karalystei taikyti priemonę,
    nukrypstančią nuo Šeštosios direktyvos 77/388/EEB dėl valstybių narių apyvartos
    mokesčių įstatymų derinimo 11 straipsnio'
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill ta’ l- 14 ta’ Marzu 2005 li temenda d-Deċiżjoni
    2000/256/KE li tawtorizza lir-Renju ta' l-Olanda biex japplika miżura li tidderoga
    mill-Artikolu 11 tas-Sitt Direttiva 77/388/KEE dwar l-armonizzazzjoni tal-liġijiet
    ta’ l-Istati Membri dwar it-taxxa fuq il-fatturat
  type: main
- language: nl
  script: Latn
  content: '2005/257/: Beschikking van de Raad van 14 maart 2005 tot wijziging van
    Beschikking 2000/256/EG houdende machtiging van het Koninkrijk der Nederlanden
    tot het toepassen van een maatregel die afwijkt van artikel 11 van Zesde Richtlijn
    77/388/EEG betreffende de harmonisatie van de wetgevingen der lidstaten inzake
    omzetbelasting'
  type: main
- language: pl
  script: Latn
  content: '2005/257/: Decyzja Rady z dnia 14 marca 2005 r. zmieniająca decyzję
    2000/256/WE zezwalającą Królestwu Niderlandów na stosowanie środka stanowiącego
    odstępstwo od art. 11 szóstej dyrektywy 77/388/EWG w sprawie harmonizacji ustawodawstw
    Państw Członkowskich w odniesieniu do podatków obrotowych'
  type: main
- language: pt
  script: Latn
  content: '2005/257/: Decisão do Conselho, de 14 de Março de 2005, que altera a
    Decisão 2000/256/CE que autoriza o Reino dos Países Baixos a aplicar uma medida
    derrogatória do artigo 11.° da Sexta Directiva 77/388/CEE relativa à harmonização
    das legislações dos Estados-Membros respeitantes aos impostos sobre o volume
    de negócios'
  type: main
- language: sk
  script: Latn
  content: '2005/257/: Rozhodnutie Rady zo 14. marca 2005, ktorým sa mení a dopĺňa
    rozhodnutie 2000/256/ES, ktorým sa Holandské kráľovstvo splnomocňuje na uplatňovanie
    opatrenia týkajúceho sa výnimky z článku 11 šiestej smernice Rady 77/388/EHS
    o zosúladení právnych predpisov členských štátov týkajúcich sa daní
    z obratu'
  type: main
- language: sl
  script: Latn
  content: '2005/257/: Odločba Sveta z dne 14. marca 2005 o spremembi Odločbe 2000/256/ES,
    ki dovoljuje Kraljevini Nizozemski uporabo ukrepa o odstopanju od člena 11 Šeste
    direktive 77/388/EGS o usklajevanju zakonodaje držav članic o prometnih davkih'
  type: main
- language: es
  script: Latn
  content: '2005/257/: Decisión del Consejo, de 14 de marzo de 2005, que modifica
    la Decisión 2000/256/CE por la que se autoriza al Reino de los Países Bajos
    para aplicar una excepción al artículo 11 de la Sexta Directiva 77/388/CEE en
    materia de armonización de las legislaciones de los Estados miembros relativas
    a los impuestos sobre el volumen de negocios'
  type: main
- language: sv
  script: Latn
  content: '2005/257/: Rådets beslut av den 14 mars 2005 om ändring av beslut 2000/256/EG
    om tillstånd för Konungariket Nederländerna att tillämpa en åtgärd som avviker
    från artikel 11 i rådets sjätte direktiv (77/388/EEG) om harmonisering av medlemsstaternas
    lagstiftning rörande omsättningsskatter'
