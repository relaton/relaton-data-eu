id: EURegulation30541980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3054/80 of 26 November 1980 re-establishing
    the levying of the customs duties on lamps and lighting fittings, of base metal,
    and parts thereof, of base metal, falling within heading No 83.07 of the Common
    Customs Tariff and originating in Hong Kong, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3054/80 de la Commission, du 26 novembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    d' éclairage, articles de lampisterie et de lustrerie ainsi que leurs parties
    non électriques, en métaux communs, de la position 83.07 du tarif douanier commun,
    originaires de Hong-kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3054/80 der Kommission vom 26. November 1980 zur Wiedereinführung
    des Zollsatzes für Beleuchtungskörper aller Art (Leuchten) und Teile davon,
    ausgenommen elektrotechnische Teile, aus unedlen Metallen, der Tarifnummer 83.07
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3054/80 af 26. november 1980 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler og dele dertil, af uædle
    metaller (herunder ikke afbrydere, fatninger til elektriske lamper, elektriske
    lygter til køretøjer, elektriske batteri- og dynamolygte og andre varer henhørende
    under kap. 85) under pos. 83.07, som har oprindelse i Hong-Kong og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3054/80 della Commissione, del 26 novembre 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi per illuminazione,
    lampade, lampadari e simili, e loro parti non elettriche, di metalli comuni, della
    voce 83.07 della tariffa doganale comune, originari di Hong Kong beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3054/80 van de Commissie van 26 november 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op verlichtingstoestellen,
    lampen en luchters, alsmede niet elektrische delen en onderdelen daarvan, van
    onedel metaal, van post 83.07, van oorsprong uit Hong-Kong, ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
