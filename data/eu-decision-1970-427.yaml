id: EUDecision1970427
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 26 août 1970, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les conserves de
    haricots verts de la position Ex 20.02 du Tarif douanier commun, originaires de
    la République populaire de Chine et mises en libre pratique en Italie et originaires
    de Taiwan et mises en libre pratique au Benelux
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 26. August 1970, mit der die Bundesrepublik
    Deutschland ermächtigt wird, die aus der Volksrepublik China stammenden und in
    Italien im freien Verkehr befindlichen sowie die aus Taiwan stammenden und in
    den Beneluxländern im freien Verkehr befindlichen Bohnenkonserven der Tarifnummer
    ex 20.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 26 agosto 1970, che autorizza la Repubblica
    federale tedesca ad escludere dal trattamento comunitario le conserve di fagiolini
    della voce ex 20.02 della tariffa doganale comune, originarie della Repubblica
    popolare cinese e messe in libera pratica in Italia e originarie di Taïwan e
    messe in libera pratica nei paesi del Benelux
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 26 augustus 1970 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd conserven van sla-, spek-, pronk- en snijbonen van
    post ex 20.02 van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in Italië in het vrije verkeer gebracht evenals van oorsprong uit Taiwan
    en in de Benelux-landen in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
