title:
- language: en
  script: Latn
  content: '85/14/EEC: Commission Decision of 19 December 1984 authorizing the French
    Republic to continue to apply certain protective measures pursuant to Article
    108 (3) of the Treaty (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/14/CEE: Décision de la Commission du 19 décembre 1984 autorisant
    la République française à poursuivre l''application de certaines mesures de
    sauvegarde conformément à l''article 108 paragraphe 3 du traité CEE (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/14/EWG: Entscheidung der Kommission vom 19. Dezember 1984, mit der
    die Französische Republik ermächtigt wird, die Anwendung bestimmter Schutzmaßnahmen
    gemäß Artikel 108 Absatz 3 des Vertrages fortzusetzen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/14/EØF: Kommissionens beslutning af 19. december 1984 om bemyndigelse
    af Den franske Republik til fortsat at anvende visse beskyttelsesforanstaltninger
    i henhold til traktatens artikel 108, stk. 3 (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/14/ΕΟΚ: Απόφαση της Επιτροπής της 19ης Δεκεμβρίου
