    να συνεχίσει την εφαρμογή ορισμένων μέτρων
    διασφάλισης, σύμφωνα με το άρθρο 108 παράγραφος
    3 της συνθήκης ΕΟΚ (Το κείμενο στην γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/14/CEE: Decisione della Commissione del 19 dicembre 1984 che autorizza
    la Repubblica francese a proseguire l''applicazione di talune misure di salvaguardia
