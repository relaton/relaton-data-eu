title:
- language: en
  script: Latn
  content: '70/503/EEC: commission decision of 5 November 1970 amending the decision
    of 3 June 1970 authorizing the Italian republic to approve, for marketing purposes,
    seed of pseudotsuga menziesii ( mirb. ) franco, satisfying less stringent requirements
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '70/503/CEE: Décision de la Commission, du 5 novembre 1970, modifiant
    la décision, du 3 juin 1970, autorisant la République italienne à admettre,
    à la commercialisation, des semences de pseudotsuga menziesli (mirb.) franco,
    soumises à des exigences réduites (Le texte en langue italienne est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '70/503/EWG: Entscheidung der Kommission vom 5. November 1970 zur Änderung
    der Entscheidung vom 3. Juni 1970, mit der die italienische Republik ermächtigt
    wird, Saatgut von pseudotsuga menziesii ( mirb. ) franco mit minderen Anforderungen
    zum gewerbsmäßigen Verkehr zuzulassen (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '70/503/CEE: Decisione della Commissione, del 5 novembre 1970, che modifica
    la decisione del 3 giugno 1970, che autorizza la repubblica italiana ad ammettere
    alla commercializzazione le sementi di pseudotsuga menziesii ( mirb. ) franco,
    sottoposte a requisiti ridotti (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '70/503/EEG: Beschikking van de Commissie van 5 november 1970 tot wijziging
    van de beschikking van 3 juni 1970 houdende machtiging van de italiaanse republiek
    om zaden van pseudotsuga menziesii ( mirb. ) franco, waaraan minder strenge eisen
    zijn gesteld, tot de handel toe te laten (slechts de tekst in de Italiaanse taal
    is authentiek )'
