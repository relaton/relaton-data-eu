id: EUDecision1970203
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 mars 1970, autorisant la République
    italienne à exclure du traitement communautaire les préparations et conserves
    de poissons (à l'exclusion du saumon en boite et du caviar et ses succédanés),
    de la position Ex 16.04 du Tarif douanier commun, originaires du Japon et mises
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/203/EWG: Entscheidung der Kommission vom 10. März 1970, mit der die
    Italienische Republik ermächtigt wird, die aus Japan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Fische, zubereitet oder haltbar
    gemacht (ausschließlich Salmoniden in Dosen, Kaviar und Kaviarersatz), der Tarifnummer
    ex 16.04 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/203/CEE: Decisione della Commissione, del 10 marzo 1970, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le preparazioni
    e conserve di pesce (eccetto il salmone in scatola e i suoi succedanei) della
    voce ex 16.04 della tariffa doganale comune originarie del Giappone e messe in
    libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/203/EEG: Beschikking van de Commissie van 10 maart 1970 waarbij de
    Italiaanse Republiek wordt gemachtigd bereidingen en conserven van vis (met uitzondering
    van zalm in blik en van kaviaar en kaviaarsurrogaten) van post ex 16.04 van het
    gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
