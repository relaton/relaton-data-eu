title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1406/92 of 27 May 1992 laying down certain
    indicative ceilings and certain additional detailed rules for the application
    of the supplementary trade mechanism to trade in fruit and vegetables between
    Portugal and the other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1406/92 de la Commission du 27 mai 1992 fixant certains
    plafonds indicatifs et certaines modalités additionnelles d'application du mécanisme
    complémentaire aux échanges de fruits et légumes entre le Portugal et les autres
    États membres
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1406/92 DER KOMMISSION vom 27. Mai 1992 zur Festsetzung
    von Richtplafonds und zusätzlichen Durchführungsbestimmungen für den ergänzenden
    Handelsmechanismus im Handel mit Obst und Gemüse zwischen Portugal und den anderen
    Mitgliedstaaten #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1406/92 af 27. maj 1992 om fastsættelse
    af visse vejledende lofter og visse supplerende gennemførelsesbestemmelser til
    den supplerende mekanisme for samhandelen med frugt og grønsager mellem Portugal
    og de øvrige medlemsstater #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθμ. 1406/92 της Επιτροπής
    της 27ης Μαΐου 1992 για τον καθορισμό ορισμένων
    ενδεικτικών ανωτάτων ορίων και ορισμένων προσθέτων
    λεπτομερειών του συμπληρωματικού μηχανισμού
    στις συναλλαγές οπωροκηπευτικών μεταξύ της
    Πορτογαλίας και των άλλων κρατών μελών
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1406/92 DELLA COMMISSIONE del 27 maggio 1992 relativo
    a massimali indicativi e a talune modalità supplementari d'' applicazione del
    meccanismo complementare applicabile agli scambi di ortofrutticoli tra il Portogallo
    e gli altri Stati membri #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1406/92 VAN DE COMMISSIE van 27 mei 1992 tot vaststelling
    van indicatieve plafonds en bijkomende bepalingen voor de toepassing van de aanvullende
    regeling voor het handelsverkeer tussen Portugal en de overige Lid-Staten in de
    sector groenten en fruit #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1406/92 DA COMISSÃO de 27 de Maio de 1992 que fixa
    determinados limites máximos indicativos e determinadas normas adicionais de
    execução do mecanismo complementar aplicável às trocas comerciais das frutas
    e produtos hortícolas entre Portugal e os outros Estados-membros #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1406/92 DE LA COMISIÓN de 27 de mayo de 1992 por
    el que se fijan determinados límites máximos indicativos y determinadas disposiciones
    adicionales de aplicación del mecanismo complementario aplicable a los intercambios
    de frutas y hortalizas entre Portugal y los demás Estados miembros #'
