title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 50/81 of 1 January 1981 on transitional
    measures applicable to trade within the Community in goods obtained in Greece
    or in another Member State of the Community under a procedure for the relief from
    or drawback of customs duties or other import charges - compensatory levy
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 50/81 de la Commission, du 1er janvier 1981, relatif
    aux mesures transitoires applicables aux échanges à l' intérieur de la Communauté
    des marchandises obtenues en Grèce ou dans un autre État membre sous un régime
    comportant suspension ou ristourne de droits de douane ou d' autres impositions
    à l' importation - prélèvement compensateur
  type: main
- language: de
  script: Latn
