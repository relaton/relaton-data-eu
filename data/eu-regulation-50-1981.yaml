    Griechenland oder in einem anderen Mitgliedstaat im Rahmen eines Zollverfahrens
    hergestellt wurden, das die Nichterhebung oder Erstattung der Zölle oder anderer
    Eingangsabgaben vorsieht - Anteilzoll
  type: main
- language: da
  script: Latn
