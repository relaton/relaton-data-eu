---
id: EURegulation10372001
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1037/2001 of 22 May 2001 authorising the offer
    and delivery for direct human consumption of certain imported wines which may
    have undergone oenological processes not provided for in Regulation (EC) No 1493/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1037/2001 du Conseil du 22 mai 2001 autorisant l'offre
    et la livraison à la consommation humaine directe de certains vins importés
    susceptibles d'avoir fait l'objet de pratiques œnologiques non prévues par le
    règlement (CE) n° 1493/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1037/2001 des Rates vom 22. Mai 2001 zur Genehmigung
    des Anbietens oder der Abgabe zum unmittelbaren menschlichen Verbrauch von bestimmten
    eingeführten Weinen, bei denen angenommen werden kann, dass sie Gegenstand von
    in der Verordnung (EG) Nr. 1493/1999 vorgesehenen önologischen Verfahren waren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1037/2001 на Съвета от 22 май
    2001 година относно разрешаване на предлагането
    и доставянето за директна консумация от човека
    на някои вносни вина, които може да са били
    подложени на енологични практики, непредвидени
    в Регламент (ЕО) № 1493/1999
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1037/2001 ze dne 22. května 2001, kterým se
    povoluje nabízení nebo dodávání některých dovážených vín, u nichž
    mohlo být použito enologických postupů nestanovených v nařízení (ES) č.
    1493/1999, k přímé lidské spotřebě
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1037/2001 af 22. maj 2001 om tilladelse til
    udbud eller afsætning til direkte konsum af visse indførte vine, som eventuelt
    har været underkastet andre ønologiske fremgangsmåder end de i forordning (EF)
    nr. 1493/1999 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1037/2001 του Συμβουλίου,
    της 22ας Μαΐου 2001, που επιτρέπει την προσφορά
    και την παράδοση στην άμεση ανθρώπινη κατανάλωση
    ορισμένων εισαγόμενων οίνων στους οποίους
    μπορεί να έχουν χρησιμοποιηθεί οινολογικές
    πρακτικές που δεν προβλέπονται από τον κανονισμό
    (ΕΚ) αριθ. 1493/1999
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1037/2001, 22. mai 2001, millega lubatakse otsetarbimiseks
    pakkuda ja tarnida teatavaid importveine, mille puhul võib olla kasutatud määruses
    (EÜ) nr 1493/1999 sätestamata veinivalmistusviise
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1037/2001, annettu 22 päivänä toukokuuta 2001,
    muilla kuin asetuksessa (EY) N:o 1493/1999 säädetyillä viininvalmistusmenetelmillä
    mahdollisesti käsiteltyjen tiettyjen tuontiviinien sellaisenaan nautittavaksi
    tarjoamisen ja toimittamisen sallimisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 1037/2001 od 22. svibnja 2001. o odobravanju ponude
    i isporuke za neposrednu prehranu ljudi određenih uvoznih vina koja su možda
    bila podvrgnuta enološkim postupcima koji nisu predviđeni Uredbom (EZ) br. 1493/1999
  type: main
- language: hu
  script: Latn
  content: A Tanács 1037/2001/EK rendelete (2001. május 22.) az 1493/1999/EK rendeletben
    nem szereplő borászati kezeléseken esetlegesen átesett egyes importált borok
    közvetlen emberi fogyasztásra történő kínálatának és értékesítésének
    engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1037/2001 del Consiglio, del 22 maggio 2001, che autorizza
    l'offerta e la consegna per il consumo umano diretto di taluni vini importati
    che possono essere stati sottoposti a pratiche enologiche non previste dal regolamento
    (CE) n. 1493/1999
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1037/2001 (2001. gada 22. maijs), ar ko atļauj
    piedāvāt un piegādāt tiešam patēriņam pārtikā dažus importētus vīnus,
    kas iespējams ir bijuši pakļauti Regulā (EK) Nr. 1493/1999 neparedzētiem
    vīndarības procesiem
  type: main
- language: lt
  script: Latn
  content: 2001 m. gegužės 22 d. Tarybos reglamentas (EB) Nr. 1037/2001, leidžiantis
    siūlyti ir tiekti tiesiogiai vartoti žmonėms kai kuriuos importuotus vynus,
    kuriems buvo taikomi vynininkystės procesai, nenumatyti Reglamente (EB) Nr. 1493/1999
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 1037/2001 ta’ t-22 ta’ Mejju 2001
    li jawtorizza l-offerta u l-fornitura għall-konsum uman dirett ta’ ċerti nbejjed
    importati li jistgħu jkunu għaddew minn proċessi enoloġiċi mhux provduti
    fir-Regolament (KE) Nru 1493/1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1037/2001 van de Raad van 22 mei 2001 houdende machtiging
    tot aanbieding of levering, voor rechtstreekse menselĳke consumptie, van bepaalde
    ingevoerde wĳnen waarop oenologische procédés kunnen zĳn toegepast die niet
    zĳn geregeld in Verordening (EG) nr. 1493/1999
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1037/2001 z dnia 22 maja 2001 r. zezwalające
    na oferowanie i dostarczanie do bezpośredniego spożycia przez ludzi niektórych
    przywożonych win, które mogły być poddane procesom enologicznym nieprzewidzianym
    w rozporządzeniu (WE) nr 1493/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1037/2001 do Conselho, de 22 de Maio de 2001, que
    autoriza a oferta e o fornecimento para consumo humano directo de certos vinhos
    importados susceptíveis de terem sido objecto de práticas enológicas não previstas
    no Regulamento (CE) n.° 1493/1999
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1037/2001 al Consiliului din 22 mai 2001 de autorizare
    a ofertei și livrării pentru consum uman direct a anumitor vinuri importate
    presupuse a fi fost obiectul unor procedee oenologice neprevăzute de Regulamentul
    (CE) nr. 1493/1999
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1037/2001 z 22. mája 2001 povoľujúce ponuku
    a dodávanie niektorých dovážaných vín určených na priamu ľudskú spotrebu,
    ktoré mohli byť podrobené enologickým postupom, ktoré nie sú v súlade s
    nariadením (ES) č. 1493/1999
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1037/2001 z dne 22. maja 2001 o odobritvi ponudbe
    in dobave za neposredno prehrano ljudi nekaterih uvoženih vin, ki so lahko bila
    obdelana z enološkimi postopki, ki niso predvideni v Uredbi (ES) št. 1493/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1037/2001 del Consejo, de 22 de mayo de 2001, por el
    que se autoriza la oferta y la entrega para el consumo humano directo de determinados
    vinos importados que pueden haber sido sometidos a prácticas enológicas no previstas
    en el Reglamento (CE) n° 1493/1999
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1037/2001 av den 22 maj 2001 om tillstånd
    för utbjudande och levererans för direkt konsumtion av vissa importerade viner
    som kan ha varit föremål för otillåtna oenologiska metoder enligt förordning
    (EG) nr 1493/1999
  type: main
