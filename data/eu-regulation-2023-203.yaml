    965/2012, (UE) n.o 1178/2011, (UE) 2015/340 e os Regulamentos de Execução (UE)
    2017/373, (UE) n.o 139/2014 e (UE) 2021/664 da Comissão, e que altera os Regulamentos
    (UE) n.o 1178/2011, (UE) n.o 748/2012, (UE) n.o 965/2012, (UE) n.o 139/2014, (UE)
    n.o 1321/2014, (UE) 2015/340 e os Regulamentos de Execução (UE) 2017/373 e (UE)
    2021/664 da Comissão
  type: main
