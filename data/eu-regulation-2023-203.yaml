    i Rady (UE) 2018/1139 w kwestii wymagań dotyczących zarządzania ryzykiem związanym
    z bezpieczeństwem informacji o potencjalnym wpływie na bezpieczeństwo lotnicze
    w odniesieniu do organizacji objętych zakresem stosowania rozporządzeń Komisji
    (UE) nr 1321/2014, (UE) nr 965/2012, (UE) nr 1178/2011, (UE) 2015/340, rozporządzeń
    wykonawczych Komisji (UE) 2017/373 i (UE) 2021/664 oraz właściwych organów
