title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1537/79 of 23 July 1979 re-establishing
    the levying of customs duties on woven fabrics of regenerated textile fibres,
    falling within subheading 56.07 B, originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1537/79 de la Commission, du 23 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles artificielles, de la sous-position 56.07 B du tarif douanier commun,
    originaires de Thaïlande, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1537/79 der Kommission vom 23. Juli 1979 über die
    Wiedereinführung des Zollsatzes für Gewebe aus künstlichen Spinnstoffen der
    Tarifstelle 56.07 B mit Ursprung in Thailand, dem die in der Verordnung (EWG)
    Nr. 1195/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1537/79 af 23. juli 1979 om genindførelse
    af opkrævning af toldafgifter for vævet stof af regenererede fibre, under underposition
    56.07 B, som har oprindelse i Thailand og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1537/79 della Commissione, del 23 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili
    artificiali, della sottovoce 56.07 B della tariffa doganale comune, originari
    della Tailandia beneficiaria della preferenze tariffarie previste dal regolamento
    (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1537/79 van de Commissie van 23 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van kunstmatige vezels, van post 56.07 B, van oorsprong uit Thailand, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 1195/79
    van de Raad
  type: main
