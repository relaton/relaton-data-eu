  content: '84/182/EEC: Commission Decision of 23 March 1984 accepting an undertaking
    offered in connection with an anti-dumping proceeding concerning imports of certain
    iron or steel angles, shapes and sections originating in Romania, and terminating
    that proceeding'
  type: main
- language: fr
  script: Latn
  content: '84/182/CEE: Décision de la Commission du 23 mars 1984 portant acceptation
    d'' un engagement souscrit dans le cadre de la procédure anti-dumping concernant
    les importations de certains profilés, en fer ou en acier, originaires de Roumanie
    et portant clôture de la procédure'
  type: main
- language: de
  script: Latn
