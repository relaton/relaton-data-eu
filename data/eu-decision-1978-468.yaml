id: EUDecision1978468
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 May 1978 authorizing Ireland not to apply Community
    treatment to tyre cases of the kind used on motor cars falling within heading
    No ex 40.11 of the Common Customs Tariff, originating in the German Democratic
    Republic and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/468/CEE: Décision de la Commission, du 12 mai 1978, autorisant l''Irlande
    à exclure du traitement communautaire les pneumatiques des types utilisés pour
    voitures particulières, de la position Ex 40.11 du Tarif douanier commun, originaires
    de la République démocratique allemande et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. Mai 1978, mit der Irland ermächtigt
    wird, aus der Deutschen Demokratischen Republik stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Laufdecken für Personenkraftwagen
    der Tarifnummer ex 40.11 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 12. maj 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage dæk (ikke massive) til personautomobiler
    og varevogne, som henhører under pos. ex 40.11 i den fælles toldtarif, har oprindelse
    i Den tyske demokratiske Republik og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 maggio 1978, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario le coperture per autoveicoli particolari
    (da turismo) della voce ex 40.11 della tariffa doganale comune, originari della
    Repubblica democratica tedesca e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 mei 1978 waarbij Ierland wordt gemachtigd
    buitenbanden van het type gebruikt voor personenautomobielen, van post ex 40.11
    van het gemeenschappelijk douanetarief, van oorsprong uit de Duitse Democratische
    Republiek en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
