    od art. 226 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od wartości
    dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/310 do Conselho, de 18 de fevereiro de
    2019, que autoriza a Polónia a aplicar uma medida especial em derrogação ao
    artigo 226.° da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/310 a Consiliului din 18 februarie
    2019 prin care Polonia este autorizată să aplice o măsură specială de derogare
    de la articolul 226 din Directiva 2006/112/CE privind sistemul comun al taxei
    pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2019/310 z 18. februára 2019, ktorým
    sa Poľsku povoľuje zaviesť osobitné opatrenie odchyľujúce sa od článku
    226 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2019/310 z dne 18. februarja 2019 o dovoljenju
    Poljski, da uvede posebni ukrep, ki odstopa od člena 226 Direktive 2006/112/ES
    o skupnem sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2019/310 del Consejo, de 18 de febrero de
    2019, por la que se autoriza a Polonia a introducir una medida especial de excepción
    a lo dispuesto en el artículo 226 de la Directiva 2006/112/CE relativa al sistema
    común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2019/310 av den 18 februari 2019 om bemyndigande
