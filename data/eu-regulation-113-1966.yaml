title:
- language: fr
  script: Latn
  content: Règlement n 113/66/CEE du Conseil, du 28 juillet 1966, dérogeant provisoirement
    à certaines dispositions du règlement n 111/64/CEE du Conseil en ce qui concerne
    le calcul du prélèvement de certains laits en poudre et des fromages fondus
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 113/66/EWG des Rates vom 28. Juli 1966 über die vorübergehende
    Abweichung von einigen Bestimmungen der Verordnung Nr. 111/ 64/EWG des Rates in
    bezug auf die Errechnung des Abschöpfungsbetrags für bestimmte Milchpulversorten
    und für Schmelzkäse und Schmelzkäsezubereitungen
  type: main
- language: it
  script: Latn
  content: Regolamento n. 113/66/CEE del Consiglio, del 28 luglio 1966, che deroga
    provvisoriamente a talune disposizioni del regolamento n. 111/64/CEE del Consiglio
    per quanto riguarda il calcolo del prelievo per alcuni tipi di latte in polvere
    e per formaggi fusi
  type: main
- language: nl
  script: Latn
  content: Verordening no. 113/66/EEG van de Raad van 28 juli 1966 houdende voorlopige
    afwijking van sommige bepalingen van Verordening no. 111/64/ EEG van de Raad voor
    wat de berekening van de heffing op bepaalde soorten melk in poedervorm en op
    smeltkaas betreft
  type: main
