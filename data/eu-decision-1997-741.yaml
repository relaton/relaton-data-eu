  script: Latn
  content: '97/741/EC: Council Decision of 24 July 1997 on the conclusion of an Agreement
    in the form of an Exchange of Letters between the European Community and the Russian
    Federation establishing a double-checking system without quantitative limits in
    respect of the export of certain steel products covered by the EC and ECSC Treaties
    from the Russian Federation to the European Community'
  type: main
- language: fr
  script: Latn
