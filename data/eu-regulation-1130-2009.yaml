    e/ou do destino de produtos de intervenção (Versão codificada)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1130/2009 al Comisiei din 24 noiembrie 2009 de stabilire
    a modalităților comune de control al utilizării și/sau destinației produselor
    provenind din intervenție (Versiune codificată)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1130/2009 z 24. novembra 2009 o ustanovení
    spoločných podrobných pravidiel na overovanie použitia a/alebo miesta určenia
    intervenčných produktov (kodifikované znenie)
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1130/2009 z dne 24. novembra 2009 o določitvi
    skupnih podrobnih pravil za preverjanje uporabe in/ali namena intervencijskih
    proizvodov (Kodificirana različica)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1130/2009 de la Comisión, de 24 de noviembre de 2009
