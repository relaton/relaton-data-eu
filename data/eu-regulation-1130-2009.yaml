    ta’ prodotti minn intervent (Verżjoni kkodifikata)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1130/2009 van de Commissie van 24 november 2009 tot
    vaststelling van gemeenschappelijke uitvoeringsbepalingen inzake de controle op
    het gebruik en/of de bestemming van producten uit interventie (gecodificeerde
    versie)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1130/2009 z dnia 24 listopada 2009 r. ustanawiające
    wspólne szczegółowe zasady kontroli wykorzystania i przeznaczenia produktów
    objętych interwencją (Wersja ujednolicona)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1130/2009 da Comissão, de 24 de Novembro de 2009
