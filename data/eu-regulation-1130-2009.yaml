title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1130/2009 of 24 November 2009 laying down
    common detailed rules for verifying the use and/or destination of products from
    intervention (Codified version)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1130/2009 de la Commission du 24 novembre 2009 établissant
    les modalités communes de contrôle de l’utilisation et/ou de la destination
    de produits provenant de l’intervention (Version codifiée)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1130/2009 der Kommission vom 24. November 2009 über
    gemeinsame Durchführungsbestimmungen für die Überwachung der Verwendung und/oder
    Bestimmung von Erzeugnissen aus den Beständen der Interventionsstellen (kodifizierte
    Fassung)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1130/2009 на Комисията от 24
    ноември 2009 година относно определяне на общи
    подробни правила за проверка на употребата
    и/или местоназначението на продукти от интервенция
    (Кодифицирана версия)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1130/2009 ze dne 24. listopadu 2009 , kterým
    se stanoví společná prováděcí pravidla pro ověřování použití a/nebo
    místa určení intervenčních produktů (kodifikované znění)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1130/2009 af 24. november 2009 om fælles
    gennemførelsesbestemmelser for kontrol med anvendelse af og/eller bestemmelse
    for produkter fra intervention (Kodificeret udgave)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1130/2009 της Επιτροπής,
    της 24ης Νοεμβρίου 2009 , περί θεσπίσεως κοινών
    λεπτομερών κανόνων για τον έλεγχο της χρησιμοποίησης
    ή/και του προορισμού των προϊόντων που προέρχονται
    από την παρέμβαση (Κωδικοποιημένη έκδοση)
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1130/2009, 24. november 2009 , millega kehtestatakse
    üksikasjalikud ühiseeskirjad sekkumisvarust pärit toodete kasutamise ja/või
    sihtkoha kontrollimiseks (kodifitseeritud versioon)
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1130/2009, annettu 24 päivänä marraskuuta
    2009 , interventiosta peräisin olevien tuotteiden käytön ja/tai määräpaikan
    tarkastamista koskevista yhteisistä yksityiskohtaisista säännöistä (Kodifioitu
    toisinto)
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1130/2009 od 24. studenoga 2009. o utvrđivanju
    zajedničkih detaljnih pravila za provjeru upotrebe i/ili odredišta interventnih
    proizvoda (kodificirana verzija)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1130/2009/EK rendelete ( 2009. november 24. ) az intervencióból
    származó termékek felhasználásának és/vagy rendeltetésének igazolására
    vonatkozó közös részletes szabályok megállapításáról (kodifikált változat)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1130/2009 della Commissione, del 24 novembre 2009 ,
