title:
- language: en
  script: Latn
  content: '72/253/EEC: Commission Decision of 26 May 1972 on the granting of aid
    to encourage rationalization in the growing and processing of fodder crops and
    cooperation between farms in the Netherlands (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '72/253/CEE: Décision de la Commission, du 26 mai 1972, relative à l''octroi
    d''une aide visant à encourager la rationalisation de la culture et la transformation
    de plantes fourragères, ainsi que la coopération des exploitations agricoles
    aux Pays-Bas (Le texte en langue néerlandaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '72/253/EWG: Entscheidung der Kommission vom 26. Mai 1972 über die Gewährung
    einer Beihilfe zur Förderung der Rationalisierunq des Anbaus und der Verarbeitung
    von Futterpflanzen sowie der Zusammenarbeit landwirtschaftlicher Betriebe in den
    Niederlanden (Nur der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '72/253/EØF: Kommissionens beslutning af 26. maj 1972 om tildeling af
    støtte til fremme af rationalisering af dyrkningen og forarbejdningen af foderplanter,
    samt samarbejdet mellem jordbrugsbedrifterne i Nederlandene (Kun den nederlandske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '72/253/ΕΟΚ : Απόφαση της Επιτροπής, της 26ης
    Μαΐου 1972, περί της χορήγησης ενίσχυσης που
    αποβλέπει στο να ενθαρρυνθεί η ορθολογική
    οργάνωση της καλλιέργειας και η μετατροπή
    φυτών που προορίζονται για ζωοτροφές, καθώς
    και η συνεργασία των γεωργικών εκμεταλλεύσεων
    των Κάτω Χωρών. (Το κείμενο στην ολλανδική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
