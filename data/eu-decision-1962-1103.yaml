title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République française à différer
    le rapprochement des droits des tarifs spéciaux de la Guyane, de la Martinique
    et de la Réunion vers ceux du Tarif douanier commun en ce qui concerne les tabacs
    fabriqués (position n° 24.02 du Tarif douanier commun)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission, mit der die Französische Republik ermächtigt
    wird, die Angleichung der Zollsätze der Sondertarife von Guayana, Martinique
    und Réunion an diejenigen des Gemeinsamen Zolltarifs für verarbeiteten Tabak
    (Tarifnr. 24.02 des Gemeinsamen Zolltarifs) aufzuschieben
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione che autorizza la Repubblica Francese a differire
    il ravvicinamento dei dazi delle tariffe speciali della Guiana, della Martinica
    e dell'isola della Riunione ai dazi della tariffa doganale comune per i tabacchi
    lavorati (voce n. 24.02 della tariffa doganale comune)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie waarbij de Franse Republiek wordt gemachtigd
    de aanpassing van de rechten van de speciale tarieven van Frans Guyana, Martinique
    en Réunion aan die van het gemeenschappelijk douanetarief met betrekking tot
    tabaksfabrikaten (nummer 24.02 van het gemeenschappelijk douanetarief) uit te
    stellen
  type: main
