title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1390/77 of 21 June 1977 derogating for 1977
    and 1978 from certain provisions concerning the definition of the concept of 'originating
    products' contained in the Interim Agreement and in the Agreement on Cooperation,
    between the European Economic Community and the Kingdom of Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1390/77 du Conseil, du 21 juin 1977, portant dérogation,
    pour les années 1977 et 1978, à certaines dispositions concernant la définition
    de la notion de produits originaires de l'accord intérimaire et de l'accord de
    coopération entre la Communauté économique européenne et le Royaume du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1390/77 des Rates vom 21. Juni 1977 über eine für
    1977 und 1978 geltende Abweichung von einigen Vorschriften über die Bestimmung
    des Begriffs "Waren mit Ursprung in ..." oder "Ursprungswaren" in dem Interimsabkommen
    und dem Kooperationsabkommen zwischen der Europäischen Wirtschaftsgemeinschaft
    und dem Königreich Marokko
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1390/77 af 21. juni 1977 om afvigelse i 1977
    og 1978 fra visse bestemmelser vedrørende definitionen af begrebet »varer med
    oprindelsesstatus« i interimsaftalen og samarbejdsaftalen mellem Det europæiske
    økonomiske Fællesskab og kongeriget Marokko
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1390/77 del Consiglio, del 21 giugno 1977, che deroga,
