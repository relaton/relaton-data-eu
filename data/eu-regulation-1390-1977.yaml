    nozione di «prodotti originari», contenute nell'accordo provvisorio e nell'accordo
    di cooperazione tra la Comunità economica europea ed il Regno del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1390/77 van de Raad van 21 juni 1977 houdende afwijking
    voor de jaren 1977 en 1978 van sommige bepalingen betreffende de definitie van
    het begrip "produkten van oorsprong" van de Interimovereenkomst en de Samenwerkingsovereenkomst
    tussen de Europese Economische Gemeenschap en het Koninkrijk Marokko
