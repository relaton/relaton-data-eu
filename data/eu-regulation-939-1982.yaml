title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 939/82 of 21 April 1982 reopening the standing
    invitation to tender referred to in Regulation (EEC) No 434/82 for the mobilization
    of Community white sugar for the United Nations Relief and Works Agency for Palestine
    Refugees (UNRWA) as food aid
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 939/82 de la Commission, du 21 avril 1982, rouvrant
    l' adjudication permanente visée au règlement (CEE) n° 434/82 pour la mobilisation
    de sucre blanc communautaire à fournir à l' Office de secours et de travaux
    des Nations unies pour les réfugiés de Palestine (UNRWA) à titre d' aide alimentaire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 939/82 der Kommission vom 21. April 1982 zur Wiedereröffnung
    der Dauerausschreibung nach Verordnung (EWG) Nr. 434/82 zur Bereitstellung von
    Weißzucker aus der Gemeinschaft, der im Rahmen der Nahrungsmittelhilfe an das
    Hilfswerk der Vereinten Nationen für die Palästinaflüchtlinge (UNRWA) zu liefern
    ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 939/82 af 21. april 1982 om genåbning
    af den i forordning (EØF) nr. 434/82 omhandlede løbende licitation med henblik
    på tilvejebringelse af hvidt sukker i Fællesskabet til levering til De forenede
    Nationers Hjælpeorganisation for Palæstinaflygtninge (UNRWA) som fødevarehjælp
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 939/82 τής Επιτροπής τής
    21ης Απριλίου 1982 περί επανενάρξεως τής διαρκούς
    δημοπρασίας πού αναφέρεται στόν κανονισμό
    (EOK) αριθ. 434/82 γιά τή θέση σέ ετοιμότητα κοινοτικής
    λευκής ζάχαρης πού προορίζεται γιά τήν Οργάνωση
    τών Ηνωμένων Εθνών γιά τήν Περίθαλψη καί τήν
    Εξεύρεση Εργασίας στούς Πρόσφυγες τής Παλαιστίνης
    (UNRWA) στά πλαίσια τής επισιτιστικής βοηθείας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 939/82 della Commissione, del 21 aprile 1982, che
    indice nuovamente la gara permanente prevista dal regolamente (CEE) n. 434/82
    per la mobilitazione di zucchero bianco comunitario destinato all' Ente soccorso
    e lavori delle Nazioni Unite per i profughi della Palestina (UNRWA) a titolo di
    aiuto alimentare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 939/82 van de Commissie van 21 april 1982 tot heropening
    van de in Verordening (EEG) nr. 434/82 bedoelde permanente inschrijving voor de
    beschikbaarstelling van als voedselhulp aan de Organisatie van de Verenigde Naties
    voor de Palestijnse vluchtelingen (UNRWA) te leveren witte suiker uit de Gemeenschap
  type: main
