    (EEC) No 338/79 laying down special provisions relating to quality wines produced
    in specified regions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2594/79 du Conseil, du 22 novembre 1979, modifiant
    le règlement (CEE) n° 337/79 portant organisation commune du marché viti-vinicole
    ainsi que le règlement (CEE) n° 338/79 établissant des dispositions particulières
    relatives aux vins de qualité dans des régions déterminées
  type: main
