  content: Rådets beslut (EU) 2024/2955 av den 21 november 2024 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i det stabiliserings- och associeringsråd
    som inrättats genom stabiliserings- och associeringsavtalet mellan Europeiska
    gemenskaperna och deras medlemsstater, å ena sidan, och Bosnien och Hercegovina,
