title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/2955 of 21 November 2024 on the position to
    be adopted on behalf of the European Union within the Stabilisation and Association
    Council established by the Stabilisation and Association Agreement between the
    European Communities and their Member States, of the one part, and Bosnia and
    Herzegovina, of the other part, with regard to a decision concerning the amendment
    of Protocol 2 to that Agreement as regards permeability between the Regional Convention
    on pan-Euro-Mediterranean preferential rules of origin and the Transitional rules
    of origin
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/2955 du Conseil du 21 novembre 2024 relative à la
    position à prendre, au nom de l’Union européenne, au sein du conseil de stabilisation
    et d’association institué par l’accord de stabilisation et d’association
    entre les Communautés européennes et leurs États membres, d’une part, et
    la Bosnie-Herzégovine, d’autre part, sur une décision concernant la modification
    du protocole n° 2 dudit accord en ce qui concerne la perméabilité entre la
    convention régionale sur les règles d’origine préférentielles paneuro-méditerranéennes
    et les règles d’origine transitoires
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/2955 des Rates vom 21. November 2024 über den Standpunkt,
    der im Namen der Europäischen Union im Stabilitäts- und Assoziationsrat, der
    gemäß dem Stabilisierungs- und Assoziierungsabkommen zwischen den Europäischen
    Gemeinschaften und ihren Mitgliedstaaten einerseits und Bosnien und Herzegowina
    andererseits eingesetzt wurde, hinsichtlich eines Beschlusses zur Änderung des
    Protokolls Nr. 2 zum genannten Abkommen betreffend die Durchlässigkeit zwischen
    den Ursprungsregeln des Regionalen Übereinkommens über Pan-Europa-Mittelmeer-Präferenzursprungsregeln
    und den Übergangsregeln für den Ursprung zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2024/2955 на Съвета от 21 ноември
    2024 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Съвета за стабилизиране и асоцииране, създаден
    със Споразумението за стабилизиране и асоцииране
    между Европейските общности и техните държави
    членки, от една страна, и Босна и Херцеговина,
    от друга страна, във връзка с решението за изменение
    на Протокол 2 към посоченото споразумение по
    отношение на принципа на равностойност на
    статута по Регионалната конвенция за паневросредиземноморските
    преференциални правила за произход и по преходните
    правила за произход
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2024/2955 ze dne 21. listopadu 2024 o postoji, který
    má být zaujat jménem Evropské unie v Radě stabilizace a přidružení zřízené
    Dohodou o stabilizaci a přidružení mezi Evropskými společenstvími a jejich
    členskými státy na jedné straně a Bosnou a Hercegovinou na straně druhé,
    pokud jde o rozhodnutí o změně protokolu 2 k uvedené dohodě týkající se
    permeability mezi Regionální úmluvou o celoevropsko-středomořských preferenčních
    pravidlech původu a přechodnými pravidly původu
  type: main
