    de stabilizare și de asociere înființat prin Acordul de stabilizare și de
    asociere dintre Comunitățile Europene și statele membre ale acestora, pe de
    o parte, și Bosnia și Herțegovina, pe de altă parte, cu privire la o decizie
    de modificare a Protocolului nr. 2 la respectivul acord în ceea ce privește
    permeabilitatea dintre Convenția regională cu privire la regulile de origine
    preferențiale pan-euro-mediteraneene și regulile de origine tranzitorii
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2024/2955 z 21. novembra 2024 o pozícii, ktorá
    sa má v mene Európskej únie prijať v Rade pre stabilizáciu a pridruženie
    zriadenej Dohodou o stabilizácii a pridružení medzi Európskymi spoločenstvami
    a ich členskými štátmi na jednej strane a Bosnou a Hercegovinou na strane
    druhej, pokiaľ ide o rozhodnutie o zmene protokolu 2 k uvedenej dohode v súvislosti
    s priepustnosťou medzi Regionálnym dohovorom o paneuro-stredomorských preferenčných
    pravidlách pôvodu a prechodnými pravidlami pôvodu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2024/2955 z dne 21. novembra 2024 o stališču, ki se
    v imenu Evropske unije zastopa v Stabilizacijsko-pridružitvenem svetu, ustanovljenem
    s Stabilizacijsko-pridružitvenim sporazumom med Evropskima skupnostma in njunimi
    državami članicami na eni strani ter Bosno in Hercegovino na drugi strani, v
    zvezi s sklepom o spremembi Protokola 2 k navedenemu sporazumu glede prepustnosti
    med Regionalno konvencijo o panevro-mediteranskih preferencialnih pravilih o poreklu
    in prehodnimi pravili o poreklu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2024/2955 del Consejo, de 21 de noviembre de 2024, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    de Estabilización y Asociación creado por el Acuerdo de Estabilización y Asociación
    entre las Comunidades Europeas y sus Estados miembros, por una parte, y Bosnia
    y Herzegovina, por otra, por lo que respecta a una decisión relativa a la modificación
    de su Protocolo n.° 2 por lo que respecta a la permeabilidad entre el Convenio
    regional sobre las normas de origen preferenciales paneuromediterráneas y las
    normas de origen transitorias
  type: main
