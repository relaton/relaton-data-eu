    Stabilisatie- en associatieovereenkomst tussen de Europese Gemeenschappen en hun
    lidstaten, enerzijds, en Bosnië en Herzegovina, anderzijds, in te nemen standpunt
    ten aanzien van een besluit betreffende de wijziging van Protocol nr. 2 bij die
    overeenkomst wat betreft permeabiliteit tussen de Regionale Conventie betreffende
    de pan-Euromediterrane preferentiële oorsprongsregels en de overgangsregels van
    oorsprong
  type: main
