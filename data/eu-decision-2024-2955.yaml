    i Stowarzyszenia ustanowionej na mocy Układu o stabilizacji i stowarzyszeniu
    między Wspólnotami Europejskimi i ich państwami członkowskimi, z jednej strony,
    a Bośnią i Hercegowiną, z drugiej strony, w odniesieniu do decyzji w sprawie
    zmiany protokołu 2 do tego układu w zakresie przenikalności między Regionalną
    konwencją w sprawie paneurośródziemnomorskich preferencyjnych reguł pochodzenia
    a przejściowymi regułami pochodzenia
  type: main
