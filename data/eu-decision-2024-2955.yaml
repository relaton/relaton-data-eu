  script: Latn
  content: Rådets afgørelse (EU) 2024/2955 af 21. november 2024 om den holdning,
    der skal indtages på Den Europæiske Unions vegne i det stabiliserings- og associeringsråd,
    der er oprettet ved stabiliserings- og associeringsaftalen mellem De Europæiske
    Fællesskaber og deres medlemsstater på den ene side og Bosnien-Hercegovina på
    den anden side, til en afgørelse om ændring af protokol 2 til nævnte aftale
    for så vidt angår parallelitet mellem den regionale konvention om pan-Euro-Middelhavsregler
    for præferenceoprindelse og overgangsoprindelsesreglerne
  type: main
- language: el
  script: Grek
