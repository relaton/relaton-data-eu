title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2623/80 of 13 October 1980 re-establishing
    the levying of customs duties on salicylic acid, falling within subheading 29.16
    B I a) and originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2623/80 de la Commission, du 13 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    salicylique, de la sous-position 29.16 B I a) du tarif douanier commun, originaire
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2623/80 der Kommission vom 13. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Salicylsäure der Tarifstelle 29.16 B I a) mit Ursprung in
    Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2623/80 af 13. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for salicylsyre, under pos. 29.16 B I a), som har
    oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2623/80 della Commissione, del 13 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili all' acido salicilico,
    della sottovoce 29.16 B I a) della tariffa doganale comune, originario dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2623/80 van de Commissie van 13 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor salicylzuur van post
    29.16 B I a), van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
