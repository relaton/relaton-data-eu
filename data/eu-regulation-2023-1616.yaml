title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/1616 of 3 May 2023 supplementing
    Regulation (EU) 2021/23 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the circumstances in which a person
    is deemed to be independent from the resolution authority and from the central
    counterparty, the methodology for assessing the value of assets and liabilities
    of a central counterparty, the separation of the valuations, the methodology for
    calculating the buffer for additional losses to be included in provisional valuations,
    and the methodology for carrying out the valuation for the application of the
    ‘no creditor worse off’ principle
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/1616 de la Commission du 3 mai 2023 complétant
    le règlement (UE) 2021/23 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les conditions dans lesquelles une personne
    est réputée indépendante à la fois de l’autorité de résolution et de la
    contrepartie centrale, la méthode à utiliser pour évaluer la valeur de l’actif
    et du passif de la contrepartie centrale, la séparation des valorisations, la
    méthode à utiliser pour calculer le coussin pour pertes supplémentaires à
    intégrer dans les valorisations provisoires, et la méthode à utiliser pour
    effectuer la valorisation aux fins de l’application du principe selon lequel
    aucun créancier ne peut être plus mal traité qu’en cas de liquidation
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/1616 der Kommission vom 3. Mai 2023 zur
    Ergänzung der Verordnung (EU) 2021/23 des Europäischen Parlaments und des Rates
    durch technische Regulierungsstandards zur Festlegung der Umstände, unter denen
    eine Person als von der Abwicklungsbehörde und der zentralen Gegenpartei unabhängig
    zu betrachten ist, der Methode zur Bewertung der Vermögenswerte und Verbindlichkeiten
    einer zentralen Gegenpartei, der Trennung der Bewertungen, der Methode zur Berechnung
    des in vorläufige Bewertungen aufzunehmenden Puffers für zusätzliche Verluste
    sowie der Methode für die Durchführung der Bewertung der Anwendung des Grundsatzes
    „keine Schlechterstellung von Gläubigern“
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/1616 на Комисията
    от 3 май 2023 година за допълнение на Регламент
    (ЕС) 2021/23 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на обстоятелствата, при които
    дадено лице се счита за независимо от органа
    за преструктуриране и от централния контрагент,
    както и за определяне на методиката за оценка
    на стойността на активите и пасивите на даден
    централен контрагент, обособяването на оценките,
    методиката за изчисляване на буфера за допълнителни
    загуби, който да бъде включен във временните
    оценки, и методиката за извършване на оценката
    във връзка с прилагането на принципа за справедливо
    третиране на кредиторите
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/1616 ze dne 3. května
    2023, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2021/23,
    pokud jde o regulační technické normy upřesňující okolnosti, za nichž
    je osoba považována za nezávislou na orgánu příslušném k řešení krize
    a na ústřední protistraně, metodiku pro posouzení hodnoty aktiv a závazků
    ústřední protistrany, oddělení ocenění, metodiku výpočtu rezervy na dodatečné
    ztráty, která má být součástí prozatímního ocenění, a metodiku oceňování
    pro použití zásady, že se žádný věřitel nesmí dostat do méně výhodného
    postavení
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/1616 af 3. maj 2023 om supplerende
    regler til Europa-Parlamentets og Rådets forordning (EU) 2021/23 for så vidt
    angår reguleringsmæssige tekniske standarder, der præciserer betingelserne
    for, at en person anses for at være uafhængig af afviklingsmyndigheden og den
    centrale modpart, metoden for ansættelse af værdien af aktiver og forpligtelser
    i en central modpart, adskillelsen af værdiansættelserne, metoden til beregning
    af den buffer for yderligere tab, der skal medtages i midlertidige værdiansættelser,
    og den metode, der skal anvendes til værdiansættelsen med henblik på at håndhæve
    princippet om, at ingen kreditorer må stilles ringere
  type: main
