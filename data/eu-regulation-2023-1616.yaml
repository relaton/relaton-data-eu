    sealadacha, agus an mhodheolaíocht chun luacháil a dhéanamh ar chur i bhfeidhm
    an phrionsabail “creidiúnaí ar bith níos measa as”
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1616 оd 3. svibnja 2023. o dopuni
    Uredbe (EU) 2021/23 Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se utvrđuju okolnosti u kojima se osoba smatra neovisnom o sanacijskom
    tijelu i o središnjoj drugoj ugovornoj strani, metodologija za procjenu vrijednosti
    imovine i obveza središnje druge ugovorne strane, odvajanje vrednovanjâ, metodologija
    za izračun zaštitnog sloja za dodatne gubitke koje treba uključiti u privremena
    vrednovanja i metodologija za provedbu vrednovanja u svrhu primjene načela prema
    kojem „nijedan vjerovnik ne smije biti doveden u nepovoljniji položaj”
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1616 felhatalmazáson alapuló rendelete (2023.
    május 3.) az (EU) 2021/23 európai parlamenti és tanácsi rendeletnek a személyek
    szanálási hatóságtól és a központi szerződő féltől való függetlenségét
    biztosító körülményeket, a központi szerződő fél eszközei és kötelezettségei
    értékének meghatározására szolgáló módszertant, az értékelések elkülönítését,
    az ideiglenes értékelésekben feltüntetendő további veszteségekre képzett
    puffer kiszámításának módszertanát, valamint „a hitelezők egyike sem
    járhat rosszabbul” elv alkalmazása céljából végzett értékelés elvégzésének
    módszertanát meghatározó szabályozástechnikai standardok tekintetében történő
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/1616 della Commissione del 3 maggio 2023
    che integra il regolamento (UE) 2021/23 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano le circostanze
    in cui un soggetto è considerato indipendente dall’autorità di risoluzione
    e dalla controparte centrale, la metodologia per valutare il valore delle attività
    e passività di una controparte centrale, la separazione delle valutazioni, la
    metodologia di calcolo della riserva per perdite aggiuntive da includere nelle
    valutazioni provvisorie e la metodologia per effettuare la valutazione ai fini
    dell’applicazione del principio per cui nessun creditore può essere svantaggiato
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/1616 (2023. gada 3. maijs), ar ko
    Eiropas Parlamenta un Padomes Regulu (ES) 2021/23 papildina attiecībā uz regulatīvajiem
    tehniskajiem standartiem, kuros precizē apstākļus, kādos persona tiek uzskatīta
    par neatkarīgu no noregulējuma iestādes un centrālā darījumu partnera, centrālā
    darījumu partnera aktīvu un saistību vērtības noteikšanas metodiku, vērtējumu
    nošķiršanu, metodiku, saskaņā ar kuru aprēķina rezerves papildu zaudējumiem,
    kas jāiekļauj provizoriskajos vērtējumos, un metodiku vērtēšanas veikšanai,
    lai piemērotu principu “neviens kreditors nav sliktākā situācijā”
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/1616 2023 m. gegužės 3 d.
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2021/23 papildomas techniniais
    reguliavimo standartais, kuriais patikslinamos aplinkybės, kuriomis asmuo yra
    laikomas nepriklausomu nuo pertvarkymo institucijos ir nuo pagrindinės sandorio
    šalies, pagrindinės sandorio šalies turto ir įsipareigojimų vertės vertinimo
    metodika, vertinimų atskyrimas, papildomų nuostolių rezervo, įtrauktino į
    preliminarius vertinimus, apskaičiavimo metodika ir vertinimo siekiant taikyti
    principą, kad nė vieno kreditoriaus padėtis nėra blogesnė, atlikimo metodika
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/1616 tat-3 ta’ Mejju 2023
    li jissupplimenta r-Regolament (UE) 2021/23 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ standards tekniċi regolatorji li jispeċifikaw iċ-ċirkostanzi
    li fihom persuna titqies bħala indipendenti mill-awtorità ta’ riżoluzzjoni
    u mill-kontroparti ċentrali, il-metodoloġija għall-valutazzjoni tal-valur tal-assi
    u tal-obbligazzjonijiet ta’ kontroparti ċentrali, is-separazzjoni tal-valwazzjonijiet,
    il-metodoloġija għall-kalkolu tal-buffer għal telf addizzjonali li għandha
    tiġi inkluża f’valwazzjonijiet provviżorji, u l-metodoloġija għat-twettiq
    tal-valwazzjoni għall-applikazzjoni tal-prinċipju li “l-ebda kreditur ma jmur
    agħar”
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/1616 van de Commissie van 3 mei 2023
    tot aanvulling van Verordening (EU) 2021/23 van het Europees Parlement en de Raad
    met technische reguleringsnormen tot nadere bepaling van de omstandigheden waaronder
    een persoon geacht wordt onafhankelijk te zijn van de afwikkelingsautoriteit en
    van de centrale tegenpartij, de methode voor de beoordeling van de waarde van
    activa en passiva van een centrale tegenpartij, de scheiding van de waarderingen,
    de methode voor de berekening van de buffer voor extra verliezen die moet worden
    opgenomen in voorlopige waarderingen, en de methode voor het verrichten van de
    waardering voor de toepassing van het “geen enkele schuldeiser slechter af”-beginsel
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/1616 z dnia 3 maja 2023 r.
    uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2021/23 w
    odniesieniu do regulacyjnych standardów technicznych określających okoliczności,
    w których daną osobę uznaje się za niezależną od organu ds. restrukturyzacji
    i uporządkowanej likwidacji oraz od kontrahenta centralnego, metodykę oceny
    wartości aktywów i zobowiązań kontrahenta centralnego, oddzielenie wycen,
    metodykę obliczania bufora z tytułu dodatkowych strat, który należy uwzględnić
    w wycenach wstępnych, oraz metodę przeprowadzania wyceny na potrzeby stosowania
    zasady niepogarszania sytuacji wierzycieli
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/1616 da Comissão de 3 de maio de 2023 que
    complementa o Regulamento (UE) 2021/23 do Parlamento Europeu e do Conselho no
    que diz respeito às normas técnicas de regulamentação que especificam as circunstâncias
    em que se considera que uma pessoa é independente da autoridade de resolução
    e da contraparte central, a metodologia de avaliação do valor dos ativos e passivos
    de uma contraparte central, a separação das avaliações, a metodologia de cálculo
    da reserva prudencial para perdas adicionais a incluir nas avaliações provisórias
    e a metodologia para a realização da avaliação para efeitos da aplicação
    do princípio de que nenhum credor fica pior
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/1616 al Comisiei din 3 mai 2023 de completare
    a Regulamentului (UE) 2021/23 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează circumstanțele
    în care se consideră că o persoană este independentă față de autoritatea
    de rezoluție și de contrapartea centrală, metodologia de evaluare a valorii
    activelor și pasivelor unei contrapărți centrale, separarea evaluărilor, metodologia
    de calculare a rezervei pentru pierderi suplimentare care urmează să fie inclusă
    în evaluările provizorii și metodologia de efectuare a evaluării în vederea
    aplicării principiului potrivit căruia niciun creditor nu trebuie să fie dezavantajat
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/1616 z 3. mája 2023, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2021/23, pokiaľ ide
    o regulačné technické predpisy špecifikujúce okolnosti, za ktorých sa osoba
    považuje za nezávislú od orgánu pre riešenie krízových situácií a od
    centrálnej protistrany, metodiku posudzovania hodnoty aktív a záväzkov centrálnej
    protistrany, oddelenie ocenení, metodiku výpočtu rezervy na dodatočné straty,
    ktorá sa má zahrnúť do predbežných ocenení, a metodiku vykonávania ocenenia
    na účely uplatňovania zásady, že „žiadny veriteľ sa nesmie dostať do
    nevýhodnejšieho postavenia“
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1616 z dne 3. maja 2023 o dopolnitvi
    Uredbe (EU) 2021/23 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki določajo okoliščine, v katerih se oseba šteje za neodvisno od
    organa za reševanje in od centralne nasprotne stranke, metodologijo za ocenjevanje
    vrednosti sredstev in obveznosti centralne nasprotne stranke, ločitev vrednotenj,
    metodologijo za izračun blažilnika za dodatne izgube, ki se vključi v začasna
    vrednotenja, ter metodologijo za izvajanje vrednotenja za uporabo načela „noben
    upnik ne sme biti na slabšem“
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/1616 de la Comisión de 3 de mayo de 2023
    por el que se completa el Reglamento (UE) 2021/23 del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación que especifican
    las circunstancias en las que se considera que una persona es independiente de
    la autoridad de resolución y de la entidad de contrapartida central, el método
    para evaluar el valor de los activos y pasivos de una entidad de contrapartida
    central, la separación de las valoraciones, el método de cálculo del colchón
    para pérdidas adicionales que se ha de incluir en las valoraciones provisionales
    y el método para llevar a cabo la valoración a efectos de la aplicación del
    principio de evitación de perjuicios superiores a los acreedores
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/1616 av den 3 maj 2023 om
    komplettering av Europaparlamentets och rådets förordning (EU) 2021/23 vad gäller
    tekniska standarder för tillsyn som närmare anger de omständigheter under vilka
    en person anses vara oberoende av resolutionsmyndigheten och den centrala motparten,
    metoden för att bedöma värdet av en central motparts tillgångar och åtaganden,
    åtskillnad mellan värderingarna, metoden för beräkning av bufferten för ytterligare
    förluster som ska ingå i de preliminära värderingarna och metoden för att
    utföra värderingen för tillämpningen av principen ”inte sämre villkor för
    borgenär”
  type: main
