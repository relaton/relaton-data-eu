    της αξίας των στοιχείων ενεργητικού και παθητικού
    ενός κεντρικού αντισυμβαλλομένου, τον διαχωρισμό
    των αποτιμήσεων, τη μεθοδολογία για τον υπολογισμό
    του αποθέματος ασφαλείας για πρόσθετες ζημίες
