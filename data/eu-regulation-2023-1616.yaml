    για την εφαρμογή της αρχής της μη χειροτέρευσης
    της θέσης των πιστωτών
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2023/1616, 3. mai 2023, millega täiendatakse
    Euroopa Parlamendi ja nõukogu määrust (EL) 2021/23 seoses regulatiivsete tehniliste
    standarditega, millega määratakse kindlaks asjaolud, mille korral peetakse isikut
    kriisilahendusasutusest ja kesksest vastaspoolest sõltumatuks, keskse vastaspoole
    varade ja kohustuste väärtuse hindamise metoodika, väärtuse hindamiste eraldatus,
