    hindamise läbiviimise metoodika
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2023/1616, annettu 3 päivänä toukokuuta
    2023, Euroopan parlamentin ja neuvoston asetuksen (EU) 2021/23 täydentämisestä
    niiden teknisten sääntelystandardien osalta, joissa täsmennetään olosuhteet,
    joissa henkilön katsotaan olevan riippumaton kriisinratkaisuviranomaisesta ja
    keskusvastapuolesta, keskusvastapuolen varojen ja velkojen arvon arviointimenetelmä,
    arvostusten pitäminen erillään, menetelmä, jolla lasketaan tilapäisiin arvostuksiin
    sisällytettävä puskuri lisätappioiden varalta sekä menetelmät, joilla suoritetaan
    arvostus periaatteen, jonka mukaan velkojat eivät saa jäädä kriisinratkaisussa
    huonompaan asemaan, soveltamiseksi
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2023/1616 ón gCoimisiún an 3 Bealtaine 2023
    lena bhforlíontar Rialachán (AE) 2021/23 ó Pharlaimint na hEorpa agus ón gComhairle
    maidir le caighdeáin theicniúla rialála lena sonraítear na himthosca ina meastar
