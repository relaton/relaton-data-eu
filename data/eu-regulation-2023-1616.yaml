  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2023/1616
    της Επιτροπής της 3ης Μαΐου 2023 για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2021/23 του Ευρωπαϊκού Κοινοβουλίου
