  content: Commission Regulation (EEC) No 3021/78 of 21 December 1978 amending for
    the 16th time Regulation (EEC) No 2042/75 on special detailed rules for the application
    of the system of import and export licences for cereals and rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3021/78 de la Commission, du 21 décembre 1978, portant
    seizième modification du règlement (CEE) n° 2042/75 portant modalités particulières
    d' application du régime des certificats d' importation et d' exportation dans
    le secteur des céréales et du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3021/78 der Kommission vom 21. Dezember 1978 zur sechzehnten
    Änderung der Verordnung (EWG) Nr. 2042/75 über besondere Durchführungsvorschriften
    für Einfuhr- und Ausfuhrlizenzen für Getreide und Reis
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3021/78 af 21. december 1978 om sekstende
    ændring af forordning (EØF) nr. 2042/75 om de særlige gennemførelsesbestemmelser
    for ordningen med import- og eksportlicenser for korn og ris
  type: main
- language: el
  script: Grek
