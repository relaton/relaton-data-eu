    v přenesené pravomoci (EU) 2017/583, pokud jde o požadavky na transparentnost
    pro obchodní systémy a investiční podniky v souvislosti s deriváty, (EU)
    2017/2194, pokud jde o souborné pokyny, a (EU) 2025/1155, pokud jde o vstupní
    a výstupní údaje konsolidovaných obchodních informací o OTC derivátech,
    a kterým se opravuje nařízení Komise v přenesené pravomoci (EU) 2017/587
  type: main
