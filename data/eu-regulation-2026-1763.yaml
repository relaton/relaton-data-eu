    für Handelsplätze und Wertpapierfirmen in Bezug auf Derivate, (EU) 2017/2194
    im Hinblick auf Auftragspakete und (EU) 2025/1155 hinsichtlich der Input- und
    Outputdaten des konsolidierten Datentickers für OTC-Derivate festgelegten technischen
    Regulierungsstandards sowie zur Berichtigung der Delegierten Verordnung (EU) 2017/587
  type: main
