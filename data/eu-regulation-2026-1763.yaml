title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/1763 of 13 July 2026 amending
    the regulatory technical standards laid down in Delegated Regulations (EU) 2017/583
    as regards transparency requirements for trading venues and investment firms in
    respect of derivatives, (EU) 2017/2194 as regards package orders and (EU) 2025/1155
    as regards input and output data of the OTC derivatives consolidated tape, and
    correcting Delegated Regulation (EU) 2017/587
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/1763 de la Commission du 13 juillet 2026
    modifiant les normes techniques de réglementation définies par le règlement
    délégué (UE) 2017/583 en ce qui concerne les obligations de transparence applicables
    aux plates-formes de négociation et aux entreprises d’investissement pour les
    produits dérivés, le règlement délégué (UE) 2017/2194 en ce qui concerne
    les paquets d’ordres et le règlement délégué (UE) 2025/1155 en ce qui concerne
    les données d’entrée et de sortie du système consolidé de publication pour
    les produits dérivés de gré à gré, et rectifiant le règlement délégué
    (UE) 2017/587
  type: main
- language: de
  script: Latn
