  script: Latn
  content: A Bizottság (EU) 2026/1763 felhatalmazáson alapuló rendelete (2026.
    július 13.) az (EU) 2017/583 felhatalmazáson alapuló rendeletben meghatározott
    szabályozástechnikai standardoknak a származtatott ügyletek tekintetében
    a kereskedési helyszínekre és a befektetési vállalkozásokra vonatkozó átláthatósági
    követelmények tekintetében, az (EU) 2017/2194 felhatalmazáson alapuló rendeletben
    meghatározott szabályozástechnikai standardoknak a csomagmegbízások tekintetében,
    valamint az (EU) 2025/1155 felhatalmazáson alapuló rendeletben meghatározott
    szabályozástechnikai standardoknak a tőzsdén kívüli származtatott ügyletekre
    vonatkozó összesítettadat-szolgáltatás bemeneti és kimeneti adatai tekintetében
    történő módosításáról és az (EU) 2017/587 felhatalmazáson alapuló bizottsági
    rendelet helyesbítéséről
  type: main
- language: it
  script: Latn
