    regulatornih tehničkih standarda utvrđenih u Delegiranoj uredbi (EU) 2017/583
    u vezi sa zahtjevima u pogledu transparentnosti za mjesta trgovanja i investicijska
    društva za izvedenice, Delegiranoj uredbi (EU) 2017/2194 u vezi s paketima naloga
    i Delegiranoj uredbi (EU) 2025/1155 u vezi s ulaznim i izlaznim podacima za konsolidirane
