title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3685/90 of 19 December 1990 laying down
    certain additional detailed rules for the application of the supplementary trade
    mechanism (STM) to fruit and vegetable trade between Spain and the Community as
    constituted on 31 December 1985 as regards tomatoes, lettuce, broad-leaf endives,
    carrots, artichokes, table grapes and melons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3685/90 de la Commission, du 19 décembre 1990, fixant
    certaines modalités additionnelles pour l'application du mécanisme complémentaire
    aux échanges (MCE) dans le secteur des fruits et légumes entre l'Espagne et
    la Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les
    tomates, les laitues, les chicorées scaroles, les artichauts, les raisins de
    table et les melons
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 3685/90 DER KOMMISSION VOM 19. DEZEMBER 1990 MIT
    ZUSAETZLICHEN BESTIMMUNGEN ZUM ERGAENZENDEN MECHANISMUS IM HANDEL MIT TOMATEN,
    SALAT, ENDIVIE ESKARIOL, ARTISCHOCKEN, TAFELTRAUBEN UND MELONEN ZWISCHEN SPANIEN
    UND DER GEMEINSCHAFT IN IHRER ZUSAMMENSETZUNG AM 31. DEZEMBER 1985
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3685/90 af 19. december 1990 om visse
    yderligere gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen
    mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985 i
    sektoren for frugt og grønsager, for så vidt angår tomater, salat, bredbladet
    endivie, artiskokker, druer til spisebrug og meloner
  type: main
- language: el
  script: Grek
