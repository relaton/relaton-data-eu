    της 19ης Δεκεμβρίου 1990 για τον καθορισμό ορισμένων
    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών μεταξύ της
    Ισπανίας και της Κοινότητας με τη σύνθεσή της
    στις 31 Δεκεμβρίου 1985 όσον αφορά τις τομάτες,
    τα μαρούλια, τις σκαρόλες, τις αγκινάρες, τα
    επιτραπέζια σταφύλια και τα πεπόνια
  type: main
