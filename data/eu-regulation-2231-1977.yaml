title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2231/77 of 6 October 1977 re-establishing
    the levying of the customs duties on wood (including blocks, strips and friezes
    for parquet or wood block flooring, not assembled), planed, tongued, grooved,
    rebated, chamfered, V-jointed, centre V-jointed, beaded, centre-beaded or the
    like, but not further manufactured, falling within heading No 44.13, originating
    in Malaysia to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2231/77 de la Commission, du 6 octobre 1977, portant
    rétablissement de la perception des droits de douane applicables aux bois (y
    compris les lames ou frises pour parquets, non assemblées), rabotés, rainés,
    bouvetés, languetés, feuillures, chanfreines ou similaires, de la position tarifaire
    44.13, originaires de Malaysia, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2231/77 der Kommission vom 6. Oktober 1977 zur Wiedereinführung
    des Zollsatzes für Holz, gehobelt, genutet usw., der Tarifnummer 44.13, mit Ursprung
    in Malaysia, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2231/77 af 6. oktober 1977 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, falset, affaset eller
    på lignende måde bearbejdet (herunder ikke-sammensatte parketstave) under position
    44.13, som har oprindelse i Malaysia og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2231/77 della Commissione, del 6 ottobre 1977, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato a forma di battente, ecc., della voce doganale 44.13, originario della
    Malesia beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2231/77 van de Commissie van 6 oktober 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op hout, geschaafd,
    geploegd of van sponningen voorzien, enz., van post 44.13, van oorsprong uit Maleisië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
