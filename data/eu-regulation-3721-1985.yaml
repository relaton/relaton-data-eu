title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3721/85 of 20 December 1985 fixing, for certain
    fish stocks and groups of fish stocks, total allowable catches for 1986 and certain
    conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3721/85 du Conseil du 20 décembre 1985 fixant, pour
    certains stocks ou groupes de stocks de poissons, les totaux admissibles des captures
    pour 1986 et certaines conditions dans lequelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3721/85 des Rates vom 20. Dezember 1985 zur Festlegung
    der zulässigen Gesamtfangmenge und bestimmter Fangbedingungen hinsichtlich der
    zulässigen Gesamtfangmengen für bestimmte Fischbestände oder Bestandsgruppen
    für 1986
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3721/85 af 20. december 1985 om fastsættelse
    for 1986 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
    af fiskebestande i Fællesskabets fiskerizone samt af visse betingelser for fiskeri
    af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3721/85 του Συμβουλίου
    της 20ής Δεκεμβρίου 1985 για τον καθορισμό, για
    ορισμένα αποθέματα ιχθύων ή ομάδες αποθεμάτων
    ιχθύων, του συνόλου επιτρεπομένων αλιευμάτων
    για το 1986 και ορισμένων όρων υπό τους οποίους
    μπορούν να αλιευθούν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3721/85 del Consiglio del 20 dicembre 1985 che fissa,
    per alcune popolazioni o gruppi di popolazioni ittiche, il totale delle catture
    ammissibile per il 1986 ed alcune condizioni cui è soggetta la pesca del totale
    delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3721/85 van de Raad van 20 december 1985 inzake de
    vaststelling van de voor 1986 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden en bepaalde bij de visserij in het kader
    van de totaal toegestane vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3721/85 do Conselho, de 20 de Dezembro de 1985,
    que fixa, relativamente a certas unidades populacionais (stocks) ou grupos de
    unidades populacionais de peixes, os totais admissíveis de capturas para 1986
    e certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3721/85 del Consejo, de 20 de diciembre de 1985, por
    el que se fijan, para determinadas poblaciones o grupos de poblaciones de peces,
    los totales admisibles de capturas para 1986 y determinadas condiciones en las
    que pueden pescarse
  type: main
