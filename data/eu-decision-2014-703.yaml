    2014 , che modifica gli allegati I e II della decisione 2004/558/CE per quanto
    concerne l''approvazione di un programma di lotta volto a eradicare la rinotracheite
    infettiva bovina in Belgio e la qualifica di indenne dalla rinotracheite infettiva
    bovina del Land della Turingia in Germania [notificata con il numero C(2014) 7113]'
  type: main
