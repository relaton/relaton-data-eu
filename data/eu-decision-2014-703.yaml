title:
- language: en
  script: Latn
  content: '2014/703/EU: Commission Implementing Decision of 8 October 2014 amending
    Annexes I and II to Decision 2004/558/EC as regards the approval of a control
    programme for eradicating infectious bovine rhinotracheitis in Belgium and the
    infectious bovine rhinotracheitis-free status of the Federal State of Thuringia
    in Germany (notified under document C(2014) 7113)'
  type: main
- language: fr
  script: Latn
  content: '2014/703/UE: Décision d''exécution de la Commission du 8 octobre 2014
    modifiant les annexes I et II de la décision 2004/558/CE en ce qui concerne l''approbation
    d''un programme de contrôle pour l''éradication de la rhinotrachéite infectieuse
    bovine en Belgique et le statut d''indemne de rhinotrachéite infectieuse bovine
    du land de Thuringe [notifiée sous le numéro C(2014) 7113]'
  type: main
- language: de
  script: Latn
  content: '2014/703/EU: Durchführungsbeschluss der Kommission vom 8. Oktober 2014
    zur Änderung der Anhänge I und II der Entscheidung 2004/558/EG der Kommission
    hinsichtlich der Genehmigung eines Bekämpfungsprogramms zur Tilgung der infektiösen
    bovinen Rhinotracheitis in Belgien und des Status des Freistaats Thüringen in
    Deutschland als frei von der infektiösen bovinen Rhinotracheitis (Bekannt gegeben
    unter Aktenzeichen C(2014) 7113)'
  type: main
- language: bg
  script: Cyrl
