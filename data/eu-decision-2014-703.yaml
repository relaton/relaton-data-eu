    на програма за контрол за ликвидиране на инфекциозен
    ринотрахеит по говедата в Белгия и статута
    „свободна от инфекциозен ринотрахеит по говедата“
    на федерална провинция Тюрингия в Германия
    (нотифицирано под номер С(2014) 7113)'
  type: main
- language: cs
  script: Latn
