    programu tlumení pro eradikaci infekční bovinní rinotracheitidy v Belgii a
    o status spolkové země Durynsko v Německu jako území úředně prostého
    infekční bovinní rinotracheitidy (oznámeno pod číslem C(2014) 7113)'
  type: main
- language: da
  script: Latn
