    rhinotracheitisének Belgiumban történő felszámolására irányuló felügyeleti
    program jóváhagyása, valamint a németországi Türingia szövetségi tartománynak
    a szarvasmarhák fertőző rhinotracheitisétől mentes státusa tekintetében
    történő módosításáról (az értesítés a C(2014) 7113. számú dokumentummal
    történt)'
  type: main
- language: it
  script: Latn
