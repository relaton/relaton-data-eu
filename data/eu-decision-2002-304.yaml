title:
- language: en
  script: Latn
  content: '2002/304/EC: Commission Decision of 19 April 2002 approving programmes
    with a view to obtaining the status of approved zones and of approved farms in
    non-approved zones with regard to one or more of the fish diseases viral haemorrhagic
    septicaemia (VHS) and infectious haematopoietic necrosis (IHN) (Text with EEA
    relevance) (notified under document number C(2002) 1435)'
  type: main
- language: fr
  script: Latn
  content: '2002/304/CE: Décision de la Commission du 19 avril 2002 approuvant des
    programmes visant à obtenir le statut de zones agréées et de fermes d''élevage
    agréées situées dans des zones non agréées au regard de l''une ou des deux
    maladies des poissons que sont la septicémie hémorragique virale (SHV) et la
    nécrose hématopoïétique infectieuse (NHI) (Texte présentant de l''intérêt
    pour l''EEE) [notifiée sous le numéro C(2002) 1435]'
  type: main
- language: de
  script: Latn
  content: '2002/304/EG: Entscheidung der Kommission vom 19. April 2002 zur Genehmigung
    von Programmen zur Erlangung des Status zugelassener Gebiete und zugelassener
    Betriebe in nicht zugelassenen Gebieten hinsichtlich der Fischseuchen virale hämorrhagische
    Septikämie (VHS) und infektiöse hämatopoetische Nekrose (IHN) (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2002) 1435)'
  type: main
- language: da
  script: Latn
  content: '2002/304/EF: Kommissionens beslutning af 19. april 2002 om godkendelse
    af programmer, der er forelagt for at opnå godkendelse af zoner og akvakulturbrug
    i zoner, der ikke er godkendt med hensyn til egtvedsyge (VHS) og/eller infektiøs
    hæmatopoietisk nekrose (IHN) (EØS-relevant tekst) (meddelt under nummer K(2002)
    1435)'
  type: main
- language: el
  script: Grek
  content: '2002/304/ΕΚ: Απόφαση της Επιτροπής, της 19ης
    Απριλίου 2002, για την έγκριση προγραμμάτων με
    στόχο την απόκτηση του καθεστώτος των εγκεκριμένων
    ζωνών και εκμεταλλεύσεων σε μη εγκεκριμένες
    ζώνες, όσον αφορά μία ή περισσότερες από τις
    νόσους των ψαριών της ιογενούς αιμορραγικής
    σηψαιμίας (ΙΑΣ) και της λοιμώδους αιματοποιητικής
    νέκρωσης (ΛΑΝ) (Κείμενο που παρουσιάζει ενδιαφέρον
    για τον ΕΟΧ) [κοινοποιηθείσα υπό τον αριθμό
    Ε(2002) 1435]'
  type: main
- language: fi
  script: Latn
  content: '2002/304/EY: Komission päätös, tehty 19 päivänä huhtikuuta 2002,
    ohjelmien hyväksymisestä hyväksytyn vyöhykkeen tai ei-hyväksytyllä vyöhykkeellä
    sijaitsevan hyväksytyn tilan aseman saamiseksi verenvuotoseptikemian (VHS) ja/tai
    tarttuvan vertamuodostavan kudoksen kuolion (IHN) osalta (ETA:n kannalta merkityksellinen
    teksti) (tiedoksiannettu numerolla K(2002) 1435)'
  type: main
- language: it
  script: Latn
  content: '2002/304/CE: Decisione della Commissione, del 19 aprile 2002, che approva
    programmi intesi ad ottenere la qualifica di zone riconosciute e di aziende riconosciute
    in zone non riconosciute per quanto concerne le malattie dei pesci setticemia
    emorragica virale (VHS) e necrosi ematopoietica infettiva (IHN) (Testo rilevante
    ai fini del SEE) [notificata con il numero C(2002) 1435]'
  type: main
- language: nl
  script: Latn
  content: '2002/304/EG: Beschikking van de Commissie van 19 april 2002 houdende goedkeuring
    van programma''s ter verkrĳging van de status van erkend gebied en erkend bedrĳf
    in een niet-erkend gebied ten aanzien van virale hemorragische septikemie (VHS),
    van infectieuze hematopoïetische necrose (IHN) of van beide visziekten (Voor
    de EER relevante tekst) (kennisgeving geschied onder nummer C(2002) 1435)'
  type: main
- language: pt
  script: Latn
  content: '2002/304/CE: Decisão da Comissão, de 19 de Abril de 2002, que aprova
    programas com vista à obtenção do estatuto de zonas aprovadas e de explorações
    aprovadas em zonas não aprovadas no que diz respeito a uma ou mais doenças dos
    peixes, nomeadamente a septicemia hemorrágica viral e a necrose hematopoética
    infecciosa (Texto relevante para efeitos do EEE) [notificada com o número C(2002)
    1435]'
  type: main
- language: es
  script: Latn
  content: '2002/304/CE: Decisión de la Comisión, de 19 de abril de 2002, por la
    que se aprueban programas con vistas a obtener la calificación de zonas autorizadas
    y piscifactorías autorizadas en zonas no autorizadas en relación con la septicemia
    hemorrágica viral (SHV) y la necrosis hematopoyética infecciosa (NHI) (Texto
    pertinente a efectos del EEE) [notificada con el número C(2002) 1435]'
  type: main
- language: sv
  script: Latn
  content: '2002/304/EG: Kommissionens beslut av den 19 april 2002 om godkännande
    av program för att erhålla status som godkänd zon eller godkänd odling i en
    icke-godkänd zon med avseende på viral hemorragisk septikemi och/eller infektiös
    hematopoietisk nekros (Text av betydelse för EES) [delgivet med nr K(2002) 1435]'
