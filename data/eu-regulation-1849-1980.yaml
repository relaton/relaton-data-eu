title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1849/80 of 11 July 1980 re-establishing
    the levying of customs duties on screws for wood, falling within subheading 73.32
    ex B and originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1849/80 de la Commission, du 11 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux vis à bois,
    de la sous-position 73.32 ex B du tarif douanier commun, originaires de Hong-kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1849/80 der Kommission vom 11. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Holzschrauben der Tarifstelle 73.32 ex B mit Ursprung in Hongkong,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1849/80 af 11. juli 1980 om genindførelse
    af opkrævning af toldafgifter for træskruer, underpos. 73.32 ex B, som har oprindelse
    i Hongkong og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1849/80 della Commissione, dell' 11 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle viti per legno, della
    sottovoce 73.32 ex B della tariffa doganale comune, originarie di Hong Kong, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1849/80 van de Commissie van 11 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op houtschroeven,
    van post 73.32 ex B, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
