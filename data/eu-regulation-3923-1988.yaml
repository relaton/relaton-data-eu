title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3923/88 of 12 December 1988 imposing a definitive
    anti-dumping duty on imports of paracetamol originating in the people's Republic
    of China and definitively collecting the provisional duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3923/88 du Conseil du 12 décembre 1988 instituant
    un droit antidumping définitif sur les importations de paracétamol originaire
    de la République populaire de Chine et portant perception définitive du droit
    antidumping provisoire institué sur ces importations
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3923/88 DES RATES vom 12. Dezember 1988 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Paracetamol mit Ursprung
    in der Volksrepublik China und zur endgültigen Vereinnahmung der auf diese Einfuhren
    erhobenen vorläufigen Antidumpingzölle #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3923/88 af 12. december 1988 om indførelse
    af en endelig antidumpingtold på importen af paracetamol med oprindelse i Den
    Kinesiske Folkerepublik og om endelig opkrævning af den midlertidige antidumpingtold,
    der er pålagt denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3923/88 του Συμβουλίου
    της 12ης Δεκεμβρίου 1988 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές παρακεταμόλης,
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας, και
    για την οριστική είσπραξη του προσωρινού δασμού
    αντιντάμπινγκ που έχει επιβληθεί στις εισαγωγές
    αυτές
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3923/88 DEL CONSIGLIO del 12 dicembre 1988 che istituisce
    un dazio antidumping definitivo sulle importazioni di paracetamolo originario
    della Repubblica popolare cinese e dispone la riscossione definitiva del dazio
    antidumping provvisorio su dette importazioni #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3923/88 VAN DE RAAD van 12 december 1988 houdende
    instelling van een definitief anti-dumpingrecht op de invoer van paracetamol van
    oorsprong uit de Volksrepubliek China en definitieve inning van het op deze invoer
    ingestelde voorlopige anti-dumpingrecht #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3923/88 DO CONSELHO de 12 de Dezembro de 1988 que
    introduz um direito anti-dumping definitivo sobre as importaçoes de paracetamol
    originario da Republica Popular da China e que estabelece a cobrança definitiva
    do direito anti-dumping provisorio introduzido sobre essas importaçoes
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3923/88 DEL CONSEJO de 12 de diciembre de 1988 por
    el que se establece un derecho antidumping definitivo sobre las importaciones
    de paracetamol originario de la República Popular de China y por el que se establece
    la percepción definitiva del derecho antidumping provisional aplicado a dichas
    importaciones #'
