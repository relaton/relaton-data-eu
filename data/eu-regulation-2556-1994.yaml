    δασμού αντιντάμπινγκ, που επεβλήθη με τον κανονισμό
    (ΕΚ) αριθ. 1418/94 της Επιτροπής
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2556/94, annettu 19 päivänä lokakuuta 1994,
    lopullisen polkumyyntitullin käyttöön ottamisesta Kiinan kansantasavallasta,
    Venäjän federaatiosta ja Ukrainasta peräisin olevan keinotekoisen korundin
    tuonnissa, lukuun ottamatta niiden yritysten yhteisöön vietäväksi myytyä
    tuontia, joiden sitoumukset on hyväksytty, annetun asetuksen (ETY) N:o 2552/93
    muuttamisesta sekä komission asetuksella (EY) N:o 1418/94 käyttöön otetun
    väliaikaisen polkumyyntitullin vakuutena olleiden määrien lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2556/94 del Consiglio, del 19 ottobre 1994, recante
    modifica del regolamento (CEE) n. 2552/93 che istituisce un dazio antidumping
    definitivo sulle importazioni di corindone artificiale originario della Repubblica
    popolare cinese, della Federazione russa e dell'Ucraina, fatta eccezione per le
    importazioni dello stesso prodotto venduto per l'esportazione nella Comunità
    da società i cui impegni sono stati accettati, e relativo alla riscossione definitiva
    degli importi depositati a titolo di dazio antidumping provvisorio a norma del
    regolamento (CE) n. 1418/94 della Commissione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2556/94 van de Raad van 19 oktober 1994 tot wijziging
    van Verordening (EEG) nr. 2552/93 tot instelling van een definitief anti-dumpingrecht
    op de invoer van kunstmatig korund van oorsprong uit de Volksrepubliek China,
    uit Oekraïne en uit de Russische Federatie, met uitzondering van de door de ondernemingen
    welker verbintenissen zijn aanvaard, voor uitvoer naar de Gemeenschap verkochte
    produkten en tot definitieve invordering van de bedragen waarvoor zekerheid is
    gesteld uit hoofde van het bij Verordening (EG) nr. 1418/94 van de Commissie ingestelde
    voorlopige anti- dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2556/94 do Conselho, de 19 de Outubro de 1994, que
    altera o Regulamento (CEE) nº 2552/93, que cria um direito anti-dumping definitivo
    sobre as importações de corindo artificial originárias da República Popular
    da China, da Federação da Rússia e da Ucrânia, com excepção das importações
    vendidas para exportação, para a Comunidade, por empresas cujos compromissos
    foram aceites e que prevê a cobrança definitiva dos montantes garantidos através
    do direito anti-dumping provisório criado pelo Regulamento (CE) nº 1418/94 da
    Comissão
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2556/94 del Consejo, de 19 de octubre de 1994, por
    el que se modifica el Reglamento (CEE) nº 2552/93 que establece un derecho antidumping
    definitivo sobre las importaciones de corindón artificial originario de la República
    Popular de China, la Federación Rusa y Ucrania, con excepción de las importaciones
    del mismo producto vendido para su exportación a la Comunidad por empresas cuyos
    compromisos han sido aceptados, y por el que se perciben definitivamente los importes
    garantizados mediante el derecho antidumping provisional establecido por el Reglamento
    (CE) nº 1418/94 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2556/94 av den 19 oktober 1994 om ändring
    av rådets förordning (EEG) nr 2552/93 om införande av en slutgiltig antidumpningstull
    på import av konstgjord korund med ursprung i Kina, Ryssland och Ukraina, med
    undantag för den import som sålts för export till gemenskapen av företag vilkas
    åtaganden har godtagits, och om slutgiltigt uttag av de belopp som säkerställts
    genom provisorisk antidumpningstull införd genom kommissionens förordning (EG)
    nr 1418/94
