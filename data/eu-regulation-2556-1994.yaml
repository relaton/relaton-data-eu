    της 19ης Οκτωβρίου 1994 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2552/93 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές τεχνητού
    κορουνδίου καταγωγής Λαϊκής Δημοκρατίας της
    Κίνας, Ρωσικής Ομοσπονδίας και Ουκρανίας, με
