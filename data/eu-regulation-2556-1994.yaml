title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2556/94 of 19 October 1994 amending Regulation
    (EEC) No 2552/93 imposing a definitive anti-dumping duty on imports of artificial
    corundum originating in the People's Republic of China, the Russian Federation
    and Ukraine, with the exception of those imports sold for export to the Community
    by companies whose undertakings have been accepted, and definitively collecting
    the amounts secured by way of the provisional anti-dumping duty imposed by Commission
    Regulation (EC) No 1418/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2556/94 du Conseil, du 19 octobre 1994, modifiant le
    règlement (CEE) n° 2552/93 instituant un droit antidumping définitif sur les
    importations de corindon artificiel originaire de la République populaire de
    Chine, de la Fédération russe et de l'Ukraine, à l'exception des importations
    vendues à l'exportation dans la Communauté par les entreprises dont les engagements
    ont été acceptés et portant perception définitive des montants déposés au
    titre du droit antidumping provisoire institué par le règlement (CE) n° 1418/94
    de la Commission
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2556/94 des Rates vom 19. Oktober 1994 zur Änderung
    der Verordnung (EWG) Nr. 2552/93 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren von künstlichem Korund mit Ursprung in der Volksrepublik China,
    der Russischen Föderation und der Ukraine mit Ausnahme der Ausfuhren der Unternehmen,
    deren Verpflichtungen angenommen wurden, und zur endgültigen Vereinnahmung der
    Sicherheitsleistungen für den mit der Verordnung (EG) Nr. 1418/94 der Kommission
    eingeführten vorläufigen Antidumpingzoll
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2556/94 af 19. oktober 1994 om ændring af
    forordning (EØF) nr. 2552/93 om indførelse af en endelig antidumpingtold på
    importen af kunstig korund med oprindelse i Den Kinesiske Folkerepublik, Rusland
    og Ukraine med undtagelse af import af den pågældende vare, som sælges til
    eksport til Fællesskabet af selskaber, hvis tilsagn er blevet godtaget, og om
    endelig opkrævning af de beløb, der er stillet som sikkerhed i form af midlertidig
    antidumpingtold i henhold til Kommissionens forordning (EF) nr. 1418/94
  type: main
- language: el
  script: Grek
