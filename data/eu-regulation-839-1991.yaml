title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 839/91 of 4 April 1991 fixing the number
    of young male bovine animals which may be imported on special terms in the first
    and second quarters of 1991 derogating from Regulation (EEC) No 2377/80 in respect
    of those quarters and repealing Regulation (EEC) No 3883/90
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 839/91 DE LA COMMISSION du 4 avril 1991 relatif à
    la fixation de la quantité de jeunes bovins mâles pouvant être importés à
    des conditions spéciales pour les premier et deuxième trimestres de 1991, portant
    dérogation, pour ces trimestres, au règlement (CEE) no 2377/80 et abrogeant
    le règlement (CEE) no 3883/90 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 839/91 DER KOMMISSION vom 4. April 1991 zur Festsetzung
    der Anzahl männlicher Jungrinder, die im ersten und zweiten Vierteljahr 1991
    unter Sonderbedingungen eingeführt werden können, zur Abweichung von der Verordnung
    (EWG) Nr. 2377/80 in diesen Vierteljahren und zur Aufhebung der Verordnung (EWG)
    Nr. 3883/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 839/91 af 4. april 1991 om fastsættelse
    af den mængde ungtyre, der kan indføres på særlige betingelser i første og
    andet kvartal af 1991, om undtagelse for disse kvartaler fra forordning (EØF)
    nr. 2377/80 og om ophævelse af forordning (EØF) nr. 3883/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 839/91 της Επιτροπής
    της 4ης Απριλίου 1991 για τον καθορισμό των ποσοτήτων
    των νεαρών βοοειδών που είναι δυνατό να εισαχθούν
    με ειδικούς όρους κατά το πρώτο και δεύτερο
    τρίμηνο του 1991, για παρέκκλιση κατά τα τρίμηνα
    αυτά, από τον κανονισμό (ΕΟΚ) αριθ. 2377/80 και για
    κατάργηση του κανονισμού (ΕΟΚ) αριθ. 3883/90
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 839/91 DELLA COMMISSIONE del 4 aprile 1991 che fissa
    il numero di giovani bovini maschi che possono essere importati a condizioni speciali
    nei primi due trimestri del 1991, recante deroga, per tali trimestri, al regolamento
    (CEE) n. 2377/80, nonché abrogazione del regolamento (CEE) n. 3883/90 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 839/91 VAN DE COMMISSIE van 4 april 1991 tot vaststelling
    van het aantal jonge mannelijke runderen dat in het eerste en tweede kwartaal
    van 1991 onder bijzondere voorwaarden mag worden ingevoerd en houdende afwijking,
    voor die kwartalen, van Verordening (EEG) nr. 2377/80 en tot intrekking van Verordening
    (EEG) nr. 3883/90 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 839/91 DA COMISSÃO de 4 de Abril de 1991 relativo
    à fixação da quantidade de vitelos machos que podem ser importados em condições
    especiais durante os primeiro e segundo trimestre de 1991, que derroga, no que
    diz respeito aos referidos trimestres, o Regulamento (CEE) nº 2377/80 e revoga
    o Regulamento (CEE) nº 3883/90 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 839/91 DE LA COMISIÓN de 4 de abril de 1991 por el
    que se fija la cantidad de machos jóvenes de la especie bovina que podrán importarse
    en condiciones especiales durante el primer y segundo trimestres de 1991, por
    el que se establece una excepción, para esos trimestres, al Reglamento (CEE)
    no 2377/80, y por el que se deroga el Reglamento (CEE) no 3883/90 #'
  type: main
