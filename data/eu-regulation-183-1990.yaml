  content: Commission Regulation (EEC) No 183/90 of 25 January 1990 setting for 1990
    the quantities of cheese originating in and coming from Switzerland that may be
    imported into Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 183/90 de la Commission du 25 janvier 1990 fixant
    les quantités de fromages d'origine et en provenance de Suisse qui peuvent être
    importées en Espagne pour l'année 1990
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 183/90 DER KOMMISSION vom 25. Januar 1990 zur Festsetzung
    der Mengen an Kaese mit Ursprung in und Herkunft aus der Schweiz, die fuer das
    Jahr 1990 nach Spanien eingefuehrt werden koennen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 183/90 af 25. januar 1990 om fastsættelse
    af, hvor store mængder ost med oprindelse i og fra Schweiz, der kan importeres
    til Spanien til 1990
  type: main
- language: el
  script: Grek
