    Ελβετίας που μπορούν να εισαχθούν στην Ισπανία
    κατά το 1990
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 183/90 DELLA COMMISSIONE del 25 gennaio 1990 che fissa
