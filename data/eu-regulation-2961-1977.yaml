    für die Überwachung der Verwendung und/oder Bestimmung von Erzeugnissen aus
    den Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2961/77 af 23. december 1977 om ændring
    af forordning (EØF) nr. 1687/76 om fælles gennemførelsesbestemmelser for kontrol
    med anvendelsen af og/eller bestemmelse for produkter fra intervention
  type: main
- language: el
  script: Grek
