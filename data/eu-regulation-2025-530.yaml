title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/530 of 30 October 2024 amending
    Annexes I and III to Council Regulation (EC) No 2173/2005 following a Voluntary
    Partnership Agreement with the Republic of Ghana for a Forest Law Enforcement,
    Governance and Trade (FLEGT) licensing scheme for imports of timber into the European
    Union
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/530 de la Commission du 30 octobre 2024
    modifiant les annexes I et III du règlement (CE) no 2173/2005 du Conseil à la
    suite d’un accord de partenariat volontaire avec la République du Ghana concernant
    un régime d’autorisation pour l’application des réglementations forestières,
    la gouvernance et les échanges commerciaux (FLEGT) relatif aux importations de
    bois dans l’Union européenne
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/530 der Kommission vom 30. Oktober 2024
    zur Änderung der Anhänge I und III der Verordnung (EG) Nr. 2173/2005 des Rates
    im Anschluss an ein Freiwilliges Partnerschaftsabkommen mit Ghana über ein FLEGT-Genehmigungssystem
    für Holzeinfuhren in die Europäische Union
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2025/530 на Комисията
    от 30 октомври 2024 година за изменение на приложение
    I и приложение III към Регламент (ЕО) № 2173/2005 на
    Съвета след сключването на Споразумение за
    доброволно партньорство с Република Гана за
    Схема на разрешителни за прилагане на законодателството
    в областта на горите, управлението и търговията
    (FLEGT) за вноса на дървесина в Европейския съюз
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2025/530 ze dne 30. října
    2024, kterým se mění přílohy I a III nařízení Rady (ES) č. 2173/2005
    v návaznosti na dobrovolnou dohodu o partnerství s Ghanskou republikou, pokud
    jde o režim licencí v rámci akčního plánu pro prosazování práva, správu
    a obchod v oblasti lesnictví (FLEGT) pro dovoz dřeva do Evropské unie
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2025/530 af 30. oktober 2024 om
    ændring af bilag I og III til Rådets forordning (EF) nr. 2173/2005 som følge
    af en frivillig partnerskabsaftale med Republikken Ghana om en licensordning for
    retshåndhævelse, god forvaltningspraksis og handel på skovbrugsområdet (FLEGT-licensordning)
    for import af træ til Den Europæiske Union
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2025/530
    της Επιτροπής, της 30ής Οκτωβρίου 2024, για την
    τροποποίηση των παραρτημάτων I και ΙΙΙ του
    κανονισμού (ΕΚ) αριθ. 2173/2005 του Συμβουλίου σύμφωνα
    με τη συμφωνία εθελοντικής εταιρικής σχέσης
    με τη Δημοκρατία της Γκάνας σχετικά με σύστημα
    αδειών για την επιβολή της δασικής νομοθεσίας,
    τη διακυβέρνηση και το εμπόριο (FLEGT) όσον αφορά
    τις εισαγωγές ξυλείας στην Ευρωπαϊκή Ένωση
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2025/530, 30. oktoober 2024, millega
    muudetakse nõukogu määruse (EÜ) nr 2173/2005 I ja III lisa tulenevalt vabatahtliku
    partnerluslepingu sõlmimisest Ghana Vabariigiga metsaõigusnormide täitmise
    järelevalve, metsahalduse ja puidukaubanduse (FLEGT) litsentsimissüsteemi rakendamiseks
    puidu impordi suhtes Euroopa Liitu
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2025/530, annettu 30 päivänä lokakuuta
    2024, neuvoston asetuksen (EY) N:o 2173/2005 liitteiden I ja III muuttamisesta
    metsälainsäädännön soveltamisen valvontaa, metsähallintoa ja Euroopan unioniin
    suuntautuvaa puutuotteiden kauppaa koskevasta FLEGT-lupajärjestelmästä Ghanan
    tasavallan kanssa tehdyn vapaaehtoisen kumppanuussopimuksen johdosta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2025/530 ón gCoimisiún an 30 Deireadh Fómhair
    2024 lena leasaítear Iarscríbhinní I agus III a ghabhann le Rialachán (CE)
    Uimh. 2173/2005 ón gComhairle mar thoradh ar Chomhaontú Comhpháirtíochta Deonaí
    le Poblacht Ghána le haghaidh scéim ceadúnúcháin i ndáil le Forfheidhmiú
    an Dlí, Rialachas agus Trádáil i dtaca le Foraoisí (FLEGT) le haghaidh allmhairí
    adhmaid isteach san Aontas Eorpach
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/530 оd 30. listopada 2024. o izmjeni
    priloga I. i III. Uredbi Vijeća (EZ) br. 2173/2005 na temelju Dobrovoljnog sporazuma
    o partnerstvu s Republikom Ganom o sustavu izdavanja dozvola za provedbu zakona,
    upravljanje i trgovinu u području šuma (FLEGT) za uvoz drvne sirovine u Europsku
    uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/530 felhatalmazáson alapuló rendelete (2024. október
    30.) a 2173/2005/EK tanácsi rendelet I. és III. mellékletének az Európai
    Unióba irányuló faanyag-behozatal FLEGT (erdészeti jogszabályok végrehajtása,
    erdészeti irányítás és erdészeti termékek kereskedelme) engedélyezési
    rendszere tárgyában a Ghánai Köztársasággal létrejött önkéntes partnerségi
    megállapodás nyomán történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/530 della Commissione, del 30 ottobre 2024,
    che modifica gli allegati I e III del regolamento (CE) n. 2173/2005 del Consiglio
    a seguito di un accordo volontario di partenariato con la Repubblica del Ghana
    relativo a un sistema di licenze per l’applicazione delle normative, la governance
    e il commercio nel settore forestale (FLEGT) per le importazioni di legname nell’Unione
    europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2025/530 (2024. gada 30. oktobris), ar
    ko groza I un III pielikumu Padomes Regulai (EK) Nr. 2173/2005, pamatojoties uz
    brīvprātīgo partnerattiecību nolīgumu ar Ganas Republiku par meža tiesību
    aktu ieviešanas, pārvaldības un tirdzniecības (FLEGT) licencēšanas sistēmas
    izveidi kokmateriālu importam Eiropas Savienībā
  type: main
- language: lt
  script: Latn
  content: 2024 m. spalio 30 d. Komisijos deleguotasis reglamentas (ES) 2025/530,
    kuriuo, su Gana sudarius savanoriškos partnerystės susitarimą dėl miškų
    teisės aktų vykdymo, miškų valdymo ir prekybos mediena (FLEGT) licencijavimo
    schemos, taikomos į Europos Sąjungą importuojamai medienai, iš dalies keičiami
    Tarybos reglamento (EB) Nr. 2173/2005 I ir III priedai
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2025/530 tat-30 ta’ Ottubru 2024
    li jemenda l-Annessi I u III tar-Regolament tal-Kunsill (KE) Nru 2173/2005 wara
    Ftehim ta’ Sħubija Volontarju mar-Repubblika tal-Ghana skema għal ta’ liċenzjar
    għall-Infurzar tal-Liġi, Tmexxija u Kummerċ fis-Settur tal-Forestrija (FLEGT)
    għall-importazzjonijiet ta’ injam lejn l-Unjoni Ewropea
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2025/530 van de Commissie van 30 oktober
    2024 tot wijziging van de bijlagen I en III bij Verordening (EG) nr. 2173/2005
    van de Raad naar aanleiding van een vrijwillige partnerschapsovereenkomst met
    de Republiek Ghana inzake een vergunningensysteem voor wetshandhaving, governance
    en handel in de bosbouw (Flegt) met betrekking tot de invoer van hout in de Europese
    Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2025/530 z dnia 30 października
    2024 r. zmieniające załączniki I i III do rozporządzenia Rady (WE) nr 2173/2005
    w następstwie zawarcia umowy o dobrowolnym partnerstwie z Republiką Ghany dotyczącej
    systemu zezwoleń w zakresie egzekwowania prawa, zarządzania i handlu w dziedzinie
    leśnictwa (FLEGT) w odniesieniu do przywozu drewna do Unii Europejskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2025/530 da Comissão, de 30 de outubro de 2024,
    que altera os anexos I e III do Regulamento (CE) n.o 2173/2005 do Conselho, na
    sequência de um acordo de parceria voluntário com a República do Gana relativo
    a um regime de licenciamento para a aplicação da legislação, a governação
    e o comércio no setor florestal (FLEGT) para a importação de madeira para a
    União Europeia
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2025/530 al Comisiei din 30 octombrie 2024 de
    modificare a anexelor I și III la Regulamentul (CE) nr. 2173/2005 al Consiliului
    în urma unui acord de parteneriat voluntar cu Republica Ghana privind un regim
    de licențe pentru aplicarea reglementărilor forestiere, guvernare și schimburi
    comerciale (FLEGT) pentru importurile de lemn în Uniunea Europeană
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2025/530 z 30. októbra 2024, ktorým
    sa menia prílohy I a III k nariadeniu Rady (ES) č. 2173/2005 na základe dohody
    o dobrovoľnom partnerstve s Ghanskou republikou v súvislosti s licenčným systémom
    pre vynútiteľnosť práva, správu a obchod v lesnom hospodárstve (FLEGT) na
    dovoz dreva do Európskej únie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/530 z dne 30. oktobra 2024 o spremembi
    prilog I in III k Uredbi Sveta (ES) št. 2173/2005 na podlagi Sporazuma o prostovoljnem
    partnerstvu z Republiko Gano o shemi izdajanja dovoljenj za izvrševanje zakonodaje,
    upravljanje in trgovanje na področju gozdov (FLEGT) pri uvozu lesnih proizvodov
    v Evropsko unijo
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2025/530 de la Comisión, de 30 de octubre de
    2024, por el que se modifican los anexos I y III del Reglamento (CE) n.o 2173/2005
    del Consejo tras un Acuerdo de Asociación Voluntaria con Ghana relativo a un
    sistema de licencias de aplicación de las leyes, la gobernanza y el comercio
    forestales (FLEGT) aplicable a las importaciones de madera en la Unión Europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2025/530 av den 30 oktober 2024
    om ändring av bilagorna I och III till rådets förordning (EG) nr 2173/2005
    till följd av ett frivilligt partnerskapsavtal med Republiken Ghana om ett licenssystem
    för skogslagstiftningens efterlevnad samt förvaltning av och handel med skog
    (Flegt) för import av timmer till Europeiska unionen
