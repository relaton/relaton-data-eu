title:
- language: en
  script: Latn
  content: '87/200/EEC: Commission Decision of 10 March 1987 amending Decision 84/248/EEC
    authorizing the Federal Republic of Germany to adopt, when introducing into its
    territory plants or plant products, special plant health provisions laid down
    for home-grown production of certain fruit plants intended for planting (Only
    the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/200/CEE: Décision de la Commission du 10 mars 1987 modifiant la décision
    84/248/CEE autorisant la République fédérale d''Allemagne à arrêter, lors
    de l''introduction sur son territoire de végétaux ou de produits végétaux,
    des dispositions sanitaires fixées pour la production indigène de certains végétaux
    d''espèces fruitières destinés à être plantés (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '87/200/EWG: Entscheidung der Kommission vom 10. März 1987 zur Änderung
    der Entscheidung 84/248/EWG zur Ermächtigung der Bundesrepublik Deutschland,
    beim Verbringen von Pflanzen oder Pflanzenerzeugnissen in ihr Gebiet besondere
    Pflanzenschutzmaßnahmen zu treffen, die für die einheimische Erzeugung von einigen
    zum Anpflanzen bestimmten Obstpflanzen vorgesehen sind (Nur der deutsche Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/200/EØF: Kommissionens beslutning af 10. marts 1987 om ændring af
    beslutning 84/248/EØF om bemyndigelse af Forbundsrepublikken Tyskland til for
    planter og planteprodukter, der indføres på dens område, at anvende de særlige
    plantesundhedsbestemmelser, som er gældende for den indenlandske produktion af
    visse frugtbærende planter bestemt til udplantning (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/200/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Μαρτίου 1987 που τροποποιεί την απόφαση 84/248/ΕΟΚ
    με την οποία εξουσιοδοτείται η Ομοσπονδιακή
    Δημοκρατία της Γερμανίας να θεσπίσει, κατά
    την εισαγωγή στο έδαφός της φυτών και φυτικών
    προϊόντων, φυτοϋγειονομικά μέτρα που έχουν
    θεσπισθεί για την εγχώρια παραγωγή ορισμένων
    οπωροφόρων που προορίζονται για φύτευση (Το
    κείμενο στην γερμανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/200/CEE: Decisione della Commissione del 10 marzo 1987 recante modifica
    della decisione 84/248/CEE che autorizza la Repubblica federale di Germania ad
    adottare, all''atto dell''introduzione nel suo territorio di vegetali o prodotti
    vegetali, disposizioni fitosanitarie particolari previste per la produzione locale
    di determinati vegetali da frutto destinati alla piantagione (Il testo in lingua
    tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/200/EEG: Beschikking van de Commissie van 10 maart 1987 houdende wijziging
    van Beschikking 84/248/EEG tot machtiging van de Bondsrepubliek Duitsland om bij
    het binnenbrengen van planten of plantaardige produkten op haar grondgebied de
    bijzondere fytosanitaire maatregelen toe te passen die voor de binnenlandse produktie
    van plantgoed van bepaalde, voor opplant bestemde fruitgewassen gelden (Slechts
    de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/200/CEE: Decisão da Comissão de 10 de Março de 1987 que altera a
    Decisão 84/248/CEE que autoriza a República Federal da Alemanha a tomar, aquando
    da introdução no seu território de plantas e produtos vegetais, medidas fitossanitárias
    especiais fixadas para a produção interna de determinadas plantas de espécies
    frutíferas para plantação (Apenas faz fé o texto em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '87/200/CEE: Decisión de la Comisión de 10 de marzo de 1987 por la que
    se modifica la Decisión 84/248/CEE por la que se autoriza a la República Federal
    de Alemania para adoptar, con ocasión de la introducción en su territorio de
    vegetales o productos vegetales, disposiciones fitosanitarias especiales previstas
    para la producción autóctona de determinados árboles frutales destinados a
    ser plantados (El texto en lengua alemana es el único auténtico)'
