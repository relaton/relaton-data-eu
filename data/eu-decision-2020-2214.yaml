    concerne la mention relative au Royaume-Uni dans la liste des pays tiers ou parties
    de pays tiers en provenance desquels les importations dans l’Union de sperme
    d’animaux domestiques de l’espèce porcine sont autorisées [notifiée sous
    le numéro C(2020) 9551]
  type: main
