  script: Latn
  content: Commission Implementing Decision (EU) 2020/2214 of 22 December 2020 amending
    Annex I to Implementing Decision 2012/137/EU as regards the entry for the United
    Kingdom in the list of third countries or parts thereof authorised for the import
    into the Union of semen of domestic animals of the porcine speciesd (notified
    under document C(2020) 9551)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/2214 de la Commission du 22 décembre
