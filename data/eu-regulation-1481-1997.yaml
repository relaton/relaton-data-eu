title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1481/97 of 28 July 1997 derogating for the
    1996/97 marketing year from some provisions of Regulation (EEC) No 3105/88 laying
    down detailed rules for the application of compulsory distillation as provided
    for in Articles 35 and 36 of Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1481/97 DE LA COMMISSION du 28 juillet 1997 dérogeant,
    pour la campagne 1996/1997, à certaines dispositions du règlement (CEE) n°
    3105/88 établissant les modalités d'application des distillations obligatoires
    visées aux articles 35 et 36 du règlement (CEE) n° 822/87
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1481/97 DER KOMMISSION vom 28. Juli 1997 zur Abweichung
    von der Verordnung (EWG) Nr. 3105/88 mit Durchführungsbestimmungen für die obligatorischen
    Destillationen gemäß den Artikeln 35 und 36 der Verordnung (EWG) Nr. 822/87
    für das Wirtschaftsjahr 1996/97
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1481/97 af 28. juli 1997 om undtagelse,
    for produktionsåret 1996/97, fra visse bestemmelser i forordning (EØF) nr. 3105/88
    om gennemførelsesbestemmelser for obligatorisk destillation som omhandlet i artikel
    35 og 36 i forordning (EØF) nr. 822/87
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1481/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 28ης Ιουλίου 1997 για την παρέκκλιση, σχετικά
    με την περίοδο εμπορίας 1996/97, από ορισμένες
    διατάξεις του κανονισμού (ΕΟΚ) αριθ. 3105/88 για
    τον καθορισμό των λεπτομερειών εφαρμογής των
    υποχρεωτικών αποστάξεων που αναφέρονται στα
    άρθρα 35 και 36 του κανονισμού (ΕΟΚ) αριθ. 822/87
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1481/97, annettu 28 päivänä heinäkuuta 1997,
    asetuksen (ETY) N:o 822/87 35 ja 36 artiklassa tarkoitettujen pakollisten tislausten
    soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 3015/88 tietyistä säännöksistä poikkeamisesta markkinointivuoden 1996/1997
    osalta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1481/97 DELLA COMMISSIONE del 28 luglio 1997 recante
    deroga, per la campagna 1996/1997, a talune disposizioni del regolamento (CEE)
    n. 3105/88 che stabilisce le modalità d'applicazione delle distillazioni obbligatorie
    di cui agli articoli 35 e 36 del regolamento (CEE) n. 822/87
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1481/97 VAN DE COMMISSIE van 28 juli 1997 houdende
    afwijking, voor het wijnoogstjaar 1996/1997, van sommige bepalingen van Verordening
    (EEG) nr. 3105/88 tot vaststelling van de uitvoeringsbepalingen betreffende de
    verplichte distillatie die als bedoeld in de artikelen 35 en 36 van Verordening
    (EEG) nr. 822/87
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1481/97 DA COMISSÃO de 28 de Julho de 1997 que derroga,
    relativamente à campanha de 1996/1997, determinadas disposições do Regulamento
    (CEE) nº 3105/88 que estabelece as regras de execução das destilações obrigatórias
    referidas nos artigos 35º e 36º do Regulamento (CEE) nº 822/87
  type: main
