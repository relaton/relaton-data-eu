  script: Latn
  content: '92/435/EEC: Commission Decision of 29 July 1992 granting the first Community
    contribution to the autonomous regions of Azores and Madeira provided for in the
    Council Decision on Poseima to compensate for the extra costs of supplying oil
    to these archipelagos in 1991 (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
