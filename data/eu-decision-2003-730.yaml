title:
- language: en
  script: Latn
  content: '2003/730/EC: Commission Decision of 13 December 2000 on State aid which
    the Netherlands is planning to implement in the form of development assistance
    for two general cargo vessels and two pulp and paper carriers to be built by Bodewes/Pattje
    for use in Indonesia (Text with EEA relevance) (notified under document number
    C(2000) 4185)'
  type: main
- language: fr
  script: Latn
  content: '2003/730/CE: Décision de la Commission du 13 décembre 2000 concernant
    l''aide d''État que les Pays-Bas envisagent d''accorder sous la forme d''aide
    au développement pour la construction par Bodewes/Pattje de deux cargos classiques
    et de deux navires destinés au transport de pâte à papier et de papier qui
    seront utilisés en Indonésie (Texte présentant de l''intérêt pour l''EEE)
    [notifiée sous le numéro C(2000) 4185]'
  type: main
