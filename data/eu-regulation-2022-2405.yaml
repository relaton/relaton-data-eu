title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2405 of 7 December 2022 correcting
    Implementing Regulation (EU) 2021/1044 as regards the period of validity of the
    Union authorisation for the single biocidal product ‘Pesguard® Gel’
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2405 de la Commission du 7 décembre
    2022 rectifiant le règlement d’exécution (UE) 2021/1044 en ce qui concerne
    la durée de validité de l’autorisation de l’Union pour le produit biocide
    unique «Pesguard® Gel»
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/2405 der Kommission vom 7. Dezember
    2022 zur Berichtigung der Durchführungsverordnung (EU) 2021/1044 in Bezug auf
    die Geltungsdauer der Unionszulassung für das Biozidprodukt „Pesguard® Gel“
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/2405 на Комисията
    от 7 декември 2022 година за поправка на Регламент
    за изпълнение (ЕС) 2021/1044 по отношение на срока
    на валидност на разрешението на Съюза за единичния
    биоцид „Pesguard ® Gel“
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/2405 ze dne 7. prosince 2022,
    kterým se opravuje prováděcí nařízení (EU) 2021/1044, pokud jde o dobu
    platnosti povolení Unie pro jednotlivý biocidní přípravek „Pesguard® Gel“
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/2405 af 7. december 2022
    om berigtigelse af gennemførelsesforordning (EU) 2021/1044 for så vidt angår
    gyldighedsperioden for EU-godkendelsen af det enkelte biocidholdige produkt »Pesguard®
    Gel«
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/2405 της Επιτροπής
    της 7ης Δεκεμβρίου 2022 για τη διόρθωση του εκτελεστικού
    κανονισμού (ΕΕ) 2021/1044 όσον αφορά την περίοδο
    ισχύος της άδειας της Ένωσης για το μοναδικό
    βιοκτόνο «Pesguard® Gel»
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/2405, 7. detsember 2022, millega parandatakse
    rakendusmäärust (EL) 2021/1044 üksikule biotsiidile „Pesguard® Gel“ antud
    liidu loa kehtivusaja osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/2405, annettu 7 päivänä
    joulukuuta 2022, täytäntöönpanoasetuksen (EU) 2021/1044 oikaisemisesta yksittäistä
    biosidivalmistetta ”Pesguard® Gel” koskevan unionin luvan voimassaoloajan
    osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/2405 ón gCoimisiún an 7 Nollaig
    2022 lena gceartaítear Rialachán Cur Chun Feidhme (AE) 2021/1044 a mhéid a
    bhaineann le tréimhse bhailíochta an údaraithe Aontais le haghaidh an táirge
    bhithicídigh aonair “Pesguard® Gel”
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/2405 оd 7. prosinca 2022. o ispravku
    Provedbene uredbe (EU) 2021/1044 u pogledu razdoblja valjanosti odobrenja Unije
    za pojedinačni biocidni proizvod „Pesguard® Gel”
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2405 végrehajtási rendelete (2022. december 7.)
    az (EU) 2021/1044 végrehajtási rendeletnek a „Pesguard® Gel” egyedi biocid
    termékre vonatkozó uniós engedély érvényességi időtartama tekintetében
    történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/2405 della Commissione del 7 dicembre
    2022 che rettifica il regolamento di esecuzione (UE) 2021/1044 per quanto riguarda
    il periodo di validità dell’autorizzazione dell’Unione per il biocida singolo
    «Pesguard® Gel»
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/2405 (2022. gada 7. decembris),
    ar ko attiecībā uz atsevišķam biocīdam “Pesguard® Gel” piešķirtās
    Savienības atļaujas derīguma periodu labo Īstenošanas regulu (ES) 2021/1044
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/2405 2022 m. gruodžio 7
    d. kuriuo dėl nekeičiamos sudėties biocidinio produkto „Pesguard® Gel“
    Sąjungos autorizacijos liudijimo galiojimo laikotarpio ištaisomas Įgyvendinimo
    reglamentas (ES) 2021/1044
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2405 tas-7
    ta’ Diċembru 2022 li jikkoreġi r-Regolament ta’ Implimentazzjoni (UE) 2021/1044
    fir-rigward tal-perjodu ta’ validità tal-awtorizzazzjoni tal-Unjoni għall-prodott
    bijoċidali uniku “Pesguard® Gel”
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/2405 van de Commissie van 7 december 2022
    tot rectificatie van Uitvoeringsverordening (EU) 2021/1044 wat betreft de geldigheidsduur
    van de toelating van de Unie voor het uniek biocide “Pesguard® Gel”
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/2405 z dnia 7 grudnia 2022
    r. w sprawie sprostowania rozporządzenia wykonawczego (UE) 2021/1044 w odniesieniu
    do okresu ważności pozwolenia unijnego na pojedynczy produkt biobójczy „Pesguard®
    Gel”
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/2405 da Comissão de 7 de dezembro
    de 2022 que retifica o Regulamento de Execução (UE) 2021/1044 no que se refere
    ao prazo de validade da autorização da União para o produto biocida único
    «Pesguard® Gel»
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/2405 al Comisiei din 7 decembrie
    2022 de rectificare a Regulamentului de punere în aplicare (UE) 2021/1044 în
    ceea ce privește perioada de valabilitate a autorizației Uniunii pentru produsul
    biocid unic „Pesguard® Gel”
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/2405 zo 7. decembra 2022, ktorým
    sa opravuje vykonávacie nariadenie (EÚ) 2021/1044, pokiaľ ide o obdobie platnosti
    autorizácie Únie pre samostatný biocídny výrobok „Pesguard® Gel“
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/2405 z dne 7. decembra 2022 o popravku
    Izvedbene uredbe (EU) 2021/1044 glede obdobja veljavnosti dovoljenja Unije za
    posamezen biocidni proizvod „Pesguard® Gel“
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/2405 de la Comisión de 7 de diciembre
    de 2022 por el que se corrige el Reglamento de Ejecución (UE) 2021/1044 en lo
    que respecta al período de validez de la autorización de la Unión para el biocida
    único «Pesguard® Gel»
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/2405 av den 7 december
    2022 om rättelse av genomförandeförordning (EU) 2021/1044 vad gäller giltighetsperioden
    för unionsgodkännandet för den enstaka biocidprodukten Pesguard® Gel
