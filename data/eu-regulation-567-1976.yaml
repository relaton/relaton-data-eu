    regler for destillering af bordvin, for hvilken destilleringskontrakten skal godkendes
    inden den 15. april 1976
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 567/76 del Consiglio, del 15 marzo 1976, che stabilisce
    le norme generali relative ad operazioni di distillazione dei vini da pasto il
    cui contratto di distillazione deve essere approvato entro il 15 aprile 1976
  type: main
- language: nl
  script: Latn
