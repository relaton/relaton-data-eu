  content: Council Regulation (EEC) No 567/76 of 15 March 1976 laying down general
    rules governing the distillation of table wines for which the distillation contract
    must be approved before 15 April 1976
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 567/76 du Conseil, du 15 mars 1976, établissant les
    règles générales relatives à des opérations de distillation des vins de table
    dont le contrat de distillation doit être agréé avant le 15 avril 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 567/76 des Rates vom 15. März 1976 über allgemeine
    Regeln für die Destillation von Tafelwein, für den der Destillationsvertrag
    vor dem 15. April 1976 genehmigt werden muß
  type: main
- language: da
  script: Latn
