    pokud jde o okolnosti a podmínky, za nichž lze úplně nebo částečně odložit
    úhradu mimořádných následných příspěvků, o kritéria pro určení činností,
    služeb a operací v souvislosti se zásadními funkcemi a o kritéria pro určení
    oborů podnikání a souvisejících služeb v souvislosti s hlavními liniemi
    podnikání
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2016/778 af 2. februar 2016 om
