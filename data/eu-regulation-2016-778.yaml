title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2016/778 of 2 February 2016 supplementing
    Directive 2014/59/EU of the European Parliament and of the Council with regard
    to the circumstances and conditions under which the payment of extraordinary ex
    post contributions may be partially or entirely deferred, and on the criteria
    for the determination of the activities, services and operations with regard to
    critical functions, and for the determination of the business lines and associated
    services with regard to core business lines
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2016/778 de la Commission du 2 février 2016
    complétant la directive 2014/59/UE du Parlement européen et du Conseil en ce
    qui concerne les circonstances et les conditions dans lesquelles le paiement de
    contributions ex post extraordinaires peut être partiellement ou totalement reporté,
    et en ce qui concerne les critères de détermination des activités, services
    et opérations constitutifs de fonctions critiques et les critères de détermination
    des activités et services associés constitutifs d'activités fondamentales
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2016/778 der Kommission vom 2. Februar 2016
    zur Ergänzung der Richtlinie 2014/59/EU des Europäischen Parlaments und des
    Rates in Bezug auf die Umstände und Bedingungen, unter denen die Entrichtung
    von außerordentlichen nachträglich erhobenen Beiträgen teilweise oder vollständig
    aufgeschoben werden kann, und auf die Kriterien für die Bestimmung der Tätigkeiten,
    Dienstleistungen und Geschäfte im Zusammenhang mit „kritischen Funktionen“
    und zur Präzisierung der Kriterien für die Bestimmung der Geschäftsbereiche
    und damit verbundenen Dienste im Zusammenhang mit den Kerngeschäftsbereichen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2016/778 на Комисията
    от 2 февруари 2016 година за допълване на Директива
    2014/59/ЕС на Европейския парламент и на Съвета
    по отношение на обстоятелствата и условията,
    при които плащането на извънредните последващи
    вноски може да бъде частично или напълно отложено,
    както и по отношение на критериите за определяне
    на дейностите, услугите и операциите — във
    връзка с критичните функции, и за определяне
    на стопанските дейности и свързаните с тях
    услуги — във връзка с основните стопански
    дейности
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2016/778 ze dne 2. února
