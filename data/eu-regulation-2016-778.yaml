    så vidt angår de forhold og betingelser, under hvilke betalingen af ekstraordinære
    ex post-bidrag helt eller delvis kan udskydes, og kriterierne for fastsættelse
    af aktiviteter, ydelser og transaktioner med hensyn til kritiske funktioner og
