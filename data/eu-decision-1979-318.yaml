title:
- language: en
  script: Latn
  content: '79/318/EEC: Commission Decision of 12 March 1979 authorizing the French
    Republic not to apply Community treatment to television receivers, falling within
    subheading 85.15 A ex III of the Common Customs Tariff, originating in Hungary
    and in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/318/CEE: Décision de la Commission, du 12 mars 1979, autorisant la
    République française à exclure du traitement communautaire les appareils récepteurs
    de télévision, de la sous-position 85.15 A ex III du tarif douanier commun,
    originaires de Hongrie et mis en libre pratique dans les autres Etats membres
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/318/EWG: Entscheidung der Kommission vom 12. März 1979, mit der die
    Französische Republik ermächtigt wird, aus Ungarn stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Fernsehempfangsgeräte der Tarifstelle
    85.15 A ex III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/318/EØF: Kommissionens beslutning af 12. marts 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage sendere til
    fjernsynsmodtagere, som henhører under pos. 85.15 A ex III i den fælles toldtarif,
    har oprindelse i Ungarn og frit kan omsættes i de øvrige medlemsstater (Kun
    den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/318/CEE: Decisione della Commissione, del 12 marzo 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    riceventi per la televisione della sottovoce 85.15 A ex III della tariffa doganale
    comune, originari dell''Ungheria e messi in libera pratica negli altri Stati membri
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/318/EEG: Beschikking van de Commissie van 12 maart 1979 waarbij de
    Franse Republiek wordt gemachtigd ontvangtoestellen voor televisie van post 85.15
    A ex III van het gemeenschappelijk douanetarief, van oorsprong uit Hongarije en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
