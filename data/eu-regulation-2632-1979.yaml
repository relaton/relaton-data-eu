  content: Council Regulation (EEC) No 2632/79 of 20 November 1979 opening, allocating
    and providing for the administration of a Community tariff quota for newsprint
    falling within subheading 48.01 A of the Common Customs Tariff (1980) and extending
    this quota to include certain other types of paper
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2632/79 du Conseil, du 20 novembre 1979, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de papier
    journal, de la sous-position 48.01 A du tarif douanier commun (année 1980), et
    étendant le bénéfice de ce même contingent à certains autres papiers
  type: main
