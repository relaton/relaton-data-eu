    2 nariadenia Rady (ES) č. 1225/2009 ukladá konečné antidumpingové clo na
    dovoz určitých zváraných rúr a rúrok zo železa alebo nelegovanej ocele
    s pôvodom v Bielorusku, Čínskej ľudovej republike a Rusku a ktorým sa ukončujú
