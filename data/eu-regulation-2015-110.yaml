title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/110 of 26 January 2015 imposing
    a definitive anti-dumping duty on imports of certain welded tubes and pipes of
    iron or non-alloy steel originating in Belarus, the People's Republic of China
    and Russia and terminating the proceeding for imports of certain welded tubes
    and pipes of iron or non-alloy steel originating in Ukraine following an expiry
    review pursuant to Article 11(2) of Council Regulation (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/110 de la Commission du 26 janvier 2015
    instituant un droit antidumping définitif sur les importations de certains tubes
    et tuyaux soudés, en fer ou en acier non allié, originaires de Biélorussie,
    de la République populaire de Chine et de Russie et clôturant la procédure
    en ce qui concerne les importations de certains tubes et tuyaux soudés, en fer
    ou en acier non allié, originaires d'Ukraine à l'issue d'un réexamen au titre
    de l'expiration des mesures mené conformément à l'article 11, paragraphe 2,
    du règlement (CE) n ° 1225/2009 du Conseil
  type: main
- language: de
  script: Latn
