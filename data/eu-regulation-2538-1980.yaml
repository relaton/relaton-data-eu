- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2538/80 of 1 October 1980 amending for the
    second time Regulation (EEC) No 1058/77 on the characteristics of olive oil and
    of certain products containing olive oil and amending the Common Customs Tariff
    nomenclature as regards olive oil
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2538/80 de la Commission, du 1er octobre 1980, portant
    deuxième modification du règlement (CEE) n° 1058/77 relatif aux caractéristiques
    des huiles d' olive et de certains produits contenant de l' huile d' olive et
    modifiant la nomenclature du tarif douanier commun en ce qui concerne l' huile
    d' olive
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2538/80 der Kommission vom 1. Oktober 1980 zur zweiten
    Änderung der Verordnung (EWG) Nr. 1058/77 über Merkmale von Olivenöl und einigen
    Olivenöl enthaltenden Erzeugnissen sowie zur Änderung des Schemas des Gemeinsamen
    Zolltarifs in bezug auf Olivenöl
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2538/80 af 1. oktober 1980 om anden
    ændring af forordning (EØF) nr. 1058/77 om særlige kendetegn for olivenolier
    og visse varer, der indeholder olivenolie, og om ændring af nomenklaturen i den
    fælles toldtarif for så vidt angår olivenolie
  type: main
- language: el
  script: Grek
