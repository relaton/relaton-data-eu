title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 196/91 of 21 January 1991 amending, in respect
    of products which are subject to national quantitative restrictions, Annex I to
    Regulation (EEC) No 288/82 on common rules for imports
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 196/91 DU CONSEIL du 21 janvier 1991 modifiant, en
    ce qui concerne les produits soumis à des restrictions quantitatives nationales,
    l'' annexe I du règlement (CEE) no 288/82 relatif au régime commun applicable
    aux importations #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 196/91 DES RATES vom 21. Januar 1991 zur Änderung
    des Anhangs I der Verordnung (EWG) Nr. 288/82 betreffend die gemeinsame Einfuhrregelung
    hinsichtlich der Waren, die auf einzelstaatlicher Ebene mengenmäßigen Beschränkungen
    unterliegen #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 196/91 af 21. januar 1991 om ændring af
    bilag I til forordning (EØF) nr. 288/82 om den fælles importordning, for så
    vidt angår varer, der er omfattet af nationale kvantitative restriktioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 196/91 του Συμβουλίου
    της 21ης Ιανουαρίου 1991 για την τροποποίηση,
    όσον αφορά τα προϊόντα που υπόκεινται σε εθνικούς
    ποσοτικούς περιορισμούς, του παραρτήματος
    Ι του κανονισμού (ΕΟΚ) αριθ. 288/82 σχετικά με το
    κοινό καθεστώς εισαγωγών
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 196/91 DEL CONSIGLIO del 21 gennaio 1991 che modifica,
    per quanto riguarda i prodotti sottoposti a restrizioni quantitative nazionali,
    l'' allegato I del regolamento (CEE) n. 288/82 relativo al regime comune applicabile
    alle importazioni #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 196/91 VAN DE RAAD van 21 januari 1991 houdende
    wijziging, wat betreft de produkten waarvoor nationale kwantitatieve beperkingen
    gelden, van bijlage I van Verordening (EEG) nr. 288/82 inzake de gemeenschappelijke
    regeling voor de invoer #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) N°.196/91 DO CONSELHO de 21 de Janeiro de 1991 que
    altera, no que se refere a produtos sujeitos a restrições quantitativas nacionais,
    o anexo I do Regulamento (CEE) n°.288/82, relativo ao regime comum aplicável
    às importações #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 196/91 DEL CONSEJO de 21 de enero de 1991 por el que
    se modifica el Anexo I del Reglamento (CEE) no 288/82 relativo al régimen común
    aplicable a las importaciones, en lo que se refiere a los productos sujetos a
    restricciones cuantitativas nacionales #'
