title:
- language: fr
  script: Latn
  content: Règlement n 92/66/CEE de la Commission, du 8 juillet 1966, fixant des
    coefficients forfaitaires applicables aux découpes de porcs abattus et aux préparations
    et conserves à base de viande de porc, pour le calcul des restitutions à l'exportation
    vers les pays tiers pour la période du 1er juillet 1964 au 30 juin 1965
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 92/66/EWG der Kommission vom 8. Juli 1966 über die Festsetzung
    von Pauschalkoeffizienten für Teilstücke geschlachteter Schweine sowie für
    Schweinefleisch enthaltende Zubereitungen und Konserven zur Berechnung der Erstattungen
    bei der in der Zeit vom 1. Juli 1964 bis zum 30. Juni 1965 getätigten Ausfuhr
    nach Drittländern
  type: main
- language: it
  script: Latn
  content: Regolamento n. 92/66/CEE della Commissione, dell'8 luglio 1966, che fissa
    i coefficienti forfettari applicabili ai tagli di suini macellati, nonché alle
    preparazioni e conserve a base di carni suine, per il calcolo delle restituzioni
    all'esportazione verso i paesi terzi per il periodo 1 luglio 1964 - 30 giugno
    1965
  type: main
- language: nl
  script: Latn
  content: Verordening no. 92/66/EEG van de Commissie van 8 juli 1966 houdende vaststelling
    van forfaitaire coëfficiënten voor delen van geslachte varkens alsmede voor
    varkensvlees bevattende hereidingen en conserven ter berekening van de restituties
    bij uitvoer naar derde landen, die plaatsvond gedurende het tijdvak van 1 juli
    1964 tot 30 juni 1965
  type: main
