title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1549/77 of 8 July 1977 re-establishing the
    levying of the customs duties on tubes and pipes and blanks therefor, of copper;
    hollow bars of copper falling within heading No 74.07 originating in Yugoslavia
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1549/77 de la Commission, du 8 juillet 1977, portant
    rétablissement de la perception des droits de douane applicables aux tubes et
    tuyaux (y compris leurs ébauches) et barres creuses, en cuivre, de la position
    tarifaire 74.07, originaires de la Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1549/77 der Kommission vom 8. Juli 1977 zur Wiedereinführung
    des Zollsatzes für Rohre (einschließlich Rohlinge) und Hohlstangen, aus Kupfer,
    der Tarifnummer 74.07, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1549/77 af 8. juli 1977 om genindførelse
    af opkrævning af toldafgifter for rør, røremner og hule stænger, af kobber,
    under position 74.07, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1549/77 della Commissione, dell'8 luglio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai tubi (compresi i loro
    sbozzi) e barre forate, di rame, della voce doganale 74.07, originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1549/77 van de Commissie van 8 juli 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op buizen en
    pijpen (ook indien niet afgewerkt) en holle staven, van koper, van post 74.07,
    van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr.
    3021/76 van de Raad algemene tariefpreferenties werden geopend
  type: main
