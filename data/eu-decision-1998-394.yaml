  script: Latn
  content: '98/394/EC: Commission Decision of 29 May 1998 amending Decision 97/252/EC
    drawing up provisional lists of third country establishments from which the Member
    States authorise imports of milk and milk products for human consumption (notified
    under document number C(1998) 1412)'
  type: main
- language: fr
  script: Latn
  content: '98/394/CE: Décision de la Commission du 29 mai 1998 modifiant la décision
    97/252/CE établissant les listes provisoires d''établissements de pays tiers
    en provenance desquels les États membres autorisent les importations de lait
    et de produits à base de lait destinés à la consommation humaine [notifiée
    sous le numéro C(1998) 1412]'
  type: main
- language: de
  script: Latn
