    auf Milchbasis zulassen (Bekanntgegeben unter Aktenzeichen K(1998) 1412)'
  type: main
- language: da
  script: Latn
  content: '98/394/EF: Kommissionens beslutning af 29. maj 1998 om ændring af beslutning
