    την κατάρτιση προσωρινών καταλόγων επιχειρήσεων
    τρίτων χωρών από τις οποίες τα κράτη μέλη επιτρέπουν
    τις εισαγωγές γάλακτος και προϊόντων με βάση
    το γάλα που προορίζονται για κατανάλωση από
    τον άνθρωπο [κοινοποιηθείσα υπό τον αριθμό
    Ε(1998) 1412]'
  type: main
- language: fi
  script: Latn
