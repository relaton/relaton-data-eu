    u tubi tal-ħadid jew non-alloy steel li joriġinaw mill-Ungerija, il-Polonja,
    ir-Russja, ir-Repubblika Ċeka, ir-Rumanija u r-Repubblika Slovakka, li jħassar
    Regolament (KEE) Nru 1189/93 u li jtemm il-proċeduri dwar dawn l-importazzjonijiet
    li joriġinaw fir-Repubblika tal-Kroazja
  type: main
