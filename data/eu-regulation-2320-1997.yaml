    pijpen van ijzer of van niet-gelegeerd staal, van oorsprong uit Hongarije, Polen,
    Rusland, de Tsjechische Republiek, Roemenië en de Slowaakse Republiek, tot intrekking
    van Verordening (EEG) nr. 1189/93 en tot beëindiging van de procedure met betrekking
    tot dergelijke invoer van oorsprong uit de Republiek Kroatië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 2320/97 z dnia 17 listopada 1997 r. nakładające
