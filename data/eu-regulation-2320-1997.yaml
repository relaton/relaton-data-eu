    profilů ze železa nebo nelegované oceli pocházejících z Maďarska, Polska,
    Ruska, České republiky, Rumunska a Slovenské republiky, zrušení nařízení
    (EHS) č. 1189/93 a a o zastavení řízení týkajícího se těchto dovozů
    z Chorvatské republiky
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2320/97 af 17. november 1997 om indførelse
    af endelig antidumpingtold på importen af visse sømløse rør af jern eller
    ulegeret stål med oprindelse i Ungarn, Polen, Rusland, Tjekkiet, Rumænien og
    Slovakiet, om ophævelse af forordning (EØF) nr. 1189/93 og om afslutning af
    proceduren vedrørende import af den pågældende vare med oprindelse i Kroatien
  type: main
