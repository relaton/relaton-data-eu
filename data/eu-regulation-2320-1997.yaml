  script: Latn
  content: Regolamento (CE) n. 2320/97 del Consiglio del 17 novembre 1997 che istituisce
    dazi antidumping definitivi sulle importazioni di alcuni tipi di tubi senza saldatura,
    di ferro o di acciai non legati, originari dell'Ungheria, della Polonia, della
    Russia, della Repubblica ceca, della Romania e della Repubblica slovacca, che
    abroga il regolamento (CEE) n. 1189/93 e chiude il procedimento nei confronti
    di tali importazioni originarie della Repubblica di Croazia
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2320/97 (1997. gada 17. novembris), ar ko ievieš
    galīgos antidempinga maksājumus atsevišķu dzelzs vai neleģētā tērauda
    bezšuvju cauruļvadu un cauruļu importam, kuru izcelsme ir Ungārijā, Polijā,
    Krievijā, Čehijas Republikā, Rumānijā un Slovākijas Republikā, ar ko atceļ
    Regulu (EEK) Nr. 1189/93 un pārtrauc procedūru attiecībā uz tādu importu,
