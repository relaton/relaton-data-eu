title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2320/97 of 17 November 1997 imposing definitive
    anti-dumping duties on imports of certain seamless pipes and tubes of iron or
    non-alloy steel originating in Hungary, Poland, Russia, the Czech Republic, Romania
    and the Slovak Republic, repealing Regulation (EEC) No 1189/93 and terminating
    the proceeding in respect of such imports originating in the Republic of Croatia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2320/97 du Conseil du 17 novembre 1997 instituant des
    droits antidumping définitifs sur les importations de certains tubes et tuyaux
    sans soudure, en fer ou en acier non allié, originaires de Hongrie, de Pologne,
    de Russie, de la République tchèque, de Roumanie et de la République slovaque,
    abrogeant le règlement (CEE) n° 1189/93 et clôturant la procédure concernant
    les importations en provenance de la République de Croatie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2320/97 des Rates vom 17. November 1997 zur Einführung
    endgültiger Antidumpingzölle auf die Einfuhren bestimmter nahtloser Rohre aus
    Eisen oder nichtlegiertem Stahl mit Ursprung in Ungarn, Polen, Rußland, der Tschechischen
    Republik, Rumänien und der Slowakischen Republik, zur Aufhebung der Verordnung
    (EWG) Nr. 1189/93 und zur Einstellung des Verfahrens gegenüber solchen Einfuhren
    mit Ursprung in der Republik Kroatien
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2320/97 ze dne 17. listopadu 1997, o uložení
