    z żelaza lub stali niestopowej pochodzących z Węgier, Polski, Rosji, Republiki
    Czeskiej, Rumunii oraz Republiki Słowackiej, uchylające rozporządzenie (EWG)
    nr 1189/93 oraz kończące postępowanie w odniesieniu do takiego przywozu z Republiki
    Chorwacji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2320/97 do Conselho de 17 de Novembro de 1997 que
    institui direitos anti-dumping definitivos sobre as importações de certos tubos
    sem costura, de ferro ou de aço não ligado, originários da Hungria, da Polónia,
    da Rússia, da República Checa, da Roménia e da República Eslovaca, que revoga
    o Regulamento (CEE) nº 1189/93 e encerra o processo relativamente às mesmas
    importações originárias da República da Croácia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2320/97 zo 17. novembra 1997, ktorým sa zavádzajú
    konečné antidampingové clá na dovoz určitých bezšvových rúr a rúrok
    zo železa alebo nelegovanej ocele s pôvodom v Maďarsku, Poľsku, Českej republike,
    Rumunsku a Slovenskej republike a ktorým sa zrušuje nariadenie (EHS) č. 1189/93
    a zastavuje konanie v súvislosti s týmito dovozmi s pôvodom v Chorvátskej
    republike
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2320/97 z dne 17. novembra o uvedbi dokončnih protidampinških
