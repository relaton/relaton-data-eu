    μέ τήν ονομασία «Spectra Physics — High Performance Liquid Chromatograph,
    model SP 8000» δέν δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '81/721/CEE: Decisione della Commissione, del 21 agosto 1981, che stabilisce
    che l''importazione dell''apparecchio denominato "Spectra Physics High-Performance
    Liquid Chromatograph, model SP 8000" non può avvenire in franchigia dai dazi
    della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '81/721/EEG: Beschikking van de Commissie van 21 augustus 1981 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,Spectra Physics-High Performance
    Liquid Chromatograph, model SP 8000" niet met vrijstelling van de rechten van
    het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
