title:
- language: en
  script: Latn
  content: '81/721/EEC: Commission Decision of 21 August 1981 establishing that the
    apparatus described as ''Spectra Physics-high performance liquid chromatograph,
    model SP 8000'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/721/CEE: Décision de la Commission, du 21 août 1981, constatant que
    l''importation de l''appareil dénommé "Spectra Physics - high performance liquid
    chromatograph, model SP 8000" ne peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/721/EWG: Entscheidung der Kommission vom 21. August 1981, mit der festgestellt
    wird, daß das Gerät ,,Spectra Physics High-Performance Liquid Chromatograph,
    model SP 8000" nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '81/721/EØF: Kommissionens beslutning af 21. august 1981 om fastslåelse
    af, at indførsel af apparatet "Spectra Physics-High Performance Liquid Chromatograph,
    model SP 8000" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '81/721/EOK: Απόφαση τής Επιτροπής τής 21ης Αυγούστου
