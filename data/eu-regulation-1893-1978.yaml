title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1893/78 of 2 August 1978 re-establishing
    the levying of customs duties on wood, planed, tongued, etc., falling within heading
    No 44.13 and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1893/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux bois (y
    compris les lames ou frises pour parquets, non assemblées) rabotés, rainés,
    bouvetés, languetés, feuillures, chanfreines ou similaires, de la position 44.13
    du tarif douanier commun, originaires des pays en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1893/78 der Kommission vom 2. August 1978 zur Wiedereinführung
    des Zollsatzes für Holz, gehobelt, genutet usw. der Tarifnummer 44.13 mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2705/77 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1893/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, etc., under position
    44.13, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1893/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    ecc. della voce doganale 44.13, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1893/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten voor hout, geschaafd, geploegd
    enz., van post 44.13, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 2705/77 van de Raad tariefpreferenties werden geopend
  type: main
