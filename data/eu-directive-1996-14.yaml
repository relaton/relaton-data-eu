title:
- language: en
  script: Latn
  content: Commission Directive 96/14/Euratom, ECSC, EC of 12 March 1996 amending
    certain Annexes to Council Directive 77/93/EEC on protective measures against
    the introduction into the Community of organisms harmful to plants or plant products
    and against their spread within the Community
  type: main
- language: fr
  script: Latn
  content: Directive 96/14/Euratom, CECA, CEE de la Commission, du 12 mars 1996, modifiant
    certaines annexes de la directive 77/93/CEE du Conseil concernant les mesures
    de protection contre l'introduction dans la Communauté d'organismes nuisibles
    aux végétaux ou aux produits végétaux et contre leur propagation dans la Communauté
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/14/Euratom, EGKS, EG der Kommission vom 12. März 1996 zur
    Änderung bestimmter Anhänge der Richtlinie 77/93/EWG des Rates über Maßnahmen
    zum Schutz der Gemeinschaft gegen die Einschleppung und Ausbreitung von Schadorganismen
    der Pflanzen und Pflanzenerzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 96/14/Euratom, EKSF, EF af 12. marts 1996 om ændring
    af visse bilag til Rådets direktiv 77/93/EØF om foranstaltninger mod indslæbning
    i Fællesskabet af skadegørere på planter eller planteprodukter og med deres
    spredning inden for Fællesskabet
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/14/Ευρατόμ, ΕΚΑΧ, ΕΚ της Επιτροπής,
    της 12ης Μαρτίου 1996, για τροποποίηση ορισμένων
    παραρτημάτων της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    περί μέτρων προστασίας κατά της εισαγωγής
    στην Κοινότητα οργανισμών επιβλαβών για τα
    φυτά, ή τα φυτικά προϊόντα και κατά της εξάπλωσής
    τους στο εσωτερικό της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 96/14/EY, annettu 12 päivänä maaliskuuta 1996,
    kasvien tai kasvituotteiden haitallisten organismien yhteisöön kulkeutumisen
    ja yhteisössä leviämisen estämiseen liittyvistä toimenpiteistä annetun neuvoston
    direktiivin 77/93/ETY tiettyjen liitteiden muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 96/14/Euratom, CECA, CE della Commissione, del 12 marzo 1996,
    che modifica alcuni allegati della direttiva 77/93/CEE del Consiglio, concernente
    le misure di protezione contro l'introduzione nella Comunità di organismi nocivi
    ai vegetali o ai prodotti vegetali e contro la loro diffusione nella Comunità
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/14/Euratom/EGKS/EG van de Commissie van 12 maart 1996 tot
    wijziging van bepaalde bijlagen bij Richtlijn 77/93/EEG van de Raad betreffende
    de beschermende maatregelen tegen het binnenbrengen en de verspreiding in de Gemeenschap
    van voor planten en voor plantaardige produkten schadelijke organismen
  type: main
- language: pt
  script: Latn
  content: Directiva 96/14/Euratom, CECA, CE da Comissão, de 12 de Março de 1996,
    que altera determinados anexos da Directiva 77/93/CEE do Conselho relativa a medidas
    de protecção contra a introdução na Comunidade de organismos prejudiciais
    às plantas e produtos vegetais e contra a sua propagação no interior da Comunidade
  type: main
- language: es
  script: Latn
  content: Directiva 96/14/Euratom, CECA, CE de la Comisión, de 12 de marzo de 1996,
    por la que se modifican determinados Anexos de la Directiva 77/93/CEE del Consejo
    relativa a las medidas de protección contra la introducción en la Comunidad
    de organismos nocivos para los vegetales o productos vegetales y contra su propagación
    en el interior de la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 96/14/EG av den 12 mars 1996 om ändring av vissa
    bilagor till rådets direktiv 77/93/EEG om skyddsåtgärder mot att skadegörare
    på växter eller växtprodukter förs in till gemenskapen och mot att de sprids
    inom gemenskapen
