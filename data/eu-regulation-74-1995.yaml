    de viandes bovines détenues par certains organismes d'intervention en vue de
    leur transformation dans la Communauté et abrogeant les règlements (CE) n°
    2784/94 et (CE) n 1323/94
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 74/95 DER KOMMISSION vom 18. Januar 1995 über den
    Verkauf von Rindfleisch, das zur Verarbeitung in der Gemeinschaft bestimmt ist,
    aus Beständen einiger Interventionsstellen nach dem Verfahren der Verordnung
    (EWG) Nr. 2539/84 und zur Aufhebung der Verordnungen (EG) Nr. 2784/94 und (EG)
    Nr. 1323/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 74/95 af 18. januar 1995 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EF)
    nr. 2784/94 og (EF) nr. 1323/94
  type: main
- language: el
  script: Grek
