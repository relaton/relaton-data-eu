  script: Latn
  content: COMMISSION REGULATION (EC) No 74/95 of 18 January 1995 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for processing within the Community and repealing Regulations
    (EC) No 2784/94 and (EC) No 1323/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 74/95 de la Commission du 18 janvier 1995 relatif à
