title:
- language: en
  script: Latn
  content: '83/232/EEC: Commission Decision of 25 April 1983 authorizing the Italian
    Republic to apply intra- Community surveillance to imports of natural honey originating
    in Hungary, which have been put into free circulation in the Community (Only the
    Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/232/CEE: Décision de la Commission du 25 avril 1983 autorisant la
    République italienne à procéder à une surveillance intracommunautaire des
    importations de miel naturel, originaire de Hongrie et mis en libre pratique dans
    la Communauté (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/232/EWG: Entscheidung der Kommission vom 25. April 1983 zur Ermächtigung
    der Italienischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Ungarn stammendem und in der Gemeinschaft im freien Verkehr
    befindlichem natürlichem Honig (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/232/EØF: Kommissionens beslutning af 25. april 1983 om bemyndigelse
    af Den italienske Republik til at indføre tilsyn inden for Fællesskabet med
    indførsel af naturlig honning med oprindelse i Ungarn til fri omsætning i Fællesskabet
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/232/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Απριλίου 1983 περί χορηγήσεως αδείας στην Ιταλική
    Δημοκρατία για την καθιέρωση ενδοκοινοτικής
    επιβλέψεως των εισαγωγών φυσικού μελιού, καταγωγής
    Ουγγαρίας, το οποίο βρίσκεται σε ελεύθερη κυκλοφορία
    στην Κοινότητα (Το κείμενο στην ιταλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/232/CEE: Decisione della Commissione del 25 aprile 1983 che autorizza
    la Repubblica italiana ad istituire una sorveglianza intracomunitaria delle importazioni
    di miele naturale originario dell''Ungheria e messo in libera pratica nella Comunità
    (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/232/EEG: Beschikking van de Commissie van 25 april 1983 houdende machtiging
    van de Italiaanse Republiek tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van natuurhonig van oorsprong uit Hongarije, die in
    de Gemeenschap in het vrije verkeer is gebracht (Slechts de tekst in de Italiaanse
    taal is authentiek)'
