    yksityiskohtaisista säännöistä annetusta asetuksesta (EY) N:o 1445/95 poikkeamisesta
    väliaikaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 742/2000 della Commissione, del 7 aprile 2000, recante
