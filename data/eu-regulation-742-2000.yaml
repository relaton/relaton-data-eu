  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 742/2000 da Comissão, de 7 de Abril de 2000, que
    derroga temporariamente o Regulamento (CE) n.o 1445/95 que estabelece as normas
    de execução do regime dos certificados de importação e de exportação no
    sector da carne de bovino
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 742/2000 de la Comisión, de 7 de abril de 2000, que
