title:
- language: en
  script: Latn
  content: 'Regulation (EEC) No 1600/73 of the Commission of 14 June 1973 re-establishing
    Common Customs Tariff duties on electrical goods of the following description:
    generators, converters (rotary or static), transformers, rectifiers and rectifying
    apparatus, inductors: parts, falling within heading No 85.01 C, originating in
    Yugoslavia, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2762/72 of 19 December 1972 apply'
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CEE) n° 1600/73 de la Commission, du 14 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux machines génératrices, moteurs et convertisseurs rotatifs; transformateurs
    et convertisseurs statiques (redresseurs, etc.); bobines de réactance et selfs:
    parties et pièces détachées, de la sous-position tarifaire 85.01 C, originaires
    de Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2762/72 du Conseil du 19 décembre 1972'
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1600/73 der Kommission vom 14. Juni 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Teile für elektrische Generatoren,
    Motoren und rotierende Umformer; Transformatoren, Drosselspulen und andere Selbstinduktionsspulen;
    Stromrichter (z.B. Gleichrichter), der Tarifstelle 85.01 C, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: 'Kommissionens Forordning (EØF) nr. 1600/73 af 14. juni 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for elektriske generatorer, motorer, omformere
    (roterende eller statiske), transformatorer, ensrettere, ensretterapparater og
    induktionsspoler : dele, underposition 85.01 C som har oprindelse i Jugoslavien,
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2762/72 af 19. december 1972'
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1600/73 della Commissione, del 14 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    macchine generatrici, motori e convertitori rotanti; trasformatori e convertitori
    statici (raddrizzatori, ecc.); bobine di reattanza e bobine di autoinduzione;
    parti e pezzi staccati, della sottovoce doganale n. 85.01 C originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2762/72
    del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1600/73 van de Commissie van 14 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op generatoren, elektromotoren en roterende omvormers, transformatoren
    en statische omvormers (gelijkrichters, enz.); smoorspoelen en zelfinductiespoelen,
    delen en onderdelen, van onderdeling 85.01 C, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december
    1972 algemene tariefpreferenties werden geopend
  type: main
