  script: Latn
  content: Commission Regulation (EC) No 975/2005 of 24 June 2005 determining the
    extent to which applications lodged in June 2005 for import licences under the
    regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 July to 30 September 2005 can be accepted
  type: main
- language: fr
  script: Latn
