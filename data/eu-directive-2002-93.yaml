title:
- language: en
  script: Latn
  content: Council Directive 2002/93/EC of 3 December 2002 amending Directive 77/388/EEC
    to extend the facility allowing Member States to apply reduced rates of VAT to
    certain labour-intensive services
  type: main
- language: fr
  script: Latn
  content: Directive 2002/93/CE du Conseil du 3 décembre 2002 modifiant la directive
    77/388/CEE en vue de proroger la faculté d'autoriser les États membres à appliquer
    des taux réduits de TVA pour certains services à forte intensité de main-d'œuvre
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/93/EG des Rates vom 3. Dezember 2002 zur Änderung der
    Richtlinie 77/388/EWG mit dem Ziel der Verlängerung der Möglichkeit, die Mitgliedstaaten
    zur Anwendung ermäßigter Mehrwertsteuersätze für bestimmte arbeitsintensive
    Dienstleistungen zu ermächtigen
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 2002/93/ES ze dne 3. prosince 2002, kterou se mění směrnice
    77/388/EHS a prodlužuje se možnost členských států uplatňovat snížené
    sazby DPH na určité služby s vysokým podílem lidské práce
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 2002/93/EF af 3. december 2002 om ændring af direktiv
    77/388/EØF med henblik på at forlænge muligheden for at bemyndige medlemsstaterne
    til at anvende en nedsat momssats på visse arbejdskraftintensive tjenesteydelser
  type: main
- language: el
  script: Grek
  content: Οδηγία 2002/93/ΕΚ του Συμβουλίου, της 3ης Δεκεμβρίου
    2002, για την τροποποίηση της οδηγίας 77/388/ΕΟΚ
    με σκοπό να παραταθεί η δυνατότητα να επιτραπεί
    στα κράτη μέλη να εφαρμόζουν μειωμένους συντελεστές
    ΦΠΑ σε ορισμένες υπηρεσίες υψηλής έντασης
    εργατικού δυναμικού
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 2002/93/EÜ, 3. detsember 2002, millega muudetakse direktiivi
    77/388/EMÜ, et anda liikmesriikidele võimalus jätkata vähendatud käibemaksumäärade
    kohaldamist teatavate töömahukate teenuste suhtes
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 2002/93/EY, annettu 3 päivänä joulukuuta 2002,
    direktiivin 77/388/ETY muuttamisesta luvan antamismahdollisuuden jatkamiseksi
    jäsenvaltioille soveltaa alennettuja arvonlisäverokantoja tiettyihin erityisen
    työvaltaisiin palveluihin
  type: main
- language: hu
  script: Latn
  content: A Tanács 2002/93/EK irányelve (2002. december 3.) az egyes munkaigényes
    szolgáltatásokra a tagállamok részéről kedvezményes hozzáadottértékadó-mérték
    alkalmazását megengedő lehetőség meghosszabbítása céljából a 77/388/EGK
    irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2002/93/CE del Consiglio, del 3 dicembre 2002, che modifica la
    direttiva 77/388/CEE, con riguardo alla proroga della facoltà di autorizzare
    gli Stati membri ad applicare un'aliquota IVA ridotta su taluni servizi ad alta
    intensità di lavoro
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 2002/92/EK (2002. gada 3. decembris), ar ko groza Direktīvu
    77/388/EEK, lai paplašinātu dalībvalstu iespējas piemērot samazinātas PVN
    likmes dažiem darbietilpīgiem pakalpojumiem
  type: main
- language: lt
  script: Latn
  content: 2002 m. gruodžio 3 d. Tarybos direktyva 2002/93/EB iš dalies keičianti
    Direktyvą 77/388/EEB išplečiant priemonių, leidžiančių valstybėms narėms
    taikyti sumažintas PVM normas tam tikroms darbui imlioms paslaugoms, galiojimo
    trukmę
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 2002/93/KE tat-3 ta' Diċembru 2002 li temenda
    d-Direttiva 77/388/KEE biex tiġi estiża l-faċilità li tippermetti l-Istati
    Membri japplikaw rati mnaqqsa ta' VAT fuq ċerti servizzi li jeħtieġu ħafna
    xogħol
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2002/93/EG van de Raad van 3 december 2002 tot wĳziging van
    Richtlĳn 77/388/EEG ter verlenging van de termĳn tĳdens welke de lidstaten
    kunnen worden gemachtigd een verlaagd BTW-tarief toe te passen op arbeidsintensieve
    diensten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 2002/93/WE z dnia 3 grudnia 2002 r. zmieniająca dyrektywę
    77/388/EWG w celu rozszerzenia rozwiązania pozwalającego Państwom Członkowskim
    zastosować obniżone stawki VAT w stosunku do niektórych pracochłonnych usług
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/93/CE do Conselho, de 3 de Dezembro de 2002, que altera
    a Directiva 77/388/CEE tendo em vista prorrogar a possibilidade de autorizar os
    Estados-Membros a aplicar taxas reduzidas de IVA a certos serviços de grande
    intensidade do factor trabalho
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 2002/93/ES z 3. decembra 2002, ktorá mení a dopĺňa smernicu
    77/388/EHS s cieľom predĺžiť členským štátom možnosť uplatňovať znížené
    sadzby dane z pridanej hodnoty na niektoré služby s vysokým podielom ľudskej
    práce
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 2002/93/ES z dne 3. decembra 2002 o spremembi Direktive
    77/388/EGS zaradi podaljšanja možnosti, da države članice uporabljajo nižje
    stopnje DDV za nekatere delovno intenzivne storitve
  type: main
- language: es
  script: Latn
  content: Directiva 2002/93/CE del Consejo, de 3 de diciembre de 2002, por la que
    se modifica la Directiva 77/388/CEE con el fin de prorrogar la facultad para autorizar
    a los Estados miembros a que apliquen un tipo reducido del IVA sobre determinados
    servicios de gran intensidad de mano de obra
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 2002/93/EG av den 3 december 2002 om ändring av direktiv
    77/388/EEG i syfte att förlänga möjligheten att tillåta medlemsstaterna att
    tillämpa reducerade mervärdesskattesatser på vissa arbetsintensiva tjänster
  type: main
