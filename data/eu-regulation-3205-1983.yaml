title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3205/83 of 11 November 1983 re-establishing
    the levying of customs duties on raw or unmanufactured tobaccos other than Virginia
    type, falling within subheadings 24.01 ex A and ex B and originating in developing
    countries benefiting from the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3379/82
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3205/83 de la Commission du 11 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux tabacs bruts
    ou non fabriqués, autres que du type Virginia, des sous-positions 24.01 ex A
    et ex B du tarif douanier commun, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    no 3379/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3205/83 der Kommission vom 11. November 1983 zur Wiedereinführung
    des Zollsatzes für unverarbeiteten Tabak, anderen als der Sorte ,,Virginia' '
    der Tarifstellen 24.01 ex A und ex B mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 3379/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3205/83 af 11. november 1983 om genindførelse
    af opkrævning af toldafgifter for rå eller ufabrikeret tobak af andre sorter
    end Virginia under position 24.01 ex A og ex B, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3379/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3205/83 της Επιτροπής
    της 11ης Νοεμβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών που εφαρμόζονται στα
    ακατέργαστα ή μη βιομηχανοποιημένα καπνά,
    εκτός των καπνών του τύπου Virginia, που υπάγονται
    στις διακρίσεις 24.01 ex Α και ex Β του Κοινού Δασμολογίου,
    καταγωγής αναπτυσσομένων χωρών, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3379/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3205/83 della Commissione dell' 11 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili ai tabacchi greggi o non
    lavorati diversi dal tipo "Virginia", delle sottovoci 24.01 ex A e ex B della
    tariffa doganale comune, originari dei paesi in via di sviluppo beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3379/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3205/83 van de Commissie van 11 november 1983 houdende
    wederinstelling van de heffing van de invoerrechten voor ruwe tabak en niet tot
    verbruik bereide tabak van andere soorten dan van de soort Virginia van post 24.01
    ex A en ex B van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij
    Verordening (EEG) nr. 3379/82 van de Raad tariefpreferenties werden geopend
  type: main
