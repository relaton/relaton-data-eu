  content: Council Regulation (EEC) No 3444/89 of 14 November 1989 extending the provisional
    anti-dumping duty on imports of certain compact disc players originating in Japan
    and South Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3444/89 du Conseil du 14 novembre 1989 prorogeant
    le droit antidumping provisoire sur les importations de certains lecteurs de disques
    compacts originaires du Japon et de Corée du Sud
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3444/89 DES RATES vom 14. November 1989 zur Verlängerung
    der Geltungsdauer des vorläufigen Antidumpingzolls auf die Einfuhren bestimmter
    CD-Spieler mit Ursprung in Japan und Südkorea #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3444/89 af 14. november 1989 om forlængelse
    af gyldigheden af den midlertidige antidumpingtold på visse CD-afspillere med
    oprindelse i Japan og Sydkorea
  type: main
- language: el
  script: Grek
  content: 'ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 3444/89 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 14ης Νοεμβρίου 1989 για την παράταση του προσωρινού
    δασμού αντιντάμπινγκ σε εισαγωγές συσκευών
    αναπαραγωγής ήχου με σύστημα οπτικής ανάγνωσης
    με ακτίνες λέιζερ, καταγωγής Ιαπωνίας και Νότιας
    Κορέας #'
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3444/89 DEL CONSIGLIO del 14 novembre 1989 che proroga
    il dazio antidumping provvisorio sulle importazioni di alcuni tipi di lettori
    di dischi compact originari del Giappone e della Corea del Sud #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3444/89 VAN DE RAAD van 14 november 1989 waarbij
    het voorlopige anti-dumpingrecht op de invoer van bepaalde compact-discspelers
    van oorsprong uit Japan en Zuid-Korea wordt verlengd #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3444/89 DO CONSELHO de 14 de Novembro de 1989 que
    prorroga o direito anti-dumping provisório sobre as importações de certos leitores
    de discos compactos originários do Japão e da Coreia do Sul #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 3444/89 DEL CONSEJO de 14 de noviembre de 1989 por
    el que se amplía el derecho antidumping provisional sobre las importaciones de
    determinados reproductores de disco compacto originarios de Japón y de Corea
    del Sur #'
