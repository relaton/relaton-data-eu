title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1976/2004 of 15 November 2004 extending the
    definitive countervailing duty imposed by Regulation (EC) No 2597/1999 on imports
    of polyethylene terephthalate (PET) film originating in India to imports of polyethylene
    terephthalate (PET) film consigned from Brazil and from Israel, whether declared
    as originating in Brazil or Israel or not
  type: main
- language: fr
  script: Latn
