  content: Décision de la Commission, du 17 décembre 1971, relative au remboursement
    par le FEOGA, section orientation, au Royaume de Belgique des primes versées
    pendant l'année 1970 pour l'abattage de vaches et pour la non- commercialisation
    du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: '72/55/EWG: Entscheidung der Kommission vom 17. Dezember 1971 über die
    Erstattung der im Jahre 1970 für die Schlachtung von Kühen und die Nichtvermarktung
    von Milch und Milcherzeugnissen gezahlten Prämien durch den EAGFL, Abteilung
    Ausrichtung, an das Königreich Belgien'
  type: main
- language: it
  script: Latn
  content: '72/55/CEE: Decisione della Commissione del 17 dicembre 1971 relativa al
    rimborso da parte del FEAOG sezione orientamento al Regno del Belgio dei premi
    versati nell''anno 1970 per la macellazione delle vacche e per la non commercializzazione
    del latte e dei prodotti lattiero-caseari'
  type: main
- language: nl
  script: Latn
  content: '72/55/EEG: Beschikking van de Commissie van 17 december 1971 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van
    in 1970 uitbetaalde premies voor het slachten van koeien en voor het niet in de
    handel brengen van melk en zuivelprodukten'
