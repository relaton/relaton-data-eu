    Δημοκρατία και την Ομοσπονδιακή Δημοκρατία
    της Γερμανίας να επιτρέψουν προσωρινά την
    εμπορία σπόρων μηδικής, που δεν ικανοποιούν
    τις απαιτήσεις της οδηγίας 66/401/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 24 giugno 1992 che autorizza la Repubblica
