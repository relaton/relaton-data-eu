  type: main
- language: fr
  script: Latn
  content: '92/370/CEE: Décision de la Commission du 24 juin 1992 autorisant la République
    française et la République fédérale d''Allemagne à admettre temporairement
    la commercialisation de graines de minette qui ne satisfont pas aux exigences
    de la directive 66/401/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 24. Juni 1992 zur Ermächtigung der Französischen
    Republik und der Bundesrepublik Deutschland vorübergehend Saatgut von Gelbklee
    zum Verkehr zuzulassen, das den Anforderungen der Richtlinie 66/401/EWG des Rates
    nicht entspricht (92/370/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 24. juni 1992 om bemyndigelse af Den Franske
    Republik og Forbundsrepublikken Tyskland til midlertidigt at tillade handel med
    humlesneglebælg, der ikke opfylder kravene i Rådets direktiv 66/401/EØF (92/370/EØF)
    #'
  type: main
- language: el
  script: Grek
  content: '92/370/ΕΟΚ: Απόφαση της Επιτροπής της 24ης
