title:
- language: fr
  script: Latn
  content: Décision de la Commission portant nouvelle modification de sa décision
    du 9 octobre 1962, autorisant la perception de taxes compensatoires sur les importations,
    dans la République française, de sucreries ne comportant pas de cacao, sans
    liqueur alcoolique, en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '63/194/EWG: Entscheidung der Kommission über eine neue Änderung ihrer
    Entscheidung vom 9. Oktober 1962 über die Erhebung von Ausgleichsabgaben auf
    Einfuhren von Zuckerwaren ohne Kakaogehalt, nicht alkoholhaltig, aus den anderen
    Mitgliedstaaten nach Frankreich'
  type: main
- language: it
  script: Latn
  content: '63/194/CEE: Decisione della Commissione relativa ad una nuova modifica
    della propria decisione del 9 ottobre 1962, che autorizza la riscossione di tasse
    di compensazione sulle importazioni in Francia di prodotti a base di zucchero
    non contenenti cacao, senza alcolici in provenienza dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/194/EEG: Beschikking van de Commissie houdende een nieuwe wijziging
    van haar beschikking van 9 oktober 1962, houdende machtiging tot het leggen van
    compenserende heffingen op de invoer in de Franse Republiek van suikerwerk zonder
    cacao, geen likeur bevattend, uit de andere Lid-Staten'
  type: main
