title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1717/96 of 29 August 1996 initiating an investigation
    concerning the circumvention of anti-dumping measures imposed by Council Regulation
    (EEC) No 993/93 on imports of certain electronic weighing scales originating in
    Japan by imports of the same product assembled in and/or transhipped through Indonesia
    and making the latter imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1717/96 de la Commission du 29 août 1996 ouvrant une
    enquête sur le contournement des mesures antidumping instituées par le règlement
    (CEE) nº 993/93 du Conseil sur les importations de certaines balances électroniques
    originaires du Japon par des importations des mêmes produits assemblés et/ou
    transbordés en Indonésie et rendant l'enregistrement de ces importations obligatoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1717/96 der Kommission vom 29. August 1996 zur Einleitung
    einer Untersuchung betreffend die Umgehung der mit der Verordnung (EWG) Nr. 993/93
    des Rates eingeführten Antidumpingzölle auf die Einfuhren bestimmter elektronischer
    Waagen mit Ursprung in Japan durch die Einfuhren der gleichen, in Indonesien montierten
    und/oder dort umgeladenen Ware und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1717/96 af 29. august 1996 om indledning
    af en undersøgelse vedrørende omgåelse af de antidumpingforanstaltninger, der
    indførtes ved Rådets forordning (EØF) nr. 993/93 på importen af visse elektroniske
    vægte med oprindelse i Japan, ved import af samme vare samlet i og/eller omladet
    via Indonesien og om at gøre sidstnævnte import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1717/96 της Επιτροπής
    της 29ης Αυγούστου 1996 για την έναρξη έρευνας
    αναφορικά με την καταστρατήγηση μέτρων αντιντάμπινγκ
    που επιβλήθηκαν με τον κανονισμό (ΕΟΚ) αριθ.
    993/93 του Συμβουλίου επί των εισαγωγών ορισμένων
    ηλεκτρονικών ζυγών καταγωγής Ιαπωνίας, με
    εισαγωγές του ιδίου προϊόντος που συναρμολογείται
