    και για την υπαγωγή αυτών των εισαγωγών σε
    διαδικασία καταγραφής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1717/96, annettu 29 päivänä elokuuta 1996,
    Japanista peräisin olevien elektronisten vaakojen tuonnissa neuvoston asetuksella
    (ETY) N:o 993/93 käyttöön otettujen polkumyyntitoimenpiteiden kiertämistä
    Indonesiassa suoritettavalla kokoonpanolla ja/tai Indonesian kautta tapahtuvalla
    jälleenlaivauksella koskevan tutkimuksen vireillepanosta ja kyseisen tuonnin
    saattamisesta kirjaamisen alaiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1717/96 della Commissione del 29 agosto 1996 che avvia
    un'inchiesta relativa all'elusione delle misure antidumping istituite dal regolamento
    (CEE) n. 993/93 del Consiglio sulle importazioni di alcuni tipi di bilance elettroniche
    originarie del Giappone per mezzo di importazioni degli stessi prodotti assemblati
    in Indonesia oppure trasbordati attraverso tale paese e che stabilisce che tali
    importazioni devono essere soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1717/96 van de Commissie van 29 augustus 1996 houdende
    opening van een onderzoek naar de ontwijking van de bij Verordening (EEG) nr.
    993/93 van de Raad ingestelde anti-dumpingmaatregelen op de invoer van bepaalde
    elektronische weegschalen van oorsprong uit Japan, door invoer van hetzelfde produkt
    dat geassembleerd en/of overgeladen wordt in Indonesië, waardoor deze invoer
    aan registratie wordt onderworpen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1717/96 da Comissão de 29 de Agosto de 1996 que inicia
    um inquérito sobre a evasão às medidas anti-dumping instituídas pelo Regulamento
    (CEE) nº 993/93 do Conselho sobre as importações de certas balanças electrónicas
    originárias do Japão através de importações destes produtos montados na Indonésia
    ou objecto de transbordo através deste país e que torna obrigatório o registo
    destas últimas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1717/96 de la Comisión de 29 de agosto de 1996 por
