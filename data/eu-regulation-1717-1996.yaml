    establecidas por el Reglamento (CEE) nº 993/93 del Consejo sobre las importaciones
    de determinadas balanzas electrónicas originarias de Japón, mediante importaciones
    de dichos productos montados en y/o transbordados vía Indonesia y por el que
    estas importaciones se someten a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1717/96 av den 29 augusti 1996 om inledande
    av en undersökning om kringgående av de antidumpningsåtgärder som införts
    genom rådets förordning (EEG) nr 993/93 mot import av vissa elektroniska vågar
    med ursprung i Japan genom import av samma produkt som hopsatts i eller omlastats
    via Indonesien, och om registrering av sådan import
