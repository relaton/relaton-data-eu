title:
- language: en
  script: Latn
  content: '74/398/EEC: Commission Decision of 23 July 1974 authorizing the French
    Republic not to apply Community treatment to mushrooms, falling within heading
    No 07.04 ex B of the Common Customs Tariff, originating in Taiwan and in free
    circulation in the Federal Republic of Germany'
  type: main
- language: fr
  script: Latn
  content: '74/398/CEE: Décision de la Commission, du 23 juillet 1974, autorisant
    la République française à exclure du traitement communautaire les champignons,
    de la position 07.04 ex B du tarif douanier commun, originaires de T''ai-wan et
    mis en libre pratique en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: '74/398/EWG: Entscheidung der Kommission vom 23. Juli 1974, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in der Bundesrepublik
    Deutschland im freien Verkehr befindliche Pilze der Tarifnummer 07.04 ex B des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '74/398/EØF: Kommissionens Beslutning af 23. juli 1974 om bemyndigelse
    for Den franske Republik til fra fællesskabsbehandling at undtage champignon,
    som henhører under position 07.04 ex B i den fælles toldtarif, med oprindelse
    i Taiwan og som frit kan omsættes i Tyskland'
  type: main
- language: it
  script: Latn
  content: '74/398/CEE: Decisione della Commissione, del 23 luglio 1974, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i funghi di coltivazione,
    della voce n. 07.04 ex B della tariffa doganale comune, originari di Taiwan e
    messi in libera pratica nella Repubblica federale di Germania'
  type: main
- language: nl
  script: Latn
  content: '74/398/EEG: Beschikking van de Commissie van 23 juli 1974 waarbij de Franse
    Republiek wordt gemachtigd paddestoelen van post 07.04 ex B van het gemeenschappelijk
    douanetarief, van oorsprong uit Tai-wan en in de Bondsrepubliek Duitsland in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
