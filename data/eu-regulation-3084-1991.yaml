title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3084/91 of 21 October 1991 amending the
    list annexed to Regulation (EEC) No 3664/90 establishing, for 1991, the list of
    vessels exceeding eight metres length overall permitted to fish for sole within
    certain areas of the Community using beam trawls whose aggregate length exceeds
    nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3084/91 de la Commission, du 21 octobre 1991, modifiant
    la liste annexée au règlement (CEE) n 3664/90 établissant, pour 1991, la liste
    des bateaux dont la longueur hors tout dépasse huit mètres, qui sont autorisés
    à pêcher la sole dans certaines zones de la Communauté à l'aide de chaluts
    à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3084/91 der Kommission vom 21. Oktober 1991 zur Änderung
    der Liste im Anhang der Verordnung (EWG) Nr. 3664/90 zur Festlegung der Liste
    der Schiffe mit einer Länge über alles von mehr als 8 m, die in bestimmten Gebieten
    der Gemeinschaft mit Baumkurren, deren Gesamtbaumlänge mehr als 9 m beträgt,
    auf Seezunge fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3084/91 af 21. oktober 1991 om ændring
    af den liste, der er knyttet som bilag til forordning (EØF) nr. 3664/90 om listen
    over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter tunge
    i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl, hvis
    samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3084/91 της Επιτροπής
    της 21ης Οκτωβρίου 1991 για την τροποποίηση του
    καταλόγου που είναι προσαρτημένος στον κανονισμό
    (ΕΟΚ) αριθ. 3664/90 για το 1991 για την κατάρτιση του
    καταλόγου των σκαφών συνολικού μήκους άνω
    των οκτώ μέτρων τα οποία επιτρέπεται να αλιεύουν
    γλώσσες σε ορισμένες περιοχές της Κοινότητας
    χρησιμοποιώντας δοκότρατες των οποίων το συνολικό
    μήκος υπερβαίνει τα εννέα μέτρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3084/91 della Commissione, del 21 ottobre 1991, recante
    modifica dell'elenco allegato al regolamento (CEE) n. 3664/90 che fissa, per il
    1991, l'elenco dei pescherecci di lunghezza fuori tutto superiore a 8 m, autorizzati
    a pescare la sogliola in determinate zone della Comunità con reti a strascico
    a pali, di lunghezza complessiva superiore a 9 m
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3084/91 van de Commissie van 21 oktober 1991 tot
    wijziging van de lijst in de bijlage bij Verordening (EEG) nr. 3664/90 tot vaststelling
    van de lijst van vaartuigen met een lengte over alles van meer dan 8 meter en
    die in bepaalde zones van de Gemeenschap met boomkorren waarvan de totale boomlengte
    meer dan 9 meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3084/91 da Comissão, de 21 de Outubro de 1991, que
    altera a lista anexa ao Regulamento (CEE) nº 3664/90 que estabelece, para 1991,
    a lista dos navios com mais de oito metros de comprimento de fora a fora autorizados
    a pescar linguado em determinadas zonas da Comunidade utilizando redes de arrasto
    de vara em que o comprimento total das varas seja superior a nove metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3084/91 de la Comisión, de 21 de octubre de 1991,
    que modifica la lista anexa al Reglamento (CEE) n° 3664/90 por el que se establece,
    para 1991, la lista de barcos cuya eslora total excede los ocho metros y a los
    que se permite la pesca del lenguado dentro de determinadas zonas de la Comunidad
    utilizando artes de arrastre de vara cuya longitud total supere los nueve metros
  type: main
