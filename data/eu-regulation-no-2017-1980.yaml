id: EURegulationNo20171980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2017/80 of 28 July 1980 re-establishing
    the levying of customs duties on sacks and bags, of a kind used for the packing
    of goods, etc., products of category 93 (code 0930), originating in India, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2017/80 de la Commission, du 28 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux sacs et
    sachets d' emballage en tissus de fibres, etc., de la catégorie de produits n°
    93 (code 0930), originaires de l' Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2017/80 der Kommission vom 28. Juli 1980 über die
    Wiedereinführung des Zollsatzes für Säcke und Beutel zu Verpackungszwecken,
    aus Geweben aus anderen Spinnstoffen usw. der Warenkategorie Nr. 93 (Kennziffer
    0930), mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 2894/79 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2017/80 af 28. juli 1980 om genindførelse
    af opkrævning af toldafgifter for sække og poser til emballage af andre stoffer
    etc., under varekategori 93 (kode 0930), som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2017/80 della Commissione, del 28 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai sacchi e sacchetti
    da imballaggio di tessuti di fibre, ecc., della categoria di prodotti n. 93 (codice
    0930), originari dell' India beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2017/80 van de Commissie van 28 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakken voor
    verpakkingsdoeleinden, van weefsels van andere textielstoffen, enz., van de categorie
    van produkten nr. 93 (codenummer 0930) van oorsprong uit India, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de
    Raad
  type: main
