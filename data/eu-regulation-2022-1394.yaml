title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1394 of 11 August 2022 imposing
    a definitive anti-dumping duty on imports of silicon originating in the People’s
    Republic of China, as extended to imports of silicon consigned from the Republic
    of Korea and from Taiwan, whether declared as originating in the Republic of Korea
    or Taiwan or not, following an expiry review pursuant to Article 11(2) of Regulation
    (EU) 2016/1036 of the European Parliament and the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1394 de la Commission du 11 août 2022
    instituant un droit antidumping définitif sur les importations de silicium originaire
    de la République populaire de Chine, tel qu’étendu aux importations de silicium
    expédié de la République de Corée ou de Taïwan, qu’il ait ou non été
    déclaré originaire de ces pays, à la suite d’un réexamen au titre de l’expiration
    des mesures conformément à l’article 11, paragraphe 2, du règlement (UE)
    2016/1036 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1394 der Kommission vom 11. August 2022
    zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren von Silicium
    mit Ursprung in der Volksrepublik China, ausgeweitet auf aus der Republik Korea
    und Taiwan versandtes Silicium, ob als Ursprungserzeugnisse aus diesen Ländern
    angemeldet oder nicht, im Anschluss an eine Auslaufüberprüfung nach Artikel
    11 Absatz 2 der Verordnung (EU) 2016/1036 des Europäischen Parlaments und des
    Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1394 на Комисията
    от 11 август 2022 година за налагане на окончателно
    антидъмпингово мито върху вноса на силиций
    с произход от Китайската народна република,
    чийто обхват е разширен и към вноса на силиций,
    изпращан от Република Корея и Тайван, независимо
    дали е деклариран с произход от Република Корея
    или Тайван, след преглед с оглед изтичане на
    срока на действие на мерките в съответствие
