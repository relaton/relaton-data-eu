    2022 che istituisce un dazio antidumping definitivo sulle importazioni di silicio
    originario della Repubblica popolare cinese, esteso alle importazioni di silicio
    spedito dalla Repubblica di Corea e da Taiwan, indipendentemente dal fatto che
    sia dichiarato o no originario della Repubblica di Corea o di Taiwan, successivamente
    a un riesame in previsione della scadenza a norma dell’articolo 11, paragrafo
    2, del regolamento (UE) 2016/1036 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
