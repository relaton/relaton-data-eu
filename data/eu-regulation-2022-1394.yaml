    neovisno o tome ima li deklarirano podrijetlo iz Republike Koreje ili Tajvana,
    nakon revizije zbog predstojećeg isteka mjera u skladu s člankom 11. stavkom
    2. Uredbe (EU) 2016/1036 Europskog parlamenta i Vijeća
  type: main
- language: hu
