    z Čínské lidové republiky, rozšířené na dovoz křemíku zasílaného z
    Korejské republiky a Tchaj-wanu, bez ohledu na to, zda je deklarován jako pocházející
    z Korejské republiky nebo Tchaj-wanu, na základě přezkumu před pozbytím
    platnosti podle čl. 11 odst. 2 nařízení Evropského parlamentu a Rady (EU)
    2016/1036
  type: main
