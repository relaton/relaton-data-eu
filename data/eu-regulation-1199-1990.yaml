title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1199/90 of 7 May 1990 amending Regulation (EEC)
    No 1035/77 laying down special measures to encourage the marketing of products
    processed from lemons and amending the rules for applying the intervention threshold
    for lemons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1199/90 du Conseil, du 7 mai 1990, modifiant le règlement
    (CEE) n° 1035/77 prévoyant des mesures particulières visant à favoriser la
    commercialisation des produits transformés à base de citrons et modifiant les
    règles d'application du seuil d'intervention pour les citrons
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1199/90 des Rates vom 7. Mai 1990 zur Änderung der
    Verordnung (EWG) Nr. 1035/77 über Sondermaßnahmen zur Förderung der Vermarktung
    von Verarbeitungserzeugnissen aus Zitronen und zur Änderung der die Interventionsschwelle
    betreffenden Durchführungsbestimmungen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1199/90 af 7. maj 1990 om ændring af forordning
    (EØF) nr. 1035/77 om særlige foranstaltninger til fremme af afsætningen af
    produkter forarbejdet på basis af citroner og om ændringer af bestemmelserne
    for anvendelse af interventionstærsklen for citroner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1199/90 του Συμβουλίου
    της 7ης Μαΐου 1990 για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1035/77 για την πρόβλεψη ειδικών μέτρων
    για την προώθηση της εμπορίας των μεταποιημένων
    προϊόντων με βάση τα λεμόνια και για την τροποποίηση
    των κανόνων εφαρμογής του κατωφλίου παρέμβασης
    για τα λεμόνια
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1199/90, annettu 7 päivänä toukokuuta 1990,
    sitruunajalosteiden kaupan pitämisen edistämiseen tarkoitettujen erityistoimenpiteiden
    säätämisestä annetun asetuksen (ETY) N:o 1035/77 muuttamisesta ja sitruunoita
    koskevan interventiokynnyksen soveltamissääntöjen muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1199/90 del Consiglio, del 7 maggio 1990, che modifica,
    da un lato, le modalità di applicazione del limite di intervento per i limoni
    e, dell'altro, il regolamento (CEE) n. 1035/77, che prevede misure particolari
    intese a favorire la commercializzazione dei prodotti trasformati a base di limoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1199/90 van de Raad van 7 mei 1990 tot wijziging
    van Verordening (EEG) nr. 1035/77 houdende bijzondere maatregelen voor de verbetering
    van de afzet van op basis van citroenen verwerkte produkten, en tot wijziging
    van de voorschriften voor de toepassing van de interventiedrempel voor citroenen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1199/90 do Conselho, de 7 de Maio de 1990, que altera
    o Regulamento (CEE) nº 1035/77, que prevê medidas especiais para favorecer a
    comercialização dos produtos transformados à base de limões e que altera as
    regras de execução do limiar de intervenção para os limões
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1199/90 del Consejo, de 7 de mayo de 1990, que modifica
    el Reglamento (CEE) nº 1035/77 por el que se prevén medidas especiales dirigidas
    a favorecer la comercialización de los productos transformados a base de limones
    y por el que se modifican las normas de aplicación del umbral de intervención
    correspondiente a los limones
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 1199/90 av den 7 maj 1990 om ändring av förordning
    (EEG) nr 1035/77 om särskilda åtgärder för att främja försäljningen av
    bearbetade produkter av citroner och om ändring av tillämpningsföreskrifterna
    för interventionströskeln för citroner
  type: main
