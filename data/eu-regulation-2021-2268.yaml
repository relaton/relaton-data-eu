    nákladov podľa štruktúrovaných retailových investičných produktov a investičných
    produktov založených na poistení (PRIIP), ktoré ponúkajú rôzne možnosti
    investovania, a zosúladenie prechodného mechanizmu pre tvorcov PRIIP, ktorí
    ponúkajú podielové listy fondov uvedené v článku 32 nariadenia Európskeho
    parlamentu a Rady (EÚ) č. 1286/2014 ako podkladové investičné možnosti,
    s predĺženým prechodným mechanizmom stanoveným v uvedenom článku
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/2268 z dne 6. septembra 2021 o spremembi
    regulativnih tehničnih standardov iz Delegirane uredbe Komisije (EU) 2017/653
    v zvezi z osnovno metodologijo in prikazom scenarijev uspešnosti, prikazom stroškov
    in metodologijo za izračun zbirnih kazalnikov stroškov, prikazom in vsebino
    informacij o pretekli uspešnosti in prikazom stroškov glede na paketne naložbene
    produkte za male vlagatelje in zavarovalne naložbene produkte (PRIIP), ki ponujajo
    več različnih možnosti naložb, ter uskladitvijo prehodne ureditve za proizvajalce
    PRIIP, ki ponujajo enote skladov, iz člena 32 Uredbe (EU) št. 1286/2014 Evropskega
    parlamenta in Sveta kot osnovne naložbene možnosti s podaljšano prehodno ureditvijo
    iz navedenega člena
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/2268 de la Comisión de 6 de septiembre de
    2021 por el que se modifican las normas técnicas de regulación establecidas
    en el Reglamento Delegado (UE) 2017/653 en lo que respecta a la metodología subyacente
    y la presentación de los escenarios de rentabilidad, la presentación de los
    costes y la metodología para el cálculo de los indicadores resumidos de costes,
    la presentación y el contenido de la información sobre rentabilidad histórica
    y la presentación de los costes de los productos de inversión minorista empaquetados
    y productos de inversión basados en seguros (PRIIP) que ofrecen diversas opciones
    de inversión, así como a la adaptación de la disposición transitoria aplicable
    a los productores de PRIIP a que se refiere el artículo 32 del Reglamento (UE)
    n.o 1286/2014 del Parlamento Europeo y del Consejo que ofrecen participaciones
    en fondos como opciones de inversión subyacentes a la disposición transitoria
    ampliada establecida en dicho artículo
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/2268 av den 6 september
    2021 om ändring av de tekniska tillsynsstandarder som föreskrivs i kommissionens
    delegerade förordning (EU) 2017/653 vad gäller underliggande metoder och presentation
    av resultatscenarier, redovisning av kostnader och metoder för beräkning av
    sammanfattande kostnadsindikatorer, redovisning av och innehållet i information
    om tidigare resultat och redovisning av kostnader för paketerade och försäkringsbaserade
    investeringsprodukter för icke-professionella investerare (Priip-produkter) som
    erbjuder flera olika investeringsalternativ och om anpassning av övergångsbestämmelserna
    för Priip-produktutvecklare som erbjuder andelar i fonder som avses i artikel
    32 i Europaparlamentets och rådets förordning (EU) nr 1286/2014 som underliggande
    investeringsalternativ med förlängda övergångsbestämmelser som fastställs
    i den artikeln
  type: main
