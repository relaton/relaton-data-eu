id: EUDecision1977479
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 April 1977 authorizing the Italian Republic not
    to apply Community treatment to sewing machines, sewing machine heads and parts
    of sewing machines falling within subheading 84.41 A ex I, ex II or ex III of
    the Common Customs Tariff, originating in Japan and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '77/479/CEE: Décision de la Commission, du 6 avril 1977, autorisant la
    République italienne à exclure du traitement communautaire les têtes de machines
    à coudre et leurs parties et pièces détachées, des sous-positions 84.41 A
    Ex I, Ex II et Ex III du Tarif douanier commun, originaires du Japon et mises
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. April 1977, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Nähmaschinen und ihre Teile der Tarifstellen 84.41
    A ex I, ex II und ex III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 6. april 1977 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage symaskiner, symaskinhoveder
    og reservedele til symaskiner, som henhører under pos. 84.41 A ex I, ex II og
    ex III i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes i
    de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 aprile 1977, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le macchine da cucire e le teste
    di macchine da cucire e relative parti staccate della voce 84.41 A ex I, ex II
    e ex III della tariffa doganale comune, originarie del Giappone e messe in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 april 1977 waarbij de Italiaanse Republiek
    wordt gemachtigd naaimachines, koppen van naaimachines, alsmede delen en onderdelen
    daarvan, van de posten 84.41 A ex I, ex II en ex III van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
