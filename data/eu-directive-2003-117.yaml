    li ttawwal l-applikazzjoni tar-rati l-baxxi tad-dazju tas-sisa fuq il-prodotti
    tat-tabakk rilaxxati għall-konsum f’Korsika
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2003/117/EG van de Raad van 5 december 2003 tot wĳziging van
    de Richtlĳnen 92/79/EEG en 92/80/EEG en waarbĳ Frankrĳk wordt gemachtigd de
    toepassing van een verlaagd accĳnstarief op op Corsica tot verbruik aangegeven
    tabaksproducten te verlengen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 2003/117/WE z dnia 5 grudnia 2003 r. zmieniająca dyrektywy
    92/79/EWG i 92/80/EWG w celu upoważnienia Republiki Francuskiej do przedłużenia
    stosowania niższych stawek podatku akcyzowego na wyroby tytoniowe dopuszczone
    do konsumpcji na Korsyce
  type: main
- language: pt
  script: Latn
  content: Directiva 2003/117/CE do Conselho, de 5 de Dezembro de 2003, que altera
    as Directivas 92/79/CEE e 92/80/CEE com vista a autorizar a República Francesa
    a prorrogar a aplicação de uma taxa reduzida de impostos especiais sobre os
    produtos do tabaco introduzidos no consumo na Córsega
  type: main
- language: ro
  script: Latn
  content: Directiva 2003/117/CE a Consiliului din 5 decembrie 2003 de modificare
    a Directivelor 92/79/CEE și 92/80/CEE în vederea autorizării Republicii Franceze
    să prelungească aplicarea unor rate reduse ale accizelor pentru produsele din
    tutun puse în consum în Corsica
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 2003/117/ES z 5. decembra 2003, ktorou sa mení a dopĺňa
    smernica 92/79/EHS a 92/80/EHS s cieľom povoliť Francúzskej republike predĺžené
    uplatňovanie nižších sadzieb spotrebnej dane na tabakové výrobky uvoľnené
    na spotrebu na Korzike
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 2003/117/ES z dne 5. decembra 2003 o spremembi direktiv
    92/79/EGS in 92/80/EGS z namenom da se Francoski republiki dovoli podaljšanje
    uporabe nižjih stopenj trošarin za tobačne izdelke, dane v promet na Korziki
  type: main
- language: es
  script: Latn
  content: Directiva 2003/117/CE del Consejo, de 5 de diciembre de 2003, por la que
    se modifican las Directivas 92/79/CEE y 92/80/CEE, por la que se autoriza a la
    República Francesa para prorrogar la aplicación de un tipo reducido de impuesto
    especial sobre los productos del tabaco despachados al consumo en Córcega
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 2003/117/EG av den 5 december 2003 om ändring av direktiven
