    nodokļa likmju piemērošanu tabakas izstrādājumiem, kas laisti apgrozībā
    Korsikā
  type: main
- language: lt
  script: Latn
  content: 2003 m. gruodžio 5 d. Tarybos direktyva 2003/117/EB, iš dalies keičianti
