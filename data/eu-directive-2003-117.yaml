    toliau taikyti mažesnį akcizo mokestį tabako gaminiams, išleistiems vartoti
    Korsikoje
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 2003/117/KE tal-5 ta’ Diċembru 2003 li temenda
