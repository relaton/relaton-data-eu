title:
- language: en
  script: Latn
  content: Council Directive 2003/117/EC of 5 December 2003 amending Directives 92/79/EEC
    and 92/80/EEC, in order to authorise the French Republic to prolong the application
    of lower rates of excise duty to tobacco products released for consumption in
    Corsica
  type: main
- language: fr
  script: Latn
  content: Directive 2003/117/CE du Conseil du 5 décembre 2003 modifiant les directives
    92/79/CEE et 92/80/CEE en vue d'autoriser la République française à proroger
    l'application d'un taux d'accise réduit sur les produits du tabac mis à la consommation
    en Corse
  type: main
- language: de
  script: Latn
  content: Richtlinie 2003/117/EG des Rates vom 5. Dezember 2003 zur Änderung der
    Richtlinien 92/79/EWG und 92/80/EWG, um die Französische Republik zu ermächtigen,
    auf Korsika in den Verkehr gebrachte Tabakwaren weiterhin einem ermäßigten Verbrauchsteuersatz
    zu unterwerfen
  type: main
- language: bg
  script: Cyrl
  content: Директива 2003/117/ЕО на Съвета от 5 декември
    2003 година за изменение на Директиви 92/79/ЕИО
    и 92/80/ЕИО за даване право на Френската република
    да продължи прилагането на по-ниски ставки
    на акцизите за тютюневите продукти, които са
    пуснати за консумация в Корсика
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 2003/117/ES ze dne 5. prosince 2003, kterou se mění směrnice
    92/79/EHS a 92/80/EHS, s cílem povolit Francouzské republice prodloužené uplatňování
    nižších sazeb spotřební daně na tabákové výrobky uvolněné ke spotřebě
    na Korsice
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 2003/117/EF af 5. december 2003 om ændring af direktiv
    92/79/EØF og 92/80/EØF med henblik på at bemyndige Frankrig til at forlænge
    gyldighedsperioden for anvendelsen af en reduceret punktafgift på tobaksvarer,
    der overgår til forbrug på Korsika
  type: main
- language: el
  script: Grek
  content: Οδηγία 2003/117/ΕΚ του Συμβουλίου, της 5ης Δεκεμβρίου
    2003, για την τροποποίηση των οδηγιών 92/79/ΕΟΚ
    και 92/80/ΕΟΚ, με σκοπό να εξουσιοδοτηθεί η Γαλλική
    Δημοκρατία να παρατείνει την εφαρμογή μειωμένου
    συντελεστή ειδικού φόρου κατανάλωσης στα προϊόντα
    καπνού που διατίθενται προς κατανάλωση στην
    Κορσική
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 2003/117/EÜ, 5. detsember 2003, millega muudetakse
    direktiive 92/79/EMÜ ja 92/80/EMÜ, et lubada Prantsuse Vabariigil pikendada
    madalamate aktsiisimäärade kohaldamist Korsikal tarbimiseks ringlusse lubatud
    tubakatoodete suhtes
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 2003/117/EY, annettu 5 päivänä joulukuuta 2003,
    direktiivien 92/79/ETY ja 92/80/ETY muuttamisesta luvan antamiseksi Ranskalle
    jatkaa alennetun valmisteverokannan soveltamista Korsikan saarella markkinoille
    saatettuihin tupakkatuotteisiin
  type: main
- language: hu
  script: Latn
  content: A Tanács 2003/117/EK irányelve (2003. december 5.) a 92/79/EK és a 92/80/EK
    irányelvnek a Korzikán fogyasztásra bocsátott dohánytermékeket terhelő
    kedvezményes jövedékiadó-mérték alkalmazása meghosszabbításának a Francia
    Köztársaság részére való engedélyezése érdekében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2003/117/CE del Consiglio, del 5 dicembre 2003, che modifica
    le direttive 92/79/CEE e 92/80/CEE e autorizza la Repubblica francese a prorogare
    l'applicazione di un'aliquota di accisa ridotta ai prodotti del tabacco immessi
    al consumo in Corsica
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 2003/117/EK (2003. gada 5. decembris), ar ko groza Direktīvas
