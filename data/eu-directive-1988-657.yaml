title:
- language: en
  script: Latn
  content: Council Directive 88/657/EEC of 14 December 1988 laying down the requirements
    for the production of, and trade in, minced meat, meat in pieces of less than
    100 grams and meat preparations and amending Directives 64/433/EEC, 71/118/EEC
    and 72/462/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 88/657/CEE du Conseil du 14 décembre 1988 établissant les exigences
    relatives à la production et aux échanges de viandes hachées, de viandes en
    morceaux de moins de cent grammes et de préparations de viandes et modifiant
    les directives 64/433/CEE, 71/118/CEE et 72/462/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 88/657/EWG des Rates vom 14. Dezember 1988 zur Festlegung der
    für die Herstellung und den Handelsverkehr geltenden Anforderungen an Hackfleisch,
    Fleisch in Stücken von weniger als 100 g und Fleischzubereitungen sowie zur Änderung
    der Richtlinien 64/433/EWG, 71/118/EWG und 72/462/EWG
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 88/657/EØF af 14. december 1988 om krav til fremstilling
    af og handel med hakket kød, kød i stykker på under 100 g og tilberedt kød,
    og om ændring af direkiv 64/433/EØF, 71/118/EØF og 72/462/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 88/657/ΕΟΚ του Συμβουλίου της 14ης Δεκεμβρίου
    1988 για τον καθορισμό των απαιτήσεων όσον αφορά
    την παραγωγή και τις συναλλαγές κιμάδων, κρεάτων
    σε τεμάχια μικρότερα των εκατό γραμμαρίων
    και παρασκευασμάτων κρέατος, και για την τροποποίηση
    των οδηγιών 64/433/ΕΟΚ, 71/118/ΕΟΚ και 72/462/ΕΟΚ
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 88/657/ETY, annettu 14 päivänä joulukuuta 1988,
    jauhetun lihan, vähemmän kuin 100 grammaa painavien lihapalojen ja raakalihavalmisteiden
    tuotantoa ja kaupan pitämistä koskevista vaatimuksista sekä direktiivien 64/433/ETY,
    71/118/ETY ja 72/462/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 88/657/CEE del Consiglio del 14 dicembre 1988 che fissa i requisiti
    relativi alla produzione ed agli scambi delle carni macinate, delle carni in pezzi
    di peso inferiore a cento grammi e delle preparazioni di carni e che modifica
    le direttive 64/433/CEE, 71/118/CEE e 72/462/CEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 88/657/EEG van de Raad van 14 december 1988 tot vaststelling
    van de eisen voor de produktie van en het handelsverkeer in gehakt, vlees in stukken
    van minder dan 100 gram en vleesbereidingen en tot wijziging van de Richtlijnen
    64/433/EEG, 71/118/EEG en 72/462/EEG
  type: main
- language: pt
  script: Latn
  content: Directiva 88/657/CEE do Conselho de 14 de Dezembro de 1988 que estabelece
    os requisitos relativos à produção e ao comércio de carne picada, de carne
    em pedaços de menos de cem gramas e de preparados de carne e que altera as Directivas
    64/433/CEE, 71/118/CEE e 72/462/CEE
  type: main
- language: es
  script: Latn
  content: Directiva 88/657/CEE del Consejo de 14 de diciembre de 1988 por la que
    se establecen los requisitos relativos a la producción y a los intercambios de
    carnes picadas, de carnes en trozos de menos de cien gramos y de preparados de
    carne, y por la que se modifican las Directivas 64/433/CEE, 71/118/CEE y 72/462/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 88/657/EEG av den 14 december 1988 om fastställande av
    krav vid framställning av och handel med malet kött, kött i stycken på mindre
    än 100 gram och köttberedningar och om ändring av direktiven 64/433/EEG, 71/118/EEG
    och 72/462/EEG
