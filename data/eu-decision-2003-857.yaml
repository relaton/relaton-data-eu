    να εφαρμόσει μέτρο παρέκκλισης από το άρθρο
    21 της έκτης οδηγίας 77/388/ΕΟΚ για την εναρμόνιση
    των νομοθεσιών των κρατών μελών όσον αφορά
    τους φόρους κύκλου εργασιών'
  type: main
- language: fi
  script: Latn
  content: '2003/857/EY: Neuvoston päätös, tehty 25 päivänä marraskuuta 2003,
