  script: Latn
  content: '2003/857/EC: Council Decision of 25 November 2003 amending Decision 97/510/EC
    authorising Ireland to apply a measure derogating from Article 21 of the Sixth
    Directive (77/388/EEC) on the harmonisation of the laws of the Member States relating
    to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '2003/857/CE: Décision du Conseil du 25 novembre 2003 modifiant la décision
    97/510/CE autorisant l''Irlande à appliquer une mesure dérogatoire à l''article
    21 de la sixième directive 77/388/CEE en matière d''harmonisation des législations
    des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '2003/857/EG: Entscheidung des Rates vom 25. November 2003 zur Änderung
