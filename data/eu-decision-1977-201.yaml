title:
- language: en
  script: Latn
  content: Commission Decision of 23 February 1977 modifying its Decision of 22 December
    1975 authorizing the United Kingdom of Great Britain and Northern Ireland to take
    protective measures in respect of Council Regulation (EEC) No 543/69 of 25 March
    1969 on the harmonization of certain social legislation relating to road transport
  type: main
- language: fr
  script: Latn
  content: '77/201/CEE: Décision de la Commission, du 23 février 1977, modifiant
    sa décision du 22 décembre 1975 autorisant le Royaume-Uni de Grande-Bretagne
    et d''Irlande du Nord à prendre des mesures de sauvegarde en ce qui concerne
    le règlement (CEE) n° 543/69 du Conseil du 25 mars 1969, relatif à l''harmonisation
    de certaines dispositions en matière sociale dans le domaine des transports par
    route'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Februar 1977 zur Änderung ihrer Entscheidung
    vom 22. Dezember 1975 zur Ermächtigung des Vereinigten Königreichs Großbritannien
    und Nordirland, Schutzmaßnahmen betreffend die Verordnung (EWG) Nr. 543/69 des
    Rates vom 25. März 1969 über die Harmonisierung bestimmter Sozialvorschriften
    im Straßenverkehr einzuführen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. februar 1977 om ændring af Kommissionens
    beslutning af 22. december 1975 om tilladelse til Det forenede kongerige Storbritannien
    og Nordirland til at træffe beskyttelsesforanstaltninger i medfør af Rådets
    forordning (EØF) nr. 543/69 af 25. marts 1969 om harmonisering af visse bestemmelser
    på det sociale område inden for landevejstransport
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 febbraio 1977, che modifica la decisione
    del 22 dicembre 1975 che autorizza il Regno Unito di Gran Bretagna e Irlanda del
    Nord ad applicare misure di salvaguardia per quanto riguarda il regolamento (CEE)
    n. 543/69 del Consiglio, del 25 marzo 1969, relativo all'armonizzazione di alcune
    disposizioni in materia sociale nel settore dei trasporti su strada
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 februari 1977 tot wijziging van haar
    beschikking van 22 december 1975 waarbij het Verenigd Koninkrijk van Groot-Brittannië
    en Noord-Ierland wordt gemachtigd beschermende maatregelen te treffen met betrekking
    tot Verordening (EEG) nr. 543/69 van de Raad van 25 maart 1969 tot harmonisatie
    van bepaalde voorschriften van sociale aard voor het wegvervoer
  type: main
