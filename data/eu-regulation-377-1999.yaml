title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 377/1999 of 19 February 1999 determining
    the loss of income and the premiums applicable per ewe and per female goat in
    the Member States and the payment of the specific aid for sheep and goat farming
    in certain less-favoured areas of the Community for the 1998 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 377/1999 de la Commission du 19 février 1999 déterminant,
    pour les États membres et pour la campagne 1998, la perte de revenu et le montant
    de la prime payable par brebis et par chèvre et le versement de l'aide spécifique
    à l'élevage ovin et caprin dans certaines zones défavorisées de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 377/1999 der Kommission vom 19. Februar 1999 über
    den je Mitgliedstaat für das Wirtschaftsjahr 1998 zu bestimmenden Einkommensausfall,
    die je Mutterschaf und Ziege zu zahlende Prämie und die in benachteiligten Gebieten
    der Gemeinschaft für die Schaf- und Ziegenfleischerzeugung zu gewährende Sonderbeihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 377/1999 af 19. februar 1999 om fastsættelse
    for medlemsstaterne for produktionsåret 1998 af indtægtstabet og det præmiebeløb,
    der skal betales pr. moderfår og pr. ged, og af udbetalingen af den særlige
    støtte til fåre- og gedeopdræt i visse ugunstigt stillede områder i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 377/1999 της Επιτροπής
    της 19ης Φεβρουαρίου 1999 που καθορίζει για τα
    κράτη μέλη και για την περίοδο εμπορίας 1998
    την απώλεια εισοδήματος καθώς και το ποσό της
    πριμοδότησης που καταβάλλεται ανά προβατίνα
    και ανά αίγα και την πληρωμή της ειδικής ενίσχυσης
    στην εκτροφή προβάτων και αιγών σε ορισμένες
    μειονεκτικές ζώνες της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 377/1999, annettu 19 päivänä helmikuuta 1999,
    jäsenvaltioita ja markkinointivuotta 1998 koskevan tulonmenetyksen määrittämisestä
    ja uuhta ja naaraspuolista vuohta kohden maksettavan palkkion suuruudesta sekä
    lampaiden ja vuohien kasvatukselle tietyillä yhteisön epäsuotuisilla alueilla
    maksettavasta erityisestä tuesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 377/1999 della Commissione del 19 febbraio 1999 che
    stabilisce, per gli Stati membri e per la campagna 1998, la perdita di reddito
    e il premio pagabile per pecora e per capra e il versamento dell'aiuto specifico
    a favore dell'allevamento ovino e caprino in talune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 377/1999 van de Commissie van 19 februari 1999 tot
    vaststelling, voor de lidstaten en voor het verkoopseizoen 1998 van het inkomensverlies,
    het premiebedrag per ooi en per geit en de betaling van de bijzondere steun voor
    de schapen- en geitenhouderij in bepaalde probleemgebieden in de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 377/1999 da Comissão de 19 de Fevereiro de 1999 que
