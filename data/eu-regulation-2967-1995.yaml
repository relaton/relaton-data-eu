title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2967/95 of 19 December 1995 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1996
    fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2967/95 de la Commission, du 19 décembre 1995, fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1996 intervenant dans le calcul de la compensation financière
    et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2967/95 der Kommission vom 19. Dezember 1995 zur Festsetzung
    des Pauschalwerts für das Fischwirtschaftsjahr 1996 für die aus dem Handel genommenen
    Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs und des entsprechenden
    Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2967/95 af 19. december 1995 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1996
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2967/95 της Επιτροπής,
    της 19ης Δεκεμβρίου 1995, για καθορισμό της κατ’αποκοπήν
    αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1994
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2967/95, annettu 19 päivänä joulukuuta 1995,
    kalastusvuoden 1996 aikana markkinoilta vedettyjen kalastustuotteiden taloudellisen
    korvauksen ja sen ennakon laskennassa käytettävästä kiinteästä arvosta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2967/95 della Commissione, del 19 dicembre 1995, che
    fissa, ai fini del calcolo della compensazione finanziaria e dell'anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1996
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2967/95 van de Commissie van 19 december 1995 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1996 voor de uit
    de markt genomen visserijprodukten voor de berekening van de financiële vergoeding
    en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2967/95 da Comissão, de 19 de Dezembro de 1995, que
    fixa, para efeitos do cálculo da compensação financeira e do adiantamento que
    lhe diz respeito, o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1996
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2967/95 de la Comisión, de 19 de diciembre de 1995,
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 1996 que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2967/95 av den 19 december 1995 om fastställande
    av det schablonvärde som skall användas vid beräkningen av den ekonomiska ersättningen
    och tillhörande förskott för de fiskeriprodukter som återtagits från marknaden
    under fiskeåret 1996
