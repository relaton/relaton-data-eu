  script: Latn
  content: Council Implementing Decision (EU) 2022/88 of 18 January 2022 amending
    Implementing Decision 2013/53/EU as regards authorisation to the Kingdom of Belgium
    to apply for a further period the special measure derogating from Article 285
    of Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/88 du Conseil du 18 janvier 2022 modifiant
    la décision d’exécution 2013/53/UE en ce qui concerne l’autorisation accordée
    au Royaume de Belgique d’appliquer, pour une nouvelle période, la mesure particulière
    dérogatoire à l’article 285 de la directive 2006/112/CE relative au système
    commun de taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
