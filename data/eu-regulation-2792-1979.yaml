  script: Latn
  content: Règlement (CEE) n° 2792/79 du Conseil, du 10 décembre 1979, établissant,
    pour certains produits des chapitres 1er à 24 du tarif douanier commun, un système
    de préferences généralisées en faveur des pays en voie de développement
  type: main
- language: de
  script: Latn
