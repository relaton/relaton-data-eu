title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2546/74 of the Commission of 4 October 1974 concerning
    certain measures to be taken, following the raising with effect from 7 October
    1974 of the threshold prices for cereals and rice, as regards licences for those
    products where the import levy or export refund is fixed in advance
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2546/74 de la Commission, du 4 octobre 1974, relatif
    à certaines mesures à prendre pour les certificats comportant fixation à l'
    avance du prélèvement à l' importation ou de la restitution dans le secteur
    des céréales et du riz à la suite du relèvement du niveau des prix de seuil
    avec effet au 7 octobre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2546/74 der Kommission vom 4. Oktober 1974 über bestimmte
    Maßnahmen, die in bezug auf die Bescheinigungen zur Vorausfestsetzung der Abschöpfung
    bei der Einfuhr oder der Erstattung für Getreide und Reis im Anschluß an die
    Anhebung der Schwellenpreise mit Wirkung vom 7. Oktober 1974 zu treffen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2546/74 af 4. oktober 1974 om visse
    foranstaltninger, der skal træffes vedrørende de attester, der forudfastsætter
    importafgifter eller restitutioner inden for korn- og rissektoren som følge af
    forhøjelsen af niveauet for tærskelpriser med virkning fra den 7. oktober 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2546/74 della Commissione, del 4 ottobre 1974, relativo
    a talune misure da adottare per i titoli implicanti fissazione anticipata del
    prelievo all' importazione o della restituzione nei settori dei cereali e del
    riso in seguito all' aumento dei prezzi d' entrata con effetto dal 7 ottobre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2546/74 van de Commissie van 4 oktober 1974 inzake
    bepaalde ten aanzien van de certificaten met voorfixatie van de invoerheffing
    of van de restitutie in de sector granen en rijst te nemen maatregelen in verband
    met de verhoging van de drempelprijzen per 7 oktober 1974
  type: main
