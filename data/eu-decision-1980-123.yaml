title:
- language: en
  script: Latn
  content: '80/123/EEC: Commission Decision of 21 December 1979 extending the period
    of application of the system of authorization for trade in crude oil and/or petroleum
    products between Italy and other Member States provided for by Decisions 79/589/EEC
    and 79/858/EEC (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/123/CEE: Décision de la Commission, du 21 décembre 1979, prorogeant
    le système d''autorisation pour les échanges de pétrole brut et/ou de produits
    pétroliers entre l''Italie et les autres Etats membres prévu par la décision
    79/589/CEE et par la décision 79/858/CEE (Le texte en langue italienne est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/123/EWG: Entscheidung der Kommission vom 21. Dezember 1979 zur Verlängerung
    der Geltungsdauer des in der Entscheidung 79/589/EWG und der Entscheidung 79/858/EWG
    vorgesehenen Systems automatisch erteilter Genehmigungen von Ausfuhren von Rohöl
    und/oder Erdölerzeugnissen zwischen Italien und den anderen Mitgliedstaaten (Nur
    der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/123/EØF: Kommissionens beslutning af 21. december 1979 om forlængelse
    af ordningen med licenser for samhandelen med mineralolie og/eller mineralolieprodukter
    mellem Italien og de øvrige medlemsstater som fastsat i beslutning 79/589/EØF
    og i beslutning 79/858/EØF (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/123/CEE: Decisione della Commissione, del 21 dicembre 1979, che proroga
    il sistema di autorizzazione per gli scambi di petrolio greggio e/o di prodotti
    petroliferi tra l''Italia e gli altri Stati membri previsto dalla decisione 79/589/CEE
    e dalla decisione 79/858/CEE (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/123/EEG: Beschikking van de Commissie van 21 december 1979 tot verlenging
    van de geldigheidsduur van het vergunningstelsel voor het handelsverkeer van ruwe
    aardolie en/of aardolieprodukten tussen Italië en de andere Lid-Staten, neergelegd
    in Beschikking 79/589/EEG en in Bsschikking 79/858/EEG (Slechts de tekst in de
    Italiaanse taal is authentiek)'
  type: main
