    822/87 des Rates zu liefernden Prozentsatzes der Tafelweinerzeugung für das Wirtschaftsjahr
    1993/94 für die Regionen 3 und 6
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 465/94 af 1. marts 1994 om fastsættelse
