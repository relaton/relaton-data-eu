    περίοδο 1993/94, των ποσοστών της παραγωγής επιτραπέζιου
    οίνου που παραδίδονται στην υποχρεωτική απόσταξη
    που αναφέρεται στο άρθρο 39 του κανονισμού (ΕΟΚ)
    αριθ. 822/87 του Συμβουλίου για τις περιοχές 3
