    pour l'accord conclu le 26 mai 1969 entre la France et l'URSS
  type: main
- language: de
  script: Latn
  content: '69/265/EWG: Entscheidung des Rates vom 1. August 1969 zur Abweichung von
    der am 9. Oktober 1961 getroffenen Entscheidung über die Vereinheitlichung der
    Laufzeit der Handelsabkommen hinsichtlich des am 26. Mai 1969 zwischen Frankreich
    und der UdSSR geschlossenen Handelsabkommens'
  type: main
- language: it
  script: Latn
  content: '69/265/CEE: Decisione del Consiglio, del 1 agosto 1969, recante deroga
    alla decisione del 9 ottobre 1961 relativa all''uniformazione della durata degli
    accordi commerciali, per quanto concerne l''accordo concluso il 26 maggio 1969
    fra la Francia e l''URSS'
  type: main
- language: nl
  script: Latn
  content: '69/265/EEG: Beschikking van de Raad van 1 augustus 1969 houdende afwijking
    van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden, voor het op 26 mei 1969 tussen Frankrijk en de USSR gesloten
    akkoord'
