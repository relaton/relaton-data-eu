title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2067/71 of the Council of 27 September 1971 amending
    Regulation (EEC) No 1060/69 fixing the quantities of basic products considered
    to have been used in the manufacture of goods covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2067/71 du Conseil, du 27 septembre 1971, modifiant
    le règlement (CEE) n° 1060/69 fixant les quantités de produits de base considérées
    comme étant entrées dans la fabrications des marchandises relevant du règlement
    (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2067/71 des Rates vom 27. September 1971 zur Änderung
    der Verordnung (EWG) Nr. 1060/69 zur Festlegung der Grunderzeugnismengen, bei
    denen davon ausgegangen werden kann, daß sie zur Herstellung der unter die Verordnung
    (EWG) Nr. 1059/69 fallenden Waren verwendet worden sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2067/71 af 27. september 1971 om ændring
    af forordning (EØF) nr. 1060/69 om fastsættelse af de basisproduktmængder,
    som forudsættes anvendt ved fremstilling af de af forordning (EØF) nr. 1059/69
    omfattede varer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2067/71 τού Συμβουλίου
    τής 27ης Σεπτεμβρίου 1971 περί τροποποιήσεως
    τού κανονισμού (ΕΟΚ) αριθ. 1060/69 «περί καθορισμού
    τών ποσοτήτων προϊόντων βάσεως πού θεωρούνται
    ότι έχουν χρησιμοποιηθεί στήν παρασκευή εμπορευμάτων
    τά οποία υπάγονται στόν κανονισμό (ΕΟΚ) αριθ.
    1059/69»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2067/71 del Consiglio, del 27 settembre 1971, che
    modifica il regolamento (CEE) n. 1060/69 relativo alla fissazione dei quantitativi
    di prodotti di base che si considerano entrati nella fabbricazione delle merci
    cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2067/71 van de Raad van 27 september 1971 houdende
    wijziging van Verordening nr. 1060/69 tot vaststelling van de hoeveelheden basisprodukten
    die worden geacht bij de vervaardiging van de onder Verordening (EEG) nr. 1059/69
    vallende goederen te zijn gebruikt
  type: main
