- language: en
  script: Latn
  content: Commission Regulation (EEC) No 810/84 of 29 March 1984 re-establishing
    the levying of customs duties on dodecylbenzene, falling within subheading 38.19
    ex E and originating in Argentina, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 810/84 de la Commission du 29 mars 1984 portant rétablissement
    de la perception des droits de douane applicables au dodécylbenzène, de la sous-position
    38.19 ex E du tarif douanier commun, originaire de l' Argentine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 810/84 der Kommission vom 29. März 1984 zur Wiedereinführung
