    entidades associadas à rede Al-Qaida
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/13 al Comisiei din 6 ianuarie
    2016 de modificare pentru a 240-a oară a Regulamentului (CE) nr. 881/2002 al
    Consiliului de instituire a unor măsuri restrictive specifice împotriva anumitor
    persoane și entități asociate cu rețeaua Al-Qaida
  type: main
- language: sk
  script: Latn
