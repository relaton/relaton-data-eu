title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/13 of 6 January 2016 amending
    for the 240th time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with the Al-Qaeda network
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/13 de la Commission du 6 janvier 2016
    modifiant pour la deux cent quarantième fois le règlement (CE) n° 881/2002
    du Conseil instituant certaines mesures restrictives spécifiques à l'encontre
    de certaines personnes et entités liées au réseau Al-Qaida
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/13 der Kommission vom 6. Januar 2016
    zur 240. Änderung der Verordnung (EG) Nr. 881/2002 des Rates über die Anwendung
    bestimmter spezifischer restriktiver Maßnahmen gegen bestimmte Personen und Organisationen,
    die mit dem Al-Qaida-Netzwerk in Verbindung stehen
  type: main
- language: bg
