title:
- language: fr
  script: Latn
  content: '68/138/CEE: Décision du Conseil du 29 février 1968, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de fils
    de lin écrus (à l''exclusion des fils d''étoupes) mesurant au kilogramme 30.000
    mètres ou moins destinés à la fabrication de fils retors ou câbles pour l''industrie
    de la chaussure et pour ligaturer les câbles de la position Ex 54.03 B I A) du
    Tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '68/138/EWG: Entscheidung des Rates vom 29. Februar 1968 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Leinengarne, roh
    (ausgenommen Garne aus Flachswerg), der Tarifnummer ex 54.03 B I a) des Gemeinsamen
    Zolltarifs, mit einer Lauflänge je kg von 30 000 m oder weniger, zum Herstellen
    von gezwirnten Garnen für die Schuhindustrie oder von gezwirnten Kabelabbindegarnen'
  type: main
- language: it
  script: Latn
  content: '68/138/CEE: Decisione del Consiglio, del 29 febbraio 1968, relativa all''apertura,
    alla suddivisione ed alle modalità di gestione del contingente tariffario comunitario
    di filati di lino greggi (ad esclusione dei filati di stoppa) che misurano per
    ogni chilogrammo 30.000 metri o meno, destinati alla fabbricazione di filati ritorti
    o ritorti su ritorto (câblés) per l''industria delle calzature e per la legatura
    dei cavi, della voce ex 54.03 B I a) della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '68/138/EEG: Beschikking van de Raad van 29 februari 1968 houdende opening,
    verdeling en wijze van beheer van het communautaire tariefcontingent voor garens
    van vlas, ongebleekt (met uitzondering van garens van werk), metende per kilogram
    30.000 meter of minder, bestemd voor de vervaardiging van getwijnde of gekabelde
    garens voor de schoenindustrie en voor het omwikkelen van kabels, van post ex
    54.03 B I a) van het gemeenschappelijk douanetarief'
  type: main
