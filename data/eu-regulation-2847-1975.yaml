    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2847/75 af 31. oktober 1975 om fastsættelse
