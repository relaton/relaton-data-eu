  content: Regulation (EEC) No 2847/75 of the Commission of 31 October 1975 fixing
    the rates of the refunds applicable from 1 November 1975 to certain cereals and
    rice products exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2847/75 de la Commission, du 31 octobre 1975, fixant
    les taux des restitutions applicables, à compter du 1er novembre 1975, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2847/75 der Kommission vom 31. Oktober 1975 zur Festsetzung
