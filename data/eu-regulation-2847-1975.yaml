    fra korn- og rissektoren- der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2847/75 della Commissione, del 31 ottobre 1975, che
