  content: Council Regulation (EEC) No 3427/89 of 30 October 1989 amending Regulation
    (EEC) No 1408/71 on the application of social security schemes to employed persons,
    to self- employed persons and to members of their families moving within the Community
    and Regulation (EEC) No 574/72 laying down the procedure for implementing Regulation
    (EEC) No 1408/71
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3427/89 du Conseil du 30 octobre 1989 modifiant le
    règlement (CEE) n° 1408/71 relatif à l'application des régimes de sécurité
    sociale aux travailleurs salariés, aux travailleurs non salariés et aux membres
    de leur famille qui se déplacent à l'intérieur de la Communauté, et le règlement
    (CEE) n° 574/72 fixant les modalités d'application du règlement (CEE) n° 1408/71
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3427/89 DES RATES vom 30. Oktober 1989 zur Änderung
    der Verordnung (EWG) Nr. 1408/71 zur Anwendung der Systeme der sozialen Sicherheit
    auf Arbeitnehmer und Selbständige sowie deren Familienangehörige, die innerhalb
    der Gemeinschaft zu- und abwandern, und zur Änderung der Verordnung (EWG) Nr.
    574/72 über die Durchführung der Verordnung (EWG) Nr. 1408/71 #'
  type: main
- language: da
  script: Latn
