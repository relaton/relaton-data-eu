    μέ τήν ονομασία «Apollo—Tunable CO² Laser, model 560» δέν
    δύναται νά πραγματοποιηθεί ατελώς ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/648/CEE: Decisione della Commissione, del 10 settembre 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Apollo - Tunable CO2 Laser,
    model 560" non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/648/EEG: Beschikking van de Commissie van 10 september 1982 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,Apollo-Tunable CO2 Laser, model 560"
    niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag
    worden ingevoerd'
  type: main
