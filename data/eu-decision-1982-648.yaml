title:
- language: en
  script: Latn
  content: '82/648/EEC: Commission Decision of 10 September 1982 establishing that
    the apparatus described as ''Apollo - Tunable CO2 Laser, model 560'' may not be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/648/CEE: Décision de la Commission, du 10 septembre 1982, constatant
    que l''importation de l''appareil dénommé "Apollo - Tunable CO2 Laser, model
    560" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/648/EWG: Entscheidung der Kommission vom 10. September 1982, mit der
    festgestellt wird, daß das Gerät ,,Apollo-Tunable CO2 Laser, model 560" nicht
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/648/EØF: Kommissionens beslutning af 10. september 1982 om fastslåelse
    af, at indførsel af apparatet "Apollo - Tunable CO2 Laser, model 560" ikke kan
    ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/648/EOK: Απόφαση τής Επιτροπής τής 10ης Σεπτεμβρίου
