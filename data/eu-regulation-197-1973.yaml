title:
- language: en
  script: Latn
  content: Regulation (EEC) No 197/73 of the Commission of 29 December 1972 supplementing
    Regulation (EEC) No 2510/71 on detailed rules for the subsidy for olive oil to
    take account of the accession of new Member States to the Communities
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 197/73 de la Commission, du 29 décembre 1972, complétant
    le règlement (CEE) n° 2510/71 relatif aux modalités concernant l' aide pour
    l' huile d' olive, du fait de l' adhésion de nouveaux États membres à la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 197/73 der Kommission vom 29. Dezember 1972, mit der
    die Verordnung (EWG) Nr. 2510/71 über Einzelheiten betreffend die Beihilfe für
    Olivenöl als Folge des Beitritts neuer Mitgliedstaaten zur Gemeinschaft ergänzt
    wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 197/73 af 29. december 1972 om supplering
    af forordning (EØF) nr. 2510/71 om gennemførelsesbestemmelser vedrørende støtte
    til olivenolie, som følge af de nye medlemsstaters tiltrædelse af Fællesskabet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 197/73 della Commissione, del 29 dicembre 1972, che
    completa, a seguito dell' adesione di nuovi Stati membri alla Comunità, il regolamento
    (CEE) n. 2510/71 relativo alle modalità riguardanti l' integrazione per l' olio
    d' oliva
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 197/73 van de Commissie van 29 december 1972 waarbij
    Verordening (EEG) nr. 2510/71 houdende nadere regelen betreffende de steunregeling
    voor olijfolie wordt aangevuld naar aanleiding van de toetreding van nieuwe Lid-Staten
    tot de Gemeenschap
  type: main
