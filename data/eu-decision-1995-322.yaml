    u 93/196/KEE u 93/197/KEE rigward il-kondizzjonijiet tas-saħħa ta' l-annimali
    u ċ-ċertfikazzjoni veterinarja għad-dħul temporanju u għad-dħul mill-ġdid
    taż-żwiemel irreġistrati u l-importazzjonijiet fil-Komunità ta' l-ekwidi għall-qatla,
    l-ekwidi rreġistrati u l-ekwidi għar-razza u għall-produzzjoni mill-Marokk
  type: main
