  content: '95/322/CE: Decisione della Commissione, del 25 luglio 1995, che modifica
    la decisione 79/542/CEE del Consiglio e le decisioni 92/260/CEE, 93/195/CEE, 93/196/CEE
    e 93/197/CEE della Commissione per quanto concerne le condizioni di polizia sanitaria
    e la certificazione veterinaria cui sono subordinate l''ammissione temporanea
    e la reintroduzione di cavalli registrati, nonché le importazioni nella Comunità
    di equidi da macello, di equidi registrati, di equidi da riproduzione e produzione
    dal Marocco'
  type: main
- language: lv
