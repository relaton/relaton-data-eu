    attiecībā uz dzīvnieku veselības nosacījumiem un veterināro sertifikāciju
    reģistrētu zirgu ievešanai uz laiku, atpakaļievešanai pēc tam, kad tie uz
    laiku izvesti, un nokaušanai paredzētu zirgu dzimtas dzīvnieku, reģistrētu
    zirgu dzimtas dzīvnieku un nobarošanai un pavairošanai paredzētu zirgu dzimtas
    dzīvnieku ievedumiem Kopienā no Marokas
  type: main
