    93/196/EEG en 93/197/EEG van de Commissie ten aanzien van de veterinairrechtelijke
    voorschriften en de voorschriften inzake veterinaire certificering voor de tijdelijke
    toelating en het opnieuw binnenbrengen van geregistreerde paarden en de invoer
