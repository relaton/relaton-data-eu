    79/542/EEZ i odluka Komisije 92/260/EEZ, 93/195/EEZ, 93/196/EEZ i 93/197/EEZ o
    uvjetima zdravlja životinja i veterinarskom certificiranju za privremeni ulazak
    registriranih konja i uvoz u Zajednicu kopitara za klanje, registriranih kopitara
    i kopitara za rasplod i proizvodnju iz Maroka'
  type: main
- language: hu
  script: Latn
