    ale Comisiei în ceea ce privește condițiile de sănătate și certificarea
    sanitar-veterinară necesare pentru admiterea temporară și reintroducerea cailor
    înregistrați și pentru importurile în Comunitate de ecvidee destinate sacrificării,
    ecvidee înregistrate și ecvidee de reproducere și de producție provenind din
    Maroc
  type: main
