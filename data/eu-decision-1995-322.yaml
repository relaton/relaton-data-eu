    Rady 79/542/EHS a rozhodnutia Komisie 92/260/EHS, 93/195/EHS, 93/196/EHS a 93/197/EHS
    vzhľadom na podmienky týkajúce sa zdravia zvierat a veterinárnu certifikáciu
    pre dočasný vstup a opakovaný vstup registrovaných koní a dovozy do spoločenstva
    koňovitých zvierat (equidae) určených na zabitie, registrovaných, chovných
    a úžitkových equidae z Maroka
  type: main
