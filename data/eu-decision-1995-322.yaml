    vágásra szánt, továbbá tenyésztési és termelési célú lófélék közösségi
    behozatalára irányadó állat-egészségügyi feltételek és állatorvosi bizonyítványok
    kiállítása tekintetében a 79/542/EGK tanácsi határozat és a 92/260/EGK,
    93/195/EGK, 93/196/EGK és 93/197/EGK bizottsági határozatok módosításáról
  type: main
