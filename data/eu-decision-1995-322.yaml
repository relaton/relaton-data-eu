title:
- language: en
  script: Latn
  content: '95/322/EC: Commission Decision of 25 July 1995 amending Council Decision
    79/542/EEC and Commission Decisions 92/260/EEC, 93/195/EEC, 93/196/EEC and 93/197/EEC
    with regard to the animal health conditions and veterinary certification for the
    temporary admission and re-entry of registered horses and imports into the Community
    of equidae for slaughter, registered equidae and equidae for breeding and production
    from Morocco'
  type: main
- language: fr
  script: Latn
  content: '95/322/CE: Décision de la Commission, du 25 juillet 1995, modifiant la
    décision 79/542/CEE du Conseil et les décisions 92/260/CEE, 93/195/CEE, 93/196/CEE
    et 93/197/CEE de la Commission en ce qui concerne les conditions sanitaires et
    la certification sanitaire requises pour l''admission temporaire et la réadmission
    de chevaux enregistrés et pour les importations dans la Communauté d''équidés
    de boucherie, d''équidés enregistrés et d''équidés d''élevage et de rente
    en provenance du Maroc'
  type: main
- language: de
  script: Latn
  content: '95/322/EG: Entscheidung der Kommission vom 25. Juli 1995 zur Änderung
    der Entscheidung 79/542/EWG des Rates und der Entscheidungen 92/260/EWG, 93/195/EWG,
    93/196/EWG und 93/197/EWG der Kommission über die tierseuchenrechtlichen Bedingungen
    und die Beurkundung für die vorübergehende Einfuhr und die Wiedereinfuhr von
    registrierten Pferden und die Einfuhr in die Gemeinschaft von Schlachtequiden,
    registrierten Equiden sowie Zucht- und Nutzequiden aus Marokko'
  type: main
