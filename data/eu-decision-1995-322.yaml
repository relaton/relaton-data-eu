    Rady 79/542/EHS a rozhodnutí Komise 92/260/EHS, 93/195/EHS, 93/196/EHS a 93/197/EHS,
    pokud jde o veterinární podmínky a veterinární osvědčení pro dočasný
    dovoz a zpětný dovoz evidovaných koní a pro dovoz jatečných koňovitých,
    evidovaných koňovitých a plemenných a užitkových koňovitých z Maroka do
    Společenství
  type: main
