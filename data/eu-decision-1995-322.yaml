    og 93/197/EØF for så vidt angår dyresundhedsmæssige betingelser og bestemmelser
    om udstedelse af sundhedscertifikat for midlertidig indførsel og genindførsel
    af registrerede heste og indførsel til Fællesskabet af enhovede slagtedyr, registrerede
    enhovede dyr og enhovede avls- og brugsdyr fra Marokko'
