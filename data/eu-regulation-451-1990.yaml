  content: Commission Regulation (EEC) No 451/90 of 22 February 1990 laying down transitional
    measures for the 1989/90 marketing year regarding production aid for olive oil
    in Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 451/90 de la Commission du 22 février 1990 prévoyant
