    στην παραγωγή ελαιολάδου στην Ισπανία και
    στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 451/90 DELLA COMMISSIONE del 22 febbraio 1990 che
    stabilisce misure transitorie per la campagna 1989/1990 in materia di aiuto alla
    produzione di olio d'oliva in Spagna e in Portogallo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 451/90 VAN DE COMMISSIE van 22 februari 1990 houdende
