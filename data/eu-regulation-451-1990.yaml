    von Olivenoel in Spanien und Portugal
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 451/90 af 22. februar 1990 om fastsættelse
    af overgangsforanstaltninger for produktionsåret 1989/90 for ydelse af støtte
    til produktion af olivenolie i Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 451/90 της Επιτροπής
