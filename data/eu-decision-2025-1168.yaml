    la convention du Conseil de l’Europe sur la prévention et la lutte contre la
    violence à l’égard des femmes et la violence domestique, lors de sa 18e réunion,
    au sujet des recommandations et conclusions adressées à certaines parties et
    portant sur la mise en œuvre par elles de ladite convention, en ce qui concerne
    les questions liées à la coopération judiciaire en matière pénale, à l’asile
    et au non-refoulement
  type: main
