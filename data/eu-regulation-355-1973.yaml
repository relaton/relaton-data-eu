title:
- language: en
  script: Latn
  content: Regulation (EEC) No 355/73 of the Commission of 12 February 1973 repealing
    Regulation (EEC) No 7/73 applying the duty in the Common Customs Tariff to mandarines,
    satsumas, clementines, tangerines and other similar citrus hybrids originating
    in Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 355/73 de la Commission, du 12 février 1973, abrogeant
    le règlement (CEE) n° 7/73 portant application du droit du tarif douanier commun
    aux importations de mandarines, satsumas, clémentines, tangerines et autres hybrides
    similaires d' agrumes originaires d' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 355/73 der Kommission vom 12. Februar 1973 zur Aufhebung
    der Verordnung (EWG) Nr. 7/73 zur Anwendung des Zollsatzes des Gemeinsamen Zolltarifs
    auf Einfuhren von Mandarinen, Satsumas, Clementinen, Tangerinen und anderen ähnlichen
    Kreuzungen von Zitrusfrüchten mit Ursprung in Spanien
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF, nr. 355/73 af 12. februar 1973 om omhævelse
    af forordning (EØF) nr. 7/73 om anvendelse af toldsatsen i den fælles toldtarif
    på indførsler af mandariner, satsumas, clementiner, tangeringer og andre lignende
    hybrider af citrusfrugter med oprindelse i Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 355/73 della Commissione, del 12 febbraio 1973, che
    abroga il regolamento (CEE) n. 7/73 relativo all' applicazione del dazio della
    tariffa doganale comune alle importazioni di mandarini, satsuma, clementine, tangerini
    e altri ibridi similari d' agrumi originari della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 355/73 van de Commissie van 12 februari 1973 tot
    intrekking van Verordening (EEG) nr. 7/73 houdende toepassing van het recht van
    het gemeenschappelijk douanetarief op de invoer van mandarijnen, satsuma' s, clementines,
    tangerines en andere dergelijke kruisingen van citrusvruchten van oorsprong uit
    Spanje
