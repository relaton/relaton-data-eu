  content: Commission Regulation (EEC) No 763/86 of 14 March 1986 re-establishing
    the levying of customs duties on clocks with watch movements, falling within heading
    No 91.02 originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3599/85 apply
  type: main
