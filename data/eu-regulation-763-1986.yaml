    Gemeinsamen Zolltarifs mit Ursprung in Hongkong, dem die in der Verordnung (EWG)
    Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 763/86 af 14. marts 1986 om genindførelse
