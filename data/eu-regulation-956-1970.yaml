title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 956/70 du Conseil, du 26 mai 1970, portant suspension
    temporaire du droit autonome du tarif douanier commun applicable aux dattes présentées
    en emballages immédiats d'un contenu net inférieur ou égal à 35 Kg et destinées,
    sous contrôle douanier ou administratif équivalent, à être conditionnées
    pour la vente au détail, de la sous-position EX 08.01 A
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 956/70 des Rates vom 26. Mai 1970 über die zeitweilige
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für Datteln in
    unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 35 kg oder weniger,
    unter zollamtlicher oder verwaltungsmäßig gleichwertiger Überwachung zum Verpacken
    in Aufmachungen für den Einzelverkauf bestimmt, der Tarifstelle ex 08.01 A
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 956/70 del Consiglio, del 26 maggio 1970, recante
    sospensione temporanea del dazio autonomo della tariffa doganale comune sui datteri
    presentati in imballaggi immediati di contenuto netto inferiore o pari a 35 kg
    e destinati, sotto controllo doganale o amministrativo equivalente, ad essere
    condizionati per la vendita al minuto, della sottovoce ex 08.01 A
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 956/70 van de Raad van 26 mei 1970 houdende tijdelijke
    schorsing van het autonome recht van het gemeenschappelijk douanetarief voor dadels,
    in onmiddellijke verpakkingen met een netto-inhoud van 35 kg of minder, bestemd
    om onder douane- of overeenkomstig administratief toezicht voor de verkoop in
    het klein te worden verpakt, van onderverdeling ex 08.01 A
  type: main
