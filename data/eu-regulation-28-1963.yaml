title:
- language: fr
  script: Latn
  content: Règlement n° 28/63/CEE de la Commission du 27 mars 1963 portant prorogation
    de la durée de validité du règlement n 73 de la Commission et fixation des
    prix d'écluse applicables aux oeufs dépourvus de leurs coquilles et les jaunes
    d'oeufs de volailles de basse-cour, propres à des usages alimentaires, frais,
    conservés, séchés ou sucrés, du 1er avril au 30 juin 1963
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 28/63/EWG der Kommission vom 27. März 1963 über die Verlängerung
    der Geltungsdauer der Verordnung Nr. 73 der Kommission und zur Festsetzung der
    Einschleusungspreise für Eier ohne Schale und Eigelb von Hausgeflügel, genießbar,
    frisch, haltbar gemacht, getrocknet oder gezuckert, für die Zeit vom 1. April
    1963 bis zum 30. Juni 1963
  type: main
- language: it
  script: Latn
  content: Regolamento n. 28/63/CEE della Commissione del 27 marzo 1963 che proroga
    il termine di applicazione del regolamento n. 73 della Commissione e che fissa
    i prezzi limite per le uova sgusciate e il giallo d'uova di volatili da cortile,
    atti ad usi alimentari, freschi, conservati, essiccati o con aggiunta di zuccheri,
    per il periodo 1 aprile - 30 giugno 1963
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 28/63/EEG van de Commissie van 27 maart 1963 houdende verlenging
    van de geldigheidsduur van Verordening Nr. 73 van de Commissie en vaststelling
    van de sluisprijzen voor eieren uit de schaal en eigeel, van pluimvee, geschikt
    voor menselijke consumptie, vers, verduurzaamd, gedroogd of met toegevoegde suiker,
    voor de periode van 1 april tot en met 30 juni 1963
  type: main
