    Κοινοβουλίου και του Συμβουλίου [κοινοποιηθείσα
    υπό τον αριθμό C(2021) 268] (Το κείμενο στην ολλανδική
    γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/65, 22. jaanuar 2021, millega lubatakse
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EÜ) nr 1829/2003 lasta
    turule geneetiliselt muundatud maisi MON 87427 × MON 89034 × MIR162 × MON 87411
