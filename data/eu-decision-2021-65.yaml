    (Ainult hollandikeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/65, annettu 22 päivänä
    tammikuuta 2021, muuntogeenistä maissia MON 87427 × MON 89034 × MIR162 × MON
    87411 ja yksittäisistä geenimuunnostapahtumista MON 87427, MON 89034, MIR162
    ja MON 87411 kahta tai kolmea yhdistelemällä muodostettua muuntogeenistä maissa
    sisältävien, siitä koostuvien tai siitä valmistettujen tuotteiden markkinoille
    saattamisen sallimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o
    1829/2003 mukaisesti (tiedoksiannettu numerolla C(2021) 268) (Ainoastaan hollanninkielinen
    teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/65 оd 22. siječnja 2021. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    MON 87427 × MON 89034 × MIR162 × MON 87411, sastoje se ili su proizvedeni od
    njega, i genetski modificirani kukuruz u kojem se kombiniraju dvije ili tri od
    pojedinačnih promjena MON 87427, MON 89034, MIR162 i MON 87411, u skladu s Uredbom
    (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2021) 268) (Vjerodostojan je samo tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/65 végrehajtási határozata (2021. január 22.)
    a géntechnológiával módosított MON 87427 × MON 89034 × MIR162 × MON 87411
    kukoricát és a géntechnológiával módosított, a MON 87427, a MON 89034,
    a MIR162 és a MON 87411 egyszeres genetikai események közül kettőt vagy hármat
    ötvöző kukoricát tartalmazó, abból álló vagy abból előállított termékek
    forgalomba hozatalának az 1829/2003/EK európai parlamenti és tanácsi rendelet
    szerinti engedélyezéséről (az értesítés a C(2021) 268. számú dokumentummal
    történt) (Csak a holland nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/65 della Commissione del 22 gennaio 2021
    che autorizza l’immissione in commercio di prodotti contenenti, costituiti o
    derivati dal granturco geneticamente modificato MON 87427 × MON 89034 × MIR162
    × MON 87411 e dal granturco geneticamente modificato che combina due o tre dei
    singoli eventi MON 87427, MON 89034, MIR162 e MON 87411 a norma al regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero
    C(2021) 268] (Il testo in lingua neerlandese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/65 (2021. gada 22. janvāris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu MON 87427
    × MON 89034 × MIR162 × MON 87411 un ģenētiski modificēto kukurūzu, kurā
    kombinēti divi vai trīs vienkārši notikumi MON 87427, MON 89034, MIR162 un
    MON 87411, no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta numuru
    C(2021) 268) (Autentisks ir tikai teksts nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/65 2021 m. sausio 22 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    MON 87427 × MON 89034 × MIR162 × MON 87411 ir genetiškai modifikuotų kukurūzų,
    sudarytų iš dviejų ar trijų atskirų MON 87427, MON 89034, MIR162 ir MON 87411
    transformacijos įvykių kombinacijų, kurie iš šių kukurūzų sudaryti arba
    pagaminti (pranešta dokumentu Nr. C(2021) 268) (Tekstas autentiškas tik nyderlandų
    kalba)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/65 tat-22
    ta’ Jannar 2021 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom, li
    jikkonsistu jew li huma prodotti mill-qamħirrum modifikat ġenetikament MON 87427
    × MON 89034 × MIR162 × MON 87411, u mill-qamħirrun modifikat ġenetikament
    li jikkombina tnejn jew tlieta mill-eventi uniċi MON 87427, MON 89034, MIR162
    u MON 87411, skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill
    (notifikata bid-dokument C(2021) 268) (It-test bl-Olandiż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/65 van de Commissie van 22 januari 2021 tot
    verlening van een vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MON 87427 × MON 89034 × MIR162 × MON 87411 en genetisch gemodificeerde
    maisrassen die twee of drie van de afzonderlijke transformatiestappen MON 87427,
    MON 89034, MIR162 en MON 87411 combineren, overeenkomstig Verordening (EG) nr.
    1829/2003 van het Europees Parlement en de Raad (Kennisgeving geschied onder nummer
    C(2021) 268) (Slechts de tekst in de Nederlandse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/65 z dnia 22 stycznia 2021 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    MON 87427 × MON 89034 × MIR162 × MON 87411 oraz rodzaje genetycznie zmodyfikowanej
    kukurydzy łączące dwie lub trzy modyfikacje MON 87427, MON 89034, MIR162 i
    MON 87411, produktów składających się z wymienionych rodzajów genetycznie
    zmodyfikowanej kukurydzy lub z niej wyprodukowanych (notyfikowana jako dokument
    nr C(2021) 268) (Jedynie tekst w języku niderlandzkim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/65 da Comissão de 22 de janeiro de 2021
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado MON 87427 ×
    MON 89034 × MIR162 × MON 87411 e milho geneticamente modificado combinando dois
    ou três dos eventos únicos MON 87427, MON 89034, MIR162 e MON 87411 nos termos
    do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e do Conselho [notificada
    com o número C(2021) 268] (Apenas faz fé o texto na língua neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/65 a Comisiei din 22 ianuarie
    2021 de autorizare a introducerii pe piață a produselor care conțin, constau
    în sau sunt fabricate din porumb modificat genetic MON 87427 × MON 89034 ×
    MIR162 × MON 87411 și din porumb modificat genetic obținut din combinarea a
    două sau trei dintre evenimentele de transformare MON 87427, MON 89034, MIR162
    și MON 87411 în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European
    și al Consiliului [notificată cu numărul C(2021) 268] (Numai textul în limba
    neerlandeză este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/65 z 22. januára 2021, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú kukuricu
    MON 87427 × MON 89034 × MIR162 × MON 87411 a geneticky modifikovanú kukuricu
    obsahujúcu kombináciu dvoch alebo troch genetických modifikácií MON 87427,
    MON 89034, MIR162 a MON 87411, sú z nich zložené alebo vyrobené [oznámené
    pod číslom C(2021) 268] (Iba holandské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/65 z dne 22. januarja 2021 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MON 87427 ×
    MON 89034 × MIR162 × MON 87411, so iz nje sestavljeni ali proizvedeni, in gensko
    spremenjeno koruzo, v kateri sta združena dva ali trije od dogodkov MON 87427,
    MON 89034, MIR162 in MON 87411, v skladu z Uredbo (ES) št. 1829/2003 Evropskega
    parlamenta in Sveta (notificirano pod dokumentarno številko C(2021) 268) (Besedilo
    v nizozemskem jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/65 de la Comisión de 22 de enero de
    2021 por la que se autoriza la comercialización de los productos que contengan,
    estén compuestos o hayan sido producidos a partir de maíz modificado genéticamente
    MON 87427 × MON 89034 × MIR162 × MON 87411 o maíz modificado genéticamente
    que combine dos o tres de los eventos únicos MON 87427, MON 89034, MIR162 y MON
    87411, de conformidad con el Reglamento (CE) n.o 1829/2003 del Parlamento Europeo
    y del Consejo [notificada con el número C(2021) 268] (El texto en lengua neerlandesa
    es el único auténtico)
  type: main
