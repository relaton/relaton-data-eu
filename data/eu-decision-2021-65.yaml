id: EUDecision202165
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/65 of 22 January 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 87427 × MON 89034 × MIR162 × MON 87411 and genetically
    modified maize combining two or three of the single events MON 87427, MON 89034,
    MIR162 and MON 87411 pursuant to Regulation (EC) No 1829/2003 of the European
    Parliament and of the Council (notified under document C(2021) 268) (Only the
    Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/65 de la Commission du 22 janvier 2021
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MON 87427 × MON 89034 × MIR162 × MON 87411 et du maïs génétiquement
    modifié combinant deux ou trois des événements simples MON 87427, MON 89034,
    MIR162 et MON 87411, consistant en ces maïs ou produits à partir de ceux-ci,
    en application du règlement (CE) no 1829/2003 du Parlement européen et du Conseil
    [notifiée sous le numéro C(2021) 268] (Le texte en langue néerlandaise est
    le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/65 der Kommission vom 22. Januar 2021
    zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte MON 87427 × MON 89034 × MIR162 × MON 87411 enthalten, aus ihm
    bestehen oder aus ihm hergestellt werden, und von genetisch verändertem Mais,
    bei dem zwei oder drei der Einzelereignisse MON 87427, MON 89034, MIR162 und MON
    87411 kombiniert werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2021) 268) (Nur
    der niederländische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/65 на Комисията
    от 22 януари 2021 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица MON 87427 × MON 89034 × MIR162 × MON 87411 и генетично
    модифицирана царевица, съвместяваща две или
    три от единичните събития MON 87427, MON 89034, MIR162 и
    MON 87411, в съответствие с Регламент (ЕО) № 1829/2003
    на Европейския парламент и на Съвета (нотифицирано
    под номер C(2021) 268) (само текстът на нидерландски
    език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/65, ze dne 22. ledna 2021 o povolení
    uvádění produktů, které obsahují geneticky modifikovanou kukuřici MON 87427
    × MON 89034 × MIR162 × MON 87411 a geneticky modifikovanou kukuřici kombinující
    dvě nebo tři z jednoduchých událostí MON 87427, MON 89034, MIR162 a MON 87411,
    sestávají z nich nebo jsou z nich vyrobeny, na trh podle nařízení Evropského
    parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2021) 268) (Pouze
    nizozemské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/65 af 22. januar 2021
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret MON 87427 × MON 89034 × MIR162 × MON
    87411-majs og genetisk modificeret majs, der kombinerer to eller tre af begivenheder
    MON 87427, MON 89034, MIR162 og MON 87411, i henhold til Europa-Parlamentets og
    Rådets forordning (EF) nr. 1829/2003 (meddelt under nummer C(2021) 268) (Kun
    den nederlandske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/65 της Επιτροπής
    της 22ας Ιανουαρίου 2021 για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    MON 87427 × MON 89034 × MIR162 × MON 87411 και γενετικώς τροποποιημένο
    αραβόσιτο που συνδυάζει δύο ή τρία από τα μονά
