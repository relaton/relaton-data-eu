  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/65 av den 22 januari 2021 om
    godkännande för utsläppande på marknaden av produkter som innehåller, består
    av eller har framställts av den genetiskt modifierade majsen MON 87427 × MON
    89034 × MIR162 × MON 87411 och av genetiskt modifierad majs som kombinerar två
    eller tre av de enskilda transformationshändelserna MON 87427, MON 89034, MIR162
    och MON 87411, i enlighet med Europaparlamentets och rådets förordning (EG)
    nr 1829/2003 (delgivet med nr C(2021) 268) (Endast den nederländska texten är
