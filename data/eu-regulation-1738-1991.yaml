- language: en
  script: Latn
  content: Council Regulation (EEC) No 1738/91 of 13 June 1991 fixing, for the 1991
    harvest, the norm and intervention prices and the premiums granted to purchasers
    of leaf tobacco, the derived intervention prices for baled tobacco, the reference
    qualities, the production areas and the guaranteed maximum quantities and amending
    Regulation (EEC) No 1331/90
  type: main
- language: fr
  script: Latn
