    accordées aux acheteurs de tabac en feuilles, les prix d'' intervention dérivés
    du tabac emballé, les qualités de référence, les zones de production ainsi
    que les quantités maximales garanties, et modifiant le règlement (CEE) no 1331/90
    #'
  type: main
