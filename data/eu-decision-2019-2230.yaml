    a continua aplicarea unei măsuri care derogă de la dispozițiile articolului
    26 alineatul (1) litera (a), ale articolului 168 și ale articolului 169 din Directiva
    2006/112/CE privind sistemul comun al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2019/2230 z 19. decembra 2019, ktorým
