title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2019/2230 of 19 December 2019 amending
    Decision 2007/884/EC authorising the United Kingdom to continue to apply a measure
    derogating from Articles 26(1)(a), 168 and 169 of Directive 2006/112/EC on the
    common system of value added tax
  type: main
- language: fr
