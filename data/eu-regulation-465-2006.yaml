title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 465/2006 of 21 March 2006 terminating the
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 408/2002 on imports of certain zinc oxides originating
    in the People's Republic of China by imports of certain zinc oxides consigned
    from Kazakhstan, whether declared as originating in Kazakhstan or not, and terminating
    the registration of such imports imposed by Regulation (EC) No 1289/2005
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 465/2006 de la Commission du 21 mars 2006 clôturant
    l'enquête sur le contournement possible des mesures antidumping instituées par
    le règlement (CE) n o 408/2002 du Conseil sur les importations de certains types
    d'oxyde de zinc originaires de la République populaire de Chine par des importations
    de certains types d'oxyde de zinc expédiés du Kazakhstan, qu'ils aient ou non
    été déclarés originaires de ce pays, et mettant fin à l'enregistrement de
    ces importations imposé par le règlement (CE) n o 1289/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 465/2006 der Kommission vom 21. März 2006 zur Einstellung
    der Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung (EG)
    Nr. 408/2002 des Rates eingeführten Antidumpingmaßnahmen gegenüber den Einfuhren
    bestimmter Zinkoxide mit Ursprung in der Volksrepublik China durch die Einfuhren
    bestimmter aus Kasachstan versandter Zinkoxide, ob als Ursprungserzeugnisse Kasachstans
    angemeldet oder nicht, und zur Einstellung der mit der Verordnung (EG) Nr. 1289/2005
    eingeführten zollamtlichen Erfassung der letztgenannten Einfuhren
  type: main
- language: cs
  script: Latn
