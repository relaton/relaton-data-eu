    mukaisesti tapahtuvan kirjaamisen lopettamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 465/2006/EK rendelete ( 2006. március 21. ) a Kínai Népköztársaságból
    származó egyes cink-oxidok behozataláról szóló 408/2002/EK tanácsi rendelet
    által kivetett dömpingellenes intézkedéseknek a Kazahsztánból feladott,
    akár Kazahsztánból származóként, akár nem ilyenként megjelölt, egyes
    cink-oxidok behozatala által megvalósuló esetleges kijátszására vonatkozó
    vizsgálat lezárásáról és az 1289/2005/EK rendelet által az ilyen behozatalra
    előírt nyilvántartásba-vételi kötelezettség eltörléséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 465/2006 della Commissione, del 21 marzo 2006 , che
    chiude l'inchiesta sulla possibile elusione delle misure antidumping istituite
    dal regolamento (CE) n. 408/2002 del Consiglio sulle importazioni di alcuni ossidi
    di zinco originari della Repubblica popolare cinese tramite importazioni di ossidi
    di zinco spediti dal Kazakstan, indipendentemente dal fatto che siano dichiarati
    o meno originari di tale paese, e che pone fine alla registrazione di dette importazioni,
    disposta dal regolamento (CE) n. 1289/2005
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 465/2006 ( 2006. gada 21. marts ), ar ko izbeidz
    izmeklēšanu par to antidempinga pasākumu iespējamo apiešanu, kuri ar Padomes
    Regulu (EK) Nr. 408/2002 noteikti dažu Ķīnas Tautas Republikas izcelsmes no
    Kazahstānas nosūtītu cinka oksīda veidu importam ar deklarētu vai nedeklarētu
    Kazahstānas izcelsmi, un ar ko izbeidz šāda importa reģistrāciju, kas noteikta
    ar Regulu (EK) Nr. 1289/2005
  type: main
- language: lt
  script: Latn
  content: 2006 m. kovo 21 d. Komisijos reglamentas (EB) Nr. 465/2006, nutraukiantis
    tyrimą dėl galimų antidempingo priemonių, įvestų Tarybos reglamentu (EB)
    Nr. 408/2002 dėl tam tikrų cinko oksidų, kurių kilmės šalis yra Kinijos
    Liaudies Respublika, importo, pažeidimų įvežant tam tikrus cinko oksidus iš
    Kazachstano, nepaisant to, ar oficialiai yra nurodoma, kad jų kilmės šalis
    yra Kazachstanas, ar ne, ir nutraukiantis Reglamentu (EB) Nr. 1289/2005 nustatytą
    tokio importo registravimą
