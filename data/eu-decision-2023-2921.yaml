    ta’ Sħubija stabbilit mill-Ftehim dwar il-Kummerċ u l-Kooperazzjoni bejn l-Unjoni
    Ewropea u l-Komunità Ewropea tal-Enerġija Atomika, minn naħa waħda, u r-Renju
    Unit tal-Gran Brittanja u l-Irlanda ta’ Fuq, min-naħa l-oħra, fir-rigward
    tar-regoli tranżizzjonali speċifiċi għall-prodott għall-akkumulaturi elettriċi
    u l-vetturi elettrifikati
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/2921 van de Raad van 21 december 2023 tot vaststelling
    van het standpunt dat namens de Europese Unie moet worden ingenomen in de Partnerschapsraad
    die is opgericht bij de Handels- en samenwerkingsovereenkomst tussen de Europese
    Unie en de Europese Gemeenschap voor Atoomenergie, enerzijds, en het Verenigd
    Koninkrijk van Groot-Brittannië en Noord-Ierland, anderzijds, betreffende de
    productspecifieke oorsprongsregels voor elektrische accu’s en elektrische voertuigen
    in de overgangsperiode
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2023/2921 z dnia 21 grudnia 2023 r. w sprawie stanowiska,
    jakie ma zostać zajęte w imieniu Unii Europejskiej w ramach Rady Partnerstwa
    ustanowionej Umową o handlu i współpracy między Unią Europejską i Europejską
    Wspólnotą Energii Atomowej, z jednej strony, a Zjednoczonym Królestwem Wielkiej
    Brytanii i Irlandii Północnej, z drugiej strony, w odniesieniu do przejściowych
    reguł pochodzenia dla akumulatorów elektrycznych i pojazdów z napędem elektrycznym
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2023/2921 do Conselho, de 21 de dezembro de 2023, que define
