    criado pelo Acordo de Comércio e Cooperação entre a União Europeia e a Comunidade
    Europeia da Energia Atómica, por um lado, e o Reino Unido da Grã Bretanha e
    da Irlanda do Norte, por outro, no que diz respeito às regras específicas por
    produto transitórias aplicáveis aos acumuladores e veículos elétricos
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2023/2921 a Consiliului din 21 decembrie 2023 de stabilire
    a poziției care urmează să fie adoptată în numele Uniunii Europene în cadrul
    Consiliului de parteneriat constituit prin Acordul comercial și de cooperare
    dintre Uniunea Europeană și Comunitatea Europeană a Energiei Atomice, pe de
    o parte, și Regatul Unit al Marii Britanii și Irlandei de Nord, pe de altă
    parte, în ceea ce privește regulile specifice produsului tranzitorii aplicabile
    acumulatoarelor electrice și vehiculelor electrificate
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/2921 z 21. decembra 2023, ktorým sa stanovuje
    pozícia, ktorá sa má v mene Európskej únie zaujať v Rade pre partnerstvo
    zriadenej Dohodou o obchode a spolupráci medzi Európskou úniou a Európskym
    spoločenstvom pre atómovú energiu na jednej strane a Spojeným kráľovstvom
    Veľkej Británie a Severného Írska na strane druhej, pokiaľ ide o prechodné
    špecifické pravidlá pre výrobky v prípade elektrických akumulátorov a elektrických
    vozidiel
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2023/2921 z dne 21. decembra 2023 o določitvi stališča,
    ki se v imenu Evropske unije zastopa v Partnerskem svetu, ustanovljenem s Sporazumom
    o trgovini in sodelovanju med Evropsko unijo in Evropsko skupnostjo za atomsko
    energijo na eni strani ter Združenim kraljestvom Velika Britanija in Severna
    Irska na drugi strani, glede prehodnih pravil za določen izdelek za električne
    akumulatorje in elektrificirana vozila
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2023/2921 del Consejo, de 21 de diciembre de 2023, por la
    que se establece la posición que debe adoptarse, en nombre de la Unión Europea,
    en el Consejo de Asociación creado por el Acuerdo de Comercio y Cooperación
    entre la Unión Europea y la Comunidad Europea de la Energía Atómica, por una
    parte, y el Reino Unido de Gran Bretaña e Irlanda del Norte, por otra, en lo
    que respecta a las normas transitorias específicas por productos para acumuladores
    eléctricos y vehículos eléctricos
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2023/2921 av den 21 december 2023 om fastställande
    av den ståndpunkt som ska intas på Europeiska unionens vägnar i det partnerskapsråd
    som inrättats genom handels- och samarbetsavtalet mellan Europeiska unionen och
    Europeiska atomenergigemenskapen, å ena sidan, och Förenade konungariket Storbritannien
    och Nordirland, å andra sidan, vad gäller de produktspecifika övergångsreglerna
    för elektriska ackumulatorer och elfordon
