  script: Latn
  content: Odluka Vijeća (EU) 2023/2921 od 21. prosinca 2023. o utvrđivanju stajališta
    koje treba zauzeti u ime Europske unije u okviru Vijeća za partnerstvo osnovanog
    Sporazumom o trgovini i suradnji između Europske unije i Europske zajednice za
    atomsku energiju, s jedne strane, i Ujedinjene Kraljevine Velike Britanije i Sjeverne
