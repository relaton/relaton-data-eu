    между Европейския съюз и Европейската общност
    за атомна енергия, от една страна, и Обединеното
    кралство Великобритания и Северна Ирландия,
    от друга страна, по отношение на преходните
    специфични за отделните продукти правила за
    електрически акумулатори и електрически автомобили
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/2921 ze dne 21. prosince 2023 o postoji, který
    má být zaujat jménem Evropské unie v Radě partnerství zřízené Dohodou
    o obchodu a spolupráci mezi Evropskou unií a Evropským společenstvím pro
    atomovou energii na jedné straně a Spojeným královstvím Velké Británie
    a Severního Irska na straně druhé, pokud jde o přechodná specifická pravidla
    původu pro elektrické akumulátory a elektrifikovaná vozidla
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2023/2921 af 21. december 2023 om den holdning,
    der skal indtages på Den Europæiske Unions vegne i Partnerskabsrådet, der er
    nedsat ved handels- og samarbejdsaftalen mellem Den Europæiske Union og Det Europæiske
    Atomenergifællesskab på den ene side og Det Forenede Kongerige Storbritannien
    og Nordirland på den anden side for så vidt angår midlertidige produktspecifikke
    regler for elektriske akkumulatorer og elektriske køretøjer
  type: main
