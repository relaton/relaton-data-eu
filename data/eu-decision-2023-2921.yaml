    ar Tirdzniecības un sadarbības nolīgumu starp Eiropas Savienību un Eiropas
    Atomenerģijas kopienu, no vienas puses, un Lielbritānijas un Ziemeļīrijas
    Apvienoto Karalisti, no otras puses, attiecībā uz konkrētiem ražojumiem piemērojamiem
    pārejas noteikumiem elektriskajiem akumulatoriem un elektrificētiem transportlīdzekļiem
  type: main
- language: lt
  script: Latn
  content: 2023 m. gruodžio 21 d. Tarybos sprendimas (ES) 2023/2921 dėl pozicijos,
