title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/2921 of 21 December 2023 establishing the position
    to be taken on behalf of the European Union within the Partnership Council established
    by the Trade and Cooperation Agreement between the European Union and the European
    Atomic Energy Community, of the one part, and the United Kingdom of Great Britain
    and Northern Ireland, of the other part, as regards the transitional product-specific
    rules for electric accumulators and electrified vehicles
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/2921 du Conseil du 21 décembre 2023 établissant la
    position à prendre, au nom de l’Union européenne, au sein du conseil de partenariat
    institué par l’accord de commerce et de coopération entre l’Union européenne
    et la Communauté européenne de l’énergie atomique, d’une part, et le Royaume-Uni
    de Grande-Bretagne et d’Irlande du Nord, d’autre part, en ce qui concerne
    les règles transitoires spécifiques aux produits pour les accumulateurs électriques
    et les véhicules électriques
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/2921 des Rates vom 21. Dezember 2023 zur Festlegung
    des im Namen der Europäischen Union in dem durch das Abkommen über Handel und
    Zusammenarbeit zwischen der Europäischen Union und der Europäischen Atomgemeinschaft
    einerseits und dem Vereinigten Königreich Großbritannien und Nordirland andererseits
    eingesetzten Partnerschaftsrat hinsichtlich der vorläufigen erzeugnisspezifischen
    Regeln für elektrische Akkumulatoren und Elektrofahrzeuge zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/2921 на Съвета от 21 декември
    2023 година за определяне на позицията, която
