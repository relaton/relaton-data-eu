    és Észak-Írország Egyesült Királysága közötti kereskedelmi és együttműködési
    megállapodással létrehozott partnerségi tanácsban az elektromos akkumulátorokra
    és az elektromos járművekre vonatkozó átmeneti termékspecifikus szabályok
    tekintetében az Európai Unió nevében képviselendő álláspont meghatározásáról
  type: main
