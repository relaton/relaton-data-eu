    in Thailand und Indonesien, denen die in der Verordnung (EWG) Nr. 3831/90 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 631/93 af 17. marts 1993 om genindførelse
