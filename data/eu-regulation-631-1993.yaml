  script: Latn
  content: Commission Regulation (EEC) No 631/93 of 17 March 1993 re- establishing
    the levying of customs duties on products falling within CN codes 6401 and 6402,
    originating in Thailand and Indonesia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 631/93 de la Commission, du 17 mars 1993, portant
