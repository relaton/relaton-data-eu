    europeo e del Consiglio per consentire l'uso del caseinato di ferro del latte
    come fonte di ferro nei sostituti dell'intera razione alimentare giornaliera per
    il controllo del peso e negli alimenti a fini medici speciali, esclusi gli alimenti
