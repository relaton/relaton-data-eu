    und des Rates zwecks Zulassung der Verwendung von Eisen-Milchkaseinat als Eisenquelle
    in Tagesrationen für gewichtskontrollierende Ernährung und in Lebensmitteln
    für besondere medizinische Zwecke, ausgenommen Lebensmittel für Säuglinge und
    Kleinkinder
  type: main
