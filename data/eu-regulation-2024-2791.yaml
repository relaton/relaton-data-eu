title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/2791 of 29 January 2024 amending
    the Annex to Regulation (EU) No 609/2013 of the European Parliament and of the
    Council to allow the use of iron milk caseinate as a source of iron in total diet
    replacement for weight control and in food for special medical purposes, excluding
    food for infants and young children
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/2791 de la Commission du 29 janvier 2024
    modifiant l’annexe du règlement (UE) no 609/2013 du Parlement européen et
    du Conseil afin d’autoriser l’utilisation du caséinate de fer du lait en
    tant que source de fer dans les substituts de la ration journalière totale pour
    contrôle du poids et dans les denrées alimentaires destinées à des fins médicales
    spéciales, à l’exclusion des denrées alimentaires pour nourrissons et enfants
    en bas âge
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/2791 der Kommission vom 29. Januar 2024
