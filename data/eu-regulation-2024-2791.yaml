    s cieľom povoliť používanie mliečneho kazeinátu železitého ako zdroja
    železa v celkovej náhrade stravy na účely regulácie hmotnosti a v potravinách
    na osobitné lekárske účely s výnimkou potravín určených pre dojčatá
