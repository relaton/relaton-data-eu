title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1586/2000 of 19 July 2000 laying down to
    what extent applications for issue of export licences submitted during July 2000
    for beef products which may benefit from special import treatment in a third country
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1586/2000 de la Commission du 19 juillet 2000 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de juillet 2000 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1586/2000 der Kommission vom 19. Juli 2000 über das
    Ausmaß, in dem den im Juli 2000 eingereichten Anträgen auf Ausfuhrlizenzen für
    Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1586/2000 af 19. juli 2000 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    juli 2000 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    et tredjeland, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1586/2000 της Επιτροπής,
    της 19ης Ιουλίου 2000, για καθορισμό σε ποιό βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εξαγωγής που υποβλήθηκαν
    τον Ιούλιο 2000 για τα προϊόντα του τομέα του
    βοείου κρέατος ειδικής μεταχειρίσεως κατά
    την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1586/2000, annettu 19 päivänä heinäkuuta
    2000, kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden
    heinäkuussa 2000 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1586/2000 della Commissione, del 19 luglio 2000, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di luglio 2000 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1586/2000 van de Commissie van 19 juli 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 2000 ingediende aanvragen
    om uitvoercertificaten voor producten van de sector rundvlees waarvoor een bijzondere
    behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1586/2000 da Comissão, de 19 de Julho de 2000, que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Julho de 2000 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1586/2000 de la Comisión, de 19 de julio de 2000,
    por el que se determina en qué medida podrá darse curso a las solicitudes de
    certificados de exportación, presentadas en el mes de julio de 2000, para los
    productos del sector de la carne de bovino que se beneficien de un trato especial
    para su importación en un tercer país
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1586/2000 av den 19 juli 2000 om fastställande
    av i vilken utsträckning ansökningar som lämnats in under juli månad 2000
    om exportlicens för nötköttsprodukter som berättigar till särskild behandling
    vid import till tredje land får godkännas
  type: main
