id: EURegulation20241054
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/1054 of 10 April 2024 concerning
    the authorisation of a preparation of Weizmannia faecalis DSM 32016 as a feed
    additive for use in feed and in water for drinking for all poultry species reared
    for laying or breeding and for use in water for drinking for all poultry species
    for fattening, ornamental birds, suckling and weaned Suidae piglets (holder of
    the authorisation: Biochem Zusatzstoffe Handels- und Produktionsges. mbH), and
    amending Implementing Regulation (EU) 2020/1755 as regards the terms of the authorisation
    of that preparation'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/1054 de la Commission du 10 avril
    2024 concernant l’autorisation d’une préparation de Weizmannia faecalis DSM
    32016 en tant qu’additif à utiliser dans l’alimentation et l’eau d’abreuvement
    de toutes les espèces de volailles élevées pour la ponte ou la reproduction
    ainsi que dans l’eau d’abreuvement de toutes les espèces de volailles d’engraissement,
    des oiseaux d’ornement et des porcelets non sevrés et sevrés appartenant à
    la famille des Suidae (titulaire de l’autorisation: Biochem Zusatzstoffe Handels-
    und Produktionsges. mbH), et modifiant le règlement d’exécution (UE) 2020/1755
    en ce qui concerne les conditions d’autorisation de cette préparation'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2024/1054 der Kommission vom 10. April 2024
    zur Zulassung einer Zubereitung aus Weizmannia faecalis DSM 32016 als Zusatzstoff
    zur Verwendung in Futtermitteln und Tränkwasser für alle Jungtiere von Lege-
    und Zuchtgeflügelarten und zur Verwendung in Tränkwasser für alle Mastgeflügelarten,
    Ziervögel sowie Saug- und Absetzferkel der Familie der Suidae (Zulassungsinhaber:
    Biochem Zusatzstoffe Handels- und Produktionsges. mbH) und zur Änderung der Durchführungsverordnung
    (EU) 2020/1755 hinsichtlich der Bedingungen für die Zulassung dieser Zubereitung'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2024/1054 на Комисията
    от 10 април 2024 година за разрешаване на препарат
    от Weizmannia faecalis DSM 32016 като фуражна добавка за
    употреба във фуражи и във водата за пиене за
    всички видове домашни птици, отглеждани за
    носачки или за разплод и за употреба във водата
    за пиене за всички видове домашни птици за
    угояване, за декоративни птици, прасенца сукалчета
    и отбити прасенца от всички видове Suidae (притежател
    на разрешението: Biochem Zusatzstoffe Handels- und Produktionsges.
    mbH), и за изменение на Регламент за изпълнение
    (ЕС) 2020/1755 по отношение на условията на разрешението
    за употребата на този препарат'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2024/1054 ze dne 10. dubna 2024 o
    povolení přípravku Weizmannia faecalis DSM 32016 jako doplňkové látky pro
    použití v krmivech a ve vodě k napájení pro kuřice nebo odchov všech druhů
    drůbeže a pro použití ve vodě k napájení pro výkrm všech druhů drůbeže,
    okrasné ptactvo a sající a odstavená selata prasatovitých (Suidae) (držitel
    povolení: Biochem Zusatzstoffe Handels- und Produktionsges. mbH) a o změně
    prováděcího nařízení (EU) 2020/1755, pokud jde o podmínky povolení dotčeného
    přípravku'
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/1054 af 10. april 2024
    om godkendelse af et præparat af Weizmannia faecalis DSM 32016 som fodertilsætningsstof
    til anvendelse i foder og i drikkevand til alle fjerkræarter opdrættet til æglægning
    eller avl og til anvendelse i drikkevand til alle fjerkræarter til slagtning,
    prydfugle samt pattegrise og fravænnede smågrise af svinefamilien (indehaver
    af godkendelsen er Biochem Zusatzstoffe Handels- und Produktionsges. mbH), og
    om ændring af gennemførelsesforordning (EU) 2020/1755 for så vidt angår vilkårene
    for godkendelsen af præparatet
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2024/1054 της
    Επιτροπής, της 10ης Απριλίου 2024, σχετικά με τη
    χορήγηση άδειας για τη χρήση παρασκευάσματος
    Weizmannia faecalis DSM 32016 ως πρόσθετης ύλης ζωοτροφών
    σε ζωοτροφές και στο πόσιμο νερό για όλα τα
    είδη πουλερικών που εκτρέφονται για ωοπαραγωγή
    ή αναπαραγωγή και για τη χρήση στο πόσιμο νερό
    για όλα τα είδη πουλερικών προς πάχυνση, τα
    διακοσμητικά πτηνά, τα θηλάζοντα και τα απογαλακτισμένα
    χοιρίδια συϊδών (κάτοχος της άδειας: Biochem Zusatzstoffe
    Handels- und Produktionsges. mbH), και για την τροποποίηση
    του κανονισμού (ΕΕ) 2020/1755 όσον αφορά τους όρους
    χορήγησης άδειας στο εν λόγω παρασκεύασμα'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2024/1054, 10. aprill 2024, milles käsitletakse
    loa andmist Weizmannia faecalis DSM 32016 preparaadi kasutamiseks söödalisandina
    kõikide kodulinnuliikide muna- või aretuslindudeks kasvatatavate noorlindude
    söödas ja joogivees ning kõikide kodulinnuliikide nuumlindude, dekoratiivlindude,
    sigalaste piima- ja võõrdepõrsaste joogivees (loa hoidja: Biochem Zusatzstoffe
    Handels- und Produktionsges. mbH) ning muudetakse rakendusmäärust (EL) 2020/1755
    kõnealuse preparaadi kasutamise loa tingimuste osas'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2024/1054, annettu 10 päivänä
    huhtikuuta 2024, Weizmannia faecalis DSM 32016 -valmisteen hyväksymisestä rehun
    lisäaineena käytettäväksi kaikkien munantuotantoa varten tai siitoseläimiksi
    kasvatettavien siipikarjalajien rehussa ja juomavedessä sekä kaikkien lihasiipikarjalajien,
    koristetarkoituksessa pidettävien lintujen ja sikaeläimiin kuuluvien imevien
    ja vieroitettujen porsaiden juomavedessä (myyntiluvan haltija: Biochem Zusatzstoffe
    Handels- und Produktionsges. mbH) sekä täytäntöönpanoasetuksen (EU) 2020/1755
    muuttamisesta siltä osin kuin on kyse kyseisen valmisteen hyväksynnän ehdoista'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2024/1054 ón gCoimisiún an 10 Aibreán
    2024 maidir le húdarú ullmhóide arb é atá inti Weizmannia faecalis DSM 32016
    mar bhreiseán beathaithe lena úsáid i mbeatha agus in uisce óil le haghaidh
    gach speicis éanlaithe clóis a thógtar le bheith ina bhéaróg nó le haghaidh
    pórúcháin agus lena úsáid in uisce óil le haghaidh gach speicis éanlaithe
    clóis lena ramhrú, éin ornáideacha agus bainbh diúil Suidae agus bainbh scoite
    Suidae (sealbhóir an údaraithe: Biochem Zusatzstoffe Handels- und Produktionsges.
    mbH), agus lena leasaítear Rialachán Cur Chun Feidhme (AE) 2020/1755 a mhéid
    a bhaineann le téarmaí údarú na hullmhóide sin'
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/1054 оd 10. travnja 2024. o odobrenju
    pripravka od Weizmannia faecalis DSM 32016 kao dodatka hrani za životinje i vodi
    za piće za sve vrste peradi uzgajane za nesenje ili rasplod i u vodi za piće
    za sve vrste peradi za tov, ukrasne ptice, sisajuću i odbijenu prasad iz porodice
    Suidae (nositelj odobrenja Biochem Zusatzstoffe Handels- und Produktionsges. mbH)
    te o izmjeni Provedbene uredbe (EU) 2020/1755 u pogledu uvjeta odobrenja tog pripravka
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2024/1054 végrehajtási rendelete (2024. április 10.)
    a Weizmannia faecalis DSM 32016 készítmény valamennyi tojó- vagy tenyészbaromfinak
    nevelt baromfi takarmányban és ivóvízben felhasznált takarmány-adalékanyagaként,
    továbbá valamennyi hízóbaromfifaj, díszmadarak, szopós és elválasztott
    malacok ivóvízben használt takarmány-adalékanyagaként történő engedélyezéséről
    (az engedély jogosultja: Biochem Zusatzstoffe Handels- und Produktionsges. mbH),
    valamint az (EU) 2020/1755 végrehajtási rendeletnek a készítmény engedélyezésére
    vonatkozó feltételek tekintetében történő módosításáról'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2024/1054 della Commissione, del 10 aprile
    2024, relativo all’autorizzazione di un preparato di Weizmannia faecalis DSM
    32016 come additivo per mangimi da impiegare nei mangimi e nell’acqua di abbeveraggio
    per tutte le specie di pollame allevate per la produzione di uova o per la riproduzione
