    preparaat betreft'
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2024/1054 z dnia 10 kwietnia 2024
    r. dotyczące zezwolenia na stosowanie preparatu Weizmannia faecalis DSM 32016
    jako dodatku paszowego do stosowania w paszach i wodzie do pojenia dla wszystkich
    gatunków drobiu odchowywanego na nioski lub w celach hodowlanych oraz do stosowania
