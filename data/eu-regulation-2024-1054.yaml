    oraz ssących i odstawionych prosiąt świniowatych (posiadacz zezwolenia: Biochem
    Zusatzstoffe Handels- und Produktionsges. mbH), a także zmieniające rozporządzenie
    wykonawcze (UE) 2020/1755 w odniesieniu do warunków zezwolenia na stosowanie
    tego preparatu'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2024/1054 da Comissão, de 10 de abril
    de 2024, relativo à autorização de uma preparação de Weizmannia faecalis
    DSM 32016 como aditivo para a alimentação animal a utilizar nos alimentos e
    na água de abeberamento para todas as espécies de aves de capoeira criadas para
    postura ou reprodução e a utilizar na água de abeberamento para todas as espécies
    de aves de capoeira de engorda, aves ornamentais, leitões Suidae não desmamados
    e desmamados (detentor da autorização: Biochem Zusatzstoffe Handels- und Produktionsges.
    mbH), e que altera o Regulamento de Execução (UE) 2020/1755 no que se refere
    aos termos da autorização dessa preparação'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2024/1054 al Comisiei din 10
    aprilie 2024 privind autorizarea unui preparat de Weizmannia faecalis DSM 32016
    destinat a fi utilizat ca aditiv în hrana animalelor și în apa de băut pentru
    păsările aparținând tuturor speciilor de păsări crescute pentru ouat sau
    reproducție și în apa de băut pentru păsările aparținând tuturor speciilor
    de păsări de curte pentru îngrășat, păsările ornamentale, purceii de Suidae
    de lapte și înțărcați (titularul autorizației: Biochem Zusatzstoffe Handels-
    und Produktionsges. mbH), și privind modificarea Regulamentului de punere în
    aplicare (UE) 2020/1755 în ceea ce privește condițiile de autorizare a preparatului
    respectiv'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2024/1054 z 10. apríla 2024 o povolení
    prípravku s obsahom Weizmannia faecalis DSM 32016 ako kŕmnej doplnkovej látky
    určenej na používanie v krmive a vo vode na napájanie pre všetky druhy hydiny
    chovanej na znášku alebo na reprodukciu a určenej na používanie vo vode na
    napájanie pre všetky druhy hydiny vo výkrme, okrasné vtáky, ciciaky a odstavené
    prasiatka čeľade Suidae (držiteľ povolenia: Biochem Zusatzstoffe Handels-
    und Produktionsges. mbH), ktorým sa mení vykonávacie nariadenie (EÚ) 2020/1755,
    pokiaľ ide o podmienky povolenia uvedeného prípravku'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2024/1054 z dne 10. aprila 2024 o dovoljenju
    za pripravek iz Weizmannia faecalis DSM 32016 kot krmni dodatek za uporabo v krmi
    in vodi za pitje za vse vrste perutnine za nesnice ali razplod in za uporabo v
    vodi za pitje za vse vrste perutnine za pitanje, okrasne ptice ter sesne in odstavljene
    pujske Suidae (imetnik dovoljenja: Biochem Zusatzstoffe Handels- und Produktionsges.
    mbH) ter spremembi Izvedbene uredbe (EU) 2020/1755 glede pogojev dovoljenja za
    navedeni pripravek'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2024/1054 de la Comisión, de 10 de abril
    de 2024, relativo a la autorización de un preparado de Weizmannia faecalis DSM
    32016 como aditivo para su uso en piensos y agua de beber para todas las especies
    de aves de corral criadas para puesta o reproducción, y para su uso en agua de
    beber para todas las especies de aves de corral de engorde, aves ornamentales
    y suidos lechones lactantes y destetados (titular de la autorización: Biochem
    Zusatzstoffe Handels- und Produktionsges. mbH), y por el que se modifica el Reglamento
    de Ejecución (UE) 2020/1755 en lo que respecta a los términos de la autorización
    de dicho preparado'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2024/1054 av den 10 april
    2024 om godkännande av ett preparat av Weizmannia faecalis DSM 32016 som fodertillsats
    för användning i foder och i dricksvatten för alla fjäderfäarter som föds
    upp för värpning eller avel och för användning i dricksvatten för alla fjäderfäarter
    avsedda för slakt, burfåglar samt diande och avvanda smågrisar av familjen
    Suidae (innehavare av godkännandet: Biochem Zusatzstoffe Handels- und Produktionsges.
    mbH), och om ändring av genomförandeförordning (EU) 2020/1755 vad gäller villkoren
    för godkännandet av det preparatet'
