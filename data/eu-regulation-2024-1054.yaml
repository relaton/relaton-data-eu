    tal-awtorizzazzjoni ta’ dik il-preparazzjoni'
  type: main
- language: nl
  script: Latn
  content: 'Uitvoeringsverordening (EU) 2024/1054 van de Commissie van 10 april 2024
    tot verlening van een vergunning voor een preparaat van Weizmannia faecalis DSM
    32016 als toevoegingsmiddel voor diervoeding voor gebruik in diervoeder en in
    drinkwater voor alle pluimveesoorten opgefokt voor leg- of fokdoeleinden, en voor
