    gli uccelli ornamentali e i suinetti lattanti e svezzati appartenenti alla famiglia
    Suidae (titolare dell’autorizzazione: Biochem Zusatzstoffe Handels- und Produktionsges.
    mbH) e recante modifica del regolamento di esecuzione (UE) 2020/1755 per quanto
    riguarda i termini dell’autorizzazione di tale preparato'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2024/1054 (2024. gada 10. aprīlis)
    par atļauju Weizmannia faecalis DSM 32016 preparātu lietot par barības piedevu
    visu sugu dējējmājptnu vai vaislas mājputnu barībā un dzirdināmajā ūdenī
    un visu sugu gaļas mājputnu, dekoratīvo putnu, zīdāmu un atšķirtu Suidae
    sivēnu dzirdināmajā ūdenī (atļaujas turētājs: Biochem Zusatzstoffe Handels-
