    leidimo suteikimo sąlygų iš dalies keičiamas Įgyvendinimo reglamentas (ES)
    2020/1755
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/1054 tal-10
