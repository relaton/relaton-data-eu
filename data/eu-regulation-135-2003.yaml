title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 135/2003 of 24 January 2003 determining the
    extent to which the applications for import licences submitted in July 2002 for
    certain dairy products under certain tariff quotas opened by Regulation (EC) No
    2535/2001 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 135/2003 de la Commission du 24 janvier 2003 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 2002 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 2535/2001 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 135/2003 der Kommission vom 24. Januar 2003 zur Festlegung
    des Umfangs, in dem den im Juli 2002 gestellten Anträgen auf Erteilung von Lizenzen
    für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung (EG)
    Nr. 2535/2001 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 135/2003 af 24. januar 2003 om, i hvilket
    omfang de ansøgninger om importlicenser, som er indgivet i juli 2002 vedrørende
    visse mejeriprodukter inden for de toldkontingenter, der blev åbnet ved forordning
    (EF) nr. 2535/2001, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 135/2003 της Επιτροπής,
    της 24ης Ιανουαρίου 2003, που καθορίζει το κατά
    πόσον μπορούν να γίνουν δεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υπεβλήθησαν
    τον Ιούλιο 2002 για ορισμένα γαλακτοκομικά προϊόντα
    στο πλαίσιο ορισμένων δασμολογικών ποσοστώσεων
    που θεσπίσθηκαν με τον κανονισμό (ΕΚ) αριθ.
    2535/2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 135/2003, annettu 24 päivänä tammikuuta 2003,
    asetuksella (EY) N:o 2535/2001 avatuissa tiettyjen maitotuotteiden tariffikiintiöissä
    heinäkuussa 2002 jätettyjen tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 135/2003 della Commissione, del 24 gennaio 2003, che
    stabilisce in quale misura possano essere accettate le domande di titoli di importazione
    presentate nel mese di luglio 2002 per determinati prodotti lattiero-caseari nell'ambito
    di taluni contingenti tariffari aperti dal regolamento (CE) n. 2535/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 135/2003 van de Commissie van 24 januari 2003 tot
    vaststelling van de mate waarin invoercertificaataanvragen die in juli 2002 in
    het kader van bĳ Verordening (EG) nr. 2535/2001 geopende tariefcontingenten voor
    bepaalde zuivelproducten zĳn ingediend, kunnen worden geaccepteerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 135/2003 da Comissão, de 24 de Janeiro de 2003,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Julho de 2002 para certos produtos lácteos no âmbito de determinados
    contingentes pautais abertos pelo Regulamento (CE) n.° 2535/2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 135/2003 de la Comisión, de 24 de enero de 2003, por
