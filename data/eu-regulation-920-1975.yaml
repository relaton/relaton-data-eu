  script: Latn
  content: Regulation (EEC) No 920/75 of the Commission of 9 April 1975 repealing
    Commission Regulation (EEC) No 2790/73 on the prohibition of the export to third
    countries of certain goods of Italian origin falling within Regulation (EEC) No
    1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 920/75 de la Commission, du 9 avril 1975, abrogeant
    le règlement (CEE) n° 2790/73 portant interdiction d'exportation de certaines
    marchandises d'origine italienne relevant du règlement (CEE) n° 1059/69 à destination
    des pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 920/75 der Kommission vom 9. April 1975 zur Aufhebung
    der Verordnung (EWG) Nr. 2790/73 über ein Ausfuhrverbot gewisser Waren italienischer
    Herkunft nach dritten Ländern, die unter die Verordnung (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 920/75 af 9. april 1975 der ophæver
    Kommissionens forordning (EØF) nr. 2790/73 forbydende udførsel af visse varer
    med italiensk oprindelse med destination i tredjelande ifølge forordning (EØF)
    nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 920/75 della Commissione, del 9 aprile 1975, che abroga
    il regolamento (CEE) n. 2790/73 relativo al divieto di esportazione verso paesi
    terzi di talune merci d'origine italiana cui si applica il regolamento (CEE) n.
    1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 920/75 van de Commissie van 9 april 1975 houdende
    intrekking van Verordening (EEG) nr. 2790/73 houdende verbod van uitvoer van bepaalde
    goederen van oorsprong uit Italië, vallend onder Verordening (EEG) nr. 1059/69,
    naar derde landen
