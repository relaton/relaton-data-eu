title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 422/83 of 22 February 1983 re-establishing
    the levying of customs duties on clothing accessories and articles, knitted or
    crocheted, products of category 67 (code 0670), originating in Brazil, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3378/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 422/83 de la Commission du 22 février 1983 portant
    rétablissement de la perception des droits de douane applicables aux accessoires
    du vêtement et articles de bonneterie de la catégorie 67 (code 0670), originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 422/83 der Kommission vom 22. Februar 1983 über die
    Wiedeinführung des Zollsatzes für Bekleidungszubehör und andere Wirkwaren der
    Warenkategorie Nr. 67 (Kennziffer 0670), mit Ursprung in Brasilien, dem die in
    der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 422/83 af 22. februar 1983 om genindførelse
    af opkrævning af toldafgifter for tilbehør til beklædningsgenstande og varer
    af trikotage, under kategori 67 (kode 0670), som har oprindelse i Brasilien og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 422/83 της Επιτροπής
    της 22ας Φεβρουαρίου 1983 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για τα συμπληρώματα
    πλεκτά της ενδύσεως και πλεκτά είδη της κατηγορίας
    προϊόντων 67 (κωδικός 0670), καταγωγής Βραζιλίας,
    δικαιούχων των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 422/83 della Commissione del 22 febbraio 1983 che
    ripristina la riscossione dei dazi doganali applicabili agli accessori di abbigliamento
    ed altri manufatti a maglia, della categoria 67 (codice 0670), originari del Brasile
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 422/83 van de Commissie van 22 februari 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kledingtoebehoren
    en artikelen van de categorie van produkten nr. 67 (codenummer 0670), van oorsprong
    uit Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3378/82 van de Raad
  type: main
