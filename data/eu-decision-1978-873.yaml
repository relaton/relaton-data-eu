title:
- language: en
  script: Latn
  content: '78/873/EEC: Commission Decision of 9 October 1978 authorizing the Italian
    Republic not to apply Community treatment to yarn of discontinuous or waste synthetic
    fibres not put up for retail sale, falling within subheading ex 56.05 A of the
    Common Customs Tariff (NIMEXE codes 56.05-03, 05, 07, 09, 11, 13, 15, 19, 21,
    23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46, 47), originating in Romania and
    in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/873/CEE: Décision de la Commission, du 9 octobre 1978, autorisant
    la République italienne à exclure du traitement communautaire les fils de fibres
    textiles synthétiques discontinues, non conditionnés pour la vente au détail,
    de la sous-position ex 56.05 A du tarif douanier commun (codes Nimexe: 56.05-03;
    05; 07; 09; 11; 13; 15; 19; 21; 23; 25; 28; 32; 34; 36; 38; 39; 42; 44; 45; 46;
    47), originaires de Roumanie et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/873/EWG: Entscheidung der Kommission vom 9. Oktober 1978, mit der die
    Italienische Republik ermächtigt wird, aus Rumánien stammende und in den úbrigen
    Mitgliedstaaten im freien Verkehr befindliche Garne aus synthetischen Spinnfasern,
    nicht in Aufmachungen fúr den Einzelverkauf, der Tarifstelle ex 56.05 A des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 56.05-03; 05; 07; 09; 11; 13; 15; 19; 21; 23; 25;
    28; 32; 34; 36; 38; 39; 42; 44; 45; 46; 47) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/873/EØF: Kommissionens beslutning af 9. oktober 1978 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage garn af korte
    syntetiske fibre eller af affald af kemofibre, ikke i detailsalgsoplægninger,
    som henhører under pos. ex 56.05 A i den fælles toldtarif (NIMEXE-kode 56.05-03,
    05, 07, 09, 11, 13, 15, 19, 21, 23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46,
    47), har oprindelse i Rumænien og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/873/CEE: Decisione della Commissione, del 9 ottobre 1978, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario filati di fibre
    sintetiche in fiocco, non preparati per la vendita al minuto, della sottovoce
    ex 56.05 A della tariffa doganale comune (codice Nimexe: 56.05-03, 05, 07, 09,
    11, 13, 15, 19, 21, 23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46, 47), originari
    della Romania e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/873/EEG: Beschikking van de Commissie van 9 oktober 1978 waarbij de
    Italiaanse Republiek wordt gemachtigd garens van synthetische stapelvezels, niet
    gereed voor de verkoop in het klein, van post ex 56.05 A van het gemeenschappelijk
    douanetarief (NIMEXE-code 56.05-03, 05, 07, 09, 11, 13, 15, 19, 21, 23, 25, 28,
    32, 34, 36, 38, 39, 42, 44, 45, 46, 47), van oorsprong uit Roemenië en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
