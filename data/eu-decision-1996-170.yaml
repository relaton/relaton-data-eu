title:
- language: en
  script: Latn
  content: '96/170/EC: Commission Decision of 15 February 1996 adapting Annex I of
    Council Regulation (EEC) No 571/88 on the organization of Community surveys on
    the structure of agricultural holdings between 1988 and 1997 and Commission Decision
    No 89/651/EEC relating to the definitions of the characteristics and to the list
    of agricultural products for these surveys'
  type: main
- language: fr
  script: Latn
  content: '96/170/CE: Décision de la Commission, du 15 février 1996, adaptant l''annexe
    I du règlement (CEE) n° 571/88 du Conseil portant organisation d''enquêtes
    communautaires sur la structure des exploitations agricoles au cours de la période
    1988-1997 et l''annexe I de la décision 89/651/CEE relative aux définitions
    des caractéristiques et à la liste des produits agricoles en vue de ces enquêtes'
  type: main
- language: de
  script: Latn
  content: '96/170/EG: Entscheidung der Kommission vom 15. Februar 1996 zur Anpassung
    des Anhangs I der Verordnung (EWG) Nr. 571/88 des Rates zur Durchführung von
    Gemeinschaftserhebungen über die Struktur der landwirtschaftlichen Betriebe im
    Zeitraum 1988 bis 1997 und des Anhangs I der Entscheidung 89/651/EWG über die
    Definitionen der Erhebungsmerkmale und die Liste der landwirtschaftlichen Erzeugnisse
    für diese Erhebungen'
  type: main
- language: da
  script: Latn
  content: '96/170/EF: Kommissionens beslutning af 15. februar 1996 om tilpasning
    af bilag I til Rådets forordning (EØF) nr. 571/88 om tilrettelæggelse af en
    række fællesskabsundersøgelser af landbrugsbedrifternes struktur i perioden
    1988 til 1997 og bilag I til beslutning 89/651/EØF om definitionerne af kendetegn
    og om listen over landbrugsprodukter med henblik på disse undersøgelser'
  type: main
- language: el
  script: Grek
  content: '96/170/ΕΚ: Απόφαση της Επιτροπής, της 15ης Φεβρουαρίου
    1996, για την τροποποίηση του παραρτήματος Ι
    του κανονισμού (ΕΟΚ) αριθ. 571/88 του Συμβουλίου
    σχετικά με τη διεξαγωγή κοινοτικών ερευνών
    για τη διάρθρωση των γεωργικών εκμεταλλεύσεων
    κατά τη χρονική περίοδο 1988 - 1997 και του παραρτήματος
    Ι της απόφασης 89/651/ΕΟΚ σχετικά με τους ορισμούς
    των χαρακτηριστικών και τον κατάλογο γεωργικών
    προϊόντων ενόψει των ερευνών αυτών'
  type: main
- language: fi
  script: Latn
  content: '96/170/EY: Komission päätös, tehty 15 päivänä helmikuuta 1996, maatilojen
    rakennetta vuosien 1988 ja 1997 välillä koskevien yhteisön tilastotietojen
    keruun järjestämisestä annetun neuvoston asetuksen (ETY) N:o 571/88 liitteen
    I ja ominaisuuksien määritelmistä ja maataloustuotteiden luettelosta näitä
    tutkimuksia varten annetun päätöksen 89/651/ETY liitteen I muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '96/170/CE: Decisione della Commissione, del 15 febbraio 1996, che adegua
    l''allegato I del regolamento (CEE) n. 571/88 del Consiglio, relativo all''organizzazione
    di indagini comunitarie sulla struttura delle aziende agricole nel periodo 1988-1997,
    e l''allegato I della decisione 89/651/CEE, relativa alle definizioni delle caratteristiche
    e dell''elenco dei prodotti agricoli riguardanti le indagini suddette'
  type: main
- language: nl
  script: Latn
  content: '96/170/EG: Beschikking van de Commissie van 15 februari 1996 tot aanpassing
    van bijlage I van Verordening (EEG) nr. 571/88 van de Raad houdende organisatie
    van communautaire enquêtes inzake de structuur van de landbouwbedrijven in het
    tijdvak van 1988 tot en met 1997, en bijlage I van Beschikking 89/651/EEG betreffende
    de definities van de kenmerken en de lijst van landbouwprodukten voor de communautaire
    enquêtes inzake de structuur van de landbouwbedrijven in het tijdvak van 1988
    tot en met 1997'
  type: main
- language: pt
  script: Latn
  content: '96/170/CE: Decisão da Comissão, de 15 de Fevereiro de 1996, que adapta
    o anexo I do Regulamento (CEE) nº 571/88 do Conselho relativo à organização
    de uma série de inquéritos comunitários sobre a estrutura das explorações
    agrícolas para o período de 1988 a 1997 e o anexo I da Decisão 89/651/CEE relativa
