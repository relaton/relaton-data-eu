title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1378/75 of the Commission of 29 May 1975 re-establishing
    the levying of the customs duties on citric acid falling within subheading 29.16
    A IV a) originating in Mexico, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1378/75 de la Commission, du 29 mai 1975, portant
    rétablissement de la perception des droits de douane applicables à l'acide citrique,
    de la sous- position tarifaire 29.16 A IV a), originaire du Mexique, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1378/75 der Kommission vom 29. Mai 1975 zur Wiedereinführung
    des Zollsatzes für Zitronensäure der Tarifstelle 29.16 A IV a) mit Ursprung
    in Mexiko, dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember
    1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1378/75 af 29. maj 1975 om genindførelse
    af opkrævning af toldafgifter for citronsyre under underposition 29.16 A IV a),
    som har oprindelse i Mexico og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1378/75 della Commissione, del 29 maggio 1975, che
    ripristina la riscossione dei dazi doganali applicabili all'acido citrico della
    sottovoce doganale n. 29.16 A IV a) originario del Messico beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1378/75 van de Commissie van 29 mei 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op citroenzuur
    van onderverdeling 29.16 A IV a) van oorsprong uit Mexico ten behoeve waarvan
    bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene tariefprefenties
    werden geopend
  type: main
