    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/450 della Commissione del 25 novembre 2022
    che integra il regolamento (UE) 2021/23 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che precisano in quale
    ordine le CCP sono tenute a versare i risarcimenti di cui all’articolo 20, paragrafo
    1, del regolamento (UE) 2021/23, il numero massimo di anni durante i quali le
    CCP sono tenute a utilizzare una quota dei loro utili annuali per risarcire i
    detentori di titoli attestanti un credito sugli utili futuri delle CCP e la quota
    massima degli utili che deve essere utilizzata per tali pagamenti
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/450 (2022. gada 25. novembris),
    ar ko Eiropas Parlamenta un Padomes Regulu (ES) 2021/23 papildina attiecībā
    uz regulatīvajiem tehniskajiem standartiem, kuros precizē, kādā secībā CCP
    jāmaksā Regulas (ES) 2021/23 20. panta 1. punktā minētā atlīdzība, kāds
    ir maksimālais gadu skaits, kuru laikā minētajiem CCP jāizmanto daļa no gada
