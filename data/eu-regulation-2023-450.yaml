    daļa, kas jāizmanto minētajiem maksājumiem
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/450 2022 m. lapkričio 25
    d. kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2021/23 papildomas techniniais
    reguliavimo standartais, kuriais nustatoma tvarka, kuria PSŠ turi kompensuoti
    nuostolius, kaip nurodyta Reglamento (ES) 2021/23 20 straipsnio 1 dalyje, maksimalus
