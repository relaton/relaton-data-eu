    atlikti
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/450 tal-25 ta’ Novembru
    2022 li jissupplimenta r-Regolament (UE) 2021/23 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji li jispeċifikaw l-ordni li fih
    is-CCPs għandhom iħallsu l-kumpens imsemmi fl-Artikolu 20(1) tar-Regolament
    (UE) 2021/23, l-għadd massimu ta’ snin li matulhom dawn is-CCPs għandhom jużaw
