    ποσοστό των εν λόγω κερδών που πρόκειται να
    χρησιμοποιηθεί για τις εν λόγω πληρωμές
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2023/450, 25. november 2022, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2021/23 seoses regulatiivsete
    tehniliste standarditega, millega määratakse kindlaks, millises järjekorras
    peavad kesksed vastaspooled maksma määruse (EL) 2021/23 artikli 20 lõikes 1
    osutatud hüvitist, maksimaalne aastate arv, mille jooksul kõnealused kesksed
    vastaspooled peavad kasutama osa oma aastakasumist kõnealuste maksete tegemiseks
    selliste instrumentide omanikele, millega tunnustatakse nõuet keskse vastaspoole
    tulevase kasumi suhtes, ning maksimaalne kasumiosa, mida kasutatakse kõnealuste
    maksete tegemiseks
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2023/450, annettu 25 päivänä marraskuuta
    2022, Euroopan parlamentin ja neuvoston asetuksen (EU) 2021/23 täydentämisestä
    teknisillä sääntelystandardeilla, joissa määritetään järjestys, jossa
    keskusvastapuolten on maksettava asetuksen (EU) 2021/23 20 artiklan 1 kohdassa
    tarkoitetut korvaukset, niiden vuosien enimmäismäärä, joiden aikana kyseisten
    keskusvastapuolten on käytettävä osuus vuotuisista voitoistaan tällaisten
    maksujen maksamiseen sellaisten instrumenttien omistajille, joilla tunnustetaan
    keskusvastapuolten tuleviin voittoihin kohdistuva saatava, ja enimmäisosuus,
    joka näistä voitoista on käytettävä kyseisiin maksuihin
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2023/450 ón gCoimisiún an 25 Samhain 2022
    lena bhforlíontar Rialachán (AE) 2021/23 ó Pharlaimint na hEorpa agus ón gComhairle
