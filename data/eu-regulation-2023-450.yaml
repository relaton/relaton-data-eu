    strumenti li jirrikonoxxu pretensjoni fuq il-profitti futuri tagħhom u s-sehem
    massimu ta’ dawn il-profitti li għandu jintuża għal dawn il-pagamenti
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/450 van de Commissie van 25 november
    2022 tot aanvulling van Verordening (EU) 2021/23 van het Europees Parlement en
    de Raad met technische reguleringsnormen tot nadere bepaling van de volgorde waarin
    CTP’s de in artikel 20, lid 1, van Verordening (EU) 2021/23 bedoelde vergoeding
    moeten betalen, het maximale aantal jaren waarin die CTP’s een deel van hun
    jaarlijkse winst moeten gebruiken voor dergelijke betalingen aan bezitters van
    instrumenten waarin een vordering op hun toekomstige winst wordt opgenomen, en
    het maximale aandeel van die winst dat voor die betalingen moet worden gebruikt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/450 z dnia 25 listopada 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2021/23
    w odniesieniu do regulacyjnych standardów technicznych określających kolejność,
    w jakiej CCP mają wypłacać rekompensatę, o której mowa w art. 20 ust. 1 rozporządzenia
    (UE) 2021/23, maksymalną liczbę lat, przez które ci CCP mają przeznaczać
    część swoich rocznych zysków na takie płatności na rzecz posiadaczy instrumentów
    uznających roszczenie do przyszłych zysków CCP, oraz maksymalną część tych
    zysków, którą przeznacza się na te płatności
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/450 da Comissão de 25 de novembro de 2022
    que complementa o Regulamento (UE) 2021/23 do Parlamento Europeu e do Conselho
    no respeitante às normas técnicas de regulamentação que especificam a ordem
    pela qual as CCP devem pagar a indemnização a que se refere o artigo 20.o, n.o
    1, do Regulamento (UE) 2021/23, o número máximo de anos durante o qual essas
    CCP devem utilizar uma parte dos seus lucros anuais para esses pagamentos a detentores
    de instrumentos que reconheçam um crédito sobre os seus lucros futuros e a percentagem
    máxima desses lucros a utilizar para esses pagamentos
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/450 al Comisiei din 25 noiembrie 2022 de
    completare a Regulamentului (UE) 2021/23 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare care precizează ordinea
    în care CPC-urile trebuie să plătească despăgubirile menționate la articolul
    20 alineatul (1) din Regulamentul (UE) 2021/23, numărul maxim de ani în care
    CPC-urile respective trebuie să utilizeze o parte din profiturile lor anuale
    pentru astfel de plăți către posesorii de instrumente care recunosc o creanță
    asupra profiturilor viitoare ale CPC și cota maximă din aceste profituri care
    urmează să fie utilizată pentru plățile respective
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/450 z 25. novembra 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2021/23, pokiaľ ide
    o regulačné technické predpisy, v ktorých sa bližšie určuje poradie, v
    ktorom majú centrálne protistrany vyplácať náhrady uvedené v článku 20
    ods. 1 nariadenia (EÚ) 2021/23, maximálny počet rokov, počas ktorých majú
    tieto centrálne protistrany používať časť svojich ročných ziskov na takéto
    platby držiteľom nástrojov, ktorými sa uznáva nárok na ich budúce zisky,
    a maximálna časť týchto ziskov, ktorá sa má použiť na tieto platby
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/450 z dne 25. novembra 2022 o dopolnitvi
    Uredbe (EU) 2021/23 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki določajo zaporedje, po katerem CNS plačajo nadomestilo iz člena
    20(1) Uredbe (EU) 2021/23, največje število let, v katerih morajo navedene CNS
    uporabiti delež svojih letnih dobičkov za taka plačila lastnikom instrumentov,
    ki priznavajo terjatev glede njihovih prihodnjih dobičkov, in največji delež
    navedenih dobičkov, ki se uporabi za ta plačila
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/450 de la Comisión de 25 de noviembre de
    2022 por el que se completa el Reglamento (UE) 2021/23 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación por las
    que se especifica el orden en que las ECC deben pagar la indemnización a que
    se refiere el artículo 20, apartado 1, del Reglamento (UE) 2021/23, el número
    máximo de años durante el cual las ECC deben usar una proporción de sus beneficios
    anuales para efectuar esos pagos a los poseedores de instrumentos que reconozcan
    un crédito sobre sus beneficios futuros y la proporción máxima de dichos beneficios
    que debe usarse para efectuar esos pagos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/450 av den 25 november 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) 2021/23 vad
    gäller tekniska tillsynsstandarder för att specificera i vilken ordning centrala
    motparter ska betala ut den ersättning som avses i artikel 20.1 i förordning
    (EU) 2021/23, det maximala antal år under vilka dessa centrala motparter ska
    använda en andel av sina årliga vinster för sådana utbetalningar till innehavare
    av instrument som erkänner en fordran på deras framtida vinster och den maximala
    andel av dessa vinster som ska användas för dessa utbetalningar
  type: main
