  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/450 оd 25. studenoga 2022. o dopuni
    Uredbe (EU) 2021/23 Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se utvrđuje redoslijed prema kojem središnje druge ugovorne
    strane trebaju isplatiti nadoknadu iz članka 20. stavka 1. Uredbe (EU) 2021/23,
    maksimalni broj godina tijekom kojih te središnje druge ugovorne strane trebaju
    iskoristiti udio svoje godišnje dobiti za takva plaćanja posjednicima instrumenata
    kojima se priznaje potraživanje njihove buduće dobiti i maksimalni udio te dobiti
    koji treba upotrijebiti za ta plaćanja
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/450 felhatalmazáson alapuló rendelete (2022. november
    25.) az (EU) 2021/23 európai parlamenti és tanácsi rendeletnek az (EU) 2021/23
    rendelet 20. cikkének (1) bekezdésében említett kártalanítás központi
    szerződő felek általi kifizetésének sorrendjét, az említett központi szerződő
    felek által az éves nyereségükből a jövőbeli nyereségeikre vonatkozó
    követelést elismerő instrumentumok tulajdonosai részére teljesítendő fizetések
    éveinek maximális számát és az említett nyereségekből az említett kifizetésekre
