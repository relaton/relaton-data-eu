title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/450 of 25 November 2022 supplementing
    Regulation (EU) 2021/23 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the order in which CCPs are to pay
    the recompense referred to in Article 20(1) of Regulation (EU) 2021/23, the maximum
    number of years during which those CCPs are to use a share of their annual profits
    for such payments to possessors of instruments recognising a claim on their future
    profits and the maximum share of those profits that is to be used for those payments
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/450 de la Commission du 25 novembre 2022
    complétant le règlement (UE) 2021/23 du Parlement européen et du Conseil par
    une norme technique de réglementation précisant l’ordre dans lequel les contreparties
    centrales doivent verser le dédommagement visé à l’article 20, paragraphe
    1, du règlement (UE) 2021/23, le nombre maximal d’années durant lesquelles
    elles doivent utiliser une part de leurs bénéfices annuels aux fins des paiements
    aux détenteurs d’instruments reconnaissant une créance sur leurs bénéfices
    futurs et la part maximale de ces bénéfices à utiliser pour ces paiements
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/450 der Kommission vom 25. November 2022
    zur Ergänzung der Verordnung (EU) 2021/23 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung der Reihenfolge, in
    der CCPs die in Artikel 20 Absatz 1 der Verordnung (EU) 2021/23 genannte Entschädigung
    zu zahlen haben, der Höchstzahl von Jahren, in denen CCPs einen Anteil ihres
    Jahresgewinns für solche Zahlungen an Inhaber von einen Anspruch auf ihre künftigen
    Gewinne begründenden Instrumenten verwenden müssen, und des für diese Zahlungen
    zu verwendenden Höchstanteils an diesen Gewinnen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/450 на Комисията
    от 25 ноември 2022 година за допълнение на Регламент
    (ЕС) 2021/23 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за уточняване на реда, по който ЦК трябва да
    изплащат обезщетението, посочено в член 20,
    параграф 1 от Регламент (ЕС) 2021/23, максималния
    брой години, през които тези ЦК трябва да използват
    част от годишната си печалба за такива плащания
    в полза на притежателите на инструменти, с
    които се признава право на вземане върху бъдещата
    печалба на ЦК, и максималната част от тази печалба,
    която трябва да се използва за тези плащания
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/450 ze dne 25. listopadu
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2021/23,
    pokud jde o regulační technické normy upřesňující pořadí, v jakém mají
    ústřední protistrany vyplácet náhradu uvedenou v čl. 20 odst. 1 nařízení
    (EU) 2021/23, maximální počet let, během nichž mají tyto ústřední protistrany
    použít podíl svých ročních zisků na tyto platby držitelům nástrojů
    uznávajících nárok na jejich budoucí zisky, a maximální podíl těchto
    zisků, který má být použit na tyto platby
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/450 af 25. november 2022
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2021/23
    for så vidt angår reguleringsmæssige tekniske standarder med henblik på at
    præcisere, i hvilken rækkefølge CCP'er skal betale den kompensation, der er
    omhandlet i artikel 20, stk. 1, i forordning (EU) 2021/23, det maksimale antal
    år, hvor disse CCP'er skal anvende en del af deres årlige overskud til sådanne
    betalinger til indehavere af instrumenter, der anerkender et krav på deres fremtidige
    overskud, og den maksimale del af dette overskud, der skal anvendes til disse
    betalinger
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2023/450
    της Επιτροπής της 25ης Νοεμβρίου 2022 για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2021/23 του Ευρωπαϊκού Κοινοβουλίου
