id: EURegulation22571980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2257/80 of 27 August 1980 re-establishing
    the levying of customs duties on chamois-dressed leather, falling within heading
    No 41.06 and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2257/80 de la Commission, du 27 août 1980, portant
    rétablissement de la perception des droits de douane applicables aux cuirs et
    peaux chamoisés, de la position 41.06 du tarif douanier commun, originaires des
    pays en voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2257/80 der Kommission vom 27. August 1980 zur Wiedereinführung
    des Zollsatzes für Sämischleder (Chamoisleder) der Tarifnummer 41.06 mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2257/80 af 27. august 1980 om genindførelse
    af opkrævning af toldafgifter for semsgarvet læder (vaskeskind), under pos.
    41.06, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2257/80 della Commissione, del 27 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili al cuoio e pelli, scamosciati,
    della voce 41.06 della tariffa doganale comune, originari dei paesi in via di
    sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2257/80 van de Commissie van 27 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor zeemleder van post 41.06,
    van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
