  content: Commission Implementing Regulation (EU) 2021/1874 of 25 October 2021 correcting
    the German language versions of Regulation (EU) 2018/395 laying down detailed
    rules for the operation of balloons as well as for the flight crew licensing for
    balloons, and of Implementing Regulation (EU) 2018/1976 laying down detailed rules
    for the operation of sailplanes as well as for the flight crew licensing for sailplanes
  type: main
- language: fr
  script: Latn
