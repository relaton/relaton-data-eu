    de licences pour les membres d’équipage de conduite de ballons et du règlement
    d’exécution (UE) 2018/1976 établissant des règles détaillées concernant
    l’exploitation de planeurs ainsi que l’octroi de licences pour les membres
    d’équipage de conduite de planeurs
