---
id: EUDecision1978214
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 31 January 1978 authorizing the French Republic
    not to apply Community treatment to gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, of synthetic and regenerated textile fibres, falling
    within heading No ex 60.02 of the Common Customs Tariff, originating in Taiwan
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/214/CEE: Décision de la Commission, du 31 janvier 1978, autorisant
    la République française à exclure du traitement communautaire les gants de
    bonneterie non élastique ni caoutchoutée, de fibres textiles synthétiques et
    artificielles, de la position Ex 60.62 du Tarif douanier commun, originaires de
    Taiwan et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 31. Januar 1978, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch noch
    kautschutiert, aus synthetischen und künstlichen Spinnstoffen der Tarifnummer
    ex 60.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 31. januar 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage handsker, vanter og luffer
    af trikotage, ikke-elastisk eller gummeret af syntetiske og regenererede fibre,
    som henhører under pos. ex 60.02 i den fælles toldtarif, har oprindelse i Taiwan
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 31 gennaio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i guanti a maglia non elastica
    né gommata di fibre tessili sintetiche e artificiali della voce 60.02 della tariffa
    doganale comune, originari di Taiwan e messi in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 31 januari 1978 waarbij de Franse Republiek
    wordt gemachtigd handschoenen, wanten en dergelijke artikelen, van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk van synthetische en kunstmatige textielvezels
    van post ex 60.02 van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
