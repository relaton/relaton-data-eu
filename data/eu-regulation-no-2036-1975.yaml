title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2036/75 of the Commission of 5 August 1975 re-establishing
    the levying of customs duties on citric acid, falling within subheading 29.16
    A IV a), originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December 1974
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2036/75 de la Commission, du 5 août 1975, portant
    rétablissement de la perception des droits de douane applicables à l'acide citrique,
    de la sous- position tarifaire 29.16 A IVa), originaire des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2036/75 der Kommission vom 5. August 1975 zur Wiedereinführung
    des Zollsatzes für Zitronensäure der Tarifstelle 29.16 A IV a), mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3054/74 des Rates
    vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2036/75 af 5. august 1975 om genindførelse
    af opkrævning af toldafgifter for citronsyre under underposition 29.16 A IV a),
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2036/75 della Commissione, del 5 agosto 1975, che
    ripristina la riscossione dei dazi doganali applicabili all'acido citrico, della
    sottovoce doganale n. 29.16 A IV a) originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2036/75 van de Commissie van 5 augustus 1975 houdende
    wederinstelling van de heffing van de douanerechten voor citroenzuur, van onderverdeling
    29.16 A IV a), van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 tariefpreferenties
    werden geopend
  type: main
