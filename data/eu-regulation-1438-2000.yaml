    για ενέργειες βελτίωσης της παραγωγής και
    εμπορίας του μελιού
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1438/2000, annettu 30 päivänä kesäkuuta 2000,
    hunajan tuotannon ja kaupan pitämisen kehittämiseksi yhteisössä tarkoitettujen
    toimien soveltamista koskevista yleisistä säännöistä annetun neuvoston asetuksen
