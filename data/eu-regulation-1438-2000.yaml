    asetuksen (EY) N:o 2300/97 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1438/2000 della Commissione, del 30 giugno 2000, che
    modifica il regolamento (CE) n. 2300/97 recante modalità di applicazione del
    regolamento (CE) n. 1221/97 del Consiglio che stabilisce le regole generali di
    applicazione delle azioni dirette a migliorare la produzione e la commercializzazione
    del miele
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1438/2000 van de Commissie van 30 juni 2000 tot wijziging
    van Verordening (EG) nr. 2300/97 houdende uitvoeringsbepalingen van Verordening
    (EG) nr. 1221/97 van de Raad houdende algemene regels voor de uitvoering van de
    maatregelen tot verbetering van de productie en de afzet van honing
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1438/2000 da Comissão, de 30 de Junho de 2000, que
