    (EG) Nr. 1221/97 des Rates mit allgemeinen Durchführungsbestimmungen für Maßnahmen
    zur Verbesserung der Erzeugung und Vermarktung von Honig
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1438/2000 af 30. juni 2000 om ændring
