title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2209/84 of 30 July 1984 re-establishing
    the levying of customs duties on stockings, understockings, socks, ankle-socks,
    sockettes and the like, knitted or crocheted, not elastic or rubberized, products
    of category 12 (code 0120), originating in Sri Lanka, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2209/84 de la Commission du 30 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    bas, sous-bas, chaussettes, de bonneterie non élastique ni caoutchoutée, de
    la catégorie 12 (code 0120), originaires de Sri Lanka, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2209/84 der Kommission vom 30. Juli 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Strümpfe, Unterziehstrümpfe,
    Socken, gewirkt, weder gummielastisch noch kautschutiert, der Warenkategorie Nr.
    12 (Kennziffer 0120) mit Ursprung in Sri Lanka, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2209/84 af 30. juli 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte strømper, understrømper, af trikotage,
    ikke elastisk eller gummeret, under varekategori nr. 12 (kode 0120), som har oprindelse
    i Sri Lanka og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2209/84 της Επιτροπής
    της 30ής Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τις περικνημίδες
    εν γένει, περιπόδια, περιπόδια κοντά (σοσόνια)
    και παρόμοια είδη, έτερα των περικνημίδων εξ
    υφαντικών συνθετικών ινών για γυναίκες, προϊόντα
    της κατηγορίας 12 (κωδικός 0120), καταγωγής Σρι
    Λάνκα, δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2209/84 della Commissione del 30 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili a talune calze, sottocalze, calzini,
    a maglia non elastica né gommata, della categoria di prodotti n. 12 (codice 0120),
    originari dello Sri Lanka beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2209/84 van de Commissie van 30 juli 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kousen,
    onderkousen, sokken, voetjes en dergelijke artikelen, van niet-elastisch of van
    niet-gegummeerd brei- of haakwerk, van de categorie van produkten nr. 12 (codenummer
    0120), van oorsprong uit Sri Lanka, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
  type: main
