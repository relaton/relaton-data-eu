title:
- language: en
  script: Latn
  content: '88/245/EEC: Council Decision of 19 April 1988 authorizing the French Republic
    to apply in its overseas departments and in metropolitan France, by way of derogation
    from Article 95 of the Treaty, a reduced rate of the revenue duty imposed on the
    consumption of ''traditional'' rum produced in those departments'
  type: main
- language: fr
  script: Latn
  content: '88/245/CEE: Décision du Conseil du 19 avril 1988 autorisant la République
    française à appliquer dans ses départements d'' outre-mer et en France métropolitaine,
    en dérogation à l'' article 95 du traité, un taux réduit du droit fiscal frappant
    la consommation du rhum dit "traditionnel" produit dans ces départements'
  type: main
- language: de
  script: Latn
  content: '88/245/EWG: Entscheidung des Rates vom 19. April 1988 zur Ermächtigung
    der Französischen Republik, in ihren überseeischen Departements und im französischen
    Mutterland in Abweichung von Artikel 95 des Vertrages auf in diesen Departements
    hergestellten sogenannten ,,traditionellen" Rum einen ermäßigten Verbrauchsteuersatz
    anzuwenden'
  type: main
- language: da
  script: Latn
  content: '88/245/EØF: Rådets beslutning af 19. april 1988 om bemyndigelse af Den
    Franske Republik til i de oversøiske franske departementer og i det franske moderland
    uanset Traktatens artikel 95 at anvende en reduceret forbrugsafgiftssats for såkaldt
    "traditionel" rom fremstillet i disse departementer'
  type: main
- language: el
  script: Grek
  content: '88/245/ΕΟΚ: Απόφαση του Συμβουλίου της 19ης
    Απριλίου 1988 με την οποία επιτρέπεται στη Γαλλική
    Δημοκρατία να εφαρμόζει στα υπερπόντια διαμερίσματά
    της και στη μητροπολιτική Γαλλία, κατά παρέκκλιση
    από το άρθρο 95 της συνθήκης, μειωμένο ποσοστό
    φόρου καταναλώσεως για το λεγόμενο «παραδοσιακό»
    ρούμι που παράγεται σ αυτά τα διαμερίσματα'
  type: main
- language: it
  script: Latn
  content: '88/245/CEE: Decisione del Consiglio del 19 aprile 1988 che autorizza la
    Repubblica francese ad applicare nei suoi dipartimenti d'' oltremare e nella Francia
    metropolitana, in deroga all'' articolo 95 del trattato, un'' aliquota ridotta
    del dazio fiscale sul consumo del rum denominato "tradizionale", prodotto in tali
    dipartimenti'
  type: main
- language: nl
  script: Latn
  content: '88/245/EEG: Beschikking van de Raad van 19 april 1988 waarbij de Franse
    Republiek wordt gemachtigd om in haar overzeese departementen en in het moederland
    in afwijking van artikel 95 van het Verdrag een verminderd belastingtarief toe
    te passen op het verbruik van in deze departementen geproduceerde zogenaamde traditionele
    rum'
  type: main
- language: pt
  script: Latn
  content: '88/245/CEE: Decisão do Conselho de 19 de Abril de 1988 que autoriza a
    República Francesa a aplicar nos seus departamentos ultramarinos e na França
    metropolitana, em derrogação ao artigo 95. do Tratado, uma taxa reduzida do
    direito fiscal aplicável ao consumo do rum dito "tradicional" produzido nesses
    departamentos'
  type: main
- language: es
  script: Latn
  content: '88/245/CEE: Decisión del Consejo de 19 de abril de 1988 por la que se
    autoriza a la República Francesa a que aplique en sus departamentos de Ultramar
    y en Francia metropolitana, como excepción al artículo 95 del Tratado, un tipo
    reducido de derecho fiscal para gravar el consumo del ron denominado "tradicional"
    producido en dichos departamentos'
