---
id: EUDecision202212
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/12 of 2 December 2021 on the position to be
    taken on behalf of the European Union at the 22nd meeting of the Contracting Parties
    to the Convention for the Protection of the Marine Environment and the Coastal
    Region of the Mediterranean (Barcelona Convention) and its Protocols as regards
    the adoption of a decision to submit a proposal to designate the Mediterranean
    Sea, as a whole, as an emission control area for sulphur oxides (Med SOx ECA)
    pursuant to Annex VI to the International Convention for the Prevention of Pollution
    from Ships (MARPOL Convention)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/12 du Conseil du 2 décembre 2021 relative à la position
    à prendre, au nom de l’Union européenne, lors de la 22e réunion des parties
    contractantes à la convention sur la protection du milieu marin et du littoral
    de la Méditerranée (convention de Barcelone) et à ses protocoles en ce qui
    concerne l’adoption d’une décision de présenter une proposition en vue de
    désigner la mer Méditerranée, dans son ensemble, en tant que zone de contrôle
    des émissions d’oxydes de soufre (ECA SOx Med) au titre de l’annexe VI de
    la convention internationale pour la prévention de la pollution par les navires
    (convention MARPOL)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/12 des Rates vom 2. Dezember 2021 über den Standpunkt,
    der auf der 22. Tagung der Vertragsparteien des Übereinkommens zum Schutz der
    Meeresumwelt und der Küstengebiete des Mittelmeers (Übereinkommen von Barcelona)
    und seiner Protokolle zu dem Erlass eines Beschlusses zur Unterbreitung eines
    Vorschlags für die Ausweisung des gesamten Mittelmeers als Emissions-Überwachungsgebiet
    für Schwefeloxide (Med SOx ECA) gemäß Anlage VI zum Internationalen Übereinkommen
    zur Verhütung der Meeresverschmutzung durch Schiffe (MARPOL-Übereinkommen) im
    Namen der Europäischen Union zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/12 на Съвета от 2 декември
    2021 година относно позицията, която трябва да
    се заеме от името на Европейския съюз на 22-рата
    среща на договарящите се страни по Конвенцията
    за защита на морската среда и на крайбрежните
    райони в Средиземноморието (Конвенцията от
    Барселона) и протоколите към нея по отношение
    на приемането на решение за представяне на
    предложение за определяне на цялото Средиземно
    море като зона за контрол на емисиите на серни
    оксиди (Med SOx ECA) съгласно приложение VI към Международната
    конвенция за предотвратяване на замърсяването
    от кораби (Конвенция MARPOL)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/12 ze dne 2. prosince 2021 o postoji, který
    má být zaujat jménem Evropské unie na 22. zasedání smluvních stran Úmluvy
    o ochraně mořského prostředí a pobřežní oblasti Středomoří (Barcelonská
    úmluva) a jejích protokolů, pokud jde o přijetí rozhodnutí o předložení
    návrhu, kterým se Středozemní moře jako celek stanoví oblastí kontroly
    emisí oxidů síry (oblast kontroly emisí SOx ve Středozemním moři) podle
    přílohy VI Mezinárodní úmluvy o zamezení znečištění moří z lodí (úmluva
    MARPOL)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/12 af 2. december 2021 om den holdning, der
    skal indtages på Den Europæiske Unions vegne på det 22. møde mellem de kontraherende
    parter i konventionen om beskyttelse af Middelhavets havmiljø og kystområder
    (Barcelonakonventionen) og protokollerne hertil, til vedtagelsen af en afgørelse
    om udpegelse af Middelhavet som helhed som et SOx-emissionskontrolområde (Med
    SOx ECA) i henhold til bilag VI til den internationale konvention om forebyggelse
    af forurening fra skibe (MARPOL-konventionen)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2022/12 του Συμβουλίου της 2ας
    Δεκεμβρίου 2021 σχετικά με τη θέση που πρέπει
    να ληφθεί εξ ονόματος της Ευρωπαϊκής Ένωσης
    κατά την 22η σύνοδο της διάσκεψης των συμβαλλόμενων
    μερών της σύμβασης για την προστασία του θαλάσσιου
    περιβάλλοντος και των παράκτιων περιοχών της
    Μεσογείου (σύμβαση της Βαρκελώνης) και των
    πρωτοκόλλων της όσον αφορά την έκδοση απόφασης
    για την υποβολή πρότασης για τον χαρακτηρισμό
    της Μεσογείου Θαλάσσης, στο σύνολό της, ως περιοχής
    ελέγχου των εκπομπών οξειδίων του θείου (Med
    SOx ECA) σύμφωνα με το παράρτημα VI της διεθνούς
    σύμβασης για την πρόληψη της ρύπανσης από πλοία
    (σύμβαση MARPOL)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2022/12, 2. detsember 2021, seisukoha kohta, mis võetakse
    Euroopa Liidu nimel Vahemere merekeskkonna ja rannikuala kaitse konventsiooni
    (Barcelona konventsioon) ja selle protokollide osalisriikide 22. istungil vastu
    võetava otsuse suhtes, millega tehakse ettepanek määrata Vahemeri tervikuna
    vääveloksiidi heite kontrollimise piirkonnaks (Med SOx ECA) vastavalt rahvusvahelise
    laevade põhjustatava merereostuse vältimise konventsiooni (MARPOLi konventsioon)
    VI lisale
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2022/12, annettu 2 päivänä joulukuuta 2021,
    Välimeren merellisen ympäristön ja rannikkoalueiden suojelemisesta tehdyn yleissopimuksen
    (Barcelonan yleissopimus) ja sen pöytäkirjojen sopimuspuolten 22. kokouksessa
    Euroopan unionin puolesta otettavasta kannasta päätökseen toimittaa ehdotus
    koko Välimeren nimeämisestä rikkioksidipäästöjen valvonta-alueeksi (MED
    SOx ECA) aluksista aiheutuvan meren pilaantumisen ehkäisemisestä tehdyn kansainvälisen
    yleissopimuksen (Marpol-yleissopimus) liitteen VI mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2022/12 ón gComhairle an 2 Nollaig 2021 maidir leis an seasamh
    atá le glacadh thar ceann an Aontais Eorpaigh ag an 22ú cruinniú de na Páirtithe
    Conarthacha sa Choinbhinsiún maidir le Cosaint Mhuirthimpeallacht agus Réigiún
    Cósta na Meánmhara (Coinbhinsiún Barcelona) gona Phrótacail a mhéid a bhaineann
    le chinneadh a ghlacadh chun an Mheánmhuir, ina hiomláine, a ainmniú mar limistéar
    rialála astaíochtaí ocsaídí sulfair (ECA SOx na Meánmhara) de bhun Iarscríbhinn
    VI a ghabhann leis an gCoinbhinsiún Idirnáisiúnta um Thruailliú ó Longa a
    Chosc (Coinbhinsiún MARPOL)
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/12 od 2. prosinca 2021. o stajalištu koje u ime
    Europske unije treba zauzeti na 22. sastanku ugovornih stranaka Konvencije o zaštiti
    morskog okoliša i obalnog područja Sredozemlja (Barcelonska konvencija) i njezinih
    protokola u pogledu donošenja odluke o podnošenju prijedloga za proglašenje
    cijelog Sredozemnog mora područjem kontrole emisija sumporovih oksida (Med SOx
    ECA), u skladu s Prilogom VI. Međunarodnoj konvenciji o sprečavanju onečišćenja
    s brodova (Konvencija MARPOL)
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/12 határozata (2021. december 2.) a Földközi-tenger
    tengeri környezetének és partvidékének szennyezés elleni védelméről szóló
    egyezmény (a Barcelonai Egyezmény) és jegyzőkönyvei szerződő feleinek 22.
    ülésén a Földközi-tenger teljes területének a hajókról történő szennyezés
    megelőzéséről szóló nemzetközi egyezmény (MARPOL-egyezmény) VI. melléklete
    alapján kénoxid-kibocsátás-ellenőrzési területként (Med SOx ECA) való
    kijelölésére vonatkozó javaslat benyújtásáról szóló határozat elfogadására
    tekintettel az Európai Unió nevében képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/12 del Consiglio del 2 dicembre 2021 relativa alla
    posizione da adottare a nome dell’Unione europea alla 22a riunionedelle parti
    contraenti della convenzione sulla protezione dell’ambiente marinoe del litorale
    del Mediterraneo (convenzione di Barcellona) e dei relativi protocolliin merito
    all’adozione di una decisione volta a presentare una proposta tesa a designareil
    Mar Mediterraneo nel suo insieme come zona di controllo delle emissionidi ossidi
    di zolfo (Med SOx ECA) a norma dell’allegato VI della convenzione internazionaleper
    la prevenzione dell’inquinamento causato da navi («convenzione MARPOL»)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2022/12 (2021. gada 2. decembris) par nostāju, kas
    Eiropas Savienības vārdā jāieņem Konvencijas par Vidusjūras reģiona jūras
    vides un piekrastes aizsardzību (Barselonas konvencija) un tās protokolu Līgumslēdzēju
    pušu konferences 22. sanāksmē attiecībā uz tāda lēmuma pieņemšanu, ar
    kuru, ievērojot Starptautiskās konvencijas par piesārņojuma novēršanu no
    kuģiem (MARPOL konvencija) VI pielikumu, iesniedz priekšlikumu visu Vidusjūru
    noteikt par sēra oksīdu emisijas kontroles zonu (Med SOx ECA)
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2022/12 2021 m. gruodžio 2 d. dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi 22-ajame Viduržemio jūros
    aplinkos ir pakrančių zonos apsaugos konvencijos (Barselonos konvencijos) ir
    jos protokolų susitariančiųjų šalių susitikime, dėl sprendimo pateikti
    pasiūlymą pagal Tarptautinės konvencijos dėl teršimo iš laivų prevencijos
    (MARPOL konvencijos) VI priedą visą Viduržemio jūrą nustatyti kaip sieros
    oksidų išmetimo kontrolės rajoną (Med SOx ECA) priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2022/12 tat-2 ta’ Diċembru 2021 dwar il-pożizzjoni
    li għandha tittieħed f’isem l-Unjoni Ewropea fit-22 laqgħa tal-Konferenza
    tal-Partijiet Kontraenti għall-Konvenzjoni għall-Protezzjoni tal-Ambjent tal-Baħar
    u tar-Reġjun Kostali tal-Mediterran (Konvenzjoni ta’ Barċellona) u l-Protokolli
    tagħha fir-rigward tal-adozzjoni ta’ deċiżjoni li tippreżenta proposta li
    tiddeżinja l-Baħar Mediterran, fl-intier tiegħu, bħala żona ta’ kontroll
    tal-emissjonijiet għall-ossidi tal-kubrit (Med SOx ECA) skont l-Anness VI għall-Konvenzjoni
    Internazzjonali għall-Prevenzjoni tat-Tniġġis minn Vapuri (Konvenzjoni MARPOL)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2022/12 van de Raad van 2 december 2021 betreffende het namens
    de Europese Unie in te nemen standpunt tijdens de 22e vergadering van de partijen
    bij het Verdrag inzake de bescherming van het mariene milieu en de kustgebieden
    van de Middellandse Zee (Verdrag van Barcelona) en de bijbehorende protocollen,
    wat betreft de vaststelling van een besluit om de Middellandse Zee, in zijn geheel,
    aan te wijzen als beheersgebied voor SOx-emissies (Med SOx ECA) krachtens bijlage
    VI bij het Internationaal Verdrag ter voorkoming van verontreiniging door schepen
    (Marpol-Verdrag)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/12 z dnia 2 grudnia 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej na 22. posiedzeniu Umawiających
    się Stron Konwencji o ochronie środowiska morskiego i regionu przybrzeżnego
    Morza Śródziemnego („konwencja barcelońska”) I protokołów do niej, w
    odniesieniu do przyjęcia decyzji o przedłożeniu wniosku w sprawie wyznaczenia
    Morza Śródziemnego w całości jako obszaru kontroli emisji tlenków siarki
    („Med SOx ECA”) zgodnie z załącznikiem VI do Międzynarodowej konwencji
    o zapobieganiu zanieczyszczaniu morza przez statki („konwencja MARPOL”)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/12 do Conselho de 2 de dezembro de 2021 relativa à
    posição a tomar em nome da União Europeia na 22.a reunião das Partes Contratantes
    na Convenção sobre a Proteção do Meio Marinho e do Litoral do Mediterrâneo
    («Convenção de Barcelona») e respetivos protocolos no que respeita à adoção
    de uma decisão de apresentação de uma proposta para designar o mar Mediterrâneo,
    no seu conjunto, como zona de controlo das emissões de óxidos de enxofre (Med
    SOx ECA), nos termos do anexo VI da Convenção Internacional para a Prevenção
    da Poluição por Navios («Convenção MARPOL»)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/12 a Consiliului din 2 decembrie 2021 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene, la cea de a 22-a
    reuniune a părților contractante la Convenția privind protejarea mediului marin
    și a zonei de coastă a Mării Mediterane (Convenția de la Barcelona) și la
    protocoalele la aceasta, în ceea ce privește adoptarea unei decizii de prezentare
    a unei propuneri de desemnare a Mării Mediterane, în ansamblul său, ca zonă
    de control al emisiilor de SOx (Med SOx ECA) în conformitate cu anexa VI la Convenția
    internațională pentru prevenirea poluării de către nave (Convenția MARPOL)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/12 z 2. decembra 2021 o pozícii, ktorá sa
    má v mene Európskej únie zaujať na 22. zasadnutí zmluvných strán Dohovoru
    o ochrane morského prostredia a pobrežných oblastí Stredozemného mora (Barcelonský
    dohovor) a jeho protokolov, pokiaľ ide o prijatie rozhodnutia o predložení
    návrhu na vyhlásenie Stredozemného mora ako celku za oblasť kontroly emisií
    oxidov síry (oblasť kontroly SOx v Stredozemnom mori) podľa prílohy VI k Medzinárodnému
    dohovoru o zabránení znečisťovaniu z lodí (dohovor MARPOL)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/12 z dne 2. decembra 2021 o stališču, ki se v imenu
    Evropske unije zastopa na 22. zasedanju pogodbenic Konvencije za varstvo morskega
    okolja in obalnega območja Sredozemlja (Barcelonska konvencija) in njenih protokolov
    glede sprejetja sklepa o predložitvi predloga o določitvi Sredozemskega morja
    kot celote za območje nadzora nad emisijami žveplovih oksidov (Med SOx ECA)
    na podlagi Priloge VI k Mednarodni konvenciji o preprečevanju onesnaževanja
    morja z ladij (Konvencija MARPOL)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/12 del Consejo de 2 de diciembre de 2021 relativa a
    la posición que debe adoptarse en nombre de la Unión Europea en la 22.a reunión
    de las Partes Contratantes en el Convenio para la Protección del Medio Marino
    y de la Región Costera del Mediterráneo (Convenio de Barcelona) y sus Protocolos,
    con respecto a la adopción de una decisión por la que se presentará una propuesta
    para designar el mar Mediterráneo en su totalidad zona de control de emisiones
    de óxidos de azufre (Med SOx ECA), de acuerdo con el anexo VI del Convenio Internacional
    para Prevenir la Contaminación por los Buques (Convenio MARPOL)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/12 av den 2 december 2021 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar vid det 22:a mötet för de fördragsslutande
    parterna i konventionen om skydd av Medelhavets marina miljö och kustregion (Barcelonakonventionen)
    och dess protokoll vad gäller antagandet av ett beslut om att lägga fram ett
    förslag om att utse Medelhavet som helhet till utsläppskontrollområde för
    svaveloxider (Med SOx ECA) i enlighet med bilaga VI till den internationella konventionen
    till förhindrande av förorening från fartyg (Marpolkonventionen)
  type: main
