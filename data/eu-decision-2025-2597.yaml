  content: Council Decision (EU) 2025/2597 of 8 December 2025 on the position to be
    taken on behalf of the European Union within the Committee of the Parties to the
    Council of Europe Convention on preventing and combating violence against women
    and domestic violence, at its 19th meeting, on the recommendations and conclusions
    addressed to certain Parties on their implementation of that Convention, with
    regard to matters related to institutions and public administration of the Union
  type: main
- language: fr
