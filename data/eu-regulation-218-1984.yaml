title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 218/84 of 18 January 1984 amending Regulation
    (EEC) No 2618/80 instituting a specific Community regional development measure
    contributing to improving security of energy supply in certain Community regions
    by way of improved use of new techniques for hydro-electrical power and alternative
    energy sources
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 218/84 du Conseil du 18 janvier 1984 modifiant le règlement
    (CEE) no 2618/80 instituant une action communautaire spécifique de développement
    régional contribuant à améliorer la sécurité des approvisionnements en énergie
    de certaines régions de la Communauté par une meilleure utilisation des technologies
    nouvelles en matière d'hydro-électricité et d'énergies alternatives
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 218/84 des Rates vom 18. Januar 1984 zur Änderung
    der Verordnung (EWG) Nr. 2618/80 zur Einführung einer spezifischen Gemeinschaftsmaßnahme
    zur regionalen Entwicklung im Hinblick auf die Verbesserung der Sicherheit der
    Energieversorgung in einigen Gebieten der Gemeinschaft durch eine stärkere Nutzung
    neuer Technologien im Bereich der Stromgewinnung aus Wasserkraft und den Ausbau
    alternativer Energiequellen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 218/84 af 18. januar 1984 om ændring af
    forordning (EØF) nr. 2618/80 om gennemførelse af en særlig fællesskabsaktion
    med henblik på regionaludvikling, der skal bidrage til større sikkerhed for
    energiforsyningen til visse regioner i Fællesskabet gennem en bedre udnyttelse
    af den nye teknologi i forbindelse med vandkraft og alternative energiformer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 218/84 του Συμβουλίου
    της 18ης Ιανουαρίου 1984 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2618/80 περί ανάληψης ειδικής
    κοινοτικής ενέργειας περιφερειακής ανάπτυξης
    για τη συμβολή στη βελτίωση της ασφάλειας των
    προμηθειών σε ενέργεια ορισμένων περιφερειών
    της Κοινότητας διά της καλύτερης χρησιμοποίησης
    των νέων τεχνολογιών στον τομέα της υδροηλεκτρικής
    ενέργειας και των εναλλακτικών πηγών ενέργειας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 218/84 del Consiglio del 18 gennaio 1984 recante modifica
    del regolamento (CEE) n. 2618/80 che istituisce un'azione comunitaria specifica
    di sviluppo regionale per contribuire a una maggiore sicurezza degli approvvigionamenti
    energetici di talune regioni della Comunità mediante una migliore utilizzazione
    delle nuove tecnologie in materia di idroelettricità e di energie alternative
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 218/84 van de Raad van 18 januari 1984 houdende wijziging
    van Verordening (EEG) nr. 2618/80 tot instelling van een specifieke communautaire
    actie voor regionale ontwikkeling om bij te dragen tot een grotere veiligstelling
    van de energievoorziening in sommige regio's van de Gemeenschap door een beter
    gebruik van nieuwe technieken inzake stroomopwekking uit waterkracht en inzake
    alternatieve energiebronnen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 218/84 do Conselho, de 18 de Janeiro de 1984, que
    altera o Regulamento (CEE) nº 2618/80 que institui uma acção comunitária específica
    de desenvolvimento regional para contribuir para melhorar a segurança do abastecimento
    em energia de certas regiões da Comunidade através de uma melhor utilização
    das novas tecnologias em matéria de energia hidroeléctrica e de energias alternativas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 218/84 del Consejo, de 18 de enero de 1984, por el
    que se modifica el Reglamento (CEE) n° 2618/80 por el que se establece una acción
    comunitaria específica de desarrollo regional que contribuya a mejorar la seguridad
    en los abastecimientos de energía de determinadas regiones de la Comunidad mediante
    una mejor utilización de las nuevas tecnologías en materia hidroeléctrica y
    de energías alternativas
  type: main
