title:
- language: en
  script: Latn
  content: '85/168/EEC: Commission Decision of 13 February 1985 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of tableware and other
    articles of a kind commonly used for domestic or toilet purposes, of porcelain
    or china, of stoneware, of earthenware or fine pottery originating in the People''s
    Republic of China, which have been put into free circulation in the Community
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/168/CEE: Décision de la Commission du 13 février 1985 autorisant
    le Royaume-Uni à procéder à une surveillance intracommunautaire des importations
    de vaisselle et articles de ménage ou de toilette en porcelaine, en grès, en
    faïence ou en poterie fine et en autres matières céramiques, originaires de
    la République populaire de Chine et mis en libre pratique dans la Communauté
    (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '85/168/EWG: Entscheidung der Kommission vom 13. Februar 1985 zur Ermächtigung
    des Vereinigten Königreichs zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus der Volksrepublik China stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Geschirr, Haushalts- und Toilettengegenstände,
    aus Porzellan, aus Steinzeug, aus Steingut oder feinen Erden und aus anderen keramischen
    Stoffen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/168/EØF: Kommissionens beslutning af 13. februar 1985 om bemyndigelse
    af Det forenede Kongerige til at indføre tilsyn inden for Fællesskabet med indførsel
    af bordservice samt husholdnings- og toiletartikler, af porcelæn, stentøj, fajance
    eller fint ler og af andet keramisk materiale med oprindelse i Den kinesiske Folkerepublik
    til fri omsætning i Fællesskabet (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/168/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Φεβρουαρίου 1985 περί χορηγήσεως αδείας στο
    Ηνωμένο Βασίλειο για την καθιέρωση ενδοκοινοτικής
    επίβλεψης των εισαγωγών επιτραπέζιων σκευών
    και ειδών οικιακής χρήσεως ή ευπρεπισμού, από
    πορσελάνη, ψευδοπορσελάνη, φαγεντιανή γη ή
    από απομίμηση πορσελάνης και άλλες κεραμευτικές
    ύλες καταγωγής Λαϊκής Δημοκρατίας της Κίνας
    οι οποίες ευρίσκονται σε ελεύθερη κυκλοφορία
    στην Κοινότητα (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/168/CEE: Decisione della Commissione del 13 febbraio 1985 che autorizza
    il Regno Unito ad istituire una sorveglianza intracomunitaria delle importazioni
    di vasellame ed oggetti di uso domestico da toletta, di porcellana, di grès,
    di maiolica o di terraglia, nonché di altre materie ceramiche, originarie della
    Repubblica popolare di Cina e messe in libera pratica nella Comunità (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/168/EEG: Beschikking van de Commissie van 13 februari 1985 houdende
    machtiging van het Verenigd Koninkrijk tot toepassing van een intracommunautair
    toezicht ten aanzien van de invoer van vaatwerk, huishoudelijke artikelen en toiletartikelen,
    van porcelein, van gres, van faïence of van fijn aardewerk, of van andere keramische
    stoffen, van oorsprong uit de Volksrepubliek China, die in de Gemeenschap in het
    vrije verkeer zijn gebracht (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
