title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1595/97 of 24 July 1997 amending Regulation
    (EC) No 3066/95 establishing certain concessions in the form of Community tariff
    quotas for certain agricultural products and providing for the adjustment, as
    an autonomous and transitional measure, of certain agricultural concessions provided
    for in the Europe Agreements to take account of the Agreement on agriculture concluded
    during the Uruguay Round Multilateral Trade Negotiations, and repealing Regulation
    (EEC) No 1988/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1595/97 du Conseil du 24 juillet 1997 modifiant le
    règlement (CE) nº 3066/95 établissant certaines concessions sous forme de contingents
    tarifaires communautaires pour certains produits agricoles et prévoyant une adaptation
    autonome et transitoire de certaines concessions agricoles prévues par les accords
    européens afin de tenir compte de l'accord sur l'agriculture conclu dans le cadre
    des négociations commerciales multilatérales du cycle d'Uruguay, et abrogeant
    le règlement (CEE) nº 1988/93
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1595/97 des Rates vom 24. Juli 1997 zur Änderung der
    Verordnung (EG) Nr. 3066/95 über Zugeständnisse in Form von gemeinschaftlichen
    Zollkontingenten für bestimmte landwirtschaftliche Erzeugnisse und zur autonomen
    und befristeten Anpassung bestimmter in den Europa-Abkommen vorgesehener Zugeständnisse
    für landwirtschaftliche Erzeugnisse, um dem im Rahmen der multilateralen Handelsverhandlungen
    der Uruguay-Runde geschlossenen Übereinkommen über die Landwirtschaft Rechnung
    zu tragen, und zur Aufhebung der Verordnung (EWG) Nr. 1988/93
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1595/97 af 24. juli 1997 om ændring af forordning
    (EF) nr. 3066/95 om visse indrømmelser i form af EF-toldkontingenter for en række
    landbrugsprodukter og om autonom og midlertidig tilpasning af visse landbrugsindrømmelser
    i Europaaftalerne for at tage hensyn til den landbrugsaftale, som er indgået
    under de multilaterale handelsforhandlinger i Uruguay-rundens regi, og om ophævelse
    af forordning (EØF) nr. 1988/93
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1595/97 του Συμβουλίου
    της 24ης Ιουλίου 1997 για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 3066/95 για τη θέσπιση ορισμένων παραχωρήσεων
    υπό μορφή κοινοτικών δασμολογικών ποσοστώσεων
    όσον αφορά ορισμένα γεωργικά προϊόντα, και
    για αυτόνομη και μεταβατική προσαρμογή ορισμένων
    γεωργικών παραχωρήσεων που προβλέπονται στις
    ευρωπαϊκές συμφωνίες, προκειμένου να ληφθεί
    υπόψη η συμφωνία για τη γεωργία που έχει συναφθεί
    στο πλαίσιο των πολυμερών εμπορικών διαπραγματεύσεων
    του Γύρου της Ουρουγουάης, και για την κατάργηση
    του κανονισμού (ΕΟΚ) αριθ. 1988/93
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1595/97, annettu 24 päivänä heinäkuuta 1997,
    tietyille maataloustuotteille yhteisön tariffikiintiöinä tehdyistä tietyistä
    myönnytyksistä ja tiettyjen Eurooppa-sopimuksissa määrättyjen maataloutta
    koskevien myönnytysten riippumattomasta mukauttamisesta siirtymäkauden aikana
    Uruguayn kierroksen monenvälisten kauppaneuvottelujen osana tehdyn maataloussopimuksen
    huomioon ottamiseksi annetun asetuksen (EY) N:o 3066/95 muuttamisesta ja asetuksen
    (ETY) N:o 1988/93 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1595/97 del Consiglio del 24 luglio 1997 che modifica
    il regolamento (CE) n. 3066/95, che stabilisce talune concessioni sotto forma
    di contingenti tariffari comunitari per taluni prodotti agricoli e prevede l'adeguamento
    autonomo e transitorio di talune concessioni agricole previste dagli accordi europei
    al fine di tener conto dell'accordo sull'agricoltura concluso nel quadro dei negoziati
    commerciali multilaterali dell'Uruguay Round e che abroga il regolamento (CEE)
    n. 1988/93
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1595/97 van de Raad van 24 juli 1997 tot wijziging
    van Verordening (EG) nr. 3066/95 houdende vaststelling, in verband met de in het
    kader van de multilaterale handelsbesprekingen van de Uruguay- ronde gesloten
    overeenkomsten inzake de landbouw, van bepaalde concessies in de vorm van communautaire
    tariefcontingenten voor bepaalde landbouwproducten en van een autonome overgangsregeling
    tot aanpassing van bepaalde in de Europa-overeenkomsten opgenomen landbouwconcessies,
    en tot intrekking van Verordening (EEG) nr. 1988/93
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1595/97 do Conselho de 24 de Julho de 1997 que altera
    o Regulamento (CE) nº 3066/95 que estabelece determinadas concessões sob a foma
    de contingentes pautais comunitários para certos produtos agrícolas e que prevê
    a adaptação autónoma e transitória de certas concessões agrícolas previstas
    nos acordos europeus para ter em conta o acordo sobre agricultura celebrado no
    âmbito das negociações comerciais multilaterais do «Uruguay Round» e que
    revoga o Regulamento (CEE) nº 1988/93
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1595/97 del Consejo de 24 de julio de 1997 que modifica
    el Reglamento (CE) nº 3066/95 por el que se establecen determinadas concesiones
    en forma de contingentes arancelarios comunitarios para determinados productos
    agrícolas y se adaptan, con carácter autónomo y transitorio, determinadas concesiones
    agrícolas previstas en los Acuerdos europeos con el fin de tener en cuenta el
    acuerdo sobre agricultura celebrado en el marco de las negociaciones comerciales
    multilaterales de la Ronda Uruguay, y por el que se deroga el Reglamento (CEE)
    nº 1988/93
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1595/97 av den 24 juli 1997 om ändring av
    förordning (EG) nr 3066/95 om införande av vissa koncessioner i form av gemenskapstullkvoter
    för vissa jordbruksprodukter och om autonom anpassning under en övergångsperiod
    av vissa jordbrukskoncessioner som föreskrivs i Europaavtalen i syfte att beakta
    det jordbruksavtal som ingåtts inom ramen för de multilaterala handelsförhandlingarna
    under Uruguayrundan och om upphävande av förordning (EEG) nr 1988/93
  type: main
