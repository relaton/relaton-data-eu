title:
- language: en
  script: Latn
  content: '93/32/EEC: Commission Decision of 16 December 1992 amending Decision 89/279/EEC
    authorizing certain Member States provisionally to provide for derogations from
    certain provisions of Council Directive 77/93/EEC, in respect of plants of Juniperus
    L. originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '93/32/CEE: Décision de la Commission, du 16 décembre 1992, modifiant
    la décision 89/279/CEE autorisant certains Etats membres à prévoir provisoirement
    des dérogations à certaines dispositions de la directive 77/93/CEE du Conseil
    pour les végétaux de Juniperus L. originaires du Japon'
  type: main
- language: de
  script: Latn
  content: '92/32/EWG: Entscheidung der Kommission vom 16. Dezember 1992 zur Änderung
    der Entscheidung 89/279/EWG zur einstweiligen Ermächtigung bestimmter Mitgliedstaaten,
    für Pflanzen von Juniperus L. mit Ursprung in Japan Ausnahmen von bestimmten
    Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen'
  type: main
- language: da
  script: Latn
  content: '93/32/EØF: Kommissionens beslutning af 16. december 1992 om ændring
    af beslutning 89/279/EØF om midlertidig bemyndigelse af visse medlemsstater til
    at undtage planter af Juniperus L. med oprindelse i Japan fra visse bestemmelser
    i Rådets direktiv 77/93/EØF'
  type: main
- language: el
  script: Grek
  content: '93/32/ΕΟΚ: Απόφαση της Επιτροπής της 16ης Δεκεμβρίου
    1992 για την τροποποίηση της οδηγίας 89/279/ΕΟΚ
    που επιτρέπει σε ορισμένα κράτη μέλη να προβλέπουν
    προσωρινά παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου, όσον αφορά
    τα φυτά του είδους Juniperus L., καταγωγής Ιαπωνίας'
  type: main
- language: it
  script: Latn
  content: '93/32/CEE: Decisione della Commissione, del 16 dicembre 1992, recante
    modifica della decisione 89/279/CEE della Commissione che autorizza alcuni Stati
    membri a derogare provvisoriamente a determinate disposizioni della direttiva
    77/93/CEE del Consiglio per quanto riguarda i vegetali di Juniperus L. originari
    del Giappone'
  type: main
- language: nl
  script: Latn
  content: '93/32/EEG: Beschikking van de Commissie van 16 december 1992 tot wijziging
    van Beschikking 89/279/EEG houdende machtiging van bepaalde Lid-Staten om, voor
    planten van Juniperus L., van oorsprong uit Japan, voorlopig afwijkingen van sommige
    bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan'
  type: main
- language: pt
  script: Latn
  content: '93/32/CEE: Decisão da Comissão, de 16 de Dezembro de 1992, que altera
    a Decisão 89/279/CEE, que autoriza certos Estados-membros a prever provisoriamente
    derrogações a determinadas disposições da Directiva 77/93/CEE do Conselho,
    para plantas de Juniperus L. originárias do Japão'
  type: main
- language: es
