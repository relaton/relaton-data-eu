title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1214/98 of 11 June 1998 amending Regulation
    (EC) No 2327/97 opening Community tariff quotas for 1998 for sheep, goats, sheepmeat
    and goatmeat falling within CN codes 0104 10 30, 0104 10 80, 0104 20 10, 0104
    20 90 and 0204 and derogating from Regulation (EC) No 1439/95 laying down detailed
    rules for the application of Council Regulation (EEC) No 3013/89 as regards the
    import and export of products in the sheepmeat and goatmeat sector
  type: main
- language: fr
  script: Latn
