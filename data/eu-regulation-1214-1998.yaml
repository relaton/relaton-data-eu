    le règlement (CE) nº 2327/97 portant ouverture de contingents tarifaires communautaires
    au titre de 1998 pour les animaux vivants des espèces ovine et caprine et pour
    la viande des animaux des espèces ovine et caprine relevant des codes NC 0104
    10 30, 0104 10 80, 0104 20 10, 0104 20 90 et 0204, et portant dérogation au règlement
    (CE) nº 1439/95 établissant les modalités d'application du règlement (CEE)
    nº 3013/89 du Conseil en ce qui concerne l'importation et l'exportation de produits
    du secteur des viandes ovine et caprine
  type: main
