    für Schafe und Ziegen sowie Schaf- und Ziegenfleisch der KN-Codes 0104 10 30,
    0104 10 80, 0104 20 10, 0104 20 90 und 0204 für 1998 sowie zur Abweichung von
    der Verordnung (EG) Nr. 1439/95 zur Durchführung der Verordnung (EWG) Nr. 3013/89
