    huomioon ottamiseksi tiettyjen tästä maasta yhteisöön vietävien kalastustuotteiden
    osalta annetun asetuksen (EY) N:o 815/2008 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 894/2010 od 8. listopada 2010. o izmjeni Uredbe
    (EZ) br. 815/2008 o odstupanju od Uredbe (EEZ) br. 2454/93 o određivanju definicije
    pojma proizvoda s podrijetlom koji se koriste za potrebe sustava općih povlastica
    kako bi se uzela u obzir posebna situacija Kabo Verdea u pogledu izvoza određenih
    proizvoda ribarstva u Zajednicu
  type: main
- language: hu
  script: Latn
  content: A Bizottság 894/2010/EU rendelete ( 2010. október 8. ) a Zöld-foki-szigeteknek
    a Közösségbe irányuló egyes halászati termékek exportjával kapcsolatos
    különleges helyzetére figyelemmel a „származó termék” általános preferenciális
    rendszer alkalmazásában használt fogalmának meghatározása tekintetében
    a 2454/93/EGK rendelettől való eltérésről szóló 815/2008/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 894/2010 della Commissione, dell’ 8 ottobre 2010
    , che modifica il regolamento (CE) n. 815/2008 in merito a una deroga al regolamento
    (CEE) n. 2454/93 per quanto riguarda la definizione della nozione di «prodotti
    originari» stabilita nell’ambito dello schema di preferenze tariffarie generalizzate
    per tener conto della particolare situazione di Capo Verde relativamente all’esportazione
    di taluni prodotti della pesca nella Comunità
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 894/2010 ( 2010. gada 8. oktobris ), ar kuru
    izdara grozījumus Regulā (EK) Nr. 815/2008, ar ko piemēro atkāpi no Regulas
    (EEK) Nr. 2454/93 attiecībā uz to, kā definēt noteiktas izcelsmes produktu
    jēdzienu izmantošanai vispārējo preferenču sistēmā, lai ņemtu vērā Kaboverdes
    īpašo stāvokli attiecībā uz dažu zvejas produktu eksportu uz Kopienu
  type: main
- language: lt
  script: Latn
  content: 2010 m. spalio 8 d. Komisijos reglamentas (ES) Nr. 894/2010, kuriuo iš
    dalies keičiamas Reglamentas (EB) Nr. 815/2008, kuriuo dėl bendrojoje lengvatų
    sistemoje taikomos produktų kilmės sąvokos apibrėžties leidžiama nukrypti
    nuo Reglamento (EEB) Nr. 2454/93, kad būtų atsižvelgta į ypatingą Žaliojo
    Kyšulio padėtį, susijusią su tam tikrų žuvininkystės produktų eksportu
    į Bendriją
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 894/2010 tat- 8 ta’ Ottubru 2010
    li jemenda r-Regolament (KE) Nru 815/2008 dwar deroga mir-Regolament (KEE) Nru
    2454/93 dwar id-definizzjoni tal-kunċett tal-prodotti oriġinati għall-finijiet
    tal-iskema ta’ preferenzi ġeneralizzati biex titqies is-sitwazzjoni speċjali
    ta’ Kap Verde fir-rigward tal-esportazzjoni ta’ ċerti prodotti tas-sajd lejn
    il-Komunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 894/2010 van de Commissie van 8 oktober 2010 tot wijziging
    van Verordening (EG) nr. 815/2008 houdende afwijking van de in Verordening (EEG)
    nr. 2454/93 opgenomen definitie van het begrip „producten van oorsprong” in
    het kader van het schema van algemene preferenties in verband met de bijzondere
    situatie van Kaapverdië wat de uitvoer van bepaalde visserijproducten naar de
    Gemeenschap betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 894/2010 z dnia 8 października 2010 r.
    zmieniające rozporządzenie Komisji (WE) nr 815/2008 w sprawie odstępstwa od
    rozporządzenia (EWG) nr 2454/93 w odniesieniu do definicji pojęcia produktów
    pochodzących, używanej do celów ogólnego systemu preferencji, w celu uwzględnienia
    szczególnej sytuacji Republiki Zielonego Przylądka dotyczącej wywozu niektórych
    produktów rybołówstwa do Wspólnoty
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 894/2010 da Comissão, de 8 de Outubro de 2010 ,
    que altera o Regulamento (CE) n. ° 815/2008, que derroga o Regulamento (CEE)
    n. ° 2454/93 no respeitante à definição da noção de «produtos originários»
    para fins do sistema de preferências generalizadas, de forma a ter em conta a
    situação especial de Cabo Verde em relação às exportações de certos produtos
    da pesca para a Comunidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 894/2010 al Comisiei din 8 octombrie 2010 de modificare
    a Regulamentului (CE) nr. 815/2008 privind acordarea unei derogări de la Regulamentul
    (CEE) nr. 2454/93 în ceea ce privește definiția conceptului de „produse originare”
    folosit în cadrul sistemului de preferințe tarifare generalizate, pentru a ține
    seama de situația specială din Capul Verde în ceea ce privește exporturile
    anumitor produse pescărești către Comunitate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 894/2010 z 8. októbra 2010 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 815/2008 o výnimke z nariadenia (EHS) č. 2454/93,
    pokiaľ ide o vymedzenie pojmu „pôvodné výrobky“ používaného na účely
    systému všeobecných preferencií, aby sa zvážila osobitná situácia Kapverdských
    ostrovov v súvislosti s vývozom niektorých výrobkov rybného hospodárstva
    do Spoločenstva
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 894/2010 z dne 8. oktobra 2010 o spremembi Uredbe
    (ES) št. 815/2008 o odstopanju od Uredbe (EGS) št. 2454/93 glede opredelitve
    pojma „izdelek s poreklom“ , ki se uporablja za splošno shemo preferencialov,
    z namenom, da se upošteva posebni položaj Zelenortskih otokov glede izvoza nekaterih
    ribiških proizvodov v Skupnost
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 894/2010 de la Comisión, de 8 de octubre de 2010
    , que modifica el Reglamento (CE) n ° 815/2008 por el que se establece una excepción
    al Reglamento (CEE) n ° 2454/93 en lo que respecta a la definición de la noción
    de productos originarios utilizada a los efectos del sistema de preferencias generalizadas,
    atendiendo a la situación particular de Cabo Verde en lo que respecta a las exportaciones
    de determinados productos de la pesca a la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 894/2010 av den 8 oktober 2010 om ändring
    av förordning (EG) nr 815/2008 om undantag från förordning (EEG) nr 2454/93
    med avseende på definitionen av begreppet ursprungsprodukter som fastställs
    inom ramen för systemet för allmän förmånsbehandling för att ta hänsyn
    till Kap Verdes särskilda situation när det gäller vissa fiskeriprodukter som
    exporteras från detta land till gemenskapen
