    määratlusega, et võtta arvesse Cabo Verde eriolukorda teatavate kalandustoodete
    ühendusse eksportimisel
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 894/2010, annettu 8 päivänä lokakuuta 2010
    , asetuksessa (ETY) N:o 2454/93 osana yleistä tullietuusjärjestelmää annetusta
