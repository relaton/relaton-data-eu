title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 894/2010 of 8 October 2010 amending Regulation
    (EC) No 815/2008 on a derogation from Regulation (EEC) No 2454/93 in respect of
    the definition of the concept of originating products used for the purposes of
    the scheme of generalised preferences to take account of the special situation
    of Cape Verde regarding exports of certain fisheries products to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 894/2010 de la Commission du 8 octobre 2010 modifiant
    le règlement (CE) n ° 815/2008 relatif à une dérogation au règlement (CEE)
    n ° 2454/93 en ce qui concerne la définition de la notion de «produits originaires»
    établie dans le cadre du schéma de préférences tarifaires généralisées,
    en vue de prendre en compte la situation particulière du Cap-Vert pour l’exportation
    de certains produits de la pêche vers la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 894/2010 der Kommission vom 8. Oktober 2010 zur Änderung
    der Verordnung (EG) Nr. 815/2008 zur Abweichung von der Verordnung (EWG) Nr. 2454/93
    in Bezug auf die Bestimmung des Begriffs „Ursprungserzeugnisse“ im Rahmen
    des Schemas allgemeiner Zollpräferenzen zur Berücksichtigung der besonderen
    Lage von Kap Verde bei bestimmten in die Gemeinschaft ausgeführten Fischereierzeugnissen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 894/2010 на Комисията от 8 октомври
    2010 година за изменение на Регламент (ЕО) № 815/2008
    относно дерогация от Регламент (ЕИО) № 2454/93
    във връзка с определението на понятието „продукти
    с произход“ , установено в рамките на Общата
    система за преференции, с цел отчитане на специалната
    ситуация на Кабо Верде по отношение на износа
    на някои рибни продукти за Общността
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 894/2010 ze dne 8. října 2010 , kterým se
    mění nařízení Komise (ES) č. 815/2008 o odchylce od nařízení (EHS) č.
    2454/93, pokud jde o definici pojmu „původní produkty“ používanou pro
    účely systému všeobecných celních preferencí s ohledem na zvláštní situaci
    Kapverdských ostrovů v případě některých produktů rybolovu vyvážených
    z této země do Společenství
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 894/2010 af 8. oktober 2010 om ændring
    af forordning (EF) nr. 815/2008 om en undtagelse fra forordning (EØF) nr. 2454/93,
    hvad angår definitionen af begrebet »varer med oprindelsesstatus« med henblik
    på den generelle præferenceordning, for at tage hensyn til den særlige situation
    i Kap Verde, når det gælder eksport af visse fiskevarer til EF
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 894/2010 της Επιτροπής,
