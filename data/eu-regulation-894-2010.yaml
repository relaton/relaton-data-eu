    προϊόντων αλιείας προς την Κοινότητα
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 894/2010, 8. oktoober 2010 , millega muudetakse
    määrust (EÜ) nr 815/2008 erandi kohta määrusest (EMÜ) nr 2454/93 seoses
