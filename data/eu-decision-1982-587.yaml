title:
- language: en
  script: Latn
  content: '82/587/EEC: Commission Decision of 6 August 1982 establishing that the
    apparatus described as ''Micromeritics - Sedigraph Particle Size Analyzer, model
    5000 d'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/587/CEE: Décision de la Commission, du 6 août 1982, constatant que
    l''importation de l''appareil dénommé "Micromeritics - Sedigraph Particle Size
    Analyzer, model 5000 D" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '82/587/EWG: Entscheidung der Kommission vom 6. August 1982, mit der festgestellt
    wird, daß das Gerät ,,Micromeritics-Sedigraph Particle Size Analyzer, model
    5000 D" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/587/EØF: Kommissionens beslutning af 6. august 1982 om fastslåelse
    af, at indførsel af apparatet "Micromeritics-Sedigraph Particle Size Analyzer,
    model 5000 D" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/587/EOK: Απόφαση τής Επιτροπής τής 6ης Αυγούστου
