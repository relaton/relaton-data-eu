    μέ τήν ονομασία «Micromeritics — Sedigraph Particle Size Analyzer,
    model 5 000 D» δέν δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/587/CEE: Decisione della Commissione, del 6 agosto 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Micromeritics - Sedigraph Particle
    Size Analyzer, model 5000 D" non può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/587/EEG: Beschikking van de Commissie van 6 augustus 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Micromeritics-Sedigraph Particle Size Analyzer,
    model 5000 D" niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
  type: main
