title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 349/97 of 27 February 1997 determining the
    extent to which import licence applications submitted in February 1997 under the
    tariff quotas for beef provided for in the Agreements on free trade between the
    Community, of the one part, and Lithuania, Latvia, and Estonia, of the other part,
    may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 349/97 DE LA COMMISSION du 27 février 1997 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en février 1997 pour les contingents tarifaires de la viande bovine
    prévus dans les accords sur la libéralisation des échanges entre la Communauté,
    d'une part, et l'Estonie, la Lettonie et la Lituanie, d'autre part
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 349/97 DER KOMMISSION vom 27. Februar 1997 zur Bestimmung
    des Ausmaßes, in dem den im Februar 1997 gestellten Anträgen auf Erteilung von
    Einfuhrlizenzen im Rahmen der in den Freihandelsabkommen zwischen der Gemeinschaft
    einerseits und Litauen, Lettland und Estland andererseits vorgesehenen Zollkontingente
    für Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 349/97 af 27. februar 1997 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicenser indgivet
    i februar 1997 for de toldkontingenter i oksekødssektoren, der er fastsat i frihandelsaftalerne
    mellem Fællesskabet på den ene side og Estland, Letland og Litauen på den anden
    side
  type: main
- language: el
  script: Grek
