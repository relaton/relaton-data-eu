    της 27ης Φεβρουαρίου 1997 για τον καθορισμό σε
    ποιό βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    το Φεβρουάριο 1997 για τις δασμολογικές ποσοστώσεις
