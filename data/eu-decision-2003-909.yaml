title:
- language: en
  script: Latn
  content: '2003/909/EC: Council Decision of 22 December 2003 amending Decisions 97/375/EC,
    98/23/EC and 98/198/EC authorising the United Kingdom to apply measures derogating
    from Articles 28e(1), 6 and 17 of the Sixth Directive 77/388/EEC on the harmonisation
    of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '2003/909/CE: Décision du Conseil du 22 décembre 2003 modifiant les décisions
    97/375/CE, 98/23/CE et 98/198/CE, autorisant le Royaume-Uni à appliquer des mesures
    dérogatoires à l''article 28 sexies, paragraphe 1, et aux articles 6 et 17 de
    la sixième directive 77/388/CEE en matière d''harmonisation des législations
    des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '2003/909/EG: Entscheidung des Rates vom 22. Dezember 2003 zur Änderung
    der Entscheidungen des Rates 97/375/EG, 98/23/EG und 98/198/EG zur Ermächtigung
    des Vereinigten Königreichs, von Artikel 28e Absatz 1, Artikel 6 und Artikel
    17 der Sechsten Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften
    der Mitgliedstaaten über die Umsatzsteuern abweichende Regelungen anzuwenden'
  type: main
- language: da
  script: Latn
  content: '2003/909/EF: Rådets beslutning af 22. december 2003 om ændring af beslutning
    97/375/EF, 98/23/EF og 98/198/EF om at give Det Forenede Kongerige tilladelse
    til at anvende foranstaltninger, der fraviger bestemmelserne i artikel 28e, stk.
    1, og artikel 6 og 17 i sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes
    lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '2003/909/ΕΚ: Απόφαση του Συμβουλίου, της 22ας
    Δεκεμβρίου 2003, για την τροποποίηση των αποφάσεων
    97/375/ΕΚ, 98/23/ΕΚ και 98/198/ΕΚ με τις οποίες επιτρέπεται
    στο Ηνωμένο Βασίλειο να εφαρμόσει μέτρα παρέκκλισης
    από το άρθρο 28ε παράγραφος 1, και τα άρθρα 6 και
    17 της έκτης οδηγίας 77/388/ΕΟΚ περί εναρμονίσεως
    των νομοθεσιών των κρατών μελών, των σχετικών
    με τους φόρους κύκλων εργασιών'
  type: main
- language: fi
  script: Latn
  content: '2003/909/EY: Neuvoston päätös, tehty 22 päivänä joulukuuta 2003,
    luvan antamisesta Yhdistyneelle kuningaskunnalle soveltaa jäsenvaltioiden liikevaihtoverolainsäädännön
    yhdenmukaistamisesta annetun kuudennen direktiivin 77/388/ETY 28e artiklan 1 kohdasta
    sekä 6 ja 17 artiklasta poikkeavaa toimenpidettä tehtyjen neuvoston päätösten
    97/375/EY, 98/23/EY ja 98/198/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '2003/909/CE: Decisione del Consiglio, del 22 dicembre 2003, recante modifica
    delle decisioni 97/375/CE, 98/23/CE e 98/198/CE che autorizzano il Regno Unito
    ad applicare misure di deroga all''articolo 28 sexies, paragrafo 1, e agli articoli
    6 e 17 della sesta direttiva IVA 77/388/CEE in materia di armonizzazione delle
    legislazioni degli Stati membri relative alle imposte sulla cifra d''affari'
  type: main
- language: nl
  script: Latn
  content: '2003/909/EG: Beschikking van de Raad van 22 december 2003 tot wĳziging
    van de Beschikkingen 97/375/EG, 98/23/EG en 98/198/EG waarbĳ het Verenigd Koninkrĳk
    werd gemachtigd maatregelen toe te passen die afwĳken van artikel 28 sexies,
    lid 1, en de artikelen 6 en 17 van de Zesde Richtlĳn 77/388/EEG betreffende de
    harmonisatie van de wetgevingen der lidstaten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '2003/909/CE: Decisão do Conselho, de 22 de Dezembro de 2003, que altera
    as Decisões 97/375/CEE, 98/23/CE e 98/198/CE, que autorizam o Reino Unido a aplicar
    medidas derrogatórias do n.° 1 do artigo 28.°E e dos artigos 6.° e 17.° da
    Sexta Directiva 77/388/CEE relativa à harmonização das legislações dos Estados-Membros
    respeitantes aos impostos sobre o volume de negócios'
  type: main
- language: es
  script: Latn
  content: '2003/909/CE: Decisión del Consejo, de 22 de diciembre de 2003, por la
    que se modifican las Decisiones 97/375/CE, 98/23/CE y 98/198/CE por las que se
    autoriza al Reino Unido a establecer una excepción a lo dispuesto en el apartado
    1 del artículo 28 sexto de la sexta Directiva 77/388/CEE en materia de armonización
    de las legislaciones de los Estados miembros relativas a los impuestos sobre el
    volumen de negocios'
  type: main
- language: sv
  script: Latn
  content: '2003/909/EG: Rådets beslut av den 22 december 2003 om ändring av beslut
    97/375/EG, 98/23/EG och 98/198/EG om beviljande av tillstånd för Förenade kungariket
    att tillämpa åtgärder som avviker från artiklarna 28e.1, 6 och 17 i det sjätte
    direktivet 77/388/EEG om harmonisering av medlemsstaternas lagstiftning rörande
    omsättningsskatter'
