    biocidních přípravcích typu 18 v souladu s nařízením Evropského parlamentu
    a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2023/470 af 2. marts 2023
    om ikke at godkende d-allethrin som et eksisterende aktivstof til anvendelse i
    biocidholdige produkter af produkttype 18, jf. Europa-Parlamentets og Rådets
    forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2023/470 της Επιτροπής
    της 2ας Μαρτίου 2023 σχετικά με τη μη έγκριση
    της ουσίας d-Allethrin (d-Αλλεθρίνη) ως υπάρχουσας
    δραστικής ουσίας για χρήση σε βιοκτόνα του
    τύπου προϊόντων 18 σύμφωνα με τον κανονισμό
    (ΕΕ) αριθ. 528/2012 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2023/470, 2. märts 2023, millega jäetakse
