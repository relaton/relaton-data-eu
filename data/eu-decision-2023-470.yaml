title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/470 of 2 March 2023 not approving
    d-Allethrin as an existing active substance for use in biocidal products of product-type
    18 in accordance with Regulation (EU) No 528/2012 of the European Parliament and
    of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/470 de la Commission du 2 mars 2023
    refusant l’approbation de la d-alléthrine en tant que substance active destinée
    à être utilisée dans des produits biocides relevant du type de produits 18
    conformément au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/470 der Kommission vom 2. März 2023
    zur Nichtgenehmigung von d-Allethrin als alten Wirkstoff zur Verwendung in Biozidprodukten
    der Produktart 18 gemäß der Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments
    und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2023/470 на Комисията
