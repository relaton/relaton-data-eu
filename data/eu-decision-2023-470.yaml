    i dtáirgí bithicídeacha de chineál táirge 18 i gcomhréir le Rialachán (AE)
    Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2023/470 оd 2. ožujka 2023. o neodobravanju
