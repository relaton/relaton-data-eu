    olemasoleva toimeaine d-alletriini kasutamine tooteliiki 18 kuuluvates biotsiidides
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2023/470, annettu 2 päivänä
    maaliskuuta 2023, d-alletriinin hyväksymättä jättämisestä valmisteryhmään
    18 kuuluvissa biosidivalmisteissa käytettävänä vanhana tehoaineena Euroopan
    parlamentin ja neuvoston asetuksen (EU) N:o 528/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2023/470 ón gCoimisiún an 2 Márta 2023
