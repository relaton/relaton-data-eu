title:
- language: en
  script: Latn
  content: '80/548/EEC: Commission Decision of 22 May 1980 finding that the conditions
    required for the admission free of Common Customs Tariff duties of the scientific
    apparatus described as ''S.M.I. - Atomic Analysis System, Spectraspan III'' are
    fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/548/CEE: Décision de la Commission, du 22 mai 1980, constatant que
    les conditions requises pour l'' admission en franchise des droits du tarif douanier
    commun de l'' appareil scientifique dénommé "SMI - Atomic Analysis System, Spectraspan
    III" sont remplies'
  type: main
- language: de
  script: Latn
  content: '80/548/EWG: Entscheidung der Kommission vom 22. Mai 1980 zur Feststellung,
    daß die Voraussetzungen für die Befreiung des wissenschaftlichen Geräts ,,S.M.I.
    - Atomic Analysis System, Spectraspan III'' '' von den Zöllen des Gemeinsamen
    Zolltarifs erfüllt sind'
  type: main
- language: da
  script: Latn
  content: '80/548/EØF: Kommissionens beslutning af 22. maj 1980 om konstatering
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "S.M.I. - Atomic Analysis System, Spectraspan III"
    er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/548/ΕΟΚ: Απόφαση τής Επιτροπής τής 22ας
    Μαΐου 1980 περί διαπιστώσεως ότι οι απαιτούμενοι
    όροι γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «S. M. I. — Atomic Analysis System, Spectraspan
    III» πληρούνται'
  type: main
- language: it
  script: Latn
  content: '80/548/CEE: Decisione della Commissione, del 22 maggio, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "SMI - Atomic Analysis
    System, Spectraspan III" sono soddisfatte'
  type: main
- language: nl
  script: Latn
  content: '80/548/EEG: Beschikking van de Commissie van 22 mei 1980 vaststellende
    dat aan de voorwaarden, gesteld voor de toelating met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief van het wetenschappelijk apparaat genaamd
    ,,SMI-Atomic Analysis System, Spectraspan III'' '' is voldaan'
