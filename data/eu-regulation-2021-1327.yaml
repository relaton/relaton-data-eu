    ali njihovih regij, iz katerih je dovoljen vstop svežega mesa divjih enoprstih
    kopitarjev, ribiških proizvodov iz akvakulture in žuželk v Unijo, ter o popravku
    Priloge XI k navedeni izvedbeni uredbi glede seznama tretjih držav ali njihovih
