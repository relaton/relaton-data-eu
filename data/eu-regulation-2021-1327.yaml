    de 2021 por el que se modifican los anexos II, IX y XV del Reglamento de Ejecución
    (UE) 2021/405 en lo que respecta a las listas de terceros países, o regiones
    de los mismos, autorizados a introducir en la Unión carne fresca de solípedos
    silvestres, productos de la pesca procedentes de la acuicultura e insectos, y
    se corrige el anexo XI de dicho Reglamento de Ejecución en lo que respecta a
    la lista de terceros países y regiones de los mismos autorizados a introducir
    en la Unión ancas de rana y caracoles
