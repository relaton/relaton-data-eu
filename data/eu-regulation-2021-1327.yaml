title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1327 of 10 August 2021 amending
    Annexes II, IX and XV to Implementing Regulation (EU) 2021/405 as regards the
    lists of third countries or regions thereof authorised for the entry into the
    Union of fresh meat of wild solipeds, fishery products from aquaculture, and insects,
    and correcting Annex XI to that Implementing Regulation as regards the list of
    third countries and regions thereof authorised for the entry into the Union of
    frogs’ legs and snails
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/1327 de la Commission du 10 août 2021
    modifiant les annexes II, IX et XV du règlement d’exécution (UE) 2021/405
    en ce qui concerne les listes de pays tiers ou régions de pays tiers en provenance
    desquels les envois de viandes fraîches de solipèdes sauvages, de produits de
    la pêche issus de l’aquaculture et d’insectes sont autorisés à entrer dans
    l’Union, et rectifiant l’annexe XI dudit règlement d’exécution en ce qui
    concerne la liste des pays tiers ou régions de pays tiers en provenance desquels
    les envois de cuisses de grenouille et d’escargots sont autorisés à entrer
    dans l’Union
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/1327 der Kommission vom 10. August 2021
    zur Änderung der Anhänge II, IX und XV der Durchführungsverordnung (EU) 2021/405
    hinsichtlich der Listen der Drittländer oder Drittlandsgebiete, aus denen der
    Eingang von frischem Fleisch wildlebender Einhufer, von Fischereierzeugnissen
    aus Aquakultur und von Insekten in die Union zulässig ist, und zur Berichtigung
    des Anhangs XI der genannten Durchführungsverordnung hinsichtlich der Liste der
    Drittländer oder Drittlandsgebiete, aus denen der Eingang von Froschschenkeln
    und Schnecken in die Union zugelassen ist
  type: main
