  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/1327, annettu 10 päivänä
    elokuuta 2021, täytäntöönpanoasetuksen (EU) 2021/405 liitteiden II, IX ja
    XV muuttamisesta siltä osin kuin on kyse niiden kolmansien maiden tai kolmansien
    maiden alueiden luetteloista, joista luonnonvaraisten kavioeläinten tuoreen lihan,
    vesiviljelystä peräisin olevien kalastustuotteiden ja hyönteisten lähetysten
    tulo unioniin on sallittua, ja mainitun täytäntöönpanoasetuksen liitteen XI
    oikaisemisesta siltä osin kuin on kyse niiden kolmansien maiden tai kolmansien
    maiden alueiden luettelosta, joista sammakonreisien ja etanoiden lähetysten tulo
    unioniin on sallittua
