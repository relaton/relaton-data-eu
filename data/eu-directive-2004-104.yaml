    respeitantes à homologação dos veículos a motor e seus reboques
  type: main
- language: ro
  script: Latn
  content: Directiva 2004/104/CE a Comisiei din 14 octombrie 2004 de adaptare la progresul
    tehnic a Directivei 72/245/CEE a Consiliului privind paraziții radioelectrici
    (compatibilitatea electromagnetică) ai vehiculelor și de modificare a Directivei
    70/156/CEE privind aproprierea legislațiilor statelor membre referitoare la omologarea
    de tip a autovehiculelor și a remorcilor acestora
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2004/104/ES zo 14. októbra 2004 prispôsobujúca technickému
    pokroku smernicu Rady 72/245/EHS týkajúcu sa rádiového rušenia (elektromagnetická
