    jogszabályok közelítéséről szóló 70/156/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2004/104/CE della Commissione, del 14 ottobre 2004, che adegua
    al progresso tecnico la direttiva 72/245/CEE del Consiglio relativa alle perturbazioni
    radioelettriche (compatibilità elettromagnetica) dei veicoli a motore e che modifica
    la direttiva 70/156/CEE concernente il ravvicinamento delle legislazioni degli
    Stati membri relative all’omologazione dei veicoli a motore e dei loro rimorchi
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2004/104/EK (2004. gada 14. oktobris), ar ko tehnikas
    attīstībai pielāgo Padomes Direktīvu 72/245/EEK par radio traucējumiem (elektromagnētiskā
    saderība) autotransportā un ar ko izdara grozījumus Padomes Direktīvā 70/156/EEK
