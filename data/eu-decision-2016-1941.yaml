    marco del objetivo de inversión en crecimiento y empleo y del objetivo de cooperación
    territorial europea, el desglose anual por Estado miembro de los recursos de la
    asignación específica para la Iniciativa sobre Empleo Juvenil, junto con la
    lista de regiones que pueden optar a financiación, así como los importes que
    deben transferirse de las asignaciones de los Fondos Estructurales y el Fondo
    de Cohesión de cada Estado miembro al Mecanismo «Conectar Europa» y a la ayuda
    a las personas más desfavorecidas para el período 2014-2020 [notificada con
    el número C(2016) 6909]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/1941 av den 3 november 2016
    om ändring av genomförandebeslut 2014/190/EU om fastställande av den årliga
    fördelningen per medlemsstat av de samlade medlen för Europeiska regionala utvecklingsfonden,
    Europeiska socialfonden och Sammanhållningsfonden inom målet Investering för
    tillväxt och sysselsättning och målet Europeiskt territoriellt samarbete, av
    den årliga fördelningen per medlemsstat av medel från det särskilda anslaget
    för sysselsättningsinitiativet för unga, med en förteckning över stödberättigade
    regioner, samt av de belopp som ska överföras från Sammanhållningsfondens
    och strukturfondernas anslag för varje medlemsstat till Fonden för ett sammanlänkat
    Europa och till bistånd till dem som har det sämst ställt under perioden 2014–2020
    [delgivet med nr C(2016) 6909]
