id: EURegulationNo20701980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2070/80 of 1 August 1980 re-establishing
    the levying of customs duties on other articles made from yarn, twine, cordage,
    rope or cables, other than textile fabrics, articles made from such fabrics and
    articles of category 97, products of category 98 (code 0980), originating in the
    Philippines, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2070/80 de la Commission, du 1er août 1980, portant
    rétablissement de la perception des droits de douane applicables aux articles
    fabriqués avec des fils, ficelles, cordes ou cordages, à l' exclusion des tissus,
    des articles en tissus et des articles de la catégorie 97, de la catégorie 98
    (code 0980), originaires des Philippines, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2070/80 der Kommission vom 1. August 1980 über die
    Wiedereinführung des Zollsatzes für Waren aus Garnen, Bindfäden, Seilen oder
    Tauen, ausgenommen Gewebe, Waren daraus und Waren der Kategorie Nr. 97, der Warenkategorie
    Nr. 98 (Kennziffer 0980), mit Ursprung in den Philippinen, denen die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2070/80 af 1. august 1980 om genindførelse
    af opkrævning af toldafgifter for varer fremstillet af garn, sejlgarn, reb og
    tovværk, (bortset fra tekstilstoffer og varer deraf samt varer henhørende under
    kategori 97), under kategori 98 (kode 0980), som har oprindelse i Filippinerne
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2070/80 della Commissione, del 1° agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai manufatti ottenuti
    con l' impiego di filati, spago, corde o funi, esclusi i tessuti, i manufatti
    di tessuto e i manufatti della cateogria 97, della categoria di prodotti n. 98
    (codice 0980), originari delle Filippine, beneficiarie delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2070/80 van de Commissie van 1 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op artikelen,
    vervaardigd van garen, van bindgaren, van touw of van kabel, met uitzondering
    van weefsels, artikelen van weefsels en de artikelen van de categorie 97, van
    de categorie van produkten nr. 98 (codenummer 0980) van oorsprong uit de Filippijnen,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
