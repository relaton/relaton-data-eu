id: EURegulation3201984
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 320/84 of 31 January 1984 fixing, for certain
    fish stocks and groups of fish stocks occurring in the Community' s fishing zone,
    provisional total allowable catches for 1984, the provisional share of these catches
    available to the Community, the allocation of that share between the Member States
    and the conditions under which the total allowable catches may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 320/84 du Conseil du 31 janvier 1984 fixant, pour certains
    stocks ou groupes de stocks de poissons se trouvant dans la zone de pêche de
    la Communauté, les totaux provisoires admissibles des captures pour 1984, la
    part provisoire de ces captures attribuée à la Communauté, la répartition
    de cette part entre les États membres et les conditions dans lesquelles les totaux
    admissibles des captures peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 320/84 des Rates vom 31. Januar 1984 zur Festlegung
    der vorläufig zulässigen Gesamtfangmenge und des für die Gemeinschaft vorläufig
    verfügbaren Anteils, der Aufteilung dieses Anteils auf die Mitgliedstaaten sowie
    der Fangbedingungen hinsichtlich der zulässigen Gesamtfangmengen für bestimmte
    Fischbestände oder Bestandsgruppen in der Fischereizone der Gemeinschaft für
    1984
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 320/84 af 31. januar 1984 om fastsættelse
    for 1984 af de foreløbige samlede tilladte fangstmængder for visse fiskebestande
    og grupper af fiskebestande i Fællesskabets fiskerizone samt af Fællesskabets
    foreløbige andel af disse fangster, af dennes fordeling blandt medlemsstaterne
    og af betingelserne for fiskeri af de samlede tilladte fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 320/84 του Συμβουλίου
    της 31ης Ιανουαρίου 1984 περί καθορισμού, για
    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων που βρίσκονται στην αλιευτική ζώνη
    της Κοινότητας, του προσωρινού συνόλου επιτρεπομένων
    αλιευμάτων για το 1984, του προσωρινού μεριδίου
    αυτών των αλιευμάτων που χορηγείται στην Κοινότητα,
    της κατανομής του μεριδίου αυτού στα κράτη
    μέλη και των όρων υπό τους οποίους το σύνολο
    επιτρεπομένων αλιευμάτων είναι δυνατό να αλιευθεί
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 320/84 del Consiglio del 31 gennaio 1984 che fissa,
    per alcune popolazioni o gruppi di popolazioni ittiche presenti nella zona di
    pesca della Comunità, il totale provvisorio delle catture ammesse per il 1984
    e la parte provvisoria di queste catture disponibile per la Comunità, la ripartizione
    di detta parte tra gli Stati membri, nonché le condizioni cui è soggetta la
    pesca del totale delle catture ammesse
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 320/84 van de Raad van 31 januari 1984 inzake de
    vaststelling van de voor 1984 geldende voorlopige totaal toegestane vangsten voor
    bepaalde visbestanden of groepen visbestanden in de visserijzone van de Gemeenschap
    en het voor de Gemeenschap voorlopig beschikbare gedeelte van deze vangsten, de
    verdeling van dit gedeelte over de Lid-Staten en de bij de visserij in het kader
    van de totaal toegestane vangsten in acht te nemen voorschriften
  type: main
