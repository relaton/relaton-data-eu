    a N,N-didecyl-N-(2-(2-hydroxyethoxy)ethyl)-N-methylammonium-propionátu a N,N-didecyl-N-(2-(2-(2-hydroxyethoxy)ethoxy)ethyl)-N-methylammonium-propionátu
    jako účinné látky pro použití v biocidních přípravcích typů 2 a 4 v
