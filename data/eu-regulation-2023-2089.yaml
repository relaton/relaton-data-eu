title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/2089 of 28 September 2023
    approving reaction mass of N,N-didecyl-N-(2-hydroxyethyl)-N-methylammonium propionate
    and N,N-didecyl-N-(2-(2-hydroxyethoxy)ethyl)-N-methylammonium propionate and N,N-didecyl-N-(2-(2-(2-hydroxyethoxy)ethoxy)ethyl)-N-methylammonium
    propionate as an active substance for use in biocidal products of product-types
    2 and 4 in accordance with Regulation (EU) No 528/2012 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/2089 de la Commission du 28 septembre
    2023 approuvant la masse de réaction du propionate de N,N-didécyl-N-(2-hydroxyéthyl)-N-méthylammonium,
    du propionate de N,N-didécyl-N-(2-(2-hydroxyéthoxy)éthyl)-N-méthylammonium
    et du propionate de N,N-didécyl-N-(2-(2-(2-hydroxyéthoxy)éthoxy)éthyl)-N-méthylammonium
    en tant que substance active destinée à être utilisée dans les produits biocides
    relevant des types de produits 2 et 4, conformément au règlement (UE) no 528/2012
    du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/2089 der Kommission vom 28. September
    2023 zur Genehmigung der Reaktionsmasse von N,N-Didecyl-N-(2-hydroxyethyl)-N-methylammoniumpropanoat
    und N,N-Didecyl-N-(2-(2-hydroxyethoxy)ethyl)-N-methylammoniumpropanoat und N,N-Didecyl-N-(2-(2-(2-hydroxyethoxy)ethoxy)ethyl)-N-methylammoniumpropanoat
    als Wirkstoff zur Verwendung in Biozidprodukten der Produktarten 2 und 4 gemäß
    der Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2023/2089 на Комисията
    от 28 септември 2023 година за одобряване на реакционната
