    пропионат, N,N-дидецил-N-(2-(2-хидроксиетокси)етил)-N-метиламониев
    пропионат и N,N-дидецил-N-(2-(2-(2-хидроксиетокси)етокси)етил)-N-метиламониев
    пропионат като активно вещество за употреба
    в биоциди от продуктови типове 2 и 4 в съответствие
    с Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2023/2089 ze dne 28. září 2023,
