    és az N,N-didecil-N-(2-(2-(2-hidroxietoxi)etoxi)etil)-N-metilammónium-propionát
    reakciótömege 2. és 4. terméktípusba tartozó biocid termékek hatóanyagaként
    történő felhasználásának az 528/2012/EU európai parlamenti és tanácsi
    rendelet szerinti jóváhagyásáról
  type: main
- language: it
