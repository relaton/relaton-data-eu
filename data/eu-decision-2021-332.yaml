    dėl siūlomų taisyklių Nr. 13, 13-H, 18, 30, 41, 46, 48, 53, 54, 67, 74, 75,
    79, 86, 97, 98, 106, 107, 113, 116, 117, 118, 123, 124, 125, 141, 142, 148, 149,
    150, 152, 154, 157 ir JT taisyklės dėl įvykių duomenų savirašio pakeitimų,
    siūlomų Bendrojo techninio reglamento Nr. 9 pakeitimų, siūlomų Suvestinės
    rezoliucijos R.E.5 pakeitimų, pasiūlymų dėl keturių naujų JT taisyklių
    dėl įvykių duomenų savirašio, dėl motorinių transporto priemonių apsaugos
    nuo neteisėto naudojimo ir apsaugos nuo neteisėto naudojimo įtaiso patvirtinimo,
    dėl imobilizatorių patvirtinimo ir transporto priemonės patvirtinimo atsižvelgiant
    į jos imobilizatorių, dėl signalizacijos sistemos patvirtinimo ir dėl transporto
    priemonės patvirtinimo atsižvelgiant į jos signalizacijos sistemą, pasiūlymo
    dėl naujo Bendrojo nutarimo M.R.4 ir pasiūlymų dėl JT taisyklių Nr. 155 ir
    156 aiškinamųjų dokumentų
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2021/332 tat-22 ta’ Frar 2021 dwar il-pożizzjoni
    li trid tittieħed f’isem l-Unjoni Ewropea fil-Forum Dinji għall-Armonizzazzjoni
    tar-Regolamenti tal-Vetturi tal-Kummissjoni Ekonomika għall-Ewropa tan-Nazzjonijiet
    Uniti fir-rigward tal-proposti għal modifiki għar-Regolamenti tan-NU Nri 13,
    13-H, 18, 30, 41, 46, 48, 53, 54, 67, 74, 75, 79, 86, 97, 98, 106, 107, 113, 116,
    117, 118, 123, 124, 125, 141, 142, 148, 149, 150, 152, 154, 157 u għar-Regolament
    tan-NU dwar reġistratur tad-data f’każ ta’ avveniment, fir-rigward tal-proposta
    għal modifiki għar-Regolament Tekniku Globali Nru 9, fir-rigward tal-proposta
    għal emendi għar-Riżoluzzjoni Kkonsolidata R.E.5, fir-rigward tal-proposti
    għal erba’ Regolamenti ġodda tan-NU rigward ir-reġistratur tad-data f’każ
    ta’ avveniment, il-protezzjoni ta’ vetturi bil-mutur kontra l-użu mhux awtorizzat
    u l-approvazzjoni tal-apparat kontra l-użu mhux awtorizzat, l-approvazzjoni ta’
    immobilizzaturi u l-approvazzjoni ta’ vettura fir-rigward tal-immobilizzatur
    tagħha, u l-approvazzjoni tas-sistema ta’ allarm għall-vetturi u l-approvazzjoni
    ta’ vettura fir-rigward tas-sistema ta’ allarm tagħha, fir-rigward tal-proposta
    għal Riżoluzzjoni Reċiproka ġdida M.R.4, u fir-rigward tal-proposti għal
    dokumenti ta’ interpretazzjoni għar-Regolamenti tan-NU Nri 155 u 156
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2021/332 van de Raad van 22 februari 2021 betreffende het
    namens de Europese Unie in het Wereldforum voor de harmonisatie van reglementen
    voor voertuigen van de Economische Commissie voor Europa van de Verenigde Naties
    in te nemen standpunt over de voorstellen tot wijziging van de VN-Reglementen
    nrs. 13, 13-H, 18, 30, 41, 46, 48, 53, 54, 67, 74, 75, 79, 86, 97, 98, 106, 107,
    113, 116, 117, 118, 123, 124, 125, 141, 142, 148, 149, 150, 152, 154, 157 en het
    VN-reglement betreffende gegevensrecorders voor incidenten, het voorstel voor
    wijzigingen van Mondiaal Technisch Reglement nr. 9, het voorstel voor wijzigingen
    van Geconsolideerde Resolutie R.E.5, de voorstellen voor vier nieuwe VN-reglementen
    met betrekking tot gegevensrecorders voor incidenten, de beveiliging van motorvoertuigen
    tegen onrechtmatig gebruik en de goedkeuring van de beveiliging tegen onrechtmatig
    gebruik, de goedkeuring van immobilisatiesystemen en de goedkeuring van een voertuig
    wat het immobilisatiesysteem ervan betreft en de goedkeuring van voertuigalarmsystemen
    en de goedkeuring van een voertuig wat het voertuigalarmsysteem ervan betreft,
    het voorstel voor een nieuwe Gemeenschappelijke Resolutie M.R.4 en de voorstellen
    voor interpretatiedocumenten betreffende de VN-Reglementen nrs. 155 en 156
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2021/332 z dnia 22 lutego 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii na Światowym Forum Europejskiej Komisji
    Gospodarczej ONZ na rzecz Harmonizacji Przepisów dotyczących Pojazdów w odniesieniu
    do wniosków dotyczących modyfikacji regulaminów ONZ nr 13, 13-H, 18, 30, 41,
    46, 48, 53, 54, 67, 74, 75, 79, 86, 97, 98, 106, 107, 113, 116, 117, 118, 123,
    124, 125, 141, 142, 148, 149, 150, 152, 154 i 157 oraz regulaminu ONZ w sprawie
    rejestratorów danych na temat zdarzeń, w odniesieniu do wniosku dotyczącego
    modyfikacji ogólnych przepisów technicznych nr 9, w odniesieniu do wniosku dotyczącego
    poprawek do ujednoliconej rezolucji R.E.5, w odniesieniu do wniosków dotyczących
    czterech nowych regulaminów ONZ w sprawie rejestratorów danych na temat zdarzeń,
    zabezpieczenia pojazdów silnikowych przed nieuprawnionym użyciem i homologacji
    urządzenia zapobiegającego nieuprawnionemu użyciu, homologacji immobilizerów
    i homologacji pojazdu w zakresie immobilizera oraz homologacji systemów alarmowych
    pojazdów i homologacji pojazduw zakresie systemu alarmowego, w odniesieniu do
    wniosku dotyczącego nowej wzajemnej rezolucji M.R.4, a także w odniesieniu do
    wniosków dotyczących dokumentów interpretacyjnych do regulaminów ONZ nr 155
    i 156
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2021/332 do Conselho de 22 de fevereiro de 2021 relativa
    à posição a tomar, em nome da União Europeia, no Fórum Mundial para a Harmonização
    das Regulamentações aplicáveis a Veículos da Comissão Económica para a Europa
    das Nações Unidas, sobre as propostas de alteração dos Regulamentos da ONU
    n.os 13, 13-H, 18, 30, 41, 46, 48, 53, 54, 67, 74, 75, 79, 86, 97, 98, 106, 107,
    113, 116, 117, 118, 123, 124, 125, 141, 142, 148, 149, 150, 152, 154, 157 e de
    um regulamento da ONU relativo ao aparelho de registo de eventos, sobre a proposta
    de alteração do Regulamento Técnico Global n.o 9, sobre a proposta de alteração
    da Resolução Consolidada R.E.5, sobre as propostas de quatro novos regulamentos
    da ONU relativos ao aparelho de registo de eventos, à proteção dos veículos
    a motor contra a utilização não autorizada e à homologação do dispositivo
    contra a utilização não autorizada, à homologação dos imobilizadores e à
    homologação de um veículo no que respeita ao seu imobilizador, e à homologação
    do sistema de alarme do veículo e à homologação de um veículo no que respeita
    ao seu sistema de alarme, e sobre a proposta de nova Resolução Mútua M.R.4,
    bem como sobre as propostas de documentos de interpretação dos Regulamentos
    da ONU n.os 155 e 156
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2021/332 a Consiliului din 22 februarie 2021 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Forumului
    mondial pentru armonizarea reglementărilor privind vehiculele al Comisiei Economice
    pentru Europa a Organizației Națiunilor Unite în ceea ce privește propunerile
    de amendamente la Regulamentele ONU nr. 13, 13-H, 18, 30, 41, 46, 48, 53, 54,
    67, 74, 75, 79, 86, 97, 98, 106, 107, 113, 116, 117, 118, 123, 124, 125, 141,
    142, 148, 149, 150, 152, 154, 157 și la Regulamentul ONU privind dispozitivul
    de înregistrare a datelor privind evenimentele, în ceea ce privește propunerea
    de amendamente la Regulamentul tehnic mondial nr. 9, în ceea ce privește propunerea
    de amendamente la Rezoluția consolidată R.E.5, în ceea ce privește propunerea
    a patru noi regulamente ale ONU privind dispozitivul de înregistrare a datelor
    privind evenimentele, protecția autovehiculelor împotriva utilizării neautorizate
    și omologarea dispozitivului împotriva utilizării neautorizate, omologarea
    dispozitivelor de imobilizare și omologarea unui vehicul în ceea ce privește
    sistemul său de imobilizare, precum și omologarea sistemului de alarmă pentru
    vehicule și omologarea unui vehicul în ceea ce privește sistemul său de alarmă,
    în ceea ce privește propunerea pentru o nouă rezoluție reciprocă M.R.4 și
    în ceea ce privește propunerile de documente de interpretare referitoare la
    Regulamentele ONU nr. 155 și 156
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2021/332 z 22. februára 2021 o pozícii, ktorá
    sa má v mene Európskej únie zaujať na Svetovom fóre Európskej hospodárskej
    komisie Organizácie Spojených národov pre harmonizáciu predpisov o vozidlách,
    pokiaľ ide o návrhy zmien predpisov OSN č. 13, 13-H, 18, 30, 41, 46, 48, 53,
    54, 67, 74, 75, 79, 86, 97, 98, 106, 107, 113, 116, 117, 118, 123, 124, 125, 141,
    142, 148, 149, 150, 152, 154, 157 a predpisu OSN o zariadení na záznam údajov
    o udalostiach, pokiaľ ide o návrh na zmeny globálneho technického predpisu
    č. 9, pokiaľ ide o návrh na zmenu konsolidovanej rezolúcie R.E.5, pokiaľ
    ide o návrhy štyroch nových predpisov OSN súvisiacich so zariadením na záznam
    údajov o udalostiach, ochranou motorových vozidiel proti neoprávnenému používaniu
    a schválením zariadenia proti neoprávnenému používaniu, schvaľovaním imobilizérov
    a schválením vozidla, pokiaľ ide o jeho imobilizér, a schválením systému
    alarmu vozidla a so schválením vozidla, pokiaľ ide o jeho systém alarmu vozidla,
    pokiaľ ide o návrh novej spoločnej rezolúcie M.R.4 a pokiaľ ide o návrhy
    interpretačných dokumentov pre predpisy OSN č. 155 a 156
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2021/332 z dne 22. februarja 2021 o stališču, ki se
    v imenu Evropske unije zastopa na Svetovnem forumu Ekonomske komisije Združenih
    narodov za Evropo za harmonizacijo pravilnikov o vozilih glede predlogov sprememb
    pravilnikov ZN št. 13, 13-H, 18, 30, 41, 46, 48, 53, 54, 67, 74, 75, 79, 86,
    97, 98, 106, 107, 113, 116, 117, 118, 123, 124, 125, 141, 142, 148, 149, 150,
    152, 154, 157 in pravilnika ZN o zapisovalniku podatkov o dogodku, predloga sprememb
    globalnega tehničnega predpisa št. 9, predloga sprememb konsolidirane resolucije
    R.E.5, predloga štirih novih pravilnikov ZN v zvezi z zapisovalnikom podatkov
    o dogodku, zaščito motornih vozil pred nedovoljeno uporabo in homologacijo naprave
    za zaščito pred nedovoljeno uporabo, homologacijo naprav za imobilizacijo vozila
    in homologacijo vozila glede na njegovo napravo za imobilizacijo ter homologacijo
    alarmnega sistema vozila in homologacijo vozila glede na njegov alarmni sistem,
    predloga nove vzajemne resolucije M.R.4 ter predlogov dokumentov za razlago pravilnikov
    ZN št. 155 in 156
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/332 del Consejo de 22 de febrero de 2021 relativa a
    la posición que debe adoptarse, en nombre de la Unión Europea, en el Foro Mundial
    para la Armonización de la Reglamentación sobre Vehículos de la Comisión Económica
    para Europa de las Naciones Unidas por lo que respecta a las propuestas de modificaciones
    de los Reglamentos n.os 13, 13-H, 18, 30, 41, 46, 48, 53, 54, 67, 74, 75, 79,
    86, 97, 98, 106, 107, 113, 116, 117, 118, 123, 124, 125, 141, 142, 148, 149, 150,
    152, 154 y 157 y del Reglamento de las Naciones Unidas sobre el registrador de
    datos de eventos, a la propuesta de modificaciones del Reglamento Técnico Mundial
    n.o 9, a la propuesta de enmiendas a la Resolución Consolidada R.E.5, a las propuestas
    de cuatro nuevos Reglamentos de las Naciones Unidas en relación con el registrador
    de datos de eventos, la protección de los vehículos de motor contra la utilización
    no autorizada y la homologación del dispositivo contra esa utilización, la homologación
    de inmovilizadores y la homologación de un vehículo en lo que concierne a su
    inmovilizador, así como la homologación de un sistema de alarma para vehículos
    y la homologación de un vehículo en lo que concierne a su sistema de alarma
    para vehículos, a la propuesta de una nueva Resolución Mutua M.R.4 y a las propuestas
    de Documentos Interpretativos de los Reglamentos n.os 155 y 156 de las Naciones
    Unidas
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2021/332 av den 22 februari 2021 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i Förenta nationernas ekonomiska
    kommission för Europas världsforum för harmonisering av fordonsföreskrifter
    vad gäller förslagen till ändringar av FN-föreskrifterna nr 13, 13-H, 18,
    30, 41, 46, 48, 53, 54, 67, 74, 75, 79, 86, 97, 98, 106, 107, 113, 116, 117, 118,
    123, 124, 125, 141, 142, 148, 149, 150, 152, 154, 157 och FN-föreskriften om
    registreringsapparater för händelsedata, vad gäller förslaget till ändringar
    av den globala tekniska föreskriften nr 9, vad gäller förslaget till ändringar
    av den konsoliderade resolutionen R.E.5, vad gäller förslagen till fyra nya
    FN-föreskrifter om registreringsapparater för händelsedata, skydd mot obehörig
    användning av motorfordon och godkännandet av anordningen mot obehörig användning,
    godkännande av startspärrar och godkännande av ett fordon med avseende på
    dess startspärr samt godkännande av larmsystem för fordon och godkännande
    av ett fordon med avseende på dess larmsystem, vad gäller förslaget till en
    ny ömsesidig resolution M.R.4 och vad gäller förslagen till tolkningsdokument
    för FN-föreskrifterna nr 155 och 156
