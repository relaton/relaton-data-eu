id: EUDecision202210
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/10 of 2 December 2021 on the position to be
    taken on behalf of the European Union at the 22nd meeting of the Contracting Parties
    to the Convention for the Protection of the Marine Environment and the Coastal
    Region of the Mediterranean (Barcelona Convention) and its Protocols as regards
    the adoption of a decision to amend Annexes I, II and IV to the Protocol for the
    Protection of the Mediterranean Sea against Pollution from Land-Based Sources
    and Activities (LBS Protocol)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/10 du Conseil du 2 décembre 2021 relative à la position
    à prendre, au nom de l’Union européenne, lors de la 22e réunion des parties
    contractantes à la convention sur la protection du milieu marin et du littoral
    de la Méditerranée (convention de Barcelone) et à ses protocoles en ce qui
    concerne l’adoption d’une décision modifiant les annexes I, II et IV du protocole
    relatif à la protection de la mer Méditerranée contre la pollution provenant
    de sources et activités situées à terre (protocole tellurique)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/10 des Rates vom 2. Dezember 2021 über den Standpunkt,
    der auf der 22. Tagung der Vertragsparteien des Übereinkommens zum Schutz der
    Meeresumwelt und der Küstengebiete des Mittelmeers (Übereinkommen von Barcelona)
    und seiner Protokolle zu dem Erlass eines Beschlusses zur Änderung der Anhänge
    I, II und IV des Protokolls über den Schutz des Mittelmeeres vor Verschmutzung
    aus landseitigen Quellen und Tätigkeiten (LBS-Protokoll) im Namen der Europäischen
    Union zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/10 на Съвета от 2 декември
    2021 година относно позицията, която трябва да
    се заеме от името на Европейския съюз на 22-рата
    среща на договарящите се страни по Конвенцията
    за защита на морската среда и на крайбрежните
    райони в Средиземноморието (Конвенцията от
    Барселона) и протоколите към нея по отношение
    на приемането на решение за изменение на приложения
    I, II и IV към Протокола за опазване на Средиземно
    море от замърсяване, причинено от наземни източници
    и дейности („Протокол относно наземните източници“)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/10 ze dne 2. prosince 2021 o postoji, který
    má být jménem Evropské unie zaujat na 22. zasedání smluvních stran Úmluvy
    o ochraně mořského prostředí a pobřežní oblasti Středomoří (Barcelonská
    úmluva) a jejích protokolů, pokud jde o přijetí rozhodnutí o změně příloh
    I, II a IV Protokolu o ochraně Středozemního moře před znečišťováním
    z pozemních zdrojů (protokol o znečišťování z pozemních zdrojů)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/10 af 2. december 2021 om den holdning, der
    skal indtages på Den Europæiske Unions vegne på det 22. møde mellem de kontraherende
    parter i konventionen om beskyttelse af Middelhavets havmiljø og kystområder
    (Barcelonakonventionen) og protokollerne hertil, til vedtagelsen af en afgørelse
    om ændring af bilag I, II og IV til protokollen om beskyttelse af Middelhavet
    mod forurening fra landbaserede kilder og aktiviteter (LBS-protokollen)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2022/10 του Συμβουλίου της 2ας
    Δεκεμβρίου 2021 σχετικά με τη θέση που πρέπει
