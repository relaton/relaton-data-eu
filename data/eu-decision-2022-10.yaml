    tegevuste põhjustatud reostuse eest Vahemere kaitsmist käsitleva protokolli
    (maismaalt lähtuva merereostuse eest kaitsmise protokoll) I, II ja IV lisa
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2022/10, annettu 2 päivänä joulukuuta 2021,
    Välimeren merellisen ympäristön ja rannikkoalueiden suojelemista koskevan yleissopimuksen
    (Barcelonan yleissopimus) ja sen pöytäkirjojen sopimuspuolten 22. kokouksessa
    Euroopan unionin puolesta otettavasta kannasta Välimeren suojelemisesta maalta
    peräisin olevalta ja maalla tapahtuvan toiminnan aiheuttamalta pilaantumiselta
    tehdyn pöytäkirjan (LBS-pöytäkirja) liitteiden I, II ja IV muuttamista koskevan
    päätöksen hyväksymiseen
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2022/10 ón gComhairle an 2 Nollaig 2021 maidir leis an seasamh
    atá le glacadh thar ceann an Aontais Eorpaigh ag an 22ú cruinniú de na Páirtithe
    Conarthacha sa Choinbhinsiún maidir le Cosaint Mhuirthimpeallacht agus Réigiún
    Cósta na Meánmhara (Coinbhinsiún Barcelona) gona Phrótacail a mhéid a bhaineann
    le cinneadh a ghlacadh lena leasaítear Iarscríbhinní I, II agus IV a ghabhann
    leis an bPrótacal maidir le Cosaint na Meánmhara ar Thruailliú ó Fhoinsí
    agus Gníomhaíochtaí ar Talamh (Prótacal LBS)
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/10 od 2. prosinca 2021. o stajalištu koje treba
    zauzeti u ime Europske unije na 22. sastanku ugovornih stranaka Konvencije o zaštiti
    morskog okoliša i obalnog područja Sredozemlja (Barcelonska konvencija) i njezinih
    protokola u pogledu donošenja odluke o izmjenama priloga I., II. i IV. Protokolu
    o zaštiti Sredozemnog mora od onečišćenja iz izvora i djelatnosti na kopnu
    (Protokol o onečišćenju iz izvora i djelatnosti na kopnu)
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/10 határozata (2021. december 2.) a Földközi-tenger
    tengeri környezetének és partvidékének szennyezés elleni védelméről szóló
    egyezmény (a Barcelonai Egyezmény) és jegyzőkönyvei szerződő feleinek 22.
    ülésén a Földközi-tenger szárazföldi forrásokból és tevékenységekből
    származó szennyezés elleni védelméről szóló jegyzőkönyvhöz (a szárazföldi
    eredetű szennyezésről szóló jegyzőkönyvhöz) csatolt I., II., és IV. mellékletet
    módosító határozat elfogadására tekintettel az Európai Unió nevében képviselendő
    álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/10 del Consiglio del 2 dicembre 2021 relativa alla
    posizione da adottare a nome dell’Unione europea alla 22a riunione delle parti
    contraenti della convenzione sulla protezione dell’ambiente marino e del litorale
    del Mediterraneo (convenzione di Barcellona) e dei relativi protocolli in merito
    all’adozione di una decisione volta a modificare gli allegati I, II e IV del
    protocollo per la protezione del Mar Mediterraneo dall’inquinamento derivante
    da fonti e attività terrestri (protocollo LBS)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2022/10 (2021. gada 2. decembris) par nostāju, kas
    Eiropas Savienības vārdā jāieņem Konvencijas par Vidusjūras reģiona jūras
    vides un piekrastes aizsardzību (Barselonas konvencija) un tās protokolu Līgumslēdzēju
    pušu konferences 22. sanāksmē attiecībā uz tāda lēmuma pieņemšanu, ar
    kuru groza I, II un IV pielikumu Protokolā par Vidusjūras aizsardzību pret
    piesārņojumu no sauszemes avotiem un darbībām uz sauszemes (LBS protokols)
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2022/10 2021 m. gruodžio 2 d. dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi 22-ajame Viduržemio jūros
    aplinkos ir pakrančių zonos apsaugos konvencijos (Barselonos konvencijos) ir
    jos protokolų susitariančiųjų šalių susitikime, dėl sprendimo iš dalies
    pakeisti Protokolo dėl Viduržemio jūros apsaugos nuo žemyninės kilmės taršos
    ir veiklos (Protokolo dėl žemyninės kilmės taršos) I, II bei IV priedus priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2022/10 tat-2 ta’ Diċembru 2021 dwar il-pożizzjoni
    li għandha tittieħed f’isem l-Unjoni Ewropea fit-22 laqgħa tal-Partijiet
    Kontraenti għall-Konvenzjoni għall-Protezzjoni tal-Ambjent tal-Baħar u tar-Reġjun
    Kostali tal-Mediterran (il-Konvenzjoni ta’ Barċellona) u l-Protokolli tagħha
    fir-rigward tal-adozzjoni ta’ deċiżjoni li temenda l-Annessi I, II u IV tal-Protokoll
    dwar il-Ħarsien tal-Baħar Mediterran mit-Tniġġis ta’ Oriġini u minn Attivitajiet
    Terrestri (Protokoll LBS)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2022/10 van de Raad van 2 december 2021 betreffende het namens
    de Europese Unie in te nemen standpunt tijdens de 22e vergadering van de partijen
    bij het Verdrag inzake de bescherming van het mariene milieu en de kustgebieden
    van de Middellandse Zee (Verdrag van Barcelona) en de bijbehorende protocollen,
    wat betreft de vaststelling van een besluit tot wijziging van de bijlagen I, II
    en IV bij het Protocol inzake de bescherming van de Middellandse Zee tegen verontreiniging
    door bronnen en activiteiten op het land (protocol inzake verontreiniging vanaf
    het land)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/10 z dnia 2 grudnia 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej na 22. posiedzeniu Umawiających
    się Stron Konwencji o ochronie środowiska morskiego i regionu przybrzeżnego
    Morza Śródziemnego („konwencja barcelońska”) i protokołów do niej, w
    odniesieniu do przyjęcia decyzji o zmianie załączników I, II i IV do Protokołu
    dotyczącego ochrony Morza Śródziemnego przed zanieczyszczeniem ze źródeł
    i działalności lądowej
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/10 do Conselho de 2 de dezembro de 2021 relativa à
    posição a tomar em nome da União Europeia na 22.a reunião das Partes Contratantes
    na Convenção sobre a Proteção do Meio Marinho e do Litoral do Mediterrâneo
    («Convenção de Barcelona») e respetivos protocolos, no que respeita à adoção
    de uma decisão relativa à alteração dos anexos I, II e IV do Protocolo relativo
    à Proteção do Mar Mediterrâneo contra a Poluição Proveniente de Fontes e
    Atividades Situadas em Terra
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/10 a Consiliului din 2 decembrie 2021 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene, la cea de a 22-a
    reuniune a părților contractante la Convenția privind protejarea mediului marin
    și a zonei de coastă a Mării Mediterane (Convenția de la Barcelona) și la
    protocoalele la aceasta, în ceea ce privește adoptarea unei decizii de modificare
    a anexelor I, II și IV la Protocolul privind protecția Mării Mediterane împotriva
    poluării din surse și activități terestre (Protocolul LBS)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/10 z 2. decembra 2021 o pozícii, ktorá sa
    má v mene Európskej únie zaujať na 22. zasadnutí zmluvných strán Dohovoru
    o ochrane morského prostredia a pobrežných oblastí Stredozemného mora (Barcelonský
    dohovor) a jeho protokolov, pokiaľ ide o prijatie rozhodnutia o zmene prílohy
    I, II a IV k Protokolu o ochrane Stredozemného mora pred znečisťovaním zo
    zdrojov a činností na pevnine (protokol o ZZP)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/10 z dne 2. decembra 2021 o stališču, ki se v imenu
    Evropske unije zastopa na 22. zasedanju pogodbenic Konvencije za varstvo morskega
    okolja in obalnega območja Sredozemlja (Barcelonska konvencija) in njenih protokolov
    glede sprejetja sklepa o spremembi prilog I, II in IV k Protokolu za varstvo Sredozemskega
    morja pred onesnaževanjem iz virov in dejavnosti na kopnem (Protokol o virih
    na kopnem)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/10 del Consejo de 2 de diciembre de 2021 relativa a
    la posición que debe adoptarse en nombre de la Unión Europea en la 22.a reunión
    de las Partes Contratantes en el Convenio para la Protección del Medio Marino
    y de la Región Costera del Mediterráneo (Convenio de Barcelona) y sus Protocolos,
    con respecto a la adopción de una decisión por la que se modificarán los anexos
    I, II y IV del Protocolo para la Protección del Mar Mediterráneo contra la Contaminación
    Causada por Fuentes y Actividades Situadas en Tierra (Protocolo sobre Fuentes
    y Actividades en Tierra)
  type: main
