title:
- language: en
  script: Latn
  content: '89/377/EEC: Commission Decision of 19 June 1989 terminating the proceeding
    in connection with a review of anti-dumping measures concerning imports of fibre
    building board (hardboard) originating in Romania, Brazil and Sweden, confirming
    the expiry of the undertakings given by Romanian, Brazilian and certain Swedish
    exporters, and repealing the undertaking given by another Swedish exporter'
  type: main
- language: fr
  script: Latn
  content: '89/377/CEE: Décision de la Commission du 19 juin 1989 clôturant la procédure
    de réexamen des mesures antidumping concernant les importations de panneaux de
    fibres (panneaux durs) originaires de Roumanie, du Brésil ou de Suède, confirmant
    l''expiration des engagements souscrits par la Roumanie, le Brésil et certains
    exportateurs suédois et abrogeant les engagements souscrits par un autre exportateur
    suédois'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 19. Juni 1989 über die Einstellung des Verfahrens
    im Anschluß an eine Überprüfung der Antidumpingmaßnahmen betreffend die Einfuhren
    von Hartplatten mit Ursprung in Rumänien, Brasilien und Schweden, über die Bestätigung
    des Auslaufens der Verpflichtungen der rumänischen, brasilianischen und einiger
    schwedischer Ausführer und über die Aufhebung der Verpflichtung des anderen
    schwedischen Ausführers (89/377/EWG) (89/377/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 19. juni 1989 om afslutning af proceduren
    i forbindelse med en fornyet undersøgelse af antidumpingforanstaltningerne vedrørende
    importen af fiberplader (hårde plader) med oprindelse i Brasilien, Rumænien
    og Sverige, om bekræftelse af de tilsagn, der er afgivet af Brasilien, Rumænien
    og visse svenske eksportører, og om ophør af det tilsagn, der er afgivet af
    en anden svensk eksportør (89/377/EØF) (89/377/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/377/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Ιουνίου 1989 για την περάτωση της διαδικασίας
    όσον αφορά την εξέταση των μέτρων αντιντάμπινγκ
    σχετικά με τις εισαγωγές οικοδομικών πλακών
    - διαφραγμάτων από ίνες καταγωγής Ρουμανίας,
    Βραζιλίας και Σουηδίας για την επιβεβαίωση
    της παύσης των υποχρεώσεων που έχουν αναληφθεί
    από τους εξαγωγείς της Ρουμανίας, Βραζιλίας
    και ορισμένους εξαγωγείς της Σουηδίας και
    για την κατάργηση των υποχρεώσεων που έχουν
    αναληφθεί από άλλο εξαγωγέα της Σουηδίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 19 giugno 1989 che chiude la procedura
    di riesame di determinate misure antidumping relative alle importazioni di pannelli
    di fibre (pannelli duri) originari della Romania, del Brasile e della Svezia,
    conferma la scadenza degli impegni offerti dagli esportatori della Romania e del
    Brasile, nonché da alcuni esportatori svedesi e annulla l'' impegno assunto da
    un esportatore svedese (89/377/CEE) (89/377/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 19 juni 1989 tot beëindiging van de procedure
    in verband met een nieuw onderzoek van anti-dumpingmaatregelen betreffende de
    invoer van vezelplaat van houtvezels (hardboard) van oorsprong uit Roemenië,
    Brazilië en Zweden, tot bevestiging van het vervallen van de door Roemeense,
    Braziliaanse en bepaalde Zweedse exporteurs aangegane verbintenissen en tot intrekking
    van de door een andere Zweedse exporteur aangegane verbintenis (89/377/EEG) (89/377/EEG)
    #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 19 de Junho de 1989 que encerra o processo relativo
    a um reexame das medidas anti-dumping relativo às importações de painéis duros
    de fibras de madeira (painéis duros) originárias da Roménia, do Brasil e da
    Suécia, que confirma a caducidade dos compromissos oferecidos pelos exportadores
    romenos e brasileiros e por alguns exportadores suecos e que põe fim ao compromisso
    oferecido por um outro exportador sueco (89/377/CEE) (89/377/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 19 de junio de 1989 por la que se concluye
    el procedimiento de reconsideración de las medidas antidumping relativas a las
    importaciones de tableros de fibra (tableros duros) originarios de Rumanía, Brasil
    y Suecia, por la que se confirma la expiración de los compromisos suscritos por
    exportadores rumanos, brasileños y algunos exportadores suecos y por la que se
    anula el compromiso suscrito por otro exportador sueco (89/377/CEE) (89/377/CEE)
    #'
