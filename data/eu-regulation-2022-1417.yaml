title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2022/1417 of 22 August 2022 concerning
    the authorisation of a preparation of Lactobacillus acidophilus CECT 4529 as a
    feed additive for all poultry species and categories, other than laying hens and
    chickens for fattening, and for ornamental birds and amending Implementing Regulation
    (EU) 2017/2275 (holder of authorisation: Centro Sperimentale del Latte S.r.l.)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2022/1417 de la Commission du 22 août
    2022 concernant l’autorisation d’une préparation de Lactobacillus acidophilus
    CECT 4529 en tant qu’additif pour l’alimentation de toutes les espèces et
    catégories de volailles, autres que les poules pondeuses et les poulets d’engraissement,
    et des oiseaux d’ornement, et modifiant le règlement d’exécution (UE) 2017/2275
    (titulaire de l’autorisation: Centro Sperimentale del Latte S.r.l.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2022/1417 der Kommission vom 22. August
    2022 zur Zulassung einer Zubereitung aus Lactobacillus acidophilus CECT 4529 als
    Futtermittelzusatzstoff für alle Geflügelarten und -kategorien außer Legehennen
    und Masthühnern sowie für Ziervögel und zur Änderung der Durchführungsverordnung
    (EU) 2017/2275 (Zulassungsinhaber: Centro Sperimentale del Latte S.r.l.)'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2022/1417 на Комисията
    от 22 август 2022 година за разрешаване на употребата
    на препарат от Lactobacillus acidophilus CECT 4529 като фуражна
    добавка за всички видове и категории домашни
    птици, различни от кокошки носачки и пилета
    за угояване, и за декоративни птици, и за изменение
    на Регламент за изпълнение (ЕС) 2017/2275 (притежател
    на разрешението: Centro Sperimentale del Latte S.r.l.)'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2022/1417 ze dne 22. srpna 2022 o
    povolení přípravku Lactobacillus acidophilus CECT 4529 jako doplňkové látky
    pro všechny druhy a kategorie drůbeže kromě nosnic a výkrmu kuřat a pro
    okrasné ptactvo a o změně prováděcího nařízení (EU) 2017/2275 (držitel
    povolení: Centro Sperimentale del Latte S.r.l.)'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2022/1417 af 22. august 2022
    om godkendelse af et præparat af Lactobacillus acidophilus CECT 4529 som fodertilsætningsstof
    til alle fjerkræarter og -kategorier, bortset fra æglæggende høner og slagtekyllinger,
    og til prydfugle og om ændring af gennemførelsesforordning (EU) 2017/2275 (indehaver
    af godkendelsen: Centro Sperimentale del Latte S.r.l.)'
  type: main
- language: el
  script: Grek
