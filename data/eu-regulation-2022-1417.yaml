    a brojlercsirkéken és a díszmadarakon kívül valamennyi baromfifaj- és kategória
    takarmány-adalékanyagaként történő engedélyezéséről és az (EU) 2017/2275
    végrehajtási rendelet módosításáról (az engedély jogosultja: Centro Sperimentale
    del Latte S.r.l.)'
