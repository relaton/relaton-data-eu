    Lactobacillus acidophilus CECT 4529 ως πρόσθετης ύλης ζωοτροφών
    για όλα τα είδη και τις κατηγορίες πουλερικών,
    εκτός από τις όρνιθες ωοπαραγωγής και τα κοτόπουλα
