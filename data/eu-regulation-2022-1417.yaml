  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/1417, 22. august 2022, millega antakse
    luba kasutada Lactobacillus acidophilus CECT 4529 preparaati kõigi kodulinnuliikide
    ja -kategooriate (välja arvatud munakanad ja broilerid) ning dekoratiivlindude
