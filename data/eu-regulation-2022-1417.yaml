    CECT 4529 come additivo per mangimi destinati a tutte le specie e categorie di
    pollame, diverse da galline ovaiole e polli da ingrasso, e a uccelli ornamentali,
    e che modifica il regolamento di esecuzione (UE) 2017/2275 (titolare dell’autorizzazione:
    Centro Sperimentale del Latte S.r.l.)'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2022/1417 (2022. gada 22. augusts),
