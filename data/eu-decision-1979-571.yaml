title:
- language: en
  script: Latn
  content: '79/571/EEC: Commission Decision of 22 May 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to woven fabrics of synthetic fibres (discontinuous
    or waste) other than narrow woven fabrics, pile fabrics (including terry fabrics)
    and chenille fabrics, falling within subheading 56.07 A of the Common Customs
    Tariff (NIMEXE codes 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23,
    24, 26, 27, 28, 32, 33, 34, 36) (category 3), originating in Czechoslovakia and
    in free circulation in the other Member States (Only the French and Dutch texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/571/CEE: Décision de la Commission, du 22 mai 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les tissus de fibres textiles synthétiques
    discontinues autres que rubanerie, velours, peluches, tissus bouclés (y compris
    les tissus bouclés du genre éponge) et tissus de chenille de la sous- position
    56.07 A du tarif douanier commun (codes Nimexe: 56.07-01, 04, 05, 07, 08, 11,
    13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) (catégorie 3), originaires
    de Tchécoslovaquie et mis en libre pratique dans les autres États membres (Les
    textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/571/EWG: Entscheidung der Kommission vom 22. Mai 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus der Tschechoslowakei stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche synthetische Spinnfasern: Gewebe aus synthetischen
    Spinnfasern, andere als Bänder, Samt, Plüsch, Schlingengewebe (einschließlich
    Frottiergewebe) und Chenillegewebe, der Tarifstelle 56.07 A des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23,
    24, 26, 27, 28, 32, 33, 34, 36) (Kategorie 3) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/571/EØF: Kommissionens beslutning af 22. maj 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage vævet stof af korte kemofibre, syntetiske
    eller regenererede, bortset fra vævede bånd, fløjls- og plysstoffer (inklusive
    håndklædefrotterstof af bomuld) og chenillestoffer, som henhører under pos.
    ex 56.07 A i den fælles toldtarif (NIMEXE-nummer 56.07-01, 04, 05, 07, 08, 11,
    13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36 ;kategori 3), har oprindelse
    i Tjekkoslovakiet og frit kan omsættes i de øvrige medlemsstater (Kun den franske
    og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/571/CEE: Decisione della Commissione, del 22 maggio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i tessuti di fibre tessili sintetiche
    in fiocco, diversi dai nastri, velluti, felpe, tessuti ricci (compresi i tessuti
    ricci del tipo spugna) e tessuti di ciniglia, della sottovoce 56.07 A della tariffa
    doganale comune (codici Nimexe: 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17,
    18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) (categoria 3), originari della Cecoslovacchia
    e messi in libera pratica negli altri Stati membri (I testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/571/EEG: Beschikking van de Commissie van 22 mei 1979 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd weefsels van synthetische stapelvezels, andere dan lint, fluweel, pluche,
    lussenweefsels (bad- en frotteerstof hieronder begrepen) en chemilleweefsel, van
    post ex 56.07 A van het gemeenschappelijk douanetarief (NIMEXE-code 56.07-01,
    04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36)
    (categorie 3), van oorsprong uit Tsjechoslowakije en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
