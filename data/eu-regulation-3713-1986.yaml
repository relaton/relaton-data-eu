  content: Regolamento (CEE) n. 3713/86 della Commissione del 4 dicembre 1986 che
    autorizza il Regno Unito a permettere, in determinate condizioni, un aumento supplementare
    del titolo alcolometrico di taluni vini e di taluni prodotti destinati all' elaborazione
    dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3713/86 van de Commissie van 4 december 1986 waarbij
