  content: Commission Regulation (EEC) No 3713/86 of 4 December 1986 authorizing the
    United Kingdom to permit under certain conditions an additional increase in the
    alcoholic strength of certain wines and certain products intended for wine making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3713/86 de la Commission du 4 décembre 1986 autorisant
