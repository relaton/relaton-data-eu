---
id: EURegulation2952013
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 295/2013 of 21 March 2013 amending
    Regulation (EC) No 192/2007 imposing a definitive anti-dumping duty on imports
    of polyethylene terephthalate originating, inter alia, in Taiwan following a ‘new
    exporter’ review pursuant to Article 11(4) of Regulation (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 295/2013 du Conseil du 21 mars 2013
    modifiant le règlement (CE) n ° 192/2007 instituant un droit antidumping définitif
    sur les importations de polyéthylène téréphtalate originaires, entre autres,
    de Taïwan, à la suite d’un réexamen au titre de «nouvel exportateur» effectué
    en vertu de l’article 11, paragraphe 4, du règlement (CE) n ° 1225/2009
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 295/2013 des Rates vom 21. März 2013
    zur Änderung der Verordnung (EG) Nr. 192/2007 des Rates zur Einführung eines
    endgültigen Antidumpingzolls auf Einfuhren bestimmter Polyethylenterephthalate
    mit Ursprung unter anderem in Taiwan im Anschluss an eine Überprüfung für neue
    Ausführer nach Artikel 11 Absatz 4 der Verordnung (EG) Nr. 1225/2009
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 295/2013 на Съвета
    от 21 март 2013 година за изменение на Регламент
    (ЕО) № 192/2007 за налагане на окончателно антидъмпингово
    мито върху вноса на полиетилен терефталат
    с произход, inter alia , от Тайван вследствие на
    процедура по преразглеждане във връзка с „нов
    износител“ в съответствие с член 11, параграф
    4 от Регламент (ЕО) № 1225/2009
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 295/2013 ze dne 21. března 2013
    , kterým se mění nařízení (ES) č. 192/2007, kterým se ukládá konečné
    antidumpingové clo na dovozy některých polyethylentereftalátů pocházejících
    mimo jiné z Tchaj-wanu, po přezkumu pro „nového vývozce“ podle čl. 11
    odst. 4 nařízení (ES) č. 1225/2009
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 295/2013 af 21. marts 2013 om
    ændring af forordning (EF) nr. 192/2007 om indførelse af en endelig antidumpingtold
    på import af visse typer polyethylenterephthalat med oprindelse i bl.a. Taiwan
    som følge af en fornyet undersøgelse (ny eksportør) i henhold til artikel 11,
    stk. 4, i forordning (EF) nr. 1225/2009
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 295/2013
    του Συμβουλίου, της 21ης Μαρτίου 2013 , για την
    τροποποίηση του κανονισμού (ΕΚ) αριθ. 192/2007 για
    την επιβολή οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές τερεφθαλικού πολυαιθυλενίου,
    καταγωγής, μεταξύ άλλων, Ταϊβάν, κατόπιν επανεξέτασης
    για «νέο εξαγωγέα» σύμφωνα με το άρθρο 11 παράγραφος
    4 του κανονισμού (ΕΚ) αριθ. 1225/2009
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusmäärus (EL) nr 295/2013, 21. märts 2013 , millega muudetakse
    pärast määruse (EÜ) nr 1225/2009 artikli 11 lõike 4 kohast uue eksportijaga
    seotud läbivaatamist määrust (EÜ) nr 192/2007, millega kehtestatakse lõplik
    dumpinguvastane tollimaks muu hulgas Taiwanist pärit teatava polüetüleentereflataadi
    impordi suhtes
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 295/2013, annettu 21 päivänä
    maaliskuuta 2013 , lopullisen polkumyyntitullin käyttöönotosta muun muassa
    Taiwanista peräisin olevan tietynlaisen polyeteenitereftalaatin tuonnissa annetun
    asetuksen (EY) N:o 192/2007 muuttamisesta asetuksen (EY) N:o 1225/2009 11 artiklan
    4 kohdan mukaisen uutta viejää koskevan tarkastelun jälkeen
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Vijeća (EU) br. 295/2013 od 21. ožujka 2013. kojom
    se mijenja Uredba (EZ) br. 192/2007 o uvođenju konačne antidampinške pristojbe
    na uvoz polietilen tereftalata podrijetlom iz, među ostalim, Tajvana nakon revizije
    „novog uvoznika” prema članku 11. stavku 4. Uredbe (EU) br. 1225/2009
  type: main
- language: hu
  script: Latn
  content: A Tanács 295/2013/EU végrehajtási rendelete ( 2013. március 21. ) a
    többek között Tajvanból származó polietilén-tereftalát behozatalára vonatkozó
    végleges dömpingellenes vám kivetéséről szóló 192/2007/EK rendeletnek
    az 1225/2009/EK rendelet 11. cikkének (4) bekezdése szerinti, új exportőrre
    vonatkozó felülvizsgálatot követő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 295/2013 del Consiglio, del 21 marzo
    2013 , recante modifica del regolamento (CE) n. 192/2007, che istituisce un dazio
    antidumping definitivo sulle importazioni di polietilentereftalato originario,
    tra l’altro, di Taiwan a seguito di un riesame relativo ai «nuovi esportatori»
    a norma dell’articolo 11, paragrafo 4, del regolamento (CE) n. 1225/2009
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 295/2013 ( 2013. gada 21. marts ),
    ar kuru groza Regulu (EK) Nr. 192/2007, ar ko piemēro galīgo antidempinga maksājumu
    tāda polietilēntereftalāta importam, kura izcelsme ir, inter alia , Taivānā,
    pēc “jauna eksportētāja” pārskatīšanas saskaņā ar Regulas (EK) Nr.
    1225/2009 11. panta 4. punktu
  type: main
- language: lt
  script: Latn
  content: 2013 m. kovo 21 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 295/2013,
    kuriuo, atlikus naujojo eksportuotojo peržiūrą pagal Reglamento (EB) Nr. 1225/2009
    11 straipsnio 4 dalį, iš dalies keičiamas Reglamentas (EB) Nr. 192/2007, nustatantis
    galutinį antidempingo muitą importuojamam, inter alia , Taivano kilmės polietileno
    tereftalatui
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kunsill (UE) Nru 295/2013 tal- 21
    ta’ Marzu 2013 li jemenda r-Regolament (KE) Nru 192/2007 li jimponi dazju anti-dumping
    definittiv fuq importazzjonijiet ta’ ċerti tipi ta’ polietilen tereftalat
    li joriġinaw, inter alia, fit-Tajwan wara reviżjoni ta’ “esportatur ġdid”
    taħt l-Artikolu 11(4) tar-Regolament (KE) Nru 1225/2009
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 295/2013 van de Raad van 21 maart 2013
    tot wijziging van Verordening (EG) nr. 192/2007 tot instelling van een definitief
    antidumpingrecht op de invoer van polyethyleentereftalaat uit onder meer Taiwan
    naar aanleiding van een nieuw onderzoek ten behoeve van een „nieuwe exporteur”
    uit hoofde van artikel 11, lid 4, van Verordening (EG) nr. 1225/2009
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 295/2013 z dnia 21 marca 2013 r.
    zmieniające rozporządzenie (WE) nr 192/2007 nakładające ostateczne cło antydumpingowe
    na przywóz politereftalanu etylenu pochodzącego między innymi z Tajwanu, w
    następstwie przeglądu pod kątem nowego eksportera na podstawie art. 11 ust.
    4 rozporządzenia (WE) nr 1225/2009
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 295/2013 do Conselho, de 21 de março
    de 2013 , que altera o Regulamento (CE) n. ° 192/2007 que institui um direito
    anti-dumping definitivo sobre as importações de poli(tereftalato de etileno)
    originário, nomeadamente, de Taiwan na sequência de um reexame relativo a um
    «novo exportador» em conformidade com o artigo 11. °, n. ° 4, do Regulamento
    (CE) n. ° 1225/2009
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 295/2013 al Consiliului din
    21 martie 2013 de modificare a Regulamentului (CE) nr. 192/2007 de instituire
    a unei taxe antidumping definitive la importurile de polietilen tereftalat originar,
    printre alte țări, din Taiwan, în urma efectuării unei reexaminări în ceea
    ce privește un „nou exportator” , în temeiul articolului 11 alineatul (4)
    din Regulamentul (CE) nr. 1225/2009
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 295/2013 z 21. marca 2013 , ktorým
    sa mení a dopĺňa nariadenie (ES) č. 192/2007, ktorým sa ukladá konečné
    antidumpingové clo na dovoz polyetyléntereftalátu s pôvodom okrem iného na
    Taiwane po preskúmaní „nového vývozcu“ podľa článku 11 ods. 4 nariadenia
    (ES) č. 1225/2009
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 295/2013 z dne 21. marca 2013 o spremembi
    Uredbe (ES) št. 192/2007 o uvedbi dokončne protidampinške dajatve na uvoz polietilen
    tereftalata s poreklom, med drugim, iz Tajvana po pregledu glede „novega izvoznika“
    v skladu s členom 11(4) Uredbe (ES) št. 1225/2009
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 295/2013 del Consejo, de 21 de marzo
    de 2013 , que modifica el Reglamento (CE) n ° 192/2007, por el que se establece
    un derecho antidumping definitivo sobre las importaciones de politereftalato de
    etileno originario, entre otros países, de Taiwán como consecuencia de una reconsideración
    en relación con un «nuevo exportador» en virtud del artículo 11, apartado
    4, del Reglamento (CE) n ° 1225/2009
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 295/2013 av den 21 mars 2013 om
    ändring av förordning (EG) nr 192/2007 om införande av en slutgiltig antidumpningstull
    på import av visst slags polyetentereftalat med ursprung i bland annat Taiwan
    till följd av en översyn avseende en ”ny exportör” i enlighet med artikel
    11.4 i förordning (EG) nr 1225/2009
  type: main
