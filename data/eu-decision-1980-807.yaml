title:
- language: en
  script: Latn
  content: '80/807/EEC: Commission Decision of 29 July 1980 on the reimbursement by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of expenditure incurred
    during 1978 on aids relating to the provision of socio-economic guidance for and
    the acquisition of occupational skills by persons engaged in agriculture (Only
    the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/807/CEE: Décision de la Commission, du 29 juillet 1980, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole, section
    "orientation", au Royaume de Belgique, des dépenses effectuées pendant l''année
    1978 pour les aides relatives à l''information socio-économique et à la qualification
    professionnelle des personnes travaillant dans l''agriculture (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/807/EWG: Entscheidung der Kommission vom 29. Juli 1980 über die Rückvergütung
    der im Jahr 1978 für die sozio-ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben durch den EAGFL,
    Abteilung Ausrichtung, an das Königreich Belgien (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/807/EØF: Kommissionens beslutning af 29. juli 1980 om refusion gennem
    EUGFL, udviklingssektionen, til kongeriget Belgien af de udgifter, som er afholdt
    i løbet af året 1978 til støtte vedrørende social og erhvervsmæssig vejledning
    og faglige kvalifikationer hos de personer, som arbejder i landbruget (Kun den
    franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/807/CEE: Decisione della Commissione, del 29 luglio 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio delle
    spese effettuate durante il 1978 per gli aiuti concernenti l''informazione socioeconomica
    e la qualificazione professionale delle persone che lavorano nell''agricoltura
    (Il testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/807/EEG: Beschikking van de Commissie van 29 juli 1980 betreffende
