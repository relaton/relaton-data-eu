id: EUDecision1978491
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 May 1978 authorizing Ireland not to apply Community
    treatment to women's, girls' and infants' blouses and shirt-blouses, knitted or
    crocheted (not elastic or rubberized), or woven, of wool, cotton or man-made textile
    fibres, falling within subheading ex 60.05 A or ex 61.02 B of the Common Customs
    Tariff (NIMEXE) codes 60.05-22, 23, 24, 25; 61.02-78, 82, 84), originating in
    the Philippines and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/491/CEE: Décision de la Commission, du 18 mai 1978, autorisant l''Irlande
    à exclure du traitement communautaire les chemisiers, blouses-chemisiers et blouses
    de bonneterie (non élastique ni caoutchoutée) ou tissés, pour femmes, fillettes
    et jeunes enfants, de laine, de coton, de fibres textiles synthétiques ou artificielles,
    des sous-positions Ex 60.05 A et Ex 61.02 B (code Nimexe 60.05-22, 23, 24, 25
    - 61.02-78, 82, 84) du Tarif douanier commun, originaires des Philippines et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Mai 1978, mit der Irland ermächtigt
    wird, aus den Philippinen stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Blusen und Hemdblusen aus Gewirken (weder gummielastisch noch
    kautschutiert) oder Geweben für Frauen, Mädchen und Kleinkinder, aus Wolle,
    Baumwolle, synthetischen oder künstlichen Spinnstoffen, der Tarifstellen ex 60.05
    A und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-22, 23,
    24, 25 - 61.02-78, 82, 84) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 18. maj 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage skjorter, skjortebluser og bluser af trikotage
    (ikke elastik eller gummeret) eller vævede, til kvinder, piger og småbørn,
    af uld, bomuld eller syntetiske eller regenererede fibre, som henhører under
    pos. ex 60.05 A og ex 61.02 B (NIMEXE-kode 60.05-22, 23, 24, 25 - 61.02-78, 82,
    84) i den fælles toldtarif, har oprindelse i Philippinerne og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 maggio 1978, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario camicie, camicette e bluse a maglia (non
    elastica né gommata) o tessute per donna, per ragazza e per bambini, di lana,
    di cotone o di fibre tessili sintetiche o artificiali delle sottovoci ex 60.05
    A e ex 61.02 B della tariffa doganale comune (codice Nimexe 60.05-22, 23, 24,
    25 - 61.02-78, 82, 84), originarie delle Filippine e messe in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 mei 1978 waarbij Ierland wordt gemachtigd
    blouses, overhemdblouses, van brei- of haakwerk (niet elastisch, niet gegummeerd)
    of geweven, voor dames, meisjes en kinderen, van wol, van katoen of van synthetische
    of van kunstmatige textielvezels, van de posten ex 60.05 A en ex 61.02 B (NIMEXE-code
    60.05-22, 23, 24, 25 - 61.02-78, 82, 84) van het gemeenschappelijk douanetarief,
    van oorsprong uit de Filippijnen en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
