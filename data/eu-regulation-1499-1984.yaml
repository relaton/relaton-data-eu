title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1499/84 of 24 May 1984 laying down certain
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of certain non-member countries in the 200-nautical-mile
    zone off the coast of the French department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1499/84 du Conseil du 24 mai 1984 fixant certaines
    mesures de conservation et de gestion des ressources de pêche applicables aux
    navires battant pavillon de certains pays tiers dans la zone de 200 milles située
    au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1499/84 des Rates vom 24. Mai 1984 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1499/84 af 24. maj 1984 om fastsættelse
    af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1499/84 του Συμβουλίου
    της 24ης Μαΐου 1984 για τον καθορισμό ορισμένων
    μέτρων διατηρήσεως και διαχειρίσεως των αλιευτικών
    πόρων, τα οποία εφαρμόζονται στα σκάφη υπό
    σημαία ορισμένων χωρών εντός της ζώνης 200 μιλίων,
    η οποία ευρίσκεται στα ανοικτά των ακτών του
    γαλλικού διαμερίσματος της Γουιάνας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1499/84 del Consiglio del 24 maggio 1984 che stabilisce
    talune misure di conservazione e di gestione delle risorse ittiche da applicare
    alle navi battenti bandiera di taluni paesi terzi nella zona di 200 miglia situata
    al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1499/84 van de Raad van 24 mei 1984 tot instelling
    van bepaalde maatregelen voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    van toepassing zijn in de 200-mijlszone voor de kust van het Franse departement
    Guyana
  type: main
