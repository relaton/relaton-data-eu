title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 387/79 of 26 February 1979 re-establishing
    the levying of customs duties on nets and netting made from twine, cordage or
    rope, etc., falling within heading No 59.05 and originating in South Korea, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 387/79 de la Commission, du 26 février 1979, portant
    rétablissement de la perception des droits de douane applicables aux filets,
    fabriqués à l' aide des matières reprises au n° 59.04, en nappes, etc., de
    la position tarifaire 59.05, originaires de la Corée du Sud bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 387/79 der Kommission vom 26. Februar 1979 über die
    Wiedereinführung des Zollsatzes für Netze aus Waren der Tarifnummer 59.04, in
    Stücken, usw., der Tarifnummer 59.05, mit Ursprung in Südkorea, dem die in der
    Verordnung (EWG) Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 387/79 af 26. februar 1979 om genindførelse
    af opkrævning af toldafgifter for knyttede netstoffer af sejlgarn, reb og tovværk,
    etc. under position 59.05 som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 387/79 della Commissione, del 26 febbraio 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle reti, ottenute con
    l' impiego di manufatti previsti dalla voce 59.04, in strisce, ecc., della voce
    doganale 59.05, originarie della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 387/79 van de Commissie van 26 februari 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op netten,
    vervaardigd van produkten bedoeld bij post 59.04, in banen, enz., van post 59.05,
    van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3157/78 van de Raad
  type: main
