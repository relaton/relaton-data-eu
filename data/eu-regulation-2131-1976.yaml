  content: Commission Regulation (EEC) No 2131/76 of 30 August 1976 determining the
    amounts applicable as accession compensatory amounts during the month of September
    1976 to certain cereal and rice products exported in the form of goods not covered
    by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2131/76 de la Commission, du 30 août 1976, déterminant
    les montants applicables à titre de montants compensatoires «adhésion» pendant
    le mois de septembre 1976 à certains produits des secteurs des céréales et
    du riz exportés sous forme de marchandises ne relevant pas de l'annexe II du
    traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2131/76 der Kommission vom 30. August 1976 zur Festsetzung
    der im September 1976 als Beitrittsausgleichsbeträge geltenden Beträge für
    bestimmte Getreide- und Reiserzeugnisse, die in Form von nicht unter Anhang II
    des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2131/76 af 30. august 1976 om fastsættelse
    af de beløb, der i september 1976 skal anvendes som tiltrædelsesudligningsbeløb
    for visse produkter fra korn- og rissektoren, der udføres i form af varer, som
    ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2131/76 della Commissione, del 30 agosto 1976, che
    determina gli importi compensativi «adesione» applicabili, durante il mese di
    settembre 1976, a taluni prodotti dei settori dei cereali e del riso esportati
    sotto forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2131/76 van de Commissie van 30 augustus 1976 houdende
    vaststelling van de bedragen die gedurende de maand september 1976 als compenserende
    bedragen ,,toetreding" moeten worden toegepast voor bepaalde produkten van de
    sector granen en de sector rijst, uitgevoerd in de vorm van niet onder bijlage
    II van het Verdrag vallende goederen
