title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1623/80 of 26 June 1980 fixing, for the
    third quarter of 1980, the quantities of high-quality, fresh, chilled or frozen
    beef and veal which may be imported under special conditions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1623/80 de la Commission, du 26 juin 1980, fixant
    les quantités de viandes bovines de haute qualité, fraîches, réfrigérées
    ou congelées pouvant être importées à des conditions spéciales pour le troisième
    trimestre de 1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1623/80 der Kommission vom 26. Juni 1980 zur Festsetzung
    der Mengen frischen, gekühlten oder gefrorenen Qualitätsrindfleischs, die für
    das dritte Vierteljahr 1980 unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1623/80 af 26. juni 1980 om fastsættelse
    af de mængder fersk, kølet eller frosset oksekød af høj kvalitet, der kan
    indføres på særbetingelser i tredje kvartal af 1980
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1623/80 della Commissione, del 26 giugno 1980, che
    fissa le quantità di carni bovine di qualità pregiata, fresche, refrigerate
    o congelate, che possono essere importate e condizioni speciali per il terzo trimestre
    1980
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1623/80 van de Commissie van 26 juni 1980 tot vaststelling
    van de hoeveelheid vers, gekoeld of bevroren kwaliteitsrundvlees dat in het derde
    kwartaal van 1980 op bijzondere voorwaarden kan worden ingevoerd
  type: main
