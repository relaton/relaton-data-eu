    il periodo di autorizzazione e l’ambito di applicazione della misura speciale
    di deroga agli articoli 206 e 226 della direttiva 2006/112/CE, relativa al sistema
    comune d’imposta sul valore aggiunto, adottata dall’Italia
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2023/1552 (2023. gada 25. jūlijs),
