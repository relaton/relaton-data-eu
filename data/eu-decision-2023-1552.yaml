  script: Latn
  content: Council Implementing Decision (EU) 2023/1552 of 25 July 2023 amending Implementing
    Decision (EU) 2017/784 as regards the period of authorisation for, and the scope
    of, the special measure derogating from Articles 206 and 226 of Directive 2006/112/EC
    on the common system of value added tax taken by Italy
  type: main
- language: fr
  script: Latn
