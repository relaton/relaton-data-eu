    het gemeenschappelijke stelsel van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2023/1552 z dnia 25 lipca 2023 r. zmieniająca
