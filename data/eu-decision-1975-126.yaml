id: EUDecision1975126
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 7 February 1975 authorizing the Kingdom of Belgium
    until 30 April 1975 to approve for marketing certified seed of spring wheat of
    varieties not included in the 'Common catalogue of varieties of agricultural plant
    species' or in the Belgian catalogue of varieties
  type: main
- language: fr
  script: Latn
  content: '75/126/CEE: Décision de la Commission, du 7 février 1975, autorisant
    le Royaume de Belgique à admettre, pour une période expirant le 30 avril 1975,
    la commercialisation des semences certifiées de froment (blé) de printemps appartenant
    à des variétés ne figurant ni au catalogue commun des variétés des espèces
    de plantes agricoles ni au catalogue belge des variétés'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 7. Februar 1975 zur Ermächtigung des Königreichs
    Belgien, für einen Zeitraum, der am 30. April 1975 abläuft, zertifiziertes Saatgut
    von Sommerweizen von Sorten zum gewerbsmäßigen Verkehr zuzulassen, die weder
    im gemeinsamen Sortenkatalog für landwirtschaftliche Pflanzenarten noch im belgischen
    Sortenkatalog aufgeführt sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 7. februar 1975 om bemyndigelse til kongeriget
    Belgien til at tillade, at »certificeret sædekorn« af vårhvedesorter, der
    ikke er optaget i »Den fælles sortsliste over Landbrugsplantearter« eller i
    den nationale belgiske sortsliste, bringes i handelen i et tidsrum, der udløber
    den 30. april 1975
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 7 febbraio 1975, che autorizza il Regno
    del Belgio ad ammettere per un periodo che scade il 30 aprile 1975, la commercializzazione
    di sementi certificate di frumento primaverile appartenenti a varietà che non
    figurano né nel catalogo comune delle varietà delle specie di piante agricole
    né nel catalogo belga delle varietà
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 7 februari 1975 tot machtiging van het
    Koninkrijk België om voor een periode eindigend op 30 april 1975 gecertificeerd
    zaad van zomertarwe van rassen tot de handel toe te laten, welke niet in de gemeenschappelijke
    rassenlijst van landbouwgewassen noch in de Belgische rassenlijst zijn opgenomen
  type: main
