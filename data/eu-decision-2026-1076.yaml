  content: Council Decision (EU) 2026/1076 of 5 May 2026 on the conclusion, on behalf
    of the Union, of the Agreement in the form of an Exchange of Letters between the
    European Union and the People’s Republic of China pursuant to Article XXVIII
    of the General Agreement on Tariffs and Trade (GATT) 1994 relating to the modification
    of concessions on all the tariff rate quotas included in the EU Schedule CLXXV
    as a consequence of the United Kingdom’s withdrawal from the European Union
  type: main
- language: fr
