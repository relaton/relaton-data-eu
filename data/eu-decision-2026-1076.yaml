    de l’accord général sur les tarifs douaniers et le commerce (GATT) de 1994
    en ce qui concerne la modification des concessions pour l’ensemble des contingents
    tarifaires de la liste CLXXV de l’Union européenne à la suite du retrait du
    Royaume-Uni de l’Union européenne
  type: main
