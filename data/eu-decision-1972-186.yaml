title:
- language: en
  script: Latn
  content: '72/186/EEC: Commission Decision of 19 April 1972 authorizing the Kingdom
    of Belgium, the French Republic and the Kingdom of the Netherlands to approve
    for marketing reproductive material of Picea abies Karst., satisfying less stringent
    requirements (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '72/186/CEE: Décision de la Commission, du 19 avril 1972, autorisant le
    Royaume de Belgique, la République française et le Royaume des Pays-Bas à admettre
    à la commercialisation des matériels de reproduction de Picea abies Karst.,
    soumis à des exigences réduites (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '72/186/EWG: Entscheidung der Kommission vom 19. April 1972, mit der das
    Königreich Belgien, die Französische Republik und das Königreich der Niederlande
    ermächtigt werden, Vermehrungsgut von Picea Abies Karst. mit minderen Anforderungen
    zum gewerbsmäßigen Verkehr zuzulassen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '72/186/EØF: Kommissionens beslutning af 19. april 1972, om bemyndigelse
    af kongeriget Belgien, Den franske Republik og kongeriget Nederlandene til at
    tillade handel med formeringsmateriale af Picea abies Karst, der opfylder mindre
    strenge krav (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '72/186/CEE: Decisione della Commissione, del 19 aprile 1972, che autorizza
    il Regno del Belgio, la Repubblica francese e il Regno dei Paesi Bassi ad ammettere
    alla commercializzazione dei materiali di moltiplicazione di Picea abies Karst.,
    soggetti a requisiti ridotti (I testi in lingua francese e olandese sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '72/186/EEG: Beschikking van de Commissie van 19 april 1972 houdende machtiging
    van het Koninkrijk België, de Franse Republiek en het Koninkrijk der Nederlanden
    om teeltmateriaal van Picea abies Karst, waaraan minder strenge eisen zijn gesteld,
    tot de handel toe te laten (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
