title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2628/90 of 11 September 1990 amending the
    list annexed to Regulation (EEC) No 55/87 establishing the list of vessels exceeding
    eight metres length overall permitted to use beam trawls within certain areas
    of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2628/90 de la Commission du 11 septembre 1990 modifiant
    la liste annexée au règlement (CEE) n° 55/87 établissant la liste des bateaux
    dont la longueur hors tout dépasse huit mètres autorisés à pêcher à l'aide
    de chaluts à perches dans certaines zones de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2628/90 der Kommission vom 11. September 1990 zur
    Änderung der Liste im Anhang der Verordnung (EWG) Nr. 55/87 zur Festlegung der
    Liste der Schiffe mit einer Länge über alles von mehr als 8 m, die in bestimmten
    Zonen der Gemeinschaft mit Baumkurren fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2628/90 af 11. september 1990 om ændring
    af den liste, der er knyttet som bilag til forordning (EØF) nr. 55/87 om listen
    over fartøjer med en længde overalt på over 8 m, der i visse af Fællesskabets
    kystomraader har tilladelse til at anvende bomtrawl
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2628/90 της Επιτροπής
    της 11ης Σεπτεμβρίου 1990 για την τροποποίηση
    του καταλόγου που είναι προσαρτημένος στον
    κανονισμό (ΕΟΚ) αριθ. 55/87 για την κατάρτιση του
    καταλόγου των σκαφών συνολικού μήκους άνω
    των οκτώ μέτρων τα οποία επιτρέπεται να χρησιμοποιούν
    δοκότρατες σε ορισμένες παράκτιες περιοχές
    της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2628/90 della Commissione dell'11 settembre 1990 recante
    modifica dell'elenco allegato al regolamento (CEE) n. 55/87 che fissa l'elenco
    dei pescherecci di lunghezza fuori tutto superiore a otto metri, autorizzati ad
    usare reti a strascico a pali in determinate zone della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2628/90 van de Commissie van 11 september 1990 houdende
    wijziging van de lijst in de bijlage bij Verordening (EEG) nr. 55/87 tot vaststelling
    van de lijst van vaartuigen met een lengte over alles van meer dan 8 meter en
    die in bepaalde zones van de Gemeenschap mogen vissen met de boomkor
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2628/90 da Comissão de 11 de Setembro de 1990 que
    altera a lista anexa ao Regulamento (CEE) nº 55/87, que estabelece a lista dos
    navios com mais de oito metros de comprimento de fora a fora autorizados a utilizar
    redes de arrasto de vara em determinadas zonas da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2628/90 de la Comisión de 11 de septiembre de 1990
    que modifica la lista aneja al Reglamento (CEE) n° 55/87, por el que se establece
    la lista de barcos cuya eslora total exceda los ocho metros y a los que se permite
    faenar utilizando artes de arrastre de vara dentro de determinadas zonas de la
    Comunidad
  type: main
