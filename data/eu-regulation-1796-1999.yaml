    surinkimo už plieninių lynų ir kabelių, kurių kilmės šalys yra Kinijos
    Liaudies Respublika, Vengrija, Indija, Meksika, Lenkija, Pietų Afrika ir Ukraina,
    importą ir antidempingo tyrimo dėl Korėjos Respublikos kilmės produktų importo
    nutraukimo
  type: main
