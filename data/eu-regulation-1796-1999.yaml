    на временното мито, наложено върху внос на
    стоманени въжета и кабели, произведени в Китайската
    народна република, Унгария, Индия, Мексико,
    Полша, Южна Африка и Украйна, и прекратяване
    на антидъмпинговата процедура по отношение
    на вносни стоки с произход в Република Корея
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1796/1999 ze dne 12. srpna 1999 o uložení konečného
