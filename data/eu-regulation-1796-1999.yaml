    originarias de la República Popular de China, Hungría, la India, México, Polonia,
    Sudáfrica y Ucrania y por el que se da por concluido el procedimiento antidumping
    relativo a las importaciones de dicho producto originarias de la República de
    Corea
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1796/1999 av den 12 augusti 1999 om införande
