    behozatalokra vonatkozó dömpingellenes eljárás megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1796/1999 del Consiglio del 12 agosto 1999 che istituisce
    un dazio antidumping definitivo e riscuote definitivamente il dazio provvisorio
    imposto sulle importazioni di cavi d'acciaio originarie della Repubblica popolare
    cinese, dell'Ungheria, dell'India, del Messico, della Polonia, del Sudafrica e
    dell'Ucraina e chiude il procedimento antidumping relativo alle importazioni originarie
    della Repubblica di Corea
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1796/1999 (1999. gada 12. augusts), ar ko attiecībā
