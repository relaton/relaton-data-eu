    do direito provisório instituído sobre as importações de cabos de aço originários
    da República Popular da China, da Hungria, da Índia, do México, da Polónia,
    da África do Sul e da Ucrânia, e que encerra o processo anti- dumping relativo
    às importações originárias da República da Coreia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1796/1999 al Consiliului din 12 august 1999 privind
    instituirea unui drept antidumping definitiv și perceperea cu titlu definitiv
    a dreptului provizoriu instituit la importurile de cabluri din oțel originare
    din Republica Populară Chineză, Ungaria, India, Mexic, Polonia, Africa de Sud
    și Ucraina și închiderea procedurii antidumping referitoare la importurile
    originare din Republica Coreea
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1796/1999 z 12. augusta 1999 o uložení konečného
    antidumpingového cla a o konečnom výbere uloženého dočasného cla na dovoz
    oceľových lán a káblov s pôvodom v Čínskej ľudovej republike, Maďarsku,
    Indii, Mexiku, Poľsku, Južnej Afrike a Ukrajine a o ukončení antidumpingového
    konania súvisiaceho s dovozmi s pôvodom v Kórejskej republike
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1796/1999 z dne 12. avgusta 1999 o uvedbi dokončnih
