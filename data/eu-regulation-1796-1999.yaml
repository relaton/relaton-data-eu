    China, Hongarije, India, Mexico, Polen, Zuid-Afrika en Oekraïne, tot definitieve
    inning van het op deze invoer ingestelde voorlopige antidumpingrecht en tot beëindiging
    van de antidumpingprocedure in verband met deze invoer uit de Republiek Korea
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1796/1999 z dnia 12 sierpnia 1999 r. nakładające
