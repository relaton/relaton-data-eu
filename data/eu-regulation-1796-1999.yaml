title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1796/1999 of 12 August 1999 imposing a definitive
    anti-dumping duty, and collecting definitively the provisional duty imposed, on
    imports of steel ropes and cables originating in the People's Republic of China,
    Hungary, India, Mexico, Poland, South Africa and Ukraine and terminating the anti-dumping
    proceeding in respect of imports originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1796/1999 du Conseil du 12 août 1999 instituant un
    droit antidumping définitif et portant perception définitive du droit provisoire
    institué sur les importations de câbles en acier originaires de la République
    populaire de Chine, de Hongrie, d'Inde, du Mexique, de Pologne, d'Afrique du Sud
    et d'Ukraine, et clôturant la procédure antidumping en ce qui concerne les importations
    de la République de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1796/1999 des Rates vom 12. August 1999 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Kabeln und Seilen aus
    Stahl mit Ursprung in der Volksrepublik China, Ungarn, Indien, Mexiko, Polen,
    Südafrika und der Ukraine, zur endgültigen Vereinnahmung des vorläufigen Antidumpingzolls
    auf diese Einfuhren und zur Einstellung des Antidumpingverfahrens gegenüber den
    Einfuhren mit Ursprung in der Republik Korea
  type: main
- language: bg
  script: Cyrl
