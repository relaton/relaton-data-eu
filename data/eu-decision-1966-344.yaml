title:
- language: fr
  script: Latn
  content: Décision 66/344/CEE de la Commission, du 12 mai 1966, portant octroi d'un
    contingent tarifaire à l'UEBL pour le ferrochrome contenant en poids 0, 10 %
    ou moins de carbone et de 30 % exclus à 90 % inclus de chrome
  type: main
- language: de
  script: Latn
  content: '66/344/EWG: Entscheidung der Kommission vom 12. Mai 1966 über die Gewährung
    eines Zollkontingents für Ferrochrom mit einem Gehalt an Kohlenstoff von 0,10
    Gewichtshundertteilen oder weniger und an Chrom von mehr als 30 bis 90 Gewichtshundertteilen
    an die Belgisch- Luxemburgische Wirtschaftsunion'
  type: main
- language: it
  script: Latn
  content: '66/344/CEE: Decisione della Commissione, del 12 maggio 1966, relativa
    alla concessione di un contingente tariffario all''Unione economica belgo-lussemburghese
    per il ferro-cromo contenente, in peso, fino allo 0,10 % di carbonio e dal 30%
    escluso al 90% incluso di cromo'
  type: main
- language: nl
  script: Latn
  content: '66/344/EEG: Beschikking van de Commissie van 12 mei 1966 houdende toekenning
    van een tariefcontingent aan de Belgisch-Luxemburgse Unie voor ferrochroom, bevattende
    ten hoogste 0,10 gewichtspercent koolstof en meer dan 30 gewichtspercenten doch
    niet meer dan 90 gewichtspercenten chroom'
  type: main
