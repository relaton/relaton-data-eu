    hinsichtlich der Einträge für Bosnien und Herzegowina in den Listen der Drittländer,
    Gebiete und Zonen derselben, aus denen der Eingang von Sendungen von frischem
    Fleisch von Geflügel sowie von Fleischerzeugnissen von Geflügel in die Union
    zulässig ist
  type: main
