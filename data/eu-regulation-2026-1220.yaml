- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1220 of 9 June 2026 amending
    Annexes XIV and XV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Bosnia and Herzegovina in the lists of third countries, territories, or zones
    thereof authorised for the entry into the Union of consignments of fresh meat
    of poultry and meat products from poultry
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1220 de la Commission du 9 juin 2026
    modifiant les annexes XIV et XV du règlement d’exécution (UE) 2021/404 en
    ce qui concerne les mentions relatives à la Bosnie-Herzégovine dans les listes
    des pays tiers et territoires ou des zones de pays tiers ou territoire en provenance
    desquels l’entrée dans l’Union d’envois de viandes fraîches de volailles
    et de produits à base de viande de volaille est autorisée
  type: main
