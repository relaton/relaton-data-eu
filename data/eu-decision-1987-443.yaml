title:
- language: en
  script: Latn
  content: '87/443/EEC: Commission Decision of 30 July 1987 amending an undertaking
    and accepting an undertaking given in connection with the anti-dumping review
    investigation concerning imports of copper sulphate originating in Poland and
    the USSR respectively, and terminating the investigation as it concerns these
    countries'
  type: main
- language: fr
  script: Latn
  content: '87/443/CEE: Décision de la Commission du 30 juillet 1987 modifiant un
    engagement, acceptant l'' engagement souscrit dans le cadre de la procédure de
    révision engagée à l'' égard des importations de sulfate de cuivre originaire
    respectivement de Pologne et d'' Union soviétique, et clôturant l'' enquête
    pour ce qui concerne ces deux pays'
  type: main
- language: de
  script: Latn
  content: '87/443/EWG: Beschluß der Kommission vom 30. Juli 1987 zur Änderung einer
    Verpflichtung und zur Annahme einer Verpflichtung, die im Rahmen der Überprüfung
    des Antidumpingverfahrens betreffend Einfuhren von Kupfersulfat mit Ursprung in
    Polen bzw. der UdSSR angeboten worden sind, sowie zur Einstellung des Verfahrens
    gegenüber diesen Ländern'
  type: main
- language: da
  script: Latn
  content: '87/443/EØF: Kommissionens afgørelse af 30. juli 1987 om ændring af
    et tilsagn og om godtagelse af et tilsagn i forbindelse med den fornyede antidumpingundersøgelse
    vedrørende importen af kobbersulfat med oprindelse i henholdsvis Polen og Sovjetunionen
    og om afslutning af undersøgelsen for disse landes vedkommende'
  type: main
- language: el
  script: Grek
  content: '87/443/ΕΟΚ: Απόφαση της Επιτροπής της 30ής
    Ιουλίου 1987 για την τροποποίηση ανάληψης υποχρεώσεων
    και για την αποδοχή ανάληψης υποχρεώσεων που
    προτάθηκε σε σχέση με την έρευνα επανεξέτασης
    των μέτρων αντιντάμπινγκ όσον αφορά τις εισαγωγές
    θειικού χαλκού καταγωγής Πολωνίας και Σοβιετικής
    Ένωσης αντίστοιχα, και για την περάτωση της
    έρευνας που αφορά αυτές τις χώρες'
  type: main
- language: it
  script: Latn
  content: '87/443/CEE: Decisione della Commissione del 30 luglio 1987 che modifica
    un impegno e accetta un impegno offerto nell'' ambito della procedura antidumping
    di riesame relativa alle importazioni di solfato di rame originario della Polonia
    e dell'' URSS, e che chiude la procedura per quanto riguarda questi paesi'
  type: main
- language: nl
  script: Latn
  content: '87/443/EEG: Besluit van de Commissie van 30 juli 1987 tot wijziging van
    een verbintenis en aanvaarding van een verbintenis, aangeboden in verband met
    het nieuwe anti-dumpingonderzoek betreffende de invoer van kopersulfaat van oorsprong
    uit respectievelijk Polen en de Sowjetunie en ter beëindiging van het onderzoek
    met betrekking tot deze landen'
  type: main
- language: pt
  script: Latn
  content: '87/443/CEE: Decisão da Comissão de 30 de Julho de 1987 que altera um
    compromisso e aceita um compromisso oferecido no âmbito do inquérito de reexame
    anti-dumping relativo às importações de sulfato de cobre originárias respectivamente
    da Polónia e da União Soviética, e que encerra o inquérito no que diz respeito
    a estes países'
  type: main
- language: es
  script: Latn
  content: '87/443/CEE: Decisión de la Comisión de 30 de julio de 1987 por la que
    se modifica y se acepta un compromiso ofrecido en relación con la investigación
    antidumping sobre las importaciones de sulfato de cobre originario de Polonia
    y la URSS, respectivamente, y por la que se da por concluida la investigación
    por lo que respecta a dichos países'
