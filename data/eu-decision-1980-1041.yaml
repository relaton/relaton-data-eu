title:
- language: en
  script: Latn
  content: '80/1041/EEC: Commission Decision of 27 October 1980 on the application
    by Ireland of measures to facilitate full use of the global quota available to
    the other Member States for vehicles originating in the Community other than those
    covered by special treatment under the scheme applicable to assembly and import
    of motor vehicles (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1041/CEE: Décision de la Commission, du 27 octobre 1980, relative
    à l''application par l''Irlande de mesures destinées à faciliter la pleine
    utilisation du contingent global ouvert aux autres Etats membres pour les véhicules
    originaires de la Communauté, autres que ceux couverts par le régime spécial
    découlant de celui qui est applicable au montage et à l''importation de véhicules
    à moteur (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1041/EWG: Entscheidung der Kommission vom 27. Oktober 1980 über die
    Anwendung von Maßnahmen seitens Irlands zur Erleichterung der vollen Ausschöpfung
    des Globalkontingents, welches Irland zugunsten der anderen Mitgliedstaaten für
    Kraftfahrzeuge mit Ursprung aus der Gemeinschaft eröffnet hat, die nicht unter
    die für die Kraftfahrzeugmontage und die Kraftfahrzeugeinfuhr geltende Sonderregelung
    fallen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1041/EØF: Kommissionens beslutning af 27. oktober 1980 om Irlands
    gennemførelse af foranstaltninger, der skal lette den fulde udnyttelse af det
    globalkontingent, som er åbnet for medlemsstaterne for motorkøretøjer med oprindelse
    i Fællesskabet, og som ikke omfattes af den særlige ordning, der er resultatet
    af ordningen for samling og import af motorkøretøjer (Kun den engelske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/1041/ΕΟΚ : Απόφαση της Επιτροπής, της 27ης
    Οκτωβρίου 1980, περί της εφαρμογής από την Ιρλανδία
    μέτρων που προορίζονται να διευκολύνουν την
    πλήρη χρησιμοποίηση της γενικής ποσόστωσης
    που έχει ανοιχθεί στα άλλα κράτη μέλη για τα
    οχήματα κοινοτικής προέλευσης, τα οποία δεν
    καλύπτονται από το ειδικό καθεστώς που προκύπτει
    από το καθεστώς που ισχύει για την συναρμολόγηση
    και την εισαγωγή οχημάτων με κινητήρα (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '80/1041/CEE: Decisione della Commissione, del 27 ottobre 1980, relativa
    all''applicazione da parte dell''Irlanda di misure destinate ad agevolare la completa
    utilizzazione del contingente globale aperto agli altri Stati membri per gli autoveicoli
    originari della Comunità, diversi da quelli coperti dal regime speciale derivante
    dal regime applicabile al montaggio ed all''importazione di autoveicoli (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1041/EEG: Beschikking van de Commissie van 27 oktober 1980 betreffende
    de toepassing door Ierland van maatregelen bestemd om volledige benutting te vergemakkelijken
    van het globale contingent dat voor de overige Lid-Staten is geopend voor andere
    motorvoertuigen van oorsprong uit de Gemeenschap dan die welke vallen onder de
    speciale regeling die voortvloeit uit die welke van toepassing is op de assemblage
    en de invoer van motorvoertuigen (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
