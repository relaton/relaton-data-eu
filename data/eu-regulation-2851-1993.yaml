    apresentados em Outubro de 1993, para determinados produtos do sector do leite
    e dos produtos lácteos, no âmbito do regime previsto nos acordos provisórios
    concluídos pela Comunidade com a República da Polónia, a República da Hungria
    e a República Federativa Checa e Eslovaca
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2851/93 de la Comisión, de 19 de octubre de 1993, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación presentadas en octubre de 1993 de algunos productos del sector
    de la leche y los productos lácteos al amparo del régimen previsto en los Acuerdos
    interinos celebrados entre la Comunidad y la República de Polonia, la República
    de Hungría y la República Federativa Checa y Eslovaca
