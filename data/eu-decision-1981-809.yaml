id: EUDecision1981809
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '81/809/EEC: Commission Decision of 21 August 1981 authorizing Ireland
    to apply intra-Community surveillance to imports of products originating in a
    non-member country which have been put into free circulation in the Community
    and which may be the subject of protective measures under Article 115 of the Treaty
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/809/CEE: Décision de la Commission, du 21 août 1981, autorisant l''Irlande
    à instaurer une surveillance intracommunautaire des importations de certains
    produits originaires d''un pays tiers et mis en libre pratique dans la Communauté,
    susceptibles de faire l''objet de mesures de protection au titre de l''article
    115 du traité (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/809/EWG: Entscheidung der Kommission vom 21. August 1981 zur Ermächtigung
    Irlands zur Einführung einer innergemeinschaftlichen Überwachung der Einfuhren
    von aus einem Drittland stammenden und in der Gemeinschaft im freien Verkehr befindlichen
    Waren, für die Schutzmaßnahmen gemäß Artikel 115 des Vertrages ergriffen werden
    können (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/809/EØF: Kommissionens beslutning af 21. august 1981 om bemyndigelse
    til Irland til at indføre tilsyn inden for Fællesskabet med indførsel af produkter,
    der har oprindelse i et tredjeland og er overgået til fri omsætning i Fællesskabet,
    og som kan gøres til genstand for beskyttelsesforanstaltninger i henhold til
    traktatens artikel 115 (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/809/EOK: Απόφαση τής Επιτροπής τής 21ης Αυγούστου
    1981 περί χορηγήσεως αδείας στήν Ιρλανδία νά
    καθιερώσει καθεστώς ενδοκοινοτικής επιτηρήσεως
    τών εισαγωγών ορισμένων προϊόντων, καταγωγής
    τρίτης χώρας, καί τά οποία τίθενται σέ ελεύθερη
    κυκλοφορία στήν Κοινότητα, πού είναι δυνατό
    νά αποτελέσουν αντικείμενο προστατευτικών
    μέτρων δυνάμει τού άρθρου 115 τής συνθήκης (Το
    κείμενο στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/809/CEE: Decisione della Commissione, del 21 agosto 1981, che autorizza
    l''Irlanda ad istituire una sorveglianza intracomunitaria delle importazioni di
    prodotti originari di un paese terzo messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell''articolo 115
    del trattato (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/809/EEG: Beschikking van de Commissie van 21 augustus 1981 houdende
    machtiging van Ierland tot instelling van een intracommunautair toezicht ten aanzien
    van de invoer van produkten van oorsprong uit derde landen die in de Gemeenschap
    in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn van beschermende
    maatregelen krachtens artikel 115 van het Verdrag (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
