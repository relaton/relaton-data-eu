id: EURegulation35281982
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3528/82 of 23 December 1982 introducing
    protective measures in respect of imports into France and the United Kingdom of
    tableware and other articles of a kind commonly used for domestic or toilet purposes,
    of stoneware, and terminating the Community investigation procedure in respect
    of articles of common pottery
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3528/82 de la Commission, du 23 décembre 1982, instituant
    des mesures de protection applicables à la vaisselle et aux articles de ménage
    ou de toilette en grès importés en France et au Royaume-Uni, et clôturant la
    procédure communautaire d' enquête concernant les articles en terre commune
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3528/82 der Kommission vom 23. Dezember 1982 zur Einführung
    von Schutzmaßnahmen, die auf nach Frankreich und ins Vereinigte Königreich eingeführtes
    Geschirr sowie Haushalts- oder Toilettengegenstände aus Steinzeug anwendbar sind,
    und zur Einstellung des Verfahrens einer Gemeinschaftsuntersuchung betreffend
    Gegenstände aus gewöhnlichem Ton
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3528/82 af 23. december 1982 om indførelse
    af beskyttelsesforanstaltninger vedrørende bordservice og husholdnings- eller
    toiletartikler af stentøj, der importeres i Frankrig og Det forenede Kongerige,
    og om afslutning af fællesskabsproceduren for undersøgelse vedrørende artikler
    af almindeligt ler
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3528/82 τής Επιτροπής
    τής 23ης Δεκεμβρίου 1982 περί θεσπίσεως προστατευτικών
    μέτρων γιά τά επιτραπέζια σκεύη καί τά είδη
    οικιακής χρήσης ή ευτρεπισμού από ψευδοπορσελάνη
    πού εισάγονται στή Γαλλία καί τό Ηνωμένο Βασίλειο,
    καί γιά τήν περάτωση τής κοινοτικής διαδικασίας
    έρευνας σχετικά μέ τά είδη αυτά από κοινή γή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3528/82 della Commissione, del 23 dicembre 1982, che
    istituisce talune misure di salvaguardia da applicare al vasellame ed agli oggetti
    di uso domestico o da toletta in gres importati in Francia e nel Regno Unito e
    che conclude la procedura comunitaria d' inchiesta relativa agli oggetti in terracotta
    comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3528/82 van de Commissie van 23 december 1982 tot
    instelling van beschermende maatregelen ten aanzien van vaatwerk en huishoudelijke
    artikelen of toiletartikelen van gres die in Frankrijk en het Verenigd Koninkrijk
    worden ingevoerd en tot beëindiging van de communautaire onderzoekprocedure betreffende
    artikelen van gewoon aardewerk
  type: main
