title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1199/84 of 30 April 1984 re-establishing
    the levying of customs duties on certain outer garments and under garments for
    babies and girls, products of category 80 (code 0800), originating in Pakistan,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1199/84 de la Commission du 30 avril 1984 portant rétablissement
    de la perception des droits de douane applicables à certains vêtements de dessus
    et de dessous pour bébés et pour fillettes, de la catégorie 80 (code 0800),
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1199/84 der Kommission vom 30. April 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Oberkleidung und Unterkleidung
    für Säuglinge und Kleinkinder der Warenkategorie Nr. 80 (Kennziffer 0800) mit
    Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1199/84 af 30. april 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte yderbeklædningsgenstande og underbeklædningsgenstande
    til småbørn og piger, under varekategori nr. 80 (kode 0800), som har oprindelse
    i Pakistan og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1199/84 της Επιτροπής
    της 30ής Απριλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    εξωτερικά ενδύματα και εσώρουχα για βρέφη
    και για κορασίδες, προϊόντα της κατηγορίας
    80 (κωδικός 0800), καταγωγής Πακιστάν, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3570/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1199/84 della Commissione del 30 aprile 1984 che ripristina
    la riscossione dei dazi doganali applicabili a taluni indumenti esterni e sottovesti
    per bambini piccoli (bébés) e per ragazza, della categoria di prodotti n. 80
    (codice 0800), originari del Pakistan, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1199/84 van de Commissie van 30 april 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    bovenkleding en onderkleding voor baby' s en voor meisjes, van de categorie van
    produkten nr. 80 (codenummer 0800), van oorsprong uit Pakistan, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3570/83 van de
    Raad
  type: main
