    section "orientation", à la République italienne des dépenses effectuées pendant
    l''année 1979 pour les aides relatives à l''information socio-économique et
    à la qualification professionnelle des personnes travaillant dans l''agriculture
    (Le texte en langue italienne est le seul faisant foi)'
  type: main
