  script: Latn
  content: '80/965/EEC: Commission Decision of 29 September 1980 on the reimbursement
    by the EAGGF, Guidance Section, to the Italian Republic of expenditure incurred
    during 1979, on aid relating to the provision of socio-economic guidance for and
    the acquisition of occupational skills by persons engaged in agriculture (Only
    the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/965/CEE: Décision de la Commission, du 29 septembre 1980, relative
