---
id: EUDecision197381
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 April 1973 authorizing the French Republic not
    to apply Community treatment to knitted and crocheted garments and articles of
    clothing, of textiles other than cotton falling within heading Nos ex 60.05, ex
    61.01, ex 61.02 and ex 61.03 of the Common Customs Tariff, originating in Taiwan
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 12 avril 1973, autorisant la République
    française à exclure du traitement communautaire les articles de bonneterie et
    d'habillement en matières textiles autres que le coton des positions Ex 60.05,
    Ex 61.01, Ex 61.02 et Ex 61.03 du Tarif douanier commun, originaires de Taiwan
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. April 1973, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Wirkwaren und Bekleidung aus anderen Spinnstoffen
    als Baumwolle der Tarifnummern ex 60.05, ex 61.01, ex 61.02 und ex 61.03 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 12. april 1973 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage tricotage og beklædningsgenstande
    af tekstilstoffer (dog ikke bomuld), som henhører under position ex 60.05, ex.
    61.01, ex. 61.02 og ex. 61.03 i den fælles toldtarif og har oprindelse i Taiwan
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 aprile 1973, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli articoli di magliera e di
    vestiario in materie tessili diverse dal cotone delle voci n. ex 60.05, ex 61.01,
    ex 61.02 ed ex 61.03 della tariffa doganale comune, originari di Taïwan e messi
    in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 april 1973 waarbij de Franse Republiek
    wordt gemachtigd breiwerk, haakwerk en kleding uit textielstoffen andere dan katoen
    van posten ex 60.05, ex 61.01, ex 61.02 en ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
