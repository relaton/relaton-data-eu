id: EURegulation15181974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1518/74 of the Commission of 18 June 1974 re-establishing
    the levying of customs duties on outer garments, clothing accessories, of cotton,
    falling within CCT subheading 60.05 A ex II and ex B, originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3503/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1518/74 de la Commission, du 18 juin 1974, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessus, accessoires du vêtement, de coton, des sous-positions tarifaires 60.05
    A EX II et EX B, originaires des pays en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3503/73 du Conseil
    du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1518/74 der Kommission vom 18. Juni 1974 über die
    Wiedereinführung des Zollsatzes für Oberkleidung und Bekleidungszubehör, aus
    Baumwolle, der Tarifstelle 60.05 A ex II und ex B, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1518/74 af 18. juni 1974 om genindførelse
    af opkrævning af toldafgifter for yderbeklædningsgenstande og andre varer af
    trikotage, af bomuld, under positioner 60.05 A ex II og ex B, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1518/74 della Commissione, del 18 giugno 1974, che
    ripristina la riscossione dei dazi doganali applicabili agli indumenti esterni,
    accessori di abbigliamento, di cotone delle sottovoci doganali nn. 60.05 A ex
    II e ex B, originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3503/73 del Consiglio, del 18 dicembre
    1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1518/74 van de Commissie van 18 juni 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bovenkleding
    en kledingtoebehoren, van katoen, van onderverdeling 60.05 A ex II en ex B, van
    oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG)
    nr. 3503/73 van de Raad van 18 december 1973 algemene tariefpreferenties werden
    geopend
  type: main
