  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 891/98, annettu 27 päivänä huhtikuuta 1998,
    yhteisön sekä Puolan, Unkarin, Tsekin tasavallan, Slovakian tasavallan, Romanian
    ja Bulgarian välisissä väliaikaisissa sopimuksissa määrättyyn järjestelmään
    liittyvien huhtikuussa 1998 jätettyjen tiettyjä siipikarjanliha- ja muna-alan
    tuotteita koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 891/98 della Commissione del 27 aprile 1998 che stabilisce
