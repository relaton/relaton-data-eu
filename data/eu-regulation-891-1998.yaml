title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 891/98 of 27 April 1998 determining the extent
    to which applications lodged in April 1998 for licences for certain eggs and poultrymeat
    products under the regime provided for by the Interim Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, the Slovak Republic, Romania and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 891/98 de la Commission du 27 avril 1998 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 1998 pour certains produits des secteurs de la viande de volaille et
    des oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la république de Pologne, la république de Hongrie, la République tchèque,
    la République slovaque, la Roumanie et la Bulgarie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 891/98 der Kommission vom 27. April 1998 über die
    Festsetzung des Umfangs, in dem die im April 1998 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik, der Slowakischen Republik, Rumänien und Bulgarien genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 891/98 af 27. april 1998 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i april
    1998 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de aftaler, som Fællesskabet har indgået med
    Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske
    Republik, Rumænien og Republikken Bulgarien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 891/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Απριλίου 1998 για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Απρίλιο του 1998
    για πιστοποιητικά εισαγωγής αυγών και κρέατος
    πουλερικών βάσει του καθεστώτος που προβλέπεται
    από τις συμφωνίες, τις οποίες συνήψε η Κοινότητα
