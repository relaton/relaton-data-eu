---
id: EURegulation28662000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2866/2000 of 27 December 2000 amending Regulation
    (EC) No 1898/97 laying down rules of application in the pigmeat sector for the
    arrangements covered by Council Regulations (EC) No 1727/2000 and (EC) No 3066/95
    and repealing Regulations (EEC) No 2698/93 and (EC) No 1590/94 and amending Regulation
    (EC) No 2332/2000 determining the extent to which applications lodged in October
    2000 for import licences for certain pigmeat products under the regime provided
    for by the Agreements concluded by the Community with the Republic of Poland,
    the Republic of Hungary, the Czech Republic, Slovakia, Bulgaria and Romania can
    be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2866/2000 de la Commission du 27 décembre 2000 modifiant
    le règlement (CE) nº 1898/97 établissant les modalités d'application dans
    le secteur de la viande de porc du régime prévu par les règlements (CE) nº
    1727/2000 et (CE) nº 3066/95 du Conseil abrogeant les règlements (CEE) nº 2698/93
    et (CE) nº 1590/94 et modifiant le règlement (CE) nº 2332/2000 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en octobre 2000 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par les accords conclus par la Communauté avec la République
    de Pologne, la République de Hongrie, la République tchèque, la Slovaquie,
    la Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2866/2000 der Kommission vom 27. Dezember 2000 zur
    Änderung der Verordnung (EG) Nr. 1898/97 zur Festlegung der den Schweinefleischsektor
    betreffenden Durchführungsbestimmungen zu der in den Verordnungen (EG) Nr. 1727/2000
    und (EG) Nr. 3066/95 des Rates vorgesehenen Regelung sowie zur Aufhebung der Verordnungen
    (EWG) Nr. 2698/93 und (EG) Nr. 1590/94 sowie zur Änderung der Verordnung (EG)
    Nr. 2332/2000 über die Festsetzung des Umfangs, in dem die im Oktober 2000 gestellten
    Anträge auf Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse entsprechend
    der Regelung der Abkommen zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen
    Republik, der Slowakei, Bulgarien und Rumänien genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2866/2000 ze dne 27. prosince 2000, kterým
    se mění nařízení (ES) č. 1898/97, kterým se stanoví prováděcí pravidla
    v odvětví vepřového masa k režimu stanovenému nařízením Rady (ES) č.
    1727/2000 a (ES) č. 3066/95, zrušují nařízení (EHS) č. 2698/93 a (ES) č.
    1590/94 a mění nařízení (ES) č. 2332/2000, kterým se stanoví rozsah, v
    němž mohou být přijímány žádosti o dovozní licence na některé výrobky
    z vepřového masa podané v červenci 2000 v rámci režimu stanoveném dohodami
    uzavřenými Společenstvím s Polskou republikou, Maďarskou republikou, Českou
    republikou, Slovenskem, Bulharskem a Rumunskem
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2866/2000 af 27. december 2000 om ændring
    af forordning (EF) nr. 1898/97 om gennemførelsesbestemmelser for anvendelse i
    svinekødssektoren af den ordning, der er fastsat i Rådets forordning (EF) nr.
    1727/2000 og (EF) nr. 3066/95, og om ophævelse af forordning (EØF) nr. 2698/93
    og (EF) nr. 1590/94 samt om ændring af forordning (EF) nr. 2332/2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    2000, om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Polen,
    Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske Republik, Republikken
    Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2866/2000 της Επιτροπής,
    της 27ης Δεκεμβρίου 2000, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1898/97 για τον καθορισμό
    των λεπτομερειών εφαρμογής στον τομέα του
    χοιρείου κρέατος του καθεστώτος που προβλέπεται
    στους κανονισμούς του Συμβουλίου (ΕΚ) αριθ.
