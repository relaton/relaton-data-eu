    τη Δημοκρατία της Ουγγαρίας, την Τσεχική Δημοκρατία,
    τη Σλοβακική Δημοκρατία, τη Βουλγαρία και τη
    Ρουμανία
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2866/2000, 27. detsember 2000, millega muudetakse
    määrust (EÜ) nr 1898/97 (millega sätestatakse nõukogu määrustega (EÜ)
    nr 1727/2000 ja (EÜ) nr 3066/95 hõlmatud korra rakenduseeskirjad sealihasektoris
    ning tunnistatakse kehtetuks määrused (EMÜ) nr 2698/93 ja (EÜ) nr 1590/94)
    ja määrust (EÜ) nr 2332/2000 (millega määratakse kindlaks, millises ulatuses
    võetakse vastu 2000. aasta oktoobris ühenduse ning Poola Vabariigi, Ungari Vabariigi,
    Tšehhi Vabariigi, Slovakkia, Bulgaaria ja Rumeenia vahel sõlmitud lepingute
    kohaselt esitatud impordilitsentside taotlused teatavate sealihatoodete kohta)
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2866/2000, annettu 27 päivänä joulukuuta 2000,
    neuvoston asetuksissa (EY) N:o 1727/2000 ja (EY) N:o 3066/95 säädetyn sianliha-alan
    järjestelmän soveltamista koskevista yksityiskohtaisista säännöistä sekä
    asetusten (ETY) N:o 2698/93 ja (EY) N:o 1590/94 kumoamisesta annetun asetuksen
    (EY) N:o 1898/97 muuttamisesta ja yhteisön Puolan tasavallan, Unkarin tasavallan,
    Tšekin tasavallan, Slovakian, Bulgarian sekä Romanian kanssa tekemissä sopimuksissa
    määrätyn järjestelmän mukaisesti lokakuussa 2000 jätettyjen tiettyjä sianlihavalmisteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä annetun asetuksen (EY)
    N:o 2332/2000 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2866/2000/EK rendelete (2000. december 27.) a 1727/2000/EK
    és a 3066/95/EK tanácsi rendelet által érintett intézkedéseknek a sertéshúságazatra
    vonatkozó alkalmazása szabályainak megállapításáról, továbbá a 2698/93/EGK
    és a 1590/94/EK rendelet hatályon kívül helyezéséről szóló 1898/97/EK
    rendelet módosításáról, illetve a Közösség, valamint a Lengyel Köztársaság,
    a Magyar Köztársaság, a Cseh Köztársaság, Szlovákia, Bulgária és Románia
    között létrejött megállapodásokban foglaltak értelmében egyes sertéshústermékekre
    2000 októberében beadott behozatali engedély iránti kérelmek elfogadása
    mértékének meghatározásáról szóló 2332/2000/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2866/2000 della Commissione, del 27 dicembre 2000,
    che modifica il regolamento (CE) n. 1898/97 che stabilisce le modalità d'applicazione,
    per il settore delle carni suine, del regime previsto dai regolamenti (CE) n.
    1727/2000 e (CE) n. 3066/95 del Consiglio e che abroga i regolamenti (CEE) n.
    2698/93 e (CE) n. 1590/94 e modifica il regolamento (CE) n. 2332/2000 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di ottobre 2000 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi conclusi tra la Comunità e
    la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia,
    la Bulgaria e la Romania
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2866/2000 (2000. gada 27. decembris), ar ko groza
    Regulu (EK) Nr. 1898/97, kurā paredzēti noteikumi par to, kā cūkgaļas nozarē
    piemērot Padomes Regulā (EK) Nr. 1727/2000 un (EK) Nr. 3066/95 noteikto režīmu,
    un atceļ Regulu (EEK) Nr. 2698/93 un (EK) Nr. 1590/94, kā arī groza Regulu
    (EK) Nr. 2332/2000, ar ko nosaka apmēra apstiprināšanu attiecībā uz 2000.
    gada oktobrī iesniegtajiem licenču pieteikumiem par dažu cūkgaļas produktu
    ievešanu saskaņā ar režīmu, kas paredzēts Kopienas nolīgumos ar Polijas
    Republiku, Ungārijas Republiku, Čehijas Republiku, Slovākiju, Bulgāriju un
    Rumāniju
  type: main
- language: lt
  script: Latn
  content: 2000 m. gruodžio 27 d. Komisijos reglamentas (EB) Nr. 2866/2000, iš dalies
    keičiantis Reglamentą (EB) Nr. 1898/97, nustatantį priemonių, kurioms taikomi
    Tarybos reglamentai (EB) Nr. 1727/2000 ir (EB) Nr. 3066/95, taikymo kiaulienos
    sektoriuje taisykles ir panaikinantis Reglamentus (EEB) Nr. 2698/93 ir (EB) Nr.
    1590/94, taip pat iš dalies pakeičiantis Reglamentą (EB) Nr. 2332/2000, nustatantį
    2000 m. spalio mėn. pateiktų paraiškų gauti importo licenciją tam tikriems
    kiaulienos produktams pagal Bendrijos susitarimuose su Lenkijos Respublika, Vengrijos
    Respublika, Čekijos Respublika, Slovakija, Bulgarija ir Rumunija numatytą režimą
    priėmimo apimtį
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 2866/2000 tas-27 ta’ Diċembru
    2000 li jemenda r-Regolament (KE) Nru 1898/97 li jistabbilixxi regoli ta’ l-applikazzjoni
    fis-settur tal-laħam tal-majjal għall-arranġamenti li jaqgħu taħt ir-Regolamenti
    tal-Kunsill (KE) Nru1727/2000 u (KE) Nru 3066/95 u li jemendaw ir-Regolamenti
    (KEE) Nru 2698/93 u (KE) Nru 1590/94 u li jemenda r-Regolament (KE) Nru 2332/2000
    li jistabbilixxi safejn jistgħu jiġu aċċettati l-applikazzjonijiet f’Ottubru
    2000 għal-liċenzi ta’ l-importazzjoni ta’ ċerti prodotti tal-laħam tal-majjal
    taħt ir-reġim previst mill-arranġamenti konklużi mill-Komunità mar-Repubblika
    tal-Polonja, ir-Repubblika ta’ l-Ungerija, ir-Repubblika Ċeka, l-Islovakkja,
    il-Bulgarija u r-Rumanija
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2866/2000 van de Commissie van 27 december 2000 tot
    wijziging van Verordening (EG) nr. 1898/97 houdende vaststelling van bepalingen
    voor de uitvoering, in de sector varkensvlees, van de regelingen waarin is voorzien
    bij de Verordeningen (EG) nr. 1727/2000 en (EG) nr. 3066/95 van de Raad, en houdende
    intrekking van de Verordeningen (EEG) nr. 2698/93 en (EG) nr. 1590/94 en tot wijziging
    van Verordening (EG) nr. 2332/2000 tot vaststelling van de mate waarin gevolg
    kan worden gegeven aan de aanvragen om invoercertificaten voor bepaalde producten
    in de sector varkensvlees, die in oktober 2000 worden ingediend op grond van de
    regeling die is vastgesteld in de door de Gemeenschap gesloten overeenkomsten
    met de Republiek Polen, de Republiek Hongarije, de Tsjechische Republiek, de Slowaakse
    Republiek, Bulgarije en Roemenië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2866/2000 z dnia 27 grudnia 2000 r. zmieniające
    rozporządzenie (WE) nr 1898/97 ustanawiające zasady stosowania w sektorze wieprzowiny
    ustaleń objętych rozporządzeniem Rady (WE) nr 1727/2000 i (WE) nr 3066/95 oraz
    uchylające rozporządzenia (EWG) nr 2698/93 i (WE) nr 1590/94 oraz zmieniające
    rozporządzenie (WE) nr 2332/2000 określające zakres, w jakim mogą być przyjmowane
    wnioski złożone w październiku 2000 r. o pozwolenia na przywóz niektórych
    produktów z wieprzowiny w systemie przewidzianym w umowach zawartych przez Wspólnotę
    z Rzeczpospolitą Polską, Republiką Węgierską, Republiką Czeską, Słowacją,
    Bułgarią i Rumunią
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2866/2000 da Comissão, de 27 de Dezembro de 2000,
    que altera o Regulamento (CE) n.o 1898/97 que estabelece as regras de execução,
    no sector da carne de suíno, do regime previsto pelos Regulamentos (CE) n.o 1727/2000
    e (CE) n.o 3066/95 do Conselho e que revoga os Regulamentos (CEE) n.o 2698/93
    e (CE) n.o 1590/94, e que altera o Regulamento (CE) n.o 2332/2000 que determina
    em que medida podem ser aceites os pedidos de certificados de importação de
    determinados produtos do sector da carne de suíno apresentados em Outubro de
    2000 ao abrigo do regime previsto nos acordos concluídos pela Comunidade com
    a República da Polónia, a República da Hungria, a República Checa, a Eslováquia,
    a Bulgária e a Roménia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2866/2000 z 27. decembra 2000, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1898/97 ustanovujúce pravidlá vykonávania opatrení,
    na ktoré sa vzťahujú nariadenia Rady (ES) č. 1727/2000 a (ES) č. 3066/95
    v sektore bravčového mäsa, ktorým sa zrušujú nariadenia (EHS) č. 2698/93
    a (ES) č. 1590/94 a ktorým sa mení a dopĺňa nariadenie (ES) č. 2332/2000
    určujúce rozsah, v ktorom možno prijímať žiadosti o dovozné licencie na
    niektoré výrobky z bravčového mäsa podané v októbri 2000 podľa režimu
    ustanoveného dohodami uzavretými medzi spoločenstvom a Poľskou republikou,
    Maďarskou republikou, Českou republikou, Slovenskom, Bulharskom a Rumunskom
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2866/2000 z dne 27. decembra 2000 o spremembi
    Uredbe (ES) št. 1898/97 o določitvi pravil za uporabo režimov v sektorju prašičjega
    mesa, ki jih zajemata uredbi Sveta (ES) št. 1727/2000 in (ES) št. 3066/95, in
    o razveljavitvi uredb (EGS) št. 2698/93 in (ES) št. 1590/94 ter o spremembi
    Uredbe (ES) št. 2332/2000 o določitvi obsega, v katerem se lahko odobrijo zahtevki
    za uvozna dovoljenja, vloženi oktobra 2000, za nekatere proizvode iz prašičjega
    mesa, v skladu z režimom, predvidenim v sporazumih, ki so bili sklenjeni med
    Skupnostjo ter Republiko Poljsko, Republiko Madžarsko, Češko republiko, Slovaško,
    Bolgarijo in Romunijo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2866/2000 de la Comisión, de 27 de diciembre de 2000,
    por el que se modifican el Reglamento (CE) nº 1898/97 por el que se establecen
    las disposiciones de aplicación en el sector de la carne de porcino del régimen
    establecido en los Reglamentos (CE) nos 1727/2000 y 3066/95 del Consejo y se derogan
    los Reglamentos (CEE) nº 2698/93 y (CE) nº 1590/94, y el Reglamento (CE) nº
    2332/2000 por el que se determina la proporción en que se satisfarán las solicitudes
    de certificados de importación de algunos productos del sector de la carne de
    porcino presentadas en el mes de octubre de 2000 al amparo del régimen previsto
    en los Acuerdos celebrados entre la Comunidad y Polonia, Hungría, la República
    Checa, Eslovaquia, Bulgaria y Rumanía
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2866/2000 av den 27 december 2000 om
    ändring av förordning (EG) nr 1898/97 om tillämpningsföreskrifter vad avser
    griskött för den ordning som fastställs i rådets förordning (EG) nr 1727/2000
    och (EG) nr 3066/95 och upphävande av förordningarna (EEG) nr 2698/93 och (EG)
    nr 1590/94 och om ändring av förordning (EG) nr 2332/2000 om fastställande
    av i vilken utsträckning ansökningar som lämnats in i oktober 2000 om importlicenser
    för vissa grisköttsprodukter i enlighet med den ordning som fastställs i avtalen
    mellan gemenskapen samt Polen, Ungern, Tjeckien, Slovakien, Bulgarien och Rumänien
    kan godkännas
  type: main
