---
id: EUDecision1976238
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 October 1975 authorizing the French Republic
    not to apply Community treatment to certain setts, flags and paving, hearth and
    wall tiles, falling within subheadings 69.07 ex A and B ex II and 69.08 ex A and
    B ex II of the Common Customs Tariff, originating in Japan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/238/CEE: Décision de la Commission, du 22 octobre 1975, autorisant
    la République française à exclure du traitement communautaire certains carreaux,
    pavés, dalles de pavement ou de revêtement, des sous-positions Ex 69.07 A et
    B II et Ex 69.08 A et B II du Tarif douanier commun, originaires du Japon et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Oktober 1975, mit der die Französische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche gewisse Fliesen, gebrannte Pflastersteine, Boden-
    und Wandplatten der Tarifstellen 69.07 ex A sowie B ex II und 69.08 ex A sowie
    B ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. oktober 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage visse fliser og sten til brolægning,
    gulvbelægning eller beklædning af vægge, kaminer og lign., som henhører under
    pos. 69.07 ex A og B ex II og 69.08 ex A og B ex II i den fælles toldtarif, har
    oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 ottobre 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario talune piastrelle, taluni blocchetti
    e talune lastre da pavimentazione o da rivestimento delle voci n. 69.07 ex A e
    B ex II e 69.08 ex A e B ex II della tariffa doganale comune, originari del Giappone
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 oktober 1975 waarbij de Franse Republiek
    wordt gemachtigd bepaalde plavuizen, vloer- en wandtegels van de posten 69.07
    ex A en B ex II, en 69.08 ex A en B ex II van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
