---
id: EURegulation202691
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2026/91 of 14 January 2026 concerning
    the renewal of the authorisation of a preparation of 6-phytase produced with Trichoderma
    reesei CBS 126897 as a feed additive for poultry, weaned piglets, pigs for fattening
    and sows, the authorisation of a preparation of 6-phytase produced with Trichoderma
    reesei CBS 126897 as a feed additive for ornamental birds, suckling piglets and
    minor porcine species (holder of authorisation: AB Enzymes Finland Oy) and repealing
    Implementing Regulation (EU) No 292/2014'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2026/91 de la Commission du 14 janvier
    2026 concernant le renouvellement de l’autorisation d’une préparation de
    6-phytase produite par Trichoderma reesei CBS 126897 en tant qu’additif pour
    l’alimentation de la volaille, des porcelets sevrés, des porcs d’engraissement
    et des truies et l’autorisation d’une préparation de 6-phytase produite par
    Trichoderma reesei CBS 126897 en tant qu’additif pour l’alimentation des oiseaux
    d’ornement, des porcelets non sevrés et des espèces porcines mineures (titulaire
    de l’autorisation: AB Enzymes Finland Oy), et abrogeant le règlement d’exécution
    (UE) no 292/2014'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2026/91 der Kommission vom 14. Januar 2026
    zur Verlängerung der Zulassung einer Zubereitung aus 6-Phytase, hergestellt mit
    Trichoderma reesei CBS 126897, als Zusatzstoff in Futtermitteln für Geflügel,
    Absetzferkel, Mastschweine und Sauen, zur Zulassung einer Zubereitung aus 6-Phytase,
    hergestellt mit Trichoderma reesei CBS 126897, als Zusatzstoff in Futtermitteln
    für Ziervögel, Saugferkel und Schweinearten von geringerer wirtschaftlicher
    Bedeutung (Zulassungsinhaber: AB Enzymes Finland Oy) sowie zur Aufhebung der Durchführungsverordnung
    (EU) Nr. 292/2014'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2026/91 на Комисията
    от 14 януари 2026 година за подновяване на разрешението
    за употреба на препарат от 6-фитаза, получена
    с Trichoderma reesei CBS 126897, като фуражна добавка за
    домашни птици, отбити прасенца, свине за угояване
    и свине майки, за разрешаване на употребата
    на препарат от 6-фитаза, получена с Trichoderma reesei
    CBS 126897, като фуражна добавка за декоративни
    птици, прасенца сукалчета и видове свине с
    по-малко стопанско значение (притежател на
    разрешението: AB Enzymes Finland Oy) и за отмяна на Регламент
    за изпълнение (ЕС) № 292/2014'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2026/91 ze dne 14. ledna 2026 o obnovení
    povolení přípravku 6-fytázy z Trichoderma reesei CBS 126897 jako doplňkové
    látky pro drůbež, odstavená selata, výkrm prasat a prasnice, o povolení
    přípravku 6-fytázy z Trichoderma reesei CBS 126897 jako doplňkové látky
    pro okrasné ptactvo, sající selata a menšinové druhy prasat (držitel povolení:
    AB Enzymes Finland Oy) a zrušení prováděcího nařízení (EU) č. 292/2014'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2026/91 af 14. januar 2026
    om godkendelse af et præparat af 6-fytase produceret med Trichoderma reesei CBS
    126897 som fodertilsætningsstof til fjerkræ, fravænnede smågrise, slagtesvin
    og søer, om godkendelse af et præparat af 6-fytase produceret med Trichoderma
    reesei CBS 126897 som fodertilsætningsstof til prydfugle, pattegrise og mindre
    udbredte svinearter (indehaver af godkendelsen: AB Enzymes Finland Oy) og om ophævelse
    af gennemførelsesforordning (EU) nr. 292/2014'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2026/91 της Επιτροπής,
    της 14ης Ιανουαρίου 2026, για την ανανέωση της
    άδειας παρασκευάσματος 6-φυτάσης που παράγεται
    με Trichoderma reesei CBS 126897 ως πρόσθετης ύλης ζωοτροφών
    για πουλερικά, απογαλακτισμένα χοιρίδια, χοίρους
    προς πάχυνση και χοιρομητέρες, τη χορήγηση
    άδειας για τη χρήση παρασκευάσματος 6-φυτάσης
    που παράγεται από Trichoderma reesei CBS 126897 ως πρόσθετης
    ύλης ζωοτροφών για διακοσμητικά πτηνά, θηλάζοντα
    χοιρίδια και ήσσονος σημασίας χοιροειδή (κάτοχος
    της άδειας: AB Enzymes Finland Oy) και για την κατάργηση
    του εκτελεστικού κανονισμού (ΕΕ) αριθ. 292/2014'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2026/91, 14. jaanuar 2026, milles käsitletakse
    kodulindude, võõrdepõrsaste, nuumsigade ja emiste söödalisandina kasutatava,
    Trichoderma reesei CBS 126897 abil toodetud 6-fütaasi preparaadi loa kehtivuse
    pikendamist ning loa andmist Trichoderma reesei CBS 126897 abil toodetud 6-fütaasi
    preparaadi kasutamiseks dekoratiivlindude, piimapõrsaste ja vähemtähtsate sealiikide
    söödalisandina (loa hoidja: AB Enzymes Finland Oy) ning millega tunnistatakse
    kehtetuks rakendusmäärus (EL) nr 292/2014'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2026/91, annettu 14 päivänä
    tammikuuta 2026, Trichoderma reesei CBS 126897 -organismin tuottamaa 6-fytaasia
    sisältävän valmisteen hyväksynnän uusimisesta siipikarjan, vieroitettujen
    porsaiden, lihasikojen ja emakoiden rehun lisäaineena, Trichoderma reesei CBS
    126897 -organismin tuottamaa 6-fytaasia sisältävän valmisteen hyväksymisestä
    koristetarkoituksessa pidettävien lintujen, imevien porsaiden ja toissijaisten
    sikaeläinten rehun lisäaineena (hyväksynnän haltija: AB Enzymes Finland Oy)
    ja täytäntöönpanoasetuksen (EU) N:o 292/2014 kumoamisesta'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2026/91 ón gCoimisiún an 14 Eanáir
    2026 maidir le húdarú ullmhóide arb é atá inti 6-fíotáis arna táirgeadh
    le Trichoderma reesei CBS 126897 a athnuachan mar bhreiseán beathaithe le haghaidh
    éanlaith chlóis, bainbh scoite, muca lena ramhrú agus cránacha, agus maidir
    le húdarú ullmhóide arb é atá inti 6-fíotáis arna táirgeadh le Trichoderma
    reesei CBS 126897 mar bhreiseán beathaithe le haghaidh éin ornáideacha, bainbh
    diúil agus mionspeicis mhucúla (sealbhóir an údaraithe: AB Enzymes Finland
    Oy) agus lena n-aisghairtear Rialachán Cur Chun Feidhme (AE) Uimh. 292/2014'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2026/91 оd 14. siječnja 2026. o produljenju
    odobrenja pripravka 6-fitaze dobivene od Trichoderma reesei CBS 126897 kao dodatka
    hrani za životinje za perad, odbijenu prasad, svinje za tov i krmače, odobrenju
    pripravka 6-fitaze dobivene od Trichoderma reesei CBS 126897 kao dodatka hrani
    za životinje za ukrasne ptice, sisajuću prasad i manje zastupljene vrste svinja
    (nositelj odobrenja: AB Enzymes Finland Oy) i o stavljanju izvan snage Provedbene
    uredbe (EU) br. 292/2014'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2026/91 végrehajtási rendelete (2026. január 14.)
    a Trichoderma reesei CBS 126897 által termelt 6-fitázt tartalmazó készítmény
    baromfik, elválasztott malacok, hízósertések és kocák takarmány-adalékanyagaként
    történő engedélyezésének megújításáról, a Trichoderma reesei CBS 126897
    által termelt 6-fitázt tartalmazó készítmény díszmadarak, szopós malacok
    és kevésbé jelentős sertésfélék takarmány-adalékanyagaként történő
    engedélyezéséről (az engedély jogosultja: AB Enzymes Finland Oy) és a 292/2014/EU
    végrehajtási rendelet hatályon kívül helyezéséről'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2026/91 della Commissione, del 14 gennaio
    2026, relativo al rinnovo dell’autorizzazione di un preparato di 6-fitasi prodotta
    con Trichoderma reesei CBS 126897 come additivo per mangimi destinati a pollame,
    suinetti svezzati, suini da ingrasso e scrofe e all’autorizzazione di un preparato
    di 6-fitasi prodotta con Trichoderma reesei CBS 126897 come additivo per mangimi
    destinati a uccelli ornamentali, suinetti lattanti e specie suine minori (titolare
    dell’autorizzazione: AB Enzymes Finland Oy) e che abroga il regolamento di esecuzione
    (UE) n. 292/2014'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2026/91 (2026. gada 14. janvāris),
    ar ko atjauno atļauju ar Trichoderma reesei CBS 126897 ražotas 6-fitāzes preparātu
    lietot par barības piedevu mājputniem, atšķirtiem sivēniem, nobarojamām
    cūkām un sivēnmātēm, par atļauju ar Trichoderma reesei CBS 126897 ražotas
    6-fitāzes preparātu lietot par barības piedevu dekoratīvajiem putniem, zīdāmiem
    sivēniem un mazāk izplatītu sugu cūkām (atļaujas turētājs: AB Enzymes
    Finland Oy) un ar ko atceļ Īstenošanas regulu (ES) Nr. 292/2014'
  type: main
- language: lt
  script: Latn
  content: 2026 m. sausio 14 d. Komisijos įgyvendinimo reglamentas (ES) 2026/91 dėl
    leidimo naudoti 6-fitazės, pagamintos naudojant Trichoderma reesei CBS 126897,
    preparatą kaip naminių paukščių, nujunkytų paršelių, penimų kiaulių
    ir paršavedžių pašarų priedą atnaujinimo, leidimo naudoti 6-fitazės, pagamintos
    naudojant Trichoderma reesei CBS 126897, preparatą kaip dekoratyvinių paukščių,
    žindomų paršelių ir retesnių rūšių kiaulių pašarų priedą (leidimo
    turėtoja – bendrovė „AB Enzymes Finland Oy), kuriuo panaikinamas Įgyvendinimo
    reglamentas (ES) Nr. 292/2014
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/91 tal-14
    ta’ Jannar 2026 dwar it-tiġdid tal-awtorizzazzjoni ta’ preparat ta’ 6-fitażi
    prodotta bit-Trichoderma reesei CBS 126897 bħala addittiv tal-għalf għall-pollam,
    għall-ħnienes miftuma, għall-ħnieżer għas-simna u għall-majjali, l-awtorizzazzjoni
    ta’ preparat ta’ 6-fitażi prodotta bit-Trichoderma reesei CBS 126897 bħala
    addittiv tal-għalf għall-għasafar ornamentali, għall-ħnienes mhux miftuma
    u għall-ispeċijiet porċini minuri (detentur tal-awtorizzazzjoni: AB Enzymes
    Finland Oy), u li jħassar ir-Regolament ta’ Implimentazzjoni (UE) Nru 292/2014'
  type: main
- language: nl
  script: Latn
  content: 'Uitvoeringsverordening (EU) 2026/91 van de Commissie van 14 januari 2026
    tot verlenging van de vergunning voor een preparaat van 6-fytase geproduceerd
    door Trichoderma reesei CBS 126897 als toevoegingsmiddel voor voeding voor pluimvee,
    gespeende biggen, mestvarkens en zeugen, tot verlening van een vergunning voor
    een preparaat van 6-fytase geproduceerd door Trichoderma reesei CBS 126897 als
    toevoegingsmiddel voor voeding voor siervogels, speenvarkens en minder gangbare
    varkenssoorten (vergunninghouder: AB Enzymes Finland Oy) en tot intrekking van
    Uitvoeringsverordening (EU) nr. 292/2014'
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2026/91 z dnia 14 stycznia 2026
    r. dotyczące odnowienia zezwolenia na stosowanie preparatu 6-fitazy wytwarzanej
    przy użyciu Trichoderma reesei CBS 126897 jako dodatku paszowego dla drobiu,
    prosiąt odsadzonych, tuczników i loch oraz dotyczące zezwolenia na stosowanie
    preparatu 6-fitazy wytwarzanej przy użyciu Trichoderma reesei CBS 126897 jako
    dodatku paszowego dla ptaków ozdobnych, prosiąt ssących i podrzędnych gatunków
    świń (posiadacz zezwolenia: AB Enzymes Finland Oy), oraz uchylające rozporządzenie
    wykonawcze (UE) nr 292/2014'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2026/91 da Comissão, de 14 de janeiro
    de 2026, relativo à renovação da autorização de uma preparação de 6-fitase
    produzida com Trichoderma reesei CBS 126897 como aditivo em alimentos para aves
    de capoeira, leitões desmamados, porcos de engorda e porcas e à autorização
    de uma preparação de 6-fitase produzida com Trichoderma reesei CBS 126897 como
    aditivo em alimentos para aves ornamentais, leitões não desmamados e espécies
    menores de suínos (detentor da autorização: AB Enzymes Finland Oy) e que revoga
    o Regulamento de Execução (UE) n.o 292/2014'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2026/91 al Comisiei din 14 ianuarie
    2026 privind reînnoirea autorizației unui preparat de 6-fitază produsă de
    Trichoderma reesei CBS 126897 ca aditiv pentru hrana păsărilor de curte, a purceilor
    înțărcați, a porcilor pentru îngrășare și a scroafelor, autorizarea unui
    preparat de 6-fitază produsă de Trichoderma reesei CBS 126897 ca aditiv pentru
    hrana păsărilor ornamentale, a purceilor de lapte și a speciilor minore de
    porcine (titularul autorizației: AB Enzymes Finland Oy) și de abrogare a Regulamentului
    de punere în aplicare (UE) nr. 292/2014'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2026/91 zo 14. januára 2026 o obnovení
    povolenia prípravku s obsahom 6-fytázy produkovanej mikroorganizmom Trichoderma
    reesei CBS 126897 ako kŕmnej doplnkovej látky pre hydinu, odstavené prasiatka,
    ošípané vo výkrme a prasnice, o povolení prípravku s obsahom 6-fytázy produkovanej
    mikroorganizmom Trichoderma reesei CBS 126897 ako kŕmnej doplnkovej látky pre
    okrasné vtáky, ciciaky a menej významné druhy ošípaných (držiteľ povolenia:
    AB Enzymes Finland Oy) a o zrušení vykonávacieho nariadenia (EÚ) č. 292/2014'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2026/91 z dne 14. januarja 2026 o podaljšanju
    dovoljenja za pripravek iz 6-fitaze, proizvedene s Trichoderma reesei CBS 126897,
    kot krmni dodatek za perutnino, odstavljene pujske, prašiče za pitanje in svinje,
    o dovoljenju za pripravek iz 6-fitaze, proizvedene s Trichoderma reesei CBS 126897,
    kot krmni dodatek za okrasne ptice, sesne pujske in manj pomembne vrste prašičev
    (imetnik dovoljenja: AB Enzymes Finland Oy) in o razveljavitvi Izvedbene uredbe
    (EU) št. 292/2014'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2026/91 de la Comisión, de 14 de enero
    de 2026, relativo a la renovación de la autorización de un preparado de 6-fitasa
    producida con Trichoderma reesei CBS 126897 como aditivo para piensos para aves
    de corral, lechones destetados, cerdos de engorde y cerdas, a la autorización
    de un preparado de 6-fitasa producida con Trichoderma reesei CBS 126897 como aditivo
    para piensos destinado a aves ornamentales, lechones lactantes y especies porcinas
    menores (titular de la autorización: AB Enzymes Finland Oy) y por el que se deroga
    el Reglamento de Ejecución (UE) n.o 292/2014'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2026/91 av den 14 januari
    2026 om förlägningen av godkännandet av ett preparat av 6-fytas framställt
    med Trichoderma reesei CBS 126897 som fodertillsats för fjäderfän, avvanda
    smågrisar, slaktsvin och suggor samt av godkännande av ett preparat av 6-fytas
    framställt av Trichoderma reesei CBS 126897 som fodertillsats för burfåglar,
    diande smågrisar och mindre vanligt förekommande svinarter (innehavare av godkännandet:
    AB Enzymes Finland Oy) och om upphävande av genomförandeförordning (EU) nr
    292/2014'
  type: main
