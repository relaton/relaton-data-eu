id: EURegulation24851974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2485/74 of the Commission of 1 October 1974 re-establishing
    the levying of the customs duties on knives with cutting blades, serrated or not
    (including pruning knives), falling within heading No 82.09, originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2485/74 de la Commission, du 1er octobre 1974, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    à lame tranchante ou dentelée, y compris les serpettes fermantes, de la position
    tarifaire 82.09, originaires de la Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2485/74 der Kommission vom 1. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für Messer mit schneidender oder gezahnter Klinge, einschließlich
    Klappmesser, der Tarifnummer 82.09, mit Ursprung in Südkorea, dem die in der
    Verordnung (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2485/74 af 1. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for knive, der ikke henhører under nogen anden
    position i dette kapitel, med skærende eller savtakket æg (herunder beskærerknive)
    under position 82.09, som har oprindelse i Syd-Korea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18 december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2485/74 della Commissione, del 1 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli (diversi da
    quelli della voce n. 82.06) a lama trinciante o dentata, compresi i roncoli chiudibili
    della voce doganale n. 82.09 originari della Corea del Sud beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2485/74 van de Commissie van 1 oktober 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op messen (andere
    dan die bedoeld bij post 82.06), ook indien getand, zaksnoeimessen daaronder begrepen
    van post 82.09, van oorsprong uit Zuid-Korea, ten behoeve waarvan bij Verordening
    (EEG) nr. 3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties
    werden geopend
  type: main
