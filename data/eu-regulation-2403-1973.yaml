  content: Regulation (EEC) No 2403/73 of the Commission of 23 August 1973 fixing
    the rates of the refunds applicable from 1 September 1973 to eggs and egg yolks
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2403/73 de la Commission, du 23 août 1973, fixant les
