title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 183/94 of 28 January 1994 determining the
    extent to which applications lodged in January 1994 for import licences for certain
    poultrymeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 183/94 de la Commission, du 28 janvier 1994, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de janvier 1994 pour certaines viandes de volaille
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 183/94 der Kommission vom 28. Januar 1994 über das
    Ausmaß, in dem den im Januar 1994 für die Einfuhr von bestimmtem Geflügelfleisch
    eingereichten Lizenzanträgen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 183/94 af 28. januar 1994 om fastlæggelse
    af, i hvilket omfang de ansøgninger om udstedelse af importlicenser, der er indgivet
    i januar 1994 for visse former for fjerkrækød, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 183/94 της Επιτροπής
    της 28ης Ιανουαρίου 1994 για τον καθορισμό σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν τον Ιανουάριο 1994 για ορισμένα
    κρέατα πουλερικών
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 183/94 della Commissione, del 28 gennaio 1994, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di gennaio 1994 per alcune carni di pollame
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 183/94 van de Commissie van 28 januari 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in januari 1994 ingediende
    aanvragen om invoercertificaten voor bepaalde soorten slachtpluimvee
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 183/94 da Comissão, de 28 de Janeiro de 1994, que
    determina em que medida pode ser dado seguimento aos pedidos de concessão de
    certificados de importação apresentados no mês de Janeiro de 1994 para determinada
    carne de aves de capoeira
  type: main
- language: es
