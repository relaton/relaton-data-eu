  content: Regulation (EEC) No 3551/73 of the Commission of 21 December 1973 amending
    Regulation (EEC) No 364/73 adopting special measures for new Member States for
    white sugar used in the chemical industry
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3551/73 de la Commission, du 21 décembre 1973, modifiant
    le règlement (CEE) n° 364/73 arrêtant, pour les nouveaux États membres, des
    mesures spéciales en ce qui concerne le sucre blanc utilisé dans l'industrie
    chimique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3551/73 der Kommission vom 21. Dezember 1973 zur Änderung
