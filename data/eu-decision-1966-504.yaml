title:
- language: fr
  script: Latn
  content: Décision 66/504/CEE de la Commission, du 23 août 1966, autorisant la
    République française à exclure du traitement communautaire les "pommes et les
    poires de table fraîches", de la position n° 08.06 A II A et B I B, originaires
    de certaines pays tiers et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/504/EWG: Entscheidung der Kommission vom 23. August 1966, mit der die
    Französische Republik ermächtigt wird, die aus einigen dritten Ländern stammenden
    und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen "frischen Tafeläpfel
    und Tafelbirnen" der Tarifnummer 08.06 A II a und B I b des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/504/CEE: Decisione della Commissione, del 23 agosto 1966, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le «mele e pere
    fresche da tavola», della voce doganale n. 08.06 A II a e B I b, originarie di
    taluni paesi terzi e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/504/EEG: Beschikking van de Commissie van 23 augustus 1966 waarbij
    de Franse Republiek wordt gemachtigd om "verse tafelappelen en verse tafelperen"
    van post Nr. 08.06 A II a en B I b. die van oorsprong zijn uit sommige derde landen
    en in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
