title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2082/83 of 26 July 1983 determining actual
    production of unginned cotton for the 1982/83 marketing year and fixing the percentage
    of the aid to be paid by Member States for the 1983/84 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2082/83 de la Commission du 26 juillet 1983 établissant
    la production effective de coton non égrené de la campagne 1982/1983 ainsi que
    le pourcentage de l' aide que les États membres versent au titre de la campagne
    1983/1984
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2082/83 der Kommission vom 26. Juli 1983 zur Festlegung
    der tatsächlichen Erzeugung von nicht entkörnter Baumwolle im Wirtschaftsjahr
    1982/83 sowie des Prozentsatzes der von den Mitgliedstaaten für das Wirtschaftsjahr
    1983/84 zu zahlenden Beihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2082/83 af 26. juli 1983 om fastsættelse
    af den faktiske produktion af ikke-egreneret bomuld i produktionsåret 1982/83
    samt den procentdel af støtten, som medlemsstaterne skal udbetale for produktionsåret
    1983/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2082/83 της Επιτροπής
    της 26ης Ιουλίου 1983 περί καθορισμού της πραγματικής
    παραγωγής του μη εκκοκκισμένου βάμαβακος της
    περιόδου 1982/83 καθώς και του ποσοστού της ενισχύσεως
    που καταβάλλουν τα Κράτη μέλη για την περίοδο
    1983/84
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2082/83 della Commissione del 26 luglio 1983 che fissa
    la produzione effettiva di cotone non sgranato della campagna 1982/1983, nonché
    la percentuale dell' aiuto che gli Stati membri versano a titolo della campagna
    1983/1984
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2082/83 van de Commissie van 26 juli 1983 tot bepaling
    van de feitelijke produktie van niet-geëgreneerde katoen voor het verkoopseizoen
    1982/1983 alsmede van het steunpercentage dat de Lid-Staten voor het verkoopseizoen
    1983/1984 uitkeren
  type: main
