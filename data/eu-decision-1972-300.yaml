    primes versées pendant l'année 1970 dans le Land du Schleswig-Holstein, pour
    l'abattage de vaches et pour la non- commercialisation du lait et des produits
    laitiers
  type: main
- language: de
  script: Latn
  content: '72/300/EWG: Entscheidung der Kommission vom 18. Juli 1972 über die Erstattung
    der im Jahre 1970 für die Schlachtung von Kühen und die Nichtvermarktung von
    Milch und Milcherzeugnissen in Schleswig-Holstein gezahlten Prämien durch den
    EAGFL, Abteilung Ausrichtung, an die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '72/300/CEE: Decisione della Commissione, del 18 luglio 1972, relativa
