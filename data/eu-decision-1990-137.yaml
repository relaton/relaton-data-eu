    über Grundregeln für die Anwendung der Abgabe gemäß Artikel 5c der Verordnung
    (EWG) Nr. 804/68 im Sektor Milch und Milcherzeugnisse in Belgien (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/137/EØF: Kommissionens beslutning af 13. marts 1990 om godkendelse
