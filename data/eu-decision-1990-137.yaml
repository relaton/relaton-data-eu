    857/84 om almindelige regler for anvendelsen af den i artikel 5c i forordning
    (EØF) nr. 804/68 omhandlede afgift på mælk og mejeriprodukter (Kun den franske
    og nederlandske udgave er autentiske)'
  type: main
- language: el
