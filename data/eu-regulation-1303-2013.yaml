    fondu, Eiropas Sociālo fondu, Kohēzijas fondu, Eiropas Lauksaimniecības fondu
    lauku attīstībai un Eiropas Jūrlietu un zivsaimniecības fondu un vispārīgus
    noteikumus par Eiropas Reģionālās attīstības fondu, Eiropas Sociālo fondu,
    Kohēzijas fondu un Eiropas Jūrlietu un zivsaimniecības fondu un atceļ Padomes
    Regulu (EK) Nr. 1083/2006
  type: main
- language: lt
  script: Latn
  content: 2013 m. gruodžio 17 d. Europos Parlamento ir Tarybos reglamentas (ES)
    Nr. 1303/2013, kuriuo nustatomos Europos regioninės plėtros fondui, Europos
    socialiniam fondui, Sanglaudos fondui, Europos žemės ūkio fondui kaimo plėtrai
    ir Europos jūros reikalų ir žuvininkystės fondui bendros nuostatos ir Europos
    regioninės plėtros fondui, Europos socialiniam fondui, Sanglaudos fondui ir
