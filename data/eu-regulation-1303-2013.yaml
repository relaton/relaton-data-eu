title:
- language: en
  script: Latn
  content: Regulation (EU) No 1303/2013 of the European Parliament and of the Council
    of 17 December 2013 laying down common provisions on the European Regional Development
    Fund, the European Social Fund, the Cohesion Fund, the European Agricultural Fund
    for Rural Development and the European Maritime and Fisheries Fund and laying
    down general provisions on the European Regional Development Fund, the European
    Social Fund, the Cohesion Fund and the European Maritime and Fisheries Fund and
    repealing Council Regulation (EC) No 1083/2006
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 1303/2013 du Parlement européen et du Conseil du
    17 décembre 2013 portant dispositions communes relatives au Fonds européen de
    développement régional, au Fonds social européen, au Fonds de cohésion, au
    Fonds européen agricole pour le développement rural et au Fonds européen pour
    les affaires maritimes et la pêche, portant dispositions générales applicables
    au Fonds européen de développement régional, au Fonds social européen, au
    Fonds de cohésion et au Fonds européen pour les affaires maritimes et la pêche,
    et abrogeant le règlement (CE) n ° 1083/2006 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 1303/2013 des Europäischen Parlaments und des Rates
    vom 17. Dezember 2013 mit gemeinsamen Bestimmungen über den Europäischen Fonds
    für regionale Entwicklung, den Europäischen Sozialfonds, den Kohäsionsfonds,
    den Europäischen Landwirtschaftsfonds für die Entwicklung des ländlichen Raums
    und den Europäischen Meeres- und Fischereifonds sowie mit allgemeinen Bestimmungen
    über den Europäischen Fonds für regionale Entwicklung, den Europäischen Sozialfonds,
    den Kohäsionsfonds und den Europäischen Meeres- und Fischereifonds und zur Aufhebung
    der Verordnung (EG) Nr. 1083/2006 des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 1303/2013 на Европейския парламент
    и на Съвета от 17 декември 2013 година за определяне
    на общоприложими разпоредби за Европейския
    фонд за регионално развитие, Европейския социален
    фонд, Кохезионния фонд, Европейския земеделски
    фонд за развитие на селските райони и Европейския
    фонд за морско дело и рибарство и за определяне
    на общи разпоредби за Европейския фонд за регионално
    развитие, Европейския социален фонд, Кохезионния
    фонд и Европейския фонд за морско дело и рибарство,
    и за отмяна на Регламент (ЕО) № 1083/2006 на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) č. 1303/2013 ze dne 17.
    prosince 2013 o společných ustanoveních o Evropském fondu pro regionální
    rozvoj, Evropském sociálním fondu, Fondu soudržnosti, Evropském zemědělském
    fondu pro rozvoj venkova a Evropském námořním a rybářském fondu, o obecných
    ustanoveních o Evropském fondu pro regionální rozvoj, Evropském sociálním
    fondu, Fondu soudržnosti a Evropském námořním a rybářském fondu a o zrušení
    nařízení Rady (ES) č. 1083/2006
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) nr. 1303/2013 af 17. december
