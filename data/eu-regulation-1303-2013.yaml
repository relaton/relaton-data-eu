  content: Rialachán (AE) Uimh. 1303/2013 ó Pharlaimint na hEorpa agus ón gComhairle
    an 17 Nollaig 2013 lena leagtar síos forálacha coiteanna maidir le Ciste Forbraíochta
    Réigiúnaí na hEorpa, le Ciste Sóisialta na hEorpa, leis an gCiste Comhtháthaithe,
    leis an gCiste Eorpach Talmhaíochta um Fhorbairt Tuaithe agus leis an gCiste
    Eorpach Muirí agus Iascaigh agus lena leagtar síos forálacha ginearálta maidir
    le Ciste Forbraíochta Réigiúnaí na hEorpa, le Ciste Sóisialta na hEorpa,
    leis an gCiste Comhtháthaithe agus leis an gCiste Eorpach Muirí agus Iascaigh
    agus lena n-aisghairtear Rialachán (CE) Uimh. 1083/2006 ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) br. 1303/2013 Europskog parlamenta i Vijeća od 17. prosinca
    2013. o utvrđivanju zajedničkih odredbi o Europskom fondu za regionalni razvoj,
    Europskom socijalnom fondu, Kohezijskom fondu, Europskom poljoprivrednom fondu
    za ruralni razvoj i Europskom fondu za pomorstvo i ribarstvo i o utvrđivanju
    općih odredbi o Europskom fondu za regionalni razvoj, Europskom socijalnom fondu,
    Kohezijskom fondu i Europskom fondu za pomorstvo i ribarstvo te o stavljanju izvan
    snage Uredbe Vijeća (EZ) br. 1083/2006
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 1303/2013/EU rendelete ( 2013. december
    17. ) az Európai Regionális Fejlesztési Alapra, az Európai Szociális Alapra,
    a Kohéziós Alapra, az Európai Mezőgazdasági Vidékfejlesztési Alapra és
    az Európai Tengerügyi és Halászati Alapra vonatkozó közös rendelkezések
    megállapításáról, az Európai Regionális Fejlesztési Alapra, az Európai
    Szociális Alapra és a Kohéziós Alapra és az Európai Tengerügyi és Halászati
    Alapra vonatkozó általános rendelkezések megállapításáról és az 1083/2006/EK
    tanácsi rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 1303/2013 del Parlamento europeo e del Consiglio, del
    17 dicembre 2013 , recante disposizioni comuni sul Fondo europeo di sviluppo regionale,
    sul Fondo sociale europeo, sul Fondo di coesione, sul Fondo europeo agricolo per
    lo sviluppo rurale e sul Fondo europeo per gli affari marittimi e la pesca e disposizioni
    generali sul Fondo europeo di sviluppo regionale, sul Fondo sociale europeo, sul
    Fondo di coesione e sul Fondo europeo per gli affari marittimi e la pesca, e che
    abroga il regolamento (CE) n. 1083/2006 del Consiglio
  type: main
- language: lv
  script: Latn
