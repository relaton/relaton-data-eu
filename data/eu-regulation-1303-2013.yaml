    Ewropew għall-Iżvilupp Reġjonali, il-Fond Soċjali Ewropew, il-Fond ta' Koeżjoni,
    il-Fond Agrikolu Ewropew għall-Iżvilupp Rurali u l-Fond Marittimu u tas-Sajd
    Ewropew u li jistabbilixxi d-dispożizzjonijiet ġenerali dwar il-Fond Ewropew
    għall-Iżvilupp Reġjonali, il-Fond Soċjali Ewropew, il-Fond ta' Koeżjoni u
    l-Fond Ewropew għall-Affarijiet Marittimi u s-Sajd u li jħassar ir-Regolament
    tal-Kunsill (KE) Nru 1083/2006
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 1303/2013 van het Europees Parlement en de Raad van
    17 december 2013 houdende gemeenschappelijke bepalingen inzake het Europees Fonds
    voor regionale ontwikkeling, het Europees Sociaal Fonds, het Cohesiefonds, het
    Europees Landbouwfonds voor plattelandsontwikkeling en het Europees Fonds voor
    maritieme zaken en visserij en algemene bepalingen inzake het Europees Fonds voor
    regionale ontwikkeling, het Europees Sociaal Fonds, het Cohesiefonds en het Europees
    Fonds voor maritieme zaken en visserij, en tot intrekking van Verordening (EG)
    nr. 1083/2006 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 1303/2013 z dnia
    17 grudnia 2013 r. ustanawiające wspólne przepisy dotyczące Europejskiego Funduszu
    Rozwoju Regionalnego, Europejskiego Funduszu Społecznego, Funduszu Spójności,
    Europejskiego Funduszu Rolnego na rzecz Rozwoju Obszarów Wiejskich oraz Europejskiego
    Funduszu Morskiego i Rybackiego oraz ustanawiające przepisy ogólne dotyczące
    Europejskiego Funduszu Rozwoju Regionalnego, Europejskiego Funduszu Społecznego,
    Funduszu Spójności i Europejskiego Funduszu Morskiego i Rybackiego oraz uchylające
    rozporządzenie Rady (WE) nr 1083/2006
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 1303/2013 do Parlamento Europeu e do Conselho, de
    17 de dezembro de 2013 , que estabelece disposições comuns relativas ao Fundo
    Europeu de Desenvolvimento Regional, ao Fundo Social Europeu, ao Fundo de Coesão,
    ao Fundo Europeu Agrícola de Desenvolvimento Rural e ao Fundo Europeu dos Assuntos
    Marítimos e das Pescas, que estabelece disposições gerais relativas ao Fundo
    Europeu de Desenvolvimento Regional, ao Fundo Social Europeu, ao Fundo de Coesão
    e ao Fundo Europeu dos Assuntos Marítimos e das Pescas, e que revoga o Regulamento
    (CE) n. ° 1083/2006 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 1303/2013 al Parlamentului European și al Consiliului
    din 17 decembrie 2013 de stabilire a unor dispoziții comune privind Fondul european
    de dezvoltare regională, Fondul social european, Fondul de coeziune, Fondul european
    agricol pentru dezvoltare rurală și Fondul european pentru pescuit și afaceri
    maritime, precum și de stabilire a unor dispoziții generale privind Fondul european
    de dezvoltare regională, Fondul social european, Fondul de coeziune și Fondul
    european pentru pescuit și afaceri maritime și de abrogare a Regulamentului
    (CE) nr. 1083/2006 al Consiliului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) č. 1303/2013 zo 17. decembra
    2013 , ktorým sa stanovujú spoločné ustanovenia o Európskom fonde regionálneho
    rozvoja, Európskom sociálnom fonde, Kohéznom fonde, Európskom poľnohospodárskom
    fonde pre rozvoj vidieka a Európskom námornom a rybárskom fonde a ktorým sa
    stanovujú všeobecné ustanovenia o Európskom fonde regionálneho rozvoja, Európskom
    sociálnom fonde, Kohéznom fonde a Európskom námornom a rybárskom fonde, a
    ktorým sa zrušuje nariadenie Rady (ES) č. 1083/2006
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) št. 1303/2013 Evropskega parlamenta in Sveta z dne 17. decembra
    2013 o skupnih določbah o Evropskem skladu za regionalni razvoj, Evropskem socialnem
    skladu, Kohezijskem skladu, Evropskem kmetijskem skladu za razvoj podeželja in
    Evropskem skladu za pomorstvo in ribištvo, o splošnih določbah o Evropskem
    skladu za regionalni razvoj, Evropskem socialnem skladu, Kohezijskem skladu in
    Evropskem skladu za pomorstvo in ribištvo ter o razveljavitvi Uredbe Sveta (ES)
    št. 1083/2006
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 1303/2013 del Parlamento Europeo y del Consejo, de
    17 de diciembre de 2013 , por el que se establecen disposiciones comunes relativas
    al Fondo Europeo de Desarrollo Regional, al Fondo Social Europeo, al Fondo de
    Cohesión, al Fondo Europeo Agrícola de Desarrollo Rural y al Fondo Europeo Marítimo
    y de la Pesca, y por el que se establecen disposiciones generales relativas al
    Fondo Europeo de Desarrollo Regional, al Fondo Social Europeo, al Fondo de Cohesión
    y al Fondo Europeo Marítimo y de la Pesca, y se deroga el Reglamento (CE) n °
    1083/2006 del Consejo
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) nr 1303/2013 av den 17
    december 2013 om fastställande av gemensamma bestämmelser för Europeiska regionala
    utvecklingsfonden, Europeiska socialfonden, Sammanhållningsfonden, Europeiska
    jordbruksfonden för landsbygdsutveckling och Europeiska havs- och fiskerifonden,
    om fastställande av allmänna bestämmelser för Europeiska regionala utvecklingsfonden,
    Europeiska socialfonden, Sammanhållningsfonden och Europeiska havs- och fiskerifonden
    samt om upphävande av rådets förordning (EG) nr 1083/2006
