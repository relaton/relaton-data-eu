title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2428/92 of 18 August 1992 re-establishing
    the levying of customs duties on products of category 65 (order No 40.0650), originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2428/92 de la Commission, du 18 août 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 65 (numéro d' ordre 40.0650) originaires du Brésil, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
