title:
- language: en
  script: Latn
  content: Regulation (EEC) No 366/73 of the Commission of 31 January 1973 laying
    down interim rules for sugar imported under certain conditions by certain Member
    States pursuant to agreements arising out of the International Sugar Agreement
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 366/73 de la Commission, du 31 janvier 1973, instaurant
    un régime transitoire pour le sucre importé par certains États membres à des
    conditions particulières en vertu de conventions découlant de l'accord international
    sur le sucre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 366/73 der Kommission vom 31. Januar 1973 zur Einführung
    einer Übergangsregelung für Zucker, der von bestimmten Mitgliedstaaten auf Grund
    von Vereinbarungen im Rahmen des Internationalen Zuckerabkommens zu Sonderbedingungen
    eingeführt werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 366/73 af 31. januar 1973 om fastsættelse
    af en overgangsordning for sukker, der importeres af visse medlemsstater under
    særlige betingelser i henhold til de konventioner, der hidrører fra den internationale
    sukkeraftale
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 366/73 della Commissione, del 31 gennaio 1973, che
    istaura un regime transitorio per lo zucchero importato da taluni Stati membri
    a condizioni particolari a seguito di convenzioni derivanti dall'accordo internazionale
    sullo zucchero
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 366/73 van de Commissie van 31 januari 1973 tot invoering
    van een overgangsregeling voor suiker die door bepaalde Lid-Staten op grond van
    overeenkomsten in het kader van de Internationale Suikerovereenkomst onder bijzondere
    voorwaarden kan worden ingevoerd
  type: main
