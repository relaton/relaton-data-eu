title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 676/90 of 20 March 1990 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for export, amending Regulation (EEC) No 569/88 and repealing
    Regulation (EEC) No 431/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 676/90 de la Commission du 20 mars 1990 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines détenues par certains organismes d'intervention et destinées
    à être exportées, modifiant le règlement (CEE) n° 569/88 et abrogeant le
    règlement (CEE) n 431/90
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 676/90 DER KOMMISSION vom 20. Maerz 1990 ueber den
    Verkauf von zur Ausfuhr bestimmtem Rindfleisch aus Interventionsbestaenden nach
    der Verordnung (EWG) Nr. 2539/84, zur Aenderung der Verordnung (EWG) Nr. 569/88
    und zur Aufhebung der Verordnung (EWG) Nr. 431/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 676/90 af 20. marts 1990 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på udførsel, om ændring af forordning (EØF) nr. 569/88 og om ophævelse
    af forordning (EØF) nr. 431/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 676/90 της Επιτροπής
    της 20ής Μαρτίου 1990 σχετικά με την πώληση, βάσει
    της διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που κρατείται
    από ορισμένους οργανισμούς παρεμβάσεως και
    προορίζεται να εξαχθεί καθώς και σχετικά με
    την τροποποίηση του κανονισμού (ΕΟΚ) αριθ. 569/88
    και την κατάργηση του κανονισμού (ΕΟΚ) αριθ.
    431/90
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 676/90 DELLA COMMISSIONE del 20 marzo 1990 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d'intervento e destinate ad essere
    esportate, che modifica il regolamento (CEE) n. 569/88 e recante abrogazione del
    regolamento (CEE) n. 431/90
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 676/90 VAN DE COMMISSIE van 20 maart 1990 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer bestemd rundvlees,
    houdende wijziging van Verordening (EEG) nr. 569/88 en houdende intrekking van
    Verordening (EEG) nr. 431/90
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 676/90 DA COMISSAO de 20 de Março de 1990 relativo
    à venda, no âmbito do processo definido no Regulamento (CEE) n* 2539/84, de
    carne de bovino detida por certos organismos de intervençao e destinada a ser
    exportada, que altera o Regulamento (CEE) n* 569/88 e que revoga o Regulamento
    (CEE) n* 431/90
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 676/90 DE LA COMISION de 20 de marzo de 1990 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carnes de vacuno en poder de determinados organismos de intervencion y destinadas
    a ser exportadas y por el que se modifica el Reglamento (CEE) no 569/88 y se deroga
    el Reglamento (CEE) no 431/90
  type: main
