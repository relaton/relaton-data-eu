title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2632/81 of 10 September 1981 re-establishing
    the levying of customs duties applicable to tableware and other articles of a
    kind commonly used for domestic or toilet purposes, of porcelain or china, falling
    within heading No 69.11 and originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2632/81 de la Commission, du 10 septembre 1981, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en porcelaine, de la position 69.11
    du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2632/81 der Kommission vom 10. September 1981 zur
    Wiedereinführung der Erhebung der Zölle für Geschirr, Haushalts- und Toilettengegenstände,
    aus Porzellan, der Tarifnummer 69.11, mit Ursprung in Südkorea, dem die in der
    Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2632/81 af 10. september 1981 om genindførelse
    af opkrævning af told for bordservice samt husholdnings- og toiletartikler, af
    procelæn, henhørende under pos. 69.11 og med oprindelse i Sydkorea, som er præferenceberettiget
    henhold til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2632/81 τής Επιτροπής
    τής 10ης Σεπτεμβρίου 1981 περί αποκαταστάσεως
    τής εφαρμογής τών δασμών γιά τά επιτραπέζια
    σκεύη καί είδη οικιακής χρήσεως ή ευπρεπισμού
    εκ πορσελάνης τής κλάσεως 69. 11 τού Κοινού Δασμολογίου
    καταγωγής Νοτίου Κορέας, δικαιούχων τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2632/81 della Commissione, del 10 settembre 1981,
    che ripristina la riscossione dei dazi doganali applicabili al vasellame e agli
    oggetti di uso domestico o da toletta, di porcellana, della voce 69.11 della tariffa
    doganale comune, originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2632/81 van de Commissie van 10 september 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op vaatwerk, huishoudelijke
    artikelen en toiletartikelen, van porselein, van tariefpost 69.11 van oorsprong
    uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3322/80 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
