title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 décembre 1968, portant augmentation
    du volume du contingent tarifaire octroyé à la République fédérale d'Allemagne
    pour les fils entièrement de soie (position tarifaire Ex 50.04), non conditionnés
    pour la vente au détail
  type: main
- language: de
  script: Latn
  content: '69/18/EWG: Entscheidung der Kommission vom 19. Dezember 1968 über die
    Erhöhung des der Bundesrepublik Deutschland gewährten Zollkontingents für Garne,
    ganz aus Seide (Tarifnummer ex 50.04), nicht in Aufmachungen für den Einzelverkauf'
  type: main
- language: it
  script: Latn
  content: '69/18/CEE: Decisione della Commissione, del 19 dicembre 1968, che aumenta
    il volume del contingente tariffario concesso alla Repubblica federale di Germania
    per i filati interamente di seta (voce tariffaria ex 50.04), non preparati per
    la vendita al minuto'
  type: main
- language: nl
  script: Latn
  content: '69/18/EEG: Beschikking van de Commissie van 19 december 1968 houdende
    vergroting van het aan de Bondsrepubliek Duitsland toegekende tariefcontingent
    voor garens, geheel van zijde (post ex 50.04), niet gereed voor de verkoop in
    het klein'
  type: main
