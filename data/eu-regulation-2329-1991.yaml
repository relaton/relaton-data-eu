title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2329/91 of 25 July 1991 opening for 1991, as
    an autonomous measure, a special import quota for high-quality, fresh, chilled
    or frozen meat of bovine animals falling within CN codes 0201 and 0202 as well
    as products falling within CN codes 0206 10 95 and 0206 29 91
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2329/91 DU CONSEIL du 25 juillet 1991 portant ouverture,
    pour l'' année 1991 et à titre autonome, d'' un quota exceptionnel d'' importation
    de viandes bovines de haute qualité, fraîches, réfrigérées ou congelées,
    relevant des codes NC 0201 et 0202, ainsi que les produits relevant des codes
    NC 0206 10 95 et 0206 29 91 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2329/91 DES RATES vom 25. Juli 1991 zur Eröffnung
    eines außerordentlichen autonomen Kontingents für die Einfuhr von frischem,
    gekühltem oder gefrorenem hochwertigen Rindfleisch der KN-Codes 0201 und 0202
    sowie von Erzeugnissen der KN-Codes 0206 10 95 und 0206 29 91 #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2329/91 af 25. juli 1991 om autonom fastsættelse
    for 1991 for en særlig kvota for indførsel af oksekød af høj kvalitet, fersk,
    kølet eller frosset, henhørende under KN-kode 0201 og 0202 samt produkter henhørende
    under KN-kode 0206 10 95 og 0206 29 91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2329/91 του Συμβουλίου
    της 25ης Ιουλίου 1991 που ανοίγει για το έτος 1991
    και με τρόπο αυτόνομο μια εξαιρετική ποσόστωση
    για εισαγωγή βοείων κρεάτων υψηλής ποιότητας,
    νωπών, διατηρημένων με απλή ψύξη ή κατεψυγμένων
    που υπάγονται στους κωδικούς ΣΟ 0201 και 0202 καθώς
    και των προϊόντων που υπάγονται στους κωδικούς
    ΣΟ 0206 10 95 και 0206 29 91
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2329/91 DEL CONSIGLIO del 25 luglio 1991 relativo
    all'' apertura, per il 1991 e a titolo autonomo, di un contingente eccezionale
    di importazioni di carni bovine di qualità pregiata, fresche, refrigerate o congelate
    dei codici NC 0201 e 0202 come pure dei prodotti dei codici NC 0206 10 95 e 0206
    29 91 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2329/91 VAN DE RAAD van 25 juli 1991 houdende opening
    voor 1991 van een autonoom en uitzonderlijk tariefcontingent voor de invoer van
    vers, gekoeld of bevroren rundvlees van hoge kwaliteit van de GN-codes 0201 en
    0202, alsmede van produkten van de GN-codes 0206 10 95 en 0206 29 91 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2329/91 DO CONSELHO de 25 de Julho de 1991 relativo
    à abertura, para o ano de 1991 e a título autónomo, de uma quota excepcional
    de importação de carnes de bovino de elevada qualidade, frescas, refrigeradas
    ou congeladas, dos códigos NC 0201 e 0202, bem como dos produtos dos códigos
    NC 0206 10 95 e 0206 29 91 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2329/91 DEL CONSEJO de 25 de julio de 1991 por el
    que se abre con carácter autónomo para 1991 una cuota excepcional de importación
    de carne de vacuno de calidad superior fresca, refrigerada o congelada, de los
    códigos NC 0201 y 0202, así como de los productos de los códigos NC 0206 10
    95 y 0206 29 91 #'
  type: main
