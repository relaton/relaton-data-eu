title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 27 octobre 1972, autorisant la République
    italienne à exclure du traitement communautaire les pellicules sensibilisées,
    non impressionnées, perforées ou non, en rouleaux ou en bandes de la position
    37.02 du Tarif douanier commun, originaires du Japon et mises en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/382/EWG: Entscheidung der Kommission vom 27. Oktober 1972, mit der
    die Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche lichtempfindliche Filme in Rollen
    oder Streifen, auch gelocht, nicht belichtet, der Tarifnummer 37.02 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/382/CEE: Decisione della Commissione, del 27 ottobre 1972, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le pellicole sensibilizzate,
    non impressionate, anche perforate, in rotoli o in strisce, della voce n. 37.02
    della tariffa doganale comune, originarie del Giappone e messe in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/382/EEG: Beschikking van de Commissie van 27 oktober 1972 waarbij de
    Italiaanse Republiek wordt gemachtigd lichtgevoelige, onbelichte films, ook indien
    geperforeerd, op rollen of in stroken, van post 37.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
