title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2101/97 of 24 October 1997 determining the
    extent to which applications lodged in October 1997 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, the Slovak Republic, Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2101/97 DE LA COMMISSION du 24 octobre 1997 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1997 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords conclus par la Communauté avec la république
    de Pologne, la république de Hongrie, la République tchèque, la République
    slovaque, la Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2101/97 DER KOMMISSION vom 24. Oktober 1997 über die
    Festsetzung des Umfangs, in dem die im Oktober 1997 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen Republik, der Slowakischen
    Republik, Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2101/97 af 24. oktober 1997 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    1997 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Polen,
    Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske Republik, Republikken
    Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2101/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Οκτωβρίου 1997 για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Οκτώβριο του
    1997 για άδειες εισαγωγής χοιρείου κρέατος βάσει
    του καθεστώτος που προβλέπεται από τις συμφωνίες,
