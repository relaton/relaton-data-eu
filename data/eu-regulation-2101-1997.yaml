  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2101/97, annettu 24 päivänä lokakuuta 1997,
    yhteisön Puolan tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian
    tasavallan, Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn
    järjestelmän mukaisesti lokakuussa 1997 jätettyjen tiettyjä sianlihavalmisteita
    koskevien tuontilupahakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2101/97 DELLA COMMISSIONE del 24 ottobre 1997 che stabilisce
