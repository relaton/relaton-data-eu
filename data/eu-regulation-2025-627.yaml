title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/627 of 28 March 2025 establishing,
    pursuant to Regulation (EU) 2024/573 of the European Parliament and of the Council,
    minimum requirements for certificates of natural persons and the conditions for
    the mutual recognition of such certificates, as regards the installation, maintenance
    or servicing, repair or decommissioning of stationary electrical switchgear containing
    fluorinated greenhouse gases and recovery of fluorinated greenhouse gases from
    stationary electrical switchgear and repealing Commission Implementing Regulation
    (EU) 2015/2066
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/627 de la Commission du 28 mars 2025
    établissant, conformément au règlement (UE) 2024/573 du Parlement européen
    et du Conseil, des prescriptions minimales concernant les certificats des personnes
    physiques intervenant dans l’installation, la maintenance ou l’entretien,
    la réparation ou la mise hors service des appareils de commutation électrique
    fixes contenant des gaz à effet de serre fluorés ou dans la récupération des
    gaz à effet de serre fluorés provenant des appareils de commutation électrique
    fixes, ainsi que les conditions applicables à la reconnaissance mutuelle des
    certificats correspondants, et abrogeant le règlement d’exécution (UE) 2015/2066
    de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/627 der Kommission vom 28. März 2025
    zur Festlegung — gemäß der Verordnung (EU) 2024/573 des Europäischen Parlaments
    und des Rates — der Mindestanforderungen an Zertifikate für natürliche Personen
    sowie der Bedingungen für die gegenseitige Anerkennung dieser Zertifikate in
    Bezug auf die Installation, Instandhaltung oder Wartung, Reparatur oder Außerbetriebnahme
    ortsfester elektrischer Schaltanlagen, die fluorierte Treibhausgase enthalten,
    und die Rückgewinnung fluorierter Treibhausgase aus ortsfesten elektrischen Schaltanlagen
    sowie zur Aufhebung der Durchführungsverordnung (EU) 2015/2066 der Kommission
  type: main
