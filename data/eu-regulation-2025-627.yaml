    флуорсъдържащи парникови газове, и възстановяването
    от стационарна електрическа комутационна
    апаратура на флуорсъдържащи парникови газове,
    и за отмяна на Регламент за изпълнение (ЕС)
    2015/2066 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/627 ze dne 28. března 2025,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) 2024/573 stanoví
    minimální požadavky na certifikáty fyzických osob a podmínky pro vzájemné
    uznávání těchto certifikátů, pokud jde o instalaci, údržbu nebo servis,
    opravu nebo vyřazení z provozu stacionárních elektrických spínacích zařízení
    obsahujících fluorované skleníkové plyny a znovuzískávání fluorovaných
    skleníkových plynů ze stacionárních elektrických spínacích zařízení,
    a kterým se zrušuje prováděcí nařízení Komise (ES) 2015/2066
  type: main
