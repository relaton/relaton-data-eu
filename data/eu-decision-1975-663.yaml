id: EUDecision1975663
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 30 July 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to imports of printed woven fabrics of man-made fibres (discontinuous
    or waste) and printed woven fabrics of cotton of a weight not exceeding 130g/m2
    falling within subheading 56.07 ex A II or 55.09 ex A II of the Common Customs
    Tariff, originating in the People's Republic of China and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 juillet 1975, autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les importations des tissus imprimés de fibres textiles
    synthétiques et artificielles discontinues et des tissus de coton d'un poids
    égal ou inférieur à 130g/m2, des positions 56.07 Ex A II et 55.09 Ex A II du
    Tarif douanier commun, originaires de la République populaire de Chine et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. Juli 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Volksrepublik China eingeführte und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche bedruckte Gewebe aus synthetischen und künstlichen
    Spinnfasern sowie bedruckte Gewebe aus Baumwolle mit einem Quadratmetergewicht
    von bis zu 130 g, der Tarifnummern 56.07 ex A II und 55.09 ex A II des Gemeinsamen
    Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 30. juli 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    af undtage indførsler af trykt vævet stof af korte kemofibre eller af affald
    af kemofibre og trykte vævede stoffer af bomuld af vægt 130 gr. pr. m2 eller
    derunder, som henhører under pos. 56.07 ex A II og 55.09 ex A II i den fælles
    toldtarif, har oprindelse i folkerepublikken Kina og frit kan omsættes i de andre
    medlesstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 luglio 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le importazioni di tessuti stampati di fibre tessili
    sintetiche in fiocco e di tessuti stampati di cotone di un peso uguale o inferiore
    a 130 g/m2 delle voci 56.07 ex A II et 55.09 ex A II della tariffa doganale comune,
    originari della Repubblica popolare cinese e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 juli 1975 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    bedrukte weefsels van kunstmatige stapelvezels en bedrukte weefsels van katoen
    met een gewicht per m2 van 130 g of minder van post ex 56.07 ex A II en 55.09
    ex A II van het gemeenschappelijk douanetarief, van oorsprong uit de Volkrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
