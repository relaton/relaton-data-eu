id: EUDecision1978565
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 19 June 1978 authorizing the French Republic not
    to apply Community treatment to men's and boys' woven breeches, shorts and trousers
    (including slacks); women's, girls' and infants' woven trousers and slacks, of
    wool, of cotton or of man-made textile fibres, falling within heading No ex 61.01
    or subheading ex 61.02 B (NIMEXE codes 61.01-62; 64; 66; 72; 74; 76 - 61.02-66;
    68; 72) of the Common Customs Tariff, originating in Thailand and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/565/CEE: Décision de la Commission, du 19 juin 1978, autorisant la
    République française à exclure du traitement communautaire les culottes, "shorts"
    et pantalons tissés, pour hommes et garçonnets; pantalons tissés, pour femmes,
    fillettes et jeunes enfants, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, de la position Ex 61.01 et de la sous- position Ex 61.02 B du
    Tarif douanier commun (codes Nimexe : 61.01-62, 64, 66, 72, 74, 76; 61.02-66,
    68, 72), originaires de Thaïlande et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. Juni 1978, mit der die Französische
    Republik ermächtigt wird, aus Thailand stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Shorts und andere kurze und lange Hosen aus Geweben
    für Männer und Knaben, lange Hosen aus Geweben für Frauen, Mädchen und Kleinkinder,
    aus Wolle, Baumwolle, synthetischen oder künstlichen Spinnstoffen der Tarifnummern
    ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.01-62;
    64; 66; 72; 74; 76 - 61.02-66; 68; 72) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 19. juni 1978 om bemyndigelse af den franske
    Republik til fra fællesskabsbehandling at undtage shorts og andre korte benklæder
    til mænd og drenge, vævede, lange benklæder til kvinder, piger og småbørn,
    vævede, af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 61.01 og ex 61.02 B (NIMEXE-kode 61.01-02, 64, 66, 72, 74, 76 -
    61.02-66, 68, 72) i den fælles toldtarif, har oprindelse i Thailand og frit kan
    omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 19 giugno 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario calzoncini, shorts e pantaloni
    tessuti per uomo e per ragazzo, pantaloni tessuti per donna, per ragazza e per
    bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali della
    voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale comune (codice
    Nimexe: 61.01-62; 64; 66; 72; 74; 76 - 61.02-66; 68; 72), originari della Tailandia
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 juni 1978 waarbij de Franse Republiek
    wordt gemachtigd shorts en andere korte broeken, lange broeken geweven, voor heren
    en jongens, lange broeken, geweven van wol, van katoen of van synthetische of
    van kunstmatige textielvezels voor dames, meisjes en kinderen van de posten ex
    61.01 en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01-62,
    64, 66, 72, 74, 76 - 61.02-66, 68, 72), van oorsprong uit Thailand en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
