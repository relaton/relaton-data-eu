title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 592/82 of 15 March 1982 re-establishing
    the levying of customs duties on floor cloths, dish cloths, dusters and the like,
    other than knitted or crocheted, products of category 113 (code 1130), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 592/82 de la Commission, du 15 mars 1982, portant
    rétablissement de la perception des droits de douane applicables aux torchons,
    serpillières, lavettes et chamoisettes, autres qu' en bonneterie, de la catégorie
    113 (code 1130), originaires de Chine, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 592/82 der Kommission vom 15. März 1982 über die
    Wiedereinführung des Zollsatzes für Scheuertücher, Wischtücher, Spültücher
    und Staubtücher, andere als aus Gewirken, der Warenkategorie Nr. 113 (Kennziffer
    1130), mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3602/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 592/82 af 15. marts 1982 om genindførelse
    af opkrævning af toldafgifter for gulvklude, karklude, støveklude og pudseklude,
    ikke af trikotage, under kategori 113 (kode 1130), som har oprindelse i Kina og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 592/82 τής Επιτροπής τής
    15ης Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τελωνειακών δασμών γιά μάκτρα καθαρισμού,
    υφάσματα διά τόν καθαρισμόν δαπέδων, υφάσματα
    διά τόν καθαρισμόν πιατικών καί εκκονιστήρια
    τύπου δέρματος αιγάγρου, έτερα τών πλεκτών,
    τών προϊόντων τής κατατηγορίας 113 (κώδικας
    1130), καταγωγής Κίνας, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (EOK) αριθ. 3602/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 592/82 della Commissione, del 15 marzo 1982, che ripristina
    la riscossione dei dazi doganali applicabili ai torcioni, strofinacci, anche scamosciati,
    esclusi quelli a maglia, della categoria di prodotti n. 113 (codice 1130), originari
    della Cina, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3602/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 592/82 van de Commissie van 15 maart 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op dweilen,
    vaatdoeken, stofdoeken en poetsdoeken, andere dan die van brei- of haakwerk, van
    categorie van produkten 113 (codenummer 1130), van oorsprong uit China, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3602/81
    van de Raad
  type: main
