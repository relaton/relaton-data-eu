  content: Commission Regulation (EEC) No 3483/80 of 30 December 1980 amending Regulation
    (EEC) No 2311/80 laying down detailed rules implementing the system of aid for
    the use of concentrated grape must for the manufacture in the United Kingdom and
    Ireland of certain products and fixing the amounts of aid for the 1980/81 wine-growing
    year, as a result of Greek accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3483/80 de la Commission, du 30 décembre 1980, modifiant
    le règlement (CEE) n° 2311/80 portant modalités d' application du régime d'
    aide à l' utilisation de moûts de raisins concentrés en vue de la fabrication
    de certains produits, au Royaume-Uni et en Irlande, et fixant les montants de
    l' aide pour la campagne 1980/1981, à la suite de l' adhésion de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3483/80 der Kommission vom 30. Dezember 1980 zur Änderung
