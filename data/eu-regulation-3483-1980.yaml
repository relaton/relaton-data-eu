    für die Verwendung von konzentriertem Traubenmost zur Herstellung bestimmter
    Erzeugnisse im Vereinigten Königreich und in Irland sowie zur Festsetzung eines
    Beihilfebetrags für das Weinwirtschaftsjahr 1980/81 infolge des Beitritts Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3483/80 af 30. december 1980 om ændring
