  script: Latn
  content: Commission Regulation (EEC) No 3482/80 of 30 December 1980 amending Regulation
    (EEC) No 1045/77 laying down detailed rules for the application of measures to
    encourage the marketing of products processed from lemons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3482/80 de la Commission, du 30 décembre 1980, modifiant
    le règlement (CEE) n° 1045/77 établissant les modalités d' application des
    mesures visant à favoriser la commercialisation des produits transformés à
    base de citrons
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3482/80 der Kommission vom 30. Dezember 1980 zur Änderung
