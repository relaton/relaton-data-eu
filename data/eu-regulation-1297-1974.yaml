title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1297/74 of the Commission of 22 May 1974 reintroducing
    Common Customs Tariff duties on cotton yarn, not put up for retail sale, falling
    within subheading No 55.05 A, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3578/73 of 28 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1297/74 de la Commission, du 22 mai 1974, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fils de coton non conditionnés pour la vente au détail, de la sous- position
    tarifaire 55.05 à originaires de Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3578/73 du Conseil du 28 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1297/74 der Kommission vom 22. Mai 1974 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifstelle 55.05 A, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 3578/73 des Rates vom 28. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1297/74 af 22. maj 1974 om genindførelse
    af tolden ifølge den fælles toldtarif for garn af bomuld, ikke i detailsalgsoplægninger,
    henhørende under pos. 55.05 A, der har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3578/73 af
    28. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1297/74 della Commissione, del 22 maggio 1974, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    filati di cotone non preparati per la vendita al minuto, della sottovoce doganale
    n. 55.05 A, originari della Iugoslavia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3578/73 del Consiglio, del 28 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1297/74 van de Commissie van 22 mei 1974 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op garens van katoen, niet gereed voor de verkoop in het klein,
    van onderverdeling 55.05 A, van oorsprong uit Joegoslavië ten behoeve waarvan
    bij Verordening (EEG) nr. 3578/73 van de Raad van 28 december 1973 tariefpreferenties
    werden geopend
  type: main
