title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1972, portant octroi du concours
    du Fonds social européen, prévu à l'article 125 du Traité, au bénéfice du
    Royaume des Pays-Bas pour des dépenses relatives à des opérations de rééducation
    professionnelle et de réinstallation effectuées par le "Ministerie van sociale
    zaken" (dossiers FSE n° 71009, 71010, 71056, 71071, 71072, 71102, 71105)
  type: main
- language: de
  script: Latn
  content: '72/477/EWG: Entscheidung der Kommission vom 22. Dezember 1972 zur Gewährung
    eines Zuschusses nach Artikel 125 EWG aus dem Europäischen Sozialfonds an das
    Königreich der Niederlande zu Aufwendungen für vom "Ministerie van Sociale Zaken"
    durchgeführte Berufsumschulungs- und Umsiedlungsmaßnahmen (Antragsunterlagen
    ESF Nrn. 71.009, 71.010, 71.055, 71.056, 71.071, 71.072, 71.102, 71. 105)'
  type: main
- language: it
  script: Latn
  content: '72/477/CEE: Decisione della Commissione, del 22 dicembre 1972, recante
    la concessione di un contributo del Fondo sociale europeo, prevista dall''articolo
    125 del trattato, a favore del Regno dei Paesi Bassi per spese concernenti operazioni
    di riqualificazione professionale e di reinserimento, effettuate dal «Ministerie
    van Soziale Zaken» (Fascicoli FSE nn. 71.009, 71.010, 71.055, 71.056, 71.071,
    71.072, 71.102, 71.105)'
  type: main
- language: nl
  script: Latn
  content: '72/477/EEG: Beschikking van de Commissie van 22 december 1972 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel
    125 van het Verdrag, ten gunste van het Koninkrijk der Nederlanden voor door het
    Ministerie van Sociale Zaken gemaakte herscholings- en verplaatsingskosten (dossiers
    E.S.F. nrs. 71009, 71 010, 71 055, 71 056, 71 071, 71 072, 71 102, 71 105)'
  type: main
