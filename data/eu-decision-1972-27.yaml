title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 décembre 1971, portant dérogation à
    la recommandation n° 1/64 de la Haute Autorité relative à un relèvement de
    la protection frappant les produits sidérurgiques à la périphérie de la Communauté
    (quarante-septième dérogation)
  type: main
- language: de
  script: Latn
  content: '72/27/EGKS: Entscheidung der Kommission vom 23. Dezember 1971 betreffend
    Ausnahmen von der Empfehlung Nr. 1/64 der Hohen Behörde über eine Erhöhung
    des Außenschutzes gegenüber Einfuhren von Stahlerzeugnissen in die Gemeinschaft
    (Siebenundvierzigste Ausnahmeentscheidung)'
  type: main
- language: it
  script: Latn
  content: '72/27/CECA: Decisione della Commissione, del 23 dicembre 1971, che autorizza
    deroghe alla raccomandazione n. 1/64 dell''Alta Autorità relativa la rafforzamento
    della protezione che colpisce i prodotti siderurgici all''entrata nella Comunità
    (quarantasettesima deroga)'
  type: main
- language: nl
  script: Latn
  content: '72/27/EGKS: Beschikking van de Commissie van 23 december 1971 houdende
    afwijking van Aanbeveling nr. 1-64 van de Hoge Autoriteit betreffende een verhoging
    van de bescherming van ijzer- en staalprodukten aan de buitengrenzen van de Gemeenschap
    (zevenenveertigste uitzonderingsbeschikking)'
