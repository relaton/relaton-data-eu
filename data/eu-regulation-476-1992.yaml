  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 476/92 DER KOMMISSION vom 27. Februar 1992 zur Bestimmung
    der Mengen von im Zeitraum vom 1. März 1992 bis 30. Juni 1992 in den französischen
    überseeischen Departements erzeugtem Rohzucker, die die Raffinationsbeihilfe
    nach der Verordnung (EWG) Nr. 2225/86 des Rates erhalten können, und zur Änderung
    der Verordnung (EWG) Nr. 1806/91 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 476/92 af 27. februar 1992 om fastsættelse
