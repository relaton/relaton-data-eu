  content: Commission Regulation (EEC) No 476/92 of 27 February 1992 determining for
    the period 1 March 1992 to 30 June 1992 the quantities of raw sugar produced in
    the French overseas departments benefiting from the refining aid referred to in
    Council Regulation (EEC) No 2225/86 and amending Regulation (EEC) No 1806/91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 476/92 de la Commission du 27 février 1992 déterminant,
    pour la période du 1er mars au 30 juin 1992, les quantités de sucre brut produites
    dans les départements français d'outre-mer bénéficiant de l'aide au raffinage
    visée au règlement (CEE) n° 2225/86 du Conseil, et modifiant le règlement
    (CEE) n° 1806/91
  type: main
