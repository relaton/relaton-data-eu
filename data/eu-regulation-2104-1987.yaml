title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2104/87 of 16 July 1987 amending Regulation
    (EEC) No 56/87 establishing the list of vessels exceeding 8 metres length overall
    and permitted to use within certain coastal areas of the Community beam trawls
    whose aggregate length exceeds 12 metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2104/87 de la Commission du 16 juillet 1987 modifiant
    le règlement (CEE) n° 56/87 de la Commission établissant la liste des bateaux
    dont la longueur hors tout dépasse huit mètres, autorisés à pêcher dans certaines
    zones côtières de la Communauté à l' aide de chaluts à perche dont la longueur
    totale dépasse douze mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2104/87 der Kommission vom 16. Juli 1987 zur Änderung
    der Verordnung (EWG) Nr. 56/87 zur Festlegung der Liste der Schiffe mit einer
    Länge über alles von mehr als 8 m, die in bestimmten Küstengebieten der Gemeinschaft
    mit Baumkurren fischen dürfen, deren Gesamtbaumlänge mehr als 12 m beträgt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2104/87 af 16. juli 1987 om ændring
    af forordning (EØF) nr. 56/87 om listen over fartøjer med en længde overalt
    på over 8 m, der i visse af Fællesskabets kystområder har tilladelse til at
    anvende bomtrawl, hvis samlede længde overstiger 12 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2104/87 της Επιτροπής
    της 16ης Ιουλίου 1987 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 56/87 που καταρτίζει τον
    κατάλογο των σκαφών συνολικού μήκους άνω των
    οκτώ μέτρων τα οποία επιτρέπεται να αλιεύουν
    σε ορισμένες παράκτιες περιοχές της Κοινότητας
    χρησιμοποιώντας δοκότρατες των οποίων το συνολικό
    μήκος υπερβαίνει τα 12 μέτρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2104/87 della Commissione del 16 luglio 1987 recante
    modifica del regolamento (CEE) n. 56/87 che fissa l' elenco dei pescherecci di
    lungezza fuori tutto superiore a otto metri, autorizzati ad usare, in determinate
    zone costiere della Comunità, reti a strascico a pali, la cui lunghezza complessiva
    superi i 12 metri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2104/87 van de Commissie van 16 juli 1987 tot wijziging
    van Verordening (EEG) nr. 56/87 tot vaststelling van de lijst van vaartuigen met
    een lengte over alles van meer dan 8 meter die in bepaalde kustzones van de Gemeenschap
    boomkorren mogen gebruiken waarvan de totale boomlengte meer dan 12 meter bedraagt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2104/87 da Comissão de 16 de Julho de 1987 que
    altera o Regulamento (CEE) n.° 56/87 da Comissão que estabelece a lista dos
    navios com mais de oito metros de comprimento de fora a fora autorizados a utilizar
    em determinadas zonas costeiras da Comunidade redes de arrasto de vara em que
    o comprimento total das varas seja superior a doze metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2104/87 de la Comisión de 16 de julio de 1987 que
    modifica al Reglamento (CEE) n° 56/87 por el que se establece la lista de barcos
    cuya eslora total exceda los ocho metros y a los que se permite utilizar, dentro
    de determinadas zonas costeras de la Comunidad, artes de arrastre de vara cuya
    longitud total supere los doce metros
  type: main
