title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2857/76 of 23 November 1976 temporarily suspending
    the autonomous Common Customs Tariff duty for mechanically propelled aircraft
    of an unladen weight exceeding 15 000 kg falling within subheading ex 88.02 B
    II c)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2857/76 du Conseil, du 23 novembre 1976, portant suspension
    temporaire du droit autonome du tarif douanier commun pour les avions fonctionnant
    à l'aide d'une machine propulsive d'un poids à vide de plus de 15 000 kilogrammes,
    de la sous-position EX 88.02 B II c)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2857/76 des Rates vom 23. November 1976 über die
    zeitweilige Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für
    Flugzeuge für maschinellen Antrieb, mit einem Leergewicht von mehr als 15 000
    kg, aus Tarifstelle ex 88.02 B II c)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2857/76 af 23. november 1976 om midlertidig
    suspension af den autonome sats i den fælles toldtarif for flyvemaskiner med
    fremdrivningsmekanisme og med en egenvægt over 15 000 kg, henhørende under position
    ex 88.02 B II c)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2857/76 del Consiglio, del 23 novembre 1976, relativo
    alla sospensione temporanea del dazio autonomo della tariffa doganale comune per
