    15 000 kg, della sottovoce ex 88.02 B II c)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2857/76 van de Raad van 23 november 1976 houdende
    tijdelijke schorsing van het autonome recht van het gemeenschappelijk douanetarief
    voor vliegtuigen functionerende met een voortbewegingsmechanisme, met een leeggewicht
    van meer dan 15 000 kilogram, van onderverdeling ex 88.02 B II c)
