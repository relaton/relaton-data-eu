title:
- language: en
  script: Latn
  content: '80/1013/EEC: Commission Decision of 22 September 1980 authorizing the
    Kingdom of Denmark not to apply Community treatment to tents, falling within heading
    No ex 62.04 of the Common Customs Tariff (category 91), originating in South Korea
    and in free circulation in the other Member States (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1013/CEE: Décision de la Commission, du 22 septembre 1980, autorisant
    le Royaume de Danemark à exclure du traitement communautaire les tentes, de la
    position ex 62.04 du tarif douanier commun (catégorie 91), originaires de la
    Corée du Sud et mises en libre pratique dans les autres États membres (Le texte
    en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/1013/EWG: Entscheidung der Kommission vom 22. September 1980, mit der
    das Königreich Dänemark ermächtigt wird, aus Südkorea stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Zelte der Tarifnummer ex
    62.04 des Gemeinsamen Zolltarifs (Kategorie 91) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1013/EØF: Kommissionens beslutning af 22. september 1980 om bemyndigelse
    af kongeriget Danmark til fra fællesskabsbehandling at undtage telte, som henhører
    under pos. ex 62.04 i den fælles toldtarif (kategori 91) og frit kan omsættes
    i de øvrige medlemsstater (Kun den danske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1013/CEE: Decisione della Commissione, del 22 settembre 1980, che autorizza
    il Regno di Danimarca ad escludere dal trattamento comunitario le tende della
    voce ex 62.04 della tariffa doganale comune, categoria 91, originarie della Corea
    del Sud e messe in libera pratica negli altri Stati membri (Il testo in lingua
    danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1013/EEG: Beschikking van de Commissie van 22 september 1980 waarbij
    het Koninkrijk Denemarken wordt gemachtigd tenten, van post ex 62.04 van het gemeenschappelijk
    douanetarief (categorie 91), van oorsprong uit Zuid-Korea en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Deense taal is authentiek)'
