- language: en
  script: Latn
  content: Council Regulation (EEC) No 3521/85 of 12 December 1985 definitively collecting
    the provisional anti-dumping duty imposed on imports of roller chains for cycles,
    originating in the USSR, and extending the provisional anti-dumping duty imposed
    on imports of roller chains for cycles, originating in the People' s Republic
    of China
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3521/85 du Conseil du 12 décembre 1985 portant perception
