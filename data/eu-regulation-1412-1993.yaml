title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1412/93 of 8 June 1993 re-establishing the
    levying of customs duties on products falling within CN codes 6401 and 6402, originating
    in Malaysia and the Philippines, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1412/93 de la Commission du 8 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC 6401
    et 6402, originaires de Malaysia et des Philippines, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1412/93 DER KOMMISSION vom 8. Juni 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 6401 und 6402 mit Ursprung
    in Malaysia und auf den Philippinen, denen die in der Verordnung (EWG) Nr. 3831/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1412/93 af 8. juni 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 6401 og 6402 og med
    oprindelse i Malaysia og Filippinerne, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1412/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 8ης Ιουνίου 1993 περί αποκαταστάσεως της
