    NC 6401 e 6402 originari della Malaysia e delle Filippine, beneficiarie delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1412/93 VAN DE COMMISSIE van 8 juni 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van de GN-codes 6401 en 6402, van oorsprong uit Maleisië en de Filippijnen, waarvoor
    de in Verordening (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
