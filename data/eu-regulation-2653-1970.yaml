title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 2653/70 de la Commission, du 23 décembre 1970, fixant
    les taux des restitutions applicables, à compter du 1er janvier 1971, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2653/70 der Kommission vom 23. Dezember 1970 zur Festsetzung
    der ab 1. Januar 1971 geltenden Erstattungssätze bei der Ausfuhr bestimmter Getreide-
    und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages fallenden
    Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2653/70 della Commissione, del 23 dicembre 1970, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 gennaio 1971,
    a taluni prodotti dei settori dei cereali e del riso esportati sotto forma di
    merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2653/70 van de Commissie van 23 december 1970 houdende
    vaststelling van de restituties die met ingang van 1 januari 1971 worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goederen
  type: main
