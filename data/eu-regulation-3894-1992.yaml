title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3894/92 of 23 December 1992 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1993
    fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3894/92 de la Commission, du 23 décembre 1992, fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1993 intervenant dans le calcul de la compensation financière
    et de l' avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3894/92 der Kommission vom 23. Dezember 1992 zur Festsetzung
    des Pauschalwerts für das Fischwirtschaftsjahr 1993 für die aus dem Handel genommenen
    Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs und des entsprechenden
    Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3894/92 af 23. december 1992 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1993
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3894/92 της Επιτροπής
    της 23ης Δεκεμβρίου 1992 περί καθορισμού της κατ'
    αποκοπήν αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1993
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3894/92 della Commissione, del 23 dicembre 1992, che
    fissa, ai fini del calcolo della compensazione finanziaria e dell' anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1993
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3894/92 van de Commissie van 23 december 1992 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1993 voor de uit
    de markt genomen visserijprodukten voor de berekening van de financiële vergoeding
    en het hierop betrekking heddende voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3894/92 da Comissão, de 23 de Dezembro de 1992,
    que fixa, para efeitos do cálculo da compensação financeira e do adiantamento
    que lhe diz respeito, o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1993
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3894/92 de la Comisión, de 23 de diciembre de 1992,
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 1993 que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
  type: main
