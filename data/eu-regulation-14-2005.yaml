- language: en
  script: Latn
  content: Commission Regulation (EC) No 14/2005 of 5 January 2005 amending for the
    42nd time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 14/2005 de la Commission du 5 janvier 2005 modifiant
    pour la quarante-deuxième fois le règlement (CE) n° 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l'encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
