title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 541/2012 of 21 June 2012 terminating
    the interim review of the anti-dumping measures concerning imports of furfuraldehyde
    originating in the People’s Republic of China and repealing those measures
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 541/2012 du Conseil du 21 juin 2012
    clôturant le réexamen intermédiaire des mesures antidumping concernant les
    importations de furfural originaire de la République populaire de Chine et abrogeant
    ces mesures
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 541/2012 des Rates vom 21. Juni 2012
    zur Einstellung der Interimsüberprüfung der Antidumpingmaßnahmen gegenüber
    den Einfuhren von Furfuraldehyd mit Ursprung in der Volksrepublik China und zur
    Aufhebung dieser Maßnahmen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 541/2012 на Съвета
    от 21 юни 2012 година за прекратяване на междинното
    преразглеждане на антидъмпинговите мерки
    по отношение на вноса на фурфуралдехид с произход
    от Китайската народна република и за отмяна
    на посочените мерки
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 541/2012 ze dne 21. června 2012
    , kterým se ukončuje prozatímní přezkum antidumpingových opatření týkajících
    se dovozu furfurylaldehydu pocházejícího z Čínské lidové republiky a kterým
    se tato opatření zrušují
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 541/2012 af 21. juni 2012 om
    afslutning af interimsundersøgelsen af antidumpingforanstaltningerne vedrørende
    importen af furfuraldehyd med oprindelse i Folkerepublikken Kina og om ophævelse
    af disse foranstaltninger
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 541/2012
    του Συμβουλίου, της 21ης Ιουνίου 2012 , για την
    περάτωση της ενδιάμεσης επανεξέτασης των μέτρων
    αντιντάμπινγκ που εφαρμόζονται στις εισαγωγές
    φουρφουραλδεΰδης, καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας, και για την κατάργηση των εν λόγω
    μέτρων
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusmäärus (EL) nr 541/2012, 21. juuni 2012 , millega lõpetatakse
    Hiina Rahvavabariigist pärit furfuraali impordi suhtes kehtestatud dumpinguvastaste
    meetmete vahepealne läbivaatamine ja tunnistatakse need meetmed kehtetuks
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 541/2012, annettu 21 päivänä
    kesäkuuta 2012 , Kiinan kansantasavallasta peräisin olevan furfuraldehydin tuontiin
    sovellettavia polkumyynnin vastaisia toimenpiteitä koskevan välivaiheen tarkastelun
    päättämisestä ja kyseisten toimenpiteiden kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 541/2012/EU végrehajtási rendelete ( 2012. június 21. ) a
    Kínai Népköztársaságból származó furfuraldehid behozatalára vonatkozó
    dömpingellenes intézkedések időközi felülvizsgálatának megszüntetéséről
    és ezen intézkedések hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 541/2012 del Consiglio, del 21 giugno
    2012 , che chiude il riesame intermedio delle misure antidumping applicabili alle
    importazioni di aldeide furanica originaria della Repubblica popolare cinese e
    che abroga tali misure
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 541/2012 ( 2012. gada 21. jūnijs
    ), ar ko izbeidz Ķīnas Tautas Republikas izcelsmes furfuraldehīda importam
    noteikto antidempinga pasākumu starpposma pārskatīšanu un atceļ minētos
    pasākumus
  type: main
- language: lt
  script: Latn
  content: 2012 m. birželio 21 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 541/2012,
    kuriuo baigiama antidempingo priemonių, taikomų importuojamam Kinijos Liaudies
    Respublikos kilmės furfuraldehidui, tarpinė peržiūra ir tos priemonės panaikinamos
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kunsill (UE) Nru 541/2012 tal- 21
    ta’ Ġunju 2012 li jtemm ir-reviżjoni interim tal-miżuri antidumping għall-importazzjonijiet
    tal-furfuraldeid li joriġinaw fir-Repubblika Popolari taċ-Ċina u li jirrevoka
    dawk il-miżuri
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 541/2012 van de Raad van 21 juni 2012 tot
    beëindiging van het tussentijdse nieuwe onderzoek naar de antidumpingmaatregelen
    betreffende de invoer van furfuraldehyde van oorsprong uit de Volksrepubliek China
    en tot intrekking van die maatregelen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (EU) nr 541/2012 z dnia 21 czerwca 2012
    r. w sprawie zakończenia przeglądu okresowego środków antydumpingowych dotyczących
    przywozu furoaldehydu pochodzącego z Chińskiej Republiki Ludowej oraz uchylenia
    tych środków
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 541/2012 do Conselho, de 21 de junho
    de 2012 , que encerra o reexame intercalar das medidas anti-dumping aplicáveis
    às importações de furfural originário da República Popular da China e que
    revoga essas medidas
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 541/2012 al Consiliului din
    21 iunie 2012 de încheiere a reexaminării intermediare a măsurilor antidumping
    aplicate importurilor de furfuraldehidă originară din Republica Populară Chineză
    și de abrogare a măsurilor respective
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 541/2012 z 21. júna 2012 , ktorým
    sa ukončuje predbežné preskúmanie antidumpingových opatrení týkajúcich
    sa dovozu furfuraldehydu s pôvodom v Čínskej ľudovej republike a ktorým sa
    zrušujú uvedené opatrenia
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 541/2012 z dne 21. junija 2012 o zaključku
    vmesnega pregleda protidampinških ukrepov v zvezi z uvozom furfuraldehida s poreklom
    iz Ljudske republike Kitajske ter o razveljavitvi navedenih ukrepov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 541/2012 del Consejo, de 21 de junio
    de 2012 , por el que se da por concluida la reconsideración provisional de las
    medidas antidumping aplicables a las importaciones de furfuraldehído originario
    de la República Popular China y se derogan dichas medidas
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 541/2012 av den 21 juni 2012 om
    avslutande av interimsöversynen av de antidumpningsåtgärder som tillämpas
    på import av furfuraldehyd med ursprung i Folkrepubliken Kina och om upphävande
    av dessa åtgärder
