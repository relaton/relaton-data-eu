title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 965/85 of 11 April 1985 re-establishing
    the levying of customs duties on diodes, transistors and similar devices; parts,
    falling within subheadings 85.21 D and E and originating in the Philippines, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 965/85 de la Commission du 11 avril 1985 portant rétablissement
    de la perception des droits de douane applicables aux diodes, transistors et dispositifs
    similaires, et leurs parties et pièces détachées, des sous-positions 85.21
    D et E du tarif douanier commun, originaires des Philippines, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 965/85 der Kommission vom 11. April 1985 zur Wiedereinführung
    der Erhebung der Zölle für Dioden, Transistoren und ähnliche Halbleiter und
    Teile der Tarifstellen 85.21 D und E mit Ursprung in den Philippinen, denen die
    in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 965/85 af 11. april 1985 om genindførelse
    af opkrævning af told for dioder, transistorer og lignende halvlederkomponenter,
    dele henhørende under pos. 85.21 D, E og med oprindelse i Filippinerne, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 965/85 της Επιτροπής
    της 11ης Απριλίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τις διόδους, κρυσταλλολυχνίες
    και παρόμοιες διατάξεις, των διακρίσεων 85.21
    Δ και Ε του Κοινού Δασμολογίου, καταγωγής Φιλιππίνων,
    δικαιούχων των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 965/85 della Commissione dell' 11 aprile 1985 che
    ripristina la riscossione dei dazi doganali applicabili ai diodi, transistori
    e simili, parti e pezzi staccati, della sottovoce 85.21 D ed E delle tariffa doganale
    comune, originari delle Filippine beneficiarie delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 965/85 van de Commissie van 11 april 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dioden, transistors
    en dergelijke halfgeleiderelementen en delen en onderdelen, van postonderverdeling
    85.21 D en E, van oorsprong uit de Filippijnen, waarvoor de in Verordening (EEG)
    nr. 3562/84 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
