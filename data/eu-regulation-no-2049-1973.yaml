title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2049/73 of the Commission of 19 July 1973 laying down
    general rules concerning the components designed to ensure, within the cereals
    and rice sectors, the protection of the processing industry as regards trade within
    the Community for the 1973/74 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2049/73 de la Commission, du 19 juillet 1973, fixant,
    en ce qui concerne les échanges intracommunautaires pour la campagne de commercialisation
    1973/1974, les éléments destinés à assurer, dans le secteur des céréales
    et du riz, la protection de l'industrie de transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2049/73 der Kommission vom 19. Juli 1973 zur Festsetzung
    des Bestandteils zum Schutz der Verarbeitungsindustrie auf dem Getreide- und Reissektor
    im Hinblick auf den innergemeinschaftlichen Handel für das Wirtschaftsjahr 1973/1974
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2049/73 af 19. juli 1973 om fastsættelse
    for høståret 1973/1974 - for handel inden for Fællesskabet - af de elementer,
    der for korn og ris har til formål at sikre beskyttelsen af forarbejdningsindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2049/73 della Commissione, del 19 luglio 1973, che
    fissa, per quanto riguarda gli scambi intracomunitari nella campagna di commercializzazione
    1973/1974, gli elementi destinati ad assicurare la protezione dell'industria di
    trasformazione nel settore dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2049/73 van de Commissie van 19 juli 1973 tot vaststelling
    van de elementen die dienen om in het verkoopseizoen 1973/1974 in het intracommunautaire
    handelsverkeer in de sector granen en rijst de bescherming van de verwerkende
    industrie te verzekeren
  type: main
