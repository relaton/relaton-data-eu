  script: Latn
  content: A Bizottság 2236/2004/EK rendelete (2004. december 29.) az 1606/2002/EK
    európai parlamenti és tanácsi rendelettel összhangban egyes nemzetközi számviteli
    standardok elfogadásáról szóló 1725/2003/EK rendeletnek az 1., 3., és 5.
