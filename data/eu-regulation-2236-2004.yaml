title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2236/2004 of 29 December 2004 amending Regulation
    (EC) No 1725/2003 adopting certain international accounting standards in accordance
    with Regulation (EC) No 1606/2002 of the European Parliament and of the Council
    as regards International Financial Reporting Standards (IFRSs) Nos 1, 3 to 5,
    International Accounting Standards (IASs) Nos 1, 10, 12, 14, 16 to 19, 22, 27,
    28, 31 to 41 and the interpretations by the Standard Interpretation Committee
    (SIC) Nos 9, 22, 28 and 32
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2236/2004 de la Commission du 29 décembre 2004 modifiant
    le règlement (CE) n° 1725/2003 portant adoption de certaines normes comptables
    internationales conformément au règlement (CE) n° 1606/2002 du Parlement européen
    et du Conseil, pour ce qui concerne les normes internationales d’information
    financière IFRS 1, 3, 4 et 5, les normes comptables internationales IAS 1, 10,
    12, 14, 16 à 19, 22, 27, 28 et 31 à 41, et les interprétations du comité permanent
    d’interprétation SIC 9, 22, 28 et 32
  type: main
- language: de
  script: Latn
