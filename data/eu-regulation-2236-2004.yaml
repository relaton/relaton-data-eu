    Financial Reporting Standards (IFRS) 1 e da 3 a 5, i principi contabili internazionali
    (IAS) 1, 10, 12, 14, da 16 a 19, 22, 27, 28 e da 31 a 41 e le interpretazioni
    dello Standard Interpretation Committee (SIC) 9, 22, 28 e 32
  type: main
