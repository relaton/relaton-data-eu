title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2096/79 of 27 September 1979 enabling short-term
    private storage contacts to be concluded for table wines closely related economically
    to the R I type of table wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2096/79 de la Commission, du 27 septembre 1979, étendant
    la possibilité de conclure des contrats de stockage privé à court terme aux
    vins de table se trouvant dans une relation économique étroite avec les vins
    de table du type R I
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2096/79 der Kommission vom 27. September 1979 zur
    Ausdehnung der Möglichkeit des Abschlusses von Verträgen für die kurzfristige
    private Lagerhaltung auf Tafelweine, die in engem wirtschaftlichem Zusammenhang
    mit den Tafelweinen der Art R I stehen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2096/79 af 27. september 1979 om udvidelse
    af muligheden for at indgå kontrakter om privat oplagring på kort sigt af bordvine,
    der står i nær økonomisk forbindelse med bordvine af type R I
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2096/79 τής Επιτροπής
    τής 27ης Σεπτεμβρίου 1979 περί επεκτάσεως τής
    πιθανότητος γιά τήν σύναψη συμφωνητκών ιδιωτικής
    βραχυπροθέσμου αποθεματοποιήσεως επιτραπεζίων
    οίνων πού βρίσκονται σέ στενή οικονομική θέση
    μέ τούς επιτραπεζίους οίνους τύπου RI
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2096/79 della Commissione, del 27 settembre 1979,
    che estende la possibilità di concludere contratti di magazzinaggio privato a
    breve termine per i vini da tavola che si trovano in stretta relazione economica
    coi vini da tavola del tipo R I
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2096/79 van de Commissie van 27 september 1979 tot
    uitbreiding van de mogelijkheid om kortlopende contracten te sluiten voor de particuliere
    opslag van tafelwijn die in nauw economisch verband staat met tafelwijn van soort
    R I
  type: main
