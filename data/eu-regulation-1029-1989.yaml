title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1029/89 of 20 April 1989 laying down to
    what extent applications for issue of export licences submitted during April 1989
    for beef and veal products which may benefit from special import treatment in
    a third country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1029/89 de la Commission, du 20 avril 1989, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'avril 1989 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1029/89 der Kommission vom 20. April 1989 über das
    Ausmaß, in dem den im April 1989 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1029/89 af 20. april 1989 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i april
    1989 for oksekødprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1029/89 της Επιτροπής
    της 20ής Απριλίου 1989 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Απρίλιο 1989 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1029/89 della Commissione, del 20 aprile 1989, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di aprile 1989 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1029/89 van de Commissie van 20 april 1989 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in april 1989 ingediende aanvragen
    om uitvoercertificaten voor produkten van de sector rundvlees waarvoor een bijzondere
    behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1029/89 da Comissão, de 20 de Abril de 1989, que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Abril de 1989 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1029/89 de la Comisión, de 20 de abril de 1989, por
    el que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentados en el mes de abril de 1989, para los productos del
    sector de la carne de bovino que se beneficien de un trato especial para su importación
    en un país tercero
  type: main
