  content: '80/1015/EEC: Commission Decision of 6 October 1980 authorizing the Kingdom
    of Denmark not to apply Community treatment to men''s and boys''shirts, woven,
    originating in South Korea (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1015/CEE: Décision de la Commission, du 6 octobre 1980, autorisant
