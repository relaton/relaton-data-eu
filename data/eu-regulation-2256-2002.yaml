  content: Council Regulation (EC) No 2256/2002 of 16 December 2002 amending, for
    the second time, Regulation (EC) No 2555/2001 fixing for 2002 the fishing opportunities
    and associated conditions for certain fish stocks and groups of fish stocks, applicable
    in Community waters and, for Community vessels, in waters where limitations in
    catch are required
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2256/2002 du Conseil du 16 décembre 2002 modifiant
