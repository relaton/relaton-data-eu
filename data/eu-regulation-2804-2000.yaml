    του Συμβουλίου, της 18ης Δεκεμβρίου 2000, για την
    αναπροσαρμογή από την 1η Ιουλίου 2000 των αποδοχών
    και των συντάξεων των υπαλλήλων και του λοιπού
    προσωπικού των Ευρωπαϊκών Κοινοτήτων καθώς
    και των διορθωτικών συντελεστών που εφαρμόζονται
    σ' αυτές τις αποδοχές και συντάξεις
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY, EHTY, Euratom) N:o 2804/2000, annettu 18 päivänä
    joulukuuta 2000, Euroopan yhteisöjen virkamiesten ja muun henkilöstön palkkojen
    ja eläkkeiden sekä näihin palkkoihin ja eläkkeisiin liittyvien korjauskertoimien
    mukauttamisesta 1 päivästä heinäkuuta 2000
  type: main
- language: it
  script: Latn
  content: Regolamento (CE, CECA, Euratom) n. 2804/2000 del Consiglio, del 18 dicembre
    2000, che adegua a decorrere dal 1o luglio 2000 le retribuzioni e le pensioni
    dei funzionari e altri agenti delle Comunità europee nonché i coefficienti correttori
    applicati a dette retribuzioni e pensioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG, EGKS, Euratom) nr. 2804/2000 van de Raad van 18 december
    2000 houdende aanpassing met ingang van 1 juli 2000 van de bezoldigingen en de
    pensioenen van de ambtenaren en de andere personeelsleden van de Europese Gemeenschappen,
    alsmede van de aanpassingscoëfficiënt welke van toepassing zijn op deze bezoldigingen
    en pensioenen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE, CECA, Euratom) n.o 2804/2000 do Conselho, de 18 de Dezembro
    de 2000, que adapta, com efeitos a 1 de Julho de 2000, as remunerações e as
    pensões dos funcionários e outros agentes das Comunidades Europeias, bem como
    os coeficientes de correcção aplicáveis a essas remunerações e pensões
  type: main
- language: es
  script: Latn
  content: Reglamento (CE, CECA, Euratom) nº 2804/2000 del Consejo, de 18 de diciembre
    de 2000, por el que se adaptan a partir del 1 de julio de 2000 las retribuciones
    y pensiones de los funcionarios y otros agentes de las Comunidades Europeas así
    como los coeficientes correctores que afectan a dichas retribuciones y pensiones
  type: main
- language: sv
  script: Latn
