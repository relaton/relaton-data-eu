  content: Council Regulation (EC, ECSC, Euratom) No 2804/2000 of 18 December 2000
    adjusting with effect from 1 July 2000 the remuneration and pensions of officials
    and other servants of the European Communities and the weightings applied thereto
  type: main
- language: fr
  script: Latn
  content: Règlement (CE, CECA, Euratom) nº 2804/2000 du Conseil du 18 décembre
    2000 adaptant à compter du 1er juillet 2000 les rémunérations et les pensions
    des fonctionnaires et autres agents des Communautés européennes ainsi que les
    coefficients correcteurs dont sont affectées ces rémunérations et pensions
  type: main
- language: de
  script: Latn
  content: Verordnung (EG, EGKS, Euratom) Nr. 2804/2000 des Rates vom 18. Dezember
    2000 zur Angleichung der Dienst- und Versorgungsbezüge der Beamten und sonstigen
    Bediensteten der Europäischen Gemeinschaften sowie der Berichtigungskoeffizienten,
    die auf diese Dienst- und Versorgungsbezüge anwendbar sind - mit Wirkung vom
    1. Juli 2000
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF, EKSF, Euratom) nr. 2804/2000 af 18. december 2000
    om tilpasning med virkning fra 1. juli 2000 af vederlag og pensioner til tjenestemænd
    og øvrige ansatte i De Europæiske Fællesskaber samt af justeringskoefficienterne
    for disse vederlag og pensioner
  type: main
- language: el
  script: Grek
