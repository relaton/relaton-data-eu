    du règlement (CEE) n° 804/68 du Conseil en ce qui concerne les certificats d'exportation
    et des restitutions à l'exportation dans le secteur du lait et des produits laitiers
    et dérogeant au règlement (CE) n° 800/1999 portant modalités communes d'application
    du régime des restitutions à l'exportation pour les produits agricoles
  type: main
