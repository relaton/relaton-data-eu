    δασμών γιά τά είδη ταξιδίου τής δασμολογικής
    διακρίσεως 42. 02 Β, καταγωγής Ινδίας, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (ΕΟΚ) αριθ.
    3322/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2160/81 della Commissione, del 28 luglio 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti da viaggio,
    della sottovoce 42.02 B della tariffa doganale comune, originari dell' India beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2160/81 van de Commissie van 28 juli 1981 houdende
