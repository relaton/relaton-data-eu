title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2160/81 of 28 July 1981 re-establishing
    the levying of customs duties on travel goods, falling within subheading 42.02
    B and originating in India, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2160/81 de la Commission, du 28 juillet 1981, portant
    rétablissement de la perception des droits de douane applicables aux articles
    de voyage, de la sous-position 42.02 B du tarif douanier commun, originaires de
    l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2160/81 der Kommission vom 28. Juli 1981 zur Wiedereinführung
    der Erhebung der Zölle für Reiseartikel der Tarifstelle 42.02 B, mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2160/81 af 28. juli 1981 om genindførelse
    af opkrævning af told for rejseartikler, henhørende under pos. 42.02 B og med
    oprindelse i Indien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2160/81 τής Επιτροπής
