title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 novembre 1966, portant prorogation de
    la décision du 14 avril 1965, autorisant la République italienne à exclure
    du traitement communautaire les piles électriques, de la position 85.03 du Tarif
    douanier commun, originaires du Japon et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '66/697/EWG: Entscheidung der Kommission vom 4. November 1966 zur Verlängerung
    der Entscheidung vom 14. April 1965, mit der die Italienische Republik ermächtigt
    wurde, aus Japan stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Primärelemente und Primärbatterien der Tarifnummer 85.03 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/697/CEE: Decisione della Commissione, del 4 novembre 1966, relativa
    alla proroga della decisione 14 aprile 1965 che autorizza la Repubblica italiana
    ad escludere dal trattamento comunitario le pile elettriche, della voce 85.03
    della T.D.C., originarie del Giappone e messe in libera pratica negli altri Stati
    membri'
  type: main
- language: nl
  script: Latn
  content: '66/697/EEG: Beschikking van de Commissie van 4 november 1966 houdende
    verlenging van de beschikking van 14 april 1965 waarbij de Italiaanse Republiek
    is gemachtigd elektrische elementen en elektrische batterijen, van post 85.03
    van het gemeenschappelijk douanetarief, die van oorsprong zijn uit Japan en in
    de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
