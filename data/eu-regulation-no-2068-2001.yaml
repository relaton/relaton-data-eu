title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2068/2001 of 22 October 2001 amending Regulation
    (EC) No 1801/2001 and increasing to 450000 tonnes the amount of barley held by
    the Spanish intervention agency for which a standing invitation to tender for
    resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2068/2001 de la Commission du 22 octobre 2001 modifiant
    le règlement (CE) n° 1801/2001 et portant à 450000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur d'orge par l'organisme d'intervention
    espagnol
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2068/2001 der Kommission vom 22. Oktober 2001 zur Änderung
    der Verordnung (EG) Nr. 1801/2001 und zur Erhöhung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt von Gerste aus Beständen der spanischen
    Interventionsstelle auf 450000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2068/2001 af 22. oktober 2001 om ændring
    af forordning (EF) nr. 1801/2001 og om forhøjelse til 450000 tons af den løbende
    licitation med henblik på videresalg på det indre marked af byg, som det spanske
    interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2068/2001 της Επιτροπής,
    της 22ας Οκτωβρίου 2001, που τροποποιεί τον κανονισμό
    (ΕΚ) αριθ. 1801/2001 και ορίζει σε 450000 τόνους τη διαρκή
    δημοπρασία για τη μεταπώληση στην εσωτερική
    αγορά κριθής που έχει στη διάθεσή του ο ισπανικός
    οργανισμός παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2068/2001, annettu 22 päivänä lokakuuta 2001,
    asetuksen (EY) N:o 1801/2001 muuttamisesta ja pysyvän tarjouskilpailun nostamisesta
    450000 tonniin Espanjan interventioelimen hallussaan pitämän ohramäärän uudelleen
    myymiseksi sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2068/2001 della Commissione, del 22 ottobre 2001, che
    modifica il regolamento (CE) n. 1801/2001 e che porta a 450000 t il quantitativo
    globale oggetto della gara permanente per la rivendita sul mercato interno di
    orzo detenuto dall'organismo d'intervento spagnolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2068/2001 van de Commissie van 22 oktober 2001 tot
    wĳziging van Verordening (EG) nr. 1801/2001 teneinde de hoeveelheid waarop de
    permanente openbare inschrĳving voor de verkoop op de interne markt van gerst
    uit de voorraden van het Spaanse interventiebureau betrekking heeft, tot 450000
    ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2068/2001 da Comissão, de 22 de Outubro de 2001,
    que altera o Regulamento (CE) n.° 1801/2001 e que eleva para 450000 toneladas
    o concurso permanente para a revenda no mercado interno de cevada detido pelo
    organismo de intervenção espanhol
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2068/2001 de la Comisión, de 22 de octubre de 2001,
    por el que se modifica el Reglamento (CE) n° 1801/2001 y se eleva a 450000 toneladas
    la licitación permanente para la reventa en el mercado interior de cebada en
    poder del organismo de intervención español
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2068/2001 av den 22 oktober 2001 om ändring
    av förordning (EG) nr 1801/2001 och om höjning till 450000 ton av den stående
    anbudsinfordran för försäljning på den inre marknaden av korn som innehas
    av det spanska interventionsorganet
  type: main
