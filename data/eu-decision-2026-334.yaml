    növényi készítményeket és ezek kombinációit tartalmazó jegyzék megállapításáról
    szóló 2008/911/EK határozatnak a Foeniculum vulgare tekintetében történő
    módosításáról (az értesítés a C(2026) 808. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/334 della Commissione, del 13 febbraio
    2026, recante modifica della decisione 2008/911/CE che fissa un elenco di sostanze
    vegetali, preparati vegetali e loro combinazioni destinati a essere utilizzati
    in medicinali tradizionali di origine vegetale per quanto riguarda Foeniculum
    vulgare [notificata con il numero C(2026)808]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/334 (2026. gada 13. februāris),
