    derivadas de plantas, preparações e associações das mesmas, para a sua utilização
    em medicamentos tradicionais à base de plantas no que diz respeito a Foeniculum
    vulgare [notificada com o número C(2026) 808]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2026/334 a Comisiei din 13 februarie
    2026 de modificare a Deciziei 2008/911/CE de stabilire a unei liste a substanțelor
    și preparatelor vegetale și a combinațiilor acestora în vederea folosirii
    în medicamentele tradiționale din plante în ceea ce privește Foeniculum vulgare
    [notificată cu numărul C(2026) 808]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2026/334 z 13. februára 2026, ktorým
