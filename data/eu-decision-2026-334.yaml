  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2026/334 z dnia 13 lutego 2026 r. zmieniająca
    decyzję 2008/911/WE ustanawiającą wykaz substancji ziołowych, preparatów
    i ich połączeń do użytku w tradycyjnych ziołowych produktach leczniczych
    w odniesieniu do Foeniculum vulgare (notyfikowana jako dokument nr C(2026) 808)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2026/334 da Comissão, de 13 de fevereiro de
