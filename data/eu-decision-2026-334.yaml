title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/334 of 13 February 2026 amending
    Decision 2008/911/EC establishing a list of herbal substances, preparations and
    combinations thereof for use in traditional herbal medicinal products with regards
    to Foeniculum vulgare (notified under document C(2026) 808)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/334 de la Commission du 13 février
    2026 modifiant la décision 2008/911/CE établissant une liste des substances
    végétales, des préparations à base de plantes et associations de celles-ci
    en vue de leur utilisation dans des médicaments traditionnels à base de plantes
    en ce qui concerne Foeniculum vulgare [notifiée sous le numéro C(2026) 808]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/334 der Kommission vom 13. Februar 2026
