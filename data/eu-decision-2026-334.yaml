    Stoffe, pflanzlicher Zubereitungen und Kombinationen davon zur Verwendung in traditionellen
    pflanzlichen Arzneimitteln hinsichtlich Foeniculum vulgare (Bekannt gegeben unter
    Aktenzeichen C(2026) 808)
  type: main
- language: bg
