title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 2422/71 de la Commission, du 10 novembre 1971, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à certains produits textiles des positions tarifaires 54.03 et ex 59.04 et de
    la sous-position tarifaire 56.05 A, originaires des pays en voie de développement,
    bénéficiaires de préférences tarifaires prévues par le règlement (CEE) n
    1313/71 du Conseil du 21 juin 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2422/71 der Kommission vom 10. November 1971 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für bestimmte
    Textilerzeugnisse der Tarifnummern 54.03 und ex 59.04 sowie der Tarifstelle 56.05
    A mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr.
    1313/71 des Rates vom 21. Juni 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2422/71 della Commissione, del 10 novembre 1971, relativo
    al ripristino della riscossione dei dazi della tariffa doganale comune applicabili
    a taluni prodotti tessili delle voci doganali nn. 54.03 e ex 59.04 e della sottovoce
    doganale n. 56.05 A, originari dei paesi in via di sviluppo, beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 1313/71 del Consiglio
    del 21 giugno 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2422/71 van de Commissie van 10 november 1971 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op bepaalde textielprodukten van tariefposten 54.03 en ex 59.04
    en van onderverdeling 56.05 A, van oorsprong uit de ontwikkelingslanden ten behoeve
    waarvan bij Verordening (EEG) nr. 1313/71 van de Raad van 21 juni 1971 algemene
    tariefpreferenties werden geopend
  type: main
