  content: Règlement n° 25/63/CEE du Conseil du 21 mars 1963, relatif aux prélèvements
    applicables envers les pays tiers pour les importations de porc abattu et de porc
    vivant effectuées du 1er avril au 30 juin 1963
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 25/63/EWG des Rats vom 21. März 1963 über die gegenüber
    dritten Ländern geltenden Abschöpfungsbeträge für geschlachtete Schweine und
    für lebende Schweine für die vom 1. April bis zum 30. Juni 1963 getätigten
    Einfuhren
  type: main
- language: it
  script: Latn
  content: Regolamento n. 25/63/CEE del Consiglio del 21 marzo 1963 relativo ai prelievi
    nei confronti dei paesi terzi applicabili alle importazioni di suini macellati
    e di suini vivi effettuate dal 1 aprile al 30 giugno 1963
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 25/63/EEG van de Raad van 21 maart 1963 inzake de heffingen
    die ten opzichte van de derde landen van toepassing zijn voor de invoer van geslachte
    varkens en van levende varkens in het tijdvak van 1 april tot en met 30 juni 1963
