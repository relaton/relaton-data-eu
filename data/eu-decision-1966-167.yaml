title:
- language: fr
  script: Latn
  content: Décision 66/167/CEE de la Commission, du 1er mars 1966, relative au recours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire les appareils d'enregistrement et de reproduction
    du son et les appareils mixtes, originaires du Japon et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/167/EWG: Entscheidung der Kommission vom 1. März 1966 über den Antrag
    der Republik Frankreich gemäß Artikel 115 Absatz (1) des Vertrages, Tonaufnahme-
    und Tonwiedergabegeräte und kombinierte Geräte mit Ursprung in Japan, die sich
    in den übrigen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/167/CEE: Decisione della Commissione, del 1 marzo 1966, relativa al
    ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    allo scopo di escludere dal trattamento comunitario gli apparecchi di registrazione
    e riproduzione del suono e gli apparecchi misti, originari del Giappone e immessi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/167/EEG: Beschikking van de Commissie van 1 maart 1966 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag toestellen voor het opnemen of weergeven van geluid en gecombineerde
    opname- en weergavetoestellen, die van oorsprong zijn uit Japan en in de andere
    Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
