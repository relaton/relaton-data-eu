    kas ietekmē Eiropas Savienības drošību, un ar ko atceļ Vienoto rīcību 2004/552/KĀDP
  type: main
- language: lt
  script: Latn
  content: 2014 m. liepos 22 d. Tarybos sprendimas 2014/496/BUSP dėl Europos globalios
    navigacijos palydovinės sistemos diegimo, veikimo ir naudojimo aspektų, turinčių
    įtakos Europos Sąjungos saugumui, kuriuo panaikinami Bendrieji veiksmai 2004/552/BUSP
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2014/496/PESK tat- 22 ta' Lulju 2014 dwar aspetti
    tal-iskjerament, l-operazzjoni u l-użu tas-Sistema Ewropea ta' Navigazzjoni Globali
    bis-Satellita li jaffettwaw is-sigurtà tal-Unjoni Ewropea u li tħassar l-Azzjoni
    Konġunta 2004/552/PESK
  type: main
- language: nl
  script: Latn
  content: Besluit 2014/496/GBVB van de Raad van 22 juli 2014 over aspecten van de
    stationering, de exploitatie en het gebruik van het Europese wereldwijde satellietnavigatiesysteem,
    die betrekking hebben op de veiligheid van de Europese Unie, en tot intrekking
    van Gemeenschappelijk Optreden 2004/552/GBVB
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2014/496/WPZiB z dnia 22 lipca 2014 r. w sprawie aspektów
    wdrażania, działania i użytkowania europejskiego globalnego systemu nawigacji
    satelitarnej mających wpływ na bezpieczeństwo Unii Europejskiej i uchylająca
    wspólne działanie 2004/552/WPZiB
  type: main
- language: pt
  script: Latn
  content: Decisão 2014/496/PESC do Conselho, de 22 de julho de 2014 , sobre os aspetos
    da exploração do sistema europeu de radionavegação por satélite que afetam
    a segurança da União Europeia e que revoga a Acão Comum 2004/552/PESC
  type: main
- language: ro
  script: Latn
  content: Decizia 2014/496/PESC a Consiliului din 22 iulie 2014 privind aspecte ale
    desfășurării, funcționării și utilizării Sistemului Global de Navigație
    prin Satelit European care afectează securitatea Uniunii Europene și de abrogare
    a Acțiunii comune 2004/552/PESC
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2014/496/SZBP z 22. júla 2014 o aspektoch rozmiestňovania,
    prevádzky a používania Európskeho globálneho navigačného satelitného systému,
    ktoré majú vplyv na bezpečnosť Európskej únie, a o zrušení jednotnej akcie
    2004/552/SZBP
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2014/496/SZVP z dne 22. julija 2014 o vidikih namestitve, delovanja
    in uporabe evropskega globalnega navigacijskega satelitskega sistema, ki vplivajo
    na varnost Evropske unije in razveljavitvi Skupnega ukrepa 2004/552/SZVP
  type: main
- language: es
  script: Latn
  content: Decisión 2014/496/PESC del Consejo, de 22 de julio de 2014 , relativa
    a los aspectos del despliegue y utilización del sistema europeo de radionavegación
    por satélite que afecten a la seguridad de la Unión Europea y por la que se
    deroga la Acción Común 2004/552/PESC
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2014/496/Gusp av den 22 juli 2014 om de aspekter av utbyggnaden,
    driften och användningen av det europeiska globala systemet för satellitnavigering
    som påverkar säkerheten i Europeiska unionen och om upphävande av gemensam
    åtgärd 2004/552/Gusp
