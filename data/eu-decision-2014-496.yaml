title:
- language: en
  script: Latn
  content: Council Decision 2014/496/CFSP of 22 July 2014 on aspects of the deployment,
    operation and use of the European Global Navigation Satellite System affecting
    the security of the European Union and repealing Joint Action 2004/552/CFSP
  type: main
- language: fr
  script: Latn
  content: Décision 2014/496/PESC du Conseil du 22 juillet 2014 sur les aspects du
    déploiement, de l'exploitation et de l'utilisation du système mondial de navigation
    par satellite européen portant atteinte à la sécurité de l'Union européenne
    et abrogeant l'action commune 2004/552/PESC
  type: main
- language: de
  script: Latn
  content: Beschluss 2014/496/GASP des Rates vom 22. Juli 2014 betreffend die Gesichtspunkte
    der Einführung, des Betriebs und der Nutzung des europäischen Globalen Satellitennavigationssystems,
    die die Sicherheit der Europäischen Union berühren, und zur Aufhebung der Gemeinsamen
    Aktion 2004/552/GASP
  type: main
- language: bg
  script: Cyrl
  content: Решение 2014/496/ОВППС на Съвета от 22 юли 2014
    година относно някои аспекти на разгръщането,
    експлоатацията и използването на европейската
    глобална навигационна спътникова система,
    свързани със сигурността на Европейския съюз,
    и за отмяна на Съвместно действие 2004/552/ОВППС
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2014/496/SZBP ze dne 22. července 2014 o aspektech zavádění,
    provozu a využívání evropského globálního družicového navigačního systému
    majících dopad na bezpečnost Evropské unie a o zrušení společné akce 2004/552/SZBP
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2014/496/FUSP af 22. juli 2014 om de aspekter ved indførelsen,
    driften og anvendelsen af det europæiske globale satellitnavigationssystem, der
    berører Den Europæiske Unions sikkerhed, og om ophævelse af fælles aktion
    2004/552/FUSP
  type: main
- language: el
  script: Grek
  content: Απόφαση 2014/496/ΚΕΠΠΑ του Συμβουλίου, της
    22ας Ιουλίου 2014 , σχετικά με ορισμένες πτυχές
    της εγκατάστασης, λειτουργίας και χρήσης του
    ευρωπαϊκού παγκόσμιου δορυφορικού συστήματος
    πλοήγησης που επηρεάζουν την ασφάλεια της
    Ευρωπαϊκής Ένωσης και την κατάργηση της κοινής
    δράσης 2004/552/ΚΕΠΠΑ
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2014/496/ÜVJP, 22. juuli 2014 , Euroopa ülemaailmse satelliitnavigatsioonisüsteemi
    kasutuselevõtu, toimimise ja kasutamise aspektide kohta, mis mõjutavad Euroopa
    Liidu julgeolekut, ning millega tunnistatakse kehtetuks ühismeede 2004/552/ÜVJP
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2014/496/YUTP annettu 22 päivänä heinäkuuta 2014
    , Euroopan unionin turvallisuuteen vaikuttavista eurooppalaisen maailmanlaajuisen
    satelliittinavigointijärjestelmän käyttöönoton, toiminnan ja käytön näkökohdista
    sekä yhteisen toiminnan 2004/552/YUTP kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća 2014/496/ZVSP od 22. srpnja 2014. o aspektima uvođenja,
    djelovanja i uporabe europskog globalnog navigacijskog satelitskog sustava koji
    utječu na sigurnost Europske unije i stavljanju izvan snage Zajedničke akcije
    2004/552/ZVSP
  type: main
- language: hu
  script: Latn
  content: A Tanács 2014/496/KKBP határozata ( 2014. július 22. ) az európai globális
    navigációs műholdrendszer kiépítésének, üzemeltetésének és használatának
    egyes, az Európai Unió biztonságát befolyásoló vonatkozásairól és a 2004/552/KKBP
    együttes fellépés hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione 2014/496/PESC del Consiglio, del 22 luglio 2014 , sugli aspetti
    del dispiegamento, del funzionamento e dell'utilizzo del sistema globale di navigazione
    via satellite europeo che hanno incidenza sulla sicurezza dell'Unione europea
    e che abroga l'azione comune 2004/552/PESC
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2014/496/KĀDP ( 2014. gada 22. jūlijs ) par Eiropas Globālās
