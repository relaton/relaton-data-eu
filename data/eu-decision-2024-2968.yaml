    pelo Acordo entre a Comunidade Europeia, por um lado, e o Governo da Dinamarca
    e o Governo Regional das Ilhas Faroé, por outro, no que diz respeito a uma decisão
    que estabelece os requisitos gerais para as provas de origem emitidas por via
    eletrónica ao abrigo do artigo 17.°, n.° 4, do apêndice A do Protocolo n.°
    3 do referido Acordo
  type: main
