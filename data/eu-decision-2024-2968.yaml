    v imenu Evropske unije zastopa v Skupnem odboru, ustanovljenem s Sporazumom med
    Evropsko skupnostjo na eni strani ter vlado Danske in lokalno vlado Ferskih otokov
    na drugi strani, v zvezi s sklepom o določitvi splošnih zahtev za elektronsko
    izdana dokazila o poreklu iz člena 17(4) Dodatka A k Protokolu 3 k navedenemu
