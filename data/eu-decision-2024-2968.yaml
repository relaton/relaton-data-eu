    medzi Európskym spoločenstvom na jednej strane a vládou Dánska a miestnou
    vládou Faerských ostrovov na strane druhej, pokiaľ ide o rozhodnutie, ktorým
    sa stanovujú všeobecné požiadavky na dôkazy o pôvode vydávané elektronicky
    podľa článku 17 ods. 4 dodatku A k protokolu 3 k uvedenej dohode
  type: main
