    care urmează să fie adoptată în numele Uniunii Europene, în cadrul comitetului
    mixt înființat prin Acordul dintre Comunitatea Europeană, pe de o parte, și
    Guvernul Danemarcei și guvernul local al Insulelor Feroe, pe de altă parte,
    cu privire la o decizie de stabilire a cerințelor generale privind dovezile de
    origine emise pe cale electronică în temeiul articolului 17 alineatul (4) din
    apendicele A la Protocolul 3 la respectivul acord
  type: main
