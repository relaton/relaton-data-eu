  script: Latn
  content: Decisión (UE) 2024/2968 del Consejo, de 21 de noviembre de 2024, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Comité
    Mixto creado por el Acuerdo entre la Comunidad Europea, por una parte, y el Gobierno
    de Dinamarca y el Gobierno local de las Islas Feroe, por otra, por lo que respecta
    a una decisión por la que se establecen las condiciones generales de las pruebas
    de origen expedidas por medios electrónicos en virtud del artículo 17, apartado
    4, del apéndice A del Protocolo n.° 3 de dicho Acuerdo
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2024/2968 av den 21 november 2024 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i den gemensamma kommitté som inrättats
    genom avtalet mellan Europeiska gemenskapen, å ena sidan, och Danmarks regering
    och Färöarnas Landsstyre, å andra sidan, vad gäller ett beslut om fastställande
    av allmänna villkor för ursprungsbevis som utfärdas elektroniskt i enlighet
    med artikel 17.4 i tillägg A till protokoll 3 till det avtalet
