    Abkommen zwischen der Europäischen Gemeinschaft einerseits und der Regierung
    von Dänemark und der Landesregierung der Färöer andererseits eingesetzt wurde,
    hinsichtlich eines Beschlusses zur Festlegung der allgemeinen Anforderungen für
    elektronisch ausgestellte Ursprungsnachweise gemäß Anlage A Artikel 17 Absatz
    4 des Protokolls Nr. 3 zum genannten Abkommen zu vertreten ist
