title:
- language: en
  script: Latn
  content: Commission Decision of 1 October 1979 on the reimbursement by the Guidance
    Section of the EAGGF to the Kingdom of the Netherlands of expenditure incurred
    during 1976 and additional expenditure for 1974 and 1975 on aids and premiums
    relating to the modernization of farms (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 1er octobre 1979, relative au remboursement
    par le Fonds européen d'orientation et de garantie agricole (FEOGA), section
    "orientation", au Royaume des Pays-Bas des dépenses effectuées pendant l'année
    1976 et d'un supplément pour les années 1974 et 1975 pour les aides et primes
    relatives à la modernisation des exploitations agricoles (Le texte en langue
    néerlandaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 1. Oktober 1979 über die Rückvergütung
    der Ausgaben des Jahres 1976 sowie zusätzlicher Ausgaben für 1974 und 1975 zur
    Modernisierung landwirtschaftlicher Betriebe für Beihilfen und Prämien durch
    den EAGFL, Abteilung Ausrichtung, an das Königreich der Niederlande (Nur der
    niederländische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 1. oktober 1979 om refusion gennem EUGFL, udviklingssektionen,
    til kongeriget Nederlandene af de udgifter, som er afholdt i løbet af året 1976,
    samt af de supplerende udgifter vedrørende årene 1974 og 1975 til støtte og
    præmier vedrørende modernisering af landbrugsbedrifter (Kun den nederlandske
    udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 1 ottobre 1979, relativa al rimborso da
    parte del FEAOG, sezione orientamento, al Regno dei Paesi Bassi delle spese affettuate
    durante il 1976 e di un supplemento per gli anni 1974 e 1975 per gli aiuti ed
    i premi relativi all'ammodernamento delle aziende agricole (Il testo in lingua
    olandese è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 1 oktober 1979 inzake de vergoeding door
    het EOGFL, afdeling Oriëntatie, aan het Koninkrijk der Nederlanden van de gedurende
    het jaar 1976 gedane uitgaven en van een supplement voor de jaren 1974 en 1975
    voor de steun en premies met betrekking tot de modernisering van landbouwbedrijven
    (Slechts de tekst in de Nederlandse taal is authentiek)
  type: main
