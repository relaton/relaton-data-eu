title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 258/80 of 5 February 1980 re-establishing
    the levying of the customs duties on artificial flowers, foliage or fruit, etc.,
    falling within heading No 67.02 and originating in Hong Kong, to which the preferential
    tariff arrangements as set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 258/80 de la Commission, du 5 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux fleurs,
    feuillages et fruits artificiels, etc., de la position 67.02 du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 258/80 der Kommission vom 5. Februar 1980 zur Wiedereinführung
    des Zollsatzes für künstliche Blumen, Blätter und Früchte usw., der Tarifnummer
    67.02, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2789/79 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 258/80 af 5. februar 1980 om genindførelse
    af opkrævning af toldafgifter for kunstige blomster, blade og frugter etc., under
    pos. 67.02, som har oprindelse i Hongkong, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 258/80 della Commissione, del 5 febbraio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai fiori, foglie e frutti
    artificiali, ecc., della voce n. 67.02 della tariffa doganale comune, originari
    di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 258/80 van de Commissie van 5 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kunstbloemen,
    kunstloofwerk en kunstvruchten, enz. van post 67.02, van oorsprong uit Hong-Kong
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
