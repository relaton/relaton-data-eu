  content: Commission Regulation (EEC) No 2130/82 of 29 July 1982 re-establishing
    the levying of customs duties applicable to methanol (methyl alcohol), falling
    within subheading 29.04 A I and originating in Mexico, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2130/82 de la Commission, du 29 juillet 1982, portant
