title:
- language: en
  script: Latn
  content: '88/450/ECSC: Commission Decision of 27 June 1988 authorizing the Member
    States to institute intra-Community surveillance of the importation for home use
    of certain iron and steel products originating in certain third countries and
    covered by the Treaty establishing the European Coal and Steel Community and in
    free circulation in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/450/CECA: Décision de la Commission du 27 juin 1988 autorisant les
    États membres à instaurer une surveillance intracommunautaire des importations
    pour la mise à la consommation de certains produits sidérurgiques originaires
    de certains pays tiers relevant du traité instituant la Communauté européenne
    du charbon et de l'' acier et mis en libre pratique dans un autre État membre'
  type: main
- language: de
  script: Latn
  content: '88/450/EGKS: Entscheidung der Kommission vom 27. Juni 1988 zur Ermächtigung
    der Mitgliedstaaten zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren zur Überführung in den steuerrechtlich freien Verkehr von bestimmten
    unter den Vertrag über die Gründung der Europäischen Gemeinschaft für Kohle
    und Stahl fallenden Eisen- und Stahlerzeugnissen mit Ursprung in bestimmten Drittländern,
    die sich in der Gemeinschaft im zollrechtlich freien Verkehr befinden'
  type: main
- language: da
  script: Latn
  content: '88/450/EKSF: Kommissionens beslutning af 27. juni 1988 om bemyndigelse
    af medlemsstaterne til at indføre tilsyn inden for Fællesskabet med importen
    til frit forbrug af visse jern- og stålprodukter med oprindelse i visse tredjelande,
    der henhører under Traktaten om Oprettelse af Det Europæiske Kul- og Stålfællesskab,
    og som overgår til fri omsætning i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '88/450/ΕΚΑΧ: Απόφαση της Επιτροπής της 27ης
    Ιουνίου 1988 που εξουσιοδοτεί τα κράτη μέλη να
    θεσπίσουν ενδοκοινοτική επίβλεψη των εισαγωγών
    για θέση σε κατανάλωση ορισμένων προϊόντων
    της βιομηχανίας σιδήρου και χάλυβα που κατάγονται
    από ορισμένες τρίτες χώρες και υπάγονται στη
    συνθήκη για την ίδρυση της Ευρωπαϊκής Κοινότητας
    Άνθρακα και Χάλυβα και που βρίσκονται σε ελεύθερη
    κυκλοφορία στην Κοινότητα'
  type: main
- language: it
  script: Latn
  content: '88/450/CECA: Decisione della Commissione del 27 giugno 1988 che autorizza
    gli Stati membri a istituire una sorveglianza intracomunitaria sulle importazioni
    per immissione in consumo di taluni prodotti siderurgici originari dei paesi terzi
    contemplati dal trattato che istituisce la Comunità europea del carbone e dell''
    acciaio e immessi in libera pratica nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '88/450/EGKS: Beschikking van de Commissie van 27 juni 1988 waarbij Lid-Staten
    worden gemachtigd een intracommunautair toezicht in te stellen op de invoer tot
    verbruik van bepaalde ijzer- en staalprodukten van oorsprong uit bepaalde derde
    landen die onder het Verdrag tot oprichting van de Europese Gemeenschap voor Kolen
    en Staal vallen en die in de Gemeenschap in het vrije verkeer worden gebracht'
  type: main
- language: pt
  script: Latn
  content: '88/450/CECA: Decisão da Comissão de 27 de Junho de 1988 que autoriza
    os Estados-membros a instalarem uma vigilância intracomunitária das importações
    para introdução no consumo de certos produtos siderúrgicos originários de
    certos países terceiros abrangidos pelo Tratado que institui a Comunidade Europeia
    do Carvão e do Aço e introduzidos em livre-prática num outro Estado-membro'
  type: main
- language: es
  script: Latn
  content: '88/450/CECA: Decisión de la Comisión de 27 de junio de 1988 por la que
    se autoriza a los Estados miembros a establecer medidas de vigilancia intracomunitaria
    en relación con las importaciones para la puesta al consumo de determinados productos
    siderúrgicos originarios de determinados países terceros del Tratado constitutivo
    de la Comunidad Europea del Carbón y del Acero y despachados a libre práctica
    en la Comunidad'
  type: main
