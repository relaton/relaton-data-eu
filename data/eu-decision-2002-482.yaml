title:
- language: en
  script: Latn
  content: '2002/482/EC: Commission Decision of 21 June 2002 amending Decision 93/52/EEC
    recording the compliance by certain Member States or regions with the requirements
    relating to brucellosis (B. melitensis) and according them the status of a Member
    State or region officially free of the disease (Text with EEA relevance) (notified
    under document number C(2002) 2213)'
  type: main
- language: fr
  script: Latn
  content: '2002/482/CE: Décision de la Commission du 21 juin 2002 modifiant la décision
    93/52/CEE constatant le respect par certains États membres ou régions des conditions
    relatives à la brucellose (Br. melitensis) et leur reconnaissant le statut d''État
    membre ou région officiellement indemne de cette maladie (Texte présentant de
    l''intérêt pour l''EEE) [notifiée sous le numéro C(2002) 2213]'
  type: main
- language: de
  script: Latn
  content: '2002/482/EG: Entscheidung der Kommission vom 21. Juni 2002 zur Änderung
    der Entscheidung 93/52/EWG zur Feststellung, dass bestimmte Mitgliedstaaten oder
    Gebiete die Bedingungen betreffend die Brucellose (Br. melitensis) eingehalten
    haben, und zur Anerkennung dieser Mitgliedstaaten oder Gebiete als amtlich brucellosefrei
    (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2002)
    2213)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 21. června 2002, kterým se mění rozhodnutí
    93/52/EHS, kterým se shledává, že některé členské státy nebo oblasti
    splňují podmínky týkající se brucelózy (B. melitensis) a přiznává se
    jim status členského státu nebo oblasti úředně prostých této choroby (oznámeno
    pod číslem K(2002) 2213)
  type: main
- language: da
  script: Latn
  content: '2002/482/EF: Kommissionens beslutning af 21. juni 2002 om ændring af
    beslutning 93/52/EØF om konstatering af, at bestemte medlemsstater eller regioner
    overholder betingelserne for brucellose (B. melitensis), og om anerkendelse af
    deres status som medlemsstat eller region, der er officielt fri for denne sygdom
    (EØS-relevant tekst) (meddelt under nummer K(2002) 2213)'
  type: main
- language: el
  script: Grek
  content: '2002/482/ΕΚ: Απόφαση της Επιτροπής, της 21ης
    Ιουνίου 2002, για τροποποίηση της απόφασης 93/52/ΕΟΚ
    που διαπιστώνει την τήρηση εκ μέρους ορισμένων
    κρατών μελών ή περιοχών των όρων σχετικά με
    την βρουκέλλωση (B. melitensis) και που τους αναγνωρίζει
    το καθεστώς κράτους μέλους ή περιοχής επίσημα
    απαλλαγμένης από την ασθένεια αυτή (Κείμενο
    που παρουσιάζει ενδιαφέρον για τον ΕΟΧ) [κοινοποιηθείσα
    υπό τον αριθμό Ε(2002) 2213]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 21. juuni 2002, millega muudetakse otsust 93/52/EMÜ,
    milles registreeritakse teatavate liikmesriikide või piirkondade vastavus nõuetele
    seoses brutselloosiga (B. melitensis) ja antakse neile ametlikult haigusvaba liikmesriigi
    või piirkonna staatus (teatavaks tehtud numbri K(2002) 2213 all)
  type: main
- language: fi
  script: Latn
  content: '2002/482/EY: Komission päätös, tehty 21 päivänä kesäkuuta 2002,
    luomistautia (Br. melitensis) koskevien edellytysten täyttämisen toteamisesta
    tietyissä jäsenvaltioissa ja tietyillä alueilla ja näille jäsenvaltioille
    ja alueille tästä taudista virallisesti vapaan jäsenvaltion tai alueen aseman
    vahvistamisesta tehdyn päätöksen 93/52/ETY muuttamisesta (ETA:n kannalta merkityksellinen
    teksti) (tiedoksiannettu numerolla K(2002) 2213)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2002. június 21.) egyes tagállamok vagy területek
    brucellózisra (B. melitensis) vonatkozó követelményeknek való megfelelésének
    rögzítéséről, és hivatalosan brucellózismentes tagállam vagy terület
    státusuk elismeréséről szóló 93/52/EGK határozat módosításáról (az
    értesítés a C(2002) 2213. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2002/482/CE: Decisione della Commissione, del 21 giugno 2002, recante
    modifica della decisione 93/52/CEE che constata il rispetto da parte di taluni
    Stati membri o regioni delle condizioni relative alla brucellosi (B. melitensis)
    e riconosce loro la qualifica di Stato membro o regione ufficialmente indenne
    da tale malattia (Testo rilevante ai fini del SEE) [notificata con il numero C(2002)
    2213]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2002. gada 21. jūnijs), ar kuru groza Lēmumu 93/52/EEK,
    ar ko konstatē dažu dalībvalstu vai reģionu atbilstību prasībām attiecībā
    uz brucelozi (B. melitensis) un ar ko piešķir tiem tādas dalībvalsts vai reģiona
    statusu, kurš ir oficiāli brīvs no šīs slimības (izziņots ar dokumenta
    numuru C(2002) 2213)
  type: main
- language: lt
  script: Latn
  content: 2002 m. birželio 21 d. Komisijos sprendimas, iš dalies pakeičiantis
    Sprendimą 93/52/EEB, nustatantį, kad tam tikros valstybės narės arba regionai
    atitinka reikalavimus dėl bruceliozės (B. melitensis) ir toms valstybėms narėms
    arba regionams suteikiantį oficialiai bruceliozės neapimtos valstybės narės
    arba regiono statusą (pranešta dokumentu Nr. C(2002) 2213)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-21 ta’ Ġunju 2002 li temenda d-Deċiżjoni
    93/52/KEE li tirreġistra l-konformità ta’ ċerti Stati Membri jew reġjuni
    mal-ħtiġijiet dwar il-bruċellosi (B. melitensis) u li takkordalhom l-istatus
    ta’ Stat Membru jew reġjun uffiċjalment ħieles mill-marda (notifikata bid-dokument
    numru C (2002) 2213)
  type: main
- language: nl
  script: Latn
  content: '2002/482/EG: Beschikking van de Commissie van 21 juni 2002 tot wĳziging
    van Beschikking 93/52/EEG houdende constatering dat bepaalde lidstaten of gebieden
    aan de voorwaarden voldoen om te worden erkend als officieel brucellosevrĳ (B.
    melitensis) (Voor de EER relevante tekst) (kennisgeving geschied onder nummer
    C(2002) 2213)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 21 czerwca 2002 r. zmieniająca decyzję 93/52/EWG
    stwierdzającą stosowanie się niektórych Państw Członkowskich lub regionów
    do wymagań odnoszących się do brucelozy (B. melitensis) i przyznającą im
    status oficjalnie wolnych od choroby (decyzja notyfikowana jako dokument nr C(2002)
    2213)
  type: main
- language: pt
  script: Latn
  content: '2002/482/CE: Decisão da Comissão, de 21 de Junho de 2002, que altera
    a Decisão 93/52/CEE que reconhece que certos Estados-Membros ou regiões respeitam
    as condições relativas à brucelose (B. melitensis) e que lhes reconhece o estatuto
    de Estado-Membro ou região oficialmente indemne desta doença (Texto relevante
    para efeitos do EEE) [notificada com o número C(2002) 2213]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 21. júna 2002, ktorým sa mení a dopĺňa rozhodnutie
    93/52/EHS, ktorým sa zaznamenáva dosiahnutie súladu niektorých členských
    štátov alebo oblastí s požiadavkami vzťahujúcimi sa na brucelózu (B. melitensis)
    a priznáva sa im štatút úradne uznaného členského štátu alebo oblasti
    bez výskytu tejto choroby (oznámené pod číslom dokumentu C(2002) 2213)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 21. junija 2002 o spremembi Odločbe št. 93/52/EGS
    o ugotovitvi usklajenosti nekaterih držav članic ali regij z zahtevami glede
    bruceloze (B. melitensis) in o priznanju statusa države članice ali regije,
    uradno proste te bolezni (notificirano pod dokumentarno številko K(2002) 2213)
  type: main
- language: es
  script: Latn
  content: '2002/482/CE: Decisión de la Comisión, de 21 de junio de 2002, que modifica
    la Decisión 93/52/CEE por la que se reconoce que determinados Estados miembros
    o regiones cumplen las condiciones referentes a la brucelosis (Brucella melitensis)
    y se les concede la calificación de Estados miembros o regiones oficialmente
    indemnes de esta enfermedad (Texto pertinente a efectos del EEE) [notificada con
    el número C(2002) 2213]'
  type: main
- language: sv
  script: Latn
  content: '2002/482/EG: Kommissionens beslut av den 21 juni 2002 om ändring av beslut
    93/52/EEG om fastställande av att vissa medlemsstater eller regioner iakttar
    kraven i fråga om brucellos (Br. melitensis) och erkännande av deras status
    som medlemsstat eller region som är officiellt fri från denna sjukdom (Text
    av betydelse för EES) [delgivet med nr K(2002) 2213]'
