id: EUDecision20213
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/3 of 23 November 2020 on the position to be
    taken, on behalf of the European Union, at the reconvened sixty-third session
    of the Commission on Narcotic Drugs, on the scheduling of cannabis and cannabis-related
    substances under the Single Convention on Narcotic Drugs of 1961, as amended by
    the 1972 Protocol, and the Convention on Psychotropic Substances of 1971
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/3 du Conseil du 23 novembre 2020 relative à la position
    à prendre, au nom de l’Union européenne, lors de la reconvocation de la soixante-troisième
    session de la Commission des stupéfiants, en ce qui concerne l’inscription
    du cannabis et des substances apparentées aux tableaux annexés à la Convention
    unique sur les stupéfiants de 1961, modifiée par le protocole de 1972, et à
    la Convention sur les substances psychotropes de 1971
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/3 des Rates vom 23. November 2020 über den im Namen
    der Europäischen Union auf der neu anberaumten 63. Tagung der Suchtstoffkommission
    über die Aufnahme von Cannabis und Cannabis-verwandten Stoffen in die Anhänge
    des Einheits-Übereinkommens von 1961 über Suchtstoffe in der durch das Protokoll
    von 1972 geänderten Fassung und des Übereinkommens von 1971 über psychotrope
    Stoffe zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2021/3 на Съвета от 23 ноември 2020
    година относно позицията, която трябва да се
    заеме от името на Европейския съюз на подновената
    шестдесет и трета сесия на Комисията за упойващите
    вещества по отношение на включването на канабиса
    и свързани с канабиса вещества в списъците
    по Единната конвенция по упойващите вещества
    от 1961 г., изменена с Протокола от 1972 г., и Конвенцията
    за психотропните вещества от 1971 г.
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2021/3, ze dne 23. listopadu 2020 o postoji, který
    má být zaujat jménem Evropské unie na opětovně svolaném 63. zasedání
    Komise pro narkotika, pokud jde o zařazení konopí a látek příbuzných konopí
    na seznamy k Jednotné úmluvě o omamných látkách z roku 1961 ve znění protokolu
    z roku 1972 a k Úmluvě o psychotropních látkách z roku 1971
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2021/3 af 23. november 2020 om den holdning, der
    skal indtages på Den Europæiske Unions vegne på det genindkaldte 63. møde
    i Narkotikakommissionen for så vidt angår opførelsen af cannabis og cannabisrelaterede
    stoffer i bilagene til enkeltkonventionen af 1961 angående narkotiske midler,
    som ændret ved protokollen af 1972, og konventionen af 1971 om psykotrope stoffer
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2021/3 του Συμβουλίου της 23ης
    Νοεμβρίου 2020 για τη θέση που πρέπει να ληφθεί,
    εξ ονόματος της Ευρωπαϊκής Ένωσης, κατά την
    εκ νέου συγκληθείσα εξηκοστή τρίτη σύνοδο
    της επιτροπής για τα ναρκωτικά, όσον αφορά
    την καταχώριση της κάνναβης και των σχετικών
    προς αυτήν ουσιών βάσει της ενιαίας σύμβασης
    για τα ναρκωτικά του 1961, όπως τροποποιήθηκε
    από το πρωτόκολλο του 1972, και της σύμβασης για
    τις ψυχοτρόπους ουσίες του 1971
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2021/3, 23. november 2020, Euroopa Liidu nimel võetava
    seisukoha kohta narkootiliste ainete komisjoni uuesti kokku kutsutud 63. istungjärgul
    seoses kanepi ja kanepiga seotud ainete kandmisega 1961. aasta narkootiliste ainete
    ühtsesse konventsiooni, mida on muudetud 1972. aasta protokolliga, ja 1971. aasta
    psühhotroopsete ainete konventsiooni
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2021/3, annettu 23 päivänä marraskuuta 2020,
    huumausainetoimikunnan uudelleen koolle kutsutussa 63. istunnossa Euroopan unionin
    puolesta otettavasta kannasta, joka koskee kannabiksen ja kannabikseen liittyvien
    aineiden listaamista vuoden 1961 huumausaineyleissopimuksen, sellaisena kuin se
    on muutettuna vuoden 1972 pöytäkirjalla, ja psykotrooppisia aineita koskevan
    vuoden 1971 yleissopimuksen mukaisesti
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2021/3 od 23. studenoga 2020. o stajalištu koje treba
    zauzeti u ime Europske unije na ponovno sazvanoj 63. sjednici Komisije za opojne
    droge u pogledu uvrštavanja kanabisa i tvari povezanih s kanabisom na popise
    u Jedinstvenoj konvenciji o opojnim drogama iz 1961., kako je izmijenjena Protokolom
    iz 1972., i Konvenciji o psihotropnim tvarima iz 1971.
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2021/3 határozata (2020. november 23.) az 1972. évi jegyzőkönyvvel
    módosított, 1961. évi Egységes Kábítószer Egyezmény és a pszichotrop
    anyagokról szóló, 1971. évi egyezmény szerinti kannabisz és kannabisszal
    kapcsolatos anyagjegyzékekbe való felvétel tekintetében a Kábítószer-bizottság
    újra összehívott 63. Ülésszakán az Európai Unió nevében képviselendő
    álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2021/3 del Consiglio del 23 novembre 2020 relativa alla
    posizione da adottare, a nome dell’Unione europea, alla sessantatreesima sessione
    riconvocata della commissione Stupefacenti sull’inclusione di cannabis e sostanze
    associate alla cannabis nelle tabelle della Convenzione unica sugli stupefacenti
    del 1961, modificata dal Protocollo del 1972, e della Convenzione sulle sostanze
    psicotrope del 1971
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2021/3 (2020. gada 23. novembris) par nostāju, kas
    Eiropas Savienības vārdā jāieņem Narkotisko vielu komisijas atkārtoti sasauktajā
    sešdesmit trešajā sesijā attiecībā uz kanabisu un kanabisam radniecīgu
    vielu iekļaušanu sarakstos, kuri pievienoti 1961. gada Vienotajai konvencijai
    par narkotiskajām vielām, kas grozīta ar 1972. gada protokolu, un 1971. gada
    Konvencijai par psihotropajām vielām
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2021/3 2020 m. lapkričio 23 d. dėl pozicijos,
    kurios turi būti laikomasi Europos Sąjungos vardu atnaujintoje šešiasdešimt
    trečiojoje Narkotinių medžiagų komisijos sesijoje, dėl kanapių ir su jomis
    susijusių medžiagų įtraukimo į sąrašus pagal 1961 m. Bendrąją narkotinių
    medžiagų konvenciją su pakeitimais, padarytais 1972 m. protokolu, ir 1971 m.
    Psichotropinių medžiagų konvenciją
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill (UE) 2021/3 tat-23 ta’ Novembru 2020 dwar
    il-pożizzjoni li trid tittieħed, f’isem l-Unjoni Ewropea, fit-tlieta u sittin
    sessjoni tal-Kummissjoni dwar id-Drogi Narkotiċi, li ser terġa’ titlaqqa’,
    dwar l-iskedar tal-kannabis u s-sustanzi relatati mal-kannabis taħt il-Konvenzjoni
    Unika dwar id-Drogi Narkotiċi tal-1961, kif emendata mill-Protokoll tal-1972,
    u l-Konvenzjoni dwar is-Sustanzi Psikotropiċi tal-1971
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2021/3 van de Raad van 23 november 2020 betreffende het namens
    de Europese Unie op de hervatte drieënzestigste zitting van de Commissie Verdovende
    Middelen in te nemen standpunt over het opnemen van cannabis en cannabisgerelateerde
    stoffen in de lijsten die gehecht zijn aan het Enkelvoudig Verdrag inzake verdovende
    middelen van 1961, zoals gewijzigd bij het Protocol van 1972, en aan het Verdrag
    inzake psychotrope stoffen van 1971
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2021/3 z dnia 23 listopada 2020 r. w sprawie stanowiska,
    jakie ma być zajęte, w imieniu Unii Europejskiej, na ponownie zwołanej sześćdziesiątej
    trzeciej sesji Komisji ds. Środków Odurzających w sprawie umieszczania konopi
    indyjskich i ich pochodnych w wykazach zgodnie z Jednolitą konwencją o środkach
    odurzających z 1961 r., zmienioną protokołem z 1972 r., oraz Konwencją o substancjach
    psychotropowych z 1971 r.
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2021/3 do Conselho de 23 de novembro de 2020 relativa à
    posição a tomar em nome da União Europeia na sexagésima-terceira sessão reconvocada
    da Comissão dos Estupefacientes sobre a inclusão da canábis e das substâncias
    relacionadas com a canábis nas listas da Convenção Única sobre os Estupefacientes
    de 1961, alterada pelo Protocolo de 1972, e da Convenção sobre as Substâncias
    Psicotrópicas de 1971
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2021/3 a Consiliului din 23 noiembrie 2020 privind poziția
    care urmează să fie adoptată, în numele Uniunii Europene, la cea de a șaizeci
    și treia sesiune reconvocată a Comisiei privind stupefiantele, referitor la
    modificarea tabelelor de substanțe în ceea ce privește canabisul și substanțe
    legate de canabis anexate la Convenția unică asupra stupefiantelor din 1961,
    astfel cum a fost modificată prin Protocolul din 1972, și la Convenția asupra
    substanțelor psihotrope din 1971
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2021/3 z 23. novembra 2020 o pozícii, ktorá sa
    má v mene Európskej únie zaujať na opätovne zvolanom šesťdesiatom treťom
    zasadnutí Komisie pre omamné látky v súvislosti so zaradením kanabisu a látok
    príbuzných kanabisu do zoznamov v rámci Jednotného dohovoru o omamných látkach
    z roku 1961 v znení protokolu z roku 1972 a v rámci Dohovoru o psychotropných
    látkach z roku 1971
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2021/3 z dne 23. novembra 2020 o stališču, ki se v imenu
    Evropske unije zastopa na ponovno sklicanem triinšestdesetem zasedanju Komisije
    ZN za droge o uvrstitvi kanabisa in s kanabisom povezanih substanc v tabele v
    okviru Enotne konvencije o mamilih iz leta 1961, kakor je bila spremenjena s Protokolom
    iz leta 1972, in Konvencije o psihotropnih substancah iz leta 1971
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/3 del Consejo de 23 de noviembre de 2020 sobre la posición
    que debe adoptarse, en nombre de la Unión Europea, en la continuación del sexagésimo
    tercer período de sesiones de la Comisión de Estupefacientes sobre la inclusión
    del cannabis y de las sustancias relacionadas con el cannabis en las listas de
    la Convención Única de 1961 sobre Estupefacientes, enmendada por el Protocolo
    de 1972, y el Convenio sobre Sustancias Sicotrópicas de 1971
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2021/3 av den 23 november 2020 om den ståndpunkt som
    ska intas på Europeiska unionens vägnarunder den på nytt sammankallade sextiotredje
    sessionen i FN:s narkotikakommission om upptagande av cannabis och cannabisrelaterade
    ämnen i förteckningarna enligt FN:s allmänna narkotikakonvention från 1961,
    ändrad genom 1972 års protokoll, och konventionen om psykotropa ämnen från
    1971
