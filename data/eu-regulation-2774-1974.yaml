title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2774/74 of the Commission of 30 October 1974 re-establishing
    the levying of customs duties on spoons, forks, etc., of stainless steel, falling
    within subheading 82.14 A, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2774/74 de la Commission, du 30 octobre 1973, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, etc., en acier inoxydable, de la sous-position 82.14 A, originaires des
    pays en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2774/74 der Kommission vom 30. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen usw., aus rostfreiem Stahl, der Tarifstelle
    82.14 A, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2774/74 af 30. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler etc., af rustfrit stål, underposition
    82.14 A, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2774/74 della Commissione, del 30 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai cucchiai, cucchiaioni,
    etc., di acciaio inossidabile, della sottovoce doganale n. 82.14 A originari dei
    paesi in via di sviluppo beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2774/74 van de Commissie van 30 oktober 1974 houdende
    wederinstelling van de heffing van de douanerechten voor lepels, pollepels enz.
    van roestvrij staal, van onderverdeling 82.14 A, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december
    1973 tariefpreferenties werden geopend
  type: main
