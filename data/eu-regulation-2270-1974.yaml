  content: Regulation (EEC) No 2270/74 of the Commission of 29 August 1974 fixing
    the rates of the refunds applicable from 1 September 1974 to certain cereals and
    rice products exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2270/74 de la Commission, du 29 août 1974, fixant les
    taux des restitutions applicables, à compter du 1er septembre 1974, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2270/74 der Kommission vom 29. August 1974 zur Festsetzung
    der ab 1. September 1974 geltenden Erstattungssätze bei der Ausfuhr bestimmter
    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2270/74 af 29. august 1974 om fastsættelse
    af de restitutionssatser, der fra 1. september 1974 skal anvendes for visse produkter
    fra korn- og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2270/74 della Commissione, del 29 agosto 1974, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 settembre 1974,
    a taluni prodotti dei settori dei cereali e del riso esportati sotto forma di
    merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2270/74 van de Commissie van 29 augustus 1974 houdende
