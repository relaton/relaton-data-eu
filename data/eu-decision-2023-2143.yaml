---
id: EUDecision20232143
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/2143 of 13 October 2023 renewing
    the authorisation for placing on the market of products containing, consisting
    of or produced from genetically modified maize MIR162 pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council and amending Commission
    Implementing Decisions (EU) 2016/1685, (EU) 2019/1305 and (EU) 2019/2087 as regards
    the reference material (notified under document C(2023) 6736)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/2143 de la Commission du 13 octobre
    2023 renouvelant l’autorisation de mise sur le marché de produits contenant
    du maïs génétiquement modifié MIR162, consistant en ce maïs ou produits à
    partir de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil, et modifiant les décisions d’exécution (UE) 2016/1685,
    (UE) 2019/1305 et (UE) 2019/2087 de la Commission en ce qui concerne le matériau
    de référence [notifiée sous le numéro C(2023) 6736]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/2143 der Kommission vom 13. Oktober 2023
    zur Erneuerung der Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch
    veränderten Mais der Sorte MIR162 enthalten, aus ihm bestehen oder aus ihm gewonnen
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates sowie zur Änderung der Durchführungsbeschlüsse (EU) 2016/1685,
    (EU) 2019/1305 und (EU) 2019/2087 in Bezug auf das Referenzmaterial (Bekannt gegeben
    unter Aktenzeichen C(2023) 6736)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2023/2143 на Комисията
    от 13 октомври 2023 година за подновяване на разрешението
    за пускане на пазара на продукти, съдържащи,
    състоящи се или произведени от генетично модифицирана
    царевица MIR162, в съответствие с Регламент (ЕО)
    № 1829/2003 на Европейския парламент и на Съвета
    и за изменение на решения за изпълнение (ЕС)
    2016/1685, (ЕС) 2019/1305 и (ЕС) 2019/2087 на Комисията по отношение
    на референтния материал (нотифицирано под
    номер С(2023) 6736)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2023/2143 ze dne 13. října 2023,
    kterým se obnovuje povolení pro uvádění produktů, které obsahují geneticky
    modifikovanou kukuřici MIR162, sestávají z ní nebo jsou z ní vyrobeny, na
    trh podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 a kterým
    se mění prováděcí rozhodnutí Komise (EU) 2016/1685, (EU) 2019/1305 a (EU)
    2019/2087, pokud jde o referenční materiál (oznámeno pod číslem C(2023)
    6736)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2023/2143 af 13. oktober 2023
    om forlængelse af tilladelsen til markedsføring af produkter, der indeholder,
    består af eller er fremstillet af genetisk modificeret MIR162-majs i henhold
    til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003, og om ændring
    af Kommissionens gennemførelsesafgørelse (EU) 2016/1685, (EU) 2019/1305 og (EU)
    2019/2087 for så vidt angår referencematerialet (meddelt under nummer C(2023)
    6736)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2023/2143 της Επιτροπής,
    της 13ης Οκτωβρίου 2023, για την ανανέωση της έγκρισης
    της διάθεσης στην αγορά προϊόντων που περιέχουν,
    αποτελούνται ή παράγονται από γενετικώς τροποποιημένο
    αραβόσιτο MIR162 σύμφωνα με τον κανονισμό (ΕΚ)
    αριθ. 1829/2003 του Ευρωπαϊκού Κοινοβουλίου και
    του Συμβουλίου και για την τροποποίηση των
    εκτελεστικών αποφάσεων (ΕΕ) 2016/1685, (ΕΕ) 2019/1305
    και (ΕΕ) 2019/2087 της Επιτροπής όσον αφορά το υλικό
    αναφοράς [κοινοποιηθείσα υπό τον αριθμό C(2023)
    6736]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2023/2143, 13. oktoober 2023, millega pikendatakse
    geneetiliselt muundatud maisi MIR162 sisaldavate, sellest koosnevate või sellest
    valmistatud toodete turuleviimise luba vastavalt Euroopa Parlamendi ja nõukogu
    määrusele (EÜ) nr 1829/2003 ning muudetakse komisjoni rakendusotsuseid (EL)
    2016/1685, (EL) 2019/1305 ja (EL) 2019/2087 etalonainete osas (teatavaks tehtud
    numbri C(2023) 6736 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2023/2143, annettu 13 päivänä
    lokakuuta 2023, muuntogeenistä maissia MIR162 sisältävien, siitä koostuvien
    tai siitä valmistettujen tuotteiden markkinoille saattamista koskevan luvan uusimisesta
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti ja komission
    täytäntöönpanopäätösten (EU) 2016/1685, (EU) 2019/1305 ja (EU) 2019/2087
    muuttamisesta vertailumateriaalin osalta (tiedoksiannettu numerolla C(2023) 6736)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2023/2143 ón gCoimisiún an 13 Deireadh
    Fómhair 2023 lena n-athnuaitear an t-údarú chun táirgí a chur ar an margadh
    ina bhfuil arbhar Indiach géinmhodhnaithe MIR162, atá comhdhéanta de nó a
    tháirgtear as de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint na hEorpa
    agus ón gComhairle agus lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2016/1685,(AE)
    2019/1305 agus (AE) 2019/2087 ón gCoimisiún a mhéid a bhaineann leis an ábhar
    tagartha (a bhfuil fógra tugtha ina leith faoi dhoiciméad C (2023) 6736)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2023/2143 оd 13. listopada 2023. o produljenju
    odobrenja za stavljanje na tržište proizvoda koji sadržavaju genetski modificirani
    kukuruz MIR162, sastoje se ili su proizvedeni od njega u skladu s Uredbom (EZ)
    br. 1829/2003 Europskog parlamenta i Vijeća te o izmjeni provedbenih odluka Komisije
    (EU) 2016/1685, (EU) 2019/1305 i (EU) 2019/2087 u pogledu referentnog materijala
    (priopćeno pod brojem dokumenta C(2023) 6736)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/2143 végrehajtási határozata (2023. október
    13.) a géntechnológiával módosított MIR162 kukoricát tartalmazó, abból
    álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról,
    valamint az (EU) 2016/1685, az (EU) 2019/1305 és az (EU) 2019/2087 bizottsági
    végrehajtási határozatnak a referenciaanyag tekintetében történő módosításáról
    (az értesítés a C(2023) 6736. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/2143 della Commissione, del 13 ottobre
    2023, che rinnova l’autorizzazione all’immissione in commercio di prodotti
    contenenti, costituiti o derivati da granturco geneticamente modificato MIR162
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    e che modifica le decisioni di esecuzione (UE) 2016/1685, (UE) 2019/1305 e (UE)
    2019/2087 della Commissione per quanto riguarda il materiale di riferimento [notificata
    con il numero C(2023) 6736]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2023/2143 (2023. gada 13. oktobris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu MIR162,
    no tās sastāv vai ir no tās ražoti, un attiecībā uz references materiālu
    groza Komisijas Īstenošanas lēmumus (ES) 2016/1685, (ES) 2019/1305 un (ES)
    2019/2087 (izziņots ar dokumenta numuru C(2023) 6736)
  type: main
- language: lt
  script: Latn
  content: 2023 m. spalio 13 d. Komisijos įgyvendinimo sprendimas (ES) 2023/2143,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 pratęsiamas
    leidimas pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų
    kukurūzų MIR162 arba kurie iš jų sudaryti ar pagaminti, ir dėl etaloninės
    medžiagos iš dalies keičiami Komisijos įgyvendinimo sprendimai (ES) 2016/1685,
    (ES) 2019/1305 ir (ES) 2019/2087 (pranešta dokumentu Nr. C(2023) 6736)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/2143 tat-13
    ta’ Ottubru 2023 li ġġedded l-awtorizzazzjoni għall-introduzzjoni fis-suq
    ta’ prodotti li fihom il-qamħirrum ġenetikament modifikat MIR162, li jikkonsistu
    minnu jew li jkunu prodotti minnu skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament
    Ewropew u tal-Kunsill u li jemenda d-Deċiżjonijiet ta’ Implimentazzjoni tal-Kummissjoni
    (UE) 2016/1685, (UE) 2019/1305 u (UE) 2019/2087 fir-rigward tal-materjal ta’
    referenza (notifikata bid-dokument C(2023) 6736)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2023/2143 van de Commissie van 13 oktober 2023
    tot verlenging van de vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MIR162 overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees Parlement
    en de Raad, en tot wijziging van de Uitvoeringsbesluiten (EU) 2016/1685, (EU)
    2019/1305 en (EU) 2019/2087 van de Commissie wat het referentiemateriaal betreft
    (Kennisgeving geschied onder nummer C(2023) 6736)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2023/2143 z dnia 13 października 2023
    r. odnawiająca zezwolenie na wprowadzenie do obrotu, na podstawie rozporządzenia
    (WE) nr 1829/2003 Parlamentu Europejskiego i Rady, produktów zawierających genetycznie
    zmodyfikowaną kukurydzę MIR162, składających się z niej lub z niej wyprodukowanych
    oraz zmieniająca decyzje wykonawcze Komisji (UE) 2016/1685, (UE) (UE) 2019/1305
    i (UE) 2019/2087 w odniesieniu do materiału referencyjnego (notyfikowana jako
    dokument nr C(2023) 6736)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2023/2143 da Comissão, de 13 de outubro de
    2023, que renova a autorização de colocação no mercado de produtos que contenham,
    sejam constituídos por ou sejam produzidos a partir de milho geneticamente modificado
    MIR162 nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e do
    Conselho e que altera as Decisões de Execução (UE) 2016/1685, (UE) 2019/1305
    e (UE) 2019/2087 da Comissão no que diz respeito aos materiais de referência
    [notificada com o número C(2023) 6736]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2023/2143 a Comisiei din 13 octombrie
    2023 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin, constau în sau sunt fabricate din porumb modificat genetic MIR162 în
    temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al Consiliului
    și de modificare a Deciziilor de punere în aplicare (UE) 2016/1685, (UE) 2019/1305
    și (UE) 2019/2087 ale Comisiei în ceea ce privește materialele de referință
    [notificată cu numărul C(2023) 6736]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2023/2143 z 13. októbra 2023, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje
    povolenie umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu MIR162, sú z nej zložené alebo vyrobené, a ktorým sa menia vykonávacie
    rozhodnutia Komisie (EÚ) 2016/1685, (EÚ) 2019/1305 a (EÚ) 2019/2087, pokiaľ
    ide o referenčné materiály [oznámené pod číslom C(2023) 6736]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2023/2143 z dne 13. oktobra 2023 o obnovitvi
    odobritve dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MIR162,
    so iz nje sestavljeni ali proizvedeni, v skladu z Uredbo (ES) št. 1829/2003 Evropskega
    parlamenta in Sveta ter o spremembi izvedbenih sklepov Komisije (EU) 2016/1685,
    (EU) 2019/1305 in (EU) 2019/2087 glede referenčnega materiala (notificirano pod
    dokumentarno številko C(2023) 6736)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2023/2143 de la Comisión, de 13 de octubre
    de 2023, por la que se renueva la autorización de comercialización de productos
    que contengan, estén compuestos o se hayan producido a partir de maíz modificado
    genéticamente MIR162 con arreglo al Reglamento (CE) n.o 1829/2003 del Parlamento
    Europeo y del Consejo y se modifican las Decisiones de Ejecución (UE) 2016/1685,
    (UE) 2019/1305 y (UE) 2019/2087 de la Comisión en lo que respecta al material
    de referencia [notificada con el número C(2023) 6736]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2023/2143 av den 13 oktober 2023
    om förlängning av godkännandet för utsläppande på marknaden av produkter
    som innehåller, består av eller har framställts av den genetiskt modifierade
    majsen MIR162 i enlighet med Europaparlamentets och rådets förordning (EG) nr
    1829/2003, och om ändring av kommissionens genomförandebeslut (EU) 2016/1685,
    (EU) 2019/1305 och (EU) 2019/2087 vad gäller referensmaterial [delgivet med nr
    C(2023) 6736]
