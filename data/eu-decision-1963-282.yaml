title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 avril 1963, portant abrogation de sa
    décision du 9 octobre 1962, autorisant la perception de taxes compensatoires
    sur les importations, dans la République française, de sucreries sans cacao,
    ne contenant pas de liqueur alcoolique, en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '63/282/EWG: Entscheidung der Kommission vom 10. April 1963 zur Aufhebung
    ihrer Entscheidung vom 9. Oktober 1962 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Zuckerwaren ohne Kakaogehalt, nicht alkoholhaltig aus den anderen
    Mitgliedstaaten nach Frankreich'
  type: main
- language: it
  script: Latn
  content: '63/282/CEE: Decisione della Commissione del 10 aprile 1963 che abroga
    la propria decisione del 9 ottobre 1962, che autorizza la riscossione di tasse
    di compensazione sulle importazioni in Francia di prodotti a base di zuccheri
    senza cacao non contenenti sostanze alcoliche, in provenienza dagli altri Stati
    membri'
  type: main
- language: nl
  script: Latn
  content: '63/282/EEG: Beschikking van de Commissie van 10 april 1963 houdende intrekking
    van haar beschikking van 9 oktober 1962, waarbij machtiging werd verleend tot
    het leggen van compenserende heffingen op de invoer in de Franse Republiek van
    suikerwerk zonder cacao, geen likeur bevattend, uit de andere Lid-Staten'
  type: main
