  script: Latn
  content: Council Decision 2014/483/CFSP of 22 July 2014 updating and amending the
    list of persons, groups and entities subject to Articles 2, 3 and 4 of Common
    Position 2001/931/CFSP on the application of specific measures to combat terrorism,
    and repealing Decision 2014/72/CFSP
  type: main
- language: fr
  script: Latn
