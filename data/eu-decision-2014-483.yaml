    modifiant la liste des personnes, groupes et entités auxquels s'appliquent les
    articles 2, 3 et 4 de la position commune 2001/931/PESC relative à l'application
    de mesures spécifiques en vue de lutter contre le terrorisme, et abrogeant la
    décision 2014/72/PESC
  type: main
- language: de
  script: Latn
  content: Beschluss 2014/483/GASP des Rates vom 22. Juli 2014 zur Aktualisierung
