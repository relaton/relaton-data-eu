    die die Artikel 2, 3 und 4 des Gemeinsamen Standpunkts 2001/931/GASP über die
    Anwendung besonderer Maßnahmen zur Bekämpfung des Terrorismus gelten, und zur
    Aufhebung des Beschlusses 2014/72/GASP
  type: main
- language: bg
  script: Cyrl
