  content: Decisión de Ejecución (UE) 2019/2081 de la Comisión de 28 de noviembre
    de 2019 por la que se renueva la autorización de comercialización de los productos
    que contienen colza modificada genéticamente T45 (ACS-BNØØ8-2) o están producidos
    a partir de la misma tras la comercialización de dicha colza en terceros países
    hasta 2005 de conformidad con el Reglamento (CE) n.o 1829/2003 del Parlamento
    Europeo y del Consejo [notificada con el número C(2019) 7480] (El texto en lengua
    alemana es el único auténtico)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2019/2081 av den 28 november 2019
    om förlängning av godkännandet för utsläppande på marknaden av produkter
    som innehåller eller har framställts av genetiskt modifierad raps T45 (ACS-BNØØ8-2)
    till följd av saluföring av denna raps i tredjeländer till och med 2005 i enlighet
    med Europaparlamentets och rådets förordning (EG) nr 1829/2003 [delgivet med
    nr C(2019) 7480] (Endast den tyska texten är giltig)
