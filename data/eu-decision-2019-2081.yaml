  script: Latn
  content: Uitvoeringsbesluit (EU) 2019/2081 van de Commissie van 28 november 2019
    tot verlenging van de vergunning voor het in de handel brengen van producten die
    het genetisch gemodificeerde koolzaad T45 (ACS-BNØØ8-2) bevatten of daarmee
    zijn geproduceerd als gevolg van de commercialisering van dit koolzaad in derde
    landen tot 2005, overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees
    Parlement en de Raad (Kennisgeving geschied onder nummer C(2019) 7480) (Slechts
    de tekst in de Duitse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/2081 z dnia 28 listopada 2019 r. odnawiająca
    zezwolenie na wprowadzenie do obrotu na mocy rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady produktów zawierających genetycznie zmodyfikowany
    rzepak T45 (ACS-BNØØ8-2) lub z niego wyprodukowanych w związku ze sprzedażą
    tego rzepaku w krajach trzecich do 2005 r. (notyfikowana jako dokument nr C(2019)
    7480) (Jedynie tekst w języku niemieckim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/2081 da Comissão de 28 de novembro de
    2019 que renova a autorização de colocação no mercado de produtos que contenham
    ou sejam produzidos a partir de colza geneticamente modificada T45 (ACS-BNØØ8-2)
    resultante da comercialização deste tipo de colza nos países terceiros até
    2005 nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e do Conselho
    [notificada com o número C(2019) 7480] (Apenas faz fé o texto em língua alemã)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/2081a Comisiei din 28 noiembrie
    2019 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin sau sunt fabricate din rapița modificată genetic T45 (ACS-BNØØ8-2),
    rezultate din comercializarea acestui tip de rapiță în țări terțe până
    în 2005, în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European
    și al Consiliului [notificată cu numărul C(2019) 7480] (Numai textul în limba
    germană este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie Rozhodnutie Komisie (EÚ) 2019/2081 z 28. novembra 2019, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje
    povolenie uviesť na trh výrobky, ktoré obsahujú geneticky modifikovanú repku
    olejku T45 (ACS-BNØØ8-2) alebo sú z nej vyrobené, v dôsledku komercializácie
    tejto repky olejky v tretích krajinách do roku 2005 [oznámené pod číslom
    C(2019) 7480] (Iba nemecké znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni Sklep Komisije (EU) 2019/2081 z dne 28. novembra 2019 o obnovitvi
    odobritve dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno oljno ogrščico
    T45 (ACS-BNØØ8-2) ali so iz nje proizvedeni, zaradi trženja te oljne ogrščice
    v tretjih državah do leta 2005 v skladu z Uredbo (ES) št. 1829/2003 Evropskega
    parlamenta in Sveta (notificirano pod dokumentarno številko C(2019) 7480) (Besedilo
    v nemškem jeziku je edino verodostojno)
  type: main
