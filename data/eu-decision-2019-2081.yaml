  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2019/2081, 28. november 2019, millega pikendatakse
    geneetiliselt muundatud rapsi T45 (ACS-BNØØ8-2) sisaldavate või sellest toodetud
    kaupade turule laskmise luba vastavalt Euroopa Parlamendi ja nõukogu määrusele
    (EÜ) nr 1829/2003 seoses asjaoluga, et sellist rapsi turustati kolmandates riikides
    kuni 2005. aastani (teatavaks tehtud numbri C(2019) 7480 all) (Ainult saksakeelne
    tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2019/2081, annettu 28 päivänä
    marraskuuta 2019, muuntogeenisen rapsin T45 (ACS-BNØØ8-2) kolmansissa maissa
    vuoteen 2005 jatkuneen myynnin takia kyseistä rapsia sisältävien tai siitä
    valmistettujen tuotteiden markkinoille saattamista koskevan luvan uusimisesta
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu
    numerolla C(2019) 7480) (Ainoastaan saksankielinen teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/2081 оd 28. studenoga 2019. o produljenju
    odobrenja za stavljanje na tržište proizvoda koji sadržavaju genetski modificiranu
    uljanu repicu T45 (ACS-BNØØ8-2) ili su proizvedeni od nje, zbog stavljanja te
    uljane repice na tržište u trećim zemljama do 2005., u skladu s Uredbom (EZ)
    br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2019) 7480) (Vjerodostojan je samo tekst na njemačkom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/2081 végrehajtási határozata (2019. november
    28.) a harmadik országokban 2005-ig értékesített, géntechnológiával módosított
    T45 olajrepcét (ACS-BNØØ8-2) tartalmazó vagy abból előállított termékek
    forgalomba hozatalára vonatkozó engedélynek az 1829/2003/EK európai parlamenti
    és tanácsi rendelet szerinti megújításáról (az értesítés a C(2019) 7480.
    számú dokumentummal történt) (Csak a német nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/2081 della Commissione del 28 novembre
    2019 che rinnova l’autorizzazione all’immissione in commercio di prodotti
    contenenti o derivati da colza T45 geneticamente modificata (ACS-BNØØ8-2) risultato
    della commercializzazione di tale colza nei paesi terzi fino al 2005, a norma
    del regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata
    con il numero C(2019) 7480] (Il testo in lingua tedesca è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/2081 (2019. gada 28. novembris),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kuri satur ģenētiski modificētu eļļas rapsi
    T45 (ACS-BNØØ8-2) vai ir ražoti no tā un kuri iegūti saistībā ar šā eļļas
    rapša tirdzniecību trešās valstīs pirms 2005. gada (izziņots ar dokumenta
    numuru C(2019) 7480) (Autentisks ir tikai teksts vācu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos Įgyvendinimo Sprendimas (ES) 2019/2081 2019 m. lapkričio 28
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 pratęsiamas
    leidimas pateikti rinkai produktus, kurių sudėtyje yra trečiosiose valstybėse
    iki 2005 m. komercializuotų genetiškai modifikuotų rapsų T45 (ACS-BNØØ8-2)
    arba kurie iš jų pagaminti (pranešta dokumentu Nr. C(2019) 7480) (Tekstas autentiškas
    tik vokiečių kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni Ta’ Implimentazzjoni Tal-Kummissjoni (UE) 2019/2081 tat-28
    ta’ Novembru 2019 li ġġedded l-awtorizzazzjoni għat-tqegħid fis-suq ta’
    prodotti li fihom iż-żrieragħ tal-kolza T45 ġenetikament modifikati jew li
    huma magħmulin minnhom (ACS-BNØØ8-2) li jirriżultaw mit-tqegħid fis-suq ta’
    dawn iż-żrieragħ tal-kolza f’pajjiżi terzi sal-2005 skont ir-Regolament
    (KE) Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill (notifikata bid-dokument
    X(2019) 7480) (It-test bil-Ġermaniż biss huwa awtentiku)
  type: main
