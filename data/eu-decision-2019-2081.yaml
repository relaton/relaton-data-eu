title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/2081 of 28 November 2019 renewing
    the authorisation for the placing on the market of products containing or produced
    from genetically modified oilseed rape T45 (ACS-BNØØ8-2), resulting from the
    commercialisation of this oilseed rape in third countries until 2005, pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2019) 7480) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2019/2081 de la Commission du 28 novembre
    2019 renouvelant l’autorisation de mise sur le marché de produits contenant
    du colza T45 (ACS-BNØØ8-2) génétiquement modifié ou produits à partir de
    celui-ci, à la suite de sa commercialisation dans des pays tiers jusqu’en 2005,
    en application du règlement (CE) no 1829/2003 du Parlement européen et du Conseil
    [notifiée sous le numéro C(2019) 7480] (Le texte en langue allemande est le
    seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/2081 der Kommission vom 28. November
    2019 zur Erneuerung der Zulassung des Inverkehrbringens von Erzeugnissen, die
    die genetisch veränderte Ölrapssorte T45 (ACS-BNØØ8-2), welche in Drittländern
    bis 2005 vermarktet wurde, enthalten oder aus dieser gewonnen wurden, gemäß
    der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt
    gegeben unter Aktenzeichen C(2019) 7480) (Nur der deutsche Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2019/2081 на Комисията
    от 28 ноември 2019 година за подновяване на разрешението
    за пускане на пазара на продукти, съдържащи
    или произведени от генетично модифицирана
    маслодайна рапица Т45 (ACS-BNØØ8-2), в резултат на
    търговското разпространение на тази маслодайна
    рапица в трети държави до 2005 г. съгласно Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер С(2019) 7480) (само текстът
    на немски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/2081 ze dne 28. listopadu 2019
    o obnovení povolení pro uvádění produktů, které obsahují geneticky modifikovanou
    řepku olejnou T45 (ACS-BNØØ8-2) nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 v důsledku obchodování s touto
    řepkou olejnou ve třetích zemích do roku 2005 (oznámeno pod číslem C(2019)
    7480) (Pouze německé znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/2081 af 28. november
    2019 om forlængelse af tilladelsen til markedsføring af produkter, der indeholder
    eller er fremstillet af genetisk modificeret T45-raps (ACS-BNØØ8-2), i henhold
    til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 som følge af
    handelen med denne raps i tredjelande indtil 2005 (meddelt under nummer C(2019)
    7480) (Kun den tyske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2019/2081 της Επιτροπής
    της 28ης Νοεμβρίου 2019 για την ανανέωση της έγκρισης
    διάθεσης στην αγορά προϊόντων που περιέχουν
