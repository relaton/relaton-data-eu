  script: Latn
  content: Council Decision (EU) 2017/1947 of 23 October 2017 establishing the position
    to be taken on behalf of the European Union within the Joint Committee set up
    under the Agreement between the European Union and the Republic of Armenia on
    the facilitation of the issuance of visas, with regard to the adoption of common
    guidelines for the implementation of that Agreement
