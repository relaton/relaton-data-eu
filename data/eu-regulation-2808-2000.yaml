    schapenvlees en geitenvlees van de GN-codes 01041030, 01041080, 01042010, 01042090
    en 0204 en houdende afwijking van Verordening (EG) nr. 1439/95 tot vaststelling
    van bepalingen van Verordening (EEG) nr. 3013/89 van de Raad inzake de invoer
    en de uitvoer van producten van de sector schapen- en geitenvlees
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2808/2000 da Comissão, de 21 de Dezembro de 2000,
    que abre contingentes pautais comunitários, relativos a 2001, para ovinos e caprinos
    e as carnes de ovino e caprino dos códigos NC 01041030, 01041080, 01042010, 01042090
    e 0204 e derroga o Regulamento (CE) n.o 1439/95 que estabelece normas de execução
    do Regulamento (CE) n.o 3013/89 do Conselho no respeitante à importação e exportação
    de produtos do sector das carnes de ovino e caprino
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2808/2000 de la Comisión, de 21 de diciembre de 2000,
    que abre, para el año 2001, los contingentes arancelarios comunitarios de ovejas
    y cabras y de carne de ovino y caprino de los códigos NC 01041030, 01041080,
    01042010, 01042090 y 0204 y que dispone una excepción al Reglamento (CE) nº
    1439/95 por el que se establecen disposiciones de aplicación del Reglamento (CEE)
    nº 3013/89 del Consejo, en lo relativo a la importación y exportación de productos
    del sector de la carne de ovino y caprino
  type: main
- language: sv
  script: Latn
