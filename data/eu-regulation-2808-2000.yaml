title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2808/2000 of 21 December 2000 opening Community
    tariff quotas for 2001 for sheep, goats, sheepmeat and goatmeat falling within
    CN codes 01041030, 01041080, 01042010, 01042090 and 0204 and derogating from Regulation
    (EC) No 1439/95 laying down detailed rules for the application of Council Regulation
    (EEC) No 3013/89 as regards the import and export of products in the sheepmeat
    and goatmeat sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2808/2000 de la Commission du 21 décembre 2000 portant
    ouverture de contingents tarifaires communautaires au titre de l'année 2001 pour
    les animaux vivants des espèces ovine et caprine et pour la viande des animaux
    des espèces ovine et caprine relevant des codes NC 01041030, 01041080, 01042010,
    01042090 et 0204, et portant dérogation au règlement (CE) nº 1439/95 établissant
    les modalités d'application du règlement (CEE) nº 3013/89 du Conseil en ce
    qui concerne l'importation et l'exportation de produits du secteur des viandes
    ovine et caprine
  type: main
- language: de
  script: Latn
