    für 2001 zur Abweichung von der Verordnung (EG) Nr. 1439/95 zur Durchführung
    der Verordnung (EWG) Nr. 3013/89 des Rates hinsichtlich der Einfuhr und Ausfuhr
    von Schaf- und Ziegenfleischerzeugnissen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2808/2000 af 21. december 2000 om åbning
