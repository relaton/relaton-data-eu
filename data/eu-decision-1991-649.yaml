  script: Latn
  content: '91/649/EEC: Commission Decision of 10 December 1991 on the establishment
    of an addendum to the Community support framework for Community structural assistance
    in Spain (Andalucía, Asturias, Castilla y León, Castilla-La Mancha, Comunidad
    Valenciana, Extremadura, Galicia, Canarias, Murcia, Ceuta y Melilla) on the improvement
    of the conditions under which agricultural products are processed and marketed
    (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/649/CEE: Décision de la Commission du 10 décembre 1991 concernant
    l''établissement de l''avenant au cadre communautaire d''appui pour les interventions
    structurelles communautaires en Espagne (l''Andalousie, les Asturies, la Castille-Léon,
    la Castille-la-Manche, Valence, l''Estrémadure, la Galice, les Canaries, la Murcie,
    Ceuta et Melilla) en matière d''amélioration des conditions de transformation
    et de commercialisation des produits agricoles (Le texte en langue espagnole est
    le seul faisant foi.)'
  type: main
- language: de
