title:
- language: fr
  script: Latn
  content: Décision 67/288/CEE de la Commission, du 20 avril 1967, autorisant la
    République fédérale d'Allemagne, en vertu de l'article 115 alinéa 1 du Traité,
    à exclure du traitement communautaire certains produits en porcelaine et en autres
    matières céramiques de la position Ex 69.11 et 69.13 B et Ex C du Tarif douanier
    commun, originaires de la République populaire de Chine et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '67/288/EWG: Entscheidung der Kommission vom 20. April 1967 zur Ermächtigung
    der Bundesrepublik Deutschland gemäß Artikel 115 Absatz (1) des Vertrages, bestimmte
    Waren aus Porzellan und anderen keramischen Stoffen der Tarifnummern ex 69.11
    und 69.13 B und ex C des Gemeinsamen Zolltarifs, die aus der Volksrepublik China
    stammen und in den übrigen Mitgliedstaaten in den freien Verkehr gebracht wurden,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/288/CEE: Decisione della Commissione, del 20 aprile 1967, che autorizza
    la Repubblica federale di Germania, in virtù dell''articolo 115, comma 1, del
    Trattato, ad escludere dal trattamento comunitario taluni prodotti di porcellana
    e di altre materie ceramiche delle voci ex 69.11 e 69.13 B e ex C della tariffa
    doganale comune, originari della Repubblica popolare cinese e immessi in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/288/EEG: Beschikking van de Commissie van 20 april 1967 waarbij de
    Bondsrepubliek Duitsland wordt gemachtigd om, op grond van artikel 115, eerste
    alinea, van het Verdrag, bepaalde produkten van porselein en van andere keramische
    stoffen, van posten ex 69.11 en 69.13 B en ex C van het gemeenschappelijk douanetarief,
    van oorsprong uit de Chinese Volksrepubliek en in de andere Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
