title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3740/89 of 13 December 1989 re-establishing
    the levying of customs duties on yarn of artificial filaments (continuous) not
    put up for retail sale; other than yarn of category 42, products of category 127
    a (order No 42.1271), originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3740/89 de la Commission du 13 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques et artificielles continues, non conditionnés pour
    la vente au détail, autres que ceux de la catégorie de produits n° 42, de la
    catégorie de produits n° 127 à (numéro d'ordre 42.1271) originaires de l'Inde,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3740/89 DER KOMMISSION vom 13. Dezember 1989 zur Wiedereinfuehrung
    des Zollsatzes fuer synthetische und kuenstliche Spinnfaeden, nicht in Aufmachungen
    fuer den Einzelverkauf, andere als die der Kategorie 42, der Warenkategorie Nr.
    127 A (lfd. Nr. 42.1271) mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 4259/88 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3740/89 af 13. december 1989 om genindførelse
    af opkrævning af toldafgifter for garn af endeløse kemofibre (sammenhængende),
    ikke i detailsalgsoplægninger, undtagen garn henhørende under kategori 42, under
    varekategori nr. 127 A (løbenummer 42.1271), som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3740/89 της Επιτροπής
    της 13ης Δεκεμβρίου 1989 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για νήματα
    από ίνες συνθετικές συνεχείς, μη συσκευασμένα
    για τη λιανική πώληση, άλλα από τα νήματα της
    κατηγορίας 42, προϊόντα της κατηγορίας 127Α (
    αύξων αριθμός 42.127 ), καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    4259/88 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3740/89 DELLA COMMISSIONE del 13 dicembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili ai filati di filamenti
    artificiali (diversi dai filati per cucire) non condizionati per la vendita al
    minuto, diversi dai filati della categoria 42, della categoria di prodotti n.
    127 A (numero d'ordine 42.1271) originari dell'India beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 4259/88 del Consiglio
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3740/89 VAN DE COMMISSIE van 13 december 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    synthetische of van kunstmatige continuvezels, niet opgemaakt voor de verkoop
    in het klein, andere dan die van categorie 42, van de categorie van produkten
    nr. 127 A (volgnummer 42.1271), van oorsprong uit India, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 4259/88 van de
    Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3740/89 DA COMISSÃO de 13 de Dezembro de 1989 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos fios de fibras
    têxteis sintéticas e artificiais, contínuas, não acondicionadas para venda
    a retalho, com excepção dos da categoria 42, da categoria de produtos 127 A
    (número de ordem 42.1271), originários da Índia, beneficiária das preferências
    pautais previstas no Regulamento (CEE) nº 4259/88 do Conselho #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3740/89 DE LA COMISION de 13 de diciembre de 1989 relativo
    al establecimiento de la recaudacion de los derechos arancelarios aplicables a
    los hilados de filamentos artificiales (continuos), sin acondicionar para la venta
    al por menor, que no sean los de la categoria 42 de la categoria de productos
    no 127 A (numero de orden 42.1271) originarios de la India beneficiaria de las
    preferencias arancelarias previstas por el Reglamento (CEE) no 4259/88 del Consejo
