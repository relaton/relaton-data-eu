title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 348/83 of 10 February 1983 imposing a provisional
    anti-dumping duty on imports of hexamethylenetetramine originating in the German
    Democratic Republic and the Soviet Union, and accepting undertakings and terminating
    the proceeding in respect of imports of hexamethylenetetramine originating in
    Czechoslovakia and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 348/83 de la Commission du 10 février 1983 instituant
    un droit anti-"dumping" provisoire sur les importations d' hexaméthylènetétramine
    originaire de République démocratique allemande et d' Union soviétique, d'
    une part, et portant acceptation d' engagements et clôture de la procédure concernant
    les importations d' hexaméthylènetétramine originaire de Tchécoslovaquie et
    de Roumanie, d' autre part
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 348/83 der Kommission vom 10. Februar 1983 über die
    Festsetzung eines vorläufigen Antidumpingzolls auf die Einfuhren von Hexamethylentetramin
    mit Ursprung in der Deutschen Demokratischen Republik und der Sowjetunion, die
    Annahme von Verpflichtungen und die Einstellung des Verfahrens betreffend die
    Einfuhren von Hexamethylentetramin mit Ursprung in der Tschechoslowakei und Rumänien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 348/83 af 10. februar 1983 om indførelse
    af en midlertidig antidumpingtold på importen af hexamethylentetramin med oprindelse
    i Den tyske demokratiske Republik og Sovjetunionen, om godtagelse af tilsagn og
    om afslutning af proceduren vedrørende importen af hexamethylentetramin med oprindelse
    i Tjekkoslovakiet og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 348/83 της Επιτροπής
    της 10ης Φεβρουαρίου 1983 περί επιβολής προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές εξαμεθυλενοτετραμίνης
    καταγωγής Λαϊκής Δημοκρατίας της Γερμανίας
    και Σοβιετικής Ένωσης, και αποδοχής αναλήψεως
    υποχρεώσεων και ολοκλήρωσης της διαδικασίας
    όσον αφορά τις εισαγωγές εξαμεθυλενοτετραμίνης
    καταγωγής Τσεχοσλοβακίας και Ρουμανίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 348/83 della Commissione del 10 febbraio 1983 che
    istituisce un dazio antidumping provvisorio sulle importazioni di esametilentetrammina
    originaria della Repubblica democratica tedesca e dell' Unione Sovietica, e che
    accetta gli impegni e che conclude la procedura relativa alle importazioni di
    esametilentetrammina originaria della Cecoslovacchia e della Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 348/83 van de Commissie van 10 februari 1983 tot
    instelling van een voorlopig anti-dumpingrecht op de invoer van hexamethyleentetramine
    van oorsprong uit de Duitse Democratische Republiek en de Sovjetunie en aanvaarding
    van verbintenissen en beëindiging van de procedure inzake de invoer van hexamethyleentetramine
    van oorsprong uit Tsjechoslowakije en Roemenië
