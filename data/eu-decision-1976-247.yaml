id: EUDecision1976247
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 23 December 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to certain under garments, knitted or crocheted, not elastic
    or rubberized, other than shirts, falling within heading No ex 60.04, originating
    in Taiwan and in free circulation in the French Republic
  type: main
- language: fr
  script: Latn
  content: '76/247/CEE: Décision de la Commission, du 23 décembre 1975, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire certains sous-vêtements de bonneterie
    non élastique ni caoutchoutée autres que chemises et chemisettes, de la position
    Ex 60.04 du Tarif douanier commun, originaires de Taiwan et mis en libre pratique
    en France'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Dezember 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in Frankreich im freien Verkehr befindliche Unterkleidung
    aus Gewirken, weder gummielastisch noch kautschutiert, andere als Hemden, der
    Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. december 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage underbeklædningsgenstande af trikotage, ikke elastisk eller gummeret,
    undtagen skjorter, herunder sports- og arbejdsskjorter, som henhører under pos.
    ex 60.04 i den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes
    i Frankrig
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 dicembre 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario talune sottovesti a maglia non elastica né gommata,
    diverse dalle camicie e dalle camicette, della voce ex 60.04 della tariffa doganale
    comune, originarie di Taiwan e messe in libera pratica in Francia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 december 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden, worden
    gemachtigd bepaalde onderkleding van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk andere dan overhemden, van post ex 60.04 van het gemeenschappelijk
    douanetarief, van oorsprong uit Taiwan en in Frankrijk in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
