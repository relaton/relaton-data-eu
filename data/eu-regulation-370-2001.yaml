title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 370/2001 of 23 February 2001 repealing Regulation
    (EC) No 273/98 opening and providing for the administration of Community tariff
    quotas and tariff ceilings and establishing a Community surveillance of reference
    quantities for certain products originating in the Former Yugoslav Republic of
    Macedonia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 370/2001 de la Commission du 23 février 2001 abrogeant
    le règlement (CE) n° 273/98 portant ouverture et mode de gestion de contingents
    tarifaires communautaires et de plafonds tarifaires, et établissant une surveillance
    communautaire de quantités de référence pour certains produits originaires
    de l'ancienne République yougoslave de Macédoine
  type: main
- language: de
  script: Latn
