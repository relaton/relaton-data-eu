title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2108/2004 of 10 December 2004 amending Commission
    Regulation (EC) No 1420/2004 determining the extent to which applications for
    import rights lodged in respect of the quota for frozen meat of bovine animals,
    provided for in Regulation (EC) No 1203/2004, can be accepted and providing for
    the administrative rules for the allocation of certain import rights
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2108/2004 de la Commission du 10 décembre 2004 modifiant
    le règlement (CE) n° 1420/2004 de la Commission déterminant dans quelle mesure
    il peut être donné suite aux demandes de droits d'importation déposées pour
    le contingent de viandes bovines congelées, prévu par le règlement (CE) n°
    1203/2004, et établissant les règles de gestion applicables à l'attribution
    de certains droits d'importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2108/2004 der Kommission vom 10. Dezember 2004 zur
    Änderung der Verordnung (EG) Nr. 1420/2004 zur Bestimmung des Umfangs, in welchem
    den Anträgen auf Einfuhrrechte für das gemäß der Verordnung (EG) Nr. 1203/2004
    vorgesehene Kontingent für gefrorenes Rindfleisch stattgegeben werden kann, und
    zur Festlegung der Verwaltungsvorschriften für die Zuteilung bestimmter Einfuhrrechte
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2108/2004 ze dne 10. prosince 2004, kterým
    se mění nařízení Komise (ES) č. 1420/2004, kterým se stanoví, do jaké
    míry lze vyhovět žádostem o dovozní práva podaným pro kvóty pro zmrazené
    hovězí maso podle nařízení (ES) č. 1203/2004, a kterým se stanoví správní
    pravidla pro přidělení některých dovozních práv
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2108/2004 af 10. december 2004 om ændring
    af Kommissionens forordning (EF) nr. 1420/2004 om fastsættelse af, i hvilket
    omfang ansøgningerne om importrettigheder for frosset oksekød under det kontingent,
    som er fastsat i forordning (EF) nr. 1203/2004, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2108/2004 της Επιτροπής,
    της 10ης Δεκεμβρίου 2004, για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1420/2004 για να καθοριστεί
    σε ποιο βαθμό μπορεί να δοθεί συνέχεια στις
    αιτήσεις για δικαιώματα εισαγωγής που έχουν
    υποβληθεί για την ποσόστωση βάσει του κανονισμού
