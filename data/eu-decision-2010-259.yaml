title:
- language: en
  script: Latn
  content: '2010/259/: Commission Decision of 4 May 2010 authorising the French Republic
    to conclude an agreement with the Principality of Monaco for transfers of funds
    between the French Republic and the Principality of Monaco to be treated as transfers
    of funds within the French Republic, pursuant to Regulation (EC) No 1781/2006
    of the European Parliament and of the Council (notified under document C(2010)
    2634)'
  type: main
- language: fr
  script: Latn
  content: '2010/259/: Décision de la Commission du 4 mai 2010 autorisant la République
    française à conclure un accord avec la Principauté de Monaco pour que les virements
    de fonds entre la République française et la Principauté de Monaco soient traités
    comme des virements de fonds à l’intérieur de la République française, conformément
    au règlement (CE) n o 1781/2006 du Parlement européen et du Conseil [notifiée
    sous le numéro C(2010) 2634]'
  type: main
- language: de
  script: Latn
  content: '2010/259/: Beschluss der Kommission vom 4. Mai 2010 zur Ermächtigung
    der Französischen Republik gemäß der Verordnung (EG) Nr. 1781/2006 des Europäischen
    Parlaments und des Rates, eine Vereinbarung mit dem Fürstentum Monaco zu schließen,
    damit Geldtransfers zwischen der Französischen Republik und dem Fürstentum Monaco
    wie innerfranzösische Geldtransfers behandelt werden können (Bekannt gegeben
    unter Aktenzeichen K(2010) 2634)'
