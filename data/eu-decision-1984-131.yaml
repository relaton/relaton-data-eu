  content: '84/131/EEC: Commission Decision of 5 March 1984 accepting an undertaking
    in connection with the anti-dumping proceeding concerning imports of certain synthetic
    fibre hand-knitting yarn originating in Turkey and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '84/131/CEE: Décision de la Commission du 5 mars 1984 portant acceptation
    d'' un engagement souscrit dans le cadre de la procédure anti-dumping concernant
    les importations de certains fils à tricoter à la main, constitués de fibres
    textiles synthétiques, originaires de Turquie, et portant clôture de la procédure'
  type: main
- language: de
