title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 octobre 1969, modifiant la décision
    du 10 octobre 1969 fixant les montants compensatoires maxima que la République
    fédérale d'Allemagne est autorisée à percevoir lors de l'importation de certains
    produits
  type: main
- language: de
  script: Latn
  content: '69/353/EWG: Entscheidung der Kommission vom 17. Oktober 1969 zur Änderung
    der Entscheidung vom 10. Oktober 1969 zur Festsetzung der Höchstausgleichsbeträge,
    die die Bundesrepublik Deutschland bei der Einfuhr bestimmter Erzeugnisse zu erheben
    berechtigt ist'
  type: main
- language: it
  script: Latn
  content: '69/353/CEE: Decisione della Commissione, del 17 ottobre 1969, che modifica
    la decisione del 10 ottobre 1969 con cui vengono fissati gli importi compensativi
    massimi che la Repubblica federale di Germania è autorizzata a riscuotere sull''importazione
    di determinati prodotti'
  type: main
- language: nl
  script: Latn
  content: '69/353/EEG: Beschikking van de Commissie van 17 oktober 1969 houdende
    wijziging van de beschikking van 10 oktober 1969 tot vaststelling van de maximale
    compenserende bedragen welke de Bondsrepubliek Duitsland bij de invoer van bepaalde
    produkten mag heffen'
