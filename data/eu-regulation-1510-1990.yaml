    Tatbestaende im Sektor Obst und Gemuese hinsichtlich der Grund- und Ankaufspreise
    fuer Blumenkohl im Wirtschaftsjahr 1990/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1510/90 af 1. juni 1990 om undtagelse
    for produktionsåret 1990/91 fra forordning (EØF) nr. 3322/89 om fastsættelse
