    van 27 juli 1971 houdende ontheffing van de verbodsbepaling ten aanzien van overeenkomsten
    betreffende specialisatie in de walsstaalproduktie en de gemeenschappelijke inkoop
    van ijzererts tussen ondernemingen in de Zuidwestduitse staalindustrie
