  content: Commission Decision of 13 February 1976 extending for six months Decision
    71/315/ECSC of 27 July 1971 authorizing specialization agreements covering the
    manufacture of rolled steel products and the joint buying of iron ore between
    steel undertakings in south-western Germany
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 février 1976, relative à la prorogation
    pour une période de six mois de la décision 71/315/CECA, du 27 juillet 1971,
    autorisant des accords de spécialisation entre des industries sidérurgiques
    du Sud-Ouest de l'Allemagne pour la production d'acier laminé et l'achat en commun
    de minerai de fer
  type: main
- language: de
  script: Latn
