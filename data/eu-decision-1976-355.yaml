    um sechs Monate der Entscheidung 71/315/EGKS vom 27. Juli 1971 über die Genehmigung
    von Vereinbarungen über Spezialisierung in der Walzstahlproduktion und gemeinsamen
    Einkauf von Eisenerz zwischen Unternehmen der südwestdeutschen Stahlindustrie
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 13. februar 1976 om forlængelse for en periode
