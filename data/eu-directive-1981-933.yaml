    w międzynarodowym ruchu pasażerskim oraz w przywozie małych partii towarów
    o charakterze niehandlowym z państw trzecich
  type: main
- language: pt
  script: Latn
  content: Directiva 81/933/CEE do Conselho, de 17 de Novembro de 1981, que altera
    as Directivas 69/169/CEE e 78/1035/CEE no que diz respeito às franquias fiscais
    aplicáveis no tráfego internacional de viajantes e na importação de mercadorias
    que sejam objecto de pequenas remessas sem carácter comercial provenientes de
    países terceiros
  type: main
- language: sk
  script: Latn
  content: Smernica Rady zo 17. novembra 1981, ktorou sa menia a dopĺňajú smernice
    69/169/EHS a 78/1035/EHS pokiaľ ide o daňové úľavy uplatňované v medzinárodnej
    preprave a na dovozy malých zásielok tovarov nekomerčného charakteru z tretích
    krajín
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 17. novembra 1981 o spremembi direktiv 69/169/EGS
