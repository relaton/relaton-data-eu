id: EUDecision1996165
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '96/165/Euratom, EC: Commission Decision of 7 February 1996 amending Decision
    92/164/Euratom, EEC authorizing Portugal not to take into account certain categories
    of transactions and to use certain approximate estimates for the calculation of
    the VAT own resources base (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/165/Euratom, CE: Décision de la Commission, du 7 février 1996, modifiant
    la décision 92/164/Euratom, CEE autorisant le Portugal à ne pas tenir compte
    de certaines catégories d''opérations ou à utiliser certaines estimations approximatives
    pour le calcul de la base des ressources propres provenant de la taxe sur la valeur
    ajoutée (Le texte en langue portugaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '96/165/Euratom, EG: Entscheidung der Kommission vom 7. Februar 1996 zur
    Änderung der Entscheidung 92/164/Euratom, EWG, mit der Portugal ermächtigt wird,
    bei der Berechnung der Grundlage für die MwSt.- Eigenmittel bestimmte Gruppen
    von Umsätzen nicht zu berücksichtigen und die Grundlage bei bestimmten anderen
    Gruppen von Umsätzen anhand näherer Schätzungen zu ermitteln (Nur der portugiesische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/165/Euratom, EF: Kommissionens beslutning af 7. februar 1996 om ændring
    af beslutning 92/164/Euratom, EØF om bemyndigelse af Portugal til at beregne
    grundlaget for Fællesskabernes momsindtægter på basis af en tilnærmelsesvis
    vurdering af momsgrundlaget for visse transaktioner (Kun den portugisiske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/165/Ευρατόμ, ΕΚ: Απόφαση της Επιτροπής,
    της 7ης Φεβρουαρίου 1996, για την τροποποίηση
    της απόφασης 92/164/Ευρατόμ, ΕΟΚ, με την οποία
    επιτρέπεται στην Πορτογαλία να μην λαμβάνει
    υπόψη ορισμένες κατηγορίες δραστηριοτήτων
    και να χρησιμοποιεί κατά προσέγγιση εκτιμήσεις
    κατά τον υπολογισμό της βάσης των ιδίων πόρων
    που προέρχονται από το φόρο επί της προστιθέμενης
    αξίας (Το κείμενο στην πορτογαλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/165/Euratom, EY: Komission päätös, tehty 7 päivänä helmikuuta
    1996, luvan antamisesta Portugalille olla ottamatta huomioon eräitä toimiluokkia
    tai käyttää eräitä likimääräisiä arvioita arvonlisäverosta kertyvien
    omien varojen perustan laskemiseksi tehdyn päätöksen 92/164/Euratom, ETY muuttamisesta
    (Ainoastaan portugalinkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/165/Euratom, CE: Decisione della Commissione, del 7 febbraio 1996,
    che modifica la decisione 92/164/Euratom, CEE che autorizza la Repubblica portoghese
    a non tener conto di determinate categorie di operazioni e a ricorrere a talune
    valutazioni approssimative per il calcolo della base delle risorse proprie provenienti
    dall''imposta sul valore aggiunto (Il testo in lingua portoghese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '96/165/Euratom, EG: Beschikking van de Commissie van 7 februari 1996 tot
    wijziging van Beschikking 92/164/Euratom, EEG, waarbij Portugal wordt gemachtigd
    geen rekening te houden met bepaalde categorieën handelingen en gebruik te maken
    van ramingen voor de berekening van de grondslag van de eigen middelen uit de
    belasting over de toegevoegde waarde (Slechts de tekst in de Portugese taal is
    authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/165/Euratom, CE: Decisão da Comissão, de 7 de Fevereiro de 1996,
    que altera a Decisão 92/164/Euratom, CEE, que autoriza Portugal a não ter em
    conta certas categorias de operações e a utilizar determinadas estimativas aproximativas
    para o cálculo da matéria colectável dos recursos próprios provenientes do
    imposto sobre o valor acrescentado (Apenas faz fé o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '96/165/Euratom, CE: Decisión de la Comisión, de 7 de febrero de 1996,
    por la que se modifica la Decisión 92/164/Euratom, CEE, por la que se autoriza
    a Portugal a no tomar en consideración determinadas categorías de operaciones
    y a utilizar estimaciones aproximadas para el cálculo de la base de los recursos
    propios procedentes del impuesto sobre el valor añadido (El texto en lengua portuguesa
    es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '96/165/Euratom, EG: Kommissionens beslut av den 7 februari 1996 om ändring
    av beslut 92/164/Euratom, EEG, som bemyndigar Portugal att inte beakta vissa kategorier
    av transaktioner eller att använda vissa ungefärliga uppskattningar vid beräkning
    av den bas av egna medel som härrör från mervärdeskatten (Endast den portugisiska
    texten är giltig)'
  type: main
