title:
- language: en
  script: Latn
  content: '82/823/EEC: Commission Decision of 19 November 1982 authorizing the French
    Republic to apply intra-Community surveillance to imports of T-shirts, originating
    in Turkey, which have been put into free circulation in the Community (Only the
    French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/823/CEE: Décision de la Commission, du 19 novembre 1982, autorisant
    la République française à instaurer une surveillance intra-communautaire à
    l''égard des importations de "T-shirts" originaires de Turquie et mis en libre
    pratique dans la Communauté (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '82/823/EWG: Entscheidung der Kommission vom 19. November 1982 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus der Türkei stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen T-Shirts (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/823/EØF: Kommissionens beslutning af 19. november 1982 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af T-shirts med oprindelse i Tyrkiet og overgået til fri omsætning i en anden
    medlemsstat (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/823/EOK: Απόφαση τής Επιτροπής τής 19ης Νοεμβρίου
    1982 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    γιά τήν καθιέρωση ενδοκοινοτικής επίβλεψης
    τών εισαγωγών T- shirts καταγωγής Τουρκίας πού
    έχουν τεθεί σέ ελεύθερη κυκλοφορία στήν Κοινότητα
    (Το κείμενο στην γαλλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/823/CEE: Decisione della Commissione, del 19 novembre 1982, che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria sulle importazioni
    di T-shirts originari della Turchia e immessi in libera pratica nella Comunità
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/823/EEG: Beschikking van de Commissie van 19 november 1982 houdende
    machtiging van de Franse Republiek tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van T-shirts, van oorsprong uit Turkije, die in de Gemeenschap
    in het vrije verkeer zijn gebracht (Slechts de tekst in de Franse taal is authentiek)'
