title:
- language: en
  script: Latn
  content: '81/85/EEC: Commission Decision of 29 January 1981 authorizing the Italian
    Republic to take intra-Community surveillance measures in respect of imports of
    bananas originating in certain third countries and put into free circulation in
    the other Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/85/CEE: Décision de la Commission, du 29 janvier 1981, autorisant
    la République italienne à prendre des mesures de surveillance intracommunautaire
    à l''égard des importations de bananes originaires de certains pays tiers et
    mises en libre pratique dans les autres Etats membres (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/85/EWG: Entscheidung der Kommission vom 29. Januar 1981, mit der die
    Italienische Republik zu innergemeinschaftlichen Überwachungsmaßnahmen hinsichtlich
    der Einfuhr von Bananen ermächtigt wird, die in bestimmten Drittländern ihren
    Ursprung haben und sich in den übrigen Mitgliedstaaten im freien Verkehr befinden
    (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/85/EØF: Kommissionens beslutning af 29. januar 1981 om bemyndigelse
    af Den italienske Republik til at træffe foranstaltninger med henblik på tilsyn
    inden for Fællesskabet med indførsel af bananer, der har oprindelse i visse
    tredjelande, og som er overgået til fri omsætning i de øvrige medlemsstater
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/85/ΕΟΚ: Απόφαση τής Επιτροπής τής 29ης Ιανουαρίου
    1981 περί εξουσιοδοτήσεως τής Ιταλικής Δημοκρατίας
    νά λαμβάνει μέτρα ενδοκοινοτικής εποπτείας
    γιά τίς εισαγωγές μπανανών πού κατάγονται
    από ορισμένες τρίτες χώρες καί τίθενται σέ
    ελεύθερη κυκλοφορία στά άλλα Κράτη μέλη (Το
    κείμενο στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/85/CEE: Decisione della Commissione, del 29 gennaio 1981, che autorizza
    la Repubblica italiana a istituire una sorveglianza intracomunitaria sulle importazioni
    di banane originarie di taluni paesi terzi e immesse in libera pratica in altri
    Stati membri (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/85/EEG: Beschikking van de Commissie van 29 januari 1981 waarbij de
    Italiaanse Republiek wordt gemachtigd maatregelen inzake intracommunautair toezicht
    te treffen ten aanzien van de invoer van bananen van oorsprong uit bepaalde derde
    landen en in de andere Lid-Staten in het vrije verkeer gebracht (Slechts de tekst
    in de Italiaanse taal is authentiek)'
  type: main
