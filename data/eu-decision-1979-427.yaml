type: standard
title:
- language: en
  script: Latn
  content: '79/427/EEC: Commission Decision of 11 April 1979 authorizing the United
    Kingdom not to apply Community treatment to men''s and boys''woven breeches, shorts
    and trousers (including slacks) ; women''s, girls''and infants''woven trousers
    and slacks, of wool, cotton or man-made textile fibres, falling within heading
    No ex 61.01 and subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes
    61.01-62, 64, 66, 72, 74, 76 ; 61.02-66, 68, 72) (category 6), originating in
    the Philppines and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/427/CEE: Décision de la Commission, du 11 avril 1979, autorisant le
    Royaume-Uni à exclure du traitement communautaire les culottes, "shorts" et pantalons
    tissés pour hommes et garçonnets; les pantalons tissés pour femmes, fillettes
    et jeunes enfants, de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    de la position ex 61.01 et de la sous-position 61.02 B du tarif douanier commun
    (codes Nimexe: 61.01-62, 64, 66, 72, 74, 76; 61.02-66, 68, 72) (catégorie 6),
    originaires des Philippines et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/427/EWG: Entscheidung der Kommission vom 11. April 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus den Philippinen stammende und in
    den übrigen Mitgliedstaaten im freien Verkehr befindliche Shorts und andere kurze
    Hosen und lange Hosen, aus Geweben, für Männer und Knaben; lange Hosen aus Geweben
    für Frauen, Mädchen und Kleinkinder; aus Wolle, Baumwolle, synthetischen oder
    künstlichen Spinnstoffen, der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 61.01-62; 64; 66; 72; 74; 76 und 61.02-66; 68;
    72) (Kategorie 6) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/427/EØF: Kommissionens beslutning af 11. april 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage shorts og
    andre korte benklæder til mænd og drenge, vævede ; lange benklæder til kvinder,
    piger og småbørn, vævede, af uld, bomuld eller syntetiske eller regenererede
    fibre, som henhører under pos. ex 61.01 og ex 61.02 B i den fælles toldtarif
    (NIMEXE-nummer 61.01-62, 64, 66, 72, 74, 76 ; 61.02-66, 68, 72 ; kategori 6),
    har oprindelse i Filippinerne og frit kan omsættes i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/427/CEE: Decisione della Commissione, dell''11 aprile 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario calzoncini, shorts e pantaloni,
    tessuti, per uomo e per ragazzo, e pantaloni, tessuti, per donna, per ragazza
    e per bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali,
    della voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale comune
    (codici Nimexe: 61.01-62, 64, 66, 72, 74, 76 e 61.02-66, 68, 72) (categoria 6),
    originari delle Filippine e messi in libera pratica negli altri Stati membri (Il
    testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/427/EEG: Beschikking van de Commissie van 11 april 1979 waarbij het
    Verenigd Koninkrijk wordt gemachtigd shorts en andere korte broeken, lange broeken,
    geweven, voor heren en jongens ; lange broeken, geweven, van wol, van katoen of
    van synthetische of van kunstmatige textielvezels, voor dames, meisjes en kinderen,
    van de posten ex 61.01 en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code
    61.01-62, 64, 66, 72, 74, 76 ; 61.02-66, 68, 72) (categorie 6), van oorsprong
    uit de Filippijnen en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
