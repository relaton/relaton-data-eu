title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 678/94 of 25 March 1994 determining the extent
    to which applications for imports licences introduced under a cheese quota opened
    by the Community with Bulgaria and Romania may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 678/94 de la Commission du 25 mars 1994 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites dans
    le cadre d'un contingent de fromages ouvert par la Communauté à la Bulgarie
    et à la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 678/94 DER KOMMISSION vom 25. März 1994 zur Annahme
    der im Rahmen eines für die Einfuhr von bulgarischem und rumänischem Käse eröffneten
    Kontingents gestellten Lizenzanträge
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 678/94 af 25. marts 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres importlicensansøgninger indgivet i forbindelse
    med et ostekontingent, som Fællesskabet har åbnet for Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 678/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Μαρτίου 1994 για τον καθορισμό του βαθμού
    στον οποίο δύνανται να είναι αποδεκτές οι αιτήσεις
    για τη χορήγηση αδειών εισαγωγής, οι οποίες
    υποβάλλονται στο πλαίσιο μιας ποσόστωσης τυριών
    την οποία έχει ανοίξει η Κοινότητα για τη Βουλγαρία
    και τη Ρουμανία
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 678/94 DELLA COMMISSIONE del 25 marzo 1994 che stabilisce
    in che misura possono essere accettate le domande di titoli di importazione presentate
    nel quadro di un contingente di importazione di formaggi concesso dalla Comunità
    alla Bulgaria e alla Romania
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 678/94 VAN DE COMMISSIE van 25 maart 1994 tot vaststelling
    van de mate waarin kan worden voldaan aan de aanvragen om invoercertificaten die
    zijn ingediend in het kader van een door de Gemeenschap ten gunste van Bulgarije
    en Roemenië geopend tariefcontingent voor kaas
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 678/94 DA COMISSÃO de 25 de Março de 1994 que determina
    em que medida podem ser admitidos os pedidos de certificados de importação apresentados
    no âmbito de um contingente de queijos aberto pela Comunidade à Bulgária e
    à Roménia
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 678/94 DE LA COMISIÓN de 25 de marzo de 1994 por el
    que se determina el límite aceptable de solicitudes de certificados de importación
    presentadas al amparo del contingente de quesos asignado por la Comunidad a Bulgaria
    y Rumanía
