title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3716/91 of 17 December 1991 amending Regulation
    (EEC) No 409/86 on methods of administrative cooperation to safeguard, during
    the transitional period, the free movement of goods between the Community as constituted
    on 31 December 1985 on the one hand and Spain and Portugal on the other and between
    those two new Member States
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3716/91 DE LA COMMISSION du 17 décembre 1991 modifiant
    le règlement (CEE) no 409/86 relatif aux méthodes de coopération administrative
    destinées à assurer, pendant la période de transition, la libre circulation
    des marchandises dans les échanges entre la Communauté dans sa composition au
    31 décembre 1985, d'' une part, et l'' Espagne et le Portugal, d'' autre part,
    ainsi que dans les échanges entre ces deux nouveaux États membres #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3716/91 DER KOMMISSION vom 17. Dezember 1991 zur
    Änderung der Verordnung (EWG) Nr. 409/86 über die Methoden der Zusammenarbeit
    der Verwaltungen zur Gewährleistung des freien Warenverkehrs zwischen der Gemeinschaft
    in ihrer Zusammensetzung am 31. Dezember 1985 einerseits und Spanien und Portugal
    andererseits sowie zwischen diesen beiden neuen Mitgliedstaaten während der Übergangszeit
    #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3716/91 af 17. december 1991 om ændring
    af forordning (EØF) nr. 409/86 om metoderne for det administrative samarbejde,
    der i overgangsperioden skal sikre frie varebevægelser mellem Fællesskabet i
    dets sammensætning pr. 31. december 1985 på den ene side og Spanien og Portugal
    på den anden side, samt mellem de to nye medlemsstater indbyrdes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3716/91 της Επιτροπής
    της 17ης Δεκεμβρίου 1991 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 409/86 σχετικά με τις μεθόδους
    διοικητικής συνεργασίας οι οποίες αποσκοπούν
    στην εξασφάλιση, κατά τη διάρκεια της μεταβατικής
    περιόδου, της ελεύθερης κυκλοφορίας των εμπορευμάτων
    κατά τις συναλλαγές μεταξύ, αφενός της Κοινότητας,
    με τη σύνθεσή της στις 31 Δεκεμβρίου 1985, και
    αφετέρου της Ισπανίας και της Πορτογαλίας,
    καθώς και κατά τις συναλλαγές μεταξύ των εν
    λόγω δύο νέων κρατών μελών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 3716/91, annettu 17 päivänä joulukuuta 1991,
    hallinnollisen yhteistyön menetelmistä tavaroiden vapaan liikkumisen suojaamiseksi
    siirtymäkaudella toisaalta yhteisön, sellaisena kuin se oli 31 päivänä joulukuuta
    1985, ja toisaalta Espanjan ja Portugalin sekä näiden kahden uuden jäsenvaltion
    välisessä kauppavaihdossa annetun asetuksen (ETY) N:o 409/86 muuttamisesta
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3716/91 DELLA COMMISSIONE del 17 dicembre 1991 che
    modifica il regolamento (CEE) n. 409/86 relativo ai metodi di collaborazione amministrativa
    destinati ad attuare, nel periodo transitorio, la libera circolazione delle merci
    negli scambi tra la Comunità nella sua composizione al 31 dicembre 1985, da un
    lato, e la Spagna e il Portogallo, dall'' altro, nonché negli scambi tra questi
    due nuovi Stati membri #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3716/91 VAN DE COMMISSIE van 17 december 1991 tot
