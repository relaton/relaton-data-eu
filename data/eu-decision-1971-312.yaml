title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 27 juillet 1971, relative à l'autorisation
    d'accords de spécialisation pour la production d'acier laminé entre les sociétés
    August Thyssen-Huette AG, Fried. Krupp Huettenwerke AG, Theodor Wuppermann GmbH,
    Ibach Stahlwerke KG, Eisen- und Stahlwalzwerke Roetzel GmbH et Fuerstlich Hohenzollernsche
    Huettenverwaltung et d'accords relatifs à la vente en commun de larges bandes
    laminées à chaud et de feuillards par Thyssen et Wuppermann et de feuillards
    par Krupp et Roetzel
  type: main
- language: de
  script: Latn
  content: '71/312/EGKS: Entscheidung der Kommission vom 27. Juli 1971 über die Genehmigung
    von Vereinbarungen über Spezialisierung der Walzstahlproduktion zwischen der
    August Thyssen-Hütte AG, der Fried. Krupp Hüttenwerke AG, der Theodor Wuppermann
    GmbH, der Ibach Stahlwerke KG, der Eisen- und Stahlwalzwerke Rötzel GmbH und
    der Fürstlich Hohenzollernschen Hüttenverwaltung und über gemeinsamen Verkauf
    von Warmbreitband und Bandstahl zwischen Thyssen und Wuppermann und Bandstahl
    zwischen Krupp und Rötzel'
  type: main
- language: it
  script: Latn
  content: '71/312/CECA: Decisione della Commissione, del 27 luglio 1971, relativa
    all''autorizzazione di accordi per la specializzazione della produzione di acciai
    laminati, conclusi fra le imprese August Thyssen-Hütte AG, Fried. Krupp Hüttenwerke
    AG, Theodor Wuppermann GmbH, Ibach Stahlwerke KG, Eisen- und Stahlwalzwerke Rötzel
    GmbH, e Fürstlich Hohenzollernsche Hüttenverwaltung e di accordi per la vendita
    in comune di larghi nastri laminati a caldo e di nastri fra le imprese Thyssen
    e Wuppermann e di nastri fra le imprese Krupp e Rötzel'
  type: main
- language: nl
  script: Latn
  content: '71/312/EGKS: Beschikking van de Commissie van 27 juli 1971 houdende ontheffing
    van de verbodsbepaling ten aanzien van overeenkomsten tot specialisatie van de
    produktie van walserijprodukten tussen August Thyssen- Hütte AG, Fried. Krupp
    Hüttenwerke AG, Theodor Wuppermann GmbH, Ibach Stahlwerke KG, Eisen- und Stahlwalzwerke
    Rötzel GmbH en de Fürstlich Hohenzollernsche Hüttenverwaltung, alsmede ten
    aanzien van overeenkomsten inzake de gemeenschappelijke verkoop van warmgewalst
    breedband en bandstaal tussen Thyssen und Wuppermann en van bandstaal tussen Krupp
    en Rötzel'
  type: main
