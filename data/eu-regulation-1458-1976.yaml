  content: Commission Regulation (EEC) No 1458/76 of 23 June 1976 amending Regulation
    (EEC) No 358/76 on an invitation to tender for the levy and/or the refund for
    the export of wholly milled rice to certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1458/76 de la Commission, du 23 juin 1976, modifiant
