    und/oder Erstattung bei der Ausfuhr von vollständig geschliffenem Langkornreis
    nach bestimmten Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1458/76 af 23. juni 1976 om ændring
