title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 487/94 of 4 March 1994 determining the extent
    to which applications lodged in February 1994 for import licences for fresh, chilled
    or frozen beef under the import arrangements provided for in the Interim Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 487/94 de la Commission, du 4 mars 1994, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en février 1994 pour les viandes bovines fraîches, réfrigérées
    ou congelées dans le cadre des régimes d'importation prévus par les accords
    intérimaires conclus par la Communauté avec la Bulgarie et la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 487/94 der Kommission vom 4. März 1994 zur Festsetzung
    des Umfangs, in dem die im Februar 1994 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Interimsabkommen zwischen
    der Gemeinschaft und Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 487/94 af 4. marts 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i februar 1994,
    om importlicenser for fersk, kølet og frosset oksekød i forbindelse med de importordninger,
    der er fastsat i interimsaftalerne mellem Fællesskabet og Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 487/94 της Επιτροπής
    της 4ης Μαρτίου 1994 περί καθορισμού του ορίου
    εντός του οποίου δύναται να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Φεβρουάριο 1994 για τα νωπά, διατηρημένα
    με απλή ψύξη ή κατεψυγμένα βόεια κρέατα στα
    πλαίσια των καθεστώτων εισαγωγής που προβλέπονται
    από τις προσωρινές συμφωνίες που συνήφθησαν
    από την Κοινότητα με τη Βουλγαρία και τη Ρουμανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 487/94 della Commissione, del 4 marzo 1994, che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di febbraio 1994 per le carni bovine fresche, refrigerate
    o congelate nel quadro dei regimi di importazione previsti dagli accordi interinali
    conclusi tra la Comunità e la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 487/94 van de Commissie van 4 maart 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor vers, gekoeld of bevroren rundvlees, die in februari 1994 zijn ingediend
    op grond van de invoerregelingen die zijn vastgesteld in de door de Gemeenschap
    met Bulgarije en Roemenië gesloten interimovereenkomsten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 487/94 da Comissão, de 4 de Março de 1994, que determina
    em que medida podem ser aceites os pedidos de certificados de importação de
    carne de bovino fresca, refrigerada ou congelada, apresentados em Fevereiro de
    1994 ao abrigo dos regimes de importação previstos nos acordos provisórios
    concluídos pela Comunidade com a Bulgária e a Roménia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 487/94 de la Comisión, de 4 de marzo de 1994, por el
    que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de carne fresca, refrigerada o congelada de vacuno presentadas
    en febrero de 1994, al amparo de los regímenes de importación establecidos en
    los Acuerdos interinos celebrados entre la Comunidad y Bulgaria y Rumanía
  type: main
