title:
- language: en
  script: Latn
  content: '76/22/EEC: Commission Decision of 18 December 1975 amending the Commission
    Decision of 26 April 1972 on aid granted pursuant to the Belgian Law of 30 December
    1970 and the Commission Decision of 17 June 1975 on aid granted pursuant to the
    Belgian Law of 17 July 1959 (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '76/22/CEE: Décision de la Commission, du 18 décembre 1975, modifiant,
    d''une part, la décision de la Commission, du 26 avril 1972, concernant les aides
    générales prévues par la loi belge du 30 décembre 1970 et, autre part, la
    décision de la Commission, du 17 juin 1975, concernant les aides prévues par
    la loi belge du 17 juillet 1959 (Les textes en langues française et néerlandaise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '76/22/EWG: Entscheidung der Kommission vom 18. Dezember 1975 zur Änderung
    der Entscheidung der Kommission vom 26. April 1972 über die allgemeinen Beihilfen
    auf Grund des belgischen Gesetzes vom 30. Dezember 1970 sowie der Entscheidung
    der Kommission vom 17. Juni 1975 über die allgemeinen Beihilfen auf Grund des
    belgischen Gesetzes vom 17. Juli 1959 (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '76/22/EØF: Kommissionens Beslutning af 18. december 1975 om ændring
    dels af Kommissionens beslutning af 26. april 1972 vedrørende den generelle støtteordning
    i den belgiske lov af 30 december 1970 og dels af Kommissionens beslutning af
    17. juni 1975 vedrørende den generelle støtteordning i den belgiske lov af 17.
    juli 1959 (Kun de franske og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '76/22/ΕΟΚ: Απόφαση της Επιτροπής, της 18ης
    Δεκεμβρίου 1975, περί τροποποίησης, αφ''ενός της
    απόφασης της Επιτροπής, της 26ης Απριλίου 1972,
    όσον αφορά τις γενικές ενισχύσεις που προβλέπονται
    από τον βελγικό νόμο της 30ής Δεκεμβρίου 1970
    και αφ''ετέρου της απόφασης της Επιτροπής, της
    17ης Ιουνίου 1975, όσον αφορά τις ενισχύσεις που
    προβλέπονται από τον βελγικό νόμο της 17ης Ιουλίου
    1959 (Τα κείμενα στη γαλλική και ολλανδική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '76/22/CEE: Decisione della Commissione, del 18 dicembre 1975, che modifica
    la decisione della Commissione del 26 aprile 1972 concernente gli aiuti generali
    previsti dalla legge belga del 30 dicembre 1970, nonché la decisione della Commissione
    del 17 giugno 1975 riguardante gli aiuti generali previsti dalla legge belga del
    17 luglio 1959 (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '76/22/EEG: Beschikking van de Commissie van 18 december 1975 tot wijziging
    van enerzijds de beschikking van de Commissie van 26 april 1972 inzake de algemene
    steunmaatregelen als bedoeld in de Belgische wet van 30 december 1970 en anderzijds
    de beschikking van de Commissie van 17 juni 1975 inzake de algemene steunmaatregelen
    als bedoeld in de Belgische wet van 17 juli 1959 (Slechts de teksten in de Franse
    en de Nederlandse taal zijn authentiek)'
