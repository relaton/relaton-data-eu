    mozaik vírus, CH2 törzs, enyhe Abp2 izolátum kis kockázatú hatóanyagoknak
    a növényvédő szerek forgalomba hozataláról szóló 1107/2009/EK európai
    parlamenti és tanácsi rendelet szerinti jóváhagyásáról, továbbá az 540/2011/EU
    bizottsági végrehajtási rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/917 della Commissione del 7 giugno
    2021 che approva le sostanze attive a basso rischio virus del mosaico del pepino,
    ceppo UE, isolato blando Abp1 e virus del mosaico del pepino, ceppo CH2, isolato
    blando Abp2, conformemente al regolamento (CE) n. 1107/2009 del Parlamento europeo
    e del Consiglio relativo all’immissione sul mercato dei prodotti fitosanitari,
    e che modifica il regolamento di esecuzione (UE) n. 540/2011 della Commissione
  type: main
- language: lv
  script: Latn
