    вещества с нисък риск Pepino Mosaic Virus, щам EU, изолат
    с ниска вирулентност Abp1, и Pepino Mosaic Virus, щам CH2,
    изолат с ниска вирулентност Abp2, в съответствие
    с Регламент (ЕО) № 1107/2009 на Европейския парламент
    и на Съвета относно пускането на пазара на
    продукти за растителна защита, и за изменение
    на Регламент за изпълнение (ЕС) № 540/2011 на Комисията
  type: main
