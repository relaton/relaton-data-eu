    aizsardzības līdzekļu laišanu tirgū Pepino mozaīkas vīrusa ES celma novājinātās
    formas izolātu Abp1 un Pepino mozaīkas vīrusa CH2 celma novājinātās formas
    izolātu Abp2 apstiprina par zema riska darbīgajām vielām un groza Komisijas
    Īstenošanas regulu (ES) Nr. 540/2011
  type: main
- language: lt
