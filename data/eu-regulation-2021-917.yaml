title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/917 of 7 June 2021 approving
    the low-risk active substances Pepino Mosaic Virus, EU strain, mild isolate Abp1
    and Pepino Mosaic Virus, CH2 strain, mild isolate Abp2 in accordance with Regulation
    (EC) No 1107/2009 of the European Parliament and of the Council concerning the
    placing of plant protection products on the market, and amending Commission Implementing
    Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/917 de la Commission du 7 juin 2021
    portant approbation du Pepino Mosaic Virus, souche EU, isolat abp1 peu virulent,
    et du Pepino Mosaic Virus, souche CH2, isolat abp2 peu virulent, en tant que substances
    actives à faible risque, conformément au règlement (CE) no 1107/2009 du Parlement
    européen et du Conseil concernant la mise sur le marché des produits phytopharmaceutiques,
    et modifiant le règlement d’exécution (UE) no 540/2011 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/917 der Kommission vom 7. Juni 2021
    zur Genehmigung der Wirkstoffe mit geringem Risiko Pepino Mosaic Virus, EU-Stamm,
    mildes Isolat Abp1 und Pepino Mosaic Virus, CH2-Stamm, mildes Isolat Abp2 gemäß
    der Verordnung (EG) Nr. 1107/2009 des Europäischen Parlaments und des Rates über
    das Inverkehrbringen von Pflanzenschutzmitteln und zur Änderung der Durchführungsverordnung
    (EU) Nr. 540/2011 der Kommission
  type: main
- language: bg
  script: Cyrl
