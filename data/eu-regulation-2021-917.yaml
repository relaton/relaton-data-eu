    tal-Pepino, razza EU, iżolat ħafif Abp1 u l-Virus tal-Mużajk tal-Pepino, razza
    CH2, iżolat ħafif Abp2, f’konformità mar-Regolament (KE) Nru 1107/2009 tal-Parlament
