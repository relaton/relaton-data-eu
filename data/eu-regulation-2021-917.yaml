    aktivnih tvari Pepino mosaic virus, soj EU, blagi izolat Abp1 i Pepino mosaic
    virus, soj CH2, blagi izolat Abp2 kao tvari niskog rizika u skladu s Uredbom (EZ)
    br. 1107/2009 Europskog parlamenta i Vijeća o stavljanju na tržište sredstava
