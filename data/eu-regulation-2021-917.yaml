    veikliosios medžiagos kiauliauogių mozaikos virusas, padermė ES, silpnasis
    izoliatas Abp1 ir kiauliauogių mozaikos virusas, padermė CH2, silpnasis izoliatas
    Abp2 ir iš dalies keičiamas Komisijos įgyvendinimo reglamentas (ES) Nr. 540/2011
  type: main
