  script: Latn
  content: Rådets beslut (EU) 2018/156 av den 22 januari 2018 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i det associeringsråd som inrättats
    genom associeringsavtalet mellan Europeiska unionen och Europeiska atomenergigemenskapen
    och deras medlemsstater, å ena sidan, och Ukraina, å andra sidan, vad gäller
