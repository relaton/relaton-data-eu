    sobre o novo cálculo da lista de eliminação dos direitos de exportação constante
    do anexo I-C e do anexo I-D do capítulo 1 do Título IV desse Acordo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2018/156 a Consiliului din 22 ianuarie 2018 privind poziția
    care trebuie adoptată în numele Uniunii Europene în cadrul Consiliului de asociere
    înființat prin Acordul de asociere între Uniunea Europeană și Comunitatea
    Europeană a Energiei Atomice și statele membre ale acestora, pe de o parte,
    și Ucraina, pe de altă parte, în ceea ce privește completarea anexei I-A la
    capitolul I din titlul IV din acord, și în cadrul Comitetului de asociere reunit
    în configurația comerț, în ceea ce privește recalcularea programului de eliminare
    a taxelor la export prevăzut în anexele I-C și I-D la capitolul I din titlul
    IV din acord
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2018/156 z 22. januára 2018 o pozícii, ktorá
    sa má v mene Európskej únie prijať v Rade pre pridruženie zriadenej Dohodou
    o pridružení medzi Európskou úniou a Európskym spoločenstvom pre atómovú
    energiu a ich členskými štátmi na jednej strane a Ukrajinou na strane druhej,
    pokiaľ ide o doplnenie prílohy I-A ku kapitole 1 hlavy IV uvedenej dohody, a
    vo Výbore pre pridruženie v zložení pre otázky obchodu, pokiaľ ide o prepočítanie
    zoznamu pre odstraňovanie vývozného cla stanoveného v prílohách I-C a I-D
    ku kapitole 1 hlavy IV uvedenej dohody
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2018/156 z dne 22. januarja 2018 o stališču, ki se v
