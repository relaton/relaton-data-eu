    o pridružitvi med Evropsko unijo in Evropsko skupnostjo za atomsko energijo in
    njunimi državami članicami na eni strani ter Ukrajino na drugi strani, glede
    dopolnitve Priloge I-A k poglavju 1 naslova IV navedenega sporazuma ter v Pridružitvenem
    odboru v trgovinski sestavi glede preračuna seznamov v zvezi z odpravo izvozne
    dajatve, določenih v prilogah I-C in I-D k poglavju 1 naslova IV navedenega sporazuma
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2018/156 del Consejo, de 22 de enero de 2018, relativa a
    la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    de Asociación creado por el Acuerdo de Asociación entre la Unión Europea y
    la Comunidad Europea de la Energía Atómica y sus Estados miembros, por una parte,
