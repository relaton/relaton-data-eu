title:
- language: en
  script: Latn
  content: Council Decision (EU) 2018/156 of 22 January 2018 on the position to be
    taken on behalf of the European Union within the Association Council established
    by the Association Agreement between the European Union and the European Atomic
    Energy Community and their Member States, of the one part, and Ukraine, of the
    other part, as regards supplementing Annex I-A to Chapter 1 of Title IV of that
    Agreement, and within the Association Committee in Trade configuration, as regards
    recalculating the schedule of export duty elimination set out in Annexes I-C and
    I-D to Chapter 1 of Title IV of that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2018/156 du Conseil du 22 janvier 2018 relative à la position
    à prendre au nom de l'Union européenne au sein du conseil d'association institué
    par l'accord d'association entre l'Union européenne et la Communauté européenne
    de l'énergie atomique et leurs États membres, d'une part, et l'Ukraine, d'autre
    part, en vue de compléter l'annexe I-A relative au chapitre 1 du titre IV de
    cet accord, et, au sein du comité d'association dans sa configuration «Commerce»,
    en vue de recalculer le calendrier de suppression des droits à l'exportation
    figurant aux annexes I-C et I-D relatives au chapitre 1 du titre IV de cet accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2018/156 des Rates vom 22. Januar 2018 über den Standpunkt,
    der im Namen der Europäischen Union in dem mit dem Assoziierungsabkommen zwischen
    der Europäischen Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten
    einerseits und der Ukraine andererseits eingesetzten Assoziationsrat zur Ergänzung
    des Anhangs I-A des Titels IV, Kapitel 1 des Assoziierungsabkommens und im Assoziationsausschuss
    in der Zusammensetzung „Handel“ zur Neuberechnung des in Anhang I-C und Anhang
    I-D des Titels IV, Kapitel 1 des Assoziierungsabkommens festgelegten Stufenplans
    zum Abbau der Ausfuhrzölle zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2018/156 на Съвета от 22 януари 2018
    година относно позицията, която трябва да се
    заеме от името на Европейския съюз в рамките
    на Съвета за асоцииране, създаден със Споразумението
    за асоцииране между Европейския съюз и Европейската
    общност за атомна енергия и техните държави
    членки, от една страна, и Украйна, от друга страна,
    във връзка с внасянето на допълнение в приложение
    I-A към дял IV, глава 1 от това споразумение и,
    в рамките на Комитета за асоцииране в състав
    „Търговия“, във връзка с преизчисляването
    на графика за премахване на износните мита,
    установен в приложения I-В и I-Г към дял IV, глава
    1 от това споразумение
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2018/156 ze dne 22. ledna 2018 o postoji, který
    má být zaujat jménem Evropské unie v Radě přidružení zřízené Dohodou
    o přidružení mezi Evropskou unií a Evropským společenstvím pro atomovou
    energii a jejich členskými státy na jedné straně a Ukrajinou na straně druhé,
    pokud jde o doplnění přílohy I-A kapitoly 1 hlavy IV uvedené dohody, a ve
    Výboru pro přidružení ve složení pro obchod, pokud jde o přepočítání
    údajů v seznamu odstraňování cel z vývozu stanoveném v přílohách I-C
    a I-D kapitoly 1 hlavy IV uvedené dohody
  type: main
