    statut «indemne de rhinotrachéite infectieuse bovine» des Länder allemands
    de Rhénanie-Palatinat et de la Sarre, et des Regierungsbezirke allemands Arnsberg,
    Detmold et Münster [notifiée sous le numéro C(2016) 4135]
