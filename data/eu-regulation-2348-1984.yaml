title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2348/84 of 31 July 1984 fixing for the 1984/85
    marketing year the minimum price to be paid to producers for unprocessed dried
    grapes and the amount of production aid for dried grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2348/84 de la Commission du 31 juillet 1984 fixant,
    pour la campagne 1984/1985, le prix minimal à payer aux producteurs pour les
    raisins secs non transformés ainsi que le montant de l' aide à la production
    pour les raisins secs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2348/84 der Kommission vom 31. Juli 1984 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises für nicht verarbeitete getrocknete
    Weintrauben sowie des Betrages der Produktionsbeihilfe für getrocknete Weintrauben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2348/84 af 31. juli 1984 om fastsættelse
    for produktionsåret 1984/85 af den minimumspris, der skal betales til producenterne
    for uforarbejdede tørrede druer og af producentstøtten for tørrede druer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2348/84 της Επιτροπής
    της 31ης Ιουλίου 1984 για τον καθορισμό της ελάχιστης
    τιμής που καταβάλλεται στους παραγωγούς για
    μη μεταποιημένες σταφίδες και του ποσού της
    ενίσχυσης στην παραγωγή για σταφίδες για την
    περίοδο εμπορίας 1984/85
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2348/84 della Commissione del 31 luglio 1984 che fissa,
    per la campagna di commercializzazione 1984/1985, il prezzo minimo da pagare ai
    produttori per le uve secche non trasformate e l' importo dell' aiuto alla produzione
    per le uve secche
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2348/84 van de Commissie van 31 juli 1984 tot vaststelling,
    voor het verkoopseizoen 1984/1985, van de aan de telers te betalen minimumprijs
    voor rozijnen en krenten (basisprodukt) alsmede van het bedrag van de produktiesteun
    voor rozijnen en krenten
  type: main
