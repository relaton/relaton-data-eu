title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 293/98 of 4 February 1998 determining the
    operative events applicable to products in the fruit and vegetables sector, to
    processed fruit and vegetable products and partly to live plants and floricultural
    products and to certain products listed in Annex II to the EC Treaty, and repealing
    Regulation (EC) No 1445/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 293/98 de la Commission du 4 février 1998 fixant les
    faits générateurs applicables dans le secteur des fruits et légumes, dans le
    secteur des produits transformés à base de fruits et légumes, partiellement
    dans le secteur des plantes vivantes et des produits de la floriculture ainsi
    que pour certains produits énumérés à l'annexe II du traité et abrogeant
    le règlement (CE) n° 1445/93
  type: main
