  content: Commission Regulation (EEC) No 1119/84 of 24 April 1984 re-establishing
    the levying of customs duties on ethylene glycol, falling within subheading 29.04
    C ex I and originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1119/84 de la Commission du 24 avril 1984 portant rétablissement
