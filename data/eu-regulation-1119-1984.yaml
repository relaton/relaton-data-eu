    in Mexiko, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1119/84 af 24. april 1984 om genindførelse
