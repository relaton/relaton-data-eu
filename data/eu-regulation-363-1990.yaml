title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 363/90 of 12 February 1990 suspending the
    preferential customs duties and re-introducing the Common Customs Tariff duty
    on imports of large roses originating in Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 363/90 de la Commission, du 12 février 1990, suspendant
    le droit de douane préférentiel et réinstaurant le droit du tarif douanier
    commun à l'importation de roses à grande fleur originaires du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 363/90 der Kommission vom 12. Februar 1990 zur Aussetzung
    des bei der Einfuhr von großblütigen Rosen mit Ursprung in Marokko zu erhebenden
    Präferenzzolls und Wiedereinführung des Zolls des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 363/90 af 12. februar 1990 om suspension
    af præferencetolden og genindførelse af tolden ifølge Den Fælles Toldtarif
    ved indførsel af storblomstrede roser med oprindelse i Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 363/90 της Επιτροπής
    της 12ης Φεβρουαρίου 1990 για αναστολή του προτιμησιακού
    δασμού και επαναφορά του δασμού του κοινού
    δασμολογίου κατά την εισαγωγή τριαντάφυλλων
    με μεγάλο άνθος, καταγωγής Μαρόκου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 363/90 della Commissione, del 12 febbraio 1990, che
    sospende il dazio doganale preferenziale e ripristina il dazio della tariffa doganale
    comune all'importazione di rose a fiore grande originarie del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 363/90 van de Commissie van 12 februari 1990 tot
    schorsing van het preferentiële douanerecht en tot wederinvoering van het recht
    van het gemeenschappelijk douanetarief bij invoer van grootbloemige rozen van
    oorsprong uit Marokko
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 363/90 da Comissão, de 12 de Fevereiro de 1990,
    que suspende o direito aduaneiro preferencial e restabelece o direito da Pauta
    Aduaneira Comum na importação de rosas de flor grande originárias de Marrocos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 363/90 de la Comisión, de 12 de febrero de 1990,
    por el que se suspende el derecho de aduana preferencial y se restablece el derecho
    del arancel aduanero común a la importación de rosas de flor grande originarias
    de Marruecos
