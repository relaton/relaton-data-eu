title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1198/84 of 30 April 1984 re-establishing
    the levying of customs duties on other men' s and boys' outer garments as well
    as for women' s, girls' and infants' outer garments, products of category 76 (code
    0760), originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1198/84 de la Commission du 30 avril 1984 portant rétablissement
    de la perception des droits de douane applicables aux autres vêtements de dessus
    pour hommes et garçonnets ainsi que pour femmes, fillettes et jeunes enfants,
    de la catégorie 76 (code 0760), originaires du Pakistan, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1198/84 der Kommission vom 30. April 1984 über die
    Wiedereinführung des Zollsatzes für andere Oberkleidung für Männer und Knaben
    sowie für Frauen, Mädchen und Kleinkinder der Warenkategorie Nr. 76 (Kennziffer
    0760) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3570/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1198/84 af 30. april 1984 om genindførelse
    af opkrævning af toldafgifter for andre yderbeklædningsgenstande til mænd,
    drenge, kvinder, piger og småbørn, under varekategori nr. 76 (kode 0760), som
    har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1198/84 της Επιτροπής
    της 30ής Απριλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για εξωτερικά
    ενδύματα ανδρών και παίδων, καθώς επίσης και
    για γυναίκες, κορασίδες και μικρά παιδιά, προϊόντα
    της κατηγορίας 76 (κωδικός 0760), καταγωγής Πακιστάν,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1198/84 della Commissione del 30 aprile 1984 che ripristina
    la riscossione dei dazi doganali applicabili a altri indumenti esterni per uomo
    e per ragazzo e per donna, per ragazza e per bambini, della categoria di prodotti
    n. 76 (codice 0760), originari del Pakistan, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1198/84 van de Commissie van 30 april 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere herenbovenkleding,
    jongensbovenkleding, damesbovenkleding, meisjesbovenkleding en kinderbovenkleding,
    van de categorie van produkten nr. 76 (codenummer 0760), van oorsprong uit Pakistan,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3570/83 van de Raad
  type: main
