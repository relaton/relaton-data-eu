---
id: EURegulation4672010
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 467/2010 of 25 May 2010 imposing
    a definitive anti-dumping duty on imports of silicon originating in the People’s
    Republic of China, as extended to imports of silicon consigned from the Republic
    of Korea, whether declared as originating in the Republic of Korea or not, following
    an expiry review pursuant to Article 11(2) and a partial interim review pursuant
    to Article 11(3) of Regulation (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 467/2010 du Conseil du 25 mai 2010
    instituant un droit antidumping définitif sur les importations de silicium originaire
    de la République populaire de Chine, étendu aux importations de silicium expédié
    de la République de Corée, qu’il ait ou non été déclaré originaire de
    ce pays, conformément à l’article 11, paragraphe 2, et à un réexamen intermédiaire
    partiel au titre de l’article 11, paragraphe 3, du règlement (CE) n ° 1225/2009
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 467/2010 des Rates vom 25. Mai 2010 zur
    Einführung eines endgültigen Antidumpingzolls auf die Einfuhren von Silicium
    mit Ursprung in der Volksrepublik China, ausgedehnt auf Einfuhren von aus der
    Republik Korea versandtem Silicium, ob als Ursprungserzeugnis der Republik Korea
    angemeldet oder nicht, im Anschluss an eine Auslaufüberprüfung nach Artikel
    11 Absatz 2 und eine teilweise Interimsüberprüfung nach Artikel 11 Absatz 3
    der Verordnung (EG) Nr. 1225/2009
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 467/2010 на Съвета
    от 25 май 2010 година за налагане на окончателно
    антидъмпингово мито върху вноса на силиций
    с произход от Китайската народна република,
    чийто обхват е разширен и към вноса на силиций,
    изпратен от Република Корея, независимо дали
    е деклариран с произход от Република Корея,
    след проведено преразглеждане с оглед изтичане
    срока на действие в съответствие с член 11, параграф
    2 и частично междинно преразглеждане в съответствие
    с член 11, параграф 3 от Регламент (ЕО) № 1225/2009
  type: main
- language: cs
  script: Latn
  content: Prováděcí Nařízení Rady (EU) č. 467/2010 ze dne 25. května 2010
    o uložení konečného antidumpingového cla z dovozu křemíku pocházejícího
    z Čínské lidové republiky rozšířeného na dovoz křemíku zasílaného
    z Korejské republiky bez ohledu na to, zda je deklarován jako pocházející
    z Korejské republiky, či nikoli, na základě přezkumu před pozbytím platnosti
    podle čl. 11 odst. 2 a částečného prozatímního přezkumu podle čl. 11
    odst. 3 nařízení (ES) č. 1225/2009
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 467/2010 af 25. maj 2010 om
    indførelse af en endelig antidumpingtold på importen af silicium med oprindelse
    i Den Kinesiske Folkerepublik, som udvidet til også at omfatte importen af silicium
    afsendt fra Republikken Korea, uanset om varen er angivet med oprindelse i Republikken
    Korea eller ej, efter en udløbsundersøgelse i henhold til artikel 11, stk. 2,
    og en delvis interimsundersøgelse i henhold til artikel 11, stk. 3, i forordning
    (EF) nr. 1225/2009
  type: main
- language: el
  script: Grek
