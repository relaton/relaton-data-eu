    kas päritolumaana on deklareeritud Korea Vabariik või mitte
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 467/2010, annettu 25 päivänä
    toukokuuta 2010 , lopullisen polkumyyntitullin käyttöönotosta Kiinan kansantasavallasta
    peräisin olevan piin tuonnissa, sellaisena kuin se on laajennettu koskemaan Korean
    tasavallasta lähetetyn piin tuontia riippumatta siitä, onko tuotteen alkuperämaaksi
    ilmoitettu Korean tasavalta, asetuksen (EY) N:o 1225/2009 11 artiklan 2 kohdan
    mukaisen toimenpiteiden voimassaolon päättymistä koskevan tarkastelun ja 11
    artiklan 3 kohdan mukaisen osittaisen välivaiheen tarkastelun jälkeen
  type: main
- language: hr
  script: Latn
  content: Provedbena Uredba Vijeća (EU) br. 467/2010 od 25. svibnja 2010. o uvođenju
    konačne antidampinške pristojbe na uvoz silicija podrijetlom iz Narodne Republike
    Kine, kako je proširena na uvoz silicija poslanog iz Republike Koreje, bez obzira
    na to ima li deklarirano podrijetlo iz Republike Koreje ili ne, nakon revizije
    nakon isteka mjere prema članku 11. stavku 2. i parcijalne privremene revizije
    prema članku 11. stavku 3. Uredbe (EZ) br. 1225/2009
  type: main
- language: hu
  script: Latn
  content: A Tanács 467/2010/EU végrehajtási rendelete ( 2010. május 25. ) a Kínai
    Népköztársaságból származó szilícium behozatalára vonatkozó végleges
    dömpingellenes vámnak – azt a Koreai Köztársaságban feladott, akár a Koreai
    Köztársaságból származóként, akár nem ilyenként bejelentett szilícium
    behozatalára is kiterjesztve – az 1225/2009/EK rendelet 11. cikkének (2) bekezdése
    szerinti hatályvesztési felülvizsgálatot és 11. cikkének (3) bekezdése
    szerinti részleges időközi felülvizsgálatot követő kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 467/2010 del Consiglio, del 25 maggio
    2010 , che istituisce un dazio antidumping definitivo sulle importazioni di silicio
    originario della Repubblica popolare cinese, esteso alle importazioni di silicio
    spedito dalla Repubblica di Corea, dichiarato o no originario della Repubblica
    di Corea, in seguito a un riesame in previsione della scadenza a norma dell’articolo
    11, paragrafo 2, e a un riesame intermedio parziale a norma dell’articolo 11,
    paragrafo 3, del regolamento (CE) n. 1225/2009
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 467/2010 ( 2010. gada 25. maijs ),
    ar ko pēc termiņa beigu pārskatīšanas saskaņā ar Regulas (EK) Nr. 1225/2009
    11. panta 2. punktu un pēc daļējas starpposma pārskatīšanas saskaņā ar
    11. panta 3. punktu nosaka galīgu antidempinga maksājumu Ķīnas Tautas Republikas
    izcelsmes silīcija importam un piemēro to no Korejas Republikas sūtītam silīcija
    importam neatkarīgi no tā, vai silīcija izcelsme ir vai nav deklarēta Korejas
    Republikā
  type: main
- language: lt
  script: Latn
  content: 2010 m. gegužės 25 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 467/2010,
    kuriuo po priemonių galiojimo termino peržiūros pagal Reglamento (EB) Nr. 1225/2009
    11 straipsnio 2 dalį ir dalinės tarpinės peržiūros pagal 11 straipsnio 3
    dalį importuojamam Kinijos Liaudies Respublikos kilmės siliciui nustatomas galutinis
    antidempingo muitas, kurio taikymas išplečiamas importuojamam iš Korėjos Respublikos
    siunčiamam siliciui, deklaruojamam kaip Korėjos Respublikos kilmės arba ne
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ implimentazzjoni tal-Kunsill (UE) Nru 467/2010 tal- 25
    ta’ Mejju 2010 li jimponi dazju anti-dumping definittiv fuq importazzjonijiet
    tas-silikon li joriġina fir-Repubblika Popolari taċ-Ċina, kif estiż għal
    importazzjonijiet tas-silikon kkonsenjat mir-Repubblika tal-Korea, kemm jekk iddikjarat
    li joriġina fir-Repubblika tal-Korea kemm jekk le, wara reviżjoni tal-iskadenza
    skont l-Artikolu 11(2) u reviżjoni interim parzjali skont l-Artikolu 11(3) tar-Regolament
    (KE) Nru 1225/2009
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 467/2010 van de Raad van 25 mei 2010 tot
    instelling van een definitief antidumpingrecht op silicium van oorsprong uit de
    Volksrepubliek China, zoals uitgebreid tot silicium verzonden vanuit de Republiek
    Korea, al dan niet aangegeven als van oorsprong uit de Republiek Korea, naar aanleiding
    van een nieuw onderzoek bij het vervallen van de maatregelen op grond van artikel
    11, lid 2, en van een gedeeltelijk tussentijds nieuw onderzoek op grond van artikel
    11, lid 3, van Verordening (EG) nr. 1225/2009
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 467/2010 z dnia 25 maja 2010 r.
    nakładające ostateczne cło antydumpingowe na przywóz krzemu pochodzącego
    z Chińskiej Republiki Ludowej, rozszerzone na przywóz krzemu wysyłanego z Republiki
    Korei, zgłoszonego lub niezgłoszonego jako pochodzący z Republiki Korei, w
    następstwie przeglądu wygaśnięcia zgodnie z art. 11 ust. 2 i częściowego
    przeglądu okresowego zgodnie z art. 11 ust. 3 rozporządzenia (WE) nr 1225/2009
  type: main
- language: pt
  script: Latn
  content: Regulamento de execução (UE) n. ° 467/2010 do Conselho, de 25 de Maio
    de 2010 , que institui um direito anti-dumping definitivo sobre as importações
    de silício originário da República Popular da China, extensivo às importações
    de silício expedido da República da Coreia, independentemente de ser ou não
    declarado originário da República da Coreia, na sequência de um reexame da
    caducidade nos termos do n. ° 2 do artigo 11. °, e de um reexame intercalar
    parcial nos termos do n. ° 3 do artigo 11. °do Regulamento (CE) n. ° 1225/2009
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 467/2010 al Consiliului din
    25 mai 2010 de instituire a unei taxe antidumping definitive la importurile de
    siliciu originar din Republica Populară Chineză, astfel cum a fost extinsă
    la importurile de siliciu originar din Republica Coreea, indiferent dacă acesta
    este declarat sau nu ca fiind originar din Republica Coreea, ca urmare a unei
    reexaminări efectuate în perspectiva expirării măsurilor în temeiul articolului
    11 alineatul (2) și a unei reexaminări intermediare parțiale efectuate în
    temeiul articolului 11 alineatul (3) din Regulamentul (CE) nr. 1225/2009
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 467/2010 z 25. mája 2010 , ktorým
    sa ukladá konečné antidumpingové clo na dovoz kremíka s pôvodom v Čínskej
    ľudovej republike, rozšírené na dovoz kremíka zasielaného z Kórejskej republiky,
    ktorý buď má, alebo nemá deklarovaný pôvod v Kórejskej republike, na základe
    preskúmania pred uplynutím platnosti podľa článku 11 ods. 2 a čiastočného
    predbežného preskúmania podľa článku 11 ods. 3 nariadenia (ES) č. 1225/2009
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 467/2010 z dne 25. maja 2010 o uvedbi
    dokončne protidampinške dajatve na uvoz silicija s poreklom iz Ljudske republike
    Kitajske, kakor je bila razširjena na uvoz silicija, poslanega iz Republike Koreje,
    ne glede na to, ali je deklariran kot izdelek s poreklom iz Republike Koreje ali
    ne, na osnovi pregleda zaradi izteka ukrepa na podlagi člena 11(2) in delnega
    vmesnega pregleda na podlagi člena 11(3) Uredbe (ES) št. 1225/2009
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 467/2010 del Consejo, de 25 de mayo
    de 2010 , por el que se establece un derecho antidumping definitivo sobre las
    importaciones de silicio originario de la República Popular China, ampliado a
    las importaciones de silicio procedente de la República de Corea, independientemente
    de que esté declarado como producto originario de dicho país, a raíz de una
    reconsideración por expiración, de conformidad con el artículo 11, apartado
    2, y una reconsideración provisional parcial, de conformidad con el artículo
    11, apartado 3, del Reglamento (CE) n ° 1225/2009
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 467/2010 av den 25 maj 2010 om
    införande av en slutgiltig antidumpningstull på import av kisel med ursprung
    i Folkrepubliken Kina, vilken utvidgats till att även omfatta import av kisel
    som avsänts från Republiken Korea, oavsett om denna import deklarerats ha sitt
    ursprung i Republiken Korea eller ej, efter en översyn vid giltighetstidens utgång
    enligt artikel 11.2 och en partiell interimsöversyn enligt artikel 11.3 i förordning
    (EG) nr 1225/2009
  type: main
