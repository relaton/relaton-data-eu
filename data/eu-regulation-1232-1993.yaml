    au titre de la distillation ouverte par le règlement (CEE) n 130/93
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1232/93 DER KOMMISSION vom 19. Mai 1993 zur Kürzung
