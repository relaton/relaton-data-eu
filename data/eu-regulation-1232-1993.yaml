  content: COMMISSION REGULATION (EEC) No 1232/93 of 19 May 1993 reducing the quantities
    of table wine covered by approved contracts and declarations for distillation
    as provided for in Regulation (EEC) No 130/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1232/93 de la Commission du 19 mai 1993 portant réduction
