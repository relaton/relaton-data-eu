title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1208/91 of 6 May 1991 re- establishing the
    levying of customs duties on products of category 98 (order No 40.0980), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1208/91 DE LA COMMISSION du 6 mai 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    98 (numéro d'' ordre 40.0980), originaires de la Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1208/91 DER KOMMISSION vom 6. Mai 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 98 (lfd. Nummer
    40.0980) mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3832/90 des
    Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1208/91 af 6. maj 1991 om genindførelse
    af opkrævning af told for varer under kategori nr. 98 (løbenummer 40 0980) som
    har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1208/91 της Επιτροπής
    της 6ης Μαΐου 1991 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών στα προϊόντα της κατηγορίας
    98 ( αύξων αριθ. 40.0980 ), καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1208/91 DELLA COMMISSIONE del 6 maggio 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti della categoria n. 98
    (numero d'' ordine 40.0980), originari della Cina, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1208/91 VAN DE COMMISSIE van 6 mei 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op produkten van
    categorie nr. 98 (volgnummer 40.0980), van oorsprong uit China, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90 van de
    Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1208/91 DA COMISSÃO de 6 de Maio de 1991 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria 98 (número
    de ordem 40.0980), originários da China, beneficiários das preferências pautais
    previstas no Regulamento (CEE) no 3832/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1208/91 DE LA COMISIÓN de 6 de mayo de 1991 relativo
