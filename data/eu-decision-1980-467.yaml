id: EUDecision1980467
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/467/EEC: Commission Decision of 14 April 1980 authorizing Ireland not
    to apply Community treatment to parkas, anoraks, windcheaters, waisted jackets
    and the like, falling within subheadings ex 61.01 B IV and ex 61.02 B II of the
    Common Customs Tariff (category 21), originating in Hong Kong and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/467/CEE: Décision de la Commission, du 14 avril 1980, autorisant l''Irlande
    à exclure du traitement communautaire les "parkas", anoraks, blousons et similaires,
    des sous-positions ex 61.01 B IV et ex 61.02 B II du tarif douanier commun (catégorie
    21), originaires de Hong-kong et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/467/EWG: Entscheidung der Kommission vom 14. April 1980, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Parkas, Anoraks, Windjacken und dergleichen der Tarifstellen
    ex 61.01 B IV und ex 61.02 B II des Gemeinsamen Zolltarifs (Kategorie 21) von
    der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/467/EØF: Kommissionens beslutning af 14. april 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage parcacoats, anorakker, vindjakker,
    blousonjakker og lignende, som henhører under pos. ex 61.01 B IV og ex 61.02
    B II i den fælles toldtarif (kategori 21), har oprindelse i Hongkong og frit
    kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/467/CEE: Decisione della Commissione, del 14 aprile 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario eskimo, giacche a vento e
    giubbotti con o senza cappuccio e simili, delle sottovoci ex 61.01 B IV e ex 61.02
    B II della tariffa doganale comune (categoria 21), originari di Hong Kong e messi
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/467/EEG: Beschikking van de Commissie van 14 april 1980 waarbij Ierland
    wordt gemachtigd parka''s, anoraks, windjakken en dergelijke, van de posten ex
    61.01 B IV en ex 61.02 B II van het gemeenschappelijk douanetarief (categorie
    21), van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Engelse taal is authentiek)'
  type: main
