  content: Commission Delegated Regulation (EU) 2020/1173 of 4 June 2020 amending
    Regulation (EU) 2016/1036 on protection against dumped imports from countries
    not members of the European Union and Regulation (EU) 2016/1037 on protection
    against subsidised imports from countries not members of the European Union as
    regards the duration of the period of pre-disclosure
  type: main
- language: fr
  script: Latn
