title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3405/86 of 6 November 1986 re-establishing
    the levying of customs duties on yarn of discontinuous or waste synthetic fibres,
    products of category 22 (code 40.0220), originating in Peru, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3600/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3405/86 de la Commission du 6 novembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques discontinues de la catégorie 22 (code 40.0220)
    originaires du Pérou, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3600/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3405/86 der Kommission vom 6. November 1986 über
    die Wiedereinführung des Zollsatzes für Garne aus synthetischen Spinnfasern
    der Warenkategorie Nr. 22 (Kennziffer 40.0220) mit Ursprung in Peru, dem die in
    der Verordnung (EWG) Nr. 3600/85 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3405/86 af 6. november 1986 om genindførelse
    af opkrævning af toldafgifter for garn af korte syntetiske fibre eller af affald
    af kemofibre, under varekategori nr. 22 (kode 40.0220), som har oprindelse i Peru
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3600/85
  type: main
- language: el
  script: Grek
