    Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dla ołowiu w spoiwie
    lutowniczym w jednym interfejsie wielkopowierzchniowych SDE
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/71/UE da Comissão, de 13 de março de 2014 , que
