title:
- language: en
  script: Latn
  content: '89/306/ECSC: Commission Decision of 23 February 1989 derogating from High
    Authority Recommendation No 1-64 on tariff protection in order to enable the generalized
    tariff preferences to be applied to certain iron and steel products originating
    in the developing countries (136th derogation)'
  type: main
- language: fr
  script: Latn
  content: '89/306/CECA: Décision de la Commission du 23 février 1989 portant dérogation
    à la recommandation n° 1-64 de la Haute Autorité sur la protection tarifaire
    afin de permettre l''application des préférences tarifaires généralisées
    à certains produits sidérurgiques originaires des pays en voie de développement
    (136ème dérogation)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 23. Februar 1989 betreffend Ausnahmen
    von der Empfehlung Nr. 1/64 der Hohen Behörde über den Außenschutz im Hinblick
    auf die Anwendung der allgemeinen Zollpräferenzen auf bestimmte Stahlerzeugnisse
    mit Ursprung in Entwicklungsländern (136. Ausnahmeentscheidung) (89/306/EGKS)
    (89/306/EGKS) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 23. februar 1989 om undtagelse fra Den Høje
    Myndigheds henstilling n. 1/64 vedrørende toldbeskyttelse med henblik på at
    muliggøre anvendelse af de generelle toldpræferencer på visse jern- og stålprodukter
    med oprindelse i udviklingslandene (136. undtagelse) (89/306/EKSF) (89/306/EKSF)
    #'
  type: main
- language: el
  script: Grek
  content: '89/306/ΕΚΑΧ: Απόφαση της Επιτροπής της 23ης
    Φεβρουαρίου 1989 για παρέκκλιση από τη σύσταση
    αριθ. 1/64 της Ανωτάτης Αρχής όσον αφορά τη δασμολογική
    προστασία, προκειμένου να επιτραπεί η εφαρμογή
    των γενικευμένων δασμολογικών προτιμήσεων
    σε ορισμένα προϊόντα της βιομηχανίας σιδήρου
    και χάλυβα που κατάγονται από αναπτυσσόμενες
    χώρες (136η παρέκκλιση)'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 23 febbraio 1989 recante deroga alla raccomandazione
    n. 1-64 dell'' Alta Autorità relativa alla protezione tariffaria al fine di consentire
    l'' applicazione delle preferenze tariffarie generalizzate a taluni prodotti siderurgici
    originari dei paesi in via di sviluppo (136a deroga) (89/306/CECA) (89/306/CECA)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 23 februari 1989 houdende afwijking van
    Aanbeveling nr. 1-64 van de Hoge Autoriteit betreffende de tariefbescherming,
    ten einde voor bepaalde ijzer- en staalprodukten van oorsprong uit ontwikkelingslanden
    de toepassing van algemene tariefpreferenties mogelijk te maken (136e uitzonderingsbeschikking)
    (89/306/EGKS) (89/306/EGKS) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 23 de Fevereiro de 1989 que derroga a Recomendação
    nº 1/64 da Alta Autoridade relativa à protecção pautal a fim de permitir a
    aplicação das preferências pautais generalizadas a certos produtos siderúrgicos
    originários dos países em vias de desenvolvimento (136ª derrogação) (89/306/CECA)
    (89/306/CECA) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 23 de febrero de 1989 por la que se establece
