  script: Latn
  content: Commission Regulation (EEC) No 1665/90 of 20 June 1990 establishing the
    prices and amounts fixed in ecus by the Council in the raw tobacco sector and
    reduced as a result of the monetary realignment of 5 January 1990
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1665/90 de la Commission du 20 juin 1990 déterminant
    les prix et montants fixés en écus par le Conseil dans le secteur du tabac brut
    et réduits en conséquence du réalignement monétaire du 5 janvier 1990
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1665/90 DER KOMMISSION vom 20. Juni 1990 zur Festsetzung
    der vom Rat im Sektor Rohtabak in Ecu festgesetzten und wegen der Waehrungsneufestsetzung
    am 5. Januar 1990 zu verringernden Preise und Betraege
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1665/90 af 20. juni 1990 om fastsættelse
    af de priser og beløb, Rådet har fastsat i ECU for råtobak, og som er nedsat
    som følge af den monetære justering den 5. januar 1990
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1665/90 της Επιτροπής
    της 20ής Ιουνίου 1990 περί καθορισμού των τιμών
    και ποσών που καθορίζονται σε Ecu από το Συμβούλιο
    στον τομέα του ακατέργαστου καπνού και μειώνονται
    λόγω της νομισματικής επανευθυγράμμισης της
    5ης Ιανουαρίου 1990
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1665/90 DELLA COMMISSIONE del 20 giugno 1990 relativo
    ai prezzi e agli importi fissati in ecu dal Consiglio nel settore del tabacco
    greggio e ridotti a seguito del riallineamento monetario del 5 gennaio 1990
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1665/90 VAN DE COMMISSIE van 20 juni 1990 tot bepaling
    van de prijzen en bedragen in de sector ruwe tabak die door de Raad in ecu zijn
    vastgesteld en als gevolg van de monetaire herschikking van 5 januari 1990 worden
    verlaagd
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1665/90 DA COMISSAO de 20 de Junho de 1990 que determina
    os preços e os montantes fixados em ecus pelo Conselho no sector do tabaco em
    rama e reduzidos em consequência do realinhamento monetario de 5 de Janeiro de
    1990
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1665/90 DE LA COMISION de 20 de junio de 1990 por el
    que se determinan los precios e importes fijados en ecus por el Consejo en el
    sector del tabaco crudo y reducidos como consecuencia del reajuste monetario de
    5 de enero de 1990
  type: main
