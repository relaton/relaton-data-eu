title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1373/72 of the Council of 30 June 1972 postponing the
    date of application of Regulation (EEC) No 1599/71 laying down additional conditions
    with which imported wines for direct human consumption have to comply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1373/72 du Conseil, du 30 juin 1972, reportant la
    date d' application du règlement (CEE) n° 1599/71 fixant les conditions supplémentaires
    auxquelles doivent répondre les vins importés destinés à la consommation humaine
    directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1373/72 des Rates vom 30. Juni 1972 zur Verschiebung
    des Anwendungszeitpunkts der Verordnung (EWG) Nr. 1599/71 zur Festsetzung zusätzlicher
    Bedingungen, denen eingeführter Wein, der zum unmittelbaren menschlichen Verbrauch
    bestimmt ist, entsprechen muß
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1373/72 af 30. juni 1972 om udskydelse af
    anvendelsestidspunktet for forordning (EØF) nr. 1599/71 om fastlæggelse af yderligere
    betingelser, som indført vin, der er bestemt til direkte menneskeligt forbrug,
    skal opfylde
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1373/72 del Consiglio, del 30 giugno 1972, che rinvia
    la data di applicazione del regolamento (CEE) n. 1599/71 che fissa le condizioni
    supplementari cui devono rispondere i vini importati destinati al consumo umano
    diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1373/72 van de Raad van 30 juni 1972 waarbij de datum
    waarop Verordening (EEG) nr. 1599/71 tot vaststelling van nadere voorwaarden waaraan
    ingevoerde wijn die is bestemd voor rechtstreekse menselijke consumptie, moet
    beantwoorden, van toepassing wordt, wordt uitgesteld
  type: main
