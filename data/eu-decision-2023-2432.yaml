    с Регламент (ЕС) № 517/2014 на Европейския парламент
    и на Съвета за флуорсъдържащите парникови
    газове, на еталонни стойности за периода от
    1 януари 2024 г. до 31 декември 2024 г. за всеки производител
    или вносител, който законно е пускал флуоровъглеводороди
    на пазара в Съюза, считано от 1 януари 2015 г.,
    както е докладвано съгласно горепосочения
    регламент (нотифицирано под номер С(2023) 7800)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2023/2432 ze dne 26. října 2023,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) č. 517/2014 o
    fluorovaných skleníkových plynech stanoví referenční hodnoty na období
    od 1. ledna 2024 do 31. prosince 2024 pro každého výrobce nebo dovozce, který
    od 1. ledna 2015 v souladu s právními předpisy uvedl částečně fluorované
    uhlovodíky na trh v Unii a oznámil je podle uvedeného nařízení (oznámeno
    pod číslem C(2023) 7800)
  type: main
