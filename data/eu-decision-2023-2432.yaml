    siltumnīcefekta gāzēm, attiecībā uz periodu no 2024. gada 1. janvāra līdz
    2024. gada 31. decembrim nosaka atsauces vērtības katram ražotājam vai importētājam,
    kurš no 2015. gada 1. janvāra Savienībā likumīgi laidis tirgū fluorogļūdeņražus,
