    kasvuhoonegaaside kohta kindlaks kontrollväärtused ajavahemikuks 1. jaanuarist
    2024 kuni 31. detsembrini 2024 igale tootjale ja importijale, kes on kõnealuse
    määruse alusel teatatu kohaselt lasknud alates 1. jaanuarist 2015 liidus seaduslikult
