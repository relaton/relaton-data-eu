    Europeu e do Conselho, relativo aos gases fluorados com efeito de estufa, os valores
    de referência aplicáveis no período de 1 de janeiro de 2024 a 31 de dezembro
    de 2024, para cada produtor ou importador que tenha colocado legalmente hidrofluorocarbonetos
    no mercado na União a partir de 1 de janeiro de 2015, tal como comunicado ao
    abrigo desse regulamento [notificada com o número C(2023) 7800]
  type: main
