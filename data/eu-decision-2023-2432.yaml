    en de Raad betreffende gefluoreerde broeikasgassen, van referentiewaarden voor
    de periode van 1 januari 2024 tot en met 31 december 2024 voor elke producent
    of importeur die met ingang van 1 januari 2015 rechtmatig fluorkoolwaterstoffen
    in de Unie op de markt heeft gebracht, zoals gerapporteerd op grond van die verordening
