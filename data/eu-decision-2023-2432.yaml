    u tal-Kunsill dwar gassijiet fluworurati b’effett ta’ serra, tiddetermina
    l-valuri ta’ referenza għall-perjodu mill-1 ta’ Jannar 2024 sal-31 ta’
    Diċembru 2024 għal kull produttur jew importatur li jkun qiegħed legalment
    fis-suq l-idrofluworokarburi mill-1 ta’ Jannar 2015, kif irrapportati skont
    dak ir-Regolament (notifikata bid-dokument C(2023) 7800)
  type: main
