    European și al Consiliului privind gazele fluorurate cu efect de seră, a valorilor
    de referință pentru perioada 1 ianuarie 2024-31 decembrie 2024 pentru fiecare
    producător sau importator care a introdus hidrofluorocarburi în mod legal pe
    piață în Uniune începând cu 1 ianuarie 2015 conform rapoartelor transmise
    în temeiul regulamentului respectiv [notificată cu numărul C(2023) 7800]
  type: main
