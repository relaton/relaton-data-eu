  content: Komission täytäntöönpanopäätös (EU) 2023/2432, annettu 26 päivänä
    lokakuuta 2023, viitearvojen määrittämisestä fluoratuista kasvihuonekaasuista
    annetun Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 517/2014 nojalla
    1 päivän tammikuuta 2024 ja 31 päivän joulukuuta 2024 väliselle ajalle kullekin
    sellaiselle tuottajalle tai maahantuojalle, joka on saattanut kyseisen asetuksen
    mukaisesti ilmoitettuja fluorihiilivetyjä laillisesti unionin markkinoille 1
    päivästä tammikuuta 2015 alkaen (tiedoksiannettu numerolla C(2023) 7800)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2023/2432 ón gCoimisiún an 26 Deireadh
    Fómhair 2023 lena gcinntear, de bhun Rialachán (AE) Uimh. 517/2014 ó Pharlaimint
    na hEorpa agus ón gComhairle maidir le gáis cheaptha teasa fhluairínithe, luachanna
    tagartha don tréimhse ón 1 Eanáir 2024 go dtí an 31 Nollaig 2024 le haghaidh
    gach táirgeoir nó allmhaireoir a chuir hidreafluaracarbóin ar an margadh go
    dleathach san Aontas ón 1 Eanáir 2015, mar a thuairiscítear faoin Rialachán
    sin (tugadh fógra faoi leis an doiciméad C(2023) 7800)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2023/2432 оd 26. listopada 2023. o utvrđivanju
    referentnih vrijednosti, u skladu s Uredbom (EU) br. 517/2014 Europskog parlamenta
    i Vijeća o fluoriranim stakleničkim plinovima, za razdoblje od 1. siječnja
    2024. do 31. prosinca 2024. za svakog proizvođača ili uvoznika koji je zakonito
    stavio fluorougljikovodike na tržište Unije od 1. siječnja 2015., kako je prijavljeno
    u skladu s tom uredbom (priopćeno pod brojem dokumenta C(2023) 7800)
  type: main
- language: hu
  script: Latn
