    om fluorholdige drivhusgasser, af referenceværdier for perioden 1. januar 2024
    til 31. december 2024 for hver producent eller importør, der fra den 1. januar
    2015 i Unionen lovligt har markedsført hydrofluorcarboner som indberettet i medfør
    af nævnte forordning (meddelt under nummer C(2023) 7800)
  type: main
