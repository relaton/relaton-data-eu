    toplogrednih plinih, referenčnih vrednosti za obdobje od 1. januarja 2024 do
    31. decembra 2024 za vsakega proizvajalca ali uvoznika, ki je zakonito dal na
    trg fluorirane ogljikovodike od 1. januarja 2015 dalje, kot je sporočil v skladu
    z navedeno uredbo (notificirano pod dokumentarno številko C(2023) 7800)
  type: main
