    pateikimą Sąjungos rinkai nuo 2015 m. sausio 1 d., nustatomos 2024 m. sausio
    1 d. – 2024 m. gruodžio 31 d. laikotarpiu taikomos pamatinės vertės (pranešta
    dokumentu Nr. C(2023) 7800)
  type: main
