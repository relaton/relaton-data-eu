    nr 517/2014 w sprawie fluorowanych gazów cieplarnianych, wartości odniesienia
    dla okresu od dnia 1 stycznia 2024 r. do dnia 31 grudnia 2024 r. dla każdego
    producenta lub importera, który zgodnie z prawem wprowadził wodorofluorowęglowodory
