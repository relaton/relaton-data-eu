    26.) a 2015. január 1-jétől az Unióban fluorozott szénhidrogént jogszerűen
    forgalomba hozó és azt a fluortartalmú üvegházhatású gázokról szóló
    517/2014/EU európai parlamenti és tanácsi rendelet szerint bejelentő gyártók
    és importőrök tekintetében a 2024. január 1-jétől 2024. december 31-ig
    tartó időszakra vonatkozó referenciaértékeknek az említett rendelet értelmében
    történő megállapításáról (az értesítés a C(2023) 7800. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/2432 della Commissione, del 26 ottobre
    2023, che determina, a norma del regolamento (UE) n. 517/2014 del Parlamento europeo
    e del Consiglio sui gas fluorurati a effetto serra, i valori di riferimento per
    il periodo dal 1o gennaio 2024 al 31 dicembre 2024 per ciascun produttore o importatore
    che ha legalmente immesso in commercio idrofluorocarburi nell’Unione a decorrere
    dal 1o gennaio 2015, secondo quanto comunicato ai sensi di tale regolamento [notificata
    con il numero C(2023) 7800]
  type: main
- language: lv
  script: Latn
