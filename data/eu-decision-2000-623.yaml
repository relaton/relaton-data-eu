title:
- language: en
  script: Latn
  content: '2000/623/EC: Commission Decision of 29 September 2000 amending Council
    Decision 79/542/EEC drawing up a list of third countries from which the Member
    States authorise imports of bovine animals, equidae, sheep and goats, fresh meat
    and meat products to take into account some aspects regarding Chile (notified
    under document number C(2000) 2748)'
  type: main
- language: fr
  script: Latn
  content: '2000/623/CE: Décision de la Commission du 29 septembre 2000 modifiant
    la décision 79/542/CEE du Conseil établissant une liste des pays tiers en provenance
    desquels les États membres autorisent l''importation d''animaux des espèces
    bovine, porcine, ovine, caprine et équine ainsi que de viandes fraîches et de
    produits à base de viande, en vue de tenir compte de certains éléments concernant
    le Chili [notifiée sous le numéro C(2000) 2748]'
  type: main
- language: de
  script: Latn
  content: '2000/623/EG: Entscheidung der Kommission vom 29. September 2000 zur Änderung
    der Entscheidung 79/542/EWG des Rates zur Aufstellung einer Liste der Drittländer,
    aus denen die Mitgliedstaaten Einfuhren von Rindern, Schweinen, Einhufern, Schafen
    und Ziegen sowie von frischem Fleisch und Fleischerzeugnissen zulassen, zur Berücksichtigung
    einiger Aspekte betreffend Chile (Bekannt gegeben unter Aktenzeichen K(2000) 2748)'
  type: main
- language: da
  script: Latn
  content: '2000/623/EF: Kommissionens beslutning af 29. september 2000 om ændring
    af Rådets beslutning 79/542/EØF om opstilling af en liste over de tredjelande,
    hvorfra medlemsstaterne tillader indførsel af kvæg, svin, enhovede dyr, får
    og geder samt fersk kød og kødprodukter, for at tage hensyn til nogle aspekter
    vedrørende Chile (meddelt under nummer K(2000) 2748)'
  type: main
- language: el
  script: Grek
  content: '2000/623/ΕΚ: Απόφαση της Επιτροπής, της 29ης
    Σεπτεμβρίου 2000, για τροποποίηση της απόφασης
    79/542/ΕΟΚ του Συμβουλίου περί καταρτίσεως πίνακα
    τρίτων χωρών από τις οποίες τα κράτη μέλη επιτρέπουν
    την εισαγωγή βοοειδών, χοιροειδών, ιπποειδών,
    αιγοπροβάτων, νωπών κρεάτων και προϊόντων
    με βάση το κρέας ώστε να ληφθούν υπόψη ορισμένα
    θέματα που αφορούν την Χιλή [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 2748]'
  type: main
- language: fi
  script: Latn
  content: '2000/623/EY: Komission päätös, tehty 29 päivänä syyskuuta 2000,
    luettelosta kolmansista maista, joista jäsenvaltiot sallivat nautaeläinten,
    sikojen, hevoseläinten, lampaiden, vuohien, tuoreen lihan ja lihavalmisteiden
    tuonnin, tehdyn neuvoston päätöksen 79/542/ETY muuttamisesta Chileen liittyvien
    tiettyjen näkökohtien huomioon ottamiseksi (tiedoksiannettu numerolla K(2000)
    2748)'
  type: main
- language: it
  script: Latn
  content: '2000/623/CE: Decisione della Commissione, del 29 settembre 2000, che modifica
    la decisione 79/542/CEE del Consiglio, recante l''elenco dei paesi terzi da cui
    gli Stati membri autorizzano l''importazione di animali delle specie bovina, suina,
    ovina e caprina, di equidi, nonché di carni fresche e di prodotti a base di carne,
    in considerazione di taluni aspetti concernenti il Cile [notificata con il numero
    C(2000) 2748]'
  type: main
- language: nl
  script: Latn
  content: '2000/623/EG: Beschikking van de Commissie van 29 september 2000 houdende
    wijziging van Beschikking 79/542/EEG van de Raad tot vaststelling van een lijst
    van derde landen van waaruit de lidstaten de invoer van runderen, varkens, paardachtigen,
    schapen en geiten, vers vlees en vleesproducten toestaan, om rekening te houden
    met bepaalde aspecten betreffende Chili (kennisgeving geschied onder nummer C(2000)
    2748)'
  type: main
- language: pt
  script: Latn
  content: '2000/623/CE: Decisão da Comissão, de 29 de Setembro de 2000, que altera
    a Decisão 79/542/CEE do Conselho, que estabelece uma lista de países terceiros
    de onde os Estados-Membros autorizam a importação de animais das espécies bovina
    e suína e de carne fresca, para tomar em consideração determinados aspectos
    relativos ao Chile [notificada com o número C(2000) 2748]'
  type: main
- language: es
  script: Latn
  content: '2000/623/CE: Decisión de la Comisión, de 29 de septiembre de 2000, que
    modifica la Decisión 79/542/CEE del Consejo por la que se confecciona una lista
    de terceros países desde los cuales los Estados miembros autorizan importaciones
    de animales de las especies bovina, porcina, ovina y caprina, de équidos, de
    carnes frescas y de productos a base de carne, para atender a determinados aspectos
    referentes a Chile [notificada con el número C(2000) 2748]'
  type: main
- language: sv
  script: Latn
  content: '2000/623/EG: Kommissionens beslut av den 29 september 2000 om ändring
    av rådets beslut 79/542/EEG om upprättande av en förteckning över de tredje
    länder från vilka medlemsstaterna tillåter import av nötkreatur, svin, hästdjur,
    får, getter, färskt kött och köttprodukter för att ta hänsyn till vissa
    förhållanden i Chile [delgivet med nr K(2000) 2748]'
  type: main
