title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2022/75 of the Commission of 31 July 1975 amending
    Regulation (EEC) No 540/75 with regard to the additional measures to be taken
    in agriculture following the fixing, with effect from 4 August 1975, of new representative
    rates for the pound sterling and the Irish pound
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2022/75 de la Commission, du 31 juillet 1975, modifiant
    le règlement (CEE) n° 540/75 en ce qui concerne les mesures supplémentaires
    à prendre dans le secteur agricole suite à la fixation, avec effet au 4 août
    1975, de nouveaux taux représentatifs pour la livre anglaise et la livre irlandaise
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2022/75 der Kommission vom 31. Juli 1975 zur Änderung
    der Verordnung (EWG) Nr. 540/75 in bezug auf die ergänzenden Maßnahmen, die
    in der Landwirtschaft im Anschluß an die Festsetzung neuer repräsentativer Kurse
    für das englische Pfund und das irische Pfund ab 4. August 1975 zu treffen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2022/75 af 31. juli 1975 om ændring
    af forordning (EØF) nr. 540/75 for så vidt angår de supplerende foranstaltninger,
    der skal træffes inden for landbrugssektoren som følge af den fastsættelse,
    som får virkning den 4. august 1975, og af de nye repræsentative kurser for
    det engelske pund og det irske pund
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2022/75 della Commissione, del 31 luglio 1975, che
    modifica il regolamento (CEE) n. 540/75 per quanto riguarda le misure supplementari
    da adottare nel settore agricolo in seguito alla fissazione, con effetto dal 4
    agosto 1975, di nuovi tassi rappresentativi per la sterlina inglese e la sterlina
    irlandese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2022/75 van de Commissie van 31 juli 1975 houdende
    wijziging van Verordening (EEG) nr. 540/75 ten aanzien van de in de landbouwsector
    te nemen aanvullende maatregelen naar aanleiding van de vaststelling van nieuwe
    representatieve koersen voor het Engelse en het Ierse pond, die gelden met ingang
    van 4 augustus 1975
  type: main
