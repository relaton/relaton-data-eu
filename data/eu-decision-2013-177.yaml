    oblastí Španělska za úředně prosté brucelózy ( B. melitensis ), a kterým
    se mění přílohy II a III rozhodnutí 2003/467/ES, pokud jde o prohlášení
    určitých oblastí Španělska za úředně prosté brucelózy a určitých oblastí
    Itálie a Polska za úředně prosté enzootické leukózy skotu (oznámeno pod
    číslem C(2013) 1951)'
