title:
- language: en
  script: Latn
  content: '2013/177/EU: Commission Implementing Decision of 10 April 2013 amending
    Annex II to Decision 93/52/EEC as regards the recognition of certain regions of
    Spain as officially free of brucellosis ( B. melitensis ) and amending Annexes
    II and III to Decision 2003/467/EC as regards the declaration of certain regions
    of Spain as officially brucellosis-free and certain regions of Italy and Poland
    as officially enzootic-bovine-leukosis-free (notified under document C(2013) 1951)'
  type: main
- language: fr
  script: Latn
  content: '2013/177/UE: Décision d’exécution de la Commission du 10 avril 2013
    modifiant l’annexe II de la décision 93/52/CEE en ce qui concerne certaines
    régions de l’Espagne reconnues officiellement indemnes de brucellose ( B. melitensis
    ) et modifiant les annexes II et III de la décision 2003/467/CE en ce qui concerne
    certaines régions de l’Espagne déclarées officiellement indemnes de brucellose
    et certaines régions de l’Italie et de la Pologne déclarées officiellement
    indemnes de leucose bovine enzootique [notifiée sous le numéro C(2013) 1951]'
  type: main
- language: de
  script: Latn
  content: '2013/177/EU: Durchführungsbeschluss der Kommission vom 10. April 2013
    zur Änderung des Anhangs II der Entscheidung 93/52/EWG hinsichtlich der Anerkennung
    bestimmter Regionen Spaniens als amtlich frei von Brucellose ( B. melitensis )
    sowie zur Änderung der Anhänge II und III der Entscheidung 2003/467/EG hinsichtlich
    der Anerkennung bestimmter Regionen Spaniens als amtlich frei von Brucellose sowie
    bestimmter Regionen Italiens und Polens als amtlich frei von enzootischer Rinderleukose
    (Bekanntgegeben unter Aktenzeichen C(2013) 1951)'
  type: main
- language: bg
