title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1803/91 of 24 June 1991 re-establishing
    the levying of customs duties on products of category 15 (order No 40.0150) originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1803/91 DE LA COMMISSION du 24 juin 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    15 (numéro d'' ordre 40.0150) originaires du Pakistan, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1803/91 DER KOMMISSION vom 24. Juni 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 15 (laufende
    Nummer 40.0150) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1803/91 af 24. juni 1991 om genindførelse
    af opkrævning af told for varer under kategori nr. 15 (løbenummer 40.0150),
    som har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1803/91 της Επιτροπής
    της 24ης Ιουνίου 1991 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    15 ( αύξων αριθμός 40.0160 ), καταγωγής Πακιστάν,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1803/91 DELLA COMMISSIONE del 24 giugno 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 15 (numero d'' ordine 40.0150), originari del Pakistan, beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1803/91 VAN DE COMMISSIE van 24 juni 1991 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van categorie nr. 15 (volgnummer 40.0150) van oorsprong uit Pakistan waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad #'
  type: main
