title:
- language: en
  script: Latn
  content: '93/533/EEC: Commission Decision of 24 September 1993 amending Decision
    91/651/EEC on the establishment of the Community support framework for Community
    structural assistance on the improvement of the conditions under which agricultural
    and forest products are processed and marketed in Spain (with the exception of
    the regions of Andalusia, Asturias, Castile-León, Castile-La Mancha, Valencia,
    Extremadura, Galicia, the Canary Islands, Murcia, Ceuta-Melilla) (Only the Spanish
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/533/CEE: Décision de la Commission du 24 septembre 1993 modifiant
    la décision 91/651/CEE concernant l''établissement du cadre communautaire d''appui
    pour les interventions structurelles communautaires en Espagne (à l''exception
    de l''Andalousie, des Asturies, des Canaries, de la Castille et León, de la Castille-La
    Manche, de la Communauté valencienne, de l''Estrémadure, de la Galice, de la
    Murcie, de Ceuta et Melilla) en matière d''amélioration des conditions de transformation
    et de commercialisation des produits agricoles et sylvicoles (Le texte en langue
    espagnole est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '93/533/EWG: ENTSCHEIDUNG DER KOMMISSION vom 24. September 1993 zur Änderung
    der Entscheidung 91/651/EWG über eine Ergänzung eines gemeinschaftlichen Förderkonzepts
    für gemeinschaftliche Strukturinterventionen zur Verbesserung der Verarbeitungs-
    und Vermarktungsbedingungen für land- und forstwirtschaftliche Erzeugnisse in
    Spanien (ohne die Regionen Andalucía, Asturias, Canarias, Castilla y León, Castilla-La
    Mancha, Comunidad Valenciana, Extremadura, Galicia, Murcia, Ceuta y Melilla) (Nur
    der spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/533/EØF: KOMMISSIONENS BESLUTNING af 24. september 1993 om ændring
    af beslutning 91/651/EØF om fastlæggelse af fællesskabsstøtterammen for EF''
    s strukturinterventioner i Spanien (undtagen regionerne Andalucía, Asturias,
    Castilla y León, Castilla-La Mancha, Comunidad Valenciana, Extremadura, Galicia,
    Canarias, Murcia, Ceuta og Melilla) til forbedring af vilkårene for forarbejdning
    og afsætning af landbrugs- og skovbrugsprodukter (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/533/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 24ης
    Σεπτεμβρίου 1993 για την τροποποίηση της αποφάσεως
    91/651/ΕΟΚ σχετικά με την κατάρτιση της προσθήκης
    του κοινοτικού πλαισίου στήριξης για τις κοινοτικές
    διαρθρωτικές παρεμβάσεις στην Ισπανία (με
    εξαίρεση την Ανδαλουσία, την Αστούριας, τις
    Κανάριες Νήσους, την Καστίλια και Λεόν, την
    Καστίλια-λα Μάντσα, τη Βαλένσια, την Εστρεμαδούρα,
    την Γκαλίσια, τη Μούρθια, τη Θέουτα και Μελίλλια)
    για τη βελτίωση των συνθηκών μεταποίησης και
    εμπορίας γεωργικών και δασοκομικών προϊόντων
    (Το κείμενο στην ισπανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/533/CEE: DECISIONE DELLA COMMISSIONE del 24 settembre 1993 che modifica
    la decisione 91/651/CEE riguardante la definizione del quadro comunitario di sostegno
    per gli interventi strutturali comunitari in Spagna (escluse le seguenti regioni:
    Andalucía, Asturias, Castilla y Léon, Castilla-La Mancha, Comunidad Valenciana,
    Extremadura, Galicia, Canarias, Murcia, Ceuta y Melilla) in ordine al miglioramento
    delle condizioni di trasformazione e di commercializzazione dei prodotti agricoli
    e silvicoli (Il testo in lingua spagnola è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/533/EEG: BESCHIKKING VAN DE COMMISSIE van 24 september 1993 houdende
    wijziging van Beschikking 91/651/EEG van de Commissie tot vaststelling van het
    communautaire bestek voor structurele bijstandsverlening van de Gemeenschap voor
    de verbetering van de verwerking en de afzet van landbouwprodukten in Spanje (met
    uitzondering van de regio'' s Andalucía, Asturias, Castilla y León, Castilla-La
    Mancha, Comunidad Valenciana, Extremadura, Galicia, Canarias, Murcia, Ceuta y
    Melilla) (Slechts de tekst in de Spaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/533/CEE: DECISÃO DA COMISSÃO de 24 de Setembro de 1993 que altera
    a Decisão 91/651/CEE que estabelece um quadro comunitário de apoio para as intervenções
    estruturais comunitárias em Espanha (excluindo a Andaluzia, as Astúrias, as
    Canárias, Castela e Leão, Castela-Mancha, a Comunidade Valenciana, a Extremadura,
    a Galiza, Múrcia, Ceuta e Melilha) em matéria de melhoria das condições de
    transformação e comercialização dos produtos agrícolas e silvícolas (Apenas
    faz fé o texto em língua espanhola)'
  type: main
- language: es
  script: Latn
  content: '93/533/CEE: DECISIÓN DE LA COMISIÓN de 24 de septiembre de 1993 por
    la que se modifica la Decisión 91/651/CEE por la que se establece el marco comunitario
    de apoyo para la ayuda estructural comunitaria a España (excepto las siguientes
    regiones: Andalucía, Asturias, Canarias, Castilla y León, Castilla-La Mancha,
    Comunidad Valenciana, Extremadura, Galicia, Murcia, Ceuta y Melilla) para la mejora
    de las condiciones de transformación y comercialización de los productos agrarios
    (El texto en lengua española es el único auténtico)'
