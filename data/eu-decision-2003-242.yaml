    nos anexos I e II da Directiva 66/403/CEE do Conselho, a adoptar relativamente
    a certas doenças, no que se refere à comercialização de batatas de semente
    em todo o território de determinados Estados-Membros ou em partes destes (Texto
    relevante para efeitos do EEE) [notificada com o número C(2003) 1057]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 3. apríla 2003, ktorým sa mení a dopĺňa rozhodnutie
