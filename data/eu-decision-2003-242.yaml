  script: Latn
  content: '2003/242/EC: Commission Decision of 3 April 2003 amending Decision 93/231/EEC,
    authorising, in respect of the marketing of seed potatoes in all or part of the
    territory of certain Member States, more stringent measures against certain diseases
    than are provided for in Annexes I and II to Council Directive 66/403/EEC (Text
    with EEA relevance) (notified under document number C(2003) 1057)'
  type: main
- language: fr
  script: Latn
  content: '2003/242/CE: Décision de la Commission du 3 avril 2003 modifiant la décision
