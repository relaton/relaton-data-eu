title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/234 of 16 February 2022 adopting
    the fifteenth update of the list of sites of Community importance for the Mediterranean
    biogeographical region (notified under document C(2022) 862)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/234 de la Commission du 16 février
    2022 arrêtant la quinzième actualisation de la liste des sites d’importance
    communautaire pour la région biogéographique méditerranéenne [notifiée sous
    le numéro C(2022) 862]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/234 der Kommission vom 16. Februar 2022
