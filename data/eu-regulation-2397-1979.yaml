    sowie der Verordnung (EWG) Nr. 338/79 zur Festlegung besonderer Vorschriften für
    Qualitätsweine bestimmter Anbaugebiete
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2397/79 af 30. oktober 1979 om ændring af
