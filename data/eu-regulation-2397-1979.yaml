  content: Council Regulation (EEC) No 2397/79 of 30 October 1979 amending Regulation
    (EEC) No 337/79 on the common organization of the market in wine and Regulation
    (EEC) No 338/79 laying down special provisions relating to quality wines produced
    in specified regions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2397/79 du Conseil, du 30 octobre 1979, modifiant
    le règlement (CEE) n° 337/79 portant organisation commune du marché viti-vinicole
    ainsi que le règlement (CEE) n° 338/79 établissant des dispositions particulières
    relatives aux vins de qualité produits dans des régions déterminées
  type: main
