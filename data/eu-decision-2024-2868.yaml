  content: Decisão (UE) 2024/2868 do Conselho, de 5 de novembro de 2024, relativa
    à posição a tomar, em nome da União Europeia, no Fórum Mundial para a Harmonização
    das Regulamentações aplicáveis a Veículos da Comissão Económica para a Europa
    da Organização das Nações Unidas, no que respeita às propostas de alteração
    dos Regulamentos n.os 0, 10, 13, 13-H, 14, 16, 17, 21, 25, 29, 43, 46, 74, 80,
    86, 94, 95, 100, 110, 114, 116, 118, 125, 127, 129, 134, 135, 137, 145, 147, 148,
    149, 153, 157, 158, 166, 167 e 171 da ONU, às propostas de um novo regulamento
    da ONU relativo à instalação de cintos de segurança, sistemas de retenção,
    sistemas de retenção para crianças, sistemas ISOFIX de retenção para crianças
    e sistemas i-Size de retenção para crianças, de um novo regulamento da ONU
    relativo a avisadores de cintos de segurança, de um novo regulamento da ONU relativo
    a disposições uniformes para a homologação do controlo da aceleração em
    caso de utilização do pedal errado, e de um novo regulamento da ONU relativo
    à assistência no campo de visão, às propostas de alteração dos Regulamentos
    Técnicos Globais n.os 6, 7 e 14 da ONU, a uma proposta de alteração da Resolução
    Consolidada sobre as especificações comuns das categorias de fontes luminosas,
    a uma proposta de alteração da Resolução Mútua n.° 1 da ONU, e a uma proposta
    de mandato do grupo de trabalho informal sobre inspeções técnicas periódicas
  type: main
