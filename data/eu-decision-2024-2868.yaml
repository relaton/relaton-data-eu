  content: Rozhodnutie Rady (EÚ) 2024/2868 z 5. novembra 2024 o pozícii, ktorá
    sa má v mene Európskej únie zaujať vo Svetovom fóre Európskej hospodárskej
    komisie Organizácie Spojených národov pre harmonizáciu predpisov o vozidlách,
    pokiaľ ide o návrhy na zmenu predpisov OSN č. 0, 10, 13, 13-H, 14, 16, 17,
    21, 25, 29, 43, 46, 74, 80, 86, 94, 95, 100, 110, 114, 116, 118, 125, 127, 129,
    134, 135, 137, 145, 147, 148, 149, 153, 157, 158, 166, 167 a 171, pokiaľ ide
    o návrhy nového predpisu OSN o montáži bezpečnostných pásov, zadržiavacích
    systémov, detských zadržiavacích systémov, detských zadržiavacích systémov
    ISOFIX a detských zadržiavacích systémov typu i-Size, nového predpisu OSN
    o signalizátoroch nezapnutého bezpečnostného pásu, nového predpisu OSN o
    jednotných ustanoveniach na schvaľovanie systému na obmedzenie zrýchlenia
    v prípade chybného použitia pedála a nového predpisu OSN o asistenčnom systéme
    zobrazujúcom informácie v zornom poli, návrhy na zmeny globálnych technických
    predpisov OSN č. 6, 7 a 14, návrh zmeny Konsolidovanej rezolúcie o spoločnej
    špecifikácii kategórií zdrojov svetla, návrh na zmenu spoločnej rezolúcie
    OSN č. 1 a návrh mandátu neformálnej pracovnej skupiny pre pravidelné technické
    kontroly
