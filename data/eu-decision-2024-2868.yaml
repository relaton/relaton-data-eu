  script: Latn
  content: Besluit (EU) 2024/2868 van de Raad van 5 november 2024 betreffende het
    namens de Europese Unie in het Wereldforum voor de harmonisatie van reglementen
    voor voertuigen van de Economische Commissie voor Europa van de Verenigde Naties
    in te nemen standpunt over voorstellen tot wijziging van de VN-Reglementen nrs.
    0, 10, 13, 13-H, 14, 16, 17, 21, 25, 29, 43, 46, 74, 80, 86, 94, 95, 100, 110,
    114, 116, 118, 125, 127, 129, 134, 135, 137, 145, 147, 148, 149, 153, 157, 158,
    166, 167 en 171, en over voorstellen voor een nieuw VN-reglement voor de installatie
    van veiligheidsgordels, beveiligingssystemen, kinderbeveiligingssystemen, Isofix-kinderbeveiligingssystemen,
    beveiligingssystemen en i-Size-kinderbeveiligingssystemen, een nieuw VN-reglement
    betreffende veiligheidsgordelverklikkers, een nieuw VN-reglement betreffende uniforme
    bepalingen voor de goedkeuring van acceleratieregelsystemen voor pedaalfouten
    en een nieuw VN-reglement betreffende ondersteuning van het gezichtsveld, betreffende
    voorstellen tot wijziging van de mondiale technische reglementen nrs. 6, 7 en
    14 van de VN, betreffende een voorstel tot wijziging van de geconsolideerde resolutie
    betreffende de gemeenschappelijke specificatie van lichtbroncategorieën, betreffende
    een voorstel tot wijziging van Gemeenschappelijke Resolutie nr. 1 van de VN en
    betreffende een voorstel voor een taakomschrijving van de informele werkgroep
    inzake periodieke technische controles
  type: main
