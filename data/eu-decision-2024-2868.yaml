  script: Latn
  content: Decizia (UE) 2024/2868 a Consiliului din 5 noiembrie 2024 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Forumului
    mondial pentru armonizarea regulamentelor privind vehiculele al Comisiei Economice
    pentru Europa a Organizației Națiunilor Unite cu privire la propunerile de modificare
    a Regulamentelor ONU nr. 0, 10, 13, 13-H, 14, 16, 17, 21, 25, 29, 43, 46, 74,
    80, 86, 94, 95, 100, 110, 114, 116, 118, 125, 127, 129, 134, 135, 137, 145, 147,
    148, 149, 153, 157, 158, 166, 167 și 171, cu privire la propunerile pentru un
    nou regulament ONU privind instalarea centurilor de siguranță, a sistemelor
    de reținere, a sistemelor de reținere pentru copii, a sistemelor ISOFIX de reținere
    pentru copii și a sistemelor i-Size de reținere pentru copii, la un nou regulament
    ONU privind dispozitivele de avertizare privind portul centurilor de siguranță,
    la un nou regulament ONU privind dispozițiile uniforme pentru omologarea comenzii
    accelerației în legătură cu erorile pe pedală, precum și la un nou regulament
    ONU privind asistența pentru câmpul vizual, cu privire la propunerile de amendamente
    la Regulamentele tehnice mondiale ONU nr. 6, 7 și 14, cu privire la propunerea
    de amendament la rezoluția consolidată privind specificațiile comune ale categoriilor
    de surse luminoase, cu privire la o propunere de amendament la Rezoluția reciprocă
    ONU nr. 1 și cu privire la o propunere de mandat al grupului de lucru informal
    privind inspecțiile tehnice periodice
  type: main
