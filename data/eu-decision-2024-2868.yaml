    uzstādīšanu, jauniem ANO noteikumiem par drošības jostu atgādinātājiem,
    jauniem ANO noteikumiem, kas satur vienotus noteikumus par apstiprināšanu attiecībā
    uz paātrinājuma vadību pedāļa kļūdas gadījumā, un jauniem ANO noteikumiem
    par asistenci skata laukā, priekšlikumiem par izmaiņām ANO Vispārējos tehniskajos
    noteikumos Nr. 6, 7 un 14, priekšlikumu par grozījumu Konsolidētajā rezolūcijā
    par gaismas avotu kategoriju kopīgo specifikāciju, priekšlikumu par grozījumu
    ANO savstarpējā rezolūcijā Nr. 1 un priekšlikumu par Periodiskās tehniskās
    apskates neformālās darba grupas darba uzdevumu
  type: main
- language: lt
  script: Latn
  content: 2024 m. lapkričio 5 d. Tarybos sprendimas (ES) 2024/2868, dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi Jungtinių Tautų Europos
    ekonomikos komisijos pasauliniame forume transporto priemonių reglamentavimui
    suderinti, dėl JT taisyklių Nr. 0, 10, 13, 13-H, 14, 16, 17, 21, 25, 29, 43,
    46, 74, 80, 86, 94, 95, 100, 110, 114, 116, 118, 125, 127, 129, 134, 135, 137,
    145, 147, 148, 149, 153, 157, 158, 166, 167 ir 171 pakeitimų pasiūlymų, dėl
    naujos JT taisyklės dėl saugos diržų, apsaugos sistemų, vaiko apsaugos sistemų,
    ISOFIX vaiko apsaugos sistemų bei i dydžio vaiko apsaugos sistemų įrengimo,
    naujos JT taisyklės dėl priminimų prisisegti saugos diržus, naujos JT taisyklės
    dėl vienodų pagreičio valdymo, susijusio su pedalo klaida, patvirtinimo nuostatų
    ir naujos JT taisyklės dėl pagalbinės regėjimo lauko įrangos, dėl JT bendrųjų
    techninių reglamentų Nr. 6, 7 ir 14 pakeitimų pasiūlymų, dėl pasiūlymo
    iš dalies pakeisti suvestinę rezoliuciją dėl šviesos šaltinių kategorijų
    bendrosios specifikacijos, dėl pasiūlymo iš dalies pakeisti JT bendrąjį nutarimą
    Nr. 1 ir dėl pasiūlymo dėl neoficialios darbo grupės įgaliojimų periodinių
    techninių apžiūrų klausimais
  type: main
- language: mt
  script: Latn
