    ġdid tan-NU dwar it-tfakkiriet għall-qfil taċ-ċinturin tas-sikurezza, regolament
    ġdid tan-NU dwar dispożizzjonijiet uniformi għall-approvazzjoni tal-kontroll
    tal-aċċellerazzjoni għall-iżbalji tal-pedala, u regolament ġdid tan-NU dwar
    l-assistent tal-kamp ta’ viżjoni, dwar proposti għal modifiki tar-regolamenti
    tekniċi globali tan-NU Nru 6, 7 u 14, dwar proposta għal emenda tar-riżoluzzjoni
    konsolidata dwar l-ispeċifikazzjoni komuni tal-kategoriji tas-sorsi tad-dawl,
