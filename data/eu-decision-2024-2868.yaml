    urządzeń przytrzymujących dla dzieci, urządzeń przytrzymujących dla dzieci
    ISOFIX i urządzeń przytrzymujących dla dzieci i-Size, nowego regulaminu ONZ
    w sprawie urządzeń przypominających o zapięciu pasów, nowego regulaminu ONZ
    w sprawie jednolitych przepisów dotyczących homologacji systemu kontroli przyspieszenia
    przy nieprawidłowym naciśnięciu pedału oraz nowego regulaminu ONZ w sprawie
    asystenta pola widzenia, w odniesieniu do wniosków dotyczących modyfikacji ogólnoświatowych
    regulaminów technicznych ONZ nr 6, 7 i 14, w odniesieniu do wniosku dotyczącego
    poprawki do ujednoliconej rezolucji w sprawie wspólnej specyfikacji kategorii
    źródeł światła, w odniesieniu do wniosku dotyczącego poprawki do wzajemnej
    rezolucji ONZ nr 1 oraz w odniesieniu do wniosku dotyczącego zakresu zadań nieformalnej
    grupy roboczej ds. okresowego badania zdatności do ruchu drogowego
  type: main
