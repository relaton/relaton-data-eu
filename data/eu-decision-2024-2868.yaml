    29, 43, 46, 74, 80, 86, 94, 95, 100, 110, 114, 116, 118, 125, 127, 129, 134, 135,
    137, 145, 147, 148, 149, 153, 157, 158, 166, 167 y 171 de las Naciones Unidas,
    las propuestas de un nuevo Reglamento de las Naciones Unidas sobre la instalación
    de cinturones de seguridad, sistemas de retención, sistemas de retención infantil
    y sistemas de retención infantil ISOFIX e i-Size, un nuevo Reglamento de las
    Naciones Unidas sobre los sistemas de alerta de olvido del cinturón de seguridad,
    un nuevo Reglamento de las Naciones Unidas sobre disposiciones uniformes para
    la homologación de los sistemas de control de la aceleración en caso de error
    de pedal y un nuevo Reglamento de las Naciones Unidas sobre un asistente para
    el campo de visión, a las propuestas de modificaciones de los Reglamentos Técnicos
    Mundiales n.os 6, 7 y14 de las Naciones Unidas, a una propuesta de enmienda a
    la Resolución consolidada sobre la especificación común de las categorías
    de fuentes luminosas, a una propuesta de enmienda a la Resolución mutua n.°
    1 de las Naciones Unidas, y a una propuesta de mandato del grupo de trabajo informal
    sobre inspecciones técnicas periódicas
  type: main
