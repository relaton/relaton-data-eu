  script: Latn
  content: Rådets beslut (EU) 2024/2868 av den 5 november 2024 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i Förenta nationernas ekonomiska
    kommission för Europas världsforum för harmonisering av fordonsföreskrifter
    vad gäller förslagen till ändringar av FN-föreskrifterna nr 0, 10, 13, 13-H,
    14, 16, 17, 21, 25, 29, 43, 46, 74, 80, 86, 94, 95, 100, 110, 114, 116, 118, 125,
    127, 129, 134, 135, 137, 145, 147, 148, 149, 153, 157, 158, 166, 167 och 171,
    vad gäller förslag till en ny FN-föreskrift om installation av säkerhetsbälten,
    fasthållningsanordningar, fasthållningsanordningar för barn, Isofix-fasthållningsanordningar
    för barn och i-Size-fasthållningsanordningar för barn, en ny FN-föreskrift
    om bältespåminnare, en ny FN-föreskrift om enhetliga bestämmelser för godkännande
    av kontrollsystem för felaktig pedaltryckning (ACPE) och en ny FN-föreskrift
    om hjälpsystem för siktfält, vad gäller förslag till ändringar av globala
    tekniska FN-föreskrifter nr 6, 7 och 14, vad gäller ett förslag till ändring
    av den konsoliderade resolutionen om gemensamma specifikationer för kategorier
    av ljuskällor, vad gäller ett förslag till ändring av ömsesidig FN-resolution
    nr 1 och vad gäller ett förslag till mandat för den informella arbetsgruppen
    för periodiska tekniska inspektioner
