    se crea la Agencia Europea de Sustancias y Preparados Químicos, se modifica la
    Directiva 1999/45/CE y se derogan el Reglamento (CEE) n o 793/93 del Consejo y
    el Reglamento (CE) n o 1488/94 de la Comisión así como la Directiva 76/769/CEE
    del Consejo y las Directivas 91/155/CEE, 93/67/CEE, 93/105/CE y 2000/21/CE de
    la Comisión
