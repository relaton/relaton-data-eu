    ja rajoituksista (REACH), Euroopan kemikaaliviraston perustamisesta, direktiivin
    1999/45/EY muuttamisesta sekä neuvoston asetuksen (ETY) N:o 793/93, komission
    asetuksen (EY) N:o 1488/94, neuvoston direktiivin 76/769/ETY ja komission direktiivien
    91/155/ETY, 93/67/ETY, 93/105/EY ja 2000/21/EY kumoamisesta
  type: main
