title:
- language: en
  script: Latn
  content: Regulation (EC) No 1907/2006 of the European Parliament and of the Council
    of 18 December 2006 concerning the Registration, Evaluation, Authorisation and
    Restriction of Chemicals (REACH), establishing a European Chemicals Agency, amending
    Directive 1999/45/EC and repealing Council Regulation (EEC) No 793/93 and Commission
    Regulation (EC) No 1488/94 as well as Council Directive 76/769/EEC and Commission
    Directives 91/155/EEC, 93/67/EEC, 93/105/EC and 2000/21/EC
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1907/2006 du Parlement européen et du Conseil du 18
    décembre 2006 concernant l'enregistrement, l'évaluation et l'autorisation des
    substances chimiques, ainsi que les restrictions applicables à ces substances
    (REACH), instituant une agence européenne des produits chimiques, modifiant la
    directive 1999/45/CE et abrogeant le règlement (CEE) n o 793/93 du Conseil et
    le règlement (CE) n o 1488/94 de la Commission ainsi que la directive 76/769/CEE
    du Conseil et les directives 91/155/CEE, 93/67/CEE, 93/105/CE et 2000/21/CE de
    la Commission
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1907/2006 des Europäischen Parlaments und des Rates
    vom 18. Dezember 2006 zur Registrierung, Bewertung, Zulassung und Beschränkung
    chemischer Stoffe (REACH), zur Schaffung einer Europäischen Agentur für chemische
    Stoffe, zur Änderung der Richtlinie 1999/45/EG und zur Aufhebung der Verordnung
    (EWG) Nr. 793/93 des Rates, der Verordnung (EG) Nr. 1488/94 der Kommission, der
    Richtlinie 76/769/EWG des Rates sowie der Richtlinien 91/155/EWG, 93/67/EWG, 93/105/EG
    und 2000/21/EG der Kommission
  type: main
- language: bg
  script: Cyrl
