    decembris ), kas attiecas uz ķimikāliju reģistrēšanu, vērtēšanu, licencēšanu
    un ierobežošanu ( REACH ), un ar kuru izveido Eiropas Ķimikāliju aģentūru,
    groza Direktīvu 1999/45/EK un atceļ Padomes Regulu (EEK) Nr. 793/93 un Komisijas
    Regulu (EK) Nr. 1488/94, kā arī Padomes Direktīvu 76/769/EEK un Komisijas Direktīvu
    91/155/EEK, Direktīvu 93/67/EEK, Direktīvu 93/105/EK un Direktīvu 2000/21/EK
  type: main
