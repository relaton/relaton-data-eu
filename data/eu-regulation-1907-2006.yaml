  script: Latn
  content: Az Európai Parlament és a Tanács 1907/2006/EK rendelete ( 2006. december
    18 .) a vegyi anyagok regisztrálásáról, értékeléséről, engedélyezéséről
    és korlátozásáról (REACH), az Európai Vegyianyag-ügynökség létrehozásáról,
    az 1999/45/EK irányelv módosításáról, valamint a 793/93/EGK tanácsi rendelet,
    az 1488/94/EK bizottsági rendelet, a 76/769/EGK tanácsi irányelv, a 91/155/EGK,
    a 93/67/EGK, a 93/105/EK és a 2000/21/EK bizottsági irányelv hatályon kívül
    helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1907/2006 del Parlamento europeo e del Consiglio, del
    18 dicembre 2006 , concernente la registrazione, la valutazione, l'autorizzazione
    e la restrizione delle sostanze chimiche (REACH), che istituisce un'Agenzia europea
    per le sostanze chimiche, che modifica la direttiva 1999/45/CE e che abroga il
    regolamento (CEE) n. 793/93 del Consiglio e il regolamento (CE) n. 1488/94 della
    Commissione, nonché la direttiva 76/769/CEE del Consiglio e le direttive della
    Commissione 91/155/CEE, 93/67/CEE, 93/105/CE e 2000/21/CE
  type: main
- language: lv
  script: Latn
