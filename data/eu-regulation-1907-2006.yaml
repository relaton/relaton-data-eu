    ir apribojimų (REACH), įsteigiantis Europos cheminių medžiagų agentūrą,
    iš dalies keičiantis Direktyvą 1999/45/EB bei panaikinantis Tarybos reglamentą
    (EEB) Nr. 793/93, Komisijos reglamentą (EB) Nr. 1488/94, Tarybos direktyvą 76/769/EEB
    ir Komisijos direktyvas 91/155/EEB, 93/67/EEB, 93/105/EB bei 2000/21/EB
  type: main
