    регистрацията, оценката, разрешаването и ограничаването
    на химикали (REACH), за създаване на Европейска
    агенция по химикали, за изменение на Директива
    1999/45/ЕО и за отмяна на Регламент (ЕИО) № 793/93
    на Съвета и Регламент (ЕО) № 1488/94 на Комисията,
    както и на Директива 76/769/ЕИО на Съвета и директиви
    91/155/ЕИО, 93/67/ЕИО, 93/105/ЕО и 2000/21/ЕО на Комисията
  type: main
