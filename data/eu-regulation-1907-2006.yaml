    beperkingen ten aanzien van chemische stoffen (REACH), tot oprichting van een
    Europees Agentschap voor chemische stoffen, houdende wijziging van Richtlijn 1999/45/EG
    en houdende intrekking van Verordening (EEG) nr. 793/93 van de Raad en Verordening
    (EG) nr. 1488/94 van de Commissie alsmede Richtlijn 76/769/EEG van de Raad en
