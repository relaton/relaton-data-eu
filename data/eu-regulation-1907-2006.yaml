  script: Latn
  content: Nařízení Evropského parlamentu a Rady (ES) č. 1907/2006 ze dne 18.
    prosince 2006 o registraci, hodnocení, povolování a omezování chemických
    látek, o zřízení Evropské agentury pro chemické látky, o změně směrnice
    1999/45/ES a o zrušení nařízení Rady (EHS) č. 793/93, nařízení Komise
    (ES) č. 1488/94, směrnice Rady 76/769/EHS a směrnic Komise 91/155/EHS, 93/67/EHS,
    93/105/ES a 2000/21/ES
  type: main
- language: da
  script: Latn
