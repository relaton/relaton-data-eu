    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2935/93 der Kommission vom 25. Oktober 1993 zur Änderung
