    Ausfuhr von im Besitz der französischen Interventionsstelle befindlichem Brotweichweizen
    auf 3 700 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2935/93 af 25. oktober 1993 om ændring
