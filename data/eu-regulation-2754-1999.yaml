title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2754/1999 of 22 December 1999 amending Regulation
    (EC) No 822/1999 on the sale, at prices fixed in advance, of beef held by certain
    intervention agencies, with a view to its processing in the Community for food-aid
    purposes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2754/1999 de la Commission, du 22 décembre 1999, modifiant
    le règlement (CE) nº 822/1999 relatif à la vente, à prix fixés forfaitairement
    à l'avance, de viandes bovines détenues par certains organismes d'intervention
    en vue de leur transformation dans la Communauté aux fins de l'aide alimentaire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2754/1999 der Kommission vom 22. Dezember 1999 zur
    Änderung der Verordnung (EG) Nr. 822/1999 über den Verkauf von Rindfleisch aus
    Beständen bestimmter Interventionsstellen zu pauschal im voraus festgesetzten
    Preisen im Hinblick auf seine Verarbeitung in der Gemeinschaft zu Zwecken der
    Nahrungsmittelhilfe
  type: main
- language: cs
  script: Latn
  content: NAŘÍZENÍ KOMISE (ES) č. 2754/1999 ze dne 22. prosince 1999, kterým
    se mění nařízení (ES) č. 822/1999 o prodeji hovězího masa ze zásob některých
    intervenčních agentur za předem paušálně stanovené ceny za účelem jeho
    zpracování ve Společenství pro potravinovou pomoc
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2754/1999 af 22. december 1999 om ændring
    af forordning (EF) nr. 822/1999 om salg til forudfastsat pris af oksekød, som
    visse interventionsorganer ligger inde med, med henblik på forarbejdning i Fællesskabet
    og levering som fødevarehjælp
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2754/1999 της Επιτροπής,
    της 22ας Δεκεμβρίου 1999, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 822/1999 για την πώληση,
    με τιμή που καθορίζεται κατ' αποκοπή εκ των
    προτέρων, βοείου κρέατος που κατέχεται από
    ορισμένους οργανισμούς παρέμβασης για να μεταποιηθεί
    στην Κοινότητα με σκοπό την επισιτιστική βοήθεια
  type: main
- language: et
  script: Latn
  content: KOMISJONI MÄÄRUS (EÜ) nr 2754/1999, 22. detsember 1999, millega muudetakse
    määrust (EÜ) nr 822/1999 teatavate sekkumisametite valduses oleva veiseliha
    eelnevalt kindlaksmääratud hindadega müügi kohta selle töötlemiseks ühenduses
    toiduabi eesmärgil
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2754/1999, annettu 22 päivänä joulukuuta 1999,
    tiettyjen interventioelinten hallussaan pitämän ja yhteisössä jalostettavaksi
    tarkoitetun naudanlihan myynnistä ennakolta kiinteästi vahvistettuun hintaan
    elintarvikeapua varten annetun asetuksen (EY) N:o 822/1999 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A BIZOTTSÁG 2754/99/EK RENDELETE (1999. december 22.) egyes intervenciós
    hivatalok birtokában lévő, a Közösségben élelmiszersegély céljából
    történő feldolgozásra szánt marhahús előre rögzített áron történő
    értékesítéséről szóló 822/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2754/1999 della Commissione, del 22 dicembre 1999,
    che modifica il regolamento (CE) n. 822/1999 relativo alla vendita, a prezzi fissati
    forfettariamente in anticipo, di carni bovine detenute da taluni organismi d'intervento
    e destinate alla trasformazione nella Comunità ai fini di aiuto alimentare
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2754/1999 (1999. gada 22. decembris), ar ko groza
    Regulu (EK) Nr. 822/1999 par atsevišķu intervences aģentūru rīcībā esošas
    liellopu gaļas pārdošanu par iepriekš noteiktām cenām, lai to pārstrādātu
    Kopienā pārtikas atbalsta mērķiem
  type: main
- language: lt
  script: Latn
  content: KOMISIJOS REGLAMENTAS (EB) Nr. 2754/1999 1999 m. gruodžio 22 d. iš dalies
    keičiantis Reglamentą (EB) Nr. 822/1999 dėl jautienos, priklausančios tam
    tikroms intervencinėms agentūroms, pardavimo iš anksto nustatytomis kainomis
    siekiant ją perdirbti Bendrijoje ir skirti pagalbai maistu
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2754/1999 van de Commissie van 22 december 1999 tot
    wijziging van Verordening (EG) nr. 822/1999 betreffende de verkoop, tegen vooraf
    forfaitair vastgestelde prijzen, van rundvlees uit de voorraden van bepaalde interventiebureaus
    voor verwerking in de Gemeenschap met het oog op de levering van voedselhulp
  type: main
- language: pl
  script: Latn
  content: ROZPORZĄDZENIE KOMISJI (WE) NR 2754/1999 z dnia 22 grudnia 1999 r. zmieniające
    rozporządzenie (WE) nr 822/1999 w sprawie sprzedaży, po wcześniej ustalonych
    cenach, wołowiny znajdującej się w posiadaniu niektórych agencji interwencyjnych
    w celu jej przetworzenia we Wspólnocie do celów pomocy żywnościowej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2754/1999 da Comissão, de 22 de Dezembro de 1999,
    que altera o Regulamento (CE) n.o 822/1999, relativo à venda, a preço prefixado
    forfetariamente, de carne de bovino detida por determinados organismos de intervenção
    com vista à sua transformação na Comunidade para fins de ajuda alimentar
  type: main
- language: sk
  script: Latn
  content: NARIADENIE KOMISIE (ES) č. 2754/1999 z 22. decembra 1999, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 822/1999 o predaji bravčového mäsa za vopred
    určené ceny prostredníctvom určitých intervenčných agentúr s cieľom jeho
    spracovania v spoločenstve na účely potravinovej pomoci
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2754/1999 de la Comisión, de 22 de diciembre de 1999,
    que modifica el Reglamento (CE) nº 822/1999 relativo a la venta, a precio fijado
    a tanto alzado por anticipado, de carne de vacuno en poder de determinados organismos
    de intervención y destinada a su transformación en la Comunidad con fines de
    ayuda alimentaria
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2754/1999 av den 22 december 1999 om
    ändring av förordning (EG) nr 822/1999 om försäljning till i förväg fastställt
    fast pris av nötkött som innehas av vissa interventionsorgan och som är avsett
    för bearbetning inom gemenskapen för att sedan användas som livsmedelsbistånd
  type: main
