id: EURegulation2020447
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2020/447 of 16 December 2019 supplementing
    Regulation (EU) No 648/2012 of the European Parliament and of the Council with
    regard to regulatory technical standards on the specification of criteria for
    establishing the arrangements to adequately mitigate counterparty credit risk
    associated with covered bonds and securitisations, and amending Delegated Regulations
    (EU) 2015/2205 and (EU) 2016/1178
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2020/447 de la Commission du 16 décembre 2019
    complétant le règlement (UE) no 648/2012 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les critères à appliquer
    pour déterminer quels arrangements atténuent de manière adéquate le risque
    de crédit de la contrepartie associé aux obligations garanties et aux titrisations,
    et modifiant les règlements délégués (UE) 2015/2205 et (UE) 2016/1178
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2020/447 der Kommission vom 16. Dezember 2019
    zur Ergänzung der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Festlegung von Kriterien
    für die Bestimmung der Regelungen für eine angemessene Minderung des Gegenparteiausfallrisikos
    bei gedeckten Schuldverschreibungen und Verbriefungen und zur Änderung der Delegierten
    Verordnungen (EU) 2015/2205 und (EU) 2016/1178
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2020/447 на Комисията
    от 16 декември 2019 година за допълнение на Регламент
    (ЕС) № 648/2012 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на критериите за установяване
    на това кои договорености адекватно редуцират
    кредитния риск от контрагента при покритите
    облигации и секюритизациите, и за изменение
    на делегирани регламенти (ЕС) 2015/2205 и (ЕС) 2016/1178
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2020/447 ze dne 16. prosince
    2019, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    648/2012, pokud jde o regulační technické normy upřesňující kritéria pro
    stanovení ujednání, která náležitě snižují úvěrové riziko protistrany
    spojené s krytými dluhopisy a sekuritizacemi, a o změně nařízení v přenesené
    pravomoci (EU) 2015/2205 a (EU) 2016/1178
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2020/447 af 16. december 2019
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 648/2012
    for så vidt angår reguleringsmæssige tekniske standarder til præcisering af
    kriterier til bestemmelse af, hvilke ordninger der i tilstrækkelig grad mindsker
    modpartskreditrisici forbundet med dækkede obligationer eller securitiseringer,
    og om ændring af delegeret forordning (EU) 2015/2205 og (EU) 2016/1178
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2020/447
    της Επιτροπής της 16ης Δεκεμβρίου 2019 για τη
    συμπλήρωση του κανονισμού (ΕΕ) αριθ. 648/2012 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
