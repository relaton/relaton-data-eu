    τον καθορισμό των κριτηρίων για τον προσδιορισμό
    των ρυθμίσεων οι οποίες μετριάζουν επαρκώς
    τον πιστωτικό κίνδυνο του αντισυμβαλλομένου
    που συνδέεται με καλυμμένα ομόλογα και τιτλοποιήσεις
    και την τροποποίηση των κατ’ εξουσιοδότηση
    κανονισμών (ΕΕ) 2015/2205 και (ΕΕ) 2016/1178
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2020/447, 16. detsember 2019, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) nr 648/2012 seoses
    regulatiivsete tehniliste standarditega, millega täpsustatakse kriteeriume, mille
    alusel määratakse kindlaks pandikirjade ja väärtpaberistamistega seotud vastaspoole
    krediidiriski piisava maandamise kord, ning muudetakse delegeeritud määruseid
    (EL) 2015/2205 ja (EL) 2016/1178
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2020/447, annettu 16 päivänä joulukuuta
    2019, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 648/2012 täydentämisestä
    sellaisten teknisten sääntelystandardien osalta, joissa määritellään perusteet
    sille, mitkä järjestelyt lieventävät riittävästi katettuihin joukkolainoihin
    ja arvopaperistamisiin liittyvää vastapuoliluottoriskiä, ja delegoitujen asetusten
    (EU) 2015/2205 ja (EU) 2016/1178 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2020/447 оd 16. prosinca 2019. o dopuni
    Uredbe (EU) br. 648/2012 Europskog parlamenta i Vijeća u pogledu regulatornih
    tehničkih standarda za određivanje kriterija za utvrđivanje aranžmana za primjereno
    smanjenje kreditnog rizika druge ugovorne strane u vezi s pokrivenim obveznicama
    i sekuritizacijama te o izmjeni delegiranih uredaba (EU) 2015/2205 i (EU) 2016/1178
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/447 felhatalmazáson alapuló rendelete (2019. december
    16.) a 648/2012/EU európai parlamenti és tanácsi rendeletnek a fedezett kötvényekhez
    és az értékpapírosításokhoz kapcsolódó partnerkockázat megfelelő csökkentésére
    szolgáló konstrukciók létrehozására vonatkozó kritériumokat meghatározó
    szabályozástechnikai standardok tekintetében történő kiegészítéséről,
    valamint az (EU) 2015/2205 és az (EU) 2016/1178 felhatalmazáson alapuló rendelet
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2020/447 della Commissione del 16 dicembre 2019
    che integra il regolamento (UE) n. 648/2012 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione relative alla specificazione
    dei criteri volti a stabilire le modalità per un’attenuazione adeguata del
    rischio di credito di controparte associato alle obbligazioni garantite e alle
    cartolarizzazioni, e che modifica i regolamenti delegati (UE) 2015/2205 e (UE)
    2016/1178
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2020/447 (2019. gada 16. decembris),
    ar ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 648/2012 papildina attiecībā
    uz regulatīvajiem tehniskajiem standartiem par kritēriju precizēšanu, lai
    noteiktu pasākumus, kuri pienācīgi mazina darījuma partnera kredītrisku,
    kas saistīts ar nodrošinātajām obligācijām un vērtspapīrošanas darījumiem,
    un ar ko groza Deleģētās regulas (ES) 2015/2205 un (ES) 2016/1178
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2020/447 2019 m. gruodžio 16 d.
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 648/2012 papildomas
    techniniais reguliavimo standartais, kuriais apibrėžiami kriterijai, pagal kuriuos
    nustatomos priemonės sandorio šalies kredito rizikai, susijusiai su padengtosiomis
    obligacijomis ir pakeitimu vertybiniais popieriais, tinkamai sumažinti, taip
    pat iš dalies keičiami deleguotieji reglamentai (ES) 2015/2205 ir (ES) 2016/1178
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2020/447 tas-16 ta’ Diċembru
    2019 li jissupplimenta r-Regolament (UE) Nru 648/2012 tal-Parlament Ewropew u
    tal-Kunsill fir-rigward tal-istandards tekniċi regolatorji dwar l-ispeċifikazzjoni
    tal-kriterji biex jiġu stabbiliti l-arranġamenti għat-tnaqqis b’mod adegwat
    tar-riskju ta’ kreditu tal-kontroparti assoċjat mal-bonds koperti u mat-titolizzazzjonijiet,
    u li jemenda r-Regolamenti Delegati (UE) 2015/2205 u (UE) 2016/1178
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2020/447 van de Commissie van 16 december
    2019 tot aanvulling van Verordening (EU) nr. 648/2012 van het Europees Parlement
    en de Raad met technische reguleringsnormen tot specificering van de criteria
    om te bepalen welke regelingen op toereikende wijze tegenpartijkredietrisico limiteren
    in verband met gedekte obligaties en securitisaties, en tot wijziging van de Gedelegeerde
    Verordeningen (EU) 2015/2205 en (EU) 2016/1178
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2020/447 z dnia 16 grudnia 2019
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 648/2012
    w odniesieniu do regulacyjnych standardów technicznych dotyczących określenia
    kryteriów oceny uzgodnień odpowiednio ograniczających ryzyko kredytowe kontrahenta
    związane z obligacjami zabezpieczonymi i sekurytyzacjami oraz zmieniające rozporządzenia
    delegowane (UE) 2015/2205 i (UE) 2016/1178
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2020/447 da Comissão de 16 de dezembro de 2019
    que complementa o Regulamento (UE) n.o 648/2012 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação que especificam os
    critérios para determinar quais os acordos que reduzem adequadamente o risco
    de crédito de contraparte associado às obrigações cobertas e às titularizações,
    e que altera os Regulamentos Delegados (UE) 2015/2205 e (UE) 2016/1178
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2020/447 al Comisiei din 16 decembrie 2019 de
    completare a Regulamentului (UE) nr. 648/2012 al Parlamentului European și al
    Consiliului în ceea ce privește standardele tehnice de reglementare de precizare
    a criteriilor pentru stabilirea măsurilor de atenuare în mod corespunzător
    a riscului de credit al contrapărții asociat obligațiunilor garantate și securitizărilor
    și de modificare a Regulamentelor delegate (UE) 2015/2205 și (UE) 2016/1178
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2020/447 zo 16. decembra 2019, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 648/2012, pokiaľ
    ide o regulačné technické predpisy týkajúce sa špecifikácie kritérií
    na určenie toho, ktoré opatrenia primerane zmierňujú kreditné riziko protistrany
    v súvislosti s krytými dlhopismi a sekuritizáciami, a ktorým sa menia delegované
    nariadenia (EÚ) 2015/2205 a (EÚ) 2016/1178
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2020/447 z dne 16. decembra 2019 o dopolnitvi
    Uredbe (EU) št. 648/2012 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi o merilih za določitev, kateri dogovori v okviru kritih
    obveznic in listinjenja ustrezno zmanjšujejo kreditno tveganje nasprotne stranke,
    ter o spremembi delegiranih uredb (EU) 2015/2205 in (EU) 2016/1178
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2020/447 de la Comisión de 16 de diciembre de
    2019 por el que se completa el Reglamento (UE) n.o 648/2012 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación sobre la
    especificación de criterios para determinar los mecanismos que reducen adecuadamente
    el riesgo de crédito de contraparte asociado a los bonos garantizados y las titulizaciones,
    y por el que se modifican los Reglamentos Delegados (UE) 2015/2205 y (UE) 2016/1178
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2020/447 av den 16 december 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 648/2012
    vad gäller tekniska tillsynsstandarder för att specificera kriterier för fastställande
    av arrangemang för att på lämpligt sätt minska motpartskreditrisken i samband
    med säkerställda obligationer och värdepapperiseringar och om ändring av delegerade
    förordningar (EU) 2015/2205 och (EU) 2016/1178
  type: main
