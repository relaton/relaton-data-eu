    do Grupo de Coordenação dos Estados-Membros para a Avaliação das Tecnologias
    da Saúde e da Comissão com a Agência Europeia de Medicamentos sob a forma de
    intercâmbio de informações no que se refere à avaliação clínica conjunta
    de medicamentos e dispositivos médicos, bem como de dispositivos médicos para
    diagnóstico in vitro, e no que diz respeito à consulta científica conjunta
    sobre medicamentos e dispositivos médicos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/2699 al Comisiei din 18 octombrie
