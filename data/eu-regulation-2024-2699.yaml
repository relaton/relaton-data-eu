title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2699 of 18 October 2024 laying
    down, pursuant to Regulation (EU) 2021/2282 of the European Parliament and of
    the Council, detailed procedural rules for the cooperation of the Member State
    Coordination Group on Health Technology Assessment and the Commission with the
    European Medicines Agency in the form of exchange of information as regards the
    joint clinical assessment of medicinal products and medical devices and in vitro
    diagnostic medical devices and as regards the joint scientific consultation on
    medicinal products and medical devices
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2699 de la Commission du 18 octobre
    2024 établissant, en application du règlement (UE) 2021/2282 du Parlement européen
    et du Conseil, les règles de procédure détaillées applicables à la coopération
    du groupe de coordination des États membres sur l’évaluation des technologies
    de la santé et la Commission avec l’Agence européenne des médicaments sous
    forme d’échange d’informations en ce qui concerne l’évaluation clinique
    commune des médicaments, des dispositifs médicaux et des dispositifs médicaux
    de diagnostic in vitro et en ce qui concerne la consultation scientifique commune
    sur les médicaments et les dispositifs médicaux
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2699 der Kommission vom 18. Oktober
    2024 zur Festlegung von detaillierten Verfahrensvorschriften für die Zusammenarbeit
    — in Form eines Informationsaustauschs — der Koordinierungsgruppe der Mitgliedstaaten
    zur Bewertung von Gesundheitstechnologien und der Kommission mit der Europäischen
    Arzneimittel-Agentur betreffend die gemeinsame klinische Bewertung von Arzneimitteln,
    Medizinprodukten und In-vitro-Diagnostika sowie die gemeinsame wissenschaftliche
    Beratung zu Arzneimitteln und Medizinprodukten gemäß der Verordnung (EU) 2021/2282
    des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/2699 на Комисията
    от 18 октомври 2024 година за установяване съгласно
    Регламент (ЕС) 2021/2282 на Европейския парламент
    и на Съвета на подробни процедурни правила
    за сътрудничеството под формата на обмен на
    информация на Координационната група на държавите
    членки за оценка на здравните технологии и
    Комисията с Европейската агенция по лекарствата
    по отношение на съвместната клинична оценка
    на лекарствени продукти и медицински изделия,
    както и на медицински изделия за инвитро диагностика,
    а също и по отношение на съвместната научна
    консултация относно лекарствени продукти
    и медицински изделия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/2699 ze dne 18. října 2024,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) 2021/2282 stanoví
    podrobná procesní pravidla pro spolupráci koordinační skupiny členských
    států pro hodnocení zdravotnických technologií a Komise s Evropskou agenturou
    pro léčivé přípravky v podobě výměny informací, pokud jde o společné
    klinické hodnocení léčivých přípravků a zdravotnických prostředků a
    diagnostických zdravotnických prostředků in vitro a o společnou vědeckou
    konzultaci týkající se léčivých přípravků a zdravotnických prostředků
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/2699 af 18. oktober 2024
