    European și al Consiliului, a normelor procedurale detaliate privind cooperarea
    grupului de coordonare al statelor membre privind evaluarea tehnologiilor medicale
    și a Comisiei cu Agenția Europeană pentru Medicamente sub forma schimbului
    de informații în ceea ce privește evaluarea clinică comună a medicamentelor,
    a dispozitivelor medicale și a dispozitivelor medicale pentru diagnostic in vitro
    și în ceea ce privește consultarea științifică comună privind medicamentele
    și dispozitivele medicale
  type: main
