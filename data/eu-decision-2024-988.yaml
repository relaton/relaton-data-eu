    ein Abkommen zwischen der Europäischen Union und der Schweizerischen Eidgenossenschaft
    über die Übermittlung von Fluggastdatensätzen (PNR-Daten) aus der Europäischen
    Union an die Schweizerische Eidgenossenschaft zum Zweck der Verhütung, Aufdeckung,
    Ermittlung und Verfolgung von terroristischen Straftaten und schwerer Kriminalität
  type: main
