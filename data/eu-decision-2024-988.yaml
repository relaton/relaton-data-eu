title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/988 of 4 March 2024 authorising the opening
    of negotiations with the Swiss Confederation for an agreement between the European
    Union and the Swiss Confederation on the transfer of Passenger Name Record (PNR)
    data from the European Union to the Swiss Confederation for the prevention, detection,
    investigation and prosecution of terrorist offences and serious crime
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/988 du Conseil du 4 mars 2024 autorisant l’ouverture
    de négociations avec la Confédération suisse en vue d’un accord entre l’Union
    européenne et la Confédération suisse sur le transfert de données des dossiers
    passagers (PNR) depuis l’Union européenne vers la Confédération suisse pour
    la prévention et la détection des infractions terroristes et des formes graves
    de criminalité, ainsi que pour les enquêtes et les poursuites en la matière
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/988 des Rates vom 4. März 2024 über die Ermächtigung
