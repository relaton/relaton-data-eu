    und Erstattungsbeträge für bestimmte Mischfutterarten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 170/64/CEE della Commissione, del 30 ottobre 1964, recante
    disposizioni concernenti i titoli di importazione e di esportazione, nonché la
    fissazione in via anticipata del prelievo e della restituzione per alcune categorie
    di alimenti composti
  type: main
