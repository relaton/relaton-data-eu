title:
- language: en
  script: Latn
  content: Commission Decision of 5 April 1976 on the reimbursement by the Guidance
    Section of the EAGGF to the United Kingdom of expenditure incurred during 1974
    on annuities relating to measures to encourage the cessation of farming and the
    reallocation of utilized agricultural area for the purposes of structural improvement
  type: main
- language: fr
  script: Latn
  content: '76/406/CEE: Décision de la Commission, du 5 avril 1976, relative au remboursement
    par le FEOGA, section orientation, au Royaume-Uni, des dépenses effectuées pendant
    l''année 1974 pour les indemnités relatives à l''encouragement à la cessation
    de l''activité agricole et à l''affectation de la superficie agricole utilisée
    à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. April 1976 über die Rückvergütung
    der im Jahr 1974 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an das Vereinigte
    Königreich
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. april 1976 om refusion gennem EUGFL, udviklingssektionen,
    til Det forenede Kongerige af de udgifter, som er afholdt i løbet af året 1974
    til godtgørelser vedrørende støtte til ophør af landbrugsvirksomhed og til
    anvendelse af udnyttet landbrugsareal til strukturforbedringsformål
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 aprile 1976, relativa al rimborso da
    parte del FEAOG, sezione orientamento, al Regno Unito delle spese effettuate durante
    il 1974 per le indennità concernenti l'incoraggiamento alla cessazione dell'attività
    agricola e alla destinazione della superficie agricola utilizzata a scopi di miglioramento
    delle strutture
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 april 1976 betreffende vergoeding door
    het E.O.G.F.L., afdeling Oriëntatie, aan het Verenigd Koninkrijk van de gedurende
    het jaar 1974 gedane uitgaven voor de uitkeringen met betrekking tot de bevordering
    van de bedrijfsbeëindiging in de landbouw en van aanwending van cultuurgrond
    tot verbetering van de structuur
