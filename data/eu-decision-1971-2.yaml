  content: Décision de la Commission, du 4 décembre 1970, relative au remboursement
    par le FEOGA, section orientation au Royaume de Belgique des frais entraînés
    par les enquêtes sur le cheptel porcin effectuées le 1er mars et le 15 mai 1970
  type: main
- language: de
  script: Latn
  content: '71/2/EWG: Entscheidung der Kommission vom 4. Dezember 1970 über die Erstattung
    der bei den am 1. März und 15. Mai 1970 durchgeführten Erhebungen über den
    Schweinebestand entstandenen Kosten durch den EAGFL, Abteilung Ausrichtung, an
    das Königreich Belgien'
  type: main
- language: it
  script: Latn
  content: '71/2/CEE: Decisione della Commissione, del 4 dicembre 1970, relativa al
    rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio, delle
    spese sostenute per le inchieste sul patrimonio suinicolo effettuate il 1 marzo
    e il 15 maggio 1970'
  type: main
- language: nl
  script: Latn
  content: '71/2/EEG: Beschikking van de Commissie van 4 december 1970 betreffende
