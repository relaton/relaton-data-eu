  type: main
- language: hu
  script: Latn
  content: A Bizottság 2088/98/EK rendelete (1998. szeptember 30.) az egyes elnevezéseknek
    a mezőgazdasági termékek és élelmiszerek földrajzi jelzéseinek és eredetmegjelöléseinek
    oltalmáról szóló 2081/92/EGK tanácsi rendeletben előírt „Oltalom alatt
    álló eredetmegjelölések és földrajzi jelzések nyilvántartása” elnevezésű
    nyilvántartásba való bejegyzéséről szóló 2400/96/EK rendelet mellékletének
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2088/98 della Commissione del 30 settembre 1998 che
    completa l'allegato del regolamento (CE) n. 2400/96 relativo all'iscrizione di
    alcune denominazioni nel «Registro delle denominazioni di origine protette e
    delle indicazioni geografiche protette» di cui al regolamento (CEE) n. 2081/92
    del Consiglio relativo alla protezione delle indicazioni geografiche e delle denominazioni
    di origine dei prodotti agricoli e alimentari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2088/98 (1998. gada 30. septembris), ar kuru
    papildina pielikumu Regulai (EK) Nr. 2400/96 par konkrētu nosaukumu iekļaušanu
    “Aizsargāto cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes
    norāžu reģistrā”, kas paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības
    produktu un pārtikas ģeogrāfiskās izcelsmes norāžu un cilmes vietu nosaukumu
    aizsardzību
  type: main
- language: lt
  script: Latn
  content: 1998 m. rugsėjo 30 d. Komisijos reglamentas (EB) Nr. 2088/98, papildantis
    Reglamento (EB) Nr. 2400/96 dėl tam tikrų pavadinimų įtraukimo į Reglamente
    (EEB) Nr. 2081/92 dėl žemės ūkio produktų ir maisto produktų geografinių
    nuorodų ir kilmės vietos nuorodų apsaugos numatytą „Saugomų kilmės vietos
    nuorodų ir saugomų geografinių nuorodų registrą“ priedą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 2088/98 tat-30 ta' Settembru 1998
    li jissupplimenta l-Anness mar-Regolament (KE) Nru 2400/96 dwar id-dħul ta' ċerti
    ismijiet fir-“Reġistru ta’ denominazzjoni protetta ta’ oriġini u indikazzjonijiet
    ġeografiċi protetti” pprovdut bir-Regolament tal-Kunsill (KEE) Nru 2081/92
    dwar il-protezzjoni ta' l-indikazzjonijiet ġeografiċi u d-denominazzjoni ta'
    l-oriġini għall-prodotti u l-oġġetti ta' l-ikel agrikoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2088/98 van de Commissie van 30 september 1998 tot
