title:
- language: en
  script: Latn
  content: Commission Decision of 28 February 1994 authorizing Portugal to import
    from third countries at a reduced levy certain quantities of raw sugar during
    the period 1 March to 30 June 1994 (Only the Portuguese text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 28 février 1994 autorisant le Portugal à
    importer des pays tiers à prélèvement réduit certaines quantités de sucre
    brut au titre de la période du 1er mars au 30 juin 1994 (Le texte en langue portugaise
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 28. Februar 1994 zur Ermächtigung Portugals,
    für den Zeitraum vom 1. März bis 30. Juni 1994 bestimmte Rohzuckermengen mit
    verminderter Abschöpfung aus Drittländern einzuführen (Nur der portugiesische
    Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 28. februar 1994 om bemyndigelse af Portugal
    til at indføre visse mængder råsukker til nedsat afgift fra tredjelande for
    perioden 1. marts 1994 til den 30. juni 1994 (Kun den portugisiske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 28ης Φεβρουαρίου
    1994 που επιτρέπει στην Πορτογαλία να εισάγει
    από τρίτες χώρες, με μειωμένη εισφορά, ορισμένες
    ποσότητες ακατέργαστης ζάχαρης για την περίοδο
    από την 1η Μαρτίου έως τις 30 Ιουνίου 1994 (Το κείμενο
    στην πορτογαλική γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 28 febbraio 1994 che autorizza il Portogallo
    ad importare dai paesi terzi taluni quantitativi di zucchero greggio a prelievo
    ridotto in conto del periodo dal 1o marzo al 30 giugno 1994 (Il testo in lingua
    portoghese è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 28 februari 1994 houdende machtiging van
    Portugal om bepaalde hoeveelheden ruwe suiker met een verlaagde heffing uit derde
    landen in te voeren voor de periode van 1 maart tot en met 30 juni 1994 (Slechts
    de tekst in de Portugese taal is authentiek)
  type: main
- language: pt
  script: Latn
  content: DECISÃO DA COMISSÃO de 28 de Fevereiro de 1994 que autoriza Portugal
    a importar de países terceiros com direito nivelador reduzido determinadas quantidades
    de açúcar em bruto durante o período compreendido entre 1 de Março e 30 de
    Junho de 1994 (Apenas faz fé o texto em língua portuguesa)
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 28 de febrero de 1994 por la que se autoriza
    a Portugal a importar de terceros países, con una exacción reguladora de tipo
    reducido, ciertas cantidades de azúcar terciado para el período comprendido
    entre el 1 de marzo y el 30 de junio de 1994 (El texto en lengua portuguesa es
    el único auténtico)
  type: main
