  content: 'Commission Implementing Regulation (EU) 2024/780 of 5 March 2024 concerning
    the renewal of the authorisation of a preparation of endo–1,4-beta-xylanase
    produced by Trichoderma citrinoviride DSM 34663 as a feed additive for all poultry
