- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2024/780 z dne 5. marca 2024 o podaljšanju
    dovoljenja za pripravek iz endo–1,4-beta-ksilanaze, ki jo proizvaja Trichoderma
    citrinoviride DSM 34663, kot krmni dodatek za vse vrste perutnine za pitanje,
    vse vrste perutnine za nesnice in gojene za nesnice, tekače, prašiče pitance
    in krape, dovoljenja za navedeni pripravek kot krmni dodatek za vse vrste perutnine
    za razplod, purane, gojene za razplod, manj pomembne vrste perutnine, gojene za
    razplod, okrasne ptice, sesne pujske in manj pomembne vrste prašičev za pitanje
    (imetnik dovoljenja: Huvepharma NV) ter razveljavitvi izvedbenih uredb Komisije
    (EU) 2015/1043, (EU) 2017/1906 in (EU) 2018/327'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2024/780 de la Comisión, de 5 de marzo
    de 2024, relativo a la renovación de la autorización de un preparado de endo–1,4-beta-xilanasa
    producida por Trichoderma citrinoviride DSM 34663 como aditivo en piensos para
    todas las especies de aves de corral de engorde, todas las especies de aves de
    corral ponedoras y criadas para puesta, los lechones destetados, los cerdos de
    engorde y las carpas, así como la autorización de tal preparado como aditivo
    en piensos para todas las especies de aves de corral para reproducción, los pavos
    criados para reproducción, las especies menores de aves de corral criadas para
    reproducción, las aves ornamentales, los lechones lactantes y las especies porcinas
    menores de engorde (titular de la autorización: Huvepharma NV), y por el que
    se derogan los Reglamentos de Ejecución (UE) 2015/1043, (UE) 2017/1906 y (UE)
    2018/327'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2024/780 av den 5 mars 2024
    om förlängning av godkännandet av ett preparat av endo–1,4-beta-xylanas framställt
    av Trichoderma citrinoviride DSM 34663 som fodertillsats för alla fjäderfäarter
    avsedda för slakt, alla fjäderfäarter avsedda för värpning och som föds
    upp för värpning, avvanda smågrisar, slaktsvin samt karp, godkännande av preparatet
    som fodertillsats för alla fjäderfäarter avsedda för avel, kalkoner som föds
    upp för avel, mindre vanligt förekommande fjäderfäarter som föds upp för
    avel, burfåglar, diande smågrisar och mindre vanligt förekommande svinarter
    avsedda för slakt (innehavare av godkännandet: Huvepharma NV) och om upphävande
    av genomförandeförordningarna (EU) 2015/1043, (EU) 2017/1906 och (EU) 2018/327.'
  type: main
