title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1229/82 of 19 May 1982 on the sale at prices
    fixed at a standard rate in advance of certain beef from intervention stocks for
    processing in the Community and repealing Regulation (EEC) No 783/82
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1229/82 de la Commission, du 19 mai 1982, relatif à
    la vente à prix fixé forfaitairement à l'avance, en vue de leur transformation
    dans la Communauté, de certaines viandes bovines provenant des stocks d'intervention
    et abrogeant le règlement (CEE) n 783/82
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1229/82 der Kommission vom 19. Mai 1982 über den
    Verkauf von bestimmtem Interventionsrindfleisch, das zur Verarbeitung in der Gemeinschaft
    bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur Aufhebung der
    Verordnung (EWG) Nr. 783/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1229/82 af 19. maj 1982 om salg til
    forudfastsatte priser af visse former for oksekød fra interventionslagrene med
    henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 783/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1229/82 της Επιτροπής
    της 19ης Μαΐου 1982 περί πωλήσεως με κατ' αποκοπή
    τιμή καθοριζόμενη εκ των προτέρων, εν όψει
    της μεταποιήσεώς τους εντός της Κοινότητος,
    ορισμένων βοείων κρεάτων πού προέρχονται από
    αποθέματα οργανισμών παρεμβάσεως και περί
    καταργήσεως του κανονισμού (ΕΟΚ) αριθ. 783/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1229/82 della Commissione, del 19 maggio 1982, relativo
    alla vendita, a prezzi fissati forfettariamente in anticipo, di talune carni bovine
    provenienti dalle scorte d'intervento e destinate alla trasformazione nella Comunità
    e recante abrogazione del regolamento (CEE) n. 783/82
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1229/82 van de Commissie van 19 mei 1982 inzake de
    verkoop, tegen vooraf forfaitair vastgestelde prijzen, voor verwerking in de Gemeenschap,
    van rundvlees uit de voorraden van de interventiebureaus en houdende intrekking
    van Verordening (EEG) nr. 783/82
