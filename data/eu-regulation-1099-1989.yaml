    dell'' Indonesia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 4257/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1099/89 VAN DE COMMISSIE van 27 april 1989 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel met
    buitenzool en bovendeel van rubber of van kunststof, van de GN-codes 6401 en 6402,
    van oorsprong uit Indonesië, waarvoor de in Verordening (EEG) nr. 4257/88 van
    de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
