title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1099/89 of 27 April 1989 re-establishing
    the levying of customs duties on footwear with outer soles and uppers of rubber
    or of plastics, falling within CN codes 6401 and 6402, originating in Indonesia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1099/89 de la Commission du 27 avril 1989 portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    à semelles extérieures et dessus en caoutchouc ou en matière plastique des
    codes NC 6401 et 6402 originaires de l'Indonésie, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1099/89 DER KOMMISSION vom 27. April 1989 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe mit Laufsohlen und Oberteil aus Kautschuk
    oder Kunststoff der KN-Code 6401 und 6402 mit Ursprung in Indonesien, dem die
    in der Verordnung (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen gewährt
    werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1099/89 af 27. april 1989 om genindførelse
    af opkrævning af told for fodtøj med ydersål og overdel af gummi eller plast,
    henhørende under KN-kode 6401 og 6402 og med oprindelse i Indonesien, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1999/89 της Επιτροπής
    της 27ης Απριλίου 1989 περί αποκαταστάσεως της
    εφαρμογής των δασμών για υποδήματα αδιάβροχα
    που έχουν τα εξωτερικά πέλματα και το πάνω
    μέρος από καουτσούκ ή από πλαστική ύλη των
    κωδικών ΣΟ 6401 και 6402, καταγωγής Ινδονησίας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 4257/88 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1099/89 DELLA COMMISSIONE del 27 aprile 1989 che
    ripristina la riscossione dei dazi doganali applicabili alle calzature con suole
