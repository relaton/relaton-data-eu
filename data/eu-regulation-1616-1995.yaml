title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1616/95 of 4 July 1995 amending Annex VII
    of Council Regulation (EEC) No 3030/93 on common rules for imports of certain
    textile products from third countries, to take into account Council Regulation
    (EC) No 3036/94 establishing economic outward processing arrangements applicable
    to certain textiles and clothing products reimported into the Community after
    working or processing in certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1616/95 de la Commission, du 4 juillet 1995, modifiant
    l' annexe VII du règlement (CEE) nº 3030/93 du Conseil relatif au régime commun
    applicable aux importations de certains produits textiles originaires des pays
    tiers, afin de prendre en compte le règlement (CE) nº 3036/94 instituant un
    régime de perfectionnement passif économique applicable à certains produits
    textiles et d' habillement réimportés dans la Communauté après ouvraison ou
    transformation dans certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1616/95 der Kommission vom 4. Juli 1995 zur Anpassung
    des Anhangs VII der Verordnung (EWG) Nr. 3030/93 des Rates über die gemeinsame
    Einfuhrregelung für bestimmte Textilwaren mit Ursprung in Drittländern an die
    Verordnung (EG) Nr. 3036/94 zur Schaffung eines wirtschaftlichen passiven Veredelungsverkehrs
    für bestimmte Textil- und Bekleidungserzeugnisse, die nach Be- oder Verarbeitung
    in gewissen Drittländern wieder in die Gemeinschaft eingeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1616/95 af 4. juli 1995 om ændring af
    bilag VII til Rådets forordning (EØF) nr. 3030/93 om den fælles ordning for
    indførsel af visse tekstilvarer med oprindelse i tredjelande for at tage hensyn
    til Rådets forordning (EF) nr. 3036/94 om indførelse af en procedure for økonomisk
    passiv forædling for visse tekstilvarer og beklædningsgenstande, der genindføres
    til Fællesskabet efter bearbejdning i visse tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1616/95 της Επιτροπής
    της 4ης Ιουλίου 1995 για την τροποποίηση του παραρτήματος
    VII του κανονισμού (ΕΟΚ) αριθ. 3030/93 του Συμβουλίου
    περί κοινών κανόνων εισαγωγής ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής τρίτων χωρών, για να ληφθεί
    υπόψη ο κανονισμός (ΕΚ) αριθ. 3036/94 του Συμβουλίου
    για τη θέσπιση οικονομικού καθεστώτος παθητικής
    τελειοποίησης που εφαρμόζεται σε ορισμένα
    κλωστοϋφαντουργικά προϊόντα και ενδύματα
    που επανεισάγονται στην Κοινότητα μετά από
    κατεργασία ή μεταποίηση σε ορισμένες τρίτες
    χώρες
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1616/95, annettu 4 päivänä heinäkuuta 1995,
    tiettyjen kolmansista maista peräisin olevien tekstiilituotteiden tuontiin sovellettavasta
    yhteisestä menettelystä annetun neuvoston asetuksen (ETY) N:o 3030/93 liitteen
    VII muuttamisesta taloudellisesti vaikuttavan ulkoisen jalostusmenettelyn soveltamisesta
    tiettyihin yhteisöön jälleentuotuihin tekstiili- ja vaatetustuotteisiin tietyissä
    kolmansissa maissa suoritetun valmistuksen tai käsittelyn jälkeen annetun neuvoston
    asetuksen (EY) N:o 3036/94 huomioon ottamiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1616/95 della Commissione, del 4 luglio 1995, che modifica
    l' allegato VII del regolamento (CEE) n. 3030/93 del Consiglio relativo al regime
    comune da applicare alle importazioni di alcuni prodotti tessili originari dei
    paesi terzi, per tener conto del regolamento (CE) n. 3036/94 del Consiglio che
    istituisce un regime economico di perfezionamento passivo applicabile ad alcuni
    prodotti tessili e di abbigliamento reimportati nella Comunità dopo aver subito
    lavorazioni e trasformazioni in taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1616/95 van de Commissie van 4 juli 1995 tot wijziging
    van bijlage VII bij Verordening (EEG) nr. 3030/93 van de Raad betreffende een
    gemeenschappelijke regeling voor de invoer van bepaalde textielprodukten uit derde
    landen, teneinde rekening te houden met Verordening (EG) nr. 3036/94 van de Raad
    houdende instelling van een regeling voor economische passieve veredeling die
    van toepassing is op bepaalde textielprodukten en kledingartikelen die worden
    wederingevoerd in de Gemeenschap na bewerking of verwerking in bepaalde derde
    landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1616/95 da Comissão, de 4 de Julho de 1995, que altera
    o anexo VII do Regulamento (CEE) nº 3030/93 do Conselho, relativo ao regime comum
    aplicável às importações de certos produtos têxteis originários de países
    terceiros, de forma a ter em conta o Regulamento (CE) nº 3036/94 do Conselho,
    que institui um regime de aperfeiçoamento económico passivo aplicável a certos
    produtos têxteis e de vestuário reimportados na Comunidade após fabrico ou
    transformação em certos países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1616/95 de la Comisión, de 4 de julio de 1995, por
    el que se modifica el Anexo VII del Reglamento (CEE) nº 3030/93 del Consejo relativo
    al régimen común aplicable a las importaciones de algunos productos textiles
    originarios de países terceros, para tener en cuenta el Reglamento (CE) nº 3036/94
    del Consejo por el que se establece un régimen de perfeccionamiento pasivo económico
    aplicable a determinados productos textiles y de confección reimportados en la
    Comunidad tras su elaboración o transformación en determinados terceros países
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1616/95 av den 4 juli 1995 om ändring
    av bilaga VII i rådets förordning (EEG) nr 3030/93 om gemensamma regler för
    import av vissa textilprodukter från tredje land, i syfte att ta hänsyn till
    rådets förordning (EG) nr 3036/94 om inrättande av en ordning för ekonomisk
    passiv förädling tillämplig för vissa textilprodukter och kläder som återinförs
    till gemenskapen efter bearbetning eller förädling i vissa tredje länder
  type: main
