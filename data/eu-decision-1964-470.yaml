title:
- language: fr
  script: Latn
  content: Décision 64/470/CEE du Conseil du 30 juillet 1964, autorisant la République
    italienne à suspendre, à l'égard des pays tiers, ses droits applicables aux
    viandes de l'espèce bovine domestique, congelées, destinées, sous contrôle
    douanier, à la transformation
  type: main
- language: de
  script: Latn
  content: '64/470/EWG: Entscheidung des Rates vom 30. Juli 1964, mit der die Italienische
    Republik ermächtigt wird, ihre Zollsätze auf Fleisch von Hausrindern, gefroren,
    zur Verarbeitung unter Zollaufsicht bestimmt, gegenüber dritten Ländern auszusetzen'
  type: main
- language: it
  script: Latn
  content: '64/470/CEE: Decisione del Consiglio, del 30 luglio 1964, con cui si autorizza
    la Repubblica italiana a sospendere, nei confronti dei paesi terzi, i suoi dazi
    applicabili alle carni della specie bovina domestica, congelate, destinate, sotto
    controllo doganale, alla trasformazione'
  type: main
- language: nl
  script: Latn
  content: '64/470/EEG: Beschikking van de Raad van 30 juli 1964 waarbij de Italiaanse
    Republiek wordt gemachtigd ten opzichte van derde landen haar rechten te schorsen
    voor vlees van runderen, van huisdieren, bevroren, onder douanecontrole voor verwerking
    bestemd'
  type: main
