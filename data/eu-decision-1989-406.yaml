title:
- language: en
  script: Latn
  content: '89/406/EEC: Commission Decision of 15 June 1989 authorizing Belgium to
    specify a minimum number of animals in the case of applications for the special
    premium for beef producers (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/406/CEE: Décision de la Commission du 15 juin 1989 autorisant la Belgique
    à prévoir un nombre minimal d''animaux pour les demandes de prime spéciale
    en faveur des producteurs de viande bovine (Les textes en langues française et
    néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '89/406/EWG: Entscheidung der Kommission vom 15. Juni 1989 zur Ermächtigung
    Belgiens, für die Anträge auf Sonderprämie für Rindfleischerzeuger eine Mindestzahl
    Tiere vorzusehen (Nur der französische und der niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '89/406/EØF: Kommissionens beslutning af 15. juni 1989 om tilladelse til
    Belgien til at fastsætte et minimumsantal af dyr for ansøgninger om en særlig
    præmie til oksekødsproducenter (Kun den franske og den nederlandske udgaver
    er autentiske)'
  type: main
- language: el
  script: Grek
  content: '89/406/ΕΟΚ: Απόφαση της Επιτροπής της 15ης
    Ιουνίου 1989 που επιτρέπει στο Βέλγιο να προβλέπει
    ελάχιστο αριθμό ζώων για τις αιτήσεις ειδικής
    πριμοδοτήσεως υπέρ των παραγωγών βοείου κρέατος'
  type: main
- language: it
  script: Latn
  content: '89/406/CEE: Decisione della Commissione del 15 giugno 1989 che autorizza
    il Belgio a prevedere un numero minimo di animali per le domande di premi speciali
    a favore dei produttori di carni bovine (I testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '89/406/EEG: Beschikking van de Commissie van 15 juni 1989 waarbij België
    wordt gemachtigd voor te schrijven dat de aanvragen van de speciale premie voor
    rundvleesproducenten op een minimumaantal dieren betrekking moeten hebben (Slechts
    de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '89/406/CEE: Decisão da Comissão de 15 de Junho de 1989 que autoriza
    a Bélgica a prever um número mínimo de animais para os pedidos de prémio especial
    a favor dos produtores de carne de bovino (Apenas fazem fé os textos nas línguas
    francesa e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '89/406/CEE: Decisión de la Comisión de 15 de junio de 1989 por la que
    se autoriza a Bélgica a fijar un número mínimo de animales para las solicitudes
    de prima especial en favor de los productores de carne de vacuno (Los textos en
    lengua francesa y neerlandesa son los únicos auténticos)'
  type: main
