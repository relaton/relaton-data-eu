title:
- language: fr
  script: Latn
  content: Décision 66/32/CEE de la Commission, du 21 décembre 1965, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité pour
    exclure du traitement communautaire les fleurs et boutons de fleurs coupés, originaires
    de pays tiers et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/32/EWG: Entscheidung der Kommission vom 21. Dezember 1965 über den
    Antrag der Französischen Republik gemäß Artikel 115 Absatz (1) des Vertrages,
    um Blumen und Knospen von Schnittblumen mit Ursprung in dritten Ländern, die
    sich in den anderen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/32/CEE: Decisione della Commissione, del 21 dicembre 1965, relativa
    al ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    per escludere dal trattamento comunitario i fiori e boccioli di fiori, recisi,
    originari di paesi terzi e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/32/EEG: Beschikking van de Commissie van 21 december 1965 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag afgesneden bloemen, bloesems en bloemknoppen, die van oorsprong
    zijn uit derde landen en in de andere Lid- Staten in het vrije verkeer zijn gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
