title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2156/77 of 27 September 1977 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of a Member State fishing in Norwegian waters north
    of 62 North and to vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2156/77 du Conseil, du 27 septembre 1977, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables,
    d'une part, aux navires battant pavillon d'un État membre exerçant une activité
    de pêche dans les eaux norvégiennes situées au Nord du 62 de latitude nord
    et, d'autre part, aux navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2156/77 des Rates vom 27. September 1977 zur Festlegung
    von Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    gegenüber Schiffen, welche die Flagge eines Mitgliedstaats führen und in den
    norwegischen Meeresgewässern nördlich 62 N eine Fischereitätigkeit ausüben,
    sowie gegenüber Schiffen, die die Flagge Norwegens führen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2156/77 af 27. september 1977 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der fører en medlemsstats flag, og som
    driver fiskeri i de norske farvande nord for 62 nordlige bredde, samt på fartøjer,
    der fører Norges flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2156/77 del Consiglio, del 27 settembre 1977, che
    fissa alcune misure interinali di conservazione e di gestione delle risorse della
    pesca applicabili, da una parte, alle navi che battono bandiera di uno Stato membro
    e che esercitano un'attività di pesca nelle acque della Norvegia situate a nord
    di 62 di latitudine nord e, dall'altra, alle navi che battono bandiera della Norvegia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2156/77 van de Raad van 27 september 1977 tot vaststelling
    van bepaalde overgangsmaatregelen voor instandhouding en beheer van de visbestanden,
    die van toepassing zijn enerzijds op vaartuigen die de vlag van een Lid-Staat
    voeren en in de Noorse wateren ten noorden van 62 noorderbreedte visserijactiviteiten
    uitoefenen en anderzijds op vaartuigen die de vlag van Noorwegen voeren
  type: main
