title:
- language: en
  script: Latn
  content: Council Decision (CFSP) 2016/1990 of 14 November 2016 amending Joint Action
    2008/124/CFSP on the European Union Rule of Law Mission in Kosovo (This designation
    is without prejudice to positions on status, and is in line with UNSCR 1244 (1999)
    and the ICJ Opinion on the Kosovo declaration of independence. ) (EULEX KOSOVO)
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2016/1990 du Conseil du 14 novembre 2016 modifiant l'action
    commune 2008/124/PESC relative à la mission «État de droit» menée par l'Union
    européenne au Kosovo (Cette désignation est sans préjudice des positions sur
    le statut et est conforme à la résolution 1244 (1999) du Conseil de sécurité
    des Nations unies ainsi qu'à l'avis de la CIJ sur la déclaration d'indépendance
    du Kosovo. ) (EULEX KOSOVO)
  type: main
