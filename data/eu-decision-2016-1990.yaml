    Europäischen Union im Kosovo (Diese Bezeichnung berührt nicht die Standpunkte
    zum Status und steht im Einklang mit der Resolution 1244 (1999) des VN-Sicherheitsrates
    und dem Gutachten des Internationalen Gerichtshofs zur Unabhängigkeitserklärung
    des Kosovo. ) (EULEX KOSOVO)
