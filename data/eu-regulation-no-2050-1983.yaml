title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2050/83 of 21 July 1983 confirming Commission
    Regulation (EEC) No 873/83 revoking the protective measures in respect of imports
    into France and the United Kingdom of tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of stoneware, and introducing a system of
    automatic authorization for imports of the products in question originating in
    or coming from South Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2050/83 du Conseil du 21 juillet 1983 confirmant le
    règlement (CEE) no 873/83 de la Commission abrogeant les mesures de protection
    applicables à la vaisselle et aux articles de ménage ou de toilette, en grès,
    importés en France et au Royaume-Uni et instituant un régime d' autorisations
    d' importation automatiques pour les produits en question originaires ou en provenance
    de Corée du Sud
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2050/83 des Rates vom 21. Juli 1983 zur Bestätigung
    der Verordnung (EWG) Nr. 873/83 der Kommission zur Aufhebung der Schutzmaßnahmen
    betreffend die Einfuhren von Geschirr sowie Haushalts- oder Toilettengegenständen
    aus Steinzeug nach Frankreich und in das Vereinigte Königreich und zur Einführung
    eines Systems automatischer Einfuhrgenehmigungen für diese Waren mit Ursprung
    in oder Herkunft aus Südkorea
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2050/83 af 21. juli 1983 om stadfæstelse
    af Kommissionens forordning (EØF) nr. 873/83 om ophævelse af beskyttelsesforanstaltningerne
    vedrørende bordservice og husholdnings- eller toiletartikler af stentøj, der
    importeres i Frankrig og Det forenede Kongerige, og om indførelse af en ordning
    med automatisk udstedelse af tilladelser til import af de pågældende varer med
    oprindelse i eller hidrørende fra Sydkorea
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2050/83 του Συμβουλίου
    της 21ης Ιουλίου 1983 με τον οποίο επικυρώνεται
    ο κανονισμός (ΕΟΚ) αριθ. 873/83 της Επιτροπής για
    την κατάργηση των προστατευτικών μέτρων που
    εφαρμόζονται για τα επιτραπέζια σκεύη και
    τα είδη οικιακής χρήσεως ή ευπρεπισμού από
    ψευδοπορσελάνη, που εισάγονται στη Γαλλία
    και το Ηνωμένο Βασίλειο και τη θέσπιση καθεστώτος
    αυτόματων αδειών εισαγωγής για τα προϊόντα
    αυτά που κατάγονται ή προέρχονται από τη Νότια
    Κορέα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2050/83 del Consiglio del 21 luglio 1983 che conferma
    il regolamento (CEE) n. 873/83 della Commissione che abroga le misure di salvaguardia
    applicabili al vasellame ed agli oggetti di uso domestico o da toletta, in gres,
    importati in Francia e nel Regno Unito, e che istituisce un regime di autorizzazioni
    automatiche all' importazione per i prodotti in oggetto originari o provenienti
    dalla Corea del Sud
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2050/83 van de Raad van 21 juli 1983 houdende bevestiging
    van Verordening (EEG) nr. 873/83 van de Commissie tot intrekking van de beschermende
    maatregelen ten aanzien van vaatwerk, huishoudelijke artikelen en toiletartikelen,
    van gres, die in Frankrijk en het Verenigd Koninkrijk worden ingevoerd, en tot
    instelling van een regeling van automatische invoervergunningen voor de bedoelde
    produkten van oorsprong of afkomstig uit Zuid-Korea
  type: main
