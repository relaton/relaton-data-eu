    (ΕΟΚ) αριθ. 2042/75 όσον αφορά τη διάρκεια ισχύος
    των πιστοποιητικών εξαγωγής για τις σύνθετες
    ζωοτροφές με βάση τα σιτηρά και τα μεταποιημένα
    προϊόντα με βάση τα σιτηρά και το ρύζι
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1816/83 della Commissione del 1° luglio 1983 che
    modifica il regolamento (CEE) n. 2042/75 per quanto riguarda la durata di validità
    dei titoli d' esportazione degli alimenti composti a base di cereali per gli animali
    e dei prodotti trasformati a base di cereali e di riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1816/83 van de Commissie van 1 juli 1983 tot wijziging
    van Verordening (EEG) nr. 2042/75 ten aanzien van de geldigheidsduur van de uitvoercertificaten
    voor mengvoeders op basis van granen en voor op basis van granen en rijst verwerkte
    produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1816/83 da Comissão, de 1 de Julho de 1983, que
    altera o Regulamento (CEE) n.° 2042/75 no que respeita ao prazo de validade dos
    certificados de exportação dos alimentos compostos para animais, à base de
    cereais e para os produtos transformados à base de cereais e de arroz
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1816/83 de la Comisión, de 1 de julio de 1983, por
    el que se modifica el Reglamento (CEE) n° 2042/75 en lo que se refiere al período
    de vigencia de los certificados de exportación de alimentos compuestos a base
    de cereales para los animales y de productos transformados a base de cereales
    y de arroz
  type: main
