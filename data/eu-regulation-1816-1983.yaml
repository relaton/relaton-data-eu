  content: Commission Regulation (EEC) No 1816/83 of 1 July 1983 amending Regulation
    (EEC) No 2042/75 as regards the period of validity of export licences for cereal-based
    feedingstuffs and cereal- and rice-based processed products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1816/83 de la Commission du 1er juillet 1983 modifiant
    le règlement (CEE) no 2042/75 en ce qui concerne la durée de validité des certificats
    d' exportation des aliments composés à base de céréales pour les animaux et
    des produits transformés à base de céréales et de riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1816/83 der Kommission vom 1. Juli 1983 zur Änderung
    der Verordnung (EWG) Nr. 2042/75 hinsichtlich der Gültigkeitsdauer der Ausfuhrlizenzen
    für Mischfuttermittel aus Getreide und Verarbeitungserzeugnisse aus Getreide
    und Reis
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1816/83 af 1. juli 1983 om ændring
    af forordning (EØF) nr. 2042/75 for så vidt angår gyldighedsperioden for eksportlicenser
    for foderblandinger på basis af korn samt forarbejdede produkter på basis af
    korn og ris
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1816/83 της Επιτροπής
