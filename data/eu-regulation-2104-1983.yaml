title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2104/83 of 27 July 1983 authorizing the
    German intervention agency to sell forequarters of bovine animals for processing
    into preserves with a view to constituting security stocks
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2104/83 de la Commission du 27 juillet 1983 autorisant
    l' organisme d' intervention allemand à vendre des quartiers avant de bovins
    en vue de leur transformation en conserves destinées à constituer des stocks
    de sécurité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2104/83 der Kommission vom 27. Juli 1983 zur Ermächtigung
    der deutschen Interventionsstelle, Vorderviertel von Rindern im Hinblick auf ihre
    Verarbeitung zu Konserven zu verkaufen, die zur Schaffung von Notvorräten bestimmt
    sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2104/83 af 27. juli 1983 om bemyndigelse
    af det tyske interventionsorgan til at sælge okseforfjerdinger med henblik på
    forarbejdning til konserves, som skal udgøre sikkerhedslagre
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2104/83 της Επιτροπής
    της 27ης Ιουλίου 1983 περί εξουσιοδοτήσεως του
    γερμανικού οργανισμού παρεμβάσεως να προβεί
    στην πώληση εμπροσθίων τετάρτων βοοειδών με
    σκοπό το μετασχηματισμό τους σε κονσέρβες
    που προορίζονται να αποτελέσουν αποθέματα
    ασφαλείας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2104/83 della Commissione del 27 luglio 1983 che autorizza
    l' organismo d' intervento tedesco a vendere quarti anteriori di bovini ai fini
    della loro trasformazione in conserve destinate a costituire scorte di sicurezza
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2104/83 van de Commissie van 27 juli 1983 tot machtiging
    van het Duitse interventiebureau om voorvoeten van runderen te verkopen voor verwerking
    tot conserven, bestemd voor de vorming van strategische voorraden
  type: main
