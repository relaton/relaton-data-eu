type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 16 décembre 1970, autorisant la République
    française à exclure du traitement communautaire les vêtements de dessus et
    de dessous, en textiles autres que le coton, des positions Ex 61.01, Ex 61.02,
    Ex 61.03 et Ex 61.04 du Tarif douanier commun, originaires de Hong-Kong et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/27/EWG: Entscheidung der Kommission vom 16. Dezember 1970, mit der
    die Französische Republik ermächtigt wird, die aus Hongkong stammende und in
    den übrigen Mitgliedstaaten im freien Verkehr befindliche Oberkleidung und Unterkleidung
    aus anderen als aus Baumwollspinnstoffen der Tarifnummern ex 61.01, ex 61.02,
    ex 61.03 und ex 61.04 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/27/CEE: Decisione della Commissione, del 16 dicembre 1970, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli indumenti
    esterni e le sottovesti di tessili diversi dal cotone, delle voci ex 61.01, ex
    61.02, ex 61.03 ed ex 61.04 della tariffa doganale comune, originari di Hong-Kong
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/27/EEG: Beschikking van de Commissie van 16 december 1970 waarbij de
    Franse Republiek wordt gemachtigd boven- en onderkleding van textiel, andere dan
    katoenen, van de posten ex 61.01, ex 61.02, ex 61.03 en ex 61.04 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong- Kong en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten.'
  type: main
