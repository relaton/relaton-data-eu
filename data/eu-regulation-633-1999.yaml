id: EURegulation6331999
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 633/1999 of 24 March 1999 amending Regulation
    (EC) No 221/1999 determining the extent to which applications lodged in January
    1999 for import licences for certain eggs and poultrymeat products under the regime
    provided for by the Agreements concluded by the Community with the Republic of
    Poland, the Republic of Hungary, the Czech Republic, Slovakia, Bulgaria and Romania
    can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 633/1999 de la Commission du 24 mars 1999 modifiant
    le règlement (CE) n° 221/1999 déterminant la mesure dans laquelle les demandes
    de certificats d'importation introduites en janvier 1999 pour certains produits
    des secteurs de la viande de volaille et des oeufs dans le cadre du régime prévu
    par les accords conclus par la Communauté avec la république de Pologne, la
    république de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 633/1999 der Kommission vom 24. März 1999 zur Änderung
    der Verordnung (EG) Nr. 221/1999 über die Festsetzung des Umfangs, in dem die
    im Januar 1999 gestellten Anträge auf Einfuhrlizenzen für bestimmte Eier- und
    Geflügelfleischerzeugnisse entsprechend der Regelung der Abkommen zwischen der
    Gemeinschaft und Polen, Ungarn, der Tschechischen Republik, der Slowakei, Bulgarien
    und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 633/1999 af 24. marts 1999 om ændring
    af forordning (EF) nr. 221/1999 om fastsættelse af, i hvilket omfang der kan
    accepteres ansøgninger, der blev indgivet i januar 1999 om importlicenser for
    visse æg- og fjerkrækødsprodukter i forbindelse med den ordning, der er fastsat
    i de aftaler, som Fællesskabet har indgået med Republikken Polen, Republikken
    Ungarn, Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien
    og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 633/1999 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Μαρτίου 1999 για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 221/1999 για καθορισμό ορίων
    εντός των οποίων δύνανται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Ιανουάριο
    του 1999 για ορισμένα προϊόντα των τομέων του
    κρέατος πουλερικών και των αυγών βάσει του
    καθεστώτος που προβλέπεται από τις συμφωνίες,
    τις οποίες συνήψε η Κοινότητα με τη Δημοκρατία
    της Πολωνίας, τη Δημοκρατία της Ουγγαρίας,
    την Τσεχική Δημοκρατία, τη Σλοβακία, τη Βουλγαρία
    και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 633/1999, annettu 24 päivänä maaliskuuta 1999,
    yhteisön, Puolan tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
    mukaisesti tammikuussa 1999 jätettyjen tiettyjä siipikarjanliha- ja muna-alan
    tuotteita koskevien tuontitodistushakemusten hyväksyttävyydestä annetun asetuksen
    (EY) N:o 221/1999 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 633/1999 della Commissione del 24 marzo 1999 recante
    modifica del regolamento (CE) n. 221/1999 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli d'importazione presentate nel mese di gennaio
    1999 per taluni prodotti del settore delle uova e del pollame nel quadro del regime
    previsto dagli accordi conclusi tra la Comunità e la Repubblica di Polonia, la
    Repubblica di Ungheria, la Repubblica ceca, la Slovacchia, la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 633/1999 van de Commissie van 24 maart 1999 houdende
    wijziging van Verordening (EG) nr. 221/1999 tot vaststelling van de mate waarin
    gevolg kan worden gegeven aan de aanvragen om invoercertificaten voor bepaalde
    producten in de sectoren slachtpluimvee en eieren, die in januari 1999 worden
    ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten overeenkomsten met de Republiek Polen, de Republiek Hongarije, de Tsjechische
    Republiek, de Slowaakse Republiek, Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 633/1999 da Comissão de 24 de Março de 1999 que
    altera o Regulamento (CE) n° 221/1999 que determina em que medida podem ser aceites
    os pedidos de certificados de importação de determinados produtos dos sectores
    dos ovos e da carne de aves de capoeira apresentados em Janeiro de 1999 ao abrigo
    do regime previsto nos acordos concluídos pela Comunidade com a República da
    Polónia, a República da Hungria, a República Checa, a Eslováquia, a Bulgária
    e a Roménia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 633/1999 de la Comisión de 24 de marzo de 1999 que
    modifica el Reglamento (CE) n° 221/1999 por el que se determina la proporción
    en que se satisfarán las solicitudes de certificados de importación de algunos
    productos de los sectores de la carne de aves de corral y de los huevos presentadas
    en el mes de enero de 1999 al amparo del régimen previsto en los Acuerdos celebrados
    entre la Comunidad y la República de Polonia, la República de Hungría, la República
    Checa, Eslovaquia, Bulgaria y Rumanía
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 633/1999 av den 24 mars 1999 om ändring
    av förordning (EG) nr 221/1999 om fastställande av i vilken utsträckning ansökningar
    som lämnats in i januari 1999 om importlicenser för vissa ägg- och fjäderfäköttprodukter
    i enlighet med den ordning som fastställs i avtalen mellan gemenskapen samt Polen,
    Ungern, Tjeckien, Slovakien, Bulgarien och Rumänien kan godkännas
  type: main
