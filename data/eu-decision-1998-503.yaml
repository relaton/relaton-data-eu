    con carácter temporal, medidas adicionales contra la propagación de Pseudomonas
    solanacearum (Smith) Smith, con referencia a Egipto [notificada con el número
    C(1998) 2480]'
  type: main
- language: sv
  script: Latn
  content: '98/503/EG: Kommissionens beslut av den 11 augusti 1998 om ändring av
