title:
- language: en
  script: Latn
  content: '98/503/EC: Commission Decision of 11 August 1998 amending Decision 96/301/EC
    and authorising Member States temporarily to take emergency measures against the
    dissemination of Pseudomonas solanacearum (Smith) Smith as regards Egypt (notified
    under document number C(1998) 2480)'
  type: main
- language: fr
  script: Latn
  content: '98/503/CE: Décision de la Commission du 11 août 1998 portant modification
    de la décision 96/301/CE et autorisant les États membres à prendre provisoirement
    des mesures d''urgence en vue de se protéger contre la propagation de Pseudomonas
    solanacearum (Smith) Smith en provenance d''Égypte [notifiée sous le numéro
    C(1998) 2480]'
  type: main
- language: de
  script: Latn
  content: '98/503/EG: Entscheidung der Kommission vom 11. August 1998 zur Änderung
    der Entscheidung 96/301/EG und zur Ermächtigung der Mitgliedstaaten, gegen die
    Verbreitung von Pseudomonas solanacearum (Smith) Smith befristete Sofortmaßnahmen
    gegenüber Ägypten zu treffen (Bekanntgegeben unter Aktenzeichen K(1998) 2480)'
  type: main
- language: da
  script: Latn
  content: '98/503/EF: Kommissionens beslutning af 11. august 1998 om ændring af
    beslutning 96/301/EF og om bemyndigelse af medlemsstaterne til midlertidigt at
    træffe hasteforanstaltninger mod spredning af Pseudomonas solanacearum (Smith)
    Smith, for så vidt angår Egypten (meddelt under nummer K(1998) 2480)'
  type: main
- language: el
  script: Grek
  content: '98/503/ΕΚ: Απόφαση της Επιτροπής της 11ης Αυγούστου
    1998 με την οποία τροποποιείται η απόφαση 96/301/ΕΚ
    που επιτρέπει προσωρινά στα κράτη μέλη να λάβουν
    κατεπείγοντα μέτρα κατά της εξάπλωσης της
    Pseudomonas solanacearum (Smith) Smith όσον αφορά την Αίγυπτο
    [κοινοποιηθείσα υπό τον αριθμό Ε(1998) 2480]'
  type: main
- language: fi
  script: Latn
  content: '98/503/EY: Komission päätös, tehty 11 päivänä elokuuta 1998, päätöksen
    96/301/EY muuttamisesta ja luvan antamisesta jäsenvaltioille toteuttaa väliaikaisesti
    Egyptiä koskevia kiireellisiä toimenpiteitä Pseudomonas solanacearum (Smith)
    Smith -taudinaiheuttajan leviämisen estämiseksi (tiedoksiannettu numerolla K(1998)
    2480)'
  type: main
- language: it
  script: Latn
  content: '98/503/CE: Decisione della Commissione dell''11 agosto 1998 che modifica
    la decisione 96/301/CE e che autorizza gli Stati membri ad adottare, a titolo
    provvisorio, misure d''emergenza contro la propagazione dello Pseudomonas solanacearum
    (Smith) Smith per quanto riguarda l''Egitto [notificata con il numero C(1998)
    2480]'
  type: main
- language: nl
  script: Latn
  content: '98/503/EG: Beschikking van de Commissie van 11 augustus 1998 houdende
    wijziging van Beschikking 96/301/EG en tot machtiging van de lidstaten om ten
    aanzien van Egypte tijdelijk spoedmaatregelen te nemen tegen de verspreiding van
    Pseudomonas solanacearum (Smith) Smith (kennisgeving geschied onder nummer C(1998)
    2480)'
  type: main
- language: pt
  script: Latn
  content: '98/503/CE: Decisão da Comissão de 11 de Agosto de 1998 que altera a
    Decisão 96/301/CE e autoriza os Estados-membros a adoptar provisoriamente medidas
    de emergência contra a propagação de Pseudomonas solanacearum (Smith) Smith
    no que respeita ao Egipto [notificada com o número C(1998) 2480]'
  type: main
- language: es
  script: Latn
  content: '98/503/CE: Decisión de la Comisión de 11 de agosto de 1998 que modifica
