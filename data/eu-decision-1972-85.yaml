title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 14 janvier 1972, autorisant le Royaume de
    Belgique et la République fédérale d'Allemagne à admettre à la commercialisation
    des matériels de reproduction des pinus nigra arno var. austriaca, soumis à
    des exigences réduites
  type: main
- language: de
  script: Latn
  content: '72/85/EWG: Entscheidung der Kommission vom 14. Januar 1972, mit der das
    Königreich Belgien und die Bundesrepublik Deutschland ermächtigt werden, Vermehrungsgut
    von Pinus nigra Arn. var. austriaca mit minderen Anforderungen zum gewerbsmäßigen
    Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '72/85/CEE: Decisione della Commissione, del 14 gennaio 1972, che autorizza
    il Regno del Belgio e la Repubblica federale di Germania ad ammettere alla commercializzazione
    dei materiali di moltiplicazione di Pinus nigra Arn. var. austriaca, soggetti
    a requisiti ridotti'
  type: main
- language: nl
  script: Latn
  content: '72/85/EEG: Beschikking van de Commissie van 14 januari 1972 houdende machtiging
    van het Koninkrijk België en van de Bondsrepubliek Duitsland om teeltmateriaal
    van Pinus nigra Arn. var austriaca, waaraan minder strenge eisen zijn gesteld,
    tot de handel toe te laten'
  type: main
