title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3560/93 of 21 December 1993 amending Regulation
    (EEC) No 2698/93 laying down detailed rules for the application in the pigmeat
    sector of the arrangements provided for in the Interim Agreements between the
    European Economic Community and the Republic of Poland, the Republic of Hungary
    and the former Czech and Slovak Federal Republic and fixing the quantities available
    for the period 1 January to 31 March 1994 for imports from the Czech and Slovak
    Republics
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 3560/93 de la Commission, du 21 décembre 1993, modifiant
    le règlement (CEE) nº 2698/93 établissant les modalités d' application au
    secteur de la viande de porc du régime prévu dans les accords intérimaires
    d' association entre la Communauté et la Pologne, la Hongrie et l' ancienne République
    fédérative tchèque et slovaque et fixant les quantités disponibles pour la
    période du 1er janvier au 31 mars 1994 pour les importations en provenance de
    la République tchèque et de la République slovaque
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3560/93 der Kommission vom 21. Dezember 1993 zur Änderung
    der Verordnung (EWG) Nr. 2698/93 zur Festlegung der den Schweinefleischsektor
    betreffenden Durchführungsbestimmungen zu der Regelung im Rahmen der von der
    Gemeinschaft mit Polen, der früheren Tschechischen und Slowakischen Föderativen
    Republik und Ungarn geschlossenen Interimsabkommen und zur Festlegung der vom
    1. Januar bis 31. März 1994 für Einfuhren aus der Tschechischen Republik und
    aus der Slowakischen Republik zur Verfügung stehenden Mengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3560/93 af 21. december 1993 om ændring
    af forordning (EØF) nr. 2698/93 om gennemførelsesbestemmelser for anvendelse
    i svinekødssektoren af den ordning, der er fastsat i de interimsaftaler, som
    Fællesskabet har indgået med Polen, Ungarn og den tidligere Tjekkiske og Slovakiske
    Føderative Republik, og om fastsættelse af de mængder, der er til rådighed
    for perioden 1. januar til 31. marts 1994 for indførsel fra Den Tjekkiske Republik
    og Den Slovakiske Republik
  type: main
- language: el
  script: Grek
