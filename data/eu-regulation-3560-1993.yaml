  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3560/93 della Commissione, del 21 dicembre 1993, recante
    modifica del regolamento (CEE) n. 2698/93 della Commissione, che stabilisce le
    modalità d' applicazione, per il settore delle carni suine, del regime previsto
    dagli accordi interinali di associazione tra la Comunità e la Polonia, l' Ungheria
    e l' ex Repubblica federativa ceca e slovacca, nonché la fissazione dei quantitativi
    disponibili nel periodo dal 1ºgennaio al 31 marzo 1994 per i prodotti importati
    dalla Repubblica ceca e dalla Repubblica slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3560/93 van de Commissie van 21 december 1993 houdende
    wijziging van Verordening (EEG) nr. 2698/93 tot vaststelling van bepalingen voor
    de uitvoering, in de sector varkensvlees, van de regeling waarin is voorzien bij
    de Interimovereenkomsten tussen, enerzijds, de Gemeenschap en, anderzijds, respectievelijk,
    Polen, Hongarije en de voormalige Tsjechische en Slowaakse Federatieve Republiek
    en tot vaststelling van de voor de invoer uit de Tsjechische Republiek en de Slowaakse
    Republiek beschikbare hoeveelheden voor de periode van 1 januari tot en met 31
    maart 1994
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3560/93 da Comissão, de 21 de Dezembro de 1993, que
    altera o Regulamento (CEE) nº 2698/93, que estabelece as regras de execução,
    no sector da carne de suíno, do regime previsto nos acordos provisórios concluídos
    pela Comunidade com a Polónia, a Hungria e a antiga República Federativa Checa
    e Eslovaca, e fixa as quantidades disponíveis para o período compreendido entre
    1 de Janeiro e 31 de Março de 1994 no que respeita às importações provenientes
    das repúblicas Checa e Eslovaca
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3560/93 de la Comisión, de 21 de diciembre de 1993,
    que modifica el Reglamento (CEE) nº 2698/93 de la Comisión por el que se establecen
    las disposiciones de aplicación, en el sector de la carne de porcino del régimen
    previsto en los Acuerdos interinos celebrados entre la Comunidad y Polonia, Hungría
    y la antigua República Federativa Checa y Eslovaca, y por el que se fijan las
    cantidades disponibles durante el período comprendido entre el 1 de enero y el
    31 de marzo de 1994 para las importaciones procedentes de las Repúblicas Checa
    y Eslovaca
