  content: Commission Regulation (EEC) No 3041/85 of 31 October 1985 fixing the rates
    of the refunds applicable from 1 November 1985 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3041/85 de la Commission, du 31 octobre 1985, fixant
