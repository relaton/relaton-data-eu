title:
- language: en
  script: Latn
  content: '96/714/EC: Commission Decision of 5 December 1996 terminating the proceeding
    under Council Regulation (EC) No 3286/94 on trade barriers, concerning the imposition
    by Turkey of a charge known as the ''Mass Housing Fund levy'' in addition to a
    higher level of customs duty on imports of polyester fibre originating in the
    European Community'
  type: main
- language: fr
  script: Latn
  content: '96/714/CE: Décision de la Commission du 5 décembre 1996 clôturant la
    procédure, conformément au règlement (CE) nº 3286/94 du Conseil concernant
    les obstacles au commerce, portant sur l''imposition par la Turquie d''une taxe
    dénommée «Mass Housing Fund Levy» en sus d''un droit de douane accru sur les
    importations de fibres de polyesters originaires de la Communauté européenne'
  type: main
- language: de
  script: Latn
  content: '96/714/EG: Beschluß der Kommission vom 5. Dezember 1996 über die Einstellung
    des Verfahrens nach der Verordnung (EG) Nr. 3286/94 des Rates über Handelshemmnisse
    betreffend die Einführung einer als "Mass Housing Fund Levy" bezeichneten Abgabe
    durch die Türkei zusätzlich zu einem erhöhten Zoll auf die Einfuhren von Polyesterfasern
    mit Ursprung in der Europäischen Gemeinschaft'
  type: main
- language: da
  script: Latn
  content: '96/714/EF: Kommissionens Afgørelse af 5. december 1996 om afslutning
    af proceduren i henhold til Rådets forordning (EF) nr. 3286/94 om handelshindringer
    vedrørende Tyrkiets indførelse af en afgift benævnt »Mass Housing Fund Levy«
    i tillæg til en forhøjet told på importen af polyesterfibre med oprindelse
    i Det Europæiske Fællesskab'
  type: main
- language: el
  script: Grek
  content: '96/714/ΕΚ: Απόφαση της Επιτροπής της 5ης Δεκεμβρίου
    1996 για την περάτωση της διαδικασίας σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 3286/94 του Συμβουλίου
    για τους φραγμούς στο εμπόριο, που αφορά την
    επιβολή φόρου με την ονομασία «Mass Housing Fund Levy»
    και επιπλέον αυξημένου δασμού επί των εισαγωγών
    στην Τουρκία ινών από πολυεστέρες καταγωγής
    Ευρωπαϊκής Κοινότητας'
  type: main
- language: fi
  script: Latn
  content: '96/714/EY: Komission päätös, tehty 5 päivänä joulukuuta 1996, kaupan
    esteistä annetun neuvoston asetuksen (EY) N:o 3286/94 mukaisen menettelyn päättämisestä
    Turkin Euroopan yhteisöstä peräisin olevien polyesterikuitujen tuonnissa korotetun
    tullin lisäksi käyttöön ottaman "Mass Housing Fund Levy" -nimisen maksun osalta'
  type: main
- language: it
  script: Latn
  content: '96/714/CE: Decisione della Commissione del 5 dicembre 1996 che chiude
    il procedimento ai sensi del regolamento (CE) n. 3286/94 del Consiglio sugli ostacoli
    agli scambi, concernente l''imposizione da parte della Turchia di un''imposta
    denominata «Mass Housing Fund levy» in aggiunta a un aumento del dazio doganale
    applicato alle importazioni in Turchia di fibre in poliestere originarie della
    Comunità europea'
  type: main
- language: nl
  script: Latn
  content: '96/714/EG: Besluit van de Commissie van 5 december 1996 tot beëindiging
    van de procedure uit hoofde van Verordening (EG) nr. 3286/94 van de Raad inzake
    handelsbelemmeringen, die werd ingeleid naar aanleiding van de instelling door
    Turkije van een heffing, de zogenaamde "Mass Housing Fund Levy", naast een verhoging
    van het douanerecht op de invoer van polyestervezels van oorsprong uit de Europese
    Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '96/714/CE: Decisão da Comissão de 5 de Dezembro de 1996 que encerra
    o processo iniciado nos termos do Regulamento (CE) nº 3286/94 do Conselho respeitante
    aos entraves ao comércio, relativa à criação, por parte da Turquia, de um
    imposto designado «Mass Housing Fund Levy» além de um direito aduaneiro mais
    elevado sobre as importações de fibras de poliésteres originárias da Comunidade
    Europeia'
  type: main
- language: es
  script: Latn
  content: '96/714/CE: Decisión de la Comisión de 5 de diciembre de 1996 por la
