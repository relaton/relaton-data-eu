  content: Commission Regulation (EEC) No 3620/89 of 1 December 1989 on transitional
    measures concerning non-recovery of the variable slaughter premium for sheepmeat
    and goatmeat products exported from the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3620/89 de la Commission du 1er décembre 1989 relatif
    à des mesures transitoires en ce qui concerne la non-récupération de la prime
    variable à l'abattage pour les produits du secteur des viandes ovine et caprine
    exportés hors de la Communauté
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3620/89 DER KOMMISSION vom 1. Dezember 1989 mit Übergangsmaßnahmen
    über die Nichtwiedereinziehung der variablen Schlachtprämie bei Erzeugnissen
    des Schaf- und Ziegenfleischsektors, die aus der Gemeinschaft ausgeführt worden
    sind #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3620/89 af 1. december 1989 om overgangsforanstaltninger
    indeværende, at den variable slagtepræmie ikke tilbagebetales for produkter
    fra sektoren for fåre- og gedekød, som udføres fra Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3620/89 της Επιτροπής
    της 1ης Δεκεμβρίου 1989 για τα μεταβατικά μέτρα
    που αφορούν την μη είσπραξη της μεταβλητής
    πριμοδότησης στη σφαγή για το πρόβειο και αίγειο
    κρέας που εξάγεται από την Κοινότητα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3620/89 DELLA COMMISSIONE del 1o dicembre 1989 recante
    misure transitorie che autorizzano a non prelevare un importo pari al premio variabile
    alla macellazione per i prodotti del settore delle carni ovine e caprine esportati
    fuori dalla Comunità #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3620/89 VAN DE COMMISSIE van 1 december 1989 inzake
    overgangsmaatregelen voor het niet terugvorderen van de variabele slachtpremie
    voor de produkten van de sector schape- en geitevlees, die worden uitgevoerd uit
    de Gemeenschap #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3620/89 DA COMISSÃO de 1 de Dezembro de 1989 que
    estabelece medidas transitórias sobre a não-recuperação do prémio variável
    ao abate no respeitante aos produtos do sector das carnes de ovino e caprino exportados
    para fora da Comunidade #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3620/89 DE LA COMISIÓN de 1 de diciembre de 1989
    sobre determinadas medidas transitorias en lo que se refiere a la no recuperación
    de la prima variable por sacrificio relativa a los productos del sector de las
    carnes de ovino y caprino exportados de la Comunidad #'
