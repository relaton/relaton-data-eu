---
id: EUDecision201491
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2014/91/EU: Commission Implementing Decision of 14 February 2014 amending
    Annex II to Decision 93/52/EEC as regards the recognition of certain regions of
    Italy and Spain as officially free of brucellosis ( B. melitensis ) and amending
    Annexes I, II and III to Decision 2003/467/EC as regards the declaration of Hungary
    as officially tuberculosis-free, Romania and certain regions of Italy as officially
    brucellosis-free, and certain regions of Italy as officially enzootic-bovine-leukosis-free
    (notified under document C(2014) 741)'
  type: main
- language: fr
  script: Latn
  content: '2014/91/UE: Décision d’exécution de la Commission du 14 février 2014
    modifiant l’annexe II de la décision 93/52/CEE en ce qui concerne la reconnaissance
    de certaines régions d’Italie et d’Espagne comme officiellement indemnes
    de brucellose ( B. melitensis ) et modifiant les annexes I, II et III de la décision
    2003/467/CE en ce qui concerne la déclaration de la Hongrie comme officiellement
    indemne de tuberculose, de la Roumanie et de certaines régions d’Italie comme
    officiellement indemnes de brucellose et de certaines régions d’Italie comme
    officiellement indemnes de leucose bovine enzootique [notifiée sous le numéro
    C(2014) 741]'
  type: main
- language: de
  script: Latn
  content: '2014/91/EU: Durchführungsbeschluss der Kommission vom 14. Februar 2014
    zur Änderung des Anhangs II der Entscheidung 93/52/EWG hinsichtlich der Anerkennung
    bestimmter Gebiete Italiens und Spaniens als amtlich frei von Brucellose ( B.
    melitensis ) sowie zur Änderung der Anhänge I, II und III der Entscheidung 2003/467/EG
    hinsichtlich der Anerkennung Ungarns als amtlich frei von Tuberkulose, Rumäniens
    und bestimmter Gebiete Italiens als amtlich frei von Brucellose sowie bestimmter
    Gebiete Italiens als amtlich frei von enzootischer Rinderleukose (Bekanntgegeben
    unter Aktenzeichen C(2014) 741)'
  type: main
- language: bg
  script: Cyrl
  content: '2014/91/ЕС: Решение за изпълнение на Комисията
    от 14 февруари 2014 година за изменение на приложение
    II към Решение 93/52/ЕИО по отношение на признаването
    на някои региони на Италия и Испания за официално
    свободни от бруцелоза ( B. melitensis ) и за изменение
    на приложения I, II и III към Решение 2003/467/ЕО по
    отношение на обявяването на Унгария за официално
    свободна от туберкулоза, на Румъния и на някои
    региони на Италия за официално свободни от
    бруцелоза и на някои региони на Италия за официално
    свободни от ензоотична левкоза по говедата
    (нотифицирано под номер C(2014) 741)'
  type: main
- language: cs
  script: Latn
  content: '2014/91/EU: Prováděcí rozhodnutí Komise ze dne 14. února 2014 , kterým
    se mění příloha II rozhodnutí 93/52/EHS, pokud jde o uznání určitých
    oblastí Itálie a Španělska za úředně prosté brucelózy ( B. melitensis
    ), a kterým se mění přílohy I, II a III rozhodnutí 2003/467/ES, pokud jde
    o prohlášení Maďarska za úředně prosté tuberkulózy, Rumunska a určitých
    oblastí Itálie za úředně prosté brucelózy a určitých oblastí Itálie
    za úředně prosté enzootické leukózy skotu (oznámeno pod číslem C(2014)
    741)'
  type: main
- language: da
  script: Latn
  content: '2014/91/EU: Kommissionens gennemførelsesafgørelse af 14. februar 2014
    om ændring af bilag II til beslutning 93/52/EØF for så vidt angår anerkendelse
    af visse regioner i Italien og Spanien som officielt frie for brucellose ( B.
    melitensis ) og om ændring af bilag I, II og III til beslutning 2003/467/EF for
    så vidt angår erklæringen om, at Ungarn er officielt tuberkulosefrit, at Rumænien
    og visse regioner i Italien er officielt brucellosefrie, og om, at visse regioner
    i Italien er officielt frie for enzootisk kvægleukose (meddelt under nummer C(2014)
    741)'
  type: main
- language: el
  script: Grek
