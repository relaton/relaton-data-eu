    όσον αφορά την κήρυξη της Ουγγαρίας ως επισήμως
    απαλλαγμένης από τη φυματίωση, της Ρουμανίας
    και ορισμένων περιφερειών της Ιταλίας ως επισήμως
    απαλλαγμένων από τη βρουκέλλωση και ορισμένων
    περιφερειών της Ιταλίας ως επισήμως απαλλαγμένων
    από την ενζωοτική λεύκωση των βοοειδών [κοινοποιηθείσα
    υπό τον αριθμό C(2014) 741]'
  type: main
- language: et
  script: Latn
  content: '2014/91/EL: Komisjoni rakendusotsus, 14. veebruar 2014 , millega muudetakse
    otsuse 93/52/EMÜ II lisa seoses Itaalia ja Hispaania teatavate piirkondade tunnistamisega
    ametlikult vabaks brutselloosist ( B. melitensis ) ning otsuse 2003/467/EÜ I,
    II ja III lisa seoses Ungari tunnistamisega ametlikult tuberkuloosivabaks, Rumeenia
    ja teatavate Itaalia piirkondade tunnistamisega ametlikult brutselloosivabaks
    ning teatavate Itaalia piirkondade tunnistamisega ametlikult vabaks veiste ensootilisest
    leukoosist (teatavaks tehtud numbri C(2014) 741 all)'
  type: main
- language: fi
  script: Latn
  content: '2014/91/EU: Komission täytäntöönpanopäätös, annettu 14 päivänä
    helmikuuta 2014 , päätöksen 93/52/ETY liitteen II muuttamisesta siltä osin
    kuin kyse on tiettyjen Italian ja Espanjan alueiden tunnustamisesta virallisesti
    vapaiksi luomistaudista ( B. melitensis ) sekä päätöksen 2003/467/EY liitteiden
    I, II ja III muuttamisesta siltä osin kuin kyse on Unkarin julistamisesta virallisesti
    vapaaksi tuberkuloosista, Romanian ja tiettyjen Italian alueiden julistamisesta
    virallisesti vapaiksi luomistaudista ja tiettyjen Italian alueiden julistamisesta
    virallisesti vapaiksi naudan tarttuvasta leukoosista (tiedoksiannettu numerolla
    C(2014) 741)'
  type: main
- language: hr
  script: Latn
  content: '2014/91/EU: Provedbena odluka Komisije оd 14. veljače 2014. o izmjeni
    Priloga II. Odluci 93/52/EEZ u pogledu priznavanja određenih regija Italije i
    Španjolske kao službeno slobodnih od bruceloze ( B. melitensis ) te o izmjeni
    priloga I., II. i III. Odluci 2003/467/EZ u pogledu proglašavanja Mađarske službeno
    slobodnom od tuberkuloze, Rumunjske i određenih regija Italije službeno slobodnima
    od bruceloze te određenih regija Italije službeno slobodnima od enzootske leukoze
    goveda (priopćeno pod brojem dokumenta C(2014) 741)'
  type: main
- language: hu
  script: Latn
  content: '2014/91/EU: A Bizottság végrehajtási határozata ( 2014. február 14.
    ) Olaszország és Spanyolország egyes régióinak hivatalosan brucellózistól
    ( B. melitensis ) mentesnek nyilvánítása tekintetében a 93/52/EGK határozat
    II. mellékletének módosításáról, valamint Magyarországnak hivatalosan
    tuberkulózistól mentesnek, Romániának, valamint Olaszország egyes régióinak
    hivatalosan brucellózistól mentesnek, Olaszország egyes régióinak hivatalosan
    a szarvasmarhák enzootikus leukózisától mentesnek nyilvánítása tekintetében
    a 2003/467/EK határozat I., II. és III. mellékletének módosításáról (az
    értesítés a C(2014) 741. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2014/91/UE: Decisione di esecuzione della Commissione, del 14 febbraio
    2014 , che modifica l’allegato II della decisione 93/52/CEE, riconoscendo come
    ufficialmente indenni da brucellosi ( B. melitensis ) alcune regioni dell’Italia
    e della Spagna, e gli allegati I, II e III della decisione 2003/467/CE per quanto
    riguarda la dichiarazione secondo la quale l’Ungheria è ufficialmente indenne
    da tubercolosi, la Romania e alcune regioni dell’Italia sono ufficialmente indenni
    da brucellosi e alcune regioni dell’Italia sono ufficialmente indenni da leucosi
    bovina enzootica [notificata con il numero C(2014) 741]'
  type: main
- language: lv
  script: Latn
  content: '2014/91/ES: Komisijas Īstenošanas lēmums ( 2014. gada 14. februāris
    ), ar ko groza Lēmuma 93/52/EEK II pielikumu attiecībā uz dažu Itālijas un
    Spānijas reģionu atzīšanu par oficiāli brīviem no brucelozes ( B. melitensis
    ) un Lēmuma 2003/467/EK I, II un III pielikumu attiecībā uz Ungārijas atzīšanu
    par oficiāli brīvu no tuberkulozes, Rumānijas un dažu Itālijas reģionu atzīšanu
    par oficiāli brīviem no brucelozes un dažu Itālijas reģionu atzīšanu par
    oficiāli brīviem no govju enzootiskās leikozes (izziņots ar dokumenta numuru
    C(2014) 741)'
  type: main
- language: lt
  script: Latn
  content: '2014/91/ES: 2014 m. vasario 14 d. Komisijos įgyvendinimo sprendimas,
    kuriuo dėl pripažinimo, kad tam tikruose Italijos ir Ispanijos regionuose oficialiai
    nenustatyta bruceliozės ( B. melitensis ), iš dalies keičiamas Sprendimo 93/52/EEB
    II priedas ir kuriuo dėl paskelbimo, kad Vengrijoje oficialiai nenustatyta tuberkuliozės,
    Rumunijoje ir tam tikruose Italijos regionuose – bruceliozės ir tam tikruose
    Italijos regionuose – enzootinės galvijų leukozės, iš dalies keičiami Sprendimo
    2003/467/EB I, II ir III priedai (pranešta dokumentu Nr. C(2014) 741)'
  type: main
- language: mt
  script: Latn
  content: '2014/91/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tal- 14
    ta’ Frar 2014 li temenda l-Anness II tad-Deċiżjoni 93/52/KEE fir-rigward tar-rikonoxximent
    ta’ ċerti reġjuni fl-Italja u Spanja bħala uffiċjalment ħielsa mill-bruċellożi
    ( B. melitensis ) u li temenda l-Annessi I, II u III tad-Deċiżjoni 2003/467/KE
    fir-rigward tad-dikjarazzjoni tal-Ungerija bħala uffiċjalment ħielsa mit-tuberkulożi,
    ir-Rumanija u ċerti reġjuni fl-Italja bħala uffiċjalment ħielsa mill-bruċellożi,
    u ċerti reġjuni fl-Italja bħala uffiċjalment ħielsa mil-lewkożi enzootika
    bovina (notifikata bid-dokument C(2014) 741)'
  type: main
- language: nl
  script: Latn
  content: '2014/91/EU: Uitvoeringsbesluit van de Commissie van 14 februari 2014 tot
    wijziging van bijlage II bij Beschikking 93/52/EEG wat betreft de erkenning dat
    bepaalde gebieden in Italië en Spanje officieel vrij zijn van brucellose ( B.
    melitensis ) en tot wijziging van de bijlagen I, II en III bij Beschikking 2003/467/EG
    wat betreft de verklaring dat Hongarije officieel vrij is van tuberculose, dat
    Roemenië en bepaalde gebieden in Italië officieel vrij zijn van brucellose en
    dat bepaalde gebieden in Italië officieel vrij zijn van enzoötische boviene
    leukose (Kennisgeving geschied onder nummer C(2014) 741)'
  type: main
- language: pl
  script: Latn
  content: '2014/91/UE: Decyzja wykonawcza Komisji z dnia 14 lutego 2014 r. zmieniająca
    załącznik II do decyzji 93/52/EWG w odniesieniu do uznania niektórych regionów
    Włoch i Hiszpanii za oficjalnie wolne od brucelozy ( B. melitensis ) oraz zmieniająca
    załączniki I, II i III do decyzji 2003/467/WE w odniesieniu do uznania Węgier
    za oficjalnie wolne od gruźlicy, Rumunii i niektórych regionów Włoch za oficjalnie
    wolne od brucelozy oraz niektórych regionów Włoch za oficjalnie wolne od enzootycznej
    białaczki bydła (notyfikowana jako dokument nr C(2014) 741)'
  type: main
- language: pt
  script: Latn
  content: '2014/91/UE: Decisão de Execução da Comissão, de 14 de fevereiro de
    2014 , que altera o anexo II da Decisão 93/52/CEE no que diz respeito ao reconhecimento
    de certas regiões de Itália e Espanha como oficialmente indemnes de brucelose
    ( B. melitensis ) e que altera os anexos I, II e III da Decisão 2003/467/CE no
    que se refere à declaração da Hungria como oficialmente indemne de tuberculose,
    da Roménia e de certas regiões de Itália como oficialmente indemnes de brucelose
    e de certas regiões de Itália como oficialmente indemnes de leucose bovina enzoótica
    [notificada com o número C(2014) 741]'
  type: main
- language: ro
  script: Latn
  content: '2014/91/UE: Decizia de punere în aplicare a Comisiei din 14 februarie
    2014 de modificare a anexei II la Decizia 93/52/CEE cu privire la recunoașterea
    anumitor regiuni din Italia și Spania ca oficial indemne de bruceloză ( B. melitensis
    ) și de modificare a anexelor I, II și III la Decizia 2003/467/CE cu privire
    la declararea Ungariei ca oficial indemnă de tuberculoză, a României și a
    anumitor regiuni din Italia ca oficial indemne de bruceloză și a anumitor regiuni
    din Italia ca oficial indemne de leucoză enzootică bovină [notificată cu numărul
    C(2014) 741]'
  type: main
- language: sk
  script: Latn
  content: '2014/91/EÚ: Vykonávacie rozhodnutie Komisie zo 14. februára 2014 ,
    ktorým sa mení príloha II k rozhodnutiu 93/52/EHS, pokiaľ ide o úradné uznanie
    určitých regiónov v Taliansku a Španielsku za oblasti bez výskytu brucelózy
    ( B. melitensis ), a ktorým sa menia prílohy I, II a III k rozhodnutiu 2003/467/ES,
    pokiaľ ide o úradné vyhlásenie Maďarska za oblasť bez výskytu tuberkulózy,
    Rumunska a určitých regiónov Talianska za oblasti bez výskytu brucelózy a
    určitých regiónov Talianska za oblasti bez výskytu enzootickej leukózy hovädzieho
    dobytka [oznámené pod číslom C(2014) 741]'
  type: main
- language: sl
  script: Latn
  content: '2014/91/EU: Izvedbeni sklep Komisije z dne 14. februarja 2014 o spremembi
    Priloge II k Odločbi 93/52/EGS glede priznanja nekaterih regij Italije in Španije
    kot uradno prostih bruceloze ( B. melitensis ) ter spremembi prilog I, II in III
    k Odločbi 2003/467/ES glede priznanja Madžarske kot uradno proste tuberkuloze,
    Romunije in nekaterih regij Italije kot uradno prostih bruceloze ter nekaterih
    regij Italije kot uradno prostih enzootske goveje levkoze (notificirano pod dokumentarno
    številko C(2014) 741)'
  type: main
- language: es
  script: Latn
  content: '2014/91/UE: Decisión de Ejecución de la Comisión, de 14 de febrero
    de 2014 , que modifica el anexo II de la Decisión 93/52/CEE en cuanto al reconocimiento
    de determinadas regiones de Italia y España como oficialmente indemnes de brucelosis
    ( Brucella melitensis ), modifica los anexos I, II y III de la Decisión 2003/467/CE
    en cuanto a la declaración de Hungría como oficialmente indemne de tuberculosis,
    de Rumanía y determinadas regiones de Italia como oficialmente indemnes de brucelosis
    y de determinadas regiones de Italia como oficialmente indemnes de leucosis bovina
    enzoótica [notificada con el número C(2014) 741]'
  type: main
- language: sv
  script: Latn
  content: '2014/91/EU: Kommissionens genomförandebeslut av den 14 februari 2014
    om ändring av bilaga II till beslut 93/52/EEG vad gäller erkännandet av att
    vissa regioner i Italien och Spanien är officiellt fria från brucellos ( B.
    melitensis ) och om ändring av bilagorna I, II och III till beslut 2003/467/EG
    vad gäller fastställandet av att Ungern är officiellt fritt från tuberkulos,
    att Rumänien och vissa regioner i Italien är officiellt fria från brucellos
    och att vissa regioner i Italien är officiellt fria från enzootisk bovin leukos
    [delgivet med nr C(2014) 741]'
