title:
- language: en
  script: Latn
  content: '82/373/EEC: Commission Decision of 19 May 1982 authorizing the United
    Kingdom temporarily to take additional measures to protect itself against the
    introduction of Leptinotarsa decemlineata (Say)p (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/373/CEE: Décision de la Commission, du 19 mai 1982, autorisant le
    Royaume-Uni à prendre provisoirement des dispositions complémentaires en vue
    de se préserver contre l''introduction de Leptinotarsa decemlineata (Say) (Le
    texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/373/EWG: Entscheidung der Kommission vom 19. Mai 1982 zur Ermächtigung
    des Vereinigten Königreichs, vorläufig ergänzende Maßnahmen zum Schutz vor
    der Einschleppung von Leptinotarsa decemlineata (Say) zu treffen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/373/EØF: Kommissionens beslutning af 19. maj 1982 om bemyndigelse
    af Det forenede Kongerige til at træffe midlertidige supplerende foranstaltninger
    til beskyttelse med indslæbning af Leptinotarsa decemlineata (Say) (Kun den engelske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/373/EOK: Απόφαση τής Επιτροπής τής 19ης Μαΐου
    1982 περί προσωρινής χορηγήσεως αδείας στό Ηνωμένο
    Βασίλειο νά λάβει πρόσθετα μέτρα αυτοπροστασίας
    κατά τής εισαγωγής τής Leptinotarsa decemlineata (δορυφόρος)
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/373/CEE: Decisione della Commissione, del 19 maggio 1982, che autorizza
    il Regno Unito ad adottare provvisoriamente disposizioni complementari per premunirsi
    contro l''introduzione di Leptinotarsa decemlineata (Say)b (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/373/EEG: Beschikking van de Commissie van 19 mei 1982 tot machtiging
