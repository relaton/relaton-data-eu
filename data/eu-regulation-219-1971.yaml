  content: Règlement (CEE) n 219/71 de la Commission, du 1er février 1971, supprimant
    la taxe compensatoire à l'importation de mandarines, satsumas, clémentines,
    tangérines et autres hybrides similaires d'agrumes en provenance d'Algérie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 219/71 der Kommission vom 1. Februar 1971 zur Aufhebung
    der Ausgleichsabgabe bei der Einfuhr von Mandarinen, Satsumas, Clementinen, Tangerinen
    und anderen ähnlichen Kreuzungen von Zitrusfrüchten mit Herkunft aus Algerien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 219/71 della Commissione, del 1 febbraio 1971, che
    sopprime la tassa di compensazione all'importazione di mandarini, satsuma, clementine,
    tangerini e altri ibridi similari d'agrumi in provenienza dall'Algeria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 219/71 van de Commissie van 1 februari 1971 houdende
    intrekking van de compenserende heffing op de invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten uit
    Algerië
  type: main
