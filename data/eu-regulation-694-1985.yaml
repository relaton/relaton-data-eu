title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 694/85 of 15 March 1985 re-establishing
    the levying of customs duties on certain woven fabrics of cotton, other than unbleached
    or bleached, products of category 2 a) (code 40.0024), originating in Indonesia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 694/85 de la Commission du 15 mars 1985 portant rétablissement
    de la perception des droits de douane applicables à certains tissus de coton,
    autres qu' écrus ou blanchis, de la catégorie 2 a) (code 40.0024) originaires
    de l' Indonésie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 694/85 der Kommission vom 15. März 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Gewebe aus Baumwolle, andere als
    roh oder gebleicht, der Warenkategorie 2A (Kennziffer 40.0024) mit Ursprung in
    Indonesien, dem die in der Verordnung (EWG) Nr. 3563/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 694/85 af 15. marts 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte vævede stoffer af bomuld, bortset
    fra stoffer ublegede og blegede, under varekategori nr. 2 a (kode 40.0024), som
    har oprindelse i Indonesien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 694/85 της Επιτροπής
    της 15ης Μαρτίου 1985 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    υφάσματα βαμβακηρά έτερα των αλευκάστων ή
    λελευκασμένων, της κατηγορίας προϊόντων 2 α)
    (κωδικός 40.0024) καταγωγής Ινδονησίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3563/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 694/85 della Commissione del 15 marzo 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad alcuni tessuti di cotone, diversi
    dai greggi o imbianchiti, della categoria di prodotti n. 2 a) (codice 40.0024),
    originari dell' Indonesia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 694/85 van de Commissie van 15 maart 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    weefsels van katoen, andere dan ongebleekt of gebleekt, van de categorie van produkten
    nr. 2 a) (codenummer 40.0024), van oorsprong uit Indonesië, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3563/84 van de
    Raad
