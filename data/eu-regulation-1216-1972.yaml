title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1216/72 de la Commission, du 8 juin 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à l'anhydride et aux acides phosphoriques (méta-, ortho-, et pyro-), de la position
    tarifaire 28.10, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2795/71 du Conseil
    du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1216/72 der Kommission vom 8. Juni 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Phosphorsäureanhydrid und Phosphorsäuren
    (Meta-, Ortho- und Pyrophosphorsäure), der Tarifnummer 28.10, mit Ursprung in
    Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2795/71 des Rates
    vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1216/72 della Commissione, dell'8 giugno 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili all'anidride
    e agli acidi fosforici (meta-, orto- e piro-) della voce doganale n. 28.10 originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1216/72 van de Commissie van 8 juni 1972 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor fosforzuuranhydride (fosforpentoxyde) en fosforzuren (meta-, ortho- en pyrofosforzuur),
    van post 28.10, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 2795/71 van de Raad van 20 december 1971 tariefpreferenties
    werden geopend
  type: main
