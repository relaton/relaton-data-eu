title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2550/2001 of 21 December 2001 laying down
    detailed rules for the application of Council Regulation (EC) No 2529/2001 on
    the common organisation of the market in sheepmeat and goatmeat as regards premium
    schemes and amending Regulation (EC) No 2419/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2550/2001 de la Commission du 21 décembre 2001 établissant
    les modalités d'application du règlement (CE) n° 2529/2001 du Conseil portant
    organisation commune des marchés dans le secteur des viandes ovine et caprine
    en ce qui concerne les régimes de primes et modifiant le règlement (CE) n°
    2419/2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2550/2001 der Kommission vom 21. Dezember 2001 mit
