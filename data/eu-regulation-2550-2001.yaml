    que estabelece a organização comum de mercado no sector das carnes de ovino
    e caprino no que respeita ao regime de prémios e que altera o Regulamento (CE)
    n.° 2419/2001
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2550/2001 z 21. decembra 2001, ktoré stanovuje
