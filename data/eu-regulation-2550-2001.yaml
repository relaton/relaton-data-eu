    organizácii trhu s ovčím a kozím mäsom vo vzťahu k systému prémií a ktoré
    mení a dopĺňa nariadenie (ES) č. 2419/2001
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2550/2001 z dne 21. decembra 2001 o določitvi
