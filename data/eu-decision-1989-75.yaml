title:
- language: en
  script: Latn
  content: '89/75/EEC: Commission Decision of 23 December 1988 changing the import
    arrangements established by Council Regulation (EEC) No 3420/83 and applied in
    the Federal Republic of Germany and Greece in respect of Romania regarding various
    products (only the German and Greek texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/75/CEE: Décision de la Commission du 23 décembre 1988 modifiant le
    régime d''importation prévu par le règlement (CEE) n° 3420/83 du Conseil et
    appliqué en République fédérale d''Allemagne et en Grèce à l''égard de
    la Roumanie en ce qui concerne divers produits (Les textes en langues allemande
    et grecque sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 23. Dezember 1988 zur Änderung der durch
    die Verordnung (EWG) Nr. 3420/83 des Rates festgelegten und in der Bundesrepublik
    Deutschland und der Griechischen Republik gegenüber Rumänien für einige gewerbliche
    Waren angewandten Einfuhrregelung (Nur der deutsche und der griechische Text sind
    verbindlich) (89/75/EWG) (89/75/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 23. december 1988 om ændring af den importordning,
    der er fastsat ved Rådets forordning (EØF) nr. 3420/83, og som anvendes i Forbundsrepublikken
    Tyskland og Grækenland over for Rumænien for så vidt angår forskellige varer
    (Kun den tyske og den græske udgave er autentisk) (89/75/EØF) (89/75/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/75/ΕΟΚ: Απόφαση της Επιτροπής της 23ης Δεκεμβρίου
    1988 για την τροποποίηση του καθεστώτος εισαγωγής
    που προβλέπεται από τον κανονισμό (ΕΟΚ) αριθ.
    3420/83 του Συμβουλίου και εφαρμόζεται στην Ομοσπονδιακή
    Δημοκρατία της Γερμανίας και στην Ελλάδα, έναντι
    της Ρουμανίας, όσον αφορά διάφορα προϊόντα'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 23 dicembre 1988 che modifica il regime
    d'' importazione, istituito con regolamento (CEE) n. 3420/83 del Consiglio, applicato
    nella Repubblica federale di Germania ed in Grecia nei confronti della Romania
    per quanto concerne diversi prodotti industriali (I testi nelle lingue tedesca
    e greca sono i soli facenti fede) (89/75/CEE) (89/75/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 23 december 1988 tot wijziging van de
    bij Verordening (EEG) nr. 3420/83 van de Raad vastgestelde invoerregeling welke
    in de Bondsrepubliek Duitsland en in Griekenland wordt toegepast ten opzichte
    van Roemenië met betrekking tot diverse produkten (Slechts de teksten in de Duitse
    en de Griekse taal zijn authentiek) (89/75/EEG) (89/75/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 23 de Dezembro de 1988 que altera o regime de
    importação previsto pelo Regulamento (CEE) nº 3420/83 do Conselho e aplicado
    na República Federal da Alemanha e na Grécia relativamente à Roménia, no que
    respeita a diversos produtos (Apenas fazem fé os textos nas línguas alemã e
    grega) (89/75/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 23 de diciembre de 1988 por la que se modifica
    el régimen de importación establecido por el Reglamento (CEE) no 3420/83 del
    Consejo, aplicado a la República Federal de Alemania y a Grecia respecto de Rumanía
    en relación con diversos productos (Los textos en lenguas alemana y griega son
    los únicos auténticos) (89/75/CEE) (89/75/CEE) #'
