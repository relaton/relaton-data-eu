    for lande og territorier, der deltager i eller er knyttet til Den Europæiske
    Unions stabiliserings- og associeringsproces, og om suspension af anvendelsen
    heraf for så vidt angår Bosnien-Hercegovina
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2015/2423 του Ευρωπαϊκού Κοινοβουλίου
