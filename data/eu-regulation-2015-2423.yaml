title:
- language: en
  script: Latn
  content: Regulation (EU) 2015/2423 of the European Parliament and of the Council
    of 16 December 2015 amending Council Regulation (EC) No 1215/2009 introducing
    exceptional trade measures for countries and territories participating in or linked
    to the European Union's stabilisation and association process and suspending its
    application with regard to Bosnia and Herzegovina
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2015/2423 du Parlement européen et du Conseil du 16 décembre
    2015 modifiant le règlement (CE) n° 1215/2009 du Conseil introduisant des mesures
    commerciales exceptionnelles en faveur des pays et territoires participants ou
    liés au processus de stabilisation et d'association mis en œuvre par l'Union
    européenne et suspendant l'application de celui-ci en ce qui concerne la Bosnie-Herzégovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2015/2423 des Europäischen Parlaments und des Rates vom
    16. Dezember 2015 zur Änderung der Verordnung (EG) Nr. 1215/2009 des Rates zur
    Einführung besonderer Handelsmaßnahmen für die am Stabilisierungs- und Assoziierungsprozess
    der Europäischen Union teilnehmenden oder damit verbundenen Länder und Gebiete
    und zur Aussetzung ihrer Anwendung in Bezug auf Bosnien und Herzegowina
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2015/2423 на Европейския парламент
    и на Съвета от 16 декември 2015 година за изменение
    на Регламент (ЕО) № 1215/2009 на Съвета за въвеждане
    на изключителни търговски мерки за страни
    и територии, участващи или свързани с процеса
    на стабилизиране и асоцииране, осъществяван
    от Европейския съюз, и за спиране на прилагането
    му по отношение на Босна и Херцеговина
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2015/2423 ze dne 16. prosince
    2015 o změně nařízení Rady (ES) č. 1215/2009, kterým se zavádějí mimořádná
    obchodní opatření pro země a území účastnící se procesu stabilizace
    a přidružení zavedeného Evropskou unií či s tímto procesem spjaté, a o
    pozastavení jeho použitelnosti, pokud jde o Bosnu a Hercegovinu
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2015/2423 af 16. december
