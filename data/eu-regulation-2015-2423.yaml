  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2015/2423, 16. detsember 2015,
    millega muudetakse nõukogu määrust (EÜ) nr 1215/2009, millega kehtestatakse
    erandlikud kaubandusmeetmed Euroopa Liidu stabiliseerimis- ja assotsieerimisprotsessis
    osalevate või sellega seotud maade ja territooriumide suhtes, ning peatatakse
    selle kohaldamine Bosnia ja Hertsegoviina suhtes
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2015/2423, annettu 16 päivänä
    joulukuuta 2015, poikkeuksellisten kaupan toimenpiteiden käyttöönotosta Euroopan
    unionin vakautus- ja assosiaatioprosessiin osallistuville tai siihen yhteydessä
