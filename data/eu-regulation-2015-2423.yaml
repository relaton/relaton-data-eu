  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2015/2423 Europskog parlamenta i Vijeća od 16. prosinca 2015.
    o izmjeni Uredbe Vijeća (EZ) br. 1215/2009 o uvođenju izvanrednih trgovinskih
    mjera za zemlje i područja koji sudjeluju u Procesu stabilizacije i pridruživanja
    Europske unije ili su s njim povezani i suspenziji njezine primjene u pogledu
    Bosne i Hercegovine
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2015/2423 rendelete (2015. december
    16.) az Európai Unió stabilizációs és társulási folyamatában részt vevő
    vagy ahhoz kapcsolódó országokra és területekre vonatkozóan kivételes kereskedelmi
    intézkedések bevezetéséről szóló 1215/2009/EK tanácsi rendelet módosításáról,
    valamint a rendelet alkalmazásának Bosznia-Hercegovina tekintetében történő
    felfüggesztéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2015/2423 del Parlamento europeo e del Consiglio, del
    16 dicembre 2015, che modifica il regolamento (CE) n. 1215/2009 del Consiglio
    recante misure commerciali eccezionali applicabili ai paesi e territori che partecipano
    o sono legati al processo di stabilizzazione e di associazione dell'Unione europea
    e che ne sospende l'applicazione per quanto concerne la Bosnia-Erzegovina
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2015/2423 (2015. gada 16. decembris),
    ar kuru groza Padomes Regulu (EK) Nr. 1215/2009, ar ko ievieš ārkārtas tirdzniecības
    pasākumus tām valstīm un teritorijām, kas piedalās vai ir saistītas ar Eiropas
    Savienības asociācijas un stabilizācijas procesu, un aptur tās piemērošanu
    attiecībā uz Bosniju un Hercegovinu
  type: main
- language: lt
  script: Latn
  content: 2015 m. gruodžio 16 d. Europos Parlamento ir Tarybos reglamentas (ES)
    2015/2423, kuriuo iš dalies keičiamas Tarybos reglamentas (EB) Nr. 1215/2009,
    nustatantis išskirtines prekybos priemones, skirtas Europos Sąjungos stabilizavimo
    ir asocijavimo procese dalyvaujančioms arba su juo susijusioms šalims ir teritorijoms,
    ir sustabdomas jo taikymas Bosnijai ir Hercegovinai
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2015/2423 tal-Parlament Ewropew u tal-Kunsill tas-16 ta'
    Diċembru 2015 li jemenda r-Regolament tal-Kunsill (KE) Nru 1215/2009 li jintroduċi
    ċerti miżuri kummerċjali eċċezzjonali għal pajjiżi u territorji li jipparteċipaw
    fil-proċess ta' Stabbilizzazzjoni u Assoċjazzjoni tal-Unjoni Ewropea jew li
    huma marbutin miegħu u li jissospendi l-applikazzjoni tiegħu fir-rigward tal-Bożnija-Ħerzegovina
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2015/2423 van het Europees Parlement en de Raad van 16
    december 2015 tot wijziging van Verordening (EG) nr. 1215/2009 van de Raad tot
    vaststelling van uitzonderlijke handelsmaatregelen ten behoeve van de landen en
    gebieden die deelnemen aan of verbonden zijn met het stabilisatie- en associatieproces
    van de Europese Unie en tot opschorting van de toepassing ervan wat betreft Bosnië
    en Herzegovina
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2015/2423 z dnia 16
    grudnia 2015 r. zmieniające rozporządzenie Rady (WE) nr 1215/2009 wprowadzające
    nadzwyczajne środki handlowe dla krajów i terytoriów uczestniczących lub powiązanych
    z procesem stabilizacji i stowarzyszania Unii Europejskiej oraz zawieszające
    jego stosowanie w odniesieniu do Bośni i Hercegowiny
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2015/2423 do Parlamento Europeu e do Conselho, de 16 de
    dezembro de 2015, que altera o Regulamento (CE) n.° 1215/2009 do Conselho que
    adota medidas comerciais excecionais em favor dos países e territórios que participam
    ou estão ligados ao processo de estabilização e de associação da União Europeia,
    e que suspende a sua aplicação no que respeita à Bósnia-Herzegovina
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2015/2423 al Parlamentului European și al Consiliului
    din 16 decembrie 2015 de modificare a Regulamentului (CE) nr. 1215/2009 al Consiliului
    privind introducerea unor măsuri comerciale excepționale în favoarea țărilor
    și teritoriilor participante și legate de procesul de stabilizare și de asociere
    pus în aplicare de către Uniunea Europeană și de suspendare a aplicării sale
    în ceea ce privește Bosnia și Herțegovina
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2015/2423 zo 16. decembra
    2015, ktorým sa mení nariadenie Rady (ES) č. 1215/2009, ktorým sa zavádzajú
    výnimočné obchodné opatrenia pre krajiny a územia zúčastňujúce sa na
    procese stabilizácie a pristúpenia k Európskej únii a ktorým sa pozastavuje
    jeho uplatňovanie, pokiaľ ide o Bosnu a Hercegovinu
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2015/2423 Evropskega parlamenta in Sveta z dne 16. decembra
    2015 o spremembi Uredbe Sveta (ES) št. 1215/2009 o uvedbi izjemnih trgovinskih
    ukrepov za države in ozemlja, ki sodelujejo ali so povezana s stabilizacijsko-pridružitvenim
    procesom Evropske unije, ter začasni prekinitvi njene uporabe, kar zadeva Bosno
    in Hercegovino
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2015/2423 del Parlamento Europeo y del Consejo, de 16 de
    diciembre de 2015, que modifica el Reglamento (CE) n° 1215/2009 del Consejo,
    por el que se introducen medidas comerciales excepcionales para los países y
    territorios participantes o vinculados al Proceso de estabilización y asociación
    de la Unión Europea y por el que se suspende su aplicación en Bosnia y Herzegovina
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2015/2423 av den 16 december
    2015 om ändring av rådets förordning (EG) nr 1215/2009 om införande av särskilda
    handelsåtgärder för länder och territorier som deltar i eller är knutna till
    Europeiska unionens stabiliserings- och associeringsprocess, och om tillfälligt
    upphävande av dess tillämpning med avseende på Bosnien och Hercegovina
