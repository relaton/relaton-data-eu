    ανοχής για τις ποσοτικές απώλειες που προκύπτουν
    από τη συντήρηση των σιτηρών στην παρέμβαση»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 290/78 della Commissione, del 13 febbraio 1978, che
    modifica il regolamento (CEE) n. 743/70 che fissa il limite di tolleranza per
    i cali risultanti dalla conservazione dei cereali che hanno formato oggetto d'
    intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 290/78 van de Commissie van 13 februari 1978 tot
    wijziging van Verordening (EEG) nr. 743/70 houdende vaststelling van de maximale
    tolerantie met betrekking tot het gewichtsverlies als gevolg van de bewaring van
    granen door de interventiebureaus
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 290/78 da Comissão, de 13 de Fevereiro de 1978,
