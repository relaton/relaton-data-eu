    as perdas em quantidade resultantes da conservação dos cereais de intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 290/78 de la Comisión, de 13 de febrero de 1978,
    por el que se modifica el Reglamento (CEE) n° 743/70 por el que se fija el límite
    de tolerancia para las pérdidas de cantidad resultantes de la conservación de
    los cereales de intervención
