title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 290/78 of 13 February 1978 amending Regulation
    (EEC) No 743/70 fixing the maximum tolerance for quantity losses resulting from
    the storage of cereals by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 290/78 de la Commission, du 13 février 1978, modifiant
    le règlement (CEE) n° 743/70 portant fixation de la limite de tolérance pour
    les pertes de quantité résultant de la conservation des céréales à l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 290/78 der Kommission vom 13. Februar 1978 zur Änderung
    der Verordnung (EWG) Nr. 743/70 über die Festsetzung der Toleranzgrenze für
    die Fehlmengen, die sich aufgrund der Lagerung von Getreide bei der Interventionsstelle
    ergeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 290/78 af 13. februar 1978 om ændring
    af forordning (EØF) nr. 743/70 om fastsættelse af tolerancegrænsen for de mængder,
    der kommer til at mangle som følge af oplagring af korn hos interventionsorganerne
  type: main
- language: el
  script: Grek
