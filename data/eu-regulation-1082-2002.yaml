    permanente per la rivendita sul mercato interno di riso detenuto dall'organismo
    d'intervento italiano
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1082/2002 van de Commissie van 21 juni 2002 houdende
