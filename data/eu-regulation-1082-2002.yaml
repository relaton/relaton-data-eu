    den Wiederverkauf auf dem Binnenmarkt von Reis aus Beständen der italienischen
    Interventionsstelle auf rund 40000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1082/2002 af 21. juni 2002 om ændring
