title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1990/89 of 4 July 1989 amending Council
    Regulation (EEC) No 1009/86 establishing general rules applying to production
    refunds in the cereals and rice sector following the introduction of the combined
    nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1990/89 de la Commission du 4 juillet 1989 modifiant
    le règlement (CEE) n° 1009/86 du Conseil établissant les règles générales
    applicables aux restitutions à la production dans les secteurs des céréales
    et du riz suite à l'introduction de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1990/89 DER KOMMISSION vom 4. Juli 1989 zur Änderung
    der Verordnung (EWG) Nr. 1009/86 des Rates zur Festlegung der Grundregeln für
    die Produktionserstattungen für Getreide und Reis infolge der Einführung der
    Kombinierten Nomenklatur #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1990/89 af 4. juli 1989 om ændring
    af Rådets forordning (EØF) nr. 1009/86 om almindelige regler for produktionsrestitutioner
    i korn- og rissektoren som følge af indførelsen af Den Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1990/89 της Επιτροπής
    της 4ης Ιουλίου 1989 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 1009/86 του Συμβουλίου για τον καθορισμό
    των γενικών κανόνων που εφαρμόζονται στις
    επιστροφές στην παραγωγή στους τομείς των
    σιτηρών και του ρυζιού μετά την εισαγωγή της
    συνδυασμένης ονοματολογίας
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1990/89 DELLA COMMISSIONE del 4 luglio 1989 recante
    modifica, a seguito dell'' introduzione della nomenclatura combinata, del regolamento
    (CEE) n. 1009/86 del Consiglio, che fissa le norme generali applicabili alle restituzioni
    alla produzione nel settore del cereali e del riso #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1990/89 VAN DE COMMISSIE van 4 juli 1989 houdende
    wijziging, naar aanleiding van de invoering van de gecombineerde nomenclatuur,
    van Verordening (EEG) nr. 1009/86 van de Raad tot vaststelling van de algemene
    voorschriften inzake de restituties bij de produktie in de sectoren granen en
    rijst #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 1990/89 DA COMISSÃO de 4 de Julho de 1989 que altera
    o Regulamento (CEE) nº 1009/86 do Conselho, que estabelece as regras gerais aplicáveis
    às restituições à produção no sector dos cereais e do arroz, na sequência
    da introdução da Nomenclatura Combinada #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1990/89 DE LA COMISIÓN de 4 de julio de 1989 que
    modifica el Reglamento (CEE) no 1009/86 del Consejo por el que se establecen las
    normas generales aplicables a las restituciones a la producción en el sector
    de los cereales y del arroz como consecuencia de la introducción de la nomenclatura
    combinada #'
