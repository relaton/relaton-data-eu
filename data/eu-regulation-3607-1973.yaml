  content: Regulation (EEC) No 3607/73 of the Council of 27 December 1973 on the application
    of Decision No 11/73 of the Joint Committee set up under the agreement between
    the European Economic Community and the Portuguese Republic amending Annex II
    to protocol No 3 concerning the definition of the concept of "originating products"
    and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3607/73 du Conseil, du 27 décembre 1973, concernant
    l'application de la décision n° 11/73 du Comité mixte institué par l'accord
    entre la Communauté économique européenne et la République portugaise modifiant
    l'annexe II du protocole n° 3 relatif à la définition de la notion de "produits
    originaires" et aux méthodes de coopération administrative
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 3607/73 DES RATES VOM 27. DEZEMBER 1973 UEBER DIE
    ANWENDUNG DES BESCHLUSSES NR. 11/73 DES GEMISCHTEN AUSSCHUSSES DES ABKOMMENS ZWISCHEN
    DER EUROPAEISCHEN WIRTSCHAFTSGEMEINSCHAFT UND DER PORTUGIESISCHEN REPUBLIK ZUR
    AENDERUNG DES ANHANGS II DES PROTOKOLLS NR. 3 UEBER DIE BESTIMMUNG DES BEGRIFFS
    " ERZEUGNISSE MIT URSPRUNG IN " ODER " URSPRUNGSERZEUGNISSE " UND UEBER DIE METHODEN
    DER ZUSAMMENARBEIT DER VERWALTUNGEN
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3607/73 af 27. december 1973 om anvendelsen
