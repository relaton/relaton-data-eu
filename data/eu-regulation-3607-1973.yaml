    mellem Det europæiske økonomiske Fællesskab og republikken Portugal, om ændring
    af bilag II til protokol nr. 3 angående definitionen af begrebet »varer med
    oprindelsesstatus« og angående metoderne for administrativt samarbejde
  type: main
- language: el
