    die nicht zum Anpflanzen bestimmt sind, Ausnahmen von einigen Vorschriften der
    Richtlinie 77/93/EWG des Rates zuzulassen (Bekanntgegeben unter Aktenzeichen K(1999)
    558)'
  type: main
- language: da
  script: Latn
