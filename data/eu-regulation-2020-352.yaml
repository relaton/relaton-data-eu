title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/352 of 3 March 2020 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for Ukraine in the
    list of third countries, territories, zones or compartments from which certain
    poultry commodities may be imported into and transit through the Union in relation
    to highly pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/352 de la commission du 3 mars 2020
    modifiant l’annexe I du règlement (CE) no 798/2008 en ce qui concerne la mention
    relative à l’Ukraine dans la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l’Union et transiter par celle-ci, pour ce qui est de l’influenza aviaire
    hautement pathogène
  type: main
- language: de
  script: Latn
