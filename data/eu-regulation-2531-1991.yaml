title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2531/91 of 23 August 1991 re-establishing
    the levying of customs duties applicable to the products falling within CN code
    2850 00 70, originating in Argentina, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2531/91 DE LA COMMISSION du 23 août 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2850 00 70 originaires de l'' Argentine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2531/91 DER KOMMISSION vom 23. August 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 2850 00 70 mit Ursprung in
    Argentinien, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2531/91 af 23. august 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2850 00 70 og med oprindelse
    i Argentina, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2531/91 της Επιτροπής
    της 23ης Αυγούστου 1991 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα προϊόντα του
    κωδικού ΣΟ 2850 00 70, καταγωγής Αργεντινής, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2531/91 DELLA COMMISSIONE del 23 agosto 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 2850 00 70, originari dell'' Argentina, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2531/91 VAN DE COMMISSIE van 23 augustus 1991 houdende
