id: EURegulation28891974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2889/74 of the Commission of 19 November 1974 re-establishing
    the levying of customs duties on illuminating glassware, signalling glassware
    and optical elements of glass, not optically worked of optical glass, falling
    within subheading 70.14 B, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2889/74 de la Commission, du 19 novembre 1974, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d'éclairage, de signalisation et d'optique commune, de la sous-position tarifaire
    70.14 B, originaire des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2889/74 der Kommission vom 19. November 1974 zur Wiedereinführung
    des Zollsatzes für Glaswaren für Beleuchtung, für Signaleinrichtungen oder
    zu optischen Zwecken, nicht aus optischem Glas, nicht optisch bearbeitet, der
    Tarifstelle 70.14 B, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2889/74 af 19. november 1974 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas; refleksglas, optiske
    artikler af glas, hverken optisk bearbejdet eller af optisk glas, under underposition
    70.14 B, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2889/74 della Commissione, del 19 novembre 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune della sottovoce doganale n. 70.14 B, originarie
    dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2889/74 van de Commissie van 19 november 1974 houdende
    wederinstelling van de heffing van de douanerechten voor verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas; optische elementen van gewoon glas,
    niet optisch bewerkt van onderverdeling 70.14 B, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december
    1973 tariefpreferenties werden geopend
  type: main
