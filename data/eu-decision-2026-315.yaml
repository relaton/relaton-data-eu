type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/315 of 11 February 2026 revoking
    the authorisation for the placing on the market of food and feed products produced
    from, products consisting of or containing genetically modified oilseed rapes
    Ms8 × Rf3 × GT73, Ms8 × GT73 and Rf3 × GT73 and repealing Implementing Decision
    (EU) 2021/1391 (notified under document C(2026) 739)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/315 de la Commission du 11 février
    2026 révoquant l’autorisation de mise sur le marché des produits contenant
    les colzas génétiquement modifiés Ms8 × Rf3 × GT73, Ms8 × GT73 et Rf3 ×
    GT73 ou consistant en ces colzas et des produits destinés à l’alimentation
    humaine et animale produits à partir de ces colzas, et abrogeant la décision
    d’exécution (UE) 2021/1391 [notifiée sous le numéro C(2026) 739]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/315 der Kommission vom 11. Februar 2026
    zum Widerruf der Zulassung für das Inverkehrbringen von Lebens- und Futtermitteln,
    die aus den genetisch veränderten Rapssorten Ms8 × Rf3 × GT73, Ms8 × GT73
    und Rf3 × GT73 gewonnen werden, sowie von Erzeugnissen, die aus diesen Rapssorten
    bestehen oder diese enthalten, und zur Aufhebung des Durchführungsbeschlusses
    (EU) 2021/1391 (Bekannt gegeben unter Aktenzeichen C(2026) 739)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/315 на Комисията
    от 11 февруари 2026 година за отмяна на разрешението
    за пускане на пазара на храни и фуражи, произведени
    от генетично модифицирана маслодайна рапица
    Ms8 × Rf3 × GT73, Ms8 × GT73 и Rf3 × GT73, и продукти, съдържащи
    или състоящи се от нея, и за отмяна на Решение
    за изпълнение (ЕС) 2021/1391 (нотифицирано под номер
    С(2026) 739)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/315 ze dne 11. února 2026 o
    zrušení povolení pro uvedení potravin a krmiv, které jsou vyrobeny z geneticky
    modifikované řepky olejné Ms8 × Rf3 × GT73, Ms8 × GT73 a Rf3 × GT73, produktů,
    které z ní sestávají nebo ji obsahují, na trh a o zrušení prováděcího
    rozhodnutí (EU) 2021/1391 (oznámeno pod číslem C(2026) 739)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/315 af 11. februar 2026
    om tilbagekaldelse af tilladelsen til markedsføring af fødevarer og foder, der
    er fremstillet af produkter, der består af eller indeholder genetisk modificeret
    Ms8 × Rf3 × GT73-raps, Ms8 × GT73-raps og Rf3 × GT73-raps, og om ophævelse
    af gennemførelsesafgørelse (EU) 2021/1391 (meddelt under nummer C(2026) 739)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2026/315 της Επιτροπής,
    της 11ης Φεβρουαρίου 2026, για την ανάκληση της
    έγκρισης της διάθεσης στην αγορά τροφίμων
    και ζωοτροφών που παράγονται, αποτελούνται
    από ή περιέχουν γενετικώς τροποποιημένη ελαιοκράμβη
    Ms8 × Rf3 × GT73, Ms8 × GT73 και Rf3 × GT73, και για την κατάργηση
    της εκτελεστικής απόφασης (ΕΕ) 2021/1391 [κοινοποιηθείσα
    υπό τον αριθμό C(2026) 739]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2026/315, 11. veebruar 2026, millega tühistatakse
    luba lasta turule geneetiliselt muundatud rapsist Ms8 × Rf3 × GT73, Ms8 × GT73
    ja Rf3 × GT73 toodetud, neid sisaldavat või neist koosnevat toitu ja sööta
    ning tunnistatakse kehtetuks rakendusotsus (EL) 2021/1391 (teatavaks tehtud numbri
    C(2026) 739 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2026/315, annettu 11 päivänä
    helmikuuta 2026, muuntogeenisistä rapseista Ms8 × Rf3 × GT73, Ms8 × GT73 ja/tai
    Rf3 × GT73 valmistettujen elintarvikkeiden ja rehujen ja kyseisiä muuntogeenisiä
    rapseja sisältävien tai niistä koostuvien tuotteiden markkinoille saattamista
    koskevan luvan peruuttamisesta sekä täytäntöönpanopäätöksen (EU) 2021/1391
    kumoamisesta (tiedoksiannettu numerolla C(2026) 739)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2026/315 ón gCoimisiún an 11 Feabhra 2026
    lena gcúlghairtear an t-údarú chun táirgí bia agus beatha a tháirgtear as
    táirgí ina bhfuil ráibeanna olashíl géinmhodhnaithe Ms8 × Rf3 × GT73, Ms8
    × GT73 agus Rf3 × GT73 nó atá comhdhéanta díobh, a chur ar an margadh agus
    lena n-aisghairtear Cinneadh Cur Chun Feidhme (AE) 2021/1391 (tugadh fógra faoi
    leis an doiciméad C(2026) 739)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2026/315 оd 11. veljače 2026. o opozivu
    odobrenja za stavljanje na tržište hrane i hrane za životinje proizvedene od
    genetski modificiranih uljanih repica Ms8 × Rf3 × GT73, Ms8 × GT73 i Rf3 ×
    GT73 i proizvoda koji se sastoje od tih uljanih repica ili ih sadržavaju i o
    stavljanju izvan snage Provedbene odluke (EU) 2021/1391 (priopćeno pod brojem
    dokumenta C(2026) 739)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/315 végrehajtási határozata (2026. február 11.)
    a géntechnológiával módosított Ms8 × Rf3 × GT73, Ms8 × GT73 és Rf3 ×
    GT73 olajrepcéből előállított élelmiszer- és takarmánytermékek, illetve
    az abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély visszavonásáról és az (EU) 2021/1391 végrehajtási határozat hatályon
    kívül helyezéséről (az értesítés a C(2026) 739. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/315 della Commissione, dell’11 febbraio
    2026, che revoca l’autorizzazione all’immissione in commercio di alimenti
    e mangimi derivati da colza geneticamente modificata Ms8 × Rf3 × GT73, Ms8 ×
    GT73 e Rf3 × GT73 o di prodotti che ne sono costituiti o che la contengono e
    che abroga la decisione di esecuzione (UE) 2021/1391 [notificata con il numero
    C(2026) 739]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/315 (2026. gada 11. februāris),
    ar kuru atsauc atļauju laist tirgū pārtikas un barības produktus, kas ražoti
    no ģenētiski modificētā eļļas rapša Ms8 × Rf3 × GT73, Ms8 × GT73 un
    Rf3 × GT73, produktus, kas no tā sastāv vai to satur, un atceļ Īstenošanas
    lēmumu (ES) 2021/1391 (izziņots ar dokumenta numuru C(2026) 739)
  type: main
- language: lt
  script: Latn
