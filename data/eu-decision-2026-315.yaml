    kuriuo atšaukiamas leidimas pateikti rinkai maisto ir pašarų produktus, kurių
    sudėtyje yra genetiškai modifikuotų rapsų Ms8 × Rf3 × GT73, Ms8 × GT73
    ir Rf3 × Gt73 arba kurie iš jų sudaryti ar pagaminti, ir panaikinamas Įgyvendinimo
    sprendimas (ES) 2021/1391 (pranešta dokumentu Nr. C(2026) 739)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/315 tal-11
    ta’ Frar 2026 li tirrevoka l-awtorizzazzjoni għall-introduzzjoni fis-suq ta’
    prodotti tal-ikel u tal-għalf prodotti minn, li jikkonsistu minn jew li fihom
    il-lift ġenetikament modifikat Ms8 × Rf3 × GT73, Ms8 × GT73 u Rf3 × GT73
    u li tħassar id-Deċiżjoni ta’ Implimentazzjoni (UE) 2021/1391 (notifikata
    bid-dokument C(2026) 739)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2026/315 van de Commissie van 11 februari 2026
    tot intrekking van de vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of geproduceerd zijn met het genetisch gemodificeerde
    koolzaad Ms8 × Rf3 × GT73, Ms8 × GT73 en Rf3 × GT73 en van levensmiddelen
    en diervoeders die met dit koolzaad geproduceerd zijn, en tot intrekking van Uitvoeringsbesluit
    (EU) 2021/1391 (Kennisgeving geschied onder nummer C(2026) 739)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2026/315 z dnia 11 lutego 2026 r. w sprawie
    cofnięcia zezwolenia na wprowadzenie do obrotu żywności i produktów paszowych
    wyprodukowanych z genetycznie zmodyfikowanego rzepaku Ms8 × Rf3 × GT73, Ms8
    × GT73 i Rf3 × GT73, składających się z niego lub go zawierających oraz
    uchylająca decyzję wykonawczą (UE) 2021/1391 (notyfikowana jako dokument nr
    C(2026) 739)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2026/315 da Comissão, de 11 de fevereiro de
    2026, que revoga a autorização de colocação no mercado de produtos que sejam
    constituídos por ou que contenham colzas geneticamente modificadas Ms8 × Rf3
    × GT73, Ms8 × GT73 e Rf3 × GT73 e de produtos destinados à alimentação humana
    e animal produzidos a partir dessas colzas, e que revoga a Decisão de Execução
    (UE) 2021/1391 [notificada com o número C(2026) 739]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2026/315 a Comisiei din 11 februarie
    2026 de revocare a autorizației de introducere pe piață a produselor alimentare
    și furajere fabricate din, produse care constau în sau care conțin rapiță
    modificată genetic Ms8 × Rf3 × GT73, Ms8 × GT73 și Rf3 × GT73 și de abrogare
    a Deciziei de punere în aplicare (UE) 2021/1391 [notificată cu numărul C(2026)
    739]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2026/315 z 11. februára 2026, ktorým
    sa zrušuje povolenie umiestňovať na trh potraviny a krmivá vyrobené z geneticky
    modifikovanej repky olejky Ms8 × Rf3 × GT73, Ms8 × GT73 a Rf3 × GT73, sú
    z nej zložené alebo ju obsahujú, a ktorým sa zrušuje vykonávacie rozhodnutie
    (EÚ) 2021/1391 [oznámené pod číslom C(2026) 739]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2026/315 z dne 11. februarja 2026 o preklicu
    odobritve za dajanje na trg živil in krme ter proizvodov, ki vsebujejo gensko
    spremenjeno oljno ogrščico Ms8 × Rf3 × GT73, Ms8 × GT73 in Rf3 × Gt73 ali
    so iz nje sestavljeni, in o razveljavitvi Izvedbenega sklepa (EU) 2021/1391 (notificirano
    pod dokumentarno številko C(2026) 739)
  type: main
- language: es
