    a výsledků stanovených v příloze I nařízení Evropského parlamentu a Rady
    (EU) 2021/2115, kterým se stanoví pravidla podpory pro strategické plány,
    jež mají být vypracovány členskými státy v rámci společné zemědělské
    politiky (strategické plány SZP) a financovány Evropským zemědělským záručním
    fondem (EZZF) a Evropským zemědělským fondem pro rozvoj venkova (EZFRV), a
