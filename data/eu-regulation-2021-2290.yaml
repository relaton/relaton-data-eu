    Parlaments und des Rates mit Vorschriften für die Unterstützung der von den
    Mitgliedstaaten im Rahmen der Gemeinsamen Agrarpolitik zu erstellenden und durch
    den Europäischen Garantiefonds für die Landwirtschaft (EGFL) und den Europäischen
    Landwirtschaftsfonds für die Entwicklung des ländlichen Raums (ELER) zu finanzierenden
    Strategiepläne (GAP-Strategiepläne) und zur Aufhebung der Verordnung (EU) Nr.
    1305/2013 sowie der Verordnung (EU) Nr. 1307/2013
