title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/2290 of 21 December 2021 laying
    down rules on the methods for the calculation of the common output and result
    indicators set out in Annex I to Regulation (EU) 2021/2115 of the European Parliament
    and of the Council establishing rules on support for strategic plans to be drawn
    up by Member States under the common agricultural policy (CAP Strategic Plans)
    and financed by the European Agricultural Guarantee Fund (EAGF) and by the European
    Agricultural Fund for Rural Development (EAFRD) and repealing Regulations (EU)
    No 1305/2013 and (EU) No 1307/2013
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/2290 de la Commission du 21 décembre
    2021 établissant des règles relatives aux méthodes de calcul des indicateurs
    communs de réalisation et de résultat définis à l’annexe I du règlement
    (UE) 2021/2115 du Parlement européen et du Conseil établissant des règles régissant
    l’aide aux plans stratégiques devant être établis par les États membres
    dans le cadre de la politique agricole commune (plans stratégiques relevant de
    la PAC) et financés par le Fonds européen agricole de garantie (FEAGA) et par
    le Fonds européen agricole pour le développement rural (Feader), et abrogeant
    les règlements (UE) no 1305/2013 et (UE) no 1307/2013
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/2290 der Kommission vom 21. Dezember
