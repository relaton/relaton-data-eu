id: EURegulation14121978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1412/78 of 23 June 1978 re-establishing
    the levying of customs duties on woven fabrics of sheep's or lambs' wool or of
    fine animal hair, falling within heading No 53.11, originating in South Korea
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1412/78 de la Commission, du 23 juin 1978, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    laine ou de poils fins, de la position tarifaire 53.11, originaires de la Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1412/78 der Kommission vom 23. Juni 1978 über die
    Wiedereinführung des Zollsatzes für Gewebe aus Wolle oder feinen Tierhaaren
    der Tarifnummer 53.11, mit Ursprung in Südkorea, dem die in der Verordnung (EWG)
    Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1412/78 af 23. juni 1978 om genindførelse
    af opkrævning af toldafgifter for vævet stof af uld eller fine dyrehår under
    position 53.11, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1412/78 della Commissione, del 23 giugno 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di lana o di
    peli fini della voce doganale 53.11 originari della Corea del Sud beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1412/78 van de Commissie van 23 juni 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op weefsels
    van wol of van fijn haar, van post 53.11, van oorsprong uit Zuid-Korea, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2706/77
    van de Raad
  type: main
