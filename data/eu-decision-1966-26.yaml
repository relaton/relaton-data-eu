    ou congelés
  type: main
- language: de
  script: Latn
  content: '66/26/EWG: Entscheidung der Kommission vom 14. Dezember 1965 zur Erhöhung
    des der Bundesrepublik Deutschland gewährten Zollkontingents für Kabeljau, Seelachs,
    Schellfisch, Rotbarsch und schwarzen Heilbutt, frisch, gekühlt oder gefroren'
  type: main
- language: it
  script: Latn
  content: '66/26/CEE: Decisione della Commissione, del 14 dicembre 1965, che aumenta
    il volume del contingente tariffario concesso alla Repubblica federale di Germania
    per i merluzzi, i naselli, i sebasti e gli ippoglossi neri, freschi, refrigerati
    o congelati'
  type: main
- language: nl
  script: Latn
  content: '66/26/EEG: Beschikking van de Commissie van 14 december 1965, houdende
    vergroting van het aan de Bondsrepubliek Duitsland toegekende tariefcontingent
    voor kabeljauw, koolvis (zwarte pollak), schelvis, roodbaars en zwarte heilbot,
    vers, gekoeld of bevroren'
