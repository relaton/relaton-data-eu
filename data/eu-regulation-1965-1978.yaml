title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1965/78 of 11 August 1978 re-establishing
    the levying of customs duties on image projectors, etc., falling within heading
    No 90.09 and originating in developing countries and territories to which the
    preferential tariff arrangements set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1965/78 de la Commission, du 11 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de projection fixé, etc., de la position tarifaire 90.09, originaires des pays
    en voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1965/78 der Kommission vom 11. August 1978 zur Wiedereinführung
    des Zollsatzes für Stehbildwerfer der Tarifnummer 90.09 mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1965/78 af 11. august 1978 om genindførelse
    af opkrævning af toldafgifter for lysbilledapparater, etc. under position 90.09,
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1965/78 della Commissione, dell'11 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi da proiezione
    fissa, ecc., della voce 90.09 della tariffa doganale comune originari dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1965/78 van de Commissie van 11 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten voor projectietoestellen voor
    niet-bewegende beelden, van post 90.09, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad tariefpreferenties
    werden geopend
  type: main
