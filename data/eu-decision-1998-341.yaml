    1997/98 tietyistä Kreikan nomoksista peräisin olevan puuvillan, josta ei ole
    poistettu siemeniä, tukihakemusten ja valvontaanasettamishakemusten osalta (Ainoastaan
    kreikankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '98/341/CE: Decisione della Commissione del 13 maggio 1998 recante deroga,
