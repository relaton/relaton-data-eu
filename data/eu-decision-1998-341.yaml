title:
- language: en
  script: Latn
  content: '98/341/EC: Commission Decision of 13 May 1998 derogating, for the 1997/98
    marketing year, from certain provisions of Commission Regulation (EEC) No 1201/89
    as regards aid applications and applications for supervised storage of unginned
    cotton originating in certain Greek prefectures (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '98/341/CE: Décision de la Commission du 13 mai 1998 dérogeant, pour
    la campagne 1997/1998, à certaines dispositions du règlement (CEE) nº 1201/89
    de la Commission en ce qui concerne les demandes d''aide et les demandes de mise
    sous contrôle du coton non égrené provenant de certains nomos de la Grèce
    (Le texte en langue grecque est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '98/341/EG: Entscheidung der Kommission vom 13. Mai 1998 zur Abweichung
    im Wirtschaftsjahr 1997/98 von mehreren Bestimmungen der Verordnung (EWG) Nr.
    1201/89 hinsichtlich der Beantragung der Beihilfe und Unterkontrollstellung für
    die aus mehreren Nomi in Griechenland stammende nicht entkörnte Baumwolle (Nur
    der griechische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '98/341/EF: Kommissionens beslutning af 13. maj 1998 om undtagelse for
    produktionsåret 1997/98 fra visse bestemmelser i Kommissionens forordning (EØF)
    nr. 1201/89 for så vidt angår støtteansøgninger og anmodninger om undergivelse
    under kontrol af ikke-egreneret bomuld fra visse nomi i Grækenland (Kun den græske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '98/341/ΕΚ: Απόφαση της Επιτροπής της 13ης Μαΐου
    1998 δυνάμει της οποίας επιτρέπεται παρέκκλιση,
    για την περίοδο 1997/98, από ορισμένες διατάξεις
    του κανονισμού (ΕΟΚ) αριθ. 1201/89, όσον αφορά τις
    αιτήσεις για χορήγηση ενίσχυσης και τις αιτήσεις
    για θέση υπό έλεγχο του μη εκκοκκισμένου βάμβακα
    ο οποίος προέρχεται από ορισμένους ελληνικούς
    νομούς (Το κείμενο στην ελληνική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '98/341/EY: Komission päätös, tehty 13 päivänä toukokuuta 1998, komission
