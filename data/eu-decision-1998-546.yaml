title:
- language: en
  script: Latn
  content: '98/546/EC: Commission Decision of 22 July 1998 amending Commission Decision
    98/371/EC concerning the animal health conditions and veterinary certification
    for imports of fresh meat from certain European countries to take into account
    some aspects in relation to Croatia and the Czech Republic (notified under document
    number C(1998) 2186)'
  type: main
- language: fr
  script: Latn
  content: '98/546/CE: Décision de la Commission du 22 juillet 1998 modifiant la
    décision 98/371/CE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l''importation de viandes fraîches en provenance de
    certains pays européens afin de tenir compte de certains aspects concernant la
    Croatie et la République tchèque [notifiée sous le numéro C(1998) 2186]'
  type: main
- language: de
  script: Latn
  content: '98/546/EG: Entscheidung der Kommission vom 22. Juli 1998 zur Änderung
