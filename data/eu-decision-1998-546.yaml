    für die Einfuhr von frischem Fleisch aus bestimmten europäischen Ländern unter
    Berücksichtigung bestimmter Aspekte in bezug auf Kroatien und die Tschechische
    Republik (Bekanntgegeben unter Aktenzeichen K(1998) 2186)'
  type: main
- language: da
  script: Latn
  content: '98/546/EF: Kommissionens beslutning af 22. juli 1998 om ændring af Kommissionens
