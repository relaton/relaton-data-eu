    με τους υγειονομικούς όρους και την κτηνιατρική
    πιστοποίηση για τις εισαγωγές νωπού κρέατος
    από ορισμένες ευρωπαϊκές χώρες ώστε να ληφθούν
    υπόψη ορισμένα θέματα που αφορούν την Κροατία
