  script: Latn
  content: Council Decision (EU) 2018/1582 of 15 October 2018 on the position to be
    taken on behalf of the Union within the Joint Committee established by the Framework
    Agreement on Comprehensive Partnership and Cooperation between the European Union
    and its Member States, of the one part, and the Socialist Republic of Viet Nam,
    of the other part, as regards the adoption of the rules of procedure of the Joint
    Committee, and the establishent of subcommittees and specialised working groups
    and the adoption of their terms of reference
  type: main
- language: fr
  script: Latn
