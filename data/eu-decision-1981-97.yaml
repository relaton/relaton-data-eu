  script: Latn
  content: '81/97/EEC: Commission Decision of 3 February 1981 authorizing Ireland
    not to apply Community treatment to women''s, girls''and infants''woven bathrobes,
    dressing gowns, bed jackets and similar indoor wear and outer garments originating
    in Hong Kong (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/97/CEE: Décision de la Commission, du 3 février 1981, autorisant
    l''Irlande à exclure du traitement communautaire les peignoirs, robes de chambre,
    liseuses et vêtements d''intérieur analogues et autres vêtements de dessus,
    tissés, originaires de Hong-kong (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
