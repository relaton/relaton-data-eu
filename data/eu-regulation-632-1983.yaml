title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 632/83 of 16 March 1983 amending for the
    12th time Regulation (EEC) No 2730/81 establishing a list of agencies in non-member
    importing countries entitled to issue invitations to tender in the milk and milk
    products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 632/83 de la Commission du 16 mars 1983 modifiant
    pour la douzième fois le règlement (CEE) n 2730/81 établissant la liste des
    organismes dans les pays tiers importateurs d'où peuvent émaner des adjudications
    dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 632/83 der Kommission vom 16. März 1983 zur zwölften
