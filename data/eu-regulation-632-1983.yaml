  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 632/83 van de Commissie van 16 maart 1983 houdende
    twaalfde wijziging van Verordening (EEG) nr. 2730/81 tot vaststelling van een
    lijst van instellingen in invoerende derde landen die inschrijvingen in de sector
    melk en zuivelprodukten mogen houden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) NR 632/83 z dnia 16 marca 1983 r. zmieniające
    po raz dwunasty rozporządzenie (EWG) nr 2730/81 ustalające wykaz agencji w państwach
    trzecich przywozu uprawnionych do ogłaszania przetargów w sektorze mleka i przetworów
    mlecznych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 632/83 da Comissão, de 16 de Março de 1983, que
    altera pela décima segunda vez o Regulamento (CEE) nº 2730/81 que estabelece
    a lista dos organismos nos países terceiros importadores que podem proceder a
    concursos no sector do leite e dos produtos lácteos
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 632/83 zo 16. marca 1983,ktorým sa po dvanásty
    krát mení a dopĺňa nariadenie (EHS) č. 2730/81 stanovujúce zoznam agentúr
    v nečlenských dovážajúcich krajinách, ktoré sú oprávnené vyhlasovať
    výberové konania v sektore mlieka a mliečnych výrobkov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 632/83 z dne 16. marca 1983 o dvanajsti spremembi
