---
id: EUDecision1978401
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 April 1978 authorizing the French Republic not
    to apply Community treatment to parkas, anoraks, windcheaters, and the like, woven,
    of wool, of cotton or of man-made textile fibres, falling within heading No ex
    61.01 or subheading ex 61.02 B of the Common Customs Tariff, originating in South
    Korea and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/401/CEE: Décision de la Commission, du 12 avril 1978, autorisant la
    République française à exclure du traitement communautaire les parkas, anoraks,
    blousons et similaires tissés, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, de la position Ex 61.01 et de la sous-position Ex 61.02 B du
    Tarif douanier commun, originaires de la Corée du Sud et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. April 1978, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Parkas, Anoraks, Windjacken und dergleichen aus
    Geweben, aus Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen
    der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 12. april 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage parkaer, anorakker, vindjakker
    og lignende af uld, bomuld eller korte kemofibre, som henhører under pos. ex
    61.01 og ex 61.02 B i den fælles toldtarif, har oprindelse i Sydkorea og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 aprile 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario giacche e giacconi a vento,
    giubbotti e simili tessuti, di lana, di cotone o di fibre tessili sintetiche o
    artificiali, della voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale
    comune, originari della Corea del Sud e messi in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 april 1978 waarbij de Franse Republiek
    wordt gemachtigd parka's, anorakken, windjakken en dergelijke, geweven, van wol,
    van katoen of van synthetische of kunstmatige textielvezels, van de posten ex
    61.01 en ex 61.02 B van het gemeenschappelijk douanetarief, van oorsprong uit
    Zuid-Korea en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
