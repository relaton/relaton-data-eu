title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2154/77 of 27 September 1977 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of a Member State fishing in Faroese waters and to
    vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2154/77 du Conseil, du 27 septembre 1977, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables,
    d'une part, aux navires battant pavillon d'un État membre exerçant une activité
    de pêche dans les eaux feringiennes et, d'autre part, aux navires immatriculés
    dans les îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2154/77 des Rates vom 27. September 1977 zur Festlegung
    von Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    gegenüber Schiffen, welche die Flagge eines Mitgliedstaats führen und in den
    färingischen Meeresgewässern eine Fischereitätigkeit ausüben, sowie gegenüber
    auf den Färöern registrierten Schiffen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2154/77 af 27. september 1977 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der fører en medlemsstats flag, og som
    driver fiskeri i de færøske farvande, samt på fartøjer, der er registreret
    på Færøerne
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2154/77 del Consiglio, del 27 settembre 1977, che
    fissa alcune misure interinali di conservazione e di gestione delle risorse della
    pesca applicabili, da una parte, alle navi che battono bandiera di uno Stato membro
    e che esercitano un'attività di pesca nelle acque delle Isole Faerøer e, dall'altra,
    alle navi immatricolate nelle Isole Faerøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2154/77 van de Raad van 27 september 1977 tot vaststelling
    van bepaalde overgangsmaatregelen voor instandhouding en beheer van de visbestanden,
    die van toepassing zijn enerzijds op vaartuigen die de vlag van een Lid-Staat
    voeren en in de wateren van de Faeröer visserijactiviteiten uitoefenen en anderzijds
    op vaartuigen die in de Faeröer zijn geregistreerd
  type: main
