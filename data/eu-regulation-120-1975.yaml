title:
- language: en
  script: Latn
  content: Regulation (EEC) No 120/75 of the Commission of 17 January 1975 making
    special provision to cover the transition from the 1974/75 to the 1975/76 milk
    year as regards the levying of accession compensatory amounts on butter in trade
    with the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 120/75 de la Commission, du 17 janvier 1975, relatif
    à une modalité particulière de perception des montants compensatoires "adhésion"
    pour le beurre dans les échanges avec le Royaume-Uni lors du passage de la campagne
    laitière 1974/1975 à la campagne laitière 1975/1976
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 120/75 der Kommission vom 17. Januar 1975 über eine
    Sondervorschrift für die Erhebung der Beitrittsausgleichsbeträge für Butter
    im Warenverkehr mit dem Vereinigten Königreich beim Übergang vom Milchwirtschaftsjahr
    1974/1975 zum Milchwirtschaftsjahr 1975/1976
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 120/75 af 17. januar 1975 om en særlig
    ordning for opkrævning af tiltrædelsesudligningsbeløb for smør i samhandel
    med Det forenede Kongerige fra overgangen af mejeriåret 1974/1975 til mejeriåret
    1975/1976
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 120/75 della Commissione, del 17 gennaio 1975, recante
    una modalità particolare di riscossione degli importi compensativi adesione per
    il burro negli scambi con il Regno Unito al momento del passaggio dalla campagna
    lattiera 1974/1975 alla campagna lattiera 1975/1976
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 120/75 van de Commissie van 17 januari 1975 met betrekking
