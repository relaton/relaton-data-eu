title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 9 novembre 1970, autorisant la République
    fédérale d'Allemagne, la République française et la République italienne
    à appliquer des mesures de protection concernant les échanges intracommunautaires
    de vin provenant de Grèce
  type: main
- language: de
  script: Latn
  content: '70/521/EWG: Entscheidung der Kommission vom 9. November 1970, mit der
    die Bundesrepublik Deutschland, die Französische und die Italienische Republik
    ermächtigt werden, Schutzmaßnahmen zugunsten des innergemeinschaftlichen Handels
    mit Weinen griechischer Herkunft zu treffen'
  type: main
- language: it
  script: Latn
  content: '70/521/CEE: Decisione della Commissione, del 9 novembre 1970, che autorizza
    la Repubblica federale di Germania, la Repubblica francese e la Repubblica italiana
    ad applicare delle misure di protezione negli scambi intracomunitari di vini provenienti
    dalla Grecia'
  type: main
- language: nl
  script: Latn
  content: '70/521/EEG: Beschikking van de Commissie van 9 november 1970 tot machtiging
    van de Duitse Bondsrepubliek, de Franse Republiek en de Italiaanse Republiek om
    beschermende maatregelen te treffen bij het intracommunautaire handelsverkeer
    van wijn uit Griekenland'
  type: main
