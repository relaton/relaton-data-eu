title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 novembre 1971, portant octroi du concours
    du FSE au bénéfice de la République italienne pour des dépenses relatives
    à des opérations de rééducation professionnelle effectuées par le "Ministero
    del lavoro e della previdenza sociale" et plusieurs organismes italiens
  type: main
- language: de
  script: Latn
  content: '72/50/EWG: Entscheidung der Kommission vom 22. November 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Republik
    Italien zu Aufwendungen für vom "Ministero del Lavoro e della Previdenza sociale"
    und mehreren italienischen Körperschaften durchgeführten Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '72/50/CEE: Decisione della Commissione, del 22 novembre 1971, che concede
    un contributo del FSE alla Repubblica italiana per spese concernenti operazioni
    di riqualificazione effettuate dal ministero del lavoro e della previdenza sociale
    e da vari enti italiani'
  type: main
- language: nl
  script: Latn
  content: '72/50/EEG: Beschikking van de Commissie van 22 november 1971 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Italiaanse
    Republiek voor door het "Ministerio del Lavoro e della Previdenza Sociale" en
    diverse Italiaanse lichamen gemaakte herscholingskosten'
  type: main
