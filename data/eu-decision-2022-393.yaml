    à adopter, au nom de l’Union européenne, lors de la 65e session de la Commission
    des stupéfiants en ce qui concerne l’ajout de trois substances à la liste
    de substances du tableau I de la convention des Nations unies contre le trafic
    illicite de stupéfiants et de substances psychotropes
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/393 des Rates vom 3. März 2022 über den im Namen
