title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/393 of 3 March 2022 on the position to be taken,
    on behalf of the European Union, in the 65th session of the Commission on Narcotic
    Drugs as regards the addition of three substances to the list of substances in
    Table I of the United Nations Convention against Illicit Traffic in Narcotic Drugs
    and Psychotropic Substances
  type: main
- language: fr
  script: Latn
