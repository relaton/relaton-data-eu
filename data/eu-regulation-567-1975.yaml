title:
- language: en
  script: Latn
  content: Regulation (EEC) No 567/75 of the Commission of 5 March 1975 amending Regulation
    (EEC) No 2163/74 as regards the date by which animals eligible for the premium
    for the orderly marketing of certain adult bovine animals for slaughter must be
    slaughtered
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 567/75 de la Commission, du 5 mars 1975, modifiant
    le règlement (CEE) n° 2163/74 de la Commission en ce qui concerne la date limite
    pour l' abattage des animaux pouvant faire l' objet de la prime pour une mise
    sur le marché ordonnée de certains gros bovins de boucherie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 567/75 der Kommission vom 5. März 1975 zur Änderung
    der Verordnung (EWG) Nr. 2163/75 der Kommission bezüglich des Endtermins für
    die Schlachtung von Rindern, für die die Prämie für eine geregelte Vermarktung
    bestimmter ausgewachsener Schlachtrinder in Anspruch genommen werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 567/75 af 5. marts 1975 om ændring
    af Kommissionens forordning (EØF) nr. 2163/74 for så vidt angår fristen for
    slagtning af dyr, der kan modtage præmien for reguleret markedsføring af visse
    former for voksent slagtekvæg
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 567/75 della Commissione, del 5 marzo 1975, che modifica
    il regolamento (CEE) n. 2163/74 della Commissione per quanto riguarda la data
    limite di macellazione degli animali che possono formare oggetto del premio per
    un' ordinata immissione in commercio di taluni bovini adulti destinati alla macellazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 567/75 van de Commissie van 5 maart 1975 tot wijziging
    van Verordening (EEG) nr. 2163/74 van de Commissie met betrekking tot de uiterste
    termijn voor het slachten van dieren die in aanmerking komen voor de premie voor
    het geordend op de markt brengen van bepaalde volwassen slachtrunderen
  type: main
