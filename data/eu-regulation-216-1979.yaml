title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 216/79 of 5 February 1979 regarding the application
    of Decision No 5/78 of the ACP-EEC Council of Ministers derogating from the definition
    of the concept of 'originating products' to take into account the special situation
    of Malawi with regard to certain items of fishing tackle (fishing flies)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 216/79 du Conseil, du 5 février 1979, concernant
    l' application de la décision n° 5/78 du Conseil des ministres ACP-CEE portant
    dérogation à la définition de la notion de produits originaires, pour tenir
    compte de la situation particulière du Malawi, en ce qui concerne certains articles
    de pêche (mouches pour la pêche)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 216/79 des Rates vom 5. Februar 1979 betreffend die
    Durchführung des Beschlusses Nr. 5/78 des AKP-EWG-Ministerrats über die Abweichung
    von der Bestimmung des Begriffs ,,Ursprungswaren' ' , um der besonderen Lage Malawis
    in bezug auf bestimmte Angelgeräte (künstliche Fliegen zum Flugangeln) Rechnung
    zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 216/79 af 5. februar 1979 om anvendelse af
    afgørelse nr. 5/78 truffet af AVS/EØF-Ministerrådet om undtagelse fra definitionen
    af begrebet "varer med oprindelsesstatus" for at tage hensyn til den særlige
    situation i Malawi for så vidt angår visse typer fiskegrej (fluer til fiskeri)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 216/79 del Consiglio, del 5 febbraio 1979, concernente
    l' applicazione della decisione n. 5/78 del Consiglio dei ministri ACP-CEE, che
    deroga alla definizione della nozione di prodotti originari per tener conto della
    situazione particolare del Malawi per quanto riguarda taluni articoli da pesca
    (mosche per la pesca)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 216/79 van de Raad van 5 februari 1979 betreffende
    de toepassing van Besluit nr. 5/78 van de ACS-EEG-Raad van Ministers houdende
    afwijking van de definitie van het begrip ,,produkten van oorsprong' ' in verband
    met de bijzondere situatie van Malawi voor wat betreft bepaalde visserijartikelen
    (kunstvliegen voor de visserij)
