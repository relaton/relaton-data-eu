title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2428/96 of 17 December 1996 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1997
    fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2428/96 de la Commission du 17 décembre 1996 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1997 intervenant dans le calcul de la compensation financière
    et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2428/96 der Kommission vom 17. Dezember 1996 zur Festsetzung
    des Pauschalwerts für das Fischwirtschaftsjahr 1997 für die aus dem Handel genommenen
    Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs und des entsprechenden
    Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 2428/96 af 17. december 1996 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1997
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2428/96 της Επιτροπής
    της 17ης Δεκεμβρίου 1996 για καθορισμό της κατ'
    αποκοπήν αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1997
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2428/96, annettu 17 päivänä joulukuuta 1996,
    kalastusvuoden 1997 aikana markkinoilta vedettyjen kalastustuotteiden taloudellisen
    korvauksen ja sen ennakon laskennassa käytettävästä kiinteästä arvosta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2428/96 della Commissione del 17 dicembre 1996 che
    fissa, ai fini del calcolo della compensazione finanziaria e dell'anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1997
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2428/96 van de Commissie van 17 december 1996 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1997 voor de uit
    de markt genomen visserijprodukten voor de berekening van de financiële vergoeding
    en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2428/96 da Comissão de 17 de Dezembro de 1996 que
    fixa, para efeitos do cálculo da compensação financeira e do adiantamento que
    lhe diz respeito, o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1997
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2428/96 de la Comisión de 17 de diciembre de 1996
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 1997, que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2428/96 av den 17 december 1996 om fastställande
    av det schablonvärde som skall användas vid beräkningen av den ekonomiska ersättningen
    och tillhörande förskott för de fiskeriprodukter som återtagits från marknaden
    under fiskeåret 1997
