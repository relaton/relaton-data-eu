title:
- language: en
  script: Latn
  content: '89/245/EEC: Commission Decision of 28 March 1989 authorizing the Kingdom
    of Belgium, the French Republic and the Kingdom of the Netherlands to permit temporarily
    the marketing of flax seed not complying with the requirements of Council Directive
    69/208/EEC'
  type: main
- language: fr
  script: Latn
  content: '89/245/CEE: Décision de la Commission du 28 mars 1989 autorisant le Royaume
    de Belgique, la République française et le Royaume des Pays-Bas à admettre
    temporairement la commercialisation de semences de lin textile ne répondant pas
    aux exigences de la directive 69/208/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 28. Maerz 1989 zur Ermaechtigung des Koenigreichs
    Belgien, der Franzoesischen Republik und des Koenigreichs der Niederlande, den
    Anforderungen der Richtlinie 69/208/EWG des Rates nicht entsprechendes Saatgut
    von Flachs voruebergehend zum Verkehr zuzulassen (89/245/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 28. marts 1989 om bemyndigelse af Kongeriget
    Belgien, Den Franske Republik og Kongeriget Nederlandene til midlertidigt at tillade
    handel med hoerfroe, der ikke opfylder kravene i Raadets direktiv 69/208/EOEF
    (89/245/EOEF)
  type: main
- language: el
  script: Grek
  content: '89/245/ΕΟΚ: Απόφαση της Επιτροπής της 28ης
    Μαρτίου 1989 για τη χορήγηση άδειας στο Βασίλειο
    του Βελγίου, τη Γαλλική Δημοκρατία και το Βασίλειο
    των Κάτω Χωρών να επιτρέπουν προσωρινά την
    εμπορία των σπόρων προς σπορά υφαντικού λίνου
    που δεν ανταποκρίνονται στις απαιτήσεις της
    οδηγίας 69/208/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 28 marzo 1989 che autorizza il Regno del
    Belgio, la Repubblica francese e il Regno dei Paesi Bassi ad ammettere temporaneamente
    la commercializzazione di sementi di lino tessile che non soddisfano i requisiti
    della direttiva 69/208/CEE del Consiglio (89/245/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 28 maart 1989 waarbij het Koninkrijk België,
    de Franse Republiek en het Koninkrijk der Nederlanden worden gemachtigd om zaaizaad
    van vezelvlas dat niet aan de eisen van Richtlijn 69/208/EEG van de Raad voldoet,
    tijdelijk tot de handel toe te laten (89/245/EEG)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 28 de Março de 1989° que autoriza o Reino da
    Bélgica, a Republica Francesa e o Reino dos Paises Baixos a admitirem temporariamente
    a comercialização de sementes de linho que nao correspondem às exigências
    da Directiva 69/208/CEE do Conselho (89/245/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 28 de marzo de 1989 por la que se autoriza al
    Reino de Bélgica, a la Republica Francesa y al Reino de los Paises Bajos a admitir
    temporalmente la comercializacion de semillas de lino textil que no cumplan los
    requisitos establecidos en la Directiva 69/208/CEE del Consejo (89/245/CEE)
