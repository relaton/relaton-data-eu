    und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung
    in den Staaten in Afrika, im karibischen Raum und im Pazifischen Ozean (AKP-Staaten)
    oder in den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1306/87 af 11. maj 1987 om forlængelse af
