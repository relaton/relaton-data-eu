  content: Council Regulation (EEC) No 1306/87 of 11 May 1987 extending Regulation
    (EEC) No 486/85 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    African, Caribbean and Pacific States (ACP States) or in the overseas countries
    and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1306/87 du Conseil du 11 mai 1987 prorogeant le règlement
    (CEE) n° 486/85 relatif au régime applicable à des produits agricoles et à
    certaines marchandises résultant de la transformation de produits agricoles originaires
    des États d' Afrique, des Caraïbes et du Pacifique (États ACP) ou des pays
    et territoires d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1306/87 des Rates vom 11. Mai 1987 zur Verlängerung
