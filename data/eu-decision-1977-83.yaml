title:
- language: en
  script: Latn
  content: '77/83/EEC: Commission Decision of 12 January 1977 concerning the measures
    provided for in the draft law of the Region of Campania (Italy) supplementing
    and amending Regional Law No 29 of 22 July 1974 on measures to promote beet production
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '77/83/CEE: Décision de la Commission, du 12 janvier 1977, relative aux
    aides prévues par le projet de loi de la région de Campanie en Italie portant
    complément et modifications à la loi régionale n° 29 du 27 juillet 1974 sur
    les mesures en faveur de la culture des betteraves (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '77/83/EWG: Entscheidung der Kommission vom 12. Januar 1977 betreffend,
    wie vorgesehen, Beihilfen in dem Gesetzentwurf der Region Kampanien (Italien)
    zur Ergänzung und Änderung des Regionalgesetzes Nr. 29 vom 22. Juli 1974 über
    Maßnahmen zugunsten des Zuckerrübenanbaus (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '77/83/EØF: Kommissionens beslutning af 12. januar 1977 vedrørende et
    italiensk lovforslag om tillæg og til ændring af regionallov nr. 29 af 22. juli
    1974 vedrørende foranstaltninger til fordel for sukkerroedyrkning (Kun den italienske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '77/83/ΕΟΚ : Απόφαση της Επιτροπής, της 12ης
    Ιανουαρίου 1977, περί των ενισχύσεων που προβλέπονται
    στο σχέδιο νόμου της περιοχής της Καμπανίας
    στην Ιταλία με τον οποίο συμπληρώνεται και
    τροποποιείται ο περιφερειακός νόμος αριθ.
    29 της 27ης Ιουλίου 1974 επί των μέτρων προς ενίσχυση
    της καλλιέργειας ζαχαρότευτλων (Το κείμενο
    στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
