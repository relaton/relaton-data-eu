    Ausfuhr von im Besitz der deutschen Interventionsstelle befindlichem Brotweizen
    auf 1 150 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 712/84 af 16. marts 1984 om ændring
