  content: '2006/211/EC: Commission Decision of 8 March 2006 establishing that Article
    30(1) of Directive 2004/17/EC of the European Parliament and of the Council coordinating
    the procurement procedures of entities operating in the water, energy, transport
    and postal services sectors applies to electricity generation in England, Scotland
    and Wales (notified under document number C(2006) 690)'
