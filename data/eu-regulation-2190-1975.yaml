title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2190/75 of the Commission of 22 August 1975 re-establishing
    the levying of the customs duties on building board of wood pulp or of vegetable
    fibre, etc., falling within heading No 48.09, originating in Brazil, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3054/74
    of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2190/75 de la Commission, du 22 août 1975, portant
    rétablissement de la perception des droits de douane applicables aux plaques
    pour construction, etc., de la position tarifaire 48.09, originaires du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3054/74 du Conseil du 2 décembre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2190/75 der Kommission vom 22. August 1975 zur Wiedereinführung
    des Zollsatzes für Bauplatten aus Papierhalbstoff, aus Fasern von Holz usw.,
    der Tarifnummer 48.09, mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2190/75 af 22. august 1975 om genindførelse
    af opkrævning af toldafgifter for byggeplader af papirmasse, etc., under position
    48.09, som har oprindelse i Brasilien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2190/75 della Commissione, del 22 agosto 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle lastre per costruzioni,
    ecc., della voce doganale n. 48.09, originarie del Brasile, beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2190/75 van de Commissie van 22 augustus 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op platen voor
    constructiedoeleinden, van post 48.09, van oorsprong uit Brazilië, ten behoeve
    waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene
    tariefpreferenties werden geopend
  type: main
