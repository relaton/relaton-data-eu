title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3084/88 of 6 October 1988 re-establishing
    the levying of customs duties on goat or kid skin leather, without hair on, falling
    within CN code 4106 and articles of apparel and clothing accessories, of leather
    or of composition leather, falling within CN code 4203, originating in India,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3084/88 de la Commission du 6 octobre 1988 portant
    rétablissement de la perception des droits de douane applicables aux peaux épilées
    de caprins, du code NC 4106, et aux vêtements et accessoires du vêtement en
    cuir naturel ou reconstitué, du code NC 4203, originaires de l' Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
