title:
- language: en
  script: Latn
  content: '87/311/EEC: Commission Decision of 9 June 1987 amending Decision 87/154/EEC
    approving derogations provided for by Greece and Italy from certain provisions
    of Council Directive 77/93/EEC in respect of seed potatoes originating in Canada
    (Only the Greek, Italian and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/311/CEE: Décision de la Commission du 9 juin 1987 modifiant la décision
    87/154/CEE approuvant les dérogations prévues par la Grèce et l''Italie à
    certaines dispositions de la directive 77/93/CEE du Conseil en ce qui concerne
    les plants de pommes de terre originaires du Canada (Les textes en langues grecque,
    italienne et portugaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/311/EWG: Entscheidung der Kommission vom 9. Juni 1987 zur Änderung
    der Entscheidung 87/154/EWG zur Genehmigung der von Griechenland und Italien für
    Pflanzkartoffeln mit Ursprung in Kanada vorgesehenen Ausnahmen von bestimmten
    Vorschriften der Richtlinie 77/93/EWG des Rates (Nur der griechische, italienische
    und portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/311/EØF: Kommissionens beslutning af 9. juni 1987 om ændring af beslutning
    87/154/EØF om godkendelse af undtagelser for Grækenland og Italien fra visse
    bestemmelser i Rådets direktiv 77/93/EØF for så vidt angår læggekartofler
    med oprindelse i Canada (Kun den graeske, italienske og portugisiske udgave er
    autentiske)'
  type: main
- language: el
  script: Grek
  content: '87/311/ΕΟΚ: Απόφαση της Επιτροπής της 9ης Ιουνίου
    1987 για την τροποποίηση της απόφασης 87/154/ΕΟΚ
    σχετικά με την έγκριση των παρεκκλίσεων που
    προβλέπονται από την Ελλάδα και την Ιταλία
    από ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ
    του Συμβουλίου όσον αφορά τους σπόρους γεωμήλων
    προς φύτευση καταγωγής Καναδά (Τα κείμενα στην
    ελληνική, ιταλική και πορτογαλική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '87/311/CEE: Decisione della Commissione del 9 giugno 1987 recante modifica
    della decisione 87/154/CEE che approva le deroghe, previste dalla Grecia e dall''Italia,
    a talune disposizioni delle direttiva 77/93/CEE del Consiglio per quanto riguarda
    i tuberi-seme di patate originari del Canada (I testi in lingua greca, italiana
    e portoghese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '87/311/EEG: Beschikking van de Commissie van 9 juni 1987 tot wijziging
    van Beschikking 87/154/EEG houdende goedkeuring van de door Griekenland en Italië
    vastgestelde afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG van de
    Raad ten aanzien van pootaardappelen van oorsprong uit Canada (Slechts de teksten
    in de Griekse, Italiaanse en de Portugese taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/311/CEE: Decisão da Comissão de 9 de Junho de 1987 que altera a Decisão
    87/154/CEE que aprova derrogações, a estabelecer pela Grécia e pela Itália,
    de determinados preceitos da Directiva 77/93/CEE do Conselho, no que respeita
    às batatas de semente originárias do Canadá (Apenas fazem fé os textos nas
    línguas grega, italiana e portuguesa)'
  type: main
- language: es
  script: Latn
  content: '87/311/CEE: Decisión de la Comisión de 9 de junio de 1987 por la que
    se modifica la Decisión 87/154/CEE, por la que se autorizan las excepciones previstas
    por Grecia e Italia respecto de determinadas disposiciones de la Directiva 77/93/CEE
    del Consejo relativas a las patatas de siembra originarias de Canadá (Los textos
    en lenguas griega, italiana y portuguesa son los únicos auténticos)'
  type: main
