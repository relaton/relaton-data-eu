title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 533/78 of 13 March 1978 opening, allocating
    and providing for the administration of a Community tariff quota for liqueur wines
    falling within subheading ex 22.05 C of the Common Customs Tariff, originating
    in Cyprus and marketed under the label of 'Cyprus sherry', and introducing subsidies
    for similar wine products produced in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 533/78 du Conseil, du 13 mars 1978, portant ouverture,
    répartition et mode de gestion d'un contingent tarifaire communautaire de vins
    de liqueur, de la sous-position EX 22.05 C du tarif douanier commun, originaires
    de Chypre, commercialisés sous la mention "cyprus sherry", et instituant des
    aides pour des produits vinicoles similaires produits dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 533/78 des Rates vom 13. März 1978 zur Eröffnung,
    Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für unter der Bezeichnung
    "Cyprus Sherry" vermarktete Likörweine der Tarifstelle ex 22.05 C des Gemeinsamen
    Zolltarifs mit Ursprung in Zypern und zur Einführung von Beihilfen für gleichartige
    Weinbauerzeugnisse der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 533/78 af 13. marts 1978 om åbning, fordeling
    og forvaltning af fællesskabstoldkontingenter for hedvine, henhørende under
    pos. ex 22.05 C i den fælles toldtarif, med oprindelse i Cypern og bragt i omsætning
    under betegnelsen »Cyprus Sherry«, samt om fastsættelse af en støtteordning
    for lignende vinprodukter, der er fremstillet inden for Fællesskabet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 533/78 del Consiglio, del 13 marzo 1978, recante apertura,
    ripartizione e modalità di gestione di un contingente tariffario comunitario
    di vini liquorosi della sottovoce ex 22.05 C della tariffa doganale comune originari
    di Cipro, commercializzati con la menzione «Cyprus Sherry», ed istitutivo di
    aiuti per prodotti vinicoli simili prodotti nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 533/78 van de Raad van 13 maart 1978 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor likeurwijnen, van onderverdeling ex 22.05 C van het gemeenschappelijk douanetarief,
    van oorsprong uit Cyprus, in de handel gebracht onder de benaming "Cyprus Sherry",
    en betreffende de invoering van steunmaatregelen voor soortgelijke in de Gemeenschap
    voortgebrachte wijnbouwprodukten
