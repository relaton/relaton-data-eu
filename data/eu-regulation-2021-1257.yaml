title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1257 of 21 April 2021 amending
    Delegated Regulations (EU) 2017/2358 and (EU) 2017/2359 as regards the integration
    of sustainability factors, risks and preferences into the product oversight and
    governance requirements for insurance undertakings and insurance distributors
    and into the rules on conduct of business and investment advice for insurance-based
    investment products
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1257 de la Commission du 21 avril 2021
    modifiant les règlements délégués (UE) 2017/2358 et (UE) 2017/2359 en ce qui
    concerne l’intégration des facteurs de durabilité, des risques en matière
    de durabilité et des préférences en matière de durabilité dans les exigences
    de surveillance et de gouvernance des produits applicables aux entreprises d’assurance
    et aux distributeurs de produits d’assurance, et dans les règles de conduite
    et les règles régissant le conseil en investissement applicables aux produits
    d’investissement fondés sur l’assurance
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1257 der Kommission vom 21. April 2021
    zur Änderung der Delegierten Verordnungen (EU) 2017/2358 und (EU) 2017/2359 im
    Hinblick auf die Einbeziehung von Nachhaltigkeitsfaktoren, -risiken und -präferenzen
    in die Aufsichts- und Lenkungsanforderungen an Versicherungsunternehmen und Versicherungsvertreiber
    sowie in die für den Vertrieb von Versicherungsanlageprodukten geltenden Informationspflichten
    und Wohlverhaltensregeln
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1257 на Комисията
    от 21 април 2021 година за изменение на Делегиран
    регламент (ЕС) 2017/2358 и Делегиран регламент (ЕС)
    2017/2359 по отношение на включването на факторите
    на устойчивост, рисковете за устойчивостта
    и предпочитанията във връзка с устойчивостта
    в изискванията към застрахователните дружества
    и разпространителите на застрахователни продукти
    във връзка с контрола и управлението на продуктите,
    и в правилата за етичност и за инвестиционни
    съвети за основаващите се на застраховане
    инвестиционни продукти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/1257 ze dne 21. dubna
    2021, kterým se mění nařízení v přenesené pravomoci (EU) 2017/2358 a (EU)
    2017/2359, pokud jde o začlenění faktorů udržitelnosti a rizik a preferencí
