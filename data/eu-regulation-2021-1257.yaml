    pro výkon činnosti a investiční poradenství pro pojistné produkty s investiční
    složkou
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/1257 af 21. april 2021 om
    ændring af delegeret forordning (EU) 2017/2358 og (EU) 2017/2359 for så vidt
    angår integration af bæredygtighedsfaktorer og bæredygtighedspræferencer i
