title:
- language: en
  script: Latn
  content: '87/518/EEC: Council Decision of 19 October 1987 on the conclusion of an
    Agreement in the form of an Exchange of Letters concerning the provisional application,
    from 1 June 1987, of the Agreement amending the Agreement between the European
    Economic Community and the Government of the Democratic Republic of São Tomé
    and Principe on fishing off São Tomé and Principe, signed at Brussels on 1 February
    1984, with effect from 1 June 1987'
  type: main
- language: fr
  script: Latn
  content: '87/518/CEE: Décision du Conseil du 19 octobre 1987 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire,
    à partir du 1er juin 1987, de l''accord portant modification de l''accord entre
    la Communauté économique européenne et le gouvernement de la République démocratique
    de São Tomé e Príncipe concernant la pêche au large de São Tomé e Príncipe,
    signé à Bruxelles le 1er février 1984'
  type: main
