    zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung der Demokratischen
    Republik São Tomé und Príncipe über die Fischerei vor der Küste von São
    Tomé und Príncipe für die Zeit ab 1. Juni 1987'
  type: main
