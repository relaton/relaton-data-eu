title:
- language: en
  script: Latn
  content: Council Directive 96/33/EC of 21 May 1996 amending the Annexes to Directives
    86/362/EEC and 86/363/EEC on the fixing of maximum levels for pesticide residues
    in and on cereals and foodstuffs of animal origin respectively
  type: main
- language: fr
  script: Latn
  content: Directive 96/33/CE du Conseil du 21 mai 1996 modifiant les annexes des
    directives 86/362/CEE et 86/363/CEE concernant la fixation de teneurs maximales
    pour les résidus de pesticides sur et dans les céréales et les denrées alimentaires
    d'origine animale
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/33/EG des Rates vom 21. Mai 1996 zur Änderung der Anhänge
    der Richtlinien 86/362/EWG und 86/363/EWG über die Festsetzung von Höchstgehalten
    an Rückständen von Schädlingsbekämpfungsmitteln auf und in Getreide sowie
    Lebensmitteln tierischen Ursprungs
  type: main
- language: bg
  script: Cyrl
  content: Директива 96/33/ЕО на Съвета от 21 май 1996 година
    за изменение на приложенията към Директиви
    86/362/ЕИО и 86/363/ЕИО относно определянето на максимални
    количества на остатъци от пестициди във и върху
    зърнените култури и храните от животински
    произход
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 96/33/ES ze dne 21. května 1996, kterou se mění přílohy
    směrnic 86/362/EHS a 86/363/EHS o stanovení maximálních limitů reziduí pesticidů
    v obilovinách a v potravinách živočišného původu a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 96/33/EF af 21. maj 1996 om ændring af bilagene til direktiv
    86/362/EØF og 86/363/EØF vedrørende fastsættelse af maksimalgrænseværdier
    for indholdet af pesticidrester i og på korn og levnedsmidler af animalsk oprindelse
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/33/ΕΚ του Συμβουλίου της 21ης Μαΐου
    1996 περί τροποποιήσεως των παραρτημάτων των
    οδηγιών 86/362/ΕΟΚ και 86/363/ΕΟΚ που αφορούν τον
    καθορισμό των ανώτατων περιεκτικοτήτων για
    τα κατάλοιπα φυτοφαρμάκων μέσα και πάνω στα
    σιτηρά και στα τρόφιμα ζωικής προελεύσεως
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 96/33/EÜ, 21. mai 1996, millega muudetakse direktiivide
    86/362/EMÜ ja 86/363/EMÜ (vastavalt teraviljas ja loomses toidus sisalduvate
    ja nende pinnal esinevate pestitsiidide jääkide piirnormide kehtestamise kohta)
    lisasid
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 96/33/EY, annettu 21 päivänä toukokuuta 1996, viljoissa
    ja eläinkunnasta peräisin olevissa elintarvikkeissa olevien torjunta-ainejäämien
    enimmäismäärien vahvistamista koskevien direktiivien 86/362/ETY ja 86/363/ETY
    liitteiden muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/33/EK irányelve (1996. május 21.) a gabonafélékben, illetőleg
    az állati eredetű élelmiszerekben, illetve azok felületén található peszticid-szermaradványok
    megengedett legmagasabb mértékének meghatározásáról szóló 86/362/EGK,
    illetőleg 86/363/EGK irányelv mellékleteinek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 96/33/CE del Consiglio del 21 maggio 1996 che modifica gli allegati
    delle direttive 86/362/CEE e 86/363/CEE che fissano le quantità massime di residui
    di antiparassitari sui e nei cereali e, rispettivamente, sui e nei prodotti alimentari
    di origine animale
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 96/33/EK (1996. gada 21. maijs), ar ko groza pielikumus
    Direktīvām 86/362/EEK un 86/363/EEK attiecībā uz pesticīdu atliekvielu maksimāli
    pieļaujamo daudzumu noteikšanu attiecīgi labībā un uz tās un dzīvnieku
    izcelsmes pārtikas produktos un uz tiem
  type: main
- language: lt
  script: Latn
  content: 1996 m. gegužės 21 d. Tarybos direktyva 96/33/EB, iš dalies keičianti
    Tarybos direktyvų 86/362/EEB ir 86/363/EEB dėl didžiausių pesticidų likučių
    koncentracijų atitinkamai grūduose, gyvūninės kilmės maisto produktuose ir
    ant jų nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 96/33/KE tal-21 ta’ Mejju 1996 li temenda l-Annessi
    tad-Direttivi 86/362/KEE u 86/363/KEE dwar l-iffissar tal-livelli massimi għar-residwi
    tal-pestiċida fi u fuq iċ-ċereali u l-oġġetti ta' l-ikel li għandhom l-oriġini
    mill-annimalirispettivament
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/33/EG van de Raad van 21 mei 1996 houdende wijziging van de
    bijlagen bij de Richtlijnen 86/362/EEG en 86/363/EEG tot vaststelling van maximumgehalten
    aan residuen van bestrijdingsmiddelen in en op granen, respectievelijk in en op
    levensmiddelen van dierlijke oorsprong
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 96/33/WE z dnia 21 maja 1996 r. zmieniająca załączniki
    do dyrektyw 86/362/EWG i 86/363/EWG w sprawie ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów w zbożach i na ich powierzchni oraz w środkach
    spożywczych pochodzenia zwierzęcego i na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 96/33/CE do Conselho de 21 de Maio de 1996 que altera os anexos
    das Directivas 86/362/CEE e 86/363/CEE relativas à fixação de teores máximos
    para os resíduos de pesticidas à superfície e no interior de, respectivamente,
    cereais e géneros alimentícios de origem animal
  type: main
- language: ro
  script: Latn
  content: Directiva 96/33/CE a Consiliului din 21 mai 1996 de modificare a anexelor
    la Directivele 86/362/CEE și 86/363/CEE privind stabilirea conținuturilor maxime
    de reziduuri de pesticide de pe și din cereale și produsele alimentare de origine
    animală
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 96/33/ES z 21. mája 1996, ktorou sa menia a dopĺňajú
    prílohy k smerniciam 86/362/EHS a 86/363/EHS o stanovovaní maximálnych hladín
    rezíduí pesticídov v a na obilninách a potravinách živočíšneho pôvodu
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/33/ES z dne 21. maja 1996 o spremembi prilog k direktivama
    86/362/EGS in 86/363/EGS o določanju najvišjih mejnih vrednosti ostankov pesticidov
    v in na žitih in živilih živalskega izvora
  type: main
- language: es
  script: Latn
  content: Directiva 96/33/CE del Consejo de 21 de mayo de 1996 por la que se modifican
    los Anexos de las Directivas 86/362/CEE y 86/363/CEE relativas a la fijación
    de límites máximos para los residuos de plaguicidas sobre y en los cereales
    y los productos alimenticios de origen animal, respectivamente
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/33/EG av den 21 maj 1996 om ändring av bilagorna till
    direktiv 86/362/EEG och 86/363/EEG om fastställande av gränsvärden för bekämpningsmedelsrester
    i och på spannmål respektive i och på livsmedel av animaliskt ursprung
  type: main
