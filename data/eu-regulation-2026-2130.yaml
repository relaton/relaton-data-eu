- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2026/2130 of 18 September 2026
    concerning the renewal of the authorisation of a preparation of endo-1,4-beta-xylanase
    produced with Bacillus subtilis LMG S-15136 as a feed additive for all poultry
    species, suckling and weaned piglets, pigs for fattening, lactating sows, gestating
    sows and all minor porcine species other than reproductive animals, the extension
    of the authorisation of a preparation of endo-1,4-beta-xylanase produced with
    Bacillus subtilis LMG S-15136 as a feed additive for all porcine species (holder
    of authorisation: Puratos NV), and repealing Implementing Regulations (EU) 2017/211,
    (EU) 2020/1377, (EU) 2021/1413 and (EU) 2026/356'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2026/2130 de la Commission du 18 septembre
