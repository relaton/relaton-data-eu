    produite par Bacillus subtilis LMG S-15136 en tant qu’additif pour l’alimentation
    de toutes les espèces de volailles, des porcelets non sevrés et sevrés, des
    porcs à l’engrais, des truies allaitantes, des truies gestantes et des porcins
    de toutes les espèces mineures autres que les animaux reproducteurs, l’extension
