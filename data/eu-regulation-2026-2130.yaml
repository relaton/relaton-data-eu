    preparado de endo-1,4-beta-xilanasa producida por Bacillus subtilis LMG S-15136
    como aditivo para piensos destinado a todas las especies porcinas (titular de
    la autorización: Puratos NV), y por el que se derogan los Reglamentos de Ejecución
    (UE) 2017/211, (UE) 2020/1377, (UE) 2021/1413 y (UE) 2026/356'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2026/2130 av den 18 september
    2026 om förlängning av godkännandet av ett preparat av endo-1,4-beta-xylanas
    framställt med Bacillus subtilis LMG S-15136 som fodertillsats för alla fjäderfän,
    diande och avvanda smågrisar, slaktgrisar, lakterande suggor, dräktiga suggor
    och mindre vanligt förekommande svinarter utom avelsdjur, om förlängning av
    godkännandet av ett preparat av endo-1,4-beta-xylanas framställt med Bacillus
    subtilis LMG S-15136 som fodertillsats för alla svinarter (innehavare av godkännandet:
    Puratos NV), och om upphävande av genomförandeförordningarna (EU) 2017/211,
    (EU) 2020/1377, (EU) 2021/1413 och (EU) 2026/356'
  type: main
