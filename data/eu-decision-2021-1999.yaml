---
id: EUDecision20211999
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1999 of 15 November 2021 amending
    Implementing Decision (EU) 2016/1215 as regards the authorisation holder and its
    representative in the Union for the placing on the market of products containing,
    consisting of, or produced from genetically modified soybean FG72 (notified under
    document C(2021) 8000) (Only the French and Dutch texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1999 de la Commission du 15 novembre
    2021 modifiant la décision d’exécution (UE) 2016/1215 en ce qui concerne le
    titulaire de l’autorisation et son représentant dans l’Union pour la mise
    sur le marché de produits contenant du soja génétiquement modifié FG72, consistant
    en ce soja ou produits à partir de celui-ci [notifiée sous le numéro C(2021)
    8000] (Les textes en langues française et néerlandaise sont les seuls faisant
    foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1999 der Kommission vom 15. November
    2021 zur Änderung des Durchführungsbeschlusses (EU) 2016/1215 hinsichtlich des
    Zulassungsinhabers und seines Vertreters in der Union für das Inverkehrbringen
    von Erzeugnissen, die genetisch veränderte Sojabohnen der Sorte FG72 enthalten,
    aus ihnen bestehen oder aus ihnen gewonnen werden (Bekannt gegeben unter Aktenzeichen
    C(2021) 8000) (Nur der französische und der niederländische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/1999 на Комисията
    от 15 ноември 2021 година за изменение на Решение
    за изпълнение (ЕС) 2016/1215 по отношение на титуляря
    на разрешението и неговия представител в Съюза
    за пускането на пазара на продукти, съдържащи,
    състоящи се или произведени от генетично модифицирана
    соя FG72 (нотифицирано под номер C(2021) 8000) (само
    текстовете на нидерландски и френски език
    са автентични)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/1999 ze dne 15. listopadu 2021,
    kterým se mění prováděcí rozhodnutí (EU) 2016/1215, pokud jde o držitele
    povolení a jeho zástupce v Unii pro uvádění produktů, které obsahují geneticky
    modifikovanou sóju FG72, sestávají z ní nebo jsou z ní vyrobeny, na trh (oznámeno
    pod číslem C(2021) 8000) (Pouze francouzské a nizozemské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/1999 af 15. november
    2021 om ændring af gennemførelsesafgørelse (EU) 2016/1215 for så vidt angår
    indehaveren og dennes repræsentant i Unionen af tilladelsen til markedsføring
    af produkter, der indeholder, består af eller er fremstillet af visse typer genetisk
    modificeret FG72-sojabønne (meddelt under nummer C(2021) 8000) (Kun den franske
    og den nederlandske udgave er autentiske)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2021/1999 της Επιτροπής
    της 15ης Νοεμβρίου 2021 για την τροποποίηση της
    εκτελεστικής απόφασης (ΕΕ) 2016/1215 όσον αφορά
    τον κάτοχο έγκρισης και τον αντιπρόσωπό του
    στην Ένωση για τη διάθεση στην αγορά προϊόντων
    που περιέχουν, αποτελούνται ή παράγονται από
    γενετικώς τροποποιημένη σόγια της σειράς FG72
    [κοινοποιηθείσα υπό τον αριθμό C(2021) 8000] (Τα κείμενα
    στη γαλλική και την ολλανδική γλώσσα είναι
    τα μόνα αυθεντικά)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/1999, 15. november 2021, millega muudetakse
    rakendusotsust (EL) 2016/1215 seoses loa hoidja ja teda liidus esindava äriühinguga,
    kes on lasknud turule geneetiliselt muundatud sojauba FG72 sisaldavaid, sellest
    koosnevaid või sellest valmistatud tooteid (teatavaks tehtud numbri C(2021) 8000
    all) (ainult prantsus- ja hollandikeelne tekst on autentsed)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/1999, annettu 15 päivänä
    marraskuuta 2021, täytäntöönpanopäätöksen (EU) 2016/1215 muuttamisesta
    siltä osin kuin on kyse muuntogeenistä soijaa FG72 sisältävien, siitä koostuvien
    tai siitä valmistettujen tuotteiden markkinoille saattamista koskevan luvan haltijasta
    ja tämän edustajasta unionissa (tiedoksiannettu numerolla C(2021) 8000) (Ainoastaan
    ranskan- ja hollanninkieliset tekstit ovat todistusvoimaisia)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/1999 оd 15. studenog 2021. o izmjeni
    Provedbene odluke (EU) 2016/1215 u pogledu nositelja odobrenja i njegova zastupnika
    u Uniji za stavljanje na tržište proizvoda koji sadržavaju genetski modificiranu
    soju FG72, sastoje se ili su proizvedeni od nje (priopćeno pod brojem dokumenta
    C(2021) 8000) (Vjerodostojni su samo tekstovi na francuskom i nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1999 végrehajtási határozata (2021. november
    15.) az (EU) 2016/1215 végrehajtási határozatnak a géntechnológiával módosított
    FG72 szójababot tartalmazó, abból álló vagy abból előállított termékek
    forgalomba hozatalára vonatkozó engedély jogosultja és uniós képviselője
    tekintetében történő módosításáról (az értesítés a C(2021) 8000. számú
    dokumentummel történt) (Csak a francia és a holland nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/1999 della Commissione del 15 novembre
    2021 che modifica la decisione di esecuzione (UE) 2016/1215 per quanto riguarda
    il titolare dell’autorizzazione e il suo rappresentante nell’Unione per l’immissione
    sul mercato di prodotti contenenti, costituiti od ottenuti da soia geneticamente
    modificata FG72 [notificata con il numero C(2021) 8000] (I testi in lingua francese
    e neerlandese sono i soli facenti fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/1999 (2021. gada 15. novembris),
    ar ko attiecībā uz atļaujas turētāju un tā pārstāvi Savienībā saistībā
    ar tādu produktu laišanu tirgū, kuri satur ģenētiski modificētas sojas pupas
    FG72, sastāv vai ir ražoti no tām, groza Īstenošanas lēmumu (ES) 2016/1215
    (izziņots ar dokumenta numuru C(2021) 8000) (Autentisks ir tikai teksts franču
    un nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/1999 2021 m. lapkričio 15
    d. kuriuo dėl leidimo turėtojo ir jo atstovo Sąjungoje, įgalioto pateikti
    rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų sojų FG72, kurie
    iš jų sudaryti arba pagaminti, iš dalies keičiamas Įgyvendinimo sprendimas
    (ES) 2016/1215 (pranešta dokumentu Nr. C(2021) 8000) (Tekstas autentiškas tik
    prancūzų ir nyderlandų kalbomis)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/1999 tal-15
    ta’ Novembru 2021 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2016/1215
    fir-rigward tad-detentur tal-awtorizzazzjoni u tar-rappreżentant tiegħu fl-Unjoni
    għat-tqegħid fis-suq ta’ prodotti li fihom, li jikkonsistu jew li huma prodotti
    mill-fażola tas-sojja ġenetikament modifikata FG72 (notifikata bid-dokument
    C(2021) 8000) (It-testi bil-Franċiż u n-Netherlandiż biss huma awtentiċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/1999 van de Commissie van 15 november 2021
    tot wijziging van Uitvoeringsbesluit (EU) 2016/1215 wat betreft de vergunninghouder
    en zijn vertegenwoordiger in de Unie voor het in de handel brengen van producten
    die geheel of gedeeltelijk bestaan uit of zijn geproduceerd met genetisch gemodificeerde
    soja FG72 (Kennisgeving geschied onder nummer C(2021) 8000) (Slechts de teksten
    in de Nederlandse en de Franse taal zijn authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/1999 z dnia 15 listopada 2021 r. r.
    zmieniająca decyzję wykonawczą (UE) 2016/1215 w odniesieniu do posiadacza zezwolenia
    na wprowadzanie do obrotu produktów zawierających genetycznie zmodyfikowaną
    soję FG72, składających się z niej lub z niej wyprodukowanych oraz jego przedstawiciela
    w Unii (notyfikowana jako dokument nr C(2021) 8000) (Jedynie teksty w języku
    francuskim i niderlandzkim są autentyczne)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/1999 da Comissão de 15 de novembro de
    2021 que altera a Decisão de Execução (UE) 2016/1215 no que diz respeito ao
    detentor da autorização e ao seu representante na União para a colocação
    no mercado de produtos que contenham, sejam constituídos por ou sejam produzidos
    a partir de soja geneticamente modificada FG72 [notificada com o número C(2021)
    8000] (Apenas fazem fé os textos nas línguas francesa e neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/1999 a Comisiei din 15 noiembrie
    2021 de modificare a Deciziei de punere în aplicare (UE) 2016/1215 în ceea ce
    privește titularul autorizației și reprezentantul său în Uniune pentru introducerea
    pe piață a produselor care conțin, constau în sau sunt fabricate din soia
    modificată genetic FG72 [notificată cu numărul C(2021) 8000] (Numai textele
    în limbile franceză și neerlandeză sunt autentice)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/1999 z 15. novembra 2021, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2016/1215, pokiaľ ide o držiteľa povolenia
    a jeho zástupcu v Únii na umiestnenie na trh výrobkov, ktoré obsahujú geneticky
    modifikovanú sóju FG72, sú z nej zložené alebo vyrobené [oznámené pod
    číslom C(2021) 8000] (Iba francúzske a holandské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/1999 z dne 15. novembra 2021 o spremembi
    Izvedbenega sklepa (EU) 2016/1215 glede imetnika odobritve za dajanje na trg proizvodov,
    ki vsebujejo gensko spremenjeno sojo FG72, so iz nje sestavljeni ali proizvedeni,
    in njegovega zastopnika v Uniji (notificirano pod dokumentarno številko C(2021)
    8000) (Besedilo v francoskem in nizozemskem jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/1999 de la Comisión de 15 de noviembre
    de 2021 por la que se modifica la Decisión de Ejecución (UE) 2016/1215 en lo
    que respecta al titular de la autorización y su representante en la Unión para
    la comercialización de productos que contienen o están compuestos por soja modificada
    genéticamente FG72 o han sido producidos a partir de ella [notificada con el
    número C(2021) 8000] (Los textos en lenguas francesa y neerlandesa son los únicos
    auténticos)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/1999 av den 15 november 2021
    om ändring av genomförandebeslut (EU) 2016/1215 vad gäller innehavaren av godkännandet
    och dennes företrädare i unionen för utsläppande på marknaden av produkter
    som innehåller, består av eller har framställts av den genetiskt modifierade
    sojabönan FG72 (delgivet med nr C(2021) 8000) (Endast de franska och nederländska
    texterna är giltiga)
