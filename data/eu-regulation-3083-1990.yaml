title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3083/90 of 25 October 1990 determining the
    extent to which applications lodged until the month of October 1990 for the issue
    of import licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3083/90 de la Commission, du 25 octobre 1990, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'octobre 1990 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3083/90 der Kommission vom 25. Oktober 1990 über
    den Umfang, in dem den im Monat Oktober eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3083/90 af 25. oktober 1990 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    oktober 1990 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3083/90 της Επιτροπής
    της 25ης Οκτωβρίου 1990 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Οκτώβριο του 1990, για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3083/90 della Commissione, del 25 ottobre 1990, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di ottobre per le carni bovine congelate destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3083/90 van de Commissie van 25 oktober 1990 waarbij
