id: EURegulation23081979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2308/79 of 19 October 1979 re-establishing
    the levying of customs duties on nets and netting made of twine, cordage or rope,
    etc., falling within heading No 59.05 and originating in South Korea, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 1195/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2308/79 de la Commission, du 19 octobre 1979, portant
    rétablissement de la perception des droits de douane applicables aux filets,
    en nappes, en pièces ou en forme, etc., de la position 59.05 du tarif douanier
    commun, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2308/79 der Kommission vom 19. Oktober 1979 zur Wiedereinführung
    des Zollsatzes für Netze aus Waren der Tarifnummer 59.04, in Stücken, als Meterware
    oder abgepaßt, usw., der Tarifnummer 59.05, mit Ursprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 1195/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2308/79 af 19. oktober 1979 om genindførelse
    af opkrævning af toldafgifter for knyttede netstoffer af sejlgarn, reb og tovværk
    etc., henhørende under pos. 59.05 i den fælles toldtarif, som har oprindelse
    i Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2308/79 della Commissione, del 19 ottobre 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle reti in strisce,
    in pezza o in forme determinate, ecc., della voce 59.05 della tariffa doganale
    comune, originarie della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2308/79 van de Commissie van 19 oktober 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op netten,
    vervaardigd van produkten bedoeld bij post 59.04, in banen, aan het stuk of in
    bepaalde vorm, enz., van post 59.05, van oorsprong uit Zuid-Korea waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 1195/79
    van de Raad
  type: main
