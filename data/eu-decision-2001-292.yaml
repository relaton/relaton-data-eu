    tietyissä jäsenvaltioissa ja tietyillä alueilla ja näille jäsenvaltioille
    ja alueille tästä taudista virallisesti vapaan jäsenvaltion tai alueen aseman
    vahvistamisesta tehdyn päätöksen 93/52/ETY muuttamisesta (ETA:n kannalta merkityksellinen
    teksti) (tiedoksiannettu numerolla K(2001) 952)'
  type: main
- language: hr
  script: Latn
  content: '2001/292/EZ: Odluka Komisije od 29. ožujka 2001. o izmjeni Odluke 93/52/EEZ
    o utvrđivanju sukladnosti određenih država članica ili regija zahtjevima u
    pogledu bruceloze ( Brucella melitensis ) i o statusu države članice ili regije
    službeno slobodne od te bolesti (priopćena pod brojem dokumenta C(2001) 952)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2001. március 29.) egyes tagállamok vagy régiók
    brucellózisra (Brucella melitensis) vonatkozó követelményeknek való megfelelősége
    rögzítéséről és hivatalosan brucellózismentes tagállammá, illetve régióvá
    nyilvánításáról szóló 93/52/EGK határozat módosításáról (az értesítés
    a C(2001) 952. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2001/292/CE: Decisione della Commissione, del 29 marzo 2001, recante modifica
    della decisione 93/52/CEE che constata il rispetto da parte di taluni Stati membri
    o regioni delle condizioni relative alla brucellosi (Brucella melitensis) e riconosce
    loro la qualifica di Stato membro o regione ufficialmente indenne da tale malattia
    (Testo rilevante ai fini del SEE) [notificata con il numero C(2001) 952]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2001. gada 29. marts), ar kuru groza Lēmumu 93/52/EEK,
    ar ko konstatē dažu dalībvalstu vai reģionu atbilstību prasībām saistībā
    ar brucelozi (Brucella melitensis) un ar ko tām piešķir no šīs slimības
    oficiāli brīvas dalībvalsts vai reģiona statusu (izziņots ar dokumenta numuru
    C(2001) 952)
  type: main
- language: lt
  script: Latn
  content: 2001 m. kovo 29 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    93/52/EEB, kuriuo patvirtinama, kad tam tikros valstybės narės ar regionai atitinka
    bruceliozei (B. melitensis) nustatytus reikalavimus ir suteikiamas oficialiai
    liga neužkrėstos valstybės narės ar regiono statusas (pranešta dokumentu
    Nr. C(2001) 952)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni Tad-29 ta’ Marzu 2001 Fejn temenda d-Deċiżjoni
    93/52/KE li tieħu nota tal-konformita’, minn ċerti Stati Membri, ta’ reġjuni
    mal-kondizzjonijiet li jirrigwardaw il-bruċellosi (Brucella melitensis) u li
    tagħtihom l-istatus ta’ Stat Membru jew reġjun uffiċjalment ħieles mill-marda
    (innotifikat taħt dokument numru K(2001) 952)
  type: main
- language: nl
  script: Latn
  content: '2001/292/EG: Beschikking van de Commissie van 29 maart 2001 tot wĳziging
    van Beschikking 93/52/EEG houdende constatering dat bepaalde lidstaten of gebieden
    aan de voorwaarden voldoen om te worden erkend als officieel brucellosevrĳ (Brucella
    melitensis) (Voor de EER relevante tekst) (kennisgeving geschied onder nummer
    C(2001) 952)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 29 marca 2001 r. zmieniająca decyzję 93/52/EWG
    stwierdzającą stosowanie się Państw Członkowskich lub regionów do wymagań
    odnoszących się do brucelozy (Brucella melitensis) i przyznającą im status
    oficjalnie wolnych od choroby (notyfikowana jako dokument nr C(2001) 952)
  type: main
- language: pt
  script: Latn
  content: '2001/292/CE: Decisão da Comissão, de 29 de Março de 2001, que altera
    a Decisão 93/52/CEE que reconhece que certos Estados-Membros ou regiões respeitam
    as condições relativas à brucelose (Brucella melitensis) e que lhes reconhece
    o estatuto de Estado-Membro ou região oficialmente indemne desta doença (Texto
    relevante para efeitos do EEE) [notificada com o número C(2001) 952]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 29 martie 2001 de modificare a Deciziei 93/52/CEE
    privind constatarea, în anumite state membre sau regiuni, a respectării cerințelor
    referitoare la bruceloză (Brucella melitensis) și recunoașterea, pentru aceste
    teritorii, a statutului de stat membru sau de regiune oficial indemn(ă) de această
    boală [notificată cu numărul C(2001) 952]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 23. marca 2001, ktorým sa mení a dopĺňa smernica
    92/52/EHS, ktorou sa zaznamenáva dosiahnutie súladu niektorých členských
    štátov alebo oblastí s požiadavkami vzťahujúcimi sa na brucelózu (B. melintensis)
    a priznáva sa im štatút úradne uznaného členského štátu alebo oblasti
    bez výskytu tejto choroby (oznámené pod číslom dokumentu C(2001) 952)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 29. marca 2001 o spremembi Odločbe 93/52/EGS o
    ugotovitvi skladnosti nekaterih držav članic ali regij z zahtevami glede bruceloze
    (Brucella melitensis) in o pripoznanju statusa države članice ali regije, uradno
    proste te bolezni (notificirano pod dokumentarno številko K(2001) 952)
  type: main
- language: es
  script: Latn
  content: '2001/292/CE: Decisión de la Comisión, de 29 de marzo de 2001, que modifica
    la Decisión 93/52/CEE por la que se reconoce que determinados Estados miembros
    o regiones cumplen las condiciones referentes a la brucelosis (Brucella melitensis)
    y se les concede la calificación de Estados miembros o regiones oficialmente
    indemnes de esta enfermedad (Texto pertinente a efectos del EEE) [notificada con
    el número C(2001) 952]'
  type: main
- language: sv
  script: Latn
  content: '2001/292/EG: Kommissionens beslut av den 29 mars 2001 om ändring av beslut
    93/52/EEG om fastställande av att vissa medlemsstater eller regioner iakttar
    kraven i fråga om brucellos (Brucella melitensis) och erkännande av deras status
    som medlemsstat eller region som är officiellt fri från denna sjukdom (Text
    av betydelse för EES) [delgivet med nr K(2001) 952]'
