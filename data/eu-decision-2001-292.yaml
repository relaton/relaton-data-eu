title:
- language: en
  script: Latn
  content: '2001/292/EC: Commission Decision of 29 March 2001 amending Decision 93/52/EEC
    recording the compliance by certain Member States of regions with the requirements
    relating to brucellosis (Brucella melitensis) and according them the status of
    a Member State or region officially free of the disease (Text with EEA relevance)
    (notified under document number C(2001) 952)'
  type: main
- language: fr
  script: Latn
  content: '2001/292/CE: Décision de la Commission du 29 mars 2001 modifiant la décision
    93/52/CEE constatant le respect par certains États membres ou régions des conditions
    relatives à la brucellose (Brucella melitensis) et leur reconnaissant le statut
    d''État membre ou de région officiellement indemne de cette maladie (Texte présentant
    de l''intérêt pour l''EEE) [notifiée sous le numéro C(2001) 952]'
  type: main
- language: de
  script: Latn
  content: '2001/292/EG: Entscheidung der Kommission vom 29. März 2001 zur Änderung
    der Entscheidung 93/52/EWG zur Feststellung, dass bestimmte Mitgliedstaaten oder
    Gebiete die Bedingungen betreffend die Brucellose (Brucella melitensis) eingehalten
    haben, und zur Anerkennung dieser Mitgliedstaaten oder Gebiete als amtlich brucellosefrei
    (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2001)
    952)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 29 март 2001 година
    за изменение на Решение 93/52/ЕИО за установяване
    на спазването от някои държави-членки или региони
    на изискванията относно бруцелозата (Brucella
    melitensis) и признаването им на статут на държава-членка
    или на регион, официално свободни от тази болест
    (нотифицирано под номер С(2001) 952)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. března 2001, kterým se mění rozhodnutí
    93/52/EHS, kterým se shledává, že některé členské státy nebo oblasti
    splňují podmínky týkající se brucelózy (Brucella melitensis), a přiznává
    se jim status členského státu nebo oblasti úředně prostých této choroby
    (oznámeno pod číslem K(2001) 952)
  type: main
- language: da
  script: Latn
  content: '2001/292/EF: Kommissionens beslutning af 29. marts 2001 om ændring af
    beslutning 93/52/EØF om konstatering af, at bestemte medlemsstater eller regioner
    overholder betingelserne for brucellose (Brucella melitensis), og om anerkendelse
    af deres status som medlemsstat eller region, der er officielt fri for denne sygdom
    (EØS-relevant tekst) (meddelt under nummer K(2001) 952)'
  type: main
- language: el
  script: Grek
  content: '2001/292/ΕΚ: Απόφαση της Επιτροπής, της 29ης
    Μαρτίου 2001, για την τροποποίηση, της απόφασης
    93/52/ΕΟΚ που διαπιστώνει την τήρηση εκ μέρους
    ορισμένων κρατών μελών ή περιοχών των όρων
    σχετικά με την βρουκέλωση (Βrucella melitensis) και
    που τους αναγνωρίζει το καθεστώς κράτους μέλους
    ή περιοχής επίσημα απαλλαγμένης από την ασθένεια
    αυτή (Κείμενο που παρουσιάζει ενδιαφέρον για
    τον ΕΟΧ) [κοινοποιηθείσα υπό τον αριθμό Ε(2001)
    952]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 29. märts 2001, millega muudetakse otsust 93/52/EMÜ
    brutselloosi osas (Brucella melitensis) teatavate liikmesriikide või piirkondade
    nõuetelevastavuse registreerimise kohta ning neile ametlikult haigusvaba liikmesriigi
    või piirkonna staatuse andmise kohta (teatavaks tehtud numbri K(2001) 952 all)
  type: main
- language: fi
  script: Latn
