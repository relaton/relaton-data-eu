    relative aux produits compensateurs ou aux marchandises en l'état pendant le
    deuxième semestre de 1990
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1415/90 DER KOMMISSION vom 28. Mai 1990 mit Saetzen
    von Ausgleichszinsen, die im zweiten Halbjahr 1990 bei Entstehung einer Zollschuld
    fuer Veredelungserzeugnisse oder unveredelte Waren anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1415/90 af 28. maj 1990 om fastsættelse
