  content: Commission Regulation (EC) No 1223/96 of 28 June 1996 amending Regulation
    (EEC) No 2698/93 and (EC) No 1590/94 and fixing the quantities available in the
    pigmeat sector for the period 1 July to 31 December 1996 under the Community tariff
    quotas provided for in the Europe Agreements pursuant to Council Regulation (EC)
    No 3066/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1223/96 de la Commission du 28 juin 1996 modifiant
    les règlements (CEE) nº 2698/93 et (CE) nº 1590/94, et fixant les quantités
    disponibles dans le secteur de la viande de porc, pour la période du 1er juillet
    au 31 décembre 1996, dans le cadre des contingents tarifaires communautaires
    prévus par les accords européens, conformément au règlement (CE) nº 3066/95
    du Conseil
  type: main
- language: de
  script: Latn
