    der im Sektor Schweinefleisch für den Zeitraum 1. Juli bis 31. Dezember 1996
    im Rahmen der in den Europa-Abkommen vorgesehenen gemeinschaftlichen Zollkontingente
    gemäß der Verordnung (EG) Nr. 3066/95 des Rates verfügbaren Mengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1223/96 af 28. juni 1996 om ændring
