title:
- language: en
  script: Latn
  content: '79/394/EEC: Commission Decision of 29 March 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to women''s, girls''and infants''woven overcoats,
    raincoats and other coats, cloaks and capes, jackets and blazers, other than garments
    of category 15 A, of wool, cotton or man-made textile fibres, falling within subheading
    ex 61.02 B of the Common Customs Tariff (NIMEXE codes 61.02-31, 32, 33, 35, 36,
    37, 39, 40) (category 15 B), originating in Poland and in free circulation in
    the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/394/CEE: Décision de la Commission, du 29 mars 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les manteaux, imperméables (y compris
    les capes) et vestes, tissés, pour femmes, fillettes et jeunes enfants, autres
    que les vêtements de la catégorie 15 A, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles, de la sous- position ex 61.02 B du tarif douanier
    commun (codes Nimexe: 61.02-31, 32, 33, 35, 36, 37, 39, 40) catégorie 15 B, originaires
    de la Pologne et mis en libre pratique dans les autres États membres (Les textes
    en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/394/EWG: Entscheidung der Kommission vom 29. März 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Polen stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Mäntel, Umhänge und Jacken aus Geweben, für Frauen,
    Mädchen und Kleinkinder, andere als Kleidung der Kategorie 15 A, der Tarifnummer
    ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.02-31; 32; 33; 35;
    36; 37; 39; 40), Kategorie 15 B, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/394/EØF: Kommissionens beslutning af 29. marts 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage frakker, kapper og slag, jakker og blazere,
    vævede, til kvinder, piger og småbørn, andre end de under kategori 15 A hørende
    varer af uld, bomuld eller kemofibre, som henhører under pos. ex 61.02 B i den
    fælles toldtarif (NIMEXE-nummer 61.02- 31, 32, 33, 35, 36, 37, 39 40 ; kategori
    15 B), har oprindelse i Polen og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/394/CEE: Decisione della Commissione, del 29 marzo 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario cappotti, soprabiti, mantelli e simili,
    e giacche, tessuti, per donna, per ragazza e per bambini, diversi dagli indumenti
    della categoria 15 A, di lana, di cotone o di fibre tessili sintetiche o artificiali
    della sottovoce ex 61.02 B della tariffa doganale comune (codici Nimexe: 61.02-31,
    32, 33, 35, 36, 37, 39, 40 - categoria 15 B), originari della Polonia e messi
    in libera pratica negli altri Stati membri (I testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/394/EEG: Beschikking van de Commissie van 29 maart 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd mantels, regenjassen en andere jassen, capes, blazers en jasjes,
    geweven, andere dan de kledingstukken van categorie 15 A, van wol, van katoen
    of van synthetische of van kunstmatige textielvezels, van post ex 61.02 B van
    het gemeenschappelijk douanetarief (NIMEXE-code 61.02-31, 32, 33, 35, 36, 37,
    39, 40) (categorie 15 B), van oorsprong uit Polen en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
