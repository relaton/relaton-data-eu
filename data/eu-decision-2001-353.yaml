    του προγράμματος-πλαισίου για την προώθηση
    της διεθνούς συνεργασίας στον τομέα της ενέργειας
    (1998-2002) που υπάγεται στο πολυετές πρόγραμμα-πλαίσιο
    για δράσεις στον τομέα της ενέργειας και συναφή
    μέτρα'
  type: main
