title:
- language: en
  script: Latn
  content: '2001/353/EC: Council Decision of 9 April 2001 laying down the new guidelines
    applicable to actions and measures to be taken under the multiannual programme
    to promote international cooperation in the energy sector (1998 to 2002) under
    the multiannual framework programme for actions in the energy sector and connected
    measures'
  type: main
- language: fr
  script: Latn
  content: '2001/353/CE: Décision du Conseil du 9 avril 2001 fixant les nouvelles
    lignes directrices applicables aux actions et mesures à entreprendre au titre
    du programme pluriannuel visant à promouvoir la coopération internationale dans
    le secteur de l''énergie (1998-2002), découlant du programme-cadre pluriannuel
    pour des actions dans le secteur de l''énergie et des mesures connexes'
  type: main
- language: de
  script: Latn
  content: '2001/353/EG: Beschluss des Rates vom 9. April 2001 zur Festlegung der
    neuen Leitlinien für Aktionen und Maßnahmen im Rahmen des Mehrjahresprogramms
    zur Förderung der internationalen Zusammenarbeit im Energiebereich (1998-2002)
    innerhalb des mehrjährigen Rahmenprogramms für Maßnahmen im Energiesektor und
    flankierende Maßnahmen'
  type: main
- language: da
  script: Latn
  content: '2001/353/EF: Rådets afgørelse af 9. april 2001 om fastlæggelse af nye
    retningslinjer, der finder anvendelse på aktioner og foranstaltninger under det
    flerårige program til fremme af det internationale energisamarbejde (1998-2002)
    under det flerårige rammeprogram for aktioner inden for energisektoren og de
    dertil knyttede foranstaltninger'
  type: main
- language: el
  script: Grek
