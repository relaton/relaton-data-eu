title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 786/87 of 19 March 1987 on the sale at prices
    fixed at a standard rate in advance of certain beef from intervention stocks for
    processing in the Community, repealing Regulation (EEC) No 204/87 and amending
    Regulation (EEC) No 2182/77
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 786/87 de la Commission du 19 mars 1987 relatif à
    la vente à prix fixé forfaitairement à l' avance, en vue de leur transformation
    dans la Communauté, de certaines viandes bovines provenant des stocks d' intervention,
    abrogeant le règlement (CEE) n° 204/87 et modifiant le règlement (CEE) n°
    2182/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 786/87 der Kommission vom 19. März 1987 über den
