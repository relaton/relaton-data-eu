    bestimmt ist, zu pauschal im voraus festgesetzten Preisen, zur Aufhebung der Verordnung
    (EWG) Nr. 204/87 und zur Änderung der Verordnung (EWG) Nr. 2182/77
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 786/87 af 19. marts 1987 om salg til
