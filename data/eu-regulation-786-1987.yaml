    provenienti dalle scorte d' intervento e destinate alla trasformazione nella Comunità,
    recante abrogazione del regolamento (CEE) n. 204/87 e che modifica il regolamento
    (CEE) n. 2182/77
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 786/87 van de Commissie van 19 maart 1987 inzake
