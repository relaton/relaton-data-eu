  content: COMMISSION REGULATION (EEC) No 2315/93 of 18 August 1993 re-establishing
    the levying of customs duties on products of categories 5, 20 and 33 (order Nos
    40.0050, 40.0200 and 40.0330), originating in Indonesia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2315/93 de la Commission du 18 août 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 5, 20 et 33 (numéros d'ordre 40.0050, 40.0200 et 40.0330) originaires
    d'Indonésie, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2315/93 DER KOMMISSION vom 18. August 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorien 5, 20 und 33 (laufende Nummern 40.0050,
    40.0200 und 40.0330) mit Ursprung in Indonesien, für die die in der Verordnung
    (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2315/93 af 18. august 1993 om genindførelse
    af opkrævning af told for varer under kategori 5, 20 og 33 (løbenummer 40.0050,
    40.0200 og 40.0330), som har oprindelse i Indonesien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
