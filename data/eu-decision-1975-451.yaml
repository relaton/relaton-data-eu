title:
- language: en
  script: Latn
  content: Commission Decision of 2 April 1975 authorizing the French Republic not
    to apply Community treatment to natural honey, falling within heading No 04.06
    of the Common Customs Tariff, originating in Argentina and Guatemala and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/451/CEE: Décision de la Commission, du 2 avril 1975, autorisant la
    République française à exclure du traitement communautaire le miel naturel
    de la position 04.06 du Tarif douanier commun, originaire de l''Argentine et du
    Guatemala et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '75/456/EWG: BESCHLUSS DES RATES VOM 15. JULI 1975 UEBER DEN ABSCHLUSS
    DES ABKOMMENS ZWISCHEN DER EUROPAEISCHEN WIRTSCHAFTSGEMEINSCHAFT UND DER REPUBLIK
    INDIEN UEBER ROHRZUCKER'
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 2. april 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage naturlig honning, som henhører
    under position 04.06 i den fælles toldtarif, har oprindelse i Argentina og Guatemala,
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 aprile 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario il miele naturale della voce
    n. 04.06 della tariffa doganale comune, originario dell'Argentina e del Guatemala,
    e messo in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 april 1975 waarbij de Franse Republiek
    wordt gemachtigd natuurhonig, van post 04.06 van het gemeenschappelijk douanetarief,
    van oorsprong uit Argentinië en Guatemala en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
