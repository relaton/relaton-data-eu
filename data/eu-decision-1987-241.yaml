  script: Latn
  content: '87/241/EEC: Commission Decision of 8 April 1987 amending Decision 86/301/EEC
    authorizing Member States to permit temporarily the marketing of forest reproductive
    material not satisfying the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '87/241/CEE: Décision de la Commission du 8 avril 1987 modifiant la décision
    86/301/CEE autorisant les États membres à admettre temporairement la commercialisation
    de matériels forestiers de reproduction ne répondant pas aux exigences de la
    directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '87/241/EWG: Entscheidung der Kommission vom 8. April 1987 zur Änderung
    der Entscheidung 86/301/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinie
    66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '87/241/EØF: Kommissionens beslutning af 8. april 1987 om ændring af
    beslutning 86/301/EØF om bemyndigelse af medlemsstaterne til midlertidigt at
    tillade handel med forstligt formeringsmateriale, der ikke opfylder kravene i
    Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '87/241/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Απριλίου
