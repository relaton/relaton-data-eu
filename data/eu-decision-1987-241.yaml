    τα κράτη μέλη να επιτρέψουν προσωρινά την εμπορία
    δασικού πολλαπλασιαστικού υλικού που δεν πληροί
    τις προϋποθέσεις της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '87/241/CEE: Decisione della Commissione dell'' 8 aprile 1987 recante modifica
    della decisione 86/301/CEE che autorizza gli Stati membri ad ammettere temporaneamente
    la commercializzazione di materiali di moltiplicazione di alcune specie forestali
    che non corrispondono alle esigenze della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '87/241/EEG: Beschikking van de Commissie van 8 april 1987 tot wijziging
