    relative allo smercio degli alcoli ottenuti dalle distillazioni di cui agli articoli
    35, 36 e 39 del regolamento (CEE) n. 822/87 e detenuti dagli organismi d'' intervento
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 270/91 VAN DE COMMISSIE van 1 februari 1991 tot
    wijziging van Verordening (EEG) nr. 1780/89 tot vaststelling van de uitvoeringsbepalingen
    voor de afzet van alcohol die is verkregen bij de distillatie als bedoeld in de
    artikelen 35, 36 en 39 van Verordening (EEG) nr. 822/87 en die in het bezit is
    van de interventiebureaus #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 270/91 DA COMISSÃO de 1 de Fevereiro de 1991 que
