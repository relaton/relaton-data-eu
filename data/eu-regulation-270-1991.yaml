title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 270/91 of 1 February 1991 amending Regulation
    (EEC) No 1780/89 laying down detailed rules for the disposal of alcohol obtained
    from the distillation operations referred to in Articles 35, 36 and 39 of Council
    Regulation (EEC) No 822/87 and held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 270/91 DE LA COMMISSION du 1er février 1991 modifiant
    le règlement (CEE) no 1780/89 établissant les modalités d'' application relatives
    à l'' écoulement des alcools obtenus au titre des distillations visées aux
    articles 35, 36 et 39 du règlement (CEE) no 822/87 du Conseil et détenus par
    les organismes d'' intervention #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 270/91 DER KOMMISSION vom 1. Februar 1991 zur Änderung
    der Verordnung (EWG) Nr. 1780/89 mit Durchführungsbestimmungen für den Absatz
    von Alkohol aus der Destillation nach den Artikeln 35, 36 und 39 der Verordnung
    (EWG) Nr. 822/87 des Rates aus Beständen der Interventionsstellen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 270/91 af 1. februar 1991 om ændring
    af forordning (EØF) nr. 1780/89 om gennemførelsesbestemmelser for afsætning
    af alkohol, der er fremstillet i henhold til de i artikel 35, 36 og 39 i forordning
    (EØF) nr. 822/87 omhandlede destillationer, og som interventionsorganerne ligger
    inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 270/91 της Επιτροπής
    της 1ης Φεβρουαρίου 1991 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 1780/89 περί καθορισμού
    των λεπτομερειών εφαρμογής σχετικά με τη διάθεση
    των αλκοολών που λαμβάνονται από τις αποστάξεις
    που αναφέρονται στα άρθρα 35, 36 και 39 του κανονισμού
    (ΕΟΚ) αριθ. 822/87 του Συμβουλίου, που κατέχονται
    από τους οργανισμούς παρέμβασης
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 270/91 DELLA COMMISSIONE del 1o febbraio 1991 recante
