  content: Council Regulation (EEC) No 1371/90 of 21 May 1990 amending Regulations
    (EEC) No 4054/89 allocating, for 1990, Community catch quotas in Greenland waters
    and (EEC) No 4052/89 laying down for 1990 certain measures for the conservation
    and management of fishery resources applicable to vessels registered in the Faroe
    Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1371/90 du Conseil du 21 mai 1990 modifiant le règlement
    (CEE) n° 4054/89 répartissant, pour l'année 1990, les quotas de captures de
    la Communauté dans les eaux du Groenland et le règlement (CEE) n° 4052/89 fixant,
    pour l'année 1990, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires immatriculés aux îles Féroé
  type: main
