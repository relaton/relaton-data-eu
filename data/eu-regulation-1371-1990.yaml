    risorse ittiche da applicare alle navi immatricolate nelle isole Faeroeer
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1371/90 VAN DE RAAD van 21 mei 1990 tot wijziging
