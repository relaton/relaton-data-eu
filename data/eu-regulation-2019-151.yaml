title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/151 of 30 January 2019 renewing
    the approval of the active substance Clonostachys rosea strain J1446 as a low-risk
    active substance in accordance with Regulation (EC) No 1107/2009 of the European
    Parliament and of the Council concerning the placing of plant protection products
    on the market, and amending the Annex to Commission Implementing Regulation (EU)
    No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/151 de la Commission du 30 janvier 2019
    renouvelant l'approbation de la substance active «Clonostachys rosea, souche
    J1446» comme substance active à faible risque, conformément au règlement (CE)
    n° 1107/2009 du Parlement européen et du Conseil concernant la mise sur le marché
    des produits phytopharmaceutiques, et modifiant l'annexe du règlement d'exécution
    (UE) n° 540/2011 de la Commission
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2019/151 der Kommission vom 30. Januar 2019
    zur Erneuerung der Genehmigung für den Wirkstoff Clonostachys rosea Stamm: J1446
    als Wirkstoff mit geringem Risiko gemäß der Verordnung (EG) Nr. 1107/2009 des
    Europäischen Parlaments und des Rates über das Inverkehrbringen von Pflanzenschutzmitteln
    und zur Änderung des Anhangs der Durchführungsverordnung (EU) Nr. 540/2011 der
    Kommission'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/151 на Комисията
    от 30 януари 2019 година за подновяване на одобрението
    на активното вещество Clonostachys rosea — щам J1446,
    като активно вещество с нисък риск в съответствие
    с Регламент (ЕО) № 1107/2009 на Европейския парламент
    и на Съвета относно пускането на пазара на
    продукти за растителна защита и за изменение
    на приложението към Регламент за изпълнение
    (ЕС) № 540/2011 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/151 ze dne 30. ledna 2019, kterým
    se v souladu s nařízením Evropského parlamentu a Rady (ES) č. 1107/2009 o
    uvádění přípravků na ochranu rostlin na trh obnovuje schválení účinné
    látky Clonostachys rosea kmen J1446 jako účinné látky představující nízké
    riziko a mění příloha prováděcího nařízení Komise (EU) č. 540/2011
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/151 af 30. januar 2019
    om fornyelse af godkendelsen af aktivstoffet Clonostachys rosea stamme J1446 som
    et lavrisikoaktivstof, jf. Europa-Parlamentets og Rådets forordning (EF) nr.
    1107/2009 om markedsføring af plantebeskyttelsesmidler, og om ændring af bilaget
    til Kommissionens gennemførelsesforordning (EU) nr. 540/2011
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2019/151 της Επιτροπής,
    της 30ής Ιανουαρίου 2019, για την ανανέωση της
    έγκρισης της δραστικής ουσίας Clonostachys rosea στέλεχος
    J1446, ως δραστικής ουσίας χαμηλού κινδύνου, σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 1107/2009 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου σχετικά με
