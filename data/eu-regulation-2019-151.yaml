    της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2019/151, 30. jaanuar 2019, millega pikendatakse
    toimeaine Clonostachys rosea tüve J1446 kui madala riskiastmega toimeaine heakskiitu
    kooskõlas Euroopa Parlamendi ja nõukogu määrusega (EÜ) nr 1107/2009 taimekaitsevahendite
    turulelaskmise kohta ning muudetakse komisjoni rakendusmääruse (EL) nr 540/2011
    lisa
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2019/151, annettu 30 päivänä
    tammikuuta 2019, tehoaineen Clonostachys rosea kannan J1446 hyväksynnän uusimisesta
    vähäriskisenä tehoaineena kasvinsuojeluaineiden markkinoille saattamisesta
    annetun Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1107/2009 mukaisesti
    ja komission täytäntöönpanoasetuksen (EU) N:o 540/2011 liitteen muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/151 оd 30. siječnja 2019. o produljenju
    odobrenja aktivne tvari Clonostachys rosea soj J1446 kao aktivne tvari niskog
    rizika u skladu s Uredbom (EZ) br. 1107/2009 Europskog parlamenta i Vijeća o
    stavljanju na tržište sredstava za zaštitu bilja te o izmjeni Priloga Provedbenoj
    uredbi Komisije (EU) br. 540/2011
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/151 végrehajtási rendelete (2019. január 30.)
    a Clonostachys rosea J1446 törzs hatóanyagnak mint kis kockázatú hatóanyagnak
    a növényvédő szerek forgalomba hozataláról szóló 1107/2009/EK európai
    parlamenti és tanácsi rendelet szerinti jóváhagyása meghosszabbításáról,
    továbbá az 540/2011/EU bizottsági végrehajtási rendelet mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/151 della Commissione, del 30 gennaio
    2019, che rinnova l'approvazione della sostanza attiva Clonostachys rosea ceppo
    J1446 come sostanza attiva a basso rischio, in conformità al regolamento (CE)
    n. 1107/2009 del Parlamento europeo e del Consiglio relativo all'immissione sul
    mercato dei prodotti fitosanitari, e che modifica l'allegato del regolamento di
    esecuzione (UE) n. 540/2011 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/151 (2019. gada 30. janvāris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1107/2009 par
    augu aizsardzības līdzekļu laišanu tirgū atjauno apstiprinājumu darbīgajai
    vielai Clonostachys rosea (celms J1446) kā zema riska darbīgai vielai un groza
    Komisijas Īstenošanas regulas (ES) Nr. 540/2011 pielikumu
  type: main
- language: lt
  script: Latn
  content: 2019 m. sausio 30 d. Komisijos įgyvendinimo reglamentas (ES) 2019/151,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 dėl
    augalų apsaugos produktų pateikimo į rinką pratęsiamas veikliosios medžiagos
    Clonostachys rosea (padermė J1446), kaip nedidelės rizikos veikliosios medžiagos,
    patvirtinimo galiojimas ir iš dalies keičiamas Komisijos įgyvendinimo reglamento
    (ES) Nr. 540/2011 priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/151 tat-30 ta'
    Jannar 2019 li jġedded l-approvazzjoni tar-razza J1446 tas-sustanza attiva Clonostachys
    rosea bħala sustanza attiva b'riskju baxx skont ir-Regolament (KE) Nru 1107/2009
    tal-Parlament Ewropew u tal-Kunsill dwar it-tqegħid fis-suq ta' prodotti għall-protezzjoni
    tal-pjanti u li jemenda l-Anness tar-Regolament ta' Implimentazzjoni tal-Kummissjoni
    (UE) Nru 540/2011
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/151 van de Commissie van 30 januari 2019
    tot verlenging van de goedkeuring van de werkzame stof Clonostachys rosea stam
    J1446 als een werkzame stof met een laag risico overeenkomstig Verordening (EG)
    nr. 1107/2009 van het Europees Parlement en de Raad betreffende het op de markt
    brengen van gewasbeschermingsmiddelen, en tot wijziging van de bijlage bij Uitvoeringsverordening
    (EU) nr. 540/2011 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/151 z dnia 30 stycznia 2019
    r. w sprawie odnowienia zatwierdzenia substancji czynnej Clonostachys rosea szczep
    J1446 jako substancji czynnej niskiego ryzyka, zgodnie z rozporządzeniem Parlamentu
    Europejskiego i Rady (WE) nr 1107/2009 dotyczącym wprowadzania do obrotu środków
    ochrony roślin, oraz w sprawie zmiany załącznika do rozporządzenia wykonawczego
    Komisji (UE) nr 540/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/151 da Comissão, de 30 de janeiro
    de 2019, que renova a aprovação da substância ativa Clonostachys rosea estirpe
    J1446 como substância ativa de baixo risco, em conformidade com o Regulamento
    (CE) n.° 1107/2009 do Parlamento Europeu e do Conselho relativo à colocação
    dos produtos fitofarmacêuticos no mercado, e que altera o anexo do Regulamento
    de Execução (UE) n.° 540/2011 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/151 al Comisiei din 30 ianuarie
    2019 de reînnoire a aprobării substanței active Clonostachys rosea tulpina
    J1446, ca substanță activă cu risc redus, în conformitate cu Regulamentul
    (CE) nr. 1107/2009 al Parlamentului European și al Consiliului privind introducerea
    pe piață a produselor fitosanitare, și de modificare a anexei la Regulamentul
    de punere în aplicare (UE) nr. 540/2011 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/151 z 30. januára 2019, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009 o
    uvádzaní prípravkov na ochranu rastlín na trh obnovuje schválenie účinnej
    látky Clonostachys rosea kmeň J1446 ako účinnej látky s nízkym rizikom a
    ktorým sa mení príloha k vykonávaciemu nariadeniu Komisie (EÚ) č. 540/2011
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/151 z dne 30. januarja 2019 o obnovitvi
    odobritve aktivne snovi Clonostachys rosea, sev J1446, kot aktivne snovi z majhnim
    tveganjem v skladu z Uredbo (ES) št. 1107/2009 Evropskega parlamenta in Sveta
    o dajanju fitofarmacevtskih sredstev v promet ter o spremembi Priloge k Izvedbeni
    uredbi Komisije (EU) št. 540/2011
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/151 de la Comisión, de 30 de enero
    de 2019, por el que se renueva la aprobación de la sustancia activa Clonostachys
    rosea, cepa J1446, como sustancia activa de bajo riesgo, de conformidad con el
    Reglamento (CE) n.° 1107/2009 del Parlamento Europeo y del Consejo, relativo
    a la comercialización de productos fitosanitarios, y se modifica el anexo del
    Reglamento de Ejecución (UE) n.° 540/2011 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2019/151 av den 30 januari
    2019 om förnyelse av godkännandet av det verksamma ämnet Clonostachys rosea
    stam J1446 som ett verksamt ämne med låg risk i enlighet med Europaparlamentets
    och rådets förordning (EG) nr 1107/2009 om utsläppande av växtskyddsmedel
    på marknaden, och om ändring av bilagan till kommissionens genomförandeförordning
    (EU) nr 540/2011
