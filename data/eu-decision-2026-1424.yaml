    hergestelltem Poly(dimethyloctadecyl[3-(trihydroxysilyl)propyl]ammoniumchlorid
    als alter Wirkstoff zur Verwendung in Biozidprodukten der Produktarten 2, 7 und
    9 gemäß der Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments und des
    Rates
  type: main
