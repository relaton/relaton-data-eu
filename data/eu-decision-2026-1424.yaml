    issu du chlorure de diméthyloctadécyl[3-(triméthoxysilyl)propyl]ammonium en
    tant que substance active existante destinée à être utilisée dans des produits
    biocides relevant des types de produits 2, 7 et 9, conformément au règlement
    (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/1424 der Kommission vom 30. Juni 2026
