title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 285/93 of 9 February 1993 determining to
    what extent applications for import licences for calves not exceeding 80 kilograms
    lodged under Regulation (EEC) No 3619/92 can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 285/93 de la Commission, du 9 février 1993, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au titre du règlement (CEE) n 3619/92 relatif à l'importation
    de veaux n'excédant pas 80 kilogrammes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 285/93 der Kommission vom 9. Februar 1993 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Erteilung von Lizenzen für die Einfuhr
    von höchstens 80 kg wiegenden Rindern gemäß Verordnung (EWG) Nr. 3619/92 stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 285/93 af 9. februar 1993 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importlicenser for kalve
    på ikke over 80 kg i henhold til forordning (EØF) nr. 3619/92 kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 285/93 της Επιτροπής
    της 9ης Φεβρουαρίου 1993 για τον καθορισμό σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που υποβάλλονται,
    βάσει του κανονισμού (ΕΟΚ) αριθ. 3619/92 για την
    εισαγωγή μόσχων που δεν υπερβαίνουν τα 80 χιλιόγραμμα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 285/93 della Commissione, del 9 febbraio 1993, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel quadro del regolamento (CEE) n. 3619/92 per l'importazione di vitelli
    di peso non superiore a 80 chilogrammi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 285/93 van de Commissie van 9 februari 1993 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om afgifte van invoercertificaten
    die zijn ingediend op grond van Verordening (EEG) nr. 3619/92 betreffende de invoer
    van kalveren van maximaal 80 kg
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 285/93 da Comissão, de 9 de Fevereiro de 1993, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados ao abrigo do Regulamento (CEE) nº 3619/92 relativo
    à importação de vitelos de peso não superior a 80 quilogramas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 285/93 de la Comisión, de 9 de febrero de 1993, por
    el que se determina en qué medida se podrá dar curso a las solicitudes de expedición
    de certificados de importación presentadas con arreglo al Reglamento (CEE) n
    3619/92 relativo a las importaciones de terneros cuyo peso no exceda de 80 kilogramos
  type: main
