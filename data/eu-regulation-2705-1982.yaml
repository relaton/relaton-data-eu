title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2705/82 of 7 October 1982 re-establishing
    the levying of customs duties on melamine, falling within subheading 29.35 ex
    Q and originating in Kuwait, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2705/82 de la Commission, du 7 octobre 1982, portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position 29.35 ex Q du tarif douanier commun, originaire du Koweit,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3601/81 du Conseiln
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2705/82 der Kommission vom 7. Oktober 1982 zur Wiedereinführung
    der Erhebung der Zölle für Melamin der Tarifstelle 29.35 ex Q, mit Ursprung
    in Kuweit, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werdenr
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2705/82 af 7. oktober 1982 om genindførelse
    af opkrævning af told for melamin, henhørende under pos. 29.35 ex Q og med oprindelse
    i Kuwait, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2705/82 τής Επιτροπής
    τής 7ης Οκτωβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τή μελαμίνη τής διακρίσεως
    29. 35 ex O τού Κοινού Δασμολογίου, καταγωγής Κουβέιτ,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2705/82 della Commissione, del 7 ottobre 1982, che
