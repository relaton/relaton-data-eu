  content: Commission Regulation (EEC) No 2546/93 of 16 September 1993 fixing the
    difference in white sugar prices to be used in calculating the levy for processed
    fruit and vegetable products and for wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2546/93 de la Commission, du 16 septembre 1993, fixant
