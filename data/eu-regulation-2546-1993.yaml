    dans le secteur des produits transformés à base de fruits et légumes et dans
    le secteur viti-vinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2546/93 der Kommission vom 16. September 1993 zur
    Festsetzung des bei der Berechnung der Abschöpfung für Verarbeitungserzeugnisse
    aus Obst und Gemüse und auf dem Weinsektor zu berücksichtigenden Unterschieds
    zwischen Weißzuckerpreisen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2546/93 af 16. september 1993 om fastsættelse
    af den prisforskel for hvidt sukker, som anvendes ved afgiftsberegningen for produkter
    forarbejdet på basis af frugt og grønsager og for vin
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2546/93 της Επιτροπής
    της 16ης Σεπτεμβρίου 1993 περί καθορισμού της
    διαφοράς των τιμών της λευκής ζάχαρης η οποία
    λαμβάνεται υπόψη για τον υπολογισμό της εισφοράς
    στον τομέα των μεταποιημένων προϊόντων με
    βάση τα οπωροκηπευτικά και στον αμπελοοινικό
    τομέα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2546/93 della Commissione, del 16 settembre 1993,
    che fissa la differenza di prezzo dello zucchero bianco applicabile per il calcolo
    del prelievo nel settore dei prodotti trasformati a base di ortofrutticoli e nel
    settore vitivinicolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2546/93 van de Commissie van 16 september 1993 tot
    vaststelling van het prijsverschil voor witte suiker dat wordt toegepast bij de
    berekening van de heffing in de sector van op basis van groenten en fruit verwerkte
    produkten en in de wijnsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2546/93 da Comissão, de 16 de Setembro de 1993,
    que fixa a diferença de preço do açúcar branco aplicável para o cálculo
    do direito nivelador no sector dos produtos transformados à base de frutos e
    produtos hortícolas e no sector vitivinícola
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2546/93 de la Comisión, de 16 de septiembre de 1993,
