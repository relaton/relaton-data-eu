title:
- language: en
  script: Latn
  content: '96/702/EC: Commission Decision of 26 November 1996 authorizing Member
    States temporarily to take additional measures against the dissemination of Thrips
    palmi Karny as regards the Kingdom of the Netherlands'
  type: main
- language: fr
  script: Latn
  content: '96/702/CE: Décision de la Commission du 26 novembre 1996 autorisant les
    États membres à prendre provisoirement des mesures supplémentaires en vue de
    se protéger contre la propagation de Thrips palmi Karny en provenance du Royaume
    des Pays-Bas'
  type: main
- language: de
  script: Latn
  content: '96/702/EG: Entscheidung Der Kommission vom 26. November 1996 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend zusätzliche Maßnahmen gegen die Verbreitung
    von Thrips palmi Karny hinsichtlich des Königreichs der Niederlande zu treffen'
  type: main
- language: da
  script: Latn
  content: '96/702/EF: Kommissionens Beslutning af 26. november 1996 om bemyndigelse
    af medlemsstaterne til midlertidigt at træffe supplerende foranstaltninger mod
    spredning af Thrips palmi Karny, for så vidt angår Kongeriget Nederlandene'
  type: main
- language: el
  script: Grek
  content: '96/702/ΕΚ: Απόφαση της Επιτροπής της 26ης Νοεμβρίου
    1996 η οποία επιτρέπει προσωρινά στα κράτη μέλη
    να λάβουν πρόσθετα μέτρα κατά της εξάπλωσης
    της Thrips palmi Karny όσον αφορά το Βασίλειο των Κάτω
    Χωρών'
  type: main
- language: fi
  script: Latn
  content: '96/702/EY: Komission päätös, tehty 26 päivänä marraskuuta 1996,
    luvan antamisesta jäsenvaltioille toteuttaa väliaikaisesti Alankomaiden kuningaskuntaa
    koskevia lisätoimenpiteitä Thrips palmi Karny-kasvintuhoojan leviämisen estämiseksi'
  type: main
- language: it
  script: Latn
  content: '96/702/CE: Decisione della Commissione del 26 novembre 1996 che autorizza
    gli Stati membri ad adottare, a titolo provvisorio e relativamente al Regno dei
    Paesi Bassi, misure supplementari contro la propagazione del Thrips palmi Karny'
  type: main
- language: nl
  script: Latn
  content: '96/702/EG: Beschikking van de Commissie van 26 november 1996 tot machtiging
    van de Lid-Staten om ten aanzien van het Koninkrijk der Nederlanden tijdelijk
    aanvullende maatregelen te nemen tegen de verspreiding van Thrips palmi Karny'
  type: main
- language: pt
  script: Latn
  content: '96/702/CE: Decisão da Comissão de 26 de Novembro de 1996 que autoriza
    os Estados-membros a adoptar temporariamente medidas adicionais contra a propagação
    de Thrips palmi Karny no que diz respeito ao Reino dos Países Baixos'
  type: main
- language: es
  script: Latn
  content: '96/702/CE: Decisión de la Comisión de 26 de noviembre de 1996 por la
    que se autoriza temporalmente a los Estados miembros para adoptar, en lo que respecta
    el Reino de los Países Bajos, medidas adicionales contra la propagación de Thrips
    palmi Karny'
  type: main
- language: sv
  script: Latn
  content: '96/702/EG: Kommissionens beslut av den 26 november 1996 om tillstånd
    för medlemsstaterna att tillfälligt vidta ytterligare åtgärder mot spridningen
    av Thrips palmi Karny i fråga om Konungariket Nederländerna'
