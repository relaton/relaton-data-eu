title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 39/96 of 12 January 1996 laying down for
    the first half of 1996 certain detailed rules for the application of a tariff
    quota for live bovine animals weighing between 160 and 300 kilograms originating
    in certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 39/96 de la Commission, du 12 janvier 1996, établissant
    pour le premier semestre de 1996 certaines modalités d'application pour un contingent
    tarifaire d'animaux vivants de l'espèce bovine d'un poids de 160 à 300 kilogrammes,
    originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 39/96 der Kommission vom 12. Januar 1996 zur Festlegung
    bestimmter Durchführungsbestimmungen zu einem Zollkontingent für die Einfuhr
    von lebenden Rindern mit einem Stückgewicht von 160 bis 300 kg mit Ursprung in
    bestimmten Drittländern für das erste Halbjahr 1996
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 39/96 af 12. januar 1996 om gennemførelsesbestemmelser
    for første halvår af 1996 for et toldkontingent for levende kvæg af en vægt
    på 160 til 300 kg med oprindelse i bestemte tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 39/96 της Επιτροπής,
    της 12ης Ιανουαρίου 1996, για τον καθορισμό, για
    το πρώτο εξάμηνο του 1996, ορισμένων λεπτομερειών
    εφαρμογής της δασμολογικής ποσόστωσης ζώντων
    βοοειδών, βάρους 160 έως 300 χιλιογράμμων, καταγωγής
    ορισμένων τρίτων χωρών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 39/96, annettu 12 päivänä tammikuuta 1996,
    kolmansista maista peräisin olevia 160-300 kilogramman painoisia eläviä nautaeläimiä
    koskevan tariffikiintiön soveltamista koskevista tietyistä yksityiskohtaisista
    säännöistä vuoden 1996 ensimmäiseksi vuosipuoliskoksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 39/96 della Commissione, del 12 gennaio 1996, che stabilisce
    modalità di applicazione, per il primo semestre 1996, di un contingente tariffario
    di animali vivi della specie bovina, dai 160 ai 300 chilogrammi, originari di
    taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 39/96 van de Commissie van 12 januari 1996 tot vaststelling,
    voor het eerste halfjaar van 1996, van bepaalde uitvoeringsbepalingen voor een
    tariefcontingent voor levende runderen met een gewicht van 160 tot 300 kg, van
    oorsprong uit bepaalde derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 39/96 da Comissão, de 12 de Janeiro de 1996, que
    estabelece, para o primeiro semestre de 1996, determinadas normas de execução
    relativas a um contingente pautal de bovinos vivos com um peso compreendido entre
    160 e 300 quilogramas, originários de certos países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 39/96 de la Comisión, de 12 de enero de 1996, por
    el que se establecen, para el primer semestre de 1996, determinadas disposiciones
    de aplicación de un contingente arancelario de animales vivos de la especie bovina
    con un peso entre 160 y 300 kilogramos, originarios de determinados terceros países
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 39/96 av den 12 januari 1996 om fastställande
