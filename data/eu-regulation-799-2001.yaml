    de importación presentadas en abril de 2001 de contingentes arancelarios de importación
    de productos del sector de la carne de porcino durante el período comprendido
    entre el 1 de abril y el 30 de junio de 2001
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 799/2001 av den 25 april 2001 om den
    utsträckning i vilken ansökningar om importlicens som inlämnas i april 2001
    skall beviljas inom ramen för tullkvoterna för import av vissa grisköttsprodukter
    under perioden 1 april–30 juni 2001
