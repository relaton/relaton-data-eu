title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 799/2001 of 25 April 2001 determining the
    extent to which applications lodged in April 2001 for import licences under the
    regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 April to 30 June 2001 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 799/2001 de la Commission du 25 avril 2001 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 2001 peuvent être acceptées dans le cadre des contingents tarifaires
    d'importation pour certains produits dans le secteur de la viande de porc pour
    la période du 1er avril au 30 juin 2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 799/2001 der Kommission vom 25. April 2001 über die
    Festsetzung des Umfangs für die im April 2001 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse im Sektor Schweinefleisch für den Zeitraum vom 1.
    April bis zum 30. Juni 2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 799/2001 af 25. april 2001 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i april
    2001 om importlicenser for toldkontingenter for indførsel af bestemte svinekødsprodukter
    for perioden 1. april til 30. juni 2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 799/2001 της Επιτροπής,
    της 25ης Απριλίου 2001, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Απρίλιο 2001 για
    άδειες εισαγωγής, βάσει των καθεστώτων δασμολογικών
    ποσοστώσεων εισαγωγής για ορισμένα προϊόντα
    του τομέα του χοιρείου κρέατος, για την περίοδο
    από την 1η Απριλίου έως τις 30 Ιουνίου 2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 799/2001, annettu 25 päivänä huhtikuuta 2001,
    huhtikuussa 2001 jätettyjen tuontitodistushakemusten hyväksyttävyydestä koskien
    tuontitariffikiintiöiden avaamista ja hallintaa sianliha-alalla tiettyjen tuotteiden
    osalta 1 päivän huhtikuuta ja 30 päivän kesäkuuta 2001 välisellä kaudella
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 799/2001 della Commissione, del 25 aprile 2001, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di aprile 2001 nel quadro dei contingenti tariffari d'importazione
    per taluni prodotti del settore delle carni suine per il periodo dal 1° aprile
    al 30 giugno 2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 799/2001 van de Commissie van 25 april 2001 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten,
    die in april 2001 worden ingediend op grond van de tariefcontingenten voor de
    invoer van bepaalde producten in de varkensvleessector voor de periode van 1 april
    tot en met 30 juni 2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 799/2001 da Comissão, de 25 de Abril de 2001, que
