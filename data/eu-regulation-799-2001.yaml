    apresentados em Abril de 2001 ao abrigo dos contingentes pautais de importação
    para determinados produtos no sector da carne de suíno, para o período compreendido
    entre 1 de Abril e 30 de Junho de 2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 799/2001 de la Comisión, de 25 de abril de 2001, por
