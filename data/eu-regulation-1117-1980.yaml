title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1117/80 of 6 May 1980 re-establishing the
    levying of customs duties on woven labels, chenille yarn, tulle and embroidery,
    products of category 62 (code 0620), originating in South Korea, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2894/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1117/80 de la Commission, du 6 mai 1980, portant rétablissement
    de la perception des droits de douane applicables aux étiquettes, fils de chenille,
    tulles et broderies, de la catégorie de produits n° 62 (code 0620), originaires
    de Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1117/80 der Kommission vom 6. Mai 1980 über die Wiedereinführung
    des Zollsatzes für Etiketten, Chenillegarne, Tülle und Stickereien der Warenkategorie
    Nr. 62 (Kennziffer 0620), mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1117/80 af 6. maj 1980 om genindførelse
    af opkrævning af toldafgifter for vævede etiketter, chenillegarn, tyl og knyttede
    netstoffer og motiver, under varekategori 62 (kode 0620), som har oprindelse i
    Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1117/80 della Commissione, del 6 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle etichette, filati
    di ciniglia, tulli e ricami, della categoria di prodotti n. 62 (codice 0620),
    originari della Corea del Sud beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1117/80 van de Commissie van 6 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op etiketten,
    chenillegaren, tule en borduurwerk, van de categorie van produkten nr. 62 (codenummer
    0620), van oorsprong uit Zuid-Korea waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
