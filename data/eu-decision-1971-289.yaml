title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 16 juillet 1971, autorisant la République
    française à exclure du traitement communautaire l'urée, des positions 29.05
    A I et 31.02 B du Tarif douanier commun, originaire d'Albanie et de Bulgarie et
    mise en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/289/EWG: Entscheidung der Kommission vom 16. Juli 1971, mit der die
    Französische Republik ermächtigt wird, die aus Albanien und Bulgarien stammenden
    und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen Harnstoffe
    der Tarifnummern 29.25 A I und 31.02 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/289/CEE: Decisione della Commissione, del 16 luglio 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario l''urea delle
    voci 29.25 A I e 31.02 B della tariffa doganale comune, originaria dell''Albania
    e della Bulgaria e messa in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/289/EEG: Beschikking van de Commissie van 16 juli 1971 waarbij de Republiek
    Frankrijk wordt gemachtigd ureum van de posten 29.25 A I en 31.02 B van het gemeenschappelijk
    douanetarief, van oorsprong uit Albanië en Bulgarije en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
