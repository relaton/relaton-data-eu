title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1754/68 du Conseil, du 5 novembre 1968, portant suspension
    totale et temporaire du droit autonome du tarif douanier commun sur les peaux
    d'ovins, préparées, autres que celles des n° 41.06 à 41.08 inclus, autres
    peaux, simplement tannées de la sous- position 41.03 BI
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1754/68 des Rates vom 5. November 1968 über die zeitweilige
    vollständige Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für
    Schaf- und Lammleder, ausgenommen Leder der Tarifnummern 41.06 bis 41.08, anderes
    Leder, nur gegerbt, der Tarifstelle 41.03 B I
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1754/68 del Consiglio, del 5 novembre 1968, relativo
    alla sospensione totale e temporanea del dazio autonomo della tariffa doganale
    comune sulle pelli ovine, preparate, escluse quelle delle voci dal n. 41.06 al
    n. 41.08 incluso, altre pelli, semplicemente conciate, della sottovoce 41.03 B
    I
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1754/68 van de Raad van 5 november 1968 houdende
    volledige en tijdelijke schorsing van het autonome recht van het gemeenschappelijk
    douanetarief voor schapenleder, alsmede voorgelooide huiden en vellen, van schapen,
    met uitzondering van de produkten bedoeld bij de posten 41.06 tot en met 41.08,
    andere, huiden en vellen, voorgelooid of enkel gelooid, van onderverdeling 41.03
    B I
  type: main
