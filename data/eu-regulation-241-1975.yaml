title:
- language: en
  script: Latn
  content: Regulation (EEC) No 241/75 of the Council of 30 January 1975 extending
    the treatment applicable to certain agricultural products originating in the Associated
    African States, Madagascar and Mauritius, in the overseas countries and territories,
    and in the United Republic of Tanzania, the Republic of Uganda and the Republic
    of Kenya
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 241/75 du Conseil, du 30 janvier 1975, prorogeant
    le régime applicable à certains produits agricoles originaires des États africains,
    malgache et mauricien associés, des pays et territoires d'outre-mer et originaires
    de la République unie de Tanzanie, de la République de l'Ouganda et de la République
    du Kenya
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 241/75 des Rates vom 30. Januar 1975 zur Verlängerung
    der Regelung für bestimmte landwirtschaftliche Erzeugnisse mit Ursprung in den
    assoziierten afrikanischen Staaten, Madagaskar und Mauritius, den überseeischen
    Ländern und Gebieten und mit Ursprung in der Vereinigten Republik Tansania, der
    Republik Uganda und der Republik Kenia
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 241/75 af 30. januar 1975 om forlængelse
    af den ordning, der finder anvendelse for visse landbrugsprodukter med oprindelse
    i de associerede afrikanske stater, Madagascar og Mauritius, de oversøiske lande
    og territorier, og med oprindelse i Den forenede republik Tanzania, republikken
    Uganda og republikken Kenya
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 241/75 del Consiglio, del 30 gennaio 1975, relativo
    alla proroga del regime da applicare ad alcuni prodotti agricoli originari degli
    Stati africani, malgascio e mauriziano associati, dei paesi e territori d'oltremare,
    e originari della Repubblica unita di Tanzania, della Repubblica dell'Uganda e
    della Repubblica del Kenya
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 241/75 van de Raad van 30 januari 1975 houdende verlenging
    van de regeling welke van toepassing is op bepaalde landbouwprodukten van oorsprong
    uit de geassocieerde Afrikaanse staten, Madagaskar en Mauritius, de landen en
    gebieden overzee, of van oorsprong uit de Verenigde Republiek Tanzanië, de Republiek
    Oeganda en de Republiek Kenia
  type: main
