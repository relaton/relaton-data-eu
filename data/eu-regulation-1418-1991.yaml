    von Waren, die für bestimmte Arten von Luft- und Wasserfahrzeugen oder Bohr-
    oder Förderplattformen bestimmt sind, zur abgabenbegünstigten Einfuhr aufgrund
    ihrer besonderen Verwendung #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1418/91 af 15. maj 1991 om ændring
