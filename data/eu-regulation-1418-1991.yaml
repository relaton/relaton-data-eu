  script: Latn
  content: Commission Regulation (EEC) No 1418/91 of 15 May 1991 amending Regulation
    (EEC) No 4141/87 determining the conditions under which goods for certain categories
    of aircraft, ships or drilling or production platforms are eligible on import
    for a favourable tariff arrangement by reason of their end-use
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1418/91 DE LA COMMISSION du 15 mai 1991 modifiant
    le règlement (CEE) no 4141/87 déterminant les conditions d'' admission de produits
    destinés à certaines catégories d'' aéronefs, de bateaux ou aux plates-formes
    de forage ou d'' exploitation au bénéfice d'' un régime tarifaire favorable
    à l'' importation en raison de leur destination particulière #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1418/91 DER KOMMISSION vom 15. Mai 1991 zur Änderung
