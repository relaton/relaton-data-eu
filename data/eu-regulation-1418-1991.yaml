    til toldlempelser ved indførsel af varer, bestemt til visse fly- eller skibskategorier
    eller til bore- eller produktionsplatforme, for hvilke der er foreskrevet et særligt
    anvendelsesformål
  type: main
- language: el
  script: Grek
