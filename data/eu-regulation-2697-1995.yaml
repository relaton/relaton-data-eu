  script: Latn
  content: Commission Regulation (EC) No 2697/95 of 21 November 1995 laying down rates
    of compensatory interest applicable during the first half of 1996 to customs debts
    incurred in relation to compensating products or goods in the unaltered state
    (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
