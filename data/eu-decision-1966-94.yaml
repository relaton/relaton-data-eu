title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1965, portant octroi d'un contingent
    tarifaire au Royaume de Belgique et au Grand-Duché de Luxembourg pour les cubes,
    plaques, feuilles et bandes en liège naturel, y compris les cubes ou carrés
    pour la fabrication de bouchons
  type: main
- language: de
  script: Latn
  content: '66/94/EWG: Entscheidung der Kommission vom 22. Dezember 1965 über die
    Gewährung eines Zollkontingents für Würfel, Platten, Blätter und Streifen
    aus Naturkork, einschließlich Würfel oder Quader zur Herstellung von Stopfen,
    an das Königreich Belgien und an das Großherzogtum Luxemburg'
  type: main
- language: it
  script: Latn
  content: '66/94/CEE: Decisione della Commissione, del 22 dicembre 1965, relativa
    alla concessione di un contingente tariffario al Regno del Belgio e al Granducato
    del Lussemburgo per i cubi, lastre, fogli e strisce di sughero naturale, compresi
    i cosiddetti cubi o quadretti per la fabbricazione dei turaccioli'
  type: main
- language: nl
  script: Latn
  content: '66/94/EEG: Beschikking van de Commissie van 22 december 1965 houdende
    toekenning van een tariefcontingent aan het Koninkrijk België en het Groothertogdom
    Luxemburg voor blokken, platen, bladen, vellen en strippen, van natuurkurk, blokjes
    voor het vervaardigen van kurken (stoppen) daaronder begrepen'
  type: main
