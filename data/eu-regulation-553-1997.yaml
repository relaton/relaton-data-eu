title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 553/97 of 24 March 1997 amending Regulation
    (EC) No 1981/94 opening and providing for the administration of Community tariff
    quotas for certain products originating in Algeria, Cyprus, Egypt, Israel, Jordan,
    Malta, Morocco, the West Bank and the Gaza Strip, Tunisia and Turkey, and providing
    detailed rules for extending and adapting these tariff quotas, and amending Regulation
    (EC) No 934/95 establishing tariff ceilings and a Community statistical surveillance
    in the framework of reference quantities for a certain number of products originating
    in Cyprus, Egypt, Jordan, Israel, Tunisia, Syria, Malta, Morocco and the West
    Bank and the Gaza Strip
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 553/97 du Conseil du 24 mars 1997 modifiant le règlement
    (CE) nº 1981/94, portant ouverture et mode de gestion de contingents tarifaires
    communautaires pour certains produits originaires d'Algérie, de Chypre, d'Égypte,
    d'Israël, de Jordanie, de Malte, du Maroc, de Cisjordanie et de la Bande de Gaza,
    de Tunisie et de Turquie, ainsi que les modalités de prorogation ou d'adaptation
    desdits contingents, et modifiant le règlement (CE) nº 934/95, portant établissement
    de plafonds tarifaires et d'une surveillance statistique communautaire dans le
    cadre de quantités de référence pour un certain nombre de produits originaires
    de Chypre, d'Égypte, de Jordanie, d'Israël, de Tunisie, de Syrie, de Malte,
    du Maroc et de Cisjordanie et de la Bande de Gaza
  type: main
