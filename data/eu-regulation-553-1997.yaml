    quantitativi di riferimento per taluni prodotti originari di Cipro, dell'Egitto,
    della Giordania, di Israele, della Tunisia, della Siria, di Malta, del Marocco
    e della Cisgiordania e della Striscia di Gaza
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 553/97 van de Raad van 24 maart 1997 tot wijziging
    van Verordening (EG) nr. 1981/94 betreffende de opening en wijze van beheer van
    communautaire tariefcontingenten voor bepaalde producten van oorsprong uit Algerije,
    Cyprus, Egypte, Israël, Jordanië, Malta, Marokko, de Westelijke Jordaanoever
    en de Gazastrook, Tunesië en Turkije alsmede de voorwaarden voor de verlenging
    of aanpassing van die contingenten, en tot wijziging van Verordening (EG) nr.
    934/95 tot instelling van tariefplafonds en een communautair statistisch toezicht
