  script: Latn
  content: Regulamento (CE) nº 553/97 do Conselho de 24 de Março de 1997 que altera
    o Regulamento (CE) nº 1981/94 do Conselho, relativo à abertura e modo de gestão
    de contingentes pautais comunitários para determinados produtos originários
    da Argélia, de Chipre, do Egipto, de Israel, da Jordânia, de Malta, de Marrocos,
    da Cisjordânia e da Faixa de Gaza, da Tunísia e da Turquia e que estabelece
    as regras de prorrogação ou de adaptação dos referidos contingentes, e que
    altera o Regulamento (CE) nº 934/95 do Conselho, que estabelece limites máximos
    pautais e uma vigilância estatística comunitária no âmbito de quantidades
    de referência para determinados produtos originários de Chipre, do Egipto, da
    Jordânia, de Israel, da Tunísia, da Síria, de Malta, de Marrocos e da Cisjordânia
    e da Faixa de Gaza
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 553/97 del Consejo de 24 de marzo de 1997 que modifica
