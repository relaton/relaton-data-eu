    arancelarios comunitarios para determinados productos originarios de Argelia,
    Chipre, Egipto, Israel, Jordania, Malta, Marruecos, los territorios ocupados,
    Túnez y Turquía así como a las modalidades de prórroga o adaptación de dichos
    contingentes, y que modifica el Reglamento (CE) nº 934/95 por el que se establecen
    límites máximos arancelarios y una vigilancia estadística comunitaria en el
    marco de las cantidades de referencia para un determinado número de productos
    originarios de Chipre, de Egipto, de Jordania, de Israel, de Túnez, de Siria,
    de Malta, de Marruecos y de los territorios ocupados
  type: main
