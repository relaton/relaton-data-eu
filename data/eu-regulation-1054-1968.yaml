title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1054/68 of the Commission of 23 July 1968 determining
    the list of agencies certifying the admissibility to certain tariff headings of
    certain milk products from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1054/68 de la Commission, du 23 juillet 1968, établissant
    la liste des organismes émetteurs de certificats destinés à permettre l' admission
    de certains produits laitiers en provenance des pays tiers dans certaines positions
    tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1054/68 der Kommission vom 23. Juli 1968 zur Festlegung
    der Liste der Stellen für die Erteilung von Bescheinigungen für die Zulassung
    bestimmter Milcherzeugnisse aus dritten Ländern zu bestimmten Tarifnummern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1054/68 af 23. juli 1968 om oprettelse
    af en fortegnelse over de organer, der er kompetente til at udstede certifikater
    vedrørende visse fra tredjelande indførte mejeriprodukters henførsel under
    bestemte toldpositioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1054/68 τής Επιτροπής
