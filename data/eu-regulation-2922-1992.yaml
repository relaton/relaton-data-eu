title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2922/92 of 7 October 1992 on the rate of
    interest to be used for calculating the costs of financing intervention measures
    comprising buying-in, storage and disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2922/92 de la Commission, du 7 octobre 1992, fixant
    les taux d' intérêt à appliquer pour le calcul des frais de financement des
    interventions consistant en achat, stockage et écoulements
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2922/92 der Kommission vom 7. Oktober 1992 zur Festsetzung
    des bei der Berechnung der Finanzierungskosten für Interventionen in Form von
    Ankauf, Lagerung und Absatz anzuwendenden Zinssatzes
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2922/92 af 7. oktober 1992 om fastsættelse
    af den rentesats, der skal anvendes ved beregningen af finansieringsomkostninger
    i forbindelse med interventioner i form af opkøb, oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2922/92 της Επιτροπής
    της 7ης Οκτωβρίου 1992 περί καθορισμού των επιτοκίων
    που εφαρμόζονται για τον υπολογισμό των δαπανών
    χρηματοδοτήσεως των παρεμβάσεων που συνίστανται
    σε αγορά, αποθεματοποίηση και διάθεση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2922/92 della Commissione, del 7 ottobre 1992, che
    stabilisce i tassi d' interesse da applicare nel calcolo delle spese per il finanziamento
    degli interventi comportanti acquisto, magazzinaggio e smercio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2922/92 van de Commissie van 7 oktober 1992 tot vaststelling
    van de bij de berekening van de financieringskosten van de interventies in de
    vorm van aankoop, opslag en afzet toe te passen rentevoeten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2922/92 da Comissão, de 7 de Outubro de 1992, que
    fixa as taxas de juro a aplicar no cálculo das despesas de financiamento das
    intervenções que consistem na compra, armazenagem e escoamentos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2922/92 de la Comisión, de 7 de octubre de 1992,
    por el que se fijan los tipos de interés que habrán de aplicarse para calcular
    los gastos de financiación de las intervenciones consistentes en operaciones
    de compra, almacenamiento y salida
  type: main
