title:
- language: en
  script: Latn
  content: '79/861/EEC: Commission Decision of 3 October 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to yarn of discontinuous or waste synthetic fibres,
    not put up for retail sale, falling within subheading 56.05 A of the Common Customs
    Tariff (NIMEXE codes 56.05-03, 05, 07, 09, 11, 13, 15, 19, 21, 23, 25, 28, 32,
    34, 36, 38, 39, 42, 44, 45, 46, 47) (category 22), originating in Singapore and
    in free circulation in the other Member States (Only the French and Dutch texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/861/CEE: Décision de la Commission, du 3 octobre 1979, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les fils de fibres textiles synthétiques
    discontinues non conditionnés pour la vente au détail, de la sous-position 56.05
    A du tarif douanier commun (codes Nimexe: 56.05-03, 05, 07, 09, 11, 13, 15, 19,
    21, 23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46, 47) (catégorie 22), originaires
    de Singapour et mis en libre pratique dans les autres États membres (Les textes
    en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/861/EWG: Entscheidung der Kommission vom 3. Oktober 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Singapur stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Garne aus synthetischen Spinnfasern, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifstelle 56.05 A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    56.05-03 ; 05 ; 07 ; 09 ; 11 ; 13 ; 15 ; 19 ; 21 ; 23 ; 25 ; 28 ; 32 ; 34 ; 36
    ; 38 ; 39 ; 42 ; 44 ; 45 ; 46 ; 47) (Kategorie 22) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/861/EØF: Kommissionens beslutning af 3. oktober 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage garn af korte syntetiske fibre, eller
    af affald af kemofibre, ikke detailsalgsoplægninger, som henhører under pos.
    56.05 A i den fælles toldtarif (NIMEXE-nummer 56.05-03, 05, 07, 09, 11, 13, 15,
    19, 21, 23, 25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46, 47) kategori 22, har oprindelse
    i Singapore og frit kan omsættes i de øvrige medlemsstater (Kun den franske
    og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/861/CEE: Decisione della Commissione, del 3 ottobre 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i filati di fibre sintetiche in fiocco,
    non preparati per la vendita al minuto, della sottovoce 56.05 A della tariffa
    doganale comune (codici Nimexe : 56.05-03, 05, 07, 09, 11, 13, 15, 19, 21, 23,
    25, 28, 32, 34, 36, 38, 39, 42, 44, 45, 46, 47), categoria 22, originari di Singapore
    e messi in libera pratica negli altri Stati membri (I testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/861/EEG: Beschikking van de Commissie van 3 oktober 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd garens van synthetische stapelvezels, niet bestemd voor de verkoop
    in het klein, van post 56.05 A van het gemeenschappelijk douanetarief (NIMEXE-code
    56.05-03, 05, 07, 09, 11, 13, 15, 19, 21, 23, 25, 28, 32, 34, 36, 38, 39, 42,
    44, 45, 46, 47) (categorie 22), van oorsprong uit Singapore en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
