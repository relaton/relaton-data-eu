    przywóz wymogowi rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2023/712 da Comissão de 30 de março de
    2023 que inicia um reexame, relativo a um «novo exportador», do Regulamento
    de Execução (UE) 2017/2230 que institui um direito anti-dumping definitivo sobre
    as importações de ácido tricloro-isocianúrico originário da República Popular
    da China no que diz respeito a um produtor-exportador chinês, que revoga o direito
    no que respeita às importações provenientes desse produtor-exportador e que
    sujeita essas importações a registo
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2023/712 al Comisiei din 30 martie
    2023 de deschidere a unei reexaminări în ceea ce privește un nou exportator
    a Regulamentului de punere în aplicare (UE) 2017/2230 de instituire a unei taxe
    antidumping definitive la importurile de acid tricloroizocianuric originare din
    Republica Populară Chineză pentru un producător-exportator chinez, de abrogare
    a taxei cu privire la importurile provenite de la respectivul producător-exportator
    și de impunere a obligativității de înregistrare a acestor importuri
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2023/712 z 30. marca 2023, ktorým
    sa začína revízne prešetrovanie týkajúce sa „nového vývozcu“ v súvislosti
    s vykonávacím nariadením (EÚ) 2017/2230, ktorým sa ukladá konečné antidumpingové
    clo na dovoz kyseliny trichlórizokyanurovej s pôvodom v Čínskej ľudovej republike,
    v prípade jedného čínskeho vyvážajúceho výrobcu, zrušuje sa clo na dovoz
    od uvedeného vyvážajúceho výrobcu a zavádza sa registrácia tohto dovozu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2023/712 z dne 30. marca 2023 o začetku
    pregleda v zvezi z „novim izvoznikom“ v okviru Izvedbene uredbe (EU) 2017/2230
    o uvedbi dokončne protidampinške dajatve na uvoz triklorizocianurne kisline
    s poreklom iz Ljudske republike Kitajske za enega kitajskega proizvajalca izvoznika,
    odpravi dajatve na uvoz navedenega proizvajalca izvoznika in uvedbi registracije
    takšnega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2023/712 de la Comisión de 30 de marzo de
    2023 por el que se inicia una reconsideración para un «nuevo exportador» del
    Reglamento de Ejecución (UE) 2017/2230, por el que se establece un derecho antidumping
    definitivo sobre las importaciones de ácido tricloroisocianúrico originario
    de la República Popular China, con respecto a un productor exportador chino,
    y por el que se deroga el derecho aplicable a las importaciones de dicho productor
    exportador y se someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2023/712 av den 30 mars 2023
    om inledande av en översyn avseende ny exportör av genomförandeförordning
    (EU) 2017/2230 om införande av en slutgiltig antidumpningstull på import av
    triklorisocyanursyra med ursprung i Folkrepubliken Kina, avseende en exporterande
    kinesisk tillverkare, samt om upphävande av tullen på import från den exporterande
    tillverkaren och om registrering av denna import
  type: main
