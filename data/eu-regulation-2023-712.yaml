    (ЕС) 2017/2230 на Комисията за налагане на окончателно
    антидъмпингово мито върху вноса на трихлороизоцианурова
    киселина с произход от Китайската народна
    република за един китайски производител износител,
    за отмяна на митото по отношение на вноса от
    този производител износител и за въвеждане
    на регистрационен режим за този внос
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2023/712 ze dne 30. března 2023,
    kterým se zahajuje pro „nového vývozce“ přezkum prováděcího nařízení
    (EU) 2017/2230 o uložení konečného antidumpingového cla z dovozu kyseliny
    trichlorisokyanurové pocházející z Čínské lidové republiky pro jednoho
    čínského vyvážejícího výrobce, zrušuje clo na dovoz uvedeného vyvážejícího
    výrobce a zavádí celní evidence tohoto dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2023/712 af 30. marts 2023
    om indledning af en fornyet undersøgelse (ny eksportør) af gennemførelsesforordning
    (EU) 2017/2230 om indførelse af en endelig antidumpingtold på importen af trichlorisocyanursyre
