    tullin kumoamisesta ja tällaisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2023/712 ón gCoimisiún an 30 Márta
    2023 lena dtionscnaítear athbhreithniú “onnmhaireora nua” i ndáil le Rialachán
    Cur Chun Feidhme (AE) 2017/2230 lena bhforchuirtear dleacht frithdhumpála chinntitheach
    ar allmhairí aigéid thríchlóraisicianúraigh de thionscnamh Dhaon-Phoblacht
    na Síne, ar athbhreithniú é le haghaidh táirgeoir onnmhairiúcháin amháin
    de chuid na Síne, agus lena n-aisghairtear an dleacht maidir le hallmhairí ón
    táirgeoir onnmhairiúcháin sin agus lena gcuirtear na hallmhairí sin faoi réir
    a gcláraithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2023/712 od 30. ožujka 2023. o pokretanju
    revizije Provedbene uredbe (EU) 2017/2230 o uvođenju konačne antidampinške
    pristojbe na uvoz trikloroizocijanurne kiseline podrijetlom iz Narodne Republike
    Kine za jednog kineskog proizvođača izvoznika (revizija „novog izvoznika”),
    kojom se stavlja izvan snage pristojba s obzirom na uvoz tog proizvođača izvoznika
    i uvodi evidentiranje tog uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/712 végrehajtási rendelete (2023. március 30.)
    a Kínai Népköztársaságból származó triklór-izocianursav behozatalára
    végleges dömpingellenes vám kivetéséről szóló (EU) 2017/2230 végrehajtási
    rendelet egy kínai exportáló gyártó tekintetében új exportőrre vonatkozó
    felülvizsgálatának megindításáról, a szóban forgó exportáló gyártótól
    származó behozatalra vonatkozó vám eltörléséről, valamint az e behozatalra
    vonatkozó nyilvántartásba vételi kötelezettségről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2023/712 della Commissione del 30 marzo
    2023 che apre un riesame relativo ai «nuovi esportatori» del regolamento di
    esecuzione (UE) 2017/2230 che istituisce un dazio antidumping definitivo sulle
    importazioni di acido tricloroisocianurico originario della Repubblica popolare
    cinese per un produttore esportatore cinese, abroga il dazio in vigore sulle importazioni
    di tale produttore esportatore e dispone la registrazione di dette importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2023/712 (2023. gada 30. marts), ar
    kuru saistībā ar jaunu eksportētāju sāk pārskatīt Īstenošanas regulu
    (ES) 2017/2230, ar ko nosaka galīgo antidempinga maksājumu Ķīnas Tautas Republikas
    izcelsmes trihlorizocianūrskābes importam attiecībā uz vienu Ķīnas ražotāju
    eksportētāju, atceļ maksājumu šā ražotāja eksportētāja veiktajam importam
    un nosaka šā importa reģistrāciju
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2023/712 2023 m. kovo 30 d. kuriuo
