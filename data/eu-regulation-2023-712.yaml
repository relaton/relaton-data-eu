  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/712 tat-30
    ta’ Marzu 2023 li jagħti bidu għal rieżami ta’ “esportatur ġdid” tar-Regolament
    ta’ Implimentazzjoni (UE) 2017/2230 li jimponi dazju anti-dumping definittiv
    fuq l-importazzjonijiet ta’ aċidu triklorojsoċjanuriku li joriġinaw mir-Repubblika
    tal-Poplu taċ-Ċina għal produttur esportatur Ċiniż wieħed, li jħassar id-dazju
    fir-rigward tal-importazzjonijiet minn dak il-produttur esportatur u li jagħmel
    dawn l-importazzjonijiet soġġetti għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2023/712 van de Commissie van 30 maart 2023
    tot opening van een nieuw onderzoek ten behoeve van een nieuwe exporteur ten aanzien
    van Uitvoeringsverordening (EU) 2017/2230 tot instelling van een definitief antidumpingrecht
    op trichloorisocyanuurzuur van oorsprong uit de Volksrepubliek China voor één
    Chinese producent-exporteur, tot intrekking van het recht ten aanzien van de invoer
