  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2023/712 z dnia 30 marca 2023 r.
    wszczynające przegląd pod kątem nowego eksportera dotyczące rozporządzenia
    wykonawczego (UE) 2017/2230 nakładającego ostateczne cło antydumpingowe na
    przywóz kwasu trichloroizocyjanurowego pochodzącego z Chińskiej Republiki Ludowej
    w odniesieniu do jednego chińskiego producenta eksportującego, uchylające cło
