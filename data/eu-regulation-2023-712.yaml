title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/712 of 30 March 2023 initiating
    a ‘new exporter’ review of Implementing Regulation (EU) 2017/2230 imposing
    a definitive anti-dumping duty on imports of trichloroisocyanuric acid originating
    in the People’s Republic of China for one Chinese exporting producer, repealing
    the duty with regard to imports from that exporting producer and making these
    imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/712 de la Commission du 30 mars 2023
    portant ouverture d’un réexamen au titre de «nouvel exportateur» du règlement
    d’exécution (UE) 2017/2230 instituant un droit antidumping définitif sur les
    importations d’acide trichloro-isocyanurique originaire de la République populaire
    de Chine pour un producteur-exportateur chinois, abrogeant le droit en ce qui
    concerne les importations provenant de ce producteur-exportateur et soumettant
    ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/712 der Kommission vom 30. März 2023
    zur Einleitung einer Neuausführerüberprüfung der Durchführungsverordnung (EU)
    2017/2230 zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren
    von Trichlorisocyanursäure mit Ursprung in der Volksrepublik China für einen
    chinesischen ausführenden Hersteller, zur Außerkraftsetzung des Zolls auf die
    von diesem ausführenden Hersteller stammenden Einfuhren und zur zollamtlichen
    Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2023/712 на Комисията
