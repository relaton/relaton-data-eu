    kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/915/CEE: Decisione della Commissione, del 19 ottobre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di cotone,
