title:
- language: en
  script: Latn
  content: '78/915/EEC: Commission Decision of 19 October 1978 authorizing the French
    Republic not to apply Community treatment to woven fabrics of cotton, other than
    gauze, terry fabrics, narrow woven fabrics, pile fabrics, chenille fabrics, tulle
    and other net fabrics falling within heading No 55.09 of the Common Customs Tariff
    (NIMEXE codes 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29,
    31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65,
    66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93,
    97) originating in South Korea and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/915/CEE: Décision de la Commission, du 19 octobre 1978, autorisant
    la République française à exclure du traitement communautaire les tissus de
    coton, autres que tissus à point de gaze, bouclés du genre éponge, rubanerie,
    velours, peluches, tissus bouclés, tissus de chenille, tulles et tissus à mailles
    nouées de la position 55.09 du tarif douanier commun (codes Nimexe: 55.09-01;
    02; 03; 04; 05; 11; 12; 13; 14; 15; 16; 17; 19; 21; 29; 31; 33; 35; 37; 38; 39;
    41; 49; 51; 52; 53; 54; 55; 56; 57; 59; 61; 63; 64; 65; 66; 67; 68; 69; 70; 71;
    72; 73; 74; 76; 77; 78; 81; 82; 83; 84; 86; 87; 92; 93; 97), originaires de Corée
    du Sud et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/915/EWG: Entscheidung der Kommission vom 19. Oktober 1978, mit der
    die Französische Republik ermáchtigt wird, aus Súdkorea stammende und in den
    úbrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle, andere
    als Drehergewebe, Schlingengewebe (Frottiergewebe), Bánder, Samt, Plúsch, Schlingengewebe,
    Chenillegewebe, Túlle und geknúpfte Netzstoffe, der Tarifnummer 55.09 des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 55.09-01; 02; 03; 04; 05; 11; 12; 13; 14; 15; 16;
    17; 19; 21; 29; 31; 33; 35; 37; 38; 39; 41; 49; 51; 52; 53; 54; 55; 56; 57; 59;
    61; 63; 64; 65; 66; 67; 68; 69; 70; 71; 72; 73; 74; 76; 77; 78; 81; 82; 83; 84;
    86; 87; 92; 93; 97) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/915/EØF: Kommissionens beslutning af 19. oktober 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede stoffer
    af bomuld, bortset fra drejervævet stof af bomuld, frotterstof, vævede bånd,
    fløjls-, plys- og chenillestoffer, tyl og knyttede netstoffer, som henhører
    under pos. 55.09 i den fælles toldtarif (NIMEXE-kode 55.09-01, 02, 03, 04, 05,
    11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52,
