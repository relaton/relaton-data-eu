---
id: EUDecision2000641
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision of 17 October 2000 establishing a secretariat for the
    joint supervisory data-protection bodies set up by the Convention on the Establishment
    of a European Police Office (Europol Convention), the Convention on the Use of
    Information Technology for Customs Purposes and the Convention implementing the
    Schengen Agreement on the gradual abolition of checks at the common borders (Schengen
    Convention)
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil du 17 octobre 2000 portant création d'un secrétariat
    pour les autorités de contrôle communes chargées de la protection des données,
    instituées par la convention portant création d'un office européen de police
    (convention Europol), la convention sur l'emploi de l'informatique dans le domaine
    des douanes et la convention d'application de l'accord de Schengen relatif à
    la suppression graduelle des contrôles aux frontières communes (convention de
    Schengen)
  type: main
- language: de
  script: Latn
  content: Beschluss des Rates vom 17. Oktober 2000 zur Einrichtung einer Geschäftsstelle
    für die Gemeinsamen Kontrollinstanzen für den Datenschutz, die mit dem Übereinkommen
    über die Errichtung eines Europäischen Polizeiamts (Europol-Übereinkommen),
    dem Übereinkommen über den Einsatz der Informationstechnologie im Zollbereich
    und dem Übereinkommen zur Durchführung des Übereinkommens von Schengen betreffend
    den schrittweisen Abbau der Kontrollen an den gemeinsamen Grenzen (Schengener
    Durchführungsübereinkommen) geschaffen wurden
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 17 октомври 2000 година
    за създаване на секретариат на съвместните
    надзорни органи за защита на личните данни,
    учредени с Конвенцията за създаване на Европейско
    полицейско бюро (Конвенцията за Европол), Конвенцията
    за използване на информационните технологии
    за нуждите на митниците и Конвенцията за прилагане
    на Споразумението от Шенген за постепенно
    премахване на контрола по общите граници (Шенгенска
    конвенция)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 17. října 2000, kterým se zřizuje sekretariát
    pro společné kontrolní orgány pověřené ochranou údajů vytvořené Úmluvou
    o zřízení Evropského policejního úřadu (Úmluvou o Europolu), Úmluvou
    o používání informačních technologií pro celní účely a Úmluvou k provedení
    Schengenské dohody o postupném odstraňování kontrol na společných hranicích
    (Schengenskou úmluvou)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse af 17. oktober 2000 om oprettelse af et sekretariat
    for de fælles tilsyns-/kontrolorganer vedrørende databeskyttelse, der er oprettet
    i henhold til konventionen om oprettelse af en europæisk politienhed (Europol-konventionen),
    konventionen om brug af informationsteknologi på toldområdet og konventionen
    om gennemførelse af Schengen-aftalen om gradvis ophævelse af kontrollen ved
    de fælles grænser (Schengen-konventionen)
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου, της 17ης Οκτωβρίου
    2000, για τη σύσταση γραμματείας των κοινών ελεγκτικών
    αρχών προστασίας των δεδομένων, που έχουν συσταθεί
    από τη σύμβαση για τη δημιουργία ευρωπαϊκής
    αστυνομικής υπηρεσίας (σύμβαση Ευρωπόλ), τη
    σύμβαση σχετικά με τη χρησιμοποίηση της τεχνολογίας
    των πληροφοριών στον τομέα των τελωνείων και
    τη σύμβαση εφαρμογής της συμφωνίας του Σένγκεν
    σχετικά με τη σταδιακή κατάργηση των ελέγχων
    στα κοινά σύνορα (σύμβαση Σένγκεν)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 17. oktoober 2000, millega asutatakse Euroopa Politseiameti
    loomise konventsiooni (Europoli konventsiooni), infotehnoloogia tollialase kasutamise
    konventsiooni ja ühispiiridel kontrolli järkjärgulist kaotamist käsitleva
    Schengeni lepingu rakenduskonventsiooniga (Schengeni konventsiooniga) loodud andmekaitse
    ühiste järelevalveorganite sekretariaat
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös, tehty 17 päivänä lokakuuta 2000, Euroopan poliisiviraston
    perustamisesta tehdyllä yleissopimuksella (Europol-yleissopimus), tietotekniikan
    käyttöä tullialalla koskevalla yleissopimuksella sekä tarkastusten asteittaisesta
    lakkauttamisesta yhteisillä rajoilla tehdyn Schengenin sopimuksen soveltamisesta
    tehdyllä yleissopimuksella (Schengenin yleissopimus) perustettujen yhteisten
    tietosuojan valvontaviranomaisten sihteeristön perustamisesta
  type: main
- language: hr
  script: Latn
  content: '2000/641/PUP: Odluka Vijeća od 17. listopada 2000. o osnivanju tajništva
    za zajednička nadzorna tijela vezana za zaštitu podataka osnovana Konvencijom
    o osnivanju Europskog policijskog ureda (Konvencija o Europolu), Konvencijom o
    uporabi informacijske tehnologije u carinske svrhe i Konvencijom o provedbi Schengenskog
    sporazuma o postupnom ukidanju kontrola na zajedničkim granicama (Schengenska
    konvencija)'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (2000. október 17.) az Európai Rendőrségi Hivatal
    létrehozásáról szóló egyezménnyel (Europol Egyezmény), az informatika
    vámügyi alkalmazásáról szóló egyezménnyel és a közös határokon történő
    ellenőrzések fokozatos megszüntetéséről szóló Schengeni Megállapodás
    végrehajtásáról szóló egyezménnyel (Schengeni Egyezmény) létrehozott
    közös adatvédelmi ellenőrző hatóságok titkárságának létrehozásáról
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio, del 17 ottobre 2000, che istituisce un segretariato
    delle autorità di controllo comuni preposte alla protezione dei dati istituite
    dalla convenzione che istituisce un ufficio europeo di polizia (convenzione Europol),
    dalla convenzione sull'uso dell'informatica nel settore doganale e dalla convenzione
    di applicazione dell'accordo di Schengen relativo all'eliminazione graduale dei
    controlli alle frontiere comuni (convenzione di Schengen)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (2000. gada 17. oktobris) ar ko izveido sekretariātu apvienotajām
    datu aizsardzības uzraudzības iestādēm, kuras izveidotas ar Konvenciju par
    Eiropas Policijas biroja izveidi (Eiropola Konvenciju), Konvenciju par informācijas
    tehnoloģijas izmantošanu muitas vajadzībām un Konvenciju, ar ko īsteno Šengenas
    Līgumu par kontroles pakāpenisku atcelšanu pie kopīgajām robežām (Šengenas
    Konvenciju)
  type: main
- language: lt
  script: Latn
  content: 2000 m. spalio 17 d. Tarybos sprendimas dėl jungtinių priežiūros duomenų
    apsaugos institucijų, įsteigtų pagal Konvenciją dėl Europos policijos biuro
    įsteigimo (Europolo konvenciją), Konvenciją dėl informacinių technologijų
    naudojimo muitinės tikslais bei Konvenciją dėl Šengeno susitarimo dėl laipsniško
    bendrų sienų kontrolės panaikinimo įgyvendinimo (Šengeno konvenciją), sekretoriato
    įsteigimo
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tas-17 Ottubru 2000 li tistabbilixxi segretarjat
    għall-korpi konġunti tas-sorveljanza tal-protezzjoni tad-data stabbiliti mill-Konvenzjoni
    dwar l-Istabbiliment ta' Uffiċċju tal-Pulizija Ewropea (Konvenzjoni Europol),
    il-Konvenzjoni dwar l-Użu tat-Teknoloġija ta' l-Informazzjoni għall-Għanijiet
    ta' Dwana u l-Konvenzjoni li timplimenta l-Ftehim ta' Schengen dwar l-abolizzjoni
    gradwali ta' investigazzjoni fil-fruntieri komuni (Konvenzjoni ta' Schengen)
  type: main
- language: nl
  script: Latn
  content: Besluit van de Raad van 17 oktober 2000 tot oprichting van een secretariaat
    voor de gemeenschappelijke controleorganen voor gegevensbescherming ingesteld
    bij de Overeenkomst tot oprichting van een Europese Politiedienst (Europolovereenkomst),
    de Overeenkomst inzake het gebruik van informatica op douanegebied en de Overeenkomst
    ter uitvoering van het te Schengen gesloten akkoord betreffende de geleidelijke
    afschaffing van de controles aan de gemeenschappelijke grenzen (Schengenovereenkomst)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady z dnia 17 października 2000 r. ustanawiająca sekretariat
    dla wspólnych organów nadzoru ochrony danych utworzony na podstawie Konwencji
    w sprawie ustanowienia Europejskiego Urzędu Policji (Konwencja o Europolu), Konwencji
    w sprawie wykorzystania technologii informatycznych dla potrzeb celnych oraz Konwencji
    wykonawczej do Układu z Schengen w sprawie stopniowego znoszenia kontroli na
    wspólnych granicach (Konwencja z Schengen)
  type: main
- language: pt
  script: Latn
  content: Decisão do Conselho, de 17 de Outubro de 2000, que cria um Secretariado
    dos órgãos comuns de controlo da protecção de dados instituídos pela Convenção
    que cria um Serviço Europeu de Polícia (Convenção Europol), a Convenção
    sobre a utilização da informática no domínio aduaneiro e a Convenção de
    aplicação do Acordo de Schengen relativo à supressão gradual dos controlos
    nas fronteiras comuns (Convenção de Schengen)
  type: main
- language: ro
  script: Latn
  content: Decizia Consiliului din 17 octombrie 2000 privind înființarea unui Secretariat
    al autorităților comune de control pentru protecția datelor instituite prin
    Convenția privind înființarea Biroului European de Poliție (Convenția Europol),
    Convenția privind utilizarea tehnologiei informației în domeniul vamal și
    Convenția de punere în aplicare a Acordului Schengen privind eliminarea treptată
    a controalelor la frontierele comune (Convenția Schengen)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady zo 17. októbra 2000 o zriadení sekretariátu pre spoločné
    dozorné orgány na ochranu údajov vytvoreného v zmysle Dohovoru o zriadení
    Európskeho policajného úradu (Dohovor o Europole), Dohovoru o používaní
    informačných technológií na colné účely a Dohovoru o vykonávaní Schengenskej
    dohody o postupnom zrušení kontrol na spoločných hraniciach (Schengenský
    dohovor)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta z dne 17. oktobra 2000 o ustanovitvi Sekretariata za skupne
    nadzorne organe za varstvo podatkov, ustanovljene s Konvencijo o ustanovitvi Evropskega
    policijskega urada (Konvencijo o Europolu), Konvencijo o uporabi informacijske
    tehnologije za carinske namene in Konvencijo o izvajanju Schengenskega sporazuma
    o postopni odpravi mejnih kontrol na skupnih mejah (Schengensko konvencijo)
  type: main
- language: es
  script: Latn
  content: Decisión del Consejo, de 17 de octubre de 2000, por la que se crea una
    Secretaría para las Autoridades comunes de control de protección de datos establecidas
    por el Convenio por el que se crea una Oficina Europea de Policía (Convenio Europol),
    el Convenio relativo a la utilización de la tecnología de la información a
    efectos aduaneros y el Convenio de aplicación del Acuerdo de Schengen relativo
    a la supresión gradual de los controles en las fronteras comunes (Convenio de
    Schengen)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut av den 17 oktober 2000 om inrättande av ett sekretariat
    för de gemensamma tillsynsorgan för dataskydd som bildades genom konventionen
    om upprättandet av en europeisk polisbyrå (Europolkonventionen), konventionen
    om användning av informationsteknologi för tulländamål och konventionen om
    tillämpning av Schengenavtalet om det gradvisa avskaffandet av kontroller vid
    de gemensamma gränserna (Schengenkonventionen)
  type: main
