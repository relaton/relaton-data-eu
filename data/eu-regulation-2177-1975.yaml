title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2177/75 of the Commission of 21 August 1975 re-establishing
    the levying of the customs duties on plaiting materials bound together in parallel
    strands or woven, etc., falling within heading No 46.02, originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2177/75 de la Commission, du 21 août 1975, portant
    rétablissement de la perception des droits de douane applicables aux matières
    à tresser tissées à plat ou parallélisées, etc., de la position tarifaire
    46.02, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2177/75 der Kommission vom 21. August 1975 zur Wiedereinführung
    des Zollsatzes für Flechtstoffe, in Flächenform verwebt oder parallel aneinandergefügt
    usw., der Tarifnummer 46.02, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2177/75 af 21. august 1975 om genindførelse
    af opkrævning af toldafgifter for flettematerialer i pladeform, sammenbundne
    eller vævede etc., under position 46.02, som har oprindelse i Sydkorea og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3054/74
    af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2177/75 della Commissione, del 21 agosto 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai materiali da intreccio
    tessuti o parallelizzati, ecc., della voce doganale n. 46.02, originari della
    Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2177/75 van de Commissie van 21 augustus 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op vlechtstoffen,
    vlak geweven of samengebonden, etc., van post 46.02, van oorsprong uit Zuid-Korea,
    ten behoeve waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december
    1974 algemene tariefpreferenties werden geopend
  type: main
