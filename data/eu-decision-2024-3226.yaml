  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2024/3226 ze dne 16. prosince 2024 o zmocnění k
    zahájení jednání s Norským královstvím o dohodě, kterou se stanoví pravidla
    týkající se účasti Norského království ve složce GOVSATCOM Kosmického
    programu Unie a na Programu Unie pro bezpečnou konektivitu a přístupu k jejich
    službám státní správy
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2024/3226 af 16. december 2024 om bemyndigelse
