    zasady uczestnictwa Królestwa Norwegii w komponencie GOVSATCOM Unijnego programu
    kosmicznego i w unijnym programie bezpiecznej łączności oraz zasady dostępu
    do usług na rzecz władz publicznych
  type: main
- language: pt
  script: Latn
