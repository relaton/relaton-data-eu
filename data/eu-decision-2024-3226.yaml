  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2024/3226 tas-16 ta’ Diċembru 2024 li tawtorizza
    l-ftuħ ta’ negozjati mar-Renju tan-Norveġja għal ftehim li jistabbilixxi
    r-regoli għall-parteċipazzjoni tar-Renju tan-Norveġja fil-komponent GOVSATCOM
