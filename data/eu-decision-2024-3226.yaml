    Kraljevine Norveške u komponenti GOVSATCOM Svemirskog programa Unije i u Programu
    Unije za sigurnu povezivost te za pristup uslugama za državne potrebe
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2024/3226 határozata (2024. december 16.) a Norvég Királyságnak
    az uniós űrprogram GOVSATCOM-komponensében és az uniós biztonságos konnektivitási
    programban való részvételére, valamint a kormányzati szolgáltatásokhoz
    való hozzáférésre vonatkozó szabályok megállapításáról szóló megállapodásra
    irányuló, a Norvég Királysággal folytatandó tárgyalások megkezdésére
    való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2024/3226 del Consiglio, del 16 dicembre 2024, che autorizza
    l’avvio di negoziati con il Regno di Norvegia per un accordo che stabilisce
    le regole per la partecipazione del Regno di Norvegia alla componente GOVSATCOM
    del programma spaziale dell’Unione e al programma dell’Unione per una connettività
    sicura, e per l’accesso ai servizi governativi
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2024/3226 (2024. gada 16. decembris), ar ko pilnvaro
