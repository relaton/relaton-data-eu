    les règles régissant la participation du Royaume de Norvège à la composante
    Govsatcom du programme spatial de l’Union et au programme de l’Union pour
    une connectivité sécurisée, ainsi que l’accès aux services gouvernementaux
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/3226 des Rates vom 16. Dezember 2024 über die Ermächtigung
