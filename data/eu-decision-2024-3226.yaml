    de stabilire a normelor pentru participarea Regatului Norvegiei la componenta
    GOVSATCOM a Programului spațial al Uniunii și la Programul Uniunii privind conectivitatea
    securizată, precum și pentru accesul la serviciile guvernamentale
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2024/3226 zo 16. decembra 2024 o poverení začať
    rokovania s Nórskym kráľovstvom o dohode, ktorou sa stanovujú pravidlá účasti
    Nórskeho kráľovstva na zložke GOVSATCOM Vesmírneho programu Únie a na Programe
