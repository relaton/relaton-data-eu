title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/3226 of 16 December 2024 authorising the opening
    of negotiations with the Kingdom of Norway for an agreement laying down the rules
    for the participation of the Kingdom of Norway in the GOVSATCOM component of the
    Union Space Programme and in the Union Secure Connectivity Programme, and for
    access to governmental services
  type: main
- language: fr
  script: Latn
