title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3492/73 of the Commission of 21 December 1973 supplementing
    Regulations (EEC) Nos 2182/73 and 2823/73 laying down detailed rules on export
    levies to be applied respectively on the cereals market and in the rice market
    in the event of disturbances thereon
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3492/73 de la Commission, du 21 décembre 1973, complétant
    les règlements (CEE) n° 2182/73 et (CEE) n° 2823/73 établissant les modalités
    d' application concernant les prélèvements à l' exportation applicables respectivement
    dans le secteur des céréales et dans le secteur du riz en cas de perturbation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3492/73 der Kommission vom 21. Dezember 1973 zur Ergänzung
    der Verordnungen (EWG) Nr. 2182/73 und (EWG) Nr. 2823/73 über die Einzelheiten
    der Anwendung der Abschöpfungen bei der Ausfuhr im Getreide- bzw. Reissektor
    im Falle von Störungen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3492/73 af 21. december 1973 om tillæg
    til forordning (EØF) nr. 2182/73 og forordning (EØF) nr. 2823/73 om fastsættelse
    af gennemførelsesbestemmelser vedrørende de inden for henholdsvis korn- og rissektoren
    gældende eksportafgifter i tilfælde af forstyrrelser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3492/73 della Commissione, del 21 dicembre 1973, che
    completa i regolamenti (CEE) nn. 2182/73, e 2823/73, che stabiliscono le modalità
    di applicazione dei prelievi all' esportazione applicabili nel settore rispettivamente
    dei cereali e del riso in caso di perturbazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3492/73 van de Commissie van 21 december 1973 houdende
    aanvulling van de Verordeningen (EEG) nr. 2182/73 en (EEG) nr. 2823/73 tot vaststelling
    van de uitvoeringsbepalingen met betrekking tot de uitvoerheffingen in de sector
    granen, respectievelijk de sector rijst, in geval van verstoring
  type: main
