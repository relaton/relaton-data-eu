title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 460/84 of 22 February 1984 re-establishing
    the levying of customs duties on stockings, understockings, socks, ankle-socks,
    sockettes and the like, knitted or crocheted, not elastic or rubberized, products
    of category 12 (code 0120), originating in Malaysia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 460/84 de la Commission du 22 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    bas, sous-bas, chaussettes, de bonneterie non élastique ni caoutchoutée, de
    la catégorie 12 (code 0120), originaires de Malaysia, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 460/84 der Kommission vom 22. Februar 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Strümpfe, Unterziehstrümpfe,
    Socken, gewirkt, weder gummielastisch noch kautschutiert, der Warenkategorie Nr.
    12 (Kennziffer 0120), mit Ursprung in Malaysia, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 460/84 af 22. februar 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte strømper, understrømper, af trikotage,
    ikke elastisk eller gummeret, under varekategori nr. 12 (kode 0120), som har oprindelse
    i Malaysia og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 460/84 της Επιτροπής
    της 22ας Φεβρουαρίου 1984 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για περικνημίδες
    εν γένει, περιπόδια, περιπόδια κοντά κλπ., πλεκτά
    είδη, μη ελαστικά ουδέ συνδεδυασμένα μετά καουτσούκ,
    προϊόντα της κατηγορίας 12 (κωδικός 0120), καταγωγής
    Μαλαισίας, δικαιούχου των προβλεπομένων στον
    κανονισμό (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 460/84 della Commissione del 22 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili alle calze, sottocalze,
    calzini, a maglia non elastica né gommata, della categoria di prodotti n. 12
    (codice 0120), originari della Malaysia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 460/84 van de Commissie van 22 februari 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kousen,
    onderkousen, sokken, voetjes en dergelijke artikelen, van niet-elastisch of van
    niet-gegummeerd brei- of haakwerk, van de categorie van produkten nr. 12 (codenummer
    0120), van oorsprong uit Maleisië, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
  type: main
