title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2263/73 of the Commission of 20 August 1973 re-establishing
    Common Customs Tariff duties on articles of asbestos-cement of cellulose fibre-cement
    or the like falling within heading No 68.12, originating in Yugoslavia, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2762/72
    of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2263/73 de la Commission, du 20 août 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux ouvrages en amiante-ciment, cellulose-ciment et similaires, de la position
    tarifaire 68.12, originaires de Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre
    1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2263/73 der Kommission vom 20. August 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Waren aus Asbestzement, Zellulosezement
    oder dergleichen, der Tarifnummer 68.12, mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2263/73 af 20. august 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for varer af asbestcement, cellulosecement
    og lign. under position 68.12, som har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2762/72 af
    19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2263/73 della Commissione, del 20 agosto 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    lavori di amianto-cemento, cellulosa-cemento e simili della voce doganale n. 68.12
    originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2263/73 van de Commissie van 20 augustus 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op werken van asbestcement, van cellulosecement en dergelijke,
    van post 68.12, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties
    werden geopend
  type: main
