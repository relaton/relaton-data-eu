title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 763/72 de la Commission, du 14 avril 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux mouchoirs et pochettes en tissus de coton, de la position tarifaire EX 61.05,
    originaires de la Corée du Sud, bénéficiaire des préférences prévues par
    le règlement (CEE) n° 2797/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 763/72 der Kommission vom 14. April 1972 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Taschentücher
    und Ziertaschentücher, aus Baumwolle, der Tarifnummer ex 61.05, mit Ursprung
    in Korea (Süd-), dem die in der Verordnung (EWG) Nr. 2797/71 des Rates vom 20.
    Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 763/72 della Commissione, del 14 aprile 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    fazzoletti da naso e da taschino in tessuti di cotone della voce doganale ex 61.05
    originari della Corea del Sud beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2797/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 763/72 van de Commissie van 14 april 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op zakdoeken van katoen van post ex 61.05, van oorsprong uit Zuid-Korea,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2797/71 van de Raad van 20 december 1971
  type: main
