title:
- language: en
  script: Latn
  content: '93/573/EEC: Commission Decision of 20 October 1993 authorizing Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/573/CEE: Décision de la Commission, du 20 octobre 1993, autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers de reproduction ne répondant pas aux exigences de la directive 66/404/CEE
    du Conseil'
  type: main
- language: de
  script: Latn
  content: '93/573/EWG: Entscheidung der Kommission vom 20. Oktober 1993 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '93/573/EØF: Kommissionens beslutning af 20. oktober 1993 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '93/573/ΕΟΚ: Απόφαση της Επιτροπής της 20ής
    Οκτωβρίου 1993 που επιτρέπει στα κράτη μέλη να
    εγκρίνουν προσωρινώς την εμπορία δασικού πολλαπλασιαστικού
    υλικού που δεν πληροί τις απαιτήσεις της οδηγίας
    66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '93/573/ETY: Komission päätös, tehty 20 päivänä lokakuuta 1993, luvan
    antamisesta jäsenvaltioille hyväksyä tilapäisesti sellaisen metsänviljelyaineiston
    pitäminen kaupan, joka ei täytä neuvoston direktiivin 66/404/ETY vaatimuksia'
  type: main
- language: it
  script: Latn
  content: '93/573/CEE: Decisione della Commissione, del 20 ottobre 1993, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    forestali di moltiplicazione non rispondenti ai requisiti prescritti dalla direttiva
    66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '93/573/EEG: Beschikking van de Commissie van 20 oktober 1993 tot machtiging
    van de Lid-Staten om tijdelijk toe te staan dat bosbouwkundig teeltmateriaal dat
    niet beantwoordt aan de vereisten van Richtlijn 66/404/EEG van de Raad in de handel
    wordt gebracht'
  type: main
- language: pt
  script: Latn
  content: '93/573/CEE: Decisão da Comissão, de 20 de Outubro de 1993, que autoriza
    os Estados-membros a permitir temporariamente a comercialização de materiais
    florestais de reprodução que não satisfaçam as exigências da Directiva 66/404/CEE
    do Conselho'
  type: main
- language: es
  script: Latn
  content: '93/573/CEE: Decisión de la Comisión, de 20 de octubre de 1993, por la
    que se autoriza a los Estados miembros para permitir temporalmente la comercialización
    de material de reproducción forestal que no cumpla los requisitos de la Directiva
    66/404/CEE del Consejo'
  type: main
- language: sv
  script: Latn
  content: '93/573/EEG: Kommissionens beslut av den 20 oktober 1993 om bemyndigande
