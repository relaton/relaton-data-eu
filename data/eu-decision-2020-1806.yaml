  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/1806 z 25. novembra 2020, ktorým
    sa schvaľuje používanie funkcie dobehu vozidla so zapnutým motorom v osobných
    automobiloch s motormi s vnútorným spaľovaním a v hybridných elektrických
    osobných automobiloch bez externého nabíjania ako inovačnej technológie podľa
    nariadenia Európskeho parlamentu a Rady (EÚ) 2019/631 a ktorým sa zrušujú
    vykonávacie rozhodnutia Komisie 2013/128/EÚ, 2013/341/EÚ, 2013/451/EÚ, 2013/529/EÚ,
    2014/128/EÚ, 2014/465/EÚ, 2014/806/EÚ, (EÚ) 2015/158, (EÚ) 2015/206, (EÚ)
