    2016/265, (EÚ) 2016/588, (EÚ) 2016/362, (EÚ) 2016/587, (EÚ) 2016/1721, (EÚ)
    2016/1926, (EÚ) 2017/785, (EÚ) 2017/1402, (EÚ) 2018/1876, (EÚ) 2018/2079,
    (EÚ) 2019/313, (EÚ) 2019/314, (EÚ) 2020/728, (EÚ) 2020/1102, (EÚ) 2020/1222
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2020/1806 z dne 25. novembra 2020 o odobritvi
    uporabe funkcije iztekanja z vklopljenim motorjem v osebnih avtomobilih z motorji
    z notranjim zgorevanjem in hibridnih električnih osebnih avtomobilih brez zunanjega
    polnjenja kot inovativne tehnologije v skladu z Uredbo (EU) 2019/631 Evropskega
    parlamenta in Sveta ter razveljavitvi izvedbenih sklepov Komisije 2013/128/EU,
    2013/341/EU, 2013/451/EU, 2013/529/EU, 2014/128/EU, 2014/465/EU, 2014/806/EU,
    (EU) 2015/158, (EU) 2015/206, (EU) 2015/279, (EU) 2015/295, (EU) 2015/1132, (EU)
    2015/2280, (EU) 2016/160, (EU) 2016/265, (EU) 2016/588, (EU) 2016/362, (EU) 2016/587,
    (EU) 2016/1721, (EU) 2016/1926, (EU) 2017/785, (EU) 2017/1402, (EU) 2018/1876,
    (EU) 2018/2079, (EU) 2019/313, (EU) 2019/314, (EU) 2020/728, (EU) 2020/1102 in
    (EU) 2020/1222
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/1806 de la Comisión de 25 de noviembre
    de 2020 relativa a la aprobación de la utilización de la función de conducción
    a vela con el motor en marcha en turismos con motores de combustión interna y
    en turismos eléctricos híbridos sin carga exterior como tecnología innovadora,
    de conformidad con el Reglamento (UE) 2019/631 del Parlamento Europeo y del Consejo
    y por la que se derogan las Decisiones de Ejecución 2013/128/UE, 2013/341/UE,
    2013/451/UE, 2013/529/UE, 2014/128/UE, 2014/465/UE, 2014/806/UE, (UE) 2015/158,
