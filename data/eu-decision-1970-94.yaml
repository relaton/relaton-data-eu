title:
- language: en
  script: Latn
  content: "/* 70/94/EEC: Commission Decision of 15 January 1970 exempting the Kingdom of Belgium from applying to certain species the Council Directive of 30 June 1969 on the marketing of seed of oil and fibre plants */ (Only the French and Dutch texts are authentic)"
  type: main
- language: fr
  script: Latn
  content: '70/94/CEE: Décision de la Commission, du 15 janvier 1970, dispensant
    le Royaume de Belgique d''appliquer, à certaines espèces, la directive du Conseil,
    du 30 juin 1969, concernant la commercialisation des semences de plantes oléagineuses
    et à fibres (Les textes en langues française et néerlandaise sont les seuls
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '70/94/EWG: Entscheidung der Kommission vom 15. Januar 1970 über die Entbindung
    des Königreichs Belgien von der Verpflichtung, die Richtlinie des Rates vom 30.
    Juni 1969 über den Verkehr mit Saatgut von Öl- und Faserpflanzen hinsichtlich
    einiger Arten anzuwenden (Nur der französische und niederländische Text sind
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: "/* 70/94/EØF: Kommissionens beslutning af 15. januar 1970 om fritagelse af kongeriget Belgien for, for visse arter, at anvende Rådets direktiv af 30. juni 1969 om handel med frø af olie- og spindplanter */ (Kun de franske og nederlandske udgaver er autentiske)"
  type: main
- language: el
  script: Grek
  content: '70/94/ΕΟΚ: Απόφαση της Επιτροπής, της 15ης
    Ιανουαρίου 1970, περί απαλλαγής του Βασιλείου
    του Βελγίου από την εφαρμογή, για ορισμένα
    είδη, της οδηγίας του Συμβουλίου της 30ης Ιουνίου
    1969, περί της εμπορίας σπόρων ελαιούχων και
    ινωδών φυτών (Τα κείμενα στη γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '70/94/CEE: Decisione della Commissione, del 15 gennaio 1970, che dispensa
    il Regno del Belgio dell''applicazione, per talune specie, della direttiva del
    Consiglio, del 30 giugno 1969, relativa alla commercializzazione delle sementi
    di piante oleaginose e da fibra (Il testi in lingua francese e olandese sono il
    soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '70/94/EEG: Beschikking van de Commissie van 15 januari 1970 tot ontheffing
    van het Koninkrijk België van toepassing op bepaalde gewassen van de richtlijn
    van de Raad van 30 juni 1969 betreffende het in de handel brengen van zaaizaad
    van oliehoudende planten en vezelgewassen (Slechts de teksten in de Franse en
    de Nederlandse taal zijn authentiek)'
  type: main
