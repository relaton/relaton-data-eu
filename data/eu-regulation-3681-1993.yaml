title:
- language: en
  script: Latn
  content: COUNCIL REGULATION (EC) No 3681/93 of 20 December 1993 laying down for
    1994 certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of certain non-member countries in the 200-nautical-mile
    zone off the coast of the French department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3681/93 du Conseil du 20 décembre 1993 fixant, pour
    l'année 1994, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon de certains pays tiers dans
    la zone de 200 milles située au large du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3681/93 DES RATES vom 20. Dezember 1993 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer (1994)
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 3681/93 af 20. december 1993 om fastsættelse
    af en række foranstaltninger for 1994 til bevarelse og forvaltning af fiskeressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3681/93 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 20ής Δεκεμβρίου 1993 για τον καθορισμό, για
    το 1994, ορισμένων μέτρων διατηρήσεως και διαχειρίσεως
    των αλιευτικών πόρων, τα οποία εφαρμόζονται
    στα σκάφη με σημαία ορισμένων τρίτων χωρών
    εντός της ζώνης 200 μιλίων η οποία ευρίσκεται
    στα ανοικτά των ακτών του γαλλικού διαμερίσματος
    της Γουιάνας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3681/93 DEL CONSIGLIO del 20 dicembre 1993 che stabilisce,
    per il 1994, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3681/93 VAN DE RAAD van 20 december 1993 houdende
    maatregelen voor 1994 voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    in de 200-mijlszone voor de kust van het Franse departement Guyana van toepassing
    zijn
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3681/93 DO CONSELHO de 20 de Dezembro de 1993 que
    fixa, para 1994, certas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão de certos países terceiros
    na zona de 200 milhas situada ao largo do departamento francês da Guiana
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3681/93 DEL CONSEJO de 20 de diciembre de 1993 por
    el que se establecen, para 1994, determinadas medidas de conservación y de gestión
    de los recursos pesqueros aplicables a los buques que enarbolen pabellón de determinados
    terceros países en la zona de 200 millas situada frente a las costas del departamento
    francés de Guyana
