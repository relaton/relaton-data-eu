title:
- language: en
  script: Latn
  content: '2002/1005/EC: Commission Decision of 23 December 2002 amending for the
    second time Decision 2002/308/EC establishing the lists of approved zones and
    approved farms with regard to one or more of the fish diseases viral haemorrhagic
    septicaemia (VHS) and infectious haematopoietic necrosis (IHN) (Text with EEA
    relevance) (notified under document number C(2002) 5204)'
  type: main
- language: fr
  script: Latn
  content: '2002/1005/CE: Décision de la Commission du 23 décembre 2002 modifiant
    pour la deuxième fois la décision 2002/308/CE établissant les listes des zones
    et des exploitations piscicoles agréées au regard de la septicémie hémorragique
    virale (SHV) ou de la nécrose hématopoïétique infectieuse (NHI), ou de ces
    deux maladies (Texte présentant de l''intérêt pour l''EEE) [notifiée sous
    le numéro C(2002) 5204]'
  type: main
- language: de
  script: Latn
  content: '2002/1005/EG: Entscheidung der Kommission vom 23. Dezember 2002 zur zweiten
    Änderung der Entscheidung 2002/308/EG zur Festlegung der Verzeichnisse der hinsichtlich
