title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1221/94 of 27 May 1994 re- etablishing the
    levying of the customs duties applicable to products falling within CN code 2817
    00 00 originating in China, to which the preferential tariff arrangements of Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1221/94 de la Commission du 27 mai 1994 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 2817
    00 00 originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1221/94 DER KOMMISSION vom 27. Mai 1994 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 2817 00 00 mit Ursprung in
    China, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1221/94 af 27. maj 1994 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2817 00 00 og med oprindelse
    i Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF) nr.
    3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1221/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Μαΐου 1994 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα προϊόντα του
    κωδικού ΣΟ 2817 00 00, καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1221/94 DELLA COMMISSIONE del 27 maggio 1994 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti del codice NC 2817 00
    00 originari della Cina, beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1221/94 VAN DE COMMISSIE van 27 mei 1994 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 2817 00 00, van oorsprong uit China, waarvoor de in Verordening (EEG)
    nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1221/94 DA COMISSÃO de 27 de Maio de 1994 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos do código NC 2817
    00 00 originários da China, beneficiários das preferências pautais previstas
    no Regulamento (CEE) nº 3831/90 do Conselho
  type: main
- language: es
