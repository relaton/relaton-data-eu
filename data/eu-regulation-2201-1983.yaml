title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2201/83 of 1 August 1983 re-establishing
    the levying of customs duties on track suits of knitted or crocheted fabric, products
    of category 73 (code 0730) and originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2201/83 de la Commission du 1er août 1983 portant
    rétablissement de la perception des droits de douane applicables aux survêtements
    de sport de bonneterie de la catégorie de produits 73 (code 0730), originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2201/83 der Kommission vom 1. August 1983 über die
    Wiedereinführung des Zollsatzes für Trainingsanzüge aus Gewirken der Warenkategorie
    Nr. 73 (Kennziffer 0730), mit Ursprung in Brasilien, dem die in der Verordnung
    (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2201/83 af 1. august 1983 om genindførelse
    af opkrævning af toldafgifter for træningsdragter af trikotage, under kategori
    nr. 73 (kode 0730), som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2201/83 της Επιτροπής
    της 1ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τις φόρμες
    αθλητικές πλεκτές, προϊόντα της κατηγορίας
    73 (κώδικας 0730), καταγωγής Βραζιλίας, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2201/83 della Commissione del 1o agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli indumenti esterni sportivi a
    maglia, della categoria di prodotti n. 73 (codice 0730), originari del Brasile,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2201/83 van de Commissie van 1 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op trainingspakken
    van brei- of haakwerk van de categorie van produkten nr. 73 (codenummer 0730),
    van oorsprong uit Brazilië, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
