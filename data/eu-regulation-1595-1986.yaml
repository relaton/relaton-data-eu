title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1595/86 of 26 May 1986 re-establishing the
    levying of customs duties on artificial flowers, foliage or fruit and parts thereof,
    falling within heading No 67.02, originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1595/86 de la Commission du 26 mai 1986 portant rétablissement
    de la perception des droits de douane applicables aux fleurs, feuillages et fruits
    artificiels et leurs parties de la position 67.02 du tarif douanier commun, originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1595/86 der Kommission vom 26. Mai 1986 zur Wiedereinführung
    der Erhebung der Zölle für künstliches Blattwerk, künstliche Blumen und Früchte
    sowie Teile davon der Tarifnummer 67.02 des Gemeinsamen Zolltarifs mit Ursprung
    in Hongkong, dem die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1595/86 af 26. maj 1986 om genindførelse
    af opkrævning af told for kunstige blomster, blade og frugter samt dele deraf,
    henhørende under pos. 67.02 og med oprindelse i Hongkong, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1595/86 της Επιτροπής
    της 26ης Μαΐου 1986 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για άνθη, φυλλώματα και
    καρπούς, τεχνητά και μέρη αυτών της κλάσεως
    67.02 του κοινού δασμολογίου, καταγωγής Χονγκ
    Κονγκ, δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3599/85 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1595/86 della Commissione del 26 maggio 1986 che ripristina
    la riscossione dei dazi doganali applicabili ai fiori, foglie e frutti artificiali,
    loro parti, della voce 67.02 della tariffa doganale comune, originari di Hong
    Kong beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n.
    3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1595/86 van de Commissie van 26 mei 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kunstbloemen,
    kunstloofwerk en kunstvruchten alsmede delen daarvan van tariefpost 67.02 van
    het gemeenschappelijk douanetarief, van oorsprong uit Hong Kong, waarvoor de in
    Verordening (EEG) nr. 3599/85 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1595/86 da Comissão de 26 de Maio de 1986 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis a flores, folhagem e frutos, artificiais,
    e respectivas partes da posição 67.02 da pauta aduaneira comum originários
    de Hong-Kong beneficiário das preferências pautais previstas no Regulamento
    (CEE) n.° 3599/85 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1595/86 de la Comisión de 26 de mayo de 1986 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a flores,
    follajes y frutos artificiales y sus partes, de la partida n° 67.02 del arancel
    aduanero común, originarias de Hong Kong, beneficiario de las preferencias arancelarias
    previstas por el Reglamento (CEE) n° 3599/85 del Consejo
