  script: Latn
  content: '2004/333/EC: Commission Decision of 31 March 2004 authorising the placing
    on the market of yellow fat spreads, salad dressings, milk type products, fermented
    milk type products, soya drinks and cheese type products with added phytosterols/phytostanols
    as novel foods or novel food ingredients under Regulation (EC) No 258/97 of the
    European Parliament and of the Council (notified under document number C(2004)
    1243)'
  type: main
- language: fr
  script: Latn
