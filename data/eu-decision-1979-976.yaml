title:
- language: en
  script: Latn
  content: '79/976/EEC: Commission Decision of 30 October 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of Belgium of expenditure
    incurred during 1978 in connection with Community measures for the eradication
    of brucellosis, tuberculosis and leucosis in cattle (Only the French and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/976/CEE: Décision de la Commission, du 30 octobre 1979, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume de Belgique, des dépenses effectuées pendant
    l''année 1978 dans le cadre d''une action de la Communauté en vue de l''éradication
    de la brucellose, de la tuberculose et de la leucose des bovins (Les textes en
    langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/976/EWG: Entscheidung der Kommission vom 30. Oktober 1979 über die
    Erstattung der Ausgaben des Jahres 1978 für die Einführung von Maßnahmen der
    Gemeinschaft zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder
    an das Königreich Belgien (Nur der französische und niederländische Text sind
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/976/EØF: Kommissionens beslutning af 30. oktober 1979 om refusion
    gennem EUGFL, udviklingssektionen, til kongeriget Belgien af udgifter afholdt
    i 1978 i forbindelse med en fællesskabsaktion med henblik på udryddelse af brucellose,
    tuberkulose og leucose hos kvæg (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/976/CEE: Decisione della Commissione, del 30 ottobre 1979, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio delle
    spese effettuate nell''anno 1978 nel quadro di un''azione della Comunità per
    l''eradicazione della brucellosi, della tubercolosi e della leucosi dei bovini
    (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/976/EEG: Beschikking van de Commissie van 30 oktober 1979 betreffende
    de vergoeding door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België
    van de in 1978 gedane uitgaven in het kader van een gemeenschappelijke actie voor
    de uitroeiing van brucellose, tuberculose en leukose bij runderen (Slechts de
    teksten in de Franse en de Nederlandse taal zijn authentiek)'
