    κανονισμού (ΕΚ) αριθ. 441/2000 και για έναρξη διαρκούς
    διαγωνισμού για εξαγωγή 89 277 τόνων κριθής που
    έχει στη διάθεσή του ο ιρλανδικός οργανισμός
    παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2025/2000, annettu 26 päivänä syyskuuta 2000,
    asetuksen (EY) N:o 441/2000 muuttamisesta ja Irlannin interventioelimen hallussaan
    pitämän ohran vientiä koskevan pysyvän tarjouskilpailun kohteena olevan määrän
    nostamisesta 89 277 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2025/2000 della Commissione, del 26 settembre 2000,
    che modifica il regolamento (CE) n. 441/2000 e che porta a 89 277 tonnellate il
