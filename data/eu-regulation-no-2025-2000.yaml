    pour l'exportation d'orge détenue par l'organisme d'intervention irlandais
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2025/2000 der Kommission vom 26. September 2000 zur
    Änderung der Verordnung (EG) Nr. 441/2000 und zur Erhöhung der Dauerausschreibung
    zur Ausfuhr von im Besitz der irischen Interventionsstelle befindlicher Gerste
    auf 89 277 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2025/2000 af 26. september 2000 om ændring
    af forordning (EF) nr. 441/2000 og om forhøjelse til 89 277 tons af den løbende
    licitation med henblik på eksport af byg, som er i det irske interventionsorgans
    besiddelse
  type: main
- language: el
  script: Grek
