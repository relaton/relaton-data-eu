    detenuto dall'organismo d'intervento irlandese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2025/2000 van de Commissie van 26 september 2000 tot
    wijziging van Verordening (EG) nr. 441/2000, teneinde de hoeveelheid waarop de
    permanente openbare inschrijving voor de uitvoer van gerst uit Ierse interventievoorraden
    betrekking heeft, tot 89 277 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2025/2000 da Comissão, de 26 de Setembro de 2000,
