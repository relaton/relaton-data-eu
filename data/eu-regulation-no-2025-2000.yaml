title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2025/2000 of 26 September 2000 amending Regulation
    (EC) No 441/2000 increasing to 89 277 tonnes the quantity of barley held by the
    Irish intervention agency for which a standing invitation to tender for export
    has been opened
  type: main
- language: fr
  script: Latn
