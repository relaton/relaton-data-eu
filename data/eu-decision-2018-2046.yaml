---
id: EUDecision20182046
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/2046 of 19 December 2018 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 87427 × MON 89034 × 1507 × MON 88017 × 59122,
    and genetically modified maize combining two, three or four of the single events
    MON 87427, MON 89034, 1507, MON 88017 and 59122 and repealing Decision 2011/366/EU
    (notified under document C(2018) 8238)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/2046 de la Commission du 19 décembre
    2018 autorisant la mise sur le marché de produits qui contiennent du maïs génétiquement
    modifié MON 87427 × MON 89034 × 1507 × MON 88017 × 59122 et du maïs génétiquement
    modifié combinant deux, trois ou quatre des événements simples MON 87427, MON
    89034, 1507, MON 88017 et 59122, qui consistent en ces maïs ou sont produits
    à partir de ceux-ci, et abrogeant la décision 2011/366/UE [notifiée sous le
    numéro C(2018) 8238]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/2046 der Kommission vom 19. Dezember
    2018 über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch
    veränderten Mais der Sorte MON 87427 × MON 89034 × 1507 × MON 88017 × 59122
    enthalten, aus ihm bestehen oder aus ihm gewonnen werden, und von genetisch veränderten
    Maissorten, in denen zwei, drei oder vier der Einzelereignisse MON 87427, MON
    89034, 1507, MON 88017 und 59122 kombiniert werden, und zur Aufhebung des Beschlusses
    2011/366/EU (Bekannt gegeben unter Aktenzeichen C(2018) 8238)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/2046 на Комисията
    от 19 декември 2018 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица MON 87427 × MON 89034 × 1507 × MON 88017 × 59122, и на
    генетично модифицирана царевица, комбинираща
    две, три или четири единични събития MON 87427,
    MON 89034, 1507, MON 88017 и 59122, и за отмяна на Решение
    2011/366/ЕС (нотифицирано под номер С(2018) 8238)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/2046 ze dne 19. prosince 2018
    o povolení uvádění produktů, které obsahují geneticky modifikovanou kukuřici
    MON 87427 × MON 89034 × 1507 × MON 88017 × 59122 a geneticky modifikovanou
    kukuřici kombinující dvě, tři nebo čtyři z jednoduchých událostí MON
    87427, MON 89034, 1507, MON 88017 a 59122, sestávají z nich nebo jsou z nich
    vyrobeny, na trh a o zrušení rozhodnutí 2011/366/EU (oznámeno pod číslem
    C(2018) 8238)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/2046 af 19. december
    2018 om tilladelse til markedsføring af produkter, der indeholder, består af
    eller er fremstillet af genetisk modificeret MON 87427 × MON 89034 × 1507 ×
    MON 88017 × 59122-majs og genetisk modificeret majs, der kombinerer to, tre eller
    fire af de individuelle begivenheder MON 87427, MON 89034, 1507, MON 88017 og
    59122, og om ophævelse af afgørelse 2011/366/EU (meddelt under nummer C(2018)
    8238)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/2046 της Επιτροπής,
    της 19ης Δεκεμβρίου 2018, για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    MON 87427 × MON 89034 × 1507 × MON 88017 × 59122 και γενετικώς
    τροποποιημένο αραβόσιτο που συνδυάζει δύο,
    τρία ή τέσσερα από τα μονά συμβάντα MON 87427, MON
    89034, 1507, MON 88017 και 59122, και για την κατάργηση της
    απόφασης 2011/366/ΕΕ [κοινοποιηθείσα υπό τον αριθμό
    C(2018) 8238]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/2046, 19. detsember 2018, millega lubatakse
    lasta turule geneetiliselt muundatud maisi MON 87427 × MON 89034 × 1507 × MON
    88017 × 59122 sisaldavaid, sellest koosnevaid või sellest toodetud tooteid ja
    geneetiliselt muundatud maisi, milles on kombineeritud kaks, kolm või neli transformatsiooni
    MON 87427, MON 89034, 1507, MON 88017 ja 59122, ning millega tunnistatakse kehtetuks
    otsus 2011/366/EL (teatavaks tehtud numbri C(2018) 8238 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/2046, annettu 19 päivänä
    joulukuuta 2018, muuntogeenistä maissia MON 87427 × MON 89034 × 1507 × MON
    88017 × 59122 sisältävien, siitä koostuvien tai siitä valmistettujen tuotteiden
    sekä muunnostapahtumista MON 87427, MON 89034, 1507, MON 88017 ja 59122 kahden,
    kolmen tai neljän yksittäistapahtuman yhdistelmänä saadun muuntogeenisen maissin
    markkinoille saattamisen sallimisesta ja päätöksen 2011/366/EU kumoamisesta
    (tiedoksiannettu numerolla C(2018) 8238)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/2046 оd 19. prosinca 2018. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    MON 87427 × MON 89034 × 1507 × MON 88017 × 59122, ili se sastoje ili su proizvedeni
    od njega, i genetski modificirani kukuruz u kojem se kombiniraju dvije, tri ili
    četiri od pojedinačnih promjena MON 87427, MON 89034, 1507, MON 88017 i 59122,
    i o stavljanju izvan snage Odluke 2011/366/EU (priopćeno pod brojem dokumenta
    C(2018) 8238)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/2046 végrehajtási határozata (2018. december
    19.) a géntechnológiával módosított MON 87427 × MON 89034 × 1507 × MON
    88017 × 59122 kukoricát és a MON 87427, MON 89034, 1507, MON 88017 és 59122
    egyszeres genetikai események közül kettőt, hármat vagy négyet ötvöző,
    géntechnológiával módosított kukoricát tartalmazó, abból álló vagy abból
    előállított termékek forgalomba hozatalának engedélyezéséről, valamint
    a 2011/366/EU határozat hatályon kívül helyezéséről (az értesítés a
    C(2018) 8238. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/2046 della Commissione, del 19 dicembre
    2018, che autorizza l'immissione in commercio di prodotti contenenti, costituiti
    o derivati dal granturco geneticamente modificato MON 87427 × MON 89034 × 1507
    × MON 88017 × 59122 e dal granturco geneticamente modificato che combina due,
    tre o quattro dei singoli eventi MON 87427, MON 89034, 1507, MON 88017 e 59122,
    e che abroga la decisione 2011/366/UE [notificata con il numero C(2018) 8238]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/2046 (2018. gada 19. decembris),
    ar ko atļauj laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu
    MON 87427 × MON 89034 × 1507 × MON 88017 × 59122 un ģenētiski modificētu
    kukurūzu, kurā kombinēti divi, trīs vai četri vienkāršie transformācijas
    notikumi MON 87427, MON 89034, 1507, MON 88017 un 59122, sastāv no tās vai ir
    ražoti no tās, un ar ko atceļ Lēmumu 2011/366/ES (izziņots ar dokumenta numuru
    C(2018) 8238)
  type: main
- language: lt
  script: Latn
  content: 2018 m. gruodžio 19 d. Komisijos įgyvendinimo sprendimas (ES) 2018/2046,
    kuriuo leidžiama pateikti rinkai produktus, kurių sudėtyje yra genetiškai
    modifikuotų kukurūzų MON 87427 × MON 89034 × 1507 × MON 88017 × 59122 ir
    genetiškai modifikuotų kukurūzų, sudarytų iš dviejų, trijų arba keturių
    atskirų MON 87427, MON 89034, 1507, MON 88017 ir 59122 genetinių modifikacijų
    derinių, kurie iš šių kukurūzų sudaryti arba pagaminti, ir panaikinamas
    Sprendimas 2011/366/ES (pranešta dokumentu Nr. C(2018) 8238)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/2046 tad-19
    ta' Diċembru 2018 li tawtorizza l-introduzzjoni fis-suq ta' prodotti li jkun
    fihom il-qamħirrum ġenetikament modifikat MON 87427 × MON 89034 × 1507 ×
    MON 88017 × 59122, li jkunu jikkonsistu minnu jew li jkunu magħmulin minnu,
    u l-qamħirrum ġenetikament modifikat li jgħaqqad tnejn, tlieta jew erba' mill-eventi
    uniċi MON 87427, MON 89034, 1507, MON 88017 u 59122, u li tħassar id-Deċiżjoni
    2011/366/UE (notifikata bid-dokument C(2018) 8238)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/2046 van de Commissie van 19 december 2018
    tot verlening van een vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MON 87427 × MON 89034 × 1507 × MON 88017 × 59122 en genetisch gemodificeerde
    mais die twee, drie of vier van de afzonderlijke transformatiestappen MON 87427,
    MON 89034, 1507, MON 88017 en 59122 combineert, en tot intrekking van Besluit
    2011/366/EU (Kennisgeving geschied onder nummer C(2018) 8238)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/2046 z dnia 19 grudnia 2018 r. zezwalająca
    na wprowadzenie do obrotu produktów zawierających zmodyfikowaną genetycznie
    kukurydzę MON 87427 × MON 89034 × 1507 × MON 88017 × 59122 oraz rodzaje zmodyfikowanej
    genetycznie kukurydzy łączące dwie, trzy lub cztery pojedyncze modyfikacje
    MON 87427, MON 89034, 1507, MON 88017 i 59122 i produktów składających się
    z wymienionych rodzajów zmodyfikowanej genetycznie kukurydzy lub z niej wyprodukowanych
    oraz uchylająca decyzję 2011/366/UE (notyfikowana jako dokument nr C(2018) 8238)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/2046 da Comissão, de 19 de dezembro de
    2018, que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por, ou produzidos a partir de milho geneticamente modificado MON 87427 × MON
    89034 × 1507 × MON 88017 × 59122 e de milho geneticamente modificado que combina
    dois, três ou quatro dos eventos únicos MON 87427, MON 89034, 1507, MON 88017
    e 59122, e que revoga a Decisão 2011/366/UE [notificada com o número C(2018)
    8238]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/2046 a Comisiei din 19 decembrie
    2018 de autorizare a introducerii pe piață a produselor care conțin, constau
    în sau sunt fabricate din porumb modificat genetic MON 87427 × MON 89034 ×
    1507 × MON 88017 × 59122 și din porumbul modificat genetic obținut din combinarea
    a două, trei sau patru dintre evenimentele unice MON 87427, MON 89034, 1507,
    MON 88017 și 59122 și de abrogare a Deciziei 2011/366/UE [notificată cu numărul
    C(2018) 8238]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/2046 z 19. decembra 2018, ktorým
    sa povoľuje umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu MON 87427 × MON 89034 × 1507 × MON 88017 × 59122 a geneticky modifikovanú
    kukuricu obsahujúcu kombináciu dvoch, troch alebo štyroch genetických modifikácií
    MON 87427, MON 89034, 1507, MON 88017 a 59122, sú z nich zložené alebo vyrobené,
    a ktorým sa zrušuje rozhodnutie 2011/366/EÚ [oznámené pod číslom C(2018)
    8238]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/2046 z dne 19. decembra 2018 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MON 87427 ×
    MON 89034 × 1507 × MON 88017 × 59122 in gensko spremenjeno koruzo, v kateri
    sta združena dva, trije ali štirje od transformacijskih dogodkov MON 87427,
    MON 89034, 1507, MON 88017 in 59122, so iz njiju sestavljeni ali proizvedeni,
    ter razveljavitvi Sklepa 2011/366/EU (notificirano pod dokumentarno številko
    C(2018) 8238)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/2046 de la Comisión, de 19 de diciembre
    de 2018, por la que se autoriza la comercialización de productos que contengan,
    se compongan o se hayan producido a partir de maíz modificado genéticamente
    MON 87427 × MON 89034 × 1507 × MON 88017 × 59122 y de maíz modificado genéticamente
    que combine dos, tres o cuatro de los eventos únicos MON 87427, MON 89034, 1507,
    MON 88017 y 59122, y por la que se deroga la Decisión 2011/366/UE [notificada
    con el número C(2018) 8238]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/2046 av den 19 december 2018
    om godkännande för utsläppande på marknaden av produkter som innehåller,
    består av eller har framställts av den genetiskt modifierade majsen MON 87427
    × MON 89034 × 1507 × MON 88017 × 59122 och av genetiskt modifierad majs som
    kombinerar två, tre eller fyra av transformationshändelserna MON 87427, MON
    89034, 1507, MON 88017 och 59122, och om upphävande av beslut 2011/366/EU [delgivet
    med nr C(2018) 8238]
