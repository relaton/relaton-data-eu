    definitiva dei dazi provvisori imposti su tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 194/1999 van de Raad van 25 januari 1999 tot instelling
    van definitieve antidumpingrechten op de invoer van hardboard van oorsprong uit
    Bulgarije, Estland, Letland, Litouwen, Polen en Rusland en tot definitieve invordering
    van de voorlopige ingestelde rechten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 194/1999 do Conselho de 25 de Janeiro de 1999 que
