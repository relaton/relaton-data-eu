title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 194/1999 of 25 January 1999 imposing definitive
    anti-dumping duties on imports of hardboard originating in Bulgaria, Estonia,
    Latvia, Lithuania, Poland and Russia and definitively collecting the provisional
    duties imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 194/1999 du Conseil du 25 janvier 1999 instituant un
    droit antidumping définitif sur les importations de panneaux durs originaires
    de Bulgarie, d'Estonie, de Lettonie, de Lituanie, de Pologne et de Russie et portant
    perception définitive du droit provisoirement institué
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 194/1999 des Rates vom 25. Januar 1999 zur Einführung
