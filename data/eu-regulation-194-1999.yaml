    in Bulgarien, Estland, Lettland, Litauen, Polen und Rußland und zur endgültigen
    Vereinnahmung der vorläufigen Zölle
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 194/1999 af 25. januar 1999 om indførelse
    af endelig antidumpingtold på importen af fiberplader (hardboard) med oprindelse
    i Bulgarien, Estland, Letland, Litauen, Polen og Rusland og om endelig opkrævning
    af den midlertidige told
  type: main
- language: el
  script: Grek
