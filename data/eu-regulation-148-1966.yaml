title:
- language: fr
  script: Latn
  content: Règlement n 148/66/CEE de la Commission, du 12 octobre 1966, fixant des
    coefficients forfaitaires pour les produits transformés à base de céréales,
    en vue du calcul des remboursements des restitutions à l'exportation vers les
    pays tiers pour les campagnes 1964/65 et 1965/66
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 148/66/EWG der Kommission vom 12. Oktober 1966 zur Festsetzung
    der Pauschalkoeffizienten für Getreideverarbeitungserzeugnisse, die zur Berechnung
    der Vergütungen der Erstattungen bei der Ausfuhr nach dritten Ländern dienen,
    für die Wirtschaftsjahre 1964/1965 und 1965/1966
  type: main
- language: it
  script: Latn
  content: Regolamento n. 148/66/CEE della Commissione, del 12 ottobre 1966, che fissa
    i coefficienti forfettari applicabili ai prodotti trasformati a base di cereali
    per il calcolo dei rimborsi delle restituzioni all'esportazione nei paesi terzi
    per le campagne 1964-65 e 1965-66
  type: main
- language: nl
  script: Latn
  content: Verordening no. 148/66/EEG van de Commissie van 12 oktober 1966 houdende
    vaststelling van de forfaitaire coëfficiënten voor de op basis van granen verwerkte
    produkten ter berekening van de vergoeding der restituties bij uitvoer naar derde
    landen voor de verkoopseizoenen 1964/65 en 1965/66
  type: main
