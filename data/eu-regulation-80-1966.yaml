  content: Règlement n 80/66/CEE de la Commission, du 29 juin 1966, portant, pour
    le troisième trimestre 1966, adaptation et fixation des prix d'écluse et fixation
    des prélèvements envers les pays tiers dans le secteur des oeufs et volailles
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 80/66/EWG der Kommission vom 29. Juni 1966 zur Anpassung
    und Festsetzung der Einschleusungspreise und zur Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern im Bereich der Eier- und Geflügelwirtschaft für
    das 3. Vierteljahr 1966
  type: main
- language: it
  script: Latn
  content: Regolamento n. 80/66/CEE della Commissione, del 29 giugno 1966, che adatta
    e fissa, per il terzo trimestre 1966, i prezzi limite e fissa i prelievi nei confronti
    dei paesi terzi nel settore delle uova e del pollame
  type: main
- language: nl
  script: Latn
  content: Verordening no. 80/66/EEG van de Commissie van 29 juni 1966 houdende aanpassing
    en vaststelling van de sluisprijzen en vaststelling van de heffingen ten opzichte
    van derde landen in de sector eieren en slachtpluimvee voor het derde kwartaal
    1966
