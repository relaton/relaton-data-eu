title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 275/88 of 29 January 1988 on detailed rules
    for the application of the intervention thresholds for certain fruits and vegetables
    and on the information to be provided by Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 275/88 de la Commission du 29 janvier 1988 prévoyant
    les modalités d'application des seuils d'intervention pour certains fruits et
    légumes ainsi que les communications à effectuer par les États membres
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 275/88 DER KOMMISSION vom 29. Januar 1988 zur Festlegung
    der Durchführungsbestimmungen zur Anwendung der Interventionsschwellen für bestimmtes
    Obst und Gemüse sowie der von den Mitgliedstaaten vorzunehmenden Mitteilungen
    #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 275/88 af 29. januar 1988 om fastsættelse
    af gennemførelsesbestemmelser for interventionstærsklerne for visse frugter
    og grønsager samt de meddelelser, som medlemsstaterne skal foretage
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 275/88 της Επιτροπής
    της 29ης Ιανουαρίου 1988 που προβλέπει τις διαδικασίες
    εφαρμογής των κατωφλίων παρεμβάσεως για ορισμένα
    οπωροκηπευτικά καθώς και τις ανακοινώσεις
    που πρέπει να γίνονται από τα κράτη μέλη
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 275/88 DELLA COMMISSIONE del 29 gennaio 1988 che
    prevede le modalità di applicazione limiti quantitativi per l'' intervento relativo
    a taluni ortofrutticoli nonché la comunicazioni che gli Stati membri devono effettuare
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 275/88 VAN DE COMMISSIE van 29 januari 1988 houdende
    voorschriften voor de toepassing van de interventiedrempels voor bepaalde soorten
    groenten en fruit, alsook betreffende de door de Lid-Staten te verstrekken mededelingen
    #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 275/88 da Comissão de 29 de Janeiro de 1988 prevendo
    modalidades de aplicação dos limiares de intervenção para alguns frutos e
    produtos hortícolas e ainda as comunicações a efectuar pelos Estados-membros
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 275/88 DE LA COMISIÓN de 29 de enero de 1988 por
    el que se establecen las modalidades de aplicación de los umbrales de intervención
    para determinadas frutas y hortalizas, así como las comunicaciones que los Estados
    miembros deben efectuar #'
