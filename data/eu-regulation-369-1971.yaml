title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 369/71 de la Commission, du 19 février 1971, modifiant
    le règlement (CEE) n° 1505/70 et abrogeant les règlements (CEE) n° 1506/70
    et 1508/70 concernant les mesures à prendre, à la suite de la dévaluation du
    franc français, pour les produits relevant des secteurs des céréales, de la
    viande de porc et de l'aviculture
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 369/71 der Kommission vom 19. Februar 1971 zur Änderung
    der Verordnung (EWG) Nr. 1505/70 und zur Aufhebung der Verordnungen (EWG) Nr.
    1506/70 und Nr. 1508/70 über Maßnahmen auf den Sektoren Getreide, Schweinefleisch
    und Geflügelwirtschaft infolge der Abwertung des französischen Franken
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 369/71 della Commissione, del 19 febbraio 1971, che
    modifica il regolamento (CEE) n. 1505/70 e che abroga i regolamenti (CEE) nn.
    1506/70 e 1508/70 per quanto riguarda le misure da applicare, in seguito alla
    svalutazione del franco francese, per i prodotti dei settori dei cereali, delle
    carni suine e dell'avicoltura
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 369/71 van de Commissie van 19 februari 1971 houdende
    wijziging van Verordening (EEG) nr. 1505/70 en intrekking van de Verordeningen
    (EEG) nrs. 1506/70 en 1508/70 betreffende ingevolge de devaluatie van de Franse
    frank in de sectoren granen, varkensvlees en produkten van de pluimveehouderij
    te nemen maatregelen
  type: main
