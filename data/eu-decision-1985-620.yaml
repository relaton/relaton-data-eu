  script: Latn
  content: '85/620/EEC: Commission Decision of 13 December 1985 amending, because
    of the accession of Spain and Portugal, Decision 79/491/EEC laying down a code
    and standard rules for the transcription into a machine-readable form of the data
    of the basic surveys of areas under vines'
  type: main
- language: fr
  script: Latn
  content: '85/620/CEE: Décision de la Commission du 13 décembre 1985 modifiant
    en raison de l''adhésion de l''Espagne et du Portugal la décision 79/491/CEE
    établissant le code et les règles types relatifs à la transcription sous une
    forme lisible par machine des données des enquêtes de base sur les superficies
    viticoles'
  type: main
- language: de
  script: Latn
  content: '85/620/EWG: Entscheidung der Kommission vom 13. Dezember 1985 zur Änderung
