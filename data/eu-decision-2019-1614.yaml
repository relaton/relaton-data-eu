id: EUDecision20191614
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1614 of 26 September 2019 authorising
    Member States to provide for derogations from certain provisions of Council Directive
    2000/29/EC in respect of potatoes, other than potatoes intended for planting,
    originating in the regions of Akkar and Bekaa of Lebanon (notified under document
    C(2019) 6819)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/1614 de la Commission du 26 septembre
    2019 autorisant les États membres à prévoir des dérogations à certaines dispositions
    de la directive 2000/29/CE du Conseil en ce qui concerne les pommes de terre,
    autres que les pommes de terre destinées à la plantation, originaires des régions
    de l'Akkar et de la Bekaa, au Liban [notifiée sous le numéro C(2019) 6819]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/1614 der Kommission vom 26. September
    2019 zur Ermächtigung der Mitgliedstaaten, für nicht als Pflanzgut bestimmte
    Kartoffeln/Erdäpfel mit Ursprung in den libanesischen Regionen Akkar und Bekaa
    Ausnahmen von einigen Vorschriften der Richtlinie 2000/29/EG des Rates zu genehmigen
    (Bekannt gegeben unter Aktenzeichen C(2019) 6819)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2019/1614 на Комисията
    от 26 септември 2019 година с което на държавите
    членки се разрешава да предвиждат дерогации
    от някои разпоредби на Директива 2000/29/ЕО на
    Съвета по отношение на картофи, с изключение
    на картофи, предназначени за засаждане, с произход
    от регионите на Akkar и Bekaa в Ливан (нотифицирано
    под номер С(2019) 6819)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/1614 ze dne 26. září 2019,
    kterým se členským státům povoluje stanovit odchylky od některých ustanovení
    směrnice Rady 2000/29/ES, pokud jde o brambory pocházející z libanonských
    regionů Akkar a Bekaa, s výjimkou brambor určených k výsadbě (oznámeno
    pod číslem C(2019) 6819)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/1614 af 26. september
    2019 om bemyndigelse af medlemsstaterne til at indrømme undtagelser fra visse
    bestemmelser i Rådets direktiv 2000/29/EF for kartofler, dog ikke læggekartofler,
    med oprindelse i regionerne Akkar og Bekaa i Libanon (meddelt under nummer C(2019)
    6819)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2019/1614 της Επιτροπής,
    της 26ης Σεπτεμβρίου 2019, για να επιτραπεί στα
    κράτη μέλη να προβλέψουν παρεκκλίσεις από
    ορισμένες διατάξεις της οδηγίας 2000/29/ΕΚ του
    Συμβουλίου όσον αφορά τα γεώμηλα, εκτός από
    αυτά που προορίζονται για φύτευση, καταγωγής
    των περιφερειών Akkar και Bekaa του Λιβάνου [κοινοποιηθείσα
    υπό τον αριθμό C(2019) 6819]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2019/1614, 26. september 2019, millega lubatakse
    liikmesriikidel Liibanoni Akkari ja Bekaa piirkonnast pärit kartulite, välja
    arvatud seemnekartuliks ettenähtud kartulite puhul kehtestada erandeid teatavatest
    nõukogu direktiivi 2000/29/EÜ sätetest (teatvaks tehtud numbri C(2019) 6819
    all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2019/1614, annettu 26 päivänä
    syyskuuta 2019, luvan antamisesta jäsenvaltioille säätää poikkeuksista neuvoston
    direktiivin 2000/29/EY tiettyihin säännöksiin Libanonin Akkarin ja Bekaan alueilta
    peräisin olevien muiden kuin istutettavaksi tarkoitettujen perunoiden osalta
    (tiedoksiannettu numerolla C(2019) 6819)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/1614 оd 26. rujna 2019. kojom se
    države članice ovlašćuju da odobre odstupanja od određenih odredbi Direktive
    Vijeća 2000/29/EZ u odnosu na krumpire, osim za krumpire namijenjene sadnji,
    a koji potječu iz regija Akkar i Bekaa u Libanonu (priopćeno pod brojem dokumenta
    C(2019) 6819)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1614 végrehajtási határozata (2019. szeptember
    26.) a tagállamoknak a Libanon Akkar és Bekaa régiójából származó, nem
    vetőburgonyának szánt burgonya tekintetében történő, a 2000/29/EK tanácsi
    irányelv egyes rendelkezéseitől való eltérés biztosítására való felhatalmazásáról
    (az értesítés a C(2019) 6819. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/1614 della Commissione, del 26 settembre
    2019, che autorizza gli Stati membri a prevedere deroghe ad alcune disposizioni
    della direttiva 2000/29/CE del Consiglio in relazione alle patate non destinate
    alla piantagione originarie delle regioni di Akkar e Bekaa in Libano [notificata
    con il numero C(2019) 6819]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/1614 (2019. gada 26. septembris),
    ar ko attiecībā uz kartupeļiem, kuri nav paredzēti stādīšanai un kuru izcelsme
    ir Akaras un Bekaa reģionos Libānā, dalībvalstīm atļauj noteikt atkāpes
    no dažiem Padomes Direktīvas 2000/29/EK noteikumiem (izziņots ar dokumenta
    numuru C(2019) 6819)
  type: main
- language: lt
  script: Latn
  content: 2019 m. rugsėjo 26 d. Komisijos įgyvendinimo sprendimas (ES) 2019/1614,
    kuriuo leidžiama valstybėms narėms numatyti nuostatas, leidžiančias nukrypti
    nuo tam tikrų Tarybos direktyvos 2000/29/EB nuostatų dėl Libano Akaro ir Bekos
    regionų kilmės bulvių, išskyrus skirtąsias sodinti (pranešta dokumentu Nr.
    C(2019) 6819)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/1614 tas-26
    ta' Settembru 2019 li tawtorizza lill-Istati Membri jipprovdu għal derogi minn
    ċerti dispożizzjonijiet tad-Direttiva tal-Kunsill 2000/29/KE rigward il-patata,
    għajr il-patata maħsuba għat-tħawwil, li toriġina mir-reġjuni ta' Akkar
    u Bekaa tal-Libanu (notifikata bid-dokument C(2019) 6819)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2019/1614 van de Commissie van 26 september 2019
    tot machtiging van de lidstaten om voor andere dan voor opplant bestemde aardappelen
    uit de regio's Akkar en Bekaa in Libanon af te wijken van sommige bepalingen van
    Richtlijn 2000/29/EG van de Raad (Kennisgeving geschied onder nummer C(2019) 6819)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/1614 z dnia 26 września 2019 r. upoważniająca
    państwa członkowskie do ustanowienia odstępstw od niektórych przepisów dyrektywy
    Rady 2000/29/WE w odniesieniu do ziemniaków, oprócz sadzeniaków, pochodzących
    z regionów Akkar i Bekaa w Libanie (notyfikowana jako dokument nr C(2019) 6819)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/1614 da Comissão, de 26 de setembro de
    2019, que autoriza os Estados-Membros a prever derrogações de certas disposições
    da Diretiva 2000/29/CE do Conselho relativamente às batatas, com exceção das
    batatas destinadas à plantação, originárias das regiões de Akkar e Bekaa,
    no Líbano [notificada com o número C(2019) 6819]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/1614 a Comisiei din 26 septembrie
    2019 de autorizare a statelor membre să prevadă derogări de la anumite dispoziții
    ale Directivei 2000/29/CE a Consiliului în ceea ce privește cartofii, alții
    decât cartofii destinați plantării, originari din regiunile Akkar și Bekaa
    din Liban [notificată cu numărul C(2019) 6819]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/1614 z 26. septembra 2019,
    ktorým sa členským štátom udeľuje oprávnenie poskytovať výnimky z určitých
    ustanovení smernice Rady 2000/29/ES, pokiaľ ide o zemiaky pochádzajúce z regiónov
    Akkar a Bekaa v Libanone s výnimkou zemiakov určených na výsadbu [oznámené
    pod číslom C(2019) 6819]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/1614 z dne 26. septembra 2019 o dovoljenju
    državam članicam, da določijo odstopanja od nekaterih določb Direktive Sveta
    2000/29/ES v zvezi s krompirjem, ki ni namenjen saditvi, s poreklom iz regij Akkar
    in Bekaa v Libanonu (notificirano pod dokumentarno številko C(2019) 6819)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2019/1614 de la Comisión, de 26 de septiembre
    de 2019, por la que se autoriza a los Estados miembros a conceder excepciones
    a determinadas disposiciones de la Directiva 2000/29/CE en relación con las patatas
    originarias de las regiones de Akkar y Bekaa del Líbano que no sean patatas de
    siembra [notificada con el número C(2019) 6819]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2019/1614 av den 26 september 2019
    om bemyndigande för medlemsstaterna att bevilja undantag från vissa bestämmelser
    i rådets direktiv 2000/29/EG vad gäller annan potatis än potatis avsedd för
    plantering, med ursprung i regionerna Akkar och Bekaa i Libanon [delgivet med
    nr C(2019) 6819]
