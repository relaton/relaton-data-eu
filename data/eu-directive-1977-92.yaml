    agentů a makléřů (ze skupiny 630 ISIC), a zejména o přechodných opatřeních
    ohledně těchto činností
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 77/92/EØF af 13. december 1976 om foranstaltninger med
