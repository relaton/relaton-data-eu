    ide o činnosť poisťovacích agentov a sprostredkovateľov (ex skupina ISIC
    630), najmä o dočasných opatreniach týkajúcich sa týchto činností
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 13. decembra 1976 o ukrepih za učinkovito izvajanje
