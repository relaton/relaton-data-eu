    fir-rigward ta’ dawk l-attivitajiet
  type: main
- language: nl
  script: Latn
  content: Richtlijn 77/92/EEG van de Raad van 13 december 1976 houdende maatregelen
    ter bevordering van de daadwerkelijke uitoefening van het recht van vestiging
    en het vrij verrichten van diensten voor de werkzaamheden van verzekeringsagent
    en assurantiemakelaar (ex groep 630 CITI) en houdende met name overgangsmaatregelen
    voor deze werkzaamheden
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 13 grudnia 1976 r. w sprawie środków mających
    ułatwić skuteczne osiągnięcie swobody przedsiębiorczości oraz swobody świadczenia
    usług w odniesieniu do działalności agentów i brokerów ubezpieczeniowych
    (ex grupa ISIC 630) oraz, w szczególności, środków przejściowych dotyczących
    tych działalności
  type: main
- language: pt
  script: Latn
  content: Directiva 77/92/CEE do Conselho, de 13 de Dezembro de 1976, relativa às
    medidas destinadas a facilitar o exercício efectivo da liberdade de estabelecimento
    da livre prestação de serviços nas actividades de agente e de corretor de seguros
    (ex grupo 630 CITI), e contendo, nomeadamente, medidas transitórias para estas
    actividades
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 13. decembra 1976 o opatreniach, ktorými sa má uľahčiť
