    kasutamist hõlbustavate meetmete ja eelkõige selle tegevusega seonduvate üleminekumeetmete
    kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 77/92/ETY, annettu 13 päivänä joulukuuta 1976,
