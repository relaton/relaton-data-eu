title:
- language: en
  script: Latn
  content: Council Directive 77/92/EEC of 13 December 1976 on measures to facilitate
    the effective exercise of freedom of establishment and freedom to provide services
    in respect of the activities of insurance agents and brokers (ex ISIC Group 630)
    and, in particular, transitional measures in respect of those activities
  type: main
- language: fr
  script: Latn
  content: Directive 77/92/CEE du Conseil, du 13 décembre 1976, relative à des mesures
    destinées à faciliter l'exercice effectif de la liberté d'établissement et
    de la libre prestation des services pour les activités d'agent et de courtier
    d'assurance (ex groupe 630 CITI) et comportant notamment des mesures transitoires
    pour ces activités
  type: main
- language: de
  script: Latn
