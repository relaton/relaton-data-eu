    zastopnikov in zavarovalnih posrednikov (nekdanja ISIC skupina 630) in zlasti
    o prehodnih ukrepih za take dejavnosti
  type: main
- language: es
  script: Latn
  content: Directiva 77/92/CEE del Consejo, de 13 de diciembre de 1976, relativa a
