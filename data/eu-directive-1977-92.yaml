    freien Dienstleistungsverkehrs für die Tätigkeiten des Versicherungsagenten
    und des Versicherungsmaklers (aus ISIC -Gruppe 630), insbesondere Übergangsmaßnahmen
    für solche Tätigkeiten
  type: main
- language: cs
  script: Latn
