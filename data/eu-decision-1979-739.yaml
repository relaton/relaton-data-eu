title:
- language: en
  script: Latn
  content: '79/739/EEC: Commission Decision of 2 August 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of Denmark of expenditure
    incurred during 1978 in connection with Community measures for the eradication
    of brucellosis, tuberculosis and leucosis in cattle (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/739/CEE: Décision de la Commission, du 2 août 1979, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole, section "orientation",
    au Royaume du Danemark, des dépenses effectuées pendant l''année 1978 dans
    le cadre d''une action de la Communauté en vue de l''éradication de la brucellose,
    de la tuberculose et de la leucose des bovins (Le texte en langue danoise est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/739/EWG: Entscheidung der Kommission vom 2. August 1979 über Anträge
    auf Erstattung der Ausgaben des Jahres 1978 für die Einführung von Maßnahmen
    der Gemeinschaft zur Tilgung der Brucellose, der Tuberkulose und der Leukose der
    Rinder an das Königreich Dänemark (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/739/EØF: Kommissionens beslutning af 2. august 1979 om refusionen
    gennem EUGFL, udviklingssektionen, til kongeriget Danmark af udgifter afholdt
    i 1978 i forbindelse med en fællesskabsaktion med henblik på udryddelse af brucellose,
    tuberkulose og leukose hos kvæg (Kun den danske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/739/CEE: Decisione della Commissione, del 2 agosto 1979, relativa al
