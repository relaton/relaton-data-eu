    spese effettuate nell''anno 1978 nel quadro di un''azione della Comunità per
    l''eradicazione della brucellosi, della tubercolosi e della leucosi dei bovini
    (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/739/EEG: Beschikking van de Commissie van 2 augustus 1979 betreffende
