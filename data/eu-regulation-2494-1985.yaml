title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2494/85 of 3 September 1985 re-establishing
    the levying of customs duties on lactic acid and its salts and esters, falling
    within subheading 29.16 A I, originating in China, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2494/85 de la Commission du 3 septembre 1985 portant
    rétablissement de la perception des droits de douane applicables à l' acide
    lactique, ses sels et ses esters, de la sous-position 29.16 A I du tarif douanier
    commun, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2494/85 der Kommission vom 3. September 1985 zur Wiedereinführung
    der Erhebung der Zölle für Milchsäure, ihre Salze und Ester, der Tarifstelle
    29.16 A I des Gemeinsamen Zolltarifs, mit Ursprung in China, dem die in der Verordnung
    (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2494/85 af 3. september 1985 om genindførelse
    af opkrævning af told for mælkesyre samt salte og estere deraf, henhørende
    under pos. 29.16 A I i den fælles toldtarif og med oprindelse i Kina, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2494/85 της Επιτροπής
    της 3ης Σεπτεμβρίου 1985 περί αποκαταστάσεως
    της εφαρμογής των δασμών για το γαλακτικόν
    οξύ, άλατα και εστέρες αυτού της διακρίσεως
    29.16 Α Ι του Κοινού Δασμολογίου, καταγωγής Κίνας,
    δικαιούχου των προβλεπόμενων από τον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2494/85 della Commissione del 3 settembre 1985 che
    ripristina la riscossione dei dazi doganali applicabili all' acido lattico, suoi
    sali e suoi esteri, della sottovoce 29.16 A I della tariffa doganale comune, originari
    della Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2494/85 van de Commissie van 3 september 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op melkzuur, alsmede
    zouten en esters daarvan, van postonderverdeling 29.16 A I van het gemeenschappelijk
    douanetarief, van oorsprong uit China, waarvoor de in Verordening (EEG) nr. 3562/84
    van de Raad vermelde tariefpreferenties zijn verleend
