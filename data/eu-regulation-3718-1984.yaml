title:
- language: en
  script: Latn
  content: Council Regulation (Euratom, ECSC, EEC) No 3718/84 of 28 December 1984
    introducing an interim protective measure while awaiting a Council Decision adjusting
    the remuneration and pensions of officials and other servants of the European
    Communities and also the weightings applicable to this remuneration and these
    pensions
  type: main
- language: fr
  script: Latn
  content: Règlement (Euratom, CECA, CEE) no 3718/84 du Conseil du 28 décembre 1984
    instituant une mesure conservatoire dans l' attente d' une décision du Conseil
    portant adaptation des rémunérations et des pensions des fonctionnaires et autres
    agents des Communautés européennes ainsi que des coefficients correcteurs dont
    sont affectées ces rémunérations et pensions
  type: main
- language: de
  script: Latn
  content: Verordnung (Euratom, EGKS, EWG) Nr. 3718/84 des Rates vom 28. Dezember
    1984 zur Einführung einer einstweiligen Maßnahme bis zum Erlaß eines Ratsbeschlusses
    zur Angleichung der Dienst- und Versorgungsbezüge der Beamten und sonstigen Bediensteten
    der Europäischen Gemeinschaften sowie der Berichtigungskoeffizienten, die auf
    diese Dienst- und Versorgungsbezüge anwendbar sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (Euratom, EKSF, EØF) nr. 3718/84 af 28. december 1984
    om indførelse af en bevarende foranstaltning, indtil der foreligger en afgørelse
    fra Rådet om tilpasning af vederlag og pensioner til tjenestemænd og øvrige
    ansatte i De europæiske Fællesskaber samt om justeringskoefficienterne for disse
    vederlag og pensioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (Ευρατόμ, ΕΚΑΧ, ΕΟΚ) αριθ. 3718/84
    του Συμβουλίου της 28ης Δεκεμβρίου 1984 για τη
    λήψη συντηρητικών μέτρων εν αναμονή αποφάσεως
    του Συμβουλίου για την αναπροσαρμογή των αποδοχών
    και των συντάξεων των υπαλλήλων και του λοιπού
    προσωπικού των Ευρωπαϊκών Κοινοτήτων καθώς
    και των διορθωτικών συντελεστών που εφαρμόζονται
    στις αποδοχές και τις συντάξεις αυτές
  type: main
- language: it
  script: Latn
  content: Regolamento (Euratom, CECA, CEE) n. 3718/84 del Consiglio del 28 dicembre
    1984 che istituisce una misura conservativa in attesa di una decisione del Consiglio
    che adegua le retribuzioni e le pensioni dei funzionari e degli altri agenti delle
    Comunità europee e i coefficienti correttori applicabili a tali retribuzioni
    e pensioni
  type: main
- language: nl
  script: Latn
  content: Verordening (Euratom, EGKS, EEG) nr. 3718/84 van de Raad van 28 december
    1984 houdende vaststelling van een conservatoire maatregel in afwachting van een
    besluit van de Raad houdende aanpassing van de bezoldigingen en pensioenen van
    de ambtenaren en andere personeelsleden van de Europese Gemeenschappen alsmede
    van de aanpassingscoëfficiënten welke van toepassing zijn op deze bezoldigingen
    en pensioenen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE, Euratom, CECA) n.° 3718/84 do Conselho, de 28 de Dezembro
    de 1984, que estabelece uma medida cautelar na expectativa de uma Decisão do
    Conselho que adapta as remunerações e as pensões dos funcionários e outros
    agentes das Comunidades Europeias, assim como os coeficientes de correcção a
    que estão sujeitas estas remunerações e pensões
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE, Euratom, CECA) n° 3718/84 del Consejo, de 28 de diciembre
    de 1984, por el que se establecen medidas provisionales en previsión de la decisión
    del Consejo por la que se adaptan las retribuciones y pensiones de los funcionarios
    y otros agentes de las Comunidades Europeas así como los coeficientes correctores
    que afectan a estas retribuciones y pensiones
  type: main
