  content: Commission Regulation (EEC) No 2274/90 of 1 August 1990 on a decision to
    make no award in respect of the 14th partial invitation to tender for white sugar
    issued in connection with the standing invitation to tender referred to in Regulation
    (EEC) No 983/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2274/90 de la Commission, du 1er août 1990, portant
