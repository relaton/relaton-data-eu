    sucre blanc effectuée dans le cadre de l'adjudication permanente visée au règlement
    (CEE) n 983/90
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2274/90 der Kommission vom 1. August 1990 über die
