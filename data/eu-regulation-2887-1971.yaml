title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2887/71 of the Commission of 30 December 1971 amending
    Regulation (EEC) No 1013/71 laying down detailed rules for the application of
    Regulation (EEC) No 974/71 on certain measures of conjunctural policy to be taken
    in agriculture following the temporary widening of the margins of fluctuation
    for the currencies of certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2887/71 de la Commission, du 30 décembre 1971, portant
    modification du règlement (CEE) n 1013/71 portant modalités d'application du
    règlement (CEE) n° 974/71 relatif à certaines mesures de politique de conjoncture
    à prendre dans le secteur agricole à la suite de l'élargissement temporaire
    des marges de fluctuation des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2887/71 der Kommission vom 30. Dezember 1971 zur dritten
    Änderung der Verordnung (EWG) Nr. 1013/71 zur Festlegung der Durchführungsbestimmungen
    für die Verordnung (EWG) Nr. 974/71 über bestimmte konjunkturpolitische Maßnahmen,
    die in der Landwirtschaft im Anschluß an die vorübergehende Erweiterung der
    Bandbreiten der Währungen einiger Mitgliedstaaten zu treffen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2887/71 af 30. december 1971 om tredje
    ændring af forordning (EØF) nr. 1013/71 om fastlæggelse af gennemføringsbestemmelserne
    for forordning (EØF) nr. 974/71 om visse konjunkturpolitiske foranstaltninger,
    der skal træffes inden for landbrugssektoren som følge af den midlertidige udvidelse
    af grænserne for kursudsving i visse medlemsstaters valutaer
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2887/71 della Commissione, del 30 dicembre 1971, relativo
    alla terza modifica del regolamento (CEE) n. 1013/71 recante modalità di applicazione
    del regolamento (CEE) n. 974/71 relativo a talune misure di politica congiunturale
    da adottare nel settore agricolo in seguito all'ampliamento temporaneo dei margini
    di fluttuazione delle monete di taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2887/71 van de Commissie van 30 december 1971 houdende
    derde wijziging van Verordening (EEG) nr. 1013/71 houdende uitvoeringsbepalingen
    van Verordening (EEG) nr. 974/71 betreffende bepaalde conjunctuurpolitieke maatregelen
    welke naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges van
    de valuta's van sommige Lid-Staten dienen te worden genomen in de landbouwsector
  type: main
