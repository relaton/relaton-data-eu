  content: Council Regulation (EC) No 968/2000 of 8 May 2000 amending Regulation (EC)
    No 603/1999 imposing a definitive anti-dumping duty on imports of polypropylene
    binder or baler twine originating in Poland, the Czech Republic and Hungary, and
    collecting definitively the provisional duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 968/2000 du Conseil du 8 mai 2000 portant modification
    du règlement (CE) nº 603/1999 instituant un droit antidumping définitif sur
    les importations de ficelle lieuse ou botteleuse en polypropylène originaire
    de Pologne, de la République tchèque et de Hongrie et portant perception définitive
    du droit antidumping provisoire
  type: main
- language: de
  script: Latn
