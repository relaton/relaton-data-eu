    auf die Einfuhren von Binde- oder Pressengarnen aus Polypropylen mit Ursprung
    in Polen, der Tschechischen Republik und Ungarn und zur endgültigen Vereinnahmung
    des vorläufigen Zolls
  type: main
- language: da
  script: Latn
