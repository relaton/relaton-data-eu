title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 405/83 of 21 February 1983 amending Regulation
    (EEC) No 180/83 laying down certain interim measures for the conservation and
    management of fishery resources applicable to vessels registered in the Faroe
    Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 405/83 du Conseil du 21 février 1983 modifiant le
    règlement (CEE) no 180/83 fixant certaines mesures intérimaires de conservation
    et de gestion des ressources de pêche applicables aux navires immatriculés aux
    îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 405/83 des Rates vom 21. Februar 1983 zur Änderung
    der Verordnung (EWG) Nr. 180/83 zur Festlegung von Interimsmaßnahmen zur Erhaltung
    und Bewirtschaftung der Fischbestände gegenüber Schiffen, die auf den Färöern
    registriert sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 405/83 af 21. februar 1983 om ændring af
    forordning (EØF) nr. 180/83 om fastsættelse af visse midlertidige foranstaltninger
    til bevarelse og forvaltning af fiskeressourcerne, som skal finde anvendelse på
    fartøjer, der er registreret på Færøerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 405/83 του Συμβουλίου
    της 21ης Φεβρουαρίου 1983 για την τροποποίηση
