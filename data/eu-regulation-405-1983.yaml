    ορισμένων ενδιάμεσων μέτρων διατηρήσεως και
    διαχειρίσεως των αλιευτικών πόρων που εφαρμόζονται
    στα σκάφη που είναι νηολογημένα στις νήσους
    Φερόε
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 405/83 del Consiglio del 21 febbraio 1983 che modifica
    il regolamento (CEE) n. 180/83 che stabilisce talune misure provvisorie di conservazione
    e di gestione delle risorse ittiche, da applicare alle navi immatricolate nelle
    isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 405/83 van de Raad van 21 februari 1983 houdende
