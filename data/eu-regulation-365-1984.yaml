  script: Latn
  content: Verordnung (EWG) Nr. 365/84 der Kommission vom 13. Februar 1984 zur Änderung
    der Verordnung (EWG) Nr. 2958/83 und zur Erhöhung der Dauerausschreibung zur
    Ausfuhr von im Besitz der britischen Interventionsstelle befindlicher Gerste auf
    600 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 365/84 af 13. februar 1984 om ændring
