---
id: EUDecision2017204
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/204 of 3 February 2017 authorising
    Member States to provide for a temporary derogation from certain provisions of
    Council Directive 2000/29/EC in respect of ash wood originating or processed in
    the United States of America, and repealing Implementing Decision (EU) 2015/2416
    recognising certain areas of the United States of America as being free from Agrilus
    planipennis Fairmaire (notified under document C(2017) 420)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/204 de la Commission du 3 février 2017
    autorisant les États membres à prévoir une dérogation temporaire à certaines
    dispositions de la directive 2000/29/CE du Conseil en ce qui concerne le bois
    de frêne originaire des États-Unis d'Amérique ou transformé aux États-Unis
    d'Amérique, et abrogeant la décision (UE) 2015/2416 reconnaissant certaines
    zones des États-Unis d'Amérique comme exemptes d'Agrilus planipennis Fairmaire
    [notifiée sous le numéro C(2017) 420]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/204 der Kommission vom 3. Februar 2017
    zur Ermächtigung der Mitgliedstaaten, eine vorübergehende Ausnahme von bestimmten
    Vorschriften der Richtlinie 2000/29/EG des Rates in Bezug auf Eschenholz zu gewähren,
    dessen Ursprung die Vereinigten Staaten von Amerika sind oder das dort verarbeitet
    wurde, und zur Aufhebung des Durchführungsbeschlusses (EU) 2015/2416 zur Anerkennung
    bestimmter Gebiete der Vereinigten Staaten von Amerika als frei von Agrilus planipennis
    Fairmaire (Bekannt gegeben unter Aktenzeichen C(2017) 420)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/204 на Комисията
    от 3 февруари 2017 година за разрешаване на възможността
    държавите членки да предоставят временна дерогация
    от някои разпоредби на Директива 2000/29/ЕО на
    Съвета по отношение на дървен материал от ясен
    с произход от или преработен в Съединените
    американски щати и за отмяна на Решение за
    изпълнение (ЕС) 2015/2416 за признаване на някои
    зони от Съединените американски щати за свободни
    от Agrilus planipennis Fairmaire (нотифицирано под номер
    С(2017) 420)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/204 ze dne 3. února 2017, kterým
    se členským státům povoluje stanovit dočasnou odchylku od některých ustanovení
    směrnice Rady 2000/29/ES, pokud jde o jasanové dřevo pocházející ze Spojených
    států amerických nebo tam zpracované, a zrušuje prováděcí nařízení
    (EU) 2015/2416, kterým se některé oblasti Spojených států amerických uznávají
    za prosté Agrilus planipennis Fairmaire (oznámeno pod číslem C(2017) 420)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/204 af 3. februar 2017
    om bemyndigelse af medlemsstaterne til at indrømme en midlertidig undtagelse
    fra visse bestemmelser i Rådets direktiv 2000/29/EF for asketræ med oprindelse
    i eller forarbejdet i USA og om ophævelse af gennemførelsesafgørelse (EU) 2015/2416
    om anerkendelse af bestemte områder i USA som værende frie for Agrilus planipennis
    Fairmaire (meddelt under nummer C(2017) 420)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2017/204 της Επιτροπής,
    της 3ης Φεβρουαρίου 2017, με την οποία εξουσιοδοτούνται
    τα κράτη μέλη να προβλέψουν προσωρινή παρέκκλιση
    από ορισμένες διατάξεις της οδηγίας 2000/29/ΕΚ
    του Συμβουλίου όσον αφορά την ξυλεία φράξου
    που κατάγεται από ή που έχει υποστεί επεξεργασία
    στις Ηνωμένες Πολιτείες της Αμερικής, και για
    την κατάργηση της εκτελεστικής απόφασης (ΕΕ)
    2015/2416 σχετικά με την αναγνώριση ορισμένων περιοχών
    των Ηνωμένων Πολιτειών της Αμερικής ως απαλλαγμένων
    από τον επιβλαβή οργανισμό Agrilus planipennis Fairmaire
    [κοινοποιηθείσα υπό τον αριθμό C(2017) 420]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/204, 3. veebruar 2017, millega lubatakse
    liikmesriikidel ette näha ajutine erand teatavatest nõukogu direktiivi 2000/29/EÜ
    sätetest seoses Ameerika Ühendriikidest pärit või Ameerika Ühendriikides
    töödeldud saarepuiduga ja tunnistatakse kehtetuks rakendusotsus (EL) 2015/2416,
    millega tunnistatakse teatavad Ameerika Ühendriikide alad vabaks taimekahjurist
    Agrilus planipennis Fairmaire (teatavaks tehtud numbri C(2017) 420 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/204, annettu 3 päivänä
    helmikuuta 2017, luvan antamisesta jäsenvaltioille säätää väliaikainen poikkeus
    neuvoston direktiivin 2000/29/EY tiettyihin säännöksiin Amerikan yhdysvalloista
    peräisin olevan tai Amerikan yhdysvalloissa jalostetun saarnea olevan puutavaran
    osalta sekä tiettyjen Amerikan yhdysvaltojen alueiden tunnustamisesta vapaaksi
    Agrilus planipennis Fairmaire -kasvintuhoojasta annetun täytäntöönpanopäätöksen
    (EU) 2015/2416 kumoamisesta (tiedoksiannettu numerolla C(2017) 420)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/204 оd 3. veljače 2017. kojom se
    državama članicama dopušta privremeno odstupanje od određenih odredbi Direktive
    Vijeća 2000/29/EZ u pogledu drva jasena podrijetlom iz Sjedinjenih Američkih
    Država ili prerađenog u Sjedinjenim Američkim Državama te o stavljanju izvan
    snage Provedbene odluke (EU) 2015/2416 o priznavanju određenih područja Sjedinjenih
    Američkih Država kao nezaraženih organizmom Agrilus planipennis Fairmaire (priopćeno
    pod brojem dokumenta C(2017) 420)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/204 végrehajtási határozata (2017. február 3.)
    az Amerikai Egyesült Államokból származó vagy ott feldolgozott kőrisfa tekintetében
    a tagállamoknak a 2000/29/EK tanácsi irányelv egyes rendelkezéseitől való
    ideiglenes eltérés engedélyezése céljából adott felhatalmazásról, valamint
    az Amerikai Egyesült Államok egyes területeinek az Agrilus planipennis Fairmaire
    előfordulásától mentesként történő elismeréséről szóló (EU) 2015/2416
    végrehajtási határozat hatályon kívül helyezéséről (az értesítés a
    C(2017) 420. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/204 della Commissione, del 3 febbraio
    2017, che autorizza gli Stati membri a prevedere una deroga temporanea ad alcune
    disposizioni della direttiva 2000/29/CE del Consiglio in relazione al legno di
    frassino originario degli Stati Uniti d'America o ivi lavorato e che abroga la
    decisione di esecuzione (UE) 2015/2416 che riconosce determinate zone degli Stati
    Uniti d'America indenni da Agrilus planipennis Fairmaire [notificata con il numero
    C(2017) 420]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/204 (2017. gada 3. februāris),
    ar ko dalībvalstīm atļauj noteikt pagaidu atkāpi no dažiem Padomes Direktīvas
    2000/29/EK noteikumiem attiecībā uz Amerikas Savienoto Valstu izcelsmes vai
    Amerikas Savienotajās Valstīs pārstrādātu oša koksni un ar kuru atceļ Īstenošanas
    Lēmumu (ES) 2015/2416, ar ko konkrētus Amerikas Savienoto Valstu apgabalus atzīst
    par brīviem no Agrilus planipennis Fairmaire (izziņots ar dokumenta numuru C(2017)
    420)
  type: main
- language: lt
  script: Latn
  content: 2017 m. vasario 3 d. Komisijos įgyvendinimo sprendimas (ES) 2017/204,
    kuriuo valstybėms narėms leidžiama laikinai nukrypti nuo tam tikrų Tarybos
    direktyvos 2000/29/EB nuostatų dėl Jungtinių Amerikos Valstijų kilmės arba
    Jungtinėse Amerikos Valstijose perdirbtos uosio medienos ir kuriuo panaikinamas
    Įgyvendinimo sprendimas (ES) 2015/2416, kuriuo tam tikros Jungtinių Amerikos
    Valstijų vietovės pripažįstamos neužkrėstomis vabalais Agrilus planipennis
    (Fairmaire) (pranešta dokumentu Nr. C(2017) 420)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/204 tat-3 ta'
    Frar 2017 li tawtorizza lill-Istati Membri jipprevedu deroga temporanja minn ċerti
    dispożizzjonijiet tad-Direttiva tal-Kunsill 2000/29/KE fir-rigward tal-injam
    tal-fraxxnu li joriġina jew li ġie pproċessat fl-Istati Uniti tal-Amerka, u
    li tħassar id-Deċiżjoni ta' Implimentazzjoni (UE) 2015/2416 li tirrikonoxxi
    ċerti żoni tal-Istati Uniti tal-Amerka bħala ħielsa mill-Agrilus planipennis
    Fairmaire (notifikata bid-dokument C(2017) 420)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/204 van de Commissie van 3 februari 2017 tot
    machtiging van de lidstaten om tijdelijk af te wijken van een aantal bepalingen
    van Richtlijn 2000/29/EG van de Raad ten aanzien van essenhout van oorsprong uit
    of verwerkt in de Verenigde Staten van Amerika, en tot intrekking van Uitvoeringsbesluit
    (EU) 2015/2416 waarbij bepaalde gebieden van de Verenigde Staten van Amerika worden
    erkend als zijnde vrij van Agrilus planipennis Fairmaire (Kennisgeving geschied
    onder nummer C(2017) 420)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/204 z dnia 3 lutego 2017 r. upoważniająca
    państwa członkowskie do ustanowienia tymczasowego odstępstwa od niektórych
    przepisów dyrektywy Rady 2000/29/WE w odniesieniu do drewna jesionu pochodzącego
    ze Stanów Zjednoczonych Ameryki lub przetwarzanego w Stanach Zjednoczonych Ameryki
    oraz uchylająca decyzję wykonawczą (UE) 2015/2416 uznającą niektóre obszary
    Stanów Zjednoczonych Ameryki za wolne od Agrilus planipennis Fairmaire (notyfikowana
    jako dokument nr C(2017) 420)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/204 da Comissão, de 3 de fevereiro de
    2017, que autoriza os Estados-Membros a estabelecer uma derrogação temporária
    a certas disposições da Diretiva 2000/29/CE do Conselho no que diz respeito
    à madeira de freixo originária dos Estados Unidos da América ou aí transformada,
    e que revoga a Decisão de Execução (UE) 2015/2416 que reconhece certas zonas
    dos Estados Unidos da América como isentas de Agrilus planipennis Fairmaire [notificada
    com o número C(2017) 420]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/204 a Comisiei din 3 februarie
    2017 de autorizare a statelor membre să prevadă o derogare temporară de la
    anumite dispoziții ale Directivei 2000/29/CE a Consiliului în ceea ce privește
    lemnul de frasin originar din sau prelucrat în Statele Unite ale Americii și
    de abrogare a Deciziei de punere în aplicare (UE) 2015/2416 de recunoaștere
    a anumitor zone din Statele Unite ale Americii ca fiind indemne de Agrilus planipennis
    Fairmaire [notificată cu numărul C(2017) 420]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/204 z 3. februára 2017, ktorým
    sa členským štátom povoľuje udeliť dočasnú výnimku z určitých ustanovení
    smernice Rady 2000/29/ES, pokiaľ ide o jaseňové drevo s pôvodom alebo spracované
    v Spojených štátoch amerických, a ktorým sa zrušuje vykonávacie rozhodnutie
    (EÚ) 2015/2416 o uznaní určitých oblastí Spojených štátov amerických
    za oblasti bez výskytu Agrilus planipennis Fairmaire [oznámené pod číslom
    C(2017) 420]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/204 z dne 3. februarja 2017 o dovoljenju
    državam članicam, da določijo začasno odstopanje od nekaterih določb Direktive
    Sveta 2000/29/ES v zvezi z jesenovim lesom, ki izvira iz Združenih držav Amerike
    ali je bil tam obdelan, in razveljavitvi Izvedbenega sklepa (EU) 2015/2416 o priznanju
    nekaterih območij Združenih držav Amerike kot nenapadenih z Agrilus planipennis
    Fairmaire (notificirano pod dokumentarno številko C(2017) 420)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/204 de la Comisión, de 3 de febrero
    de 2017, por la que se autoriza a los Estados miembros a establecer una excepción
    temporal a determinadas disposiciones de la Directiva 2000/29/CE del Consejo en
    lo que respecta a la madera de fresno originaria de los Estados Unidos de América
    o transformada en dicho país, y por la que se deroga la Decisión de Ejecución
    (UE) 2015/2416, por la que se declaran libres de Agrilus planipennis Fairmaire
    determinadas zonas de los Estados Unidos de América [notificada con el número
    C(2017) 420]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/204 av den 3 februari 2017
    om bemyndigande för medlemsstaterna att medge tillfälligt undantag från vissa
    bestämmelser i rådets direktiv 2000/29/EG vad gäller trä av ask med ursprung
    i eller bearbetat i Förenta staterna, och om upphävande av genomförandebeslut
    (EU) 2015/2416 om erkännande av vissa områden i Förenta staterna som fria från
    Agrilus planipennis Fairmaire [delgivet med nr C(2017) 420]
