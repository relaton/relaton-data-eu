    certificados de importação entregues no mês de Abril de 1986 para as carnes
    de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1249/86 de la Comisión, de 29 de abril de 1986, que
