title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2022/220 of 15 February 2022 on the position to
    be taken by the European Union in the Joint Committee established under the Memorandum
    of Cooperation between the European Union and the International Civil Aviation
    Organization providing a framework for enhanced cooperation, on the adoption of
    a Working Arrangement regarding the cooperation in the area of accident and incident
    reporting in civil aviation, and appointing a chairperson of the European Union
    in the Joint Committee
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/220 de la Commission du 15 février 2022 relative à
    la position à prendre par l’Union européenne au sein du comité mixte institué
    en vertu du protocole de coopération entre l’Union européenne et l’Organisation
    de l’aviation civile internationale fournissant un cadre de coopération renforcée,
    en ce qui concerne l’adoption de modalités de collaboration concernant la coopération
    en matière de comptes rendus d’accidents et d’incidents dans l’aviation
    civile et la désignation d’un président de l’Union européenne au sein du
    comité mixte
  type: main
