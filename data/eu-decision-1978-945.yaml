title:
- language: en
  script: Latn
  content: '78/945/EEC: Commission Decision of 31 October 1978 authorizing the Italian
    Republic not to apply Community treatment to essential oils, not terpeneless,
    of citrus fruit: orange oil, falling within subheading 33.01 ex A of the Common
    Customs Tariff (NIMEXE code 33.01-12), originating in Brazil and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/945/CEE: Décision de la Commission, du 31 octobre 1978, autorisant
    la République italienne à exclure du traitement communautaire les huiles essentielles
    non déterpénées d'' agrumes : essence d'' orange, de la sous-position 33.01
    ex A du tarif douanier commun (code Nimexe : 33.01-12), originaires du Brésil
    et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/945/EWG: Entscheidung der Kommission vom 31. Oktober 1978, mit der
    die Italienische Republik ermächtigt wird, aus Brasilien stammende und in den
    úbrigen Mitgliedstaaten im freien Verkehr befindliche átherische Óle, nicht
    terpenfrei gemacht, von Zitrusfrúchten: Súß- und Bitterorangenól, der Tarifstelle
    33.01 ex A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffer 33.01-12) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/945/EØF: Kommissionens beslutning af 31. oktober 1978 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage flygtige
    vegetabilske olier, ikke terpenfri, af citrusfrugter: appelsin- og pomeransskalolie,
    som henhører under pos. 33.01 ex A i den fælles toldtarif (NIMEXE-kode 33.01-12),
    har oprindelse i Brasilien og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/945/CEE: Decisione della Commissione, del 31 ottobre 1978, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario gli oli essenziali
    non deterpenati di agrumi: essenza di arancio della sottovoce 33.01 ex A della
    tariffa doganale comune (codice Nimexe: 33.01-12), originari del Brasile e messi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/945/EEG: Beschikking van de Commissie van 31 oktober 1978 waarbij de
    Italiaanse Republiek wordt gemachtigd etherische oliën, waaruit de terpenen niet
    zijn afgesplitst van citrusvruchten : sinaasappelolie, van post 33.01 ex A van
    het gemeenschappelijk douanetarief (NIMEXE-code 33.01-12), van oorsprong uit Brazilië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
