title:
- language: en
  script: Latn
  content: '80/963/EEC: Commission Decision of 29 September 1980 on the reimbursement
    by the EAGGF, Guidance Section, to Ireland of expenditure incurred during 1979,
    in connection with Community measures for the eradication of brucellosis, tuberculosis
    and leucosis in cattle (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/963/CEE: Décision de la Commission, du 29 septembre 1980, relative
    au remboursement par Fonds européen d''orientation et de garantie agricole, section
    "orientation", à l''Irlande des dépenses effectuées pendant l''année 1979
    dans le cadre d''une action de la Communauté en vue de l''éradication de la
    brucellose, de la tuberculose et de la leucose des bovins (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/963/EWG: Entscheidung der Kommission vom 29. September 1980 über die
    Erstattung der Ausgaben des Jahres 1979 für die Einführung von Maßnahmen der
    Gemeinschaft zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder
    an Irland (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/963/EØF: Kommissionens beslutning af 29. september 1980 om refusion
    gennem EUGFL, udviklingssektionen, til Irland af udgifter afholdt i 1979 i forbindelse
    med en fællesskabsaktion med henblik på udryddelse af brucellose, tuberkulose
    og leukose hos kvæg (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/963/CEE: Decisione della Commissione, del 29 settembre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, all''Irlanda delle spese
    effettuate nell''anno 1979 nel quadro di un''azione della Comunità per l''eradicazione
    della brucellosi, della tubercolosi e della leucosi dei bovini (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/963/EEG: Beschikking van de Commissie van 29 september 1980 betreffende
    de vergoeding door het EOGFL, afdeling Oriëntatie, aan Ierland van de in 1979
    gedane uitgaven in het kader van een gemeenschappelijke actie voor de uitroeiing
    van brucellose, tuberculose, en leukose bij runderen (Slechts de tekst in de Engelse
    taal is authentiek)'
