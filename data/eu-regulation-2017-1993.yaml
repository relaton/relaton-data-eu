    2 nariadenia Európskeho parlamentu a Rady (EÚ) 2016/1036 ukladá konečné antidumpingové
    clo na dovoz určitých riedkych sieťovín zo sklenených vláken s pôvodom
    v Čínskej ľudovej republike, rozšírené na dovoz určitých riedkych sieťovín
    zo sklenených vláken zasielaných z Indie, Indonézie, Malajzie, Taiwanu a Thajska
    bez ohľadu na to, či majú alebo nemajú deklarovaný pôvod v týchto krajinách
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2017/1993 z dne 6. novembra 2017 o uvedbi
    dokončne protidampinške dajatve na uvoz nekaterih tkanin z odprto mrežno strukturo
    iz steklenih vlaken s poreklom iz Ljudske republike Kitajske, kakor je bila razširjena
    na uvoz nekaterih tkanin z odprto mrežno strukturo iz steklenih vlaken, poslanih
    iz Indije, Indonezije, Malezije, Tajvana in Tajske, ne glede na to, ali so deklarirane
    kot izdelek s poreklom iz teh držav ali ne, po pregledu zaradi izteka ukrepa
    v skladu s členom 11(2) Uredbe (EU) 2016/1036 Evropskega parlamenta in Sveta
  type: main
