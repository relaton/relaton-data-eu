    hatályvesztési felülvizsgálatot követő kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/1993 della Commissione, del 6 novembre
    2017, che istituisce un dazio antidumping definitivo sulle importazioni di alcuni
    tessuti in fibra di vetro a maglia aperta originari della Repubblica popolare
    cinese esteso alle importazioni di alcuni tessuti in fibra di vetro a maglia aperta
