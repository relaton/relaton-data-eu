title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1993 of 6 November 2017 imposing
    a definitive anti-dumping duty on imports of certain open mesh fabrics of glass
    fibres originating in the People's Republic of China as extended to imports of
    certain open mesh fabrics of glass fibres consigned from India, Indonesia, Malaysia,
    Taiwan and Thailand, whether declared as originating in these countries or not,
    following an expiry review pursuant to Article 11(2) of the Regulation (EU) 2016/1036
    of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/1993 de la Commission du 6 novembre 2017
    instituant un droit antidumping définitif sur les importations de certains tissus
    de fibre de verre à maille ouverte originaires de la République populaire de
    Chine tel qu'étendu aux importations de certains tissus de fibre de verre à
    maille ouverte expédiés de l'Inde, d'Indonésie, de Malaisie, de Taïwan et
    de Thaïlande, qu'ils aient ou non été déclarés originaires de ces pays, à
    l'issue d'un réexamen de mesures parvenant à expiration effectué conformément
    à l'article 11, paragraphe 2, du règlement (UE) 2016/1036 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/1993 der Kommission vom 6. November
    2017 zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter
    offenmaschiger Gewebe aus Glasfasern mit Ursprung in der Volksrepublik China,
    ausgeweitet auf die Einfuhren bestimmter aus Indien, Indonesien, Malaysia, Taiwan
    und Thailand versandter offenmaschiger Gewebe aus Glasfasern, ob als Ursprungserzeugnisse
    dieser Länder angemeldet oder nicht, im Anschluss an eine Auslaufüberprüfung
    nach Artikel 11 Absatz 2 der Verordnung (EU) 2016/1036 des Europäischen Parlaments
    und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/1993 на Комисията
    от 6 ноември 2017 година за налагане на окончателно
    антидъмпингово мито върху вноса на определени
    мрежести тъкани от стъклени влакна с произход
    от Китайската народна република, чийто обхват
    бе разширен за вноса на определени мрежести
    тъкани от стъклени влакна, изпращани от Индия,
    Индонезия, Малайзия, Тайван и Тайланд, независимо
    дали са декларирани с произход от тези държави,
    след направения преглед с оглед изтичане на
    срока на действие на мерките съгласно член
    11, параграф 2 от Регламент (ЕС) 2016/1036 на Европейския
    парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/1993 ze dne 6. listopadu 2017,
    kterým se ukládá konečné antidumpingové clo na dovoz některých otevřených
    síťovin ze skleněných vláken pocházejících z Čínské lidové republiky
    rozšířené na dovoz některých otevřených síťovin ze skleněných vláken
    zasílaných z Indie, Indonésie, Malajsie, Tchaj-wanu a Thajska bez ohledu na
