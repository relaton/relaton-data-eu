    behozatalára vonatkozó, az Indiában, az Indonéziában, a Malajziában, a Tajvanon
    és a Thaiföldön feladott, akár ezekből az országokból származóként,
    akár nem ilyenként bejelentett egyes üvegrostból készült hálószövetek
    behozatalára is kiterjesztett végleges dömpingellenes vámnak az (EU) 2016/1036
