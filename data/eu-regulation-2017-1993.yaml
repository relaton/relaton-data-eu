    2017 om införande av en slutgiltig antidumpningstull på import av vissa glasfibervävnader
    med öppna maskor med ursprung i Folkrepubliken Kina, utvidgad till att omfatta
    import av vissa glasfibervävnader med öppna maskor som avsänts från Indien,
    Indonesien, Malaysia, Taiwan och Thailand, oavsett om produkternas deklarerade
