  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2017/1993 оd 6. studenoga 2017. o uvođenju
    konačne antidampinške pristojbe na uvoz određenih tkanina otvorene mrežaste
    strukture od staklenih vlakana podrijetlom iz Narodne Republike Kine kako je proširena
    na uvoz određenih tkanina otvorene mrežaste strukture od staklenih vlakana poslanih
    iz Indije, Indonezije, Malezije, Tajvana i Tajlanda, bez obzira na to imaju li
