id: EURegulation8121973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 812/73 of the Council of 22 March 1973 delaying the
    application to the United Kingdom of Regulations (EEC) No 1055/72 on notifying
    the Commission on fuel imports and (EEC) No 1056/72 on notifying the Commission
    about investment projects of interest to the Community in the petroleum, natural
    gas and electricity sectors
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 812/73 du Conseil, du 22 mars 1973, différant l'application
    au Royaume-Uni des règlements (CEE) n° 1055/72 concernant la communication à
    la Commission des importations d'hydrocarbures et (CEE) n° 1056/72 concernant
    la communication à la Commission des projets d'investissement d'intérêt communautaire
    dans le secteur du pétrole, du gaz naturel et de l'électricité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 812/73 des Rates vom 22. März 1973 zur Verschiebung
    des Zeitpunkts, in dem im Vereinigten Königreich die Verordnungen (EWG) Nr. 1055/72
    über die Mitteilung der Einfuhr von Kohlenwasserstoffen an die Kommission und
    (EWG) Nr. 1056/72 über die Mitteilung der Investitionsvorhaben von gemeinschaftlichem
    Interesse auf dem Erdöl-, Erdgas- und Elektrizitätssektor an die Kommission
    angewendet wird
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 812/73 af 22. marts 1973 om udsættelse af
    anvendelsen for så vidt angår Det forenede Kongerige af forordning (EØF) nr.
    1055/72 om indberetning til Kommissionen om indførsel af kulbrinter, og forordning
    (EØF) nr. 1056/72 om inberetning til Kommissionen om planlagte investeringer
    af interesse for Fællesskabet inden for jordolie, naturgas- og elektricitetssektorerne
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 812/73 del Consiglio, del 22 marzo 1973, che definisce
    l'applicazione nel Regno Unito dei regolamenti (CEE) n. 1055/72 riguardante la
    comunicazione alla Commissione delle importazioni di idrocarburi e (CEE) n. 1056/72
    sulla comunicazione alla Commissione dei progetti d'investimento di interesse
    comunitario nei settori del petrolio, del gas naturale e dell'elettricità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 812/73 van de Raad van 22 maart 1973 tot uitstel
    van de toepassing op het Verenigd Koninkrijk van de Verordeningen (EEG) nr. 1055/72
    inzake de mededeling aan de Commissie van de invoer van koolwaterstoffen en (EEG)
    nr. 1056/72 inzake mededeling aan de Commissie van investeringsprojecten van communautair
    belang in de sectoren aardolie, aardgas en elektriciteit
  type: main
