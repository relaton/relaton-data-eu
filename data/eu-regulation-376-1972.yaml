title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 376/72 de la Commission, du 23 février 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fils de lin ou de ramie, non conditionnés pour la vente au détail, de la
    position tarifaire 54.03, originaires des pays en voie de développement bénéficiaires
    de préférences tarifaires prévues par le règlement (CEE) n° 2799/71 du Conseil
    du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 376/72 der Kommission vom 23. Februar 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Leinengarne und Ramiegarne, nicht
    in Aufmachungen für den Einzelverkauf, der Tarifnummer 54.03, mit Ursprung in
    Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2799/71 des Rates
    vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 376/72 della Commissione, del 23 febbraio 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    filati di lino o di ramiè, non preparati per la vendita al minuto della voce
    doganale n. 54.03 originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2799/71 del Consiglio, del 20 dicembre
    1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 376/72 van de Commissie van 23 februari 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op garens van vlas of van ramee, niet gereed voor de verkoop in
    het klein, van post 54.03, van oorsprong uit de ontwikkelingslanden, ten behoeve
    waarvan bij Verordening (EEG) nr. 2799/71 van de Raad van 20 december 1971 tariefpreferenties
    werden geopend
  type: main
