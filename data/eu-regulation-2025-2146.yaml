title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/2146 of 22 October 2025 imposing
    a definitive anti-dumping duty on imports of bicycles originating in the People’s
    Republic of China as extended to imports of bicycles consigned from Indonesia,
    Malaysia, Sri Lanka, Tunisia, Cambodia, Pakistan and the Philippines, whether
    declared as originating in these countries or not, following an expiry review
    pursuant to Article 11(2) of Regulation (EU) 2016/1036 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/2146 de la Commission du 22 octobre
    2025 instituant un droit antidumping définitif sur les importations de bicyclettes
    originaires de la République populaire de Chine, tel qu’étendu aux importations
    de bicyclettes expédiées d’Indonésie, de Malaisie, de Sri Lanka, de Tunisie,
    du Cambodge, du Pakistan et des Philippines, qu’elles aient ou non été déclarées
    originaires de ces pays, à l’issue d’un réexamen au titre de l’expiration
    des mesures effectué conformément à l’article 11, paragraphe 2, du règlement
    (UE) 2016/1036 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/2146 der Kommission vom 22. Oktober
    2025 zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren von
    Fahrrädern mit Ursprung in der Volksrepublik China, ausgeweitet auf aus Indonesien,
    Malaysia, Sri Lanka, Tunesien, Kambodscha, Pakistan und den Philippinen versandte
    Einfuhren von Fahrrädern, ob als Ursprungserzeugnisse aus diesen Ländern angemeldet
    oder nicht, im Anschluss an eine Auslaufüberprüfung nach Artikel 11 Absatz 2
    der Verordnung (EU) 2016/1036 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/2146 на Комисията
    от 22 октомври 2025 година за налагане на окончателно
    антидъмпингово мито върху вноса на велосипеди
    с произход от Китайската народна република,
    чийто обхват се разширява, за да включва вноса
    на велосипеди, изпращани от Индонезия, Малайзия,
    Шри Ланка, Тунис, Камбоджа, Пакистан и Филипините,
    независимо дали са декларирани с произход
    от тези държави, след провеждане на преглед
    с оглед изтичане на срока на действие съгласно
    член 11, параграф 2 от Регламент (ЕС) 2016/1036 на
    Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/2146 ze dne 22. října 2025,
    kterým se na základě přezkumu před pozbytím platnosti podle čl. 11 odst.
    2 nařízení Evropského parlamentu a Rady (EU) 2016/1036 ukládá konečné
    antidumpingové clo na dovoz jízdních kol pocházejících z Čínské lidové
    republiky rozšířené na dovoz jízdních kol odesílaných z Indonésie, Malajsie,
    ze Šrí Lanky, z Tuniska, Kambodže, Pákistánu a Filipín, bez ohledu na to,
    zda je u něj deklarován původ z těchto zemí
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/2146 af 22. oktober 2025
    om indførelse af en endelig antidumpingtold på importen af cykler med oprindelse
    i Folkerepublikken Kina, udvidet til også at omfatte importen af cykler afsendt
    fra Indonesien, Malaysia, Sri Lanka, Tunesien, Cambodja, Pakistan og Filippinerne,
    uanset om varen er angivet med oprindelse i disse lande eller ej, efter en udløbsundersøgelse
    i henhold til artikel 11, stk. 2, i Europa-Parlamentets og Rådets forordning
    (EU) 2016/1036
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2025/2146 της Επιτροπής,
    της 22ας Οκτωβρίου 2025, για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ποδηλάτων
