    2 του κανονισμού (ΕΕ) 2016/1036 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2025/2146, 22. oktoober 2025, millega kehtestatakse
    pärast Euroopa Parlamendi ja nõukogu määruse (EL) 2016/1036 artikli 11 lõike
    2 kohast aegumise läbivaatamist Hiina Rahvavabariigist pärit jalgrataste impordi
    suhtes lõplik dumpinguvastane tollimaks, mis laieneb Indoneesiast, Malaisiast,
    Sri Lankalt, Tuneesiast, Kambodžast, Pakistanist ja Filipiinidelt lähetatud
    jalgrataste impordile, olenemata sellest, kas need riigid on deklareeritud päritolumaana
    või mitte
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2025/2146, annettu 22 päivänä
    lokakuuta 2025, lopullisen polkumyyntitullin käyttöön ottamisesta Kiinan kansantasavallasta
    peräisin olevien polkupyörien tuonnissa, sellaisena kuin se on laajennettu koskemaan
    Indonesiasta, Malesiasta, Sri Lankasta, Tunisiasta, Kambodžasta, Pakistanista
    ja Filippiineiltä lähetettyjen polkupyörien tuontia, riippumatta siitä, onko
    niiden alkuperämaaksi ilmoitettu Indonesia, Malesia, Sri Lanka, Tunisia, Kambodža,
    Pakistan tai Filippiinit, Euroopan parlamentin ja neuvoston asetuksen (EU) 2016/1036
    11 artiklan 2 kohdan mukaisen toimenpiteiden voimassaolon päättymistä koskevan
    tarkastelun jälkeen
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2025/2146 ón gCoimisiún an 22 Deireadh
    Fómhair 2025 lena bhforchuirtear dleacht frithdhumpála chinntitheach ar allmhairí
    rothar de thionscnamh Dhaon-Phoblacht na Síne, arna leathnú chun allmhairí
    rothar a chuirtear chun bealaigh ón Indinéis, ón Malaeisia, ó Shrí Lanca,
    ón Túinéis, ón gCambóid, ón bPacastáin agus ó na hOileáin Fhilipíneacha
    a chumhdach, bíodh sé dearbhaithe gur de thionscnamh na dtíortha sin iad nó
    ná bíodh, tar éis athbhreithniú éaga de bhun Airteagal 11(2) de Rialachán
    (AE) 2016/1036 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/2146 оd 22. listopada 2025. o uvođenju
    konačne antidampinške pristojbe na uvoz bicikala podrijetlom iz Narodne Republike
    Kine kako je proširena na uvoz bicikala poslanih iz Indonezije, Malezije, Šri
    Lanke, Tunisa, Kambodže, Pakistana i Filipina, bez obzira na to imaju li deklarirano
    podrijetlo iz tih zemalja, nakon revizije zbog predstojećeg isteka mjera u skladu
    s člankom 11. stavkom 2. Uredbe (EU) 2016/1036 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/2146 végrehajtási rendelete (2025. október 22.)
    a Kínai Népköztársaságból származó kerékpárok behozatalára vonatkozó,
    az Indonéziában, Malajziában, Srí Lankán, Tunéziában, Kambodzsában, Pakisztánban
    és a Fülöp-szigeteken feladott, akár ezekből az országokból származóként,
    akár nem ilyenként bejelentett kerékpárok behozatalára is kiterjesztett végleges
    dömpingellenes vámnak az (EU) 2016/1036 európai parlamenti és tanácsi rendelet
    11. cikkének (2) bekezdése szerinti hatályvesztési felülvizsgálatot követő
    kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/2146 della Commissione, del 22 ottobre
    2025, che istituisce un dazio antidumping definitivo sulle importazioni di biciclette
    originarie della Repubblica popolare cinese esteso alle importazioni di biciclette
    spedite dall’Indonesia, dalla Malaysia, dallo Sri Lanka, dalla Tunisia, dalla
    Cambogia, dal Pakistan e dalle Filippine, indipendentemente dal fatto che siano
    o no dichiarate originarie di tali paesi, a seguito di un riesame in previsione
    della scadenza a norma dell’articolo 11, paragrafo 2, del regolamento (UE) 2016/1036
    del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/2146 (2025. gada 22. oktobris),
    ar ko pēc termiņbeigu pārskatīšanas, kura veikta, ievērojot Eiropas Parlamenta
    un Padomes Regulas (ES) 2016/1036 11. panta 2. punktu, nosaka galīgo antidempinga
    maksājumu Ķīnas Tautas Republikas izcelsmes velosipēdu importam un paplašina
    to, attiecinot uz tādu velosipēdu importu, kas nosūtīti no Indonēzijas, Malaizijas,
    Šrilankas, Tunisijas, Kambodžas, Pakistānas un Filipīnām, neatkarīgi no
    tā, vai šiem velosipēdiem ir deklarēta šo valstu izcelsme
  type: main
- language: lt
  script: Latn
  content: 2025 m. spalio 22 d. Komisijos įgyvendinimo reglamentas (ES) 2025/2146,
    kuriuo pagal Europos Parlamento ir Tarybos reglamento (ES) 2016/1036 11 straipsnio
    2 dalį atlikus priemonių galiojimo termino peržiūrą importuojamiems Kinijos
    Liaudies Respublikos kilmės dviračiams nustatomas galutinis antidempingo muitas,
    taip pat taikomas importuojamiems iš Indonezijos, Malaizijos, Šri Lankos, Tuniso,
    Kambodžos, Pakistano ir Filipinų siunčiamiems dviračiams, deklaruojamiems
    arba nedeklaruojamiems kaip šių šalių kilmės
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/2146 tat-22
    ta’ Ottubru 2025 li jimponi dazju anti-dumping definittiv fuq l-importazzjonijiet
    ta’ roti li joriġinaw mir-Repubblika tal-Poplu taċ-Ċina kif estiż għall-importazzjonijiet
    ta’ roti kkunsinjati mill-Indoneżja, mill-Malażja, mis-Sri Lanka, mit-Tuneżija,
    mill-Kambodja, mill-Pakistan u mill-Filippini, kemm jekk iddikjarati bħala li
    joriġinaw minn dawn il-pajjiżi kif ukoll jekk le, wara rieżami tal-iskadenza
    skont l-Artikolu 11(2) tar-Regolament (UE) 2016/1036 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/2146 van de Commissie van 22 oktober 2025
    tot instelling van een definitief antidumpingrecht op rijwielen van oorsprong
    uit de Volksrepubliek China, zoals uitgebreid tot rijwielen verzonden vanuit Indonesië,
    Maleisië, Sri Lanka, Tunesië, Cambodja, Pakistan en de Filipijnen, al dan niet
    aangegeven als van oorsprong uit deze landen, naar aanleiding van een nieuw onderzoek
    bij het vervallen van de maatregelen op grond van artikel 11, lid 2, van Verordening
    (EU) 2016/1036 van het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/2146 z dnia 22 października
    2025 r. nakładające ostateczne cło antydumpingowe na przywóz rowerów pochodzących
    z Chińskiej Republiki Ludowej rozszerzone na przywóz rowerów wysyłanych z
    Indonezji, z Malezji, ze Sri Lanki, z Tunezji, z Kambodży, z Pakistanu i z Filipin,
    zgłoszonych lub niezgłoszonych jako pochodzące z tych państw, w następstwie
    przeglądu wygaśnięcia na podstawie art. 11 ust. 2 rozporządzenia Parlamentu
    Europejskiego i Rady (UE) 2016/1036
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/2146 da Comissão, de 22 de outubro
    de 2025, que institui um direito anti-dumping definitivo sobre as importações
    de bicicletas originárias da República Popular da China, tornado extensivo às
    importações de bicicletas expedidas da Indonésia, da Malásia, do Seri Lanca,
    da Tunísia, do Camboja, do Paquistão e das Filipinas, independentemente de serem
    ou não declaradas originárias destes países, na sequência de um reexame da
    caducidade nos termos do artigo 11.o, n.o 2, do Regulamento (UE) 2016/1036 do
    Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/2146 al Comisiei din 22 octombrie
    2025 de instituire a unei taxe antidumping definitive la importurile de biciclete
    originare din Republica Populară Chineză, astfel cum a fost extinsă la importurile
    de biciclete expediate din Indonezia, Malaysia, Sri Lanka, Tunisia, Cambodgia,
    Pakistan și Filipine, indiferent dacă au fost sau nu declarate ca fiind originare
    din aceste țări, în urma unei reexaminări efectuate în perspectiva expirării
    măsurilor în temeiul articolului 11 alineatul (2) din Regulamentul (UE) 2016/1036
    al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/2146 z 22. októbra 2025, ktorým
    sa ukladá konečné antidumpingové clo na dovoz bicyklov s pôvodom v Čínskej
    ľudovej republike po jeho rozšírení na dovoz bicyklov odosielaných z Indonézie,
    Malajzie, zo Srí Lanky, z Tuniska, Kambodže, Pakistanu a Filipín bez ohľadu
    na to, či majú alebo nemajú deklarovaný pôvod v týchto krajinách, po revíznom
    prešetrovaní pred uplynutím platnosti podľa článku 11 ods. 2 nariadenia
    Európskeho parlamentu a Rady (EÚ) 2016/1036
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/2146 z dne 22. oktobra 2025 o uvedbi
    dokončne protidampinške dajatve na uvoz koles s poreklom iz Ljudske republike
    Kitajske, kakor je bila razširjena na uvoz koles, poslanih iz Indonezije, Malezije,
    s Šrilanke, iz Tunizije, Kambodže, Pakistana in s Filipinov, ne glede na to,
    ali so deklarirana kot izdelek s poreklom iz teh držav ali ne, po pregledu zaradi
    izteka ukrepov v skladu s členom 11(2) Uredbe (EU) 2016/1036 Evropskega parlamenta
    in Sveta
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/2146 de la Comisión, de 22 de octubre
    de 2025, por el que se establece un derecho antidumping definitivo sobre las importaciones
    de bicicletas originarias de la República Popular China, ampliado a las importaciones
    de bicicletas procedentes de Indonesia, Malasia, Sri Lanka, Túnez, Camboya, Pakistán
    y Filipinas, hayan sido o no declaradas originarias de dichos países, tras una
    reconsideración por expiración en virtud del artículo 11, apartado 2, del Reglamento
    (UE) 2016/1036 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/2146 av den 22 oktober
    2025 om införande av en slutgiltig antidumpningstull på import av cyklar med
    ursprung i Folkrepubliken Kina, utvidgad till att även omfatta import av cyklar
    som avsänts från Indonesien, Malaysia, Sri Lanka, Tunisien, Kambodja, Pakistan
    och Filippinerna, oavsett om deras deklarerade ursprung är dessa länder eller
    inte, efter en översyn vid giltighetstidens utgång i enlighet med artikel 11.2
    i Europaparlamentets och rådets förordning (EU) 2016/1036
