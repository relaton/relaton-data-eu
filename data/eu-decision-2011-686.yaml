---
id: EUDecision2011686
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision of 13 October 2011 amending Annex I to
    Decision 2004/211/EC as regards the entry for Mexico in the list of third countries
    and parts thereof from which the introduction into the Union of live equidae and
    semen, ova and embryos of the equine species are authorised (notified under document
    C(2011) 7168)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution de la Commission du 13 octobre 2011 modifiant
    l’annexe I de la décision 2004/211/CE en ce qui concerne la mention relative
    au Mexique figurant dans la liste des pays tiers et des parties de ces pays en
    provenance desquels l’introduction dans l’Union européenne d’équidés
    vivants et de sperme, d’ovules et d’embryons de l’espèce équine est autorisée
    [notifiée sous le numéro C(2011) 7168]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss der Kommission vom 13. Oktober 2011 zur Änderung
    des Anhangs I der Entscheidung 2004/211/EG hinsichtlich des Eintrags zu Mexiko
    in der Liste von Drittländern und Teilen von Drittländern, aus denen die Einfuhr
    von lebenden Equiden sowie von Equidensperma, -eizellen und -embryonen in die
    Europäische Union zugelassen ist (Bekannt gegeben unter Aktenzeichen K(2011)
    7168)
  type: main
- language: bg
  script: Cyrl
  content: '2011/686/ЕС: Решение за изпълнение на Комисията
    от 13 октомври 2011 година за изменение на приложение
    I към Решение 2004/211/ЕО по отношение на вписването
    за Мексико в списъка на третите страни и части
    от тях, от които е разрешено въвеждането в Европейския
    съюз на живи еднокопитни и на сперма, яйцеклетки
    и ембриони от еднокопитни (нотифицирано под
    номер C(2011) 7168)'
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise ze dne 13. října 2011 , kterým se mění
    příloha I rozhodnutí 2004/211/ES, pokud jde o položku týkající se Mexika
    v seznamu třetích zemí a jejich částí, ze kterých je povolen dovoz živých
    koňovitých a spermatu, vajíček a embryí druhů koňovitých do Unie (oznámeno
    pod číslem K(2011) 7168)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse af 13. oktober 2011 om ændring
    af bilag I til beslutning 2004/211/EF for så vidt angår oplysningerne om Mexico
    i listen over tredjelande og dele af tredjelande, hvorfra indførsel til Unionen
    af levende dyr af hestefamilien samt sæd, æg og embryoner fra dyr af hestefamilien
    er tilladt (meddelt under nummer K(2011) 7168)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση της Επιτροπής, της
    13ης Οκτωβρίου 2011 , για την τροποποίηση του παραρτήματος
    I της απόφασης 2004/211/ΕΚ όσον αφορά την καταχώριση
    για το Μεξικό στον κατάλογο των τρίτων χωρών
    και των περιοχών τους από τις οποίες επιτρέπονται
    οι εισαγωγές ζώντων ιπποειδών και σπέρματος,
    ωαρίων και εμβρύων ιπποειδών στην Ευρωπαϊκή
    Ένωση [κοινοποιηθείσα υπό τον αριθμό Ε(2011) 7168]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus, 13. oktoober 2011 , millega muudetakse otsuse
    2004/211/EÜ I lisa seoses Mehhiko kohta tehtud kannetega loetelus, kuhu on kantud
    sellised kolmandad riigid ja nende osad, millest on lubatud tuua liitu elushobuslasi
    ning hobuslaste spermat, munarakke ja embrüoid (teatavaks tehtud numbri K(2011)
    7168 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös, annettu 13 päivänä lokakuuta
    2011 , päätöksen 2004/211/EY liitteen I muuttamisesta Meksikoa koskevan kohdan
    osalta niiden kolmansien maiden ja kolmansien maiden alueiden luettelossa, joista
    elävien hevoseläinten ja hevoseläinten siemennesteen, munasolujen ja alkioiden
    tuonti unioniin on sallittua (tiedoksiannettu numerolla K(2011) 7168)
  type: main
- language: hr
  script: Latn
  content: '2011/686/EU: Provedbena odluka Komisije od 13. listopada 2011. o izmjeni
    Priloga I. Odluci 2004/211/EZ u pogledu navoda za Meksiko na popisu trećih zemalja
    i njihovih dijelova iz kojih je odobreno unošenje živih kopitara te sjemena,
    jajnih stanica i zametaka kopitara u Uniju (priopćena pod brojem dokumenta C(2011)
    7168)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság végrehajtási határozata ( 2011. október 13. ) a 2004/211/EK
    határozat I. mellékletének az élő lófélék és ezek spermájának, petesejtjének
    és embriójának Európai Unióba történő behozatala tekintetében engedélyezett
    harmadik országok és országrészek jegyzékében a Mexikóra vonatkozó bejegyzések
    tekintetében történő módosításáról (az értesítés a C(2011) 7168. számú
    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione della Commissione, del 13 ottobre 2011 , che modifica
    la decisione 2004/211/CE per quanto concerne la voce relativa al Messico nell’elenco
    dei paesi terzi e delle parti di paesi terzi da cui sono autorizzate le importazioni
    nell’Unione di equidi vivi nonché di sperma, ovuli ed embrioni della specie
    equina [notificata con il numero C(2011) 7168]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums ( 2011. gada 13. oktobris ), ar ko groza
    Lēmuma 2004/211/EK I pielikumu attiecībā uz ierakstu par Meksiku to trešo
    valstu un ar tām saistīto teritoriju daļu sarakstā, no kurām atļauj Savienībā
    ievest dzīvus zirgu dzimtas dzīvniekus un to spermu, olšūnas un embrijus (izziņots
    ar dokumenta numuru C(2011) 7168)
  type: main
- language: lt
  script: Latn
  content: 2011 m. spalio 13 d. Komisijos įgyvendinimo sprendimas, kuriuo dėl Meksikos
    įrašo trečiųjų šalių ar jų dalių, iš kurių į Sąjungą leidžiama
    įvežti gyvus arklinių šeimos gyvūnus ir arklių rūšių gyvūnų spermą,
    kiaušialąstes ir embrionus, sąraše iš dalies keičiamas Sprendimo 2004/211/EB
    I priedas (pranešta dokumentu Nr. C(2011) 7168)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tat- 13 ta’ Ottubru
    2011 li temenda l-Anness I tad-Deċiżjoni 2004/211/KE fir-rigward tal-entrata
    tal-Messiku fil-lista ta’ pajjiżi terzi u ta’ partijiet mit-territorju tagħhom
    li minnhom hija awtorizzata l-introduzzjoni fl-Unjoni ta’ ekwidi ħajjin kif
    ukoll ta’ semen, ova u embrijoni tal-ispeċi ekwina (notifikata bid-dokument
    numru C(2011) 7168)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit van de Commissie van 13 oktober 2011 tot wijziging van
    bijlage I bij Beschikking 2004/211/EG wat betreft de gegevens voor Mexico in de
    lijst van derde landen en delen daarvan waaruit het binnenbrengen in de Unie van
    levende paardachtigen en sperma, eicellen en embryo’s van paarden is toegestaan
    (Kennisgeving geschied onder nummer C(2011) 7168)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji z dnia 13 października 2011 r. zmieniająca
    załącznik I do decyzji 2004/211/WE w odniesieniu do zapisu dotyczącego Meksyku
    w wykazie państw trzecich oraz części ich terytoriów, z których dozwolony
    jest przywóz do Unii żywych zwierząt z rodziny koniowatych, nasienia, komórek
    jajowych i zarodków koni (notyfikowana jako dokument nr C(2011) 7168)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução da Comissão, de 13 de Outubro de 2011 , que altera
    o anexo I da Decisão 2004/211/CE no que se refere à entrada relativa ao México
    na lista de países terceiros e partes de países terceiros a partir dos quais
    é autorizada a introdução no território da União de equídeos vivos e de
    sémen, óvulos e embriões de equídeos [notificada com o número C(2011) 7168]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare a Comisiei din 13 octombrie 2011 de modificare
    a anexei I la Decizia 2004/211/CE în ceea ce privește rubrica referitoare la
    Mexic din lista țărilor terțe și a părților acestora din care sunt autorizate
    importuri în Uniune de ecvidee vii și de material seminal, de ovule și de embrioni
    din specia ecvină [notificată cu numărul C(2011) 7168]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie z 13. októbra 2011 , ktorým sa mení
    a dopĺňa príloha I k rozhodnutiu 2004/211/ES, pokiaľ ide o záznam týkajúci
    sa Mexika v zozname tretích krajín a ich častí, z ktorých sa povoľuje vstup
    živých zvierat čeľade koňovité a spermy, vajíčok a embryí druhov čeľade
    koňovité do Únie [oznámené pod číslom K(2011) 7168]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije z dne 13. oktobra 2011 o spremembi Priloge I k
    Odločbi 2004/211/ES glede vnosa za Mehiko na seznam tretjih držav in delov tretjih
    držav, iz katerih je dovoljen vnos živih enoprstih kopitarjev ter semena, jajčnih
    celic in zarodkov enoprstih kopitarjev v Unijo (notificirano pod dokumentarno
    številko C(2011) 7168)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución de la Comisión, de 13 de octubre de 2011 , por
    la que se modifica el anexo I de la Decisión 2004/211/CE en lo que respecta a
    la entrada correspondiente a México de la lista de terceros países y partes
    de los mismos a partir de los cuales se autoriza la introducción en la Unión
    de équidos vivos y esperma, óvulos y embriones de la especie equina [notificada
    con el número C(2011) 7168]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut av den 13 oktober 2011 om ändring av
    bilaga I till beslut 2004/211/EG vad gäller posten för Mexiko i förteckningen
    över tredjeländer eller delar av tredjeländer från vilka levande hästdjur
    och sperma, ägg och embryon från hästdjur får föras in till unionen [delgivet
    med nr K(2011) 7168]
