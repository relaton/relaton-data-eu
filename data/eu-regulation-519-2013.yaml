title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 519/2013 of 21 February 2013 adapting certain
    regulations and decisions in the fields of free movement of goods, freedom of
    movement for persons, right of establishment and freedom to provide services,
    company law, competition policy, agriculture, food safety, veterinary and phytosanitary
    policy, fisheries, transport policy, energy, taxation, statistics, social policy
    and employment, environment, customs union, external relations, and foreign, security
    and defence policy, by reason of the accession of Croatia
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 519/2013 de la Commission du 21 février 2013 portant
    adaptation de certains règlements et décisions adoptés dans les domaines de
    la libre circulation des marchandises, de la libre circulation des personnes,
    du droit d’établissement et de la libre prestation de services, du droit des
