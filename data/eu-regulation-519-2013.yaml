    sanitaire des aliments, de la politique vétérinaire et phytosanitaire, de la
    pêche, de la politique des transports, de l’énergie, de la fiscalité, des
    statistiques, de la politique sociale et de l’emploi, de l’environnement,
    de l’union douanière, des relations extérieures et de la politique étrangère,
    de sécurité et de défense, du fait de l’adhésion de la Croatie
  type: main
- language: de
  script: Latn
