  script: Latn
  content: Komisjoni määrus (EL) nr 519/2013, 21. veebruar 2013 , millega kohandatakse
    teatavaid määruseid ja otsuseid kaupade vaba liikumise, isikute vaba liikumise,
    asutamisõiguse ja teenuste osutamise vabaduse, äriühinguõiguse, konkurentsipoliitika,
