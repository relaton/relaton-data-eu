    Niederlassungsrecht und freier Dienstleistungsverkehr, Gesellschaftsrecht, Wettbewerbspolitik,
    Landwirtschaft, Lebensmittelsicherheit, Veterinär- und Pflanzenschutzpolitik,
    Fischerei, Verkehrspolitik, Energie, Steuern, Statistik, Sozialpolitik und Beschäftigung,
