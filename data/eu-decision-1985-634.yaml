title:
- language: en
  script: Latn
  content: '85/634/EEC: Commission Decision of 19 December 1985 authorizing certain
    Member States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of oak wood originating in Canada or the United States of
    America (Only the French, Danish, German, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/634/CEE: Décision de la Commission du 19 décembre 1985 autorisant
    certains États membres à prévoir des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour le bois de chêne originaire du Canada
    ou des États-Unis d''Amérique (Les textes en langues française, danoise, allemande,
    italienne et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/634/EWG: Entscheidung der Kommission vom 19. Dezember 1985 zur Ermächtigung
    bestimmter Mitgliedstaaten, für Eichenholz mit Ursprung in Kanada oder den Vereinigten
    Staaten von Amerika Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG
    des Rates vorzusehen (Nur der französische, dänische, deutsche, italienische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/634/EØF: Kommissionens beslutning af 19. december 1985 om bemyndigelse
    af visse medlemsstater til at undtage egetræ med oprindelse i Canada eller USA
    for visse bestemmelser i Rådets direktiv 77/93/EØF (Kun den franske, danske,
    tyske, italienske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '85/634/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Δεκεμβρίου 1985 για την παροχή αδείας σε ορισμένα
    κράτη μέλη να παρεκκλίνουν από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου, όσον αφορά
    το ξύλο βελανιδιάς καταγωγής Καναδά ή Ηνωμένων
    Πολιτειών της Αμερικής (Τα κείμενα στην γαλλική,
    δανική, γερμανική, ιταλική και ολλανδική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '85/634/CEE: Decisione della Commissione del 19 dicembre 1985 che autorizza
    taluni stati membri a prevedere deroghe a determinate disposizioni della direttiva
    77/93/CEE del Consiglio per quanto riguarda il legname di quercia originario del
    Canada o degli Stati Uniti d''America (Il testi in lingua francese, danese, tedesca,
    italiana e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '85/634/EEG: Beschikking van de Commissie van 19 december 1985 houdende
    machtiging van bepaalde Lid-Staten om voor eikehout van oorsprong uit Canada of
    de Verenigde Staten van Amerika afwijking van sommige bepalingen van Richtlijn
    77/93/EEG van de Raad toe te staan (Slechts de teksten in de Franse, Deense, Duitse,
    Italiaanse en de Nederlandse taal zijn authentiek)'
  type: main
- language: es
  script: Latn
  content: '85/634/CEE: Decisión de la Comisión de 19 de diciembre de 1985 por la
    que se autoriza a determinados Estados miembros a prever excepciones a determinadas
    disposiciones de la Directiva 77/93/CEE del Consejo para la madera de roble originaria
    de Canadá o de los Estados Unidos de América (Los textos en lenguas francesa,
    danesa, alemana, italiana y neerlandesa son los únicos auténticos)'
