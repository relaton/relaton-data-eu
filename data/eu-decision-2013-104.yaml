    Brazílie v seznamu třetích zemí a jejich částí, ze kterých je povolen
    dovoz sušeného masa „biltong/jerky“ a pasterizovaných masných výrobků
    do Unie (oznámeno pod číslem C(2013) 899)'
  type: main
- language: da
  script: Latn
  content: '2013/104/EU: Kommissionens gennemførelsesafgørelse af 21. februar 2013
