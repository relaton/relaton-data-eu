title:
- language: en
  script: Latn
  content: '2013/104/EU: Commission Implementing Decision of 21 February 2013 amending
    Decision 2007/777/EC as regards the entry for Brazil in the list of third countries
    and parts thereof from where imports into the Union of biltong/jerky and pasteurised
    meat products are authorised (notified under document C(2013) 899)'
  type: main
- language: fr
  script: Latn
  content: '2013/104/UE: Décision d’exécution de la Commission du 21 février
    2013 modifiant la décision 2007/777/CE de la Commission en ce qui concerne l’entrée
    relative au Brésil sur la liste des pays tiers et parties de pays tiers à partir
    desquels les importations dans l’Union européenne de produits à base de viande
    pasteurisée ou de lanières de viande séchée sont autorisées [notifiée sous
    le numéro C(2013) 899]'
  type: main
- language: de
  script: Latn
  content: '2013/104/EU: Durchführungsbeschluss der Kommission vom 21. Februar 2013
    zur Änderung der Entscheidung 2007/777/EG hinsichtlich des Eintrags für Brasilien
    in der Liste der Drittländer und der Teile von Drittländern, aus denen die Einfuhr
    von Biltong/Jerky und pasteurisierten Fleischerzeugnissen in die EU gestattet
    ist (Bekanntgegeben unter Aktenzeichen C(2013) 899)'
  type: main
- language: bg
  script: Cyrl
