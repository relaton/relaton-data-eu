title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1236/70 du Conseil, du 29 juin 1970, portant suspension
    temporaire du droit autonome du tarif douanier commun sur les fibres textiles
    synthétiques de polyamide aromatique obtenue par polycondensation de metaphénylenédiamine
    et d'acide isophtalique de la sous- position EX 56.01 A
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1236/70 des Rates vom 29. Juni 1970 über die zeitweilige
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für synthetische
    Spinnfasern aus aromatischem Polyamid, hergestellt durch Polykondensation von
    Metaphenylendiamin und Isophthalsäure, der Tarifstelle ex 56.01 A
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1236/70 del Consiglio, del 29 giugno 1970, recante
    sospensione temporanea del dazio autonomo della tariffa doganale comune sulle
    fibre tessili sintetiche di poliammide aromatica ottenuta mediante policondensazione
    di metafenilendiammina e acido isoftalico della sottovoce ex 56.01 A
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1236/70 van de Raad van 29 juni 1970 houdende tijdelijke
    schorsing van het autonome recht van het gemeenschappelijk douanetarief op synthetische
    vezels van aromatische polyamiden, verkregen door polycondensatie van metaphenyleendiamine
    en isoftaalzuur van postonderverdeling ex 56.01 A
  type: main
