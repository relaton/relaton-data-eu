- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3139/87 of 21 October 1987 re-establishing
    the levying of customs duties on alkyds and other polyesters falling within subheading
    39.01 C III ex a), originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3139/87 de la Commission du 21 octobre 1987 portant
    rétablissement de la perception des droits de douane applicables aux alkydes
    et autres polyesters, de la sous-position 39.01 C III ex a) du tarif douanier
    commun, originaires de l' Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3139/87 der Kommission vom 21. Oktober 1987 zur Wiedereinführung
