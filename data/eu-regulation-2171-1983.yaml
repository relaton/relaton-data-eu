title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2171/83 of 29 July 1983 determining the
    extent to which applications lodged in the month of July 1983 for the issue of
    import licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2171/83 de la Commission, du 29 juillet 1983, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juillet 1983 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2171/83 der Kommission vom 29. Juli 1983 über den
    Umfang, in dem den im Monat Juli 1983 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2171/83 af 29. juli 1983 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i juli måned 1983, for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2171/83 της Επιτροπής
    της 29ης Ιουλίου 1983 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    έχουν υποβληθεί κατά τον μήνα Ιούλιο του 1983
    για τα κατεψυγμένα βόεια κρέατα που προορίζονται
    για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2171/83 della Commissione, del 29 luglio 1983, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di luglio 1983 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2171/83 van de Commissie van 29 juli 1983 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand juli
    1983 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
