title:
- language: en
  script: Latn
  content: Commission Decision of 17 January 1997 deferring, as regards the importation
    of fruit plant propagating material and fruit plants intended for fruit production
    from third countries, the date referred to in Article 16 (2) of Council Directive
    92/34/EEC
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 17 janvier 1997 prorogeant, en ce qui concerne
    les importations de matériels de multiplication de plantes fruitières et des
    plantes fruitières destinés à la production de fruits en provenance de pays
    tiers, le délai fixé à l'article 16 paragraphe 2 de la directive 92/34/CEE
    du Conseil
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. Januar 1997 zur Verlängerung der in
    Artikel 16 Absatz 2 der Richtlinie 92/34/EWG des Rates genannten Frist für die
    Einfuhr von Vermehrungsmaterial und Pflanzen von Obstarten zur Fruchterzeugung
    aus Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 17. januar 1997 om udsættelse af det i artikel
    16, stk. 2, i Rådets direktiv 92/34/EØF omhandlede tidspunkt, for så vidt angår
    indførsel fra tredjelande af frugtplanteformeringsmateriale og frugtplanter bestemt
    til frugtproduktion
  type: main
- language: el
  script: Grek
  content: '97/110/ΕΚ: Απόφαση της Επιτροπής της 17ης Ιανουαρίου
    1997 περί παρατάσεως, όσον αφορά την εισαγωγή
    από τρίτες χώρες πολλαπλασιαστικού υλικού
    οπωροφόρων δένδρων και οπωροφόρων δένδρων
    που προορίζονται για την παραγωγή φρούτων,
    της προθεσμίας που αναφέρεται στο άρθρο 16 παράγραφος
    2 της οδηγίας 92/34/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '97/110/EY: Komission päätös, tehty 17 päivänä tammikuuta 1997, direktiivin
    92/34/ETY 16 artiklan 2 kohdassa mainitun päivämäärän siirtämisestä hedelmätuotantoon
    tarkoitettujen hedelmäkasvien taimien ja niiden lisäysaineiston kolmansista
    maista tuonnin osalta'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione del 17 gennaio 1997 che proroga il termine
    di cui all'articolo 16, paragrafo 2 della direttiva 92/34/CEE del Consiglio per
    quanto concerne l'importazione da paesi terzi di materiali di moltiplicazione
    delle piante da frutto destinata alla produzione di frutti
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 januari 1997 tot verlenging van de
    in artikel 16, lid 2, van Richtlijn 92/34/EEG van de Raad bedoelde termijn met
    betrekking tot de invoer van fruitgewassen die voor de fruitteelt worden gebruikt
    en van teeltmateriaal daarvan uit derde landen
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 17 de Janeiro de 1997 que prorroga, no que diz
    respeito à importação de fruteiras e de materiais de propagação de fruteiras,
    a partir de países terceiros, o prazo referido no nº 2 do artigo 16º da Directiva
    92/34/CEE do Conselho
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión de 17 de enero de 1997 por la que se prorroga
    la fecha establecida en el apartado 2 del artículo 16 de la Directiva 92/34/CEE
    del Consejo en lo que respecta a la importación de materiales de multiplicación
    de frutales y de plantones de frutal destinados a la producción frutícola originarias
    de terceros países
  type: main
- language: sv
  script: Latn
  content: '97/110/EG: Kommissionens beslut av den 17 januari 1997 om framflyttning
    av den dag som avses i artikel 16.2 i rådets direktiv 92/34/EEG i fråga om import
    av fruktplantsförökningsmaterial och fruktplantor avsedda för fruktproduktion
    från tredje land'
