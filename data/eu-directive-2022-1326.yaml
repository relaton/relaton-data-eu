title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2022/1326 of 18 March 2022 amending
    the Annex to Council Framework Decision 2004/757/JHA as regards the inclusion
    of new psychoactive substances in the definition of ‘drug’
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2022/1326 de la Commission du 18 mars 2022 modifiant
    l’annexe de la décision-cadre 2004/757/JAI du Conseil en ce qui concerne l’inclusion
    de nouvelles substances psychoactives dans la définition du terme «drogue»
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2022/1326 der Kommission vom 18. März 2022
    zur Änderung des Anhangs des Rahmenbeschlusses 2004/757/JI des Rates zur Aufnahme
    neuer psychoaktiver Substanzen in die Drogendefinition
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2022/1326 на Комисията
    от 18 март 2022 година за изменение на приложението
    към Рамково решение 2004/757/ПВР на Съвета във
    връзка с включването на нови психоактивни
    вещества в определението за „наркотици“
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2022/1326 ze dne 18. března
    2022, kterou se mění příloha rámcového rozhodnutí Rady 2004/757/SVV, pokud
    jde o zahrnutí nových psychoaktivních látek do definice drogy
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2022/1326 af 18. marts 2022 om ændring
    af bilaget til Rådets rammeafgørelse 2004/757/RIA for så vidt angår inkluderingen
    af nye psykoaktive stoffer i definitionen af »narkotika«
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2022/1326 της
    Επιτροπής της 18ης Μαρτίου 2022 για την τροποποίηση
    του παραρτήματος της απόφασης-πλαισίου 2004/757/ΔΕΥ
    του Συμβουλίου όσον αφορά την υπαγωγή νέων
    ψυχοδραστικών ουσιών στον ορισμό των «ναρκωτικών»
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2022/1326, 18. märts 2022, millega
    muudetakse raamotsuse 2004/757/JSK lisa seoses uute psühhoaktiivsete ainete lisamisega
    uimasti määratlusse
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2022/1326, annettu 18 päivänä maaliskuuta
    2022, neuvoston puitepäätöksen 2004/757/YOS liitteen muuttamisesta siltä osin
    kuin on kyse uusien psykoaktiivisten aineiden sisällyttämisestä huumausaineen
    määritelmään
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2022/1326 ón gCoimisiún an 18 Márta 2022 lena
    leasaítear an Iarscríbhinn a ghabhann le Cinneadh Réime 2004/757/CGB ón gComhairle
    maidir le substaintí sícighníomhacha nua a áireamh sa sainmhíniú ar “dhruga”
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/1326 оd 18. ožujka 2022. o izmjeni
    Priloga Okvirnoj odluci Vijeća 2004/757/PUP u pogledu obuhvaćanja novih psihoaktivnih
    tvari definicijom „droge”
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1326 felhatalmazáson alapuló irányelve (2022.
    március 18.) a 2004/757/IB tanácsi kerethatározat mellékletének a „kábítószer”
    fogalommeghatározását új pszichoaktív anyagokkal kiegészítő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2022/1326 della Commissione del 18 marzo 2022 che
    modifica l'allegato della decisione quadro 2004/757/GAI del Consiglio per quanto
    riguarda l'inclusione di nuove sostanze psicoattive nella definizione di «stupefacenti»
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2022/1326 (2022. gada 18. marts),
