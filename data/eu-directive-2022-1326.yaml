    vielu iekļaušanu narkotiskās vielas definīcijā
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2022/1326 2022 m. kovo 18 d. kuria
    dėl naujų psichoaktyviųjų medžiagų įtraukimo į termino „narkotikas“
    apibrėžtį iš dalies keičiamas Tarybos pamatinio sprendimo 2004/757/TVR priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2022/1326 tat-18 ta’ Marzu 2022
    li temenda l-Anness tad-Deċiżjoni Kwadru tal-Kunsill 2004/757/ĠAI rigward l-inklużjoni
    ta’ sustanzi psikoattivi ġodda fid-definizzjoni ta’ “droga”
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2022/1326 van de Commissie van 18 maart 2022
    tot wijziging van de bijlage bij Kaderbesluit 2004/757/JBZ van de Raad in verband
    met het opnemen van nieuwe psychoactieve stoffen in de definitie van “drug”
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2022/1326 z dnia 18 marca 2022 r. zmieniająca
    załącznik do decyzji ramowej Rady 2004/757/WSiSW w odniesieniu do włączenia
    nowych substancji psychoaktywnych do definicji narkotyku
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2022/1326 da Comissão de 18 de março de 2022 que
    altera o anexo da Decisão-Quadro 2004/757/JAI do Conselho no respeitante à inclusão
    de novas substâncias psicoativas na definição de «droga»
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2022/1326 a Comisiei din 18 martie 2022 de modificare
    a anexei la Decizia-cadru 2004/757/JAI a Consiliului în ceea ce privește includerea
    unor substanțe psihoactive noi în definiția termenului „drog”
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2022/1326 z 18. marca 2022, ktorou sa
    mení príloha k rámcovému rozhodnutiu Rady 2004/757/SVV, pokiaľ ide o zahrnutie
    nových psychoaktívnych látok do vymedzenia pojmu drogy
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/1326 z dne 18. marca 2022 o spremembi
    Priloge k Okvirnemu sklepu Sveta 2004/757/PNZ v zvezi z vključitvijo novih psihoaktivnih
    snovi v opredelitev pojma „prepovedana droga“
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2022/1326 de la Comisión de 18 de marzo de 2022
    por la que se modifica el anexo de la Decisión marco 2004/757/JAI del Consejo
    en lo que respecta a la inclusión de nuevas sustancias psicotrópicas en la definición
    de «droga»
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2022/1326 av den 18 mars 2022 om
