    и за въвеждане на регистрационен режим за този
    внос
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2026/1925 ze dne 6. srpna 2026 o zahájení
    šetření možného obcházení antidumpingových opatření uložených prováděcím
    nařízením (EU) 2024/357 na dovoz některých otevřených síťovin ze skleněných
