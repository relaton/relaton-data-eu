title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1925 of 6 August 2026 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2024/357 on imports of certain open mesh
    fabrics of glass fibres originating in the People’s Republic of China by imports
    of OMF consigned from Kosovo, Moldova, North Macedonia and Serbia, whether declared
    as originating in Kosovo, Moldova, North Macedonia and Serbia or not, and making
    such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1925 de la Commission du 6 août 2026
    portant ouverture d’une enquête sur le contournement éventuel des mesures
    antidumping instituées par le règlement d’exécution (UE) 2024/357 sur les
    importations de certains tissus de fibre de verre à maille ouverte originaires
    de la République populaire de Chine par des importations de certains tissus de
    fibre de verre à maille ouverte expédiés du Kosovo, de Moldavie, de Macédoine
    du Nord et de Serbie, qu’ils aient ou non été déclarés originaires de ces
    pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/1925 der Kommission vom 6. August 2026
    zur Einleitung einer Untersuchung betreffend eine mutmaßliche Umgehung der mit
    der Durchführungsverordnung (EU) 2024/357 eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren bestimmter offenmaschiger Gewebe aus Glasfasern mit Ursprung
    in der Volksrepublik China durch aus dem Kosovo, Moldau, Nordmazedonien und Serbien
    versandte Einfuhren offenmaschiger Gewebe, ob als Ursprungserzeugnisse des Kosovos,
    Moldaus, Nordmazedoniens oder Serbiens angemeldet oder nicht, und zur zollamtlichen
    Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
