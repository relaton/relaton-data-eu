- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 1375/2011 of 22 December 2011 implementing
    Article 2(3) of Regulation (EC) No 2580/2001 on specific restrictive measures
    directed against certain persons and entities with a view to combating terrorism
    and repealing Implementing Regulation (EU) No 687/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 1375/2011 du Conseil du 22 décembre
    2011 mettant en œuvre l’article 2, paragraphe 3, du règlement (CE) n ° 2580/2001
    concernant l’adoption de mesures restrictives spécifiques à l’encontre de
    certaines personnes et entités dans le cadre de la lutte contre le terrorisme,
    et abrogeant le règlement d’exécution (UE) n ° 687/2011
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1375/2011 des Rates vom 22. Dezember
