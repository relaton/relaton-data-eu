    de amânare a datelor de expirare a aprobării substanței etofenprox destinate
    utilizării în produsele biocide aparținând tipurilor de produs 8 și, respectiv,
    18 în conformitate cu Regulamentul (UE) nr. 528/2012 al Parlamentului European
    și al Consiliului
  type: main
