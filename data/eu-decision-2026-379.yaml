title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/379 of 20 February 2026 repealing
    Implementing Decisions (EU) 2022/1487 and (EU) 2025/434 postponing the expiry
    dates of the approval of etofenprox for use in biocidal products of product-types
    8 and 18, respectively, in accordance with Regulation (EU) No 528/2012 of the
    European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/379 de la Commission du 20 février
    2026 abrogeant les décisions d’exécution (UE) 2022/1487 et (UE) 2025/434 reportant
    les dates d’expiration de l’approbation de l’étofenprox en vue de son utilisation
    dans les produits biocides relevant, respectivement, des types de produits 8 et
    18, conformément au règlement (UE) no 528/2012 du Parlement européen et du
    Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/379 der Kommission vom 20. Februar 2026
    zur Aufhebung der Durchführungsbeschlüsse (EU) 2022/1487 und (EU) 2025/434 zur
    Verschiebung der Ablaufdaten der Genehmigung von Etofenprox zur Verwendung in
    Biozidprodukten der Produktart 8 bzw. 18 gemäß der Verordnung (EU) Nr. 528/2012
    des Europäischen Parlaments und des Rates
  type: main
