    2025/434 che posticipano le date di scadenza dell’approvazione dell’etofenprox
    ai fini del suo uso rispettivamente nei biocidi dei tipi di prodotto 8 e 18 conformemente
    al regolamento (UE) n. 528/2012 del Parlamento europeo e del Consiglio
  type: main
