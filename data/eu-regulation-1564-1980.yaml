id: EURegulation15641980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1564/80 of 23 June 1980 re-establishing
    the levying of customs duties on woven fabrics of synthetic textile fibres, products
    of category 34 (code 0340), originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1564/80 de la Commission, du 23 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles synthétiques, de la catégorie 34 (code 0340), originaires de
    Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1564/80 der Kommission vom 23. Juni 1980 über die
    Wiedereinführung des Zollsatzes für Gewebe aus synthetischen Spinnfäden der
    Warenkategorie Nr. 34 (Kennziffer 0340), mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1564/80 af 23. juni 1980 om genindførelse
    af opkrævning af toldafgifter for syntetiske fibre under kategori 34 (kode 0340),
    som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1564/80 della Commissione, del 23 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili
    sintetiche della categoria di prodotti n. 34 (codice 0340), originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1564/80 van de Commissie van 23 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische vezels, van de categorie van produkten nr. 34 (codenummer 0340),
    van oorsprong uit Joegoslavië waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
