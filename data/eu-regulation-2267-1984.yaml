title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2267/84 of 31 July 1984 providing for the
    grant of private storage aid fixed at a standard rate in advance in respect of
    carcases, half-carcases, hindquarters and forequarters of beef
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2267/84 de la Commission du 31 juillet 1984 prévoyant
    l' octroi d' une aide au stockage privé de carcasses, de demi-carcasses, de quartiers
    arrière et de quartiers avant, fixée forfaitairement à l' avance, dans le secteur
    de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2267/84 der Kommission vom 31. Juli 1984 zur Gewährung
    einer im voraus pauschal festgesetzten Beihilfe zur privaten Lagerhaltung von
    Schlachtkörpern, halben Schlachtkörpern, Hintervierteln und Vordervierteln von
    Rindern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2267/84 af 31. juli 1984 om ydelse
    af en skønsmæssigt forudfastsat støtte til privat oplagring af hele og halve
    kroppe og for- og bagfjerdinger i oksekødsektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2267/84 της Επιτροπής
    της 31ης Ιουλίου 1984 για την πρόβλεψη χορήγησης
    ενίσχυσης που προκαθορίζεται κατ' αποκοπή
    στην ιδιωτική αποθεματοποίηση σφαγίων, ημιμορίων
    σφαγίου, οπισθίων και εμπροσθίων τεταρτημορίων
    στον τομέα του βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2267/84 della Commissione del 31 luglio 1984 recante
    concessione di un aiuto, fissato forfettariamente in anticipo all' ammasso privato
    di carcasse, mezzene, quarti anteriori e quarti posteriori nel settore delle carni
    bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2267/84 van de Commissie van 31 juli 1984 inzake
    de toekenning van een vooraf forfaitair vastgesteld steunbedrag voor de particuliere
    opslag van hele geslachte dieren, halve geslachte dieren, achtervoeten en voorvoeten
    van runderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2267/84 da Comissão, de 31 de Julho de 1984, que
    prevê a concessão de uma ajuda à armazenagem privada de carcaças, meias carcaças,
    de quartos traseiros e quartos dianteiros, estipulada antecipadamente num valor
    fixo, no sector da carne de bovino
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2267/84 de la Comisión, de 31 de julio de 1984, por
    el que se prevé la concesión de una ayuda al almacenamiento privado de canales,
    medias canales, cuartos traseros y cuartos delanteros, fijada a tanto alzado por
    anticipado en el sector de la carne de vacuno
  type: main
