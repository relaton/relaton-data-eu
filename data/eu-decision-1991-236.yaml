title:
- language: en
  script: Latn
  content: '91/236/EEC: Commission Decision of 23 April 1991 amending Decision 90/136/EEC
    approving the draft measures for implementation in the United Kingdom of Article
    3b of Regulation (EEC) No 857/84 adopting general rules for the application of
    the levy referred to in Article 5c of Regulation (EEC) No 804/68 in the milk and
    milk products sector (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/236/CEE: Décision de la Commission, du 23 avril 1991, complétant
    la décision 90/136/CEE portant approbation du projet de mise en oeuvre au Royaume-Uni
    de l'' article 3 ter du règlement (CEE) nº 857/84 portant règles générales
    pour l'' application du prélèvement visé à l'' article 5 quater du règlement
    (CEE) nº 804/68 dans le secteur du lait et des produits laitiers (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '91/236/EWG: Entscheidung der Kommission vom 23. April 1991 zur Ergänzung
