    Artikel 3b der Verordnung (EWG) Nr. 857/84 über Grundregeln für die Anwendung
    der Abgabe gemäß Artikel 5c der Verordnung (EWG) Nr. 804/68 im Sektor Milch
    und Milcherzeugnisse im Vereinigten Königreich (Nur der englische Text ist verbindlich)'
  type: main
- language: da
