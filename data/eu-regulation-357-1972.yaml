  content: Règlement (CEE) n° 357/72 de la Commission, du 18 février 1972, abrogeant
    le règlement (CEE) n° 316/72 portant application du droit du tarif douanier
    commun aux importations de certaines variétés d'oranges douces originaires d'Israël
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 357/72 der Kommission vom 18. Februar 1972 zur Aufhebung
    der Verordnung (EWG) Nr. 316/72 zur Anwendung des Zollsatzes des Gemeinsamen Zolltarifs
    auf Einfuhren von bestimmten Orangensorten mit Ursprung in Israel
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 357/72 della Commissione, del 18 febbraio 1972, che
    abroga il regolamento (CEE) n. 316/72 relativo all'applicazione del dazio della
    tariffa doganale comune alle importazioni di alcune varietà di arance dolci originarie
    d'Israele
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 357/72 van de Commissie van 18 februari 1972 tot
    intrekking van Verordening (EEG) nr. 316/72 houdende toepassing van het recht
    van het gemeenschappelijk douanetarief op de invoer van bepaalde variëteiten
    zoete sinaasappelen van oorsprong uit Israël
