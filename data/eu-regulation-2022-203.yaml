    osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/203, annettu 14 päivänä
    helmikuuta 2022, asetuksen (EU) N:o 748/2012 muuttamisesta siltä osin kuin on
    kyse toimivaltaisilta viranomaisilta edellytettävistä hallintojärjestelmistä
    ja poikkeamailmoitusjärjestelmistä sekä asetuksen (EU) N:o 748/2012 oikaisemisesta
    lentokelpoisuuden tarkastustodistusten antamisen osalta
  type: main
- language: ga
  script: Latn
