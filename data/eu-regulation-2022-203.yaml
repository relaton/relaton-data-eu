  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/203 оd 14. veljače 2022. o izmjeni
    Uredbe (EU) br. 748/2012 u pogledu sustava upravljanja i sustava prijavljivanja
    događaja koje uspostavljaju nadležna tijela i o ispravku Uredbe (EU) br. 748/2012
    u pogledu izdavanja potvrda o provjeri plovidbenosti
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/203 végrehajtási rendelete (2022. február 14.)
    a 748/2012/EU rendeletnek az illetékes hatóságok által létrehozandó vezetési
    rendszerek és eseményjelentési rendszerek tekintetében történő módosításáról,
    valamint a 748/2012/EU rendeletnek a légialkalmassági felülvizsgálati bizonyítványok
    kiállítása tekintetében történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/203 della Commissione del 14 febbraio
    2022 che modifica il regolamento (UE) n. 748/2012 per quanto riguarda i sistemi
    di gestione e i sistemi di segnalazione delle non conformità che devono essere
    istituiti dalle autorità competenti e rettifica il regolamento (UE) n. 748/2012
    per quanto riguarda il rilascio dei certificati di revisione dell’aeronavigabilità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/203 (2022. gada 14. februāris),
    ar ko Regulu (ES) Nr. 748/2012 groza attiecībā uz pārvaldības sistēmām un
    atgadījumu ziņošanas sistēmām, kas jāizveido kompetentajām iestādēm,
    un ar ko Regulu (ES) Nr. 748/2012 labo attiecībā uz lidojumderīguma pārbaudes
    sertifikātu izdošanu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/203 2022 m. vasario 14 d.
    kuriuo dėl valdymo sistemų ir pranešimų apie įvykius sistemų, kurias turi
    sukurti kompetentingos institucijos, iš dalies keičiamas Reglamentas (ES) Nr.
    748/2012 ir ištaisomos Reglamento (ES) Nr. 748/2012 nuostatos dėl tinkamumo
    skraidyti patikros pažymėjimų išdavimo
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/203 tal-14
    ta’ Frar 2022 li jemenda r-Regolament (UE) Nru 748/2012 fir-rigward tas-sistemi
    ta’ ġestjoni u s-sistemi ta’ rappurtar tal-okkorrenzi li għandhom jiġu
    stabbiliti mill-awtoritajiet kompetenti, u li jikkoreġi r-Regolament (UE) Nru
    748/2012 fir-rigward tal-ħruġ ta’ ċertifikati ta’ reviżjoni tal-ajrunavigabbiltà
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/203 van de Commissie van 14 februari 2022
    tot wijziging van Verordening (EU) nr. 748/2012 wat betreft beheersystemen en
    systemen voor de melding van voorvallen die door bevoegde autoriteiten moeten
    worden opgezet en tot wijziging van Verordening (EU) nr. 748/2012 wat betreft
    de afgifte van certificaten van herbeoordeling van de luchtwaardigheid
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/203 z dnia 14 lutego 2022
    r. w sprawie zmiany rozporządzenia (UE) nr 748/2012 w odniesieniu do ustanowienia
    przez właściwe organy systemów zarządzania i systemów zgłaszania zdarzeń
    oraz w sprawie sprostowania rozporządzenia (UE) nr 748/2012 w odniesieniu do
    wydawania poświadczeń przeglądu zdatności do lotu
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/203 da Comissão de 14 de fevereiro
    de 2022 que altera o Regulamento (UE) n.o 748/2012 no que respeita aos sistemas
    de gestão e de comunicação de ocorrências a estabelecer pelas autoridades
    competentes e que retifica o Regulamento (UE) n.o 748/2012 no que respeita à
    emissão de certificados de avaliação da aeronavegabilidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/203 al Comisiei din 14 februarie
    2022 de modificare a Regulamentului (UE) nr. 748/2012 în ceea ce privește sistemele
    de management și sistemele de raportare a evenimentelor care urmează să fie
    instituite de autoritățile competente, precum și de rectificare a Regulamentului
    (UE) nr. 748/2012 în ceea ce privește eliberarea certificatelor de evaluare
    a navigabilității
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/203 zo 14. februára 2022, ktorým
    sa mení nariadenie (EÚ) č. 748/2012, pokiaľ ide o zriadenie systémov manažmentu
    bezpečnosti a hlásenia udalostí príslušnými orgánmi, a ktorým sa opravuje
    nariadenie (EÚ) č. 748/2012, pokiaľ ide o vydávanie osvedčení o overení
    letovej spôsobilosti
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/203 z dne 14. februarja 2022 o spremembi
    Uredbe (EU) št. 748/2012 glede sistemov upravljanja in poročanja o dogodkih,
    ki jih vzpostavijo pristojni organi, in o popravku Uredbe (EU) št. 748/2012 glede
    izdaje certifikatov pregleda plovnosti
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/203 de la Comisión de 14 de febrero
    de 2022 que modifica el Reglamento (UE) n.o 748/2012 por lo que respecta a los
    sistemas de gestión y los sistemas de notificación de sucesos que deben crear
    las autoridades competentes y corrige dicho Reglamento por lo que respecta a la
    expedición de certificados de revisión de la aeronavegabilidad
  type: main
- language: sv
  script: Latn
