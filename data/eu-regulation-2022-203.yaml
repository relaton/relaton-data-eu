title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/203 of 14 February 2022 amending
    Regulation (EU) No 748/2012 as regards management systems and occurrence-reporting
    systems to be established by competent authorities, and correcting Regulation
    (EU) No 748/2012 as regards the issuance of airworthiness review certificates
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/203 de la Commission du 14 février
    2022 modifiant le règlement (UE) no 748/2012 en ce qui concerne les systèmes
    de gestion et les systèmes de comptes rendus d’événements que doivent établir
    les autorités compétentes et rectifiant le règlement (UE) no 748/2012 en ce
    qui concerne la délivrance de certificats d’examen de navigabilité
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/203 der Kommission vom 14. Februar 2022
    zur Änderung der Verordnung (EU) Nr. 748/2012 hinsichtlich der Einrichtung von
    Systemen für das Sicherheitsmanagement und die Meldung von Ereignissen durch
    die zuständigen Behörden sowie zur Berichtigung der Verordnung (EU) Nr. 748/2012
    hinsichtlich der Ausstellung von Bescheinigungen über die Prüfung der Lufttüchtigkeit
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/203 на Комисията
    от 14 февруари 2022 година за изменение на Регламент
    (ЕС) № 748/2012 по отношение на системите за управление
    и системите за докладване на събития, които
    трябва да се въведат от компетентните органи,
    и за поправка на Регламент (ЕС) № 748/2012 по отношение
    на издаването на удостоверения за преглед
    на летателната годност
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/203 ze dne 14. února 2022, kterým
    se mění nařízení (EU) č. 748/2012, pokud jde o systémy řízení a systémy
    hlášení událostí, které mají zřizovat příslušné úřady, a opravuje
    nařízení (EU) č. 748/2012, pokud jde o vydávání osvědčení kontroly letové
    způsobilosti
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/203 af 14. februar 2022
    om ændring af forordning (EU) nr. 748/2012 for så vidt angår styringssystemer
    og systemer for indberetning af begivenheder, der skal indføres af de kompetente
    myndigheder, og om berigtigelse af forordning (EU) nr. 748/2012 for så vidt angår
    udstedelsen af luftdygtighedseftersynsbeviser
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/203 της Επιτροπής
    της 14ης Φεβρουαρίου 2022 για την τροποποίηση
    του κανονισμού (ΕΕ) αριθ. 748/2012 όσον αφορά τα
    συστήματα διαχείρισης και τα συστήματα αναφοράς
    περιστατικών που πρέπει να θεσπιστούν από
