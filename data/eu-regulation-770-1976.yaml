type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 770/76 of 2 April 1976 re-establishing the
    levying of customs duties on illuminating glassware, signalling glassware and
    optical elements of glass, not optically worked or of optical glass, other, falling
    within subheading 70.14 B, originating in Hong Kong to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 770/76 de la Commission, du 2 avril 1976, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d'éclairage, de signalisation et d'optique commune, autres, de la sous- position
    tarifaire 70.14 B, originaires de Hong-Kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 770/76 der Kommission vom 2. April 1976 zur Wiedereinführung
    des Zollsatzes für Glaswaren für Beleuchtung, für Signalvorrichtungen oder
    zu optischen Zwecken, nicht aus optischem Glas, nicht optisch bearbeitet, andere,
    der Tarifstelle 70.14 B, mit Ursprung in Hongkong, dem die in der Verordnung (EWG)
    Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 770/76 af 2. april 1976 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas, refleksglas, optiske
    artikler af glas, hverken optisk bearbejdet eller af optisk glas, andre tilfælde,
    under underposition 70.14 B, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 770/76 della Commissione, del 2 aprile 1976, che ripristina
    la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune, altre, della sottovoce doganale 70.14 B,
    originarie di Hong Kong, beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 770/76 van de Commissie van 2 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas; optische elementen van gewoon glas,
    niet optisch bewerkt, andere, van onderverdeling 70.14 B, van oorsprong uit Hong-Kong,
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
