title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1993/84 of 12 July 1984 re-establishing
    the levying of customs duties on lactic acid and its salts and esters, falling
    within subheading 29.16 A I and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1993/84 de la Commission du 12 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables à l' acide
    lactique, ses sels et ses esters, de la sous-position 29.16 A I du tarif douanier
    commun, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1993/84 der Kommission vom 12. Juli 1984 zur Wiedereinführung
    der Erhebung der Zölle für Milchsäure, ihre Salze und Ester, der Tarifstelle
    29.16 A I mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3569/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1993/84 af 12. juli 1984 om genindførelse
    af opkrævning af told for mælkesyre samt salte og estere deraf, henhørende
    under pos. 29.16 A I og med oprindelse i Kina, som er præferenceberettiget i
    henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1993/84 της Επιτροπής
    της 12ης Ιουλίου 1984 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για το γαλακτικό οξύ, άλατα
    και εστέρες αυτού, της διακρίσεως 29.16 Α Ι του
    Κοινού Δασμολογίου, καταγωγής Κίνας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1993/84 della Commissione del 12 luglio 1984 che ripristina
    la riscossione, dei dazi doganali applicabili all' acido lattico, suoi sali e
    suoi esteri, della sottovoce doganale 29.16 A I, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1993/84 van de Commissie van 12 juli 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op melkzuur, alsmede
    zouten en esters daarvan, van postonderverdeling 29.16 A I, van oorsprong uit
    China, waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
