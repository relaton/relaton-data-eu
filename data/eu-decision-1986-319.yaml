id: EUDecision1986319
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '86/319/EEC: Commission Decision of 20 June 1986 authorizing Spain to provide
    temporarily for derogation from certain provisions of Council Directive 66/401/EEC
    which restrict the marketing of seed of certain fodder plant species to seed which
    has been officially certified as ''basic seed''or ''certified seed'' (Only the
    Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/319/CEE: Décision de la Commission du 20 juin 1986 autorisant l''Espagne
    à prévoir temporairement des dérogations à certaines dispositions de la directive
    66/401/CEE du Conseil qui restreignent la commercialisation de semences de certaines
    espèces de plantes fourragères aux semences qui ont été officiellement certifiées
    comme "semences de base" ou "semences certifiées" (Le texte en langue espagnole
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/319/EWG: Entscheidung der Kommission vom 20. Juni 1986 zur Ermächtigung
    Spaniens, vorübergehend Ausnahmen von einigen Vorschriften der Richtlinie 66/401/EWG
    des Rates zuzulassen, welche die Vermarktung von Saatgut von bestimmten Futterpflanzenarten
    auf amtlich als Basissaatgut oder zertifiziertes Saatgut zugelassenes Saatgut
    beschränken (Nur der spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/319/EØF: Kommissionens beslutning af 20. juni 1986 om bemyndigelse
    af Spanien til midlertidigt at fastsætte undtagelsesbestemmelser til visse bestemmelser
    i Rådets direktiv 66/401/EØF, som begrænser handel med frø af visse foderplanter
    til frø, der er officielt godkendt som "basisfrø" eller "certificeret frø"
    (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '86/319/ΕΟΚ: Απόφαση της Επιτροπής της 20ής
    Ιουνίου 1986 που εξουσιοδοτεί την Ισπανία να
    προβλέψει προσωρινά παρεκκλίσεις από ορισμένες
    διατάξεις της οδηγίας 66/401/ΕΟΚ του Συμβουλίου
    οι οποίες περιορίζουν την εμπορία σπόρων προς
    σπορά ορισμένων ειδών κτηνοτροφικών φυτών
    σε σπόρους που έχουν πιστοποιηθεί επίσημα
    σαν «βασικοί σπόροι» ή «πιστοποιημένοι σπόροι»
    (Το κείμενο στην ισπανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '86/319/CEE: Decisione della Commissione del 20 giugno 1986 che autorizza
    la Spagna a prevedere deroghe temporanee a talune disposizioni della direttiva
    66/401/CEE del Consiglio che limitano la commercializzazione delle sementi di
    alcune specie di piante foraggere alle sementi che siano state ufficialmente certificate
    come "sementi di base" o "sementi certificate" (Il testo in lingua spagnola è
    il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '86/319/EEG: Beschikking van de Commissie van 20 juni 1986 tot machtiging
    van Spanje om tijdelijk te voorzien in uitzonderingen op sommige bepalingen van
    Richtlijn 66/401/EEG van de Raad waarbij de handel in zaaizaad van bepaalde soorten
    groenvoedergewassen wordt beperkt tot zaad dat als "basiszaad" of "gecertificeerd
    zaad" officieel is goedgekeurd (Slechts de tekst in de Spaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '86/319/CEE: Decisão da Comissão de 20 de Junho de 1986 que autoriza
    a Espanha a prever, temporariamente, derrogações a determinadas disposições
    da Directiva 66/401/CEE do Conselho que restringem a comercialização de sementes
    de determinadas espécies de plantas forrageiras que foram oficialmente certificadas
    como "sementes de base" ou "sementes certificadas" (Apenas faz fé o texto em
    língua espanhola)'
  type: main
- language: es
  script: Latn
  content: '86/319/CEE: Decisión de la Comisión de 20 de junio de 1986 por la que
    se autoriza a España para adoptar, con carácter temporal, excepciones a determinadas
    disposiciones de la Directiva del Consejo 66/401/CEE que limita la comercialización
    de semillas de determinadas especies de plantas forrajeras a aquellas semillas
    que hayan sido certificadas oficialmente como "semillas de base" o "semillas certificadas"
    (El texto en lengua española es el único auténtico)'
