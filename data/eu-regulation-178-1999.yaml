    Ουγγαρίας, την Τσεχική Δημοκρατία, τη Σλοβακία,
    τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 178/1999, annettu 26 päivänä tammikuuta 1999,
    yhteisön Puolan tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
    mukaisesti tammikuussa 1999 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 178/1999 della Commissione del 26 gennaio 1999 che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 1999 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi conclusi tra la Comunità e
    la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia,
    la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 178/1999 van de Commissie van 26 januari 1999 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector varkensvlees, die in januari
    1999 worden ingediend op grond van de regeling die is vastgesteld in de door de
    Gemeenschap gesloten overeenkomsten met de Republiek Polen, de Republiek Hongarije,
    de Tsjechische Republiek, de Slowaakse Republiek, Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 178/1999 da Comissão de 26 de Janeiro de 1999 que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Janeiro
    de 1999 ao abrigo do regime previsto nos acordos concluídos pela Comunidade com
