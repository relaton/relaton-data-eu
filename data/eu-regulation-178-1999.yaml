    της 26ης Ιανουαρίου 1999 για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιανουάριο του
    1999 για πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τις
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
