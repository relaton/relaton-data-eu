  script: Latn
  content: Reglamento (CE) n° 178/1999 de la Comisión de 26 de enero de 1999 por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de enero de 1999 al amparo del régimen previsto en los Acuerdos celebrados
    entre la Comunidad y la República de Polonia, la República de Hungría, la República
    Checa, Eslovaquia, Bulgaria y Rumanía
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 178/1999 av den 26 januari 1999 om fastställande
    av i vilken utsträckning ansökningar som lämnats in i januari 1999 om importlicenser
    för vissa grisköttsprodukter i enlighet med den ordning som fastställs i avtalen
    mellan gemenskapen samt Polen, Ungern, Tjeckien, Slovakien, Bulgarien och Rumänien
    kan godkännas
