id: EUDecision1980192
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/192/EEC: Commission Decision of 23 January 1980 authorizing Ireland
    not to apply Community treatment to women''s, girls''and infants''pyjamas and
    night dresses, falling within heading No ex 60.04 of the Common Customs Tariff
    (category 25), originating in Brazil and in free circulation in the other Member
    States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/192/CEE: Décision de la Commission, du 23 janvier 1980, autorisant
    l''Irlande à exclure du traitement communautaire les pyjamas et chemises de nuit
    pour femmes, fillettes et jeunes enfants, de la position ex 60.04 du tarif douanier
    commun (catégorie 25), originaires du Brésil et mis en libre pratique dans les
    autres Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/192/EWG: Entscheidung der Kommission vom 23. Januar 1980, mit der Irland
    ermächtigt wird, aus Brasilien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Schlafanzüge und Nachthemden für Frauen, Mädchen
    und Kleinkinder, der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs, Kategorie
    25, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/192/EØF: Kommissionens beslutning af 23. januar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage pyjamas og anden natbeklædning
    til kvinder, piger og småbørn, som henhører under pos. ex 60.04 i den fælles
    toldtarif (kategori 25), har oprindelse i Brasilien og frit kan omsættes i de
    øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/192/CEE: Decisione della Commissione, del 23 gennaio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i pigiami e le camicie da
    notte per donna, per ragazza e per bambini, della voce n. ex 60.04 della tariffa
    doganale comune, categoria 25, originari del Brasile e messi in libera pratica
    negli altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/192/EEG: Beschikking van de Commissie van 23 januari 1980 waarbij Ierland
    wordt gemachtigd pyjama''s en nachthemden voor dames, meisjes en kinderen, van
    post ex 60.04 van het gemeenschappelijk douanetarief (categorie 25), van oorsprong
    uit Brazilië en in de overige Lid- Staten in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse taal
    is authentiek)'
  type: main
