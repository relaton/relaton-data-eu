title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2327 of 24 November 2022 not
    approving chloramin B as an active substance for use in biocidal products of product-types
    2, 3, 4 and 5 in accordance with Regulation (EU) No 528/2012 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2327 de la Commission du 24 novembre
    2022 n’approuvant pas la chloramine B en tant que substance active destinée
    à être utilisée dans les produits biocides des types 2, 3, 4 et 5 conformément
    au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2327 der Kommission vom 24. November
    2022 zur Nichtgenehmigung von Chloramin B als Wirkstoff zur Verwendung in Biozidprodukten
    der Produktarten 2, 3, 4 und 5 gemäß der Verordnung (EU) Nr. 528/2012 des Europäischen
    Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
