    toimeaine kloramiin-B kasutamine tooteliiki 2, 3, 4 ja 5 kuuluvates biotsiidides
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/2327, annettu 24 päivänä
