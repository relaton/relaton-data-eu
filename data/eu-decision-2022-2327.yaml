    bithicídeacha de chineálacha táirgí 2, 3, 4, agus 5 i gcomhréir le Rialachán
    (AE) Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
