    biobójczych należących do grup produktowych 2, 3, 4 i 5 zgodnie z rozporządzeniem
    Parlamentu Europejskiego i Rady (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2327 da Comissão de 24 de novembro de
