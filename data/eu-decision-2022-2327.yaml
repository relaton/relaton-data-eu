    neschvaluje chloramin B jako účinná látka pro použití v biocidních přípravcích
    typu 2, 3, 4 a 5
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/2327 af 24. november
    2022 om ikke at godkende chloramin B som et aktivstof til anvendelse i biocidholdige
