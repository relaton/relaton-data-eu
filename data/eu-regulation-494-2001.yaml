    e destinato ad essere esportato in alcuni paesi ACP
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 494/2001 van de Commissie van 13 maart 2001 tot intrekking
    van Verordening (EG) nr. 1451/2000 inzake de opening van een permanente openbare
    inschrĳving voor de verkoop van zachte tarwe van bakkwaliteit uit de voorraden
    van het Franse interventiebureau voor uitvoer naar sommige ACS-staten
  type: main
- language: pt
  script: Latn
