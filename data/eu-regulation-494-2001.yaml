  script: Latn
  content: Commission Regulation (EC) No 494/2001 of 13 March 2001 repealing Regulation
    (EC) No 1451/2000 relating to the issuing of a standing invitation to tender for
    the sale of common wheat of breadmaking quality held by the French intervention
    agency for export to certain ACP countries
  type: main
- language: fr
  script: Latn
