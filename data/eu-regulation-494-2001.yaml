    (ΕΚ) αριθ. 1451/2000 σχετικά με την έναρξη διαρκούς
    δημοπρασίας για την πώληση μαλακού αρτοποιήσιμου
    σίτου που ευρίσκεται στην κατοχή του γαλλικού
    οργανισμού παρέμβασης και ο οποίος προορίζεται
    για εξαγωγή προς ορισμένες χώρες ΑΚΕ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 494/2001, annettu 13 päivänä maaliskuuta 2001,
    pysyvän tarjouskilpailun avaamisesta Ranskan interventioelimen hallussaan pitämän
