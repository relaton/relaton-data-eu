    pour la vente de blé tendre panifiable détenu par l'organisme d'intervention
    français et destiné à être exporté vers certains États ACP
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 494/2001 der Kommission vom 13. März 2001 zur Aufhebung
