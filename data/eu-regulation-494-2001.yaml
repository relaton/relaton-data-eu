    für den Verkauf von Brotweichweizen aus Beständen der französischen Interventionsstelle
    zur Ausfuhr in die AKP-Länder
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 494/2001 af 13. marts 2001 om ophævelse
