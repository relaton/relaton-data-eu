    as food aid of vitaminized skimmed-milk powder to be purchased on the Community
    market, for the benefit of the Islamic Republic of Pakistan
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 717/76 de la Commission, du 29 mars 1976, relatif
    à l'adjudication pour la fourniture, au titre de l'aide alimentaire de lait écrémé
    en poudre vitaminé acheté sur le marché de la Communauté et destiné au programme
    alimentaire mondial en faveur de la République islamique du Pakistan
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 717/76 der Kommission vom 29. März 1976 über die
    Ausschreibung für die Lieferung von auf dem Markt der Gemeinschaft gekauftem,
    mit Vitaminen angereichertem Magermilchpulver im Rahmen der Nahrungsmittelhilfe
    an das Welternährungsprogramm für die Islamische Republik Pakistan
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 717/76 af 29. marts 1976 om licitation
