---
id: EURegulation20212139
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/2139 of 4 June 2021 supplementing
    Regulation (EU) 2020/852 of the European Parliament and of the Council by establishing
    the technical screening criteria for determining the conditions under which an
    economic activity qualifies as contributing substantially to climate change mitigation
    or climate change adaptation and for determining whether that economic activity
    causes no significant harm to any of the other environmental objectives
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/2139 de la Commission du 4 juin 2021 complétant
    le règlement (UE) 2020/852 du Parlement européen et du Conseil par les critères
    d’examen technique permettant de déterminer à quelles conditions une activité
    économique peut être considérée comme contribuant substantiellement à l’atténuation
    du changement climatique ou à l’adaptation à celui-ci et si cette activité
    économique ne cause de préjudice important à aucun des autres objectifs environnementaux
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/2139 der Kommission vom 4. Juni 2021 zur
    Ergänzung der Verordnung (EU) 2020/852 des Europäischen Parlaments und des Rates
    durch Festlegung der technischen Bewertungskriterien, anhand deren bestimmt wird,
    unter welchen Bedingungen davon auszugehen ist, dass eine Wirtschaftstätigkeit
    einen wesentlichen Beitrag zum Klimaschutz oder zur Anpassung an den Klimawandel
    leistet, und anhand deren bestimmt wird, ob diese Wirtschaftstätigkeit erhebliche
    Beeinträchtigungen eines der übrigen Umweltziele vermeidet
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/2139 на Комисията
    от 4 юни 2021 година за допълнение на Регламент
    (ЕС) 2020/852 на Европейския парламент и на Съвета
    чрез установяване на техническите критерии
    за проверка с цел определяне на условията,
    при които дадена икономическа дейност се квалифицира
    като допринасяща съществено за смекчаването
    на изменението на климата или за адаптирането
    към изменението на климата, и с цел определяне
    дали тази икономическа дейност не нанася значителни
    вреди във връзка с постигането на някоя от
    другите екологични цели
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/2139 ze dne 4. června
    2021, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2020/852,
    pokud jde o stanovení technických screeningových kritérií pro určení toho,
    za jakých podmínek se hospodářská činnost kvalifikuje jako významně přispívající
    ke zmírňování změny klimatu nebo k přizpůsobování se změně klimatu,
    a toho, zda tato hospodářská činnost významně nepoškozuje některý z dalších
    environmentálních cílů
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/2139 af 4. juni 2021 om supplerende
    regler til Europa-Parlamentets og Rådets forordning (EU) 2020/852 for så vidt
    angår fastsættelse af de tekniske screeningskriterier til bestemmelse af de
    betingelser, hvorunder en økonomisk aktivitet kvalificeres som bidragende væsentligt
    til modvirkning af klimaændringer eller tilpasning til klimaændringer, og til
    fastlæggelse af, hvorvidt den pågældende økonomiske aktivitet i væsentlig
    grad skader nogle af de andre miljømål
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2021/2139
    της Επιτροπής, της 4ης Ιουνίου 2021, για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2020/852 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου με τη θέσπιση τεχνικών κριτηρίων
    ελέγχου για τον προσδιορισμό των προϋποθέσεων
    υπό τις οποίες μια οικονομική δραστηριότητα
    θεωρείται ότι συμβάλλει σημαντικά στον μετριασμό
    της κλιματικής αλλαγής ή στην προσαρμογή στην
    κλιματική αλλαγή και για τον προσδιορισμό
    του κατά πόσον αυτή η οικονομική δραστηριότητα
    δεν βλάπτει σημαντικά οποιονδήποτε από τους
    άλλους περιβαλλοντικούς στόχους
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2021/2139, 4. juuni 2021, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2020/852, kehtestades
    tehnilised sõelumiskriteeriumid, millega määratakse kindlaks, millistel tingimustel
    võib majandustegevust pidada kliimamuutuste leevendamisele või nendega kohanemisele
    oluliselt kaasa aitavaks, ja mille alusel otsustatakse, ega see majandustegevus
    ei kahjusta oluliselt muid keskkonnaeesmärke
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2021/2139, annettu 4 päivänä kesäkuuta
    2021, Euroopan parlamentin ja neuvoston asetuksen (EU) 2020/852 täydentämisestä
    vahvistamalla tekniset arviointikriteerit, joilla määritetään, millä edellytyksillä
    taloudellista toimintaa pidetään ilmastonmuutoksen hillintää tai ilmastonmuutokseen
    sopeutumista merkittävästi edistävänä ja aiheuttaako kyseinen taloudellinen
    toiminta merkittävää haittaa millekään muulle ympäristötavoitteelle
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2021/2139 ón gCoimisiún an 4 Meitheamh 2021
    lena bhforlíontar Rialachán (AE) 2020/852 ó Pharlaimint na hEorpa agus ón
    gComhairle trí na critéir scagtha theicniúla a bhunú chun na coinníollacha
    a chinneadh faoina bhfuil gníomhaíocht eacnamaíoch cáilithe mar rannchuidiú
    substaintiúil le maolú ar an athrú aeráide nó le hoiriúnú don athrú aeráide
    agus chun a chinneadh cé acu a dhéantar nó nach ndéantar dochar suntasach
    leis an ngníomhaíocht eacnamaíoch sin d’aon cheann de na cuspóirí comhshaoil
    eile
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/2139 оd 4. lipnja 2021. o dopuni
    Uredbe (EU) 2020/852 Europskog parlamenta i Vijeća utvrđivanjem kriterija tehničke
    provjere na temelju kojih se određuje pod kojim se uvjetima smatra da ekonomska
    djelatnost znatno doprinosi ublažavanju klimatskih promjena ili prilagodbi klimatskim
    promjenama i nanosi li ta ekonomska djelatnost bitnu štetu kojem drugom okolišnom
    cilju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/2139 felhatalmazáson alapuló rendelete (2021.
    június 4.) az (EU) 2020/852 európai parlamenti és tanácsi rendeletnek az éghajlatváltozás
    mérsékléséhez és az éghajlatváltozáshoz való alkalmazkodáshoz lényegesen
    hozzájáruló és az egyéb környezeti célkitűzéseket jelentősen nem sértő
    gazdasági tevékenységekkel szemben támasztott követelmények meghatározásához
    szükséges technikai vizsgálati kritériumok megállapítása érdekében történő
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/2139 della Commissione, del 4 giugno 2021,
    che integra il regolamento (UE) 2020/852 del Parlamento europeo e del Consiglio
    fissando i criteri di vaglio tecnico che consentono di determinare a quali condizioni
    si possa considerare che un'attività economica contribuisce in modo sostanziale
    alla mitigazione dei cambiamenti climatici o all'adattamento ai cambiamenti climatici
    e se non arreca un danno significativo a nessun altro obiettivo ambientale
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/2139 (2021. gada 4. jūnijs), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) 2020/852 papildina, ieviešot tehniskās
    pārbaudes kritērijus, pēc kuriem nosaka, ar kādiem nosacījumiem konkrēta
    saimnieciskā darbība ir uzskatāma par tādu, kas būtiski sekmē klimata pārmaiņu
    mazināšanu vai pielāgošanos klimata pārmaiņām, un pēc kuriem nosaka, vai
    konkrētā saimnieciskā darbība nenodara būtisku kaitējumu kādiem citiem
    vidiskajiem mērķiem
  type: main
- language: lt
  script: Latn
  content: 2021 m. birželio 4 d. Komisijos deleguotasis reglamentas (ES) 2021/2139,
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2020/852 papildomas nustatant
    techninės analizės kriterijus, pagal kuriuos nustatoma, kokiomis sąlygomis
    ekonominė veikla laikoma svariai prisidedančia prie klimato kaitos švelninimo
    arba prisitaikymo prie jos ir ar ta ekonominė veikla nedaro reikšmingos žalos
    kitiems aplinkos tikslams
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2021/2139 tal-4 ta’ Ġunju 2021
    li jissupplimenta r-Regolament (UE) 2020/852 tal-Parlament Ewropew u tal-Kunsill
    billi jistabbilixxi l-kriterji tekniċi ta’ skrinjar sabiex jiġu ddeterminati
    l-kundizzjonijiet li fihom attività ekonomika tikkwalifika bħala attività li
    tikkontribwixxi sostanzjalment għall-mitigazzjoni tat-tibdil fil-klima jew għall-adattament
    għat-tibdil fil-klima u sabiex jiġi ddeterminat jekk dik l-attività ekonomika
    tikkawżax ħsara sinifikanti lil xi wieħed mill-objettivi ambjentali l-oħra
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2021/2139 van de Commissie van 4 juni 2021
    tot aanvulling van Verordening (EU) 2020/852 van het Europees Parlement en de
    Raad door technische screeningcriteria vast te stellen om de voorwaarden te bepalen
    waaronder een specifieke economische activiteit kan worden aangemerkt als substantieel
    bijdragend aan de mitigatie van klimaatverandering of de adaptatie aan klimaatverandering,
    en om uit te maken of die economische activiteit niet ernstig afbreuk doet aan
    een van de andere milieudoelstellingen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2021/2139 z dnia 4 czerwca 2021
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2020/852
    poprzez ustanowienie technicznych kryteriów kwalifikacji służących określeniu
    warunków, na jakich dana działalność gospodarcza kwalifikuje się jako wnosząca
    istotny wkład w łagodzenie zmian klimatu lub w adaptację do zmian klimatu,
    a także określeniu, czy ta działalność gospodarcza nie wyrządza poważnych
    szkód względem żadnego z pozostałych celów środowiskowych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/2139 da Comissão, de 4 de junho de 2021,
    que completa o Regulamento (UE) 2020/852 do Parlamento Europeu e do Conselho mediante
    o estabelecimento de critérios técnicos de avaliação para determinar em que
    condições uma atividade económica é qualificada como contribuindo substancialmente
    para a mitigação das alterações climáticas ou para a adaptação às alterações
    climáticas e estabelecer se essa atividade económica não prejudica significativamente
    o cumprimento de nenhum dos outros objetivos ambientais
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/2139 al Comisiei din 4 iunie 2021 de completare
    a Regulamentului (UE) 2020/852 al Parlamentului European și al Consiliului prin
    stabilirea criteriilor tehnice de examinare pentru a determina condițiile în
    care o activitate economică se califică drept activitate care contribuie în
    mod substanțial la atenuarea schimbărilor climatice sau la adaptarea la schimbările
    climatice și pentru a stabili dacă activitatea economică respectivă aduce
    prejudicii semnificative vreunuia dintre celelalte obiective de mediu
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/2139 zo 4. júna 2021, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2020/852 stanovením
    technických kritérií preskúmania na určenie podmienok, za ktorých sa hospodárska
    činnosť označuje za významne prispievajúcu k zmierneniu zmeny klímy alebo
    adaptácii na zmenu klímy, a na určenie toho, či daná hospodárska činnosť
    výrazne nenarúša plnenie niektorého z iných environmentálnych cieľov
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/2139 z dne 4. junija 2021 o dopolnitvi
    Uredbe (EU) 2020/852 Evropskega parlamenta in Sveta z določitvijo tehničnih
    meril za pregled za določitev pogojev, pod katerimi se šteje, da gospodarska
    dejavnost bistveno prispeva k blažitvi podnebnih sprememb ali prilagajanju podnebnim
    spremembam, ter za ugotavljanje, ali ta gospodarska dejavnost ne škoduje bistveno
    kateremu od drugih okoljskih ciljev
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/2139 de la Comisión, de 4 de junio de 2021,
    por el que se completa el Reglamento (UE) 2020/852 del Parlamento Europeo y del
    Consejo y por el que se establecen los criterios técnicos de selección para
    determinar las condiciones en las que se considera que una actividad económica
    contribuye de forma sustancial a la mitigación del cambio climático o a la adaptación
    al mismo, y para determinar si esa actividad económica no causa un perjuicio
    significativo a ninguno de los demás objetivos ambientales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/2139 av den 4 juni 2021
    om komplettering av Europaparlamentets och rådets förordning (EU) 2020/852 genom
    fastställande av tekniska granskningskriterier för att avgöra under vilka villkor
    en ekonomisk verksamhet ska anses bidra väsentligt till begränsningen av eller
    anpassningen till klimatförändringarna och för att avgöra om den ekonomiska
    verksamheten inte orsakar någon betydande skada för något av de andra miljömålen
  type: main
