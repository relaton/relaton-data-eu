title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3780/90 of 19 December 1990 laying down
    detailed rules for the implementing of Council Regulation (EEC) No 3576/90 as
    regards the temporary suspension of the import compensation mechanism and of customs
    duties on fruit and vegetables originating in Spain and Portugal released for
    consumption in the territory of the former German Democratic Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 3780/90 de la Commission, du 19 décembre 1990, portant
    modalités d' application du règlement (CEE) nº 3576/90 du Conseil en ce qui
    concerne la suspension temporaire du régime de compensation à l' importation
    ainsi que des droits de douane pour les fruits et légumes en provenance de l'
    Espagne et du Portugal mis à la consommation sur le territoire de l' ancienne
    République démocratique allemande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3780/90 der Kommission vom 19. Dezember 1990 mit Durchführungsvorschriften
    zur Verordnung (EWG) Nr. 3576/90 des Rates hinsichtlich der vorläufigen Aussetzung
    der Ausgleichs- und der Zollregelung für auf dem Gebiet der ehemaligen Deutschen
    Demokratischen Republik zum freien Verkehr abgefertigtes Obst und Gemüse mit
    Herkunft aus Spanien und Portugal
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3780/90 af 19. december 1990 om gennemførelsesbestemmelser
    til Rådets forordning (EØF) nr. 3576/90 for så vidt angår midlertidig suspension
    af udligningsmekanismen ved indførsel samt af told, når det gælder frugt og
    grønsager, som er afsendt fra Spanien og Portugal og overgår til frit forbrug
    på den tidligere Tyske Demokratiske Republiks område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3780/90 της Επιτροπής
    της 19ης Δεκεμβρίου 1990 περί λεπτομερειών εφαρμογής
    του κανονισμού (ΕΟΚ) αριθ. 3576/90 του Συμβουλίου
    σχετικά με την προσωρινή αναστολή του καθεστώτος
    αντιστάθμισης καθώς και των δασμών για τα οπωροκηπευτικά
    προέλευσης Ισπανίας και Πορτογαλίας που τίθενται
    σε κατανάλωση στο έδαφος της πρώην Λαϊκής Δημοκρατίας
    της Γερμανίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3780/90, annettu 19 päivänä joulukuuta 1990,
    Espanjasta ja Portugalista tuotujen ja entisen Saksan demokraattisen tasavallan
    alueella kulutukseen luovutettujen hedelmien ja kasvisten tuonnintasausjärjestelmän
    sekä tullien väliaikaisesta lykkäämisestä annetun neuvoston asetuksen (ETY)
    N:o 3576/90 yksityiskohtaisista soveltamissäännöistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3780/90 della Commissione, del 19 dicembre 1990, recante
    modalità d' applicazione del regolamento (CEE) n. 3576/90 del Consiglio per quanto
    riguarda la sospensione temporanea del regime di compensazione all' importazione,
    nonché dei dazi doganali, per gli ortofrutticoli provenienti dalla Spagna e dal
    Portogallo immessi al consumo sul territorio dell' ex Repubblica democratica tedesca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3780/90 van de Commissie van 19 december 1990 houdende
    bepalingen ter uitvoering van Verordening (EEG) nr. 3576/90 van de Raad wat de
    schorsing betreft van het compensatiemechanisme bij invoer alsmede van de douanerechten
    voor groenten en fruit uit Spanje en Portugal die op het grondgebied van de voormalige
    Duitse Democratische Republiek tot verbruik worden ingevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3780/90 da Comissão, de 19 de Dezembro de 1990,
    que estabelece normas de execução do Regulamento (CEE) nº 3576/90 do Conselho,
    no que diz respeito à suspensão temporária do regime de compensação na importação,
    bem como dos direitos aduaneiros relativos aos frutos e produtos hortícolas provenientes
    de Espanha e de Portugal introduzidos no consumo no território da antiga República
    Democrática Alemã
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 3780/90 de la Comisión, de 19 de diciembre de 1990,
    por el que se adoptan disposiciones de aplicación del Reglamento (CEE) nº 3576/90
    del Consejo en lo relativo a la suspensión temporal del régimen de compensación
    a la importación y de los derechos de aduana para las frutas y hortalizas procedentes
    de España y de Portugal despachados al consumo en el territorio de la antigua
    República Democrática Alemana
