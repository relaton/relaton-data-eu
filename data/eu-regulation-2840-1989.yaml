    cooperation and establishing provisions for the implementation of the Joint Declaration
    annexed to Decision No 1/88 of the EEC-Iceland Joint Committee
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2840/89 du Conseil, du 18 septembre 1989, concernant
    l'application de la décision n° 1/89 du comité mixte CEE-Islande modifiant
    le protocole n° 3 relatif à la définition de la notion de produits originaires
