title:
- language: en
  script: Latn
  content: '2003/850/EC: Commission Decision of 4 December 2003 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of BAS 670H and silver thiosulphate in Annex I to Council
    Directive 91/414/EEC concerning the placing of plant protection products on the
    market (Text with EEA relevance) (notified under document number C(2003) 4470)'
  type: main
- language: fr
  script: Latn
  content: '2003/850/CE: Décision de la Commission du 4 décembre 2003 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription éventuelle de BAS 670H et du thiosulfate d''argent à l''annexe
    I de la directive 91/414/CEE du Conseil concernant la mise sur le marché des
    produits phytopharmaceutiques (Texte présentant de l''intérêt pour l''EEE)
    [notifiée sous le numéro C(2003) 4470]'
  type: main
- language: de
  script: Latn
  content: '2003/850/EG: Entscheidung der Kommission vom 4. Dezember 2003 zur grundsätzlichen
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von BAS 670H und Silberthiosulfatin Anhang
    I der Richtlinie 91/414/EWG des Rates über das Inverkehrbringen von Pflanzenschutzmitteln
    eingereicht wurden (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen
    K(2003) 4470)'
  type: main
- language: da
  script: Latn
  content: '2003/850/EF: Kommissionens beslutning af 4. december 2003 om principiel
    anerkendelse af, at dossiererne for detaljeret gennemgang med henblik på eventuel
