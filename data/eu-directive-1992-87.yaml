title:
- language: en
  script: Latn
  content: Commission Directive 92/87/EEC of 26 October 1992 establishing a non-exclusive
    list of the main ingredients normally used and marketed for the preparation of
    compound feedingstuffs intended for animals other than pets
  type: main
- language: fr
  script: Latn
  content: Directive 92/87/CEE de la Commission, du 26 octobre 1992, établissant
    une liste non exclusive des principaux ingrédients normalement utilisés et commercialisés
    pour la préparation d'aliments composés destinés à des animaux autres que
    les animaux familiers
  type: main
- language: de
  script: Latn
  content: Richtlinie 92/87/EWG der Kommission vom 26. Oktober 1992 zur Festlegung
    eines nicht ausschließlichen Verzeichnisses der wichtigsten Ausgangserzeugnisse,
    die zur Herstellung von Mischfuttermitteln, die für andere Tiere als Heimtiere
    bestimmt sind, normalerweise verwendet und in den Verkehr gebracht werden
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 92/87/EØF af 26. oktober 1992 om en ikke-udtømmende
    fortegnelse over de vigtigste råvarer, der normalt anvendes og markedsføres
    til fremstilling af foderblandinger til andre dyr end selskabsdyr
  type: main
- language: el
  script: Grek
  content: Οδηγία 92/87/ΕΟΚ της Επιτροπής της 26ης Οκτωβρίου
    1992 για την κατάρτιση ενός μη αποκλειστικού
    καταλόγου των κυριοτέρων συστατικών τα οποία
    συνήθως χρησιμοποιούνται και διατίθενται
    στο εμπόριο για την παρασκευή συνθέτων ζωοτροφών
    για ζώα εκτός των οικιακών
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 92/87/ETY, annettu 26 päivänä lokakuuta 1992, muiden
    eläinten kuin lemmikkieläinten rehuseosten valmistuksessa tavallisesti käytettävien
    ja tätä varten kaupan pidettävien tärkeimpien ainesten avoimesta luettelosta
  type: main
- language: it
  script: Latn
  content: Direttiva 92/87/CEE della Commissione, del 26 ottobre 1992, che stabilisce
    un elenco non esclusivo dei principali ingredienti normalmente impiegati e commercializzati
    per la preparazione di mangimi composti destinati ad animali diversi dagli animali
    familiari
  type: main
- language: nl
  script: Latn
  content: Richtlijn 92/87/EEG van de Commissie van 26 oktober 1992 tot vaststelling
    van een niet-exclusieve lijst van de belangrijkste ingrediënten die voor de bereiding
    van mengvoeders voor andere dieren dan huisdieren gewoonlijk worden gebruikt en
    in de handel gebracht
  type: main
- language: pt
  script: Latn
  content: Directiva 92/87/CEE da Comissão, de 26 de Outubro de 1992, que estabelece
    uma lista não exclusiva dos principais ingredientes normalmente utilizados e
    comercializados para o fabrico de alimentos compostos para animais destinados
    a espécies diferentes dos animais de companhia
  type: main
- language: es
  script: Latn
  content: Directiva 92/87/CEE de la Comisión, de 26 de octubre de 1992, por la que
    se establece una lista no exclusiva de los principales ingredientes normalmente
    utilizados y comercializados para la preparación de piensos compuestos destinados
    a animales distintos de los animales domésticos
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 92/87/EEG av den 26 oktober 1992 om upprättande
