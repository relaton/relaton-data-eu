title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 821/2000 of 19 April 2000 determining the
    extent to which the applications for import licences submitted in April 2000 for
    certain dairy products under certain tariff quotas opened by Regulation (EC) No
    1374/98 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 821/2000 de la Commission, du 19 avril 2000, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 2000 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 1374/98 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 821/2000 der Kommission vom 19. April 2000 zur Festlegung
    des Umfangs, in dem den im April 2000 gestellten Anträgen auf Erteilung von Lizenzen
    für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung (EG)
    Nr. 1374/98 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 821/2000 af 19. april 2000 om, i hvilket
    omfang de ansøgninger om importlicenser, som er indgivet i april 2000 vedrørende
    visse mejeriprodukter inden for de toldkontingenter, der blev åbnet ved forordning
    (EF) nr. 1374/98, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 821/2000 της Επιτροπής,
    της 19ης Απριλίου 2000, που καθορίζει το κατά πόσον
    μπορούν να γίνουν δεκτές οι αιτήσεις πιστοποιητικών
    εισαγωγής που υπεβλήθησαν τον Απρίλιο 2000 για
    ορισμένα γαλακτοκομικά προϊόντα στο πλαίσιο
    ορισμένων δασμολογικών ποσοστώσεων που θεσπίσθηκαν
    με τον κανονισμό (ΕΚ) αριθ. 1374/98
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 821/2000, annettu 19 päivänä huhtikuuta 2000,
    asetuksessa (EY) N:o 1374/98 avattuihin tariffikiintiöihin kuuluville maitotuotteille
    huhtikuussa 2000 käyttöön otettujen tuontitodistusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 821/2000 della Commissione, del 19 aprile 2000, che
    stabilisce in quale misura possano essere accettate le domande di titoli di importazione
    presentate nel mese di aprile 2000 per determinati prodotti lattiero-caseari nell'ambito
    di taluni contingenti tariffari aperti dal regolamento (CE) n. 1374/98
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 821/2000 van de Commissie van 19 april 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen voor invoercertificaten
    die in april 2000 voor bepaalde melkproducten zijn ingediend in het kader van
    bepaalde tariefcontingenten, geopend bij Verordening (EG) nr. 1374/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 821/2000 da Comissão, de 19 de Abril de 2000, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Abril de 2000 para certos produtos lácteos no âmbito de determinados
    contingentes pautais abertos pelo Regulamento (CE) n.° 1374/98
  type: main
