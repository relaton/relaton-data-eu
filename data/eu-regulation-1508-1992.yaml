title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1508/92 of 11 June 1992 fixing the representative
    market rates to be applied for certain amounts in the context of the common agricultural
    policy and, in particular, for the calculation of the monetary compensatory amounts
    and the agricultural conversion rates for the pigmeat sector in Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1508/92 de la Commission, du 11 juin 1992, fixant les
    taux représentatifs du marché à appliquer pour certains montants dans le cadre
    de la politique agricole commune, et notamment pour le calcul des montants compensatoires
    monétaires, ainsi que le taux de conversion agricole applicable dans le secteur
    de la viande de porc en Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1508/92 der Kommission vom 11. Juni 1992 zur Festsetzung
    der repräsentativen Marktkurse, die für bestimmte Beträge im Rahmen der gemeinsamen
    Agrarpolitik, insbesondere für die Berechnung der Währungsausgleichsbeträge,
    angewendet werden müssen, sowie des in Griechenland auf Schweinefleisch anwendbaren
    landwirtschaftlichen Umrechnungskurses
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1508/92 af 11. juni 1992 om fastsættelse
    af de repræsentative markedskurser, der skal anvendes for visse beløb i forbindelse
    med den fælles landbrugspolitik, navnlig ved beregning af de monetære udligningsbeløb
    samt af landbrugsomregningskursen for svinekød i Grækenland
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1508/92 της Επιτροπής
    της 11ης Ιουνίου 1992 για τον καθορισμό των αντιπροσωπευτικών
    ισοτιμιών της αγοράς που θα εφαρμοσθούν σε
    ορισμένα ποσά στα πλαίσια της κοινής γεωργικής
    πολιτικής και κυρίως για τον υπολογισμό των
    νομισματικών εξισωτικών ποσών καθώς και του
    γεωργικού συντελεστή μετατροπής που εφαρμόζεται
    στον τομέα του χοιρείου κρέατος στην Ελλάδα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1508/92 della Commissione, dell'11 giugno 1992, che
    fissa i tassi rappresentativi del mercato da applicare a taluni importi nel quadro
    della politica agricola comune, in particolare per il calcolo degli importi compensativi
    monetari, nonché il tasso di conversione agricolo applicabile nel settore delle
    carni suine in Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1508/92 van de Commissie van 11 juni 1992 tot vaststelling
    van de representatieve marktkoersen die moeten worden toegepast voor bepaalde
    bedragen in het kader van het gemeenschappelijk landbouwbeleid, en met name voor
    de berekening van de monetaire compenserende bedragen en van de landbouwomrekeningskoers
    die geldt in de sector varkensvlees in Griekenland
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1508/92 da Comissão, de 11 de Junho de 1992, que
    fixa as taxas representativas do mercado a aplicar em relação a determinados
    montantes no âmbito da política agrícola comum e, nomeadamente, para o cálculo
    dos montantes compensatórios monetários, bem como a taxa de conversão agrícola
    aplicável no sector da carne de suíno na Grécia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1508/92 de la Comisión, de 11 de junio de 1992, por
    el que se fijan los tipos representativos del mercado aplicables a determinados
    importes en el marco de la política agraria común y, en particular, al cálculo
    de los montantes compensatorios monetarios y los tipos de conversión agrarios
    aplicables en el sector de la carne de porcino en Grecia
  type: main
