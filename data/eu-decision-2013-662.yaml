  script: Latn
  content: '2013/662/EU: Commission Implementing Decision of 14 October 2013 amending
    Decision 2009/767/EC as regards the establishment, maintenance and publication
    of trusted lists of certification service providers supervised/accredited by Member
    States (notified under document C(2013) 6543)'
  type: main
- language: fr
  script: Latn
