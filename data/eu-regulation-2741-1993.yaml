title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2741/93 of 4 October 1993 re-establishing
    the levying of customs duties on products falling within CN code 3503 00 10, originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2741/93 de la Commission du 4 octobre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 3503 00 10 originaires du Pakistan, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2741/93 DER KOMMISSION vom 4. Oktober 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 3503 00 10 Ursprung in Pakistan,
    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2741/93 af 4. oktober 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3503 00 10 og med oprindelse
    i Pakistan, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2741/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 4ης Οκτωβρίου 1993 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 3503 00 10, καταγωγής Πακιστάν, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2741/93 DELLA COMMISSIONE del 4 ottobre 1993 che ripristina
