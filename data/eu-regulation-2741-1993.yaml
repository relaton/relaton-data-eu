    10 originari del Pakistan, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2741/93 VAN DE COMMISSIE van 4 oktober 1993 houdende
