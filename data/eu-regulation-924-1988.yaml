    Nummer 40.0550) mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 3783/87
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 924/88 af 6. april 1988 om genindførelse
