  content: Commission Regulation (EEC) No 924/88 of 6 April 1988 re-establishing the
    levying of customs duties on synthetic staple fibres processed for spinning, products
    of category 55 (order number 40.0550), originating in Mexico to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 924/88 de la Commission du 6 avril 1988 portant rétablissement
    de la perception des droits de douane applicables aux fibres synthétiques discontinues
    pour la filature de la catégorie de produits n° 55 (numéro d' ordre 40.0550),
    originaires du Mexique, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 924/88 der Kommission vom 6. April 1988 zur Wiedereinführung
