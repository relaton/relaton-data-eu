    sistema de prémios para a manutenção de vacas em aleitamento
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2066/92 del Consejo de 30 de junio de 1992 que modifica
    el Reglamento (CEE) n° 805/68 por el que se establece la organización común
    de mercados en el sector de la carne de bovino, y que deroga el Reglamento (CEE)
    n° 468/87 por el que se establecen las normas generales del régimen de prima
    especial en favor de los productores de carne de bovino y el Reglamento (CEE)
