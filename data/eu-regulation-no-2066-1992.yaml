  content: Council Regulation (EEC) No 2066/92 of 30 June 1992 amending Regulation
    (EEC) No 805/68 on the common organization of the market in beef and veal and
    repealing Regulation (EEC) No 468/87 laying down general rules applying to the
    special premium for beef producers and Regulation (EEC) No 1357/80 introducing
    a system of premiums for maintaining suckler cows
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2066/92 du Conseil du 30 juin 1992 modifiant le règlement
