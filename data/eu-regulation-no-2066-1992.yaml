  script: Latn
  content: Regolamento (CEE) n. 2066/92 del Consiglio del 30 giugno 1992 recante modifica
    del regolamento (CEE) n. 805/68, relativo all'organizzazione comune dei mercati
    nel settore delle carni bovine, e recante abrogazione sia del regolamento (CEE)
