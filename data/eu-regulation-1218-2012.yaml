    výmeny listov medzi Európskou úniou a Thajskom podľa článku XXVIII Všeobecnej
    dohody o clách a obchode (GATT) z roku 1994 o úprave koncesií týkajúcich
    sa spracovaného hydinového mäsa stanovených v zozname EÚ, ktorý tvorí prílohu
    k dohode GATT z roku 1994, ktorým sa mení a dopĺňa príloha I k nariadeniu
    Rady (EHS) č. 2658/87 o colnej a štatistickej nomenklatúre a o Spoločnom colnom
    sadzobníku
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) št. 1218/2012 Evropskega parlamenta in Sveta z dne 12. decembra
    2012 o izvajanju Sporazuma v obliki izmenjave pisem med Evropsko unijo in Brazilijo
    v skladu s členom XXVIII Splošnega sporazuma o carinah in trgovini (GATT) 1994
    o spremembi koncesij za predelano perutninsko meso, določenih v seznamu EU, ki
    je priložen GATT 1994, in Sporazuma v obliki izmenjave pisem med Evropsko unijo
    in Tajsko v skladu s členom XXVIII Splošnega sporazuma o carinah in trgovini
    (GATT) 1994 o spremembi koncesij za predelano perutninsko meso, določenih v seznamu
    EU, ki je priložen GATT 1994, ter o spremembah in dopolnitvah Priloge I k Uredbi
    Sveta (EGS) št. 2658/87 o tarifni in statistični nomenklaturi ter skupni carinski
    tarifi
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 1218/2012 del Parlamento Europeo y del Consejo, de
    12 de diciembre de 2012 , relativo a la aplicación del Acuerdo en forma de Canje
    de Notas entre la Unión Europea y Brasil en virtud del artículo XXVIII del Acuerdo
    General sobre Aranceles Aduaneros y Comercio (GATT) de 1994 relativo a la modificación
    de las concesiones con respecto a la carne de aves de corral transformada previstas
    en la lista de la UE anexa al GATT de 1994 y del Acuerdo en forma de Canje de
    Notas entre la Unión Europea y Tailandia en virtud del artículo XXVIII del Acuerdo
    General sobre Aranceles Aduaneros y Comercio de 1994 (GATT de 1994) relativo a
    la modificación de las concesiones con respecto a la carne de aves de corral
    transformada previstas en la lista de la UE anexa al GATT de 1994, y por el que
    se modifica y completa el anexo I del Reglamento (CEE) n ° 2658/87 del Consejo,
    relativo a la nomenclatura arancelaria y estadística y al arancel aduanero común
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) nr 1218/2012 av den 12
    december 2012 om genomförande av avtalet genom skriftväxling mellan Europeiska
    unionen och Brasilien enligt artikel XXVIII i Allmänna tull- och handelsavtalet
    (Gatt) 1994 om ändring av medgivandena avseende beredningar av fjäderfäkött
    enligt EU:s bindningslista som bifogas Gatt 1994 och av avtalet genom skriftväxling
    mellan Europeiska unionen och Thailand enligt artikel XXVIII i Allmänna tull-
    och handelsavtalet (Gatt) 1994 om ändring av medgivandena avseende beredningar
    av fjäderfäkött enligt EU:s bindningslista som bifogas Gatt 1994, och om ändring
    och komplettering av bilaga I till rådets förordning (EEG) nr 2658/87 om tulltaxe-
    och statistiknomenklaturen och om Gemensamma tulltaxan
