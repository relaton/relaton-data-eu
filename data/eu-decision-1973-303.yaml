---
id: EUDecision1973303
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 July 1973 authorizing the French Republic not
    to apply Community treatment to matches falling within heading No 36.06 of the
    Common Customs Tariff originating in third countries and put into free circulation
    in other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/303/CEE de la Commission, du 24 juillet 1973, autorisant la
    République française à exclure du traitement communautaire les allumettes,
    de la position 36.06 du Tarif douanier commun originaire des pays tiers et mises
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. Juli 1973, mit der die Französische
    Republik ermächtigt wird, aus Drittländern stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Zündhölzer der Tarifnummer 36.06 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 24. juli 1973 om bemyndigelse af Den franske
    Republik til udelukkelse fra fællesskabsbehandling af tændstikker, henhørende
    under pos. 36.06 i den fælles toldtarif, som har oprindelse i tredjelande og
    frit omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 luglio 1973, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i fiammiferi della voce 36.06
    della tariffa doganale comune, originari dei paesi terzi e messi in libera pratica
    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 juli 1973 waarbij de Franse Republiek
    wordt gemachtigd lucifers van post 36.06 van het gemeenschappelijk douanetarief,
    van oorsprong uit derde landen en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
