    των προϊόντων στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3965/89 DELLA COMMISSIONE del 20 dicembre 1989 che
    sospende, per la campagna 1990, i dazi applicabili ai prodotti freschi della pesca
    originari del Marocco e provenienti da imprese comuni di pesca costituite tra
    persone fisiche o giuridiche del Portogallo e del Marocco, all'atto del loro sbarco
    diretto in Portogallo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3965/89 VAN DE COMMISSIE van 20 december 1989 tot
    schorsing voor het visseizoen 1990 van de rechten voor verse visserijprodukten
    van oorsprong uit Marokko en afkomstig van gemeenschappelijke visserijondernemingen
    van natuurlijke of rechtspersonen uit Portugal en uit Marokko, bij rechtstreekse
    aanvoer in Portugal
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3965/89 DA COMISSAO de 20 de Dezembro de 1989 que
