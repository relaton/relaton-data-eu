title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3965/89 of 20 December 1989 suspending for
    the 1990 fishing year the duties applicable to fresh fishery products originating
    in Morocco and coming from joint fisheries ventures set up between natural or
    legal persons from Portugal and Morocco, on the direct landing of such products
    in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3965/89 de la Commission du 20 décembre 1989 portant,
    pour la campagne 1990, suspension des droits applicables aux produits de la pêche
    fraîche originaires du Maroc et provenant des entreprises communes de pêche
    constituées entre personnes physiques ou morales du Portugal et du Maroc, à
    l'occasion de leur débarquement direct au Portugal
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3965/89 DER KOMMISSION vom 20. Dezember 1989 zur Aussetzung
    der bei der Direktanlandung in Portugal anzuwendenden Zoelle auf frische Fischereierzeugnisse
    mit Ursprung in Marokko von gemeinsamen Fischereiunternehmen zwischen natuerlichen
    oder juristischen Personen Portugals und Marokkos fuer das Wirtschaftsjahr 1990
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3965/89 af 20. december 1989 om suspension
    for fangstsæsonen 1990 af tolden på ferske fiskerivarer med oprindelse i Marokko
    og hidrørende fra fællesforetagender, der er oprettet mellem fysiske eller juridiske
    personer i Portugal og i Marokko, i anledning af sådanne varers direkte landing
    i Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3965/89 της Επιτροπής
    της 20ής Δεκεμβρίου 1989 για την αναστολή, για
    την περίοδο εμπορίας 1990, των δασμών που εφαρμόζονται
    σε νωπά προϊόντα αλιείας καταγωγής Μαρόκου
    τα οποία προέρχονται από κοινές αλιευτικές
    επιχειρήσεις που έχουν συσταθεί μεταξύ φυσικών
    ή νομικών προσώπων της Πορτογαλίας και του
