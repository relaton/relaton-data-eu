title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 767/2004 of 23 April 2004 setting export
    refunds in the processed fruit and vegetable sector other than those granted on
    added sugar (provisionally preserved cherries, peeled tomatoes, sugar-preserved
    cherries, prepared hazelnuts, certain orange juices)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 767/2004 de la Commission du 23 avril 2004 fixant les
    restitutions à l'exportation dans le secteur des produits transformés à base
    de fruits et légumes, autres que celles octroyées au titre des sucres d'addition
    (cerises conservées provisoirement, tomates pelées, cerises confites, noisettes
    préparées, certains jus d'orange)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 767/2004 der Kommission vom 23. April 2004 zur Festsetzung
    der Ausfuhrerstattungen für Verarbeitungserzeugnisse aus Obst und Gemüse mit
    Ausnahme der für die Verarbeitungserzeugnisse mit Zusatz von Zucker gewährten
    Ausfuhrerstattungen (vorläufig haltbar gemachte Kirschen, geschälte Tomaten/Paradeiser,
    haltbar gemachte Kirschen, zubereitete Haselnüsse, gewisse Orangensäfte)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 767/2004 af 23. april 2004 om fastsættelse
    af eksportrestitutioner for forarbejdede frugter og grøntsager undtagen for tilsat
    sukker (foreløbigt konserverede kirsebær, flåede tomater, syltede kirsebær,
    tilberedte hasselnødder og visse former for appelsinsaft)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 767/2004 της Επιτροπής,
    της 23ης Απριλίου 2004, για καθορισμό των επιστροφών
    κατά την εξαγωγή στον τομέα των μεταποιημένων
    προϊόντων με βάση τα οπωροκηπευτικά εκτός
    αυτών που χορηγούνται για την προστιθέμενη
    ζάχαρη (κεράσια προσωρινά διατηρημένα, αποφλοιωμένες
    ντομάτες, ζαχαρόπηκτα κεράσια, παρασκευασμένα
    φουντούκια και ορισμένοι χυμοί πορτοκαλιού)
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 767/2004, annettu 23 päivänä huhtikuuta 2004,
    vientitukien vahvistamisesta hedelmä- ja vihannesjalostealalla lisättyä sokeria
    koskevaa vientitukea (väliaikaisesti säilötyt kirsikat, kuoritut tomaatit,
    sokeroidut kirsikat, valmistetut hasselpähkinät, tietyt appelsiinimehut) lukuun
    ottamatta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 767/2004 della Commissione, del 23 aprile 2004, che
    fissa le restituzioni all'esportazione nel settore dei prodotti trasformati a
    base di ortofrutticoli, ad eccezione di quelle concesse per gli zuccheri addizionati
    (ciliegie temporaneamente conservate, pomodori pelati, ciliegie candite, nocciole
    preparate, taluni succhi d'arancia)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 767/2004 van de Commissie van 23 april 2004 tot vaststelling
    van de uitvoerrestituties in de sector verwerkte producten op basis van groenten
    en fruit, andere dan voor toegevoegde suiker toegekende restituties (voorlopig
    verduurzaamde kersen, gepelde tomaten, gekonfĳte kersen, bereide hazelnoten en
    sommige sinaasappelsappen)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 767/2004 da Comissão, de 23 de Abril de 2004, que
    fixa as restituições à exportação no sector dos produtos transformados à
    base de frutas e produtos hortícolas, com exclusão das concedidas a título
    dos açúcares de adição (cerejas conservadas transitoriamente, tomates pelados,
    cerejas cristalizadas, avelãs preparadas, determinados sumos de laranja)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 767/2004 de la Comisión, de 23 de abril de 2004, por
    el que se fijan las restituciones por exportación en el sector de los productos
    transformados a base de frutas y hortalizas, distintas de las concedidas por azúcares
    añadidos (cerezas conservadas provisionalmente, tomates pelados, cerezas confitadas,
    avellanas preparadas, determinados zumos de naranja)
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 767/2004 av den 23 april 2004 om fastställande
    av exportbidrag för bearbetade produkter av frukt och grönsaker, förutom de
    som beviljats på grundval av tillsatt socker (tillfälligt konserverade körsbär,
    skalade tomater, körsbär konserverade med socker, beredda hasselnötter och
    viss apelsinsaft)
  type: main
