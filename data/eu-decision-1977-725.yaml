id: EUDecision1977725
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 June 1977 authorizing the Federal Republic of
    Germany not to apply Community treatment to woven fabrics of cotton other than
    of cotton gauze or of unbleached terry towelling and similar terry fabrics, falling
    within heading No ex 55.09 of the Common Customs Tariff, originating in the People's
    Republic of China and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/725/CEE: Décision de la Commission, du 22 juin 1977, autorisant la
    République fédérale d''Allemagne à exclure du traitement communautaire les
    tissus de coton autres qu''à point de gaze ou boucles du genre éponge, écrus,
    de la position Ex 55.09 du Tarif douanier commun, originaires de la République
    populaire de Chine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Juni 1977, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der Volksrepublik China stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle, andere
    als Drehergewebe oder Schlingengewebe (Frottiergewebe roh), der Tarifnummer ex
    55.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. juni 1977 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage vævet stof af bomuld bortset
    fra drejervævet stof af bomuld eller ubleget håndklædefrotterstof og lignende
    frotterstof, som henhører under position ex 55.09 i den fælles toldtarif, har
    oprindelse i Den kinesiske Folkerepublik og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 giugno 1977, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario i tessuti di cotone
    diversi da quelli a punto di garza o ricci del tipo spugna, greggi, della voce
    ex 55.09 della tariffa doganale comune, originari della Repubblica popolare cinese
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 juni 1977 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd weefsels van katoen, andere dan met gaasbinding of
    dan bad- of frotteerstof (lussendoek) van post ex 55.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
