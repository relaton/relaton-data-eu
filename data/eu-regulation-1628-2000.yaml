    de afschaffing van de correctiefactor van de landbouwomrekeningskoersen is aangepast
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1628/2000 z dnia 24 lipca 2000 r. zawierające
