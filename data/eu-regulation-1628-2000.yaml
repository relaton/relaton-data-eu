    li ffissaw, qabel l-1 ta’ Frar 1995, ċerti prezzijiet u ammonti fis-suq tal-ħalib
    u prodotti tal-ħalib li tagħhom il-valur f’ECUs kien adattat bħala riżultat
    tat-tneħħija tal-fattur korrettiv għar-rati ta’ konverżjoni agrikoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1628/2000 van de Commissie van 24 juli 2000 houdende
