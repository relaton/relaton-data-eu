title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1628/2000 of 24 July 2000 correcting, for
    the third time, Regulation (EC) No 1802/95 amending the Regulations that fixed,
    prior to 1 February 1995, certain prices and amounts in the market in milk and
    milk products of which the value in ecus was adapted as a result of the abolition
    of the correcting factor for agricultural conversion rates
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1628/2000 de la Commission du 24 juillet 2000 rectifiant,
    pour la troisième fois, le règlement (CE) nº 1802/95 ajustant et modifiant
    les règlements du secteur du lait et des produits laitiers qui ont fixé avant
    le 1er février 1995 certains prix et montants dont les valeurs en écus ont été
    adaptées en raison de la suppression du facteur de correction des taux de conversion
    agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1628/2000 der Kommission vom 24. Juli 2000 zur dritten
    Berichtigung der Verordnung (EG) Nr. 1802/95 zur Ausgleichung und Änderung bestimmter
    Preise und Beträge in den vor dem 1. Februar 1995 in Kraft getretenen Verordnungen
    für Milch und Milcherzeugnisse, deren Wert in Ecu wegen der Abschaffung des Korrekturfaktors
    der landwirtschaftlichen Umrechnungskurse angepaßt wurde
  type: main
