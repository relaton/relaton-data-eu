    která před 1. únorem 1995 stanovila některé ceny a částky v odvětví mléka
    a mléčných výrobků, jejichž hodnota v ECU byla upravena v důsledku zrušení
    opravného faktoru pro zemědělské přepočítací koeficienty
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1628/2000 af 24. juli 2000 om tredje
