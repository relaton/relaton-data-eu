  script: Latn
  content: A Bizottság 1628/2000/EK rendelete (2000. július 24.) egyes tej és tejtermékek
    piaci árát és összegét, amelyek ECU-ben kifejezett értékét a mezőgazdasági
    átváltási arányok korrekciós tényezőjének eltörlése következtében
    kiigazították, 1995. február 1-je előtt rögzítő rendeletek módosításáról
    szóló 1802/95/EK rendelet harmadik alkalommal történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1628/2000 della Commissione, del 24 luglio 2000, che
    rettifica, per la terza volta, il regolamento (CE) n. 1802/95 recante adeguamento
    e modifica dei regolamenti del settore del latte e dei prodotti lattiero-caseari
    che hanno fissato, anteriormente al 1o febbraio 1995, alcuni prezzi e importi
    i cui valori in ecu sono stati adattati a seguito della soppressione del coefficiente
    correttore dei tassi di conversione agricoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1628/2000 (2000. gada 24. jūlijs), ar kuru trešo
    reizi labo Regulu (EK) Nr. 1802/95, ar ko groza regulas, kuras līdz 1995. gada
    1. februārim piena un piena produktu tirgū noteica dažas cenas un summas, kuru
    vērtību izteica Eiropas valūtas vienībās pēc lauksaimniecības konversijas
    likmju korekcijas koeficienta atcelšanas
  type: main
- language: lt
  script: Latn
  content: 2000 m. liepos 24 d. Komisijos reglamentas (EB) Nr. 1628/2000, taisantis
    Reglamentą (EB) Nr. 1802/95, iš dalies keičiantį reglamentus, kurie iki 1995
    m. vasario 1 d. nustatė pieno ir pieno produktų rinkoje tam tikras kainas ir
    sumas, kurių vertė, išreikšta ekiu, buvo suderinta panaikinus žemės ūkio
    perskaičiavimo kursų korekcinį koeficientą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 1628/2000 tal-24 ta Lulju 2000
