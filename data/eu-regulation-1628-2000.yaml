    ca urmare a eliminării factorului de corecție a cursului de schimb agricol
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1628/2000 z 24. júla 2000 opravujúce po tretíkrát
    nariadenie (ES) č. 1802/95, ktorým sa menia a dopĺňajú nariadenia stanovujúce
    pred 1. februárom 1995 určité ceny a množstvá na trhu s mliekom a mliečnymi
    výrobkami, hodnota ktorých sa prijala v ECU následkom zrušenia opravného
    faktora prevodnej sadzby v poľnohospodárstve
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1628/2000 z dne 24. julija 2000 o tretjem popravku
