    zniesienia współczynnika poprawkowego dla rolniczych kursów przeliczeniowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1628/2000 da Comissão, de 24 de Julho de 2000, que
    rectifica, pela terceira vez, o Regulamento (CE) n° 1802/95 que ajusta e altera
    os regulamentos do sector do leite e dos produtos lácteos que fixaram, antes
    de 1 de Fevereiro de 1995, determinados preços e montantes cujos valores em ecus
    foram adaptados devido à supressão do factor de correcção das taxas de conversão
    agrícolas
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1628/2000 al Comisiei din 24 iulie 2000 de corectare,
