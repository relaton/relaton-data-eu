title:
- language: fr
  script: Latn
  content: Décision du Conseil du 1er février 1971, autorisant la tacite reconduction
    ou le maintien en vigueur de certains Traités d'amitié, de commerce et de navigation,
    et accords similaires conclus par les États membres avec des pays tiers
  type: main
- language: de
  script: Latn
  content: '71/70/EWG: Entscheidung des Rates vom 1. Februar 1971 zur Genehmigung
    der stillschweigenden Verlängerung oder der Beibehaltung bestimmter Freundschafts-,
    Handels- und Schiffahrtsverträge sowie ähnlicher Abkommen zwischen den Mitgliedstaaten
    und dritten Ländern'
  type: main
- language: it
  script: Latn
  content: '71/70/CEE: Decisione del Consiglio, del 1 febbraio 1971, che autorizza
    il tacito rinnovo o il mantenimento in vigore di taluni trattati d''amicizia,
    di commercio e di navigazione ed accordi analoghi conclusi da Stati membri con
    paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '71/70/EEG: Beschikking van de Raad van 1 februari 1971 houdende machtiging
    tot stilzwijgende verlenging of handhaving van bepaalde tussen de Lid-Staten en
    derde landen gesloten vriendschaps-, handels- en scheepvaartverdragen en soortgelijke
    akkoorden'
  type: main
