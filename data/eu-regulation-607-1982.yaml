  content: Council Regulation (EEC) No 607/82 of 16 March 1982 derogating from Regulation
    (EEC) No 456/80 in respect of the date when applicants for an abandonment premium
    must have carried out grubbing of vines
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 607/82 du Conseil, du 16 mars 1982, dérogeant au
    règlement (CEE) n° 456/80 en ce qui concerne la date avant laquelle doit être
    réalisé l' arrachage des vignes par le demandeur d' une prime d' abandon
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 607/82 des Rates vom 16. März 1982 zur Abweichung
    von der Verordnung (EWG) Nr. 456/80 hinsichtlich des Zeitpunkts, vor dem die Rodung
    der Reben durch den Antragsteller auf Aufgabeprämie erfolgt sein muß
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 607/82 af 16. marts 1982 om undtagelse fra
    forordning (EØF) nr. 456/80 for så vidt angår den dato, inden hvilken vinarealer
    skal være ryddet af den, der ansøger om nedlæggelsespræmie
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 607/82 τού Συμβουλίου
