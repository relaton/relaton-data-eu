    quale il richiedente un premio di abbandono deve procedere all' estirpazione delle
    viti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 607/82 van de Raad van 16 maart 1982 houdende afwijking
    van Verordening (EEG) nr. 456/80 voor wat betreft de datum waarvoor de wijnstokken
    door de aanvrager van een stopzettingspremie moeten zijn gerooid
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 607/82 do Conselho, de 16 de Março de 1982, que
