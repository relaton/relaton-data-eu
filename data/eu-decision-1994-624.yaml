  script: Latn
  content: '94/624/EC: Commission Decision of 29 June 1994 of the establishment of
    the Community support framework for Community structural assistance for the Spanish
    regions concerned by Objective 1, which are Andalucía, Asturias, Canarias, Cantabria,
    Castilla-La-Mancha, Castilla y León, Ceuta, Comunidad Valenciana, Extremadura,
    Galicia, Melilla and Murcia (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/624/CE: Décision de la Commission, du 29 juin 1994, concernant l''établissement
    du cadre communautaire d''appui pour les interventions structurelles communautaires
    dans les régions de l''Espagne concernées par l''objectif n° 1, à savoir l''Andalousie,
    les Asturies, les îles Canaries, la communauté Cantabrique, la Castille-La Manche,
    la Castille-León, Ceuta, la communauté de Valence, l''Estrémadure, la Galice,
    Melilla et Murcie (Le texte en langue espagnole est le seul faisant foi)'
  type: main
