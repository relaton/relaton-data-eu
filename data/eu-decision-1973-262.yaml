    τών βοοειδών, τών προβλέψεων γιά τή διαθέσιμη
    ποσότητα σέ βοοειδή γιά σφαγή καί τών στατιστικών
    σφαγής βοοειδών πού πρέπει νά πραγματοποιηθούν
    από τά Κράτη μέλη'
  type: main
