  content: '73/262/EEC: Commission Decision of 24 July 1973 establishing provisions
    for statistical surveys to be carried out by the Member States on bovine livestock,
    forecasts on the availability of bovine animals for slaughter and statistics on
    slaughtered bovine animals'
  type: main
- language: fr
  script: Latn
  content: '73/262/CEE: Décision de la Commission, du 24 juillet 1973, fixant les
    dispositions d'' application des enquêtes statistiques sur le cheptel bovin,
    des prévisions sur la disponibilité en bovins de boucherie et des statistiques
    d'' abattage de bovins, à effectuer par les États membres'
  type: main
- language: de
  script: Latn
  content: '73/262/EWG: Entscheidung der Kommission vom 24. Juli 1973 über Durchführungsbestimmungen
