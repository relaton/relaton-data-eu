    den Rinderbestand, Vorausschätzungen über den Schlachtrinderanfall und Statistiken
    über die Schlachtung von Rindern'
  type: main
- language: da
  script: Latn
  content: '73/262/EØF: Kommissionens Beslutning af 24. juli 1973 vedrørende de
