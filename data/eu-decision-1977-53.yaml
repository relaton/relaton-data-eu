title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 1976 on the granting by the Guidance
    Section of the EAGGF to the Kingdom of the Netherlands of a payment on account
    in respect of expenditure incurred during 1975 on aids and premiums relating to
    the modernization of farms
  type: main
- language: fr
  script: Latn
  content: '77/53/CEE: Décision de la Commission, du 22 décembre 1976, relative
    au versement par le FEOGA, section orientation, au Royaume des Pays-Bas d''un
    acompte sur les dépenses effectuées pendant l''année 1975 pour les aides et
    primes relatives à la modernisation des exploitations agricoles'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Dezember 1976 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1975 zur Modernisierung
    landwirtschaftlicher Betriebe an Beihilfen und Prämien getätigten Ausgaben an
    das Königreich der Niederlande
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. december 1976 om udbetaling gennem EUGFL,
    udviklingssektionen, til kongeriget Nederlandene af et acontobeløb for de udgifter,
    som er afholdt i løbet af året 1975 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 1976, relativa al versamento
    da parte del FEAOG, sezione orientamento, al Regno dei Paesi Bassi di un anticipo
    sulle spese effettuate durante il 1975 per gli aiuti ed i premi relativi all'ammodernamento
    delle aziende agricole
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 december 1976 inzake de betaling door
    het EOGFL, afdeling Oriëntatie, aan het Koninkrijk der Nederlanden van een voorschot
    voor de gedurende het jaar 1975 gedane uitgaven voor de steun en premies met betrekking
    tot de modernisering van landbouwbedrijven
