title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2507 of 26 September 2024
    amending and correcting Implementing Regulation (EU) 2020/1201 as regards measures
    to prevent the introduction into and spread within the Union of Xylella fastidiosa
    (Wells et al.) and amending Implementing Regulation (EU) 2020/1770 as regards
    the list of plant species not exempted from the traceability code requirement
    for plant passports
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2507 de la Commission du 26 septembre
    2024 modifiant et rectifiant le règlement d’exécution (UE) 2020/1201 relatif
    à des mesures visant à prévenir l’introduction et la dissémination dans
    l’Union de Xylella fastidiosa (Wells et al.) et modifiant le règlement d’exécution
    (UE) 2020/1770 en ce qui concerne la liste des espèces végétales auxquelles
    les exemptions à l’indication du code de traçabilité sur le passeport phytosanitaire
    ne s’appliquent pas
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2507 der Kommission vom 26. September
    2024 zur Änderung und Berichtigung der Durchführungsverordnung (EU) 2020/1201
    über Maßnahmen zum Schutz der Union gegen die Einschleppung und Ausbreitung
    von Xylella fastidiosa (Wells et al.) und zur Änderung der Durchführungsverordnung
    (EU) 2020/1770 hinsichtlich der Liste der Pflanzenarten, die nicht von der Anforderung
    der Angabe des Rückverfolgbarkeitscodes in Pflanzenpässen ausgenommen sind
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/2507 на Комисията
    от 26 септември 2024 година за изменение и поправка
