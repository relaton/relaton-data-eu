  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/2507 ze dne 26. září 2024,
    kterým se mění a opravuje prováděcí nařízení (EU) 2020/1201 o opatřeních
    proti zavlékání organismu Xylella fastidiosa (Wells et al.) do Unie a proti
    jeho rozšiřování v rámci Unie a kterým se mění prováděcí nařízení
    (EU) 2020/1770, pokud jde o seznam druhů rostlin, které nejsou osvobozeny od
    požadavku na kód vysledovatelnosti u rostlinolékařských pasů
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/2507 af 26. september
