    van een traceerbaarheidscode voor plantenpaspoorten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/2507 z dnia 26 września 2024
    r. w sprawie zmiany i sprostowania rozporządzenia wykonawczego (UE) 2020/1201
    w sprawie środków zapobiegających wprowadzaniu do Unii i rozprzestrzenianiu
    się w niej organizmu Xylella fastidiosa (Wells et al.) oraz zmiany rozporządzenia
    wykonawczego (UE) 2020/1770 w sprawie wykazu gatunków roślin, które nie są
    zwolnione z wymogu dotyczącego kodu identyfikacyjnego w paszportach roślin
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/2507 da Comissão, de 26 de setembro
    de 2024, que altera e retifica o Regulamento de Execução (UE) 2020/1201 relativo
    às medidas para impedir a introdução e a propagação na União de Xylella
    fastidiosa (Wells et al.) e que altera o Regulamento de Execução (UE) 2020/1770
    no que se refere à lista de espécies vegetais não isentas do requisito de um
    código de rastreabilidade nos passaportes fitossanitários
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/2507 al Comisiei din 26 septembrie
    2024 de modificare și rectificare a Regulamentului de punere în aplicare (UE)
    2020/1201 în ceea ce privește măsurile de prevenire a introducerii și răspândirii
    în Uniune a Xylella fastidiosa (Wells et al.) și de modificare a Regulamentului
    de punere în aplicare (UE) 2020/1770 în ceea ce privește lista speciilor de
    plante care nu sunt exceptate de la cerința privind codul de trasabilitate pentru
    pașapoartele fitosanitare
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/2507 z 26. septembra 2024, ktorým
    sa mení a opravuje vykonávacie nariadenie (EÚ) 2020/1201, pokiaľ ide o opatrenia
    proti zavlečeniu škodcu Xylella fastidiosa (Wells et al.) do Únie a jeho rozšíreniu
    na jej území, a ktorým sa mení vykonávacie nariadenie (EÚ) 2020/1770, pokiaľ
    ide o zoznam druhov rastlín, ktoré nie sú oslobodené od požiadavky na kód
    vysledovateľnosti v rastlinných pasoch
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/2507 z dne 26. septembra 2024 o spremembi
    in popravku Izvedbene uredbe (EU) 2020/1201 glede ukrepov za preprečevanje vnosa
    bakterije Xylella fastidiosa (Wells et al.) v Unijo in njenega širjenja znotraj
    Unije ter o spremembi Izvedbene uredbe (EU) 2020/1770 glede seznama rastlinskih
    vrst, za katere se ne uporablja izjema glede zahteve o oznaki za sledljivost v
    rastlinskih potnih listih
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/2507 de la Comisión, de 26 de septiembre
    de 2024, por el que se modifica y corrige el Reglamento de Ejecución (UE) 2020/1201
    en lo que respecta a las medidas para evitar la introducción y propagación en
    la Unión de Xylella fastidiosa (Wells et al.) y se modifica el Reglamento de
    Ejecución (UE) 2020/1770 en lo que respecta a la lista de especies vegetales
    no exentas del requisito del código de trazabilidad para los pasaportes fitosanitarios
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/2507 av den 26 september
    2024 om ändring och rättelse av genomförandeförordning (EU) 2020/1201 vad
    gäller åtgärder för att förhindra introduktion i och spridning inom unionen
    av Xylella fastidiosa (Wells et al.) och om ändring av genomförandeförordning
    (EU) 2020/1770 vad gäller förteckningen över växtarter som inte är undantagna
    från kravet på spårbarhetskod för växtpass
