    syyskuuta 2024, toimenpiteistä Xylella fastidiosa (Wells et al.) -organismin
    unioniin kulkeutumisen ja siellä leviämisen estämiseksi annetun täytäntöönpanoasetuksen
    (EU) 2020/1201 muuttamisesta ja oikaisemisesta ja täytäntöönpanoasetuksen
    (EU) 2020/1770 muuttamisesta niiden kasvilajien luettelon osalta, joita ei ole
    vapautettu kasvipassien jäljitettävyyskoodia koskevasta vaatimuksesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/2507 ón gCoimisiún an 26 Meán
    Fómhair 2024 lena leasaítear agus lena gceartaítear Rialachán Cur Chun Feidhme
    (AE) 2020/1201 a mhéid a bhaineann le bearta chun cosc a chur ar thabhairt isteach
    Xylella fastidiosa (Wells et al.) san Aontas agus ar a leathadh laistigh den Aontas
    agus lena leasaítear Rialachán Cur Chun Feidhme (AE) 2020/1770 a mhéid a bhaineann
    le liosta na speiceas plandaí nach bhfuil díolmhaithe ón gceanglas maidir le
    cód inrianaitheachta le haghaidh pasanna plandaí
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/2507 оd 26. rujna 2024. o izmjeni
    i ispravku Provedbene uredbe (EU) 2020/1201 o mjerama za sprečavanje unošenja
    u Uniju organizma Xylella fastidiosa (Wells et al.) i njegova širenja unutar
    Unije te o izmjeni Provedbene uredbe (EU) 2020/1770 u pogledu popisa biljnih vrsta
    koje nisu izuzete od zahtjeva u pogledu kôda sljedivosti za biljne putovnice
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/2507 végrehajtási rendelete (2024. szeptember
    26.) az (EU) 2020/1201 végrehajtási rendeletnek a Xylella fastidiosa (Wells
    et al.) Unióba történő behurcolása és Unión belüli elterjedése megelőzését
    célzó intézkedések tekintetében történő módosításáról és helyesbítéséről,
    valamint az (EU) 2020/1770 végrehajtási rendeletnek a növényútlevelek nyomonkövetési
    kódjára vonatkozó követelmény alól nem mentesülő növényfajok jegyzéke
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/2507 della Commissione, del 26 settembre
    2024, che modifica e rettifica il regolamento di esecuzione (UE) 2020/1201 relativo
    alle misure per prevenire l’introduzione e la diffusione nell’Unione della
    Xylella fastidiosa (Wells et al.) e che modifica il regolamento di esecuzione
    (UE) 2020/1770 per quanto riguarda l’elenco delle specie di piante non esentate
    dall’obbligo di inserire il codice di tracciabilità nei passaporti delle piante
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/2507 (2024. gada 26. septembris),
    ar ko attiecībā uz pasākumiem, kuri jāveic, lai novērstu Xylella fastidiosa
    (Wells et al.) ievešanu un izplatīšanos Savienībā, groza un labo Īstenošanas
    regulu (ES) 2020/1201 un attiecībā uz to augu sugu sarakstu, uz ko neattiecas
    atbrīvojums no prasības par augu pasu izsekojamības kodu, groza Īstenošanas
    regulu (ES) 2020/1770
  type: main
- language: lt
  script: Latn
  content: 2024 m. rugsėjo 26 d. Komisijos įgyvendinimo reglamentas (ES) 2024/2507,
    kuriuo dėl Xylella fastidiosa (Wells et al.) patekimo į Sąjungą ir išplitimo
    joje prevencijos priemonių iš dalies keičiamas ir ištaisomas Įgyvendinimo
    reglamentas (ES) 2020/1201 ir dėl augalų rūšių, kurioms netaikoma išimtis
    dėl reikalavimo augalų pasuose nurodyti atsekamumo kodą, sąrašo iš dalies
    keičiamas Įgyvendinimo reglamentas (ES) 2020/1770
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/2507 tas-26
    ta’ Settembru 2024 li jemenda u jikkoreġi r-Regolament ta’ Implimentazzjoni
    (UE) 2020/1201 rigward miżuri li jipprevjenu l-introduzzjoni u t-tixrid fl-Unjoni
    tal-Xylella fastidiosa (Wells et al.) u li jemenda r-Regolament ta’ Implimentazzjoni
    (UE) 2020/1770 rigward il-lista ta’ speċijiet ta’ pjanti li mhumiex eżentati
    mir-rekwiżit tal-kodiċi tat-traċċabbiltà għall-passaporti tal-pjanti
  type: main
- language: nl
  script: Latn
