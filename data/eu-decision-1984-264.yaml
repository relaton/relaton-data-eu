title:
- language: en
  script: Latn
  content: '84/264/EEC: Commission Decision of 7 May 1984 establishing that the apparatus
    described as ''Ortec - Planar totally depleted Silicon Surface Barrier Detectors,
    model: D 035-050-15, D 030-150-50, D 015-050- 100, D 030-300-100 - Totally depleted
    Silicon Surface Barrier Detectors, model: B 027-450-200, B 027-450-400, B 018-050-300,
    B 027-450-300'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/264/CEE: Décision de la Commission du 7 mai 1984 constatant que l''importation
    des appareils dénommés "Ortec - Planar totally depleted Silicon Surface Barrier
    Detectors, model: D 035-050-15, D 030-150-50, D 015-050- 100, D 030-300-100 -
    Totally depleted Silicon Surface Barrier Detectors, model: B 027-450-200, B 027-450-400,
    B 018-050-300, B 027-450-300" peut être faite en franchise des droits du tarif
    dounier commun'
  type: main
- language: de
  script: Latn
  content: '84/264/EWG: Entscheidung der Kommission vom 7. Mai 1984, mit der festgestellt
    wird, daß das Gerät ,,Ortec - Planar totally depleted Silicon Surface Barrier
    Detectors, model: D 035-050-15, D 030-150-50, D 015-050- 100, D 030-300-100 -
    Totally depleted Silicon Surface Barrier Detectors, model: B 027-450-200, B 027-450-400,
    B 018-050-300, B 027-450-300" unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden können'
  type: main
- language: da
  script: Latn
  content: '84/264/EØF: Kommissionens beslutning af 7. maj 1984 om fastslåelse af,
    at indførsel af apparaterne "Ortec - Planar totally depleted Silicon Surface
    Barrier Detectors, model: D 035-050-15, D 030-150-50, D 015-050- 100, D 030-300-100
    - Totally depleted Silicon Surface Barrier Detectors, model: B 027-450-200, B
    027-450-400, B 018-050-300, B 027-450-300" kan ske med fritagelse for told efter
    den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '84/264/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Μαΐου
    1984 περί διαπιστώσεως ότι η εισαγωγή των συσκευών
    με την ονομασία «Ortec — Planar totally depleted Silicon Surface
    Barrier Detectors, model: D 035—050—15, D 030—150—50, D 015—050—100,
    D 030—300—100 — Totally Depleted Silicon Surface Barrier Detectors, model:
    B 027—450—200, Β 027—450—400, Β 018—050—300, Β 027—450—300»
    δύναται να πραγματοποιηθεί ατελώς ως προς
    τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '84/264/CEE: Decisione della Commissione del 7 maggio 1984 che stabilisce
    che l''importazione degli apparecchi denominati "Ortec - Planar totally depleted
    Silicon Surface Barrier Detectors, model: D 035-050-15, D 030- 150-50, D 015-050-100,
    D 030-300-100 - Totally depleted Silicon Surface Barrier Detectors, model: B 027-450-200,
    B 027-450-400, B 018-050-300, B 027-450-300" può avvenire in franchigia dai dazi
    della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '84/264/EEG: Beschikking van de Commissie van 7 mei 1984 waarbij wordt
    vastgesteld dat de apparaten genaamd ,,Ortec - Planar totally depleted Silicon
    Surface Barrier Detectors, model: D 035-050-15, D 030-150-50, D 015-050-100, D
    030-300-100 - Totally depleted Silicon Surface Barrier Detectors, model: B 027-450-200,
    B 027- 450-400, B 018-050-300, B 027-450-300" met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief mogen worden ingevoerd'
