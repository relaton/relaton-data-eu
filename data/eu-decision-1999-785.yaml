title:
- language: en
  script: Latn
  content: '1999/785/EC: Council Decision of 25 November 1999 authorising the Republic
    of Finland to apply or to continue to apply reductions in, or exemptions from,
    excise duties on certain mineral oils used for specific purposes, in accordance
    with the procedure provided for in Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '1999/785/CE: Décision du Conseil, du 25 novembre 1999, autorisant la
    République de Finlande à introduire ou à maintenir des réductions ou des exonérations
    des droits d''accises sur certaines huiles minérales utilisées à des fins spécifiques,
    selon la procédure prévue à l''article 8, paragraphe 4, de la directive 92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '1999/785/EG: Entscheidung des Rates vom 25. November 1999 zur Ermächtigung
    der Republik Finnland, für bestimmte Mineralöle mit besonderen Verwendungszwecken
    Verbrauchsteuerbefreiungen oder -ermäßigungen einzuführen oder beizubehalten
    (Verfahren gemäß Artikel 8 Absatz 4 der Richtlinie 92/81/EWG)'
  type: main
- language: da
  script: Latn
  content: '1999/785/EF: Rådets beslutning af 25. november 1999 om tilladelse til
    Republikken Finland til at indføre eller fortsat anvende punktafgiftslempelser
    eller -fritagelser for visse typer mineralolier, der anvendes til særlige formål,
    jf. proceduren i artikel 8, stk. 4, i direktiv 92/81/EØF'
  type: main
- language: el
  script: Grek
  content: '1999/785/ΕΚ: Απόφαση του Συμβουλίου, της 25ης
    Νοεμβρίου 1999, που εξουσιοδοτεί τη Δημοκρατία
    της Φινλανδίας να εισάγει ή να διατηρήσει τις
    μειώσεις ή τις απαλλαγές από τους ειδικούς
    φόρους κατανάλωσης που επιβάλλονται σε ορισμένα
    πετρελαιοειδή για ειδικούς σκοπούς, σύμφωνα
    με τη διαδικασία που προβλέπεται στο άρθρο
    8 παράγραφος 4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '1999/785/EY: Neuvoston päätös, tehty 25 päivänä marraskuuta 1999,
    luvan antamisesta Suomen tasavallalle soveltaa tai edelleen soveltaa tiettyihin
    erityistarkoituksiin käytettyihin kivennäisöljyihin valmisteveron alennuksia
    tai vapautuksia valmisteverosta direktiivin 92/81/ETY 8 artiklan 4 kohdassa säädettyä
    menettelyä noudattaen'
  type: main
- language: it
  script: Latn
  content: '1999/785/CE: Decisione del Consiglio, del 25 novembre 1999, che autorizza
    la Repubblica di Finlandia ad introdurre o a mantenere riduzioni o esenzioni di
    accise su taluni oli minerali usati per scopi specifici secondo la procedura di
    cui all''articolo 8, paragrafo 4, della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '1999/785/EG: Beschikking van de Raad van 25 november 1999 waarbij de Republiek
    Finland wordt gemachtigd om, overeenkomstig de procedure van artikel 8, lid 4,
    van Richtlijn 92/81/EEG, verlaagde accijnstarieven of vrijstelling van accijnzen
    toe te passen of te blijven toepassen op bepaalde minerale oliën die voor bijzondere
    doeleinden worden gebruikt'
  type: main
- language: pt
  script: Latn
  content: '1999/785/CE: Decisão do Conselho, de 25 de Novembro de 1999, que autoriza
    a República da Finlândia a aplicar ou a continuar a aplicar reduções ou isenções
    de impostos especiais sobre o consumo de determinados óleos minerais utilizados
    para fins específicos, nos termos do n° 4 do artigo 8° da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '1999/785/CE: Decisión del Consejo, de 25 de noviembre de 1999, por la
    que se autoriza a la República de Finlandia a aplicar o continuar aplicando reducciones
    o exenciones de los impuestos especiales sobre determinados hidrocarburos utilizados
    para usos específicos, de conformidad con el procedimiento previsto en el apartado
    4 del artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '1999/785/EG: Rådets beslut av den 25 november 1999 om tillåtelse i enlighet
    med förfarandet i artikel 8.4 i direktiv 92/81/EEG för Republiken Finland att
    tillämpa eller fortsätta att tillämpa regler om nedsättning av eller befrielse
    från punktskatter på vissa mineraloljor som används för särskilda ändamål'
  type: main
