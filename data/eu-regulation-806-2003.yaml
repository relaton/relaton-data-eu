---
id: EURegulation8062003
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 806/2003 of 14 April 2003 adapting to Decision
    1999/468/EC the provisions relating to committees which assist the Commission
    in the exercise of its implementing powers laid down in Council instruments adopted
    in accordance with the consultation procedure (qualified majority)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 806/2003 du Conseil, du 14 avril 2003, portant adaptation
    à la décision 1999/468/CE des dispositions relatives aux comités assistant
    la Commission dans l'exercice de ses compétences d'exécution prévues dans des
    actes du Conseil adoptés selon la procédure de consultation (majorité qualifiée)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 806/2003 des Rates vom 14. April 2003 zur Anpassung
    der Bestimmungen über die Ausschüsse zur Unterstützung der Kommission bei der
    Ausübung von deren Durchführungsbefugnissen, die in nach dem Konsultationsverfahren
    (qualifizierte Mehrheit) erlassenen Rechtsakten des Rates vorgesehen sind, an
    den Beschluss 1999/468/EG
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 806/2003 на Съвета от 14 април
    2003 година за привеждане в съответствие с Решение
    1999/468/ЕО на разпоредбите относно комитетите,
    които подпомагат Комисията при упражняването
    на нейните изпълнителни правомощия, установени
    в документите на Съвета, приети в съответствие
    с консултативната процедура (квалифицирано
    мнозинство)
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 806/2003 ze dne 14. dubna 2003, o přizpůsobení
    ustanovení týkajících se výborů, které jsou nápomocny Komisi při výkonu
    jejích prováděcích pravomocí, stanovených v právních aktech Rady přijatých
    konzultačním postupem (kvalifikovaná většina), ustanovením rozhodnutí 1999/468/ES
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 806/2003 af 14. april 2003 om tilpasning til
    i afgørelse 1999/468/EF af bestemmelserne vedrørende de udvalg, der bistår
    Kommissionen i forbindelse med udøvelsen af de gennemførelsesbeføjelser, der
    er fastsat i retsakter vedtaget af Rådet efter høringsproceduren (kvalificeret
    flertal)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 806/2003 του Συμβουλίου,
    της 14ης Απριλίου 2003, για την προσαρμογή στην
    απόφαση 1999/468/ΕΚ των διατάξεων των σχετικών
    με τις επιτροπές που επικουρούν την Επιτροπή
    στην άσκηση των εκτελεστικών αρμοδιοτήτων
    της, οι οποίες προβλέπονται από πράξεις του
    Συμβουλίου που εκδόθηκαν σύμφωνα με τη διαδικασία
    συμβουλευτικής επιτροπής (ειδική πλειοψηφία)
  type: main
- language: et
  script: Latn
  content: Nõukogu Määrus (EÜ) nr 806/2003, 14. aprill 2003, konsulteerimiskorra
    kohaselt (kvalifitseeritud häälteenamusega) vastuvõetud nõukogu õigusaktides
    sätestatud rakendusvolituste kasutamisel komisjoni abistavaid komiteesid käsitlevate
    sätete kohandamise kohta otsusega 1999/468/EÜ
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 806/2003, annettu 14 päivänä huhtikuuta 2003,
    kuulemismenettelyä (määräenemmistö) noudattaen annetuissa neuvoston säädöksissä
    säädetyn täytäntöönpanovallan käytössä komissiota avustavia komiteoita
    koskevien säännösten mukauttamisesta päätökseen 1999/468/EY
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 806/2003 od 14. travnja 2003. o usklađivanju s
    Odlukom 1999/468/EZ odredaba u vezi s odborima koji pomažu Komisiji u ispunjavanju
    njezinih provedbenih ovlasti predviđenih u instrumentima Vijeća koji se usvajaju
    u postupku savjetovanja (kvalificirana većina)
  type: main
- language: hu
  script: Latn
  content: A Tanács 806/2003/EK rendelete (2003. április 14.) a Bizottságot a konzultációs
    eljárással összhangban (minősített többség) elfogadott tanácsi jogi aktusokban
    megállapított végrehajtási hatásköreinek gyakorlása során segítő bizottságokkal
    kapcsolatos rendelkezéseknek az 1999/468/EK határozathoz történő hozzáigazításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 806/2003 del Consiglio, del 14 aprile 2003, recante
    adeguamento alla decisione 1999/468/CE delle disposizioni relative ai comitati
    che assistono la Commissione nell'esercizio delle sue competenze di esecuzione
    previste negli atti del Consiglio adottati secondo la procedura di consultazione
    (maggioranza qualificata)
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 806/2003 (2003. gada 14. aprīlis), ar ko Lēmumam
    1999/468/EK pielāgo noteikumus par komitejām, kuras palīdz Komisijai īstenot
    tai piešķirtās ieviešanas pilnvaras, kas noteiktas Padomes dokumentos, kuri
    pieņemti atbilstīgi konsultēšanās procedūrai (kvalificēts balsu vairākums)
  type: main
- language: lt
  script: Latn
  content: 2003 m. balandžio 14 d. Tarybos reglamentas (EB) Nr. 806/2003, suderinantis
    su Sprendimu 1999/468/EB nuostatas, susijusias su komitetais, padedančiais Komisijai
    naudotis savo įgyvendinimo įgaliojimais, nustatytais Tarybos dokumentuose, priimtuose
    vadovaujantis konsultavimosi procedūra (kvalifikuota balsų dauguma)
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 806/2003 ta' l-14 ta' April 2003 li
    jaddatta għad-Deċiżjoni 1999/468/KE id-disposizzjonijiet rigward il-kumitati
    li jassistu l-Kummissjoni fl-eżerċizzju tas-setgħat ta' implimentazzjoni stabbiliti
    fi strumenti tal-Kunsill adottati skond il-proċedura ta' konsultazzjoni (maġġoranza
    kwalifikata)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 806/2003 van de Raad van 14 april 2003 tot aanpassing
    aan Besluit 1999/468/EG van de bepalingen betreffende de comités die de Commissie
    bĳstaan in de uitoefening van haar uitvoeringsbevoegdheden die zĳn vastgelegd
    in volgens de raadplegingsprocedure (gekwalificeerde meerderheid) goedgekeurde
    besluiten van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) NR 806/2003 z dnia 14 kwietnia 2003 r. dostosowujące
    do decyzji 1999/468/WE przepisy odnoszące się do komitetów wspomagających
    Komisję w wykonywaniu jej uprawnień wykonawczych ustanowionych w instrumentach
    Rady przyjętych zgodnie z procedurą konsultacji (większość kwalifikowana)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 806/2003 do Conselho, de 14 de Abril de 2003, que
    adapta à Decisão 1999/468/CE as disposições relativas aos comités que assistem
    a Comissão no exercício das suas competências de execução previstas em actos
    do Conselho adoptados pelo procedimento consultivo (maioria qualificada)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 806/2003 al Consiliului din 14 aprilie 2003 de adaptare
    la Decizia 1999/468/CE a dispozițiilor privind comitetele care asistă Comisia
    în exercitarea competențelor de executare prevăzute de actele Consiliului adoptate
    în conformitate cu procedura de consultare (majoritate calificată)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 806/2003 zo 14. apríla 2003, ktorým sa k rozhodnutiu
    1999/468/ES prispôsobujú ustanovenia týkajúce sa výborov, ktoré pomáhajú
    Komisii pri uplatňovaní jej vykonávacích právomocí stanovených v predpisoch
    Rady prijatých v súlade s konzultačným postupom (kvalifikovaná väčšina)
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 806/2003 z dne 14. aprila 2003 o prilagoditvi določb
    gleode odborov, ki pomagajo Komisiji pri uresničevanju njenih izvedbenih pooblastil,
    predvidenih v aktih Sveta, ki se sprejemajo v postopku posvetovanja (kvalificirana
    večina), Sklepu 1999/468/ES
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 806/2003 del Consejo, de 14 de abril de 2003, por el
    que se adaptan a la Decisión 1999/468/CE disposiciones relativas a los comités
    que colaboran con la Comisión en el ejercicio de sus competencias de ejecución
    previstas en los actos del Consejo adoptados con arreglo al procedimiento consultivo
    (mayoría cualificada)
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 806/2003 av den 14 april 2003 om anpassning
    till beslut 1999/468/EG av de bestämmelser i rättsakter som rådet antagit enligt
    samrådsförfarandet (kvalificerad majoritet) och som avser de kommittéer som
    biträder kommissionen när den utövar sina genomförandebefogenheter
  type: main
