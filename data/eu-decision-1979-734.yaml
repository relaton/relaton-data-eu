title:
- language: en
  script: Latn
  content: '79/734/EEC: Commission Decision of 2 August 1979 authorizing the French
    Republic not to apply Community treatment to natural honey, falling within heading
    No 04.06 of the Common Customs Tariff, originating in the USSR and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/734/CEE: Décision de la Commission, du 2 août 1979, autorisant la
    République française à exclure du traitement communautaire le miel naturel,
    de la position 04.06 du tarif douanier commun, originaire d''URSS et mis en libre
    pratique dans les autres Etats membres (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/734/EWG: Entscheidung der Kommission vom 2. August 1979, mit der die
    Französische Republik ermächtigt wird, aus der UdSSR stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen natürlichen Honig der Tarifnummer
    04.06 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/734/EØF: Kommissionens beslutning af 2. august 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage naturlig honning,
    som henhører under pos. 04.06 i den fælles toldtarif, har oprindelse i USSR
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/734/CEE: Decisione della Commissione, del 2 agosto 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario il miele naturale,
    della voce 04.06 della tariffa doganale comune, originario dell''URSS e messo
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/734/EEG: Beschikking van de Commissie van 2 augustus 1979 waarbij de
    Franse Republiek wordt gemachtigd natuurhonig, van post 04.06 van het gemeenschappelijk
    douanetarief, van oorsprong uit de USSR en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Franse taal is authentiek)'
  type: main
