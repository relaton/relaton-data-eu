id: EUDecision1980512
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/512/EEC: Commission Decision of 2 May 1980 authorizing the Kingdom
    of Denmark, the Federal Republic of Germany, the Grand Duchy of Luxembourg, the
    Kingdom of the Netherlands and the United Kingdom not to apply the conditions
    laid down in Council Directive 66/401/EEC on the marketing of fodder plant seed,
    as regards the weight of the sample for determination of seed of Cuscuta (Only
    the French, German, Dutch, English and Danish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/512/CEE: Décision de la Commission, du 2 mai 1980, autorisant le Royaume
    de Danemark, la République fédérale d''Allemagne, le Grand-Duché de Luxembourg,
    le Royaume des Pays-Bas et le Royaume-Uni à ne pas appliquer les conditions de
    la directive 66/401/CEE du Conseil concernant la commercialisation des semences
    de plantes fourragères, en ce qui concerne le poids de l''échantillon pour le
    dénombrement de semences de cuscuta (Les textes en langues française, allemande,
    néerlandaise, anglaise et danoise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/512/EWG: Entscheidung der Kommission vom 2. Mai 1980 zur Ermächtigung
    des Königreichs Dänemark, der Bundesrepublik Deutschland, des Großherzogtums
    Luxemburg, des Königreichs der Niederlande und des Vereinigten Königreichs,
    die Bestimmungen der Richtlinie 66/401/EWG des Rates über den Verkehr mit Futterpflanzensaatgut
    hinsichtlich des Probegewichts für die Bestimmung von Körnern von Cuscuta nicht
    anzuwenden (Nur der französische, deutsche, niederländische, englische und dänische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/512/EØF: Kommissionens beslutning af 2. maj 1980 om bemyndigelse af
    kongeriget Danmark, Forbundsrepublikken Tyskland, storhertugdømmet Luxembourg,
    kongeriget Nederlandene og Det Forenede Kongerige til at se bort fra betingelserne
    i Rådets direktiv 66/401/EØF om handel med frø af foderplanter vedrørende
    vægten af den prøve, der udtages til bestemmelse af antallet af frø af Cuscuta
    (Kun de franske, tyske, nederlandske, engelske og danske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '80/512/ΕΟΚ: Απόφαση της Επιτροπής, της 2ας
    Μαΐου 1980, με την οποία επιτρέπεται στο Βασίλειο
    της Δανίας, στην Ομοσπονδιακή Δημοκρατία της
    Γερμανίας, στο Μεγάλο Δουκάτο του Λουξεμβούργου,
    στο Βασίλειο των Κάτω Χωρών και στο Ηνωμένο
    Βασίλειο να μην εφαρμόσουν τους όρους της Οδηγίας
    66/401/ΕΟΚ του Συμβουλίου περί εμπορίας των σπόρων
    φυτών που προορίζονται για ζωοτροφές, όσον
    αφορά το βάρος του δείγματος για την απαρίθμηση
    των σπόρων επίθυμου (CUSCUTA) (Τα κείμενα στην γαλλική,
    γερμανική, ιταλική, αγγλική και δανική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '80/512/CEE: Decisione della Commissione, del 2 maggio 1980, che autorizza
    il Regno di Danimarca, la Repubblica federale di Germania, il Granducato del Lussemburgo,
    il Regno dei Paesi Bassi ed il Regno Unito a non applicare le condizioni di cui
    alla direttiva 66/401/CEE del Consiglio, relativa alla commercializzazione delle
    sementi foraggere, per quanto concerne il peso del campione per la determinazione
    dei semi di Cuscuta (Il testi in lingua francese, tedesca, olandese, inglese e
    danese sono il soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/512/EEG: Beschikking van de Commissie van 2 mei 1980 tot machtiging
    van het Koninkrijk Denemarken, de Bondsrepubliek Duitsland, het Groothertogdom
    Luxemburg, het Koninkrijk der Nederlanden en het Verenigd Koninkrijk om de in
    Richtlijn 66/401/EEG van de Raad betreffende het in de handel brengen van zaaizaad
    van groenvoedergewassen vervatte voorwaarden, ten aanzien van het gewicht van
    het monster voor het bepalen van de aanwezigheid van zaad van Cuscuta-soorten,
    niet toe te passen (Slechts de teksten in de Franse, Duitse, Nederlandse, Engelse
    en de Deense taal zijn authentiek)'
  type: main
- language: es
  script: Latn
  content: '80/512/CEE: Decisión de la Comisión, de 2 de mayo de 1980, por la que
    se autoriza al Reino de Dinamarca, a la República Federal de Alemania, al Gran
    Ducado de Luxemburgo, al Reino de los Países Bajos y al Reino Unido a no aplicar
    las condiciones de la Directiva 66/401/CEE del Consejo relativa a la comercialización
    de las semillas de plantas forrajeras, en lo que se refiere al peso de la muestra
    para el recuento de semillas de cuscuta (Los textos en lenguas francesa, alemana,
    neerlandesa, inglesa y danesa son los únicos auténticos)'
