title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2388/96 of 16 December 1996 amending Regulation
    (EC) No 2146/95 on the transitional adjustment of the special arrangements for
    imports of olive oil originating in Algeria, Lebanon, Morocco, Tunisia and Turkey
    with a view to implementing the Agreement on agriculture concluded during the
    Uruguay Round of multilateral trade negotiations and derogating from Council Regulations
    (EEC) No 1514/76, (EEC) No 1620/77, (EEC) No 1521/76, (EEC) No 1508/76 and (EEC)
    No 1180/77 and providing for the reimbursement of import duties collected on certain
    imports from Morocco and Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2388/96 de la Commission du 16 décembre 1996 modifiant
    le règlement (CE) nº 2146/95 relatif à l'adaptation transitoire des régimes
    spéciaux aux importations d'huile d'olive originaire d'Algérie, du Liban, du
    Maroc, de Tunisie et de Turquie en vue de la mise en oeuvre de l'accord sur l'agriculture
    conclu dans le cadre des négociations commerciales multilatérales du cycle d'Uruguay
    et dérogeant aux règlements (CEE) nº 1514/76, (CEE) nº 1620/77, (CEE) nº
    1521/76, (CEE) nº 1508/76 et (CEE) nº 1180/77 du Conseil, et prévoyant le remboursement
    des droits à l'importation perçus sur certaines importations en provenance du
    Maroc et de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2388/96 der Kommission vom 16. Dezember 1996 zur Änderung
    der Verordnung (EG) Nr. 2146/95 über die vorübergehende Anpassung der Sonderregelungen
    für die Einfuhr von Olivenöl mit Ursprung in Algerien, Libanon, Marokko, Tunesien
    und der Türkei hinsichtlich der Anwendung des im Rahmen der multilateralen Handelsverhandlungen
    der Uruguay-Runde geschlossenen Übereinkommens über die Landwirtschaft in Abweichung
    von den Verordnungen (EWG) Nr. 1514/76, (EWG) Nr. 1620/77, (EWG) Nr. 1521/76,
    (EWG) Nr. 1508/76 und (EWG) Nr. 1180/77 des Rates sowie zur Erstattung von Zöllen,
    die auf bestimmte Einfuhren aus Marokko und der Türkei erhoben wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning(EF) nr. 2388/96 af 16. december 1996 om ændring
    af forordning (EF) nr. 2146/95 om midlertidig tilpasning af særordningerne for
    indførsel af olivenolie med oprindelse i Algeriet, Libanon, Marokko, Tunesien
    og Tyrkiet med henblik på gennemførelsen af den landbrugsaftale, som er indgået
    under de multilaterale handelsforhandlinger i Uruguay-rundens regi, og om fravigelse
    af Rådets forordning (EØF) nr. 1514/76, (EØF) nr. 1620/77, (EØF) nr. 1521/76,
    (EØF) nr. 1508/76 og (EØF) nr. 1180/77, og om tilbagebetaling af importtold,
    der blev opkrævet ved visse indførsler fra Marokko og Tyrkiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2388/96 της Επιτροπής
    της 16ης Δεκεμβρίου 1996 για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 2146/95 σχετικά με τη μεταβατική εφαρμογή
    των ειδικών καθεστώτων για εισαγωγές ελαιολάδου
    καταγωγής Αλγερίας, Λιβάνου, Μαρόκου, Τυνησίας
    και Τουρκίας, με σκοπό την εφαρμογή της γεωργικής
    συμφωνίας που συνάφθηκε στο πλαίσιο των πολυμερών
    εμπορικών διαπραγματεύσεων του Γύρου της Ουρουγουάης
    και κατά παρέκκλιση των κανονισμών (ΕΟΚ) αριθ.
    1514/76, (ΕΟΚ) αριθ. 1620/77, (ΕΟΚ) αριθ. 1521/76, (ΕΟΚ) αριθ.
    1508/76 και (ΕΟΚ) αριθ. 1180/77, του Συμβουλίου, καθώς
    και για την πρόβλεψη επιστροφής των εισαγωγικών
    δασμών που εισπράχθηκαν για ορισμένες εισαγωγές
    προέλευσης Μαρόκου και Τουρκίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2388/96, annettu 16 päivänä joulukuuta 1996,
    Algeriasta, Libanonista, Marokosta, Tunisiasta ja Turkista peräisin olevan oliiviöljyn
    tuontia koskevien erityisjärjestelyjen mukauttamisesta siirtymäkauden ajaksi
    Uruguayn kierroksen monenvälisissä kauppaneuvotteluissa tehdyn maataloussopimuksen
    täytäntöönpanoa varten ja neuvoston asetuksista (ETY) N:o 1514/76, (ETY) N:o
    1620/77, (ETY) N:o 1521/76, (ETY) N:o 1508/76 ja (ETY) N:o 1180/77 poikkeamisesta
    annetun asetuksen (EY) N:o 2146/95 muuttamisesta sekä tietyistä Marokosta ja
    Turkista peräisin olevasta tuonnista perittyjen tuontitullien korvaamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2388/96 della Commissione del 16 dicembre 1996 che
    modifica il regolamento (CE) n. 2146/95 relativo all'adattamento provvisorio dei
    regimi speciali d'importazione di olio d'oliva originario dell'Algeria, del Libano,
    del Marocco, della Tunisia e della Turchia per l'attuazione dell'accordo sull'agricoltura
    concluso nell'ambito dei negoziati commerciali multilaterali dell'Uruguay Round
    e recante deroga ai regolamenti (CEE) n. 1514/76, (CEE) n. 1620/77, (CEE) n. 1521/76,
    (CEE) n. 1508/76 e (CEE) n. 1180/77 del Consiglio, e che prevede il rimborso dei
    dazi all'importazione riscossi su taluni importazioni in provenienza dal Marocco
    e dalla Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2388/96 van de Commissie van 16 december 1996 tot
    wijziging van Verordening (EG) nr. 2146/95 betreffende de voorlopige aanpassing
    van de speciale regelingen voor invoer van olijfolie van oorsprong uit Algerije,
    Libanon, Marokko, Tunesië en Turkije met het oog op de uitvoering van de landbouwovereenkomst
    in het kader van de multilaterale handelsbesprekingen van de Uruguay- Ronde, en
    houdende afwijkingen van de Verordeningen (EEG) nr. 1514/76, (EEG) nr. 1620/77,
    (EEG) nr. 1521/76, (EEG) nr. 1508/76 en (EEG) nr. 1180/77 van de Raad, en tot
    vaststelling van een procedure voor de terugbetaling van rechten die zijn geïnd
    bij de invoer van bepaalde hoeveelheden olijfolie van oorsprong uit Marokko en
    Turkije
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2388/96 da Comissão de 16 de Dezembro de 1996 que
    altera o Regulamento (CE) nº 2146/95 que adapta transitoriamente os regimes especiais
    de importação de azeite originário da Argélia, do Líbano, de Marrocos, da
    Tunísia e da Turquia, com vista à execução do acordo sobre a agricultura concluído
    no âmbito das negociações comerciais multilaterais do «Uruguay Round», e
    derroga os Regulamentos (CEE) nº 1514/76, (CEE) nº 1620/77, (CEE) nº 1521/76,
    (CEE) nº 1508/76 e (CEE) nº 1180/77 do Conselho, e que prevê o reembolso dos
    direitos de importação cobrados em relação a determinadas importações provenientes
    de Marrocos e da Turquia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2388/96 de la Comisión de 16 de diciembre de 1996
    por el que se modifica el Reglamento (CE) nº 2146/95 por el que se establece
    la adaptación transitoria de los regímenes especiales para la importación de
    aceite de oliva originario de Argelia, Líbano, Marruecos, Túnez y Turquía,
    con vistas a la aplicación del acuerdo de agricultura celebrado en el marco de
    las negociaciones comerciales multilaterales de la Ronda Uruguay y por el que
    se establecen excepciones a lo dispuesto en los Reglamentos (CEE) nos 1514/76,
    1620/77, 1521/76, 1508/76 y 1180/77 del Consejo y que dispone el reembolso de
    los derechos de importación percibidos por ciertas importaciones procedentes
    de Marruecos y Turquía
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2388/96 av den 16 december 1996 om ändring
    av förordning (EG) nr 2146/95 om en övergångsvis anpassning av specialreglerna
    för import av olivolja med ursprung i Algeriet, Libanon, Marocko, Tunisien och
    Turkiet för att genomföra de avtal som slutits inom ramen för de multinationella
    handelsförhandlingarna i Uruguayrundan och om undantag från rådets förordningar
    (EEG) nr 1514/76, (EEG) nr 1620/77, (EEG) nr 1521/76, (EEG) nr 1508/76 och (EEG)
    nr 1180/77, samt om föreskrifter för återbetalning av importavgifter som tagits
    ut på viss import från Marocko och Turkiet
  type: main
