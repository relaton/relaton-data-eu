title:
- language: en
  script: Latn
  content: Commission Decision of 20 December 1974 fixing the rate of the countervailing
    charges which may be levied instead of minimum prices on imports of seed potatoes
    into the French Republic and on imports of certain vinegar into the Federal Republic
    of Germany
  type: main
- language: fr
  script: Latn
  content: '75/56/CEE: Décision de la Commission, du 20 décembre 1974, fixant le
    taux des taxes compensatoires pouvant être perçues, en remplacement des prix
    minimaux, sur les importations de plants de pommes de terre en République française
    et de certains vinaigres en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Dezember 1974 zur Festsetzung der Sätze
    der Ausgleichsabgaben, die an Stelle der Mindestpreise von der Französischen
    Republik bei der Einfuhr von Saatkartoffeln und von der Bundesrepublik Deutschland
    bei der Einfuhr bestimmter Arten von Essig erhoben werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. december 1974 om fastsættelse af de satser
    for udligningsafgifter, der som erstatning for minimumsprisordningen kan opkræves
    ved indførsel af læggekartofler til Den franske Republik og ved indførsel af
    visse former for eddike til forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 dicembre 1974, che fissa le aliquote
    delle tasse di compensazione che possono essere riscosse sulle importazioni di
    semi di patate dalla Repubblica francese e su alcuni aceti dalla Repubblica federale
    di Germania, in sostituzione dei prezzi minimi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 december 1974 tot vaststelling van
    de compenserende heffingen die ter vervanging van de minimumprijzen kunnen worden
    toegepast op de invoer in de Franse Republiek van pootaardappelen en in de Duitse
    Bondsrepubliek van bepaalde soorten azijn
  type: main
