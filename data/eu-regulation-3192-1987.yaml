title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3192/87 of 26 October 1987 re-establishing
    the levying of customs duties on articles of apparel and clothing accessories,
    falling within subheading 39.07 B V ex d), originating in Hong Kong, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3924/86
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3192/87 de la Commission du 26 octobre 1987 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    et accessoires du vêtement, de la sous-position 39.07 B V ex d) du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3192/87 der Kommission vom 26. Oktober 1987 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung und Bekleidungszubehör der Tarifstelle
    39.07 B V ex d) mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr.
    3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3192/87 af 26. oktober 1987 om genindførelse
    af opkrævning af told for beklædningsgenstande og tilbehør dertil, henhørende
    under pos. 39.07 B V ex d) i Den Fælles Toldtarif og med oprindelse i Hongkong,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3192/87 της Επιτροπής
    της 26ης Οκτωβρίου 1987 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ενδύματα και εξαρτήματα
    του ενδύματος της διακρίσεως 39.07 Β V ex δ) του
    κοινού δασμολογίου, καταγωγής Χονγκ Κονγκ,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3924/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3192/87 della Commissione del 26 ottobre 1987 che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti da vestiario
    ed accessori per oggetti da vestiario della sottovoce 39.07 B V ex d) della tariffa
    doganale comune originari di Hong Kong beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3192/87 van de Commissie van 26 oktober 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleding en
    kledingtoebehoren van postonderverdeling 39.07 B V ex d) van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr.
    3924/86 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3192/87 da Comissão de 26 de Outubro de 1987 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a vestuário e acessórios
    de vestuário, da subposição 39.07 B V ex d) da pauta aduaneira comum, originários
    de Hong Kong, beneficiário das preferências pautais previstas pelo Regulamento
    (CEE) n.° 3924/86 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3192/87 de la Comisión de 26 de octubre de 1987 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a las
    prendas y accesorios de vestir, de la subpartida 39.07 B V ex d) del arancel aduanero
    común, originarios de Hong-Kong, beneficiario de las preferencias arancelarias
    previstas por el Reglamento (CEE) n° 3924/86 del Consejo
  type: main
