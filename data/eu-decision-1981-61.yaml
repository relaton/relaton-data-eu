title:
- language: en
  script: Latn
  content: '81/61/EEC: Commission Decision of 22 January 1981 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, originating in the Philippines and Taiwan
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/61/CEE: Décision de la Commission, du 22 janvier 1981, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée originaire des Philippines et de T''ai-wan
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/61/EWG: Entscheidung der Kommission vom 22. Januar 1981 zur Ermächtigung
    der Französischen Republik, aus den Philippinen und Taiwan stammende Handschuhe
    aus Gewirken, weder gummielastisch noch kautschutiert, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/61/EØF: Kommissionens beslutning af 22. januar 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling af undtage handsker, vanter,
    og luffer, ikke elastisk eller gummeret, med oprindelse i Filippinerne og Taiwan
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/61/ΕΟΚ: Απόφαση τής Επιτροπής τής 22ας Ιανουαρίου
    1981 περί εξουσιοδοτήσεως τής Γαλλικής Δημοκρατίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    χειρόκτια πλεκτά μή ελαστικά ουδέ συνδεδυασμένα
    μετά καουτσούκ καταγόμενα από τίς Φιλιππίνες
    καί τήν Ταϊβάν (Το κείμενο στην γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/61/CEE: Decisione della Commissione, del 22 gennaio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, originari delle Filippine e di Taiwan (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/61/EEG: Beschikking van de Commissie van 22 januari 1981 houdende machtiging
    van de Franse Republiek om handschoenen, wanten en dergelijke van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk van oorsprong uit de Filippijnen en Taiwan
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
