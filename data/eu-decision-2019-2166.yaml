  content: Commission Implementing Decision (EU) 2019/2166 of 16 December 2019 amending
    Implementing Decision 2014/908/EU as regards the inclusion of Serbia and South
    Korea in the lists of third countries and territories whose supervisory and regulatory
    requirements are considered equivalent for the purposes of the treatment of exposures
    in accordance with Regulation (EU) No 575/2013 of the European Parliament and
    of the Council
  type: main
- language: fr
  script: Latn
