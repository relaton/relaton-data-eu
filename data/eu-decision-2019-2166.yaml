    2019 modifiant la décision d’exécution 2014/908/UE en ce qui concerne l’inclusion
    de la Serbie et de la Corée du Sud dans les listes de pays et territoires tiers
    dont les exigences réglementaires et de surveillance sont considérées comme
    équivalentes aux fins du traitement des expositions conformément au règlement
    (UE) no 575/2013 du Parlement européen et du Conseil
  type: main
