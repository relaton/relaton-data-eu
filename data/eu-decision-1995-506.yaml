title:
- language: en
  script: Latn
  content: '95/506/EC: Commission Decision of 24 November 1995 authorizing Member
    States temporarily to take additional measures against the dissemination of Pseudomonas
    solanacearum (Smith) Smith as regards the Kingdom of the Netherlands'
  type: main
- language: fr
  script: Latn
  content: '95/506/CE: Décision de la Commission, du 24 novembre 1995, autorisant
    les États membres à prendre provisoirement des mesures supplémentaires en vue
    de se protéger contre la propagation du Pseudomonas solanacearum (Smith) Smith
    en provenance du Royaume des Pays-Bas'
  type: main
- language: de
  script: Latn
  content: '95/506/EG: Entscheidung der Kommission vom 24. November 1995 zur Ermächtigung
    bestimmter Mitgliedstaaten, vorübergehend zusätzliche Maßnahmen gegen die Verbreitung
    von Pseudomonas solanacearum (Smith) Smith gegenüber dem Königreich der Niederlande
    zu treffen'
  type: main
- language: da
  script: Latn
  content: '95/506/EF: Kommissionens beslutning af 24. november 1995 om bemyndigelse
    af medlemsstaterne til midlertidigt at træffe supplerende foranstaltninger mod
    spredning af Pseudomonas solanacearum (Smith) Smith, for så vidt angår Kongeriget
    Nederlandene'
  type: main
- language: el
  script: Grek
  content: '95/506/ΕΚ: Απόφαση της Επιτροπής, της 24ης Νοεμβρίου
    1995, η οποία επιτρέπει προσωρινά στα κράτη μέλη
    να λάβουν πρόσθετα μέτρα κατά της εξάπλωσης
    της Pseudomonas solanacearum (Smith) Smith όσον αφορά το Βασίλειο
    των Κάτω Χωρών'
  type: main
- language: fi
  script: Latn
  content: '95/506/EY: Komission päätös, tehty 24 päivänä marraskuuta 1995,
    luvan antamisesta jäsenvaltioille toteuttaa väliaikaisesti Alankomaiden kuningaskuntaa
    koskevia lisätoimenpiteitä Pseudomonas solanacearum (Smith) Smith -taudinaiheuttajan
    leviämisen estämiseksi'
  type: main
- language: it
  script: Latn
  content: '95/506/CE: Decisione della Commissione, del 24 novembre 1995, che autorizza
    gli Stati membri ad adottare, a titolo provvisorio, misure supplementari contro
    la propagazione dello Pseudomonas solanacearum (Smith) Smith relativamente al
    Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '95/506/EG: Beschikking van de Commissie van 24 november 1995 tot machtiging
    van bepaalde Lid-Staten om ten aanzien van het Koninkrijk der Nederlanden tijdelijk
    aanvullende maatregelen te nemen tegen de verspreiding van Pseudomonas solanacearum
    (Smith) Smith'
  type: main
- language: pt
  script: Latn
  content: '95/506/CE: Decisão da Comissão, de 24 de Novembro de 1995, que autoriza
    os Estados-membros a adoptar provisoriamente medidas adicionais contra a propagação
    de Pseudomonas solanacearum (Smith) Smith proveniente do Reino dos Países Baixos'
  type: main
- language: es
  script: Latn
  content: '95/506/CE: Decisión de la Comisión, de 24 de noviembre de 1995, por
    la que se autoriza a los Estados miembros para adoptar temporalmente, en lo que
    respecta al Reino de los Países Bajos, medidas complementarias contra la propagación
    de Pseudomonas solanacearum (Smith) Smith'
  type: main
- language: sv
  script: Latn
  content: '95/506/EG: Kommissionens beslut av den 24 november 1995 om tillstånd
    för medlemsstaterna att tillfälligt vidta tilläggsåtgärder för att förhindra
    spridning av Pseudomonas solanacearum (Smith) Smith från Nederländerna'
  type: main
