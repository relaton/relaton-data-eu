  content: '97/313/EC: Council Decision of 20 May 1997 on the conclusion of an Agreement
    in the form of an Exchange of Letters on the provisional application of the Protocol
    fixing, for the period 1 December 1996 to 30 November 1999, the fishing opportunities
    and the financial consideration provided for in the Agreement between the European
    Economic Community and the Government of Mauritius on fishing in Mauritian waters'
  type: main
- language: fr
  script: Latn
  content: '97/313/CE: Décision du Conseil du 20 mai 1997 concernant la conclusion
