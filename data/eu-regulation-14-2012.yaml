    Ursprung in der Volksrepublik China auf aus Malaysia versandte Einfuhren bestimmter
    Molybdändrähte, ob als Ursprungserzeugnis Malaysias angemeldet oder nicht, und
    zur Einstellung der Untersuchung betreffend die aus der Schweiz versandten Einfuhren
  type: main
