title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 14/2012 of 9 January 2012 extending
    the definitive anti-dumping duty imposed by Implementing Regulation (EU) No 511/2010
    on imports of certain molybdenum wires originating in the People’s Republic
    of China to imports of certain molybdenum wires consigned from Malaysia, whether
    declared as originating in Malaysia or not and terminating the investigation in
    respect of imports consigned from Switzerland
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 14/2012 du Conseil du 9 janvier 2012
    portant extension du droit antidumping définitif institué par le règlement
    d’exécution (UE) n ° 511/2010 sur les importations de certains fils en molybdène
    originaires de la République populaire de Chine aux importations de certains
    fils en molybdène expédiés à partir de la Malaisie, qu’ils aient ou non
    été déclarés originaires de la Malaisie, et clôturant l’enquête en ce
    qui concerne les importations expédiées à partir de la Suisse
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 14/2012 des Rates vom 9. Januar 2012
