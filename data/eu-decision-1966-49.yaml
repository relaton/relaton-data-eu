title:
- language: fr
  script: Latn
  content: Décision 66/49/CEE de la Commission, du 14 décembre 1965, portant nouvelle
    modification de sa décision du 10 novembre 1964, autorisant la perception de
    taxes compensatoires à l'importation, en République fédérale d'Allemagne,
    de dextrines fabriquées à partir de la fécule de pommes de terre, ainsi que
    de fécules de pommes de terre solubles ou torréfiées, en provenance de certains
    États membres
  type: main
- language: de
  script: Latn
  content: '66/49/EWG: Entscheidung der Kommission vom 14. Dezember 1965 zur erneuten
    Änderung ihrer Entscheidung vom 10. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Dextrin auf der Grundlage von Kartoffelstärke sowie von löslicher
    oder gerösteter Kartoffelstärke aus verschiedenen Mitgliedstaaten in die Bundesrepublik
    Deutschland'
  type: main
- language: it
  script: Latn
  content: '66/49/CEE: Decisione della Commissione, del 14 dicembre 1965, che modifica
    nuovamente la decisione del 10 novembre 1964 con cui si autorizza la riscossione
    di tasse di compensazione sulle importazioni, nella Repubblica federale di Germania,
    di destrine a base di fecola di patate, nonché di fecole di patate solubili o
    torrefatte, provenienti da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/49/EEG: Beschikking van de Commissie van 14 december 1965 tot nieuwe
    wijziging van haar beschikking van 10 november 1964 houdende machtiging tot het
    leggen van een compenserende heffing op de invoer in de Bondsrepubliek Duitsland
    van dextrine, vervaardigd uit aardappelzetmeel, alsmede oplosbaar of geroost aardappelzetmeel,
    uit bepaalde Lid-Staten'
  type: main
