title:
- language: en
  script: Latn
  content: Commission Decision of 2 July 1980 on amendments to the boundaries of less-favoured
    areas in the Federal Republic of Germany within the meaning of Article 3 (3) and
    (4) of Council Directive 75/268/EEC and listed in the Annex to Council Directive
    75/270/EEC (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 2 juillet 1980, modifiant les limites des
    zones agricoles défavorisées au sens de l'article 3 paragraphes 3 et 4 de la
    directive 75/268/CEE du Conseil et figurant à l'annexe de la directive 75/270/CEE
    du Conseil qui se trouvent sur le territoire de la République fédérale d'Allemagne
    (Le texte en langue allemande est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 2. Juli 1980 über die Änderung der Grenzen
    der in der Anlage zu der Richtlinie des Rates 75/270/EWG aufgeführten benachteiligten
    Gebiete im Sinne von Artikel 3 Absätze 3 und 4 der Richtlinie des Rates 75/268/EWG
    in der Bundesrepublik Deutschland (Nur der deutsche Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 2. juli 1980 om ændring af grænserne for
    de i bilaget til Rådets direktiv 75/270/EØF anførte ugunstigt stillede områder
    i Forbundsrepublikken Tyskland som behandlet i artikel 3, stk. 3 og 4, i Rådets
    direktiv 75/268/EØF (Kun den tyske udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 luglio 1980, che modifica i limiti delle
    zone svantaggiate della Repubblica federale di Germania, elencate nell'allegato
    della direttiva 75/270/CEE del Consiglio e definite all'articolo 3, paragrafi
    3 e 4, della direttiva 75/268/CEE del Consiglio (Il testo in lingua tedesca è
    il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 juli 1980 betreffende de wijziging van
    de grenzen van de in de bijlage bij Richtlijn 75/270/EEG van de Raad opgenomen
    probleemgebieden in de zin van artikel 3, leden 3 en 4, van Richtlijn 75/268/EEG
    van de Raad in de Bondsrepubliek Duitsland (Slechts de tekst in de Duitse taal
    is authentiek)
