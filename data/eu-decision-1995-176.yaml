---
id: EUDecision1995176
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '95/176/EC: Commission Decision of 6 April 1995 amending Annexes C and
    D of Council Directive 92/65/EEC laying down animal health requirements governing
    trade in and imports into the Community of animals, semen, ova and embryos not
    subject to animal health requirements laid down in specific Community rules referred
    to in Annex A (I) to Directive 90/425/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/176/CE: Décision de la Commission du 6 avril 1995 modifiant les annexes
    C et D de la directive 92/65/CEE du Conseil définissant les conditions de police
    sanitaire régissant les échanges et les importations dans la Communauté d''animaux,
    de spermes, d''ovules et d''embryons non soumis, en ce qui concerne les conditions
    de police sanitaire, aux réglementations communautaires spécifiques visées
    à l''annexe A section I de la directive 90/425/CEE'
  type: main
- language: de
  script: Latn
  content: '95/176/EG: Entscheidung der Kommission vom 6. April 1995 zur Änderung
    der Anhänge C und D der Richtlinie 92/65/EWG des Rates über die tierseuchenrechtlichen
    Bedingungen für den Handel mit Tieren, Samen, Eizellen und Embryonen in der Gemeinschaft
    sowie für ihre Einfuhr in die Gemeinschaft, soweit sie diesbezüglich nicht den
    spezifischen Gemeinschaftsregelungen nach Anhang A Abschnitt I der Richtlinie
    90/425/EWG unterliegen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 6 април 1995 година
    относно изменение на приложения В и Г към Директива
    92/65/ЕИОза определяне на ветеринарно-санитарните
    изисквания относно търговията и вноса в Общността
    на животни, сперма, яйцеклетки и ембриони, които
    не са предмет на ветеринарно-санитарните изисквания,
    определени в специалните правила на Общността,
    посочени в приложение А, раздел I към Директива
    90/425/ЕИО
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 6. dubna 1995, kterým se mění přílohy C
    a D směrnice Rady 92/65/EHS o veterinárních předpisech pro obchod se zvířaty,
    spermatem, vajíčky a embryi uvnitř Společenství a jejich dovoz do Společenství,
    pokud se na ně nevztahují zvláštní veterinární předpisy Společenství
    uvedené v příloze A oddíle I směrnice 90/425/EHS
  type: main
- language: da
  script: Latn
  content: '95/176/EF: Kommissionens beslutning af 6. april 1995 om ændring af bilag
    C og D til Rådets direktiv 92/65/EØF om dyresundhedsmæssige betingelser for
    samhandel med og indførsel til Fællesskabet af dyr samt sæd, æg og embryoner,
    der for så vidt angår disse betingelser ikke er underlagt specifikke fællesskabsbetingelser
    som omhandlet i bilag A, del i, til direktiv 90/425/EØF'
  type: main
- language: el
  script: Grek
  content: '95/176/ΕΚ: Απόφαση της Επιτροπής της 6ης Απριλίου
    1995 για την τροποποίηση των παραρτημάτων Γ και
    Δ της οδηγίας 92/65/ΕΟΚ του Συμβουλίου που καθορίζει
    τους όρους υγειονομικού ελέγχου που διέπουν
    το εμπόριο και τις εισαγωγές στην Κοινότητα
    ζώων, σπέρματος, ωαρίων και εμβρύων που δεν
    υπόκεινται, όσον αφορά τους όρους υγειονομικού
    ελέγχου, στις ειδικές κοινοτικές ρυθμίσεις
    που αναφέρονται στο τμήμα Ι του παραρτήματος
    Α της οδηγίας 90/425/ΕΟΚ'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 6. aprill 1995, millega muudetakse nõukogu direktiivi
    92/65/EMÜ (milles sätestatakse selliste loomade sperma, munarakkude ja embrüote
    ühendusesisest kaubandust ja ühendusse importimist reguleerivad loomatervishoiunõuded,
    mille suhtes ei kohaldata direktiivi 90/425/EMÜ lisa A I peatükis osutatud ühenduse
    erieeskirjades sätestatud loomatervishoiunõudeid) C ja D lisa
  type: main
- language: fi
  script: Latn
  content: '95/176/EY: Komission päätös, tehty 6 päivänä huhtikuuta 1995, eläinten
    terveyttä koskevista vaatimuksista eläinten, siemennesteen, munasolujen ja alkioiden
    yhteisön sisäisessä kaupassa ja yhteisöön tuonnissa siltä osin, kuin niitä
    eivät koske direktiivin 90/425/ETY liitteessä A olevassa I jaksossa mainittujen
    erityisten yhteisön säädösten eläinten terveyttä koskevat vaatimukset annetun
    neuvoston direktiivin 92/65/ETY liitteen C ja D muuttamisesta'
  type: main
- language: hr
  script: Latn
  content: '95/176/EZ: Odluka Komisije od 6. travnja 1995. o izmjeni priloga C i D
    Direktivi Vijeća 92/65/EEZ o utvrđivanju zahtjeva zdravlja životinja kojima
    se uređuje trgovina unutar Zajednice i uvoz u Zajednicu životinja, sjemena,
    jajnih stanica i zametaka koji ne podliježu zahtjevima zdravlja životinja utvrđenim
    u posebnim pravilima Zajednice iz poglavlja I. Priloga A Direktivi 90/425/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1995. április 6.) a 90/425/EGK irányelv A.
    mellékletének I. pontjában felsorolt külön közösségi szabályokban megállapított
    állat-egészségügyi követelmények hatálya alá nem tartozó állatok, spermák,
    petesejtek és embriók Közösségen belüli kereskedelmére és a Közösségbe
    történő behozatalára irányadó állat-egészségügyi követelmények megállapításáról
    szóló 92/65/EGK tanácsi irányelv C. és D. mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: '95/176/CE: Decisione della Commissione del 6 aprile 1995 recante modifica
    degli allegati C e D della direttiva 92/65/CEE del Consiglio, che stabilisce norme
    sanitarie per gli scambi e le importazioni nella Comunità di animali, sperma,
    ovuli ed embrioni non soggetti, per quanto riguarda le condizioni di polizia sanitaria,
    alle normative Comunitàrie specifiche di cui all''allegato A, sezione I, della
    direttiva 90/425/CEE'
  type: main
- language: lv
  script: Latn
  content: Komisijas lēmums (1995. gada 6. aprīlis), ar kuru groza C un D pielikumu
    Padomes Direktīvai 92/65/EEK, ar ko paredz dzīvnieku veselības prasības attiecībā
    uz tādu dzīvnieku, spermas, olšūnu un embriju tirdzniecību un ievešanu Kopienā,
    uz kuriem neattiecas dzīvnieku veselības prasības, kas paredzētas īpašos
    Kopienas noteikumos, kuri minēti Direktīvas 90/425/EEK A pielikuma I daļā
  type: main
- language: lt
  script: Latn
  content: 1995 m. balandžio 6 d. Komisijos Sprendimas iš dalies keičiantis Tarybos
    direktyvos 92/65/EEB, nustatančios gyvūnų sveikatos reikalavimus, reglamentuojančius
    prekybą Bendrijoje gyvūnais, sperma, kiaušialąstėmis ir embrionais, kuriems
    netaikomi gyvūnų sveikatos reikalavimai, nustatyti specialiose Bendrijos taisyklėse,
    nurodytose Direktyvos 90/425/EEB A priedo I dalyje, bei jų importą į Bendriją,
    C ir D priedus
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-6 ta' April 1995 li temenda l-Annessi
    Ċ u D tad-Direttiva tal-Kunsill tal-KEE 92/65 li tistabbilixxi l-ħtiġiet tas-saħħa
    ta' l-annimali li jirregolaw il-kummerċ u importazzjoni fil-Komunità ta' bhejjem,
    sperma, bajd u embrijuni li mhumiex soġġetti għar-rekwiżiti tas-saħħa ta'
    l-annimali stabbiliti fir-regoli speċifiċi tal-Komunità li hemm referenza dwarhom
    fl-Anness A (I) tad-Direttiva 90/425/KEE
  type: main
- language: nl
  script: Latn
  content: '95/176/EG: Beschikking van de Commissie van 6 april 1995 houdende wijziging
    van de bijlagen C en D bij Richtlijn 92/65/EEG van de Raad tot vaststelling van
    de veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer in
    de Gemeenschap van dieren, sperma, eicellen en embryo''s waarvoor ten aanzien
    van de veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving
    als bedoeld in bijlage A, onder I, van Richtlijn 90/425/EEG geldt'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 6 kwietnia 1995 r. zmieniająca załączniki C i
    D do dyrektywy Rady 92/65/EWG ustanawiającej warunki zdrowia zwierząt regulujące
    handel i przywóz do Wspólnoty zwierząt, nasienia, komórek jajowych i zarodków
    nieobjętych warunkami zdrowia zwierząt ustanowionymi w szczególnych zasadach
    Wspólnoty określonych w załączniku A do dyrektywy 90/425/EWG pkt I
  type: main
- language: pt
  script: Latn
  content: '95/176/CE: Decisão da Comissão de 6 de Abril de 1995 que altera os anexos
    C e D da Directiva 92/65/CEE do Conselho, que define as condições de polícia
    sanitária que regem o comércio e as importações na Comunidade de animais,
    sémens, óvulos e embriões não sujeitos, no que se refere às condições de
    polícia sanitária, às regulamentações comunitárias específicas referidas
    na secção I do anexo A da Directiva 90/425/CEE'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 6 aprilie 1995 de modificare a anexelor C și D la
    Directiva 92/65/CEE a Consiliului de definire a condițiilor de sănătate animală
    care reglementează comerțul și importurile în Comunitate de animale, material
    seminal, ovule și embrioni care nu se supun, în ceea ce privește condițiile
    de sănătate animală, reglementărilor comunitare specifice prevăzute în anexa
    A punctul I din Directiva 90/425/CEE
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 6. apríla 1995, ktorým sa menia a dopĺňajú
    prílohy C a D smernice Rady 92/65/EHS ustanovujúcej požiadavky na zdravotný
    stav zvierat, platné pre obchodovanie v rámci spoločenstva so zvieratami, spermou,
    vajíčkami a embryami a ich dovoz, na ktoré sa nevzťahujú požiadavky na zdravotný
    stav ustanovené v osobitných pravidlách spoločenstva uvedených v prílohe
    A (I) k smernici 90/425/EHS
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 6. aprila 1995 o spremembi prilog C in D Direktive
    Sveta 92/65/EGS o zahtevah zdravstvenega varstva živali za trgovino in za uvoz
    v Skupnost živali, semena, jajčnih celic in zarodkov, za katere ne veljajo zahteve
    zdravstvenega varstva živali, določene v posebnih pravilih Skupnosti iz Priloge
    A(I) k Direktivi 90/425/EGS
  type: main
- language: es
  script: Latn
  content: '95/176/CE: Decisión de la Comisión de 6 de abril de 1995 por la que
    se modifican los Anexos C y D de la Directiva 92/65/CEE del Consejo por la que
    se establecen las condiciones de policía sanitaria aplicables a los intercambios
    y las importaciones en la Comunidad de animales, esperma, óvulos y embriones
    no sometidos, con respecto a estas condiciones, a las normativas comunitarias
    específicas a que se refiere la sección I del Anexo A de la Directiva 90/425/CEE'
  type: main
- language: sv
  script: Latn
  content: '95/176/EG: Kommissionens beslut av den 6 april 1995 om ändring av bilaga
    C och D till rådets direktiv 92/65/EEG om fastställande av djurhälsokrav i
    handeln inom och importen till gemenskapen av djur, sperma, ägg och embryon som
    inte faller under de krav som fastställs i de specifika gemenskapsregler som
    avses i bilaga A I till direktiv 90/425/EEG'
  type: main
