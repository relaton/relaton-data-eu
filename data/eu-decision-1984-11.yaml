  content: '84/11/EEC: Commission Decision of 21 December 1983 changing the import
    arrangements established by Council Regulation (EEC) No 3420/83 and applied in
    the Benelux countries, in the Federal Republic of Germany, in the United Kingdom
    and in Greece in respect of Romania regarding various industrial products (Only
    the German, Greek, English, French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/11/CEE: Décision de la Commission du 21 décembre 1983 modifiant le
    régime d''importation prévu par le règlement (CEE) n° 3420/83 du Conseil et
    appliqué au Benelux, en République fédérale d''Allemagne, en Grèce et au
    Royaume-Uni à l''égard de la Roumanie en ce qui concerne divers produits industriels
    (Les textes en langues allemande, grecque, anglaise, française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
