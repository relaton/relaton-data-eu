title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1402/88 of 24 May 1988 amending Regulation
    (EEC) No 1847/85 fixing the list of representative producer markets for certain
    fruit and vegetables as regards nectarines
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1402/88 de la Commission du 24 mai 1988 modifiant
    le règlement (CEE) n° 1847/85 fixant la liste des marchés représentatifs à
    la production pour certains fruits et légumes en ce qui concerne les nectarines
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1402/88 DER KOMMISSION vom 24. Mai 1988 zur Änderung
    der Verordnung (EWG) Nr. 1847/85 zur Festlegung der Liste der repräsentativen
    Erzeugermärkte für bestimmte Obst- und Gemüsearten bezüglich Nektarinen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1402/88 af 24. maj 1988 om ændring
    af forordning (EØF) nr. 1847/85 om fastsættelse af en liste over markeder, der
    er repræsentative for produktion af visse frugter og grønsager, for så vidt
    angår nektariner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1402/88 της Επιτροπής
    της 24ης Μαΐου 1988 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1847/85 που καθορίζει τον κατάλογο των
    αντιπροσωπευτικών αγορών στην παραγωγή για
    ορισμένα οπωροκηπευτικά όσον αφορά τα νεκταρίνια
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1402/88 DELLA COMMISSIONE del 24 maggio 1988 recante
    modifica del regolamento (CEE) n. 1847/85 che fissa l'' elenco dei mercati rappresentativi
    alla produzione per alcuni ortofrutticoli in ordine alle nettarine #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1402/88 VAN DE COMMISSIE van 24 mei 1988 tot wijziging
    van Verordening (EEG) nr. 1847/85 tot vaststelling van de lijst van de representatieve
    produktiemarkten voor bepaalde soorten groenten en fruit ten aanzien van nectarines
    #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1402/88 da Comissão de 24 de Maio de 1988 que altera
    o Regulamento (CEE) n.° 1847/85, que fixa a lista dos mercados representativos
    na produção para certas frutas e produtos hortícolas, no que diz respeito às
    nectarinas
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 1402/88 DE LA COMISIÓN de 24 de mayo de 1988 por
    el que se modifica el Reglamento (CEE) nº 1847/85, que fija la lista de mercados
    representativos en la producción respecto a determinadas frutas y hortalizas,
    en lo que se refiere a las nectarinas #'
  type: main
