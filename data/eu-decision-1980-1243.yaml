title:
- language: en
  script: Latn
  content: '80/1243/EEC: Commission Decision of 17 December 1980 on reimbursement
    by the EAGGF, Guidance Section, to the French Republic of expenditure incurred
    during 1978 and 1979 under Directive 78/627/EEC on the programme to accelerate
    the restructuring and conversion of vineyards in certain Mediterranean regions
    in France (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1243/CEE: Décision de la Commission, du 17 décembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole,
    section "orientation", à la République française des dépenses effectuées
    pendant les années 1978 et 1979 dans le cadre du programme d''accélération
    de la restructuration et de reconversion de la viticulture dans certaines régions
    méditérranéennes de la France (Le texte en langue française est le seul faisant
    foi)'
  type: main
