title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1519/74 of the Commission of 18 June 1974 re-establishing
    the levying of customs duties on wrought bars, rods, angles, shapes and sections,
    of aluminium; aluminium wire, falling within CCT heading No 76.02, originating
    in Yugoslavia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1519/74 de la Commission, du 18 juin 1974, portant
    rétablissement de la perception des droits de douane applicables aux barres profilés
    et fils de section pleine, en aluminium, de la position tarifaire 76.02, originaires
    de Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1519/74 der Kommission vom 18. Juni 1974 zur Wiedereinführung
    des Zollsatzes für Stäbe, Profile und Draht, aus Aluminium, massiv, der Tarifnummer
    76.02, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3501/73
    des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1519/74 af 18. juni 1974 om genindførelse
    af opkrævning af toldafgifter for stænger, profiler og tråd af aluminium under
    position 76.02, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1519/74 della Commissione, del 18 giugno 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle barre, profilati
    e fili di sezione piena, di alluminio della voce doganale n. 76.02 originari della
    Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1519/74 van de Commissie van 18 juni 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op staven, profielen
    en draad, massief, van aluminium, van post 76.02, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
