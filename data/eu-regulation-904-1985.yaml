title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 904/85 of 2 April 1985 re-establishing the
    levying of customs duties on certain panty-hose (tights), products of category
    70 (code 40.0700), originating in Sri Lanka, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 904/85 de la Commission du 2 avril 1985 portant rétablissement
    de la perception des droits de douane applicables à certains bas-culottes, communément
    appelés collants, de la catégorie 70 (code 40.0700), originaires de Sri Lanka,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 904/85 der Kommission vom 2. April 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Strumpfhosen der Warenkategorie
    Nr. 70 (Kennziffer 40.0700) mit Ursprung in Sri Lanka, dem die in der Verordnung
    (EWG) Nr. 3563/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 904/85 af 2. april 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte strømpebenklæder under varekategori
    nr. 70 (kode 40.0700), som har oprindelse i Sri Lanka og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 904/85 της Επιτροπής
    της 2ας Απριλίου 1985 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένες
    κάλτσες—κυλότες, κοινώς ονομαζόμενες collants,
    προϊόντα της κατηγορίας 70 (κωδικός 40.0700), καταγωγής
    Σρι Λάνκα, δικαιούχου των προβλεπόμενων από
    τον κανονισμό (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 904/85 della Commissione del 2 aprile 1985 che ripristina
    la riscossione dei dazi doganali applicabili a talune calze-mutande (dette anche
    bas-culottes, collants), della categoria di prodotti n. 70 (codice 40.0700), originarie
    dello Sri Lanka beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 904/85 van de Commissie van 2 april 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    kousenbroeken van de categorie van produkten nr. 70 (codenummer 40.0700) van oorsprong
    uit Sri Lanka waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3563/84 van de Raad
  type: main
