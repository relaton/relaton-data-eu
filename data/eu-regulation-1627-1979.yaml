title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1627/79 of 27 July 1979 amending for the
    sixth time the list in Regulation (EEC) No 572/73 setting out the egg and poultrymeat
    products eligible for the advance fixing of export refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1627/79 de la Commission, du 27 juillet 1979, portant
    sixième modification du règlement (CEE) n° 572/73 en ce qui concerne la liste
    des produits des secteurs des oeufs et de la viande de volaille bénéficiant
    du régime de la fixation à l' avance des restitutions à l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1627/79 der Kommission vom 27. Juli 1979 zur sechsten
    Änderung der Liste im Anhang der Verordnung (EWG) Nr. 572/73 zur Festlegung der
    Erzeugnisse auf dem Eiersektor und auf dem Sektor Geflügelfleisch, die für eine
    Vorausfestsetzung der Ausfuhrerstattung in Frage kommen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1627/79 af 27. juli 1979 om sjette
    ændring af forordning (EØF) nr. 572/73 for så vidt angår listen over de æg-
    og fjerkrækødprodukter, der kommer i betragtning ved forudfastsættelse af eksportrestitutioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1627/79 της Επιτροπής
    της 21ης Ιουλίου 1979 περί της έκτης τροποποιήσεως
    του κανονισμού (ΕΟΚ) αριθ. 512/73 όσον αφορά τον
    πίνακα των προϊόντων στον τομέα των αυγών και
    του κρέατος πουλερικών, που πληρούν τους όρους
    εφαρμογής του καθεστώτος προκαθορισμού των
    επιστροφών κατά την εξαγωγή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1627/79 della Commissione, del 27 luglio 1979, recante
    sesta modifica del regolamento (CEE) n. 572/73 per quanto concerne l' elenco dei
    prodotti del settore delle uova e del pollame ai quali è concesso il beneficio
    della fissazione anticipata della restituzione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1627/79 van de Commissie van 27 juli 1979 houdende
