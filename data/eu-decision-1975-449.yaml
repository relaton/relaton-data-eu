id: EUDecision1975449
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 5 March 1975 authorizing the United Kingdom not
    to apply Community treatment to woven fabrics of man-made fibres (discontinuous
    or waste), falling within heading No 56.07 of the Common Customs Tariff, originating
    in Taiwan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/449/CEE: Décision de la Commission, du 5 mars 1975, autorisant le
    Royaume-Uni à exclure du traitement communautaire les tissus de fibres textiles
    synthétiques et artificielles discontinues de la position 56.07 du Tarif douanier
    commun, originaires de Taiwan et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. März 1975, mit der das Vereinigte Königreich
    ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Gewebe aus synthetischen oder künstlichen Spinnfasern
    der Tarifnummer 56.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. marts 1975 om bemyndigelse for Det forenede
    Kongerige til fra fællesskabsbehandling at undtage vævet stof af korte kemofibre
    eller af affald af kemofibre, som henhører under position 56.07 i den fælles
    toldtarif, har oprindelse i Taiwan, og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 marzo 1975, che autorizza il Regno Unito
    ad escludere dal trattamento comunitario i tessuti di fibre tessili sintetiche
    ed artificiali in fiocco, della voce n. 56.07 della tariffa doganale comune, originari
    di Taiwan, e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 maart 1975 waarbij het Verenigd Koninkrijk
    wordt gemachtigd weefsels van synthetische of kunstmatige stapelvezels, van post
    56.07 van het gemeenschappelijk douanetarief, van oorsprong uit Tai-wan en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
