    heinäkuussa 2004 jätettyjen tuontitodistushakemusten hyväksyttävyydestä annetun
    asetuksen (EY) N:o 1347/2004 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1503/2004/EK rendelete (2004. augusztus 24.) az egyes tejtermékekre
