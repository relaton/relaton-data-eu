title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 996/2007 of 28 August 2007 amending for the
    84th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 996/2007 de la Commission du 28 août 2007 modifiant
    pour la quatre-vingt-quatrième fois le règlement (CE) n° 881/2002 du Conseil
    instituant certaines mesures restrictives spécifiques à l'encontre de certaines
    personnes et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux
    Taliban, et abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 996/2007 der Kommission vom 28. August 2007 zur vierundachtzigsten
