  content: Council Regulation (EEC) No 1111/84 of 18 April 1984 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and the Republic of Tunisia altering, for the period 16 December 1983
    to 31 October 1984, the additional amount to be deducted from the levy on imports
    into the Community of untreated olive oil originating in Tunisia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1111/84 du Conseil du 18 avril 1984 concernant la conclusion
    de l' accord sous forme d' échange de lettres entre la Communauté économique
    européenne et la République tunisienne modifiant, pour la période du 16 décembre
    1983 au 31 octobre 1984, le montant additionnel à déduire du prélèvement applicable
    à l' importation dans la Communauté d' huile d' olive non traitée originaire
    de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1111/84 des Rates vom 18. April 1984 über den Abschluß
    des Abkommens in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und der Tunesischen Republik zur Änderung des vom 16. Dezember 1983 bis 31. Oktober
    1984 geltenden Zusatzbetrags, der bei der Einfuhr in die Gemeinschaft von nicht
    behandeltem Olivenöl mit Ursprung in Tunesien von der Abschöpfung abzuziehen
    ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1111/84 af 18. april 1984 om indgåelse af
    aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og Den tunesiske Republik om ændring for perioden fra 16. december 1983 til 31.
    oktober 1984 af det tillægsbeløb, der skal fratrækkes den afgift, som anvendes
    ved indførsel til Fællesskabet af ikke behandlet olivenolie med oprindelse i
    Tunesien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1111/84 του Συμβουλίου
    της 18ης Απριλίου 1984 για τη σύναψη συμφωνίας
    υπό μορφή ανταλλαγής επιστολών μεταξύ της
    Ευρωπαϊκής Οικονομικής Κοινότητας και της
    Δημοκρατίας της Τυνησίας περί τροποποιήσεως,
