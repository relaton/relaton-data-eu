    Economische Gemeenschap en de Republiek Tunesië tot wijziging, voor het tijdvak
    van 16 december 1983 tot en met 31 oktober 1984, van het aanvullende bedrag dat
    in mindering moet worden gebracht op de heffing die bij invoer in de Gemeenschap
    van toepassing is op niet-behandelde olijfolie van oorsprong uit Tunesië
