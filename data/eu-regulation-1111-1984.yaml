  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1111/84 del Consiglio del 18 aprile 1984 relativo
    alla conclusione dell' accordo in forma di scambio di lettere tra la Comunità
    economica europea e la Repubblica tunisina che modifica, per il periodo 16 dicembre
    1983 - 31 ottobre 1984, l' importo aggiuntivo da detrarre dal prelievo applicabile
    all' importazione nella Comunità di olio d' oliva non trattato originario della
    Tunisia
  type: main
- language: nl
