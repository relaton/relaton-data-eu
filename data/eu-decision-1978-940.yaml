id: EUDecision1978940
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 27 October 1978 fixing the minimum selling prices
    for frozen beef put up for sale by the intervention agencies in accordance with
    Regulation (EEC) No 2900/77 and specifying the quantities of frozen beef for processing
    which may be imported under special terms in the fourth quarter of 1978
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 27 octobre 1978, relative à la fixation
    de prix de vente minimaux pour la viande bovine congelée mise en vente par les
    organismes d'intervention en vertu du règlement (CEE) n 2900/77 et spécifiant
    en conséquence les quantités de viande bovine congelée destinée à la transformation
    pouvant être importées à des conditions spéciales pour le quatrième trimestre
    1978
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 27. Oktober 1978 zur Festsetzung von Mindestpreisen
    für den Verkauf von entbeintem gefrorenem Rindfleisch durch die Interventionsstellen
    gemäß Verordnung (EWG) Nr. 2900/77 sowie zur Festsetzung der Mengen gefrorenen
    Rindfleisches zur Verarbeitung, die im vierten Vierteljahr 1978 zu Sonderbedingungen
    eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 27. oktober 1978 om fastsættelse af mindstesalgspriser
    for frosset oksekød, der er udbudt til salg af interventionsorganerne i henhold
    til forordning (EØF) nr. 2900/77, og fastlæggelse af hvilke mængder frosset
    oksekød til forarbejdning, der kan indføres på særlige betingelser i fjerde
    kvartal af 1978
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 27 ottobre 1978, che fissa i prezzi minimi
    di vendita delle carni bovine congelate messe in vendita dagli organismi d'intervento
    ai sensi del regolamento (CEE) n. 2900/77 e stabilisce i quantitativi di carni
    bovine congelate destinate alla trasformazione che possono essere importati a
    condizioni speciali nel quarto trimestre 1978
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 27 oktober 1978 tot vaststelling van de
    minimumverkoopprijzen voor bevroren rundvlees dat door de interventiebureaus te
    koop is aangeboden op grond van Verordening (EEG) nr. 2900/77 en van de hoeveelheden
    bevroren rundvlees voor verwerking die in het vierde kwartaal van 1978 op bijzondere
    voorwaarden mogen worden ingevoerd
  type: main
