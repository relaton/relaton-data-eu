title:
- language: fr
  script: Latn
  content: Décision de la Commission du 22 décembre 1972 portant octroi du concours
    du Fonds social européen, prévu à l'article 125 du Traité, au bénéfice de
    la République italienne, pour des dépenses relatives à des opérations de rééducation
    professionnelle effectuées par le Ministère du travail et de la prévoyance
    sociale, l'Istituto nazionale per l'addestramento ed il perfezionamento dei lavoratori
    dell'industria (INAPLI) et l'Istituto nazionale della previdenza sociale (INPS)
  type: main
- language: de
  script: Latn
  content: '72/501/EWG: Entscheidung der Kommission vom 22. Dezember 1972 zur Gewährung
    eines Zuschusses nach Artikel 125 EWG aus dem Europäischen Sozialfonds an die
    Italienische Republik zu Aufwendungen für vom "Ministero del Lavoro e della Previdenza
    sociale", vom "Istituto nazionale per l''addestramento ed il perfezionamento dei
    lavoratori dell''industria (INAPLI)" und vom "Istituto Nazionale della Previdenza
    Sociale (INPS)" durchgeführte Berufsumschulungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/501/CEE: Decisione della Commissione, del 22 dicembre 1972, recante
    la concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore della Repubblica italiana per spese concernenti operazioni
    di riqualificazione professionale effettuate dal «Ministero del lavoro e della
    previdenza sociale» dall''«Istituto nazionale per l''addestramento ed il perfezionamento
    dei lavoratori dell''industria (INAPLI)» ed all''«Istituto nazionale della previdenza
    sociale» (INPS)'
  type: main
- language: nl
  script: Latn
  content: '72/501/EEG: Beschikking van de Commissie van 22 december 1972 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel
    125 van het Verdrag ten gunste van de Italiaanse Republiek voor door het "Ministero
    del lavoro e della previdenza sociale", het "Istituto nazionale per l''addestramento
    ed il perfezionamento dei lavoratori dell''industria (INAPLI)" en het "Istituto
    nazionale della previdenza sociale (INPS)" gemaakte herscholingskosten'
  type: main
