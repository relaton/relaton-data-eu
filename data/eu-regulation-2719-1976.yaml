  content: Council Regulation (EEC) No 2719/76 of 25 October 1976 on the opening,
    allocation and administration of a Community tariff quota for dried grapes in
    immediate containers of a net capacity of 15 kg or less falling within subheading
    08.04 B I of the Common Customs Tariff (1977)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2719/76 du Conseil, du 25 octobre 1976, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de raisins
    secs présentés en emballages immédiats d'un contenu net inférieur ou égal
    à 15 kilogrammes, de la sous-position 08.04 B I du tarif douanier commun (année
    1977)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2719/76 des Rates vom 25. Oktober 1976 zur Eröffnung,
