    du régime d' importation applicable aux produits de la sous-position 07.06 A
    du tarif douanier commun originaires de Thaïlande et exportés de ce pays en
    1982 et en 1983
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 499/83 der Kommission vom 2. März 1983 zur Änderung
