    the import arrangements applicable to products falling within subheading 07.06
    A of the Common Customs Tariff, originating in Thailand and exported from that
    country in 1982 and 1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 499/83 de la Commission du 2 mars 1983 modifiant les
