title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 346/78 of 20 February 1978 re-establishing
    the levying of customs duties on umbrellas and sunshades falling within heading
    No 66.01, originating in Hong Kong to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 346/78 de la Commission, du 20 février 1978, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles, de la position tarifaire 66.01, originaires de Hong-Kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 346/78 der Kommission vom 20. Februar 1978 zur Wiedereinführung
    des Zollsatzes für Regenschirme und Sonnenschirme usw., der Tarifnummer 66.01,
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 346/78 af 20. februar 1978 om genindførelse
    af opkrævning af toldafgifter for paraplyer og parasoller under position 66.01,
    som har oprindelse i Hongkong og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 346/78 della Commissione, del 20 febbraio 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli ombrelli (da pioggia
    e da sole) della voce doganale 66.01 originari di Hong Kong beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 346/78 van de Commissie van 20 februari 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op paraplu's
    en parasols, alsmede wandelstokparaplu's, van post 66.01, van oorsprong uit Hong-Kong,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
