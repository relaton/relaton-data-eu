    von Fluggastdatensätzen (PNR-Daten) aus der Europäischen Union an das Königreich
    Norwegen zum Zwecke der Verhütung, Aufdeckung, Ermittlung und Verfolgung von
    terroristischen Straftaten und schwerer Kriminalität
  type: main
