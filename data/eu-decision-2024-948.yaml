  script: Latn
  content: Council Decision (EU) 2024/948 of 4 March 2024 authorising the opening
    of negotiations with the Kingdom of Norway for an agreement between the European
    Union and the Kingdom of Norway on the transfer of Passenger Name Record (PNR)
    data from the European Union to the Kingdom of Norway for the prevention, detection,
    investigation and prosecution of terrorist offences and serious crime
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/948 du Conseil du 4 mars 2024 autorisant l’ouverture
    de négociations avec le Royaume de Norvège en vue d’un accord entre l’Union
    européenne et le Royaume de Norvège sur le transfert de données des dossiers
    passagers (PNR) depuis l’Union européenne vers le Royaume de Norvège pour
    la prévention et la détection des infractions terroristes et des formes graves
    de criminalité, ainsi que pour les enquêtes et les poursuites en la matière
  type: main
