title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2671/90 of 17 September 1990 reintroducing
    the levying of the customs duties applicable to articles knitted or crocheted
    products of categories 4 (order No 40.0040) and 74 (order (No 40.0740) originating
    in Indonesia, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2671/90 de la Commission du 17 septembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux articles
    en bonneterie des catégories de produits nos 4 (numéro d'ordre 40.0040) et 74
    (numéro d'ordre 40.0740), originaires de l'Indonésie, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2671/90 DER KOMMISSION vom 17. September 1990 zur
    Wiedereinfuehrung des Zollsatzes fuer Artikel aus Gewirken der Warenkategorie
    Nr. 4 (laufende Nummer 40.0040) und der Warenkategorie Nr. 74 (laufende Nummer
    40.0740) mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr. 3897/89
    des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2671/90 af 17. september 1990 om genindførelse
