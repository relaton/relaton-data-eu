title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1609/74 of the Commission of 26 June 1974 amending
    Commission Regulation (EEC) No 834/74 laying down requisite provisions to prevent
    the sugar market being disturbed as a result of the price increase in this sector
    for the 1974/75 sugar marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1609/74 de la Commission, du 26 juin 1974, modifiant
    le règlement (CEE) n° 834/74 établissant des mesures nécessaires pour éviter
    des perturbations sur le marché du sucre provoquées par l'augmentation des prix
    dans ce secteur pour la campagne sucrière 1974/1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1609/74 der Kommission vom 26. Juni 1974 zur Änderung
    der Verordnung (EWG) Nr. 834/74 über notwendige Maßnahmen zur Verhinderung von
    Störungen auf dem Zuckermarkt, hervorgerufen durch Preiserhöhungen in diesem
    Sektor für das Zuckerwirtschaftsjahr 1974/1975
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1609/74 af 26. juni 1974 om ændring
    af forordning (EØF) nr. 834/74 om fastsættelse af nødvendige foranstaltninger
    til undgåelse af forstyrrelser på sukkermarkedet på grund af prisforhøjelsen
    i denne sektor for sukkerproduktionsåret 1974/1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1609/74 della Commissione, del 26 giugno 1974, che
    modifica il regolamento (CEE) n. 834/74 che stabilisce le misure necessarie per
    evitare perturbazioni sul mercato dello zucchero provocate dall'aumento dei prezzi
    in tale settore per la campagna saccarifera 1974/1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1609/74 van de Commissie van 26 juni 1974 tot wijziging
    van Verordening (EEG) nr. 834/74 tot vaststelling van de maatregelen welke nodig
    zijn ter voorkoming van verstoringen van de suikermarkt ten gevolge van de prijsverhoging
    in deze sector voor het verkoopseizoen 1974/1975
  type: main
