title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3343/89 of 7 November 1989 re-establishing
    of customs duties on women's or girls'wovn overcoats, raincoats and other coasts,
    cloaks and capes; jacket and blazers, of wool, cotton or man- made textile fibres
    (other than parkas) (of category 21), products of category 15 (order No 40.0150),
    originating in Pakistan, to which the preferential tariff arrangements of Council
    Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3343/89 de la Commission du 7 novembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux manteaux,
    imperméables (y compris les capes) et vestes, tissés, pour femmes ou fillettes,
    de laine, de coton ou de fibres synthétiques ou artificielles (autres que parkas
    de la catégorie 21), de la catégorie de produits n° 15 (numéro d'ordre 40.0150)
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3343/89 DER KOMMISSION vom 7. November 1989 zur Wiedereinführung
    des Zollsatzes für Mäntel (einschließlich Kurzmäntel) (einschließlich Umhänge)
    und Jacken für Frauen und Mädchen, aus Gewebe, aus Wolle, Baumwolle oder synthetischen
    oder künstlichen Spinnstoffen (ausgenommen Parkas der Kategorie 21) der Warenkategorie
    Nr. 15 (lfd. Nr. 40.0150) mit Ursprung in Pakistan, dem die in der Verordnung
    (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3343/89 af 7. november 1989 om genindførelse
    af opkrævning af toldafgifter for frakker, kapper og slag, jakker og blazere,
    vævede, til kvinder eller piger, af uld, bomuld eller syntetiske eller regenererede
    fibre, bortset fra parkacoats under kategori 21, under varekategori 15 (løbenummer
    40.0150), som har oprindelse i Pakistan og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
