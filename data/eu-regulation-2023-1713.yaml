title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/1713 of 7 September 2023
    concerning the authorisation of a preparation of endo-1,4-beta-xylanase produced
    by Trichoderma reesei ATCC PTA-5588, protease produced by Bacillus subtilis CBS
    148232 and alpha-amylase produced by Bacillus licheniformis ATCC SD-6525 for chickens
    for fattening, chickens reared for laying and minor poultry species (holder of
    authorisation: Danisco (UK) Ltd represented in the Union by Genencor international
    B.V.)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/1713 de la Commission du 7 septembre
    2023 concernant l’autorisation d’une préparation à base d’endo-1,4-bêta-xylanase
    produite par Trichoderma reesei ATCC PTA-5588, de protéase produite par Bacillus
    subtilis CBS 148232 et d’alpha-amylase produite par Bacillus licheniformis ATCC
    SD-6525 pour les poulets d’engraissement, les poulettes élevées pour la ponte
    et les espèces mineures de volailles [titulaire de l’autorisation: Danisco
    (UK) Ltd représenté dans l’Union par Genencor International B.V.]'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/1713 der Kommission vom 7. September
