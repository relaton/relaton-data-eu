    reesei ATCC PTA-5588, Protease gewonnen aus Bacillus subtilis CBS 148232 und Alpha-Amylase
    gewonnen aus Bacillus licheniformis ATCC SD-6525 für Masthühner, Junghennen
    und Geflügelarten von geringerer wirtschaftlicher Bedeutung (Zulassungsinhaber:
