  content: Décision de la Commission, du 27 juillet 1971, relative à l'autorisation
    d'accords de spécialisation pour la production de laminés en acier et d'accords
    relatifs à la création d'un bureau de répartition des commandes d'aciers marchands
    et de fil-machine entre les entreprises Eisenwerk-Gesellschaft Maximilianshuette
    GmbH, Kloeckner-Werke AG et Stahlwerke Peine-Salzgitter AG
  type: main
- language: de
  script: Latn
  content: '71/314/EGKS: Entscheidung der Kommission vom 27. Juli 1971 über die Genehmigung
    von Vereinbarungen über Spezialisierung der Walzstahlproduktion sowie über eine
    Auftragslenkungsstelle für Stabstahl und Walzdraht zwischen der Eisenwerk-Gesellschaft
    Maximilianshütte mbH, Klöckner-Werke AG und Stahlwerke Peine-Salzgitter AG'
  type: main
- language: it
  script: Latn
  content: '71/314/CECA: Decisione della Commissione, del 27 luglio 1971, relativa
    all''autorizzazione di accordi conclusi fra le imprese in merito alla specializzazione
    della produzione di acciai laminati e all''istituzione di un ufficio di ripartizione
    delle ordinazioni di laminati mercantili e di vergella e bordione'
  type: main
- language: nl
  script: Latn
  content: '71/314/EGKS: Beschikking van de Commissie van 27 juli 1971 houdende ontheffing
    van de verbodsbepaling ten aanzien van overeenkomsten tussen de Eisenwerk- Gesellschaft
    Maximilianshütte mbH, Klöckner-Werke AG en Stahlwerke Peine-Salzgitter AG betreffende
    de specialisatie van de walsstaalproduktie en een orderverdelingsinstantie voor
    staafstaal en walsdraad'
