id: EURegulation25632000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2563/2000 of 20 November 2000 amending Regulation
    (EC) No 2007/2000 by extending to the Former Yugoslav Republic of Macedonia and
    the Federal Republic of Yugoslavia the exceptional trade measures for countries
    and territories participating in or linked to the European Union's stabilisation
    and association process and amending Regulation (EC) No 2820/98
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2563/2000 du Conseil du 20 novembre 2000 modifiant
    le règlement (CE) nº 2007/2000 en étendant à l'ancienne République yougoslave
    de Macédoine et à la République fédérale de Yougoslavie les mesures commerciales
    exceptionnelles en faveur des pays et territoires participants et liés au processus
    de stabilisation et d'association mis en oeuvre par l'Union européenne, et modifiant
    le règlement (CE) nº 2820/98
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2563/2000 des Rates vom 20. November 2000 zur Änderung
    der Verordnung (EG) Nr. 2007/2000 durch Ausweitung der besonderen Handelsmaßnahmen
    für die am Stabilisierungs- und Assoziierungsprozess der Europäischen Union
    teilnehmenden oder damit verbundenen Länder und Gebiete auf die Ehemalige Jugoslawische
    Republik Mazedonien und die Bundesrepublik Jugoslawien sowie zur Änderung der
    Verordnung (EG) Nr. 2820/98
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2563/2000 на Съвета от 20 ноември
    2000 година за изменение на Регламент (ЕО) № 2007/2000
    относно разширяването с Бившата югославска
    република Македония и Съюзна република Югославия
    на изключителните търговски мерки в полза
    на страни и територии, участващи и свързани
    с процеса на стабилизация и асоцииране, осъществяван
    от Европейския съюз, и за изменение на Регламент
    (ЕО) № 2820/98
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2563/2000 ze dne 20. listopadu 2000, kterým
    se mění nařízení (ES) č. 2007/2000 tak, že se rozšiřuje platnost mimořádných
    obchodních opatření pro země a území účastnící se procesu stabilizace
    a přidružení zavedeného Evropskou unií či s tímto procesem spjaté na Bývalou
    jugoslávskou republiku Makedonii a Svazovou republiku Jugoslávii, a kterým
    se mění nařízení (ES) č. 2820/98
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2563/2000 af 20. november 2000 om ændring
    af forordning (EF) nr. 2007/2000 ved at lade Den Tidligere Jugoslaviske Republik
    Makedonien og Forbundsrepublikken Jugoslavien blive omfattet af de exceptionelle
    handelsforanstaltninger for lande og territorier, der deltager i eller er knyttet
    til Den Europæiske Unions stabiliserings- og associeringsproces, samt om ændring
    af forordning (EF) nr. 2820/98
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2563/2000 του Συμβουλίου,
    της 20ής Νοεμβρίου 2000, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2007/2000 με την επέκταση στην
    Πρώην Γιουγκοσλαβική Δημοκρατία της Μακεδονίας
    και την Ομοσπονδιακή Δημοκρατία της Γιουγκοσλαβίας
    εκτάκτων εμπορικών μέτρων για χώρες και εδάφη
    που συμμετέχουν ή συνδέονται με τη διαδικασία
    σταθεροποίησης και σύνδεσης της Ευρωπαϊκής
    Ένωσης και για την τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 2820/98
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 2563/2000, 20. november 2000, millega muudetakse
    määrust (EÜ) nr 2007/2000, laiendades endisele Jugoslaavia Makedoonia Vabariigile
    ja Jugoslaavia Liitvabariigile Euroopa Liidu stabiliseerimis- ja assotsieerimisprotsessis
    osalevate või sellega seotud maade ja territooriumide suhtes kehtivad erandlikud
    kaubandusmeetmed, ning muudetakse määrust (EÜ) nr 2820/98
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2563/2000, annettu 20 päivänä marraskuuta
    2000, asetuksen (EY) N:o 2007/2000 muuttamisesta ulottamalla Euroopan unionin
    vakautus- ja assosiaatioprosessiin osallistuviin tai siihen yhteydessä oleviin
    maihin ja alueisiin sovellettavat poikkeukselliset kaupan toimenpiteet koskemaan
    myös entistä Jugoslavian tasavaltaa Makedoniaa ja Jugoslavian liittotasavaltaa
    sekä asetuksen (EY) N:o 2820/98 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2563/2000/EK rendelete (2000. november 20.) a 2007/2000/EK rendeletnek
    az Európai Unió stabilizációs és társulási folyamatában részt vevő vagy
    ahhoz kapcsolódó országokra és területekre vonatkozó kivételes kereskedelmi
    intézkedéseknek Macedónia Volt Jugoszláv Köztársaságra és a Jugoszláv
    Szövetségi Köztársaságra való kiterjesztése tekintetében történő módosításáról
    és a 2820/98/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2563/2000 del Consiglio, del 20 novembre 2000, che
    modifica il regolamento (CE) n. 2007/2000, estendendo all'ex Repubblica iugoslava
    di Macedonia e alla Repubblica federale di Iugoslavia le misure commerciali eccezionali
    applicabili ai paesi e territori che partecipano o sono legati al processo di
    stabilizzazione e di associazione dell'Unione europea, e il regolamento (CE) n.
    2820/98
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2563/2000 (2000. gada 20. novembris), ar ko groza
    Regulu (EK) Nr. 2007/2000, attiecinot arī uz Bijušo Dienvidslāvijas Maķedonijas
    Republiku un Dienvidslāvijas Federatīvo Republiku īpašus tirdzniecības politikas
    pasākumus, kas attiecas uz tām valstīm un teritorijām, kuras piedalās Eiropas
    Savienības stabilizācijas un asociācijas procesā vai ir ar to saistītas,
    un ar ko groza Regulu (EK) Nr. 2820/98
  type: main
- language: lt
  script: Latn
  content: 2000 m. lapkričio 20 d. Tarybos reglamentas (EB) Nr. 2563/2000 iš dalies
    keičiantis Reglamentą (EB) Nr. 2007/2000 pradedant išimtines prekybos priemones,
    skirtas šalims ir teritorijoms, dalyvaujančioms Europos Sąjungos stabilizacijos
    ir asociacijos procese ar su juo susijusioms, taikyti Buvusiajai Jugoslavijos
    Respublikai Makedonijai ir Jugoslavijos Federacinei Respublikai bei iš dalies
    keičiantis Reglamentą (EB) Nr. 2820/98
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2563/2000 ta' l-20 ta' Novembru 2000
    li jemenda r-Regolament (KE) Nru 2007/2000 permezz ta' l-estenzjoni għall-ex
    Repubblika Jugoslava tal-Maċedonja u għar-Repubblika Federali tal-Jugoslavia
    tal-miżuri eċċezzjonali tan-negozju għall-pajjiżi u t-territorji li jipparteċipaw
    fi, jew marbuta ma' l-istabiliżazzjoni u l-proċess ta' assoċjazzjoni ta' l-Unjoni
    Ewropea u li jemenda r-Regolament (KE) Nru 2820/98
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2563/2000 van de Raad van 20 november 2000 tot wijziging
    van Verordening (EG) nr. 2007/2000 door uitbreiding tot de Voormalige Joegoslavische
    Republiek Macedonië en de Federale Republiek Joegoslavië van de uitzonderlijke
    handelsmaatregelen ten behoeve van de landen en gebieden die deelnemen aan of
    verbonden zijn met het stabilisatie- en associatieproces van de Europese Unie,
    en tot wijziging van Verordening (EG) nr. 2820/98
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) NR 2563/2000 z dnia 20 listopada 2000 r. zmieniające
    rozporządzenie (WE) nr 2007/2000 poprzez rozszerzenie na Byłą Jugosłowiańską
    Republikę Macedonii i Federalną Republikę Jugosławii nadzwyczajnych środków
    handlowych dla krajów i terytoriów uczestniczących lub powiązanych z procesem
    stabilizacji i stowarzyszania Unii Europejskiej oraz zmieniające rozporządzenie
    (WE) nr 2820/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2563/2000 do Conselho, de 20 de Novembro de 2000,
    que altera o Regulamento (CE) n.o 2007/2000, através da extensão à antiga República
    jugoslava da Macedónia e à República Federativa da Jugoslávia das medidas
    comerciais excepcionais em favor dos países e territórios que participam ou
    estão ligados ao processo de estabilização e de associação da União Europeia,
    e o Regulamento (CE) n.o 2820/98
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2563/2000 al Consiliului din 20 noiembrie 2000 de
    modificare a Regulamentului (CE) nr. 2007/2000 prin extinderea la Fosta Republică
    Iugoslavă a Macedoniei și la Republica Federală Iugoslavia a măsurilor comerciale
    excepționale în favoarea țărilor și teritoriilor participante și legate
    de procesul de stabilizare și asociere pus în aplicare de către Uniunea Europeană,
    și de modificare a Regulamentului (CE) nr. 2820/98
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2563/2000 z 20. novembra 2000, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 2007/2000 tak, že sa na bývalú Juhoslovanskú
    republiku Macedónsko a Federatívnu republiku Juhoslávia rozširujú mimoriadne
    obchodné opatrenia pre krajiny a územia zúčastňujúce sa alebo spojené s
    procesom stabilizácie a pridruženia k Európskej únii, a ktorým sa mení a
    dopĺňa nariadenie (ES) č. 2820/98
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2563/2000 z dne 20. novembra 2000 o spremembi Uredbe
    (ES) št. 2007/2000 z razširitvijo izrednih trgovinskih ukrepov za države in
    ozemlja, ki sodelujejo ali so povezani s stabilizacijsko-pridružitvenim procesom
    Evropske unije na Nekdanjo jugoslovansko republiko Makedonijo in Zvezno republiko
    Jugoslavijo in o spremembi Uredbe (ES) št. 2820/98
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2563/2000 del Consejo, de 20 de noviembre de 2000,
    que modifica el Reglamento (CE) nº 2007/2000 mediante la extensión a la Antigua
    República Yugoslava de Macedonia y a la República Federativa de Yugoslavia de
    las medidas comerciales excepcionales para los países y territorios participantes
    o vinculados al Proceso de estabilización y asociación de la Unión Europea,
    y por el que se modifica el Reglamento (CE) nº 2820/98
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2563/2000 av den 20 november 2000 om ändring
    av förordning (EG) nr 2007/2000 genom att låta f.d. jugoslaviska republiken
    Makedonien och Förbundsrepubliken Jugoslavien omfattas av de särskilda handelsåtgärder
    som gäller för länder och territorier som deltar i eller är knutna till Europeiska
    unionens stabiliserings- och associeringsprocess samt om ändring av förordning
    (EG) nr 2820/98
