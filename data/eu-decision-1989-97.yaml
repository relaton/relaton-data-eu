  content: '89/97/EEC: Commission Decision of 17 January 1989 amending for the fourth
    time Decision 82/351/EEC recognizing certain parts of the territory of the Federal
    Republic of Germany as being officially swine- fever free (Only the German text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/97/CEE: Décision de la Commission du 17 janvier 1989 portant quatrième
