title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1533/93 of 22 June 1993 laying down certain
    detailed rules under Council Regulation (EEC) No 1766/92 on the granting of export
    refunds on cereals and the measures to be taken in the event of disturbance on
    the market for cereals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1533/93 de la Commission du 22 juin 1993 établissant
    certaines modalités d'application du règlement (CEE) n° 1766/92 du Conseil
    en ce qui concerne l'octroi des restitutions à l'exportation ainsi que les mesures
    à prendre, en cas de perturbation, dans le secteur des céréales
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1533/93 DER KOMMISSION vom 22. Juni 1993 mit Durchführungsbestimmungen
    zur Verordnung (EWG) Nr. 1766/92 des Rates hinsichtlich der Gewährung von Ausfuhrerstattungen
    und zur Festlegung der bei Störungen im Getreidesektor zu treffenden Maßnahmen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1533/93 af 22. juni 1993 om visse gennemførelsesbestemmelser
    til Rådets forordning (EØF) nr. 1766/92 for så vidt angår ydelse af eksportrestitutioner
    for korn samt om de foranstaltninger, der skal træffes inden for kornsektoren
    i tilfælde af markedsforstyrrelser
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1533/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 22ας Ιουνίου 1993 περί θεσπίσεως ορισμένων
    λεπτομερών κανόνων εφαρμογής του κανονισμού
    (ΕΟΚ) αριθ. 1766/92 του Συμβουλίου όσον αφορά τη
    χορήγηση επιστροφών κατά την εξαγωγή καθώς
    και τα μέτρα τα οποία πρέπει να λαμβάνονται
    σε περίπτωση διαταραχής της αγοράς στον τομέα
    των σιτηρών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1533/93, annettu 22 päivänä kesäkuuta 1993,
    neuvoston asetuksen (ETY) N:o 1766/92 soveltamista koskevista tietyistä yksityiskohtaisista
    säännöistä vientitukien myöntämisen ja häiriötilanteessa toteutettavien
    toimenpiteiden osalta vilja-alalla
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1533/93 DELLA COMMISSIONE del 22 giugno 1993 che stabilisce
    modalità di applicazione del regolamento (CEE) n. 1766/92 del Consiglio in relazione
    alla concessione delle restituzioni all' esportazione e le misure da adottare
    in caso di turbative nel settore dei cereali
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1533/93 VAN DE COMMISSIE van 22 juni 1993 tot vaststelling
    van toepassingsbepalingen van Verordening (EEG) nr. 1766/92 van de Raad voor de
    toekenning, in de graansector, van uitvoerrestituties en van bij verstoring van
    de graanmarkt te treffen maatregelen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1533/93 DA COMISSÃO de 22 de Junho de 1993 que estabelece
    normas de execução do Regulamento (CEE) no 1766/92 do Conselho, no que diz respeito
    à concessão de restituições à exportação, bem como as medidas a tomar em
    caso de perturbação, no sector dos cereais
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1533/93 DE LA COMISIÓN de 22 de junio de 1993 por
    el que se establecen las disposiciones de aplicación del Regamento (CEE) no 1766/92
    del Consejo en lo que respecta a la concesión de las restituciones por exportación
    y las medidas que deben adoptarse en caso de perturbación en el sector de los
    cereales
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 1533/93 av den 22 juni 1993 om vissa
    närmare bestämmelser till rådets förordning (EEG) nr 1766/92 om beviljande
    av exportbidrag för spannmål och om de åtgärder som skall vidtas vid störningar
    på marknaden för spannmål
  type: main
