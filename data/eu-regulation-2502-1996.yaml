title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2502/96 of 23 December 1996 amending Regulations
    (EEC) No 2698/93 and (EC) No 1590/94 and fixing the quantities available in the
    pigmeat sector under the Community tariff quotas provided for in the Europe Agreements
    pursuant to Council Regulation (EC) No 3066/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2502/96 de la Commission du 23 décembre 1996 modifiant
    les règlements (CEE) nº 2698/93 et (CE) nº 1590/94, et fixant les quantités
    disponibles dans le secteur de la viande de porc, dans le cadre des contingents
    tarifaires communautaires prévus par les accords européens, conformément au
    règlement (CE) nº 3066/95 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2502/96 der Kommission vom 23. Dezember 1996 zur Änderung
    der Verordnungen (EWG) Nr. 2698/93 und (EG) Nr. 1590/94 sowie zur Festsetzung
    der im Sektor Schweinefleisch im Rahmen der in den Europa- Abkommen vorgesehenen
    gemeinschaftlichen Zollkontingente gemäß der Verordnung (EG) Nr. 3066/95 des
    Rates verfügbaren Mengen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 2502/96 af 23. december 1996 om ændring
    af forordning (EØF) nr. 2698/93 og (EF) nr. 1590/94 og om fastsættelse af de
    mængder, der er til rådighed i svinekødssektoren i forbindelse med de EF-toldkontingenter,
    der er fastsat i Europaaftalerne, jf. Rådets forordning (EF) nr. 3066/95
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2502/96 της Επιτροπής
    της 23ης Δεκεμβρίου 1996 για την τροποποίηση των
    κανονισμών (ΕΟΚ) αριθ. 2698/93 και (ΕΚ) αριθ. 1590/94
    και για τον καθορισμό των διαθέσιμων ποσοτήτων
    στον τομέα του χοιρείου κρέατος, στο πλαίσιο
    των κοινοτικών δασμολογικών ποσοστώσεων που
    προβλέπονται από τις ευρωπαϊκές συμφωνίες
    σύμφωνα με τον κανονισμό (ΕΚ) αριθ. 3066/95 του
    Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2502/96, annettu 23 päivänä joulukuuta 1996,
    asetusten (ETY) N:o 2698/93 ja (EY) N:o 1590/94 muuttamisesta ja sianliha-alalla
    käytettävissä olevien määrien vahvistamisesta Eurooppa-sopimuksissa määrättyjen
    yhteisön tariffikiintiöiden rajoissa neuvoston asetuksen (EY) N:o 3066/95 mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2502/96 della Commissione del 23 dicembre 1996 che
    modifica i regolamenti (CEE) n. 2698/93 e (CE) n. 1590/94 e fissa i quantitativi
    disponibili nel settore delle carni suine, nel quadro dei contingenti tariffari
    comunitari previsti dagli accordi europei in conformità del regolamento (CE)
    n. 3066/95 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2502/96 van de Commissie van 23 december 1996 houdende
    wijziging van de Verordeningen (EEG) nr. 2698/93 en (EG) nr. 1590/94 en vaststelling
    van de hoeveelheden die in de sector varkensvlees beschikbaar zijn in het kader
    van bij de Europa- Overeenkomsten vastgestelde communautaire tariefcontingenten,
    overeenkomstig Verordening (EG) nr. 3066/95 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2502/96 da Comissão de 23 de Dezembro de 1996 que
    altera os Regulamentos (CEE) nº 2698/93 e (CE) nº 1590/94 e fixa as quantidades
    disponíveis, no sector da carne de suíno, no âmbito dos contingentes pautais
    comunitários previstos pelos acordos europeus, em conformidade com o Regulamento
    (CE) nº 3066/95 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2502/96 de la Comisión de 23 de diciembre de 1996
    por el que se modifican los Reglamentos (CEE) nº 2698/93 y (CE) nº 1590/94 y
    se fijan las cantidades disponibles en el sector de la carne de porcino correspondientes
    a los contingentes arancelarios comunitarios establecidos en los Acuerdos europeos,
    de conformidad con el Reglamento (CE) nº 3066/95 del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2502/96 av den 23 december 1996 om ändring
