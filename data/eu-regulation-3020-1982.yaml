  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3020/82 der Kommission vom 12. November 1982 zur Genehmigung
    der zusätzlichen Säuerung bestimmter Erzeugnisse aus der Weinlese 1982 in den
    Gebieten mit der kontrollierten Ursprungsbezeichnung Châteauneuf-du-Pape und
    Gigondas
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3020/82 af 12. november 1982 om tilladelse
    til at foretage ekstra tilsætning af syre til visse produkter fra 1982-vinhøsten
    i området for den kontrollerede oprindelsesbetegnelse Châteauneuf-du-Pape og
