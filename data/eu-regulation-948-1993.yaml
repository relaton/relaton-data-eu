    de carne de bovino fresca, refrigerada ou congelada, apresentados em Abril de
    1993 ao abrigo dos regimes de importação previstos nos acordos provisórios
    concluídos pela Comunidade com a República da Polónia, a República da Hungria
    e a República Federativa Checa e Eslovaca (RFCE)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 948/93 de la Comisión, de 22 de abril de 1993, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de carne fresca, refrigerada o congelada de vacuno presentadas
    en abril de 1993 al amparo de los regímenes de importación establecidos en los
    Acuerdos interinos celebrados entre la Comunidad y la República de Polonia, la
    República de Hungría y la República Federativa Checa y Eslovaca (RFCE)
