    zur Aufstellung einer Liste von Drittländern, aus denen die Mitgliedstaaten Einfuhren
    von Rindern, Schweinen, Einhufern, Schafen und Ziegen sowie von frischem Fleisch
    und Fleischerzeugnissen zulassen, und zur Aufhebung der Entscheidung 1999/301/EG
    (Bekanntgegeben unter Aktenzeichen K(2000) 412)'
  type: main
