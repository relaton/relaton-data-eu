  script: Latn
  content: '2000/136/EC: Commission Decision of 16 February 2000 amending Commission
    Decision 2000/2/EC amending Council Decision 79/542/EEC drawing up a list of third
    countries from which the Member States authorise imports of bovine animals, swine,
    equidae, sheep and goats, fresh meat and meat products and repealing Decision
    1999/301/EC (notified under document number C(2000) 412)'
  type: main
- language: fr
  script: Latn
  content: '2000/136/CE: Décision de la Commission, du 16 février 2000, modifiant
    la décision 2000/2/CE modifiant la décision 79/542/CEE du Conseil établissant
    une liste des pays tiers en provenance desquels les États membres autorisent
    l''importation d''animaux des espèces bovine, porcine, équine, ovine et caprine,
    de viandes fraîches et de produits à base de viande et abrogeant la décision
    1999/301/CE [notifiée sous le numéro C(2000) 412]'
  type: main
- language: de
  script: Latn
