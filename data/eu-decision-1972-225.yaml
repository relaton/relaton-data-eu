title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 25 mai 1972, autorisant la République française
    à exclure du traitement communautaire les asperges préparés ou conserves sans
    vinaigre ou acide acétique, de la position 20.02 D du Tarif douanier commun,
    originaires de Taiwan et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/225/EWG: Entscheidung der Kommission vom 25. Mai 1972, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Spargel, ohne Essig zubereitet
    oder haltbar gemacht, der Tarifnummer 20.02 D des Gemeinsamen Zolltarifs von der
    Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/225/CEE: Decisione della Commissione, del 25 maggio 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli asparagi preparati
    o conservati senza aceto o acido acetico della voce 20.02 D della tariffa doganale
    comune, originari di Taïwan e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/225/EEG: Beschikking van de Commissie van 25 mei 1972 waarbij de Franse
    Republiek wordt gemachtigd asperges, bereid of verduurzaamd zonder azijn of azijnzuur
    van post 20.02 D van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
