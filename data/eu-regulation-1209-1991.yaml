title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1209/91 of 6 May 1991 re- establishing the
    levying of customs duties on products falling within CN codes 6404 and 6405 90
    10, originating in Thailand, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1209/91 DE LA COMMISSION du 6 mai 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC 6404
    et 6405 90 10, originaires de la Thaïlande, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1209/91 DER KOMMISSION vom 6. Mai 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 6404 und 6405 90 10 mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1209/91 af 6. maj 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 6404 og 6405 90 10
    og med oprindelse i Thailand, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1209/91 της Επιτροπής
    της 6ης Μαΐου 1991 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για προϊόντα των κωδικών
    ΣΟ 6404 και 6405 90 10, καταγωγής Ταϊλάνδης, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1209/91 DELLA COMMISSIONE del 6 maggio 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti dei codici NC 604 e 6405
    90 10, originari della Tailandia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1209/91 VAN DE COMMISSIE van 6 mei 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op produkten van
    de GN-codes 6404 en 6405 90 10, van oorsprong uit Thailand, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1209/91 DA COMISSÃO de 6 de Maio de 1991 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos dos códigos NC 6404
