title:
- language: en
  script: Latn
  content: '78/952/EEC: Commission Decision of 3 November 1978 on the granting by
    the Guidance Section of the EAGGF to the French Republic of a payment on account
    in respect of expenditure incurred during 1977 on annuities relating to measures
    to encourage the cessation of farming and the reallocation of utilized agricultural
    area for the purpose of structural improvement'
  type: main
- language: fr
  script: Latn
  content: '78/952/CEE: Décision de la Commission, du 3 novembre 1978, relative au
    versement par le Fonds européen d'' orientation et de garantie agricole, section
    "orientation" à la République française d'' un acompte sur les dépenses effectuées
    pendant l'' année 1977 pour les indemnités relatives à l'' encouragement de
    la cessation de l'' activité agricole et à l'' affectation de la superficie
    agricole utilisée à des fins d'' amélioration des structures'
  type: main
- language: de
  script: Latn
  content: '78/952/EWG: Entscheidung der Kommission vom 3. November 1978 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, fúr die im Jahr
    1977 zur Fórderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Fláchen fúr Zwecke der Strukturverbesserung
    getátigten Ausgaben an die Franzósische Republik'
  type: main
- language: da
  script: Latn
  content: '78/952/EØF: Kommissionens beslutning af 3. november 1978 om udbetaling
    gennem EUGFL, udviklingssektionen, til Den franske Republik af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1977 til godtgørelse vedrørende
    støtte til ophør af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal
    til strukturforbedringsformål'
  type: main
- language: it
  script: Latn
  content: '78/952/CEE: Decisione della Commissione, del 3 novembre 1978, relativa
    al versamento da parte del FEAOG, sezione orientamento, alla Repubblica francese
    di un anticipo sulle spese effettuate durante il 1977 per le indennità concernenti
    l'' incoraggiamento alla cessazione dell'' attività agricola e alla destinazione
    della superficie agricola utilizzata a scopi di miglioramento delle strutture'
  type: main
- language: nl
  script: Latn
  content: '78/952/EEG: Beschikking van de Commissie van 3 november 1978 inzake de
    betaling door het EOGFL, afdeling Oriëntatie, aan de Franse Republiek van een
