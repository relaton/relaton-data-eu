    αντιντάμπινγκ όσον αφορά τις Δημοκρατίες της
    Σερβίας και του Μαυροβουνίου, την πρώην Γιουγκοσλαβική
    Δημοκρατία της Μακεδονίας, τη Δημοκρατία της
    Βοσνίας-Ερζεγοβίνης και τη Δημοκρατία της
    Σλοβενίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3296/92 della Commissione, del 12 novembre 1992, che
    istituisce un dazio antidumping provvisorio sulle importazioni di alcuni tipi
    di tubi senza saldatura, di ferro o di acciai non legati, originari dell' Ungheria,
    della Polonia, della Cecoslovacchia e della Repubblica di Croazia e che chiude
    il procdimento antidumping per quanto riguarda le Repubbliche di Serbia e Montenegro,
    l' ex Repubblica iugoslava di Macedonia, la Repubblica di Bosnia-Erzegovina e
    la Repubblica di Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3296/92 van de Commissie van 12 november 1992 tot
    instelling van een voorlopig anti- dumpingrecht op de invoer van bepaalde naadloze
    buizen en pijpen, van ijzer of van niet-gelegeerd staal, van oorsprong uit Hongarije,
    Polen, Tsjechoslowakije en de Republiek Kroatië en tot beëindiging van de anti-dumpingprocedure
    ten aanzien van de voormalige Joegoslavische Republieken Macedonië, Montenegro
    en Servië, de Republiek Bosnië- Herzegovina en de Republiek Slovenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3296/92 da Comissão, de 12 de Novembro de 1992,
    que cria um direito anti-dumping provisório sobre as importações de certos
    tubos, sem costura, de ferro ou de aço não ligado, originários da Hungria,
    da Polónia, da Checoslováquia e da República da Croácia e que encerra o processo
    anti-dumping no que respeita às repúblicas do Montenegro e da Sérvia, à antiga
    República Jugoslava da Macedónia, à República da Bósnia-Herzegovina e à
    República da Eslovénia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3296/92 de la Comisión, de 12 de noviembre de 1992,
    por el que se establece un derecho antidumping provisional sobre las importaciones
    de determinados tubos sin soldatura, de hierro o acero no aleado, originarios
    de Hungría, Polonia, Checoslovaquia y la República de Croacia y por el que se
    da por concluido el procedimiento antidumping relativo a las Repúblicas de Serbia
    y Montenegro, la antigua República yugoslava de Macedonia, la República de Bosnia-Herzegovina
    y la República de Eslovenia
