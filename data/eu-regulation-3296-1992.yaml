title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3296/92 of 12 November 1992 imposing a provisional
    anti-dumping duty on imports of certain seamless pipes and tubes, of iron or non-alloy
    steel, originating in Czechoslovakia, Hungary, Poland and the Republic of Croatia
    and terminating the anti-dumping proceeding with regard to the Republics of Serbia
    and of Montenegro, the former Yugoslav Republic of Macedonia, the Republic of
    Bosnia-Herzegovina and the Republic of Slovenia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3296/92 de la Commission, du 12 novembre 1992, instituant
    un droit antidumping provisoire sur les importations de certains tubes et tuyaux
    sans soudure, en fer ou en acier non allié, originaires de Hongrie, de Pologne,
    de Tchécoslovaquie et de la République de Croatie, et clôturant la procédure
    antidumping en ce qui concerne les importations des Républiques du Monténégro
    et de Serbie, de l'ancienne République yougoslave de Macédoine, ainsi que de
    la République de Bosnie-Herzégovine et de la République de Slovénie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3296/92 der Kommission vom 12. November 1992 zur Einführung
    eines vorläufigen Antidumpingzolls auf die Einfuhren bestimmter nahtloser Rohre
    aus Eisen oder nichtlegiertem Stahl mit Ursprung in Kroatien, Polen, der Tschechoslowakei
    und Ungarn und zur Einstellung des Antidumpingverfahrens gegenüber den jugoslawischen
    Republiken Mazedonien, Montenegro und Serbien sowie Bosnien-Herzegowina und Slowenien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3296/92 af 12. november 1992 om indførelse
    af en midlertidig antidumpingtold på importen af sømløse rør af jern eller
    ulegeret stål med oprindelse i Ungarn, Polen, Tjekkoslovakiet og Republikken
    Kroatien og om afslutning af antidumpingproceduren vedrørende Republikken Serbien
    og Montenegro, den tidligere jugoslaviske republik Makedonien, Republikken Bosnien-Hercegovina
    og Republikken Slovenien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3296/92 της Επιτροπής
    της 12ης Νοεμβρίου 1992 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    σωλήνων κάθε είδους χωρίς συγκόλληση, από σίδηρο
    ή μη κραματοποιημένο χάλυβα, καταγωγής Ουγγαρίας,
    Πολωνίας, Τσεχοσλοβακίας και της Δημοκρατίας
