title:
- language: fr
  script: Latn
  content: Règlement n 115/66/CEE du Conseil, du 28 juillet 1966, concernant les
    mesures à appliquer dans le domaine des prix par les États membres producteurs
    et portant fixation des prix de seuil communs des États membres non-producteurs,
    pour le riz et les brisures pendant la campagne 1966/1967
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 115/66/EWG des Rates vom 28. Juli 1966 über die von den
    Erzeugermitgliedstaaten anzuwendenden MaDnahmen auf dem Gebiet der Preise und
    über die Festsetzung der gemeinsamen Schwellenpreise der Mitgliedstaaten ohne
    eigene Erzeugung für Reis und Bruchreis für das Wirtschaftsjahr 1966/1967
  type: main
- language: it
  script: Latn
  content: Regolamento n. 115/66/CEE del Consiglio, del 28 luglio 1966, relativo alle
    misure che devono essere applicate nel settore dei prezzi da parte degli Stati
    membri produttori e alla fissazione dei prezzi d'entrata comuni degli Stati membri
    non produttori, per il riso e le rotture di riso per la campagna 1966/67
  type: main
- language: nl
  script: Latn
  content: Verordening no. 115/66/EEG van de Raad van 28 juli 1966 inzake de met betrekking
    tot de prijzen door de producerende Lid-Staten toe te passen maatregelen en houdende
    vaststelling van de gemeenschappelijke drempelprijzen van de niet-producerende
    Lid-Staten voor rijst en breukrijst voor het verkoopseizoen 1966/1967
  type: main
