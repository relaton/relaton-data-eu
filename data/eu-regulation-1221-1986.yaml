title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1221/86 of 25 April 1986 re-establishing
    the levying of customs duties on other fish-hooks, line fishing, rods and tackle
    and certain hunting articles, falling within subheading 97.07 B, originating in
    South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1221/86 de la Commission du 25 avril 1986 portant
    rétablissement de la perception des droits de douane applicables aux autres hameçons
    et épuisettes et certains articles de chasse, de la sous-position 97.07 B du
    tarif douanier commun, originaires de la Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1221/86 der Kommission vom 25. April 1986 zur Wiedereinführung
    der Erhebung der Zölle für andere Angelhaken, Angelgeräte und bestimmte Jagdgeräte
    der Tarifstelle 97.07 B des Gemeinsamen Zolltarifs mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1221/86 af 25. april 1986 om genindførelse
    af opkrævning af told for andre fiskekroge, fiskestænger, lokkefugle og lignende
    varer, henhørende under position 97.07 B og med oprindelse i Sydkorea som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1221/86 της Επιτροπής
