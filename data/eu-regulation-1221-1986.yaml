    κανονισμό (ΕΟΚ) αριθ. 3599/85 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1221/86 della Commissione del 25 aprile 1986 che ripristina
    la riscossione dei dazi doganali applicabili agli altri ami e piccole reti e taluni
    articoli per la caccia della sottovoce 97.07 B della tariffa doganale comune originari
    della Corea del Sud beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1221/86 van de Commissie van 25 april 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere vishaken
    en schepnetjes, sommige jachtbenodigdheden, van postonderverdeling 97.07 B van
    het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea, waarvoor de
    in Verordening (EEG) nr. 3599/85 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1221/86 da Comissão de 25 de Abril de 1986 que
