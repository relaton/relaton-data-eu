---
id: EURegulation2019724
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/724 of 10 May 2019 amending
    Implementing Regulation (EU) No 686/2012 as regards the nomination of rapporteur
    Member States and co-rapporteur Member States for the active substances glyphosate,
    lambda-cyhalothrin, imazamox and pendimethalin and amending Implementing Regulation
    (EU) No 844/2012 as regards the possibility that a group of Member States assumes
    jointly the role of the rapporteur Member State
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/724 de la Commission du 10 mai 2019 modifiant
    le règlement d'exécution (UE) n° 686/2012 en ce qui concerne la désignation
    des États membres rapporteurs et corapporteurs pour les substances actives «glyphosate»,
    «lambda-cyhalothrine», «imazamox» et «pendiméthaline» et modifiant le règlement
    d'exécution (UE) n° 844/2012 en ce qui concerne la possibilité pour un groupe
    d'États membres d'assumer conjointement le rôle d'État membre rapporteur
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/724 der Kommission vom 10. Mai 2019
    zur Änderung der Durchführungsverordnung (EU) Nr. 686/2012 hinsichtlich der
    Benennung von berichterstattenden und mitberichterstattenden Mitgliedstaaten für
    die Wirkstoffe Glyphosat, Lambda-Cyhalothrin, Imazamox und Pendimethalin sowie
    zur Änderung der Durchführungsverordnung (EU) Nr. 844/2012 hinsichtlich einer
    möglichen gemeinsamen Übernahme der Rolle des berichterstattenden Mitgliedstaats
    durch eine Gruppe von Mitgliedstaaten
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/724 на Комисията
    от 10 май 2019 година за изменение на Регламент
    за изпълнение (ЕС) № 686/2012 по отношение на определянето
    на държавите членки докладчици и държавите
    членки съдокладчици за активните вещества
    глифосат, ламбда-цихалотрин, имазамокс и пендиметалин
    и за изменение на Регламент за изпълнение (ЕС)
    № 844/2012 по отношение на възможността група
    държави членки да изпълняват съвместно ролята
    на държава членка докладчик
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/724 ze dne 10. května 2019,
    kterým se mění prováděcí nařízení (EU) č. 686/2012, pokud jde o jmenování
    zpravodajských a spoluzpravodajských členských států pro účinné látky
    glyfosát, lambda-cyhalothrin, imazamox a pendimethalin, a kterým se mění prováděcí
    nařízení (EU) č. 844/2012, pokud jde o možnost, že skupina členských států
    společně převezme úlohu členského státu zpravodaje
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/724 af 10. maj 2019 om
    ændring af gennemførelsesforordning (EU) nr. 686/2012 for så vidt angår udpegelsen
    af rapporterende medlemsstater og medrapporterende medlemsstater for aktivstofferne
    glyphosat, lambda-cyhalotrin, imazamox og pendimethalin og om ændring af gennemførelsesforordning
    (EU) nr. 844/2012 for så vidt angår muligheden for, at en gruppe af medlemsstater
    i fællesskab kan fungere som rapporterende medlemsstat
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2019/724 της Επιτροπής,
    της 10ης Μαΐου 2019, για την τροποποίηση του εκτελεστικού
    κανονισμού (ΕΕ) αριθ. 686/2012 όσον αφορά τον διορισμό
    των κρατών μελών-εισηγητών και των κρατών μελών-συνεισηγητών
    για τις δραστικές ουσίες γλυφοσάτη, λ-κυαλοθρίνη,
    imazamox και pendimethalin και την τροποποίηση του εκτελεστικού
    κανονισμού (ΕΕ) αριθ. 844/2012 όσον αφορά τη δυνατότητα
    από κοινού ανάληψης του ρόλου του κράτους μέλους-εισηγητή
    από ομάδα κρατών μελών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2019/724, 10. mai 2019, millega muudetakse
    rakendusmäärust (EL) nr 686/2012 seoses referentliikmesriikide ja kaasreferentliikmesriikide
    nimetamisega toimeainete glüfosaadi, lambda-tsühalotriini, imasamoksi ja pendimetaliini
    jaoks ning muudetakse rakendusmäärust (EL) nr 844/2012 seoses võimalusega,
    et liikmesriikide rühm võtab ühiselt referentliikmesriigi rolli
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2019/724, annettu 10 päivänä
    toukokuuta 2019, täytäntöönpanoasetuksen (EU) N:o 686/2012 muuttamisesta siltä
    osin kuin on kyse esittelevien jäsenvaltioiden ja rinnakkaisesittelijöinä toimivien
    jäsenvaltioiden nimeämisestä tehoaineita glyfosaatti, lambda-syhalotriini,
    imatsamoksi ja pendimetaliini varten sekä täytäntöönpanoasetuksen (EU) N:o
    844/2012 muuttamisesta siltä osin kuin on kyse mahdollisuudesta, että ryhmä
    jäsenvaltioita hoitaa yhteisesti esittelevän jäsenvaltion tehtävän
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/724 оd 10. svibnja 2019. o izmjeni
    Provedbene uredbe (EU) br. 686/2012 u pogledu imenovanja država članica izvjestiteljica
    i država članica suizvjestiteljica za aktivne tvari glifosat, lambda-cihalotrin,
    imazamoks i pendimetalin te o izmjeni Provedbene uredbe (EU) br. 844/2012 u pogledu
    mogućnosti da skupina država članica zajednički preuzme ulogu države članice
    izvjestiteljice
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/724 végrehajtási rendelete (2019. május 10.)
    a 686/2012/EU végrehajtási rendeletnek a glifozát, a lambda-cihalotrin, az
    imazamox és a pendimetalin hatóanyag értékelésére kijelölendő jelentéstevő
    tagállamok és társjelentéstevő tagállamok tekintetében történő módosításáról,
    valamint a 844/2012/EU végrehajtási rendeletnek a jelentéstevő tagállam szerepének
    a tagállamok egy csoportja általi betöltésére vonatkozó lehetőség tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/724 della Commissione, del 10 maggio
    2019, che modifica il regolamento di esecuzione (UE) n. 686/2012 per quanto riguarda
    la nomina degli Stati membri relatori e degli Stati membri correlatori per le
    sostanze attive glifosato, lambda-cialotrina, imazamox e pendimetalin e che modifica
    il regolamento di esecuzione (UE) n. 844/2012 per quanto riguarda la possibilità
    che un gruppo di Stati membri assuma congiuntamente il ruolo di Stato membro relatore
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/724 (2019. gada 10. maijs), ar
    ko attiecībā uz darbīgo vielu glifosāta, lambda-cihalotrīna, imazamoksa un
    pendimetalīna ziņotāju dalībvalstu un otro ziņotāju dalībvalstu iecelšanu
    groza Īstenošanas regulu (ES) Nr. 686/2012 un attiecībā uz iespēju dalībvalstu
    grupai kopīgi uzņemties ziņotājas dalībvalsts uzdevumus groza Īstenošanas
    regulu (ES) Nr. 844/2012
  type: main
- language: lt
  script: Latn
  content: 2019 m. gegužės 10 d. Komisijos įgyvendinimo reglamentas (ES) 2019/724,
    kuriuo dėl valstybių narių skyrimo ataskaitas dėl veikliųjų medžiagų glifosato,
    lambda cihalotrino, imazamokso ir pendimetalino rengiančiomis ir bendrai rengiančiomis
    valstybėmis narėmis iš dalies keičiamas Įgyvendinimo reglamentas (ES) Nr.
    686/2012 ir kuriuo dėl valstybių narių grupės galimybės bendrai atlikti ataskaitą
    rengiančios valstybės narės funkcijas iš dalies keičiamas Įgyvendinimo reglamentas
    (ES) Nr. 844/2012
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/724 tal-10 ta'
    Mejju 2019 li jemenda r-Regolament ta' Implimentazzjoni (UE) Nru 686/2012 fir-rigward
    tan-nominazzjoni ta' Stati Membri relaturi u Stati Membri korelaturi għas-sustanzi
    attivi glifosfat, lambda ċjalotrina, imażamoks u pendimetalina u jemenda r-Regolament
    ta' Implimentazzjoni (UE) Nru 844/2012 fir-rigward tal-possibbiltà li grupp ta'
    Stati Membri jassumu b'mod konġunt ir-rwol ta' Stat Membru relatur
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/724 van de Commissie van 10 mei 2019 tot
    wijziging van Uitvoeringsverordening (EU) nr. 686/2012 wat betreft de aanwijzing
    van lidstaten-rapporteurs en lidstaten-corapporteurs voor de werkzame stoffen
    glyfosaat, lambda-cyhalothrin, imazamox en pendimethalin en tot wijziging van
    Uitvoeringsverordening (EU) nr. 844/2012 wat betreft de mogelijkheid dat een groep
    lidstaten gezamenlijk de taak van lidstaat-rapporteur op zich neemt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/724 z dnia 10 maja 2019 r.
    zmieniające rozporządzenie wykonawcze (UE) nr 686/2012 w odniesieniu do wyznaczenia
    państw członkowskich pełniących rolę sprawozdawców i państw członkowskich
    pełniących rolę współsprawozdawców w związku z substancjami czynnymi glifosat,
    lambda-cyhalotryna, imazamoks i pendimetalin oraz zmieniające rozporządzenie
    wykonawcze (UE) nr 844/2012 w odniesieniu do możliwości, by grupa państw członkowskich
    wspólnie pełniła funkcję państwa członkowskiego pełniącego rolę sprawozdawcy
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/724 da Comissão, de 10 de maio de
    2019, que altera o Regulamento de Execução (UE) n.° 686/2012 no que diz respeito
    à designação de Estados-Membros relatores e de Estados-Membros correlatores
    para as substâncias ativas glifosato, lambda-cialotrina, imazamox e pendimetalina
    e que altera o Regulamento de Execução (UE) n.° 844/2012 no que diz respeito
    à possibilidade de um grupo de Estados-Membros assumir conjuntamente o papel
    de Estado-Membro relator
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/724 al Comisiei din 10 mai
    2019 de modificare a Regulamentului de punere în aplicare (UE) nr. 686/2012 în
    ceea ce privește numirea statelor membre raportoare și a statelor membre coraportoare
    pentru substanțele active glifosat, lambda-cihalotrin, imazamox și pendimetalin
    și de modificare a Regulamentului de punere în aplicare (UE) nr. 844/2012 în
    ceea ce privește posibilitatea ca un grup de state membre să își asume împreună
    rolul de stat membru raportor
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/724 z 10. mája 2019, ktorým
    sa mení vykonávacie nariadenie (EÚ) č. 686/2012, pokiaľ ide o určenie spravodajských
    členských štátov a spoluspravodajských členských štátov v prípade účinných
    látok glyfozát, lambda-cyhalotrín, imazamox a pendimetalín a ktorým sa mení
    vykonávacie nariadenie (EÚ) č. 844/2012, pokiaľ ide o možnosť, že úlohu
    spravodajského členského štátu spoločne prevezme skupina členských štátov
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/724 z dne 10. maja 2019 o spremembi
    Izvedbene uredbe (EU) št. 686/2012 glede imenovanja držav članic poročevalk
    in držav članic soporočevalk za aktivne snovi glifosat, lambda-cihalotrin,
    imazamoks in pendimetalin ter o spremembi Izvedbene uredbe (EU) št. 844/2012
    glede možnosti, da skupina držav članic skupaj prevzame vlogo države članice
    poročevalke
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/724 de la Comisión, de 10 de mayo de
    2019, por el que se modifica el Reglamento de Ejecución (UE) n.° 686/2012 en
    lo que respecta a la designación de Estados miembros ponentes y Estados miembros
    coponentes para las sustancias activas glifosato, lambdacihalotrina, imazamox
    y pendimetalina y por el que se modifica el Reglamento de Ejecución (UE) n.°
    844/2012 en lo que respecta a la posibilidad de que un grupo de Estados miembros
    asuma conjuntamente el papel del Estado miembro ponente
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2019/724 av den 10 maj 2019
    om ändring av genomförandeförordning (EU) nr 686/2012 vad gäller utseendet
    av rapporterande medlemsstater och medrapporterande medlemsstater för de verksamma
    ämnena glyfosat, lambda-cyhalotrin, imazamox och pendimetalin, och om ändring
    av genomförandeförordning (EU) nr 844/2012 vad gäller möjligheten för en
    grupp medlemsstater att gemensamt fungera som rapporterande medlemsstat
  type: main
