    Präferenzzolls und zur Wiedereinführung des Zolls des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 394/1999 af 23. februar 1999 om suspension
    af præferencetolden og genindførelse af tolden ifølge den fælles toldtarif
    ved indførsel af storblomstrede roser med oprindelse i Marokko
  type: main
- language: el
  script: Grek
