title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 394/1999 of 23 February 1999 suspending the
    preferential customs duties and re-establishing the Common Customs Tariff duty
    on imports of large-flowered roses originating in Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 394/1999 de la Commission du 23 février 1999 suspendant
