    ja yhteisen tullitariffin tullin uudelleen käyttöön ottamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 394/1999 della Commissione del 23 febbraio 1999 che
    sospende il dazio doganale preferenziale e ripristina il dazio della tariffa doganale
    comune all'importazione di rose a fiore grande originarie del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 394/1999 van de Commissie van 23 februari 1999 tot
    schorsing van het preferentiële douanerecht en tot wederinvoering van het recht
