    soveltamissäännöistä annetun asetuksen (ETY) N:o 2179/92 muuttamisesta ja
    neuvoston asetuksen (EY) N:o 1454/2001 mukauttamisesta yhdistetyn nimikkeistön
    koodien osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1195/2002/EK rendelete (2002. július 3.) a Kanári-szigetekre
