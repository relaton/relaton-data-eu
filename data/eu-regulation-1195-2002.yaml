    suhtes, tunnistatakse kehtetuks määrus (EMÜ) nr 2179/92 ja kohandatakse nõukogu
    määrust (EÜ) nr 1454/2001 koondnomenklatuuri koodide osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1195/2002, annettu 3 päivänä heinäkuuta 2002,
