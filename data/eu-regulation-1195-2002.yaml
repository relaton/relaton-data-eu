    vidt angår tobak, om ophævelse af forordning (EØF) nr. 2179/92 og om tilpasning
    af Rådets forordning (EF) nr. 1454/2001 for så vidt angår den kombinerede nomenklatur
  type: main
- language: el
  script: Grek
