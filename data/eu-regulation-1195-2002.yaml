    a favor das ilhas Canárias no respeitante ao tabaco, que revoga o Regulamento
    (CEE) n.° 2179/92 e adapta o Regulamento (CE) n.° 1454/2001 do Conselho no que
    respeita aos códigos da Nomenclatura Combinada
  type: main
