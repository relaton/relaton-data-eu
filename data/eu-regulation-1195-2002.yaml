title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1195/2002 of 3 July 2002 laying down detailed
    rules for applying the specific import measures for the Canary Islands as regards
    tobacco, repealing Regulation (EEC) No 2179/92 and adapting Council Regulation
    (EC) No 1454/2001 as regards the codes of the Combined Nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1195/2002 de la Commission du 3 juillet 2002 portant
    modalités d'application des mesures spécifiques à l'importation en faveur des
    îles Canaries en ce qui concerne le tabac, abrogeant le règlement (CEE) n°
    2179/92 et adaptant le règlement (CE) n° 1454/2001 du Conseil en ce qui concerne
    les codes de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1195/2002 der Kommission vom 3. Juli 2002 mit Durchführungsbestimmungen
    zu den Sondermaßnahmen für die Kanarischen Inseln bei der Einfuhr von Tabak,
    zur Aufhebung der Verordnung (EWG) Nr. 2179/92 und zur Anpassung der Verordnung
    (EG) Nr. 1454/2001 des Rates hinsichtlich der Codes der Kombinierten Nomenklatur
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1195/2002 ze dne 3. července 2002, kterým
