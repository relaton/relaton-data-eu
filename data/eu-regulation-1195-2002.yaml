    ostrovy, pokud jde o tabák, kterým se zrušuje nařízení (EHS) č. 2179/92
    a upravuje nařízení Rady (ES) č. 1454/2001, pokud jde o kódy kombinované
    nomenklatury
  type: main
- language: da
  script: Latn
