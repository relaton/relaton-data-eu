title:
- language: en
  script: Latn
  content: '81/124/EEC: Commission Decision of 13 February 1981 authorizing the French
    Republic to introduce intra- Community surveillance of imports of sheep and goats
    and of sheepmeat and goatmeat originating in Bulgaria, Hungary, Poland and Romania
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/124/CEE: Décision de la Commission, du 13 février 1981, autorisant
    la République française à instaurer une surveillance intracommunautaire des
    importations des animaux de l''espèce ovine et des viandes ovine et caprine originaires
    de Bulgarie, de Hongrie, de Pologne et de Roumanie (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/124/EWG: Entscheidung der Kommission vom 13. Februar 1981, mit der
    die Französische Republik ermächtigt wird, eine innergemeinschaftliche Überwachung
    der Einfuhren von lebenden Schafen und Ziegen sowie von Fleisch von Schafen und
    Ziegen mit Ursprung in Bulgarien, Polen, Rumänien und Ungarn einzurichten (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/124/EØF: Kommissionens beslutning af 13. februar 1981 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med importen
    af får og geder og kød af får og geder med oprindelse i Bulgarien, Ungarn,
    Polen og Rumænien (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/124/ΕΟΚ: Απόφαση τής Επιτροπής τής 13ης
    Φεβρουαρίου 1981 περί παροχής αδείας στή Γαλλική
    Δημοκρατία νά καθιερώσει ενδοκοινοτική επίβλεψη
    τών εισαγωγών προβατοειδών καί αιγοειδών ζώων
    καθώς καί τού προβείου καί αιγείου κρέατος
    πού προέρχονται από τή Βουλγαρία, τήν Ουγγαρία,
    τήν Πολωνία καί τή Ρουμανία (Το κείμενο στην
    γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/124/CEE: Decisione della Commissione, del 13 febbraio 1981, che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di animali delle specie ovina e caprina e di carni ovine e caprine originarie
    della Bulgaria, dell''Ungheria, della Polonia e della Romania (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/124/EEG: Beschikking van de Commissie van 13 februari 1981 waarbij
    de Franse Republiek wordt gemachtigd intracommunautair toezicht in te stellen
    op de invoer van schapen en geiten en schape- en geitevlees van oorsprong uit
    Bulgarije, Hongarije, Polen en Roemenië (Slechts de tekst in de Franse taal is
    authentiek)'
  type: main
