id: EUDecision1976928
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 November 1976 authorizing the Italian Republic
    not to apply Community treatment to dyed woven fabrics of cotton, other than gauze
    or terry towelling and similar terry fabrics, falling within heading No ex 55.09
    of the Common Customs Tariff, originating in Japan and in free circulation in
    the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/928/CEE: Décision de la Commission, du 22 novembre 1976, autorisant
    la République italienne à exclure du traitement communautaire les tissus de
    coton autres qu''à point de gaze ou boucles du genre éponge, teints, de la position
    Ex 55.09 du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. November 1976, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus Baumwolle, andere als Drehergewebe oder
    Schlingengewebe (Frottiergewebe), gefärbt, der Tarifnummer ex 55.09 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. november 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage vævet stof af bomuld med undtagelse
    af drejervævet stof eller håndklædefrottérstof og lignende frottérstof af
    bomuld, farvet, som henhører under position ex 55.09 i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 novembre 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di cotone diversi
    da quelli a punto di garza o ricci del tipo spugna, tinti, della voce ex 55.09
    della tariffa doganale comune, originari del Giappone e messi in libera pratica
    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 november 1976 waarbij de Italiaanse
    Republiek wordt gemachtigd weefsels van katoen, andere dan met gaasbinding of
    dan bad- of frotteerstof (lussendoek), geverfd, van post ex 55.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
