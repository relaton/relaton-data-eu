title:
- language: fr
  script: Latn
  content: Décision 65/513/CEE de la Commission, du 12 novembre 1965, relative au
    recours de la République fédérale d'Allemagne à l'article 115 alinéa 1 du
    Traité, pour exclure du traitement communautaire "les tapis à points noués
    ou enroulés, même confectionnés", originaires de l'URSS, et mis en libre pratique
    dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '65/513/EWG: Entscheidung der Kommission vom 12. November 1965 über den
    Antrag der Bundesrepublik Deutschland gemäß Artikel 115 Absatz (1) des Vertrages,
    um "geknüpfte Teppiche, auch fertiggestellt", die aus der UdSSR stammen und sich
    in den übrigen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/513/CEE: Decisione della Commissione, del 12 novembre 1965, relativa
    al ricorso della Repubblica federale di Germania all''articolo 115, primo comma,
    del Trattato, al fine di escludere dal trattamento comunitario «i tappeti a punti
    annodati o arrotolati, anche confezionati», originari dall''Unione Sovietica
    e messi in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/513/EEG: Beschikking van de Commissie van 12 november 1965 betreffende
    het verzoek van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste
    alinea, van het Verdrag tapijten, geknoopt of met opgerolde polen, ook indien
    geconfectioneerd, die van oorsprong zijn uit de USSR en in de andere Lid-Staten
    in het vrije verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
