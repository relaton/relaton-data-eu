id: EUDecision1976668
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 June 1976 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to certain under garments, knitted or crocheted, not elastic
    or rubberized, falling within heading No ex 60.04 of the Common Customs Tariff,
    originating in Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/668/CEE: Décision de la Commission, du 17 juin 1976, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire certains sous-vêtements de bonneterie
    non élastique ni caoutchoutée, de la position Ex 60.04 du Tarif douanier commun,
    originaires de Hong- Kong et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. Juni 1976, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, bestimmte aus Honkong stammende und in den anderen Mitgliedstaaten im
    freien Verkehr befindliche Unterkleidung aus Gewirken, weder gummielastisch noch
    kautschutiert, der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 17. juni 1976 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage visse underbeklædningsgenstande af trikotage, ikke elastisk eller
    gummeret, som henhører under pos. ex 60.04 i den fælles toldtarif, har oprindelse
    i Hongkong og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 giugno 1976, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario talune sottovesti a maglia non elastica né gommata
    della voce ex 60.04 della tariffa doganale comune, originarie di Hong Kong ed
    immesse in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 juni 1976 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden, worden gemachtigd
    bepaalde onderkleding van niet-elastisch of van niet-gegummeerd brei- of haakwerk,
    van post ex 60.04 van het gemeenschappelijk douanetarief, van oorsprong uit Hong-Kong
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
