---
id: EUDecision1985370
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '85/370/EEC: Commission Decision of 8 July 1985 authorizing the Netherlands
    to assess the satisfaction of the varietal purity standards laid down in Annex
    II to Council Directive 66/401/EEC for seed of apomictic uniclonal varieties of
    Poa pratensis, also on the basis of the results of seed and seedling testing (Only
    the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/370/CEE: Décision de la Commission du 8 juillet 1985 autorisant les
    Pays-Bas à apprécier également sur la base des résultats des essais de semences
    et plants le respect des normes de pureté variétable fixées à l''annexe II
    de la directive 66/401/CEE du Conseil pour les semences de variétés apomictiques
    monoclonales de Poa pratensis (Le texte en langue néerlandaise est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '85/370/EWG: Entscheidung der Kommission vom 8. Juli 1985 zur Ermächtigung
    der Niederlande, die Einhaltung der in Anlage II der Richtlinie 66/401/EWG des
    Rates festgelegten Anforderungen an die Sortenreinheit für Saatgut von apomiktischen
    Einklonsorten von Poa pratensis auch aufgrund der Ergebnisse von Saatgut- und
    Keimlingsprüfungen zu beurteilen (Nur der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/370/EØF: Kommissionens beslutning af 8. juli 1985 om bemyndigelse
    af Nederlandene til også på grundlag af resultaterne af frø- og frøplantekontrol
    at afgøre, om frø af apomiktiske, en-klonede sorter af Poa pratensis opfylder
    normerne for sortsrenhed som fastsat i bilag II til Rådets direktiv 66/401/EØF
    (Kun den nederlandske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/370/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Ιουλίου
    1985 που επιτρέπει στις Κάτω Χώρες να εκτιμήσουν
    με βάση, επίσης, τα αποτελέσματα των δοκιμασιών
    σπόρων και φυταρίων αν τηρούνται οι κανόνες
    ποικιλιακής καθαρότητας που καθορίζονται
    στο παράρτημα ΙΙ της οδηγίας 66/401/ΕΟΚ του Συμβουλίου
    για τους σπόρους των μονοκλωνικών απογαμικών
    ποικιλιών της «Poa pratensis» (Το κείμενο στην ολλανδική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/370/CEE: Decisione della Commissione dell''8 luglio 1985 che autorizza
    i Paesi Bassi ad accertare sulla base dei risultati delle analisi di sementi e
    plantule, l''osservanza delle norme di purezza varietale definite nell''allegato
    II della direttiva 66/401/CEE del Consiglio per le sementi di varietà apomittiche
    monoclonali di Poa pratensis (Il testo in lingua olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/370/EEG: Beschikking van de Commissie van 8 juli 1985 houdende machtiging
    van Nederland om ook op basis van de uitkomsten van tests van zaaizaad en zaailingen
    te beoordelen of voor zaaizaad van één kloon afkomstige apomictische rassen
    van Poa pratensis aan de in bijlage II bij Richtlijn 66/401/EEG van de Raad vastgestelde
    raszuiverheidsnormen is voldaan (Slechts de tekst in de Nederlandse taal is authentiek)'
  type: main
