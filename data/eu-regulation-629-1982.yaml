title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 629/82 of 17 March 1982 re-establishing
    the levying of customs duties on vitamin C, falling within subheading 29.38 B
    IV and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 629/82 de la Commission, du 17 mars 1982, portant
    rétablissement de la perception des droits de douane applicables à la vitamine
    C, de la sous-position 29.38 B IV du tarif douanier commun, originaire de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 629/82 der Kommission vom 17. März 1982 zur Wiedereinführung
    der Erhebung der Zölle für Vitamin C der Tarifstelle 29.38 B IV, mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 629/82 af 17. marts 1982 om genindførelse
    af opkrævning af told for vitamin C, henhørende under pos. 29.38 B IV og med
    oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 629/82 τής Επιτροπής τής
    17ης Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά τή βιταμίνη C τής διακρίσεως
    29. 38 Β IV τού Κοινού Δασμολογίου, καταγωγής Κίνας,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 629/82 della Commissione, del 17 marzo 1982, che ripristina
    la riscossione dei dazi doganali applicabili alla vitamina C, della sottovoce
    29.38 B IV della tariffa doganale comune, originaria della Cina beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 629/82 van de Commissie van 17 maart 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op vitamine C
    van postonderverdeling 29.38 B IV, van oorsprong uit China, waarvoor de in Verordening
    (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
