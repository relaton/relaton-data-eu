  content: Décision 65/535/CEE de la Commission, du 2 décembre 1965, portant augmentation
    des volumes des contingents tarifaires au bénéfice du Royaume des Pays-Bas pour
    le ferromanganèse, autre que carbure, le ferrosilicium et le ferrochrome
  type: main
- language: de
  script: Latn
  content: '65/535/EWG: Entscheidung der Kommission vom 2. Dezember 1965 über die
    Erhöhung der dem Königreich der Niederlande gewährten Zollkontingente für
    Ferromangan, anderes als hochgekohltes, für Ferrosilizium und Ferrochrom'
  type: main
- language: it
  script: Latn
  content: '65/535/CEE: Decisione della Commissione, del 2 dicembre 1965, che aumenta
    il volume dei contingenti tariffari concessi al Regno dei Paesi Bassi per il ferro-
    manganese, escluso il ferro-manganese carburato, il ferro-silicio e il ferro-cromo'
  type: main
- language: nl
  script: Latn
  content: '65/535/EEG: Beschikking van de Commissie van 2 december 1965 tot vergroting
    van de tariefcontingenten ten behoeve van het Koninkrijk der Nederlanden voor
    ferromangaan, ander dan meer dan twee gewichtspercenten koolstof bevattende, ferrosilicium
    en ferrochroom'
  type: main
