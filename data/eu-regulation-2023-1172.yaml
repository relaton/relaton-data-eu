title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/1172 of 15 June 2023 concerning
    the authorisation of a preparation of lasalocid A sodium (Avatec 150 G) as a feed
    additive for chickens for fattening, the denial of authorisation of a preparation
    of lasalocid A sodium (Avatec 150 G) as a feed additive for chickens reared for
    laying, the withdrawal from the market of a preparation of lasalocid A sodium
    (Avatec 15 % cc) as a feed additive for chickens for fattening and chickens reared
    for laying and repealing Regulation (EC) No 1455/2004 and Implementing Regulation
    (EU) 2021/932 (holder of authorisation: Zoetis Belgium S.A.)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/1172 de la Commission du 15 juin 2023
    concernant l’autorisation d’une préparation de lasalocide A sodium (Avatec
    150 G) en tant qu’additif pour l’alimentation des poulets d’engraissement,
    le refus d’autorisation d’une préparation de lasalocide A sodium (Avatec
    150 G) en tant qu’additif pour l’alimentation des poulettes destinées à
    la ponte, le retrait du marché d’une préparation de lasalocide A sodium (Avatec
    15 % cc) en tant qu’additif pour l’alimentation des poulets d’engraissement
