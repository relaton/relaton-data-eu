title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/14/EU of 18 October 2013 amending,
    for the purposes of adapting to technical progress, the Annex III to Directive
    2011/65/EU of the European Parliament and of the Council as regards an exemption
    for 3,5 mg mercury per lamp in single capped compact fluorescent lamps for general
    lighting purposes < 30 W with a lifetime equal to or above 20000 h
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/14/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe III de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour l’utilisation de 3,5 mg de mercure par lampe dans les lampes fluorescentes
    compactes à simple culot, à usage d’éclairage général, de moins de 30 W
    et à durée de vie égale ou supérieure à 20000 h
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/14/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    III der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für die Verwendung von 3,5 mg Quecksilber je Lampe in einseitig
    gesockelten Kompaktleuchtstofflampen für allgemeine Beleuchtungszwecke < 30 W
    mit einer Lebensdauer von 20000 Stunden oder mehr
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/14/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    III към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на 3,5
    mg живак/лампа в едноцокълни компактни луминесцентни
    лампи с общоосветително предназначение и мощност
    под 30 W, имащи експлоатационен срок равен на
    или по-голям от 20000 часа
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/14/EU ze dne 18. října
    2013 , kterou se z důvodu přizpůsobení technickému pokroku mění příloha
    III směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    rtuť v množství 3,5 mg na jednu zářivku v jednopaticových kompaktních zářivkách
    pro všeobecné osvětlování < 30 W s životností 20000 h nebo vyšší
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/14/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag III til Europa-Parlamentets og Rådets direktiv
    2011/65/EU for så vidt angår en undtaget anvendelse af 3,5 mg kviksølv pr.
    pære i kompaktlysstofrør med én sokkel til almenbelysning med en effekt på
    < 30 W og en levetid på mindst 20000 timer
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/14/ΕΕ της Επιτροπής,
    της 18ης Οκτωβρίου 2013 , για την τροποποίηση,
    με σκοπό την προσαρμογή στην τεχνική πρόοδο,
    του παραρτήματος III της οδηγίας 2011/65/ΕΕ του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου,
    όσον αφορά εξαίρεση για τη χρήση 3,5 mg υδραργύρου
    ανά λαμπτήρα σε συμπαγείς λαμπτήρες φθορισμού
    ενός κάλυκα για σκοπούς γενικού φωτισμού <
    30 W με διάρκεια ζωής 20000 ωρών και άνω
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/14/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL III lisa seoses erandiga, mis käsitleb kuni 3,5 mg elavhõbeda
    kasutamist ühe valgustuselemendi kohta ühe sokliga kompaktsetes üldvalgustuseks
    kasutatavates luminofoorlampides, mille võimsus on < 30 W ja mille tööiga on
    vähemalt 20000 tundi
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/14/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen III muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen siltä osin kuin on kyse elohopean 3,5
    mg:n enimmäismäärää lamppua kohden yleiskäyttöön tarkoitetuissa yksikantaisissa
    pienloistelampuissa < 30 W, joiden käyttöikä on vähintään 20000 tuntia,
    koskevan poikkeuksen myöntämisestä
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/14/EU оd 18. listopada 2013. o izmjeni,
    za potrebe prilagođivanja tehničkom napretku, Priloga III. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za 3,5 mg žive po žarulji
    u kompaktnim fluorescentnim žaruljama s jednim podnoškom, za opće primjene
    osvjetljenja < 30 W, sa životnim vijekom jednakim ili duljim od 20000 h
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/14/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv III. mellékletének
    az általános világítási célra szolgáló, 30 W alatti teljesítményű,
    legalább 20000 óra élettartamú, egy végükön fejelt kompakt fénycsövekben
    használt, égőnként 3,5 mg higany mentesítése tekintetében, a műszaki fejlődéshez
    történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/14/UE della Commissione, del 18 ottobre 2013 ,
    che modifica, adattandolo al progresso tecnico, l’allegato III della direttiva
    2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione
    relativa a un quantitativo di 3,5 mg di mercurio per lampada nelle lampade fluorescenti
    ad attacco singolo (compatte) per usi generali di illuminazione < 30 W aventi
    una durata di vita di almeno 20000 ore
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/14/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES III pielikumu attiecībā uz atbrīvojumu, kas atļauj
    izmantot 3,5 mg dzīvsudraba (katrā lampā) viencokola kompaktajās luminiscences
    lampās, kuras paredzētas vispārējai apgaismei, kuru jauda ir mazāka par 30
    W un kuru kalpošanas laiks ir vienāds ar vai lielāks par 20000 h
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/14/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES III priedo nuostatos dėl išimties, kuria bendrojo
    apšvietimo reikmėms skirtose viencokolėse kompaktinėse liuminescencinėse
    lempose, kurių galia mažesnė kaip 30 W ir kurių gyvavimo trukmė 20000 h arba
    ilgesnė, leidžiama naudoti po 3,5 mg gyvsidabrio
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/14/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    III tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal 3,5 mg ta’ merkurju għal kull bozza f’bozoz fluworexxenti
    kompatti b’kappa waħda għal skopijiet ta’ illuminazzjoni ġenerali < 30
    W b’ħajja ta’ 20000 siegħa jew iktar
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/14/EU van de Commissie van 18 oktober 2013
    tot wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    III bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor 3,5 mg kwik per lamp in compacte fluorescentielampen met
    enkelvoudige lampvoet voor algemene verlichtingsdoeleinden < 30 W met een levensduur
    van ten minste 20000 branduren
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/14/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik III do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    3,5 mg rtęci na lampę w jednotrzonkowych (kompaktowych) lampach fluorescencyjnych
    na potrzeby oświetlenia ogólnego < 30 W o okresie trwałości wynoszącym 20000
    godzin lub więcej
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/14/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo III da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para 3,5 mg de mercúrio por lâmpada em lâmpadas fluorescentes compactas de
    casquilho simples para iluminação geral, de potência < 30 W e com uma vida
    útil igual ou superior a 20000 h
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/14/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei III la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    cantitatea de 3,5 mg de mercur per lampă în cazul lămpilor fluorescente compacte
    cu un singur soclu destinate iluminatului general < 30 W, cu o durată de viață
    mai mare sau egală cu 20000 de ore
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/14/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha III k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre ortuť v množstve 3,5
    mg na jednu žiarivku v jednopäticových kompaktných žiarivkách na všeobecné
    účely osvetlenia s výkonom < 30 W a so životnosťou najmenej 20000 h
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/14/EU z dne 18. oktobra 2013 o spremembi
    Priloge III k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za 3,5 mg živega srebra na kompaktno fluorescenčno sijalko z enojnim navojem
    za splošno razsvetljavo < 30 W z življenjsko dobo enako ali daljšo od 20000
    h zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/14/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo III de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para la utilización de 3,5 mg de mercurio por lámpara en lámparas fluorescentes
    compactas de casquillo único para usos generales de alumbrado de menos de 30
    W con una vida útil igual o superior a 20000 horas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/14/EU av den 18 oktober 2013 om
    ändring, för anpassning till den tekniska utvecklingen, av bilaga III till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för 3,5 mg kvicksilver per
    lampa i enkelsocklade lysrörslampor för allmänna belysningsändamål < 30 W
    med en livslängd som är lika med eller över 20000 h
  type: main
