    za dodelitev izvoznih dovoljenj za izvoz sira v Združene države Amerike v letu
    2008 v okviru nekaterih kvot GATT in o odstopanju od Uredbe (ES) št. 1282/2006
    o posebnih podrobnih pravilih za uporabo Uredbe Sveta (ES) št. 1255/1999 glede
    izvoznih dovoljenj in izvoznih nadomestil za mleko in mlečne izdelke
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1022/2007 de la Comisión, de 31 de agosto de 2007
    , por el que se abre el procedimiento de asignación de los certificados de exportación
    de los quesos que se vayan a exportar en 2008 a los Estados Unidos de América
    en el marco de determinados contingentes derivados de los acuerdos del GATT, y
    se establecen excepciones al Reglamento (CE) n° 1282/2006 por el que se establecen
    disposiciones específicas de aplicación del Reglamento (CE) n° 1255/1999 del
    Consejo en lo que respecta a los certificados de exportación y a las restituciones
    por exportación de leche y productos lácteos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1022/2007 av den 31 augusti 2007 om öppnande
