    o queijo a exportar em 2008 para os Estados Unidos da América no âmbito de determinados
    contingentes GATT, e que derroga do Regulamento (CE) n.° 1282/2006 que estabelece
    as regras especiais de execução do Regulamento (CE) n.° 1255/1999 do Conselho
