    staterna under 2008 inom ramen för vissa GATT-kvoter, och om undantag från förordning
    (EG) nr 1282/2006 om fastställande av särskilda tillämpningsföreskrifter till
    rådets förordning (EG) nr 1255/1999 i fråga om exportlicenser och exportbidrag
    för mjölk och mjölkprodukter
