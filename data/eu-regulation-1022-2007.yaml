title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1022/2007 of 31 August 2007 opening the procedure
    for the allocation of export licences for cheese to be exported to the United
    States of America in 2008 under certain GATT quotas, and derogating from Regulation
    (EC) No 1282/2006 laying down special detailed rules for the application of Council
    Regulation (EC) No 1255/1999 as regards export licences and export refunds for
    milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1022/2007 de la Commission du 31 août 2007 portant
    ouverture de la procédure d’attribution des certificats d’exportation pour
    les fromages à exporter aux États-Unis d’Amérique en 2008 dans le cadre de
    certains contingents du GATT, et dérogeant au règlement (CE) n° 1282/2006 établissant
    les modalités particulières d’application du règlement (CE) n° 1255/1999
    du Conseil en ce qui concerne les certificats d’exportation et les restitutions
    à l’exportation dans le secteur du lait et des produits laitiers
  type: main
