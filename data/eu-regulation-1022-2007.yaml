    w 2008 r. w ramach niektórych kontyngentów GATT i wprowadzające odstępstwo
    od rozporządzenia (WE) nr 1282/2006 ustalającego specjalne szczegółowe zasady
    stosowania rozporządzenia Rady (WE) nr 1255/1999 dotyczącego pozwoleń na wywóz
