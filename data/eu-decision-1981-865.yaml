    Gewirken von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/865/EØF: Kommissionens beslutning af 17. juli 1981 om bemyndigelse
