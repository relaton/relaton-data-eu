title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 913/76 of 21 April 1976 re-establishing
    the levying of customs duties on wood, planed, tongued, grooved, rebated, chamfered,
    etc., falling within heading No 44.13, originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 913/76 de la Commission, du 21 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux bois rabotés,
    rainés, bouvetés, etc., de la position tarifaire 44.13, originaires du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 913/76 der Kommission vom 21. April 1976 zur Wiedereinführung
    des Zollsatzes für Holz, gehobelt, genutet, gefedert usw., der Tarifnummer 44.13,
    mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 913/76 af 21. april 1976 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, falset, affaset eller
    på lignende måde bearbejdet under position 44.13 som har oprindelse i Brasilien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 913/76 della Commissione, del 21 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato, ecc., della voce doganale n. 44.13, originario del Brasile, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 913/76 van de Commissie van 21 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op hout, geschaafd,
    geploegd, enz., van post 44.13, van oorsprong uit Brazilië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
