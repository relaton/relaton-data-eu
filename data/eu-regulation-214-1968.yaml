  content: Règlement (CEE) n° 214/68 de la Commission, du 22 février 1968, modifiant
    le règlement n° 173/66/CEE en ce qui concerne la détermination du prix CAF
    et du prix franco frontière des huiles d'olive n'ayant pas subi un processus
    de raffinage
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 214/68 der Kommission vom 22. Februar 1968 zur Änderung
    der Verordnung Nr. 173/66/EWG über die Ermittlung des cif-Preises, des Frei-Grenze-
    Preises und der Abschöpfungen für nicht raffinierte Olivenöle
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 214/68 della Commissione, del 22 febbraio 1968, che
    modifica il regolamento n. 173/66/CEE per quanto concerne la determinazione del
    prezzo cif e del prezzo franco frontiera degli oli d'oliva che non hanno subito
    un processo di raffinazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 214/68 van de Commissie van 22 februari 1968 houdende
    wijziging van Verordening nr. 173/66/EEG betreffende de vaststelling van de c.i.f.-
    prijs en van de prijs franco-grens voor olijfolie welke niet aan een raffinage-
    proces onderworpen is geweest
  type: main
