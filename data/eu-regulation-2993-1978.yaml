title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2993/78 of 19 December 1978 extending the period
    of validity of Regulation (EEC) No 3328/75 renewing the arrangements for the reduction
    of import charges on beef and veal products originating in the African, Caribbean
    and Pacific States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2993/78 du Conseil, du 19 décembre 1978, prorogeant
    le règlement (CEE) n° 3328/75 portant reconduction du régime de diminution
    des charges à l' importation des produits du secteur de la viande bovine originaires
    des États d' Afrique, des Caraïbes et du Pacifique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2993/78 des Rates vom 19. Dezember 1978 zur Verlängerung
    der Verordnung (EWG) Nr. 3328/75 zur Beibehaltung der Senkung der Einfuhrbelastung
    für Rindfleischerzeugnisse mit Ursprung in den Staaten in Afrika, im karibischen
    Raum und im Pazifischen Ozean
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2993/78 af 19. december 1978 om forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 3328/75 om videreførelse af ordningen
    med nedsættelse af importbelastninger for varer af oksekød med oprindelse i
    staterne i Afrika, Vestindien og Stillehavet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2993/78 del Consiglio, del 19 dicembre 1978, che estende
    la validità del regolamento (CEE) n. 3328/75, che proroga il regime di diminuzione
    degli oneri all' importazione di prodotti del settore delle carni bovine, originari
    degli Stati africani, dei Caraibi e del Pacifico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2993/78 van de Raad van 19 december 1978 tot verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 3328/75 houdende verlenging van
    de regeling inzake vermindering van de belastingen op de invoer van produkten
    van de sector rundvlees van oorsprong uit de staten in Afrika, het Caribische
    gebied en de Stille Oceaan
  type: main
