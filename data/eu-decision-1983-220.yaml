title:
- language: en
  script: Latn
  content: '83/220/EEC: Commission Decision of 22 April 1983 amending Decision 81/10/EEC
    determining the regions from which Greece may not consign to other Member States
    any bovine animal or swine, or any fresh meat from bovine animals, swine, sheep
    or goats'
  type: main
- language: fr
  script: Latn
  content: '83/220/CEE: Décision de la Commission du 22 avril 1983 modifiant la décision
    81/10/CEE établissant les régions à partir desquelles la Grèce n'' expédie
    vers les autres États membres aucun animal des espèces bovine et porcine ni
    de viandes fraîches des espèces bovine, porcine, ovine et caprine'
  type: main
- language: de
  script: Latn
  content: '83/220/EWG: Entscheidung der Kommission vom 22. April 1983 zur Änderung
    der Entscheidung 81/10/EWG zur Festlegung der Gebiete, aus denen Griechenland
    weder Tiere der Gattungen Rind und Schwein noch frisches Fleisch von Rindern,
    Schweinen, Schafen und Ziegen in die übrigen Mitgliedstaaten versendet'
  type: main
- language: da
  script: Latn
  content: '83/220/EØF: Kommissionens beslutning af 22. april 1983 om ændring af
    beslutning 81/10/EØF om fastsættelse af de områder, hvorfra Grækenland undlader
    at sende kvæg og svin samt fersk okse-, svine-, fåre- eller gedekød til de
    øvrige medlemsstater'
  type: main
- language: el
  script: Grek
  content: '83/220/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Απριλίου 1983 για την τροποποίηση της απόφασης
    81/10/ΕΟΚ περί καθορισμού των περιφερειών από
    τις οποίες η Ελλάδα δεν αποστέλλει προς τα
    υπόλοιπα Κράτη μέλη κανένα βοοειδές και χοιροειδές
    ούτε νωπά κρέατα των βοοειδών, χοιροειδών,
    προβατοειδών και αιγοειδών'
  type: main
- language: it
  script: Latn
  content: '83/220/CEE: Decisione della Commissione del 22 aprile 1983 recante modifica
    della decisione 81/10/CEE che stabilisce le regioni da cui la Grecia non spedisce,
    verso gli altri Stati membri, alcun animale delle specie bovina e suina, né carni
    fresche delle specie bovina, suina, ovina e caprina'
  type: main
- language: nl
  script: Latn
  content: '83/220/EEG: Beschikking van de Commissie van 22 april 1983 houdende wijziging
    van Beschikking 81/10/EEG tot vaststelling van de gebieden waaruit Griekenland
    geen runderen en varkens en geen vers vlees van runderen, varkens, geiten en schapen
    naar de andere Lid-Staten zendt'
  type: main
