---
id: EUDecision1962235
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République italienne, en application
    de l'article 226 du Traité, à maintenir pour les planches, feuilles et bandes
    de toute épaisseur, en zinc, et les poudres et paillettes de zinc (position 79.03
    du tarif douanier italien) la protection douanière telle qu'elle résulte de
    l'exécution intégrale des dispositions du Traité
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission betreffend die Ermächtigung der Italienischen
    Republik gemäß Artikel 226 des Vertrages, für Bleche, Platten, Tafeln und Bänder,
    aus Zink, in beliebiger Dicke, Pulver und Flitter, aus Zink (Nummer des italienischen
    Zolltarifs 79.03), den sich aus der vollständigen Durchführung des Vertrages
    ergebenden Zollschutz beizubehalten
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa all'autorizzazione accordata alla
    Repubblica Italiana, a norma dell'articolo 226 del Trattato, a mantenere la protezione
    doganale come risulta dall'esecuzione integrale delle disposizioni del Trattato,
    per le lamiere, i fogli e i nastri di qualsiasi spessore, di zinco, polveri e
    pagliette di zinco (voce della tariffa doganale italiana 79.03)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende de op grond van artikel 226 van
    het Verdrag aan de Italiaanse Republiek verleende machtiging om de uit de volledige
    tenuitvoerlegging van de bepalingen van het Verdrag voortvloeiende beschermende
    invoerrechten te handhaven voor platen, bladen en strippen, van zink, ongeacht
    de dikte, zinkpoeder en zinkschilfers (post 79.03 van het Italiaanse douanetarief)
  type: main
