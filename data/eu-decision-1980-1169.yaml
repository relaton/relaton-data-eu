title:
- language: en
  script: Latn
  content: '80/1169/EEC: Commission Decision of 1 December 1980 on the reimbursement
    by the Guidance Section of the EAGGF to the United Kingdom of expenditure incurred
    during 1979 on aids and premiums relating to the modernization of farms, including
    those in the less-favoured farming areas (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1169/CEE: Décision de la Commission, du 1er décembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume-Uni des dépenses effectuées pendant
    l''année 1979 pour les aides et primes relatives à la modernisation des exploitations
    agricoles, y compris dans les zones agricoles défavorisées (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1169/EWG: Entscheidung der Kommission vom 1. Dezember 1980 über die
    Rückvergütung der während des Jahres 1979 getätigten Ausgaben für Beihilfen
    und Prämien zur Modernisierung landwirtschaftlicher Betriebe - einschließlich
    der Hilfen für benachteiligte landwirtschaftliche Gebiete - durch den EAGFL,
    Abteilung Ausrichtung, an das Vereinigte Königreich (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1169/EØF: Kommissionens beslutning af 1. december 1980 om refusion
