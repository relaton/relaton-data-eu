title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1402/82 of 4 June 1982 re-establishing the
    levying of customs duties on maleic anhydride, falling within subheading 29.15
    A III and originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1402/82 de la Commission, du 4 juin 1982, portant
    rétablissement de la perception des droits de douane applicables à l' anhydride
    maléique de la sous-position 29.15 A III du tarif douanier commun, originaire
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1402/82 der Kommission vom 4. Juni 1982 zur Wiedereinführung
    der Erhebung der Zölle für Maleinsäureanhydrid der Tarifstelle 29.15 A III,
    mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1402/82 af 4. juni 1982 om genindførelse
    af opkrævning af told for maleinsyreanhydrid, henhørende under pos. 29.15 A
    III og med oprindelse i Brasilien, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1402/82 τής Επιτροπής
    τής 4ης Ιουνίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά μηλεϊνικό ανυδρίτη
    τής διακρίσεως 29. 15 A III τού Κοινού Δασμολογίου,
    καταγωγής Βραζιλίας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1402/82 della Commissione, del 4 giugno 1982, che
    ripristina la riscossione dei dazi doganali applicabili all' anidride maleica
    della sottovoce 29.15 A III della tariffa doganale comune, originaria del Brasile,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consigliog
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1402/82 van de Commissie van 4 juni 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op maleïnezuuranhydride
    van postonderverdeling 29.15 A III, van oorsprong uit Brazilië, waarvoor de in
    Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
