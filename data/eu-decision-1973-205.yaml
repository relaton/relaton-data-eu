id: EUDecision1973205
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 13 July 1973 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's and boys' shirts, of cotton falling within heading
    No ex 61.03 of the Common Customs Tariff, originating in Hungary and in free circulation
    in the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Décision 73/205/CEE de la Commission, du 13 juillet 1973, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises pour hommes et garçonnets,
    en coton, de la position Ex 61.03 du Tarif douanier commun, originaires de Hongrie
    et mises en libre pratique au Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. Juli 1973, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Ungarn stammende und im Vereinigten Königreich im freien Verkehr
    befindliche Oberhemden für Männer und Knaben, aus Baumwolle der Tarifnummer
    ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 13. juli 1973 om bemyndigelse for kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage herre- og drengeskjorter af bomuld, som henhører under position u.
    ex. 61.03 i den fælles toldtarif, har oprindelse i Ungarn og frit kan omsættes
    i Det forenede kongerige Storbritannien
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 luglio 1973, che autorizza il Regno
    del Belgio, il Granducato di Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le camicie per uomo e ragazzo, di cotone, della voce
    n. ex 61.03 della tariffa doganale comune, originarie dell'Ungheria e messe in
    libera pratica nel Regno Unito
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 juli 1973 waarbij het Koninkrijk België,
    het Groothertodom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    hemden voor heren en jongens, van katoen, van post ex 61.03 van het gemeenschappelijke
    douanetarief, van oorsprong uit Hongarije en in het Verenigd Koninkrijk in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
