title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1409/68 de la Commission, du 11 septembre 1968, modifiant
    le règlement (CEE) n° 1100/68 en ce qui concerne la caution à constituer pour
    le certificat d'exportation de certains produits laitiers et à l'exclusion de
    certains fromages du bénéfice de la fixation à l'avance de la restitution à
    l'exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1409/68 der Kommission vom 11. September 1968 zur
    Änderung der Verordnung (EWG) Nr. 1100/68 hinsichtlich der für die Ausfuhrlizenzen
    bestimmter Milcherzeugnisse zu stellenden Kaution und hinsichtlich des Ausschlusses
    bestimmter Käsesorten von der Festsetzung im voraus der Ausfuhrerstattungen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1409/68 della Commissione, dell'11 settembre 1968,
    che modifica il regolamento (CEE) n. 1100/68 per quanto riguarda il deposito cauzionale
    costituito per il certificato d'esportazione di taluni prodotti lattiero-caseari
    e l'esclusione di alcuni formaggi dal beneficio della fissazione in anticipo della
    restituzione all'esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1409/68 van de Commissie van 11 september 1968 houdende
    wijziging van Verordening (EEG) nr. 1100/68 voor wat betreft de te stellen waarborg
    bij het uitvoercertificaat van bepaalde zuivelprodukten en het niet verlenen van
    het voorrecht tot het vooraf vaststellen van de restitutie bij uitvoer voor bepaalde
    kaassoorten
  type: main
