    interventions consistant en achats, stockage et écoulements
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2477/2000 der Kommission vom 10. November 2000 zur
    Festsetzung des bei der Berechnung der Finanzierungskosten für Interventionen
    in Form von Ankauf, Lagerung und Absatz anzuwendenden Zinssatzes
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2477/2000 af 10. november 2000 om fastsættelse
