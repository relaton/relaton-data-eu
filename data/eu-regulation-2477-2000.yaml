    των δαπανών χρηματοδοτήσεως των παρεμβάσεων
    που συνίστανται σε αγορά, αποθεματοποίηση
    και διάθεση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2477/2000, annettu 10 päivänä marraskuuta
