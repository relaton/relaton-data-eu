    laskemisessa sovellettavien korkokantojen vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2477/2000 della Commissione, del 10 novembre 2000,
    che stabilisce i tassi d'interesse da applicare per il calcolo delle spese di
    finanziamento degli interventi comportanti acquisto, magazzinaggio e smercio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2477/2000 van de Commissie van 10 november 2000 tot
    vaststelling van de bij de berekening van de financieringskosten van de interventies
    in de vorm van aankoop, opslag en afzet toe te passen rentevoeten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2477/2000 da Comissão, de 10 de Novembro de 2000,
