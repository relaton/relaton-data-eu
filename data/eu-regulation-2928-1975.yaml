title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2928/75 of the Commission of 7 November 1975 re-establishing
    the levying of customs duties on woven fabrics of man-made fibres, falling within
    subheading 56.07 B, originating in South Korea, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3046/74 of 2 December 1974
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2928/75 de la Commission, du 7 novembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles artificielles, de la sous-position tarifaire 56.07 B, originaires
    de Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2928/75 der Kommission vom 7. November 1975 über
    die Wiedereinführung des Zollsatzes für Gewebe aus synthetischen oder künstlichen
    Spinnfasern der Tarifstelle 56.07 B mit Ursprung in Südkorea, dem die in der
    Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2928/75 af 7. november 1975 om genindførelse
    af opkrævning af toldafgifter for vævet stof af korte kemofibre under underposition
    56.07 B, som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2928/75 della Commissione, del 7 novembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili
    artificiali della sottovoce doganale n. 56.07 B, originari della Corea del Sud,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3046/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2928/75 van de Commissie van 7 november 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op weefsels
    van kunstmatige stapelvezels van onderverdeling 56.07 B, van oorsprong uit Zuid-Korea,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3046/74 van de Raad van 2 december 1974
  type: main
