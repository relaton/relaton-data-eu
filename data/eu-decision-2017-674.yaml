title:
- language: en
  script: Latn
  content: Council Decision (EU) 2017/674 of 3 April 2017 establishing the position
    to be adopted on behalf of the European Union within the eighth meeting of the
    Conference of the Parties to the Rotterdam Convention as regards the amendments
    of Annex III to the Rotterdam Convention on the Prior Informed Consent Procedure
    for certain hazardous chemicals and pesticides in international trade
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2017/674 du Conseil du 3 avril 2017 définissant la position
    à prendre, au nom de l'Union européenne, à la huitième réunion de la conférence
    des parties à la convention de Rotterdam, en ce qui concerne les modifications
    de l'annexe III de la convention de Rotterdam sur la procédure de consentement
    préalable en connaissance de cause applicable à certains produits chimiques
    et pesticides dangereux qui font l'objet d'un commerce international
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2017/674 des Rates vom 3. April 2017 zur Festlegung des
    Standpunkts, der im Namen der Europäischen Union im Rahmen der achten Tagung
    der Konferenz der Vertragsparteien des Rotterdamer Übereinkommens in Bezug auf
    die Änderungen des Anhangs III des Rotterdamer Übereinkommens über das Verfahren
    der vorherigen Zustimmung nach Inkenntnissetzung für bestimmte gefährliche Chemikalien
    sowie Pestizide im internationalen Handel zu vertreten ist
