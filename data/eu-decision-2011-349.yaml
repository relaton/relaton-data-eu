    Liechtensteini Vürstiriigi ühinemist Euroopa Liidu, Euroopa Ühenduse ja Šveitsi
    Konföderatsiooni vahelise lepinguga Šveitsi Konföderatsiooni ühinemise kohta
    Schengeni acquis’ rakendamise, kohaldamise ja edasiarendamisega) Euroopa Liidu
    nimel sõlmimise kohta, eelkõige seoses õigusalase koostööga kriminaalasjades
    ja politseikoostööga
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös, annettu 7 päivänä maaliskuuta 2011, Liechtensteinin
    ruhtinaskunnan liittymisestä Euroopan unionin, Euroopan yhteisön ja Sveitsin
    valaliiton väliseen sopimukseen, joka koskee Sveitsin valaliiton osallistumista
    Schengenin säännöstön täytäntöönpanoon, soveltamiseen ja kehittämiseen,
    Euroopan unionin, Euroopan yhteisön, Sveitsin valaliiton ja Liechtensteinin ruhtinaskunnan
    välillä tehtävän pöytäkirjan tekemisestä Euroopan unionin puolesta, erityisesti
    rikosasioita koskevan oikeudellisen yhteistyön ja poliisiyhteistyön osalta
  type: main
