title:
- language: en
  script: Latn
  content: Council Decision of 7 March 2011 on the conclusion on behalf of the European
    Union of the Protocol between the European Union, the European Community, the
    Swiss Confederation and the Principality of Liechtenstein on the accession of
    the Principality of Liechtenstein to the Agreement between the European Union,
    the European Community and the Swiss Confederation on the Swiss Confederation’s
    association with the implementation, application and development of the Schengen
    acquis, relating in particular to judicial cooperation in criminal matters and
    police cooperation
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil du 7 mars 2011 relative à la conclusion, au nom de
    l’Union européenne, du protocole entre l’Union européenne, la Communauté
    européenne, la Confédération suisse et la Principauté de Liechtenstein sur
    l’adhésion de la Principauté de Liechtenstein à l’accord entre l’Union
    européenne, la Communauté européenne et la Confédération suisse sur l’association
    de la Confédération suisse à la mise en œuvre, à l’application et au développement
    de l’acquis de Schengen notamment en ce qui concerne la coopération judiciaire
    en matière pénale et la coopération policière
  type: main
- language: de
  script: Latn
  content: Beschluss des Rates vom 7. März 2011 über den Abschluss — im Namen
    der Europäischen Union — des Protokolls zwischen der Europäischen Union, der
    Europäischen Gemeinschaft, der Schweizerischen Eidgenossenschaft und dem Fürstentum
    Liechtenstein über den Beitritt des Fürstentums Liechtenstein zum Abkommen zwischen
    der Europäischen Union, der Europäischen Gemeinschaft und der Schweizerischen
    Eidgenossenschaft über die Assoziierung der Schweizerischen Eidgenossenschaft
    bei der Umsetzung, Anwendung und Entwicklung des Schengen-Besitzstands, insbesondere
    in Bezug auf die justizielle Zusammenarbeit in Strafsachen und die polizeiliche
    Zusammenarbeit
  type: main
