title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3428/83 of 30 November 1983 re-establishing
    the levying of customs duties on women' s, girls' and infants' suits and costumes,
    of knitted or crocheted fabric, products of category 74 (code 0740), originating
    in Indonesia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3428/83 de la Commission du 30 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux costumes-tailleurs
    en bonneterie pour femmes, fillettes et jeunes enfants, de la catégorie de produits
    no 74 (code 0740), originaires de l' Indonésie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3428/83 der Kommission vom 30. November 1983 über
    die Wiedereinführung des Zollsatzes für Kostüme und Hosenanzüge, aus Gewirken,
    für Frauen, Mädchen und Kleinkinder, der Warenkategorie Nr. 74 (Kennziffer 0740)
    mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr. 3378/82 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3428/83 af 30. november 1983 om genindførelse
    af opkrævning af toldafgifter for dragter og kostumer, af trikotage, til kvinder,
    piger og småbørn, under varekategori nr. 74 (kode 0740), som har oprindelse
    i Indonesien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3428/83 της Επιτροπής
    της 30ής Νοεμβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για κοστούμια—ταγιέρ
    πλεκτά, για γυναίκες, κορασίδες και μικρά παιδιά,
    της κατηγορίας 74 (κωδικός 0740), καταγωγής Ινδονησίας,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3428/83 della Commissione del 30 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili ai vestiti e completi
    a maglia per donna, per ragazza e per bambini, della categoria di prodotti n.
    74 (codice 0740), originari dell' Indonesia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3428/83 van de Commissie van 30 november 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op mantelpakken
    en broekpakken van brei- of haakwerk, voor dames, meisjes en kinderen, van de
    categorie van produkten nr. 74 (codenummer 0740), van oorsprong uit Indonesië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3378/82 van de Raad
