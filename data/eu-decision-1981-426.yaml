    Ιρλανδία νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τίς ρόμπες λουτρού, τά φορέματα δωματίου, τά
    σακάκια καί τά ανάλογα ενδύματα τά φερόμενα
    εντός τής οικίας καί τά λοιπά εξωτερικά ενδύματα,
