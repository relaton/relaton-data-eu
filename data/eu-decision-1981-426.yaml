    und ähnliche Hauskleidung sowie andere Oberkleidung, aus Geweben, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/426/EØF: Kommissionens beslutning af 15. april 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage badekåber, slåbrokker, hjemmejakker
    og lignende beklædningsgenstande til indendørs brug samt andre yderbeklædningsgenstande
    med oprindelse i Sydkorea (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/426/ΕΟΚ: Απόφαση τής Επιτροπής τής 15ης
