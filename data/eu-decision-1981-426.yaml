title:
- language: en
  script: Latn
  content: '81/426/EEC: Commission Decision of 15 April 1981 authorizing Ireland not
    to apply Community treatment to woven bath robes, dressing gowns, smoking jackets
    and similar indoor wear and other outer garments originating in South Korea (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/426/CEE: Décision de la Commission, du 15 avril 1981, autorisant l''Irlande
    à exclure du traitement communautaire les peignoirs de bain, robes de chambre,
    vestes d''intérieur et vêtements d''intérieur analogues et autres vêtements
    de dessus, tissés, originaires de la Corée du Sud (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/426/EWG: Entscheidung der Kommission vom 15. April 1981 zur Ermächtigung
