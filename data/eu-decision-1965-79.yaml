title:
- language: fr
  script: Latn
  content: Décision 65/79/CEE de la Commission, du 25 janvier 1965, portant prorogation
    de sa décision en date du 8 avril 1964 par laquelle la République italienne
    a été autorisée, en vertu de l'article 115 alinéa 1 du Traité, à exclure
    du traitement communautaire certains produits originaires de pays tiers et transformés
    ou mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/79/EWG: Entscheidung der Kommission vom 25. Januar 1965 zur Verlängerung
    ihrer Entscheidung vom 8. April 1964, mit der die Italienische Republik auf Grund
    von Artikel 115 Absatz (1) des Vertrages ermächtigt worden ist, bestimmte aus
    dritten Ländern stammende und in den übrigen Mitgliedstaaten verarbeitete oder
    im freien Verkehr befindliche Waren von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/79/CEE: Decisione della Commissione, del 25 gennaio 1965, che proroga
    la decisione della Commissione dell''8 aprile 1964, con cui la Repubblica italiana
    è stata autorizzata, in applicazione dell''articolo 115, comma 1 del Trattato,
    ad escludere dal trattamento comunitario alcuni prodotti originari dei paesi terzi
    e lavorati o messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/79/EEG: Beschikking van de Commissie van 25 januari 1965 houdende verlenging
    van haar beschikking van 8 april 1964, waarbij de Italiaanse Republiek werd gemachtigd
    om op grond van artikel 115, eerste alinea, van het Verdrag sommige produkten,
    van oorsprong uit derde landen die in de andere Lid-Staten zijn verwerkt of in
    het vrije verkeer zijn gebracht, van communautaire behandeling uit te sluiten'
  type: main
