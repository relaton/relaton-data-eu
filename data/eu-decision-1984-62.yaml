title:
- language: en
  script: Latn
  content: '84/62/EEC: Commission Decision of 26 January 1984 establishing that the
    apparatus described as ''Tracor - Multichannel Analyzer, model TN-7200'' may be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/62/CEE: Décision de la Commission du 26 janvier 1984 constatant que
    l''importation de l''appareil dénommé "Tracor - Multichannel Analyzer, model
    TN-7200" peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '84/62/EWG: Entscheidung der Kommission vom 26. Januar 1984 mit der festgestellt
    wird, daß das Gerät ,,TRACOR - Multichannel Analyzer, model TN - 7200" unter
    Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '84/62/EØF: Kommissionens beslutning af 26. januar 1984 om fastslåelse
    af, at indførsel af apparatet "Tracor - Multichannel Analyzer, model TN-7200"
    kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
