title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1096/2009 of 16 November 2009 concerning
    the authorisation of an enzyme preparation of endo-1,4-beta-xylanase produced
    by Aspergillus niger (CBS 109.713) as a feed additive for chickens for fattening
    and the authorisation of a new use of this preparation as a feed additive for
    ducks (holder of authorisation BASF SE) and amending Regulation (EC) No 1458/2005
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CE) n o 1096/2009 de la Commission du 16 novembre 2009 concernant
    l’autorisation de la préparation enzymatique d’endo-1,4-bêta-xylanase produite
    par Aspergillus niger (CBS 109.713) en tant qu’additif destiné à l’alimentation
    des poulets d’engraissement et l’autorisation d’une nouvelle utilisation
    de ladite préparation en tant qu’additif destiné à l’alimentation des canards
    (titulaire de l’autorisation: BASF SE), et modifiant le règlement (CE) n o
    1458/2005'
  type: main
- language: de
  script: Latn
  content: 'Verordnung (EG) Nr. 1096/2009 der Kommission vom 16. November 2009 zur
    Zulassung einer Enzymzubereitung aus Endo-1,4-beta-Xylanase aus Aspergillus niger
    (CBS 109.713) als Futtermittelzusatzstoff für Masthühner und zur Zulassung einer
    neuen Verwendung dieser Zubereitung als Futtermittelzusatzstoff für Enten (Zulassungsinhaber:
    BASF SE) sowie zur Änderung der Verordnung (EG) Nr. 1458/2005'
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1096/2009 на Комисията от 16
    ноември 2009 година относно разрешителното за
    ензимния препарат ендо-1,4-бета-ксиланаза, получен
    от Aspergillus niger (CBS 109.713), като фуражна добавка за
    пилета за угояване и разрешителното за нова
    употреба на препарата като фуражна добавка
    за патици (притежател на разрешителното BASF
    SE) и за изменение на Регламент (ЕО) № 1458/2005
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1096/2009 ze dne 16. listopadu 2009 o povolení
    přípravku enzymu endo-1,4-beta-xylanázy z Aspergillus niger (CBS 109.713) jako
    doplňkové látky pro výkrm kuřat a povolení nového užití tohoto přípravku
    jako doplňkové látky pro kachny (držitel povolení BASF SE) a o změně nařízení
    (ES) č. 1458/2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1096/2009 af 16. november 2009 om godkendelse
    af et enzympræparat af endo-1,4-beta-xylanase produceret af Aspergillus niger
    (CBS 109.713) som tilsætningsstof til foder til slagtekyllinger og godkendelse
    af en ny anvendelse af dette præparat som tilsætningsstof til foder til ænder
    (indehaver af godkendelsen er BASF SE) og om ændring af forordning (EF) nr. 1458/2005
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1096/2009 της Επιτροπής,
    της 16ης Νοεμβρίου 2009 , σχετικά με την έγκριση
    παρασκευάσματος ενζύμου ενδο-1,4-β-ξυλανάσης
    που παράγεται από Aspergillus niger (CBS 109.713) ως πρόσθετης
    ύλης ζωοτροφών για κοτόπουλα προς πάχυνση
    και την έγκριση νέας χρήσης του εν λόγω παρασκευάσματος
    ως πρόσθετης ύλης ζωοτροφών για πάπιες (κάτοχος
    άδειας BASF SE) και για την τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1458/2005
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1096/2009, 16. november 2009 , mis käsitleb
    Aspergillus niger ’i (CBS 109.713) abil toodetud endo-1,4-β-ksülanaasi ensüümipreparaadi
    kasutamise lubamist broilerkanade söödalisandina ja selle preparaadi uue kasutusviisi
    lubamist partide söödalisandina (loaomanik BASF SE) ning millega muudetakse
    määrust (EÜ) nr 1458/2005
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1096/2009, annettu 16 päivänä marraskuuta
    2009 , Aspergillus niger (CBS 109.713) -organismin tuottamaa endo-1,4-beetaksylanaasia
    sisältävän entsyymivalmisteen hyväksymisestä broilerien rehun lisäaineena,
    kyseisen valmisteen uuden käyttötavan hyväksymisestä ankkojen rehun lisäaineena
    (hyväksynnän haltija BASF SE) ja asetuksen (EY) N:o 1458/2005 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1096/2009 od 16. studenoga 2009. o odobrenju enzimskog
    pripravka endo-1,4-beta-ksilanaze dobivenog od Aspergillus niger (CBS 109.713),
    kao dodatka hrani za piliće za tov i o odobrenju novog korištenja tog pripravka
    kao dodatka hrani za patke (nositelj odobrenja BASF SE) i o izmjeni Uredbe (EZ)
    br. 1458/2005
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság 1096/2009/EK rendelete ( 2009. november 16.) az Aspergillus
    niger (CBS 109.713) által termelt endo-1,4-béta-xilanáz enzimkészítmény
    brojlercsirke-takarmányhoz adott adalékanyagként történő engedélyezéséről,
    e készítmény kacsatakarmányhoz adalékanyagként történő új használatának
    engedélyezéséről (az engedély jogosultja: BASF SE) és az 1458/2005/EK rendelet
    módosításáról'
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1096/2009 della Commissione, del 16 novembre 2009 ,
    riguardante l’autorizzazione di un preparato enzimatico di endo-1,4-beta-xilanasi
    prodotta dall’ Aspergillus niger (CBS 109.713) come additivo per mangimi per
    polli da ingrasso, nonché l’autorizzazione a un nuovo impiego di tale preparato
    per le anatre (titolare dell’autorizzazione BASF SE) e recante modifica del
    regolamento (CE) n. 1458/2005
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1096/2009 ( 2009. gada 16. novembris) par atļauju
    izmantot no Aspergillus niger (CBS 109.713) iegūtu endo-1,4-beta-ksilanāzes
    fermentu preparātu kā lopbarības piedevu gaļas cāļiem un par atļauju jaunā
    veidā izmantot šo preparātu kā lopbarības piedevu pīlēm (atļaujas turētājs
    BASF SE), un ar ko groza Regulu (EK) Nr. 1458/2005
  type: main
- language: lt
  script: Latn
  content: 2009 m. lapkričio 16 d. Komisijos reglamentas (EB) Nr. 1096/2009 dėl
    leidimo endo-1,4-beta-ksilanazės, gaunamos iš Aspergillus niger (CBS 109.713),
    fermentinį preparatą naudoti kaip mėsinių viščiukų pašarų priedą ir
    dėl leidimo šį preparatą naudoti pagal naują paskirtį kaip ančių pašarų
    priedą (leidimo turėtojas – BASF SE), iš dalies keičiantis Reglamentą (EB)
    Nr. 1458/2005
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1096/2009 tas- 16 ta’ Novembru 2009
    li jikkonċerna l-awtorizzazzjoni ta’ preparazzjoni ta’ enżima ta’ endo-1,4-beta-xylanase
    prodott minn Aspergillus niger (CBS 109.713) bħala addittiv fl-għalf għat-tiġieġ
    għat-tismin u l-awtorizzazzjoni ta’ użu ġdid ta’ din il-preparazzjoni bħala
    addittiv fl-għalf għall-papri (detentur ta’ awtorizzazzjoni BASF SE) u li
    jemenda r-Regolament (KE) Nru 1458/2005
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1096/2009 van de Commissie van 16 november 2009 tot
    verlening van een vergunning voor een enzympreparaat van endo-1,4-bèta-xylanase,
    geproduceerd door Aspergillus niger (CBS 109.713), als toevoegingsmiddel voor
    diervoeding voor mestkippen en tot verlening van een vergunning voor een nieuwe
    toepassing van dit preparaat voor eenden (vergunninghouder BASF SE), alsook tot
    wijziging van Verordening (EG) nr. 1458/2005
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie Komisji (WE) nr 1096/2009 z dnia 16 listopada 2009 r.
    dotyczące zezwolenia na stosowanie preparatu enzymatycznego z endo-1,4-beta-ksylanazy
    wytwarzanej przez Aspergillus niger (CBS 109.713) jako dodatku paszowego dla kurcząt
    rzeźnych i zezwolenia na nowe zastosowanie tego preparatu jako dodatku paszowego
    dla kaczek (posiadacz zezwolenia: BASF SE) oraz zmieniające rozporządzenie (WE)
    nr 1458/2005'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1096/2009 da Comissão, de 16 de Novembro de 2009
    , relativo à autorização de uma preparação enzimática de endo-1,4-beta-xilanase
    produzida por Aspergillus niger (CBS 109.713) como aditivo na alimentação de
    frangos de engorda e à autorização de uma nova utilização desta preparação
    como aditivo na alimentação de patos (detentor da autorização BASF SE) e que
    altera o Regulamento (CE) n. o 1458/2005
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul (CE) nr. 1096/2009 al Comisiei din 16 noiembrie 2009 privind
    autorizarea unui preparat enzimatic de endo-1,4-beta-xilanază produsă de Aspergillus
    niger (CBS 109.713) ca aditiv pentru hrana puilor pentru îngrășat și autorizarea
    unei noi utilizări a acestui preparat ca aditiv pentru hrana rațelor (titularul
    autorizației: BASF SE) și de modificare a Regulamentului (CE) nr. 1458/2005'
  type: main
- language: sk
  script: Latn
  content: 'Nariadenie Komisie (ES) č. 1096/2009 zo 16. novembra 2009 , ktoré sa
    týka povolenia enzymatického prípravku endo-1,4-beta-xylanázy produkovanej
    kmeňom Aspergillus niger (CBS 109.713) ako kŕmnej doplnkovej látky pre kurčatá
    na výkrm a povolenia nového použitia tohto prípravku ako kŕmnej doplnkovej
    látky pre kačice (držiteľ povolenia: BASF SE), a ktorým sa mení a dopĺňa
    nariadenie (ES) č. 1458/2005'
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1096/2009 z dne 16. novembra 2009 o dovoljenju
    za encimski pripravek iz endo-1,4-beta-ksinalaze, ki jo proizvaja Aspergillus
    niger (CBS 109.713), kot krmni dodatek za piščance za pitanje in dovoljenju
    o novi uporabi tega pripravka kot krmnega dodatka za race (imetnik dovoljenja
    je BASF SE) ter spremembi Uredbe (ES) št. 1458/2005
  type: main
- language: es
  script: Latn
  content: 'Reglamento (CE) n o 1096/2009 de la Comisión, de 16 de noviembre de 2009
    , relativo a la autorización de un preparado enzimático de endo-1,4-beta-xilanasa
    producida por Aspergillus niger (CBS 109.713) como aditivo en la alimentación
    de pollos de engorde, y a la autorización de un nuevo uso de ese preparado como
    aditivo para la alimentación de los patos (titular de la autorización: BASF
    SE), y por el que se modifica el Reglamento (CE) n o 1458/2005'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens förordning (EG) nr 1096/2009 av den 16 november 2009 om
    godkännande av ett enzympreparat av endo-1,4-beta-xylanas framställt av Aspergillus
    niger (CBS 109.713) som fodertillsats för slaktkycklingar, om godkännande av
    ett nytt användningsområde för detta preparat som fodertillsats för ankor
    (innehavare av godkännandet: BASF SE) och om ändring av förordning (EG) nr
    1458/2005'
