title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 107/76 of 19 January 1976 laying down general
    rules for determining the percentage of the guide price to be used to calculate
    the withdrawal price for certain fishery products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 107/76 du Conseil, du 19 janvier 1976, établissant
    les règles générales relatives à la détermination du pourcentage du prix
    d' orientation servant comme élément de calcul du prix de retrait pour certains
    produits de la pêche
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 107/76 des Rates vom 19. Januar 1976 über allgemeine
