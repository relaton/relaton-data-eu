    Fischereierzeugnisse zugrunde zu legenden Hundertsatzes des Orientierungspreises
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 107/76 af 19. januar 1976 om fastsættelse
    af de almindelige regler for bestemmelse af den procentdel af orienteringsprisen,
    der lægges til grund ved beregning af tilbagetagelsesprisen for visse fiskerivarer
  type: main
- language: el
  script: Grek
