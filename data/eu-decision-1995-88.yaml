  script: Latn
  content: '95/88/EC: Commission Decision of 2 March 1995 amending Decisions 94/187/EC,
    94/309/EC, 94/344/EC and 94/446/EC laying down the animal health requirements
    and certification for the import of certain products covered by Council Directive
    92/118/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/88/CE: Décision de la Commission du 2 mars 1995 modifiant les décisions
    94/187/CE, 94/309/CE, 94/344/CE et 94/446/CE établissant les conditions sanitaires
    et la certification requises à l''importation de certains produits visés par
    la directive 92/118/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '95/88/EG: ENTSCHEIDUNG DER KOMMISSION vom 2. März 1995 zur Änderung
