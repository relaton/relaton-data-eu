title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1395 of 10 September 2019
    amending Annex I to Regulation (EC) No 798/2008 as regards the entries for Bosnia
    and Herzegovina and Israel and the name of the Republic of North Macedonia in
    the list of third countries, territories, zones or compartments from which certain
    poultry commodities may be imported into and transit through the Union and amending
    the model veterinary certificate for egg products
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/1395 de la Commission du 10 septembre
    2019 modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les
    mentions relatives à la Bosnie-Herzégovine et à Israël ainsi que le nom de
    la République de Macédoine du Nord dans la liste des pays tiers, territoires,
    zones ou compartiments en provenance desquels certains produits de volailles peuvent
    être importés dans l'Union et transiter par celle-ci, et modifiant le modèle
    de certificat vétérinaire relatif aux ovoproduits
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/1395 der Kommission vom 10. September
    2019 zur Änderung von Anhang I der Verordnung (EG) Nr. 798/2008 in Bezug auf
    die Einträge für Bosnien und Herzegowina sowie Israel und auf den Namen der
    Republik Nordmazedonien in der Liste von Drittländern, Gebieten, Zonen und Kompartimenten,
    aus denen bestimmte Geflügelwaren in die Union eingeführt und durch die Union
    durchgeführt werden dürfen, sowie zur Änderung der Muster-Veterinärbescheinigung
    für Eiprodukte
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/1395 на Комисията
    от 10 септември 2019 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписванията
    за Босна и Херцеговина и Израел и наименованието
    на Република Северна Македония в списъка на
    трети страни, територии, зони или компартменти,
    от които са разрешени вносът и транзитното
    преминаване през Съюза на някои стоки от домашни
    птици и за изменение на образеца на ветеринарен
    сертификат за яйчни продукти
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/1395 ze dne 10. září 2019,
    kterým se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položky
    týkající se Bosny a Hercegoviny a Izraele a název Republiky Severní Makedonie
    na seznamu třetích zemí, území, oblastí nebo jednotek, z nichž lze do Unie
    dovážet nebo přes její území přepravovat určité drůbeží komodity,
    a kterým se mění vzorové veterinární osvědčení pro vaječné výrobky
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/1395 af 10. september
    2019 om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår
    oplysningerne om Bosnien-Hercegovina og Israel og navnet på Republikken Nordmakedonien
    på listen over tredjelande, områder, zoner og segmenter, hvorfra visse fjerkrævarer
    kan importeres til og sendes i transit gennem Fællesskabet og ændring af standardveterinærcertifikatet
    for ægprodukter
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2019/1395 της Επιτροπής,
