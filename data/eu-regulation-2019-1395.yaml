    Iisraeli käsitlevaid kandeid ning Põhja-Makedoonia Vabariigi nimetust selliste
    kolmandate riikide, territooriumide, tsoonide ja piirkondade loetelus, millest
    võib liitu importida või läbi liidu vedada teatavaid linnukasvatussaadusi,
    ning munatoodete veterinaarsertifikaadi näidist
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2019/1395, annettu 10 päivänä
    syyskuuta 2019, asetuksen (EY) N:o 798/2008 liitteen I muuttamisesta Bosnia ja
    Hertsegovinaa ja Israelia koskevien kohtien sekä Pohjois-Makedonian tasavallan
    nimen osalta niiden kolmansien maiden, alueiden, vyöhykkeiden tai erillisalueiden
    luettelossa, joista tiettyjen siipikarjasta saatujen hyödykkeiden tuonti unioniin
    ja kuljettaminen sen kautta on sallittua, sekä munatuotteita koskevan eläinlääkärintodistuksen
    mallin muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/1395 оd 10. rujna 2019. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Bosnu i Hercegovinu i Izrael
    te imena Republike Sjeverne Makedonije na popisu trećih zemalja, državnih područja,
    zona ili kompartmenta iz kojih je dopušten uvoz u Uniju i provoz kroz nju određenih
    proizvoda od peradi te o izmjeni obrasca veterinarskog certifikata za proizvode
    od jaja
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1395 végrehajtási rendelete (2019. szeptember
    10.) a 798/2008/EK rendelet I. mellékletének az egyes baromfiáruk Unióba történő
    behozatala és az Unió területén történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékében
    a Bosznia-Hercegovinára és Izraelre vonatkozó bejegyzés, valamint az Észak-macedón
    Köztársaság neve tekintetében történő módosításáról, továbbá a tojástermékekre
    vonatkozó állategészségügyi bizonyítványminta módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/1395 della Commissione, del 10 settembre
    2019, che modifica l'allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    le voci relative alla Bosnia-Erzegovina e a Israele e il nome della Repubblica
    di Macedonia del Nord nell'elenco di paesi terzi, territori, zone o compartimenti
    in provenienza dai quali determinati prodotti a base di pollame possono essere
    importati e transitare nell'Unione, e che modifica il modello di certificato veterinario
    per gli ovoprodotti
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/1395 (2019. gada 10. septembris),
    ar ko Regulas (EK) Nr. 798/2008 I pielikumu groza attiecībā uz ierakstiem par
    Bosniju un Hercegovinu un Izraēlu un attiecībā uz Ziemeļmaķedonijas Republikas
    nosaukumu to trešo valstu, teritoriju, zonu vai nodalījumu sarakstā, no kurām
    atļauts importēt Savienībā vai tranzītā caur to pārvadāt noteiktas mājputnu
    izcelsmes preces, un groza olu produktu veterinārā sertifikāta paraugu
  type: main
- language: lt
  script: Latn
  content: 2019 m. rugsėjo 10 d. Komisijos įgyvendinimo reglamentas (ES) 2019/1395,
    kuriuo dėl Bosnijai ir Hercegovinai bei Izraeliui skirtų įrašų ir Šiaurės
    Makedonijos Respublikos pavadinimo trečiųjų šalių, teritorijų, zonų ar
    skyrių, iš kurių galima importuoti į Sąjungą ir vežti tranzitu per Sąjungą
    tam tikras naminių paukščių prekes, sąraše iš dalies keičiamas Reglamento
    (EB) Nr. 798/2008 I priedas ir kiaušinių gaminių veterinarijos sertifikato
    pavyzdys
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/1395 tal-10 ta'
    Settembru 2019 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 dwar l-entrati
    għall-Bożnija-Ħerzegovina u Iżrael u l-isem tar-Repubblika tal-Maċedonja
    ta' Fuq fil-lista ta' pajjiżi terzi, territorji, żoni jew kompartimenti li minnhom
    jistgħu jiġu importati ċerti prodotti tat-tjur lejn l-Unjoni u jsir tranżitu
    minnha u li jemenda ċ-ċertifikat veterinarju mudell għall-prodotti tal-bajd
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/1395 van de Commissie van 10 september
    2019 tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft
    de gegevens voor Bosnië en Herzegovina en Israël en de naam van de Republiek
    Noord-Macedonië in de lijst van derde landen, gebieden, zones of compartimenten
    waaruit bepaalde pluimveeproducten mogen worden ingevoerd in en doorgevoerd door
    de Unie en tot wijziging van het model van het veterinair certificaat voor eiproducten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/1395 z dnia 10 września 2019
    r. zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w odniesieniu
    do wpisów dotyczących Bośni i Hercegowiny oraz Izraela i nazwy Republiki Macedonii
    Północnej w wykazie państw trzecich, terytoriów, stref lub grup, z których
    dopuszczalny jest przywóz do i tranzyt przez terytorium Unii niektórych produktów
    drobiowych, oraz zmieniające wzór świadectwa weterynaryjnego dla przetworów
    jajecznych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/1395 da Comissão, de 10 de setembro
    de 2019, que altera o anexo I do Regulamento (CE) n.° 798/2008 no que se refere
    às entradas relativas à Bósnia-Herzegovina e a Israel e ao nome da República
    da Macedónia do Norte na lista de países terceiros, territórios, zonas ou compartimentos
    a partir dos quais são autorizados a importação e o trânsito na União de
    determinados produtos à base de aves de capoeira, e que altera o modelo de certificado
    veterinário para ovoprodutos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/1395 al Comisiei din 10 septembrie
    2019 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubricile referitoare la Bosnia și Herțegovina și Israel, precum și în ceea
    ce privește numele Republicii Macedonia de Nord din lista țărilor terțe, teritoriilor,
    zonelor sau compartimentelor din care anumite produse de pasăre pot fi importate
    în Uniune și pot tranzita Uniunea, precum și de modificare a modelului de certificat
    sanitar-veterinar pentru produsele din ouă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/1395 z 10. septembra 2019, ktorým
    sa mení vzor veterinárneho osvedčenia pre výrobky z vajec a príloha I k nariadeniu
    (ES) č. 798/2008, pokiaľ ide o položky týkajúce sa Bosny a Hercegoviny a
    Izraela a názov Severomacedónskej republiky v zozname tretích krajín, území,
    oblastí alebo jednotiek, z ktorých možno do Únie dovážať alebo cez jej
    územie prevážať určité hydinové komodity
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/1395 z dne 10. septembra 2019 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosov za Bosno in Hercegovino in
    Izrael ter imena Severna Makedonija na seznamu tretjih držav, ozemelj, območij
    ali kompartmentov, iz katerih je dovoljen uvoz nekaterih perutninskih proizvodov
    v Unijo in njihov tranzit skozi Unijo ter spremembi vzorca veterinarskega spričevala
    za jajčne izdelke
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/1395 de la Comisión, de 10 de septiembre
    de 2019, por el que se modifica el anexo I del Reglamento (CE) n.° 798/2008 en
    lo que respecta a las entradas correspondientes a Bosnia y Herzegovina, a Israel
    y a la denominación de la República de Macedonia del Norte en la lista de terceros
    países, territorios, zonas o compartimentos desde los cuales están permitidos
    la importación en la Unión o el tránsito por ella de determinadas mercancías
    de aves de corral, y se modifica el modelo de certificado veterinario para ovoproductos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2019/1395 av den 10 september
    2019 om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Bosnien och Hercegovina och Israel samt namnet Nordmakedonien i förteckningen
    över tredjeländer, områden, zoner och delområden från vilka vissa varor av
    fjäderfä får importeras till eller transiteras genom unionen och om ändring
    av förlagan till veterinärintyget för äggprodukter
