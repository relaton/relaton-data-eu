    EINFUEHRUNG EINES VORLAEUFIGEN ANTIDUMPINGZOLLS AUF DIE EINFUHREN BESTIMMTER GESCHWEISSTER
    ROHRE AUS EISEN ODER NICHTLEGIERTEM STAHL MIT URSPRUNG IN DER TUERKEI UND IN VENEZUELA
    UND ZUR ANNAHME DER FUER DIESE EINFUHREN ANGEBOTENEN VERPFLICHTUNGEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3617/90 af 11. december 1990 om indførelse
