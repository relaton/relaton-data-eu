  content: Commission Regulation (EEC) No 3617/90 of 11 December 1990 imposing a provisional
    anti-dumping duty on imports of certain welded tubes of iron or non-alloy steel,
    originating in Turkey or in Venezuela and accepting undertakings offered in connection
    with such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3617/90 de la Commission, du 11 décembre 1990, instituant
    un droit antidumping provisoire sur les importations de certains tubes soudés,
    en fer ou en aciers non alliés, originaires de Turquie et du Venezuela et portant
    acceptation des engagements offerts pour ces importations
  type: main
- language: de
  script: Latn
