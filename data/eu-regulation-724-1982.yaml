type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 724/82 of 30 March 1982 imposing a provisional
    anti-dumping duty on imports of standardized multi-phase electric motors having
    an output of more than 0*75 kW but not more than 75 kW, originating in Bulgaria,
    Czechoslovakia, the German Democratic Republic, Poland, Romania and the USSR,
    and terminating the proceeding in respect of imports of said products originating
    in Hungary
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 724/82 de la Commission, du 30 mars 1982, portant,
    d' une part, institution d' un droit anti-"dumping" provisoire à l' égard des
    importations de moteurs électriques polyphasés normalisés d' une puissance
    de plus de 0,75 à 75 kilowatts inclus, originaires de Bulgarie, de Pologne, de
    la République démocratique allemande, de Roumanie, de Tchécoslovaquie et d'
    Union soviétique, et, d' autre part, clôture de la procédure à l' égard des
    importations des mêmes produits originaires de Hongrie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 724/82 der Kommission vom 30. März 1982 über die
    Einführung eines vorläufigen Antidumpingzolls auf die Einfuhren von Mehrphasen-Wechselstrommotoren
    mit einer Leistung von mehr als 0,75 bis 75 kW mit Ursprung in Bulgarien, Polen,
    der Deutschen Demokratischen Republik, Rumänien, der Tschechoslowakei und der
    Sowjetunion einerseits und die Einstellung des Verfahrens gegenüber den Einfuhren
    der gleichen Waren mit Ursprung in Ungarn andererseits
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 724/82 af 30. marts 1982 om indførelse
    af en midlertidig antidumpingtold på importen af standardiserede elektriske motorer,
    flerfasede, med effekt på over 0,75 kW, men højst 75 kW, med oprindelse i Bulgarien,
    Den tyske demokratiske Republik, Polen, Rumænien, Sovjetunionen og Tjekkoslovakiet
    og om afslutning af proceduren for importen af tilsvarende varer med oprindelse
    i Ungarn
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 724/82 τής Επιτροπής τής
    30ής Μαρτίου 1982 περί επιβολής, αφενός, προσωρινού
    δασμού αντιντάμπινγκ στίς εισαγωγές τών τυποποιημένων
    πολυφασικών ηλεκτρικών κινητήρων ισχύος από
    0, 75 kW μή συμπεριλαμβανομένων έως 75 kW συμπεριλαμβανομένων,
    καταγωγής Βουλγαρίας, Πολωνίας, Λαϊκής Δημοκρατίας
    τής Γερμανίας, Ρουμανίας, Τσεχοσλοβακίας καί
    Σοβιετικής Ενώσεως, καί αΦετέρου περί περατώσεως
    τής διαδικασίας γιά τίς εισαγωγές τών ίδιων
    προϊόντων καταγωγής Ουγγαρίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 724/82 della Commissione, del 30 marzo 1982, che istituisce
    un dazio antidumping provvisorio nei confronti delle importazioni di motori elettrici
    polifase normalizzati, di potenza superiore a 0,75 kw ed inferiore o pari a 75
    kw, originari della Bulgaria, della Polonia, della Repubblica democratica tedesca,
    della Romania, della Cecoslovacchia e dell' Unione Sovietica, e che termina la
    procedura nei confronti delle importazioni dei medesimi prodotti, originari dell'
    Ungheria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 724/82 van de Commissie van 30 maart 1982 houdende
    instelling van een voorlopig anti-dumpingrecht op de invoer van gestandaardiseerde
    meerfasige elektromotoren met een vermogen van meer dan 0,75 kW tot en met 75
    kW, van oorsprong uit Bulgarije, Polen, de Duitse Democratische Republiek, Roemenië,
    Tsjechoslowakije en de Sowjetunie, en tevens houdende beëindiging van de procedure
    met betrekking tot de invoer van voornoemde produkten van oorsprong uit Hongarije
  type: main
