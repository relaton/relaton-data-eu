title:
- language: en
  script: Latn
  content: Regulation (EEC) No 221/73 of the Council of 31 January 1973 partially
    and temporarily suspending the autonomous duties in the Common Customs Tariff
    on fillets of herring, uncooked, breaded and frozen, of subheading ex 16.04 C
    and on fillets of other fish, uncooked, breaded and frozen, of subheading ex 16.04
    G
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 221/73 du Conseil, du 31 janvier 1973, portant suspension
    partielle et temporaire des droits autonomes du tarif douanier commun sur les
    filets de harengs, crus, panés et congelés, de la sous-position EX 16.04 C,
    et sur les filets d'autres poissons, crus, panés et congelés, de la sous-position
    EX 16.04 G
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 221/73 des Rates vom 31. Januar 1973 zur teilweisen
    und zeitweisen Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs
    für Heringsfilet, roh, paniert und gefroren, der Tarifstelle ex 16.04 C und für
    Filet von anderen Fischen, roh, paniert und gefroren, der Tarifstelle ex 16.04
    G
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 221/73 af 31. januar 1973 om delvis og midlertidig
    suspension af den autonome told i den fælles toldtarif vedrørende rå, panerede
    og frosne sildefileter henhørende under position ex 16.04 C samt rå, panerede
    og frosne fileter af anden fisk henhørende under position ex 16.04 G
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 221/73 del Consiglio, del 31 gennaio 1973, recante
    sospensione parziale e temporanea dei dazi autonomi della tariffa doganale comune
    per i filetti di aringhe crudi, panati e congelati della sottovoce n. ex 16.04
    C e per i filetti d'altri pesci crudi, panati e congelati della sottovoce n. ex
    16.04 G
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 221/73 van de Raad van 31 januari 1973 houdende gedeeltelijke
    en tijdelijke schorsing van de autonome rechten van het gemeenschappelijk douanetarief
    op filets van haring, rauw, gepaneerd en bevroren van onderverdeling ex 16.04
    C en op filets van andere vissen, rauw, gepaneerd en bevroren van onderverdeling
    ex 16.04 G
