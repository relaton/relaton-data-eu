    oraz zmieniające rozporządzenie (EWG) nr 3769/92
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1232/2002 da Comissão, de 9 de Julho de 2002, que
    substitui o anexo do Regulamento (CEE) n.° 3677/90 do Conselho que estabelece
    as medidas a adoptar para evitar o desvio de determinadas substâncias para o
    fabrico ilegal de estupefacientes e de substâncias psicotrópicas e altera o
    Regulamento (CEE) n.° 3769/92
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1232/2002 z 9. júla 2002, ktorým sa nahrádza
