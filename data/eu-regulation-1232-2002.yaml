    ktoré treba prijať, aby sa zabránilo zneužívaniu určitých látok na nedovolenú
    výrobu omamných látok a psychotropných látok, a ktorým sa mení a dopĺňa
    nariadenie (EHS) č. 3769/92
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1232/2002 z dne 9. julija 2002 o nadomestitvi
    Priloge Uredbe Sveta (EGS) št. 3677/90 o določitvi ukrepov, sprejetih za preprečevanje
    zlorabe nekaterih snovi za nezakonito proizvodnjo mamil in drugih psihotropnih
    snovi, in spremembi Uredbe (EGS) št. 3769/92
  type: main
