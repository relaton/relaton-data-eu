  script: Latn
  content: Reglamento (CE) n° 1232/2002 de la Comisión, de 9 de julio de 2002, por
    el que se sustituye el anexo del Reglamento (CEE) n° 3677/90 del Consejo, relativo
    a las medidas que deben adoptarse para impedir el desvío de determinadas sustancias
    para la fabricación ilícita de estupefacientes y de sustancias psicotrópicas
    y por el que se modifica el Reglamento (CEE) n° 3769/92
  type: main
