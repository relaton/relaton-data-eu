title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1232/2002 of 9 July 2002 replacing the Annex
    to Council Regulation (EEC) No 3677/90 laying down measures to be taken to discourage
    the diversion of certain substances to the illicit manufacture of narcotic drugs
    and psychotropic substances and amending Regulation (EEC) No 3769/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1232/2002 de la Commission du 9 juillet 2002 remplaçant
    l'annexe du règlement (CEE) n° 3677/90 du Conseil relatif aux mesures à prendre
    afin d'empêcher le détournement de certaines substances pour la fabrication
    illicite de stupéfiants ou de substances psychotropes et modifiant le règlement
    (CEE) n° 3769/92
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1232/2002 der Kommission vom 9. Juli 2002 zur Ersetzung
    des Anhangs der Verordnung (EWG) Nr. 3677/90 des Rates über Maßnahmen gegen
    die Abzweigung bestimmter Stoffe zur unerlaubten Herstellung von Suchtstoffen
    und psychotropen Stoffen und zur Änderung der Verordnung (EWG) Nr. 3769/92
  type: main
