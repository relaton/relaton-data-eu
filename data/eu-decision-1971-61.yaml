title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 16 décembre 1970, portant octroi du concours
    du Fonds social européen au bénéfice de la République française pour des
    dépenses relatives à des opérations de rééducation professionnelle et de
    réinstallation effectuées par le Ministère du travail, de l'emploi et de la
    population et l'Office national d'immigration (ONI)
  type: main
- language: de
  script: Latn
  content: '71/61/EWG: Entscheidung der Kommission vom 16. Dezember 1970 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Republik
    Frankreich zu Aufwendungen für vom "Ministère du Travail, de l''Emploi et de
    la Population" und vom "Office national d''immigration" durchgeführte Berufsumschulungs-
    und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '71/61/CEE: Decisione della Commissione, del 16 dicembre 1970, che concede
    un contributo del Fondo sociale europeo alla Repubblica francese per spese concernenti
    operazioni di riqualificazione e di nuova sistemazione effettuate dal «Ministère
    du travail, de l''emploi et de la population» e dall''«Office national d''immigration»
    (ONI)'
  type: main
- language: nl
  script: Latn
  content: '71/61/EEG: Beschikking van de Commissie van 16 december 1970 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Franse
    Republiek voor door het "Ministère du travail, de l''emploi et de la population"
    en de "Office national d''immigration (O.N.I.)" gemaakte herscholings- en verplaatsingskosten'
