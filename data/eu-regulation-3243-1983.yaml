title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3243/83 of 15 November 1983 fixing for the
    1983/84 marketing year the representative market price and the threshold price
    for olive oil and the percentages of the consumption aid to be retained in accordance
    with Article 11 (5) and (6) of Regulation No 136/66/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3243/83 du Conseil du 15 novembre 1983 fixant, pour
    la campagne de commercialisation 1983/1984, le prix représentatif de marché
    et le prix de seuil de l' huile d' olive, ainsi que les pourcentages du montant
    de l' aide à la consommation à retenir conformément à l' article 11 paragraphes
    5 et 6 du règlement no 136/66/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3243/83 des Rates vom 15. November 1983 zur Festsetzung
    des repräsentativen Marktpreises und des Schwellenpreises für Olivenöl sowie
    der gemäß Artikel 11 Absätze 5 und 6 der Verordnung Nr. 136/66/EWG vom Betrag
    der Verbrauchsbeihilfe einzubehaltenden Prozentsätze für das Wirtschaftsjahr
    1983/1984
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3243/83 af 15. november 1983 om fastsættelse
    for produktionsåret 1983/1984 af den repræsentative markedspris og tærskelprisen
    for olivenolie, samt af de procentdele af forbrugsstøtten, der skal tilbageholdes
    i henhold til artikel 11, stk. 5 og 6, i forordning nr. 136/66/EØF
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3243/83 του Συμβουλίου
    της 15ης Νοεμβρίου 1983 περί καθορισμού της αντιπροσωπευτικής
    τιμής αγοράς και της τιμής κατωφλίου του ελαιολάδου
    για την περίοδο εμπορίας 1983/84, καθώς και των
    ποσοστών του ποσού της ενισχύσεως στην κατανάλωση,
    που πρέπει να καθορισθούν σύμφωνα με το άρθρο
    11 παράγραφοι 5 και 6 του κανονισμού αριθ. 136/66/ΕΟΚ
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3243/83 del Consiglio del 15 novembre 1983 che fissa,
    per la campagna di commercializzazione 1983/1984, il prezzo rappresentativo di
    mercato e il prezzo d' entrata dell' olio d' oliva, nonché le percentuali dell'
    importo dell' aiuto al consumo da adottare in conformità dell' articolo 11, paragrafi
    5 e 6, del regolamento n. 136/66/CEE
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3243/83 van de Raad van 15 november 1983 houdende
    vaststelling voor het verkoopseizoen 1983/1984 van de representatieve marktprijs
    en de drempelprijs voor olijfolie en van de overeenkomstig artikel 11, lid 5 en
    lid 6, van Verordening nr. 136/66/EEG in te houden percentages van het bedrag
    van de consumptiesteun
