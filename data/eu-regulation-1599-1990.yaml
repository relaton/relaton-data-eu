    opérations d'aide humanitaire privée à des populations de pays tiers
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1599/90 DER KOMMISSION vom 14. Juni 1990 zur Aenderung
    der Verordnungen (EWG) Nr. 3154/85 und (EWG) Nr. 3719/88 zur Erleichterung bestimmter
    privater Hilfsmassnahmen fuer Menschen in Drittlaendern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1599/90 af 14. juni 1990 om ændring
