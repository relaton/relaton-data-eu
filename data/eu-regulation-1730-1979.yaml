title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1730/79 of 6 August 1979 fixing for the
    1979/80 marketing year the amount of production aid for frozen peeled tomatoes,
    tomato flakes and tomato juice falling within subheading ex 20.02 C of the Common
    Customs Tariff and Williams pears preserved in syrup, and the minimum price to
    be paid to producers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1730/79 de la Commission, du 6 août 1979, fixant,
    pour la campagne 1979/1980, le montant de l' aide à la production, pour les tomates
    pelées surgelées, les flocons de tomates, les jus de tomates de la sous-position
    ex 20.02 C du tarif douanier commun et les poires Williams conservées au sirop,
    ainsi que le prix minimal à payer aux producteurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1730/79 der Kommission vom 6. August 1979 zur Festsetzung
    der Produktionsbeihilfe für gefrorene, geschälte Tomaten, Tomatenflocken, Tomatensaft
    der Tarifstelle ex 20.02 C des Gemeinsamen Zolltarifs und für Williamsbirnen,
    in Sirup haltbar gemacht, sowie des den Erzeugern zu zahlenden Mindestpreises
    für das Wirtschaftsjahr 1979/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1730/79 af 6. august 1979 om fastsættelse
    for produktionsåret 1979/80 af producentstøtten og den minimumspris, der betales
    til producenterne, for frosne flåede tomater, tomater i flager, tomatsaft henhørende
    under pos. ex 20.02 C i den fælles toldtarif og Williamspærer konserveret i
    sukkeropløsning
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1730/79 della Commissione, del 6 agosto 1979, che
    fissa, per la campagna 1979/1980, l' importo dell' aiuto alla produzione per i
    pomodori pelati congelati, i fiocchi di pomodoro, i succhi di pomodoro della sottovoce
    ex 20.02 C della tariffa doganale comune e le pere Williams sciroppate, nonché
    il prezzo minimo da pagare ai produttori
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1730/79 van de Commissie van 6 augustus 1979 tot
    vaststelling, voor het verkoopseizoen 1979/1980, van het bedrag van de produktiesteun
    voor bevroren tomaten zonder schil, tomatenvlokken, soorten tomatesap van post
    ex 20.02 C van het gemeenschappelijk douanetarief en peren van de variëteit Williams
    verduurzaamd in siroop, alsmede van de aan de telers te betalen minimumprijs
  type: main
