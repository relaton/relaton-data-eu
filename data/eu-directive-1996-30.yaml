id: EUDirective199630
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 96/30/EC of 13 May 1996 amending Directive 94/80/EC laying
    down detailed arrangements for the exercise of the right to vote and to stand
    as a candidate in municipal elections by citizens of the Union residing in a Member
    State of which they are not nationals
  type: main
- language: fr
  script: Latn
  content: Directive 96/30/CE du Conseil, du 13 mai 1996, modifiant la directive 94/80/CE
    fixant les modalités de l'exercice du droit de vote et d'éligibilité aux élections
    municipales pour les citoyens de l'Union résidant dans un État membre dont ils
    n'ont pas la nationalité
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/30/EG des Rates vom 13. Mai 1996 zur Änderung der Richtlinie
    94/80/EG über die Einzelheiten der Ausübung des aktiven und passiven Wahlrechts
    bei den Kommunalwahlen für Unionsbürger mit Wohnsitz in einem Mitgliedstaat,
    dessen Staatsangehörigkeit sie nicht besitzen
  type: main
- language: bg
  script: Cyrl
  content: Директива 96/30/ЕО на Съвета от 13 май 1996 година
    за изменение на Директива 94/80/ЕО, за определяне
    на подробните условия, при които гражданите
    на Съюза, пребиваващи в държава-членка, чиито
    граждани не са, упражняват правото си да избират
    и да бъдат избирани по време на общински избори
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 96/30/ES ze dne 13. května 1996, kterou se mění směrnice
    94/80/ES, kterou se stanoví pravidla pro výkon práva volit a práva být volen
    v obecních volbách pro občany Unie s bydlištěm v členském státě, jehož
    nejsou státními příslušníky
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 96/30/EF af 13. maj 1996 om ændring af direktiv 94/80/EF
    om fastsættelse af de nærmere regler for valgret og valgbarhed ved kommunale
    valg for unionsborgere, der har bopæl i en medlemsstat, hvor de ikke er statsborgere
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/30/ΕΚ του Συμβουλίου, της 13ης Μαΐου
    1996, περί τροποποιήσεως της οδηγίας 94/80/ΕΚ περί
    των λεπτομερών κανόνων άσκησης του δικαιώματος
    του εκλέγειν και εκλέγεσθαι κατά τις δημοτικές
    και κοινοτικές εκλογές από τους πολίτες της
    Ένωσης που κατοικούν σε κράτος μέλος του οποίου
    δεν είναι υπήκοοι
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 96/30/EÜ, 13. mai 1996, direktiivi 94/80/EÜ muutmise
    kohta, millega kehtestatakse üksikasjalik kord, mille alusel liikmesriigis elavad,
    kuid selle riigi kodakondsuseta liidu kodanikud saavad kasutada õigust valida
    ja kandideerida liikmesriigi kohalikel valimistel
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 96/30/EY, annettu 13 päivänä toukokuuta 1996, niiden
    unionin kansalaisten kunnallista äänioikeutta ja vaalikelpoisuutta koskevista
    yksityiskohtaisista säännöistä, jotka asuvat jäsenvaltioissa, jonka kansalaisia
    he eivät ole, annetun neuvoston direktiivin 94/80/EY muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 96/30/EZ od 13. svibnja 1996. o izmjeni Direktive 94/80/EZ
    o detaljnom uređenju ostvarivanja prava građana Unije koji borave u državi
    članici čiji nisu državljani da glasuju i budu birani na lokalnim izborima
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/30/EK irányelve (1996. május 13.) az állampolgárságuktól
    eltérő tagállamban lakóhellyel rendelkező uniós polgárok aktív és passzív
    választójogának a helyhatósági választásokon történő gyakorlására
    vonatkozó részletes szabályok megállapításáról szóló 94/80/EK irányelv
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 96/30/CE del Consiglio, del 13 maggio 1996, che modifica la direttiva
    94/80/CE che stabilisce le modalità di esercizio del diritto di voto e di eleggibilità
    alle elezioni comunali per i cittadini dell'Unione che risiedono in uno Stato
    membro di cui non hanno la cittadinanza
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 96/30/EK (1996. gada 13. maijs), ar kuru groza Direktīvu
    94/80/EK, ar ko nosaka sīki izstrādātu kārtību balsstiesību un tiesību
    kandidēt pašvaldību vēlēšanās izmantošanai Savienības pilsoņiem, kas
    uzturas dalībvalstī, kuras pilsoņi tie nav
  type: main
- language: lt
  script: Latn
  content: 1996 m. gegužės 13 d. Tarybos direktyva 96/30/EB, iš dalies keičianti
    Direktyvą 94/80/EB, nustatančią išsamias priemones Sąjungos piliečiams,
    gyvenantiems valstybėje narėje ir nesantiems jos piliečiais, naudotis balsavimo
    teise ir teise būti kandidatais per vietos savivaldos rinkimus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 96/30/KE tat-13 ta' Mejju 1996 li temenda d-Direttiva
    94/80/KE li tistabbilixxi arranġamenti dettaljati għall-eżerċizzju tad-dritt
    tal-vot u li wieħed jippreżenta ruħu bħala kandidat fl-elezzjonijiet muniċipali
    minn ċittadini ta' l-Unjoni li jirrisjedu fi Stat Membru li ma għandhomx iċ-ċittadinanza
    tiegħu
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/30/EG van de Raad van 13 mei 1996 tot wijziging van Richtlijn
    94/80/EG tot vaststelling van de wijze van uitoefening van het actieve en passieve
    kiesrecht bij gemeenteraadsverkiezingen ten behoeve van de burgers van de Unie
    die verblijven in een Lid-Staat waarvan zij de nationaliteit niet bezitten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 96/30/WE z dnia 13 maja 1996 r. zmieniająca dyrektywę
    Rady 94/80/WE ustanawiającą szczegółowe warunki wykonywania prawa głosowania
    i kandydowania w wyborach lokalnych przez obywateli Unii mających miejsce zamieszkania
    w Państwie Członkowskim, którego nie są obywatelami
  type: main
- language: pt
  script: Latn
  content: Directiva 96/30/CE do Conselho, de 13 de Maio de 1996, que altera a Directiva
    94/80/CE, que estabelece as regras de exercício do direito de voto e de elegibilidade
    nas eleições autárquicas dos cidadãos da União residentes num Estado-Membro
    de que não tenham a nacionalidade
  type: main
- language: ro
  script: Latn
  content: Directiva 96/30/CE a Consiliului din 13 mai 1996 de modificare a Directivei
    94/80/CE de stabilire a modalităților de exercitare a dreptului de a alege și
    de a fi ales la alegerile locale pentru cetățenii Uniunii care au reședința
    într-un stat membru a cărui cetățenie nu o dețin
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 96/30/ES z 13. mája 1996, ktorou sa mení a dopĺňa smernica
    94/80/ES, ktorou sa ustanovujú podrobnosti uplatňovania volebného práva občanov
    únie v komunálnych voľbách v členskom štáte, ktorého nie sú štátnymi
    príslušníkmi
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/30/ES z dne 13. maja 1996 o spremembi Direktive 94/80/ES
    o določitvi podrobne ureditve za uresničevanje volilne pravice in pravice do
    kandidiranja na lokalnih volitvah državljanov Unije, ki prebivajo v državi članici,
    v kateri nimajo državljanstva
  type: main
- language: es
  script: Latn
  content: Directiva 96/30/CE del Consejo, de 13 de mayo de 1996, que modifica la
    Directiva 94/80/CE por la que se fijan las modalidades de ejercicio del derecho
    de sufragio activo y pasivo en las elecciones municipales por parte de los ciudadanos
    de la Unión residentes en un Estado Miembro del que no sean nacionales
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/30/EG av den 13 maj 1996 om ändring av direktiv 94/80/EG
    om närmare bestämmelser för rösträtt och valbarhet vid kommunala val för
    unionsmedborgare som är bosatta i en medlemsstat där de inte är medborgare
  type: main
