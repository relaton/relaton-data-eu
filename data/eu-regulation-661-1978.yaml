title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 661/78 of 3 April 1978 re-establishing the
    levying of customs duties on medium oils, for other purposes, falling within subheading
    27.10 B III and originating in Libya, to which the preferential tariff arrangements
    set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 661/78 de la Commission, du 3 avril 1978, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole moyennes destinées à d'autres usages, de la sous-position tarifaire
    27.10 B III, originaires de la Libye, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 661/78 der Kommission vom 3. April 1978 zur Wiedereinführung
    des Zollsatzes für mittelschwere Öle, zu anderer Verwendung, der Tarifstelle
    27.10 B III, mit Ursprung in Libyen, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 661/78 af 3. april 1978 om genindførelse
    af opkrævning af toldafgifter for middelsvære olier, til anden anvendelse, underposition
    27.10 B III, som har oprindelse i Libyen og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 661/78 della Commissione, del 3 aprile 1978, che ripristina
    la riscossione dei dazi doganali applicabili agli oli medi, destinati ad altri
    usi, della sottovoce doganale 27.10 B III, originari della Libia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 661/78 van de Commissie van 3 april 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op halfzware
    oliën, bestemd voor ander gebruik, van post 27.10 B III, van oorsprong uit Libië,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
