title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1921/91 of 27 June 1991 re-establishing
    the levying of customs duties on products falling within CN code 3105, originating
    in Hungary, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1921/91 DE LA COMMISSION du 27 juin 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 3105
    originaires de la Hongrie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1921/91 DER KOMMISSION vom 27. Juni 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 3105 mit Ursprung in Ungarn,
    dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1921/91 af 27. juni 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3105 og med oprindelse
    i Ungarn, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1921/91 της Επιτροπής
    της 27ης Ιουνίου 1991 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 3105, καταγωγής Ουγγαρίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1921/91 DELLA COMMISSIONE del 27 giugno 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 3105 originari dell'' Ungheria beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1921/91 VAN DE COMMISSIE van 27 juni 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 3105, van oorsprong uit Hongarije, waarvoor de in Verordening (EEG)
    nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1921/91 DA COMISSÃO de 27 de Junho de 1991 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos do código NC 3105,
    originários da Hungria, beneficiária das preferências pautais previstas pelo
    Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
