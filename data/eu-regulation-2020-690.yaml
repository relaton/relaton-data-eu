  script: Latn
  content: Commission Implementing Regulation (EU) 2020/690 of 17 December 2019 laying
    down rules for the application of Regulation (EU) 2016/429 of the European Parliament
    and of the Council as regards the listed diseases subject to Union surveillance
    programmes, the geographical scope of such programmes and the listed diseases
    for which the disease-free status of compartments may be established (Text with
    EEA relevance)
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2020/690 de la Commission du 17 décembre
    2019 portant modalités d’application du règlement (UE) 2016/429 du Parlement
    européen et du Conseil en ce qui concerne les maladies répertoriées faisant
    l’objet de programmes de surveillance au sein de l’Union, la portée géographique
    de ces programmes et les maladies répertoriées pour lesquelles des compartiments
    disposant d’un statut «indemne de maladie» peuvent être créés (Texte présentant
    de l’intérêt pour l’EEE)
