title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 895/83 of 15 April 1983 re-establishing
    the levying of customs duties on paint, distemper and brushes, falling within
    subheading 96.01 B ex III and originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 895/83 de la Commission du 15 avril 1983 portant rétablissement
    de la perception des droits de douane applicables à certains brosses, pinceaux
    et articles de brosserie, de la sous-position 96.01 B ex III du tarif douanier
    commun, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 895/83 der Kommission vom 15. April 1983 zur Wiedereinführung
    der Erhebung der Zölle für Farbpinsel, ähnliche Pinsel und Bürsten der Tarifstelle
    96.01 B ex III, mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr.
    3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 895/83 af 15. april 1983 om genindførelse
    af opkrævning af told for pensler til kunstnere samt til undervisningsbrug, henhørende
    under pos. 96.01 B ex III og med oprindelse i Sydkorea, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 895/83 της Επιτροπής
    της 15ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ψήκτρας και χρωστήρες
    δια ζωγραφικήν της διακρίσεως 96.01 Β ex ΙΙΙ του
    Κοινού Δασμολογίου, καταγωγής Νότιας Κορέας,
    δικαιούχου των προβλεπομένων από τον κανονισμό
    (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 895/83 della Commissione del 15 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle spazzole, pennelli e oggetti
    di spazzolificio, della sottovoce 96.01 B ex III della tariffa doganale comune,
    originari della Corea del Sud beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 895/83 van de Commissie van 15 april 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op borstels en
    kwasten van postonderverdeling 96.01 B ex III van oorsprong uit Zuid-Korea waarvoor
    de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
