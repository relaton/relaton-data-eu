    règlement (CEE) no 1207/84 portant dispositions pour soutenir les revenus des
    petits producteurs de lait pendant les campagnes laitières 1984/1985 et 1985/1986
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3177/84 des Rates vom 13. November 1984 zur Änderung
    der Verordnung (EWG) Nr. 1207/84 mit Bestimmungen zur Stützung der Einkommen
    der Kleinerzeuger von Milch während der Milchwirtschaftsjahre 1984/85 und 1985/86
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3177/84 af 13. november 1984 om ændring
    af forordning (EØF) nr. 1207/84 om foranstaltninger med henblik på at støtte
    de mindre mælkeproducenters indkomster i mejeriårene 1984/85 og 1985/86
  type: main
