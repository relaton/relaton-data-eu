  content: Council Regulation (EEC) No 3177/84 of 13 November 1984 amending Regulation
    (EEC) No 1207/84 introducing provisions to support the incomes of small-scale
    milk producers during the 1984/85 and 1985/86 milk years
  type: main
- language: fr
  script: Latn
