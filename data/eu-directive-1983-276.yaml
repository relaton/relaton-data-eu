    76/756/CEE concernente il ravvicinamento delle legislazioni degli Stati Membri
    relative all'installazione dei dispositivi di illuminazione e di segnalazione
    luminosa dei veicoli a motore e dei loro rimorchi
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1983. gada 26. maijs), ar ko groza Direktīvu 76/756/EEK
