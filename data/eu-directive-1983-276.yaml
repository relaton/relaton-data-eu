  content: Council Directive 83/276/EEC of 26 May 1983 amending Directive 76/756/EEC
    on the approximation of the laws of the Member States relating to the installation
    of lighting and light-signalling devices on motor vehicles and their trailers
  type: main
- language: fr
  script: Latn
  content: Directive 83/276/CEE du Conseil du 26 mai 1983 modifiant la directive 76/756/CEE
    concernant le rapprochement des législations des États membres relatives à
    l'installation des dispositifs d'éclairage et de signalisation lumineuse des
    véhicules à moteur et de leurs remorques
  type: main
- language: de
  script: Latn
  content: Richtlinie 83/276/EWG des Rates vom 26. Mai 1983 zur Änderung der Richtlinie
    76/756/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über den
    Anbau der Beleuchtungs- und Lichtsignaleinrichtungen für Kraftfahrzeuge und Kraftfahrzeuganhänger
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 26. května 1983, kterou se mění směrnice 76/756/EHS
