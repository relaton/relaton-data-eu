    zařízení pro osvětlení a světelnou signalizaci motorových vozidel a jejich
    přípojných vozidel
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 83/276/EØF af 26. maj 1983 om ændring af direktiv 76/756/EØF
