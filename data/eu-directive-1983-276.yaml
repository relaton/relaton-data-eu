    à instalação dos dispositivos de iluminação e de sinalização luminosa dos
    veículos a motor e seus reboques
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 26. mája 1983, ktorou sa mení a dopĺňa smernica 76/756/EHS
