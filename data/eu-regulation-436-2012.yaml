    2012 , che modifica, per quanto riguarda la sostanza azametifos, l’allegato
    del regolamento (UE) n. 37/2010 concernente le sostanze farmacologicamente attive
    e la loro classificazione per quanto riguarda i limiti massimi di residui negli
    alimenti di origine animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 436/2012 ( 2012. gada 23. maijs
    ), ar ko attiecībā uz vielu azametifoss groza pielikumu Regulai (ES) Nr. 37/2010
    par farmakoloģiski aktīvajām vielām un to klasifikāciju pēc to atlieku maksimāli
    pieļaujamā satura
  type: main
- language: lt
  script: Latn
  content: 2012 m. gegužės 23 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 436/2012,
    kuriuo dėl medžiagos azametifoso iš dalies keičiamas Reglamento (ES) Nr. 37/2010
    dėl farmakologiškai aktyvių medžiagų, jų klasifikacijos ir didžiausios
    leidžiamosios koncentracijos gyvūniniuose maisto produktuose priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 436/2012 tat-
