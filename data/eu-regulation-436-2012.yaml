title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 436/2012 of 23 May 2012 amending
    the Annex to Regulation (EU) No 37/2010 on pharmacologically active substances
    and their classification regarding maximum residue limits in foodstuffs of animal
    origin, as regards the substance azamethiphos
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 436/2012 de la Commission du 23 mai
    2012 modifiant, pour la substance «azaméthiphos» , l’annexe du règlement
    (UE) n ° 37/2010 relatif aux substances pharmacologiquement actives et à leur
    classification en ce qui concerne les limites maximales de résidus dans les aliments
    d’origine animale
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 436/2012 der Kommission vom 23. Mai 2012
    zur Änderung des Anhangs der Verordnung (EU) Nr. 37/2010 über pharmakologisch
    wirksame Stoffe und ihre Einstufung hinsichtlich der Rückstandshöchstmengen
    in Lebensmitteln tierischen Ursprungs in Bezug auf Azamethiphos
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 436/2012 на Комисията
