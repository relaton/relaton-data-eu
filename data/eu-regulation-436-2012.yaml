    is-sustanzi farmakoloġikament attivi u l-klassifikazzjoni tagħhom fir-rigward
    tal-limiti massimi ta’ residwu fl-oġġetti tal-ikel li ġejjin mill-annimali,
    fil-każ tas-sustanza azametifos
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 436/2012 van de Commissie van 23 mei 2012
    tot wijziging van de bijlage bij Verordening (EU) nr. 37/2010 betreffende farmacologisch
    werkzame stoffen en de indeling daarvan op basis van maximumwaarden voor residuen
    in levensmiddelen van dierlijke oorsprong, wat de stof azamethifos betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 436/2012 z dnia 23 maja 2012
    r. zmieniające, w odniesieniu do substancji azametifos, załącznik do rozporządzenia
    (UE) nr 37/2010 w sprawie substancji farmakologicznie czynnych i ich klasyfikacji
    w odniesieniu do maksymalnych limitów pozostałości w środkach spożywczych
    pochodzenia zwierzęcego
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 436/2012 da Comissão, de 23 de maio
    de 2012 , que altera o anexo do Regulamento (UE) n. ° 37/2010 relativo a substâncias
    farmacologicamente ativas e respetiva classificação no que respeita aos limites
    máximos de resíduos nos alimentos de origem animal, relativamente à substância
    azametifos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 436/2012 al Comisiei din 23
    mai 2012 de modificare a anexei la Regulamentul (UE) nr. 37/2010 privind substanțele
    active din punct de vedere farmacologic și clasificarea lor în funcție de limitele
    reziduale maxime din produsele alimentare de origine animală, în ceea ce privește
    substanța azametifos
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 436/2012 z 23. mája 2012 , ktorým
    sa mení a dopĺňa príloha k nariadeniu (EÚ) č. 37/2010 o farmakologicky účinných
    látkach a ich klasifikácii, pokiaľ ide o maximálne limity rezíduí v potravinách
    živočíšneho pôvodu, v súvislosti s látkou azametyfos
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 436/2012 z dne 23. maja 2012 o spremembi
    Priloge k Uredbi (EU) št. 37/2010 o farmakološko aktivnih snoveh in njihovi
    razvrstitvi glede mejnih vrednosti ostankov v živilih živalskega izvora v zvezi
    s snovjo azametifos
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 436/2012 de la Comisión, de 23 de mayo
    de 2012 , que modifica el anexo del Reglamento (UE) n ° 37/2010, relativo a las
    sustancias farmacológicamente activas y su clasificación por lo que se refiere
    a los límites máximos de residuos en los productos alimenticios de origen animal,
    en lo que respecta a la sustancia azametifos
  type: main
