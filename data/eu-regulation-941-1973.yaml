title:
- language: en
  script: Latn
  content: Regulation (EEC) No 941/73 of the Commission of 5 April 1973 reintroducing
    Common Customs Tariff duties on knitted or crocheted fabric of wool or of fine
    animal hair, falling within subheading No 60.01 A originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2766/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 941/73 de la Commission, du 5 avril 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux étoffes de bonneterie de laine ou poils fins, de la sous-position tarifaire
    60.01 A, originaires des pays en voie de développement, bénéficiaires de préférences
    tarifaires prévues par le règlement (CEE) n° 2766/72 du Conseil du 19 décembre
    1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 941/73 der Kommission vom 5. April 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Gewirke als Meterware, aus Wolle
    oder feinen Tierhaaren der Tarifstelle 60.01 A, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2766/72 des Rates vom 19. Dezember 1972
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 941/73 af 5. april 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for trikotagestof af uld eller fine dyrehår
    under underposition 60.01 A, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2766/72
    af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 941/73 della Commissione, del 5 aprile 1973, che ripristina
    la riscossione dei dazi della tariffa doganale comune applicabili alle stoffe
    a maglia di lana o di peli fini della sottovoce doganale n. 60.01 A, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2766/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 941/73 van de Commissie van 5 april 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op breiwerk en haakwerk, van wol of van fijn haar, van onderverdeling
    60.01 A, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 2766/72 van de Raad van 19 december 1972 tariefpreferenties werden geopend
  type: main
