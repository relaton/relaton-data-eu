    3953/92 concerning the regime applicable to the import into the Community of products
    originating in the Republics of Bosnia-Herzegovina, Croatia, Slovenia and the
    territory of the former Yugoslav Republic of Macedonia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 879/93 de la Commission, du 13 avril 1993, déterminant
