title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2190/87 of 23 July 1987 determining the
    extent to which applications lodged in July 1987 for the issue of import licences
    in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2190/87 de la Commission, du 23 juillet 1987, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importations déposées au mois juillet 1987 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2190/87 der Kommission vom 23. Juli 1987 über den
    Umfang, in dem den im Monat Juli 1987 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2190/87 af 23. juli 1987 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i juli måned 1987 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2190/87 της Επιτροπής
    της 23ης Ιουλίου 1987 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Ιούλιο του 1987 για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2190/87 della Commissione, del 23 luglio 1987, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1987 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2190/87 van de Commissie van 23 juli 1987 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand juli
    1987 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2190/87 da Comissão, de 23 de Julho de 1987, que
    determina em que medida pode ser dado seguimento aos pedidos de concessão de
    certificados de importação entregues no mês de Julho de 1987 para as carnes
    de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2190/87 de la Comisión, de 23 de julio de 1987, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de julio de 1987 para las carnes
    de vacuno congeladas destinadas a la transformación
  type: main
