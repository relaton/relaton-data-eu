title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1275/84 of 7 May 1984 repealing the definitive
    anti-dumping duty on imports of standardized multi-phase electric motors having
    an output of more than 0,75 kW but not more than 75 kW, originating in the Soviet
    Union, and terminating the anti-dumping proceedings in respect of the said imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1275/84 du Conseil du 7 mai 1984 abrogeant le droit
    anti-dumping définitif à l' égard des importations de moteurs électriques
    polyphasés normalisés d' une puissance de plus de 0,75 à 75 kilowatts inclus,
    originaires d' Union soviétique, et clôturant la procédure anti-dumping à
    l' égard des importations susvisées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1275/84 des Rates vom 7. Mai 1984 zur Aufhebung des
    endgültigen Antidumpingzolls auf Einfuhren standardisierter Mehrphasen-Wechselstrommotoren
    mit einer Leistung von mehr als 0,75 bis 75 Kilowatt mit Ursprung in der Sowjetunion
    und zur Einstellung des Antidumpingverfahrens betreffend diese Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1275/84 af 7. maj 1984 om ophævelse af den
    endelige antidumpingtold på importen af standardiserede elektriske motorer, flerfasede,
    med effekt på over 0,75 kW, men højst 75 kW, med oprindelse i Sovjetunionen,
    og om afslutning af antidumpingproceduren vedrørende denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1275/84 του Συμβουλίου
    της 7ης Μαΐου 1984 για την κατάργηση του οριστικού
    δασμού αντιντάμπινγκ όσον αφορά τις εισαγωγές
    τυποποιημένων πολυφασικών ηλεκτρικών κινητήρων
    ισχύος από 0,75 kW μη συμπεριλαμβανομένων έως
    και 75 kW, καταγωγής Σοβιετικής Ένωσης, και για
    την περάτωση της διαδικασίας αντιντάμπινγκ
    όσον αφορά τις ανωτέρω εισαγωγές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1275/84 del Consiglio del 7 maggio 1984 relativo all'
    abrogazione del dazio antidumping definitivo nei confronti delle importazioni
    di motori elettrici polifasi normalizzati, di potenza superiore a 0,75 kW ed inferiore
    o pari a 75 kW, originari dell' Unione Sovietica e che chiude la procedura antidumping
    nei confronti delle importazioni suddette
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1275/84 van de Raad van 7 mei 1984 tot intrekking
    van het definitieve anti-dumpingrecht op de invoer van gestandaardiseerde meerfasige
    elektromotoren met een vermogen van meer dan 0,75 kilowatt tot en met 75 kilowatt,
    van oorsprong uit de Sowjet-Unie, en tot beëindiging van de anti-dumpingprocedure
    ten aanzien van genoemde invoer
  type: main
