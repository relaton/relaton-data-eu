title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1558/83 of 15 June 1983 determining, for
    the 1983/84 marketing year, the components for protection of the processing industry
    in the cereals and rice sector in trade between Greece and the other Member States
    of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1558/83 de la Commission du 15 juin 1983 déterminant,
    pour la campagne de commercialisation 1983/1984, les éléments destinés à assurer
    la protection de l' industrie de transformation des céréales et du riz dans
    les échanges entre la Grèce et les autres États membres de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1558/83 der Kommission vom 15. Juni 1983 zur Festsetzung
    der Bestandteile zum Schutz der Verarbeitungsindustrie auf dem Getreide- und Reissektor
    beim Handel zwischen Griechenland und den anderen Mitgliedstaaten der Gemeinschaft
    für das Wirtschaftsjahr 1983/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1558/83 af 15. juni 1983 om fastsættelse
    for produktionsåret 1983/84 af de elementer, der skal beskytte forarbejdningsindustrien
    for korn og ris i samhandelen mellem Grækenland og Fællesskabets øvrige medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1558/83 της Επιτροπής
    της 15ης Ιουνίου 1983 περί καθορισμού, για την
    περίοδο 1983/84, των στοιχείων τα οποία προορίζονται
    να εξασφαλίσουν την προστασία της μεταποιητικής
    βιομηχανίας σιτηρών και όρυζας στις συναλλαγές
    μεταξύ της Ελλάδας και των Κρατών μελών της
    Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1558/83 della Commissione del 15 giugno 1983 che stabilisce,
    per la campagna di commercializzazione 1983/1984, gli elementi destinati ad assicurare,
    nel settore dei cereali e del riso, la protezione dell' industria di trasformazione
    negli scambi tra la Grecia e gli altri Stati membri della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1558/83 van de Commissie van 15 juni 1983 tot vaststelling
    van het verkoopseizoen 1983/1984 van de elementen ter bescherming van de verwerkende
    industrie in de sector granen en rijst in het handelsverkeer tussen Griekenland
    en de overige Lid-Staten van de Gemeenschap
