title:
- language: en
  script: Latn
  content: '81/760/EEC: Commission Decision of 27 August 1981 authorizing Ireland
    not to apply Community treatment to parkas, anoraks, windcheaters, waisted jackets
    and the like, woven, originating in South Korea (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/760/CEE: Décision de la Commission, du 27 août 1981, autorisant l''Irlande
    à exclure du traitement communautaire les "parkas", anoraks, blousons et similaires,
    tissés, originaires de Corée du Sud (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/760/EWG: Entscheidung der Kommission vom 27. August 1981 zur Ermächtigung
    Irlands, aus Südkorea stammende Parkas, Anoraks, Windjacken und dergleichen,
    aus Geweben, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/760/EØF: Kommissionens beslutning af 27. august 1981 om bemyndigelse
    til Irland til fra fællesskabsbehandling at undtage parcacoats, anorakker, vindjakker,
    blousonjakker og lignende, vævede, med oprindelse i Sydkorea (Kun den engelske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/760/EOK: Απόφαση τής Επιτροπής τής 27ης Αυγούστου
    1981 περί χορηγήσεως αδείας στήν Ιρλανδία νά
    εξαιρέσει από τήν κοινοτική μεταχείριση τά
    υφασμένα parkas, anoraks, μπλουζόν καί παρόμοια, καταγωγής
    Νοτίου Κορέας (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/760/CEE: Decisione della Commissione, del 27 agosto 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario eskimo, giacche a vento, giubbotti
    con o senza cappuccio e simili, tessuti, originari della Corea del Sud (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/760/EEG: Beschikking van de Commissie van 27 augustus 1981 houdende
