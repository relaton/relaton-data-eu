  content: '94/228/EEC: Commission Decision of 27 October 1993 concerning the grant
    of assistance from the cohesion financial instrument to the project in Greece
    - Water- supply system - Water-supply system for the southern part of the town
    of Argos - Water-supply system for the town of Tripolis - Water-supply system
    - Drainage system of Livadia - Stage II of the drainage system and water- supply
    system of Lamia. Nos CF: 93/09/61/056 - 93/09/61/059 - 93/09/61/064 (Only the
    Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/228/CEE: Décision de la Commission du 27 octobre 1993 relative à
