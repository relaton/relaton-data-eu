  script: Latn
  content: Commission Implementing Decision (EU) 2020/2113 of 16 December 2020 amending
    Annex I to Decision 2004/3/EC authorising, in respect of the marketing of seed
    potatoes in all or part of the territory of certain Member States, more stringent
    measures against certain diseases than are provided for in Annexes I and II to
    Council Directive 2002/56/EC, as regards the entry for the United Kingdom (notified
    under document C(2020) 9306)
  type: main
- language: fr
