title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2501/76 of 14 October 1976 re-establishing
    the levying of the customs duties on wood planed, tongued, grooved, rebated, chamfered,
    etc., falling within heading No 44.13, originating in Malaysia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2501/76 de la Commission, du 14 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux bois rabotés,
    rainés, bouvetés, etc., de la position tarifaire 44.13, originaires de la Malaysia,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2501/76 der Kommission vom 14. Oktober 1976 zur Wiedereinführung
    des Zollsatzes für Holz, gehobelt, genutet, gefedert usw., der Tarifnummer 44.13,
    mit Ursprung in Malaysia, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2501/76 af 14. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, falset, affaset eller
    på lignende måde bearbejdet etc., under position 44.13, som har oprindelse i
    Malaysia og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2501/76 della Commissione, del 14 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato ecc., della voce doganale 44.13, originario della Malesia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2501/76 van de Commissie van 14 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op hout, geschaafd,
    geploegd, enz., van post 44.13, van oorsprong uit Maleisië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
