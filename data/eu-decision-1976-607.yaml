---
id: EUDecision1976607
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 May 1976 authorizing the Italian Republic not
    to apply Community treatment to woven fabrics of cotton, other than gauze or terry
    towelling and similar terry fabrics, unbleached, falling within heading No ex
    55.09 of the Common Customs Tariff, originating in the Islamic Republic of Pakistan
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/607/CEE: Décision de la Commission, du 25 mai 1976, autorisant la
    République italienne à exclure du traitement communautaire les tissus de coton
    autres qu''à point de gaze ou boucles du genre éponge, écrus, de la position
    Ex 55.09 du Tarif douanier commun, originaires de la République islamique du
    Pakistan et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. Mai 1976, mit der die Italienische
    Republik ermächtigt wird, aus der Islamischen Republik Pakistan stammende und
    in den anderen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle,
    andere als Drehergewebe oder Schlingengewebe (Frottiergewebe), roh, der Tarifnummer
    ex 55.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 25. maj 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage vævede stoffer af bomuld undtagen
    drejervævet stof og håndklædefrotterstof og lignende frotterstof af bomuld,
    ubleget, som henhører under pos. ex 55.09 i den fælles toldtarif, har oprindelse
    i Den islamitiske republik Pakistan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 25 maggio 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di cotone, diversi
    da quelli a punto di garza o ricci del tipo spugna, greggi, della voce ex 55.09
    della tariffa doganale comune, originari della Repubblica islamica del Pakistan
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 mei 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd weefsels van katoen, andere dan met gaasbinding of dan bad- of
    frotteerstof (lussendoek), ongebleekt, van post ex 55.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Islamitische Republiek Pakistan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
