title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1251/91 of 13 May 1991 imposing a definitive
    anti-dumping duty on imports of audio tapes in cassettes originating in Japan
    and the Republic of Korea, collecting definitively the provisional duty and terminating
    the procedure concerning Hong Kong
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1251/91 du Conseil, du 13 mai 1991, instituant un
    droit antidumping définitif sur les importations de bandes audio en cassettes
    originaires du Japon et de la République de Corée, portant perception définitive
    du droit provisoire et portant clôture de la procédure concernant Hong-Kong
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1251/91 des Rates vom 13. Mai 1991 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Tonbandkassetten mit
    Ursprung in Japan und der Republik Korea, zur endgültigen Vereinnahmung des vorläufigen
    Zolls und zur Einstellung des Verfahrens gegenüber Hongkong
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1251/91 af 13. maj 1991 om indførelse af
    en endelig antidumpingtold på importen af audiobånd i kassetter med oprindelse
    i Japan og Republikken Korea, om endelig opkrævning af den midlertidige told
    og om afslutning af proceduren vedrørende Hongkong
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1251/91 του Συμβουλίου
    της 13ης Μαΐου 1991 περί επιβολής οριστικού δασμού
    αντιντάμπινγκ στις εισαγωγές ταινιών ηχογράφησης
    σε κασέτες, καταγωγής Ιαπωνίας και Δημοκρατίας
    της Κορέας, και περί της οριστικής είσπραξης
    του προσωρινού δασμού και της περάτωσης της
    διαδικασίας όσον αφορά το Χονγκ Κονγκ
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1251/91, annettu 13 päivänä toukokuuta 1991,
    lopullisen polkumyyntitullin käyttöön ottamisesta Japanista ja Korean tasavallasta
    peräisin olevien ääninauhakasettien tuonnissa, väliaikaisen tullin lopullisesta
    kantamisesta ja Hongkongia koskevan menettelyn päätökseen saattamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1251/91 del Consiglio, del 13 maggio 1991, che istituisce
    un dazio antidumping definitivo sulle importazioni di nastri audio in cassette
    originari del Giappone e della Repubblica di Corea, che decide la riscossione
    definitiva dal dazio provvisorio e che chiude la procedura antidumping relativa
    a Hong Kong
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1251/91 van de Raad van 13 mei 1991 tot instelling
    van een definitief anti-dumpingrecht op de invoer van geluidsbanden in cassettes
    van oorsprong uit Japan en de Republiek Korea, tot definitieve inning van de voorlopige
    rechten en tot beëindiging van de procedure betreffende Hong-Kong
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1251/91 do Conselho, de 13 de Maio de 1991, que institui
    um direito anti-dumping definitivo sobre as importações de fitas áudio em cassetes
    originárias do Japão e da República da Coreia, que estabelece a cobrança definitiva
    do direito provisório e encerra o processo relativamente a Hong Kong
  type: main
