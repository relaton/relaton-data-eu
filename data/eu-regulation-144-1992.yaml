title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 144/92 of 22 January 1992 determining the
    extent to which applications lodged in January 1992 for import licences for certain
    poultrymeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 144/92 de la Commission, du 22 janvier 1992, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de janvier 1992 pour certaines viandes de volaille
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 144/92 der Kommission vom 22. Januar 1992 über das
    Ausmaß, in dem den im Januar 1992 für die Einfuhr von bestimmten Geflügelfleisch
    eingereichten Lizenzanträgen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 144/92 af 22. januar 1992 om fastlæggelse
    af, i hvilket omfang de ansøgninger om udstedelse af importlicenser, der er indgivet
    i januar 1992 for visse former for fjerkrækød, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 144/92 της Επιτροπής
    της 22ας Ιανουαρίου 1992 για τον καθορισμό σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν τον Ιανουάριο 1992 για ορισμένα
    κρέατα πουλερικών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 144/92 della Commissione, del 22 gennaio 1992, che
