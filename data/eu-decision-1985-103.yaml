title:
- language: en
  script: Latn
  content: '85/103/EEC: Commission Decision of 21 December 1984 authorizing certain
    Member States to renew intra- Community surveillance of certain textile products
    originating in the People''s Republic of China (Only the German, English, French,
    Greek, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/103/CEE: Décision de la Commission du 21 décembre 1984 autorisant
    certains États membres à renouveler la surveillance intracommunautaire relative
    à certains produits textiles originaires de la République populaire de Chine
    (Les textes en langues allemande, anglaise, française, grecque, italienne et
    néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '85/103/EWG: Entscheidung der Kommission vom 21. Dezember 1984 zur Ermächtigung
    einiger Mitgliedstaaten, die innergemeinschaftlichen Überwachungsmaßnahmen für
    bestimmte Textilwaren mit Ursprung in der Volksrepublik China zu verlängern (Nur
    der deutsche, englische, französische, griechische, italienische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/103/EØF: Kommissionens beslutning af 21. december 1984 om bemyndigelse
    af visse medlemsstater til at forlænge tilsynet inden for Fællesskabet med visse
    tekstilvarer med oprindelse i Den kinesiske Folkerepublik (Kun den tyske, engelske,
    franske, graeske, italienske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '85/103/ΕΟΚ: Απόφαση της Επιτροπής της 21ης
    Δεκεμβρίου 1984 για τη χορήγηση άδειας σε ορισμένα
    κράτη μέλη να ανανεώσουν την ενδοκοινοτική
    επίβλεψη των εισαγωγών στην Κοινότητα ορισμένων
    κλωστοϋφαντουργικών προϊόντων καταγωγής Λαϊκής
    Δημοκρατίας της Κίνας (Τα κείμενα στην γερμανική,
    αγγλική, γαλλική, ελληνική, ιταλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '85/103/CEE: Decisione della Commissione del 21 dicembre 1984 che autorizza
    alcuni Stati membri a rinnovare la sorveglianza intracomunitaria sulle importazioni
    di taluni prodotti tessili originari della Repubblica popolare cinese (Il testi
    in lingua tedesca, inglese, francese, greca, italiana e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '85/103/EEG: Beschikking van de Commissie van 21 december 1984 houdende
    machtiging van bepaalde Lid-Staten om het intracommunautair toezicht ten aanzien
    van bepaalde textielprodukten van oorsprong uit de Volksrepubliek China te verlengen
    (Slechts de teksten in de Duitse, Engelse, Franse, Griekse, Italiaanse en de Nederlandse
    taal zijn authentiek)'
