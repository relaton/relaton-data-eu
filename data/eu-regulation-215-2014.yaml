    regionala utvecklingsfonden, Europeiska socialfonden, Sammanhållningsfonden,
    Europeiska jordbruksfonden för landsbygdsutveckling och Europeiska havs- och
    fiskerifonden och om fastställande av allmänna bestämmelser för Europeiska
    regionala utvecklingsfonden, Europeiska socialfonden, Sammanhållningsfonden och
    Europeiska havs- och fiskerifonden när det gäller metoder för stöd till klimatförändringsmål,
    fastställande av delmål och mål i resultatramen samt nomenklaturen för insatskategorier
    för de europeiska struktur- och investeringsfonderna
