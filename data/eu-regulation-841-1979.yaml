type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 841/79 of 27 April 1979 re-establishing
    the levying of the customs duties on gloves, including mittens and mitts, protective,
    for all trades, falling within subheading 42.03 B I, originating in Hong Kong,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 841/79 de la Commission, du 27 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux gants, y
    compris les moufles, de protection pour tous métiers, de la sous-position 42.03
    B I du tarif douanier commun, originaires de Hong-kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 841/79 der Kommission vom 27. April 1979 zur Wiedereinführung
    des Zollsatzes für Handschuhe, einschließlich Fausthandschuhe, Schutzhandschuhe
    für alle Berufe, der Tarifstelle 42.03 B I, mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 841/79 af 27. april 1979 om genindførelse
    af opkrævning af toldafgifter for handsker (herunder vanter), såvel syede som
    kun tilskårne, beskyttelseshandsker til erhvervsmæssig brug (arbejdshandsker),
    henhørende under pos. 42.03 B I i den fælles toldtarif, som har oprindelse i
    Hongkong og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 841/79 della Commissione, del 27 aprile 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, comprese le
    muffole, di protezione per qualunque mestiere, della sottovoce 42.03 B I della
    tariffa doganale comune, originari di Hong Kong beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 841/79 van de Commissie van 27 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op handschoenen
    en wanten, werkhandschoenen en -wanten, van post 42.03 B I, van oorsprong uit
    Hong Kong, ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
