  script: Latn
  content: Kommissionens förordning (EU) 2025/2016 av den 8 oktober 2025 om rättelse
    av vissa språkversioner av förordning (EU) nr 142/2011 om genomförande av Europaparlamentets
    och rådets förordning (EG) nr 1069/2009 om hälsobestämmelser för animaliska
