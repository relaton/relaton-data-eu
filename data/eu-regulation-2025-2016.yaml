  script: Latn
  content: Commission Regulation (EU) 2025/2016 of 8 October 2025 correcting certain
    language versions of Regulation (EU) No 142/2011 implementing Regulation (EC)
    No 1069/2009 of the European Parliament and of the Council laying down health
    rules as regards animal by-products and derived products not intended for human
    consumption and implementing Council Directive 97/78/EC as regards certain samples
    and items exempt from veterinary checks at the border under that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2025/2016 de la Commission du 8 octobre 2025 rectifiant
    certaines versions linguistiques du règlement (UE) no 142/2011 portant application
    du règlement (CE) no 1069/2009 du Parlement européen et du Conseil établissant
    des règles sanitaires applicables aux sous-produits animaux et produits dérivés
    non destinés à la consommation humaine et portant application de la directive
    97/78/CE du Conseil en ce qui concerne certains échantillons et articles exemptés
    des contrôles vétérinaires effectués aux frontières en vertu de cette directive
  type: main
