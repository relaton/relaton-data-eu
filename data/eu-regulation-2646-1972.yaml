title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2646/72 de la Commission, du 14 décembre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à l'oxyde et peroxyde de zinc, de la position tarifaire 28.19, originaires de
    Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2646/72 der Kommission vom 14. Dezember 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Zinkoxid und Zinkperoxid der Tarifnummer
    28.19, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2795/71
    des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2646/72 della Commissione, del 14 dicembre 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili all'ossido
    e perossido di zinco, della voce doganale n. 28.19, originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2795/71
    del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2646/72 van de Commissie van 14 december 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op zinkoxyde en zinkperoxyde, van post 28.19, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2795/71 van de Raad
    van 20 december 1971 algemene tariefpreferenties werden geopend
  type: main
