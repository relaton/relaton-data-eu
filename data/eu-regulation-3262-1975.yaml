    du prélèvement et/ou de la restitution à l'exportation de froment tendre vers
    les pays de la zone I et le Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3262/75 der Kommission vom 15. Dezember 1975 zur Verlängerung
