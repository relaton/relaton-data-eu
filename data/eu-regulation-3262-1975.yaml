    und/oder der Erstattung für die Ausfuhr von Weichweizen nach Ländern der Zone
    I und nach Portugal
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3262/75 af 15. december 1975 om forlængelse
