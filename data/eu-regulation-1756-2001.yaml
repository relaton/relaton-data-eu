title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1756/2001 of 5 September 2001 derogating,
    with regard to set-aside in Austria, from Regulation (EC) No 2316/1999 laying
    down detailed rules for the application of Council Regulation (EC) No 1251/1999
    establishing a support system for producers of certain arable crops
  type: main
- language: fr
  script: Latn
