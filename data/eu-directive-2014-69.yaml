    πυκνωτών για ονομαστική τάση χαμηλότερη των
    125 V εναλλασσόμενου ρεύματος ή 250 V συνεχούς
    ρεύματος για βιομηχανικά όργανα παρακολούθησης
    και ελέγχου
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/69/EL, 13. märts 2014 , millega
