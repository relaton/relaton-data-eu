    sen mukauttamiseksi tekniikan kehitykseen teollisuuden tarkkailu- ja valvontavälineissä
    käytettäviksi tarkoitettujen nimellisjännitteeltään alle 125 V AC:n tai 250
    V DC:n kondensaattoreiden keraamisten eristeiden sisältämää lyijyä koskevan
    poikkeuksen osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/69/EU оd 13. ožujka 2014. o izmjeni,
    u svrhu prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća u pogledu izuzeća za olovo u dielektričnoj keramici u kondenzatorima
    za nazivni napon manji od 125 V izmjenične struje ili 250 V istosmjerne struje
    za instrumente za praćenje i kontrolu u industriji Tekst važan za EGP
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/69/EU felhatalmazáson alapuló irányelve ( 2014. március
    13. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    az ipari felügyeleti és vezérlő eszközök 125 V alatti névleges egyenfeszültségű
    vagy 250 V alatti névleges váltófeszültségű kondenzátoraiban található
    dielektromos kerámiaanyagokban lévő ólomra megállapított mentesítés tekintetében,
    a műszaki fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/69/UE della Commissione, del 13 marzo 2014 , che
    modifica, per adeguarlo al progresso tecnico, l'allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un'esenzione relativa
    al piombo nella ceramica dielettrica in condensatori per una tensione nominale
    inferiore a 125 V CA o 250 V CC per strumenti di monitoraggio e di controllo industriali
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/69/ES ( 2014. gada 13. marts ), ar
    ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes Direktīvas
    2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svina lietošanai tādu kondensatoru
    dielektriskajā keramikā, kuri paredzēti nominālajam spriegumam līdz 125 V
    maiņstrāvai vai 250 V līdzstrāvai un kurus izmanto rūpnieciskā monitoringa
    un kontroles instrumentos
  type: main
- language: lt
  script: Latn
  content: 2014 m. kovo 13 d. Komisijos deleguotoji direktyva 2014/69/ES, kuria, derinant
    prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir Tarybos
    direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama naudoti
    šviną pramoninių stebėjimo ir kontrolės prietaisų kondensatorių, kurių
    vardinė įtampa mažesnė nei 125 V kintamosios srovės arba 250 V nuolatinės
    srovės, dielektriko keramikoje
  type: main
- language: mt
  script: Latn
  content: Direttiva ta' Delega tal-Kummissjoni 2014/69/UE tat- 13 ta' Marzu 2014
    li temenda, għal skopijiet ta' adattament għall-progress tekniku, l-Anness IV
    tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta' eżenzjoni
    għal ċomb f'ċeramika dielettrika f'kapasiters għal vultaġġ nominali ta'
    inqas minn 125 V AC jew 250 V DC użati fi strumenti ta' monitoraġġ u kontroll
    industrijali
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/69/EU van de Commissie van 13 maart 2014 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood in diëlektrische keramiek in condensatoren voor een
    nominale spanning van minder dan 125 V wisselstroom of 250 V gelijkstroom voor
    industriële meet- en regelapparatuur
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/69/UE z dnia 13 marca 2014 r. zmieniająca,
    w celu dostosowania do postępu technicznego, załącznik IV do dyrektywy Parlamentu
    Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia ołowiu w ceramicznych
    dielektrycznych elementach kondensatorów o napięciu znamionowym niższym niż
    125 V AC lub 250 V DC stosowanych w przyrządach do nadzoru i kontroli w obiektach
    przemysłowych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/69/UE da Comissão, de 13 de março de 2014 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no respeitante a uma isenção
    para a utilização de chumbo em materiais cerâmicos dielétricos de condensadores
    com tensão nominal inferior a 125 V CA ou 250 V CC para instrumentos industriais
    de monitorização e controlo
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/69/UE a Comisiei din 13 martie 2014 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul din materialul dielectric ceramic al condensatoarelor cu tensiunea nominală
    sub 125 Vc.a. sau sub 250 Vc.c. utilizate în instrumentele industriale de monitorizare
    și control
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/69/EÚ z 13. marca 2014 , ktorou sa na
    účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku týkajúcu sa olova v dielektrických
    keramických kondenzátoroch s menovitým napätím menším ako 125 V striedavého
    prúdu (AC) alebo 250 V jednosmerného prúdu (DC) používaných v priemyselných
    monitorovacích a kontrolných prístrojoch
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/69/EU z dne 13. marca 2014 o spremembi,
    zaradi prilagoditve tehničnemu napredku, Priloge IV k Direktivi 2011/65/EU Evropskega
    parlamenta in Sveta glede izjeme za svinec v dielektrični keramiki v kondenzatorjih
    z nazivno napetostjo manj kot 125 V AC ali 250 DC, ki se uporabljajo v instrumentih
    za spremljanje in nadzor za industrijsko uporabo
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/69/UE de la Comisión, de 13 de marzo de 2014 ,
    que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo en cerámica dieléctrica de condensadores con una tensión nominal
    inferior a 125 V CA o 250 V CC para instrumentos industriales de vigilancia y
    control
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/69/EU av den 13 mars 2014 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för bly i dielektrisk keramik
    i kondensatorer med en märkspänning på mindre än 125 V AC eller 250 V DC i
