title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/69/EU of 13 March 2014 amending, for
    the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    in dielectric ceramic in capacitors for a rated voltage of less than 125 V AC
    or 250 V DC for industrial monitoring and control instruments
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/69/UE de la Commission du 13 mars 2014 modifiant,
    aux fins de son adaptation au progrès technique, l'annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb dans la céramique diélectrique des condensateurs pour tension
    inférieure à 125 V AC ou 250 V CC destinés à être utilisés dans les instruments
    de contrôle et de surveillance industriels
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/69/EU der Kommission vom 13. März 2014 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei in dielektrischer Keramik in Kondensatoren für eine
    Nennspannung von weniger als 125 V AC oder 250 V DC für industrielle Überwachungs-
    und Kontrollinstrumente
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/69/ЕС на Комисията
    от 13 март 2014 година за изменение, с цел адаптиране
    към техническия прогрес, на приложение IV към
    Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово
    в керамиката на диелектрика на кондензатори
    с номинално напрежение до 125 ~V или до 250 –V, използвани
    в промишлени контролни и регулиращи прибори
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/69/EU ze dne 13. března
    2014 , kterou se za účelem přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    olovo v dielektrických keramických částech kondenzátorů na jmenovité napětí
    nižší než 125 V střídavých nebo 250 V stejnosměrných pro průmyslové
    monitorovací a kontrolní přístroje
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/69/EU af 13. marts 2014 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU, for så vidt angår undtagne anvendelser af bly i dielektrisk keramik
    i kondensatorer med en mærkespænding på mindre end 125 V AC eller 250 V DC
    til industrielle overvågnings- og reguleringsinstrumenter
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση οδηγία 2014/69/ΕΕ της Επιτροπής,
    της 13ης Μαρτίου 2014 , για τροποποίηση, με σκοπό
    την προσαρμογή στην τεχνική πρόοδο, του παραρτήματος
    IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά μία εξαίρεση
