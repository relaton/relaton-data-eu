    direktiivi 2011/65/EL IV lisa seoses plii kasutamisega erandina selliste kondensaatorite
    keraamilistes dielektrikutes, mille nimipinge on väiksem kui 125 V (vahelduvpinge)
    või 250 V (alalispinge) ja mida kasutatakse tööstuslikes seire- ja kontrolliseadmetes
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/69/EU, annettu 13 päivänä maaliskuuta
