id: EUDecision1975219
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 19 March 1975 authorizing the United Kingdom to
    permit, for a period which expires on 30 June 1975, the marketing of seed of broad
    bean not complying with the requirements set out in the Council Directive on the
    marketing of vegetable seed
  type: main
- language: fr
  script: Latn
  content: '75/219/CEE: Décision de la Commission, du 19 mars 1975, autorisant le
    Royaume-Uni à admettre pour une période expirant le 30 juin 1975, la commercialisation
    de semences de fèves, ne répondant pas aux exigences de la directive du Conseil
    concernant la commercialisation des semences de légumes'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. März 1975 zur Ermächtigung des Vereinigten
    Königreichs, für einen Zeitraum, der am 30. Juni 1975 ausläuft, Saatgut von
    Puffbohnen zum gewerbsmäßigen Verkehr zuzulassen, das den Anforderungen der
    Richtlinie des Rates über den Verkehr mit Gemüsesaatgut nicht entspricht
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 19. marts 1975 om bemyndigelse til Det forenede
    Kongerige til at tillade, at frø af valsk bønne, der ikke opfylder kravene i
    Rådets direktiv om handel med grønsagsfrø, bringes i handelen i et tidsrum,
    der udløber den 30. juni 1975
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 marzo 1975, che autorizza il Regno
    Unito ad ammettere, per un periodo che scade il 30 giugno 1975, la commercializzazione
    di sementi di fava da orto che non soddisfano alle norme della direttiva del Consiglio
    relativa alla commercializzazione di sementi di ortaggi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 maart 1975 waarbij het Verenigd Koninkrijk
    wordt gemachtigd om voor een periode eindigend op 30 juni 1975 zaad van bonen,
    dat niet beantwoordt aan de eisen van de richtlijn van de Raad betreffende het
    in de handel brengen van groentezaden, tot de handel toe te laten
  type: main
