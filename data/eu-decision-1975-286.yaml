title:
- language: en
  script: Latn
  content: Commission Decision of 18 April 1975 authorizing the Republic of Italy
    to permit for a period expiring on 31 July 1975 the marketing of seed of sunflower
    not complying with the requirements in the Council Directive on the marketing
    of seed of oil and fibre plants
  type: main
- language: fr
  script: Latn
  content: '75/286/CEE: Décision de la Commission, du 18 avril 1975, autorisant la
    République italienne à admettre, pour une période expirant le 31 juillet 1975,
    la commercialisation de semences de tournesol ne répondant pas aux exigences
    de la directive du Conseil concernant la commercialisation de semences de plantes
    oléagineuses et à fibres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. April 1975 zur Ermächtigung der Italienischen
    Republik, für einen Zeitraum, der am 31. Juli 1975 abläuft, Saatgut von Sonnenblumen
    zum gewerbsmäßigen Verkehr zuzulassen, das den Anforderungen der Richtlinie
    des Rates über den Verkehr mit Saatgut von Öl- und Faserpflanzen nicht entspricht
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. april 1975 om bemyndigelse til Den italienske
    Republik til at tillade, at frø af solsikke, der ikke opfylder kravene i Rådets
    direktiv om handel med frø af olie- og spindplanter, bringes i handelen i et
    tidsrum, der udløber den 31. juli 1975
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 aprile 1975, che autorizza la Repubblica
    italiana ad ammettere per un periodo che scade il 31 luglio 1975, la commercializzazione
    di sementi di girasole che non soddisfano alle norme della direttiva del Consiglio
    relativa alla commercializzazione delle sementi di piante oleaginose di fibra
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 april 1975 tot machtiging van de Italiaanse
    Republiek om voor een periode eindigend op 31 juli 1975 zaaizaad van zonnebloemen,
    dat niet beantwoordt aan de eisen van de richtlijn van de Raad betreffende het
    in de handel brengen van zaaizaad van oliehoudende planten en vezelgewassen, tot
    de handel toe te laten
  type: main
