title:
- language: en
  script: Latn
  content: COUNCIL REGULATION (EC) No 2962/95 of 18 December 1995 repealing Regulations
    (EEC) No 868/90 and (EEC) No 898/91 imposing definitive anti-dumping duties on
    imports of certain welded tubes, of iron or non-alloy steel, originating in Yugoslavia
    except Serbia and Montenegro and Romania, and in Turkey and Venezuela respectively
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2962/95 du Conseil du 18 décembre 1995 abrogeant le
    règlement (CEE) n° 868/90 instituant un droit antidumping définitif sur les
    importations de certains tubes soudés, en fer ou en aciers non alliés, originaires
    de Yougoslavie, à l'exception de la Serbie et du Monténégro, et de la Roumanie,
    et le règlement (CEE) n° 898/91 instituant un droit antidumping définitif sur
    les importations du même produit originaire de Turquie et du Venezuela
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2962/95 DES RATES vom 18. Dezember 1995 zur Aufhebung
    der Verordnung (EWG) Nr. 868/90 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren bestimmter geschweißter Rohre aus Eisen oder nichtlegiertem
    Stahl mit Ursprung in Jugoslawien (ohne Serbien und Montenegro) und in Rumänien
    sowie der Verordnung (EWG) Nr. 898/91 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren der gleichen Ware mit Ursprung in der Türkei und Venezuela
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 2962/95 af 18. december 1995 om ophævelse
    af forordning (EØF) nr. 868/90 om indførelse af en endelig antidumpingtold på
    importen af visse svejsede rør af jern eller ulegeret stål med oprindelse i
    Jugoslavien (undtagen Serbien og Montenegro) og Rumænien, og forordning (EØF)
    nr. 898/91 om indførelse af en endelig antidumpingtold på importen af samme
    vare med oprindelse i Tyrkiet og Venezuela
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2962/95 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 18ης Δεκεμβρίου 1995 για την κατάργηση του
    κανονισμού (ΕΟΚ) αριθ. 868/90 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    συγκολλητών σωλήνων από σίδηρο ή μη κεκραμένο
    χάλυβα, καταγωγής Γιουγκοσλαβίας (εκτός Σερβίας
    και Μαυροβουνίου) και Ρουμανίας, και του κανονισμού
    (ΕΟΚ) αριθ. 898/91 περί επιβολής οριστικού δασμού
    αντιντάμπινγκ στις εισαγωγές του ίδιου προϊόντος
    καταγωγής Τουρκίας και Βενεζουέλας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2962/95, annettu 18 päivänä joulukuuta 1995,
    lopullisen polkumyyntitullin käyttöönotosta Jugoslaviasta (Serbiaa ja Montenegroa
    lukuunottamatta) ja Romaniasta ja vastaavasti Turkista ja Venezuelasta peräisin
    olevien eräiden rautaa tai seostamatonta terästä olevien hitsaamalla saumattujen
    putkien tuonnissa annettujen asetusten (ETY) N:o 868/90 ja (ETY) N:o 898/91 kumoamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2962/95 DEL CONSIGLIO del 18 dicembre 1995 che abroga
    i regolamenti (CEE) n. 868/90 e (CEE) n. 898/91 che istituiscono dazi antidumping
    definitivi sulle importazioni di alcuni tipi di tubi saldati, di ferro o di acciai
    non legati, originari della Iugoslavia (eccetto la Serbia ed il Montenegro), della
    Romania e, rispettivamente, della Turchia e del Venezuela
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2962/95 VAN DE RAAD van 18 december 1995 tot intrekking
    van Verordening (EEG) nr. 868/90 tot instelling van een definitief anti-dumpingrecht
    op de invoer van bepaalde gelaste buizen van ijzer of van niet-gelegeerd staal
    van oorsprong uit Joegoslavië (met uitzondering van Servië en Montenegro) en
    Roemenië, alsmede van Verordening (EEG) nr. 898/91 tot instelling van een definitief
    anti-dumpingrecht op de invoer van dezelfde produkten van oorsprong uit Turkije
    en Venezuela
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2962/95 DO CONSELHO de 18 de Dezembro de 1995 que
    revoga os Regulamentos (CEE) nº 868/90 e (CEE) nº 898/91, que instituem um direito
    anti-dumping definitivo sobre as importações de certos tubos soldados, de ferro
    ou de aço não ligado, originários da Jugoslávia (com excepção da Sérvia
    e do Montenegro) e da Roménia, da Turquia e da Venuzuela respectivamente
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 2962/95 DEL CONSEJO de 18 de diciembre de 1995 que
    deroga el Reglamento (CEE) nº 868/90 por el que se establece un derecho antidumping
    definitivo sobre las importaciones de determinados tubos soldados de hierro o
    de acero sin alear, originarios de Yugoslavia (excepto Serbia y Montenegro) y
    Rumanía, y el Reglamento (CEE) nº 898/91 por el que se establecen derechos antidumping
    definitivos sobre las importaciones del mismo producto originario de Turquía
    y Venezuela
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2962/95 av den 18 december 1995 om upphävande
    av förordning (EEG) nr 868/90 om införande av en slutgiltig antidumpningstull
    på import av vissa svetsade rör av järn eller olegerat stål, med ursprung
    i Jugoslavien (med undantag av Serbien och Montenegro) och Rumänien och förordning
    (EEG) nr 898/91 om införande av en slutlig antidumpningstull på import av samma
    produkt med ursprung i Turkiet eller Venezuela
  type: main
