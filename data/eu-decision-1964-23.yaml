title:
- language: fr
  script: Latn
  content: Décision de la Commission n° 64/23/CEE, du 9 janvier 1964, autorisant
    le Royaume de Belgique et le Grand-Duché de Luxembourg à percevoir un montant
    compensatoire sur l'importation de certaines catégories d'aliments pour animaux,
    contenant du lait
  type: main
- language: de
  script: Latn
  content: '64/23/EWG: Entscheidung der Kommission vom 9. Januar 1964, mit der das
    Königreich Belgien und das Großherzogtum Luxemburg zur Erhebung eines Ausgleichsbetrags
    bei der Einfuhr bestimmter Milch enthaltender Futtermittel ermächtigt werden'
  type: main
- language: it
  script: Latn
  content: '64/23/CEE: Decisione della Commissione del 9 gennaio 1964 che autorizza
    il Regno del Belgio e il Granducato del Lussemburgo a riscuotere un ammontare
    compensativo all''importazione di alcune categorie di alimenti per animali, contenenti
    latte'
  type: main
- language: nl
  script: Latn
  content: '64/23/EEG: Beschikking van de Commissie van 9 januari 1964 houdende machtiging
    van het Koninkrijk België en het Groothertogdom Luxemburg tot het heffen van
    een compenserend bedrag op de invoer van bepaalde soorten melk bevattende veevoeders'
  type: main
