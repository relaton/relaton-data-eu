title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2704/2000 of 11 December 2000 amending Regulation
    (EC) No 1899/97 laying down rules of application in the poultrymeat and egg sectors
    for the arrangements covered by Council Regulations (EC) No 1727/2000 and (EC)
    No 3066/95 and repealing Regulations (EEC) No 2699/93 and (EEC) No 1559/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2704/2000 de la Commission du 11 décembre 2000 modifiant
    le règlement (CE) nº 1899/97 établissant les modalités d'application dans
    les secteurs de la viande de volaille et des oeufs du régime prévu par les règlements
    (CE) nº 1727/2000 et (CE) nº 3066/95 du Conseil et abrogeant les règlements
    (CEE) nº 2699/93 et (CE) nº 1559/94
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2704/2000 der Kommission vom 11. Dezember 2000 zur
    Änderung der Verordnung (EG) Nr. 1899/97 zur Festlegung der die Sektoren Geflügelfleisch
    und Eier betreffenden Durchführungsbestimmungen zu den Verordnungen (EG) Nr.
    1727/2000 und (EG) Nr. 3066/95 des Rates und zur Aufhebung der Verordnungen (EWG)
    Nr. 2699/93 und (EG) Nr. 1559/94
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2704/2000 af 11. december 2000 om ændring
    af forordning (EF) nr. 1899/97 om gennemførelsesbestemmelser for anvendelse i
    æg- og fjerkrækødssektoren af den ordning, der er fastsat i Rådets forordning
    (EF) nr. 1727/2000 og (EF) nr. 3066/95, og om ophævelse af forordning (EØF)
    nr. 2699/93 og (EF) nr. 1559/94
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2704/2000 της Επιτροπής,
    της 11ης Δεκεμβρίου 2000, για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1899/97 για τον καθορισμό
    των λεπτομερών κανόνων εφαρμογής στους τομείς
    του κρέατος πουλερικών και των αυγών, του καθεστώτος
    που προβλέπεται από τους κανονισμούς (ΕΚ) αριθ.
    1727/2000 και (ΕΚ) αριθ. 3066/95 του Συμβουλίου και για
    την κατάργηση των κανονισμών (ΕΟΚ) αριθ. 2699/93
    και (ΕΚ) αριθ. 1559/94
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2704/2000, annettu 11 päivänä joulukuuta 2000,
    neuvoston asetuksissa (EY) N:o 1727/2000 ja (EY) N:o 3066/95 säädetyn siipikarjanliha-
    ja muna-alan järjestelmän soveltamista koskevista yksityiskohtaisista säännöistä
    sekä asetusten (ETY) N:o 2699/93 ja (EY) N:o 1559/94 kumoamisesta annetun asetuksen
    (EY) N:o 1899/97 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2704/2000 della Commissione, dell'11 dicembre 2000,
    recante modifica del regolamento (CE) n. 1899/97 che stabilisce le modalità d'applicazione,
    per il settore delle uova e del pollame, del regime previsto dai regolamenti (CE)
    n. 1727/2000 e (CE) n. 3066/95 del Consiglio e che abroga i regolamenti (CEE)
    n. 2699/93 e (CE) n. 1559/94
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2704/2000 van de Commissie van 11 december 2000 tot
    wijziging van Verordening (EG) nr. 1899/97 houdende vaststelling van bepalingen
    voor de uitvoering, in de sectoren slachtpluimvee en eieren, van de regeling waarin
    is voorzien bij de Verordeningen (EG) nr. 1727/2000 en (EG) nr. 3066/95 van de
    Raad, en houdende intrekking van de Verordeningen (EEG) nr. 2699/93 en (EG) nr.
    1559/94
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2704/2000 da Comissão, de 11 de Dezembro de 2000,
    que altera o Regulamento (CE) n.o 1899/97 que estabelece as regras de execução,
    nos sectores da carne de aves de capoeira e dos ovos, do regime previsto pelos
    Regulamentos (CE) n.o 1727/2000 e (CE) n.o 3066/95 do Conselho e que revoga os
    Regulamentos (CEE) n.o 2699/93 e (CE) n.o 1559/94
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2704/2000 de la Comisión, de 11 de diciembre de 2000,
    que modifica el Reglamento (CE) nº 1899/97 por el que se establecen las disposiciones
    de aplicación del régimen establecido en los Reglamentos (CE) nº 1727/2000
    y (CE) nº 3066/95 del Consejo, en los sectores de los huevos y la carne de aves
    de corral, y se derogan los Reglamentos (CEE) nº 2699/93 y (CE) nº 1559/94
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2704/2000 av den 11 december 2000 om
    ändring av förordning (EG) nr 1899/97 om tillämpningsföreskrifter vad avser
    fjäderfäkött och ägg för den ordning som fastställs i rådets förordningar
