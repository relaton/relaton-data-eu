title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3450/80 of 22 December 1980 laying down certain
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of certain third countries in the 200 nautical-mile zone
    off the coast of the French department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3450/80 du Conseil, du 22 décembre 1980, fixant certaines
    mesures de conservation et de gestion des ressources de pêche applicables à
    des navires battat pavillon de certains pays tiers dans la zone de 200 milles
    située au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3450/80 des Rates vom 22. Dezember 1980 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände in
    der 200-Meilen-Zone für die Küste des französischen Departements Guyana gegenüber
    Schiffen, die die Flagge von Drittländern führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3450/80 af 22. december 1980 om fastsættelse
    af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3450/80 τού Συμβουλίου
    τής 22ας Δεκεμβρίου 1980 περί καθορισμού ορισμένων
    μέτρων διατηρήσεως καί διαχειρίσεως τών αλιευτικών
    πόρων πού εφαρμόζονται στά σκάφη, τά οποία
    φέρουν σημαία ορισμένων τρίτων χωρών, εντός
    τής ζώνης τών 200 μιλίων πού κείται στά ανοικτά
    τών ακτών τού γαλλικού διαμερίσματος τής Γουιάνας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3450/80 del Consiglio, del 22 dicembre 1980, che stabilisce
    talune misure per la conservazione e la gestione delle risorse ittiche da applicare
    alle navi battenti bandiera di taluni paesi terzi nella zona di 200 miglia nautiche
    situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3450/80 van de Raad van 22 december 1980 tot vaststelling
    van bepaalde maatregelen voor de instandhouding en het beheer van de visbestanden
    welke, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    van toepassing zijn in de zone van 200 zeemijl voor de kust van het Franse departement
    Guyana
  type: main
