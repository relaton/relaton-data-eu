    Ländern geschlossener Handelsabkommen über die Übergangszeit hinaus'
  type: main
- language: it
  script: Latn
  content: '69/468/CEE: Decisione del Consiglio, dell''8 dicembre 1969, che autorizza
    il tacito rinnovo oltre la fine del periodo transitorio di taluni accordi commerciali
    conclusi dagli Stati membri con paesi terzi'
  type: main
- language: nl
