    van het mandaat van het Internationaal Straftribunaal voor het voormalige Joegoslavië
    (ICTY)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 607/2005 z dnia 18 kwietnia 2005 r. zmieniającego
    po raz czwarty rozporządzenie Rady (WE) nr 1763/2004 nakładające określone
    środki ograniczające dla wsparcia skutecznego wykonania mandatu Międzynarodowego
    Trybunału Karnego dla byłej Jugosławii (MTKJ)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 607/2005 da Comissão, de 18 de Abril de 2005, que
