    tam tikras ribojančias priemones, remiančias veiksmingą Tarptautinio baudžiamojo
    tribunolo buvusiai Jugoslavijai (TBTBJ) mandato vykdymą
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 607/2005 van de Commissie van 18 april 2005 houdende
    vierde wijziging van Verordening (EG) nr. 1763/2004 van de Raad tot vaststelling
