    determinadas medidas restritivas de apoio ao exercício efectivo do mandato do
    Tribunal Penal Internacional para a antiga Jugoslávia (TPIJ)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 607/2005 al Comisiei din 18 aprilie 2005 de efectuare
    a celei de-a patra modificări a Regulamentului (CE) nr. 1763/2004 al Consiliului
    de impunere a unor măsuri restrictive pentru sprijinirea punerii în aplicare
    eficiente a mandatului Tribunalului Penal Internațional pentru fosta Iugoslavie
    (TPII)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 607/2005 z 18. apríla 2005, ktorým sa po
