  content: Commission Regulation (EEC) No 505/77 of 11 March 1977 correcting Regulation
    (EEC) No 403/77 as regards certain rates of refunds applicable to certain cereal
    and rice products exported in the form of goods not covered by Annex II to the
    Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 505/77 de la Commission, du 11 mars 1977, rectifiant
    le règlement (CEE) n 403/77 en ce qui concerne certains taux des restitutions
    applicables à certains produits des secteurs des céréales et du riz exportés
    sous forme de marchandises ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 505/77 der Kommission vom 11. März 1977 zur Berichtigung
    der Verordnung (EWG) Nr. 403/77 hinsichtlich verschiedener Sätze der Erstattung
    bei der Ausfuhr bestimmter Getreide- und Reiserzeugnisse in Form von nicht unter
    Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 505/77 af 11. marts 1977 om berigtigelse
    af forordning (EØF) nr. 403/77 for så vidt angår visse restitutionssatser,
    der skal anvendes for visse produkter fra korn- og rissektoren, der udføres i
    form af varer, som ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 505/77 della Commissione, dell'11 marzo 1977, che
    rettifica il regolamento (CEE) n. 403/77 per quanto riguarda taluni tassi delle
    restituzioni applicabili a taluni prodotti dei settori dei cereali e del riso
    esportati sotto forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 505/77 van de Commissie van 11 maart 1977 houdende
    verbetering van Verordening (EEG) nr. 403/77 met betrekking tot enkele restitutiebedragen
    die worden toegepast voor bepaalde produkten van de sector granen en de sector
    rijst, uitgevoerd in de vorm van niet in bijlage II van het Verdrag vermelde goederen
