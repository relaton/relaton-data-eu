    modifications apportées au modèle destiné aux programmes opérationnels présentés
    au titre de l’objectif «Investissement pour la croissance et l’emploi» et
    au modèle destiné aux programmes de coopération présentés au titre de l’objectif
    «Coopération territoriale européenne» en ce qui concerne l’action de cohésion
    pour les réfugiés en Europe (CARE)
  type: main
