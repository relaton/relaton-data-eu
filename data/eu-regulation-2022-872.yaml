- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/872 of 1 June 2022 amending
    Implementing Regulation (EU) No 288/2014 as regards changes to the model for operational
    programmes under the Investment for growth and jobs goal and the model for cooperation
    programmes under the European territorial cooperation goal with regard to Cohesion’s
    actions for refugees in Europe (CARE)
  type: main
- language: fr
  script: Latn
