    des Musters für operationelle Programme im Rahmen des Ziels „Investitionen
    in Wachstum und Beschäftigung“ und des Musters für Kooperationsprogramme im
    Rahmen des Ziels „Europäische territoriale Zusammenarbeit“ in Bezug auf den
