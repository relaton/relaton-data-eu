  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2021/2259 al Parlamentului European și al Consiliului
    din 15 decembrie 2021 de modificare a Regulamentului (UE) nr. 1286/2014 în ceea
    ce privește prelungirea dispozițiilor tranzitorii pentru societățile de administrare,
