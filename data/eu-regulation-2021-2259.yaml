    appliqué aux sociétés de gestion, aux sociétés d’investissement et aux
    personnes qui fournissent des conseils au sujet des parts d’organismes de placement
    collectif en valeurs mobilières (OPCVM) et d’OPCVM non coordonnés ou qui vendent
