    za društva za upravljanje, društva za investicije i osobe koje savjetuju o udjelima
    subjekata za zajednička ulaganja u prenosive vrijednosne papire (UCITS) i subjekata
    koji nisu UCITS ili prodaju takve udjele
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2021/2259 rendelete (2021. december
