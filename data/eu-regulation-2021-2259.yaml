    rendelkezés meghosszabbítása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2021/2259 del Parlamento europeo e del Consiglio del 15
    dicembre 2021 che modifica il regolamento (UE) n. 1286/2014 per quanto riguarda
    la proroga del regime transitorio per le società di gestione, le società d’investimento
    e le persone che forniscono consulenza sulle quote di organismi d’investimento
    collettivo in valori mobiliari (OICVM) e di non OICVM o vendono quote di tali
    prodotti
  type: main
