title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1264/2003 of 16 July 2003 initiating an investigation
    concerning the alleged circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 2320/97 on imports of certain seamless pipes and tubes of iron
    or non-alloy steel originating in Russia and of anti-dumping measures imposed
    by Council Regulation (EC) No 348/2000 on imports of certain seamless pipes and
    tubes of iron or non-alloy steel originating in Ukraine by wrong declaration of
    imports of the same product and by imports of certain seamless pipes and tubes
    of alloy steel, other than stainless steel, originating in Russia and Ukraine,
    and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1264/2003 de la Commission du 16 juillet 2003 ouvrant
    une enquête sur le prétendu contournement des mesures antidumping instituées
    par le règlement (CE) n° 2320/97 du Conseil sur les importations de certains
    tubes et tuyaux sans soudure, en fer ou en acier non allié, originaires de Russie,
    ainsi que des mesures antidumping instituées par le règlement (CE) n° 348/2000
    du Conseil sur les importations de certains tubes et tuyaux sans soudure, en fer
    ou en acier non allié, originaires d'Ukraine, par une fausse déclaration des
    importations du même produit et par des importations de certains tubes et tuyaux
    sans soudure, en acier allié, autres qu'inoxydables, originaires de Russie et
    d'Ukraine, et rendant obligatoire l'enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1264/2003 der Kommission vom 16. Juli 2003 zur Einleitung
    einer Untersuchung betreffend die angebliche Umgehung der mit der Verordnung (EG)
    Nr. 2320/97 des Rates eingeführten Antidumpingmaßnahmen gegenüber Einfuhren
    bestimmter nahtloser Rohre aus Eisen oder nicht legiertem Stahl mit Ursprung in
    Russland sowie der mit der Verordnung (EG) Nr. 348/2000 des Rates eingeführten
    Antidumpingmaßnahmen gegenüber Einfuhren bestimmter nahtloser Rohre aus Eisen
    oder nicht legiertem Stahl mit Ursprung in der Ukraine durch falsche Anmeldung
    von Einfuhren derselben Ware und durch Einfuhren bestimmter nahtloser Rohre aus
    legiertem Stahl, ausgenommen Edelstahl, mit Ursprung in Russland und der Ukraine
    sowie zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1264/2003 af 16. juli 2003 om indledning
    af en undersøgelse vedrørende den påståede omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 2320/97, på importen af visse
    sømløse rør af jern eller ulegeret stål med oprindelse i Rusland, og de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 348/2000, på importen af visse
    sømløse rør af jern eller ulegeret stål med oprindelse i Ukraine, ved forkert
    angivelse af import af den samme vare og ved import af visse sømløse rør af
    legeret stål, bortset fra rustfrit stål, med oprindelse i Rusland og Ukraine,
    og om at gøre denne import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1264/2003 της Επιτροπής,
