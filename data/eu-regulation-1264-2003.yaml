    υπαγωγή των εν λόγω εισαγωγών σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1264/2003, annettu 16 päivänä heinäkuuta
    2003, tiettyjen Venäjältä peräisin olevien raudasta tai seostamattomasta teräksestä
    valmistettujen saumattomien putkien tuonnissa neuvoston asetuksella (EY) N:o 2320/97
    ja tiettyjen Ukrainasta peräisin olevien raudasta tai seostamattomasta teräksestä
    valmistettujen saumattomien putkien tuonnissa neuvoston asetuksella (EY) N:o 348/2000
    käyttöön otettujen polkumyyntitoimenpiteiden väitettyä kiertämistä esittämällä
    samasta tuotteesta virheellisiä tuonti-ilmoituksia ja tiettyjen Venäjältä
    ja Ukrainasta peräisin olevien seosteräksestä, ei kuitenkaan ruostumattomasta
    teräksestä, valmistettujen saumattomien putkien tuonnilla koskevan tutkimuksen
    vireillepanosta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1264/2003 della Commissione, del 16 luglio 2003, che
    apre un'inchiesta relativa alla presunta elusione delle misure antidumping istituite
    dal regolamento (CE) n. 2320/97 del Consiglio sulle importazioni di alcuni tipi
    di tubi senza saldatura, di ferro o di acciai non legati, originari della Russia
    e delle misure antidumping istituite dal regolamento (CE) n. 348/2000 del Consiglio
    sulle importazioni di alcuni tipi di tubi senza saldatura, di ferro o di acciai
    non legati, originari dell'Ucraina, realizzata mediante scorretta dichiarazione
    delle importazioni dello stesso prodotto e mediante importazioni di alcuni tipi
    di tubi senza saldatura e di acciai non legati, diversi dagli acciai inossidabili,
    originari della Russia e dell'Ucraina, e che dispone la registrazione di tali
    importazioni
  type: main
- language: lv
  script: Latn
  content: Commission Regulation (EC) No 1264/2003 of 16 July 2003 initiating an investigation
    concerning the alleged circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 2320/97 on imports of certain seamless pipes and tubes of iron
    or non-alloy steel originating in Russia and of anti-dumping measures imposed
    by Council Regulation (EC) No 348/2000 on imports of certain seamless pipes and
    tubes of iron or non-alloy steel originating in Ukraine by wrong declaration of
    imports of the same product and by imports of certain seamless pipes and tubes
    of alloy steel, other than stainless steel, originating in Russia and Ukraine,
    and making such imports subject to registration
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1264/2003 van de Commissie van 16 juli 2003 tot opening
    van een onderzoek naar de mogelĳke ontwĳking van de antidumpingrechten die bĳ
    Verordening (EG) nr. 2320/97 van de Raad zĳn ingesteld op de invoer van bepaalde
    naadloze buizen en pĳpen van ĳzer of van niet-gelegeerd staal van oorsprong
    uit Rusland en van de antidumpingrechten die bĳ Verordening (EG) nr. 348/2000
    van de Raad zĳn ingesteld op de invoer van bepaalde naadloze buizen en pĳpen
    van ĳzer of van niet-gelegeerd staal van oorsprong uit Oekraïne, door onjuiste
    aangifte van de invoer van dit product en door de invoer van bepaalde naadloze
    buizen en pĳpen van gelegeerd staal, ander dan roestvrĳ staal, van oorsprong
    uit Rusland en Oekraïne, en tot instelling van een registratieregeling voor deze
    invoer
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1264/2003 da Comissão, de 16 de Julho de 2003, que
    inicia um inquérito relativo à alegada evasão às medidas anti-dumping instituídas
    pelo Regulamento (CE) n.° 2320/97 do Conselho sobre as importações de certos
    tubos sem costura, de ferro ou de aço não ligado, originários da Rússia e
    medidas anti-dumping instituídas pelo Regulamento (CE) n.° 348/2000 do Conselho
    sobre as importações de certos tubos sem costura, de ferro ou de aço não ligado,
    originários da Ucrânia em virtude da declaração incorrecta das importações
    do mesmo produto e das importações de certos tubos sem costura e de tubos de
    aço ligado, excepto o aço inoxidável, originários da Rússia e da Ucrânia,
    e que torna essas importações sujeitas a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1264/2003 de la Comisión, de 16 de julio de 2003,
    por el que se abre una investigación referente a la supuesta elusión de medidas
    antidumping impuestas por el Reglamento (CE) n° 2320/97 del Consejo, sobre las
    importaciones de determinados tubos sin soldadura y tubos de hierro o de acero
    sin alear, originarias de Rusia, y de medidas antidumping impuestas por el Reglamento
    (CE) n° 348/2000 del Consejo, sobre las importaciones de determinados tubos sin
    soldadura y tubos de hierro o de acero sin alear, originarias de Ucrania, mediante
    declaración falsa de importaciones del mismo producto y mediante importaciones
    de determinados tubos sin soldadura y tubos de acero aleado, excepto el inoxidable,
    originarias de Rusia y de Ucrania, y por el que se someten a registro tales importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1264/2003 av den 16 juli 2003 om inledande
    av en undersökning beträffande påstått kringgående, genom felaktig deklaration
    av import av vissa sömlösa rör av järn eller olegerat stål och av import
    av vissa sömlösa rör av järn eller legerat stål, annat än rostfritt stål,
    med ursprung i Ryska federationen och Ukraina, av de antidumpningsåtgärder som
    genom rådets förordning (EG) nr 2320/97 införts på import av vissa sömlösa
    rör av järn eller olegerat stål med ursprung i Ryska federationen och av de
    antidumpningsåtgärder som genom rådets förordning (EG) nr 348/2000 införts
    på import av vissa sömlösa rör av järn eller olegerat stål med ursprung
    i Ukraina, och om registrering av sådan import
