    zur Gründung einer Assoziation zwischen der Europäischen Gemeinschaft und ihren
    Mitgliedstaaten einerseits und der Demokratischen Volksrepublik Algerien andererseits
    eingesetzten Assoziationsrat zur Änderung des genannten Abkommens durch die Ersetzung
    des Protokolls Nr. 6 über die Bestimmung des Begriffs „Erzeugnisse mit Ursprung
    in“ oder „Ursprungserzeugnisse“ und über die Methoden der Zusammenarbeit
    der Verwaltungen zu vertreten ist
  type: main
