  content: Council Decision (EU) 2024/3222 of 12 December 2024 on the position to
    be adopted on behalf of the European Union within the Association Council set
    up by the Euro-Mediterranean Agreement establishing an Association between the
    European Community and its Member States, of the one part, and the People’s
    Democratic Republic of Algeria, of the other part, as regards the amendment of
    that Agreement by replacing Protocol No 6 thereto concerning the definition of
    the concept of ‘originating products’ and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/3222 du Conseil du 12 décembre 2024 relative à la
    position à prendre, au nom de l’Union européenne, au sein du Conseil d’association
    institué par l’accord euro-méditerranéen établissant une association entre
    la Communauté européenne et ses États membres, d’une part, et la République
    algérienne démocratique et populaire, d’autre part, en ce qui concerne la
    modification dudit accord par le remplacement de son protocole n° 6 relatif à
    la définition de la notion de «produits originaires» et aux méthodes de coopération
    administrative
  type: main
- language: de
  script: Latn
