    dauginamąja medžiaga, neatitinkančia Tarybos direktyvų 66/404/EEB ir 71/161/EEB
    reikalavimų (pranešta dokumentu Nr. C(2002) 4525)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-22 ta’ Novembru 2002 li temenda d-Deċiżjoni
