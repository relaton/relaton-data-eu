    šumskog reprodukcijskog materijala koji ne udovoljava zahtjevima direktiva Vijeća
    66/404/EEZ i 71/161/EEZ (priopćena pod brojem dokumenta C(2002) 4525)'
  type: main
- language: hu
  script: Latn
