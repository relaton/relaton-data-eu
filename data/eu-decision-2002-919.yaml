    il-marketing ta’ materjal ta’ riproduzzjoni tal-forestrija li ma jissodisfax
    il-ħtiġiet tad-Direttivi tal-Kunsill 66/404/KEE u 71/161/KEE (innotifikata taħt
    id-dokument numru C(2002) 4525)
  type: main
- language: nl
  script: Latn
  content: '2002/919/EG: Beschikking van de Commissie van 22 november 2002 houdende
    wĳziging van Beschikking 2001/765/EG tot machtiging van de lidstaten om tĳdelĳk
    toe te staan dat bosbouwkundig teeltmateriaal dat niet aan de vereisten van de
    Richtlĳnen 66/404/EEG en 71/161/EEG van de Raad voldoet, in de handel wordt gebracht
    (Voor de EER relevante tekst) (kennisgeving geschied onder nummer C(2002) 4525)'
  type: main
