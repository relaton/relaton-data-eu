title:
- language: en
  script: Latn
  content: '2002/919/EC: Commission Decision of 22 November 2002 amending Decision
    2001/765/EC authorising Member States to permit temporarily the marketing of forest
    reproductive material not satisfying the requirements of Council Directives 66/404/EEC
    and 71/161/EEC (Text with EEA relevance) (notified under document number C(2002)
    4525)'
  type: main
- language: fr
  script: Latn
  content: '2002/919/CE: Décision de la Commission du 22 novembre 2002 modifiant
    la décision 2001/765/CE autorisant les États membres à admettre temporairement
    la commercialisation de matériels forestiers de reproduction ne répondant pas
    aux exigences des directives 66/404/CEE et 71/161/CEE du Conseil (Texte présentant
    de l''intérêt pour l''EEE) [notifiée sous le numéro C(2002) 4525]'
  type: main
- language: de
  script: Latn
  content: '2002/919/EG: Entscheidung der Kommission vom 22. November 2002 zur Änderung
    der Entscheidung 2001/765/EG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinien
    66/404/EWG und 71/161/EWG des Rates nicht entspricht (Text von Bedeutung für
    den EWR) (Bekannt gegeben unter Aktenzeichen K(2002) 4525)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 22 ноември 2002 година
    за изменение на Решение 2001/765/ЕО за разрешаване
    на държавите-членки да допускат временно търговията
    с горски репродуктиве материал, който не отговаря
    на изискванията на Директиви 66/404/ЕИО и 71/161/ЕИО
    на Съвета (нотифицирано под номер С(2002) 4525)
  type: main
- language: cs
  script: Latn
