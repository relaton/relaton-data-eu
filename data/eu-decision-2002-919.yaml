    2001/765/ES, kterým se členské státy opravňují dočasně povolit uvádění
    reprodukčního materiálu lesních dřevin nesplňujícího požadavky směrnic
    Rady 66/404/EHS a 71/161/EHS na trh (oznámeno pod číslem K(2002) 4525)
  type: main
- language: da
  script: Latn
  content: '2002/919/EF: Kommissionens beslutning af 22. november 2002 om ændring
    af beslutning 2001/765/EF om bemyndigelse af medlemsstaterne til midlertidigt
    at tillade handel med forstligt formeringsmateriale, der ikke opfylder kravene
    i Rådets direktiv 66/404/EØF og 71/161/EØF (EØS-relevant tekst) (meddelt under
    nummer K(2002) 4525)'
  type: main
- language: el
  script: Grek
