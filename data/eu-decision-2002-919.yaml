    tanácsi irányelv követelményeinek nem megfelelő erdészeti szaporítóanyagok
    ideiglenes forgalomba hozatala engedélyezésének tekintetében a tagállamok
    felhatalmazásáról szóló 2001/765/EK határozat módosításáról (az értesítés
    a C(2002) 4525. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2002/919/CE: Decisione della Commissione, del 22 novembre 2002, che modifica
    la decisione 2001/765/CE che autorizza gli Stati membri ad ammettere temporaneamente
    la commercializzazione di materiali forestali di moltiplicazione non rispondenti
    ai requisiti prescritti dalle direttive 66/404/CEE e 71/161/CEE del Consiglio
    (Testo rilevante ai fini del SEE) [notificata con il numero C(2002) 4525]'
  type: main
- language: lv
  script: Latn
