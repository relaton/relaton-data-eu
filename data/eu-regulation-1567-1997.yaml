title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1567/97 of 1 August 1997 imposing a definitive
    anti-dumping duty on imports of leather handbags originating in the People's Republic
    of China and terminating the proceeding concerning imports of plastic and textile
    handbags originating in the People's Republic of China
  type: main
- language: fr
  script: Latn
