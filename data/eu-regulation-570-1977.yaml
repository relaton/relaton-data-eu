title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 570/77 of 17 March 1977 re-establishing
    the levying of customs duties on other goat and kidskin leather, other, falling
    within subheading 41.04 B II, originating in developing countries to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3021/76
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 570/77 de la Commission, du 17 mars 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    de caprins non dénommées, de la sous-position tarifaire 41.04 B II originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 570/77 der Kommission vom 17. März 1977 zur Wiedereinführung
    des Zollsatzes für bestimmtes Ziegen- und Zickelleder der Tarifstelle 41.04 B
    II, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr.
    3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 570/77 af 17. marts 1977 om genindførelse
    af opkrævning af toldafgifter for læder af gede- og gedekidskind, andre varer,
    under underposition 41.04 B II, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 570/77 della Commissione, del 17 marzo 1977, che ripristina
    la riscossione dei dazi doganali applicabili alle altre pelli caprine, non nominate,
    della sottovoce doganale 41.04 B II, originarie dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 570/77 van de Commissie van 17 maart 1977 houdende
    wederinstelling van de heffing van de douanerechten voor ander geiteleder, overige,
    van post 41.04 B II, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad tariefpreferenties werden geopend
  type: main
