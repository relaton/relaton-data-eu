  content: Council Regulation (EEC) No 798/76 of 6 April 1976 amending Regulation
    (EEC) No 567/76 laying down general rules governing the distillation of table
    wines for which the distillation contract must be approved before 15 April 1976
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 798/76 du Conseil, du 6 avril 1976, modifiant le règlement
    (CEE) n° 567/76 établissant les règles générales relatives à des opérations
    de distillation des vins de table dont le contrat de distillation doit être agréé
    avant le 15 avril 1976
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 798/76 des Rates vom 6. April 1976 zur Änderung der
    Verordnung (EWG) Nr. 567/76 über allgemeine Regeln für die Destillation von
    Tafelwein, für den der Destillationsvertrag vor dem 15. April 1976 genehmigt
    werden muß
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 798/76 af 6. april 1976 om ændring af forordning
