title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1795/2004 of 15 October 2004 initiating a
    ‘new exporter’ review of Council Regulation (EC) No 1995/2000 imposing a definitive
    anti-dumping duty on imports of solutions of urea and ammonium nitrate originating,
    inter alia, in Algeria, repealing the duty with regard to imports from one exporter
    in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1795/2004 de la Commission du 15 octobre 2004 portant
    ouverture d'un réexamen au titre de «nouvel exportateur» du règlement (CE)
    n° 1995/2000 du Conseil instituant un droit antidumping définitif sur les importations
    de solutions d'urée et de nitrate d'ammonium originaires, entre autres, d'Algérie,
    abrogeant le droit appliqué aux produits d'un exportateur de ce pays et soumettant
    les importations de ces produits à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1795/2004 der Kommission vom 15. Oktober 2004 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 1995/2000 des Rates zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Lösungen von Harnstoff
    und Ammoniumnitrat mit Ursprung unter anderem in Algerien (Überprüfung für
    einen neuen Ausführer), zur Außerkraftsetzung des Zolls auf die Einfuhren von
    einem Ausführer in diesem Land und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1795/2004 ze dne 15. října 2004, kterým
