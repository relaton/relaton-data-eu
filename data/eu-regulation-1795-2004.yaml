    végleges dömpingellenes vám kivetéséről szóló 1995/2000/EK tanácsi rendelet
    „új exportőri” felülvizsgálatának kezdeményezéséről és az ezen ország
    egyik exportőrétől történő behozatalra vonatkozó vám eltörléséről,
    valamint ezen importokra vonatkozó nyilvántartásba vételi kötelezettségről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1795/2004 della Commissione, del 15 ottobre 2004, che
    avvia un riesame relativo ai «nuovi esportatori» del regolamento (CE) n. 1995/2000
    del Consiglio che istituisce un dazio antidumping definitivo sulle importazioni
    di soluzioni di urea e nitrato di ammonio originarie, tra l'altro, dell’Algeria,
    abroga il dazio per quanto riguarda le importazioni di un esportatore di questo
    paese e stabilisce che tali importazioni siano soggette a registrazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1795/2004 (2004. gada 15. oktobris), ar kuru
