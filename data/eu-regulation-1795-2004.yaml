    o uložení konečného antidumpingového cla z dovozů směsí močoviny a dusičnanu
    amonného pocházejících mimo jiné z Alžírska a o zrušení cla z dovozů
    pro jednoho vývozce z této země a o podřízení těchto dovozů celní evidenci
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1795/2004 af 15. oktober 2004 om indledning
    af en fornyet undersøgelse vedrørende en ny eksportør af Rådets forordning
    (EF) nr. 1995/2000 om indførelse af en endelig antidumpingtold på importen af
    opløsninger af urinstof og ammoniumnitrat med oprindelse i bl.a. Algeriet, om
