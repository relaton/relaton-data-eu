  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1795/2004 z dnia 15 października 2004
    r. dotyczące wszczęcia pod kątem „nowych eksporterów” przeglądu rozporządzenia
    Rady (WE) nr 1995/2000 nakładającego ostateczne cło antydumpingowe na przywóz
    roztworów mocznika i azotanu amonu, pochodzących między innymi z Algierii,
    uchylającego cło w stosunku do przywozu od jednego eksportera z tego kraju i
    nakładającego na ten przywóz obowiązek rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1795/2004 da Comissão, de 15 de Outubro de 2004,
    que inicia um reexame sobre um «novo exportador» no âmbito do Regulamento (CE)
    n.° 1995/2000 do Conselho, que institui direitos anti-dumping definitivos sobre
    as importações de soluções de ureia e de nitrato de amónio originárias,
    nomeadamente, da Argélia, que revoga o direito em vigor no que respeita às importações
    de um exportador neste país e que sujeita estas importações a registo
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1795/2004 z 15. októbra 2004, ktorým sa začína
