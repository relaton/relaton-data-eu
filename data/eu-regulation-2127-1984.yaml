title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2127/84 of 23 July 1984 increasing the Community
    tariff quota opened by Regulation (EEC) No 3056/83 for yarn spun entirely from
    waste silk other than noil, not put up for retail sale, falling within subheading
    50.05 A of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2127/84 du Conseil du 23 juillet 1984 portant augmentation
    du volume du contingent tarifaire communautaire ouvert, par le règlement (CEE)
    no 3056/83, pour des fils entièrement de bourre de soie (schappe), non conditionnés
    pour la vente au détail, de la sous-position 50.05 A du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2127/84 des Rates vom 23. Juli 1984 zur Aufstockung
    des durch die Verordnung (EWG) Nr. 3056/83 eröffneten Gemeinschaftszollkontingents
    für Garne, ganz aus Schappeseide, nicht in Aufmachungen für den Einzelverkauf,
    der Tarifstelle 50.05 A des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2127/84 af 23. juli 1984 om forhøjelse af
    det ved forordning (EØF) nr. 3056/83 åbnede fællesskabstoldkontingent for garn
    udelukkende af schappesilke, ikke i detailsalgsoplægninger, henhørende under
    pos. 50.05 A i den fælles toldtarif
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2127/84 του Συμβουλίου
    της 23ης Ιουλίου 1984 για την αύξηση της ποσότητας
    της κοινοτικής δασμολογικής ποσόστωσης που
    ανοίχθηκε με τον κανονισμό (ΕΟΚ) αριθ. 3056/83,
    για νήματα εξ ολοκλήρου εκ γναφάλων μετάξης,
    μη συσκευασμένα για τη λιανική πώληση, της
    διάκρισης 50.05 Α του Κοινού Δασμολογίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2127/84 del Consiglio del 23 luglio 1984 che aumenta
    il volume del contingente tariffario comunitario aperto dal regolamento (CEE)
    n. 3056/83 per i filati interamente di borra di seta (schappe), non preparati
    per la vendita al minuto, della sottovoce 50.05 A della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2127/84 van de Raad van 23 juli 1984 houdende verhoging
    van het communautair tariefcontingent dat bij Verordening (EEG) nr. 3056/83 is
    geopend voor garens, geheel van vlokzijde, niet gereed voor de verkoop in het
    klein, van post 50.05 A van het gemeenschappelijk douanetarief
  type: main
