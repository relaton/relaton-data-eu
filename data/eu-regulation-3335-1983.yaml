    für den Verkauf getrockneter Weintrauben und getrockneter Feigen der Ernte 1981
    für besondere Verwendungszwecke
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3335/83 af 25. november 1983 om anden
