title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1655/71 de la Commission, du 23 juillet 1971, fixant
    les taux des restitutions applicables, à compter du 1er août 1971, aux oeufs
    et aux jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de
    l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1655/71 der Kommission vom 23. Juli 1971 zur Festsetzung
    der ab 1. August 1971 geltenden Erstattungssätze bei der Ausfuhr von Eiern und
    Eigelb in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1655/71 della Commissione, del 23 luglio 1971, che
    fissa i tassi delle restituzioni applicabili a decorrere dal 1 agosto 1971 alle
    uova e ai tuorli d'uovo esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1657/71 van de Commissie van 23 juli 1971 houdende
    vaststelling van de restituties die met ingang van 1 augustus 1971 worden toegepast
    voor eieren en eigeel, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
  type: main
