title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1381 of 23 May 2024 laying
    down, pursuant to Regulation (EU) 2021/2282 on health technology assessment, procedural
    rules for the interaction during, exchange of information on, and participation
    in, the preparation and update of joint clinical assessments of medicinal products
    for human use at Union level, as well as templates for those joint clinical assessments
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1381 de la Commission du 23 mai 2024
    établissant, conformément au règlement (UE) 2021/2282 concernant l’évaluation
    des technologies de la santé, les règles de procédure applicables à l’interaction
    au cours des évaluations cliniques communes de médicaments à usage humain au
    niveau de l’Union, à l’échange d’informations concernant l’élaboration
    et la mise à jour de ces évaluations et à la participation à ces dernières,
    ainsi que des modèles pour ces évaluations cliniques communes
  type: main
