title:
- language: fr
  script: Latn
  content: Décision du Conseil du 20 décembre 1969, portant dérogation à la décision,
    du 9 octobre 1961, relative à l'uniformisation de la durée des accords commerciaux,
    pour l'accord commercial à long terme négocié entre le gouvernement de la République
    française et le gouvernement de la République socialiste tchécoslovaque
  type: main
- language: de
  script: Latn
  content: '70/9/EWG: Entscheidung des Rates vom 20. Dezember 1969 über eine Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen hinsichtlich des zwischen den Regierungen der Französischen Republik
    und der Tschechoslowakischen Sozialistischen Republik ausgehandelten langfristigen
    Abkommens über die Handelsbeziehungen'
  type: main
- language: it
  script: Latn
  content: '70/9/CEE: Decisione del Consiglio, del 20 dicembre 1969, recante deroga
    alla decisione del 9 ottobre 1961, relativa all''uniformazione della durata degli
    accordi commerciali per quanto concerne l''accordo commerciale a lungo termine
    negoziato tra il governo della Repubblica francese e il governo della Repubblica
    socialista di Cecoslovacchia concernente gli scambi commerciali tra i due paesi'
  type: main
- language: nl
  script: Latn
  content: '70/9/EEG: Beschikking van de Raad van 20 december 1969 houdende afwijking
    van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden, ten aanzien van het akkoord op lange termijn inzake het
    handelsverkeer, tussen de Regering van de Franse Republiek en de Regering van
    de Socialistische Republiek Tsjechoslowakije'
  type: main
