    de commercialisation 1986/1987 ainsi que la taxe compensatoire à percevoir dans
    les cas où ce prix n' est pas respecté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2382/86 der Kommission vom 29. Juli 1986 zur Festsetzung
