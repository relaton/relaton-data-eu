    und der im Falle der Nichteinhaltung dieses Preises zu erhebenden Ausgleichsabgabe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2382/86 af 29. juli 1986 om fastsættelse
