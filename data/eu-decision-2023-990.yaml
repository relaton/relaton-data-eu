  content: Council Decision (EU) 2023/990 of 25 April 2023 on the position to be taken
    on behalf of the European Union at the Conference of the Parties to the Rotterdam
    Convention on the Prior Informed Consent Procedure for certain hazardous chemicals
    and pesticides in international trade as regards certain amendments to the Convention
    and its Annex III
  type: main
- language: fr
  script: Latn
