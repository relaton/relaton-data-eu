title:
- language: en
  script: Latn
  content: '81/151/EEC: Commission Decision of 23 February 1981 changing the import
    arrangements established by Council Decision 80/1278/EEC and applied in Italy
    in respect of imports of bicycle tyres and inner tubes from the People''s Republic
    of China (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/151/CEE: Décision de la Commission, du 23 février 1981, modifiant
    le régime d''importation prévu par la décision 80/1278/CEE du Conseil et appliqué
    en Italie à l''égard de la République populaire de Chine en ce qui concerne
    les pneumatiques et chambres à air pour vélocipèdes (Le texte en langue italienne
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/151/EWG: Entscheidung der Kommission vom 23. Februar 1981 zur Änderung
    der mit Entscheidung 80/1278/EWG des Rates festgelegten und in Italien gegenüber
    der Volksrepublik China angewandten Einfuhrregelung für Reifen und Luftschläuche
    für Fahrräder (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/151/EØF: Kommissionens beslutning af 23. februar 1981 om ændring
    af den importordning, der er fastsat i Rådets beslutning 80/1278/EØF, og som
    anvendes i Italien over for Den kinesiske Folkerepublik, for så vidt angår dæk
    og slanger til cykler (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/151/ΕΟΚ: Απόφαση τής Επιτροπής τής 23ης
    Φεβρουαρίου 1981 περί τροποποιήσεως τού καθεστώτος
    εισαγωγής τό οποίο προβλέπεται από τήν απόφαση
    80/1278/ΕΟΚ τού Συμβουλίου καί τό οποίο εφαρμόζεται
    στήν Ιταλία έναντι τής Λαϊκής Δημοκρατίας
    τής Κίνας όσον αφορά τά επίσωτρα καί τούς αεροθαλάμους
    γιά ποδήλατα (Το κείμενο στην ιταλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/151/CEE: Decisione della Commissione, del 23 febbraio 1981, che modifica
    il regime d''importazione, istituito con la decisione 80/1278/CEE del Consiglio,
    applicato in Italia nei confronti delle Repubblica popolare cinese in riferimento
    alle coperture e camera d''aria per velocipedi (Il testo in lingua italiana è
    il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/151/EEG: Beschikking van de Commissie van 23 februari 1981 houdende
    wijziging van de bij Beschikking 80/1278/EEG van de Raad vastgestelde invoerregeling
    welke in Italië ten opzichte van de Volksrepubliek China wordt toegepast met
    betrekking tot buitenbanden en binnenbanden voor rijwielen (Slechts de tekst in
    de Italiaanse taal is authentiek)'
