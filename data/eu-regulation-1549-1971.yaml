title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1549/71 of the Commission of 20 July 1971 amending
    Regulation (EEC) No 757/71 on special rules of application for granting aid for
    exports of skimmed milk powder for use as feed and skimmed milk processed into
    compound feeding-stuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1549/71 de la Commission, du 20 juillet 1971, modifiant
    le règlement (CEE) n° 757/71 relatif à des modalités d' application particulières
    concernant l' octroi d' aides pour le lait écréme en poudre destiné à l' alimentation
    des animaux et le lait écrémé transformé en aliments composés lors de l'
    exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1549/71 der Kommission vom 20. Juli 1971 zur Änderung
    der Verordnung (EWG) Nr. 757/71 über besondere Durchführungsbestimmungen hinsichtlich
    der Beihilfengewährung für Magermilchpulver für Futterzwecke und zu Mischfutter
    verarbeitete Magermilch bei der Ausfuhr
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1549/71 af 20. juli 1971 om ændring
    af forordning (EØF) nr. 757/71 om særlige, ved udførsel gældende, gennemførelsesbestemmelser
    om ydelse af støtte til skummetmælkspulver til foderbrug og skummetmælk, der
    forarbejdes til foderblandinger
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1549/71 della Commissione, del 20 luglio 1971, che
    modifica il regolamento (CEE) n. 757/71 relativo a modalità d' applicazione particolari
    concernenti la concessione d' aiuti per il latte scremato in polvere destinato
    all' alimentazione degli animali e per il latte scremato trasformato in alimenti
    composti, al momento dell' esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1549/71 van de Commissie van 20 juli 1971 houdende
    wijziging van Verordening (EEG) nr. 757/71 betreffende bijzondere uitvoeringsbepalingen
    met betrekking tot de steunverlening bij uitvoer voor magere-melkpoeder bestemd
    voor voederdoeleinden en tot mengvoeder verwerkte ondermelk
