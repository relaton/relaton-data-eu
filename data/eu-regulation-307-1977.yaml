title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 307/77 of 11 February 1977 repealing Commission
    Regulation (EEC) No 170/77 of 26 January 19/7 re-establishing the levying of customs
    duties on primary cells and primary batteries falling within heading No 85.03,
    originating in Hong Kong to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 307/77 de la Commission, du 11 février 1977, abrogeant
    le règlement (CEE) n° 170/77 de la Commission, du 26 janvier 1977, portant rétablissement
    de la perception des droits de douane applicables aux piles électriques, de la
    position tarifaire 85.03, originaires de Hong-Kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 307/77 der Kommission vom 11. Februar 1977 zur Aufhebung
    der Verordnung (EWG) Nr. 170/77 der Kommission vom 26. Januar 1977 zur Wiedereinführung
    des Zollsatzes für Primärelemente und Primärbatterien der Tarifnummer 85.03
    mit Ursprung in Hongkong, denen die in der Verordnung (EWG) Nr. 3021/76 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 307/77 af 11. februar 1977 om ophævelse
    af Kommissionens forordning (EØF) nr. 170/77 af 26. januar 1977 om genindførelse
    af opkrævning af toldafgifter for primærelementer og primærbatterier under
    position 85.03, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 307/77 della Commissione, dell'11 febbraio 1977, che
    abroga il regolamento (CEE) n. 170/77 della Commissione, del 26 gennaio 1977,
    che ripristina la ricossione dei dazi doganali applicabili alle pile elettriche
    della voce doganale 85.03, originarie di Hong Kong, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 307/77 van de Commissie van 11 februari 1977 waarbij
    de Verordening (EEG) nr. 170/77 van de Commissie van 26 januari 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op elektrische
    elementen en elektrische batterijen van post 85.03, van oorsprong uit Hong-Kong,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend, wordt ingetrokken
  type: main
