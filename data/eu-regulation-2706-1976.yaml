    til anvendelse i foder i henhold til forordning (EØF) nr. 563/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2706/76 della Commissione, dell' 8 novembre 1976,
    recante modifica del regolamento (CEE) n. 753/76 che stabilisce le modalità di
    vendita del latte scremato in polvere destinato ad essere utilizzato negli alimenti
    per gli animali ai sensi del regolamento (CEE) n. 563/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2706/76 van de Commissie van 8 november 1976 tot
