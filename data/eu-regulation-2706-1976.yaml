  content: Commission Regulation (EEC) No 2706/76 of 8 November 1976 amending Regulation
    (EEC) No 753/76 laying down detailed rules for the sale of skimmed-milk powder
    for use in animal feed pursuant to Regulation (EEC) No 563/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2706/76 de la Commission, du 8 novembre 1976, modifiant
    le règlement (CEE) n° 753/76 portant modalités d' application relatives à
    la vente de lait écrémé en poudre destiné à être utilisé dans les aliments
    pour animaux dans le cadre du règlement (CEE) n° 563/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2706/76 der Kommission vom 8. November 1976 zur Änderung
    der Verordnung (EWG) Nr. 753/76 über Durchführungsbestimmungen für den Verkauf
    von Magermilchpulver, das im Rahmen der Verordnung (EWG) Nr. 563/76 zur Verwendung
    in Futtermitteln bestimmt ist
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2706/76 af 8. november 1976 om ændring
