    tridemorf și trifluralin în sau pe anumite produse și de modificare a regulamentului
    menționat anterior prin stabilirea anexei V care prezintă lista valorilor implicite
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 899/2012 z 21. septembra 2012 , ktorým sa
    menia a dopĺňajú prílohy II a III k nariadeniu Európskeho parlamentu a Rady
    (ES) č. 396/2005, pokiaľ ide o maximálne hladiny rezíduí pre acefát, alachlór,
    anilazín, azocyklotín, benfurakarb, butylát, kaptafol, karbaryl, karbofurán,
    karbosulfán, chlórfenapyr, chlórtal-dimetyl, chlórtiamid, cyhexatín, diazinón,
    dichlobenil, dikofol, dimetipín, dinikonazol, disulfoton, fenitrotión, flufenzín,
    furatiokarb, hexakonazol, laktofén, mepronil, metamidofos, metoprén, monokrotofos,
    monurón, oxykarboxín, oxydemetón-metyl, paratión-metyl, forát, fosalón,
    procymidón, profenofos, propachlór, chinklorak, chintozén, tolylfluanid, trichlórfon,
    tridemorf a trifluralín v alebo na určitých produktoch a ktorým sa mení a
    dopĺňa uvedené nariadenie stanovením prílohy V, v ktorej sa uvádzajú štandardné
    hodnoty
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 899/2012 z dne 21. septembra 2012 o spremembi
    prilog II in III k Uredbi Evropskega parlamenta in Sveta (ES) št. 396/2005 glede
    mejnih vrednostih ostankov za acefat, alaklor, anilazin, azociklotin, benfurakarb,
    butilat, kaptafol, karbaril, karbofuran, karbosulfan, klorfenapir, klortal-dimetil,
    klortiamid, ciheksatin, diazinon, diklobenil, dikofol, dimetipin, dinikonazol,
    disulfoton, fenitrotion, flufenzin, furatiokarb, heksakonazol, laktofen, mepronil,
    metamidofos, metopren, monokrotofos, monuron, oksikarboksin, oksidemeton-metil,
    paration-metil, forat, fosalon, procimidon, profenofos, propaklor, kvinklorak,
    kvintozen, tolilfluanid, triklorfon, tridemorf in trifluralin v nekaterih proizvodih
    ali na njih ter o spremembi navedene uredbe z določitvijo Priloge V o privzetih
    vrednostih
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 899/2012 de la Comisión, de 21 de septiembre de 2012
    , por el que se modifican los anexos II y III del Reglamento (CE) n ° 396/2005
    del Parlamento Europeo y del Consejo en lo que respecta a los límites máximos
    de residuos de acefato, alacloro, anilazina, azociclotina, benfuracarb, butilato,
    captafol, carbaril, carbofurano, carbosulfán, clorfenapir, clortal-dimetilo,
    clortiamida, cihexatina, diazinón, diclobenil, dicofol, dimetipina, diniconazol,
    disulfotón, fenitrotión, flufenzina, furatiocarb, hexaconazol, lactofén, mepronil,
    metamidofós, metopreno, monocrotofós, monurón, oxicarboxina, oxidemetón-metilo,
    paratión-metilo, forato, fosalón, procimidona, profenofós, propacloro, quincloraco,
    quintoceno, tolilfluanida, triclorfón, tridemorfo y trifluralina en determinados
    productos, y por el que se modifica dicho Reglamento añadiendo el anexo V, en
    el que figuran los valores por defecto
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 899/2012 av den 21 september 2012 om
    ändring av bilagorna II och III till Europaparlamentets och rådets förordning
    (EG) nr 396/2005 vad gäller gränsvärdena för acefat, alaklor, anilazin, azocyklotin,
    benfurakarb, butylat, kaptafol, karbaryl, karbofuran, karbosulfan, klorfenapyr,
    klortaldimetyl, klortiamid, cyhexatin, diazinon, diklobenil, dikofol, dimetipin,
    dinikonazol, disulfoton, fenitrotion, flufenzin, furatiokarb, hexakonazol, lactofen,
    mepronil, metamidofos, metopren, monokrotofos, monuron, oxikarboxin, oxidemetonmetyl,
    parationmetyl, forat, fosalon, procymidon, profenofos, propaklor, kvinklorak,
    kvintozen, tolylfluanid, triklorfon, tridemorf och trifluralin i eller på vissa
    produkter och om ändring av den förordningen genom fastställande av bilaga
    V med en förteckning över standardvärden
