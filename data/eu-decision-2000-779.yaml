id: EUDecision2000779
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2000/779/EC: Commission Decision of 24 November 2000 authorising the Kingdom
    of the Netherlands to have a temporary exemption to allow the use of chlorofluorocarbons
    (CFCs) until 31 December 2002 in delivery mechanisms for hermetically-sealed devices
    designed for implantation in the human body for delivery of measured doses of
    medication in accordance with Article 4(1) of Regulation (EC) No 2037/2000 of
    the European Parliament and of the Council on substances that deplete the ozone
    layer (notified under document number C(2000) 3550) (Text with EEA relevance)
    (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '2000/779/CE: Décision de la Commission du 24 novembre 2000 accordant
    au Royaume des Pays-Bas une dérogation à titre temporaire autorisant l''utilisation
    de chlorofluorocarbures (CFC) jusqu''au 31 décembre 2002 dans des dispositifs
    hermétiquement scellés destinés à être implantés dans l''organisme humain
    en vue de fournir des doses mesurées de médicaments, conformément à l''article
    4, paragraphe 1, du règlement (CE) nº 2037/2000 du Parlement européen et du
    Conseil relatif à des substances qui appauvrissent la couche d''ozone [notifiée
    sous le numéro C(2000) 3550] (Texte présentant de l''intérêt pour l''EEE)
    (Le texte en langue néerlandaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '2000/779/EG: Entscheidung der Kommission vom 24. November 2000 zur Genehmigung
    einer bis 31. Dezember 2002 geltenden vorübergehenden Ausnahmeregelung für das
    Königreich der Niederlande für die Verwendung von Fluorchlorkohlenwasserstoffen
    (FCKW) für hermetisch verschlossene in den menschlichen Körper einzubringende
    Implantate zur dosierten Abgabe von Arzneimitteln gemäß Artikel 4 Absatz 1 der
    Verordnung (EG) Nr. 2037/2000 des Europäischen Parlaments und des Rates über
    Stoffe, die zum Abbau der Ozonschicht führen (Bekannt gegeben unter Aktenzeichen
    K(2000) 3550) (Text von Bedeutung für den EWR) (nur der niederländische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '2000/779/EF: Kommissionens beslutning af 24. november 2000 om bemyndigelse
    til Kongeriget Nederlandene til en midlertidig undtagelse indtil den 31. december
    2002 til anvendelse af chlorfluorcarboner (CFC) i doseringsmekanismer i hermetisk
    forseglede anordninger til implantation i menneskekroppen med henblik på afgivelse
    af afmålte medicindoser i medfør af artikel 4, stk. 1, i Europa-Parlamentets
    og Rådets forordning (EF) nr. 2037/2000 om stoffer, der nedbryder ozonlaget (meddelt
    under nummer K(2000) 3550) (EØS-relevant tekst) (Kun den nederlandske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '2000/779/ΕΚ: Απόφαση της Επιτροπής, της 24ης
    Νοεμβρίου 2000, η οποία επιτρέπει στο Βασίλειο
    των Κάτω Χωρών προσωρινή εξαίρεση ώστε να επιτρέπεται
    η χρήση χλωροαιθερανθράκων (CFC) μέχρι τις 31
    Δεκεμβρίου 2002 σε δοσιμετρικές συσκευές για
    ερμητικά σφραγισμένες διατάξεις σχεδιασμένες
    για εμφύτευση στο ανθρώπινο σώμα για τη χορήγηση
    συγκεκριμένων δόσεων φαρμάκων σύμφωνα με το
    άρθρο 4 παράγραφος 1 του κανονισμού (ΕΚ) αριθ.
    2037/2000 του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    για τις ουσίες που καταστρέφουν τη στιβάδα
    του όζοντος [κοινοποιηθείσα υπό τον αριθμό
    Ε(2000) 3550] (Κείμενο που παρουσιάζει ενδιαφέρον
    για τον ΕΟΧ) (Το κείμενο στην ολλανδική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '2000/779/EY: Komission päätös, tehty 24 päivänä marraskuuta 2000,
    tilapäisen poikkeusluvan antamisesta Alankomaiden kuningaskunnalle sallia täysin
    halogenoitujen kloorifluorihiilivetyjen (CFC-yhdisteet) käyttö ihmiskehoon istutettavien
    hermeettisesti suljettujen lääkeannostelulaitteiden syöttömekanismeissa 31
    päivään joulukuuta 2002 saakka otsonikerrosta heikentävistä aineista annetun
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 2037/2000 4 artiklan 1 kohdan
    mukaisesti (tiedoksiannettu numerolla K(2000) 3550) (ETA:n kannalta merkityksellinen
    teksti) (Ainoastaan hollanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '2000/779/CE: Decisione della Commissione, del 24 novembre 2000, che autorizza
    il Regno dei Paesi Bassi a beneficiare di una deroga temporanea al fine di consentire
    l''uso di clorofluorocarburi (CFC), sino al 31 dicembre 2002, nei meccanismi di
    somministrazione dei dispositivi ermeticamente sigillati destinati ad essere impiantati
    nel corpo umano per rilasciare dosaggi specifici di farmaci conformemente all''articolo
    4, paragrafo 1, del regolamento (CE) n. 2037/2000 del Parlamento europeo e del
    Consiglio sulle sostanze che riducono lo strato di ozono [notificata con il numero
    C(2000) 3550] (Testo rilevante ai fini del SEE) (Il testo in lingua olandese è
    il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '2000/779/EG: Beschikking van de Commissie van 24 november 2000 tot verlening
    van een tijdelijke vrijstelling aan het Koninkrijk der Nederlanden om het gebruik
    toe te staan van chloorfluorkoolstoffen in hermetisch gesloten implantaten voor
    het toedienen van afgemeten doses medicijnen tot en met 31 december 2002 overeenkomstig
    artikel 4, lid 1, van Verordening (EG) nr. 2037/2000 van het Europees Parlement
    en de Raad betreffende de ozonlaag afbrekende stoffen (kennisgeving geschied onder
    nummer C(2000) 3550) (Voor de EER relevante tekst) (Slechts de tekst in de Nederlandse
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '2000/779/CE: Decisão da Comissão, de 24 de Novembro de 2000, que autoriza
    o Reino dos Países Baixos a beneficiar de uma isenção temporária para permitir
    a utilização de clorofluorocarbonos (CFC) em mecanismos de libertação de substâncias
    para dispositivos hermeticamente selados destinados a ser implantados no corpo
    humano para libertar doses precisas de medicamentos, até 31 de Dezembro de 2002,
    nos termos do n.° 1, do artigo 4.° , do Regulamento (CE) n.° 2037/2000 do Parlamento
    Europeu e do Conselho relativo às substâncias que empobrecem a camada de ozono
    [notificada com o número C(2000) 3550] (Texto relevante para efeitos do EEE)
    (Apenas faz fé o texto em língua neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '2000/779/CE: Decisión de la Comisión, de 24 de noviembre de 2000, que
    autoriza al Reino de los Países Bajos a disfrutar de una exención temporal que
    permita el uso de clorofluorocarburos (CFC) hasta el 31 de diciembre de 2002 en
    mecanismos de liberación de sustancias para dispositivos herméticamente sellados
    destinados a ser implantados en el cuerpo humano para liberar dosis precisas de
    medicamento de conformidad con el apartado 1 del artículo 4 del Reglamento (CE)
    nº 2037/2000 del Parlamento Europeo y del Consejo sobre las sustancias que agotan
    la capa de ozono [notificada con el número C(2000) 3550] (Texto pertinente a
    efectos del EEE) (El texto en lengua neerlandesa es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '2000/779/EG: Kommissionens beslut av den 24 november 2000 om godkännande
    av ett tillfälligt undantag för Konungariket Nederländerna som innebär att
    användning av klorfluorkarboner tillåts till och med den 31 december 2002 i
    doseringsmekanismer för hermetiskt tillslutna apparater avsedda att inplanteras
    i människokroppen för att avge uppmätta läkemedelsdoser i enlighet med artikel
    4.1 i Europaparlamentets och rådets förordning (EG) nr 2037/2000 om ämnen som
    bryter ned ozonskiktet [delgivet med nr K(2000) 3550] (Text av betydelse för
    EES) (Endast den nederländska texten är giltig)'
