title:
- language: en
  script: Latn
  content: Council Directive 81/1057/EEC of 14 December 1981 supplementing Directives
    75/362/EEC, 77/452/EEC, 78/686/EEC and 78/1026/EEC concerning the mutual recognition
    of diplomas, certificates and other evidence of the formal qualifications of doctors,
    nurses responsible for general care, dental practitioners and veterinary surgeons
    respectively, with regard to acquired rights
  type: main
- language: fr
  script: Latn
  content: Directive 81/1057/CEE du Conseil, du 14 décembre 1981, complétant les
    directives 75/362/CEE, 77/452/CEE, 78/686/CEE et 78/1026/CEE concernant la reconnaissance
    mutuelle des diplômes, certificats et autres titres respectivement de médecin,
    d'infirmier responsable des soins généraux, de praticien de l'art dentaire et
    de vétérinaire, en ce qui concerne les droits acquis
  type: main
- language: de
  script: Latn
  content: Richtlinie 81/1057/EWG des Rates vom 14. Dezember 1981 zur Ergänzung der
    Richtlinien 75/362/EWG, 77/452/EWG, 78/686/EWG und 78/1026/EWG über die gegenseitige
    Anerkennung der Diplome, Prüfungszeugnisse und sonstigen Befähigungsnachweise
    des Arztes, der Krankenschwester und des Krankenpflegers, die für die allgemeine
    Pflege verantwortlich sind, des Zahnarztes und des Tierarztes hinsichtlich der
    erworbenen Rechte
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 14 декември 1981 година
    за допълнение на Директиви 75/362/ЕИО, 77/452/ЕИО,
    78/686/ЕИО и 78/1026/ЕИО относно взаимното признаване
    на дипломи, удостоверения и други официални
    документи съответно за лекари, медицински
    сестри с общ профил, стоматолози и ветеринарни
    лекари по отношение на придобитите права
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 14. prosince 1981, kterou se doplňují směrnice
    75/362/EHS, 77/452/EHS, 78/686/EHS a 78/1026/EHS o vzájemném uznávání diplomů,
    osvědčení a jiných dokladů o dosažené kvalifikaci lékařů, zdravotních
    sester a ošetřovatelů odpovědných za všeobecnou péči, zubních lékařů
    a veterinárních lékařů, pokud jde o nabytá práva
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 81/1057/EØF af 14. december 1981 om supplering af direktiv
    75/362/EØF, 77/452/EØF, 78/686/EØF og 78/1026/EØF om gensidig anerkendelse
    af eksamensbeviser, certifikater og andre kvalifikationsbeviser for henholdsvis
    læger, sygeplejersker med ansvar for den almene sundheds- og sygepleje, tandlæger
    og dyrlæger, for så vidt angår erhvervede rettigheder
  type: main
- language: el
  script: Grek
  content: Οδηγία 81/1057/EOK του Συμβουλίου της 14ης Δεκεμβρίου
