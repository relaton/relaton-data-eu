    mis käsitlevad vastavalt arstide, üldõdede, hambaarstide ja veterinaararstide
    diplomite, tunnistuste ja muude kvalifikatsiooni tõendavate dokumentide vastastikust
    tunnustamist
  type: main
- language: fi
  script: Latn
