    és a képesítés megszerzéséről szóló egyéb tanúsítványok kölcsönös
    elismeréséről szóló 75/362/EGK, 77/452/EGK, 78/686/EGK, és 78/1026/EGK irányelvek
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 81/1057/CEE del Consiglio, del 14 dicembre 1981, che completa
    le direttive 75/362/CEE, 77/452/CEE, 78/686/CEE e 78/1026/CEE concernenti il reciproco
    riconoscimento dei diplomi, certificati ed altri titoli rispettivamente di medico,
    d'infermiere responsabile dell'assistenza generale, di dentista e di veterinario,
    per quanto riguarda i diritti acquisiti
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1981. gada 14. decembris), ar ko papildina Direktīvas
    75/362/EEK, 77/452/EEK, 78/686/EEK un 78/1026/EEK attiecībā uz ārstu, vispārējās
    aprūpes māsu, zobārstu un veterinārārstu diplomu, sertifikātu un citu kvalifikāciju
    apliecinošu dokumentu savstarpēju atzīšanu sakarā ar iegūtām tiesībām
  type: main
- language: lt
  script: Latn
  content: 1981 m. gruodžio 14 d. Tarybos Direktyva papildanti Direktyvas 75/362/EEB,
    77/452/EEB, 78/686/EEB ir 78/1026/EEB atitinkamai dėl gydytojo, bendrosios praktikos
    slaugytojo, stomatologo ir veterinaro diplomų, pažymėjimų ir kitų oficialias
    kvalifikacijas patvirtinančių dokumentų abipusio pripažinimo, atsižvelgiant
    į įgytas teises
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill ta' l-14 ta' Diċembru 1981 li tissupplimenta
