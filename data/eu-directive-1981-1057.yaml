    reċiproku ta' diplomi, ċertifikati u provi oħrajn ta' kwalifiki formali tat-tobba,
    ta' l-infermiera responsabbli għall-kura ġenerali, tad-dentisti u tal-kirurgi
    veterinarji rispettivament, fir-rigward tad-drittijiet ottenuti
  type: main
- language: nl
  script: Latn
  content: Richtlijn 81/1057/EEG van de Raad van 14 december 1981 tot aanvulling van
    de Richtlijnen 75/362/EEG, 77/452/EEG, 78/686/EEG en 78/1026/EEG met betrekking
    tot de onderlinge erkenning van de diploma's, certificaten en andere titels van
    respectievelijk de arts, de verantwoordelijk algemeen ziekenverpleger, de beoefenaar
    van de tandheelkunde en de dierenarts, voor wat betreft de verworven rechten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 14 grudnia 1981 r. uzupełniająca dyrektywy 75/362/EWG,
    77/452/EWG, 78/686/EWG i 78/1026/EWG, dotyczące wzajemnego uznawania dyplomów,
    świadectw i innych dokumentów potwierdzających posiadanie kwalifikacji lekarzy,
    pielęgniarek odpowiedzialnych za opiekę ogólną, lekarzy dentystów i lekarzy
    weterynarii, w odniesieniu do praw nabytych
  type: main
- language: pt
  script: Latn
  content: Directiva 81/1057/CEE do Conselho, de 14 de Dezembro de 1981, que completa
    as Directivas 75/362/CEE, 77/452/CEE, 78/686/CEE e 78/1026/CEE que têm por objectivo
    o reconhecimento mútuo dos diplomas, certificados e outros títulos, respectivamente,
    de médico, de enfermeiro responsável por cuidados gerais, de dentista e de veterinário,
    no que respeita aos direitos adquiridos
  type: main
- language: ro
  script: Latn
  content: Directiva consiliului din 14 decembrie 1981 de completare a Directivelor
    75/362/CEE, 77/452/CEE, 78/686/CEE și 78/1026/CEE privind recunoașterea reciprocă
    a diplomelor, certificatelor și a altor titluri oficiale de calificare ca medic,
    asistent medical generalist, medic stomatolog și medic veterinar, cu privire
    la drepturile dobândite
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 81/1057/EHS zo 14. decembra 1981, ktorou sa dopĺňajú Smernice
    75/362/EHS, 77/452/EHS a 78/1026/EHS o vzájomnom uznávaní diplomov, osvedčení
    a iných dokladov o formálnych kvalifikáciách lekárov, sestier zodpovedných
    za všeobecnú starostlivosť, zubných lekárov a veterinárnych lekárov so
    zreteľom na nadobudnuté práva
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 14. decembra 1981 o dopolnitvi direktiv 75/362/EGS,
    77/452/EGS, 78/686/EGS in 78/1026/EGS o vzajemnem priznavanju diplom, spričeval
    in drugih dokazil o formalni izobrazbi zdravnikov, medicinskih sester za splošno
    zdravstveno nego, zobozdravnikov in veterinarjev glede na pridobljene pravice
  type: main
- language: es
  script: Latn
  content: Directiva 81/1057/CEE del Consejo, de 14 de diciembre de 1981, por la que
    se completan las Directivas 75/362/CEE, 77/452/CEE, 78/686/CEE y 78/1026/CEE,
    referentes al reconocimiento mutuo de los diplomas, certificados y otros títulos
    de médico, enfermero responsable de cuidados generales, de odontólogo y de veterinario
    respectivamente, en lo que se refiere a los derechos adquiridos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 81/1057/EEG av den 14 december 1981 om komplettering av
    direktiv 75/362/EEG, 77/452/EEG, 78/686/EEG och 78/1026/EEG om ömsesidigt erkännande
    av utbildnings-, examens- och andra behörighetsbevis för läkare, sjuksköterskor
    med ansvar för allmän hälso- och sjukvård, tandläkare respektive veterinärer
