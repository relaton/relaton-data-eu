    78/686/EOK και 78/1026/EOK περί της αμοιβαίας αναγνώρισης
    των διπλωμάτων, πιστοποιητικών και άλλων τίτλων,
    αντιστοίχως, των ιατρών, των νοσοκόμων υπεύθυνων
    για γενική περίθαλψη, των οδοντίατρων και των
    κτηνίατρων, όσον αφορά το κεκτημένα δικαιώματα
  type: main
