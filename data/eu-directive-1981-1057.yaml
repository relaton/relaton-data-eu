    osoittavien asiakirjojen vastavuoroisesta tunnustamisesta annettuihin direktiiveihin
    75/362/ETY, 77/452/ETY, 78/686/ETY ja 78/1026/ETY saavutettujen oikeuksien osalta
  type: main
- language: hu
