    finanziaria e dell'anticipo corrispondente, il valore forfettario dei prodotti
    della pesca ritirati dal mercato nella campagna di pesca 1995
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1340/95 van de Commissie van 13 juni 1995 tot wijziging
