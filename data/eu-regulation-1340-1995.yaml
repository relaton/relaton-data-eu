    waarde voor het visseizoen 1995 voor de uit de markt genomen visserijprodukten
    voor de berekening van de financiële vergoeding en het hierop betrekking hebbende
    voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1340/95 da Comissão, de 13 de Junho de 1995, que
