title:
- language: en
  script: Latn
  content: '2012/822/EU, Euratom: Commission Implementing Decision of 19 December
    2012 amending Decision 90/179/Euratom, EEC authorising the Federal Republic of
    Germany to use statistics for years earlier than the last year but one and not
    to take into account certain categories of transactions or to use certain approximate
    estimates for the calculation of the VAT own resources base (notified under document
    C(2012) 9569)'
  type: main
- language: fr
  script: Latn
  content: '2012/822/UE, Euratom: Décision d’exécution de la Commission du 19
    décembre 2012 modifiant la décision 90/179/Euratom, CEE autorisant la République
    fédérale d’Allemagne à utiliser des données statistiques antérieures à
    la pénultième année et à ne pas tenir compte de certaines catégories d’opérations
    ou à utiliser certaines estimations approximatives pour le calcul de la base
    des ressources propres provenant de la taxe sur la valeur ajoutée [notifiée
    sous le numéro C(2012) 9569]'
  type: main
- language: de
  script: Latn
  content: '2012/822/EU, Euratom: Durchführungsbeschluss der Kommission vom 19. Dezember
    2012 Zur Änderung der Entscheidung 90/179/Euratom, EWG, mit der die Bundesrepublik
    Deutschland ermächtigt wird, statistische Angaben zu den Jahren vor dem vorletzten
    Jahr zu verwenden und bei der Berechnung der Grundlage für die MwSt.-Eigenmittel
    bestimmte Gruppen von Umsätzen nicht zu berücksichtigen und die Grundlage bei
    bestimmten anderen Gruppen von Umsätzen anhand annähernder Schätzungen zu ermitteln
    (Bekanntgegeben unter Aktenzeichen C(2012) 9569)'
  type: main
