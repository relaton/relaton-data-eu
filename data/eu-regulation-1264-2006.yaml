    Vene Föderatsioonist ja Ukrainast pärit ränikarbiidi impordi suhtes kohaldatavaid
    dumpinguvastaseid meetmeid käsitlev uurimine ja kehtestatakse pärast määruse
    (EÜ) nr 384/96 artikli 11 lõikele 2 vastavat aegumise läbivaatamist lõplik
