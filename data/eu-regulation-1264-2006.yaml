  content: Neuvoston asetus (EY) N:o 1264/2006, annettu 21 päivänä elokuuta 2006
    , Venäjän federaatiosta ja Ukrainasta peräisin olevan piikarbidin tuontiin
    sovellettavia polkumyynnin vastaisia toimenpiteitä koskevien tutkimusten päättämisestä
    sekä lopullisen polkumyyntitullin käyttöönotosta Kiinan kansantasavallasta
    peräisin olevan piikarbidin tuonnissa asetuksen (EY) N:o 384/96 11 artiklan 2
    kohdan mukaisen toimenpiteiden voimassaolon päättymistä koskevan tarkastelun
    jälkeen
  type: main
- language: hu
  script: Latn
  content: A Tanács 1264/2006/EK rendelete ( 2006. augusztus 21. ) az Orosz Föderációból
    és Ukrajnából származó szilícium-karbid behozatalára alkalmazandó dömpingellenes
    intézkedéseket érintő vizsgálatok megszüntetéséről, valamint a 384/96/EK
    rendelet 11. cikke (2) bekezdése szerinti megszűnési felülvizsgálatot követően
    a Kínai Népköztársaságból származó szilícium-karbid behozatalára végleges
    dömpingellenes vám kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1264/2006 del Consiglio, del 21 agosto 2006 , che chiude
    le inchieste concernenti le misure antidumping applicabili alle importazioni di
    carburo di silicio originario della Federazione russa e dell’Ucraina e che istituisce
    un dazio antidumping definitivo sulle importazioni di carburo di silicio originario
    della Repubblica popolare cinese a seguito del riesame in previsione della scadenza
    a norma dell’articolo 11, paragrafo 2, del regolamento (CE) n. 384/96
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1264/2006 ( 2006. gada 21. augusts ), ar ko pārtrauc
    izmeklēšanas, kas saistītas ar antidempinga pasākumiem, ko piemēro attiecībā
    uz tāda silīcija karbīda importu, kura izcelsme ir Krievijas Federācijā un
    Ukrainā, un nosaka galīgo antidempinga maksājumu attiecībā uz tāda silīcija
    karbīda importu, kura izcelsme ir Ķīnas Tautas Republikā, pēc termiņa beigu
    pārskatīšanas saskaņā ar Regulas (EK) Nr. 384/96 11. panta 2. punktu
  type: main
- language: lt
  script: Latn
  content: 2006 m. rugpjūčio 21 d. Tarybos reglamentas (EB) Nr. 1264/2006, nutraukiantis
    Rusijos Federacijos ir Ukrainos kilmės silicio karbidui importui taikomų antidempingo
    priemonių tyrimus ir įvedantis galutinį antidempingo muitą Kinijos Liaudies
    Respublikos kilmės silicio karbido importui, atlikus priemonių galiojimo peržiūrą
    pagal Reglamento (EB) Nr. 384/96 11 straipsnio 2 dalį
  type: main
