  script: Latn
  content: Nariadenie Rady (ES) č. 1264/2006 z 21. augusta 2006 , ktorým sa ukončujú
    prešetrovania týkajúce sa antidumpingových opatrení uplatniteľných na dovoz
    karbidu kremíka s pôvodom v Ruskej federácii a na Ukrajine a ktorým sa ukladá
    konečné antidumpingové clo na dovoz karbidu kremíka s pôvodom v Čínskej
    ľudovej republike po preskúmaní uplynutia platnosti podľa článku 11 ods.
    2 nariadenia (ES) č. 384/96
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1264/2006 z dne 21. avgusta 2006 o zaključku preiskav
    v zvezi s protidampinškimi ukrepi, veljavnimi za uvoz silicijevega karbida s
    poreklom iz Ruske federacije in Ukrajine, in uvedbi dokončne protidampinške
    dajatve na uvoz silicijevega karbida s poreklom iz Ljudske republike Kitajske
    po pregledu zaradi izteka ukrepa v skladu s členom 11(2) Uredbe (ES) št. 384/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1264/2006 del Consejo, de 21 de agosto de 2006 , por
    el que se finalizan las investigaciones relativas a las medidas antidumping aplicables
    a las importaciones de carburo de silicio originario de la Federación de Rusia
    y Ucrania y se impone un derecho antidumping definitivo a las importaciones de
    carburo de silicio originario de la República Popular China a raíz de una reconsideración
    por expiración, de conformidad con el artículo 11, apartado 2, del Reglamento
    (CE) n o 384/96
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1264/2006 av den 21 augusti 2006 om avslutande
    av undersökningarna av de antidumpningsåtgärder som tillämpas på import av
    kiselkarbid med ursprung i Ryska federationen och Ukraina och om införande av
    en slutgiltig antidumpningstull på import av kiselkarbid med ursprung i Folkrepubliken
    Kina till följd av en översyn vid giltighetstidens utgång i enlighet med artikel
    11.2 i förordning (EG) nr 384/96
