    за вноса на силициев карбид с произход от Руската
    федерация и Украйна и налагането на окончателно
    антидъмпингово мито върху вноса на силициев
    карбид с произход от Китайската народна република
    след преразглеждане на срока на изтичането
    им по силата на член 11, параграф 2 от Регламент
    (ЕО) № 384/96
  type: main
