title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1264/2006 of 21 August 2006 terminating the
    investigations concerning the anti-dumping measures applicable to imports of silicon
    carbide originating in the Russian Federation and Ukraine and imposing a definitive
    anti-dumping duty on imports of silicon carbide originating in the People's Republic
    of China following an expiry review pursuant to Article 11(2) of Regulation (EC)
    No 384/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1264/2006 du Conseil du 21 août 2006 clôturant les
    enquêtes concernant les mesures antidumping applicables aux importations de carbure
    de silicium originaire de la Fédération de Russie et d'Ukraine et instituant
    un droit antidumping définitif sur les importations de carbure de silicium originaire
    de la République populaire de Chine à la suite d'un réexamen au titre de l'expiration
    des mesures, effectué conformément à l'article 11, paragraphe 2, du règlement
    (CE) n o 384/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1264/2006 des Rates vom 21. August 2006 zur Einstellung
    der Untersuchungen, die die Antidumpingmaßnahmen gegenüber Einfuhren von Siliciumcarbid
    mit Ursprung in der Russischen Föderation und der Ukraine betreffen und zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Siliciumcarbid mit Ursprung
    in der Volksrepublik China nach Durchführung einer Überprüfung wegen bevorstehenden
    Außerkrafttretens gemäß Artikel 11 Absatz 2 der Verordnung (EG) Nr. 384/96
  type: main
- language: bg
  script: Cyrl
