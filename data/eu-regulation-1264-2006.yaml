    għall-importazzjonijiet tal-karbur tas-silikon li joriġina mill-Federazzjoni
    Russa u mill-Ukraina u li jimponi dazju anti-dumping definittiv fuq l-importazzjonijiet
    tal-karbur tas-silikon li joriġina mir-Repubblika tal-Poplu taċ-Ċina wara reviżjoni
    ta’ skadenza skond l-Artikolu 11(2) tar-Regolament (KE) Nru 384/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1264/2006 van de Raad van 21 augustus 2006 tot beëindiging
    van het onderzoek van de antidumpingmaatregelen ten aanzien van siliciumcarbide
    uit Rusland en Oekraïne en tot instelling van een definitief antidumpingrecht
    op siliciumcarbide uit de Volksrepubliek China naar aanleiding van een nieuw onderzoek
    in verband met het vervallen van een maatregel op grond van artikel 11, lid 2,
    van Verordening (EG) nr. 384/96
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1264/2006 z dnia 21 sierpnia 2006 r. kończące
    dochodzenie dotyczące środków antydumpingowych mających zastosowanie do przywozu
    węglika krzemu pochodzącego z Federacji Rosyjskiej i Ukrainy oraz nakładające
    ostateczne cło antydumpingowe na przywóz węglika krzemu pochodzącego z Chińskiej
