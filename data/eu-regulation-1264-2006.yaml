  script: Latn
  content: Regulamento (CE) n. o 1264/2006 do Conselho, de 21 de Agosto de 2006 ,
    que encerra os inquéritos referentes às medidas anti-dumping aplicáveis às
    importações de carboneto de silício originárias da Federação da Rússia
    e da Ucrânia e institui um direito anti-dumping definitivo sobre as importações
    de carboneto de silício originárias da República Popular da China, na sequência
    de um reexame da caducidade, iniciado ao abrigo do n. o 2 do artigo 11. o do Regulamento
    (CE) n. o 384/96
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1264/2006 al Consiliului din 21 august 2006 de închidere
    a anchetelor privind măsurile antidumping aplicabile la importurile de carbură
    de siliciu originară din Federația Rusă și din Ucraina și de instituire a
    unui drept antidumping definitiv la importurile de carbură de siliciu originară
    din Republica Populară Chineză ca urmare a unei reexaminări în temeiul expirării
    măsurilor, efectuată în conformitate cu articolul 11 alineatul (2) din Regulamentul
    (CE) nr. 384/96
  type: main
