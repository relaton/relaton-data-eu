  script: Latn
  content: Directive (EU) 2024/1233 of the European Parliament and of the Council
    of 24 April 2024 on a single application procedure for a single permit for third-country
    nationals to reside and work in the territory of a Member State and on a common
    set of rights for third-country workers legally residing in a Member State (recast)
  type: main
- language: fr
  script: Latn
  content: Directive (UE) 2024/1233 du Parlement européen et du Conseil du 24 avril
    2024 établissant une procédure de demande unique en vue de la délivrance d’un
    permis unique autorisant les ressortissants de pays tiers à résider et à travailler
    sur le territoire d’un État membre et établissant un socle commun de droits
    pour les travailleurs issus de pays tiers qui résident légalement dans un État
    membre (refonte)
  type: main
