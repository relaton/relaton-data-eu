    24. April 2024 über ein einheitliches Verfahren zur Beantragung einer kombinierten
    Erlaubnis für Drittstaatsangehörige, sich im Hoheitsgebiet eines Mitgliedstaats
    aufzuhalten und zu arbeiten, sowie über ein gemeinsames Bündel von Rechten für
    Drittstaatsarbeitnehmer, die sich rechtmäßig in einem Mitgliedstaat aufhalten
    (Neufassung)
  type: main
