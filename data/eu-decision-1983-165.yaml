  script: Latn
  content: '83/165/EEC: Commission Decision of 7 April 1983 establishing that the
    apparatus described as ''PAR - Oma 2 System'' may be imported free of Common Customs
    Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/165/CEE: Décision de la Commission du 7 avril 1983 constatant que
    l''importation de l''appareil dénommé "PAR - Oma 2 System" peut être faite
    en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/165/EWG: Entscheidung der Kommission vom 7. April 1983, mit der festgestellt
    wird, daß das Gerät ,,PAR - Oma 2 System" unter Befreiung von den Zöllen des
    Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/165/EØF: Kommissionens beslutning af 7. april 1983 om fastslåelse
