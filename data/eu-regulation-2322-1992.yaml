  content: Council Regulation (EEC) No 2322/92 of 23 July 1992 repealing Regulation
    (EEC) No 1638/80 on the system for guaranteeing the stabilization of earnings
    from certain commodities exported by the African, Caribbean and Pacific (ACP)
    States and the overseas countries and territories associated with the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2322/92 du Conseil, du 23 juillet 1992, abrogeant
