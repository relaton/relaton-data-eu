    des recettes d' exportation de certains produits de base en faveur des Etats d'
    Afrique, des Caraïbes et du Pacifique (ACP) et des pays et territoires d' outre-mer
    associés à la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2322/92 des Rates vom 23. Juli 1992 zur Aufhebung
    der Verordnung (EWG) Nr. 1638/80 über das System zur Stabilisierung der Erlöse
    aus der Ausfuhr bestimmter Grundstoffe zugunsten der Staaten in Afrika, im karibischen
    Raum und im Pazifischen Ozean (AKP-Staaten) und der mit der Gemeinschaft assoziierten
    überseeischen Länder und Gebiete
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2322/92 af 23. juli 1992 om ophævelse af
