    degli Stati dell' Africa, dei Caraibi e del Pacifico (ACP) e dei paesi e territori
    d' oltremare associati alla Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2322/92 van de Raad van 23 juli 1992 houdende intrekking
