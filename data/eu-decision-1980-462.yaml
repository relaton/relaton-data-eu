    Republik, Jugoslavien, Rumænien og Tjekkoslovakiet og om afslutning af denne
    procedure'
  type: main
- language: it
  script: Latn
  content: '80/462/CEE: Decisione della Commissione, del 29 aprile 1980, recante accettazione
