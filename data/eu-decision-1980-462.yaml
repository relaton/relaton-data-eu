  script: Latn
  content: '80/462/EEC: Commission Decision of 29 April 1980 accepting undertakings
    given in connection with the anti-dumping proceedings concerning certain car tyres
    originating in Czechoslovakia, the German Democratic Republic, Romania and Yugoslavia
    and terminating those proceedings'
  type: main
- language: fr
  script: Latn
  content: '80/462/CEE: Décision de la Commission, du 29 avril 1980, portant acceptation
    des engagements souscrits, dans le cadre de la procédure anti-"dumping", concernant
    certains pneumatiques originaires de Tchécoslovaquie, de la République démocratique
    allemande, de Roumanie et de Yougoslavie et portant clôture de cette procédure
    à leur égard'
  type: main
- language: de
  script: Latn
  content: '80/462/EWG: Beschluß der Kommission vom 29. April 1980 über die Annahme
