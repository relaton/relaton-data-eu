    Reifen für Personenkraftwagen mit Ursprung in der Tschechoslowakei, der Deutschen
    Demokratischen Republik, Rumänien und Jugoslawien sowie über die Einstellung
    dieses Verfahrens'
  type: main
- language: da
  script: Latn
  content: '80/462/EØF: Kommissionens afgørelse af 29. april 1980 om godtgørelse
