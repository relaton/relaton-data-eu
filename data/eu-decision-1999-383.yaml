    außer Samen, mit Ursprung in der Republik Südafrika, Ausnahmen von bestimmten
    Vorschriften der Richtlinie 77/93/EWG des Rates zuzulassen (Bekanntgegeben unter
    Aktenzeichen K(1999) 1336)'
  type: main
- language: da
