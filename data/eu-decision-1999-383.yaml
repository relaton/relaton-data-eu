title:
- language: en
  script: Latn
  content: '1999/383/EC: Commission Decision of 21 May 1999 authorising Member States
    to provide for derogations from certain provisions of Council Directive 77/93/EEC
    in respect of plants of strawberry (Fragaria L.), intended for planting, other
    than seeds, originating in the Republic of South Africa (notified under document
    number C(1999) 1336)'
  type: main
- language: fr
  script: Latn
  content: '1999/383/CE: Décision de la Commission, du 21 mai 1999, autorisant les
    États membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE du Conseil pour les fraisiers (Fragaria L.) destinés à la plantation,
    à l''exception des semences, originaires de la République d''Afrique du Sud
    [notifiée sous le numéro C(1999) 1336]'
  type: main
- language: de
  script: Latn
