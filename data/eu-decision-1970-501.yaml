title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 novembre 1970, autorisant le Royaume des
    Pays-Bas à admettre, jusqu'au 31 janvier 1971, la commercialisation des semences
    de trois variétés d'orge d'hiver soumises à des exigences réduites
  type: main
- language: de
  script: Latn
  content: '70/501/EWG: Entscheidung der Kommission vom 5. November 1970 über die
    Ermächtigung des Königreichs des Niederlande, bis zum 31. Januar 1971 Saatgut
    von drei Sorten von Wintergerste mit minderen Anforderungen zum Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '70/501/CEE: Decisione della Commissione, del 5 novembre 1970, che autorizza
    il Regno dei Paesi Bassi ad ammettere fino al 31 gennaio 1971 la commercializzazione
    delle sementi di tre varietà di orzo invernale soggette a requisiti ridotti'
  type: main
- language: nl
  script: Latn
  content: '70/501/EEG: Beschikking van de Commissie van 5 november 1970 waarbij het
    Koninkrijk der Nederlanden wordt gemachtigd om tot en met 31 januari 1971 zaad
    van drie rassen wintergerst waaraan minder strenge eisen zijn gesteld, tot de
    handel toe te laten'
  type: main
