title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2401/86 of 30 July 1986 fixing for the 1986/87
    marketing year the minimum price to be paid to producers for unprocessed sultanas
    and currants and the amount of production aid for sultanas and currants
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2401/86 de la Commission du 30 juillet 1986 fixant,
    pour la campagne de commercialisation 1986/1987, le prix minimal à payer aux
    producteurs pour les sultanines et les raisins secs de Corinthe, non transformés,
    ainsi que le montant de l' aide à la production pour les sultanines et les raisins
    secs de Corinthe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2401/86 der Kommission vom 30. Juli 1986 zur Festsetzung
    des den Erzeugern unverarbeiteter Sultaninen und Korinthen zu zahlenden Mindestpreises
    sowie der Produktionsbeihilfe für Sultaninen und Korinthen im Wirtschaftsjahr
    1986/87
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2401/86 af 30. juli 1986 om fastsættelse
    af en minimumspris, der skal betales producenten for uforarbejdede sultanas og
    korender, samt af producentstøtten for sultanas og korender i produktionsåret
    1986/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2401/86 της Επιτροπής
    της 30ής Ιουλίου 1986 που καθορίζει, για την περίοδο
    εμπορίας 1986/87, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για μη μεταποιημένες σουλτανίνες
    και κορινθιακές σταφίδες, καθώς και το ποσό
    της ενίσχυσης στην παραγωγή για τις σουλτανίνες
    και τις κορινθιακές σταφίδες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2401/86 della Commissione del 30 luglio 1986 che fissa,
    per la campagna di commercializzazione 1986/1987, il prezzo minimo da pagare ai
    produttori di uva sultanina e di uva secca di Corinto non trasformate e l' importo
    dell' aiuto alla produzione per l' uva sultanina e l' uva secca di Corinto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2401/86 van de Commissie van 30 juli 1986 tot vaststelling,
    voor het verkoopseizoen 1986/1987, van de aan de telers voor sultanarozijnen en
    krenten (basisprodukt) te betalen minimumprijs, alsmede van het bedrag van de
    steun bij de produktie van sultanarozijnen en krenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2401/86 da Comissão de 30 de Julho de 1986 que
    fixa, para a campanha de comercialização de 1986/1987, o preço mínimo a pagar
    aos produtores para as sultanas e groselhas não transformadas e o montante da
    ajuda à produção para as sultanas e groselhas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2401/86 de la Comisión de 30 de julio de 1986 por
    el que se establece el precio mínimo que se debe pagar a los productores de pasas
    de Esmirna y pasas de Corinto no transformadas y el importe de la ayuda a la producción
    de pasas de Esmirna y de pasas de Corinto para la campaña de comercialización
    1986/87
  type: main
