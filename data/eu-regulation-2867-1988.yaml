title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2867/88 of 15 September 1988 re-establishing
    the levying of customs duties on television receivers falling within CN code 8528
    and wrist-watches falling within CN codes EX 9101 and EX 9102, originating in
    China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2867/88 de la Commission du 15 septembre 1988 portant
    rétablissement de la perception des droits de douane applicables aux appareils
    récepteurs de télévision du code NC 8528 et aux montres- bracelets des codes
    NC ex 9101 et ex 9102 originaires de Chine, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2867/88 DER KOMMISSION vom 15. September 1988 zur
    Wiedereinführung der Erhebung der Zölle für Fernsehempfangsgeräte der Position
    8528 der Kombinierten Nomenklatur und Armbanduhren der Positionen ex 9101 und
    ex 9102 der Kombinierten Nomenklatur mit Ursprung in China, dem die in der Verordnung
    (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2867/88 af 15. september 1988 om genindførelse
