---
id: EUDecision1962408
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République italienne à ne pas
    appliquer pour les câbles électriques sous plomb (position du tarif douanier
    italien 85.23 B I A) les dispositions douanières de la décision du 12 mai 1960
    des représentants des gouvernements des États membres de la Communauté économique
    européenne réunis au sein du Conseil concernant l'accélération du rythme de
    réalisation des objets du Traité
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission, mit welcher die Italienische Republik ermächtigt
    wird, für elektrische Kabel mit Bleimantel (Nummer des Italienischen Zolltarifs
    85.23 B Ia) die Zollmaßnahmen des Beschlusses der im Rat vereinigten Vertreter
    der Regierungen der Mitgliedstaaten vom 12. Mai 1960 über die beschleunigte Verwirklichung
    der Vertragsziele nicht anzuwenden
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa all'autorizzazione accordata alla
    Repubblica Italiana a non applicare per i cavi elettrici sotto piombo (voce della
    tariffa doganale italiana 85.23 B I a) le disposizioni doganali della decisione
    del 12 maggio 1960 dei rappresentanti dei Governi degli Stati membri della Comunità
    Economica Europea riuniti in seno al Consiglio, relativa all'acceleramento del
    ritmo di attuazione degli obiettivi del Trattato
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende de op grond van artikel 226 van
    het Verdrag aan de Italiaanse Republiek verleende machtiging om ten aanzien van
    loodkabel (post 85.23 B Ia van het Italiaanse douanetarief) de douanebepalingen
    niet toe te passen die zijn neergelegd in het besluit d. d. 12 mei 1960 van de
    Vertegenwoordigers van de Regeringen der Lid-Staten van de Europese Economische
    Gemeenschap, in het kader van de Raad bijeen, over de versnelling van het tempo
    van verwezenlijking der doelstellingen van het Verdrag
  type: main
