title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1636/2005 of 6 October 2005 amending, for
    the seventh time, Council Regulation (EC) No 1763/2004 imposing certain restrictive
    measures in support of effective implementation of the mandate of the International
    Criminal Tribunal for the former Yugoslavia (ICTY)
  type: main
- language: fr
  script: Latn
