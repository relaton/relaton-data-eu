title:
- language: fr
  script: Latn
  content: Décision de la Commission portant prorogation et modification de sa décision
    du 9 octobre 1962 autorisant la perception d'une taxe compensatoire sur les importations,
    en République fédérale d'Allemagne, de caramels mous, de caramels durs et de
    dragées en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '63/101/EWG: Entscheidung der Kommission über die Verlängerung und Änderung
    ihrer Entscheidung vom 9. Oktober 1962 über die Erhebung einer Ausgleichsabgabe
    auf Einfuhren von Hartkaramellen, Weichkaramellen und Dragées in die Bundesrepublik
    Deutschland aus einigen Mitgliedstaaten'
  type: main
- language: it
  script: Latn
  content: '63/101/CEE: Decisione della Commissione che proroga e modifica la decisione
    del 9 ottobre 1962 che autorizza la riscossione di una tassa di compensazione
    sulle importazioni, nella Repubblica federale di Germania, di caramelle dure,
    di caramelle tenere e di confetti in provenienza da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/101/EEG: Beschikking van de Commissie houdende verlenging en wijziging
    van haar beschikking van 9 oktober 1962, waarbij machtiging werd verleend tot
    het leggen van een compenserende heffing op de invoer in de Bondsrepubliek Duitsland
    van harde en zachte karamels en dragees uit bepaalde Lid-Staten'
  type: main
