    Wiederverkauf auf dem Binnenmarkt auf 500 000 Tonnen Mais aus Beständen der französischen
    Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1703/90 af 22. juni 1990 om ændring
