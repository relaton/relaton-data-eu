title:
- language: en
  script: Latn
  content: Council Directive 84/644/EEC of 11 December 1984 amending Directive 64/432/EEC
    as regards brucellosis in respect of the buffered brucella antigen test, the micro-agglutination
    test and the milk ring test as applied to samples of milk
  type: main
- language: fr
  script: Latn
  content: Directive 84/644/CEE du Conseil du 11 décembre 1984 modifiant la directive
    64/432/CEE en ce qui concerne la brucellose, et plus précisément l'épreuve
    à l'antigène brucellique tamponné, l'épreuve de micro-agglutination et l'épreuve
    de l'anneau pratiquées sur des échantillons de lait
  type: main
- language: de
  script: Latn
  content: Richtlinie 84/644/EWG des Rates vom 11. Dezember 1984 zur Änderung der
    Richtlinie 64/432/EWG hinsichtlich des gepufferten Brucella-Antigen-Tests, des
    Mikro- Agglutinationstests und des Milch-Ringtests bei Milchstichproben im Hinblick
    auf die Brucellose
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 84/644/EØF af 11. december 1984 om ændring af direktiv
    64/432/EØF, for så vidt angår brucellose og særlig vedrørende brucella- stødpudeantigentesten,
    mikro-agglutinationstesten og plasma-ringprøven, udført på mælkeprøver
  type: main
- language: el
  script: Grek
  content: Οδηγία 84/644/ΕΟΚ του Συμβουλίου της 11ης Δεκεμβρίου
    1984 για την τροποποίηση της οδηγίας 64/432/ΕΟΚ
    όσον αφορά τη βρουκέλλωση, και ειδικότερα τη
    δοκιμή διά βρουκελλικού αντιγόνου εντός ρυθμιστικού
    διαλύματος, τη δοκιμή μικροσυγκόλλησης και
    τη δοκιμή του δακτυλίου που εφαρμόζεται σε
    δείγματα γάλακτος
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 84/644/ETY, annettu 11 päivänä joulukuuta 1984,
    direktiivin 64/432/ETY muuttamisesta luomistaudin osalta etenkin puskuroitua brusella-antigeenitutkimusta,
    mikroagglutinaatiotutkimusta ja maitonäytteisiin sovellettua maidon ABR-tutkimusta
    koskevin osin
  type: main
- language: it
  script: Latn
  content: Direttiva 84/644/CEE del Consiglio dell'11 dicembre 1984 che modifica la
    direttiva 64/432/CEE per quanto riguarda, relativamente alla brucellosi, la prova
    all'antigene di brucella tamponato, la prova di microagglutinazione e la prova
    dell'anello di latte che vengono effettuate su campioni di latte
  type: main
- language: nl
  script: Latn
  content: Richtlijn 84/644/EEG van de Raad van 11 december 1984 tot wijziging van
    Richtlijn 64/432/EEG ten aanzien van de gebufferde brucella-antigeentest, de micro-
    agglutinatietest en de melkringtest bij melkmonsters voor de opsporing van brucellose
  type: main
- language: pt
  script: Latn
  content: Directiva 84/644/CEE do Conselho, de 11 de Dezembro de 1984, que altera
    a Directiva 64/432/CEE no que diz respeito à brucelose e, mais precisamente,
    à prova do antigénio brucélico tamponado, à prova de microaglutinação e
    à prova do anel realizadas com amostras de leite
  type: main
- language: es
  script: Latn
  content: Directiva 84/644/CEE del Consejo, de 11 de diciembre de 1984, por la que
    se modifica la Directiva 64/432/CEE en lo que se refiere a la brucelosis y, en
    particular, a la prueba del antígeno brucelar tamponado, a la prueba de microaglutinación
    y a la prueba del anillo practicadas en muestras de leche
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 84/644/EEG av den 11 december 1984 om ändring av direktiv
    64/432/EEG i fråga om brucellos vad gäller det buffrade provet på brucellaantigen,
    mikroagglutinationsprovet och ringprovet på mjölk vid undersökning av mjölkprover
  type: main
