  type: main
- language: de
  script: Latn
  content: '72/66/EWG: Entscheidung der Kommission vom 22. Dezember 1971 über die
    Erstattung der im Jahre 1970 für die Schlachtung von Kühen und die Nichtvermarktung
    von Milch und Milcherzeugnissen gezahlten Prämien durch den EAGFL, Abteilung
    Ausrichtung, an die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '72/66/CEE: Decisione della Commissione, del 22 dicembre 1971, relativa
    al rimborso da parte del FEAOG, sezione orientamento, alla Repubblica francese
    dei premi versati nell''anno 1970, per la macellazione delle vacche e per la non
    commercializzazione del latte e dei prodotti lattiero-caseari'
  type: main
- language: nl
  script: Latn
  content: '72/66/EEG: Beschikking van de Commissie van 22 december 1971 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan de Franse Republiek van in
    1970 uitbetaalde premies voor het slachten van koeien en voor het niet in de handel
    brengen van melk en zuivelprodukten'
