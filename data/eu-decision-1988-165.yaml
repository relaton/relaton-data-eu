title:
- language: en
  script: Latn
  content: '88/165/EEC: Commission Decision of 9 February 1988 amending Decision 83/355/EEC
    authorizing certain Member States provisionally to provide for derogations from
    certain provisions of Council Directive 77/93/EEC, in respect of plants of Pinus
    L. originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '88/165/CEE: Décision de la Commission du 9 février 1988 modifiant la
    décision 83/355/CEE autorisant certains États membres à prévoir provisoirement
    des dérogations à certaines dispositions de la directive 77/93/CEE du Conseil
    pour les végétaux de Pinus L. originaires du Japon'
  type: main
- language: de
  script: Latn
  content: '88/165/EWG: Entscheidung der Kommission vom 9. Februar 1988 zur Änderung
    der Entscheidung 83/355/EWG zur einstweiligen Ermächtigung bestimmter Mitgliedstaaten,
    für Pflanzen von Pinus L. mit Ursprung in Japan Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates vorzusehen'
  type: main
- language: da
  script: Latn
  content: '88/165/EØF: Kommissionens beslutning af 9. februar 1988 om ændring af
    beslutning 83/355/EØF om midlertidig bemyndigelse af visse medlemsstater til
    at undtage planter af Pinus L. med oprindelse i Japan fra visse bestemmelser i
    Rådets direktiv 77/93/EØF'
  type: main
- language: el
  script: Grek
  content: '88/165/ΕΟΚ: Απόφαση της Επιτροπής της 9ης Φεβρουαρίου
    1988 για την τροποποίηση της απόφασης 83/355/ΕΟΚ
    που επιτρέπει προσωρινά σε ορισμένα κράτη
    μέλη να προβλέπουν παρεκκλίσεις από ορισμένες
    διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου,
    όσον αφορά τα φυτά του Pinus L., καταγωγής Ιαπωνίας'
  type: main
- language: it
  script: Latn
  content: '88/165/CEE: Decisione della Commissione del 9 febbraio 1988 che modifica
    la decisione 83/355/CEE che autorizza alcuni Stati membri a derogare provvisoriamente
    a determinate disposizioni della direttiva 77/93/CEE del Consiglio per quanto
    riguarda i vegetali di Pinus L. originari del Giappone'
  type: main
- language: nl
  script: Latn
  content: '88/165/EEG: Beschikking van de Commissie van 9 februari 1988 tot wijziging
