title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2409/73 of the Council of 24 July 1973 concluding the
    Protocol laying down certain provisions relating to the Agreement between the
    European Economic Community and the Arab Republic of Egypt consequent on the Accession
    of new Member States to the European Economic Community, and the Agreement, in
    the form of an exchange of letters, concerning Article 6 of Annex I to that Agreement
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2409/73 du Conseil, du 24 juillet 1973, portant conclusion
    du protocole fixant certaines dispositions relatives à l'accord entre la Communauté
    économique européenne et la République arabe d'Égypte en raison de l'adhésion
    de nouveaux États membres à la Communauté économique européenne, ainsi que
    de l'accord sous forme d'échange de lettres relatif à l'article 6 de l'annexe
    1 de ce même accord
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2409/73 des Rates vom 24. Juli 1973 über den Abschluß
    des Protokolls zur Festlegung einiger infolge des Beitritts neuer Mitgliedstaaten
    zur Europäischen Wirtschaftsgemeinschaft notwendiger Bestimmungen zum Abkommen
    zwischen der Europäischen Wirtschaftsgemeinschaft und der Arabischen Republik
    Ägypten sowie des Abkommens in Form eines Briefwechsels zu Artikel 6 des Anhangs
    I des genannten Abkommens
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2409/73 af 24. juli 1973 om afslutning af
    protokollen om fastsættelse af visse bestemmelser vedrørende aftalen mellem
    Det europæiske økonomiske Fællesskab og Den arabiske republik Ægypten som
    følge af nye medlemsstaters tiltrædelse af Det europæiske økonomiske Fællesskab,
    samt af aftalen i form af brevveksling om artikel 6 i Bilag I til denne aftale
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2409/73 del Consiglio, del 24 luglio 1973, relativo
    alla conclusione del protocollo che fissa talune disposizioni relative all'accordo
    tra la Comunità economica europea e la Repubblica araba d'Egitto a seguito dell'adesione
    di nuovi Stati membri alla Comunità economica europea nonché dell'accordo in
    forma di scambio di lettere relativo all'articolo 6 dell'allegato I di tale accordo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2409/73 van de Raad van 24 juli 1973 tot sluiting
    van het Protocol houdende vaststelling van énkele bepalingen betreffende de Overeenkomst
    tussen de Europese Economische Gemeenschap en de Arabische Republiek Egypte in
    verband met de toetreding van nieuwe Lid-Staten tot de Europese Economische Gemeenschap,
    en van de Overeenkomst, in de vorm van een briefwisseling, betreffende artikel
    6 van bijlage I van deze zelfde Overeenkomst
