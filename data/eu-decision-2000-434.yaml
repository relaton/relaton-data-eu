title:
- language: en
  script: Latn
  content: '2000/434/EC: Council Decision of 29 June 2000 authorising the United Kingdom
    of Great Britain and Northern Ireland to apply a reduced rate of excise duty to
    certain mineral oils, when used for specific purposes, in accordance with the
    procedure provided for in Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '2000/434/CE: Décision du Conseil du 29 juin 2000 autorisant le Royaume-Uni
    de Grande-Bretagne et d''Irlande du Nord à appliquer un taux réduit de droit
    d''accises à certaines huiles minérales utilisées à des fins spécifiques,
    conformément à la procédure prévue par l''article 8, paragraphe 4, de la directive
    92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '2000/434/EG: Entscheidung des Rates vom 29. Juni 2000 zur Ermächtigung
    des Vereinigten Königreichs Großbritannien und Nordirland, für bestimmte Mineralöle
    mit besonderen Verwendungszwecken einen ermäßigten Verbrauchsteuersatz anzuwenden
    (Verfahren gemäß Artikel 8 Absatz 4 der Richtlinie 92/81/EWG)'
  type: main
- language: da
  script: Latn
  content: '2000/434/EF: Rådets beslutning af 29. juni 2000 om bemyndigelse af Det
    Forenede Kongerige til i overensstemmelse med proceduren i artikel 8, stk. 4,
    i direktiv 92/81/EØF at anvende en reduceret punktafgiftssats på visse mineralolier,
    når de benyttes til specifikke formål'
  type: main
- language: el
  script: Grek
  content: '2000/434/ΕΚ: Απόφαση του Συμβουλίου, της 29ης
    Ιουνίου 2000, με την οποία εξουσιοδοτείται το
    Ηνωμένο Βασίλειο της Μεγάλης Βρετανίας και
    Βορείου Ιρλανδίας να εφαρμόσει μειωμένο συντελεστή
    ειδικού φόρου κατανάλωσης σε ορισμένα πετρελαιοειδή,
    όταν χρησιμοποιούνται για ειδικούς σκοπούς,
    σύμφωνα με τη διαδικασία που προβλέπει το άρθρο
    8 παράγραφος 4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '2000/434/EY: Neuvoston päätös, tehty 29 päivänä kesäkuuta 2000,
    luvan antamisesta Iso-Britannian ja Pohjois-Irlannin yhdistyneelle kuningaskunnalle
    soveltaa alennettua valmisteverokantaa tiettyihin erityistarkoituksiin käytettäviin
    kivennäisöljyihin direktiivin 92/81/ETY 8 artiklan 4 kohdassa tarkoitetun menettelyn
    mukaisesti'
  type: main
- language: it
  script: Latn
  content: '2000/434/CE: Decisione del Consiglio, del 29 giugno 2000, che autorizza
    il Regno Unito di Gran Bretagna e d''Irlanda del Nord ad applicare riduzioni d''accisa
    a taluni oli minerali utilizzati a fini specifici, conformemente alla procedura
    di cui all''articolo 8, paragrafo 4, della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '2000/434/EG: Beschikking van de Raad van 29 juni 2000 waarbij het Verenigd
    Koninkrijk wordt gemachtigd in overeenstemming met de procedure van artikel 8,
    lid 4, van Richtlijn 92/81/EEG, een verlaagd accijnstarief toe te passen op bepaalde
    minerale oliën die gebruikt worden voor bijzondere doeleinden'
  type: main
- language: pt
  script: Latn
  content: '2000/434/CE: Decisão do Conselho, de 29 de Junho de 2000, que autoriza
    o Reino Unido da Grã-Bretanha e da Irlanda do Norte a aplicar uma taxa reduzida
    do imposto especial sobre o consumo de determinados óleos minerais utilizados
    para fins específicos, nos termos do n.o 4 do artigo 8.o da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '2000/434/CE: Decisión del Consejo, de 29 de junio de 2000, por la que
    se autoriza al Reino Unido de Gran Bretaña e Irlanda del Norte a aplicar un tipo
    reducido del impuesto especial a determinados hidrocarburos utilizados con fines
    específicos, de conformidad con el procedimiento previsto en el apartado 4 del
    artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '2000/434/EG: Rådets beslut av den 29 juni 2000 om tillåtelse att i enlighet
    med förfarandet i artikel 8.4 i direktiv 92/81/EEG för Förenade konungariket
    Storbritannien och Nordirland att tillämpa en nedsatt punktskattesats för vissa
    mineraloljor när dessa används för särskilda ändamål'
