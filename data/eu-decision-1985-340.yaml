title:
- language: en
  script: Latn
  content: '85/340/EEC: Commission Decision of 27 June 1985 authorizing certain Member
    States to apply intra- Community surveillance to imports of products originating
    in third countries which have been put into free circulation in the Community
    and which may be the subject of protective measures under Article 115 of the Treaty
    (Only the German, Greek, English, French, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/340/CEE: Décision de la Commission du 27 juin 1985 autorisant certains
    États membres à procéder à une surveillance intracommunautaire des importations
    de produits originaires de pays tiers et mis en libre pratique dans la Communauté,
    susceptibles de faire l''objet de mesures de protection au titre de l''article
    115 du traité (Les textes en langues allemande, grecque, anglaise, française,
    italienne et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/340/EWG: Entscheidung der Kommission vom 27. Juni 1985 zur Ermächtigung
    bestimmter Mitgliedstaaten zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Drittländern stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Waren, die Schutzmaßnahmen gemäß Artikel 115 des Vertrages
    unterworfen werden können (Nur der deutsche, griechische, englische, französische,
    italienische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/340/EØF: Kommissionens beslutning af 27. juni 1985 om bemyndigelse
    af visse af medlemsstaterne til af forlænge gyldighedsperioden for tilsyn inden
    for Fællesskabet med indførsel af produkter, der har oprindelse i tredjelande
    og er overgået til fri omsætning i Fællesskabet, og som ville kunne gøres
    til genstand for beskyttelsesforanstaltninger i henhold til traktatens artikel
    115 (Kun den tyske, graeske, engelske, franske, italienske og nederlandske udgave
    er autentiske)'
  type: main
- language: el
  script: Grek
  content: '85/340/ΕΟΚ: Απόφαση της Επιτροπής της 27ης
    Ιουνίου 1985 περί χορηγήσεως αδείας σε ορισμένα
    κράτη μέλη να προβούν σε ενδοκοινοτική επιτήρηση
    των εισαγωγών προϊόντων, καταγωγής τρίτων
    χωρών, τα οποία τίθενται σε ελεύθερη κυκλοφορία
    στην Κοινότητα και τα οποία μπορούν να αποτελέσουν
    αντικείμενο των μέτρων προστασίας, δυνάμει
    του άρθρου 115 της συνθήκης (Τα κείμενα στην
    γερμανική, ελληνική, αγγλική, γαλλική, ιταλική
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '85/340/CEE: Decisione della Commissione del 27 giugno 1985 che autorizza
    taluni stati membri a procedere ad una sorveglianza intracomunitaria sulle importazioni
    di prodotti originari dei paesi terzi e messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell''articolo 115
    del trattato (Il testi in lingua tedesca, greca, inglese, francese, italiana e
    olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '85/340/EEG: Beschikking van de Commissie van 27 juni 1985 houdende machtiging
    van bepaalde Lid-Staten om over te gaan tot een intra-communautair toezicht ten
    aanzien van de invoer van produkten van oorsprong uit derde landen die in de Gemeenschap
    in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn van beschermende
    maatregelen krachtens artikel 115 van het Verdrag (Slechts de teksten in de Duitse,
    Griekse, Engelse, Franse, Italiaanse en de Nederlandse taal zijn authentiek)'
  type: main
- language: es
  script: Latn
  content: '84/340/CEE: Decisión de la Comisión de 27 de junio de 1985 por la que
    se autoriza a determinados Estados miembros a proceder a una vigilancia intracomunitaria
    de las importaciones de productos originarios de terceros países y despachados
    a libre práctica en la Comunidad, que puedan ser objeto de medidas de protección
    con arreglo al artículo 115 del Tratado (Los textos en lenguas alemana, griega,
    inglesa, francesa, italiana y neerlandesa son los únicos auténticos)'
