title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1254/75 of the Commission of 14 May 1975 re-establishing
    the levying of the customs duties on other goat- and kid-skin leather, falling
    within subheading 41.04 B II, originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1254/75 de la Commission, du 14 mai 1975, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    de caprins, de la sous-position tarifaire 41.04 B II, originaires de l'Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1254/75 der Kommission vom 14. Mai 1975 zur Wiedereinführung
    des Zollsatzes für Ziegen- und Zickelleder, ausgenommen Leder der Tarifnummern
    41.06 bis 41.08, der Tarifstelle 41.04 B II, mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1254/75 af 14. maj 1975 om genindførelse
    af opkrævning af toldafgifter for læder af gede- og gedekidsskind (undtagen
    varer, der henhører under position 41.06, 41.07 og 41.08), under underposition
    41.04 B II, som har oprindelse i Indien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1254/75 della Commissione, del 14 maggio 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli caprine
    della sottovoce doganale 41.04 B II originarie dell'India beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio, del 2 dicembre
    1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1254/75 van de Commissie van 14 mei 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op geiteleder
    alsmede voorgelooide huiden en vellen, van geiten, met uitzondering van de produkten
    bedoeld bij de posten 41.06 tot en met 41.08, van onderverdeling 41.04 B II, van
    oorsprong uit India, ten behoeve waarvan bij Verordening (EEG) nr. 3054/74 van
    de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
