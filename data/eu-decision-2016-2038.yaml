    gorivo za težka vozila, glede predlogov sprememb globalnih tehničnih predpisov
    ZN št. 15 in 16, glede predloga za dva globalna tehnična predpisa ZN o postopku
    merjenja za dvo- ali trikolesna motorna vozila v zvezi z emisijami oziroma s sistemom
    za diagnostiko na vozilu ter glede predloga za resolucijo o skupnih specifikacijah
    za kategorije svetlobnega vira
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2016/2038 del Consejo, de 11 de noviembre de 2016, por la
    que se establece la posición que se ha de adoptar en nombre de la Unión Europea
    en los correspondientes comités de la Comisión Económica para Europa de las
    Naciones Unidas, por lo que respecta a las propuestas de modificaciones de los
    reglamentos de las Naciones Unidas n.os 7, 16, 37, 44, 45, 46, 48, 53, 78, 80,
    83, 86, 87, 99, 105, 107, 110, 121, 128 y 129, la propuesta de un reglamento de
    las Naciones Unidas relativo a los sistemas de adaptación de los motores de combustible
    dual de vehículos pesados, las propuestas de modificación de los reglamentos
    técnicos mundiales de las Naciones Unidas n.os 15 y 16, las propuestas de dos
    reglamentos técnicos mundiales de las Naciones Unidas sobre el procedimiento
    de medición aplicable a vehículos de motor de dos o tres ruedas en lo que respecta
    a algunos tipos de emisiones y al diagnóstico a bordo, respectivamente, y la
    propuesta de una resolución sobre la especificación común de las categorías
    de las fuentes luminosas
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2016/2038 av den 11 november 2016 om fastställande
    av den ståndpunkt som ska intas på Europeiska unionens vägnar i de relevanta
    kommittéerna inom Förenta nationernas ekonomiska kommission för Europa när
    det gäller de föreslagna ändringarna av FN-föreskrifterna nr 7, 16, 37, 44,
    45, 46, 48, 53, 78, 80, 83, 86, 87, 99, 105, 107, 110, 121, 128 och 129, förslaget
    till en FN-föreskrift om konverteringssatser för dubbelbränsle till motorer
    avsedda för tunga fordon, de föreslagna ändringarna av de globala tekniska
    FN-föreskrifterna nr 15 och 16, förslagen till två globala tekniska FN-föreskrifter
    om mätförfarandet för två- och trehjuliga motorfordon vad gäller vissa typer
    av utsläpp respektive omborddiagnos och förslaget till en resolution om gemensamma
    specifikationer för kategorier av ljuskällor
  type: main
