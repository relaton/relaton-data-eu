title:
- language: en
  script: Latn
  content: '2011/306/EU: Commission Implementing Decision of 20 May 2011 establishing
    that Article 30(1) of Directive 2004/17/EC of the European Parliament and of the
    Council coordinating the procurement procedures of entities operating in the water,
    energy, transport and postal services sectors is not applicable to the bituminous
    coal mining in the Czech Republic (notified under document C(2011) 3406)'
  type: main
- language: fr
  script: Latn
  content: '2011/306/UE: Décision d''exécution de la Commission du 20 mai 2011 établissant
    que l''article 30, paragraphe 1, de la directive 2004/17/CE du Parlement européen
    et du Conseil portant coordination des procédures de passation des marchés dans
    les secteurs de l''eau, de l''énergie, des transports et des services postaux
    ne s’applique pas à l''extraction de charbon bitumineux en République tchèque
    [notifiée sous le numéro C(2011) 3406]'
  type: main
- language: de
  script: Latn
  content: '2011/306/EU: Durchführungsbeschluss der Kommission vom 20. Mai 2011 über
    die Nichtanwendung von Artikel 30 Absatz 1 der Richtlinie 2004/17/EG des Europäischen
    Parlaments und des Rates zur Koordinierung der Zuschlagserteilung durch Auftraggeber
    im Bereich der Wasser-, Energie- und Verkehrsversorgung sowie der Postdienste
    auf den Abbau bitumenhaltiger Steinkohle in der Tschechischen Republik (Bekannt
    gegeben unter Aktenzeichen K(2011) 3406)'
  type: main
- language: bg
  script: Cyrl
  content: '2011/306/ЕС: Решение за изпълнение на Комисията
    от 20 май 2011 година постановяващо, че член 30,
    параграф 1 от Директива 2004/17/ЕО на Европейския
    парламент и на Съвета относно координиране
    на процедурите за възлагане на обществени
    поръчки от възложители, извършващи дейност
    във водоснабдяването, енергетиката, транспорта
    и пощенските услуги, не се отнася за добива
    на битуминозни въглища в Чешката република
    (нотифицирано под номер C(2011) 3406)'
  type: main
- language: cs
  script: Latn
  content: '2011/306/EU: Prováděcí rozhodnutí Komise ze dne 20. května 2011 ,
    kterým se stanoví, že čl. 30 odst. 1 směrnice Evropského parlamentu a Rady
    2004/17/ES o koordinaci postupů při zadávání zakázek subjekty působícími
    v odvětví vodního hospodářství, energetiky, dopravy a poštovních služeb
    není použitelný na těžbu černého uhlí v České republice (oznámeno pod
    číslem K(2011) 3406)'
  type: main
- language: da
  script: Latn
  content: '2011/306/EU: Kommissionens gennemførelsesafgørelse af 20. maj 2011 om,
    at udvinding af bituminøse kul i Tjekkiet ikke er omfattet af artikel 30, stk.
    1, i Europa-Parlamentets og Rådets direktiv 2004/17/EF om samordning af fremgangsmåderne
    ved indgåelse af kontrakter inden for vand- og energiforsyning, transport samt
    posttjenester (meddelt under nummer K(2011) 3406)'
  type: main
- language: el
  script: Grek
  content: '2011/306/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 20ής Μαΐου 2011 , η οποία ορίζει ότι το άρθρο
    30 παράγραφος 1 της οδηγίας 2004/17/ΕΚ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, περί συντονισμού
    των διαδικασιών σύναψης συμβάσεων στους τομείς
    του ύδατος, της ενέργειας, των μεταφορών και
    των ταχυδρομικών υπηρεσιών δεν εφαρμόζεται
    στην εξόρυξη ασφαλτούχου άνθρακα στην Τσεχική
    Δημοκρατία [κοινοποιηθείσα υπό τον αριθμό
    Ε(2011) 3406]'
  type: main
- language: et
  script: Latn
  content: '2011/306/EL: Komisjoni rakendusotsus, 20. mai 2011 , millega kehtestatakse,
    et bituumenkivisöe kaevandamise suhtes Tšehhi Vabariigis ei kohaldata Euroopa
    Parlamendi ja nõukogu direktiivi 2004/17/EÜ (millega kooskõlastatakse vee-,
    energeetika-, transpordi- ja postiteenuste sektoris tegutsevate ostjate hankemenetlused)
    artikli 30 lõiget 1 (teatavaks tehtud numbri K(2011) 3406 all)'
  type: main
- language: fi
  script: Latn
  content: '2011/306/EU: Komission täytäntöönpanopäätös, annettu 20 päivänä
    toukokuuta 2011 , vesi- ja energiahuollon sekä liikenteen ja postipalvelujen
    alalla toimivien yksiköiden hankintamenettelyjen yhteensovittamisesta annetun
    Euroopan parlamentin ja neuvoston direktiivin 2004/17/EY 30 artiklan 1 kohdan
    soveltamatta jättämisestä bitumipitoisen kivihiilen louhintaan Tšekissä (tiedoksiannettu
    numerolla K(2011) 3406)'
  type: main
- language: hu
  script: Latn
  content: '2011/306/EU: A Bizottság végrehajtási határozata ( 2011. május 20.
    ) a cseh köztársaságbeli bitumeneskőszén-bányászatnak a vízügyi, energiaipari,
    közlekedési és postai ágazatban működő ajánlatkérők beszerzési eljárásainak
    összehangolásáról szóló 2004/17/EK európai parlamenti és tanácsi irányelv
    30. cikke (1) bekezdésének alkalmazása alóli mentesítéséről (az értesítés
    a C(2011) 3406. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2011/306/UE: Decisione di esecuzione della Commissione, del 20 maggio
    2011 , in base alla quale l''articolo 30, paragrafo 1, della direttiva 2004/17/CE
    del Parlamento europeo e del Consiglio, che coordina le procedure di appalto degli
    enti erogatori di acqua e di energia, degli enti che forniscono servizi di trasporto
    e servizi postali non è applicabile all''estrazione di carbone bituminoso nella
    Repubblica ceca [notificata con il numero C(2011) 3406]'
  type: main
- language: lv
  script: Latn
  content: '2011/306/ES: Komisijas Īstenošanas lēmums ( 2011. gada 20. maijs ),
    ar kuru nosaka, ka 30. panta 1. punkts Eiropas Parlamenta un Padomes Direktīvā
    2004/17/EK, ar ko koordinē iepirkuma procedūras, kuras piemēro subjekti, kas
    darbojas ūdensapgādes, enerģētikas, transporta un pasta pakalpojumu nozarēs,
    nav piemērojams bituminozo ogļu ieguvei Čehijas Republikā (izziņots ar dokumenta
    numuru C(2011) 3406)'
  type: main
- language: lt
  script: Latn
  content: '2011/306/ES: 2011 m. gegužės 20 d. Komisijos įgyvendinimo sprendimas,
    kuriuo nustatoma, kad Europos Parlamento ir Tarybos direktyvos 2004/17/EB dėl
    subjektų, vykdančių veiklą vandens, energetikos, transporto ir pašto paslaugų
    sektoriuose, vykdomų pirkimų tvarkos derinimo 30 straipsnio 1 dalis netaikoma
    bituminių akmens anglių kasybai Čekijos Respublikoje (pranešta dokumentu Nr.
    C(2011) 3406)'
  type: main
- language: mt
  script: Latn
  content: '2011/306/UE: Deċiżjoni ta'' Implimentazzjoni tal-Kummissjoni tal- 20
    ta’ Mejju 2011 li tistabbilixxi li l-Artikolu 30(1) tad-Direttiva 2004/17/KE
    tal-Parlament Ewropew u tal-Kunsill li tikkoordina l-proċeduri ta’ akkwisti
    ta’ entitajiet li joperaw fis-setturi tas-servizzi tal-ilma, l-enerġija, it-trasport
    u postali mhuwiex applikabbli għat-tħaffir għall-faħam bituminuż fir-Repubblika
    Ċeka (notifikata bid-dokument numru C(2011) 3406)'
  type: main
- language: nl
  script: Latn
  content: '2011/306/EU: Uitvoeringsbesluit van de Commissie van 20 mei 2011 waarbij
    wordt vastgesteld dat artikel 30, lid 1, van Richtlijn 2004/17/EG van het Europees
    Parlement en de Raad houdende coördinatie van de procedures voor het plaatsen
    van opdrachten in de sectoren water- en energievoorziening, vervoer en postdiensten,
    niet van toepassing is op de winning van bitumineuze steenkool in Tsjechië (Kennisgeving
    geschied onder nummer C(2011) 3406)'
  type: main
- language: pl
  script: Latn
  content: '2011/306/UE: Decyzja wykonawcza Komisji z dnia 20 maja 2011 r. stanowiąca,
    że art. 30 ust. 1 dyrektywy 2004/17/WE Parlamentu Europejskiego i Rady koordynującej
    procedury udzielania zamówień przez podmioty działające w sektorach gospodarki
    wodnej, energetyki, transportu i usług pocztowych nie ma zastosowania w odniesieniu
    do górnictwa węgla kamiennego w Republice Czeskiej (notyfikowana jako dokument
    nr C(2011) 3406)'
  type: main
- language: pt
  script: Latn
  content: '2011/306/UE: Decisão de Execução da Comissão, de 20 de Maio de 2011
    , que estabelece que o artigo 30. °, n. ° 1, da Directiva 2004/17/CE do Parlamento
    Europeu e do Conselho relativa à coordenação dos processos de adjudicação
    de contratos nos sectores da água, da energia, dos transportes e dos serviços
    postais, não é aplicável à extracção de carvão betuminoso na República
    Checa [notificada com o número C(2011) 3406]'
  type: main
- language: ro
  script: Latn
  content: '2011/306/UE: Decizia de punere în aplicare a Comisiei din 20 mai 2011
    de stabilire a faptului că articolul 30 alineatul (1) din Directiva 2004/17/CE
    a Parlamentului European și a Consiliului de coordonare a procedurilor de atribuire
    a contractelor de achiziții în sectoarele apei, energiei, transportului și
    serviciilor poștale nu se aplică exploatării cărbunelui bituminos în Republica
    Cehă [notificată cu numărul C(2011) 3406]'
  type: main
- language: sk
  script: Latn
  content: '2011/306/EÚ: Vykonávacie rozhodnutie Komisie z 20. mája 2011 , ktorým
    sa ustanovuje, že článok 30 ods. 1 smernice Európskeho parlamentu a Rady 2004/17/ES
    o koordinácii postupov obstarávania subjektov pôsobiacich v odvetviach vodného
    hospodárstva, energetiky, dopravy a poštových služieb sa neuplatňuje na ťažbu
    čierneho uhlia v Českej republike [oznámené pod číslom K(2011) 3406]'
  type: main
- language: sl
  script: Latn
  content: '2011/306/EU: Izvedbeni sklep Komisije z dne 20. maja 2011 o neuporabi
    člena 30(1) Direktive 2004/17/ES Evropskega parlamenta in Sveta o usklajevanju
    postopkov za oddajo javnih naročil naročnikov v vodnem, energetskem in transportnem
    sektorju ter sektorju poštnih storitev pri kopanju bituminoznega premoga na Češkem
    (notificirano pod dokumentarno številko C(2011) 3406)'
  type: main
- language: es
  script: Latn
  content: '2011/306/UE: Decisión de Ejecución de la Comisión, de 20 de mayo de
    2011 , por la que se establece que el artículo 30, apartado 1, de la Directiva
    2004/17/CE del Parlamento Europeo y del Consejo sobre la coordinación de los
    procedimientos de adjudicación de contratos en los sectores del agua, de la energía,
    de los transportes y de los servicios postales, no es aplicable a la minería
    del carbón bituminoso en la República Checa [notificada con el número C(2011)
    3406]'
  type: main
- language: sv
  script: Latn
  content: '2011/306/EU: Kommissionens genomförandebeslut av den 20 maj 2011 som
    fastställer att artikel 30.1 i Europaparlamentets och rådets direktiv 2004/17/EG
