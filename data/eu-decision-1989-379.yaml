  content: '89/379/EEC: Commission Decision of 10 May 1989 fixing an indicative allocation
    between Member States of 85 % of the commitment appropriations of the ERDF under
    Objective 5b as defined by Council Regulation (EEC) No 2052/88'
  type: main
- language: fr
  script: Latn
  content: '89/379/CEE: Décision de la Commission du 10 mai 1989 fixant une répartition
