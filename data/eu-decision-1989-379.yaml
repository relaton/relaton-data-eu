    einzelnen Mitgliedstaaten im Rahmen des in der Verordnung (EWG) Nr. 2052/88 des
    Rates festgelegten Ziels Nr. 5b (89/379/EWG) (89/379/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 10. maj 1989 om fastsættelse af en vejledende
