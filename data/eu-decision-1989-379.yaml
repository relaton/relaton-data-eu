    européen de développement régional (Feder) au titre de l''objectif n° 5 b)
    défini par le règlement (CEE) n 2052/88 du Conseil'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 10. Mai 1989 zur Festlegung von Richtgrößen
