    riz
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 136/65/EWG der Kommission vom 29. September 1965 zur Verlängerung
    der Verordnung Nr. 162/64/EWG betreffend die Erstattung auf bestimmte Ausfuhren
    von Verarbeitungserzeugnissen aus Getreide und Reis nach den Mitgliedstaaten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 136/65/CEE della Commissione, del 29 settembre 1965, che
    proroga il regolamento n. 162/64/CEE relativo alla restituzione applicabile ad
    alcune esportazioni verso gli Stati membri di prodotti trasformati a base di cereali
    e di riso
  type: main
- language: nl
  script: Latn
  content: Verordening no. 136/65/EEG van de Commissie van 29 september 1965 houdende
    verlenging van Verordening no. 162/64/EEG ten aanzien van de restitutie van toepassing
    bij bepaalde uitvoeren naar Lid-Staten van op basis van granen en rijst verwerkte
    produkten
