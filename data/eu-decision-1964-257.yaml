title:
- language: fr
  script: Latn
  content: Décision 64/257/CEE, de la Commission du 2 avril 1964, portant modification
    de sa décision du 4 décembre 1963, autorisant la perception de taxes compensatoires
    à l'importation, dans la République française, de dextrines, d'amidons et fécules
    solubles ou torréfiés, ainsi que de parements et apprêts, préparés à base
    de amylacées, en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '64/257/EWG: Entscheidung der Kommission vom 2. April 1964 über die Änderung
    ihrer Entscheidung vom 4. Dezember 1963 über die Erhebung von Ausgleichsabgaben
    bei der Einfuhr von Dextrin, löslicher und gerösteter Stärke, zubereiteten
    Zurichtemitteln und zubereiteten Appreturen auf der Grundlage von Stärke, aus
    verschiedenen Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '64/257/CEE: Decisione della Commissione, del 2 aprile 1964, recante modifica
    della decisione del 4 dicembre 1963, che autorizza la riscossione di tasse di
    compensazione all''importazione, nella Repubblica francese, di destrine, amidi
    e fecole solubili o torrefatti, nonché di bozzime e appretti preparati a base
    di sostanze amidacee, provenienti da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/257/EEG: Beschikking van de Commissie van 2 april 1964 tot wijziging
    van haar beschikking van 4 december 1963, houdende machtiging tot het leggen van
    compenserende heffingen op de invoer in de Franse Republiek van dextrine, oplosbaar
    of geroost zetmeel, en preparaten voor het appreteren op basis van zetmeel of
    van zetmeelderivaten, uit bepaalde Lid-Staten'
  type: main
