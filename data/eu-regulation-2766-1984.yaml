title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2766/84 of 28 September 1984 re-establishing
    the levying of customs duties on certain glassware (other than articles falling
    in heading No 70.19) falling within heading No 70.13 and originating in China,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2766/84 de la Commission du 28 septembre 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    objets en verre (à l' exclusion des articles de la position 70.19 du tarif douanier
    commun) de la position 70.13 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2766/84 der Kommission vom 28. September 1984 zur
    Wiedereinführung der Erhebung der Zölle für bestimmte Glaswaren (ausgenommen
    Waren der Tarifnummer 70.19) der Tarifnummer 70.13 mit Ursprung in China, dem
    die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2766/84 af 28. september 1984 om genindførelse
    af opkrævning af told for bestemte artikler af glas, (bortset fra varer henhørende
    under pos. 70.19), henhørende under pos. 70.13 og med oprindelse i Kina, som
    er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2766/84 της Επιτροπής
    της 28ης Σεπτεμβρίου 1984 περί αποκαταστάσεως
    της εφαρμογής των δασμών για ορισμένα υάλινα
    αντικείμενα, εξαιρέσει των ειδών της κλάσεως
    70.19, της κλάσεως 70.13 του Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2766/84 della Commissione del 28 settembre 1984 che
    ripristina la riscossione dei dazi doganali applicabili ad alcuni oggetti di vetro,
    esclusi gli oggetti della voce 70.19, della voce 70.13 della tariffa doganale
    comune, originari della Cina beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2766/84 van de Commissie van 28 september 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaald glaswerk,
    met uitzondering van de artikelen bedoeld bij post 70.19, van tariefpost 70.13,
    van oorsprong uit China, waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
