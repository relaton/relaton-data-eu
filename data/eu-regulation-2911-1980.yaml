    per le carni bovine disossate oggetto di vendita mediante gara ai sensi del regolamento
    (CEE) n. 2326/79
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2911/80 van de Commissie van 11 november 1980 houdende
