    bovine désossée mise en adjudication en vertu du règlement (CEE) n 2326/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2911/80 der Kommission vom 11. November 1980 über
    den Umfang, in dem im Rahmen der Ausschreibung gemäß Verordnung (EWG) Nr. 2326/79
    eingereichten Anträgen für entbeintes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2911/80 af 11. november 1980 om i hvilket
