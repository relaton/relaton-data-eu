  script: Latn
  content: Commission Regulation (EEC) No 2911/80 of 11 November 1980 determining
    the extent to which tenders submitted for boned beef put up for sale by tender
    in accordance with Regulation (EEC) No 2326/79 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2911/80 de la Commission, du 11 novembre 1980, déterminant
