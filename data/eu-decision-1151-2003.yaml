title:
- language: en
  script: Latn
  content: Decision No 1151/2003/EC of the European Parliament and of the Council
    of 16 June 2003 amending Decision No 276/1999/EC adopting a multiannual Community
    action plan on promoting safer use of the Internet by combating illegal and harmful
    content on global networks
  type: main
- language: fr
  script: Latn
  content: Décision n° 1151/2003/CE du Parlement européen et du Conseil du 16 juin
    2003 modifiant la décision n° 276/1999/CE adoptant un plan d'action communautaire
    pluriannuel visant à promouvoir une utilisation plus sûre d'Internet par la
    lutte contre les messages à contenu illicite et préjudiciable diffusés sur
    les réseaux mondiaux
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 1151/2003/EG des Europäischen Parlaments und des Rates
    vom 16. Juni 2003 zur Änderung der Entscheidung Nr. 276/1999/EG über die Annahme
    eines mehrjährigen Aktionsplans der Gemeinschaft zur Förderung der sicheren
    Nutzung des Internet durch die Bekämpfung illegaler und schädlicher Inhalte
    in globalen Netzen
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets beslutning nr. 1151/2003/EF af 16. juni
    2003 om ændring af beslutning nr. 276/1999/EF om vedtagelse af en flerårig EF-handlingsplan
    til fremme af en mere sikker anvendelse af internettet ved bekæmpelse af ulovligt
    og skadeligt indhold på globale net
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 1151/2003/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 16ης Ιουνίου 2003, για
    την τροποποίηση της απόφασης αριθ. 276/1999/EΚ για
    ένα πολυετές κοινοτικό πρόγραμμα δράσης για
    την προώθηση της ασφαλέστερης χρήσης του Διαδικτύου
    μέσω της καταπολέμησης του παράνομου και βλαβερού
    περιεχομένου στα παγκόσμια δίκτυα
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös N:o 1151/2003/EY, tehty 16
    päivänä kesäkuuta 2003, Internetin käyttöturvallisuuden parantamista koskevan
    yhteisön monivuotisen toimintasuunnitelman hyväksymisestä maailmanlaajuisten
    verkkojen laitonta ja haitallista sisältöä torjumalla tehdyn päätöksen N:o
    276/1999/EY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Decisione n. 1151/2003/CE del Parlamento europeo e del Consiglio, del 16
    giugno 2003, che modifica la decisione n. 276/1999/CE che adotta un piano pluriennale
    d'azione comunitario per promuovere l'uso sicuro di Internet attraverso la lotta
    alle informazioni di contenuto illegale e nocivo diffuse attraverso le reti globali
  type: main
- language: nl
  script: Latn
  content: Beschikking nr. 1151/2003/EG van het Europees Parlement en de Raad van
    16 juni 2003 tot wĳziging van Beschikking nr. 276/1999/EG tot vaststelling van
    een communautair meerjarenactieplan ter bevordering van een veiliger gebruik van
    internet door het bestrĳden van illegale en schadelĳke inhoud op mondiale netwerken
  type: main
- language: pt
  script: Latn
  content: Decisão n.° 1151/2003/CE do Parlamento Europeu e do Conselho, de 16 de
    Junho de 2003, que altera a Decisão n.° 276/1999/CE que adopta um plano de acção
    comunitário plurianual para fomentar uma utilização mais segura da internet
    através do combate aos conteúdos ilegais e lesivos nas redes mundiais
  type: main
- language: es
  script: Latn
  content: Decisión n° 1151/2003/CE del Parlamento Europeo y del Consejo, de 16
    de junio de 2003, que modifica la Decisión n° 276/1999/CE por la que se aprueba
    un plan plurianual de acción comunitaria para propiciar una mayor seguridad en
    la utilización de Internet mediante la lucha contra los contenidos ilícitos
    y nocivos en las redes mundiales
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets beslut nr 1151/2003/EG av den 16 juni 2003
    om ändring av beslut nr 276/1999/EG om antagande av en flerårig handlingsplan
    på gemenskapsnivå för att främja en säkrare användning av Internet genom
    att bekämpa olagligt och skadligt innehåll på globala nät
  type: main
