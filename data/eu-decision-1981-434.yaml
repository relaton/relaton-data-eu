    ειδών οπωροφόρων δένδρων'
  type: main
- language: it
  script: Latn
  content: '81/434/CEE: Decisione della Commissione, del 7 maggio 1981, che modifica
    la decisione 76/806/CEE che stabilisce disposizioni complementari relative alle
    indagini da effettuarsi dagli Stati membri per determinare il potenziale di produzione
    di alcune specie di alberi da frutto'
  type: main
