  content: '81/434/EEC: Commission Decision of 7 May 1981 amending Decision 76/806/EEC
    laying down additional provisions concerning surveys to determine the production
    potential of plantations of certain species of fruit trees to be made by Member
    States'
  type: main
- language: fr
  script: Latn
  content: '81/434/CEE: Décision de la Commission, du 7 mai 1981, modifiant la décision
    76/806/CEE fixant des dispositions complémentaires concernant les enquêtes statistiques
    à effectuer par les États membres en vue de déterminer le potentiel de production
    des plantations de certaines espèces d'' arbres fruitiers'
  type: main
- language: de
  script: Latn
  content: '81/434/EWG: Entscheidung der Kommission vom 7. Mai 1981 zur Änderung
