    der skal foretages af medlemsstaterne for at bestemme produktionskapaciteten for
    plantager med visse arter af frugttræer'
  type: main
- language: el
  script: Grek
  content: '81/434/ΕΟΚ: Απόφαση τής Επιτροπής τής 7ης Μαΐου
