    die von den Mitgliedstaaten durchzuführenden statistischen Erhebungen zur Ermittlung
    des Produktionspotentials bestimmter Baumobstanlagen'
  type: main
- language: da
  script: Latn
  content: '81/434/EØF: Kommissionens beslutning af 7. maj 1981 om ændring af beslutning
