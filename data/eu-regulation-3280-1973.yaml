  content: Regulation (EEC) No 3280/73 of the Commission of 5 December 1973 introducing
    a system for the advance fixing of 'accession' compensatory amounts and laying
    down detailed rules for its application in respect of cereals and rice products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3280/73 de la Commission, du 4 décembre 1973, instituant
    un régime de fixation à l' avance du montant compensatoire adhésion et fixant
    les modalités d' application de ce régime pour certains produits relevant du
    secteur des céréales et du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3280/73 der Kommission vom 4. Dezember 1973 zur Einführung
