    zur Festsetzung der Durchführungsbestimmungen dieser Regelung für bestimmte
    Erzeugnisse des Getreide- und Reissektors
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3280/73 af 4. december 1973 om indførelse
