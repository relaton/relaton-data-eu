title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/366 of 1 March 2017 imposing
    definitive countervailing duties on imports of crystalline silicon photovoltaic
    modules and key components (i.e. cells) originating in or consigned from the People's
    Republic of China following an expiry review pursuant to Article 18(2) of Regulation
    (EU) 2016/1037 of the European Parliament and of the Council and terminating the
    partial interim review investigation pursuant to Article 19(3) of Regulation (EU)
    2016/1037
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/366 de la Commission du 1er mars 2017
    instituant un droit compensateur définitif sur les importations de modules photovoltaïques
    en silicium cristallin et leurs composants essentiels (cellules) originaires ou
    en provenance de la République populaire de Chine à l'issue d'un réexamen au
    titre de l'expiration des mesures effectué en vertu de l'article 18, paragraphe
    2, du règlement (UE) 2016/1037 du Parlement européen et du Conseil et clôturant
    le réexamen intermédiaire partiel effectué en vertu de l'article 19, paragraphe
    3, du règlement (UE) 2016/1037
  type: main
- language: de
  script: Latn
