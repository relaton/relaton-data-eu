    tariffa doganale comune alle importazioni di mandarini, satsuma, clementine, tangerini
    ed altri ibridi similari di agrumi originari della Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 574/73 van de Commissie van 28 februari 1973 tot
