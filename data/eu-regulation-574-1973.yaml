  content: Regulation (EEC) No 574/73 of the Commission of 28 February 1973 repealing
    Regulation (EEC) No 2786/72 applying the duty in the Common Customs Tariff to
    mandarins, satsumas, clementines, tangerines and other similar citrus hybrids
    originating in Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 574/73 de la Commission, du 28 février 1973, abrogeant
    le règlement (CEE) n° 2786/72 portant application du droit du tarif douanier
    commun aux importations de mandarines, satsumas, clémentines, tangerines et autres
    hybrides similaires d' agrumes originaires de Turquie
  type: main
