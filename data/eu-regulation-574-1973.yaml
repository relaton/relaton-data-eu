    Einfuhren von Mandarinen, Satsumas, Clementinen, Tangerinen und sonstigen ähnlichen
    Hybriden von Zitrusfrüchten mit Ursprung in der Türkei
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 574/73 af 28. februar 1973 om ophævelse
