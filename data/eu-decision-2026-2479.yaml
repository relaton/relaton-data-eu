    normy pre sterilizáciu výrobkov na zdravotnú starostlivosť, klinické skúšanie
    zdravotníckych pomôcok na humánne použitie, kondómy z prírodného kaučukového
    latexu, biologické hodnotenie zdravotníckych pomôcok, prístroje na umývanie
    a dezinfekciu, zdravotnícke elektrické prístroje a spojky s malým priemerom
    na kvapaliny a plyny v aplikáciách zdravotnej starostlivosti
  type: main
