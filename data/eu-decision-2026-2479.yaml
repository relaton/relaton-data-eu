    Provedbene odluke (EU) 2021/1182 u pogledu usklađenih normi za sterilizaciju
    proizvoda za zdravstvenu skrb, klinička ispitivanja medicinskih proizvoda za
    ljude, kondome za muškarce od prirodnog lateksa, biološku procjenu medicinskih
    proizvoda, uređaje za pranje i dezinfekciju, medicinsku električnu opremu i
    spojnike malog promjera za tekućine i plinove za primjenu u zdravstvu
  type: main
