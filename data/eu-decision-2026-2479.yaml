title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/2479 of 9 November 2026 amending
    Implementing Decision (EU) 2021/1182 as regards harmonised standards for sterilization
    of health care products, clinical investigation of medical devices for human subjects,
    natural rubber latex male condoms, biological evaluation of medical devices, washer-disinfectors,
    medical electrical equipment and small-bore connectors for liquids and gases in
    healthcare applications
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/2479 de la Commission du 9 novembre
    2026 modifiant la décision d’exécution (UE) 2021/1182 en ce qui concerne les
    normes harmonisées relatives à la stérilisation des produits de santé, à
    l’investigation clinique des dispositifs médicaux pour sujets humains, aux
    préservatifs externes en latex de caoutchouc naturel, à l’évaluation biologique
    des dispositifs médicaux, aux laveurs-désinfecteurs, aux appareils électromédicaux
    et aux raccords de petite taille pour liquides et gaz utilisés dans le domaine
    de la santé
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/2479 der Kommission vom 9. November 2026
    zur Änderung des Durchführungsbeschlusses (EU) 2021/1182 in Bezug auf die harmonisierten
    Normen für die Sterilisation von Produkten für die Gesundheitsfürsorge, die
    klinische Prüfung von Medizinprodukten an Menschen, Kondome aus Naturkautschuklatex
    für Männer, die biologische Beurteilung von Medizinprodukten, Reinigungs-Desinfektionsgeräte,
    medizinische elektrische Geräte und Verbindungsstücke mit kleinem Durchmesser
    für Flüssigkeiten und Gase in medizinischen Anwendungen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/2479 на Комисията
    от 9 ноември 2026 година за изменение на Решение
    за изпълнение (ЕС) 2021/1182 по отношение на хармонизираните
    стандарти за стерилизация на продукти за здравеопазването,
    клинично изпитване на медицински изделия върху
    хора, мъжки презервативи от естествен каучуков
    латекс, биологично преценяване на медицински
    изделия, машини за измиване и дезинфекция,
    електромедицински апарати и съединители с
    малки отвори за течности и газ за използване
    в здравеопазването
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/2479 ze dne 9. listopadu 2026,
    kterým se mění prováděcí rozhodnutí (EU) 2021/1182, pokud jde o harmonizované
    normy pro sterilizaci výrobků pro zdravotní péči, klinické zkoušky zdravotnických
    prostředků pro humánní účely, kondomy pro muže z přírodního latexu,
    biologické hodnocení zdravotnických prostředků, mycí a dezinfekční zařízení,
    zdravotnické elektrické přístroje a konektory s malým vnitřním průměrem
    pro kapaliny a plyny používané ve zdravotnictví
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/2479 af 9. november 2026
