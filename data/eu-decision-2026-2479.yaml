    siltä osin kuin on kyse lääkinnällisten laitteiden sterilointia, lääkinnällisten
    laitteiden kliinisiä tutkimuksia, luonnonkumista valmistettuja kondomeja, lääkinnällisten
    laitteiden biologista arviointia, pesu- ja desinfiointikoneita, terveydenhuollon
    sähkölaitteita sekä terveydenhuollossa nesteiden ja kaasujen kuljettamisessa
    käytettäviä pienikaliiperisia liittimiä koskevista yhdenmukaistetuista standardeista
  type: main
