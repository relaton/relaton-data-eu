---
id: EUDirective199942
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Directive 1999/42/EC of the European Parliament and of the Council of 7
    June 1999 establishing a mechanism for the recognition of qualifications in respect
    of the professional activities covered by the Directives on liberalisation and
    transitional measures and supplementing the general systems for the recognition
    of qualifications
  type: main
- language: fr
  script: Latn
  content: Directive 1999/42/CE du Parlement européen et du Conseil du 7 juin 1999
    instituant un mécanisme de reconnaissance des diplômes pour les activités professionnelles
    couvertes par les directives de libéralisation et portant mesures transitoires,
    et complétant le système général de reconnaissance des diplômes
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/42/EG des Europäischen Parlaments und des Rates vom 7.
    Juni 1999 über ein Verfahren zur Anerkennung der Befähigungsnachweise für die
    unter die Liberalisierungs- und Übergangsrichtlinien fallenden Berufstätigkeiten
    in Ergänzung der allgemeinen Regelung zur Anerkennung der Befähigungsnachweise
  type: main
- language: bg
  script: Cyrl
  content: Директива 1999/42/ЕО на Европейския парламент
    и на Съвета от 7 юни 1999 година относно създаването
    на механизъм за признаване на придобита квалификация
    във връзка с професионалните дейности в приложното
    поле на директивите за либерализация и преходни
    мерки и относно допълването на общата система
    за признаване на придобита квалификация
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 1999/42/ES ze dne 7. června 1999,
    kterou se zavádí postup pro uznávání dokladů o dosažené kvalifikaci pro
    profesní činnosti upravené směrnicemi o liberalizaci a o přechodných opatřeních
    a kterou se doplňuje obecný systém uznávání dokladů o dosažené kvalifikaci
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 1999/42/EF af 7. juni 1999 om indførelse
    af en ordning for anerkendelse af eksamensbeviser for de former for erhvervsvirksomhed,
    der er omfattet af direktiverne om liberalisering og om overgangsforanstaltninger,
    og til supplering af den generelle ordning for anerkendelse af eksamensbeviser
  type: main
- language: el
  script: Grek
  content: Οδηγία 1999/42/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 7ης Ιουνίου 1999 για τη
    θέσπιση συστήματος αναγνώρισης των προσόντων
    σχετικά με τις επαγγελματικές δραστηριότητες
    που καλύπτονται από τις οδηγίες ελευθέρωσης,
    καθώς και μεταβατικών μέτρων, και για τη συμπλήρωση
    του γενικού συστήματος αναγνώρισης των διπλωμάτων
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 1999/42/EÜ, 7. juuni 1999, millega
    kehtestatakse kutsekvalifikatsiooni tunnustamise mehhanism seoses liberaliseerimist
    ja üleminekumeetmeid käsitlevate direktiividega hõlmatud tegevusaladega ning
    millega täiendatakse kutsekvalifikatsiooni tunnustamise üldsüsteemi
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja Neuvoston direktiivi 1999/42/EY, annettu 7 päivänä
    kesäkuuta 1999, tutkintotodistusten tunnustamisjärjestelmän perustamisesta
    vapauttamisdirektiivien ja siirtymätoimenpiteistä annettujen direktiivien soveltamisalaan
    kuuluvan ammatillisen toiminnan osalta sekä tutkintotodistusten yleisen tunnustamisjärjestelmän
    täydentämisestä
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 1999/42/EK irányelve (1999. június
    7.) a liberalizációról és az átmeneti rendelkezésekről szóló irányelvek
    hatálya alá tartozó foglalkozásokkal kapcsolatban a képesítések elismerésére
    szolgáló rendszer létrehozásáról és a képesítések elismerésére szolgáló
    általános rendszerek kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/42/CE del Parlamento Europeo e del Consiglio del 7 giugno
    1999 che istituisce un meccanismo di riconoscimento delle qualifiche per le attività
    professionali disciplinate dalle direttive di liberalizzazione e dalle direttive
    recanti misure transitorie e che completa il sistema generale di riconoscimento
    delle qualifiche
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 1999/42/EK (1999. gada 7. jūnijs),
    ar ko izveido diplomu atzīšanas mehānismu attiecībā uz profesionālajām
    darbībām, kuras aptver liberalizācijas direktīvas, un nosaka pārejas pasākumus
    un papildina diplomu atzīšanas vispārējās sistēmas
  type: main
- language: lt
  script: Latn
  content: 1999 m. birželio 7 d. Europos Parlamento ir Tarybos direktyva 1999/42/EB
    nustatanti kvalifikacijų pripažinimo mechanizmą profesinės veiklos rūšims,
    kurioms taikomos liberalizavimo ir pereinamojo laikotarpio priemones nustatančios
    direktyvos, ir papildanti bendrąsias kvalifikacijų pripažinimo sistemas
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 1999/42/KE tal-Parlament Ewropew u tal-Kunsill tas-7 ta' Ġunju
    1999 li tistabbilixxi mekkaniżmu għar-rikonoxximent ta' kwalifiki għal attivitajiet
    professjonali koperti mid-Direttivi dwar il-liberalizzazzjoni u l-miżuri transitorji
    u li tissupplimenta s-sistemi ġenerali għar-rikonoxximent tal-kwalifiki.
  type: main
- language: nl
  script: Latn
  content: Richtlijn 1999/42/EG van het Europees Parlement en de Raad van 7 juni 1999
    betreffende de invoering van een regeling voor de erkenning van diploma's betreffende
    beroepswerkzaamheden die binnen de werkingssfeer van de liberaliseringsrichtlijnen
    en van de richtlijnen houdende overgangsmaatregelen vallen en tot aanvulling van
    het algemene stelsel van erkenning van diploma's
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 99/42/WE Parlamentu Europejskiego i Rady z dnia 7 czerwca 1999
    r. ustanawiająca procedurę uznawania kwalifikacji w zakresie działalności
    zawodowych objętych dyrektywami w sprawie liberalizacji i środków przejściowych
    oraz uzupełniająca ogólne systemy uznawania kwalifikacji
  type: main
- language: pt
  script: Latn
  content: Directiva 1999/42/CE do Parlamento Europeu e do Conselho de 7 de Junho
    de 1999 que cria um mecanismo de reconhecimento dos diplomas para as actividades
    profissionais abrangidas pelas directivas de liberalização e de medidas transitórias,
    completando o sistema geral de reconhecimento dos diplomas
  type: main
- language: ro
  script: Latn
  content: Directiva 1999/42/CE a Parlamentului European și a Consiliului din 7 iunie
    1999 de stabilire a unui mecanism de recunoaștere a calificărilor pentru activitățile
    profesionale reglementate de directivele privind măsuri de liberalizare și tranzitorii
    și de completare a sistemului general de recunoaștere a diplomelor
  type: main
- language: sk
  script: Latn
  content: Smernica 1999/42/ES európskeho parlamentu a Rady zo 7. júna 1999, ktorou
    sa zavádza mechanizmus uznávania kvalifikácií na odborné činnosti, na ktoré
    sa vzťahujú smernice o liberalizácii a prechodných opatreniach a ktorými
    sa dopĺňa všeobecný systém uznávania kvalifikácií
  type: main
- language: sl
  script: Latn
  content: Direktiva 1999/42/ES evropskega parlamenta in sveta z dne 7. junija 1999
    o vzpostavitvi mehanizma za priznavanje kvalifikacij za poklicne dejavnosti iz
    direktiv o liberalizaciji in prehodnih ukrepih ter dopolnitvi splošnega sistema
    za priznavanje kvalifikacij
  type: main
- language: es
  script: Latn
  content: Directiva 1999/42/CE del Parlamento Europeo y del Consejo de 7 de junio
    de 1999 por la que se establece un mecanismo de reconocimiento de títulos respecto
    de las actividades profesionales a que se refieren las Directivas de liberalización
    y de medidas transitorias
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och Rådets direktiv 1999/42/EG av den 7 juni 1999 om
    införande av en ordning för erkännande av kvalifikationer för de former av
    yrkesverksamhet som omfattas av direktiven om liberalisering och övergångsåtgärder
    samt om komplettering av den allmänna ordningen för erkännande av kvalifikationer
  type: main
