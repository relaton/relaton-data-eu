  content: Commission Regulation (EEC) No 1610/87 of 9 June 1987 re-establishing the
    levying of customs duties on men' s and boys' outer garments, products of category
    16 (code 40.0160), originating in India, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3925/86 apply
  type: main
