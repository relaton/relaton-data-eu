    commercializzazione 1993/1994, che determina per la campagna 1994/1995 la produzione
    stimata e la riduzione provvisoria dell'aiuto e che fissa l'importo della diminuzione
    del prezzo di obiettivo per la campagna 1995/1996
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2150/94 van de Commissie van 31 augustus 1994 tot
    vaststelling, voor niet-geëgreneerde katoen, van de feitelijke produktie voor
    het verkoopseizoen 1993/1994 en van de geraamde produktie en de voorlopige korting
    op het steunbedrag voor het verkoopseizoen 1994/1995, en tot vaststelling van
