    1993/94, zur Bestimmung der geschätzten Erzeugung im Wirtschaftsjahr 1994/95
    und der vorläufigen Kürzung der Beihilfe sowie zur Festsetzung der Verringerung
    des Zielpreises im Wirtschaftsjahr 1995/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2150/94 af 31. august 1994 om fastsættelse
