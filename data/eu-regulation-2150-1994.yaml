    og for produktionsåret 1994/95 af den anslåede produktion, foreløbig nedsættelse
    af støttebeløbet og fastsættelse af det beløb, hvormed målprisen for produktionsåret
    1995/96 nedsættes
  type: main
- language: el
  script: Grek
