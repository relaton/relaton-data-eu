    για την περίοδο εμπορίας 1993/94, προσδιορίζει
    για την περίοδο 1994/95 την εκτιμώμενη παραγωγή,
    την προσωρινή μείωση της ενίσχυσης και καθορίζει
    το ποσό κατά το οποίο θα μειωθεί η τιμή στόχου
    για την περίοδο 1995/96
  type: main
- language: fi
  script: Latn
