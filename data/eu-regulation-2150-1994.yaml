title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2150/94 of 31 August 1994 fixing, for unginned
    cotton, the actual production for the 1993/94 marketing year, the estimated production
    and the provisional reduction in the aid for the 1994/95 marketing year and the
    amount by which the guide price is to be reduced for the 1995/96 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2150/94 de la Commission, du 31 août 1994, fixant, pour
    le coton non égrené, la production effective pour la campagne de commercialisation
    1993/1994, déterminant pour la campagne 1994/1995 la production estimée, l'abattement
    provisoire de l'aide, et fixant le montant dont sera diminué le prix d'objectif
    pour la campagne 1995/1996
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2150/94 der Kommission vom 31. August 1994 zur Festsetzung
