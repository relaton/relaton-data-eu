    за Бахрейн и Бразилия в списъка на трети държави
    и части от тях, от които е разрешено въвеждането
    в Съюза на живи еднокопитни и на сперма, яйцеклетки
    и ембриони от еднокопитни (нотифицирано под
    номер C(2012) 6732)'
  type: main
- language: cs
