    le voci relative al Bahrein e al Brasile figuranti nell’elenco dei paesi terzi
    e delle parti di territori dei paesi terzi da cui sono autorizzate le importazioni
    nell’Unione europea di equidi vivi nonché di sperma, ovuli ed embrioni della
