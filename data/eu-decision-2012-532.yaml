title:
- language: en
  script: Latn
  content: '2012/532/EU: Commission Implementing Decision of 27 September 2012 amending
    Annex I to Decision 2004/211/EC as regards the entries for Bahrain and Brazil
    in the list of third countries and parts thereof from which the introduction into
    the Union of live equidae and semen, ova and embryos of the equine species are
    authorised (notified under document C(2012) 6732)'
  type: main
- language: fr
  script: Latn
  content: '2012/532/UE: Décision d’exécution de la Commission du 27 septembre
    2012 modifiant l’annexe I de la décision 2004/211/CE en ce qui concerne les
    mentions relatives à Bahreïn et au Brésil figurant sur la liste des pays tiers
    et des parties de ces pays en provenance desquels l’introduction dans l’Union
    européenne d’équidés vivants et de sperme, d’ovules et d’embryons de
    l’espèce équine est autorisée [notifiée sous le numéro C(2012) 6732]'
  type: main
- language: de
  script: Latn
  content: '2012/532/EU: Durchführungsbeschluss der Kommission vom 27. September
    2012 zur Änderung des Anhangs I der Entscheidung 2004/211/EG hinsichtlich der
    Einträge zu Bahrain und Brasilien in der Liste von Drittländern und Teilen von
    Drittländern, aus denen die Einfuhr von lebenden Equiden sowie von Equidensperma,
    -eizellen und -embryonen in die Europäische Union zugelassen ist (Bekanntgegeben
    unter Aktenzeichen C(2012) 6732)'
  type: main
- language: bg
