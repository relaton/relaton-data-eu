  script: Latn
  content: Decyzja Rady (UE) 2021/812 z dnia 10 maja 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Komitetu Stowarzyszenia
    w składzie rozstrzygającym kwestie dotyczące handlu oraz w Radzie Stowarzyszenia
    ustanowionych na mocy Układu o stowarzyszeniu między Unią Europejską i Europejską
    Wspólnotą Energii Atomowej oraz ich państwami członkowskimi, z jednej strony,
    a Gruzją, z drugiej strony, w odniesieniu do pozytywnej opinii dotyczącej zatwierdzonego
    przez rząd Gruzji wyczerpującego harmonogramu wdrożenia prawodawstwa odnoszącego
    się do zamówień publicznych oraz w sprawie uznania zakończenia etapu 1 określonego
    w załączniku XVI-B do tego układu o stowarzyszeniu
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2021/812 do Conselho de 10 de maio de 2021 relativa à posição
    a adotar em nome da União Europeia no âmbito do Comité de Associação na sua
    configuração Comércio e no âmbito do Conselho de Associação instituídos
    pelo Acordo de Associação entre a União Europeia e a Comunidade Europeia da
    Energia Atómica e os seus Estados-Membros, por um lado, e a Geórgia, por outro,
    no que diz respeito a um parecer favorável sobre o plano pormenorizado aprovado
    pelo Governo da Geórgia para a aplicação da legislação em matéria de contratos
    públicos e que reconhece a conclusão da fase 1 do anexo XVI-B desse Acordo de
    Associação
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2021/812 a Consiliului din 10 mai 2021 privind poziția care
    urmează să fie adoptată, în numele Uniunii Europene, în cadrul Comitetului
    de asociere reunit în configurația „Comerț” și în cadrul Consiliului
    de asociere constituite prin Acordul de asociere dintre Uniunea Europeană și
    Comunitatea Europeană a Energiei Atomice și statele membre ale acestora, pe
    de o parte, și Georgia, pe de altă parte, în ceea ce privește un aviz favorabil
    referitor la foaia de parcurs completă aprobată de guvernul Georgiei pentru
    punerea în aplicare a legislației în domeniul achizițiilor publice și de
    recunoaștere a finalizării etapei 1 din anexa XVI-B la respectivul acord de
    asociere
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2021/812 z 10. mája 2021 o pozícii, ktorá sa
    má v mene Európskej únie zaujať vo Výbore pre pridruženie v zložení pre
    otázky obchodu a v Rade pre pridruženie zriadených Dohodou o pridružení medzi
    Európskou úniou a Európskym spoločenstvom pre atómovú energiu a ich členskými
    štátmi na jednej strane a Gruzínskom na strane druhej, pokiaľ ide o kladné
    stanovisko ku komplexnému plánu pre vykonávanie právnych predpisov týkajúcich
    sa verejného obstarávania schválenému vládou Gruzínska a uznanie dokončenia
    fázy 1 uvedenej v prílohe XVI-B k uvedenej dohode o pridružení
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2021/812 z dne 10. maja 2021 o stališču, ki naj se v
    imenu Evropske unije zastopa v Pridružitvenem odboru v njegovi trgovinski sestavi
    in Pridružitvenem svetu, ustanovljenem s Pridružitvenim sporazumom med Evropsko
    unijo in Evropsko skupnostjo za atomsko energijo in njunimi državami članicami
    na eni strani ter Gruzijo na drugi strani, glede ugodnega mnenja o celovitem načrtu
    za izvajanje zakonodaje o javnih naročilih, ki ga je odobrila vlada Gruzije,
    in glede priznavanja zaključka faze 1 iz Priloge XVI-B k navedenemu pridružitvenemu
    sporazumu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/812 del Consejo de 10 de mayo de 2021 relativa a la
    posición que debe adoptarse en nombre de la Unión Europea en el seno del Comité
    de Asociación, en su configuración de Comercio, y en el Consejo de Asociación
    establecido por el Acuerdo de Asociación entre la Unión Europea y la Comunidad
    Europea de la Energía Atómica y sus Estados miembros, por una parte, y Georgia,
    por otra, en lo que respecta a un dictamen favorable sobre el plan de trabajo
    detallado aprobado por el Gobierno de Georgia para la aplicación de la legislación
    relativa a la contratación pública, y por el que se reconoce la finalización
    de la fase 1 del anexo XVI-B de dicho Acuerdo de Asociación
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2021/812 av den 10 maj 2021 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i associeringskommittén i dess konstellation
    för handelsfrågor och i det associeringsråd som inrättats genom associeringsavtalet
    mellan Europeiska unionen och Europeiska atomenergigemenskapen och deras medlemsstater,
    å ena sidan, och Georgien, å andra sidan, vad gäller ett positivt yttrande
    om den övergripande färdplan som godkänts av Georgiens regering för genomförandet
    av lagstiftning om offentlig upphandling och om erkännande av slutförandet av
    fas 1 i bilaga XVI-B till det associeringsavtalet
