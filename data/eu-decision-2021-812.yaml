    és tagállamaik, másrészről Grúzia közötti társulási megállapodás által
    létrehozott, kereskedelmi formációban ülésező Társulási Bizottságban
    és Társulási Tanácsban a közbeszerzéssel kapcsolatos jogszabályok végrehajtására
