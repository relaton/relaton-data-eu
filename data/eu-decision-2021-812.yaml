    Georgian välisellä assosiaatiosopimuksella perustetussa kauppaan liittyvien
    kysymysten kokoonpanossa olevassa assosiaatiokomiteassa Euroopan unionin puolesta
    otettavasta kannasta Georgian hallituksen hyväksymää julkisiin hankintoihin
    liittyvän lainsäädännön täytäntöönpanemiseksi laadittua kattavaa etenemissuunnitelmaa
    koskevaan myönteiseen lausuntoon ja kyseisen assosiaatiosopimuksen liitteessä
    XVI-B vahvistetun 1. vaiheen päätökseen saattamisen tunnustamisesta
