    atominės energijos bendrijos bei jų valstybių narių ir Gruzijos asociacijos
    susitarimu įsteigtame Asociacijos komitete prekybos klausimais ir Asociacijos
    taryboje, dėl palankios nuomonės dėl Gruzijos Vyriausybės patvirtinto išsamaus
