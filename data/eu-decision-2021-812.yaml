  script: Cyrl
  content: Решение (ЕС) 2021/812 на Съвета от 10 май 2021 година
    относно позицията, която трябва да се заеме
    от името на Европейския съюз в рамките на Комитета
    за асоцииране в състав „Търговия“ и на Съвета
    за асоцииране, създадени със Споразумението
    за асоцииране между Европейския съюз и Европейската
    общност за атомна енергия и техните държави
    членки, от една страна, и Грузия, от друга страна,
    във връзка с даването на положително становище
    относно одобрената от правителството на Грузия
    подробна пътна карта за прилагането на законодателството
    в областта на обществените поръчки и за признаване
    на приключването на етап 1 от приложение XVI-Б
    към посоченото Споразумение за асоцииране
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2021/812 ze dne 10. května 2021 o postoji, který
    má být jménem Evropské unie zaujat ve Výboru pro přidružení ve složení
    pro obchod a v Radě přidružení zřízených Dohodou o přidružení mezi Evropskou
    unií a Evropským společenstvím pro atomovou energii a jejich členskými státy
    na jedné straně a Gruzií na straně druhé, pokud jde o kladné stanovisko
    ke komplexnímu plánu pro provádění právních předpisů týkajících se
    veřejných zakázek schválenému vládou Gruzie a uznání dokončení fáze
    1 přílohy XVI-B dohody o přidružení
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2021/812 af 10. maj 2021 om den holdning, der skal
    indtages på Den Europæiske Unions vegne i Associeringsudvalget i dettes handelssammensætning
    og i Associeringsrådet, der er nedsat ved associeringsaftalen mellem Den Europæiske
    Union og Det Europæiske Atomenergifællesskab og deres medlemsstater på den
    ene side og Georgien på den anden side, til en positiv udtalelse om den fuldstændige
    køreplan, som Georgiens regering har godkendt for gennemførelsen af lovgivning
    vedrørende offentlige udbud, og om anerkendelse af afslutningen af fase 1 i bilag
    XVI-B til associeringsaftalen
  type: main
