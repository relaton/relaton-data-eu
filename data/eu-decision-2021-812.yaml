    dat namens de Europese Unie moet worden ingenomen in het Associatiecomité in
    zijn samenstelling voor handelsvraagstukken en in de Associatieraad opgericht
    krachtens de Associatieovereenkomst tussen de Europese Unie en de Europese Gemeenschap
    voor Atoomenergie en hun lidstaten, enerzijds, en Georgië, anderzijds, met betrekking
    tot een positief advies over het door de regering van Georgië goedgekeurde uitgebreide
    stappenplan voor de uitvoering van wetgeving inzake overheidsopdrachten en houdende
    erkenning van de voltooiing van fase 1 van bijlage XVI-B bij die Associatieovereenkomst
  type: main
