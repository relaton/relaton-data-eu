title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/812 of 10 May 2021 on the position to be taken
    on behalf of the European Union within the Association Committee in Trade configuration
    and in the Association Council established by the Association Agreement between
    the European Union and the European Atomic Energy Community and their Member States,
    of the one part, and Georgia, of the other part, as regards a favourable opinion
    on the comprehensive roadmap approved by the Government of Georgia for the implementation
    of legislation related to public procurement and recognising the completion of
    Phase 1 of Annex XVI-B of that Association Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/812 du Conseil du 10 mai 2021 relative à la position
    à prendre au nom de l’Union européenne au sein du comité d’association
    dans sa configuration «Commerce» et du conseil d’association institués par
    l’accord d’association entre l’Union européenne et la Communauté européenne
    de l’énergie atomique et leurs États membres, d’une part, et la Géorgie,
    d’autre part, en ce qui concerne un avis favorable sur la feuille de route détaillée
    approuvée par le gouvernement de la Géorgie pour la mise en œuvre de la législation
    en matière de marchés publics, et reconnaissant l’achèvement de la phase
    1 de l’annexe XVI-B dudit accord d’association
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/812 des Rates vom 10. Mai 2021 über den Standpunkt,
    der im Namen der Europäischen Union im Assoziationsausschuss in der Zusammensetzung
    „Handel“ sowie im Assoziationsrat, eingerichtet durch das Assoziierungsabkommen
    zwischen der Europäischen Union und der Europäischen Atomgemeinschaft und ihren
    Mitgliedstaaten einerseits und Georgien andererseits, in Bezug auf eine befürwortende
    Stellungnahme zu dem von der Regierung Georgiens gebilligten umfassenden Fahrplan
    für die Umsetzung der Rechtsvorschriften für das öffentliche Beschaffungswesen
    und in Bezug auf die Anerkennung des Abschlusses der in Anhang XVI-B dieses Assoziierungsabkommens
    genannten Phase 1 zu vertreten ist
  type: main
