  content: Odluka Vijeća (EU) 2021/812 od 10. svibnja 2021. o stajalištu koje treba
    zauzeti u ime Europske unije u okviru Odbora za pridruživanje u sastavu za trgovinu
    i u Vijeću za pridruživanje osnovanom Sporazumom o pridruživanju između Europske
    unije i Europske zajednice za atomsku energiju i njihovih država članica, s
    jedne strane, i Gruzije, s druge strane, u pogledu pozitivnog mišljenja o sveobuhvatnom
    planu koji je vlada Gruzije odobrila za provedbu zakonodavstva u vezi s javnom
    nabavom i priznavanja dovršetka faze 1 Priloga XVI.B tom Sporazumu o pridruživanju
  type: main
- language: hu
  script: Latn
