title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1597/73 of the Commission of 14 June 1973 re-establishing
    Common Customs Tariff duties on under garments, knitted or crocheted, not elastic
    nor rubberized, of cotton, falling within heading No 60.04 A, originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2764/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1597/73 de la Commission, du 14 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux sous-vêtements de bonneterie non élastique ni caoutchoutée, de la sous-position
    tarifaire 60.04 A, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2764/72 du Conseil du 19 décembre
    1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1597/73 der Kommission vom 14. Juni 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Unterkleidung
    aus Gewirken, weder gummielastisch noch kautschutiert, aus Baumwolle, der Tarifstelle
    60.04 A, mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 2764/72
    des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1597/73 af 14. juni 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for underbeklædningsgenstande af trikotage,
    ikke elastisk eller gummeret, af bomuld under position 60.04 A, som har oprindelse
    i Syd Korea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2764/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1597/73 della Commissione, del 14 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    sottovesti a maglia non elastica né gommata, di cotone, della sottovoce doganale
    n. 60.04 A originarie della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2764/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1597/73 van de Commissie van 14 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op onderkleding van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk, van katoen, van onderverdeling 60.04 A, van oorsprong uit Zuid-Korea,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2764/72 van de Raad van 19 december 1972
  type: main
