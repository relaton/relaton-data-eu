  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1212/95 della Commissione, del 30 maggio 1995, che
    determina i tassi di interesse compensatori applicabili ove sorga un' obbligazione
    doganale relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo è ammissione temporanea) nel secondo semestre 1995
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1212/95 van de Commissie van 30 mei 1995 tot vaststelling
