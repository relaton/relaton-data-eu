title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1212/95 of 30 May 1995 laying down rates
    of compensatory interest applicable during the second half of 1995 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1212/95 de la Commission, du 30 mai 1995, fixant les
    taux d' intérêts compensatoires applicables en cas de naissance d' une dette
    douanière relative aux produits compensateurs ou aux marchandises en l' état
    (régime du perfectionnement actif, système de la suspension et régime de l'
    admission temporaire) pendant le deuxième semestre de 1995
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1212/95 der Kommission vom 30. Mai 1995 mit Sätzen
    von Ausgleichszinsen, die im zweiten Halbjahr 1995 bei Entstehung einer Zollschuld
    für Veredelungserzeugnisse oder unveredelte Waren (aktiver Veredelungsverkehr
    und vorübergehende Verwendung) anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1212/95 af 30. maj 1995 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukter eller uforædlede varer (aktiv forædling og midlertidig
    indførsel) i andet halvår af 1995
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1212/95 της Επιτροπής
    της 30ής Μαΐου 1995 για τον καθορισμό αντισταθμιστικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή αρχικά εμπορεύματα (καθεστώς τελειοποίησης
    προς επανεξαγωγή και προσωρινής εισαγωγής)
    κατά τη διάρκεια του δεύτερου εξαμήνου 1995
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1212/95, annettu 30 päivänä toukokuuta 1995,
