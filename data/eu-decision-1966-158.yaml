title:
- language: fr
  script: Latn
  content: Décision 66/158/CEE de la Commission, du 14 février 1966, portant nouvelle
    modification de sa décision du 10 novembre 1964, autorisant la perception de
    taxes compensatoires à l'importation, en République fédérale d'Allemagne,
    de dextrines fabriquées à partir de fécule de pommes de terre ainsi que de
    fécules de pommes de terre solubles ou torréfiées, en provenance de certains
    États membres
  type: main
- language: de
  script: Latn
  content: '66/158/EWG: Entscheidung der Kommission vom 14. Februar 1966 zur erneuten
    Änderung ihrer Entscheidung vom 10. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Dextrin auf der Grundlage von Kartoffelstärke sowie von löslicher
    oder gerösteter Kartoffelstärke aus verschiedenen Mitgliedstaaten in die Bundesrepublik
    Deutschland'
  type: main
- language: it
  script: Latn
  content: '66/158/CEE: Decisione della Commissione, del 14 febbraio 1966, che modifica
    nuovamente la decisione del 10 novembre 1964 con cui si autorizza la riscossione
    di tasse di compensazione sull''importazione nella Repubblica federale di Germania,
    di destrine a base di fecola di patate, nonché di fecole di patate solubili o
    torrefatte provenienti da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/158/EEG: Beschikking van de Commissie van 14 februari 1966 tot nieuwe
    wijziging van haar beschikking van 10 november 1964 houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Bondsrepubliek Duitsland
    van dextrine vervaardigd uit aardappelzetmeel, oplosbaar of geroost aardappelzetmeel,
    uit bepaalde Lid-Staten'
  type: main
