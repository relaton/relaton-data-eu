    liidu teatavaid linnukasvatussaadusi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/24, annettu 13 päivänä
    tammikuuta 2021, asetuksen (EY) N:o 798/2008 liitteen I muuttamisesta Yhdistynyttä
    kuningaskuntaa koskevan kohdan osalta niiden kolmansien maiden, alueiden, vyöhykkeiden
    tai erillisalueiden luettelossa, joista tiettyjen siipikarjasta saatujen hyödykkeiden
    tuonti unioniin tai kuljettaminen sen kautta on sallittua korkeapatogeenisen lintuinfluenssan
    yhteydessä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/24 ón gCoimisiún an 13 Eanáir
    2021 lena leasaítear Iarscríbhinn I a ghabhann le Rialachán (CE) Uimh. 798/2008
    maidir le hiontráil na Ríochta Aontaithe ar an liosta de thríú tíortha, críocha,
    criosanna nó deighleoga óna bhféadfar tráchtearraí áirithe éanlaithe clóis
    a allmhairiú isteach san Aontas agus a bheith faoi bhealach tríd i ndáil le
    fliú éanúil ardphataigineach
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/24 оd 13. siječnja 2021. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Ujedinjenu Kraljevinu na
    popisu trećih zemalja, državnih područja, zona ili kompartmenta iz kojih je
    dozvoljen uvoz i provoz određenih proizvoda od peradi kroz Uniju u vezi s visokopatogenom
    influencom ptica
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/24 végrehajtási rendelete (2021. január 13.)
    a 798/2008/EK rendelet I. mellékletének az egyes baromfiáruk Unióba történő
    behozatala és Unión keresztül történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékében
    az Egyesült Királyságra vonatkozó bejegyzés tekintetében a magas patogenitású
    vírustörzsek okozta madárinfluenza megjelenése nyomán szükségessé vált
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/24 della Commissione del 13 gennaio
    2021 che modifica l’allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa al Regno Unito nell’elenco di paesi terzi, loro territori,
    zone o compartimenti da cui determinati prodotti a base di pollame possono essere
    importati o transitare nell’Unione in relazione all’influenza aviaria ad alta
    patogenicità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/24 (2021. gada 13. janvāris),
    ar ko attiecībā uz ierakstu par Apvienoto Karalisti to trešo valstu, teritoriju,
    zonu vai nodalījumu sarakstā, no kuriem saistībā ar augsti patogēnisko putnu
    gripu atļauts importēt Savienībā un tranzītā caur to pārvadāt konkrētas
    mājputnu izcelsmes preces, groza Regulas (EK) Nr. 798/2008 I pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/24 2021 m. sausio 13 d. kuriuo
    dėl labai patogeniško paukščių gripo ir su juo susijusio Jungtinės Karalystės
    įrašo trečiųjų šalių, teritorijų, zonų ar skyrių, iš kurių galima
    importuoti į Sąjungą ir vežti tranzitu per Sąjungą tam tikras naminių paukščių
    prekes, sąraše iš dalies keičiamas Reglamento (EB) Nr. 798/2008 I priedas
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/24 tat-13
    ta’ Jannar 2021 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 dwar
    l-entrata għar-Renju Unit fil-lista ta’ pajjiżi terzi, territorji, żoni jew
    kumpartimenti li minnhom jistgħu jiġu importati ċerti prodotti tat-tjur lejn
    l-Unjoni u jsir tranżitu minnha fir-rigward tal-influwenza tat-tjur b’patoġeniċità
    għolja
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/24 van de Commissie van 13 januari 2021
    tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de gegevens
    voor het Verenigd Koninkrijk in de lijst van derde landen, gebieden, zones of
    compartimenten waaruit bepaalde pluimveeproducten mogen worden ingevoerd in en
    doorgevoerd door de Unie in verband met hoogpathogene aviaire influenza
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/24 z dnia 13 stycznia 2021
    r. zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w odniesieniu
    do wpisu dotyczącego Zjednoczonego Królestwa w wykazie państw trzecich, terytoriów,
    stref lub grup, z których dopuszczalny jest przywóz do Unii i tranzyt przez
    jej terytorium niektórych produktów drobiowych w związku z wysoce zjadliwą
    grypą ptaków
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/24 da Comissão de 13 de janeiro de
    2021 que altera o anexo I do Regulamento (CE) n.o 798/2008 no que se refere à
    entrada relativa ao Reino Unido na lista de países terceiros, territórios, zonas
    ou compartimentos a partir dos quais são autorizados a importação e o trânsito
    na União de determinados produtos à base de aves de capoeira relativamente à
    gripe aviária de alta patogenicidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/24 al Comisiei din 13 ianuarie
    2021 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Regatul Unit din lista conținând țări terțe, teritorii,
    zone sau compartimente din care anumite păsări de curte și produse obținute
    de la acestea pot fi importate în Uniune sau pot tranzita Uniunea în contextul
    gripei aviare înalt patogene
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/24 z 13. januára 2021, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Spojeného kráľovstva v zozname tretích krajín, území, oblastí alebo
    jednotiek, z ktorých možno do Únie dovážať alebo cez jej územie prevážať
    určité komodity z hydiny v súvislosti s vysokopatogénnou vtáčou chrípkou
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/24 z dne 13. januarja 2021 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosa za Združeno kraljestvo na seznamu
    tretjih držav, ozemelj, območij ali kompartmentov, iz katerih je dovoljen uvoz
    nekaterega perutninskega blaga v Unijo in njegov tranzit skozi Unijo v zvezi z
    visokopatogeno aviarno influenco
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/24 de la Comisión de 13 de enero de
    2021 por el que se modifica el anexo I del Reglamento (CE) n.o 798/2008 en lo
    que respecta a la entrada correspondiente al Reino Unido en la lista de terceros
    países, territorios, zonas o compartimentos desde los cuales están permitidos
    la importación en la Unión y el tránsito por esta de determinadas mercancías
    de aves de corral, en relación con la influenza aviar de alta patogenicidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/24 av den 13 januari 2021
    om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Förenade kungariket i förteckningen över tredjeländer, områden, zoner
    eller delområden från vilka vissa varor av fjäderfä får importeras till eller
    transiteras genom unionen, i samband med högpatogen aviär influensa
