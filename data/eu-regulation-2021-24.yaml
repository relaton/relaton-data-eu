    υψηλής παθογονικότητας γρίπη των πτηνών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/24, 13. jaanuar 2021, millega muudetakse
    seoses lindude kõrge patogeensusega gripiga määruse (EÜ) nr 798/2008 I lisas
    Ühendkuningriiki käsitlevat kannet selliste kolmandate riikide, territooriumide,
