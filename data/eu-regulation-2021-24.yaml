title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/24 of 13 January 2021 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the United Kingdom
    in the list of third countries, territories, zones or compartments from which
    certain poultry commodities may be imported into and transit through the Union
    in relation to highly pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/24 de la Commission du 13 janvier 2021
    modifiant l’annexe I du règlement (CE) no 798/2008 en ce qui concerne les mentions
    relatives au Royaume-Uni sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l’Union et transiter par celle-ci, pour ce qui est de l’influenza aviaire
    hautement pathogène
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/24 der Kommission vom 13. Januar 2021
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des
    Eintrags für das Vereinigte Königreich in der Liste der Drittländer, Gebiete,
    Zonen und Kompartimente, aus denen bestimmte Geflügelwaren in die Union eingeführt
    bzw. durch die Union durchgeführt werden dürfen, in Bezug auf die hochpathogene
    Aviäre Influenza
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/24 на Комисията
    от 13 януари 2021 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписването
    за Обединеното кралство в списъка на третите
    държави, територии, зони или компартменти,
    от които са разрешени вносът и транзитът през
    Съюза на някои стоки от домашни птици, във връзка
    с високопатогенната инфлуенца по птиците
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/24, ze dne 13. ledna 2021, kterým
    se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku týkající
    se Spojeného království na seznamu třetích zemí, území, oblastí nebo
    jednotek, z nichž lze do Unie dovážet a přes její území přepravovat určité
    drůbeží komodity, v souvislosti s vysoce patogenní influenzou ptáků
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/24 af 13. januar 2021
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    vedrørende Det Forenede Kongerige på listen over tredjelande, områder, zoner
    og segmenter, hvorfra visse fjerkræprodukter kan importeres til og sendes i transit
    gennem Unionen, i forbindelse med højpatogen aviær influenza
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/24 της Επιτροπής
