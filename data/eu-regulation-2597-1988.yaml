    bestimmte Mitgliedstaaten und Qualitäten und zur Festsetzung der Ankaufspreise
    für Rindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2597/88 af 19. august 1988 om ændring
