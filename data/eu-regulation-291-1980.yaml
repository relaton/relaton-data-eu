  content: Council Regulation (EEC) No 291/80 of 5 February 1980 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Sweden
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 291/80 du Conseil, du 5 février 1980, fixant certaines
