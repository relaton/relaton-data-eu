title:
- language: en
  script: Latn
  content: Regulation (EEC) 195/75 of the Council of 22 January 1975 opening, allocating
    and administering a Community tariff quota for ferro-chromium, containing not
    less than 4 % by weight of carbon, falling within subheading ex 73.02 E I of the
    Common Customs Tariff and extending the benefit of this quota to certain imports
    of ferro-chromium, containing a quantity of between 3 and 4 % by weight of carbon
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 195/75 du Conseil, du 22 janvier 1975, portant ouverture,
    répartition et mode de gestion d'un contingent tarifaire communautaire de ferrochrome
    contenant en poids 4 % ou plus de carbone de la sous- position EX 73.02 E I du
    tarif douanier commun et étendant le bénéfice de ce contingent à certaines
    importations de ferrochrome contenant en poids une quantité de carbone comprise
    entre 3 et 4 %
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 195/75 des Rates vom 22. Januar 1975 über die Eröffnung,
    Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für Ferrochrom mit
    einem Gehalt an Kohlenstoff von 4 Gewichtshundertteilen oder mehr der Tarifstelle
    ex 73.02 E I des Gemeinsamen Zolltarifs und über die Ausdehnung dieses Kontingents
    auf bestimmte Ferrochrom-Importe mit einem Gehalt an Kohlenstoff von 3 bis 4 Gewichtshundertteilen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 195/75 af 22. januar 1975 om åbning, fordeling
    og forvaltning af et fællesskabstoldkontingent for ferrochrom indeholdende mindst
    4 vægtprocent kulstof, henhørende under pos. ex 73.02 E I i den fælles toldtarif,
    og om udvidelse af dette kontingent til ligeledes at omfatte visse indførsler
    af ferrochrom indeholdende mellem 3 og 4 vægtprocent kulstof
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 195/75 del Consiglio, del 22 gennaio 1975, relativo
    all'apertura, alla ripartizione ed alle modalità di gestione di un contingente
    tariffario comunitario di ferro-cromo contenente, in peso, il 4 % o più di carbonio,
    della sottovoce ex 73.02 E I della tariffa doganale comune che estende il beneficio
    di tale contingente a talune importazioni di ferro-cromo contenente, in peso,
    una quantità di carbonio compresa fra il 3 e il 4 %
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 195/75 van de Raad van 22 januari 1975 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor ferrochroom, bevattende 4 of meer gewichtspercenten koolstof, van onderverdeling
    ex 73.02 E I van het gemeenschappelijk douanetarief, en de uitbreiding van dit
    contingent tot bepaalde invoer van ferrochroom, bevattende tussen 3 en 4 gewichtspercenten
    koolstof
  type: main
