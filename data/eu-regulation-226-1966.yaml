  content: Règlement n° 226/66/CEE du Conseil, du 22 décembre 1966, autorisant
    la République française à diminuer le montant fixé du prélèvement applicable
    à l'importation des laits spéciaux dits "pour nourrissons"
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 226/66/EWG des Rates vom 22. Dezember 1966 zur Ermächtigung
    der Französischen Republik, bei der Einfuhr von Milch zur Ernährung von Säuglingen
    den festen Teilbetrag der Abschöpfung zu senken
  type: main
- language: it
  script: Latn
  content: Regolamento n. 226/66/CEE del Consiglio, del 22 dicembre 1966, che autorizza
    la Repubblica francese a diminuire l'ammontare fisso del prelievo applicabile
    all'importazione di alcuni tipi speciali di latte detti per «l'alimentazione
    dei lattanti»
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 226/66/EEG van de Raad van 22 december 1966 waarbij de
    Franse Republiek wordt gemachtigd tot verlaging van het vaste bedrag van de heffing
    bij de invoer van bijzondere melk voor zuigelingen
