title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3908/92 of 19 December 1992 fixing, for 1993,
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of Portugal in waters falling under the sovereignty
    or within the jurisdiction of Member States, apart from Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3908/92 du Conseil, du 19 décembre 1992, fixant,
    pour l' année 1993, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon du Portugal dans les eaux relevant
    de la souveraineté ou de la juridiction d' un Etat membre, à l' exception de
    l' Espagne et du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3908/92 des Rates vom 19. Dezember 1992 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für Schiffe unter portugiesischer Flagge in den Gewässern unter der Hoheitsgewalt
    oder der Gerichtsbarkeit eines Mitgliedstaats mit Ausnahme Spaniens und Portugals
    für 1993
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3908/92 af 19. december 1992 om fastsættelse
    for 1993 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører portugisisk flag, i de farvande,
    der henhører under medlemsstaternes højhedsområde eller jurisdiktion, med undtagelse
    af spanske og portugisiske farvande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3908/92 του Συμβουλίου
    της 19ης Δεκεμβρίου 1992 για τον καθορισμό, για
    το 1993, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με πορτογαλική σημαία, στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    ενός κράτους μέλους, εξαιρέσει της Ισπανίας
    και της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3908/92 del Consiglio, del 19 dicembre 1992, che fissa,
    per il 1993, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera del Portogallo nelle acque soggette alla
    sovranità o alla giurisdizione di un Stato membro, esclusi la Spagna e il Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3908/92 van de Raad van 19 december 1992 tot vaststelling,
    voor 1993, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op de vlag van Portugal voerende vaartuigen,
    in de wateren die onder de soevereiniteit of de jurisdictie van een Lid-Staat
    vallen, met uitzondering van Spanje en Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3908/92 do Conselho, de 19 de Dezembro de 1992, que
    fixa, para 1993, certas medidas de conservação e de gestão dos recursos de
    pesca aplicáveis aos navios arvorando pavilhão de Portugal nas águas sob soberania
    ou jurisdição de um Estado-membro, com excepção de Espanha e de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3908/92 del Consejo, de 19 de diciembre de 1992, por
    el que se fijan, para el año 1993, determinadas medidas de conservación y de
    gestión de los recursos pesqueros aplicables a los buques bajo pabellón de Portugal
    en las aguas de soberanía o de jurisdicción de un Estado miembro, excepto España
    y Portugal
  type: main
