    Virgine Britanice pe lista țărilor terțe cu un grad ridicat de risc care au
    formulat în scris un angajament politic la nivel înalt de a remedia deficiențele
    identificate și au elaborat un plan de acțiune cu GAFI, precum și pentru a
    elimina Burkina Faso, Mali, Mozambic, Nigeria, Africa de Sud și Tanzania de pe
