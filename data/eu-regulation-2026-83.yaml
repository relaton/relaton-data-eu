    didelės rizikos trečiųjų valstybių, kurios pateikė rašytinį aukšto lygio
    politinį įsipareigojimą pašalinti nustatytus trūkumus ir kartu su FATF parengė
    veiksmų planą, sąrašą ir dėl Burkina Faso, Malio, Mozambiko, Nigerijos,
