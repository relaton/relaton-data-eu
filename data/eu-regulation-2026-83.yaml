title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/83 of 4 December 2025 amending
    Delegated Regulation (EU) 2016/1675 to add Bolivia and the British Virgin Islands
    to the list of high-risk third countries which have provided a written high-level
    political commitment to address the identified deficiencies and have developed
    an action plan with the FATF, and to remove Burkina Faso, Mali, Mozambique, Nigeria,
    South Africa and Tanzania from that list
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/83 de la Commission du 4 décembre 2025
    modifiant le règlement délégué (UE) 2016/1675 par l’ajout de la Bolivie
    et des Îles Vierges britanniques à la liste des pays tiers à haut risque qui
    ont pris un engagement écrit à haut niveau de remédier aux carences constatées
    et qui ont élaboré un plan d’action avec le GAFI, et par le retrait de cette
    liste de l’Afrique du Sud, du Burkina Faso, du Mali, du Mozambique, du Nigeria
    et de la Tanzanie
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2026/83 der Kommission vom 4. Dezember 2025
    zur Änderung der Delegierten Verordnung (EU) 2016/1675 zwecks Aufnahme Boliviens
    und der Britischen Jungferninseln in die Liste der Drittländer mit hohem Risiko,
    die sich schriftlich auf hoher politischer Ebene dazu verpflichtet haben, die
    festgestellten Mängel anzugehen, und mit der FATF einen Aktionsplan erarbeitet
    haben, und zwecks Streichung von Burkina Faso, Mali, Mosambik, Nigeria, Südafrika
    und Tansania aus dieser Liste
  type: main
- language: bg
