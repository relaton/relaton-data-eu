    teritoriju iekļautu to augsta riska trešo valstu sarakstā, kuras rakstveidā
    paudušas augsta līmeņa politisku apņemšanos novērst konstatētās nepilnības
    un sadarbībā ar FATF sagatavojušas rīcības plānu, un lai no minētā saraksta
    svītrotu Burkinafaso, Mali, Mozambiku, Nigēriju, Dienvidāfriku un Tanzāniju
  type: main
