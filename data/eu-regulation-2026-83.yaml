    Brit Virgin-szigeteknek a kiemelt kockázatot jelentő, a feltárt hiányosságok
    kezelésére írásos magas szintű politikai kötelezettségvállalást tett
    harmadik országokat tartalmazó jegyzékbe való felvétele, valamint Burkina
    Fasónak, Malinak, Mozambiknak, Nigériának, a Dél-afrikai Köztársaságnak
    és Tanzániának az említett jegyzékből való törlése céljából történő
    módosításáról
  type: main
