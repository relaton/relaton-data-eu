  content: Regolamento delegato (UE) 2026/83 della Commissione, del 4 dicembre 2025,
    che modifica il regolamento delegato (UE) 2016/1675 per aggiungere Bolivia e Isole
    Vergini britanniche all’elenco dei paesi terzi ad alto rischio che hanno preso
    per iscritto un impegno politico ad alto livello a rimediare alle carenze individuate
    e che hanno elaborato con il GAFI un piano d’azione e per depennare Burkina
    Faso, Mali, Mozambico, Nigeria, Sud Africa e Tanzania
  type: main
- language: lv
