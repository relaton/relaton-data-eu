    Otoka na popis visokorizičnih trećih zemalja koje su u pisanom obliku iskazale
    visoku razinu političke spremnosti za uklanjanje utvrđenih nedostataka i koje
    su izradile financijski plan s FATF-om te radi uklanjanja Burkine Fasa, Malija,
    Mozambika, Nigerije, Južne Afrike i Tanzanije s tog popisa
  type: main
