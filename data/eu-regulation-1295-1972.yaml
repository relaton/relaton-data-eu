title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1295/72 of the Commission of 22 June 1972 amending,
    in respect of Turkey, Regulation (EEC) No 1054/68 determining the list of agencies
    certifying the admissibility to certain tariff headings of certain milk products
    from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1295/72 de la Commission, du 22 juin 1972, complétant,
    en ce qui concerne la Turquie, le règlement (CEE)" n° 1054/68 établissant la
    liste des organismes émetteurs de certificats destinés à permettre l' admission
    de certains produits laitiers en provenance des pays tiers dans certaines positions
    tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1295/72 der Kommission vom 22. Juni 1972 zur Ergänzung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Stellen für die Erteilung
    von Bescheinigungen für die Zulassung bestimmter Milcherzeugnisse aus dritten
    Ländern zu bestimmten Tarifnummern in bezug auf die Türkei
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1295/72 af 22. juni 1972 om tillæg,
    der vedrører Tyrkiet, til forordning (EØF) nr. 1054/68 om oprettelse af en fortegnelse
    over de organer, der er kompetente til at udstede certifikater vedrørende visse
    fra tredjelande indførte mejeriprodukters henførsel under bestemte toldpositioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1295/72 τής Επιτροπής
    τής 22ας Ιουνίου 1972 περί συμπληρώσεως, όσον
    αφορά τήν Τουρκία, τού κανονισμού (ΕΟΚ) αριθ.
    1054/68 «περί καταρτίσεως τού καταλόγου τών οργανισμών
    εκδόσεως τών πιστοποιητικών, τά οποία επιτρέπουν
    τήν υπαγωγή ορισμένων γαλακτοκομικών προϊόντων,
    προελεύσεως τρίτων χωρών, σέ ορισμένες δασμολογικές
    κλάσεις»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1295/72 della Commissione, del 22 giugno 1972, che
    completa, per quanto riguarda la Turchia, il regolamento (CEE) n. 1054/68 che
    stabilisce l' elenco degli organismi emittenti dei certificati destinati a permettere
    l' ammissione in alcune voci tariffarie di taluni prodotti lattiero-caseari in
    provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1295/72 van de Commissie van 22 juni 1972 ter aanvulling,
    met betrekking tot Turkije, van Verordening (EEG) nr. 1054/68 houdende vaststelling
    van de lijst van organisaties voor de afgifte van certificaten ten behoeve van
    de indeling van sommige zuivelprodukten uit derde landen onder bepaalde tariefposten
  type: main
