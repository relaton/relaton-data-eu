id: EUDecision1994186
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 30 March 1994 amending for the third time Decision
    92/571/EEC relating to new transitional measures which are necessary to facilitate
    the move to the system of veterinary checks provided for in Council Directive
    90/675/EEC
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 30 mars 1994 modifiant pour la troisième
    fois la décision 92/571/CEE relative à de nouvelles mesures transitoires nécessaires
    pour faciliter le passage au nouveau régime de contrôle prévu par la directive
    90/675/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 30. März 1994 zur dritten Änderung der
    Entscheidung 92/571/EWG über neue Überleitungsmaßnahmen zur Erleichterung des
    Übergangs zu der in der Richtlinie 90/675/EWG des Rates vorgesehenen Veterinärkontrollregelung
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 30. marts 1994 om tredje ændring af beslutning
    92/571/EØF om nye overgangsforanstaltninger, der kræves for at lette overgangen
    til veterinærkontrolordningen efter direktiv 90/675/EØF
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 30ής Μαρτίου 1994
    που τροποποιεί για τρίτη φορά την απόφαση 92/571/ΕΟΚ
    σχετικά με νέα μεταβατικά μέτρα που είναι αναγκαία
    για να διευκολυνθεί η μετάβαση στο καθεστώς
    κτηνιατρικών ελέγχων, το οποίο προβλέπεται
    στην οδηγία 90/675/ΕΟΚ του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 30 marzo 1994 che modifica per la terza
    volta la decisione 92/571/CEE recante nuove misure transitorie per agevolare il
    passaggio al regime di controllo veterinario previsto dalla direttiva 90/675/CEE
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 30 maart 1994 tot derde wijziging van
    Beschikking 92/571/EEG inzake nieuwe overgangsmaatregelen om de overgang naar
    de bij Richtlijn 90/675/EEG van de Raad vastgestelde regeling inzake veterinaire
    controles te vergemakkelijken
  type: main
- language: pt
  script: Latn
  content: DECISÃO DA COMISSÃO de 30 de Março de 1994 que altera, pela terceira
    vez, a Decisão 92/571/CEE relativa a novas medidas transitórias necessárias
    para facilitar a passagem para o regime de controlo veterinário previsto pela
    Directiva 90/675/CEE do Conselho
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 30 de marzo de 1994 que modifica por tercera
    vez la Decisión 92/571/CEE por la que se establecen nuevas medidas transitorias
    para facilitar el paso al sistema de controles veterinarios dispuesto en la Directiva
    90/675/CEE del Consejo
  type: main
