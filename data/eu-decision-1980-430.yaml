title:
- language: en
  script: Latn
  content: '80/430/EEC: Commission Decision of 31 March 1980 on the reimbursement
    by the Guidance Section of the EAGGF to the United Kingdom of expenditure incurred
    during 1978 and additional expenditure declared for 1975 on aids for the less-favoured
    farming areas (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/430/CEE: Décision de la Commission, du 31 mars 1980, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole (FEOGA), section
    "orientation", au Royaume-Uni des dépenses effectuées pendant l''année 1978
    et des dépenses supplémentaires déclarées au titre de l''année 1975 pour
    les aides en faveur des zones agricoles défavorisées (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/430/EWG: Entscheidung der Kommission vom 31. März 1980 über die Rückvergütung
    durch den EAGFL, Abteilung Ausrichtung, der im Jahr 1978 in benachteiligten landwirtschaftlichen
    Gebieten gewährten und zusätzlich für 1975 nachgemeldeten Hilfen an das Vereinigte
    Königreich (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/430/EØF: Kommissionens beslutning af 31. marts 1980 om refusion gennem
    EUGFL, udviklingssektionen, til Det forenede Kongerige af de udgifter, som er
    afholdt i løbet af året 1978, samt yderligere udgifter opgivet for 1975, til
    støtte til ugunstigt stillede landbrugsområder (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/430/CEE: Decisione della Commissione, del 31 marzo 1980, relativa al
    rimborso da parte del FEAOG, sezione orientamento, al Regno Unito delle spese
    effettuate nel 1978 e di un''ulteriore spesa relativa al 1975 per gli aiuti in
    favore delle zone agricole svantaggiate (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/430/EEG: Beschikking van de Commissie van 31 maart 1980 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Verenigd Koninkrijk van
    de in 1978 verrichte uitgaven en van aanvullende uitgaven voor 1975 voor steun
