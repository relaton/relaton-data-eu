---
id: EUDecision2005848
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision 2005/848/EC of 29 November 2005 implementing Article 2(3)
    of Regulation (EC) No 2580/2001 on specific restrictive measures directed against
    certain persons and entities with a view to combating terrorism and repealing
    Decision 2005/722/EC
  type: main
- language: fr
  script: Latn
  content: Décision 2005/848/CE du Conseil du 29 novembre 2005 mettant en œuvre
    l'article 2, paragraphe 3, du règlement (CE) n o 2580/2001 concernant l'adoption
    de mesures restrictives spécifiques à l'encontre de certaines personnes et entités
    dans le cadre de la lutte contre le terrorisme, et abrogeant la décision 2005/722/CE
  type: main
- language: de
  script: Latn
  content: Beschluss 2005/848/EG des Rates vom 29. November 2005 zur Durchführung
    von Artikel 2 Absatz 3 der Verordnung (EG) Nr. 2580/2001 über spezifische, gegen
    bestimmte Personen und Organisationen gerichtete restriktive Maßnahmen zur Bekämpfung
    des Terrorismus und zur Aufhebung des Beschlusses 2005/722/EG
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2005/848/ES ze dne 29. listopadu 2005 , kterým se provádí
    čl. 2 odst. 3 nařízení (ES) č. 2580/2001 o zvláštních omezujících opatřeních
    namířených proti některým osobám a subjektům s cílem bojovat proti terorismu
    a kterým se zrušuje rozhodnutí 2005/722/ES
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2005/848/EF af 29. november 2005 om gennemførelse af
    artikel 2, stk. 3, i forordning (EF) nr. 2580/2001 om specifikke restriktive foranstaltninger
    mod visse personer og enheder med henblik på at bekæmpe terrorisme, og om ophævelse
    af afgørelse 2005/722/EF
  type: main
- language: el
  script: Grek
  content: Απόφαση 2005/848/ΕΚ του Συμβουλίου, της 29ης
    Νοεμβρίου 2005 , για την εφαρμογή του άρθρου 2,
    παράγραφος 3, του κανονισμού (ΕΚ) αριθ. 2580/2001
    για τη λήψη ειδικών περιοριστικών μέτρων κατά
    ορισμένων προσώπων και οντοτήτων με σκοπό
    την καταπολέμηση της τρομοκρατίας, και για
    την κατάργηση της απόφασης 2005/722/ΕΚ
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2005/848/EÜ, 29. november 2005 , millega rakendatakse määruse
    (EÜ) nr 2580/2001 teatavate isikute ja üksuste vastu suunatud eripiirangute
    kohta terrorismivastaseks võitluseks artikli 2 lõiget 3 ja tunnistatakse kehtetuks
    otsus 2005/722/EÜ
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2005/848/EY, tehty 29 päivänä marraskuuta 2005 ,
    tiettyihin henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista
    toimenpiteistä terrorismin torjumiseksi annetun asetuksen (EY) N:o 2580/2001
    2 artiklan 3 kohdan täytäntöönpanosta ja päätöksen 2005/722/YUTP kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2005/848/EK határozata ( 2005. november 29. ) a terrorizmus
    elleni küzdelem érdekében egyes személyekkel és szervezetekkel szemben hozott
    különleges korlátozó intézkedésekről szóló 2580/2001/EK rendelet 2. cikke
    (3) bekezdésének végrehajtásáról, és a 2005/722/EK határozat hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione 2005/848/CE del Consiglio, del 29 novembre 2005 , che attua l'articolo
    2, paragrafo 3 del regolamento (CE) n. 2580/2001 relativo a misure restrittive
    specifiche, contro determinate persone e entità, destinate a combattere il terrorismo,
    e che abroga la decisione 2005/722/CE
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2005/848/EK ( 2005. gada 29. novembris ), ar kuru īsteno
    2. panta 3. punktu Regulā (EK) Nr. 2580/2001 par īpašiem ierobežojošiem pasākumiem,
    kas terorisma apkarošanas nolūkā vērsti pret konkrētām personām un organizācijām,
    un ar kuru atceļ Lēmumu 2005/722/EK
  type: main
- language: lt
  script: Latn
  content: 2005 m. lapkričio 29 d. Tarybos sprendimas 2005/848/EB, įgyvendinantis
    Reglamento (EB) Nr. 2580/2001 dėl specialių ribojančių priemonių, taikomų
    tam tikriems asmenims ir subjektams siekiant kovoti su terorizmu, 2 straipsnio
    3 dalį ir panaikinantis Sprendimą 2005/722/EB
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2005/848/KE tad- 29 ta’ Novembru 2005 li timplimenta
    l-Artikolu 2(3) tar-Regolament (KE) Nru 2580/2001 dwar miżuri restrittivi speċifiċi
    diretti kontra ċerti persuni u entitajiet bil-għan li jiġi miġġieled it-terroriżmu,
    u li tħassar id-Deċiżjoni 2005/722/PESK
  type: main
- language: nl
  script: Latn
  content: Besluit 2005/848/EG van de Raad van 29 november 2005 tot uitvoering van
    artikel 2, lid 3, van Verordening (EG) nr. 2580/2001 inzake specifieke beperkende
    maatregelen tegen bepaalde personen en entiteiten met het oog op de strijd tegen
    het terrorisme, en tot intrekking van Besluit 2005/722/GBVB
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2005/848/WE z dnia 29 listopada 2005 r. wykonująca art. 2
    ust. 3 rozporządzenia (WE) nr 2580/2001 w sprawie szczególnych środków ograniczających
    skierowanych przeciwko niektórym osobom i podmiotom mających na celu zwalczanie
    terroryzmu i uchylająca decyzję 2005/722/WE
  type: main
- language: pt
  script: Latn
  content: Decisão 2005/848/CE do Conselho, de 29 de Novembro de 2005 , que dá execução
    ao n. o 3 do artigo 2. o do Regulamento (CE) n. o 2580/2001 relativo a medidas
    restritivas específicas de combate ao terrorismo dirigidas contra determinadas
    pessoas e entidades e que revoga a Decisão 2005/722/CE
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2005/848/ES z 29. novembra 2005 , ktorým sa vykonáva
    článok 2 ods. 3 nariadenia (ES) č. 2580/2001 o určitých obmedzujúcich opatreniach
    zameraných proti určitým osobám a subjektom za účelom boja proti terorizmu,
    a ktorým sa zrušuje rozhodnutie 2005/722/ES
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2005/848/EC z dne 29. novembra 2005 o izvajanju člena 2(3)
    Uredbe (ES) št. 2580/2001 o posebnih omejevalnih ukrepih za nekatere osebe in
    subjekte zaradi boja proti terorizmu in o razveljavitvi Sklepa 2005/722/SZVP
  type: main
- language: es
  script: Latn
  content: Decisión 2005/848/CE del Consejo, de 29 de noviembre de 2005 , relativa
    a la aplicación del apartado 3 del artículo 2 del Reglamento (CE) n o 2580/2001
    sobre medidas restrictivas específicas dirigidas a determinadas personas y entidades
    con el fin de luchar contra el terrorismo y por la que se deroga la Decisión
    2005/722/CE
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2005/848/EG av den 29 november 2005 om genomförande av
    artikel 2.3 i förordning (EG) nr 2580/2001 om särskilda restriktiva åtgärder
    mot vissa personer och enheter i syfte att bekämpa terrorism och om upphävande
    av beslut 2005/722/EG
