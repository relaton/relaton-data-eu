title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2022/2421 of 5 December 2022 on the consistency
    of the performance targets contained in the revised draft performance plan submitted
    by Greece pursuant to Regulation (EC) No 549/2004 of the European Parliament and
    of the Council with the Union-wide performance targets for the third reference
    period (notified under document C(2022) 8733) (Only the Greek text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2421 de la Commission du 5 décembre 2022 concernant
    la compatibilité des objectifs de performance contenus dans le projet de plan
    de performance révisé présenté par la Grèce en application du règlement
    (CE) no 549/2004 du Parlement européen et du Conseil avec les objectifs de performance
    à l’échelle de l’Union pour la troisième période de référence [notifiée
    sous le numéro C(2022) 8733] (Le texte en langue grecque est le seul faisant
    foi.)
  type: main
