    og -lofter for visse landbrugs- og industrivarer med oprindelse i Rumænien og
    Bulgarien (1994) og forordning (EF) nr. 1798/94 om åbning og forvaltning af fællesskabstoldkontingenter
    for visse landbrugsvarer med oprindelse i Bulgarien, Ungarn, Polen, Rumænien,
    Slovakiet og Tjekkiet og om retningslinjer for tilpasning af disse kontingenter
    (1994/1997)
  type: main
