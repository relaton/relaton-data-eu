    und Gemeinschaftszollplafonds für bestimmte landwirtschaftliche und gewerbliche
    Waren mit Ursprung in Rumänien und Bulgarien (1994) sowie der Verordnung (EG)
    Nr. 1798/94 zur Eröffnung und Verwaltung von Gemeinschaftszollkontingenten für
    bestimmte landwirtschaftliche Erzeugnisse mit Ursprung in Bulgarien, Ungarn, Polen,
    Rumänien, der Slowakei und der Tschechischen Republik sowie zur Einführung eines
    Verfahrens für die Anpassung dieser Zollkontingente (1994-1997)
  type: main
