title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2485/94 of 10 October 1994 amending Regulation
    (EC) No 314/94 opening and providing for the administration of Community tariff
    quotas and ceilings for certain agricultural and industrial products originating
    in Romania and Bulgaria (1994) and Regulation (EEC) No 1798/84 opening and providing
    for the administration of Community tariff quotas for certain agricultural products
    originating in Bulgaria, the Czech Republic, Hungary, Poland, Romania and Slovakia
    and establishing detailed provisions for adapting these quotas (1994 to 1997)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2485/94 du Conseil du 10 octobre 1994 modifiant le
    règlement (CE) n° 314/94 portant ouverture et mode de gestion de contingents
    et de plafonds tarifaires communautaires pour certains produits agricoles et industriels
    originaires de Roumanie et de Bulgarie (1994), et le règlement (CE) n° 1798/94
    portant ouverture et mode de gestion de contingents tarifaires communautaires
    pour certains produits agricoles, originaires de Hongrie, de Pologne, de la République
    tchèque, de Slovaquie, de Roumanie et de Bulgarie, ainsi que les modalités d'adaptation
    desdits contingents (1994-1997)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2485/94 des Rates vom 10. Oktober 1994 zur Änderung
