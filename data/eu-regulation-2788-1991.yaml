title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2788/91 of 23 September 1991 re-establishing
    the levying of customs duties on products falling within CN code 9403 80 00, originating
    in the Philippines, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2788/91 DE LA COMMISSION du 23 septembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 9403 80 00 originaires des Philippines, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2788/91 DER KOMMISSION vom 23. September 1991 zur
    Wiedereinführung der Erhebung der Zölle für die Waren des KN-Codes 9403 80
    00 mit Ursprung auf den Philippinen, denen die in der Verordnung (EWG) Nr. 3831/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2788/91 af 23. september 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 9403 80 00 og med oprindelse
    i Filippinerne, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2788/91 της Επιτροπής
    της 23ης Σεπτεμβρίου 1991 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για τα προϊόντα
    του κωδικού ΣΟ 9403 80 00, καταγωγής Φιλιππίνων,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2788/91 DELLA COMMISSIONE del 23 settembre 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 9403 80 00 originari delle Filippine beneficiarie delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2788/91 VAN DE COMMISSIE van 23 september 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 9403 80 00, van oorsprong uit de Filippijnen, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2788/91 DA COMISSÃO de 23 de Setembro de 1991 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a os produtos do código
    NC 9403 80 00, originários das Filipinas, beneficiários das preferências pautais
    previstas pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2788/91 DE LA COMISIÓN de 23 de septiembre de 1991
    relativo al restablecimiento de la percepción de los derechos de aduana aplicables
    a los productos del código NC 9403 80 00, originarios de Filipinas, beneficiarios
    de las preferencias arancelarias previstas por el Reglamento (CEE) no 3831/90
    del Consejo #'
