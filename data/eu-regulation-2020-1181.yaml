    i Rady (WE) nr 595/2009 w odniesieniu do określania emisji CO2 i zużycia paliwa
    przez pojazdy ciężkie i zmieniającego dyrektywę Parlamentu Europejskiego i
    Rady 2007/46/WE oraz rozporządzenie Komisji (UE) nr 582/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2020/1181 da Comissão de 7 de agosto de 2020 que retifica
    determinadas versões linguísticas da Diretiva 2007/46/CE do Parlamento Europeu
    e do Conselho que estabelece um quadro para a homologação dos veículos a motor
    e seus reboques, e dos sistemas, componentes e unidades técnicas destinados a
    sere utilizados nesses veículos (Diretiva-Quadro), que retifica determinadas
    versões linguísticas do Regulamento (UE) n.o 582/2011 da Comissão que dá aplicação
    e altera o Regulamento (CE) n.o 595/2009 do Parlamento Europeu e do Conselho no
    que se refere às emissões dos veículos pesados (Euro VI) e que altera os anexos
    I e III da Diretiva 2007/46/CE do Parlamento Europeu e do Conselho, e retifica
    a versão em língua dinamarquesa do Regulamento (UE) 2017/2400 da Comissão que
    dá execução ao Regulamento (CE) n.o 595/2009 do Parlamento Europeu e do Conselho
    no que respeita à determinação das emissões de CO2 e ao consumo de combustível
    dos veículos pesados e altera a Diretiva 2007/46/CE do Parlamento Europeu e do
    Conselho e o Regulamento (UE) n.o 582/2011 do Conselho e da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2020/1181 al Comisiei din 7 august 2020 de rectificare
    a anumitor versiuni lingvistice ale Directivei 2007/46/CE a Parlamentului European
    și a Consiliului de stabilire a unui cadru pentru omologarea autovehiculelor
    și remorcilor acestora, precum și a sistemelor, componentelor și unităților
    tehnice separate destinate vehiculelor respective (Directivă-cadru), de rectificare
    a anumitor versiuni lingvistice ale Regulamentului (UE) nr. 582/2011 al Comisiei
    de punere în aplicare și de modificare a Regulamentului (CE) nr. 595/2009 al
    Parlamentului European și al Consiliului cu privire la emisiile provenite de
    la vehicule grele (Euro VI) și de modificare a anexelor I și III la Directiva
    2007/46/CE a Parlamentului European și a Consiliului, de rectificare a versiunii
    în limba daneză a Regulamentului (UE) 2017/2400 al Comisiei de punere în aplicare
    a Regulamentului (CE) nr. 595/2009 al Parlamentului European și al Consiliului
    în ceea ce privește determinarea emisiilor de CO2 și a consumului de combustibil
    ale vehiculelor grele și de modificare a Directivei 2007/46/CE a Parlamentului
    European și a Consiliului și a Regulamentului (UE) nr. 582/2011 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2020/1181 zo 7. augusta 2020, ktorým sa opravujú
    niektoré jazykové znenia smernici Európskeho parlamentu a Rady 2007/46/ES,
    ktorou sa zriaďuje rámec pre typové schválenie motorových vozidiel a ich
    prípojných vozidiel, systémov, komponentov a samostatných technických jednotiek
    určených pre tieto vozidlá (rámcová smernica), opravujú niektoré jazykové
    znenia nariadenia Komisie (EÚ) č. 582/2011, ktorým sa vykonáva, mení a dopĺňa
    nariadenie Európskeho parlamentu a Rady (ES) č. 595/2009 vzhľadom na emisie
    z ťažkých úžitkových vozidiel (Euro VI) a ktorým sa menia a dopĺňajú
    prílohy I a III k smernici Európskeho parlamentu a Rady 2007/46/ES, a opravuje
    dánske znenie nariadenia Komisie (EÚ) 2017/2400, ktorým sa vykonáva nariadenie
    Európskeho parlamentu a Rady (ES) č. 595/2009, pokiaľ ide o určovanie emisií
    CO2 a spotreby paliva ťažkých úžitkových vozidiel a ktorým sa mení smernica
    Európskeho parlamentu a Rady 2007/46/ES a nariadenie Komisie (EÚ) č. 582/2011
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2020/1181 z dne 7. avgusta 2020 o popravku nekaterih
    jezikovnih različic Direktive 2007/46/ES Evropskega parlamenta in Sveta o vzpostavitvi
    okvira za odobritev motornih in priklopnih vozil ter sistemov, sestavnih delov
    in samostojnih tehničnih enot, namenjenih za taka vozila (Okvirna direktiva),
    o popravku nekaterih jezikovnih različic Uredbe Komisije (EU) št. 582/2011 o
    izvajanju in spremembi Uredbe (ES) št. 595/2009 Evropskega parlamenta in Sveta
    glede emisij iz težkih vozil (Euro VI) in o spremembi prilog I in III k Direktivi
    2007/46/ES Evropskega parlamenta in Sveta ter o popravku danske jezikovne različice
    Uredbe Komisije (EU) 2017/2400 o izvajanju Uredbe (ES) št. 595/2009 Evropskega
    parlamenta in Sveta glede določitve emisij CO2 in porabe goriva pri težkih vozilih
    ter o spremembi Direktive 2007/46/ES Evropskega parlamenta in Sveta in Uredbe
    Komisije (EU) št. 582/2011
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2020/1181 de la Comisión de 7 de agosto de 2020 que corrige
    determinadas versiones lingüísticas de la Directiva 2007/46/CE del Parlamento
    Europeo y del Consejo, por la que se crea un marco para la homologación de los
    vehículos de motor y de los remolques, sistemas, componentes y unidades técnicas
    independientes destinados a dichos vehículos (Directiva marco), que corrige determinadas
    versiones lingüísticas del Reglamento (UE) n.o 582/2011 de la Comisión, por
    el que se aplica y se modifica el Reglamento (CE) n.o 595/2009 del Parlamento
    Europeo y del Consejo en lo concerniente a las emisiones de los vehículos pesados
    (Euro VI) y por el que se modifican los anexos I y III de la Directiva 2007/46/CE
    del Parlamento Europeo y del Consejo, y que corrige la versión en lengua danesa
    del Reglamento (UE) 2017/2400 de la Comisión, por el que se desarrolla el Reglamento
    (CE) n.o 595/2009 del Parlamento Europeo y del Consejo en lo relativo a la determinación
    de las emisiones de CO2 y el consumo de combustible de los vehículos pesados,
    y por el que se modifican la Directiva 2007/46/CE del Parlamento Europeo y del
    Consejo y el Reglamento (UE) n.o 582/2011 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2020/1181 av den 7 augusti 2020 om rättelse
    av vissa språkversioner av Europaparlamentets och rådets direktiv 2007/46/EG
    om fastställande av en ram för godkännande av motorfordon och släpvagnar till
    dessa fordon samt av system, komponenter och separata tekniska enheter som är
    avsedda för sådana fordon (”Ramdirektiv”) och om rättelse av vissa språkversioner
    av kommissionens förordning (EU) nr 582/2011 om tillämpning och ändring av
    Europaparlamentets och rådets förordning (EG) nr 595/2009 vad gäller utsläpp
    från tunga fordon (Euro 6) och om ändring av bilagorna I och III till Europaparlamentets
    och rådets direktiv 2007/46/EG samt om rättelse av den danska språkversionen
    av kommissionens förordning (EU) 2017/2400 om genomförande av Europaparlamentets
    och rådets förordning (EG) nr 595/2009 vad gäller bestämning av tunga fordons
    koldioxidutsläpp och bränsleförbrukning och om ändring av Europaparlamentets
    och rådets direktiv 2007/46/EG och kommissionens förordning (EU) nr 582/2011
  type: main
