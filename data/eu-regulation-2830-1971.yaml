title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2830/71 of the Council of 24 December 1971 amending
    Regulation (EEC) No 1599/71 laying down additional conditions with which imported
    wines for direct human consumption have to comply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2830/71 du Conseil, du 24 décembre 1971, modifiant
    le règlement (CEE) n° 1599/71 fixant les conditions supplémentaires auxquelles
    doivent répondre les vins importés destinés à la consommation humaine directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2830/71 des Rates vom 24. Dezember 1971 zur Änderung
    der Verordnung (EWG) Nr. 1599/71 zur Festsetzung zusätzlicher Bedingungen, denen
    eingeführter Wein, der zum unmittelbaren menschlichen Verbrauch bestimmt ist,
    entsprechen muß
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2830/71 af 24. december 1971 om ændring
    af forordning (EØF) nr. 1599/71 om fastsættelse af yderligere betingelser, som
    indført vin, der er bestemt til direkte menneskeligt forbrug, skal opfylde
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2830/71 del Consiglio, del 24 dicembre 1971, che modifica
    il regolamento (CEE) n. 1599/71, che fissa le condizioni supplementari cui devono
    rispondere i vini importati destinati al consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2830/71 van de Raad van 24 december 1971 houdende
    wijziging van Verordening (EEG) nr. 1599/71 tot vaststelling van nadere voorwaarden
    waaraan ingevoerde wijn die is bestemd voor rechtstreekse menselijke consumptie,
    moet beantwoorden
  type: main
