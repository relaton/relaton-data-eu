title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 239/80 of 1 February 1980 on the sale at
    a price fixed in advance of boned beef and veal held by the Irish intervention
    agency and intended for export, and amending Regulation (EEC) No 1687/76, and
    repealing Regulation (EEC) No 2568/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 239/80 de la Commission, du 1er février 1980, relatif
    à la vente à prix fixé forfaitairement à l' avance de certaines viandes bovines
    désossées détenues par l' organisme d' intervention irlandais et destinées
    à être exportées, modifiant le règlement (CEE) n° 1687/76 et abrogeant le
    règlement (CEE) n° 2568/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 239/80 der Kommission vom 1. Februar 1980 über den
    Verkauf von zur Ausfuhr bestimmtem entbeintem Rindfleisch aus Beständen der irischen
    Interventionsstelle zu pauschal im voraus festgesetzten Preisen, zur Änderung
    der Verordnung (EWG) Nr. 1687/76 und zur Aufhebung der Verordnung (EWG) Nr. 2568/79
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 239/80 af 1. februar 1980 om salg til
    forudfastsat pris med henblik på udførsel af visse former for udbenet oksekød
    fra det irske interventionsorgan, om ændring af forordning (EØF) nr. 1687/76
    og om ophævelse af forordning (EØF) nr. 2568/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 239/80 della Commissione, del 1° febbraio 1980, relativo
    alla vendita, a prezzo fissato forfettariamente in anticipo, di talune carni bovine
    disossate dall' organismo d' intervento irlandese e destinate ad essere esportate,
    recante modifica del regolamento (CEE) n. 1687/76 e abrogazione del regolamento
    (CEE) n. 2568/79
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 239/80 van de Commissie van 1 februari 1980 betreffende
    de verkoop, tegen vooraf vastgestelde prijs, van bepaald voor uitvoer bestemd
    en door het Ierse interventiebureau opgeslagen rundvlees zonder been en houdende
    wijziging van Verordening (EEG) nr. 1687/76 en tot intrekking van Verordening
    (EEG) nr. 2568/79
  type: main
