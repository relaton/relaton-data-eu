  content: Règlement (CEE) n° 321/70 du Conseil, du 17 février 1970, portant rétablissement
    du droit de douane relatif à la soie grège (non moulinée), de la position 50.02
    du tarif douanier commun, et portant ouverture d'un contingent tarifaire communautaire
    pour le même produit
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 321/70 des Rates vom 17. Februar 1970 über die Wiedereinführung
    des Zollsatzes und die Eröffnung eines Gemeinschaftszollkontingents für Grège,
    weder gedreht noch gezwirnt, der Tarifnummer 50.02 des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 321/70 del Consiglio, del 17 febbraio 1970, relativo
    al ristabilimento del dazio doganale per la seta greggia (non torta), della voce
    50.02 della tariffa doganale comune, e all'apertura, per lo stesso prodotto, di
    un contingente tariffario comunitario
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 321/70 van de Raad van 17 februari 1970 betreffende
    de wederinstelling van het douanerecht voor ruwe zijde (haspelzijde of grège),
    niet gemoulineerd, van post 50.02 van het gemeenschappelijk douanetarief, en de
    opening van een communautair tariefcontingent voor dit produkt
  type: main
