title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2356/82 of 27 August 1982 re-establishing
    the levying of customs duties on footwear with outer soles and uppers of rubber
    or artificial plastic material, falling within heading No 64.01 and originating
    in Malaysia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2356/82 de la Commission, du 27 août 1982, portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    à semelles extérieures et dessus en caoutchouc ou en matière plastique artificielle,
    de la position 64.01 du tarif douanier commun, originaires de Malaisie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2356/82 der Kommission vom 27. August 1982 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe mit Laufsohlen und Oberteil aus Kautschuk
    oder Kunststoff der Tarifnummer 64.01, mit Ursprung in Malaysia, dem die in der
    Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt
    werdena
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2356/82 af 27. august 1982 om genindførelse
    af opkrævning af told for fodtøj med ydersål og overdel af gummi eller plast,
    henhørende under pos. 64.01 og med oprindelse i Malaysia, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2356/82 τής Επιτροπής
    τής 27ης Αυγούστου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά υποδήματα έχοντα
    τό εξωτερικόν πέλμα καί τό άνω μέρος αυτών
    εκ καουτσούκ ή εκ τεχνητής πλαστικής ύλης,
    τής κλάσεως 64. 01 τού Κοινού Δασμολογίου, καταγωγής
    Μαλαισίας, δικαιούχου τών προβλεπομένων από
    τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2356/82 della Commissione, del 27 agosto 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle calzature con suole
    esterne e tomaia di gomma o di materia plastica artificiale, della voce 64.01
    della tariffa doganale comune, originarie della Malaysia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2356/82 van de Commissie van 27 augustus 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel met
    buitenzool en bovendeel van rubber of van kunstmatige plastische stof van tariefpost
    64.01 van oorsprong uit Maleisië waarvoor de in Verordening (EEG) nr. 3601/81
    van de Raad vermelde tariefpreferenties zijn verleendr
  type: main
