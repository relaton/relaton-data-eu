title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1022/2004 of 26 May 2004 determining the
    extent to which applications lodged in May 2004 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1022/2004 de la Commission du 26 mai 2004 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en mai 2004 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords conclus par la Communauté avec la Bulgarie et
    la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1022/2004 der Kommission vom 26. Mai 2004 über die
    Festsetzung des Umfangs, in dem die im Mai 2004 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und Bulgarien und Rumänien genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1022/2004 ze dne 26. května 2004, kterým
    se stanoví, do jaké míry lze vyhovět žádostem o dovozní licence podaným
    v květnu 2004 pro některé produkty z vepřového masa v rámci režimu stanoveného
    dohodami uzavřenými mezi Společenstvím a Bulharskem a Rumunskem
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1022/2004 af 26. maj 2004 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i maj
    2004 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Bulgarien
    og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1022/2004 της Επιτροπής,
    της 26ης Μαΐου 2004, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Μάιο 2004 για πιστοποιητικά
    εισαγωγής χοιρείου κρέατος βάσει του καθεστώτος
    που προβλέπεται από τις συμφωνίες, τις οποίες
    συνήψε η Κοινότητα με τη Βουλγαρία και τη Ρουμανία
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1022/2004, 26. mai 2004, millega määratakse
    kindlaks, millises ulatuses võib heaks kiita 2004. aasta mais esitatud ühenduse
    ning Bulgaaria ja Rumeenia vahel sõlmitud lepingute kohased litsentsitaotlused
    teatavate sealihatoodete kohta
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1022/2004, annettu 26 päivänä toukokuuta 2004,
    yhteisön Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn
    järjestelmän mukaisesti toukokuussa 2004 jätettyjen tiettyjä sianlihavalmisteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1022/2004/EK rendelete (2004. május 26.) a Közösség és
    a Bulgária és Románia között létrejött megállapodásokban foglalt keretek
    között a sertéshúságazat egyes termékeire vonatkozó behozatali engedélyek
    iránt 2004. májusában benyújtott kérelmek elfogadhatósága mértékének
    meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1022/2004 della Commissione, del 26 maggio 2004, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di maggio 2004 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi conclusi tra la Comunità e
    la Bulgaria e la Romania
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1022/2004 (2004. gada 26. maijs), ar ko nosaka,
