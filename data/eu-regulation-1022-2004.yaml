    gada maijā attiecībā uz dažiem produktiem no cūkgaļas atbilstīgi režīmam,
    kas paredzēts nolīgumos, kurus Kopiena noslēgusi ar Bulgāriju un Rumāniju
  type: main
- language: lt
  script: Latn
  content: 2004 m. gegužės 26 d. Komisijos reglamentas (EB) Nr. 1022/2004 nustatantis
    sąlygas, kuriomis galima priimti importo licencijų prašymus, pateiktus 2004
    m. gegužės mėn. kai kuriems kiaulienos pagrindu pagamintiems produktams pagal
    režimą, numatytą susitarimuose tarp Bendrijos ir Bulgarijos ir Rumunijos
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1022/2004 van de Commissie van 26 mei 2004 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector varkensvlees, die in mei 2004 worden ingediend
    op grond van de regeling die is vastgesteld in de door de Gemeenschap gesloten
    overeenkomsten met Bulgarije en Roemenië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1022/2004 z dnia 26 maja 2004 r. określające
    zakres, w jakim mogą zostać przyjęte wnioski złożone w maiu 2004 r. o pozwolenia
    na przywóz niektórych produktów z wieprzowiny w systemie przewidzianym w umowach
    zawartych przez Wspólnotę z Bułgarią i Rumunią
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1022/2004 da Comissão, de 26 de Maio de 2004, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Maio de
    2004 ao abrigo do regime previsto nos acordos concluídos pela Comunidade com
    a Bulgária e a Roménia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1022/2004 z 26. mája 2004, ktorým sa určuje
    rozsah, v ktorom je možné prijať žiadosti o dovozné povolenia predložené
    v máji 2004 na niektoré produkty na báze bravčového mäsa v rámci režimu,
    ktorý určujú dohody, ktoré uzatvorilo spoločenstvo s Bulharskom a Rumunskom
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1022/2004 z dne 26. maja 2004 o določitvi obsega,
    v katerem se lahko sprejmejo zahtevki za uvozna dovoljenja, vloženi maja 2004,
    za nekatere proizvode iz prašičjega mesa v skladu z režimom, predvidenim v
    sporazumih, ki so bili sklenjeni med Skupnostjo ter Bolgarijo in Romunijo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1022/2004 de la Comisión, de 26 de mayo de 2004, por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de mayo de 2004 al amparo del régimen previsto en los Acuerdos celebrados
    entre la Comunidad y Bulgaria y Rumania
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1022/2004 av den 26 maj 2004 om fastställande
    av i vilken utsträckning ansökningar som lämnats in i maj 2004 om importlicenser
    för vissa grisköttsprodukter i enlighet med den ordning som fastställs i avtalen
    mellan gemenskapen samt Bulgarien och Rumänien kan godkännas
