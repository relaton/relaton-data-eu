title:
- language: en
  script: Latn
  content: '93/100/EEC: Commission Decision of 19 January 1993 amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorize
    imports of bovine animals, swine, and equidae, fresh meat and meat products and
    repealing Decisions 89/15/EEC and 90/135/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/100/CEE: Décision de la Commission, du 19 janvier 1993, modifiant
    la décision 79/542/CEE du Conseil établissant une liste des pays tiers en provenance
    desquels les Etats membres autorisent l''importation d''animaux des espèces bovine
    et porcine, d''équidés, de viandes fraîches et de produits à base de viande
    et abrogeant les décisions 89/15/CEE et 90/135/CEE'
  type: main
- language: de
  script: Latn
  content: '93/100/EWG: Entscheidung der Kommission vom 19. Januar 1993 zur Änderung
    der Entscheidung 79/542/EWG des Rates zur Aufstellung einer Liste von Drittländern,
    aus denen die Mitgliedstaaten die Einfuhr von Rindern, Schweinen und Einhufern
    sowie von frischem Fleisch und Fleischerzeugnissen zulassen, und zur Aufhebung
    der Entscheidungen 89/15/EWG und 90/135/EWG'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 19 януари 1993 година
    за изменение на Решение 79/542/ЕИО на Съвета относно
    съставяне на списък на трети страни, от които
    държавите-членки разрешават вноса на говеда,
    свине, копитни бозайници, пресни меса и месни
    продукти и за отмяна на Решения 89/15/ЕИО и 90/135/ЕИО
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 19. ledna 1993, kterým se mění rozhodnutí
    Rady 79/542/EHS, kterým se stanoví seznam třetích zemí, z nichž členské
    státy povolují dovoz skotu, prasat, koňovitých, čerstvého masa a masných
    výrobků, a kterým se zrušují rozhodnutí 89/15/EHS a 90/135/EHS
  type: main
- language: da
  script: Latn
  content: '93/100/EØF: Kommissionens beslutning af 19. januar 1993 om ændring af
    Rådets beslutning 79/542/EØF om opstilling af en liste over de tredjelande,
    hvorfra medlemsstaterne tillader indførsel af kvæg, svin og enhovede dyr samt
    fersk kød eller kødprodukter og om ophævelse af beslutning 89/15/EØF og 90/135/EØF'
  type: main
- language: el
  script: Grek
  content: '93/100/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Ιανουαρίου 1993 για τροποποίηση της απόφασης
    79/542/ΕΟΚ του Συμβουλίου περί καταρτίσεως ενός
    πίνακα τρίτων χωρών από τις οποίες τα κράτη
    μέλη επιτρέπουν τις εισαγωγές βοοειδών, χοίρων,
    ιπποειδών, νωπών κρεάτων και προϊόντων με βάση
    το κρέας και για κατάργηση των αποφάσεων 89/15/ΕΟΚ
    και 90/135/ΕΟΚ'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 19. jaanuar 1993, millega muudetakse nõukogu otsust 79/542/EMÜ,
    millega koostatakse kolmandate riikide loetelu, millest liikmesriigid lubavad
    importida veiseid, sigu ja hobuslasi, värsket liha ja lihatooteid, ja millega
    tunnistatakse kehtetuks otsused 89/15/EMÜ ja 90/135/EMÜ
  type: main
- language: fi
  script: Latn
  content: '93/100/ETY: Komission päätös, tehty 19 päivänä tammikuuta 1993,
    luettelosta kolmansista maista, joista jäsenvaltiot sallivat nautaeläinten,
    sikojen, hevoseläinten, tuoreen lihan ja lihavalmisteiden tuonnin tehdyn neuvoston
    päätöksen 79/542/ETY muuttamisesta sekä päätösten 89/15/ETY ja 90/135/ETY
    kumoamisesta'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1993. január 19.) a tagállamok által szarvasmarhafélék,
    sertés és lófélék, valamint friss hús és húsipari termékek behozatalára
    feljogosított harmadik országok jegyzékének megállapításáról szóló
    79/542/EGK tanácsi határozat módosításáról és a 89/15/EGK és a 90/135/EGK
    határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: '93/100/CEE: Decisione della Commissione, del 19 gennaio 1993, che modifica
    la decisione 79/542/CEE del Consiglio recante l''elenco dei paesi terzi da cui
    gli Stati membri autorizzano l''importazione di animali delle specie bovina, suina
    ed equina, di carni fresche e di prodotti a base di carne e che abroga le decisioni
    della Commissione 89/15/CEE e 90/135/CEE'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1993. gada 19. janvāris), ar kuru groza Padomes Lēmumu
    79/542/EEK, ar ko nosaka to trešo valstu sarakstu, no kurām dalībvalstis atļauj
    liellopu, cūku un zirgu dzimtas dzīvnieku, kā arī svaigas gaļas un gaļas
    produktu ievedumus, un atceļ Lēmumus 89/15/EEK un 90/135/EEK
  type: main
- language: lt
  script: Latn
  content: 1993 m. sausio 19 d. Komisijos sprendimas, iš dalies keičiantis Tarybos
    sprendimą 79/542/EEB dėl trečiųjų šalių, iš kurių valstybės narės leidžia
    importuoti galvijus, kiaules, arklinių šeimos gyvūnus bei šviežią mėsą
    ir mėsos produktus, sąrašo sudarymo ir panaikinantis Sprendimus 89/15/EEB ir
    90/135/EEB
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-19 ta' Jannar 1993 li temenda d-Deċiżjoni
    tal-Kunsill 79/542/KEE li tħejji lista ta' pajjiżi terzi minn fejn Istati Membri
    jistgħu jawtorizzaw l-importazzjoni ta' l-annimali ta’ l-ifrat, majjali u equidae,
    laħam frisk u prodotti tal-laħam u li tħassar id-Deċiżjonijiet 89/15/KEE
    u 90/135/KEE
  type: main
- language: nl
  script: Latn
  content: '93/100/EEG: Beschikking van de Commissie van 19 januari 1993 tot wijziging
    van Beschikking 79/542/EEG van de Raad tot vaststelling van een lijst van derde
    landen waaruit de Lid- Staten de invoer van runderen, varkens, paardachtigen,
    vers vlees en vleesprodukten toestaan en tot intrekking van de Beschikkingen 89/15/EEG
    en 90/135/EEG'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 19 stycznia 1993 r. zmieniająca decyzję Rady 79/542/EWG
    ustalającą wykaz państw trzecich, z których Państwa Członkowskie dopuszczają
    przywóz bydła, trzody chlewnej, zwierząt z rodziny koniowatych, świeżego
    mięsa i produktów mięsnych i uchylająca decyzje 89/15/EWG i 90/135/EWG
  type: main
- language: pt
  script: Latn
  content: '93/100/CEE: Decisão da Comissão, de 19 de Janeiro de 1993, que altera
    a Decisão 79/542/CEE do Conselho, que estabelece uma lista de países terceiros
    a partir dos quais os Estados-membros autorizam a importação de bovinos, suínos,
    equídeos, carne fresca e produtos à base de carne e que revoga as decisões
    89/15/CEE e 90/135/CEE da Comissão'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 19 ianuarie 1993 de modificare a Deciziei 79/542/CEE
    a Consiliului privind întocmirea listei țărilor terțe din care statele membre
    autorizează importurile de bovine, porcine, ecvidee, carne proaspătă și produse
    din carne și de abrogare a Deciziilor 89/15/CEE și 90/135/CEE
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 19. januára 1993, ktorým sa mení a dopĺňa rozhodnutie
    Rady 79/542/EHS ustanovujúce zoznam tretích krajín, z ktorých členské štáty
    povoľujú dovoz hovädzieho dobytka, ošípaných a koňovitých zvierat, čerstvého
    mäsa a mäsových výrobkov, a ktorým sa zrušujú rozhodnutia 89/15/EHS a 90/135/EHS
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 19. januarja 1993 o spremembi Odločbe Sveta 79/542/EGS
    o seznamu tretjih držav, iz katerih države članice odobrijo uvoz goveda, prašičev
    in kopitarjev ter svežega mesa in mesnih izdelkov, in o razveljavitvi odločb
    89/15/EGS in 90/135/EGS
  type: main
- language: es
  script: Latn
  content: '93/100/CEE: Decisión de la Comisión, de 19 de enero de 1993, por la
    que se modifica la Decisión 79/542/CEE por la que se confecciona una lista de
    terceros países desde los cuales los Estados miembros autorizan importaciones
    de animales de las especies bovina y porcina, équidos, carnes frescas y productos
    a base de carne'
  type: main
- language: sv
  script: Latn
  content: '93/100/EEG: Kommissionens beslut av den 19 januari 1993 om ändring av
    rådets beslut 79/542/EEG om upprättande av en förteckning över de tredje länder
    från vilka medlemsstaterna tillåter import av nötkreatur, svin, hästdjur,
    färskt kött och köttprodukter och om upphävande av besluten 89/15/EEG och
    90/135/EEG'
  type: main
