    τελωνειακών δασμών για περικόχλια ( παξιμάδια
    ) από χυτοσίδηρο, σίδηρο ή χάλυβα που υπάγονται
    στους κωδικούς ΣΟ 7318 16 30, 7318 16 91 και 7318 16 99, καταγωγής
    Σιγκαπούρης, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3635/87 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
