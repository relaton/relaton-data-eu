title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3813/88 of 7 December 1988 re-establishing
    the levying of the customs duties applicable to nuts of iron or steel falling
    within CN codes 7318 16 30, 7318 16 91 and 7318 16 99 originating in Singapore
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3813/88 de la Commission du 7 décembre 1988 portant
    rétablissement de la perception des droits de douane applicables aux écrous
    en fer ou en acier des codes 7318 16 30, 7318 16 91 et 7318 16 99 de la nomenclature
    combinée, originaires de Singapour, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3813/88 DER KOMMISSION vom 7. Dezember 1988 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer Muttern aus Eisen oder Stahl der KN-Code 7318 16
    30, 7318 16 91 und 7318 16 99 mit Ursprung in Singapur, dem die in der Verordnung
    (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3813/88 af 7. december 1988 om genindførelse
    af opkrævning af told for møtrikker af jern og stål, henhørende under KN-kode
    7318 16 30, 7318 16 91 og 7318 16 99 og med oprindelse i Singapore, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3635/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3813/88 της Επιτροπής
