    dei codici NC 7318 16 30, 7318 16 91 e 7318 16 99, originari di Singapore beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3635/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3813/88 VAN DE COMMISSIE van 7 december 1988 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op moeren van
    ijzer of van staal van de GN-codes 7318 16 30, 7318 16 91 en 7318 16 99, van oorsprong
    uit Singapore, waarvoor de in Verordening (EEG) nr. 3635/87 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
