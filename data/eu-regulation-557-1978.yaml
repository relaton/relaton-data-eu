title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 557/78 of 16 March 1978 amending Regulation
    (EEC) No 464/78 re-establishing the levying of customs duties on plaits and similar
    products of plaiting materials, for all uses, etc., falling within tariff heading
    No ex 46.02, originating in South Korea to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 557/78 de la Commission, du 16 mars 1978, modifiant
    le règlement (CEE) n° 464/78 portant rétablissement de la perception des droits
    de douane applicables aux tresses et articles similaires en matières à tresser,
    pour tous usages, etc., de la position tarifaire EX 46.02, originaires de la Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 557/78 der Kommission vom 16. März 1978 zur Änderung
    der Verordnung (EWG) Nr. 464/78 zur Wiedereinführung des Zollsatzes für Geflechte
    und ähnliche Waren aus Flechtstoffen, zu allen Verwendungszwecken usw., der Tarifnummer
    ex 46.02, mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 557/78 af 16. marts 1978 om ændring
    af forordning (EØF) nr. 464/78 om opkrævning af toldafgifter for flettematerialer
    i form af lidser eller lignende, også samlede til bånd etc., under position
    ex 46.02, som har oprindelse i Sydkorea og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 557/78 della Commissione, del 16 mano 1978, che modifica
    il regolamento (CEE) n. 464/78 che ripristina la riscossione dei dazi doganali
    applicabili alle trecce e manufatti simili, di materiali da intreccio, per qualsiasi
    uso, ecc., della voce doganale ex 46.02, originari della Corea del Sud, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 557/78 van de Commissie van 16 maart 1978 waarbij
    de Verordening (EEG) nr. 464/78 houdende wederinstelling van de heffing van de
    douanerechten van toepassing op vlechten en dergelijke artikelen, van vlechtstoffen,
    ongeacht het gebruik daarvan, van post ex 46.02, van oorsprong uit Zuid-Korea,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend, wordt gewjizigd
  type: main
