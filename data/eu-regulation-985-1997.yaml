title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 985/97 of 30 May 1997 terminating the investigation
    concerning the circumvention of definitive anti-dumping measures imposed by Council
    Regulation (EC) No 993/93 on imports of certain retail electronic weighing scales
    originating in Japan by imports of the same product assembled in and/or transhipped
    through Indonesia, and ceasing registration of this product
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 985/97 de la Commission du 30 mai 1997 clôturant l'enquête
    sur le contournement des mesures antidumping instituées par le règlement (CEE)
    nº 993/93 du Conseil sur les importations de certaines balances électroniques
    originaires du Japon par des importations des mêmes produits assemblés et/ou
    transbordés en Indonésie et levant l'enregistrement des produits concernés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 985/97 der Kommission vom 30. Mai 1997 zur Einstellung
    der Untersuchung betreffend die Umgehung der mit Verordnung (EWG) Nr. 993/93 des
    Rates eingeführten Antidumpingzölle auf die Einfuhren bestimmter elektronischer
    Waagen mit Ursprung in Japan durch die Einfuhr der gleichen, in Indonesien montierten
    und/oder dort umgeladenen Ware und zur Beendigung der zollamtlichen Erfassung
    der letztgenannten Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 985/97 af 30. maj 1997 om afslutning
    af undersøgelsen vedrørende omgåelse af de antidumpingforanstaltninger, der
    indførtes ved Rådets forordning (EØF) nr. 993/93 på importen af visse elektroniske
    vægte til brug i detailhandelen med oprindelse i Japan, ved import af samme vare
    samlet i og/eller omladet via Indonesien og om ophævelse af registreringen af
    denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 985/97 της Επιτροπής
    της 30ής Μαΐου 1997 για την περάτωση της έρευνας
    αναφορικά με την καταστρατήγηση μέτρων αντιντάμπινγκ
    που επιβλήθηκαν με τον κανονισμό (ΕΟΚ) αριθ.
    993/93 του Συμβουλίου επί των εισαγωγών ορισμένων
    ηλεκτρονικών ζυγών καταγωγής Ιαπωνίας, με
    εισαγωγές του ιδίου προϊόντος που συναρμολογείται
    στην ή/και μεταφορτώνεται μέσω της Ινδονησίας,
    και για την αναστολή της υπαγωγής του εν λόγω
    προϊόντος σε διαδικασία καταγραφής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 985/97, annettu 30 päivänä toukokuuta 1997,
    Japanista peräisin olevien tiettyjen vähittäismyyntiin tarkoitettujen elektronisten
    vaakojen tuonnissa neuvoston asetuksella (ETY) N:o 993/93 käyttöön otettujen
    lopullisten polkumyyntitoimenpiteiden kiertämistä Indonesiassa suoritettavalla
    kokoonpanolla ja/tai Indonesian kautta tapahtuvalla jälleenlaivauksella koskevan
    tutkimuksen ja kyseisen tuotteen tuonnin kirjaamisen päättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 985/97 della Commissione del 30 maggio 1997 che chiude
    l'inchiesta relativa all'elusione delle misure antidumping definitive istituite
    dal regolamento (CEE) n. 993/93 del Consiglio sulle importazioni di alcuni tipi
    di bilance elettroniche per il commercio al minuto originarie del Giappone per
    mezzo di importazioni degli stessi prodotti assemblati in Indonesia oppure trasbordati
    attraverso tale paese e mette fine all'obbligo di registrazione per i prodotti
    in questione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 985/97 van de Commissie van 30 mei 1997 tot beëindiging
    van het onderzoek naar de ontwijking van de bij Verordening (EG) nr. 993/93 van
    de Raad ingestelde definitieve antidumpingmaatregelen op de invoer van bepaalde
    elektronische weegschalen voor de kleinhandel, van oorsprong uit Japan, door invoer
    van hetzelfde product dat geassembleerd en/of overgeladen wordt in Indonesië
    en tot beëindiging van registratie van dit product
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 985/97 da Comissão de 30 de Maio de 1997 que encerra
    o inquérito relativo à evasão das medidas anti-dumping instituídas pelo Regulamento
    (CEE) nº 993/93 do Conselho sobre as importações de certas balanças electrónicas
    originárias do Japão através de importações destes produtos montados na Indonésia
    ou objecto de transbordo através deste país e que põe termo ao registo destas
    últimas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 985/97 de la Comisión de 30 de mayo de 1997 por el
    que se da por concluida la investigación relativa a la elusión de las medidas
    antidumping establecidas por el Reglamento (CEE) nº 993/93 del Consejo sobre
    las importaciones de determinadas balanzas electrónicas originarias de Japón,
    mediante importaciones de dichos productos montados en y/o transbordados vía
    Indonesia y por el que se suprime el registro de este producto
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 985/97 av den 30 maj 1997 om avslutande
    av undersökningen om kringgående av de antidumpningsåtgärder som infördes
    genom rådets förordning (EG) nr 993/93 på import av vissa elektroniska detaljhandelsvågar
    med ursprung i Japan genom import av samma produkt som monterats i eller omlastats
    via Indonesien och om upphörande av registreringen av denna produkt
