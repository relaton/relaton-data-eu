title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3001/78 of 18 December 1978 fixing for the
    1979 fishing year withdrawal prices for the fishery products listed in Annex I
    (A) and (C) to Regulation (EEC) No 100/76 and for certain products landed in areas
    very distant from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3001/78 de la Commission, du 18 décembre 1978, fixant
    les prix de retrait pour l' année 1979 pour les produits de la pêche énumérés
    à l' annexe I sous A et C du règlement (CEE) n° 100/76, ainsi que pour certains
    produits débarqués dans des zones très éloignées des principaux centres de
    consommation de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3001/78 der Kommission vom 18. Dezember 1978 zur Festsetzung
    der Rücknahmepreise für das Jahr 1979 für die im Anhang I unter A und C der
    Verordnung (EWG) Nr. 100/76 aufgeführten Fischereierzeugnisse sowie für bestimmte
    Erzeugnisse aus Anlandezonen, die von den Hauptverbrauchszentren der Gemeinschaft
    sehr weit entfernt liegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3001/78 af 18. december 1978 om fastsættelse
    af tilbagetagelsespriserne for året 1979 for de fiskerivarer, som er anført
    i afsnit A og C i bilag I til forordning (EØF) nr. 100/76, samt for visse varer
    fra landingsområder, der ligger meget fjernt fra Fællesskabets vigtigste forbrugscentre
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3001/78 della Commissione, del 18 dicembre 1978, che
    fissa, per i prodotti della pesca di cui all' allegato I, lettere A e C, nonché
    per taluni prodotti del regolamento (CEE) n. 100/76, sbarcati in zone molto lontane
    dai principali centri di consumo della Comunità, i prezzi di ritiro validi per
    l' anno 1979
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3001/78 van de Commissie van 18 december 1978 tot
    vaststelling van de in 1979 geldende ophoudprijzen voor de in bijlage I, sub A
    en C, van Verordening (EEG) nr. 100/76 genoemde visserijprodukten en voor bepaalde
    produkten die in ver van de voornaamste verbruikscentra van de Gemeenschap gelegen
    gebieden zijn aangevoerd
  type: main
