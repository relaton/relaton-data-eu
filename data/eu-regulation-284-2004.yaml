---
id: EURegulation2842004
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 284/2004 of 18 February 2004 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 1676/2001 on imports of polyethylene terephthalate
    (PET) film originating, inter alia, in India by imports of polyethylene terephthalate
    (PET) film consigned from Brazil and from Israel, whether declared as originating
    in Brazil or Israel or not and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 284/2004 de la Commission du 18 février 2004 portant
    ouverture d'une enquête sur le contournement éventuel des mesures antidumping
    instituées par le règlement (CE) n° 1676/2001 du Conseil sur les importations
    de feuilles en polyéthylène téréphtalate originaires, entre autres, de l'Inde
    par des importations de feuilles en polyéthylène téréphtalate expédiées
    du Brésil et d'Israël, qu'elles aient ou non été déclarées originaires de
    ces pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 284/2004 der Kommission vom 18. Februar 2004 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung
    (EG) Nr. 1676/2001 des Rates gegenüber den Einfuhren von Folien aus Polyethylentherephthalat
    (PET) mit Ursprung in unter anderem Indien eingeführten Antidumpingmaßnahmen
    durch aus Brasilien und aus Israel versandte Einfuhren von Folien aus Polyethylentherephthalat
    (PET), ob als Ursprungserzeugnisse Brasiliens oder Israels angemeldet oder nicht,
    und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 284/2004 ze dne 18. února 2004, kterým se
    zahajuje šetření možného obcházení antidumpingových opatření uložených
    nařízením Rady (ES) č. 1676/2001 na dovoz polyethylentereftalátového (PET)
    filmu pocházejícího mimo jiné z Indie dovozy polyethylentereftalátového
    (PET) filmu zasílaného z Brazílie a Izraele, ať již je prohlášen za pocházející
    z Brazílie nebo Izraele či nikoliv, a kterým se zavádí celní evidence těchto
    dovozů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 284/2004 af 18. februar 2004 om indledning
    af en undersøgelse vedrørende den påståede omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 1676/2001 om importen af polyethylenterephthalatfolie
    med oprindelse i bl.a. Indien, ved import af polyethylenterephthalatfolie afsendt
    fra Brasilien og Israel, uanset om den er angivet med oprindelse i Brasilien eller
    Israel eller ej, samt om registrering af denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 284/2004 της Επιτροπής,
    της 18ης Φεβρουαρίου 2004, για την έναρξη έρευνας
    όσον αφορά την πιθανή καταστρατήγηση των μέτρων
    αντιντάμπινγκ που επιβλήθηκαν με τον κανονισμό
    (ΕΚ) αριθ. 1676/2001 του Συμβουλίου στις εισαγωγές
    ταινιών τερεφθαλικού πολυαιθυλενίου (PET) καταγωγής,
    μεταξύ άλλων, Ινδίας από τις εισαγωγές ταινιών
    τερεφθαλικού πολυαιθυλενίου (PET) που αποστέλλονται
    από τη Βραζιλία και από το Ισραήλ, είτε δηλώνονται
    ως καταγωγής Βραζιλίας ή Ισραήλ είτε όχι, και
    για την υποβολή των εν λόγω εισαγωγών σε καταγραφή
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 284/2004, 18. veebruar 2004, millega algatatakse
    uurimine võimaliku kõrvalehoidmise kohta dumpinguvastastest meetmetest, mis
    on komisjoni määrusega (EÜ) nr 1676/2001 kehtestatud muu hulgas Indiast pärineva
    polüetüleentereftalaatkile importi suhtes, importides polüetüleentereftalaatkilet
    Brasiiliast või Iisraelist saadetuna, olenemata sellest, kas seda deklareeritakse
    Brasiiliast või Iisraelist pärineva impordina või mitte, ning kehtestatakse
    sellise impordi suhtes registreerimiskohustus
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 284/2004, annettu 18 päivänä helmikuuta 2004,
    muun muassa Intiasta peräisin olevan polyeteenitereftalaattikalvon tuonnissa
    neuvoston asetuksella (EY) N:o 1676/2001 käyttöön otettujen polkumyyntitoimenpiteiden
    mahdollista kiertämistä Brasiliasta ja Israelista lähetetyn polyeteenitereftalaattikalvon
    tuonnilla siitä riippumatta, onko sen alkuperämaaksi ilmoitettu Brasilia tai
    Israel, koskevan tutkimuksen vireillepanosta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 284/2004/EK rendelete (2004. február 18.) az 1676/2001/EK
    tanácsi rendelettel a többek között Indiából származó polietilén-tereftalát
    (PET) film behozatalára vonatkozóan bevezetett dömpingellenes intézkedéseknek
    a Brazíliában vagy Izraelben feladott polietilén-tereftalát (PET) filmek –
    függetlenül attól, hogy azokat Brazíliából vagy Izraelből származónak
    jelentik-e be vagy sem – behozatala általi lehetséges megkerülésével kapcsolatos
    vizsgálat kezdeményezéséről, valamint e behozatalok nyilvántartásba vételi
    kötelezettségének előírásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 284/2004 della Commissione, del 18 febbraio 2004, che
    apre un'inchiesta relativa alla possibile elusione delle misure antidumping istituite
    dal regolamento (CE) n. 1676/2001 del Consiglio sulle importazioni di fogli di
    polietilene tereftalato (PET) originari, tra l'altro, dell'India mediante importazioni
    di fogli di polietilene tereftalato (PET) spediti dal Brasile e da Israele, dichiarati
    o no come originari del Brasile o di Israele, e che dispone la registrazione di
    tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 284/2004 (2004. gada 18. februāris), ar ko ierosina
    izmeklēšanu par to antidempinga pasākumu iespējamo apiešanu, kuri ar Padomes
    Regulu (EK) Nr. 1676/2001 noteikti tās polietilēntereftalāta (PET) plēves
    importam, kuras izcelsmes valsts, cita starpā, ir Indija, kur importē polietilēntereftalāta
    (PET) plēvi, kuru nosūta no Brazīlijas un no Izraēlas un par kuras izcelsmes
    valsti deklarē vai nedeklarē Brazīliju vai Izraēlu vai arī šādu importu
    nereģistrē
  type: main
- language: lt
  script: Latn
  content: 2004 m. vasario 18 d. Komisijos reglamentas (EB) Nr. 284/2004, inicijuojantis
    tyrimą dėl galimo Tarybos reglamentu (EB) Nr. 1676/2001 įvestų, inter alia,
    Indijos kilmės polietileno tereftalato (PET) plėvelės importui taikomų antidempingo
    priemonių apėjimo importuojamą polietileno tereftalato (PET) plėvelę siunčiant
    iš Brazilijos ir Izraelio, deklaruojamą arba nedeklaruojamą kaip esančią
    Brazilijos ir Izraelio kilmės, ir įvedantis tokio importo registraciją
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 284/2004 tat-18 ta' Frar 2004 li
    jiftaħ investigazzjoni li tirrigwarda t-tagħwiġ possibbli tal-miżuri ta' kontra
    d-dumping imposti bir-Regolament tal-Kunsill (KE) Nru 1676/2002 dwar l-importazzjonijiet
    tar-rita-tereftalat tal-polietilene (il-PET) li joriġinaw, fost l-oħrajn, fl-Indja
    mill-importazzjonijiet tar-rita tat-tereftalat tal-polietilene kkunsinnti mill-Brażil
    u mill-Iżrael, sewwa jekk iddikjarati li joriġinaw fil-Brażil jew fl-Iżrael
    u sewwa jekk le u li jagħmlu dawn l-importazzjonijiet bla ħsara għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 284/2004 van de Commissie van 18 februari 2004 tot
    opening van een onderzoek naar de mogelĳke ontduiking van de antidumpingmaatregelen
    die werden ingesteld bĳ Verordening (EG) nr. 1676/2001 van de Raad ten aanzien
    van polyethyleentereftalaatfolie (PET) uit, onder andere, India door verzending
    van deze folie uit Brazilië en Israël, al dan niet aangegeven als van oorsprong
    zijnde uit Brazilië of Israël, en tot registratie van deze invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 284/2004 z dnia 18 lutego 2004 r. wszczynające
    dochodzenie w sprawie możliwego obejścia środków antydumpingowych nałożonych
    na mocy rozporządzenia Rady (WE) nr 1676/2001 na przywóz folii z politereftalanu
    etylenu (PET) pochodzącej między innymi z Indii przez przywóz folii z politereftalanu
    etylenu (PET) wysyłanej z Brazylii i z Izraela, zgłoszonej lub niezgłoszonej
    jako pochodząca z Brazylii lub Izraela i poddające ten przywóz wymogowi rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 284/2004 da Comissão, de 18 de Fevereiro de 2004,
    que inicia um inquérito sobre a eventual evasão das medidas anti-dumping instituídas
    pelo Regulamento (CE) n.° 1676/2001 do Conselho sobre as importações de películas
    de tereftalato de polietileno (PET) originárias, nomeadamente, da Índia, através
    de importações de películas de tereftalato de polietileno (PET) expedidas via
    o Brasil e Israel, independentemente de serem ou não declaradas originárias
    do Brasil ou de Israel, e que torna obrigatório o registo dessas importações
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 284/2004 z 18. februára 2004, ktorým sa začína
    šetrenie týkajúce sa možného obchádzania antidumpingových opatrení uložených
    nariadením Rady (ES) č. 1676/2001 na dovoz polyetyléntereftalátového (PET)
    filmu s pôvodom okrem iného v Indii dovozmi polyetyléntereftalátového (PET)
    filmu odoslaného z Brazílie a z Izraela bez ohľadu na to, či sa deklaruje
    pôvod v Brazílii alebo Izraeli a ktorým sa na takýto dovoz uplatňuje registrácia
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 284/2004 z dne 18. februarja 2004 o začetku
    preiskave glede možnega izogibanja protidampinškim ukrepom, ki so bili uvedeni
    z Uredbo Sveta (ES) št. 1676/2001 o uvozu polietilentereftalatske (PET) folije
    med drugim s poreklom iz Indije, z uvozom polietilentereftalatske (PET) folije,
    poslane iz Brazilije in Izraela, ne glede na to ali je prijavljeno poreklo Brazilija
    ali Izrael ali ne, in uvedbi registracije za takšen uvoz
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 284/2004 de la Comisión, de 18 de febrero de 2004,
    por el que se abre una investigación sobre la presunta elusión de las medidas
    antidumping impuestas por el Reglamento (CE) n° 1676/2001 del Consejo a las importaciones
    de película de tereftalato de polietileno originarias, entre otros países, de
    la India, en lo que se refiere a la película de tereftalato de polietileno procedente
    de Brasil e Israel, haya sido o no declarada como originaria de Brasil o Israel,
    y por el que se establece la obligatoriedad de registrar tales importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 284/2004 av den 18 februari 2004 om inledande
    av en undersökning rörande eventuellt kringgående, genom import av polyetentereftalatfilm
    som avsänts från Förbundsrepubliken Brasilien och från Staten Israel, av de
    antidumpningsåtgärder som genom rådets förordning (EG) nr 1676/2001 införts
    beträffande import av polyetentereftalatfilm med ursprung i bland annat Republiken
    Indien, oavsett om produktens deklarerade ursprung är Brasilien respektive Israel
    eller ej, och om registrering av sådan import
  type: main
