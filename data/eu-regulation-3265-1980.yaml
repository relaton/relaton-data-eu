title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3265/80 of 16 December 1980 concerning export
    to Poland, by special sale, of butter held by the German intervention agency,
    and amending Regulations (EEC) No 2044/75 and (EEC) No 1687/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3265/80 de la Commission, du 16 décembre 1980, relatif
    à une vente spéciale de beurre détenu par l' organisme d' intervention allemand
    et destiné à l' exportation vers la Pologne, et modifiant les règlements (CEE)
    n° 2044/75 et (CEE) n° 1687/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3265/80 der Kommission vom 16. Dezember 1980 über
    den Sonderverkauf von Butter aus Beständen der deutschen Interventionsstelle
    für die Ausfuhr nach Polen und zur Änderung der Verordnungen (EWG) Nr. 2044/75
    und (EWG) Nr. 1687/76
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3265/80 af 16. december 1980 om særligt
    salg af smør, som det tyske interventionsorgan ligger inde med, og som er bestemt
    til udførsel til Polen, og om ændring af forordning (EØF) nr. 2044/75 og (EØF)
    nr. 1687/76
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3265/80 τής Επιτροπής
    τής 16ης Δεκεμβρίου 1980 περί ειδικής πωλήσεως
    βουτύρου τό οποίο κατέχεται από τόν γερμανικό
    οργανισμό παρεμβάσεως καί προορίζεται γιά
    εξαγωγή πρός τήν Πολωνία, καβώς καί περί τροποποιήσεως
    τών κανονισμών (EOK) αριθ. 2044/75 καί (EOK) αριθ. 1687/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3265/80 della Commissione, del 16 dicembre 1980, relativo
    ad una vendita speciale di burro detenuto dall' organismo d' intervento tedesco
    e destinato all' esportazione verso la Polonia, e recante modifica dei regolamenti
    (CEE) n. 2044/75 e (CEE) n. 1687/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3265/80 van de Commissie van 16 december 1980 inzake
    een bijzondere verkoop van voor uitvoer naar Polen bestemde boter in het bezit
    van het Duitse interventiebureau en houdende wijziging van de Verordeningen (EEG)
    nr. 2044/75 en (EEG) nr. 1687/76
  type: main
