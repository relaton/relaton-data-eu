title:
- language: en
  script: Latn
  content: '79/156/EEC: Commission Decision of 21 December 1978 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of a payment on account
    in respect of expenditure incurred during 1977 on aids and premiums relating to
    the modernization of farms including those in the less-favoured farming areas
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/156/CEE: Décision de la Commission, du 21 décembre 1978, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume de Belgique d''un acompte sur les dépenses
    effectuées pendant l''année 1977 pour les aides et primes relatives à la modernisation
    des exploitations agricoles, y compris dans les zones agricoles défavorisées
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/156/EWG: Entscheidung der Kommission vom 21. Dezember 1978 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1977 zur Modernisierung landwirtschaftlicher Betriebe für Beihilfen und Prämien
    - einschließlich der Hilfen für benachteiligte landwirtschaftliche Gebiete -
    getätigten Ausgaben an das Königreich Belgien (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/156/EØF: Kommissionens beslutning af 21. december 1978 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Belgien af et acontobeløb for
    de udgifter, som er afholdt i løbet af året 1977 til støtte og præmier vedrørende
    modernisering af landbrugsbedrifter, herunder sådanne beliggende i ugunstigt
    stillede områder (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/156/CEE: Decisione della Commissione, del 21 dicembre 1978, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno del Belgio di
    un anticipo sulle spese effettuate durante il 1977 per gli aiuti ed i premi relativi
    all''ammodernamento delle aziende agricole, comprese quelle nelle zone agricole
    svantaggiate (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/156/EEG: Beschikking van de Commissie van 21 december 1978 betreffende
    de betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van
    een voorschot in verband met de in 1977 verrichte uitgaven voor steun en premies
    met betrekking tot de modernisering van landbouwbedrijven, waaronder mede begrepen
    die in probleemgebieden in de landbouw (Slechts de teksten in de Franse en de
    Nederlandse taal zijn authentiek)'
  type: main
