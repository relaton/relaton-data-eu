id: EURegulation17221979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1722/79 of 3 August 1979 re-establishing
    the levying of customs duties on electrical capacitors, fixed or variable, falling
    within heading No 85.18 and originating in Singapore and South Korea, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3156/78
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1722/79 de la Commission, du 3 août 1979, portant
    rétablissement de la perception des droits de douane applicables aux condensateurs
    électriques, fixes, variables ou ajustables, de la position 85.18 du tarif douanier
    commun, originaires de Singapour et de la Corée du Sud, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1722/79 der Kommission vom 3. August 1979 zur Wiedereinführung
    des Zollsatzes für elektrische Festkondensatoren, Drehkondensatoren und andere
    einstellbare Kondensatoren der Tarifnummer 85.18 mit Ursprung in Singapur und
    Südkorea, denen die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1722/79 af 3. august 1979 om genindførelse
    af opkrævning af toldafgifter for elektriske kondensatorer, faste eller variable,
    henhørende under pos. 85.18 i den fælles toldtarif, som har oprindelse i Singapore
    og Sydkorea og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1722/79 della Commissione, del 3 agosto 1979, che
    repristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili della voce 85.18 della tariffa doganale comune,
    originari di Singapore e della Corea del Sud beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1722/79 van de Commissie van 3 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elektrische
    condensatoren (vaste condensatoren, draaicondensatoren en regelbare of instelbare
    condensatoren), van post 85.18, van oorsprong uit Singapore en Zuid-Korea ten
    behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
