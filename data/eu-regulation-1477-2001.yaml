title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1477/2001 of 18 July 2001 derogating from
    Regulation (EC) No 708/98 on the taking over of paddy rice by the intervention
    agencies and fixing the corrective amounts and the price increases and reductions
    to be applied as regards the buying-in period for the 2000/01 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1477/2001 de la Commission du 18 juillet 2001 dérogeant
    au règlement (CE) n° 708/98 relatif à la prise en charge du riz paddy par les
    organismes d'intervention et fixant les montants correcteurs ainsi que les bonifications
    et les réfactions à appliquer, en ce qui concerne la période de livraison à
    l'intervention pour la campagne 2000/2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1477/2001 der Kommission vom 18. Juli 2001 zur Abweichung
    von der Verordnung (EG) Nr. 708/98 über die Übernahme von Rohreis durch die
    Interventionsstellen und zur Festsetzung der anzuwendenden Berichtigungsbeträge,
    Zu- und Abschläge hinsichtlich des Lieferzeitraums im Wirtschaftsjahr 2000/01
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1477/2001 af 18. juli 2001 om fravigelse
    af forordning (EF) nr. 708/98 om interventionsorganernes overtagelse af uafskallet
    ris og om fastsættelse af korrektionsbeløb samt tillæg og fradrag, for så
    vidt angår perioden for levering til intervention for høståret 2000/01
  type: main
- language: el
  script: Grek
