    της 18ης Ιουλίου 2001, για παρέκκλιση από τον κανονισμό
    (ΕΚ) αριθ. 708/98 για την ανάληψη του αναποφλοίωτου
    ρυζιού paddy από τους οργανισμούς παρέμβασης
    και για τον καθορισμό των όρων εφαρμογής διορθωτικών
    ποσών καθώς και των προσαυξήσεων και μειώσεων
    που πρέπει να εφαρμοστούν, όσον αφορά την περίοδο
    παράδοσης στην παρέμβαση για την περίοδο εμπορίας
    2000/01
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1477/2001, annettu 18 päivänä heinäkuuta
    2001, interventioelinten suorittamasta paddy- eli raakariisin haltuunotosta ja
    sovellettavien korjausmäärien sekä hinnankorotusten ja -alennusten vahvistamisesta
    annetusta asetuksesta (EY) N:o 708/98 poikkeamisesta interventioon toimittamisen
    määräajan osalta markkinointivuonna 2000/2001
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1477/2001 della Commissione, del 18 luglio 2001, recante
    deroga al regolamento (CE) n. 708/98 relativo alla presa in consegna del risone
    da parte degli organismi d'intervento e alla fissazione degli importi correttori,
    delle maggiorazioni e delle detrazioni da applicare, per il periodo di consegna
    all'intervento nella campagna 2000/01
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1477/2001 van de Commissie van 18 juli 2001 tot afwĳking
    van Verordening (EG) nr. 708/98 betreffende de overname van padie door de interventiebureaus
    en houdende vaststelling van de toe te passen correctiebedragen, toeslagen en
    kortingen, ten aanzien van de termĳn voor de levering voor interventie voor het
    verkoopseizoen 2000/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1477/2001 da Comissão, de 18 de Julho de 2001, que,
    no respeitante ao período de entrega para intervenção a título da campanha
    2000/2001, derroga o Regulamento (CE) n.° 708/98 relativo à tomada a cargo do
    arroz paddy pelos organismos de intervenção e que fixa os montantes correctores,
    as bonificações e as depreciações a aplicar por estes organismos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1477/2001 de la Comisión, de 18 de julio de 2001,
    por el que se establecen, para el período de entrega a la intervención de la
    campaña 2000/01, excepciones al Reglamento (CE) n° 708/98, relativo a la aceptación
    del arroz con cáscara por los organismos de intervención y por el que se fijan
    los importes correctores, las bonificaciones y los descuentos que deben aplicarse
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1477/2001 av den 18 juli 2001 om undantag
