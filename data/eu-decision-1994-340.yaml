    γαλλική και ολλανδική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '94/340/CE: DECISIONE DELLA COMMISSIONE del 27 maggio 1994 che modifica
    la decisione 94/22/CE relativa alle date che gli Stati membri devono stabilire
    per la presentazione delle domande di aiuto « superfici » nel quadro del sistema
    integrato di gestione e di controllo di taluni regimi di aiuti comunitari («
    sistema integrato ») (I testi in lingua greca, francese e neerlandese sono i
    soli facenti fedi)'
  type: main
- language: nl
  script: Latn
  content: '94/340/EG: BESCHIKKING VAN DE COMMISSIE van de 27 mei 1994 tot wijziging
    van Beschikking 94/22/EG inzake de door de Lid-Staten vast te stellen data voor
    de indiening van de steunaanvragen "oppervlakten" in het kader van het geïntegreerd
    beheers- en controlesysteem voor bepaalde communautaire steunregelingen ("geïntegreerd
    system") (Slechts de teksten in de Griekse, de Franse en de Nederlandse taal zijn
