title:
- language: en
  script: Latn
  content: '94/340/EC: Commission Decision of 27 May 1994 amending Decision 94/22/EC
    of 18 January 1994 concerning the dates to be fixed by Member States for the submission
    of '' area'' aid applications under the integrated administration and control
    system for certain community aid schemes (the '' integrated system'' ) (Only the
    Greek, French and Dutch versions are autentic)'
  type: main
- language: fr
  script: Latn
  content: '94/340/CE: Décision de la Commission du 27 mai 1994 modifiant la décision
    94/22/CE relative aux dates à fixer par les États membres pour la présentation
    des demandes d''aides «surfaces» dans le cadre du système intégré de gestion
    et de contrôle relatif à certains régimes d''aides communautaires («système
    intégré») (Les textes en langues grecque, française et néerlandaise sont
    les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '94/340/EG: ENTSCHEIDUNG DER KOMMISSION vom 27. Mai 1994 zur Änderung
    der Entscheidung 94/22/EG über die von den Mitgliedstaaten zu bestimmenden Zeitpunkte
    für die Stellung der Beihilfeanträge "Flächen" im Rahmen des integrierten Verwaltungs-
    und Kontrollsystems für bestimmte gemeinschaftliche Beihilferegelungen (integriertes
    System) (Nur der griechische, französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/340/EF: KOMMISSIONENS BESLUTNING af 27. maj 1994 om ændring af beslutning
    94/22/EF om de frister, som medlemsstaterne skal fastsætte for indgivelse af
    ansøgninger om arealstøtte i forbindelse med det integrerede system for forvaltning
    og kontrol af visse EF-støtteordninger (det integrerede system) (Kun den græske,
    franske og nederlandske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '94/340/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 27ης Μαΐου
    1994 περί τροποποιήσεως της απόφασης 94/22/ΕΚ της
    Επιτροπής της 18ης Ιανουαρίου 1994 σχετικά με
    τις ημερομηνίες που πρέπει να καθορίζονται
    από τα κράτη μέλη για την υποβολή των αιτήσεων
    ενισχύσεων «εκτάσεις» στο πλαίσιο του ολοκληρωμένου
