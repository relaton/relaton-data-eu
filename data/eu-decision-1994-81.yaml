  script: Latn
  content: Commission Decision of 10 February 1994 amending for the sixth time Decision
    93/242/EEC of 30 April 1993 concerning the importation into the Community of certain
    live animals and their products originating in certain European countries in relation
    to foot-and-mouth disease
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 10 février 1994 modifiant pour la sixième
    fois la décision 93/242/CEE concernant l'importation dans la Communauté de certains
    animaux vivants et de leurs produits originaires de certains pays d'Europe, en
    cas de fièvre aphteuse
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. Februar 1994 zur sechsten Änderung
    der Entscheidung 93/242/EWG über die Einfuhr lebender Tiere und ihrer Erzeugnisse
    aus bestimmten europäischen Ländern in die Gemeinschaft im Zusammenhang mit
    der Maul- und Klauenseuche
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 10. februar 1994 om sjette ændring af beslutning
    93/242/EØF om indførsel til Fællesskabet af visse levende dyr og produkter
    heraf med oprindelse i visse europæiske lande på baggrund af mund- og klovesygesituationen
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 10ης Φεβρουαρίου
