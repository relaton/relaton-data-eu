    της 30ής Απριλίου 1993 για την εισαγωγή στην Κοινότητα
    ορισμένων ζώντων ζώων και των προϊόντων τους,
    καταγωγής ορισμένων ευρωπαϊκών χωρών, σε ό,τι
    αφορά τον αφθώδη πυρετό
  type: main
- language: fi
  script: Latn
  content: '94/81/EY: Komission päätös, tehty 10 päivänä helmikuuta 1994, tietyistä
    Euroopan maista peräisin olevien tiettyjen elävien eläinten ja niistä saatujen
    tuotteiden tuonnista yhteisöön suu- ja sorkkatautitapauksissa tehdyn päätöksen
    93/242/ETY muuttamisesta kuudennen kerran'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione del 10 febbraio 1994 recante quinta modifica
    della decisione 93/242/CEE relativa all'importazione nella Comunità di animali
    vivi e loro prodotti originari di alcuni paesi europei, in considerazione dell'afta
    epizootica
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 februari 1994 houdende zesde wijziging
    van Beschikking 93/242/EEG inzake de invoer in de Gemeenschap van bepaalde levende
    dieren en produkten daarvan uit bepaalde Europese landen, met betrekking tot mond-
    en klauwzeer
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 10 de Fevereiro de 1994 que altera pela sexta
    vez a Decisão 93/242/CEE, relativa à importação na Comunidade de determinados
    animais vivos e dos seus produtos, originários de certos países europeus, atendendo
    à ocorrência de febre aftosa
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión de 10 de febrero de 1994 que modifica por sexta
    vez la Decisión 93/242/CEE por la que se regula, a los efectos de la fiebre aftosa,
    la importación en la Comunidad de ciertos animales vivos y de los productos derivados
    de ellos originarios de determinados países europeos
  type: main
- language: sv
  script: Latn
