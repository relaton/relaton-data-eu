title:
- language: fr
  script: Latn
  content: Décision 65/570/CEE du Conseil du 23 décembre 1965, portant prorogation
    de la suspension partielle des droits du Tarif douanier commun applicables aux
    réacteurs nucléaires et à certaines de leurs parties et pièces détachées
    de la position Ex 84.59 B
  type: main
- language: de
  script: Latn
  content: '65/570/EWG: Entscheidung des Rates vom 23. Dezember 1965 über die Verlängerung
    der teilweisen Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für Kernreaktoren
    und bestimmte Bestandteile davon der Tarifnummer ex 84.59 B'
  type: main
- language: it
  script: Latn
  content: '65/570/CEE: Decisione del Consiglio, del 23 dicembre 1965, relativa alla
    proroga della sospensione temporanea dei dazi della tariffa doganale comune applicabili
    ai reattori nucleari e a talune loro parti e pezzi staccati della voce ex 84.59
    B'
  type: main
- language: nl
  script: Latn
  content: '65/570/EEG: Beschikking van de Raad van 23 december 1965 houdende verlenging
    van de tijdelijke schorsing van de rechten van het gemeenschappelijk douanetarief
    op kernreactoren en op delen en onderdelen daarvan, van post ex 84.59 B'
  type: main
