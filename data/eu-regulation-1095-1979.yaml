title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1095/79 of 1 June 1979 re-establishing the
    levying of customs duties on wood, planed, tongued, grooved, etc., falling within
    heading No 44.13 and originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1095/79 de la Commission, du 1er juin 1979, portant
    rétablissement de la perception des droits de douane applicables aux bois rabotés,
    rainés, bouvetés, etc., de la position 44.13 du tarif douanier commun, originaires
    du Brésil bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1095/79 der Kommission vom 1. Juni 1979 zur Wiedereinführung
    des Zollsatzes für Holz, gehobelt, genutet, gefedert, usw., der Tarifnummer 44.13,
    mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1095/79 af 1. juni 1979 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, etc., henhørende under
    pos. 44.13 i den fælles toldtarif, som har oprindelse i Brasilien og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1095/79 della Commissione, del 1° giugno 1979, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato a forma di battente, ecc., della voce doganale 44.13, originario del
    Brasile, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1095/79 van de Commissie van 1 juni 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op hout, geschaafd,
    geploegd, enz., van post 44.13, van oorsprong uit Brazilië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
