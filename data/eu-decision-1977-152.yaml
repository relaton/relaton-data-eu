title:
- language: en
  script: Latn
  content: '77/152/EEC: Commission Decision of 29 December 1976 authorizing Member
    States to permit temporarily the marketing of forestry reproductive material not
    complying with requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '77/152/CEE: Décision de la Commission, du 29 décembre 1976, autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers de reproduction ne répondant pas aux exigences de la directive 66/404/CEE
    du Conseil'
  type: main
- language: de
  script: Latn
  content: '77/152/EWG: Entscheidung der Kommission vom 29. Dezember 1976 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '77/152/EØF: Kommissionens beslutning af 29. december 1976 om bemyndigelse
    til medlemsstaterne til midlertidig at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '77/152/ΕΟΚ: Απόφαση τής Επιτροπής τής 29ης
    Δεκεμβρίου 1976 περί παροχής αδείας στά Κράτη
    μέλη νά αποδέχονται προσωρινά τήν εμπορία
    δασικού πολλαπλασιαστικού υλικού τό οποίο
    δέν ανταποκρίνεται στίς απαιτήσεις τής οδηγίας
    66/404/ΕΟΚ τού Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '77/152/CEE: Decisione della Commissione del 29 dicembre 1976, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    di riproduzione di alcune specie forestali che non corrispondono alle esigenze
    della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '77/152/EEG: Beschikking van de Commissie van 29 december 1976 houdende
    machtiging van de Lid-Staten om tijdelijk bosbouwkundig teeltmateriaal tot de
    handel toe te laten dat aan de eisen van Richtlijn 66/404/EEG niet voldoet'
  type: main
