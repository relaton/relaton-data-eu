title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3972/89 of 18 December 1989 fixing, for 1990,
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of a Member State, other than Spain and Portugal, in
    waters falling under the sovereignty or within the jurisdiction of Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3972/89 du Conseil du 18 décembre 1989 fixant, pour
    1990, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon d'un Etat membre, à l'exception de l'Espagne
    et du Portugal, dans les eaux relevant de la souveraineté ou de la juridiction
    du Portugal
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3972/89 DES RATES vom 18. Dezember 1989 zur Festlegung
    bestimmter Massnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    fuer Schiffe unter der Flagge eines Mitgliedstaats, mit Ausnahme Spaniens und
    Portugals, in den Gewaessern unter der Hoheitsgewalt oder Gerichtsbarkeit Portugals
    (1990)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3972/89 af 18. december 1989 om fastsættelse
    for 1990 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører en medlemsstats flag, bortset
    fra spansk og portugisisk flag, i de farvande, der henhører under Portugals højhedsområde
    eller jurisdiktion
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3972/89 του Συμβουλίου
    της 18ης Δεκεμβρίου 1989 για τον καθορισμό, για
    το 1990, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με σημαία ενός κράτους μέλους, εκτός
    της Ισπανίας και της Πορτογαλίας, στα ύδατα
    που υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3972/89 DEL CONSIGLIO del 18 dicembre 1989 che fissa,
    per il 1990, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera di uno Stato membro, esclusi la Spagna
    e il Portogallo, nelle acque soggette alla sovranità o alla giurisdizione del
    Portogallo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3972/89 VAN DE RAAD van 18 december 1989 tot vaststelling,
    voor 1990, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op vaartuigen die de vlag voeren van een
    Lid-Staat, met uitzondering van Spanje en Portugal, in de wateren die onder de
    soevereiniteit of de jurisdictie van Portugal vallen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3972/89 DO CONSELHO de 18 de Dezembro de 1989 que
    fixa, para 1990, certas medidas de conservaçao e de gestao dos recursos da pesca
    aplicaveis aos navios arvorando pavilhao de um Estado-membro, com excepçao de
    Espanha e de Portugal, nas aguas sob soberania ou jurisdiçao de Portugal
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3972/89 DEL CONSEJO de 18 de diciembre de 1989 por
