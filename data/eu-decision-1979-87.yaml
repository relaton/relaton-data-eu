title:
- language: en
  script: Latn
  content: '79/87/ECSC: Commission Decision of 12 January 1979 authorizing an agreement
    strictly analogous to a specialization agreement between Cockerill SA and Klöckner-Werke
    AG in respect of wire rod and stainless steel sheet and plate (Only the French
    and German texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/87/CECA: Décision de la Commission, du 12 janvier 1979, relative à
    l''autorisation d''un accord strictement analogue à un accord de spécialisation
    entre Cockerill SA et Klöckner-Werke AG dans le domaine du fil machine et des
    tôles en aciers inoxydables (Les textes en langues française et allemande sont
    les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/87/EGKS: Entscheidung der Kommission vom 12. Januar 1979 über die
    Genehmigung einer Vereinbarung zwischen Cockerill S.A. und Klöckner-Werke AG
    für Walzdraht und rostfreie Bleche, die einer Spezialisierungsvereinbarung streng
    analog ist (Nur der französische und deutsche Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/87/EKSF: Kommissionens beslutning af 12. januar 1979 om tilladelse
    til en aftale, der er fuldstændig analog med en specialiseringsaftale, mellem
