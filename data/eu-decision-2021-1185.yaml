title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1185 of 13 July 2021 amending
    Implementing Decision (EU) 2017/2450 as regards the authorisation holder and its
    representative in the Union for the placing on the market of products containing,
    consisting of, or produced from genetically modified soybean DAS-44406-6 (notified
    under document C(2021) 5140) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1185 de la Commission du 13 juillet
    2021 modifiant la décision d’exécution (UE) 2017/2450 en ce qui concerne le
    titulaire de l’autorisation et son représentant dans l’Union pour la mise
    sur le marché de produits contenant du soja génétiquement modifié DAS-44406-6,
    consistant en ce soja ou produits à partir de celui-ci [notifiée sous le numéro
    C(2021) 5140] (Le texte en langue néerlandaise est le seul faisant foi.)
  type: main
