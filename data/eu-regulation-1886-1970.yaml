    von Interventionsmaßnahmen waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1886/70 del Consiglio, del 18 settembre 1970, che
    stabilisce misure speciali per l'assegnazione delle operazioni di trasformazione
    di pomodori e di pere che hanno formato oggetto di misure d'intervento
  type: main
- language: nl
  script: Latn
