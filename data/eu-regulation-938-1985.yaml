title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 938/85 of 10 April 1985 re-establishing
    the levying of customs duties on isopropylamine and its salts, falling within
    subheading 29.22 A ex III, originating in Romania, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 938/85 de la Commission du 10 avril 1985 portant rétablissement
    de la perception des droits de douane applicables à l' isopropylamine et ses
    sels, de la sous-position 29.22 A ex III du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 938/85 der Kommission vom 10. April 1985 zur Wiedereinführung
    der Erhebung der Zölle für Isopropylamin und seine Salze der Tarifstelle 29.22
    A ex III mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3562/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 938/85 af 10. april 1985 om genindførelse
    af opkrævning af told for isopropylamin samt salte deraf henhørende under pos.
    29.22 A ex III, og med oprindelse i Rumænien som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 938/85 της Επιτροπής
    της 10ης Απριλίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για την ισοπροπυλαμίνη
    και τα άλατα αυτής, της διακρίσεως 29.22 Α ex ΙΙΙ
    του Κοινού Δασμολογίου, καταγωγής Ρουμανίας,
    δικαιούχου των προβλεπόμενων από τον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 938/85 della Commissione del 10 aprile 1985 che ripristina
    la riscossione dei dazi doganali applicabili all' isopropilammina e suoi sali,
    della sottovoce 29.22 A ex III della tariffa doganale comune, originaria della
    Romania beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 938/85 van de Commissie van 10 april 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op isopropylamine
    en zouten daarvan van postonderverdeling 29.22 A ex III, van oorsprong uit Roemenië,
    waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
