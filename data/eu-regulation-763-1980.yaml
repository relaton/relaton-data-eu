title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 763/80 of 28 March 1980 making the importation
    into the Community of men' s and boys' outer garments, and into France of yarn
    of synthetic textile fibres originating in Taiwan, subject to quantitative limits
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 763/80 de la Commission, du 28 mars 1980, soumettant
    à des limitations quantitatives les importations dans la Communauté de vêtements
    de dessus pour hommes et garçonnets et, en France, de fils de fibres textiles
    synthétiques originaires de T' ai-wan
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 763/80 der Kommission vom 28. März 1980 zur Einführung
    von Höchstmengen für die Einfuhr von Oberkleidung für Männer und Knaben in
    die Gemeinschaft und von synthetischen Spinnfäden nach Frankreich mit Ursprung
    in Taiwan
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 763/80 af 28. marts 1980 om indførelse
    af et kvantitativt loft for indførsel i Fællesskabet af yderbeklædningsgenstande
    til mænd og drenge og i Frankrig af garn af endeløse fibre med oprindelse i
    Taiwan
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 763/80 του Συμβουλίου,
    της 28ης Μαρτίου 1980, με τον οποίο καθιερώνονται
    ποσοτικοί περιορισμοί στις εισαγωγές στην
    Κοινότητα ανδρικών και παιδικών εσωρούχων
    καθώς και εισαγωγών στη Γαλλία κλωστών από
    συνθετικά νήματα προέλευσης Ταϊβάν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 763/80 della Commissione, del 28 marzo 1980, che sottopone
    a limitazione quantitativa le importazioni, nella Comunità, di indumenti esterni
    per uomo e per ragazzo e, in Francia, di filati di fibre tessili sintetiche originari
    di Taiwan
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 763/80 van de Commissie van 28 maart 1980 waarbij
    de invoer in de Gemeenschap van herenbovenkleding en jongensbovenkleding, en in
    Frankrijk van garens van synthetische stapelvezels, van oorsprong uit Taiwan,
    aan kwantitatieve beperkingen wordt onderworpen
  type: main
