title:
- language: en
  script: Latn
  content: Commission Decision of 6 December 1977 on the granting by the Guidance
    Section of the EAGGF to the Kingdom of Belgium of a payment on account in respect
    of expenditure incurred during 1976 on aids relating to the provision of socio-economic
    guidance for and the acquisition of occupational skills by persons engaged in
    agriculture
  type: main
- language: fr
  script: Latn
  content: '78/16/CEE: Décision de la Commission, du 6 décembre 1977, relative au
    versement par le FEOGA, section "orientation", au Royaume de Belgique, d''un acompte
    sur les dépenses effectuées pendant l''année 1976 pour les aides relatives
    à l''information socio-économique et à la qualification professionnelle des
    personnes travaillant dans l''agriculture'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. Dezember 1977 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1976 für die
    sozio-ökonomische Information und die berufliche Qualifikation der in der Landwirtschaft
    tätigen Personen geleisteten Ausgaben an das Königreich Belgien
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 6. december 1977 om udbetaling gennem EUGFL,
    udviklingssektionen, til kongeriget Belgien af et acontobeløb for de udgifter,
    som er afholdt i løbet af året 1976 til støtte vedrørende social og erhvervsmæssig
    vejledning og faglige kvalifikationer hos de personer, som arbejder i landbruget
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 dicembre 1977, relativa al versamento
    da parte del FEAOG, sezione orientamento, al Regno del Belgio di un anticipo sulle
    spese effettuate durante il 1976 per gli aiuti concernenti l'informazione socioeconomica
    e la qualificazione professionale delle persone che lavorano nell'agricoltura
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 december 1977 inzake de betaling door
    het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van een voorschot
    in verband met de gedurende het jaar 1976 gedane uitgaven voor de steun met betrekking
    tot de sociaal-economische voorlichting en de scholing van de personen die in
    de landbouw werkzaam zijn
  type: main
