title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3777/85 of 31 December 1985 amending Regulation
    (EEC) No 3721/85 fixing, for certain fish stocks and groups of fish stocks, the
    total allowable catches for 1986 and certain conditions under which they can be
    fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3777/85 du Conseil du 31 décembre 1985 modifiant le
    règlement (CEE) no 3721/85 fixant, pour certains stocks ou groupes de stocks
    de poissons, les totaux admissibles des captures pour 1986 et certaines conditions
    dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3777/85 des Rates vom 31. Dezember 1985 zur Änderung
    der Verordnung (EWG) Nr. 3721/85 zur Festlegung der zulässigen Gesamtfangmengen
    und bestimmter Fangbedingungen hinsichtlich der zulässigen Gesamtfangmengen für
    bestimmte Fischbestände oder Bestandsgruppen für 1986
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3777/85 af 31. december 1985 om ændring
    af forordning (EØF) nr. 3721/85 om fastsættelse for 1986 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3777/85 του Συμβουλίου
    της 31ης Δεκεμβρίου 1985 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3721/85 σχετικά με τον καθορισμό,
    για ορισμένα αποθέματα ιχθύων ή ομάδες αποθεμάτων
    ιχθύων, των συνόλων των επιτρεπομένων αλιευμάτων
    για το 1986 και ορισμένων όρων υπό τους οποίους
    μπορούν να πραγματοποιηθούν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3777/85 del Consiglio del 31 dicembre 1985 che modifica
    il regolamento (CEE) n. 3721/85 che fissa, per alcune popolazioni e gruppi di
    popolazioni ittiche, il totale delle catture ammissibile per il 1986 ed alcune
    condizioni cui è soggetta la pesca del totale delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3777/85 van de Raad van 31 december 1985 tot wijziging
    van Verordening (EEG) nr. 3721/85 inzake de vaststelling van de voor 1986 geldende
    totaal toegestane vangsten voor bepaalde visbestanden of groepen visbestanden
    en bepaalde bij de visserij in het kader van de totaal toegestane vangsten in
    acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3777/85 do Conselho, de 31 de Dezembro de 1985,
    que altera o Regulamento (CEE) n.° 3721/85 que fixa, para certas unidades populacionais
    ou grupos de unidades populacionais (stocks), os totais admissíveis de capturas
    para 1986 e certas condições em que podem ser pescadas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3777/85 del Consejo, de 31 de diciembre de 1985, por
    el que se modifica el Reglamento (CEE) n° 3721/85 por el que se fijan, para determinadas
    poblaciones o grupos de poblaciones de peces, los totales admisibles de capturas
    para 1986 y determinadas condiciones en las que pueden pescarse
  type: main
