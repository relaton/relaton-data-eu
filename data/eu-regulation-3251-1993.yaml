title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3251/93 of 25 November 1993 re-establishing
    the levying of customs duties on products falling within CN code 8712 00, originating
    in Malaysia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3251/93 de la Commission du 25 novembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 8712 00, originaires de Malaysia, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3251/93 DER KOMMISSION vom 25. November 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 8712 00 mit Ursprung in Malaysia,
    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3251/93 af 25. november 1993 om genindførelse
    af opkrævning af told for henhørende under KN-kode 8712 00 og med oprindelse
    i Malaysia, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3251/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Νοεμβρίου 1993 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα προϊόντα του
    κωδικού ΣΟ 8712 00, καταγωγής Μαλαισίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3251/93 DELLA COMMISSIONE del 25 novembre 1993 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    della nomenclatura combinata 8712 00 originari della Malaysia, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3831/90
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3251/93 VAN DE COMMISSIE van 25 november 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 8712 00, van oorsprong uit Maleisië, waarvoor de in Verordening (EEG)
    nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3251/93 DA COMISSÃO de 25 de Novembro de 1993 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos produtos do código
    NC 8712 00 originários da Malásia, beneficiários das preferências pautais
    previstas pelo Regulamento (CEE) nº 3831/90 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3251/93 DE LA COMISIÓN de 25 de noviembre de 1993
    relativo al restablecimiento de la percepción de los derechos de aduana aplicables
    a los productos del código NC 8712 00, originarios de Malasia, beneficiarios
    de las preferencias arancelarias previstas por el Reglamento (CEE) nº 3831/90
    del Consejo
