title:
- language: en
  script: Latn
  content: '89/101/EEC: Commission Decision of 20 January 1989 releasing Belgium,
    Denmark, Germany, Spain, Ireland, Luxembourg and the United Kingdom from the obligation
    to apply to certain species Council Directives 66/401/EEC, 66/402/EEC, 69/208/EEC
    and 70/458/EEC on the marketing of fodder plant seed, cereal seed, seed of oil
    and fibre plants and vegetable seed respectively (Only the Danish, French, English,
    Dutch, Spanish and German texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/101/CEE: Décision de la Commission du 20 janvier 1989 dispensant la
    Belgique, le Danemark, l''Allemagne, l''Espagne, l''Irlande, le Luxembourg et
    le Royaume-Uni de l''obligation d''appliquer, à certaines espèces, les directives
    66/401/CEE, 66/402/CEE, 69/208/CEE et 70/458/CEE du Conseil, concernant la commercialisation
    des semences, respectivement, de plantes fourragères, de céréales, de plantes
    oléagineuses et à fibres et de légumes (Les textes en langues allemande, anglaise,
    danoise, espagnole, française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '89/101/EWG: Entscheidung der Kommission vom 20. Januar 1989 zur Freistellung
    Belgiens, Dänemarks, Deutschlands, Spaniens, Irlands, Luxemburgs und des Vereinigten
    Königreichs von der Anwendung der Richtlinien 66/401/EWG, 66/402/EWG, 69/208/EWG
    und 70/458/EWG des Rates über den Verkehr mit Futterpflanzensaatgut bzw. Getreidesaatgut
    bzw. Saatgut von Öl- und Faserpflanzen bzw. Gemüsesaatgut auf bestimmte Arten
    (Nur der spanische, der dänische, der deutsche, der englische, der französische
    und der niederländische Text sind verbindlich)'
  type: main
