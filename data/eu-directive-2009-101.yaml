title:
- language: en
  script: Latn
  content: Directive 2009/101/EC of the European Parliament and of the Council of
    16 September 2009 on coordination of safeguards which, for the protection of the
    interests of members and third parties, are required by Member States of companies
    within the meaning of the second paragraph of Article 48 of the Treaty, with a
    view to making such safeguards equivalent (Codified version)
  type: main
- language: fr
  script: Latn
  content: Directive 2009/101/CE du Parlement européen et du Conseil du 16 septembre
    2009 tendant à coordonner, pour les rendre équivalentes, les garanties qui sont
    exigées, dans les États membres, des sociétés au sens de l’article 48, deuxième
    alinéa, du traité, pour protéger les intérêts tant des associés que des
    tiers (Version codifiée)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2009/101/EG des Europäischen Parlaments und des Rates vom 16.
    September 2009 zur Koordinierung der Schutzbestimmungen, die in den Mitgliedstaatenden
    Gesellschaften im Sinne des Artikels 48 Absatz 2 des Vertrags im Interesse der
    Gesellschafter sowie Dritter vorgeschrieben sind, um diese Bestimmungen gleichwertig
    zu gestalten (kodifizierte Fassung)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2009/101/ЕО на Европейския парламент
    и на Съвета от 16 септември 2009 година за координиране
    на гаранциите, които държавите-членки изискват
    от дружествата по смисъла на член 48, втора алинея
    от Договора, за защита на интересите на членовете
    и на трети лица с цел тези гаранции да станат
    равностойни (Кодифицирана версия)
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2009/101/ES ze dne 16. září
    2009 o koordinaci ochranných opatření, která jsou na ochranu zájmů společníků
    a třetích osob vyžadována v členských státech od společností ve smyslu
    čl. 48 druhého pododstavce Smlouvy, za účelem dosažení rovnocennosti těchto
    opatření (kodifikované znění)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2009/101/EF af 16. september 2009
    om samordning af de garantier, som kræves i medlemsstaterne af de i traktatens
    artikel 48, stk. 2, nævnte selskaber til beskyttelse af såvel selskabsdeltagernes
    som tredjemands interesser, med det formål at gøre disse garantier lige byrdefulde
    (Kodificeret udgave)
  type: main
- language: el
  script: Grek
  content: Οδηγία 2009/101/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 16ης Σεπτεμβρίου 2009
    , περί συντονισμού των εγγυήσεων που απαιτούνται
    στα κράτη μέλη εκ μέρους των εταιρειών, κατά
    την έννοια του άρθρου 48 δεύτερο εδάφιο της
    συνθήκης, για την προστασία των συμφερόντων
    των εταίρων και των τρίτων, με σκοπό να καταστούν
    οι εγγυήσεις αυτές ισοδύναμες (Κωδικοποιημένη
    έκδοση)
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2009/101/EÜ, 16. september 2009
    , tagatiste kooskõlastamise kohta, mida liikmesriigid äriühingu liikmete ja
    kolmandate isikute huvide kaitseks asutamislepingu artikli 48 teises lõigus osutatud
    äriühingutelt nõuavad, et muuta sellised tagatised võrdväärseteks (kodifitseeritud
    versioon)
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2009/101/EY, annettu 16 päivänä
    syyskuuta 2009 , niiden takeiden yhteensovittamisesta samanveroisiksi, joita jäsenvaltioissa
    vaaditaan perustamissopimuksen 48 artiklan toisessa kohdassa tarkoitetuilta yhtiöiltä
    niiden jäsenten sekä ulkopuolisten etujen suojaamiseksi (Kodifioitu toisinto)
  type: main
- language: hr
  script: Latn
  content: Direktiva 2009/101/EZ Europskog parlamenta i Vijeća od 16. rujna 2009.
    o usklađivanju zaštitnih mjera koje, radi zaštite interesa članova i trećih
    strana, države članice zahtijevaju za trgovačka društva u smislu članka 48.
    stavka 2. Ugovora, s ciljem izjednačavanja takvih zaštitnih mjera (kodificirana
    verzija)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2009/101/EK irányelve ( 2009. szeptember
    16. ) az egész Közösségre kiterjedő egységes biztosítékok kialakítása
    érdekében a tagállamok által a társasági tagok és harmadik személyek érdekei
    védelmében a Szerződés 48. cikkének második bekezdése szerinti társaságoknak
    előírt biztosítékok összehangolásáról (kodifikált változat)
  type: main
- language: it
  script: Latn
  content: Direttiva 2009/101/CE del Parlamento europeo e del Consiglio, del 16 settembre
    2009 , intesa a coordinare, per renderle equivalenti, le garanzie che sono richieste,
    negli Stati membri, alle società a mente dell’articolo 48, secondo comma, del
    trattato per proteggere gli interessi dei soci e dei terzi (versione codificata)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2009/101/EK ( 2009. gada 16. septembris
    ) par to, kā vienādošanas nolūkā koordinēt nodrošinājumus, ko dalībvalstis
    prasa no sabiedrībām Līguma 48. panta otrās daļas nozīmē, lai aizsargātu
    sabiedrību dalībnieku un trešo personu intereses (versione codificata)
  type: main
- language: lt
  script: Latn
  content: 2009 m. rugsėjo 16 d. Europos Parlamento ir Tarybos direktyva 2009/101/EB
    dėl apsaugos priemonių, kurių valstybės narės reikalauja iš Sutarties 48
    straipsnio antroje pastraipoje apibrėžtų bendrovių siekiant apsaugoti narių
    ir trečiųjų asmenų interesus, koordinavimo, siekiant suvienodinti tokias apsaugos
    priemones (Kodifikuota redakcija)
  type: main
- language: mt
  script: Latn
  content: Direttiva 2009/101/KE tal-Parlament Ewropew u tal-Kunsill tas- 16 ta’
    Settembru 2009 dwar il-koordinazzjoni ta’ salvagwardji li, għall-protezzjoni
    tal-interessi ta’ membri u oħrajn, huma meħtieġa mill-Istati Membri minn
    kumpaniji fis-sens tat-tieni paragrafu tal-Artikolu 48 tat-Trattat, bil-għan
    li tagħmel dawn is-salvagwardji ekwivalenti (Verżjoni kkodifikata)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2009/101/EG van het Europees Parlement en de Raad van 16 september
    2009 strekkende tot het coördineren van de waarborgen, welke in de lidstaten
    worden verlangd van de vennootschappen in de zin van de tweede alinea van artikel
    48 van het Verdrag, om de belangen te beschermen zowel van de deelnemers in deze
    vennootschappen als van derden, zulks teneinde die waarborgen gelijkwaardig te
    maken (gecodificeerde versie)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2009/101/WE Parlamentu Europejskiego i Rady z dnia 16 września
    2009 r. w sprawie koordynacji gwarancji, jakie są wymagane w państwach członkowskich
    od spółek w rozumieniu art. 48 akapit drugi Traktatu, w celu uzyskania ich równoważności,
    dla zapewnienia ochrony interesów zarówno wspólników, jak i osób trzecich
    (Wersja ujednolicona)
  type: main
- language: pt
  script: Latn
  content: Directiva 2009/101/CE do Parlamento Europeu e do Conselho, de 16 de Setembro
    de 2009 , tendente a coordenar as garantias que, para protecção dos interesses
    dos sócios e de terceiros, são exigidas nos Estados-Membros às sociedades,
    na acepção do segundo parágrafo do artigo 48. o do Tratado, a fim de tornar
    equivalentes essas garantias em toda a Comunidade (Versão codificada)
  type: main
- language: ro
  script: Latn
  content: Directiva 2009/101/CE a Parlamentului European și a Consiliului din 16
    septembrie 2009 de coordonare, în vederea echivalării, a garanțiilor impuse
    societăților în statele membre, în înțelesul articolului 48 al doilea paragraf
    din tratat, pentru protejarea intereselor asociaților sau terților (Versiune
    codificată)
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2009/101/ES zo 16. septembra 2009
    o koordinácii záruk, ktoré sa od obchodných spoločností v zmysle článku
    48 druhého odseku zmluvy vyžadujú v členských štátoch na ochranu záujmov
    spoločníkov a tretích osôb s cieľom zabezpečiť rovnocennosť týchto záruk
    (kodifikované znenie)
  type: main
- language: sl
  script: Latn
  content: Direktiva 2009/101/ES Evropskega parlamenta in Sveta z dne 16. septembra
    2009 o uskladitvi zaščitnih ukrepov za varovanje interesov družbenikov in tretjih
    oseb, ki jih države članice zahtevajo od gospodarskih družb v skladu z drugim
    pododstavkom člena 48 Pogodbe, zato da se oblikujejo zaščitni ukrepi z enakim
    učinkom v vsej Skupnosti (Kodificirana različica)
  type: main
- language: es
  script: Latn
  content: Directiva 2009/101/CE del Parlamento Europeo y del Consejo, de 16 de septiembre
    de 2009 , tendente a coordinar, para hacerlas equivalentes, las garantías exigidas
    en los Estados miembros a las sociedades definidas en el artículo 48, párrafo
    segundo, del Tratado, para proteger los intereses de socios y terceros (versión
    codificada)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2009/101/EG av den 16 september
    2009 om samordning av de skyddsåtgärder som krävs i medlemsstaterna av de i
    artikel 48 andra stycket i fördraget avsedda bolagen i bolagsmännens och tredje
    mans intressen, i syfte att göra skyddsåtgärderna likvärdiga inom gemenskapen
    (kodifierad version)
