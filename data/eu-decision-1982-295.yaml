title:
- language: en
  script: Latn
  content: '82/295/EEC: Commission Decision of 10 March 1982 on an aid scheme by the
    Belgian Government in respect of certain investments carried out by a Belgian
    undertaking to increase its production capacity for high-density polyethylene
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/295/CEE: Décision de la Commission, du 10 mars 1982, concernant une
    aide que le gouvernement belge projette d''accorder en faveur de certains investissements
    d''une entreprise belge, visant à l''accroissement de la capacité de production
    de polyéthylène haute densité (Les textes en langues française et néerlandaise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/295/EWG: Entscheidung der Kommission vom 10. März 1982 über ein Beihilfevorhaben
    der belgischen Regierung zugunsten der Investition eines belgischen Unternehmens
    zur Ausweitung der Produktionskapazität für Polyäthylen hoher Dichtet (Nur
    der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/295/EØF: Kommissionens beslutning af 10. marts 1982 om den af den
    belgiske regering påtænkte støtte til en række investeringer, som en belgisk
    virksomhed agter at foretage med henblik på at øge produktionskapaciteten for
    polyethylen med høj massefylde (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/295/EOK: Απόφαση τής Επιτροπής τής 10ης Μαρτίου
    1982 περί ενισχύσεως πού σχεδιάζει νά χορηγήσει
    η βελγική κυβέρνηση υπέρ ορισμένων επενδύσεων
    βελγικής επιχειρήσεως μέ σκοπό τήν αύξηση
    τής δυναμικότητας παραγωγής πολυαιθυλένιου
    υψηλής πυκνότητας (Τα κείμενα στην γαλλική
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '82/295/CEE: Decisione della Commissione, del 10 marzo 1982, concernente
    un aiuto che il governo belga intende accordare a favore di determinati investimenti
    da parte di un''impresa belga, destinati ad incrementare la capacità di produzione
    di polietilene alta densità (Il testi in lingua francese e olandese sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '82/295/EEG: Beschikking van de Commissie van 10 maart 1982 betreffende
    een voorgenomen steunmaatregel van de Belgische Regering ten behoeve van bepaalde
    investeringen door een Belgische onderneming ter vergroting van de produktiecapaciteit
    voor hoge dichtheid-polyetheen (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
