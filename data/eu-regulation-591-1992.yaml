title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 591/92 of 5 March 1992 amending Regulation
    (EEC) No 361/92 authorizing the Italian intervention agency to put up for sale
    by invitation to tender 100 000 tonnes of paddy rice with a view to export in
    the form of milled rice to the Republics resulting from the dissolution of the
    Soviet Union
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 591/92 de la Commission, du 5 mars 1992, modifiant le
    règlement (CEE) n 361/92 autorisant l'organisme d'intervention italien à mettre
    en adjudication 100 000 tonnes de riz paddy en vue d'exportation sous forme de
    riz blanchi à destination des républiques issues de la dissolution de l'URSS
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 591/92 der Kommission vom 5. März 1992 zur Änderung
    der Verordnung (EWG) Nr. 361/92 zur Ermächtigung der italienischen Interventionsstelle,
    100 000 Tonnen Rohreis zur Ausfuhr nach den durch die Auflösung der UdSSR entstandenen
    Republiken in Form von vollständig geschliffenem Reis auszuschreiben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 591/92 af 5. marts 1992 om ændring
    af forordning (EØF) nr. 361/92 om bemyndigelse af det italienske interventionsorgan
    til at udbyde 100 000 tons uafskallet ris i licitation med henblik på udførsel
    i form af sleben ris til de republikker, der opstået efter opløsningen af Sovjetunionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 591/92 της Επιτροπής
    της 5ης Μαρτίου 1992 περί τροποποιήσεως του κανονισμού
    (ΕΟΚ) αριθ. 361/92 που επιτρέπει στον ιταλικό οργανισμό
    παρεμβάσεως να προκηρύξει διαγωνισμό για 100
    000 τόνους ρύζι paddy με σκοπό την εξαγωγή του,
    υπό μορφή λευκασμένου ρυζιού, με προορισμό
    τις Δημοκρατίες που προήλθαν από τη διάλυση
    της ΕΣΣΔ
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 591/92 della Commissione, del 5 marzo 1992, che modifica
    il regolamento (CEE) n. 361/92 che autorizza l'organismo di intervento italiano
    a vendere mediante gara 100 000 t di risone da esportare sotto forma di riso lavorato
    nelle Repubbliche sorte dallo scioglimento dell'Unione Sovietica
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 591/92 van de Commissie van 5 maart 1992 tot wijziging
    van Verordening (EEG) nr. 361/92 tot machtiging van het Italiaanse interventiebureau
    om 100 000 ton padie via een openbare inschrijving te verkopen met het oog op
    uitvoer in de vorm van volwitte rijst naar de republieken die zijn ontstaan als
    gevolg van de ontbinding van de USSR
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 591/92 da Comissão, de 5 de Março de 1992, que
    altera o Regulamento (CEE) nº 361/92, que autoriza o organismo de intervenção
    italiano a adjudicar 100 000 toneladas de arroz paddy tendo em vista a sua exportação
    sob a forma de arroz branqueado para as repúblicas resultantes da dissolução
    da URSS
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 591/92 de la Comisión, de 5 de marzo de 1992, por el
