title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1292/88 of 11 May 1988 re-establishing the
    levying of customs duties on women' s or girls' knitted or crocheted suits and
    ensembles, products of category 74 (order 40.0740), men' s or boys' knitted or
    crocheted suits and ensembles, products of category 75 (order No 40.0750), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1292/88 de la Commission du 11 mai 1988 portant rétablissement
    de la perception des droits de douane applicables aux costumes tailleur et ensembles
    en bonneterie, pour femmes ou fillettes, de la catégorie de produits n° 74 (n°
    d' ordre 40.0740), aux costumes, complets et ensembles en bonneterie pour hommes
    et garçonnets, de la catégorie de produits n° 75 (n° d' ordre 40.0750), originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1292/88 der Kommission vom 11. Mai 1988 zur Wiedereinführung
    des Zollsatzes für Kostüme und Kombinationen, aus Gewirken, für Frauen und
    Mädchen, der Warenkategorie Nr. 74 (lfd. Nr. 40.0740) sowie Anzüge und Kombinationen,
    aus Gewirken, für Männer und Knaben, der Warenkategorie Nr. 75 (lfd. Nr. 40.0750)
    mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1292/88 af 11. maj 1988 om genindførelse
    af opkrævning af toldafgifter for dragter, kostumer og sæt, af trikotage, til
    kvinder og piger under varekategori nr. 74 (løbenummer 40.0740) og dragter, kostumer
    og sæt, af trikotage, til mænd og drenge under varekategori nr. 75 (løbenummer
    40.0750), som har oprindelse i Kina og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
