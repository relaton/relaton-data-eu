    del marco normativo aplicable a las entidades de contrapartida central del Reino
    Unido de Gran Bretaña e Irlanda del Norte, de conformidad con el Reglamento (UE)
    n.° 648/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/2031 av den 19 december 2018
