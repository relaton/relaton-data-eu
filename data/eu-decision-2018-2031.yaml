title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/2031 of 19 December 2018 determining,
    for a limited period of time, that the regulatory framework applicable to central
    counterparties in the United Kingdom of Great Britain and Northern Ireland is
    equivalent, in accordance with Regulation (EU) No 648/2012 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/2031 de la Commission du 19 décembre
    2018 établissant, pour une période de temps limitée, que le cadre réglementaire
    applicable aux contreparties centrales au Royaume-Uni de Grande-Bretagne et d'Irlande
    du Nord est équivalent, conformément au règlement (UE) n° 648/2012 du Parlement
    européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/2031 der Kommission vom 19. Dezember
    2018 zur Feststellung der Gleichwertigkeit des für zentrale Gegenparteien im
    Vereinigten Königreich Großbritannien und Irland geltenden Rechtsrahmens gemäß
    der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments und des Rates für
    einen begrenzten Zeitraum
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2018/2031 на Комисията
    от 19 декември 2018 година за определяне за ограничен
    период от време на еквивалентността на регулаторната
    уредба, приложима по отношение на централните
    контрагенти от Обединеното кралство Великобритания
    и Северна Ирландия, в съответствие с Регламент
    (ЕС) № 648/2012 на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/2031 ze dne 19. prosince 2018,
    kterým se na omezenou dobu stanoví, že právní rámec použitelný na ústřední
    protistrany ve Spojeném království Velké Británie a Severního Irska je v
    souladu s nařízením Evropského parlamentu a Rady (EU) č. 648/2012 rovnocenný
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/2031 af 19. december
    2018 om fastlæggelse af, at de reguleringsmæssige rammer, som finder anvendelse
    på centrale modparter i Det Forenede Kongerige Storbritannien og Nordirland,
    i en begrænset periode er ækvivalente i overensstemmelse med Europa-Parlamentets
    og Rådets forordning (EU) nr. 648/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/2031 της Επιτροπής,
    της 19ης Δεκεμβρίου 2018, που προσδιορίζει, για
    περιορισμένο χρονικό διάστημα, ότι το κανονιστικό
    πλαίσιο που εφαρμόζεται στους κεντρικούς αντισυμβαλλομένους
    στο Ηνωμένο Βασίλειο της Μεγάλης Βρετανίας
    και της Βόρειας Ιρλανδίας είναι ισοδύναμο,
