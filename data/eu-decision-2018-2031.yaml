    oleviin keskusvastapuoliin sovellettavan sääntelykehyksen vastaavuuden vahvistamisesta
    määräajaksi Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 648/2012 mukaisesti
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/2031 оd 19. prosinca 2018. o utvrđivanju
