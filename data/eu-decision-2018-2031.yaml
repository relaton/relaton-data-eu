    del Nord è equivalente, in conformità del regolamento (UE) n. 648/2012 del Parlamento
    europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/2031 (2018. gada 19. decembris),
