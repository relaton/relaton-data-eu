    Didžiosios Britanijos ir Šiaurės Airijos Karalystėje taikoma reguliavimo sistema
    yra lygiavertė pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 648/2012
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/2031 tad-19
