    protistrany v Spojenom kráľovstve Veľkej Británie a Severného Írska je rovnocenný
    podľa nariadenia Európskeho parlamentu a Rady (EÚ) č. 648/2012
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/2031 z dne 19. decembra 2018 o določitvi,
