    centralnych w Zjednoczonym Królestwie Wielkiej Brytanii i Irlandii Północnej
    są równoważne zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE)
    nr 648/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/2031 da Comissão, de 19 de dezembro de
    2018, que determina, por um período limitado, que o quadro regulamentar aplicável
    às contrapartes centrais no Reino Unido da Grã-Bretanha e da Irlanda do Norte
    é equivalente em conformidade com o Regulamento (UE) n.° 648/2012 do Parlamento
    Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/2031 a Comisiei din 19 decembrie
    2018 de stabilire, pentru o perioadă limitată, a echivalenței cadrului de reglementare
    aplicabil contrapărților centrale din Regatul Unit al Marii Britanii și Irlandei
    de Nord, în conformitate cu Regulamentul (UE) nr. 648/2012 al Parlamentului European
    și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/2031 z 19. decembra 2018, ktorým
