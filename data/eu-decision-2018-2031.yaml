    centrale tegenpartijen in het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland
    gelijkwaardig is, in overeenstemming met Verordening (EU) nr. 648/2012 van het
    Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/2031 z dnia 19 grudnia 2018 r. stwierdzająca,
