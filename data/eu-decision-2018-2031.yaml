    centrālajiem darījumu partneriem Lielbritānijas un Ziemeļīrijas Apvienotajā
    Karalistē, ir līdzvērtīgs saskaņā ar Eiropas Parlamenta un Padomes Regulu
    (ES) Nr. 648/2012
  type: main
- language: lt
  script: Latn
  content: 2018 m. gruodžio 19 d. Komisijos įgyvendinimo sprendimas (ES) 2018/2031,
