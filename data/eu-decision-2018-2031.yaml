    kraljestvu Velika Britanija in Severna Irska, za omejeno obdobje enakovreden v
    skladu z Uredbo (EU) št. 648/2012 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/2031 de la Comisión, de 19 de diciembre
