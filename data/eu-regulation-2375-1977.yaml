title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2375/77 of 28 October 1977 amending Regulation
    (EEC) No 1226/77 laying down rules for the sale of olive oil held by the intervention
    agencies and Regulation (EEC) No 1687/76 laying down common detailed rules for
    verifying the use and/or destination of products from intervention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2375/77 de la Commission, du 28 octobre 1977, modifiant
    le règlement (CEE) n° 1226/77 relatif aux modalités de mise en vente de l'
    huile d' olive détenue par les organismes d' intervention et le règlement (CEE)
    n° 1687/76 établissant les modalités communes de contrôle de l' utilisation
    et/ou de la destination des produits provenant de l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2375/77 der Kommission vom 28. Oktober 1977 zur Änderung
    der Verordnung (EWG) Nr. 1226/77 über Einzelheiten des Verkaufs von Olivenöl
    aus Beständen der Interventionsstellen und der Verordnung (EWG) Nr. 1687/76 zur
    Festlegung der gemeinsamen Durchführungsbestimmungen für die Überwachung der
    Verwendung und/oder Bestimmung von Erzeugnissen aus Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2375/77 af 28. oktober 1977 om ændring
    af forordning (EØF) nr. 1226/77 om de nærmere regler for salg af olivenolie
    fra interventionsorganerne og af forordning (EØF) nr. 1687/76 om fælles gennemførelsesbestemmelser
    for kontrol med anvendelse af og/eller bestemmelse for produkter fra intervention
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2375/77 della Commissione, del 28 ottobre 1977, che
    modifica il regolamento (CEE) n. 1226/77, relativo alle modalità di vendita dell'
    olio d' oliva detenuto dagli organismi d' intervento, e il regolamento (CEE) n.
    1687/76, che stabilisce modalità comuni di controllo dell' utilizzazione e/o
    della destinazione di prodotti provenienti dall' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2375/77 van de Commissie van 28 oktober 1977 tot
    wijziging van Verordening (EEG) nr. 1226/77 inzake de voorschriften voor de verkoop
    van olijfolie die in het bezit is van de interventiebureaus en van Verordening
    (EEG) nr. 1687/76 tot vaststelling van gemeenschappelijke bepalingen inzake de
    controle op het gebruik en/of de bestemming van produkten uit interventie
  type: main
