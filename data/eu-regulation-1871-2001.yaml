    apresentados em Setembro de 2001 ao abrigo dos contingentes pautais de importação
    para determinados produtos no sector da carne de suíno, para o período compreendido
    entre 1 de Outubro e 31 de Dezembro de 2001
  type: main
- language: es
  script: Latn
