    certificados de importación presentadas en septiembre de 2001 de contingentes
    arancelarios de importación de productos del sector de la carne de porcino durante
    el período comprendido entre el 1 de octubre y el 31 de diciembre de 2001
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1871/2001 av den 24 september 2001 om
