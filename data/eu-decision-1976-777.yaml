id: EUDecision1976777
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 August 1976 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to imports of bed linen, table linen, toilet linen and kitchen
    linen falling within heading No ex 62.02 of the Common Customs Tariff, originating
    in the Republic of India and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/777/CEE: Décision de la Commission, du 25 août 1976, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les importations de linge de lit, de table,
    de toilette, d''office ou de cuisine, de la position Ex 62.02 du Tarif douanier
    commun, originaire de la République de l''Inde et mis en libre pratique dans
    les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. August 1976, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Republik Indien stammende und in den anderen Mitgliedstaaten im
    freien Verkehr befindliche Bettwäsche, Tischwäsche, Wäsche zur Körperpflege
    und andere Haushaltswäsche der Tarifnummer ex 62.02 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 25. august 1976 om bemyndigelse af kongeriget
    Belgien, stortugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage indførsel af sengelinned, dækketøj, håndklæder, vaskeklude og
    viskestykker, som henhører under position ex 62.02 i den fælles toldtarif, har
    oprindelse i republikken Indien og frit kan omsættes i de andre medlemstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 25 agosto 1976, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le importazioni di biancheria da letto, da tavola,
    da toletta, da servizio o da cucina, della voce ex 62.02 della tariffa doganale
    comune, originarie della Repubblica dell'India e immesse in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 augustus 1976 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd tafel-, bedde- en huishoudlinnen van post ex 62.02 van het gemeenschappelijke
    douanetarief, van oorsprong uit de Republiek India en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
