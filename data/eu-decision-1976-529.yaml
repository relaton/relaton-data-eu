id: EUDecision1976529
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 April 1976 authorizing the Italian Republic not
    to apply Community treatment to unbleached woven fabrics of cotton, other than
    cotton gauze or terry towelling and similar terry fabrics, falling within heading
    No ex 55.09 of the Common Customs Tariff, originating in the People's Republic
    of China and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/529/CEE: Décision de la Commission, du 20 avril 1976, autorisant la
    République italienne à exclure du traitement communautaire les tissus de coton,
    autres qu''à point de gaze ou boucle du genre éponge, écrus, de la position
    Ex 55.09 du Tarif douanier commun, originaires de la République populaire de
    Chine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. April 1976, mit der die Italienische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle, andere als
    Drehergewebe oder Schlingengewebe (Frottiergewebe), roh, der Tarifnummer ex 55.09
    des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. april 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage andre vævede stoffer af bomuld
    end drejervævet stof og håndklædefrotterstof og lignende frotterstof, ublegede,
    som henhører under pos. ex 55.09 i den fælles toldtarif, har oprindelse i Den
    kinisiske Folkerepublik og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 aprile 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di cotone diversi
    da quelli a punto di garza o ricci del tipo spugna, greggi, della voce ex 55.09
    della tariffa doganale comune, originari della Repubblica popolare cinese e messi
    in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 april 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd weefsels van katoen, andere dan met gaasbinding of bad- of frotteerstof
    (lussendoek), ongebleekt, van post ex 55.09 van het gemeenschappelijk douanetarief,
    van oorsprong uit de Volksrepubliek China, die in de andere Lid-Staten in het
    vrije verkeer worden gebracht, van de communautaire behandeling uit te sluiten
  type: main
