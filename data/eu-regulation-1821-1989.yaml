    ενός τόνου αμύλου, καθώς και την ελάχιστη τιμή
    που πληρώνεται για την εν λόγω ποσότητα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1821/89 DELLA COMMISSIONE del 23 giugno 1989 che
