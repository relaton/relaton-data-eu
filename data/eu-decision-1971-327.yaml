title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 3 septembre 1971, autorisant la République
    française à exclure du traitement communautaire les jouets en bois et autres,
    à l'exception des moteurs et mécanismes d'animation pour jouets et modèles
    réduits ainsi que leurs pièces détachées, des positions 97.03 A et 97.03 Ex
    B du Tarif douanier commun, originaires de Taiwan et mis en libre pratique dans
    les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/327/EWG: Entscheidung der Kommission vom 3. September 1971, mit der
    die Französische Republik ermächtigt wird, aus Taiwan stammendes und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliches anderes Spielzeug aus
    Holz, mit Ausnahme der Motoren und Bewegungsmechanismen für Spielzeug und Modelle
    zum Spielen sowie deren Ersatzteile, der Tarifnummern 97.03 A und 97.03 ex B des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/327/CEE: Decisione della Commissione, del 3 settembre 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli di
    legno ed altri, eccetto i motori ed i meccanismi d''animazione per giocattoli
    e modelli ridotti ed i loro pezzi staccati, delle voci nn. 97.03 A e 97.03 ex
    B della tariffa doganale comune, originari di Taiwan e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/327/EEG: Beschikking van de Commissie van 3 september 1971 waarbij
    de Franse Republiek wordt gemachtigd speelgoed van hout en andere (met uitzondering
    van motoren en bewegingsmechanismen voor speelgoed en modellen op schaal alsmede
    hun onderdelen) van posten 97.03 A en 97.03 ex B van het gemeenschappelijk douanetarief,
    van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
