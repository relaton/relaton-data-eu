    των αναλυτικών μεθόδων για τα κατάλοιπα φαρμακολογικώς
    δραστικών ουσιών που χρησιμοποιούνται σε τροφοπαραγωγά
    ζώα και την ερμηνεία των αποτελεσμάτων, καθώς
