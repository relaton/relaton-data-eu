  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/808 оd 22. ožujka 2021. o provođenju
    analitičkih metoda za rezidue farmakološki djelatnih tvari koje se upotrebljavaju
    na životinjama koje se koriste za proizvodnju hrane i o tumačenju rezultata
    kao i o metodama koje treba primjenjivati za uzorkovanje te o stavljanju izvan
    snage odluka 2002/657/EZ i 98/179/EZ
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/808 végrehajtási rendelete (2021. március 22.)
