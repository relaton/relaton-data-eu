    vonatkozó analitikai módszerek elvégzéséről és az eredmények értelmezéséről,
    valamint az alkalmazandó mintavételi módszerekről és a 2002/657/EK és 98/179/EK
    határozatok hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/808 della Commissione del 22 marzo
    2021 sul rendimento dei metodi analitici in relazione ai residui di sostanze farmacologicamente
    attive impiegate negli animali destinati alla produzione di alimenti, sull’interpretazione
    dei risultati e sui metodi da utilizzare per il campionamento e che abroga le
    decisioni 2002/657/CE e 98/179/CE
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/808 (2021. gada 22. marts) par
