    analizės metodų veiksmingumo bei rezultatų aiškinimo ir dėl mėginių ėmimo
    metodų, kuriuo panaikinami sprendimai 2002/657/EB ir 98/179/EB
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/808 tat-22
    ta’ Marzu 2021 dwar il-prestazzjoni ta’ metodi analitiċi għal residwi ta’
    sustanzi farmakoloġikament attivi użati f’annimali li jipproduċu l-ikel u
    dwar l-interpretazzjoni tar-riżultati kif ukoll dwar il-metodi li jridu jintużaw
    għat-teħid tal-kampjuni u li jħassar id-Deċiżjonijiet 2002/657/KE u 98/179/KE
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/808 van de Commissie van 22 maart 2021
    betreffende de prestaties van analysemethoden voor residuen van farmacologisch
    werkzame stoffen die bij voedselproducerende dieren worden gebruikt, betreffende
    de interpretatie van de resultaten en betreffende de toe te passen methoden voor
    bemonstering, en tot intrekking van de Beschikkingen 2002/657/EG en 98/179/EG
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/808 z dnia 22 marca 2021 r.
