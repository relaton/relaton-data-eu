title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/808 of 22 March 2021 on the
    performance of analytical methods for residues of pharmacologically active substances
    used in food-producing animals and on the interpretation of results as well as
    on the methods to be used for sampling and repealing Decisions 2002/657/EC and
    98/179/EC
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/808 de la Commission du 22 mars 2021
    concernant les performances des méthodes d’analyse des résidus de substances
    pharmacologiquement actives utilisées chez les animaux producteurs d’aliments
    et l’interprétation des résultats ainsi que les méthodes à employer pour
    l’échantillonnage et abrogeant les décisions 2002/657/CE et 98/179/CE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/808 der Kommission vom 22. März 2021
    über Leistungskriterien für Analysemethoden für Rückstände pharmakologisch
    wirksamer Stoffe in zur Lebensmittelerzeugung genutzten Tieren und über die Auswertung
    von Ergebnissen sowie über die für Probenahmen anzuwendenden Methoden und zur
    Aufhebung der Entscheidungen 2002/657/EG und 98/179/EG
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/808 на Комисията
    от 22 март 2021 година относно изпълнението на
    аналитични методи за остатъци от фармакологичноактивни
    субстанции, използвани при животни, отглеждани
    за производство на храни, и относно тълкуването
    на резултати, както и относно методите, които
    трябва да се използват за вземане на проби,
    и за отмяна на решения 2002/657/ЕО и 98/179/ЕО
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/808 ze dne 22. března 2021 o
    provádění analytických metod pro rezidua farmakologicky účinných látek
    používaných u zvířat určených k produkci potravin a o interpretaci výsledků,
    jakož i o metodách, které se mají používat pro odběr vzorků, a o zrušení
    rozhodnutí 2002/657/ES a 98/179/ES
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/808 af 22. marts 2021
