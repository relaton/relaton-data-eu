    virksomme stoffer, der anvendes i dyr bestemt til fødevareproduktion, om fortolkningen
    af resultater, om de metoder, der skal anvendes til prøveudtagning, og om ophævelse
    af beslutning 2002/657/EF og 98/179/EF
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/808 της Επιτροπής
