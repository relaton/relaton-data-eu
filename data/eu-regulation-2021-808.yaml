    metožu veiktspēju un rezultātu interpretēšanu, kā arī par paraugu ņemšanas
    metodēm un ar ko atceļ Lēmumus 2002/657/EK un 98/179/EK
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/808 2021 m. kovo 22 d. dėl
