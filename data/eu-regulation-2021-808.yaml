    farmakologicznie czynnych stosowanych u zwierząt, od których lub z których
    pozyskuje się żywność, oraz interpretacji wyników, jak również w sprawie
    metod stosowanych do pobierania próbek oraz uchylające decyzje 2002/657/WE i
    98/179/WE
  type: main
