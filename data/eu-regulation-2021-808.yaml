    farmacologicamente ativas utilizadas em animais produtores de géneros alimentícios
    e à interpretação dos resultados, bem como aos métodos a utilizar na amostragem,
    e que revoga as Decisões 2002/657/CE e 98/179/CE
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/808 al Comisiei din 22 martie
    2021 privind performanța metodelor analitice pentru reziduurile de substanțe
    farmacologic active utilizate la animalele de la care se obțin produse alimentare
    și privind interpretarea rezultatelor, precum și privind metodele care trebuie
    utilizate pentru prelevarea de probe și de abrogare a Deciziilor 2002/657/CE
    și 98/179/CE
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/808 z 22. marca 2021 o vykonávaní
    analytických metód pre rezíduá farmakologicky účinných látok používaných
    u zvierat určených na výrobu potravín a o interpretácii výsledkov, ako aj
    o metódach, ktoré sa majú používať na odber vzoriek, a ktorým sa zrušujú
    rozhodnutia 2002/657/ES a 98/179/ES
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/808 z dne 22. marca 2021 o izvajanju
    analiznih metod za ostanke farmakološko aktivnih snovi, ki se uporabljajo pri
    živalih za proizvodnjo živil, o razlagi rezultatov in metodah, ki jih je treba
    uporabljati za vzorčenje, ter o razveljavitvi odločb 2002/657/ES in 98/179/ES
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/808 de la Comisión de 22 de marzo de
