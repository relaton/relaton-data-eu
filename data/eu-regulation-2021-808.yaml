    de sustancias farmacológicamente activas utilizadas en animales productores de
    alimentos y a la interpretación de resultados, así como a los métodos que deben
    utilizarse para el muestreo, y por el que se derogan las Decisiones 2002/657/CE
    y 98/179/CE
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/808 av den 22 mars 2021
