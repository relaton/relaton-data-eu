    soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 2999/92 muuttamisesta ja hankintaa koskevan ennakkoarvion määrittämisestä
    ajanjaksolle 1 päivästä heinäkuuta 1995 30 päivään kesäkuuta 1996
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1686/95 della Commissione, dell' 11 luglio 1995, recante
