  content: Commission Regulation (EC) No 1686/95 of 11 July 1995 amending Regulation
    (EEC) No 2999/92 laying down detailed rules for the application of the specific
    measures for the supply of processed fruit and vegetables to Madeira and to determine
    the forecast supply balance for the period 1 July 1995 to 30 June 1996
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1686/95 de la Commission, du 11 juillet 1995, modifiant
