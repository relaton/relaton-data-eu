    für die Versorgung von Madeira mit Verarbeitungserzeugnissen aus Obst und Gemüse
    und zur Errichtung der Versorgungsbilanz für den Zeitraum vom 1. Juli 1995 bis
    30. Juni 1996
  type: main
- language: da
  script: Latn
