    mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2455/88 af 4. august 1988 om genindførelse
