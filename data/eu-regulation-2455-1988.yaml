title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2455/88 of 4 August 1988 re-establishing
    the levying of customs duties on woven fabrics of synthetic filament yarn, sacks
    and bags used for the packing of goods of category No 33 (code 40.0330) originating
    in Thailand, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2455/88 de la Commission du 4 août 1988 portant rétablissement
    de la perception des droits de douane applicables aux tissus de fils de filaments
    synthétiques, sacs et sachets d' emballage, de la catégorie de produits n°
    33 (numéro d' ordre 40.0330), originaires de Thaïlande, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
