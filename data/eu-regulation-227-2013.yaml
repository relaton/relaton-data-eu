  script: Latn
  content: Regulation (EU) No 227/2013 of the European Parliament and of the Council
    of 13 March 2013 amending Council Regulation (EC) No 850/98 for the conservation
    of fishery resources through technical measures for the protection of juveniles
    of marine organisms and Council Regulation (EC) No 1434/98 specifying conditions
    under which herring may be landed for industrial purposes other than direct human
    consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 227/2013 du Parlement européen et du Conseil du 13
    mars 2013 modifiant le règlement (CE) n ° 850/98 du Conseil visant à la conservation
    des ressources de pêche par le biais de mesures techniques de protection des
    juvéniles d'organismes marins et le règlement (CE) n ° 1434/98 du Conseil spécifiant
    les conditions dans lesquelles le hareng peut être débarqué à des fins industrielles
    autres que la consommation humaine directe
  type: main
