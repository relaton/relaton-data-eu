  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/1856 della Commissione del 10 giugno 2022
    che modifica le norme tecniche di regolamentazione di cui al regolamento delegato
    (UE) n. 151/2013 specificando ulteriormente la procedura di accesso ai dati sui
    derivati nonché le disposizioni tecniche e operative per accedervi
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/1856 (2022. gada 10. jūnijs), ar
