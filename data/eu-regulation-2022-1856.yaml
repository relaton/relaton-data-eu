title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1856 of 10 June 2022 amending
    the regulatory technical standards laid down in Delegated Regulation (EU) No 151/2013
    by further specifying the procedure for accessing details of derivatives as well
    as the technical and operational arrangements for their access
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1856 de la Commission du 10 juin 2022 modifiant
    les normes techniques de réglementation définies par le règlement délégué
    (UE) no 151/2013 en définissant plus précisément la procédure ainsi que les
    modalités techniques et opérationnelles pour accéder aux éléments des contrats
    dérivés
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1856 der Kommission vom 10. Juni 2022 zur
    Änderung der in der Delegierten Verordnung (EU) Nr. 151/2013 festgelegten technischen
    Regulierungsstandards durch weitere Präzisierung des Verfahrens für den Zugang
    zu den Einzelheiten von Derivaten sowie der technischen und operativen Vereinbarungen
    für diesen Zugang
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/1856 на Комисията
    от 10 юни 2022 година за изменение на регулаторните
    технически стандарти, установени в Делегиран
    регламент (ЕС) № 151/2013, чрез допълнително уточняване
    на процедурата за достъп до подробни данни
    за деривати, както и на техническите и оперативните
    механизми за достъп до тях
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/1856 ze dne 10. června
    2022, kterým se mění regulační technické normy stanovené nařízením v
    přenesené pravomoci (EU) č. 151/2013 dalším upřesněním postupu pro přístup
    k údajům o derivátech, jakož i technických a provozních opatření pro přístup
    k nim
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1856 af 10. juni 2022 om
    ændring af de reguleringsmæssige tekniske standarder i delegeret forordning
    (EU) nr. 151/2013 ved yderligere præcisering af proceduren for adgang til nærmere
    oplysninger om derivater samt de tekniske og operationelle ordninger for denne
    adgang
  type: main
- language: el
  script: Grek
