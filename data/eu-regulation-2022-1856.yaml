    Delegado (UE) n.o 151/2013 especificando mais pormenorizadamente o procedimento
    de acesso aos dados sobre derivados, bem como as disposições técnicas e operacionais
    que regem o seu acesso
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1856 al Comisiei din 10 iunie 2022 de modificare
    a standardelor tehnice de reglementare stabilite în Regulamentul delegat (UE)
    nr. 151/2013 prin aducerea de precizări suplimentare în ceea ce privește procedura
    de accesare a detaliilor instrumentelor financiare derivate, precum și măsurile
    de ordin tehnic și operațional pentru accesarea acestora
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/1856 z 10. júna 2022, ktorým
