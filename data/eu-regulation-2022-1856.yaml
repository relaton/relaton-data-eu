    standartus, sīkāk precizējot procedūru attiecībā uz piekļuvi informācijai
    par atvasinātajiem instrumentiem, kā arī tehnisko un operatīvo kārtību minētajai
    piekļuvei
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/1856 2022 m. birželio 10
