    (UE) Nru 151/2013 billi jispeċifika ulterjorment il-proċedura biex jiġu aċċessati
    d-dettalji tad-derivattivi kif ukoll l-arranġamenti tekniċi u operatorji għall-aċċess
    tagħhom
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/1856 van de Commissie van 10 juni 2022
    tot wijziging van de in Gedelegeerde Verordening (EU) nr. 151/2013 vastgestelde
    technische reguleringsnormen door de procedure voor de toegang tot gegevens betreffende
    derivaten en de technische en operationele regelingen voor de toegang daartoe
    nader te specificeren
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/1856 z dnia 10 czerwca 2022
    r. zmieniające regulacyjne standardy techniczne ustanowione w rozporządzeniu
    delegowanym (UE) nr 151/2013 poprzez doprecyzowanie procedury dostępu do szczegółowych
