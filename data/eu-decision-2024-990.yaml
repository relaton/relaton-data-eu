    (kodeks FSS) oraz Kodeksie wyszkolenia marynarzy, wydawania im świadectw i pełnienia
    wacht (kodeks STCW)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2024/990 do Conselho, de 20 de março de 2024, relativa à
    posição a tomar, em nome da União Europeia, na Organização Marítima Internacional,
    durante a 81.a sessão do Comité para a Proteção do Meio Marinho e a 108.a
    sessão do Comité de Segurança Marítima, no que respeita à adoção de alterações
    à Convenção Internacional para a Prevenção da Poluição por Navios (MARPOL),
    à Convenção Internacional para a Salvaguarda da Vida Humana no Mar (SOLAS),
    ao Código Internacional de Segurança para Navios que utilizam gases ou outros
    combustíveis de baixo ponto de inflamação (Código IGF), ao Código Internacional
    para o Programa Reforçado de Inspeções no âmbito das Vistorias a Graneleiros
    e Petroleiros, de 2011 (Código ESP 2011), ao Código Internacional dos Meios
    de Salvação (LSA), ao Código internacional dos sistemas de proteção contra
    incêndios (Código FSS) e ao Código de Formação, Certificação e Serviço
    de Quartos para os Marítimos (STCW)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2024/990 a Consiliului din 20 martie 2024 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Organizației
    Maritime Internaționale cu ocazia celei de a 81-a sesiuni a Comitetului pentru
    protecția mediului marin și cu ocazia celei de a 108-a sesiuni a Comitetului
    pentru siguranță maritimă cu privire la adoptarea amendamentelor la Convenția
    internațională pentru prevenirea poluării de către nave (MARPOL), la Convenția
    internațională pentru ocrotirea vieții omenești pe mare (SOLAS), la Codul
    internațional privind siguranța navelor care utilizează gaze sau alți combustibili
    cu punct de aprindere scăzut (Codul IGF), la Codul internațional din 2011 privind
    programul intensificat de inspecții efectuate cu ocazia inspecțiilor la vrachiere
    și petroliere (Codul ESP 2011), la Codul internațional al mijloacelor de salvare
    (LSA), la Codul internațional pentru instalațiile de protecție contra incendiului
    (Codul FSS) și la Codul privind pregătirea navigatorilor, brevetarea/atestarea
    și efectuarea serviciului de cart (STCW)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2024/990 z 20. marca 2024 o pozícii, ktorá sa
    má v mene Európskej únie zaujať v Medzinárodnej námornej organizácii na
    81. zasadnutí Výboru pre ochranu morského prostredia a 108. zasadnutí Výboru
    pre námornú bezpečnosť, pokiaľ ide o prijatie zmien Medzinárodného dohovoru
    o zabránení znečisťovaniu z lodí (MARPOL), Medzinárodného dohovoru o bezpečnosti
    ľudského života na mori (SOLAS), Medzinárodného kódexu bezpečnosti pre
    lode používajúce plyny alebo iné palivá s nízkou teplotou vzplanutia (kódex
    IGF), Medzinárodného kódexu programu rozšírených inšpekcií v rámci prehliadok
    lodí na hromadný náklad a ropných tankerov z roku 2011 (kódex ESP z roku
    2011), Medzinárodného kódexu pre záchranné prostriedky (LSA), Medzinárodného
    kódexu pre požiarne bezpečnostné systémy (kódex FSS) a Kódexu výcviku,
    kvalifikácie a strážnej služby námorníkov (kódex STCW)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2024/990 z dne 20. marca 2024 o stališču, ki se v imenu
    Evropske unije zastopa v Mednarodni pomorski organizaciji na 81. zasedanju Odbora
    za varstvo morskega okolja in 108. zasedanju Odbora za pomorsko varnost glede
    sprejetja sprememb Mednarodne konvencije o preprečevanju onesnaževanja morja
    z ladij (MARPOL), Mednarodne konvencije o varstvu človeškega življenja na morju
    (SOLAS), Mednarodnega kodeksa za varnost ladij, ki uporabljajo pline ali druga
    goriva z nizkim plameniščem (kodeks IGF), Mednarodnega kodeksa okrepljenega
    programa inšpekcij med pregledi ladij za prevoz razsutega tovora in naftnih tankerjev
    iz leta 2011 (kodeks ESP iz leta 2011), Mednarodnega kodeksa o reševalni opremi
    (kodeks LSA), Mednarodnega kodeksa za sisteme požarne varnosti (kodeks FSS) in
    Kodeksa za usposabljanje, izdajanje spričeval in ladijsko stražarjenje pomorščakov
    (kodeks STCW)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2024/990 del Consejo, de 20 de marzo de 2024, relativa a
    la posición que debe adoptarse, en nombre de la Unión Europea, en la Organización
    Marítima Internacional, durante el 81.° período de sesiones del Comité de
    Protección del Medio Marino y el 108.° período de sesiones del Comité de Seguridad
    Marítima, en relación con la adopción de enmiendas al Convenio Internacional
    para Prevenir la Contaminación por los Buques (Convenio MARPOL), al Convenio
    Internacional para la Seguridad de la Vida Humana en el Mar (Convenio SOLAS),
    al Código internacional de seguridad para los buques que utilicen gases u otros
    combustibles de bajo punto de inflamación (Código IGF), al Código internacional
    sobre el programa mejorado de inspecciones durante los reconocimientos de graneleros
    y petroleros, 2011 (Código ESP 2011), al Código internacional de dispositivos
    de salvamento (Código IDS), al Código internacional de sistemas de seguridad
    contra incendios (Código SSCI) y al Código de formación, titulación y guardia
    para la gente de mar (Código STCW)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2024/990 av den 20 mars 2024 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i Internationella sjöfartsorganisationen
    vid det 81:a mötet i kommittén för skydd av den marina miljön och vid det
    108:e mötet i sjösäkerhetskommittén om antagandet av ändringar av den internationella
    konventionen för förhindrande av förorening från fartyg (Marpol), av den internationella
    konventionen om säkerheten för människoliv till sjöss (Solas), av den internationella
    koden för säkerhet på fartyg som använder gaser eller andra bränslen med
    låg flampunkt (IGF-koden), av den internationella koden för det utökade programmet
    för inspektioner vid besiktning av bulkfartyg och oljetankfartyg från 2011 (2011
    års ESP-kod), av den internationella koden för livräddningsutrustning (LSA-koden),
    av den internationella koden för brandsäkerhetssystem (FSS-koden) och av koden
    för sjöfolks utbildning, certifiering och vakthållning (STCW-koden)
  type: main
