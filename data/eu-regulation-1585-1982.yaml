title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1585/82 of 21 June 1982 fixing for the 1982/83
    marketing year the minimum price to be paid to producers and the amount of the
    production aid for certain products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1585/82 de la Commission, du 21 juin 1982, fixant,
    pour la campagne 1982/1983, le prix minimal à payer aux producteurs ainsi que
    le montant de l' aide à la production pour certains produits transformés à
    base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1585/82 der Kommission vom 21. Juni 1982 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises sowie des Betrages der Produktionsbeihilfe
    für bestimmte Verarbeitungserzeugnisse aus Obst und Gemüse für das Wirtschaftsjahr
    1982/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1585/82 af 21. juni 1982 om fastsættelse
    for produktionsåret 1982/83 af producentstøtten og den minimumspris, der skal
    betales til producenterne, for visse produkter forarbejdet på basis af frugt
    og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1585/82 τής Επιτροπής
    τής 21ης Ιουνίου 1982 περί καθορισμού τής ελάχιστης
    τιμής πού πρέπει νά πληρώνεται στούς παραγωγούς,
    καθώς καί τού ποσού ενισχύσεως στήν παραγωγή
    γιά ορισμένα μεταποιημένα προϊόντα μέ βάση
    τά οπωροκηπευτικά, γιά τήν περίοδο 1982/83
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1585/82 della Commissione, del 21 giugno 1982, che
    fissa, per la campagna 1982/1983, il prezzo minimo da pagare ai produttori nonché
    l' importo dell' aiuto alla produzione per taluni prodotti trasformati a base
    di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1585/82 van de Commissie van 21 juni 1982 tot vaststelling,
    voor het verkoopseizoen 1982/1983, van de aan de telers te betalen minimumprijs,
    alsmede van het bedrag van de steun bij de produktie voor bepaalde verwerkte produkten
    op basis van groenten en fruit
  type: main
