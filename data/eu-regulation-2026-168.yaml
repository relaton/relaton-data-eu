title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2026/168 of 26 January 2026 concerning
    the renewal of the authorisation of a preparation of Saccharomyces cerevisiae
    CBS 493.94 as a feed additive for ruminants for milk production or reproduction,
    young ruminants for fattening except lambs for fattening and ruminants for fattening
    except sheep for fattening (holder of authorisation: All-Technology (Ireland)
    Limited [Alltech Ireland]) and repealing Implementing Regulation (EU) No 1109/2014'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2026/168 de la Commission du 26 janvier
    2026 concernant le renouvellement de l’autorisation d’une préparation de
    Saccharomyces cerevisiae CBS 493.94 en tant qu’additif pour l’alimentation
    des ruminants destinés à la production de lait ou à la reproduction, des jeunes
    ruminants d’engraissement à l’exception des agneaux d’engraissement, et
    des ruminants d’engraissement à l’exception des ovins d’engraissement [titulaire
    de l’autorisation: All-Technology (Ireland) Limited (Alltech Ireland)], et abrogeant
    le règlement d’exécution (UE) no 1109/2014'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2026/168 der Kommission vom 26. Januar 2026
    betreffend die Verlängerung der Zulassung einer Zubereitung aus Saccharomyces
    cerevisae CBS 493.94 als Zusatzstoff in Futtermitteln für Wiederkäuer zur Milcherzeugung
    oder für Zuchtzwecke, junge Wiederkäuer für Mastzwecke, ausgenommen Mastlämmer,
    und Mastwiederkäuer, ausgenommen Mastschafe (Zulassungsinhaber: All-Technology
    (Ireland) Limited [Alltech Ireland]) und zur Aufhebung der Durchführungsverordnung
    (EU) Nr. 1109/2014'
  type: main
