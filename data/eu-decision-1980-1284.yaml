title:
- language: en
  script: Latn
  content: '80/1284/EEC: Commission Decision of 19 December 1980 amending Commission
    Decision 78/638/EEC authorizing the United Kingdom of Great Britain and Northern
    Ireland to grant exemptions for national road transport operations from the Community
    regulations on social matters relating to road transport (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1284/CEE: Décision de la Commission, du 19 décembre 1980, modifiant
    la décision 78/638/CEE autorisant le Royaume-Uni de Grande-Bretagne et d''Irlande
    du Nord à appliquer pour les transports nationaux par route des mesures dérogeant
    aux dispositions des règlements communautaires en matière sociale dans le domaine
    des transports par route (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1284/EWG: Entscheidung der Kommission vom 19. Dezember 1980 zur Änderung
    der Entscheidung 78/638/EWG, durch die das Vereinigte Königreich von Großbritannien
    und Nordirland ermächtigt wird, im innerstaatlichen Güterverkehr von den Bestimmungen
    der gemeinschaftlichen Sozialregelungen im Straßenverkehr abweichende Maßnahmen
    zu treffen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1284/EØF: Kommissionens beslutning af 19. december 1980 om ændring
    af beslutning 78/638/EØF om bemyndigelse af Det forenede Kongerige Storbritannien
    og Nordirland for så vidt angår indenlandsk transport ad landevej, at træffe
    foranstaltninger som undtagelse fra bestemmelserne i Rådets forordninger på
    det sociale område inden for landevejstransport (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/1284/ΕΟΚ : Απόφαση της Επιτροπής, της 19ης
    Δεκεμβρίου 1980 περί τροποποίησης της Απόφασης
    78/638/ΕΟΚ με την οποία επιτρέπεται στο Ηνωμένο
    Βασίλειο της Μεγάλης Βρετανίας και της Βορείου
    Ιρλανδίας να εφαρμόσει για τις εθνικές οδικές
    μεταφορές μέτρα που παρεκκλίνουν από τις διατάξεις
    των κοινοτικών Κανονισμών που αφορούν τον
    κοινωνικό τομέα στις οδικές μεταφορές (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '80/1284/CEE: Decisione della Commissione, del 19 dicembre 1980, che emenda
    la decisione 78/638/CEE che autorizza il governo del Regno Unito di Gran Bretagna
    e Irlanda del Nord ad applicare, per i trasporti nazionali su strada, talune misure
    in deroga alle disposizioni dei regolamenti comunitari in materia sociale nel
    settore dei trasporti su strada (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1284/EEG: Beschikking van de Commissie van 19 december 1980 tot wijziging
    van de Beschikking 78/638/EEG waarbij het Verenigd Koninkrijk van Groot- Brittannië
    en Noord-Ierland wordt gemachtigd om met betrekking tot het nationale wegvervoer,
    maatregelen toe te passen die afwijken van de voorschriften van de communautaire
    verordeningen van sociale aard voor het wegvervoer (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
