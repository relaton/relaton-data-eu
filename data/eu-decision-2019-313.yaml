- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/313 of 21 February 2019 on the
    approval of the technology used in SEG Automotive Germany GmbH High efficient
    48V motor generator (BRM) plus 48V/12V DC/DC converter for use in conventional
    combustion engine and certain hybrid powered light commercial vehicles as an innovative
    technology for reducing CO2 emissions from light commercial vehicles pursuant
    to Regulation (EU) No 510/2011 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/313 de la Commission du 21 février 2019
    relative à l'approbation de la technologie utilisée dans l'alternodémarreur
    48 V à haut rendement (BRM) plus convertisseur 48 V/12 V CC/CC de SEG Automotive
    Germany GmbH, destiné à être utilisé dans les véhicules utilitaires légers
    à moteur à combustion classique et dans certains véhicules utilitaires légers
    à motorisation hybride, en tant que technologie innovante permettant de réduire
    les émissions de CO2 des véhicules utilitaires légers conformément au règlement
    (UE) n° 510/2011 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/313 der Kommission vom 21. Februar 2019
    zur Genehmigung der im hocheffizienten 48-Volt-Motorgenerator (BRM) mit 48V/12V-Gleichspannungswandler
    der SEG Automotive Germany GmbH für leichte Nutzfahrzeuge mit konventionellem
    Verbrennungsmotorantrieb und bestimmte leichte Nutzfahrzeuge mit Hybridantrieb
    verwendeten Technologie als innovative Technologie zur Verringerung der CO2-Emissionen
    von leichten Nutzfahrzeugen gemäß der Verordnung (EU) Nr. 510/2011 des Europäischen
    Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
