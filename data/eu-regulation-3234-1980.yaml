title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3234/80 of 12 December 1980 correcting Regulation
    (EEC) No 3191/80 on transitional measures concerning non-recovery of the variable
    slaughter premium for sheepmeat and goatmeat products exported from the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3234/80 de la Commission, du 12 décembre 1980, rectifiant
    le règlement (CEE) n° 3191/80 relatif à des mesures transitoires en ce qui
    concerne la non-récupération de la prime variable à l' abattage pour les produits
    du secteur des viandes ovine et caprine exportés hors de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3234/80 der Kommission vom 12. Dezember 1980 zur Berichtigung
    der Verordnung (EWG) Nr. 3191/80 mit Übergangsmaßnahmen über die Nichtwiedereinziehung
    der variablen Schlachtprämie bei Erzeugnissen des Schaf- und Ziegenfleischsektors,
    die aus der Gemeinschaft ausgeführt worden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3234/80 af 12. december 1980 om berigtigelse
    af forordning (EØF) nr. 3191/80 om overgangsforanstaltninger indebærende, at
    den variable slagtepræmie ikke tilbagebetales for produkter fra sektoren for
    fåre- og gedekød, som udføres fra Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3234/80 της Επιτροπής,
    της 12ης Δεκεμβρίου 1980, με τον οποίο διορθώνεται
    ο κανονισμός (ΕΟΚ) αριθ. 3191/80 σχετικά με τα μεταβατικά
    μέτρα που αφορούν τη μη επιστροφή της μεταβλητής
    επιδότησης κατά τη σφαγή για τα προϊόντα του
    τομέα προβείου και αιγείου κρέατος που εξάγονται
    εκτός Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3234/80 della Commissione, del 12 dicembre 1980, che
    rettifica il regolamento (CEE) n. 3191/80 recante misure transitorie che autorizzano
    a non prelevare un importo pari al premio variabile alla macellazione per i prodotti
    del settore delle carni ovine e caprine esportati fuori della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3234/80 van de Commissie van 12 december 1980 tot
    rectificatie van Verordening (EEG) nr. 3191/80 inzake overgangsmaatregelen voor
    het niet terugvorderen van de variabele slachtpremie voor de produkten van de
    sector schape- en geitevlees, die worden uitgevoerd uit de Gemeenschap
  type: main
