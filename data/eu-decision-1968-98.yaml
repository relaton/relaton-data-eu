title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 janvier 1968, relative aux recours de
    la République italienne à l'article 115, alinéa 2, du Traité, concernant certains
    produits originaires de pays tiers et mis en libre pratique dans les autres États
    membres (cartons, machines à calculer, transistors et autres)
  type: main
- language: de
  script: Latn
  content: '68/98/EWG: Entscheidung der Kommission vom 30. Januar 1968 über die Inanspruchnahme
    von Artikel 115 Absatz 2 des Vertrages durch die Italienische Republik bezüglich
    bestimmter aus dritten Ländern stammender und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlicher Waren (Pappe, Rechenmaschinen, Transistoren und
    sonstige)'
  type: main
- language: it
  script: Latn
  content: '68/98/CEE: Decisione della Commissione, del 30 gennaio 1968, relativa
    al ricorso da parte della Repubblica italiana all''articolo 115, secondo comma,
    del trattato, in merito a taluni prodotti originari di paesi terzi e immessi in
    libera pratica negli altri Stati membri (cartoni, macchine calcolatrici, transistori
    e altri)'
  type: main
- language: nl
  script: Latn
  content: '68/98/EEG: Beschikking van de Commissie van 30 januari 1968 betreffende
    de door de Italiaanse Republiek ingediende verzoeken om toepassing van artikel
    115, tweede alinea, van het Verdrag ten aanzien van bepaalde produkten, van oorsprong
    uit derde landen, die in de andere Lid-Staten in het vrije verkeer zijn gebracht
    (karton, rekenmachines, transistors en andere)'
  type: main
