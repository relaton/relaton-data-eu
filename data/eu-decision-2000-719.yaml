title:
- language: en
  script: Latn
  content: '2000/719/EC: Council Decision of 10 November 2000 authorising France to
    apply an exemption from excise duty for certain mineral oils, when used for specific
    purposes, in accordance with the procedure provided for in Article 8(4) of Directive
    92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '2000/719/CE: Décision du Conseil du 10 novembre 2000 autorisant la France
    à appliquer une exonération de droits d''accises sur certaines huiles minérales
    utilisées à des fins spécifiques, conformément à la procédure prévue par
    l''article 8, paragraphe 4, de la directive 92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '2000/719/EG: Entscheidung des Rates vom 10. November 2000 zur Ermächtigung
    Frankreichs, bestimmte Mineralöle mit besonderen Verwendungszwecken von der Verbrauchsteuer
    zu befreien (Verfahren gemäß Artikel 8 Absatz 4 der Richtlinie 92/81/EWG)'
  type: main
- language: da
  script: Latn
  content: '2000/719/EF: Rådets beslutning af 10. november 2000 om bemyndigelse af
    Frankrig til i overensstemmelse med proceduren i artikel 8, stk. 4, i direktiv
    92/81/EØF at fritage visse mineralolier, som benyttes til specifikke formål,
    for punktafgifter'
  type: main
- language: el
  script: Grek
  content: '2000/719/ΕΚ: Απόφαση του Συμβουλίου, της 10ης
    Νοεμβρίου 2000, με την οποία εξουσιοδοτείται
    η Γαλλία να χορηγήσει απαλλαγή από τους ειδικούς
    φόρους κατανάλωσης που επιβάλλονται σε ορισμένα
    πετρελαιοειδή τα οποία χρησιμοποιούνται για
    ειδικούς σκοπούς, σύμφωνα με τη διαδικασία
    που προβλέπεται από το άρθρο 8 παράγραφος 4
    της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '2000/719/EY: Neuvoston päätös, tehty 10 päivänä marraskuuta 2000,
    luvan antamisesta Ranskalle soveltaa vapautuksia valmisteverosta tiettyihin erityistarkoituksiin
    käytettäviin kivennäisöljyihin direktiivin 92/81/ETY 8 artiklan 4 kohdassa
    säädetyn menettelyn mukaisesti'
  type: main
- language: it
  script: Latn
  content: '2000/719/CE: Decisione del Consiglio, del 10 novembre 2000, che autorizza
    la Francia ad applicare un''esenzione d''accisa a taluni oli minerali utilizzati
    a fini specifici, conformemente alla procedura di cui all''articolo 8, paragrafo
    4, della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '2000/719/EG: Beschikking van de Raad van 10 november 2000 waarbij Frankrijk
    wordt gemachtigd in overeenstemming met de procedure van artikel 8, lid 4, van
    Richtlijn 92/81/EEG vrijstelling van accijnsrechten toe te passen op bepaalde
    minerale oliën die gebruikt worden voor bijzondere doeleinden'
  type: main
- language: pt
  script: Latn
  content: '2000/719/CE: Decisão do Conselho, de 10 de Novembro de 2000, que autoriza
    a República Francesa a aplicar uma isenção do imposto especial sobre o consumo
    de determinados óleos minerais utilizados para fins específicos, nos termos
    do n.o 4 do artigo 8.o da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '2000/719/CE: Decisión del Consejo, de 10 de noviembre de 2000, por la
    que se autoriza a Francia a aplicar una exención del impuesto especial sobre
    determinados hidrocarburos utilizados para usos específicos, de conformidad con
    el procedimiento previsto en el apartado 4 del artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '2000/719/EG: Rådets beslut av den 10 november 2000 om tillåtelse för
    Frankrike att i enlighet med det förfarande som föreskrivs i artikel 8.4 i direktiv
    92/81/EEG, tillämpa befrielse från punktskatter för vissa mineraloljor, som
    används för särskilda ändamål'
