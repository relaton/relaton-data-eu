title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 220/1999 of 29 January 1999 determining the
    extent to which applications lodged in January 1999 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 1474/95 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 220/1999 de la Commission du 29 janvier 1999 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 1999 pour certains produits du secteur des oeufs et de la viande de
    volaille dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96 peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 220/1999 der Kommission vom 29. Januar 1999 über die
    Festsetzung des Umfangs, in dem die im Januar 1999 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 220/1999 af 29. januar 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i januar
    1999 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 220/1999 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
