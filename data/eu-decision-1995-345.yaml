title:
- language: en
  script: Latn
  content: '95/345/EC: Commission Decision of 3 August 1995 terminating the anti-dumping
    proceeding concerning imports into the United Kingdom of ammonium nitrate originating
    in Russia and terminating the anti-dumping review investigation concerning imports
    into the United Kingdom of ammonium nitrate originating in Lithuania'
  type: main
- language: fr
  script: Latn
  content: '95/345/CE: Décision de la Commission du 3 août 1995 clôturant la procédure
    antidumping concernant les importations au Royaume-Uni de nitrate d''ammonium
    originaire de Russie et l''enquête de réexamen des mesures antidumping concernant
    les importations au Royaume-Uni de nitrate d''ammonium originaire de Lituanie'
  type: main
- language: de
  script: Latn
  content: '95/345/EG: BESCHLUSS DER KOMMISSION vom 3. August 1995 zur Einstellung
    des Antidumpingverfahrens betreffend die Einfuhren von Ammoniumnitrat mit Ursprung
    in Rußland nach dem Vereinigten Königreich und zur Einstellung der Überprüfung
    im Rahmen des Antidumpingverfahrens betreffend die Einfuhren von Ammoniumnitrat
    mit Ursprung in Litauen nach dem Vereinigten Königreich'
  type: main
- language: da
  script: Latn
  content: '95/345/EF: KOMMISSIONENS AFGØRELSE af 3. august 1995 om afslutning af
    antidumpingproceduren vedrørende importen til Det Forenede Kongerige af ammoniumnitrat
    med oprindelse i Rusland og om afslutning af den fornyede antidumpingundersøgelse
    vedrørende importen til Det Forenede Kongerige af ammoniumnitrat med oprindelse
    i Litauen'
  type: main
- language: el
  script: Grek
  content: '95/345/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 3ης Αυγούστου
    1995 για την περάτωση της διαδικασίας αντιντάμπινγκ
    όσον αφορά τις εισαγωγές στο Ηνωμένο Βασίλειο
    νιτρικού αμμωνίου καταγωγής Ρωσίας και για
    την περάτωση της έρευνας για επανεξέταση μέτρων
    αντιντάμπινγκ όσον αφορά τις εισαγωγές στο
    Ηνωμένο Βασίλειο νιτρικού αμμωνίου καταγωγής
    Λιθουανίας'
  type: main
- language: fi
  script: Latn
  content: '95/345/EY: Komission päätös, tehty 3 päivänä elokuuta 1995, Venäjältä
    peräisin olevan ammoniumnitraatin tuontia Yhdistyneeseen kuningaskuntaan koskevan
    polkumyynnin vastaisen menettelyn päättämisestä ja Liettuasta peräisin olevan
    ammoniumnitraatin tuontia Yhdistyneeseen kuningaskuntaan koskevan polkumyynnin
    uudelleentarkastelua koskevien tutkimusten päättämisestä'
  type: main
- language: it
  script: Latn
  content: '95/345/CE: DECISIONE DELLA COMMISSIONE del 3 agosto 1995 che conclude
    il procedimento antidumping riguardante le importazioni nel Regno Unito di nitrato
    di ammonio originario della Russia e l'' inchiesta antidumping di riesame riguardante
    le importazioni nel Regno Unito di nitrato di ammonio originario della Lituania'
  type: main
- language: nl
  script: Latn
  content: '95/345/EG: BESLUIT VAN DE COMMISSIE van 3 augustus 1995 tot beëindiging
    van de anti-dumpingprocedure betreffende de invoer in het Verenigd Koninkrijk
    van ammoniumnitraat van oorsprong uit Rusland en tot beëindiging van het nieuwe
    anti-dumpingonderzoek betreffende de invoer in het Verenigd Koninkrijk van ammoniumnitraat
    van oorsprong uit Litouwen'
  type: main
- language: pt
  script: Latn
  content: '95/345/CE: DECISÃO DA COMISSÃO de 3 de Agosto de 1995 que encerra o
