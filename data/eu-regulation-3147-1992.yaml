  content: Commission Regulation (EEC) No 3147/92 of 29 October 1992 re- establishing
    the levying of customs duties on products of category 20 (order No 40.0200), originating
    in Malaysia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
