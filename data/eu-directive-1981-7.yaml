title:
- language: en
  script: Latn
  content: Council Directive 81/7/EEC of 1 January 1981 amending, in view of the accession
    of the Hellenic Republic, Directive 77/93/EEC on protective measures against the
    introduction into the Member States of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Directive 81/7/CEE du Conseil, du 1er janvier 1981, modifiant, en raison
    de l'adhésion de la République hellénique, la directive 77/93/CEE concernant
    les mesures de protection contre l'introduction dans les États membres d'organismes
    nuisibles aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
  content: Richtlinie 81/7/EWG des Rates vom 1. Januar 1981 zur Änderung aufgrund
    des Beitritts der Republik Griechenland der Richtlinie 77/93/EWG über Maßnahmen
    zum Schutz gegen das Verbringen von Schadorganismen der Pflanzen oder Pflanzenerzeugnisse
    in die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 81/7/EØF af 1. januar 1981 om ændring som følge af
    Grækenlands tiltrædelse, af direktiv 77/93/EØF om foranstaltninger mod indslæbning
    i medlemsstaterne af skadegørere på planter eller planteprodukter
  type: main
- language: el
  script: Grek
  content: Οδηγία 81/7/ΕΟΚ του Συμβουλίου της 1ης Ιανουαρίου
    1981 περί τροποποίησης, λόγω της προσχώρησης
    της Ελληνικής Δημοκρατίας, της οδηγίας 77/93/ΕΟΚ
    «περί των μέτρων προστασίας κατά της εισαγωγής
    στα κράτη μέλη επιβλαβών οργανισμών για τα
    φυτά ή τα φυτικά προϊόντα»
  type: main
- language: it
  script: Latn
  content: Direttiva 81/7/CEE del Consiglio, del 1 gennaio 1981, che modifica, in
    seguito all'adesione della Repubblica ellenica, la direttiva 77/93/CEE concernente
    le misure di protezione contro l'introduzione negli Stati Membri di organismi
    nocivi ai vegetali o ai prodotti vegetali
  type: main
- language: nl
  script: Latn
  content: Richtlijn 81/7/EEG van de Raad van 1 januari 1981 tot wijziging van Richtlijn
    77/93/EEG betreffende de beschermende maatregelen tegen het binnenbrengen op het
    grondgebied van de Lid-Staten van voor planten of voor plantaardige produkten
    schadelijke organismen in verband met de toetreding van de Helleense Republiek
  type: main
- language: pt
  script: Latn
  content: Directiva 81/7/CEE do Conselho, de 1 de Janeiro de 1981, que altera, devido
    à adesão da República Helénica a Directiva 77/93/CEE respeitante às medidas
    de protecção contra a introdução nos Estados-Membros de organismos nocivos
    às plantas ou aos produtos vegetais
  type: main
- language: es
  script: Latn
  content: Directiva 81/7/CEE del Consejo, de 1 de enero de 1981, por la que se modifica,
    por razón de la adhesión de la República Helénica, la Directiva 77/93/CEE
    referente a las medidas de protección en los Estados Miembros de organismos nocivos
    para los vegetales o productos vegetales
  type: main
