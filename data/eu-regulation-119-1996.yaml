id: EURegulation1191996
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 119/96 of 22 January 1996 amending Regulation
    (EEC) No 1873/84 authorizing the offer for disposal for direct human consumption
    of certain imported wines which may have undergone oenological processes not provided
    for in Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 119/96 du Conseil, du 22 janvier 1996, modifiant le
    règlement (CEE) nº 1873/84 autorisant l' offre et la livraison à la consommation
    humaine directe de certains vins importés susceptibles d' avoir fait l' objet
    de pratiques oenologiques non prévues par le règlement (CEE) nº 822/87
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 119/96 des Rates vom 22. Januar 1996 zur Änderung
    der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten Weinen,
    bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung (EWG)
    Nr. 822/87 nicht vorgesehenen önologischen Verfahren waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 119/96 af 22. januar 1996 om ændring af forordning
    (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til direkte konsum
    af visse indførte vine, som eventuelt har været underkastet andre ønologiske
    fremgangsmåder end de i forordning (EØF) nr. 822/87 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 119/96 του Συμβουλίου,
    της 22ας Ιανουαρίου 1996, για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 1873/84 που επιτρέπει
    την προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγομένων οίνων δυναμένων
    να αποτελέσουν το αντικείμενο οινολογικών
    πρακτικών που δεν προβλέπονται από τον κανονισμό
    (ΕΟΚ) αριθ. 822/87
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 119/96, annettu 22 päivänä tammikuuta 1996,
    sellaisilla enologisilla käytännöillä, joista ei ole säädetty asetuksessa
    (ETY) N:o 822/87, mahdollisesti käsiteltyjen tiettyjen tuontiviinien tarjoamisen
    ja toimittamisen sallimisesta nautittavaksi annetun asetuksen (ETY) N:o 1873/84
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 119/96 del Consiglio, del 22 gennaio 1996, che modifica
    il regolamento (CEE) n. 1873/84 che autorizza l' offerta e la consegna per il
    consumo umano diretto di taluni vini importati che possono essere stati sottoposti
    a pratiche enologiche non previste dal regolamento (CEE) n. 822/87
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 119/96 van de Raad van 22 januari 1996 tot wijziging
    van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding of levering
    voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen waarop
    oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij Verordening
    (EEG) nr. 822/87
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 119/96 do Conselho, de 22 de Janeiro de 1996, que
    altera o Regulamento (CEE) nº 1873/84 que autoriza a oferta e o fornecimento
    para consumo humano directo de certos vinhos importados susceptíveis de ter sido
    objecto de práticas enológicas não previstas no Regulamento (CEE) nº 822/87
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 119/96 del Consejo, de 22 de enero de 1996, que modifica
    el Reglamento (CEE) nº 1873/84 por el que se autoriza la oferta y la entrega
    al consumo humano directo de determinados vinos importados que pueden haber sido
    sometidos a prácticas enológicas no previstas en el Reglamento (CEE) nº 822/87
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 119/96 av den 22 januari 1996 om ändring av
    förordning (EEG) nr 1873/84 som tillåter utbjudande till försäljning eller
    leverans för direkt konsumtion av vissa importerade viner som kan ha varit föremål
    för enologisk behandling som inte reglerats i förordning (EEG) nr 822/87
  type: main
