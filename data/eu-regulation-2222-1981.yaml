  content: Commission Regulation (EEC) No 2222/81 of 31 July 1981 amending for the
    second time Regulation (EEC) No 55/81 authorizing the Hellenic Republic to suspend
    the customs duties applicable on import of certain oil seeds and oleaginous fruits
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2222/81 de la Commission, du 31 juillet 1981, portant
    deuxième modification du règlement (CEE) n° 55/81 autorisant la République
    hellénique à suspendre les droits de douane applicables à l' importation pour
    certaines huiles et graines oléagineuses
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2222/81 der Kommission vom 31. Juli 1981 zur zweiten
    Änderung der Verordnung (EWG) Nr. 55/81 zur Ermächtigung der Republik Griechenland
    zur Aussetzung der bei der Einfuhr bestimmter Öle und Ölsaaten anwendbaren Zölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2222/81 af 31. juli 1981 om anden ændring
    af forordning (EØF) nr. 55/81 om bemyndigelse af Grækenland til at suspendere
    importtoldsatserne for visse olier og olieholdige frø
  type: main
