title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2037/86 of 30 June 1986 fixing the accession
    compensatory amounts applicable to cereals for the 1986/87 marketing year and
    the coefficients to be used for calculating the amounts applicable to certain
    processed products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2037/86 de la Commission du 30 juin 1986 fixant les
    montants compensatoires "adhésion" applicables dans les secteurs des céréales
    pour la campagne 1986/1987 ainsi que les coefficiens à retenir pour le calcul
    des montants applicables à certains produits transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2037/86 der Kommission vom 30. Juni 1986 zur Festsetzung
    der im Sektor Getreide geltenden Beitrittsausgleichsbeträge für das Wirtschaftsjahr
    1986/87 sowie der Koeffizienten für die Berechnung der auf bestimmte Verarbeitungserzeugnisse
    anzuwendenden Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2037/86 af 30. juni 1986 om fastsættelse
    af tiltrædelsesudligningsbeløbene for korn for høståret 1986/87 og koefficienterne
    til beregning af beløbene for visse forarbejdede produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2037/86 της Επιτροπής
    της 30ής Ιουνίου 1986 που καθορίζει τα εξισωτικά
    ποσά προσχώρησης που εφαρμόζονται στον τομέα
    των σιτηρών για την περίοδο 1986/87 καθώς και τους
    συντελεστές που πρέπει να ληφθούν υπόψη για
    τον υπολογισμό των ποσών που εφαρμόζονται
    σε ορισμένα μεταποιημένα προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2037/86 della Commissione del 30 giugno 1986 che fissa
    gli importi compensativi adesione applicabili nel settore dei cereali per la campagna
    1986/1987, nonché i coefficienti da prendere in considerazione per il calcolo
    degli importi applicabili a taluni prodotti trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2037/86 van de Commissie van 30 juni 1986 tot vaststelling
    van de compenserende bedragen toetreding die in het verkoopseizoen 1986/1987 van
    toepassing zijn in de sector granen alsmede van de coëfficiënten die moeten
    worden aangehouden voor de berekening van de bedragen die voor bepaalde verwerkte
    produkten van toepassing zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2037/86 da Comissão de 30 de Junho de 1986 que
    fixa os montantes compensatórios de adesão aplicáveis ao sector dos cereais
    para a campanha de 1986/1987, bem como os coeficientes a utilizar para o cálculo
    dos montantes aplicáveis a determinados produtos transformados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2037/86 de la Comisión de 30 de junio de 1986 por
    el que se fijan los montantes compensatorios de adhesión aplicables en los sectores
    de los cereales para la campaña 1986/87 y los coeficientes que deberán utilizarse
    para el cálculo de los montantes aplicables a determinados productos transformados
  type: main
