title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1768/89 of 19 June 1989 imposing a definitive
    anti-dumping duty on imports of video cassettes originating in the Republic of
    Korea and Hong Kong, collecting definitively the provisional duty and terminating
    the anti-dumping proceeding with regard to the imports of video tape reels originating
    in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1768/89 du Conseil, du 19 juin 1989, instituant un
    droit antidumping définitif sur les importations de cassettes vidéo originaires
    de la République de Corée et de Hong-kong, portant perception définitive du
    droit provisoire et portant clôture de la procédure antidumping concernant les
    importations de bandes pour cassettes vidéo originaires de la République de
    Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1768/89 des Rates vom 19. Juni 1989 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Videokassetten mit Ursprung
    in der Republik Korea und in Hongkong, zur endgültigen Vereinnahmung des vorläufigen
    Zolls und zur Einstellung des Antidumpingverfahrens hinsichtlich der Einfuhren
    von Videobandspulen mit Ursprung in der Republik Korea
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1768/89 af 19. juni 1989 om indførelse af
    en endelig antidumpingtold på importen af videokassetter med oprindelse i Republikken
    Korea og Hongkong, om endelig opkrævning af den midlertidige told og om afslutning
    af antidumpingproceduren vedrørende importen af videobånd på spoler med oprindelse
    i Republikken Korea
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1768/89 του Συμβουλίου
    της 19ης Ιουνίου 1989 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές βιντεοκασετών
    καταγωγής Δημοκρατίας της Κορέας και Χονγκ
    Κονγκ, για την οριστική είσπραξη του προσωρινού
    δασμού και την περάτωση της διαδικασίας αντιντάμπινγκ
    όσον αφορά τις εισαγωγές κυλίνδρων βιντεοταινιών
    καταγωγής Δημοκρατίας της Κορέας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1768/89, annettu 19 päivänä kesäkuuta 1989,
    lopullisen polkumyyntitullin käyttöön ottamisesta Korean tasavallasta ja Hongkongista
    peräisin olevien videokasettien tuonnissa, väliaikaisen tullin lopullisesta
    kantamisesta ja Korean tasavallasta peräisin olevien videonauhakelojen tuontia
    koskevan polkumyyntimenettelyn lopettamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1768/89 del Consiglio, del 19 giugno 1989, che istituisce
    un dazio antidumping definitivo sulle importazioni di videocassette originarie
    della Republica di Corea e di Hong Kong, che decide la riscossione definitiva
    del dazio provvisorio e che chiude la procedura antidumping relativa alle importazioni
    di nastri in bobine originari della Repubblica di Corea
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1768/89 van de Raad van 19 juni 1989 tot instelling
    van een definitief anti-dumpingrecht op de invoer van videocassettes van oorsprong
    uit de Republiek Korea en Hong-Kong, tot definitieve inning van het voorlopige
    recht en tot afsluiting van de anti- dumpingprocedure met betrekking tot de invoer
    van videobanden van oorsprong uit de Republiek Korea
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1768/89 do Conselho, de 19 de Junho de 1989, que
    institui um direito anti-dumping definitivo sobre as importações de cassetes
    vídeo originárias da República da Coreia e de Hong Kong, que determina a cobrança
    definitiva do direito provisório e que encerra o processo anti-dumping relativamente
    às importações de rolos de fita vídeo originárias da República da Coreia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1768/89 del Consejo, de 19 de junio de 1989, por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    cintas de vídeo en casete originarias de la República de Corea y de Hong Kong
    que recauda definitivamente el derecho provisional y por el que se concluye el
    procedimiento antidumping relativo a la importación de bobinas de cintas de vídeo
    originarias de la República de Corea
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 1768/89 av den 19 juni 1989 om införande
    av en slutgiltig antidumpningstull på import av videokassetter med ursprung i
    Korea och Hongkong, om slutgiltigt uttag av preliminär tull och om avslutning
    av antidumpningsförfarandet beträffande import av videoband på spolar med ursprung
    i Korea
  type: main
