id: EURegulation2020526
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/526 of 15 April 2020 re-imposing
    a definitive countervailing duty on imports of tubes and pipes of ductile cast
    iron (also known as spheroidal graphite cast iron) originating in India as regards
    Jindal Saw Limited following the judgment of the General Court in T-300/16
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/526 de la Commission du 15 avril 2020
    réinstituant un droit compensateur définitif sur les importations de tubes et
    de tuyaux en fonte ductile (également dénommée «fonte à graphite sphéroïdal»)
    originaires de l’Inde en ce qui concerne Jindal Saw Limited, à la suite de
    l’arrêt du Tribunal dans l’affaire T‐300/16
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/526 der Kommission vom 15. April 2020
    zur Wiedereinführung eines endgültigen Ausgleichszolls auf die Einfuhren von
    Rohren aus duktilem Gusseisen (auch bekannt als Gusseisen mit Kugelgrafit) mit
    Ursprung in Indien in Bezug auf Jindal Saw Limited nach dem Urteil des Gerichts
    in der Rechtssache T-300/16
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/526 на Комисията
    от 15 април 2020 година за повторно налагане на
    окончателно изравнително мито върху вноса
    на тръби от пластичен чугун (наричан също сферографитен
    чугун) с произход от Индия по отношение на Jindal
    Saw Limited след решението на Общия съд по дело T-300/16
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/526 ze dne 15. dubna 2020, kterým
    se opětovně ukládá konečné vyrovnávací clo na dovoz trub a trubek z tvárné
    litiny (známé také jako litina s kuličkovým grafitem) pocházejících z
    Indie, pokud jde o společnost Jindal Saw Limited, v návaznosti na rozsudek Tribunálu
    ve věci T-300/16
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/526 af 15. april 2020
    om genindførelse af en endelig udligningstold på importen af visse rør af duktilt
    støbejern (også kendt som kuglegrafitstøbejern) med oprindelse i Indien for
    så vidt angår Jindal Saw Limited som følge af Rettens dom i sag T-300/16
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2020/526 της Επιτροπής
    της 15ης Απριλίου 2020 για την εκ νέου επιβολή
    οριστικού αντισταθμιστικού δασμού στις εισαγωγές
    σωλήνων κάθε είδους από όλκιμο χυτοσίδηρο
    (που είναι επίσης γνωστός ως χυτοσίδηρος σφαιροειδούς
    γραφίτη), καταγωγής Ινδίας, όσον αφορά την Jindal
    Saw Limited, μετά την απόφαση του Γενικού Δικαστηρίου
    στην υπόθεση T-300/16
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2020/526, 15. aprill 2020, millega kehtestatakse
    uuesti lõplik tasakaalustav tollimaks Indiast pärit keragrafiitmalmist (kõrgtugevast
    malmist) torude impordi suhtes äriühingule Jindal Saw Limited vastavalt Üldkohtu
    otsusele kohtuasjas T-300/16
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2020/526, annettu 15 päivänä
    huhtikuuta 2020, lopullisen tasoitustullin ottamisesta uudelleen käyttöön Intiasta
    peräisin olevien pallografiittiraudasta (tunnetaan myös nimellä pallografiittivalurauta)
    valmistettujen putkien tuonnissa Jindal Saw Limitedin osalta unionin yleisen tuomioistuimen
    asiassa T-300/16 antaman tuomion perusteella
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/526 оd 15. travnja 2020. o ponovnom
    uvođenju konačne kompenzacijske pristojbe na uvoz cijevi od duktilnog lijevanog
    željeza (poznato i kao sferoidno grafitno lijevano željezo) podrijetlom iz Indije
    u pogledu društva Jindal Saw Limited na temelju presude Općeg suda u predmetu
    T‐300/16
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/526 végrehajtási rendelete (2020. április 15.)
    a Törvényszék T-300/16. sz. ügyben hozott ítéletét követően az Indiából
    származó alakítható öntöttvasból (más néven gömbgrafitos öntöttvasból)
    készült csövek behozatalára vonatkozó végleges kiegyenlítő vámnak a Jindal
    Saw Limited tekintetében történő ismételt kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/526 della Commissione del 15 aprile
    2020 che istituisce nuovamente un dazio compensativo definitivo sulle importazioni
    di tubi di ghisa duttile (detta anche ghisa a grafite sferoidale) originari dell’India
    per quanto concerne Jindal Saw Limited a seguito della sentenza del Tribunale
    nella causa T-300/16
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/526 (2020. gada 15. aprīlis),
    ar ko pēc Vispārējās tiesas sprieduma lietā T-300/16 atkārtoti nosaka galīgo
    kompensācijas maksājumu Indijas izcelsmes plastiskā čuguna (saukta arī par
    čugunu ar lodveida grafītu) cauruļu un caurulīšu importam attiecībā uz
    Jindal Saw Limited
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/526 2020 m. balandžio 15
    d. kuriuo, atsižvelgiant į Bendrojo Teismo sprendimą byloje T-300/16, importuojamiems
    Indijos kilmės kaliojo ketaus (dar vadinamo ketumi su rutuliniu grafitu) vamzdžiams
    ir vamzdeliams, pagamintiems bendrovės „Jindal Saw Limited“, vėl nustatomas
    galutinis kompensacinis muitas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/526 tal-15
    ta’ April 2020 li jimponi mill-ġdid dazju kumpensatorju definittiv fuq l-importazzjonijiet
    ta’ tubi u pajpijiet tal-ħadid fondut duttili (magħruf ukoll bħala grafit
    tal-ħadid fondut sferojdali) li joriġinaw mill-Indja fir-rigward ta’ Jindal
    Saw Limited wara s-sentenza tal-Qorti Ġenerali f’T-300/16
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/526 van de Commissie van 15 april 2020
    tot het opnieuw instellen van een definitief compenserend recht op buizen en pijpen
    van nodulair gietijzer (eveneens bekend als gietijzer met bolgrafiet), van oorsprong
    uit India, wat Jindal Saw Limited betreft, naar aanleiding van het arrest van
    het Gerecht in zaak T-300/16
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2020/526 z dnia 15 kwietnia 2020
    r. ponownie nakładające ostateczne cło wyrównawcze na przywóz rur i przewodów
    rurowych z żeliwa ciągliwego (zwanego także żeliwem sferoidalnym) pochodzących
    z Indii w odniesieniu do Jindal Saw Limited w związku z wyrokiem Sądu w sprawie
    T-300/16
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2020/526 da Comissão de 15 de abril de
    2020 que reinstitui um direito de compensação definitivo sobre as importações
    de tubos de ferro fundido dúctil (também conhecido como ferro fundido com grafite
    esferoidal) originários da Índia, no que diz respeito à Jindal Saw Limited,
    na sequência do acórdão do Tribunal Geral no processo T-300/16
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/526 al Comisiei din 15 aprilie
    2020 de reinstituire a unei taxe compensatorii definitive asupra importurilor
    de tuburi și țevi din fontă ductilă (cunoscută și sub denumirea de fontă
    cu grafit sferoidal) originare din India în ceea ce privește Jindal Saw Limited,
    ca urmare a hotărârii Tribunalului în cauza T-300/16
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/526 z 15. apríla 2020, ktorým
    sa v nadväznosti na rozsudok Všeobecného súdu vo veci T-300/16 opätovne ukladá
    konečné vyrovnávacie clo na dovoz rúr a rúrok z tvárnej liatiny (tiež známej
    ako liatina s guľôčkovým grafitom) s pôvodom v Indii, pokiaľ ide o spoločnosť
    Jindal Saw Limited
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2020/526 z dne 15. aprila 2020 o ponovni
    uvedbi dokončne izravnalne dajatve na uvoz cevi iz nodularnega litega železa
    (imenovanega tudi sferoidno grafitno lito železo) s poreklom iz Indije za družbo
    Jindal Saw Limited po sodbi Splošnega sodišča v zadevi T-300/16
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2020/526 de la Comisión de 15 de abril de
    2020 por el que se restablece un derecho compensatorio definitivo sobre las importaciones
    de tubos de hierro de fundición maleable (también conocida como fundición de
    grafito esferoidal) originarios de la India en lo que respecta a Jindal Saw Limited
    a raíz de la sentencia del Tribunal General en el asunto T-300/16
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2020/526 av den 15 april 2020
    om återinförande av en slutgiltig utjämningstull på import av rör av duktilt
    gjutjärn (även kallat gjutjärn med sfäroidiserad grafit) med ursprung i Indien
    när det gäller Jindal Saw Limited till följd av tribunalens dom i mål T-300/16
