title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1245/90 of 8 May 1990 reintroducing the
    levying of the customs duties applicable to footwear of the CN codes 6404 and
    6405 90 10 (order No 10.0680) originating in Thailand, to which the preferential
    arrangements of Council Regulation (EEC) No 3895/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1245/90 de la Commission du 8 mai 1990 portant rétablissement
