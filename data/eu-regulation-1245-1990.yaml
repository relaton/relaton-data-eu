    6404 et 6405 90 10 (numéro d'ordre 10.0680) originaires de la Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1245/90 DER KOMMISSION vom 8. Mai 1990 zur Wiedereinfuehrung
