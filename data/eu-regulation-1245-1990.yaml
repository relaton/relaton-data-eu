    Nummer 10.0680) mir Ursprung in Thailand, dem die in der Verordnung (EWG) Nr.
    3896/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1245/90 af 8. maj 1990 om genindførelse
