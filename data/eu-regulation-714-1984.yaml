    (ΕΟΚ) αριθ. 91/84 και περί ενάρξεως διαρκούς δημοπρασίας
    για την εξαγωγή 900 000 τόνων μαλακού αρτοποιήσιμου
    σίτου που έχει στη διάθεσή του ο γαλλικός οργανισμός
    παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 714/84 della Commissione, del 16 marzo 1984, che modifica
