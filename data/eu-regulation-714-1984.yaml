title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 714/84 of 16 March 1984 amending Regulation
    (EEC) No 91/84 and increasing to 900 000 tonnes the quantity of bread-making wheat
    held by the French intervention agency for which a standing invitation to tender
    for export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 714/84 de la Commission, du 16 mars 1984, modifiant
    le règlement (CEE) n 91/84 et portant à 900 000 tonnes l'adjudication permanente
    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 714/84 der Kommission vom 16. März 1984 zur Änderung
    der Verordnung (EWG) Nr. 91/84 und zur Erhöhung der Dauerausschreibung zur Ausfuhr
    von im Besitz der französischen Interventionsstelle befindlichem Brotweizen auf
    900 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 714/84 af 16. marts 1984 om ændring
    af forordning (EØF) nr. 91/84 og om forhøjelse til 900 000 tons af den løbende
    licitation med henblik på eksport af bageegnet blød hvede, som er i det franske
    interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
