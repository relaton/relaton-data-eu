title:
- language: en
  script: Latn
  content: '93/682/EC: Commission Decision of 17 December 1993 amending for the third
    time Decision 93/197/EEC on animal health conditions and veterinary certification
    for imports of registered equidae and equidae for breeding and production'
  type: main
- language: fr
  script: Latn
  content: '93/682/CE: Décision de la Commission du 17 décembre 1993 modifiant pour
    la troisième fois la décision 93/197/CEE relative aux conditions sanitaires
    et à la certification sanitaire requises pour les importations d''équidés enregistrés
    ainsi que d''équidés d''élevage et de rente'
  type: main
- language: de
  script: Latn
  content: '93/682/EG: Entscheidung der Kommission vom 17. Dezember 1993 zur dritten
    Änderung der Entscheidung 93/197/EWG über die tierseuchenrechtlichen Bedingungen
    und die Beurkundung für die Einfuhr von registrierten Equiden sowie Zucht- und
    Nutzequiden'
  type: main
- language: bg
