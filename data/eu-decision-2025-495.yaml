    engedélyezésével kapcsolatban a belga szövetségi közegészségügyi, élelmiszerlánc-biztonsági
    és környezetvédelmi hivatal által az 528/2012/EU európai parlamenti és tanácsi
    rendelettel összhangban hozott intézkedés meghosszabbításáról
  type: main
