title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/495 of 17 March 2025 concerning
    the extension of the action taken by the Belgian Federal Public Service Health,
    Food Chain Safety and Environment permitting the making available on the market
    and use of the biocidal product Interox SG 35 Plus in accordance with Regulation
    (EU) No 528/2012 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/495 de la Commission du 17 mars 2025
    concernant la prorogation de la mesure prise par le service public fédéral belge
    Santé publique, Sécurité de la Chaîne alimentaire et Environnement autorisant
    la mise à disposition sur le marché et l’utilisation du produit biocide Interox
    SG 35 Plus conformément au règlement (UE) no 528/2012 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/495 der Kommission vom 17. März 2025
