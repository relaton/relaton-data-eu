    tehničkih standarda kojima se pobliže utvrđuju kategorije instrumenata koji
    adekvatno odražavaju kreditnu kvalitetu investicijskog društva koje trajno posluje
    i mogući alternativni aranžmani primjereni za primjenu za potrebe varijabilnih
    primitaka
  type: main
- language: hu
  script: Latn
