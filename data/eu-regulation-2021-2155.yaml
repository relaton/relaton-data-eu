    pokud jde o regulační technické normy, jimiž se upřesňují třídy nástrojů,
    které odpovídajícím způsobem odrážejí úvěrovou kvalitu investičního
    podniku při jeho trvání a možné alternativní způsoby, jež jsou vhodné
    k použití pro účely pohyblivé složky odměny
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/2155 af 13. august 2021 om
