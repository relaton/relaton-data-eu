    de instrumentos que refletem adequadamente a qualidade do crédito da empresa
    de investimento numa perspetiva de continuidade das operações e possíveis mecanismos
    alternativos que são apropriados para utilização para efeitos de remuneração
    variável
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/2155 al Comisiei din 13 august 2021 de completare
