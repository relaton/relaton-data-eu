    отразяват адекватно кредитното качество на
    инвестиционния посредник като действащо предприятие,
    и възможните алтернативни мерки, които са подходящи,
    за да бъдат използвани за целите на променливите
    възнаграждения
  type: main
- language: cs
  script: Latn
