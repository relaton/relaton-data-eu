    o regulačné technické predpisy, ktorými sa spresňujú triedy nástrojov,
    ktoré primerane odrážajú kreditnú kvalitu investičnej spoločnosti pri pokračovaní
    činnosti, a možné alternatívne opatrenia, ktoré sú vhodné na používanie
    na účely pohyblivej zložky odmeňovania
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/2155 z dne 13. avgusta 2021 o dopolnitvi
