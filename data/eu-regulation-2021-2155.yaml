title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/2155 of 13 August 2021 supplementing
    Directive (EU) 2019/2034 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the classes of instruments that adequately
    reflect the credit quality of the investment firm as a going concern and possible
    alternative arrangements that are appropriate to be used for the purposes of variable
    remuneration
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/2155 de la Commission du 13 août 2021
    complétant la directive (UE) 2019/2034 du Parlement européen et du Conseil en
    ce qui concerne les normes techniques de réglementation relatives à la détermination
    des catégories d’instruments qui reflètent de manière appropriée la qualité
    de crédit de l’entreprise d’investissement en continuité d’exploitation
    et les autres dispositifs possibles qui sont destinés à être utilisés aux
    fins de la rémunération variable
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/2155 der Kommission vom 13. August 2021
    zur Ergänzung der Richtlinie (EU) 2019/2034 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Bestimmung der Klassen von
    Instrumenten, die die Bonität einer Wertpapierfirma unter der Annahme der Unternehmensfortführung
    angemessen widerspiegeln, sowie zur Bestimmung möglicher alternativer Regelungen,
    die für eine Verwendung zu Zwecken der variablen Vergütung geeignet sind
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/2155 на Комисията
