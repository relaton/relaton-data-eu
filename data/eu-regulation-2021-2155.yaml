    for så vidt angår reguleringsmæssige tekniske standarder til præcisering af
    de kategorier af instrumenter, der i tilstrækkelig grad afspejler et investeringsselskabs
    kreditkvalitet som en going concern, og mulige alternative ordninger, som egner
    sig til at blive anvendt for så vidt angår variabel løn
