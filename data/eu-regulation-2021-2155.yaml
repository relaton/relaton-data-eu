    ce privește standardele tehnice de reglementare în care sunt precizate clasele
    de instrumente care reflectă în mod adecvat calitatea creditului firmei de investiții
    în condiții de continuitate a activității și posibilele mecanisme alternative
    care sunt adecvate pentru a fi utilizate în scopul remunerației variabile
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/2155 z 13. augusta 2021, ktorým
