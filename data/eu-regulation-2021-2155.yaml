  script: Latn
  content: Regolamento delegato (UE) 2021/2155 della Commissione del 13 agosto 2021
    che integra la direttiva (UE) 2019/2034 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione relative alla specificazione
    delle categorie di strumenti che rispecchiano in modo adeguato la qualità del
    credito dell’impresa di investimento in situazione di continuità aziendale
    e i possibili dispositivi alternativi adeguati per essere utilizzati ai fini della
    remunerazione variabile
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/2155 (2021. gada 13. augusts), ar
