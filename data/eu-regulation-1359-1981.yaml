  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1359/81 della Commissione, del 20 maggio 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli orologi, pendole,
    sveglie e simili apparecchi di orologeria, con movimento diverso da quello degli
    orologi tascabili, della voce doganale 91.04, originari di Hong Kong beneficiario
    delle preferenze tariffajie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1359/81 van de Commissie van 20 mei 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op klokken, pendules,
    wekkers en dergelijke artikelen met ander uurwerk dan horlogeuurwerk, van postonderverdeling
    91.04, van oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3322/80
    van de Raad vermelde tariefpreferenties zijn verleend
