    τών δασμών γιά ωρολόγια μεγάλα, εκκρεμή, εγερτήρια
    καί παρομοίας συσκευάς ωρολογοποιίας μέ μηχανισμόν
    διάφορον τού τών ωρολογίων λακίου, τής δασμολογικής
    κλάσεως 91. 04, καταγωγής Χόνγκ Κόνγκ, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (ΕΟΚ) αριθ.
