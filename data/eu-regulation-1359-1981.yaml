title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1359/81 of 20 May 1981 reintroducing the
    levying of customs duties applicable to other clocks falling within subheading
    91.04, originating in Hong Kong and benefiting from the tariff preferences provided
    for by Council Regulation (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1359/81 de la Commission, du 20 mai 1981, portant
    rétablissement de la perception des droits de douane applicables aux horloges,
    pendules, réveils et appareils d' horlogerie similaires à mouvement autre que
    de montre, de la position 91.04 du tarif douanier commun, originaires de Hong-kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1359/81 der Kommission vom 20. Mai 1981 zur Wiedereinführung
    der Erhebung der Zölle für andere Uhren der Tarifnummer 91.04 mit Ursprung in
    Hongkong, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1359/81 af 20. maj 1981 om genindførelse
    af opkrævning af told for andre ure, henhørende under pos. 91.04 og med oprindelse
    i Hongkong, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1359/81 τής Επιτροπής
