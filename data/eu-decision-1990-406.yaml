title:
- language: en
  script: Latn
  content: '90/406/EEC: Council Decision of 27 July 1990 on the conclusion of an Agreement
    in the form of an exchange of letters concerning the provisional application of
    the Protocol establishing for the period from 1 July 1990 to 30 June 1993 the
    fishing rights and financial compensation provided for in the Agreement between
    the European Economic Community and the Government of the Republic of the Gambia
    on fishing off the Gambia'
  type: main
- language: fr
  script: Latn
  content: '90/406/CEE: Décision du Conseil du 27 juillet 1990 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Gambie concernant la pêche au large de la Gambie, pour la
    période du 1er juillet 1990 au 30 juin 1993'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DES RATES vom 27. Juli 1990 ueber den Abschluss des Abkommens
    in Form eines Briefwechsels ueber die vorlaeufige Anwendung des Protokolls zur
    Festsetzung der Fangmoeglichkeiten und des finanziellen Ausgleichs nach dem Abkommen
    zwischen der Europaeischen Wirtschaftsgemeinschaft und der Regierung der Republik
    Gambia ueber die Fischerei vor der Kueste Gambias fuer die Zeit vom 1. Juli 1990
    bis zum 30. Juni 1993 (90/406/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS AFGOERELSE af 27. juli 1990 om indgaaelse af aftalen i form af
    brevveksling om midlertidig anvendelse af protokollen om fastsaettelse af de fiskerimuligheder
    og den finansielle godtgoerelse, der er omhandlet i aftalen mellem Det Europaeiske
    OEkonomiske Faellesskab og regeringen for Republikken Gambia om fiskeri ud for
    Gambia, for perioden 1. juli 1990 til 30. juni 1993 (90/406/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/406/EOK: Απόφαση του Συμβουλίου της 27ης Ιουλίου
    1990 περί συνάψεως συμφωνίας υπό μορφήν ανταλλαγής
    επιστολών, σχετικά με την προσωρινή εφαρμογή
    του πρωτοκόλλου που καθορίζει τις δυνατότητες
    αλιείας και τη χρηματοδοτική αντιστάθμιση
    που προβλέπονται στη συμφωνία μεταξύ της Ευρωπαϊκής
    Οικονομικής Κοινότητας και της κυβέρνησης
    της Δημοκρατίας της Γκάμπια σχετικά με την
    αλιεία στα ανοικτά της Γκάμπια, για την περίοδο
    από 1ης Ιουλίου 1990 έως 30 Ιουνίου 1993'
  type: main
- language: it
  script: Latn
  content: DECISIONE DEL CONSIGLIO del 27 luglio 1990 concernente la conclusione dell'accordo
    in forma di scambio di lettere relativo all'applicazione provvisoria del protocollo
    che fissa le possibilità di pesca e la compensazione finanziaria previste nell'accordo
    tra la Comunità economica europea ed il governo della Repubblica della Gambia
    sulla pesca al largo della Gambia, per il periodo dal 1o luglio 1990 al 30 giugno
    1993 (90/406/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE RAAD van 27 juli 1990 betreffende de sluiting van de Overeenkomst
    in de vorm van een briefwisseling inzake de voorlopige toepassing van het Protocol
    tot vaststelling van de voor de periode van 1 juli 1990 tot en met 30 juni 1993
    geldende visserijrechten en de financiële compensatie, als bedoeld in de Overeenkomst
    tussen de Europese Economische Gemeenschap en de Regering van de Republiek Gambia
    inzake de visserij voor de kust van Gambia (90/406/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DO CONSELHO de 27 de Julho de 1990 relativa à celebraçao do Acordo
    sob forma de Troca de Cartas relativo à aplicaçao provisoria do Protocolo que
    fixa as possibilidades de pesca e a compensaçao financeira previstas no Acordo
    entre a Comunidade Economica Europeia e o Governo da Republica da Gâmbia respeitante
    à pesca ao largo da Gâmbia, para o periodo compreendido entre 1 de Julho de
    1990 e 30 de Junho de 1993 (90/406/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DEL CONSEJO de 27 de julio de 1990 relativa a la celebracion del
    Acuerdo en forma de Canje de Notas sobre la aplicacion provisional del Protocolo
    por el que se fijan las posibilidades de pesca y la compensacion financiera previstas
    en el Acuerdo entre la Comunidad Economica Europea y el Gobierno de la Republica
    de Gambia relativo a la pesca de altura frente a la costa de Gambia para el periodo
    del 1 de julio de 1990 al 30 de junio de 1993 (90/406/CEE)
