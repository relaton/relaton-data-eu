title:
- language: fr
  script: Latn
  content: Décision du Conseil du 29 février 1968, portant ouverture, répartition
    et mode de gestion du contingent tarifaire communautaire de ferrochrome contenant
    en poids jusqu'à 0,1 % de carbone et plus de 30 jusqu'à 90 % inclus de chrome
    (ferrochrome surraffiné) de la position Ex 73.02 E I du Tarif douanier commun
  type: main
- language: de
  script: Latn
  content: '68/134/EWG: Entscheidung des Rates vom 29. Februar 1968 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Ferrochrom mit
    einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und an
    Chrom von mehr als 30, doch nicht mehr als 90 Gewichtshundertteilen (hochraffiniertes
    Ferrochrom) der Tarifnummer ex 73.02 E I des Gemeinsamen Zolltarifs'
  type: main
- language: it
  script: Latn
  content: '68/134/CEE: Decisione del Consiglio, del 29 febbraio 1968, relativa all''apertura,
    alla suddivisione ed alle modalità di gestione del contingente tariffario comunitario
    di ferro-cromo contenente, in peso, sino allo 0,1 % di carbonio e da oltre il
    30 sino al 90 % incluso, di cromo (ferro-cromo superraffinato) della voce ex 73.02
    E I della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '68/134/EEG: Beschikking van de Raad van 29 februari 1968 houdende opening,
    verdeling en wijze van beheer van het communautaire tariefcontingent voor ferrochroom,
    bevattende ten hoogste 0,1 gewichtspercent koolstof en meer dan 30 doch niet meer
    dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom), van post ex 73.02
    E I van het gemeenschappelijk douanetarief'
  type: main
