  content: COMMISSION REGULATION (EEC) No 2023/93 of 26 July 1993 amending Regulation
    (EEC) No 2175/92 laying down detailed rules for the application of the specific
    measures for the supply of processed fruit and vegetables to the Canary Islands
    in particular to determine the forecast supply balance for the period 1 July 1993
    to 30 June 1994
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2023/93 de la Commission du 26 juillet 1993 modifiant
    le règlement (CEE) n° 2175/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement des îles Canaries en produits du secteur des fruits
    et légumes transformés, et déterminant notamment le bilan d'approvisionnement
    pour la période du 1er juillet 1993 au 30 juin 1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2023/93 DER KOMMISSION vom 26. Juli 1993 zur Änderung
    der Verordnung (EWG) Nr. 2175/92 mit Durchführungsbestimmungen zur Sonderregelung
    für die Versorgung der Kanarischen Inseln mit Verarbeitungserzeugnissen aus Obst
    und Gemüse, insbesondere zur Errichtung der Versorgungsbilanz, für den Zeitraum
    vom 1. Juli 1993 bis 30. Juni 1994
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2023/93 af 26. juli 1993 om ændring
    af forordning (EØF) nr. 2175/92 om gennemførelsesbestemmelser for den særlige
    forsyningsordning for De Kanariske Øer vedrørende forarbejdede frugt- og grønsagsprodukter,
    og fastsættelse af den foreløbige forsyningsopgørelse for så vidt angår perioden
    1. juli 1993 til 30. juni 1994
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2023/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 26ης Ιουλίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2175/92 όσον αφορά τις λεπτομέρειες
    εφαρμογής του ειδικού καθεστώτος για τον εφοδιασμό
    των Καναρίων Νήσων με προϊόντα του τομέα των
