    καθορισμό του ισοζυγίου εφοδιασμού για την
    περίοδο από 1ης Ιουλίου 1993 έως 30 Ιουνίου 1994
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2023/93 DELLA COMMISSIONE del 26 luglio 1993 recante
    modifica del regolamento (CEE) n. 2175/92 relativo alle modalità di applicazione
    del regime specifico di approvvigionamento di prodotti trasformati a base di ortofrutticoli
    per le isole Canarie, e che stabilisce in particolare il bilancio di approvvigionamento
    per il periodo dal 1o luglio 1993 al 30 giugno 1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2023/93 VAN DE COMMISSIE van 26 juli 1993 tot aanpassing
    van Verordening (EEG) nr. 2175/92 houdende bepalingen ter uitvoering van de specifieke
    regeling voor de voorziening van de Canarische eilanden met produkten van de sector
    verwerkte groenten en fruit, en ter vaststelling van de voorzieningsbalans voor
    de periode van 1 juli 1993 tot en met 30 juni 1994 in het bijzonder
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 2023/93 DA COMISSÃO de 26 de Julho de 1993 que altera,
    em relação ao período compreendido entre 1 de Julho de 1993 e 30 de Junho de
    1994, o Regulamento (CEE) no 2175/92, que estabelece normas de execução do regime
    específico de abastecimento das ilhas Canárias em produtos do sector dos produtos
    transformados à base de frutas e produtos hortícolas e determinando, nomeadamente,
    a estimativa de abastecimento
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2023/93 DE LA COMISIÓN de 26 de julio de 1993 por
    el que se modifica el Reglamento (CEE) no 2175/92 por el que se establecen disposiciones
    de aplicación del régimen especial de abastecimiento a las islas Canarias de
    productos del sector de las frutas y hortalizas transformadas y determinando especialmente
    los planes de abastecimiento para el período del 1 de julio de 1993 al 30 de
    junio de 1994
