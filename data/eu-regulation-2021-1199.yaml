  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1199 rendelete (2021. július 20.) az 1907/2006/EK
    európai parlamenti és tanácsi rendelet XVII. mellékletének a műfüves pályák
    töltőanyagaként granulátumokban vagy mulcsokban, illetve játszótereken és
    sportpályákon ömlesztett formában használt policiklikus aromás szénhidrogének
    (PAH-k) tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2021/1199 della Commissione del 20 luglio 2021 che modifica
    l’allegato XVII del regolamento (CE) n. 1907/2006 del Parlamento europeo e del
    Consiglio per quanto riguarda gli idrocarburi policiclici aromatici (IPA) presenti
    nei granuli o nel pacciame utilizzati come materiale da intaso nei campi sportivi
    in erba sintetica o in forma sfusa nei parchi giochi o in applicazioni sportive
  type: main
- language: lv
  script: Latn
