    und des Rates in Bezug auf polyzyklische aromatische Kohlenwasserstoffe (PAK)
    in Granulaten oder Mulchen zur Verwendung als Füllmaterial auf Kunstrasenplätzen
    oder in loser Form auf Spielplätzen oder im Sportbereich
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2021/1199 на Комисията от 20 юли
