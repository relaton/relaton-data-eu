title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2021/1199 of 20 July 2021 amending Annex XVII
    to Regulation (EC) No 1907/2006 of the European Parliament and of the Council
    as regards polycyclic-aromatic hydrocarbons (PAHs) in granules or mulches used
    as infill material in synthetic turf pitches or in loose form on playgrounds or
    in sport applications
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2021/1199 de la Commission du 20 juillet 2021 modifiant
    l’annexe XVII du règlement (CE) no 1907/2006 du Parlement européen et du Conseil
    en ce qui concerne les hydrocarbures aromatiques polycycliques (HAP) dans les
    granulés ou paillis utilisés comme matériau de remplissage dans les pelouses
    en gazon synthétique ou, dans leurs formes en vrac, sur les aires de jeux ou
    pour des applications sportives
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2021/1199 der Kommission vom 20. Juli 2021 zur Änderung
