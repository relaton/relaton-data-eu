    farines et modifiant le mode de leur application pour certaines marchandises relevant
    de la position tarifaire 19.03
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1743/78 der Kommission vom 25. Juli 1978 zur Einführung
