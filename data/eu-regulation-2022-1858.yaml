- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1858 of 10 June 2022 supplementing
    Regulation (EU) No 648/2012 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the procedures for the reconciliation
    of data between trade repositories and the procedures to be applied by the trade
    repository to verify the compliance by the reporting counterparty or submitting
    entity with the reporting requirements and to verify the completeness and correctness
    of the data reported
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1858 de la Commission du 10 juin 2022 complétant
    le règlement (UE) no 648/2012 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les procédures de rapprochement des
    données entre référentiels centraux et les procédures à appliquer par le
    référentiel central pour vérifier le respect des obligations de déclaration
    par la contrepartie déclarante ou par l’entité qui soumet la déclaration
    et pour vérifier l’exhaustivité et l’exactitude des données déclarées
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1858 der Kommission vom 10. Juni 2022 zur
    Ergänzung der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards, in denen die Verfahren für den
    Datenabgleich zwischen Transaktionsregistern und die vom Transaktionsregister
    anzuwendenden Verfahren zur Überprüfung der Einhaltung der Meldepflichten durch
    die meldende Gegenpartei oder die einreichende Stelle sowie zur Überprüfung
    der Vollständigkeit und Richtigkeit der gemeldeten Daten festgelegt werden
  type: main
- language: bg
  script: Cyrl
