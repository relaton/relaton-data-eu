    Uredbe (EU) št. 648/2012 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi, ki določajo postopke za usklajevanje podatkov med repozitoriji
    sklenjenih poslov, postopke, ki jih repozitoriji sklenjenih poslov uporabljajo
    za preverjanje, ali nasprotna stranka poročevalka oz. subjekt poročevalec izpolnjuje
    zahteve glede poročanja in ali so sporočeni podatki popolni in točni
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/1858 de la Comisión de 10 de junio de 2022
    por el que se completa el Reglamento (UE) n.o 648/2012 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    los procedimientos para la conciliación de datos entre los registros de operaciones
    y los procedimientos que debe aplicar el registro de operaciones para verificar
    el cumplimiento de los requisitos de notificación por la contraparte notificante
    o la entidad remitente y para verificar que los datos notificados sean completos
    y correctos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1858 av den 10 juni 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 648/2012
    vad gäller tekniska tillsynsstandarder som specificerar förfarandena för avstämning
    av uppgifter mellan transaktionsregister och de förfaranden som ska tillämpas
    av transaktionsregistret för att kontrollera att den rapporterande motparten
    eller den inlämnande enheten uppfyller rapporteringskraven och för att kontrollera
    att de rapporterade uppgifterna är fullständiga och korrekta
