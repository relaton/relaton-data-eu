  script: Latn
  content: Regolamento delegato (UE) 2022/1858 della Commissione del 10 giugno 2022
    che integra il regolamento (UE) n. 648/2012 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano le procedure
    per la riconciliazione dei dati tra i repertori di dati sulle negoziazioni e le
    procedure che i repertori di dati sulle negoziazioni devono applicare per verificare
    che la controparte segnalante o il soggetto che trasmette la segnalazione rispettino
    gli obblighi di segnalazione e per verificare la completezza e la correttezza
    dei dati segnalati
  type: main
