    ide o regulačné technické normy, ktorými sa stanovujú postupy zosúlaďovania
    údajov medzi archívmi obchodných údajov a postupy, ktoré má uplatňovať
    archív obchodných údajov s cieľom overiť dodržiavanie požiadaviek na ohlasovanie
    zo strany ohlasujúcej protistrany alebo predkladajúceho subjektu a s cieľom
    overiť úplnosť a správnosť ohlasovaných údajov
  type: main
- language: sl
  script: Latn
