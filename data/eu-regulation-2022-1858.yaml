  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/1858 ze dne 10. června
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    648/2012, pokud jde o regulační technické normy, které blíže určují postupy
    sesouhlasování údajů mezi registry obchodních údajů a postupy, které registr
    obchodních údajů používá k ověření dodržení požadavků na oznamování
    oznamující smluvní stranou nebo subjektem předkládajícím zprávy a k ověření
    úplnosti a správnosti oznámených údajů
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1858 af 10. juni 2022 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 648/2012
    for så vidt angår reguleringsmæssige tekniske standarder til præcisering af
    procedurerne for afstemning af data mellem transaktionsregistre og de procedurer,
    som transaktionsregistret skal anvende for at kontrollere, at den indberettende
    modpart eller den indberettende enhed opfylder indberetningskravene, og for at
    kontrollere, at de indberettede data er fuldstændige og korrekte
