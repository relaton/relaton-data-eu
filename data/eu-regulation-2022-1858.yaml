    w odniesieniu do regulacyjnych standardów technicznych określających procedury
    uzgadniania danych między repozytoriami transakcji i procedury, które repozytorium
    transakcji ma stosować w celu weryfikacji spełnienia przez kontrahenta dokonującego
    zgłoszenia lub podmiot przekazujący zgłoszenie wymogów dotyczących zgłaszania
    oraz w celu weryfikacji kompletności i poprawności zgłaszanych danych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/1858 da Comissão de 10 de junho de 2022
    que complementa o Regulamento (UE) n.o 648/2012 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação que especificam os
    procedimentos de conciliação de dados entre repositórios de transações e
    os procedimentos a aplicar pelos repositórios de transações para verificar
    o cumprimento, pela contraparte que comunica informações ou pela entidade que
    apresenta a comunicação de informações, dos requisitos de comunicação de
    informações, assim como a completude e exatidão dos dados comunicados
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1858 al Comisiei din 10 iunie 2022 de completare
    a Regulamentului (UE) nr. 648/2012 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare în care sunt precizate
    procedurile de reconciliere a datelor între registrele centrale de tranzacții
    și procedurile care trebuie aplicate de registrul central de tranzacții pentru
    a verifica respectarea cerințelor de raportare de către contrapartea care efectuează
    raportarea sau entitatea care transmite raportul și pentru a verifica exhaustivitatea
    și corectitudinea datelor raportate
  type: main
