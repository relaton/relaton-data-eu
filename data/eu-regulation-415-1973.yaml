id: EURegulation4151973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 415/73 of the Commission of 14 February 1973 on the
    restoration of Common Customs Tariff duties on outer garments and other articles,
    knitted or crocheted, not elastic or rubberized, of cotton, of subheadings 60.05
    A ex II, ex B, originating in developing countries covered by the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2764/72 of 19 December
    1972
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 415/73 de la Commission, du 14 février 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessus, accessoires du vêtement et autres articles de bonneterie
    non élastique ni caoutchoutée, en tissus de coton, des sous-positions tarifaires
    60.05 A ex II et ex B, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2764/72 du Conseil
    du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 415/73 der Kommission vom 14. Februar 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Oberkleidung,
    Bekleidungszubehör und andere Wirkwaren, weder gummielastisch noch kautschutiert,
    aus Baumwolle, der Tarifstellen 60.05 A ex II, ex B, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2764/72 des Rates vom 19. Dezember 1972
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 415/73 af 14. februar 1973 om genindførelse
    af tolden ifølge den fælles toldtarif om yderbeklædingsgenstande og andre varer
    af trikotage, ikke elastisk eller gummeret, af bomuld, underpositioner 60.05 A
    ex II, ex B, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2764/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 415/73 della Commissione, del 14 febbraio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    indumenti esterni, accessori di abbigliamento ed altri manufatti, a maglia non
    elastica né gommata, delle sottovoci doganali nn. 60.05 A ex II ed ex B, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2764/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 415/73 van de Commissie van 14 februari 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op bovenkleding, kledingtoebehoren en andere artiklen van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, van onderverdeling 60.05 A ex II en
    ex B, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 2764/72 van de Raad van 19 december 1972 algemene tariefpreferenties
    werden geopend
  type: main
