title:
- language: en
  script: Latn
  content: '87/393/EEC: Commission Decision of 1 July 1987 requiring Italy to rescind
    the measures taken to protect itself against the introduction of harmful organisms
    associated with fresh cultivated mushrooms (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/393/CEE: Décision de la Commission du 1er juillet 1987 invitant l''Italie
    à révoquer les mesures prises en vue de se préserver contre l''introduction
    d''organismes nuisibles associés avec des champignons cultivés frais (Le texte
    en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/393/EWG: Entscheidung der Kommission vom 1. Juli 1987 zur Aufforderung
    Italiens, die Maßnahmen aufzuheben, die es zum Schutz gegen die Einschleppung
    von Schadorganismen in Verbindung mit frischen Zuchtpilzen getroffen hat (Nur
    der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/393/EØF: Kommissionens beslutning af 1. juli 1987 om opfordring af
    Italien til at ophæve de foranstaltninger, der er truffet for at beskytte mod
    indslæbningen af skadegørere på friske dyrkede svampe (Kun den italienske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/393/ΕΟΚ: Απόφαση της Επιτροπής της 1ης Ιουλίου
    1987 με την οποία καλείται η Ιταλία να ανακαλέσει
    τα μέτρα που έλαβε για να προστατευθεί από
    την εισαγωγή επιβλαβών οργανισμών που έχουν
    σχέση με τα μανιτάρια (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/393/CEE: Decisione della Commissione del 1 luglio 1987 che invita l''Italia
    a revocare le misure adottate al fine di premunirsi contro l''introduzione di
    organismi nocivi associati a funghi coltivati freschi (Il testo in lingua italiana
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/393/EEG: Beschikking van de Commissie van 1 juli 1987 waarbij Italië
    wordt verzocht de beschermende maatregelen tegen het binnenbrengen van met verse
    gekweekte paddestoelen geassocieerde schadelijke organismen in te trekken (Slechts
    de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/393/CEE: Decisão da Comissão de 1 de Julho de 1987 que convida a
    Itália a revogar as medidas tomadas com vista a proteger-se contra a introdução
    de organismos prejudiciais associados com cogumelos cultivados frescos (Apenas
    faz fé o texto em língua italiana)'
  type: main
- language: es
  script: Latn
  content: '87/393/CEE: Decisión de la Comisión de 1 de julio de 1987 por la que
    se solicita a Italia que revoque las medidas adoptadas para protegerse contra
    la introducción de organismos nocivos asociados a los champiñones frescos (El
    texto en lengua italiana es el único auténtico)'
