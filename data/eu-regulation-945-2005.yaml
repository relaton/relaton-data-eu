    läbivaatamist vastavalt määruse (EÜ) nr 384/96 artikli 11 lõikele 3
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 945/2005, annettu 21 päivänä kesäkuuta 2005,
    lopullisen polkumyyntitullin käyttöönotosta Venäjältä peräisin olevan ammoniumnitraatin
    tuonnissa annetun asetuksen (EY) N:o 658/2002 ja lopullisen polkumyyntitullin
    käyttöönotosta muun muassa Ukrainasta peräisin olevan ammoniumnitraatin tuonnissa
    annetun asetuksen (EY) N:o 132/2001 muuttamisesta asetuksen (EY) N:o 384/96 11
    artiklan 3 kohdan mukaisen osittaisen välivaiheen tarkastelun jälkeen
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 945/2005 od 21. lipnja 2005. o izmjeni Uredbe (EZ)
    br. 658/2002 o uvođenju konačne antidampinške pristojbe na uvoz amonijevog
    nitrata podrijetlom iz Rusije i Uredbe (EZ) br. 132/2001 o uvođenju konačne
    antidampinške pristojbe na uvoz amonijevog nitrata podrijetlom, među ostalim,
    iz Ukrajine nakon parcijalne privremene revizije u skladu s člankom 11. stavkom
    3. Uredbe (EZ) br. 384/96
  type: main
- language: hu
  script: Latn
  content: A Tanács 945/2005/EK rendelete (2005. június 21.) a 384/96/EK rendelet
    11. cikkének (3) bekezdése szerinti részleges időközi felülvizsgálatot
    követően az Oroszországból származó ammónium-nitrát behozatalra vonatkozó
    végleges dömpingellenes vám kivetéséről szóló 658/2002/EK rendelet és
    a többek között Ukrajnából származó ammónium-nitrát behozatalra vonatkozó
    végleges dömpingellenes vám kivetéséről szóló 132/2001/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 945/2005 del Consiglio, del 21 giugno 2005, che modifica
    il regolamento (CE) n. 658/2002 che istituisce un dazio antidumping definitivo
    sulle importazioni di nitrato di ammonio originario della Russia e il regolamento
    (CE) n. 132/2001 che istituisce un dazio antidumping definitivo sulle importazioni
    di nitrato di ammonio originario, fra l’altro, dell’Ucraina, in seguito a
    un riesame intermedio parziale ai sensi dell’articolo 11, paragrafo 3, del regolamento
    (CE) n. 384/96
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 945/2005 (2005. gada 21. jūnijs), ar kuru pēc
    starpposma pārskatīšanas saskaņā ar Regulas (EK) Nr. 384/96 11. panta 3.
    punktu groza Regulu (EK) Nr. 658/2002, ar ko piemēro galīgo antidempinga maksājumu
    attiecībā uz Krievijas izcelsmes amonija nitrāta importu, un Regulu (EK) Nr.
    132/2001, ar ko piemēro galīgo antidempinga maksājumu attiecībā uz, inter
    alia, Ukrainas izcelsmes amonija nitrāta importu
  type: main
- language: lt
  script: Latn
  content: 2005 m. birželio 21 d. Tarybos reglamentas (EB) Nr. 945/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 658/2002, įvedantį galutinį antidempingo muitą
    Rusijos kilmės amonio nitrato importui, ir Reglamentą (EB) Nr. 132/2001, įvedantį
    galutinį antidempingo muitą amonio nitrato, kurio kilmės šalis, inter alia,
    yra Ukraina, importui po dalinės tarpinės peržiūros pagal Reglamento (EB)
    Nr. 384/96 11 straipsnio 3 dalį
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 945/2005 tal- 21 ta' Ġunju 2005 li jemenda
    r-Regolament (KE) Nru 658/2002 li jimponi dazju anti-dumping definittiv fuq importazzjoni
    tan-nitrat ta’ l-ammonju li joriġina mir-Russja u r-Regolament (KE) Nru 132/2001
    li jimponi dazju anti-dumping definittiv fuq importazzjoni tan-nitrat ta’ l-ammonju
    li joriġina, inter alia, mill-Ukraina, wara r-reviżjoni interim parzjali skond
    l-Artikolu 11(3) tar-Regolament (KE) Nru 384/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 945/2005 van de Raad van 21 juni 2005 tot wijziging
    van Verordening (EG) nr. 658/2002 tot instelling van het definitieve antidumpingrecht
    op de invoer van ammoniumnitraat van oorsprong uit Rusland en tot wijziging van
    Verordening (EG) nr. 132/2001 tot instelling van definitieve antidumpingrechten
    op ammoniumnitraat uit onder andere Oekraïne, naar aanleiding van een gedeeltelijk
    herzieningsonderzoek op grond van artikel 11, lid 3, van Verordening (EG) nr.
    384/96
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 945/2005 z dnia 21 czerwca 2005 r. zmieniające
    rozporządzenie (WE) nr 658/2002 nakładające ostateczne cło antydumpingowe
    na przywóz azotanu amonu pochodzącego z Rosji i rozporządzenie (WE) nr 132/2001
    nakładające ostateczne cło antydumpingowe na przywóz azotanu amonu pochodzącego,
    między innymi, z Ukrainy, w następstwie częściowego przeglądu tymczasowego
    przeprowadzonego zgodnie z art. 11 ust. 3 rozporządzenia (WE) nr 384/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 945/2005 do Conselho, de 21 de Junho de 2005, que
    altera o Regulamento (CE) n.° 658/2002 que cria um direito anti-dumping definitivo
    sobre as importações de nitrato de amónio originário da Rússia, bem como
    o Regulamento (CE) n.° 132/2001 que cria um direito anti-dumping definitivo sobre
    as importações de nitrato de amónio originárias, nomeadamente, da Ucrânia,
    no seguimento de um reexame intercalar parcial nos termos do n.° 3 do artigo
    11.° do Regulamento (CE) n.° 384/96
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 945/2005 al Consiliului din 21 iunie 2005 de modificare
    a Regulamentului (CE) nr. 658/2002 de instituire a unui drept antidumping definitiv
    la importurile de nitrat de amoniu originar din Rusia și a Regulamentului (CE)
    nr. 132/2001 privind instituirea unui drept antidumping definitiv la importurile
    de nitrat de amoniu originar, printre altele, din Ucraina, în urma unei reexaminări
    intermediare parțiale în temeiul articolului 11 alineatul (3) din Regulamentul
    (CE) nr. 384/96
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 945/2005 z 21. júna 2005, ktorým sa mení a
    dopĺňa nariadenie (ES) č. 658/2002, ktorým sa ukladá konečné antidumpingové
    clo na dovoz dusičnanu amónneho s pôvodom v Rusku a nariadenie (ES) č. 132/2001,
    ktorým sa ukladá konečné antidumpingové clo na dovoz dusičnanu amónneho
    s pôvodom, okrem iného, na Ukrajine, na základe čiastočného predbežného
    preskúmania podľa článku 11 ods. 3 nariadenia (ES) č. 384/96
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 945/2005 z dne 21. junija 2005 o spremembi Uredbe
    (ES) št. 658/2002 o uvedbi dokončne protidampinške dajatve za uvoz amonijevega
    nitrata s poreklom iz Rusije in Uredbe (ES) št. 132/2001 o uvedbi dokončne protidampinške
    dajatve za uvoz amonijevega nitrata s poreklom med drugim iz Ukrajine na podlagi
    opravljenega delnega vmesnega pregleda v skladu s členom 11(3) Uredbe (ES) št.
    384/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 945/2005 del Consejo, de 21 de junio de 2005, que modifica
    el Reglamento (CE) n° 658/2002, por el que se establece un derecho antidumping
    definitivo sobre las importaciones de nitrato de amonio originarias de Rusia,
    y el Reglamento (CE) n° 132/2001, por el que se establece un derecho antidumping
    definitivo sobre las importaciones de nitrato de amonio originarias de Ucrania,
    entre otros países, tras una reconsideración provisional parcial llevada a cabo
    en virtud de lo dispuesto en el artículo 11, apartado 3, del Reglamento (CE)
    n° 384/96
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 945/2005 av den 21 juni 2005 om ändring av
    förordning (EG) nr 658/2002 om införande av en slutgiltig antidumpningstull
    på import av ammoniumnitrat med ursprung i Ryssland och förordning (EG) nr 132/2001
    rörande införande av en slutgiltig antidumpningstull på import av ammoniumnitrat
    med ursprung i bland annat Ukraina, till följd av en partiell interimsöversyn
    i enlighet med artikel 11.3 i förordning (EG) nr 384/96
