title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 945/2005 of 21 June 2005 amending Regulation
    (EC) No 658/2002 imposing a definitive anti-dumping duty on imports of ammonium
    nitrate originating in Russia and Regulation (EC) No 132/2001 imposing a definitive
    anti-dumping duty on imports of ammonium nitrate originating in, inter alia, Ukraine,
    following a partial interim review pursuant to Article 11(3) of Regulation (EC)
    No 384/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 945/2005 du Conseil du 21 juin 2005 modifiant le règlement
    (CE) n° 658/2002 instituant un droit antidumping définitif sur les importations
    de nitrate d’ammonium originaire de Russie et le règlement (CE) n° 132/2001
    instituant un droit antidumping définitif sur les importations de nitrate d’ammonium
    originaire, entre autres, d’Ukraine, à la suite d’un réexamen intermédiaire
    partiel au titre de l’article 11, paragraphe 3, du règlement (CE) n° 384/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 945/2005 des Rates vom 21. Juni 2005 zur Änderung
    der Verordnung (EG) Nr. 658/2002 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren von Ammoniumnitrat mit Ursprung in Russland und der Verordnung
    (EG) Nr. 132/2001 zur Einführung eines endgültigen Antidumpingzolls auf die
    Einfuhren von Ammoniumnitrat mit Ursprung in unter anderem der Ukraine nach einer
    teilweisen Interimsüberprüfung gemäß Artikel 11 Absatz 3 der Verordnung (EG)
    Nr. 384/96
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 945/2005 на Съвета от 21 юни
    2005 година за изменение на Регламент (ЕО) № 658/2002
    относно въвеждане на окончателно антидъмпингово
    мито по вноса на амониев нитрат с произход
    от Русия и Регламент (ЕО) № 132/2001 за налагане
    на окончателно антидъмпингово мито по вноса
    на амониев нитрат с произход, inter alia, от Украйна
    след частично междинно преразглеждане съгласно
    член 11, параграф 3 от Регламент (ЕО) № 384/96
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 945/2005 ze dne 21. června 2005, kterým se
    po částečném prozatímním přezkumu podle čl. 11 odst. 3 nařízení (ES)
    č. 384/96 mění nařízení (ES) č. 658/2002 o uložení konečného antidumpingového
    cla z dovozu dusičnanu amonného pocházejícího z Ruska a nařízení (ES)
    č. 132/2001 týkající se uložení konečného antidumpingového cla z dovozu
    dusičnanu amonného pocházejícího mimo jiné z Ukrajiny
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 945/2005 af 21. juni 2005 om ændring af forordning
    (EF) nr. 658/2002 om indførelse af en endelig antidumpingtold på importen af
    ammoniumnitrat med oprindelse i Rusland og forordning (EF) nr. 132/2001 om indførelse
