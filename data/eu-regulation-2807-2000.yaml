    le secteur de la viande de volaille et des oeufs du régime prévu dans les accords
    sur la libéralisation des échanges entre la Communauté, d'une part, et la Lituanie,
    la Lettonie et l'Estonie, d'autre part
  type: main
- language: de
  script: Latn
