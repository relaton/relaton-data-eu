title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2807/2000 of 20 December 2000 amending Regulation
    (EC) No 1866/95 establishing detailed rules for application in the poultrymeat
    and eggs sector of the arrangements provided for in the free trade Agreements
    between the Community, of the one part, and Estonia, Latvia and Lithuania, of
    the other part
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2807/2000 de la Commission du 20 décembre 2000 modifiant
