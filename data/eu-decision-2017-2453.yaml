    od ottenuti da colza geneticamente modificata MON 88302 × Ms8 × Rf3 (MON-883Ø2-9
    × ACSBNØØ5-8 × ACS-BNØØ3-6), MON 88302 × Ms8 (MON-883Ø2-9 × ACSBNØØ5-8)
