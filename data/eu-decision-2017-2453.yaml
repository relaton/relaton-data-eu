    (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu numerolla C(2017) 9045)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/2453 оd 21. prosinca 2017. o odobravanju
