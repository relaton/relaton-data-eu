  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/2453 van de Commissie van 21 december 2017
    tot verlening van een vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met het genetisch gemodificeerd
    koolzaad MON 88302 × Ms8 × Rf3 (MON-883Ø2-9 × ACSBNØØ5-8 × ACS-BNØØ3-6),
