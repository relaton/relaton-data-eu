id: EUDecision20172453
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/2453 of 21 December 2017 authorising
    the placing on the market of products containing, consisting of, or produced from
    genetically modified oilseed rapes MON 88302 × Ms8 × Rf3 (MON-883Ø2-9 × ACSBNØØ5-8
    × ACS-BNØØ3-6), MON 88302 × Ms8 (MON-883Ø2-9 × ACSBNØØ5-8) and MON 88302
    × Rf3 (MON-883Ø2-9 × ACS-BNØØ3-6) pursuant to Regulation (EC) No 1829/2003
    of the European Parliament and of the Council on genetically modified food and
    feed (notified under document C(2017) 9045)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/2453 de la Commission du 21 décembre
    2017 autorisant la mise sur le marché de produits contenant les colzas génétiquement
    modifiés MON 88302 × Ms8 × Rf3 (MON-883Ø2-9 × ACS-BNØØ5-8 × ACS-BNØØ3-6),
    MON 88302 × Ms8 (MON-883Ø2-9 × ACS-BNØØ5-8) et MON 88302 × Rf3 (MON-883Ø2-9
    × ACS-BNØØ3-6), consistant en ces colzas ou produits à partir de ceux-ci,
    en application du règlement (CE) n° 1829/2003 du Parlement européen et du Conseil
    concernant les denrées alimentaires et les aliments pour animaux génétiquement
    modifiés [notifiée sous le numéro C(2017) 9045]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/2453 der Kommission vom 21. Dezember
    2017 über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch
    veränderten Raps MON 88302 × Ms8 × Rf3 (MON-883Ø2-9 × ACSBNØØ5-8 × ACS-BNØØ3-6),
    MON 88302 × Ms8 (MON-883Ø2-9 × ACSBNØØ5-8) und MON 88302 × Rf3 (MON-883Ø2-9
    × ACS-BNØØ3-6) enthalten, aus ihm bestehen oder aus ihm hergestellt werden,
    gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des
    Rates über genetisch veränderte Lebensmittel und Futtermittel (Bekannt gegeben
    unter Aktenzeichen C(2017) 9045)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/2453 на Комисията
    от 21 декември 2017 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    маслодайна рапица MON 88302 × Ms8 × Rf3 (MON-883Ø2-9 × ACSBNØØ5-8
    × ACS-BNØØ3-6), MON 88302 × Ms8 (MON-883Ø2-9 × ACSBNØØ5-8) и MON 88302
    × Rf3 (MON-883Ø2-9 × ACS-BNØØ3-6), в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    относно генетично модифицираните храни и фуражи
    (нотифицирано под номер С(2017) 9045)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/2453 ze dne 21. prosince 2017
    o povolení uvádění produktů, které obsahují geneticky modifikované řepky
    olejné MON 88302 × Ms8 × Rf3 (MON-883Ø2-9 × ACSBNØØ5-8 × ACS-BNØØ3-6),
    MON 88302 × Ms8 (MON-883Ø2-9 × ACSBNØØ5-8) a MON 88302 × Rf3 (MON-883Ø2-9
    × ACS-BNØØ3-6), sestávají z nich nebo jsou z nich vyrobeny, na trh podle
    nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 o geneticky modifikovaných
    potravinách a krmivech (oznámeno pod číslem C(2017) 9045)
  type: main
- language: da
