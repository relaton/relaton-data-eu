  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/2453, annettu 21 päivänä
    joulukuuta 2017, muuntogeenisiä rapseja MON 88302 × Ms8 × Rf3 (MON-883Ø2-9
    × ACS-BNØØ5-8 × ACS-BNØØ3-6), MON 88302 × Ms8 (MON-883Ø2-9 × ACS-BNØØ5-8)
    ja MON 88302 × Rf3 (MON-883Ø2-9 × ACS-BNØØ3-6) sisältävien, niistä koostuvien
    tai niistä valmistettujen tuotteiden markkinoille saattamisen sallimisesta muuntogeenisistä
