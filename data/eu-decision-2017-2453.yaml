    × ACSBNØØ5-8 × ACS-BNØØ3-6), MON 88302 × Ms8 (MON-883Ø2-9 × ACSBNØØ5-8)
    és MON 88302 × Rf3 (MON-883Ø2-9 × ACS-BNØØ3-6) olajrepcefajtákat tartalmazó,
    azokból álló vagy azokból előállított termékek forgalomba hozatalának
