title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2693/98 of 14 December 1998 authorising the
    conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1998/99 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2693/98 de la Commission du 14 décembre 1998 ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    le vin de table, le moût de raisins, le moût de raisins concentré et le moût
    de raisins concentré rectifié pour la campagne 1998/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2693/98 der Kommission vom 14. Dezember 1998 zur Eröffnung
    der Möglichkeit des Abschlusses von Verträgen für die langfristige private
    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifizierten Traubenmost für das Wirtschaftsjahr 1998/1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2693/98 af 14. december 1998 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost
    og rektificeret koncentreret druemost for produktionsåret 1998/99
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2693/98 της Επιτροπής
    της 14ης Δεκεμβρίου 1998 για την παροχή δυνατότητας
    σύναψης συμφωνητικών μακροπρόθεσμης ιδιωτικής
    αποθεματοποίησης επιτραπέζιου οίνου, γλεύκους
    σταφυλών, συμπυκνωμένου γλεύκους σταφυλών
    και διορθωμένου συμπυκνωμένου γλεύκους σταφυλών
    για την περίοδο 1998/1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2693/98, annettu 14 päivänä joulukuuta 1998,
    mahdollisuudesta tehdä yksityistä varastointia koskevia pitkän aikavälin sopimuksia
    viinivuodelle 1998/99 pöytäviinin, rypälemehun, tiivistetyn rypälemehun ja
    puhdistetun tiivistetyn rypälemehun osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2693/98 della Commissione del 14 dicembre 1998 che
    concede, per la campagna 1998/99, la possibilità di concludere contratti di magazzinaggio
    privato a lungo termine per il vino da tavola, il mosto di uve concentrato e il
    mosto di uve concentrato rettificato
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2693/98 van de Commissie van 14 december 1998 betreffende
    het openen van de mogelijkheid tot het sluiten van langlopende contracten voor
    de particuliere opslag van tafelwijn, druivemost, geconcentreerde druivemost en
    gerectificeerde geconcentreerde druivemost voor het wijnoogstjaar 1998/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2693/98 da Comissão de 14 de Dezembro de 1998 que
    permite concluir contratos de armazenamento privado a longo prazo para o vinho
    de mesa, o mosto de uvas, o mosto de uvas concentrado e o mosto de uvas concentrado
    rectificado, para a campanha de 1998/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2693/98 de la Comisión de 14 de diciembre de 1998
