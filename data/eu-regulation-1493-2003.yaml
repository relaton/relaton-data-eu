    für die Versorgung der französischen überseeischen Departements mit Getreide
    sowie der Bedarfsvorausschätzung für die Versorgung der Kanarischen Inseln mit
    Verarbeitungserzeugnissen aus Obst und Gemüse
  type: main
- language: da
  script: Latn
