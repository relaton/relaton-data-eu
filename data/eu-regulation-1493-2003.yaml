    departementtien vilja-alan alustavan hankintataseen ja Kanariansaarten hedelmä-
    ja vihannesjalostealan alustavan hankintataseen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1493/2003 della Commissione, del 25 agosto 2003, che
    modifica e rettifica il regolamento (CE) n. 98/2003 della Commissione per quanto
    riguarda il bilancio previsionale di approvvigionamento dei dipartimenti francesi
    d'oltremare nel settore dei cereali e il bilancio previsionale di approvvigionamento
    delle isole Canarie nel settore degli ortofrutticoli trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1493/2003 van de Commissie van 25 augustus 2003 houdende
    wĳziging en rectificatie van Verordening (EG) nr. 98/2003 ten aanzien van de
    voorzieningsbalans voor granen ten behoeve van de Franse overzeese departementen
    en ten aanzien van de voorzieningsbalans voor verwerkte producten op basis van
    groenten en fruit ten behoeve van de Canarische Eilanden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1493/2003 da Comissão, de 25 de Agosto de 2003,
