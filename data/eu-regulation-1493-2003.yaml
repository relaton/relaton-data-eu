  content: Commission Regulation (EC) No 1493/2003 of 25 August 2003 amending and
    correcting Regulation (EC) No 98/2003 as regards the forecast supply balance for
    the cereals sector for the French overseas departments and the forecast supply
    balance for the processed fruit and vegetable sector for the Canary Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1493/2003 de la Commission du 25 août 2003 modifiant
