title:
- language: en
  script: Latn
  content: '97/561/EC: Council Decision of 3 March 1997 on the conclusion of an Agreement
    in the form of an Exchange of Letters between the European Community and the Republic
    of Malta amending the Memorandum of Understanding between the European Economic
    Community and the Republic of Malta regarding textile trade to take into account
    the accession of the Republic of Austria, the Republic of Finland and the Kingdom
    of Sweden to the European Union'
  type: main
- language: fr
  script: Latn
  content: '97/561/CE: Décision du Conseil du 3 mars 1997 concernant la conclusion
    de l''accord sous forme d''échange de lettres entre la Communauté européenne
    et la République de Malte modifiant le mémorandum d''accord entre la Communauté
    économique européenne et la République de Malte sur le commerce des produits
    textiles de manière à tenir compte de l''adhésion de la République d''Autriche,
    de la République de Finlande et du Royaume de Suède à l''Union européenne'
  type: main
