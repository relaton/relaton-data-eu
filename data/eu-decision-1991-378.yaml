---
id: EUDecision1991378
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 1 July 1991 recognizing Portugal as an officially
    swine fever free Member State within the context of eradication, and amending
    for the fifth time Decision 81/400/EEC establishing the status of Member States
    as regards classical swine fever with a view to its eradication
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 1er juillet 1991, reconnaissant le Portugal
    comme État membre officiellement indemne de peste porcine dans le cadre de l'éradication
    et portant cinquième modification de la décision 81/400/CEE établissant le
    statut des États membres en ce qui concerne la peste porcine classique en vue
    de son éradication
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 1. Juli 1991 zur Anerkennung Portugals
    als amtlich schweinepestfrei im Rahmen der Seuchentilgung und zur fünften Änderung
    der Entscheidung 81/400/EWG über die Festlegung des Status der Mitgliedstaaten
    hinsichtlich der Ausmerzung der klassischen Schweinepest
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 1. juli 1991 om anerkendelse af Portugal som
    værende officielt fri for svinepest i forbindelse med udryddelsen af denne sygdom
    og om femte ændring af beslutning 81/400/EØF om fastlæggelse af medlemsstaternes
    status i forbindelse med udryddelse af klassisk svinepest
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 1ης Ιουλίου 1991
    για την αναγνώριση της Πορτογαλίας ως κράτους
    μέλους επίσημα απαλλαγμένου από την πανώλη
    των χοίρων στο πλαίσιο του προγράμματος εξάλειψης
    της ασθένειας αυτής, και για την πέμπτη τροποποίηση
    της απόφασης 81/400/ΕΟΚ περί καθορισμού του καθεστώτος
    των κρατών μελών όσον αφορά την κλασική πανώλη
    των χοίρων με στόχο την εξάλειψή της
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 1 päivänä heinäkuuta 1991, Portugalin vahvistamisesta
    virallisesti sikarutosta vapaaksi jäsenvaltioksi taudin hävittämisen yhteydessä
    ja jäsenvaltioiden aseman vahvistamisesta klassisen sikaruton hävittämisen
    yhteydessä tehdyn päätöksen 81/400/ETY muuttamisesta viidennen kerran
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 1ºluglio 1991, che nel contesto del piano
    di eradicazione riconosce ufficialmente indenne dalla peste suina il territorio
    del Portogallo e modifica per la quinta volta la decisione 81/400/CEE, che stabilisce
    lo status degli Stati membri nei confronti della peste suina classica in vista
    dell'eradicazione di tale malattia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 1 juli 1991 waarbij Portugal als officieel
    vrij van varkenspest wordt erkend in het kader van de uitroeiing van die ziekte
    en houdende vijfde wijziging van Beschikking 81/400/EEG houdende vaststelling
    van de status van de Lid-Staten ten aanzien van de uitroeiing van klassieke varkenspest
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 1 de Julho de 1991, que reconhece Portugal como
    um Estado-membro oficialmente indemne de peste suína no contexto da erradicação
    da doença e altera pela quinta vez a Decisão 81/400/CEE, que estabelece o estatuto
    dos Estados- membros relativo à peste suína clássica para erradicação desta
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión, de 1 de julio de 1991, por la que, en el marco
    de un plan de erradicación, se reconoce a Portugal como Estado miembro oficialmente
    indemne de peste porcina, y se modifica por quinta vez la Decisión 81/400/CEE
    por la que se establece el estatuto de los Estados miembros en lo que respecta
    a la peste porcina clásica a fin de lograr su erradicación
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut av den 1 juli 1991 om att förklara Portugal officiellt
    fritt från svinpest i samband med bekämpningen av denna sjukdom samt om femte
    ändringen av beslut 81/400/EEG om fastställande av medlemsstaternas status ifråga
    om bekämpningen av klassisk svinpest
  type: main
