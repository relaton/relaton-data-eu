  content: '92/304/EEC: Commission Decision of 22 May 1992 approving measures to set
    up pilot projects for the control of rabies with a view to its eradication or
    prevention presented by France (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/304/CEE: Décision de la Commission, du 22 mai 1992, approuvant des
    actions visant à l''établissement de projets pilotes destinés à lutter contre
    la rage en vue de son éradication ou de sa prévention présentés par la France
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '92/304/EWG: Entscheidung der Kommission vom 22. Mai 1992 zur Genehmigung
