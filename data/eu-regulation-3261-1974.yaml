title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3261/74 of the Commission of 20 December 1974 amending
    Regulation (EEC) No 385/73 on the methods of administrative cooperation to safeguard
    during the transitional period the free movement of goods in trade between the
    Community as originally constituted and the new Member States and in trade between
    the new Member States themselves
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3261/74 de la Commission, du 20 décembre 1974, modifiant
    le règlement (CEE) n° 385/73 relatif aux méthodes de coopération administrative
    destinées à assurer pendant la période de transition la libre circulation des
    marchandises dans les échanges entre la Communauté dans sa composition originaire
    et les nouveaux États membres et entre les nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3261/74 der Kommission vom 20. Dezember 1974 zur Änderung
    der Verordnung (EWG) Nr. 385/73 über die Methoden der Zusammenarbeit der Verwaltungen
    zur Gewährleistung des freien Warenverkehrs im Handel zwischen der Gemeinschaft
    in ihrer ursprünglichen Zusammensetzung und den neuen Mitgliedstaaten sowie im
    Handel der neuen Mitgliedstaaten untereinander während der Übergangszeit
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3261/74 af 20. december 1974 om ændring
    af Kommissionens forordning (EØF) nr. 385/73 om metoderne for det administrative
    samarbejde med det formål i overgangsperioden at sikre den frie varetransport
    ved handel mellem Fællesskabet i dets oprindelige sammensætning og de nye medlemsstater,
    samt mellem de nye medlemsstater indbyrdes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3261/74 della Commissione, del 20 dicembre 1974, che
    modifica il regolamento (CEE) n. 385/73 relativo ai metodi di cooperazione amministrativa
    destinati ad attuare nel periodo transitorio la libera circolazione delle merci
    negli scambi tra la Comunità nella sua composizione originaria ed i nuovi Stati
    membri, nonché negli scambi tra i nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3261/74 van de Commissie van 20 december 1974 tot
    wijziging van Verordening (EEG) nr. 385/73 betreffende de methoden van administratieve
    samenwerking welke gedurende de overgangsperiode het vrije verkeer van goederen
    in het handelsverkeer tussen de Gemeenschap in haar oorspronkelijke samenstelling
    en de nieuwe Lid-Staten en in het handelsverkeer tussen de nieuwe Lid-Staten onderling
    moeten waarborgen
  type: main
