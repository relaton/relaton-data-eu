title:
- language: en
  script: Latn
  content: '80/235/EEC: Commission Decision of 21 December 1979 authorizing Denmark
    and the Federal Republic of Germany to apply special health guarantees for the
    prevention of leucosis in the case of bovine animals imported for breeding or
    production (Only the Danish and German texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/235/CEE: Décision de la Commission, du 21 décembre 1979, autorisant
    le Danemark et la République fédérale d''Allemagne à appliquer des garanties
    sanitaires particulières relatives à la lutte contre la leucose, en cas d''introduction
    sur leur territoire de bovins d''élevage ou de rente (Les textes en langues danoise
    et allemande sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/235/EWG: Entscheidung der Kommission vom 21. Dezember 1979, mit der
    Dänemark und die Bundesrepublik Deutschland ermächtigt werden, beim Verbringen
    von Zucht- und Nutzrindern in ihr Hoheitsgebiet zur Bekämpfung der Leukose besondere
    gesundheitspolizeiliche Garantien anzuwenden (Nur der dänische und deutsche Text
    sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/235/EØF: Kommissionens beslutning af 21. december 1979 om bemyndigelse
    af Danmark og Forbundsrepublikken Tyskland til ved indbringelse på deres område
    af avls- eller brugskvæg at anvende særlige sundhedsmæssige garantier med henblik
    på bekæmpelse af leukose (Kun den danske og tyske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/235/CEE: Decisione della Commissione, del 21 dicembre 1979, che autorizza
    la Danimarca e la Repubblica federale di Germania ad applicare speciali garanzie
    sanitarie all''introduzione di bovini da allevamento e da produzione nel proprio
    territorio con riferimento alla lotta contro la leucosi (I testi in lingua danese
    e tedesca sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/235/EEG: Beschikking van de Commissie van 21 december 1979 waarbij
    Denemarken en de Bondsrepubliek Duitsland worden gemachtigd om bij invoer van
    fok- of gebruiksrunderen bijzondere gezondheidsgaranties in het kader van de leukosebestrijding
    toe te passen (Slechts de teksten in de Deense en de Nederlandse taal zijn authentiek)'
  type: main
