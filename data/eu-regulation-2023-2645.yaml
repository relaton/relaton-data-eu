    lietot par barības piedevu visu sugu gaļas mājputniem un dējējmājputniem
    vai vaislas mājputniem, atšķirtiem sivēniem, atšķirtiem mazāk izplatītu
    cūku sugu sivēniem, nobarojamām cūkām un mazāk izplatītu sugu nobarojamām
    cūkām (atļaujas turētājs Elanco GmbH)
  type: main
