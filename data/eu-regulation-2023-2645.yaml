    preparatą kaip visų rūšių penimų, dedeklinių arba veislinių naminių paukščių,
    nujunkytų paršelių, retesnių rūšių nujunkytų paršelių, penimų kiaulių
    ir retesnių rūšių penimų kiaulių pašarų priedą (leidimo turėtoja –
    bendrovė Elanco GmbH)
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/2645 tat-28
