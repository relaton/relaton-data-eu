title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/2645 of 28 November 2023
    concerning the authorisation of a preparation of endo–1,4-beta-mannanase produced
    by Paenibacillus lentus DSM 33618 as a feed additive for all poultry species for
    fattening and reared for laying or breeding, weaned piglets, weaned piglets of
    minor porcine species, pigs for fattening and minor porcine species for fattening
    (holder of authorisation: Elanco GmbH)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/2645 de la Commission du 28 novembre
    2023 concernant l’autorisation d’une préparation d’endo–1,4-bêta-mannanase
    produite par Paenibacillus lentus DSM 33618 en tant qu’additif pour l’alimentation
    de toutes les espèces de volailles d’engraissement, de ponte ou de reproduction,
    des porcelets sevrés, des porcelets sevrés d’espèces porcines mineures, des
    porcs d’engraissement et des espèces porcines mineures destinées à l’engraissement
    (titulaire de l’autorisation: Elanco GmbH)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/2645 der Kommission vom 28. November
    2023 zur Zulassung einer Zubereitung aus Endo–1,4-beta-Mannanase aus Paenibacillus
    lentus DSM 33618 als Zusatzstoff in Futtermitteln für alle Mast- und Lege- oder
    Zuchtgeflügelarten, Absetzferkel, Absetzferkel von Schweinarten von geringerer
    wirtschaftlicher Bedeutung, Mastschweine und Mastschweinearten von geringerer
    wirtschaftlicher Bedeutung (Zulassungsinhaber: Elanco GmbH)'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2023/2645 на Комисията
    от 28 ноември 2023 година за разрешаване на употребата
    на препарат от ендо–1,4-бета-мананаза, получена
    от Paenibacillus lentus DSM 33618, като фуражна добавка за
    всички видове домашни птици за угояване и отглеждани
    за носачки или за разплод, отбити прасенца,
    отбити прасенца от видове свине с по-малко
    стопанско значение, прасета за угояване и видове
    свине с по-малко стопанско значение, отглеждани
    за угояване (притежател на разрешението: Elanco
    GmbH)'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2023/2645 ze dne 28. listopadu 2023
    o povolení přípravku endo–1,4-beta-mannanázy z Paenibacillus lentus DSM
    33618 jako doplňkové látky pro výkrm a odchov všech druhů drůbeže, odstavená
    selata, odstavená selata menšinových druhů prasat, výkrm prasat a výkrm
    menšinových druhů prasat (držitel povolení: Elanco GmbH)'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2023/2645 af 28. november
    2023 om godkendelse af et præparat af endo–1,4-beta-mannanase produceret af
    Paenibacillus lentus DSM 33618 som fodertilsætningsstof til alle fjerkræarter
    bestemt til slagtning og opdrættet til æglægning eller avl, fravænnede smågrise,
    fravænnede smågrise af mindre udbredte svinearter, slagtesvin og mindre udbredte
    svinearter bestemt til slagtning (indehaver af godkendelsen: Elanco GmbH)'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2023/2645 της
    Επιτροπής, της 28ης Νοεμβρίου 2023, σχετικά με
    τη χορήγηση άδειας για τη χρήση παρασκευάσματος
    ενδο–1,4-β-μαννανάσης που παράγεται από Paenibacillus
    lentus DSM 33618 ως πρόσθετης ύλης ζωοτροφών για όλα
    τα είδη πουλερικών προς πάχυνση και που εκτρέφονται
    για ωοπαραγωγή ή αναπαραγωγή, απογαλακτισμένα
    χοιρίδια, απογαλακτισμένα χοιρίδια μικρών
    χοιροειδών, χοίρους προς πάχυνση και μικρά
    χοιροειδή προς πάχυνση (κάτοχος της άδειας:
    Elanco GmbH)'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2023/2645, 28. november 2023, milles käsitletakse
    loa andmist Paenibacillus lentus DSM 33618 abil toodetud endo–1,4-β-mannanaasi
    preparaadi kasutamiseks kõikide kodulinnuliikide nuum-, muna- ja aretuslindude,
    võõrdepõrsaste, vähemlevinud sealiikide võõrdepõrsaste, nuumsigade ja vähemlevinud
    sealiikide nuumsigade söödalisandina (loa hoidja: Elanco GmbH)'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2023/2645, annettu 28 päivänä
    marraskuuta 2023, Paenibacillus lentus DSM 33618 -bakteerin tuottamaa endo–1,4-beeta-mannanaasia
    sisältävän valmisteen hyväksymisestä kaikkien lihantuotantoon tarkoitettujen
    ja munantuotantoa varten tai siitoseläimiksi kasvatettavien siipikarjalajien,
    vieroitettujen porsaiden, toissijaisten sikaeläinten vieroitettujen porsaiden,
    lihasikojen ja lihantuotantoon tarkoitettujen toissijaisten sikaeläinten rehun
    lisäaineena (hyväksynnän haltija: Elanco GmbH)'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2023/2645 ón gCoimisiún an 28 Samhain
    2023 maidir le hullmhóid d’in–1,4-béite-mainionáis arna táirgeadh ag Paenibacillus
    lentus DSM 33618 a údarú mar bhreiseán beathaithe le haghaidh gach speicis
    éanlaithe clóis lena ramhrú agus a thógtar le bheith ina mbéaróga nó a
    thógtar le haghaidh pórúcháin, le haghaidh bainbh scoite, bainbh scoite de
