    készítmény valamennyi hízó-, tojó- vagy tenyészbaromfifaj, elválasztott
    malacok, kevésbé jelentős sertésfélékhez tartozó elválasztott malacok,
    hízósertések és kevésbé jelentős hízósertések takarmány-adalékanyagaként
    történő engedélyezéséről (az engedély jogosultja: Elanco GmbH)'
  type: main
