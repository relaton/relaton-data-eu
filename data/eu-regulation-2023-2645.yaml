    prodotta da Paenibacillus lentus DSM 33618 come additivo per mangimi destinati
    a tutte le specie avicole da ingrasso e allevate per la produzione di uova o per
    la riproduzione, suinetti svezzati, suinetti svezzati di specie suine minori,
    suini da ingrasso e specie suine minori da ingrasso (titolare dell’autorizzazione:
    Elanco GmbH)'
  type: main
- language: lv
