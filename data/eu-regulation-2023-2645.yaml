    (sealbhóir an údaraithe: Elanco GmbH)'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2023/2645 оd 28. studenoga 2023. o odobrenju
    pripravka endo–1,4-beta-mananaze dobivene od Paenibacillus lentus DSM 33618
    kao dodatka hrani za sve vrste peradi za tov i sve vrste peradi koja se uzgaja
    za nesenje ili rasplod, odbijenu prasad, odbijenu prasad manje značajnih vrsta
    svinja, svinje za tov i manje značajne vrste svinja za tov (nositelj odobrenja:
    Elanco GmbH)'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2023/2645 végrehajtási rendelete (2023. november 28.)
