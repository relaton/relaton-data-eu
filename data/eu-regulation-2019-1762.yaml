    (ЕС) № 206/2010 по отношение на включването на Обединеното
    кралство Великобритания и Северна Ирландия
    и на териториите, зависими от Британската корона,
    в списъка на третите държави, територии или
    части от тях, от които е разрешено въвеждането
    в Съюза на някои животни и прясно месо
  type: main
