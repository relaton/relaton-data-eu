title:
- language: en
  script: Latn
  content: Commission Implementing Regulation 2019/1762 of 23 October 2019 amending
    Regulation (EU) No 206/2010 as regards the inclusion of the United Kingdom of
    Great Britain and Northern Ireland and its Crown Dependencies in the lists of
    third countries, territories or parts thereof authorised for the introduction
    into the Union of certain animals and fresh meat
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2019/1762 de la Commission du 23 octobre
    2019 modifiant le règlement (UE) no 206/2010 en ce qui concerne l’inscription
    du Royaume-Uni de Grande-Bretagne et d’Irlande du Nord et des dépendances de
    la Couronne sur les listes des pays tiers, territoires ou parties de pays tiers
    ou territoires en provenance desquels l’introduction dans l’Union de certains
    animaux et viandes fraîches est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung 2019/1762 der Kommission vom 23. Oktober 2019
    zur Änderung der Verordnung (EU) Nr. 206/2010 im Hinblick auf die Aufnahme des
    Vereinigten Königreichs Großbritannien und Nordirland und seiner unmittelbar
    der englischen Krone unterstehenden Gebiete in die Listen von Drittländern, Gebieten
    und Teilen davon, aus denen das Verbringen bestimmter Tiere und bestimmten frischen
    Fleisches in die Europäische Union zulässig ist
  type: main
- language: bg
  script: Cyrl
