title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1579/85 of 10 June 1985 increasing the Community
    tariff quota opened by Regulation (EEC) No 3195/84 for yarn spun entirely from
    waste silk other than noil, not put up for retail sale, falling within subheading
    50.05 A of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1579/85 du Conseil du 10 juin 1985 portant augmentation
    du volume du contingent tarifaire communautaire ouvert, par le règlement (CEE)
    no 3195/84, pour des fils entièrement de bourre de soie (schappe), non conditionnés
    pour la vente au détail, de la sous-position 50.05 A du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1579/85 des Rates vom 10. Juni 1985 zur Aufstockung
    des durch die Verordnung (EWG) Nr. 3195/84 eröffneten Gemeinschaftszollkontingents
    für Garne, ganz aus Schappeseide, nicht in Aufmachungen für den Einzelverkauf,
    der Tarifstelle 50.05 A des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1579/85 af 10. juni 1985 om forhøjelse af
    det ved forordning (EØF) nr. 3195/84 åbnede fællesskabstoldkontingent for garn
    udelukkende af schappesilke, ikke i detailsalgsoplægninger, henhørende under
    pos. 50.05 A i den fælles toldtarif
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1579/85 του Συμβουλίου
    της 10ης Ιουνίου 1985 για την αύξηση της ποσότητας
    της κοινοτικής δασμολογικής ποσόστωσης που
    ανοίχτηκε με τον κανονισμό (ΕΟΚ) αριθ. 3195/84,
    για νήματα εξ ολοκλήρου εκ γναφάλων μετάξης,
    μη συσκευασμένα για τη λιανική πώληση, της
    διάκρισης 50.05 Α του Κοινού Δασμολογίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1579/85 del Consiglio del 10 giugno 1985 che aumenta
    il volume del contingente tariffario comunitario aperto dal regolamento (CEE)
    n. 3195/84 per i filati interamente di borra di seta (schappe), non preparati
    per la vendita al minuto, della sottovoce 50.05 A della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1579/85 van de Raad van 10 juni 1985 houdende verhoging
    van het communautaire tariefcontingent dat bij Verordening (EEG) nr. 3195/84 is
    geopend voor garens, geheel van vlokzijde, niet gereed voor de verkoop in het
    klein, van post 50.05 A van het gemeenschappelijk douanetarief
  type: main
