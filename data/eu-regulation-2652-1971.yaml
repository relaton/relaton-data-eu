id: EURegulation26521971
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2652/71 de la Commission, du 14 décembre 1971, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    au verre étiré ou soufflé, de la position tarifaire 70.05, originaire de Yougoslavie
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    1309/71 du Conseil du 21 juin 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2652/71 der Kommission vom 14. Dezember 1971 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für gezogenes
    oder geblasenes Flachglas, sogenanntes "Tafelglas" (auch bei der Herstellung bereits
    überfangen), nicht bearbeitet, in quadratischen oder rechteckigen Platten oder
    Scheiben, der Tarifnummer 70.05, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 1309/71 des Rates vom 21. Juni 1971 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2652/71 della Commissione, del 14 dicembre 1971, recante
    ripristino della riscossione dei dazi della tariffa doganale comune, applicabili
    al vetro tirato o soffiato della voce doganale 70.05, originario della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 1309/71
    del Consiglio, del 21 giugno 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2652/71 van de Commissie van 14 december 1971 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op getrokken of geblazen glas (z.g. vensterglas), onbewerkt (alsmede
    onbewerkt getrokken of geblazen geplateerd glas dat in één arbeidsgang is verkregen),
    in vierkante of rechthoekige platen van post 70.05, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 1309/71 van de Raad van 21 juni
    1971 algemene tariefpreferenties werden geopend
  type: main
