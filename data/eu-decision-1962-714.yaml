title:
- language: fr
  script: Latn
  content: Décision de la Commission relative à la prorogation des mesures de sauvegarde
    accordées le 27 juillet 1961 à la République italienne pour le soufre (position
    du tarif douanier italien 25.03 et 28.02), pour le sulfure de carbone (position
    du tarif douanier italien 28.15 B) et pour le sulfure de sodium (position du tarif
    douanier italien 28.35 A III)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission über die Verlängerung der Geltungsdauer der
    Schutzmaßnahmen für Schwefel (Tarifnummern 25.03 und 28.02 des italienischen
    Zolltarifs), für Schwefelkohlenstoff (Tarifnummer 28.15 B des italienischen Zolltarifs)
    und für Natriumsulfid (Tarifnummer 28.35 A III), zu deren Anwendung die Italienische
    Republik am 27. Juli 1961 ermächtigt worden ist
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa alla proroga delle misure di salvaguardia
    accordate alla Repubblica Italiana il 27 luglio 1961, per lo zolfo (voce della
    tariffa doganale italiana 25.03 e 28.02), per il solfuro di carbonio (voce della
    tariffa doganale italiana 28.15 B) e per il solfuro di sodio (voce della tariffa
    doganale italiana 28.35 A III)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende de verlenging van de geldigheidsduur
    van de vrijwaringsmaatregelen voor zwavel (posten 25.03 en 28.02 van het Italiaanse
    douanetarief), zwavelkoolstof (post 28.15 B van het Italiaanse douanetarief) en
    natriumsulfide (post 28.35 A III van het Italiaanse douanetarief) tot de toepassing
    waarvan de Italiaanse Republiek op 27 juli 1961 werd gemachtigd
  type: main
