id: EUDecision1970155
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 février 1970, autorisant la République
    française et la République fédérale d'Allemagne à percevoir un droit de douane
    additionnel lors de l'importation de café non torréfié, non décaféiné, de
    la position 09.01 A I A) du Tarif douanier commun, originaire de pays non membres
    de la CEE, autres que les états africains et malgache et les pays et territoires
    d'outre-mer associés, et mis en libre pratique dans les pays du Benelux
  type: main
- language: de
  script: Latn
  content: '70/155/EWG: Entscheidung der Kommission vom 10. Februar 1970 zur Ermächtigung
    der Französischen Republik und der Bundesrepublik Deutschland zur Erhebung eines
    zusätzlichen Zollsatzes bei der Einfuhr von nicht geröstetem, nicht entkoffeiniertem
    Kaffee der Tarifnummer 09.01 A I a) des Gemeinsamen Zolltarifs mit Ursprung in
    dritten Ländern, ausgenommen die assoziierten afrikanischen Staaten und Madagaskar
    und die assoziierten überseeischen Länder und Gebiete, der in den Beneluxstaaten
    in den freien Verkehr gebracht wird'
  type: main
- language: it
  script: Latn
  content: '70/155/CEE: Decisione delle Commissione, del 10 febbraio 1970, che autorizza
    la Repubblica francese e la Repubblica federale di Germania a riscuotere un dazio
    doganale addizionale sulle importazioni di caffè non torrefatto, non decaffeinizzato,
    della voce 09.01 A I a) della tariffa doganale comune, originario di paesi non
    membri della CEE, diversi dagli Stati africani e malgascio e dai paesi e territori
    d''oltremare associati, e immesso in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '70/155/EEG: Beschikking van de Commissie van 10 februari 1970 waarbij
    de Franse Republiek en de Bondsrepubliek Duitsland worden gemachtigd op koffie,
    ongebrand, waaruit geen cafeïne is verwijderd, van post 09.01 A I a) van het
    gemeenschappelijk douanetarief, van oorsprong uit niet-lidstaten van de EEG, andere
    dan de geassocieerde Afrikaanse staten en Madagaskar en de geassocieerde landen
    en gebieden overzee en in de Benelux-landen in het vrije verkeer gebracht, bij
    invoer een aanvullend douanerecht te heffen'
  type: main
