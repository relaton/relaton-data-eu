title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3174/83 of 10 November 1983 re-establishing
    the levying of customs duties on lactic acid and its salts and esters, falling
    within subheading 29.16 A I and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3174/83 de la Commission du 10 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables à l' acide
    lactique, ses sels et ses esters, de la sous-position 29.16 A I du tarif douanier
    commun, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3174/83 der Kommission vom 10. November 1983 zur Wiedereinführung
    der Erhebung der Zölle für Milchsäure, ihre Salze und Ester der Tarifstelle
    29.16 A I, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3377/82
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3174/83 af 10. november 1983 om genindførelse
    af opkrævning af told for mælkesyre samt salte og estere deraf, henhørende
    under pos. 29.16 A I og med oprindelse i Kina, som er præferenceberettiget i
    henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3174/83 της Επιτροπής
    της 10ης Νοεμβρίου 1983 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για γαλακτικό οξύ, άλατα
    και εστέρες αυτού, της διακρίσεως 29.16 Α Ι του
    Κοινού Δασμολογίου, καταγωγής Κίνας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3377/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3174/83 della Commissione del 10 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili all' acido lattico, suoi
    sali e suoi esteri, della sottovoce 29.16 A I della tariffa doganale comune, originari
    della Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3174/83 van de Commissie van 10 november 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op melkzuur, alsmede
    zouten en esters daarvan, van postonderverdeling 29.16 A I, van oorsprong uit
    China, waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties
    zijn verleend
