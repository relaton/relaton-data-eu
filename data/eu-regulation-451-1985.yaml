title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 451/85 of 21 February 1985 amending for
    the 24th time Regulation (EEC) No 2730/81 establishing a list of agencies in non-member
    importing countries entitled to issue invitations to tender in the milk and milk
    products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 451/85 de la Commission du 21 février 1985 modifiant
    pour la vingt-quatrième fois le règlement (CEE) n° 2730/81 établissant la
    liste des organismes dans les pays tiers importateurs d'où peuvent émaner des
    adjudications dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 451/85 der Kommission vom 21. Februar 1985 zur 24.
