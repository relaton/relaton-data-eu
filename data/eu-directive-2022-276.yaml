    για σκοπούς γενικού φωτισμού
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2022/276, 13. detsember 2021, millega
    muudetakse teaduse ja tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi
    ja nõukogu direktiivi 2011/65/EL III lisa seoses erandiga, mis hõlmab elavhõbeda
    kasutamist üldotstarbelistes ühe sokliga (kompaktsetes) luminofoorlampides
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2022/276, annettu 13 päivänä joulukuuta
    2021, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen III muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen siltä osin kuin on kyse
    elohopean käyttöä yleiskäyttöön tarkoitetuissa yksikantaisissa pienloistelampuissa
    koskevasta poikkeuksesta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2022/276 ón gCoimisiún an 13 Nollaig 2021 lena
    leasaítear, chun í a chur in oiriúint don dul chun cinn teicniúil agus eolaíoch,
    Iarscríbhinn III a ghabhann le Treoir 2011/65/AE ó Pharlaimint na hEorpa agus
    ón gComhairle a mhéid a bhaineann le díolúine chun mearcair a úsáid i ndlúthshoilse
    fluaraiseacha aonchaidhpeacha chun críoch soilsithe ghinearálta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/276 оd 13. prosinca 2021. o izmjeni,
    u svrhu prilagodbe tehničkom i znanstvenom napretku, Priloga III. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu žive u (kompaktnim)
    fluorescentnim žaruljama s jednim podnoškom za opće primjene osvjetljenja
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/276 felhatalmazáson alapuló irányelve (2021.
    december 13.) a 2011/65/EU európai parlamenti és tanácsi irányelv III. mellékletének
    a higany általános világítási célra szolgáló, egy végükön fejelt kompakt
    fénycsövekben való felhasználására vonatkozó mentesség tekintetében a
    tudományos és műszaki fejlődéshez történő hozzáigazítás céljából
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2022/276 della Commissione del 13 dicembre 2021
    che modifica, adattandolo al progresso tecnico e scientifico, l’allegato III
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    un’esenzione relativa all’uso di mercurio nelle lampade fluorescenti ad attacco
    singolo (compatte) per usi generali di illuminazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2022/276 (2021. gada 13. decembris),
    ar ko, pielāgojot tehnikas un zinātnes attīstībai, Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES III pielikumu groza attiecībā uz atbrīvojumu dzīvsudraba
    izmantošanai viencokola (kompaktajās) luminiscences spuldzēs vispārējai apgaismei
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2022/276 2021 m. gruodžio 13 d. kuria,
    derinant prie mokslo ir technikos pažangos, dėl išimties naudoti gyvsidabrį
    bendrojo apšvietimo viencokolėse (kompaktinėse) liuminescencinėse lempose
    iš dalies keičiamas Europos Parlamento ir Tarybos direktyvos 2011/65/ES III
    priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2022/276 tat-13 ta’ Diċembru
    2021 li temenda, għall-fini ta’ adattament għall-progress tekniku u xjentifiku,
    l-Anness III tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu tal-merkurju f’lampi fluworexxenti (kompatti) b’kappa
    waħda għal finijiet ta’ tidwil ġenerali
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2022/276 van de Commissie van 13 december 2021
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage III bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad betreffende een vrijstelling voor het gebruik van kwik in (compacte)
    fluorescentielampen met enkelvoudige lampvoet voor algemene verlichtingsdoeleinden
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2022/276 z dnia 13 grudnia 2021 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik III do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    stosowania rtęci w jednotrzonkowych (kompaktowych) lampach fluorescencyjnych
    na potrzeby oświetlenia ogólnego
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2022/276 da Comissão de 13 de dezembro de 2021
    que altera, para efeitos de adaptação ao progresso científico e técnico, o
    anexo III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção relativa à utilização de mercúrio em lâmpadas fluorescentes
    de casquilho simples (compactas) para iluminação geral
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2022/276 a Comisiei din 13 decembrie 2021 de modificare,
    în scopul adaptării la progresul tehnic și științific, a anexei III la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea mercurului în lămpi fluorescente cu un singur soclu
    (compacte) destinate iluminatului general
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2022/276 z 13. decembra 2021, ktorou
    sa na účely prispôsobenia technickému a vedeckému pokroku mení príloha
    III k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    na používanie ortuti v jednopäticových (kompaktných) žiarivkách na všeobecné
    účely osvetlenia
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/276 z dne 13. decembra 2021 o spremembi
    Priloge III k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo živega srebra v (kompaktnih) fluorescentnih sijalkah z enojnim podnožjem
    za splošno razsvetljavo zaradi prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2022/276 de la Comisión de 13 de diciembre de
    2021 por la que se modifica, para adaptarlo al progreso científico y técnico,
    el anexo III de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo por
    lo que respecta a una exención relativa al uso de mercurio en lámparas fluorescentes
    de casquillo único (compactas) para usos generales de alumbrado
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2022/276 av den 13 december 2021
    om ändring, för anpassning till den tekniska och vetenskapliga utvecklingen,
    av bilaga III till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av kvicksilver i enkelsocklade (kompakta) lysrörslampor
    för allmänna belysningsändamål
