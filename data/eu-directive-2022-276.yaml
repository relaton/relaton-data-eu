title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2022/276 of 13 December 2021 amending,
    for the purpose of adapting to technical and scientific progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of mercury in single capped (compact) fluorescent lamps
    for general lighting purposes
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2022/276 de la Commission du 13 décembre 2021
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    III de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui
    concerne une exemption relative à l’utilisation de mercure dans les lampes
    fluorescentes (compactes) à simple culot, à usage d’éclairage général
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2022/276 der Kommission vom 13. Dezember 2021
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs III der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von Quecksilber in einseitig
    gesockelten (Kompakt-)Leuchtstofflampen für allgemeine Beleuchtungszwecke
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2022/276 на Комисията
    от 13 декември 2021 година за изменение, с цел
    привеждане в съответствие с научно-техническия
    напредък, на приложение III към Директива 2011/65/ЕС
    на Европейския парламент и на Съвета по отношение
    на освобождаване от ограничението за употребата
    на живак в едноцокълни (компактни) луминесцентни
    лампи за целите на общото осветление
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2022/276 ze dne 13. prosince
    2021, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha III směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití rtuti v jednopaticových (kompaktních) zářivkách
    pro všeobecné osvětlování
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2022/276 af 13. december 2021 om
    tilpasning til den videnskabelige og tekniske udvikling af bilag III til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for anvendelsen
    af kviksølv i (kompakt)lysstofrør med én sokkel til almenbelysning
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2022/276 της
    Επιτροπής της 13ης Δεκεμβρίου 2021 για την τροποποίηση,
    με σκοπό την προσαρμογή στην τεχνική και επιστημονική
    πρόοδο, του παραρτήματος III της οδηγίας 2011/65/ΕΕ
