title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1985/70 du Conseil, du 29 septembre 1970, portant
    conclusion d'un accord sous forme d'échanges de lettres, relatif à la modification
    de l'article 5 de l'annexe I de l'accord créant une association entre la Communauté
    économique européenne et la République tunisienne et à la rectification d'une
    erreur matérielle dans la liste 5 de l'annexe 3 de cet accord
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1985/70 des Rates vom 29. September 1970 über den
    Abschluß eines Abkommens in Form eines Briefwechsels zur Änderung von Artikel
    5 des Anhangs 1 des Abkommens zur Gründung einer Assoziation zwischen der Europäischen
    Wirtschaftsgemeinschaft und der Tunesischen Republik sowie über die Berichtigung
    eines materiellen Fehlers in der Liste 5 des Anhangs 3 dieses Abkommens
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1985/70 del Consiglio, del 29 settembre 1970, recante
    conclusione di un accordo, sotto forma di scambio di lettere, relativo alla modifica
    dell'articolo 5 dell'allegato 1 dell'Accordo che crea un'associazione tra la Comunità
    economica europea e la Repubblica tunisina, ed alla rettifica di un errore materiale
    nell'elenco 5 dell'allegato 3 di detto Accordo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1985/70 van de Raad van 29 september 1970 houdende
    sluiting van een Overeenkomst, in de vorm van een briefwisseling, inzake de wijziging
    van artikel 5 van bijlage 1 van de Overeenkomst waarbij een Associatie tot stand
    wordt gebracht tussen de Europese Economische Gemeenschap en de Tunesische Republiek
    en inzake de rectificatie van een materiële fout in lijst 5 van bijlage 3 van
    deze Overeenkomst
  type: main
