  content: Commission Regulation (EEC) No 379/77 of 24 February 1977 amending for
    the second time Regulation (EEC) No 2804/76 on the distillation of wines suitable
    for producing certain potable spirits obtained from wine with a registered designation
    or origin for the 1976/77 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 379/77 de la Commission, du 24 février 1977, portant
