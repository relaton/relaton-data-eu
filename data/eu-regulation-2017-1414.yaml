    Makedonijo, Združene države Amerike, Južno Afriko in Zimbabve na seznamu tretjih
    držav, ozemelj, območij ali kompartmentov, iz katerih je dovoljen uvoz nekaterega
    perutninskega blaga v Unijo ali njegov tranzit skozi Unijo v zvezi z visokopatogeno
