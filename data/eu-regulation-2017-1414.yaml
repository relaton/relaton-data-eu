    t'Isfel u ż-Żimbabwe fil-lista ta' pajjiżi terzi, territorji, żoni jew kompartimenti
    li minnhom jistgħu jiġu importati ċerti prodotti tat-tjur lejn l-Unjoni jew
    isir tranżitu minnha fir-rigward tal-influwenza tat-tjur b'patoġeniċità għolja
  type: main
