    Savienotajām Valstīm, Dienvidāfriku un Zimbabvi to trešo valstu, teritoriju,
    zonu vai nodalījumu sarakstā, no kuriem atļauts importēt Savienībā vai pārvadāt
    tranzītā caur to konkrētas mājputnu izcelsmes preces
  type: main
- language: lt
  script: Latn
