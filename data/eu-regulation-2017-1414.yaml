    lo que respecta a las entradas correspondientes a la antigua República Yugoslava
    de Macedonia, los Estados Unidos, Sudáfrica y Zimbabue en la lista de terceros
    países, territorios, zonas o compartimentos desde los cuales están permitidos
    la importación en la Unión o el tránsito por esta de determinadas mercancías
    de aves de corral, en relación con la influenza aviar de alta patogenicidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2017/1414 av den 3 augusti
    2017 om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om f.d. jugoslaviska republiken Makedonien, Förenta staterna, Sydafrika och Zimbabwe
    i förteckningen över tredjeländer, områden, zoner eller delområden från
    vilka vissa varor av fjäderfä får importeras till eller transiteras genom unionen
    i samband med högpatogen aviär influensa
