    tasavaltaa Makedoniaa, Yhdysvaltoja, Etelä-Afrikkaa ja Zimbabwea koskevien kohtien
    osalta niiden kolmansien maiden, alueiden, vyöhykkeiden tai erillisalueiden luettelossa,
    joista tiettyjen siipikarjasta saatujen hyödykkeiden tuonti unioniin tai kuljettaminen
    sen kautta on sallittua korkeapatogeenisen lintuinfluenssan yhteydessä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2017/1414 оd 3. kolovoza 2017. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosâ za bivšu jugoslavensku republiku
    Makedoniju, Sjedinjene Države, Južnu Afriku i Zimbabve na popisu trećih zemalja,
    državnih područja, zona ili kompartmenta iz kojih je dozvoljen uvoz u Uniju
    i provoz određenih proizvoda od peradi kroz nju u vezi s visokopatogenom influencom
    ptica
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1414 végrehajtási rendelete (2017. augusztus 3.)
    a 798/2008/EK rendelet I. mellékletének az egyes baromfiáruk Unióba történő
    behozatala vagy Unión keresztül történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékében
    a Macedónia Volt Jugoszláv Köztársaságra, az Egyesült Államokra, a Dél-Afrikára
    és a Zimbabwére vonatkozó bejegyzés tekintetében a magas patogenitású vírustörzsek
    okozta madárinfluenza megjelenése nyomán szükségessé vált módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/1414 della Commissione, del 3 agosto
    2017, che modifica l'allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    le voci relative all'ex Repubblica iugoslava di Macedonia, agli Stati Uniti, al
    Sud Africa e allo Zimbabwe nell'elenco di paesi terzi, loro territori, zone o
    compartimenti da cui sono consentiti le importazioni e il transito nell'Unione
    di determinati prodotti a base di pollame in relazione all'influenza aviaria ad
    alta patogenicità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/1414 (2017. gada 3. augusts),
