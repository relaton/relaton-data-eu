title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1414 of 3 August 2017 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entries for the former Yugoslav
    Republic of Macedonia, the United States, South Africa and Zimbabwe in the list
    of third countries, territories, zones or compartments from which certain poultry
    commodities may be imported into or transit through the Union in relation to highly
    pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/1414 de la Commission du 3 août 2017
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    concernant l'influenza aviaire hautement pathogène aux entrées relatives à
    l'Afrique du Sud, à l'ancienne République yougoslave de Macédoine, aux États-Unis
    et au Zimbabwe sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l'Union ou transiter par celle-ci
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/1414 der Kommission vom 3. August 2017
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich der
    Einträge zu der ehemaligen jugoslawischen Republik Mazedonien, den Vereinigten
    Staaten, Südafrika und Simbabwe in der Liste der Drittländer, Gebiete, Zonen
    und Kompartimente, aus denen bestimmte Geflügelwaren in die Union eingeführt
    bzw. durch die Union durchgeführt werden dürfen, in Bezug auf die hochpathogene
    aviäre Influenza
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/1414 на Комисията
    от 3 август 2017 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписванията
    за бившата югославска република Македония,
    Съединените щати, Южна Африка и Зимбабве в
    списъка на третите държави, територии, зони
    или компартменти, от които са разрешени вносът
    и транзитът през Съюза на някои стоки от домашни
    птици, във връзка с високопатогенната инфлуенца
    по птиците
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/1414 ze dne 3. srpna 2017, kterým
    se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položky týkající
    se Bývalé jugoslávské republiky Makedonie, Spojených států amerických,
    Jihoafrické republiky a Zimbabwe na seznamu třetích zemí, území, oblastí
    nebo jednotek, z nichž lze do Unie dovážet nebo přes její území přepravovat
    určité drůbeží komodity, v souvislosti s vysoce patogenní influenzou ptáků
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2017/1414 af 3. august 2017
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
