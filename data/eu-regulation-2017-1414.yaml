    às entradas relativas à antiga República jugoslava da Macedónia, aos Estados
    Unidos, à África do Sul e ao Zimbabué na lista de países terceiros, territórios,
    zonas ou compartimentos a partir dos quais são autorizados a importação e o
    trânsito na União de determinados produtos à base de aves de capoeira, relativamente
    à gripe aviária de alta patogenicidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2017/1414 al Comisiei din 3 august
    2017 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubricile referitoare la fosta Republică iugoslavă a Macedoniei, Statele Unite,
    Africa de Sud și Zimbabwe din lista cu țări terțe, teritorii, zone sau compartimente
    din care anumite produse obținute de la păsări de curte pot fi importate în
    Uniune sau pot tranzita Uniunea în contextul riscului de gripă aviară înalt
    patogenă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2017/1414 z 3. augusta 2017, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položky týkajúce
    sa bývalej Juhoslovanskej republiky Macedónsko, Spojených štátov amerických,
    Južnej Afriky a Zimbabwe v zozname tretích krajín, území, oblastí alebo
    jednotiek, z ktorých možno do Únie dovážať alebo cez jej územie prevážať
    určité komodity z hydiny v súvislosti s vysokopatogénnou vtáčou chrípkou
  type: main
- language: sl
  script: Latn
