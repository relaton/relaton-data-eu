    Jugoslavijos Respublikos Makedonijos, Jungtinių Amerikos Valstijų, Pietų Afrikos
    ir Zimbabvės įrašų trečiųjų šalių, teritorijų, zonų ar skyrių, iš
    kurių galima importuoti į Sąjungą ir vežti tranzitu per Sąjungą tam tikras
