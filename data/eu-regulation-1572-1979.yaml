type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1572/79 of 25 July 1979 re-establishing
    the levying of customs duties on umbrellas and sunshades (including walking-stick
    umbrellas, umbrella tents, and garden and similar umbrellas), falling within heading
    No 66.01 and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1572/79 de la Commission, du 25 juillet 1979, portant
    rétablissement de la perception de droits de douane applicables aux parapluies,
    parasols et ombrelles, y compris les parapluies-cannes et les parasols-tentes
    et similaires de la position 66.01 du tarif douanier commun, originaires de Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1572/79 der Kommission vom 25. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Regenschirme und Sonnenschirme, einschließlich Stockschirme,
    Schirmzelte und dergleichen, der Tarifnummer 66.01, mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1572/79 af 25. juli 1979 om genindførelse
    af opkrævning af toldafgifter for paraplyer og parasoller (herunder stokkeparaplyer,
    paraplytelte, haveparasoller o.lign.), henhørende under pos. 66.01 i den fælles
    toldtarif, som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1572/79 della Commissione, del 25 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili a ombrelli (da pioggia
    e da sole), compresi gli ombrelli-bastone, i parasole-tende, gli ombrelloni e
    simili, della voce 66.01 della tariffa doganale comune, originari della Corea
    del Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1572/79 van de Commissie van 25 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op paraplu'
    s en parasols, alsmede wandelstokparaplu' s, tuinparasols, parasoltenten en dergelijke,
    van post 66.01, van oorsprong uit Zuid-Korea, ten behoeve waarvan bij Verordening
    (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
