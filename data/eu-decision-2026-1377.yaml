type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/1377 of 11 May 2026 amending
    Implementing Decision (EU) 2019/961 authorising a provisional measure taken by
    the French Republic in accordance with Article 129 of Regulation (EC) No 1907/2006
    of the European Parliament and of the Council concerning the Registration, Evaluation,
    Authorisation and Restriction of Chemicals (REACH) to restrict the use and the
    placing on the market of certain wood treated with creosote and other creosote-related
    substances ((notified under document C(2026) 2999)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/1377 de la Commission du 11 mai 2026
    modifiant la décision d’exécution (UE) 2019/961 autorisant une mesure provisoire
    prise par la République française conformément à l’article 129 du règlement
    (CE) no 1907/2006 du Parlement européen et du Conseil concernant l’enregistrement,
    l’évaluation et l’autorisation des substances chimiques, ainsi que les restrictions
    applicables à ces substances (REACH), afin de restreindre l’utilisation et
    la mise sur le marché de certains bois traités avec de la créosote et avec
    d’autres substances apparentées [notifiée sous le numéro C(2026) 2999]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/1377 der Kommission vom 11. Mai 2026
