- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1448 of 15 July 2025 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2019/1259 on imports of threaded tube
    or pipe cast fittings of malleable cast iron, originating in the People’s Republic
    of China and Thailand by imports of unthreaded tube or pipe cast fittings of malleable
    cast iron originating in the People’s Republic of China and making such imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1448 de la Commission du 15 juillet
    2025 portant ouverture d’une enquête relative à un éventuel contournement
    des mesures antidumping instituées par le règlement d’exécution (UE) 2019/1259
    sur les importations d’accessoires de tuyauterie filetés, moulés et en fonte
    malléable originaires de la République populaire de Chine et de Thaïlande par
    des importations d’accessoires de tuyauterie non filetés, moulés et en fonte
    malléable originaires de la République populaire de Chine, et soumettant ces
    importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1448 der Kommission vom 15. Juli 2025
    zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit
    der Durchführungsverordnung (EU) 2019/1259 eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren von gegossenen Rohrformstücken, Rohrverschlussstücken
    und Rohrverbindungsstücken, mit Gewinde, aus Temperguss, mit Ursprung in der
    Volksrepublik China und Thailand, durch die Einfuhren von gegossenen Rohrformstücken,
    Rohrverschlussstücken und Rohrverbindungsstücken, ohne Gewinde, aus Temperguss,
    mit Ursprung in der Volksrepublik China, und zur zollamtlichen Erfassung dieser
    Einfuhren
  type: main
