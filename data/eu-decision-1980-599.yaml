title:
- language: en
  script: Latn
  content: '80/599/EEC: Commission Decision of 19 June 1980 accepting undertakings
    in connection with the anti-dumping proceeding concerning imports of standardized
    electric multiphase motors having an output of more that 0*75 kW but not more
    than 75 kW, originating in the USSR and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '80/599/CEE: Décision de la Commission, du 19 juin 1980, portant acceptation
    des engagements souscrits dans le cadre de la procédure anti-"dumping" concernant
    les importations de moteurs électriques polyphasés normalisés d'' une puissance
    de plus de 0,75 à 75 kilowatts inclus, originaires d'' Union soviétique et portant
    clôture de cette procédure à l'' égard de ce pays'
  type: main
- language: de
  script: Latn
  content: '80/599/EWG: Beschluß der Kommission vom 19. Juni 1980 über die Annahme
    von schriftlichen Verpflichtungserklärungen im Rahmen des Antidumpingverfahrens
    hinsichtlich Einfuhren von Mehrphasen-Standard-Wechselstrommotoren mit einer Leistung
    von mehr als 0,75 kW bis 75 kW mit Ursprung in der Sowjetunion sowie über die
    Einstellung dieses Verfahrens gegenüber diesem Land'
  type: main
- language: da
  script: Latn
  content: '80/599/EØF: Kommissionens afgørelse af 19. juni 1980 om godtagelse af
    tilsagn afgivet i forbindelse med anti-dumpingproceduren vedrørende import af
    standardiserede elektriske motorer, flerfasede, med effekt på over 0,75 kW, men
    højst 75 kW, med oprindelse i Sovjetunionen, og om afslutning af denne procedure'
  type: main
- language: it
  script: Latn
  content: '80/599/CEE: Decisione della Commissione, del 19 giugno 1980, relativa
    all'' accettazione degli impegni sottoscritti nell'' ambito della procedura antidumping
    relativa alle importazioni di motori elettrici polifase normalizzati, di potenza
    superiore a 0,75 kW e inferiore o pari a 75 kW, originari dell'' Unione Sovietica
    e recante chiusura della procedura nei confronti di questo paese'
  type: main
- language: nl
  script: Latn
  content: '80/599/EEG: Besluit van de Commissie van 19 juni 1980 houdende aanvaarding
    van de verbintenissen aangegaan in het kader van de anti-dumpingprocedure betreffende
    de invoer van gestandaardiseerde meerfasige elektromotoren met een vermogen van
    meer dan 0,75 kW tot en met 75 kW van oorsprong uit de Sowjetunie en houdende
    beëindiging van de procedure met betrekking tot dit land'
  type: main
