---
id: EURegulation25371999
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2537/1999 of 29 November 1999 amending Regulations
    (EEC) No 2861/93, (EC) No 2199/94, (EC) No 663/96 and (EC) No 1821/98 concerning
    the imposition of definitive anti-dumping duties on imports of certain magnetic
    disks (3,5" microdisks) originating in Japan, Taiwan, the People's Republic of
    China, Hong Kong, the Republic of Korea, Malaysia, Mexico, the United States of
    America and Indonesia and Regulation (EC) No 1335/1999 reimposing a definitive
    anti-dumping duty on imports of certain magnetic disks (3,5" microdisks) originating
    in Indonesia and produced and sold for export to the Community by PT Betadiskindo
    Binatama
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2537/1999 du Conseil, du 29 novembre 1999, modifiant
    les règlements (CEE) nº 2861/93, (CE) nº 2199/94, (CE) nº 663/96 et (CE) nº
    1821/98 qui instituent un droit antidumping définitif sur les importations de
    certains disques magnétiques (microdisques de 3,5 pouces) originaires du Japon,
    de Taïwan, de la République populaire de Chine, de Hong-Kong, de la République
    de Corée, de Malaisie, du Mexique, des États-Unis d'Amérique et d'Indonésie
    et le règlement (CE) nº 1335/1999 qui réinstitue un droit antidumping définitif
    sur les importations de certains disques magnétiques (microdisques de 3,5 pouces)
    originaires d'Indonésie, fabriqués et vendus à l'exportation vers la Communauté
    par PT Betadiskindo Binatama
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2537/1999 des Rates vom 29. November 1999 zur Änderung
    der Verordnungen (EWG) Nr. 2861/93, (EG) Nr. 2199/94, (EG) Nr. 663/96, (EG) Nr.
    1821/98 zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren
    bestimmter Magnetplatten (3,5"-Mikroplatten) mit Ursprung in Japan, Taiwan, der
    Volksrepublik China, Hongkong, der Republik Korea, Malaysia, Mexiko, den Vereinigten
    Staaten von Amerika und Indonesien sowie der Verordnung (EG) Nr. 1335/1999 zur
    Wiedereinführung eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter
    von PT Betadiskindo Binatama hergestellter und zur Ausfuhr in die Gemeinschaft
    verkaufter Magnetplatten (3,5"-Mikroplatten) mit Ursprung in Indonesien
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2537/1999 ze dne 29. listopadu 1999, kterým
    se mění nařízení (EHS) č. 2861/93, (ES) č. 2199/94, (ES) č. 663/96 a (ES)
    č. 1821/98 o uložení konečných antidumpingových cel z dovozu některých
    magnetických disků (3,5″ disket) pocházejících z Japonska, Tchaj-wanu,
    Čínské lidové republiky, Hong Kongu, Korejské republiky, Malajsie, Mexika,
    Spojených států amerických a Indonésie a nařízení (ES) č. 1335/1999 o
    opětovném uložení konečného antidumpingového cla z dovozu některých magnetických
    disků (3,5″ disket) pocházejících z Indonésie a vyráběných a prodávaných
    na vývoz do Společenství společností PT Betadiskindo Binatama
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2537/1999 af 29. november 1999 om ændring
    af forordning (EØF) nr. 2861/93, (EF) nr. 2199/94, (EF) nr. 663/96, (EF) nr.
    1821/98 om indførelse af en endelig antidumpingtold på importen af visse magnetplader
    (3,5" disketter) med oprindelse i Japan, Taiwan, Folkerepublikken Kina, Hongkong,
    Republikken Korea, Malaysia, Mexico, Amerikas Forenede Stater og Indonesien, samt
    forordning (EF) nr. 1335/1999 om genindførelse af en endelig antidumpingtold
    på importen af visse magnetplader (3,5" disketter) med oprindelse i Indonesien,
    som fremstilles og sælges til eksport til Fællesskabet af PT Betadiskindo Binatama
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2537/1999 του Συμβουλίου,
    της 29ης Νοεμβρίου 1999, για την τροποποίηση των
    κανονισμών του Συμβουλίου (ΕΟK) αριθ. 2861/93, (ΕΚ)
    αριθ. 2199/94, (ΕΚ) αριθ. 663/96 και (ΕΚ) αριθ. 1821/98 σχετικά
    με την επιβολή οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές ορισμένων μαγνητικών δίσκων
    (μικροδίσκων 3,5"), καταγωγής Ιαπωνίας, Ταϊβάν,
    Λαϊκής Δημοκρατίας της Κίνας, Χονγκ Κονγκ,
    Δημοκρατίας της Κορέας, Μαλαισίας, Μεξικού,
    Hνωμένων Πολιτειών Αμερικής και Ινδονησίας
    και του κανονισμού (ΕΚ) αριθ. 1335/1999 του Συμβουλίου
    περί εκ νέου επιβολής οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές ορισμένων μαγνητικών δίσκων
    (μικροδίσκων 3,5";) καταγωγής Ινδονησίας που
    παράγονται και πωλούνται προς εξαγωγή στην
    Κοινότητα από την ΡΤ Betadiskindo Binatama
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 2537/1999, 29. november 1999, millega muudetakse
    teatavate Jaapanist, Taiwanilt, Hiina Rahvavabariigist, Hong Kongist, Korea Vabariigist,
    Malaisiast, Mehhikost, Ameerika Ühendriikidest ja Indoneesiast pärit magnetketaste
    (3,5-tollised mikrodisketid) impordi suhtes lõplike dumpinguvastaste tollimaksude
    kehtestamist käsitlevaid määrusi (EMÜ) nr 2861/93, (EÜ) nr 2199/94, (EÜ)
    nr 663/96 ja (EÜ) nr 1821/98 ning määrust (EÜ) nr 1335/1999 teatavate Indoneesiast
    pärit ja PT Betadiskindo Binatama poolt toodetavate ja ühendusse eksportimiseks
    müüdavate magnetketaste (3,5-tollised mikrodisketid) impordi suhtes lõplike
    dumpinguvastaste tollimaksude taaskehtestamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2537/1999, annettu 29 päivänä marraskuuta
    1999, lopullisen polkumyyntitullin käyttöön ottamisesta tiettyjen Japanista,
    Taiwanista, Kiinan kansantasavallasta, Hongkongista, Korean tasavallasta, Malesiasta,
    Meksikosta, Amerikan yhdysvalloista ja Indonesiasta peräisin olevien magneettilevyjen
    (3,5 tuuman levykkeiden) tuonnissa annettujen asetusten (ETY) N:o 2861/93, (EY)
    N:o 2199/94, (EY) N:o 663/96 ja (EY) N:o 1821/98 muuttamisesta sekä lopullisen
    polkumyyntitullin ottamisesta uudelleen käyttöön tiettyjen Indonesiasta peräisin
    olevien ja PT Betadiskindo Binataman valmistamien ja yhteisöön vientiä varten
    myymien magneettilevyjen (3,5 tuuman levykkeiden) tuonnissa annetun asetuksen
    (EY) N:o 1335/1999 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2537/1999/EK rendelete (1999. november 29.) a Japánból, Tajvanból,
    a Kínai Népköztársaságból, Hongkongból, a Koreai Köztársaságból, Malajziából,
    Mexikóból, az Amerikai Egyesült Államokból és Indonéziából származó
    egyes mágneslemezek (3,5″ mikrolemezek) behozatalára vonatkozó végleges
    dömpingellenes vámok kivetéséről szóló 2861/93/EGK, 2199/94/EK, 663/96/EK
    és 1821/98/EK rendelet, és az Indonéziából származó, a PT Betadiskindo
    Binatama által a Közösségbe történő exportra gyártott és értékesített
    egyes mágneslemezek (3,5″ mikrolemezek) behozatalára vonatkozó végleges
    dömpingellenes vám újbóli kivetéséről szóló 1335/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2537/1999 del Consiglio, del 29 novembre 1999, che
    modifica i regolamenti (CEE) n. 2861/93, (CE) n. 2199/94, (CE) n. 663/96 e (CE)
    n. 1821/98 che istituiscono un dazio antidumping definitivo sulle importazioni
    di alcuni tipi di dischi magnetici (microfloppy da 3,5 pollici) originari del
    Giappone, di Taiwan, della Repubblica popolare cinese, di Hong Kong, della Repubblica
    di Corea, della Malaysia, del Messico, degli Stati Uniti d'America e dell'Indonesia
    e il regolamento (CE) n. 1335/1999 che reintroduce un dazio antidumping definitivo
    sulle importazioni di alcuni tipi di dischi magnetici (microfloppy da 3,5 pollici)
    originari dell'Indonesia e prodotti e venduti per l'esportazione nella Comunità
    dalla PT Betadiskindo Binatama
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2537/1999 (1999. gada 29. novembris), ar kuru groza
    Regulas (EEK) Nr. 2861/93, (EK) Nr. 2199/94, (EK) Nr. 663/96 un (EK) Nr. 1821/98
    par galīgo antidempinga maksājumu uzlikšanu dažu Japānas, Taivānas, Ķīnas
    Tautas Republikas, Honkongas, Korejas Republikas, Malaizijas, Meksikas, Amerikas
    Savienoto Valstu un Indonēzijas izcelsmes magnētisko disku (3,5 collu mikrodisku)
    importam un Regulu (EK) Nr. 1335/1999, ar ko atkārtoti uzliek galīgo antidempinga
    maksājumu par tādu dažu magnētisko disku (3,5 collu mikrodisku) importu, kuru
    izcelsme ir Indonēzijā un kurus ražo un eksportam uz Kopienu pārdod PT Betadiskindo
    Binatama
  type: main
- language: lt
  script: Latn
  content: 1999 m. lapkričio 29 d. Tarybos reglamentas (EB) Nr. 2537/1999, iš dalies
    keičiantis Reglamentus (EEB) Nr. 2861/93, (EB) Nr. 2199/94, (EB) Nr. 663/96 ir
    (EB) Nr. 1821/98 dėl galutinio antidempingo muitų nustatymo už tam tikrų magnetinių
    diskų (3,5″ mikrodiskų), kurių kilmės šalys yra Japonija, Taivanas, Kinijos
    Liaudies Respublika, Honkongas, Korėjos Respublika, Malaizija, Meksika, Jungtinės
    Amerikos Valstijos ir Indonezija, importą ir Reglamentą (EB) Nr. 1335/1999,
    dar kartą nustatantį galutinį antidempingo muitą už tam tikrų magnetinių
    diskų (3,5″ mikrodiskų), kurių kilmės šalis yra Indonezija ir kuriuos gamina
    bei parduoda eksportui į Bendriją PT Betadiskindo Binatama, importą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2537/1999 tad-29 Novembru 1999 li jemenda
    r-Regolamenti (KEE) Nru 2861/93, (KE) Nru 2199/94, (KE) Nru 663/96 u (KE) Nru
    1821/98 dwar l-imposizzjoni ta' dazji definitivi kontra d-dumping fuq importazzjonijiet
    ta' diski manjetiċi (3,5’’ mikrodisks) ġejjin mill-Ġappun, it-Tajwan, ir-Repubblika
    Popolari Ċiniża, Hong Kong, ir-Repubblika tal-Korea, il-Malasja, il-Messiku,
    l-Istati Uniti ta' l-Amerika u l-Indonesja u r-Regolament (KE) Nru 1335/1999 li
    jerġa' jimponi dazju definitiv kontra d-dumping fuq importazzjonijiet ta' ċerti
    diski manjetiċi (3,5’’ mikrodisks) ġejjin mill-Indonesja u maħduma u mibjugħa
    għall-esportazzjoni lejn il-Komunità minn PT Betadiskindo Binatama
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2537/1999 van de Raad van 29 november 1999 tot wijziging
    van de Verordeningen (EEG) nr. 2861/93, (EG) nr. 2199/94, (EG) nr. 663/96 en (EG)
    nr. 1821/98 betreffende de instelling van een definitief antidumpingrecht op de
    invoer van bepaalde magneetschijven (3,5"-microschijven) van oorsprong uit Japan,
    Taiwan, de Volksrepubliek China, Hongkong, de Republiek Korea, Maleisië, Mexico,
    de Verenigde Staten van Amerika en Indonesië, en van Verordening (EG) nr. 1335/1999
    tot wederinstelling van het definitieve antidumpingrecht op de invoer van bepaalde
    magneetschijven (3,5"-microschijven) uit Indonesië die door PT Betadiskindo Binatama
    worden geproduceerd en naar de Gemeenschap uitgevoerd
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 2537/1999 z dnia 29 listopada 1999 r. zmieniające
    rozporządzenia (EWG) nr 2861/93, (WE) nr 2199/94, (WE) nr 663/96 i (WE) nr 1821/98
    dotyczące nałożenia ostatecznych ceł antydumpingowych na przywóz niektórych
    dysków magnetycznych (dyskietek 3,5-calowych) pochodzących z Japonii, Tajwanu,
    Chińskiej Republiki Ludowej, Hongkongu, Republiki Korei, Malezji, Meksyku, Stanów
    Zjednoczonych Ameryki oraz Indonezji, a także rozporządzenie (WE) nr 1335/1999
    nakładające ponownie ostateczne cło antydumpingowe na przywóz niektórych
    dysków magnetycznych (dyskietek 3,5-calowych) pochodzących z Indonezji oraz
    produkowanych i sprzedawanych na wywóz do Wspólnoty przez PT Betadiskindo Binatama
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2537/1999 do Conselho, de 29 de Novembro de 1999,
    que altera os Regulamentos (CEE) n° 2861/93, (CE) n° 2199/94, (CE) n° 663/96
    e (CE) n° 1821/98 relativos à instituição de um direito anti-dumping definitivo
    sobre as importações de certos discos magnéticos (microdiscos de 3,5 polegadas)
    originários do Japão, de Taiwan, da República Popular da China, de Hong Kong,
    da República da Coreia, da Malásia, do México, dos Estados Unidos da América
    e da Indonésia e o Regulamento (CE) n° 1335/1999, que reinstitui um direito
    anti-dumping definitivo sobre as importações de certos discos magnéticos (microdiscos
    de 3,5 polegadas) originários da Indonésia, produzidos e vendidos para exportação
    para a Comunidade pela PT Betadiskindo Binatama
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2537/1999 z 29. novembra 1999, ktorým sa menia
    a dopĺňajú nariadenia (EHS) č. 2861/93, (ES) č. 2199/94, (ES) č. 663/96
    a (ES) č. 1821/98 týkajúce sa uloženia konečných antidumpingových ciel
    z dovozu niektorých magnetických diskov (3,5″ mikrodiskov) s pôvodom v Japonsku,
    Taiwane, Čínskej ľudovej republike, Hongkongu, Kórejskej republike, Malajzii,
    Mexiku, Spojených štátoch amerických a Indonézii a nariadenie (ES) č. 1335/1999
    o opätovnom uložení konečného antidumpingového cla z dovozu niektorých
    magnetických diskov (3,5″ mikrodiskov) s pôvodom v Indonézii, ktoré vyrába
    a predáva na vývoz do spoločenstva PT Betadiskindo Binatama
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2537/1999 z dne 29. novembra 1999 o spremembi Uredb
    (EGS) št. 2861/93, (ES) št. 2199/94, (ES) št. 663/96 in (ES) št. 1821/98 v
    zvezi z uvedbo dokončnih protidampinških dajatev na uvoz nekaterih magnetnih
    diskov (3,5-palčne diskete) po poreklu iz Japonske, Tajvana, Ljudske republike
    Kitajske, Hongkonga, Republike Koreje, Malezije, Mehike, Združenih držav Amerike
    in Indonezije in Uredbe (ES) št. 1335/1999 o ponovni uvedbi dokončnih protidampinških
    dajatev na uvoz nekaterih magnetnih diskov (3,5-palčne diskete) po poreklu iz
    Indonezije, ki jih proizvaja in prodaja PT Betadiskindo Binatama za izvoz v Skupnost
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2537/1999 del Consejo, de 29 de noviembre de 1999,
    por el que se modifican los Reglamentos (CEE) nº 2861/93, (CE) nº 2199/94, (CE)
    nº 663/96 y (CE) nº 1821/98 relativos al establecimiento de derechos antidumping
    definitivos sobre las importaciones de determinados discos magnéticos (microdiscos
    de 3,5 pulgadas) originarios de Japón, Taiwán, República Popular de China,
    Hong Kong, República de Corea, Malasia, México, Estados Unidos de América e
    Indonesia, y el Reglamento (CE) nº 1335/1999 por el que se restablece un derecho
    antidumping definitivo sobre las importaciones de ciertos discos magnéticos (microdiscos
    de 3,5") originarios de Indonesia, producidos y vendidos para su exportación
    a la Comunidad por PT Betadiskindo Binatama
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2537/1999 av den 29 november 1999 om att ändra
    rådets förordningar (EEG) nr 2861/93, (EG) nr 2199/94, (EG) nr 663/96 och (EG)
    nr 1821/98 om att införa slutgiltiga antidumpningstullar på import av vissa
    magnetskivor (3,5-tumsdisketter) med ursprung i Japan, Taiwan, Folkrepubliken
    Kina, Hongkong, Sydkorea, Malaysia, Mexiko, Amerikas förenta stater och Indonesien
    samt förordning (EG) nr 1335/1999 om att återinföra en slutgiltig antidumpningstull
    på import av vissa magnetskivor (3,5-tumsdisketter) med ursprung i Indonesien
    som tillverkas och säljs på export till gemenskapen av PT Betadiskindo Binatama
  type: main
