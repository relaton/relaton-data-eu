    des prélèvements applicables aux produits du secteur de la viande de porc autres
    que le porc abattu et le règlement (CEE) n° 950/68 relatif au tarif douanier
    commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2333/77 der Kommission vom 25. Oktober 1977 zur Änderung
