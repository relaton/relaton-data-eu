    der Abschöpfungen für Schweinefleischerzeugnisse mit Ausnahme von geschlachteten
    Schweinen und der Verordnung (EWG) Nr. 950/68 über den Gemeinsamen Zolltarif
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2333/77 af 25. oktober 1977 om ændring
