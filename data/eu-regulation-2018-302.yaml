    zamieszkania lub miejsce prowadzenia działalności na rynku wewnętrznym oraz
    w sprawie zmiany rozporządzeń (WE) nr 2006/2004 oraz (UE) 2017/2394 i dyrektywy
    2009/22/WE
  type: main
- language: pt
  script: Latn
