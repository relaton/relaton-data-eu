id: EURegulation2531980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 253/80 of 4 February 1980 re-establishing
    the levying of customs duties on twine, cordage, ropes and cables, of synthetic
    textile fibres, products of category No 90 (code 0900) and originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 253/80 de la Commission, du 4 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux ficelles,
    cordes et cordages, en fibres textiles synthétiques, de la catégorie de produits
    n° 90 (code 0900), originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 253/80 der Kommission vom 4. Februar 1980 über die
    Wiedereinführung des Zollsatzes für Bindfäden, Seile und Taue, aus synthetischen
    Spinnstoffen, der Warenkategorie Nr. 90 (Kennziffer 0900), mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 253/80 af 4. februar 1980 om genindførelse
    af opkrævning af toldafgifter for sejlgarn, reb og tovværk, syntetiske fibre,
    under varekategori nr. 90 (kode 0900), som har oprindelse i Sydkorea og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 253/80 della Commissione, del 4 febbraio 1980, che
    ripristina la riscossione dei dazi doganali applicabili a spago, corde e funi
    di fibre tessili sintetiche della categoria di prodotti n. 90 (codice 0900), originari
    della Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 253/80 van de Commissie van 4 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bindgaren,
    touw en kabel van synthetische vezels van de categorie van produkten nr. 90 (codenummer
    0900) van oorsprong uit Zuid-Korea waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
