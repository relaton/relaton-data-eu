id: EURegulation20171145
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1145 of 8 June 2017 on the
    withdrawal from the market of certain feed additives authorised pursuant to Council
    Directives 70/524/EEC and 82/471/EEC and repealing the obsolete provisions authorising
    those feed additives
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/1145 de la Commission du 8 juin 2017
    relatif au retrait du marché de certains additifs pour l'alimentation animale
    autorisés au titre des directives du Conseil 70/524/CEE et 82/471/CEE, et abrogeant
    les dispositions obsolètes autorisant ces additifs
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/1145 der Kommission vom 8. Juni 2017
    über die Marktrücknahme bestimmter gemäß den Richtlinien 70/524/EWG und 82/471/EWG
    des Rates zugelassener Futtermittelzusatzstoffe und zur Aufhebung der veralteten
    Bestimmungen über die Zulassung dieser Futtermittelzusatzstoffe
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/1145 на Комисията
    от 8 юни 2017 година относно изтеглянето от пазара
    на някои фуражни добавки, разрешени в съответствие
    с директиви 70/524/ЕИО и 82/471/ЕИО на Съвета, и за
    отмяна на неактуалните разпоредби, с които
    се разрешават посочените фуражни добавки
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/1145 ze dne 8. června 2017 o
    stažení některých doplňkových látek povolených podle směrnic Rady 70/524/EHS
    a 82/471/EHS z trhu a o zrušení zastaralých ustanovení, kterými se tyto doplňkové
    látky povolují
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2017/1145 af 8. juni 2017
    om tilbagetrækning fra markedet af visse fodertilsætningsstoffer, der er tilladt
    i henhold til Rådets direktiv 70/524/EØF og 82/471/EØF, og om ophævelse af
    forældede bestemmelser om godkendelse af disse fodertilsætningsstoffer
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2017/1145 της Επιτροπής,
    της 8ης Ιουνίου 2017, σχετικά με την απόσυρση
    από την αγορά ορισμένων πρόσθετων υλών ζωοτροφών
    που εγκρίθηκαν σύμφωνα με τις οδηγίες του Συμβουλίου
    70/524/ΕΟΚ και 82/471/ΕΟΚ και για την κατάργηση των
    παρωχημένων διατάξεων για την έγκριση αυτών
    των πρόσθετων υλών ζωοτροφών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2017/1145, 8. juuni 2017, milles käsitletakse
    nõukogu direktiivide 70/524/EMÜ ja 82/471/EMÜ kohaselt loa saanud teatavate
    söödalisandite kõrvaldamist turult ning millega tunnistatakse kehtetuks selliste
    söödalisandite lubamist käsitlevad aegunud sätted
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2017/1145, annettu 8 päivänä
    kesäkuuta 2017, tiettyjen neuvoston direktiivien 70/524/ETY ja 82/471/ETY nojalla
    hyväksyttyjen rehun lisäaineiden poistamisesta markkinoilta sekä kyseisten
    rehun lisäaineiden hyväksymistä koskevien vanhentuneiden säännösten kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2017/1145 оd 8. lipnja 2017. o povlačenju
    s tržišta određenih dodataka hrani za životinje odobrenih u skladu s direktivama
    Vijeća 70/524/EEZ i 82/471/EEZ te o stavljanju izvan snage zastarjelih odredbi
    o odobravanju tih dodataka hrani za životinje
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1145 végrehajtási rendelete (2017. június 8.)
    a 70/524/EGK és a 82/471/EGK tanácsi irányelv értelmében engedélyezett egyes
    takarmány-adalékanyagok forgalomból történő kivonásáról, valamint az
    ezen takarmány-adalékanyagokat engedélyező elavult rendelkezések hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/1145 della Commissione, del 8 giugno
    2017, relativo al ritiro dal mercato di alcuni additivi per mangimi autorizzati
    a norma delle direttive del Consiglio 70/524/CEE e 82/471/CEE e che abroga le
    disposizioni obsolete che autorizzano tali additivi per mangimi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/1145 (2017. gada 8. jūnijs) par
    dažu tādu barības piedevu izņemšanu no tirgus, kam atļauja piešķirta saskaņā
    ar Padomes Direktīvu 70/524/EEK un 82/471/EEK, un ar kuru atceļ novecojušos
    noteikumus, ar ko šīs barības piedevas tikušas atļautas
  type: main
- language: lt
  script: Latn
  content: 2017 m. birželio 8 d. Komisijos įgyvendinimo reglamentas (ES) 2017/1145,
    kuriuo iš rinkos pašalinami tam tikri pašaro priedai, kuriuos leidžiama naudoti
    pagal Tarybos direktyvas 70/524/EEB ir 82/471/EEB, ir panaikinamos pasenusios
    nuostatos, kuriomis leidžiama naudoti šiuos priedus
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/1145 tas-8 ta'
    Ġunju 2017 dwar l-irtirar mis-suq ta' ċerti addittivi tal-għalf awtorizzati
    skont id-Direttivi tal-Kunsill 70/524/KEE u 82/471/KEE u t-tħassir ta' dispożizzjonijiet
    skaduti li jawtorizzaw dawk l-addittivi tal-għalf
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2017/1145 van de Commissie van 8 juni 2017
    betreffende het uit de handel nemen van bepaalde toevoegingsmiddelen voor diervoeding
    waarvoor overeenkomstig Richtlijnen 70/524/EEG en 82/471/EEG van de Raad een vergunning
    is verleend en tot intrekking van de verouderde bepalingen waarbij voor die toevoegingsmiddelen
    een vergunning is verleend
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2017/1145 z dnia 8 czerwca 2017
    r. w sprawie wycofania z obrotu niektórych dodatków paszowych dopuszczonych
    na podstawie dyrektyw Rady 70/524/EWG i 82/471/EWG oraz uchylenia nieaktualnych
    przepisów dopuszczających te dodatki paszowe
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2017/1145 da Comissão, de 8 de junho de
    2017, relativo à retirada do mercado de certos aditivos para a alimentação
    animal autorizados nos termos das Diretivas 70/524/CEE e 82/471/CEE do Conselho
    e que revoga as disposições obsoletas que autorizam esses aditivos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2017/1145 al Comisiei of 8 iunie
    2017 privind retragerea de pe piață a anumitor aditivi furajeri autorizați
    în temeiul Directivelor 70/524/CEE și 82/471/CEE ale Consiliului și de abrogare
    a dispozițiilor caduce în baza cărora sunt autorizați aditivii furajeri respectivi
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2017/1145 z 8. júna 2017 o stiahnutí
    z trhu určitých kŕmnych doplnkových látok povolených podľa smerníc Rady
    70/524/EHS a 82/471/EHS a o zrušení zastaraných ustanovení, ktorými sa povoľujú
    uvedené kŕmne doplnkové látky
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2017/1145 z dne 8. junija 2017 o umiku s
    trga nekaterih krmnih dodatkov, dovoljenih v skladu z direktivama Sveta 70/524/EGS
    in 82/471/EGS, ter razveljavitvi zastarelih določb o odobritvi navedenih krmnih
    dodatkov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2017/1145 de la Comisión, de 8 de junio
    de 2017, relativo a la retirada del mercado de determinados aditivos para piensos
    autorizados con arreglo a las Directivas 70/524/CEE y 82/471/CEE del Consejo y
    por el que se derogan las disposiciones obsoletas por las que se autorizaron estos
    aditivos para piensos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2017/1145 av den 8 juni 2017
    om tillbakadragande från marknaden av vissa fodertillsatser som godkänts i enlighet
    med rådets direktiv 70/524/EEG och 82/471/EEG och om upphävande av de obsoleta
    bestämmelserna om godkännande av dessa fodertillsatser
  type: main
