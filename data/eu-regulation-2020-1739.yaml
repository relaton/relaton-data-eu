    agricoli inclusi nell’elenco dell’OMC riferito all’Unione a seguito del
    recesso del Regno Unito dall’Unione, un contingente tariffario per le carni
    di pollame originarie dell’Ucraina e un contingente tariffario per le carni
    di animali della specie bovina originarie del Canada
  type: main
