    qui concerne les quantités disponibles pour les contingents tarifaires pour certains
    produits agricoles figurant dans la liste OMC de l’Union après le retrait du
    Royaume-Uni de l’Union, un contingent tarifaire pour la viande de volaille originaire
    d’Ukraine et un contingent tarifaire pour la viande bovine originaire du Canada
  type: main
