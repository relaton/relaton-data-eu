  content: Décision du Conseil du 12 octobre 1971, portant conclusion d'un accord
    entre la Communauté économique et le comité international de la Croix-Rouge
    relatif à la fourniture de céréales à titre d'aide alimentaire d'urgence en
    faveur des réfugiés bengalis en Inde
  type: main
- language: de
  script: Latn
  content: '72/89/EWG: Beschluß des Rates vom 12. Oktober 1971 über den Abschluß
    eines Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft und dem Internationalen
    Komitee vom Roten Kreuz über die Lieferung von Getreide im Rahmen der Sofort-Nahrungsmittelhilfe
    zugunsten der bengalischen Flüchtlinge in Indien'
  type: main
- language: it
  script: Latn
