    della Croce Rossa per la fornitura di cereali a titolo di aiuto alimentare urgente
    in favore dei rifugiati del Bengala in India'
  type: main
- language: nl
  script: Latn
  content: '72/89/EEG: Besluit van de Raad van 12 oktober 1971 houdende sluiting van
    een Overeenkomst tussen de Europese Economische Gemeenschap en het Internationale
    Comité van het Rode Kruis betreffende de levering van graan in het kader van
    dringende voedselhulp ten gunste van de Bengaalse vluchtelingen in India'
