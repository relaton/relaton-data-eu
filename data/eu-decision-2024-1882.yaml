    technické a provozní specifikace, jež umožňují, aby obchodní služba poskytovaná
    systémem vytvořeným v rámci programu Galileo odpovídala funkci podle čl.
    2 odst. 4 písm. c) nařízení Evropského parlamentu a Rady (EU) č. 1285/2013,
