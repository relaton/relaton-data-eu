title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1998/80 of 28 July 1980 determining to what
    extent applications for import licences lodged during the month of July 1980 for
    high-quality fresh, chilled or frozen beef and veal can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1998/80 de la Commission, du 28 juillet 1980, déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d' importation
    déposées au mois de juillet 1980 pour les viandes bovines de haute qualité,
    fraîches, réfrigérées ou congelées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1998/80 der Kommission vom 28. Juli 1980 zur Bestimmung
    des Maßstabs für die Genehmigung der im Juli 1980 eingereichten Anträge auf
    Einfuhrlizenzen für frisches, gekühltes oder gefrorenes Qualitätsfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1998/80 af 28. juli 1980 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser, som er indgivet i juli 1980
    for oksekød af høj kvalitet, fersk, kølet eller frosset, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1998/80 della Commissione, del 28 luglio 1980, che
    determina in quale misura possono essere accolte le domande di titoli d' importazione
    presentate nel mese di luglio 1980 per le carni bovine di qualità pregiata, fresche,
    refrigerate o congelate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1998/80 van de Commissie van 28 juli 1980 tot vaststelling
    van de mate waarin gevolg kan worden geweven aan de certificaataanvragen die in
    juli 1980 zijn ingediend voor de invoer van vers, gekoeld of bevroren kwaliteitsrundvlees
  type: main
