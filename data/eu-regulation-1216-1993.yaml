title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1216/93 of 17 May 1993 re-establishing the
    levying of customs duties on products of category 22 (order No 40.0220), originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1216/93 de la Commission du 17 mai 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    22 (numéro d'ordre 40.0220) originaires du Pakistan bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1216/93 DER KOMMISSION vom 17. Mai 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 22 (laufende Nummer 40.0220) mit Ursprung
    in Pakistan, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1216/93 af 17. maj 1993 om genindførelse
    af opkrævning af told for varer under kategori 22 (løbenummer 40.0220), som
    har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1216/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 17ης Μαΐου 1993 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    22 (αύξων αριθμός 40.0220), καταγωγής Πακιστάν, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθμός
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1216/93 DELLA COMMISSIONE del 17 maggio 1993 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti della categoria 22 (numero
    d' ordine 40.0220), originari del Pakistan, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3832/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1216/93 VAN DE COMMISSIE van 17 mei 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 22 (volgnummer 40.0220), van oorsprong uit Pakistan, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1216/93 DA COMISSÃO de 17 de Maio de 1993 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria 22 (número
    de ordem 40.0220), originários do Paquistão, beneficiários das preferências
    pautais previstas no Regulamento (CEE) no 3832/90 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1216/93 DE LA COMISIÓN de 17 de mayo de 1993 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los productos de la categoría no 22 (número de orden 40.0220), originarios
    de Pakistán, beneficiarios de las preferencias arancelarias previstas por el
    Reglamento (CEE) no 3832/90 del Consejo
