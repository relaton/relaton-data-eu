title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/385 of 2 March 2021 amending
    Annex II to Decision 93/52/EEC as regards the officially brucellosis (B. melitensis)-free
    status, Annexes I and II to Decision 2003/467/EC as regards the officially tuberculosis-
    and brucellosis-free status and Annexes I and II to Decision 2008/185/EC as regards
    the free status and the approval of the eradication programmes for Aujeszky’s
    disease for certain regions (notified under document C(2021) 1064)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/385 de la Commission du 2 mars 2021
    modifiant l’annexe II de la décision 93/52/CEE en ce qui concerne le statut
    «officiellement indemne de brucellose (B. melitensis)», les annexes I et II
    de la décision 2003/467/CE en ce qui concerne le statut «officiellement indemne
    de tuberculose» et «officiellement indemne de brucellose» et les annexes I
    et II de la décision 2008/185/CE en ce qui concerne le statut «indemne de la
    maladie d’Aujeszky» et l’approbation des programmes d’éradication de cette
    maladie pour certaines régions [notifiée sous le numéro C(2021) 1064]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/385 der Kommission vom 2. März 2021
    zur Änderung des Anhangs II der Entscheidung 93/52/EWG in Bezug auf den Status
    als amtlich anerkannt frei von Brucellose (B. melitensis), der Anhänge I und
    II der Entscheidung 2003/467/EG in Bezug auf den Status als amtlich anerkannt
    tuberkulose- und brucellosefrei sowie der Anhänge I und II der Entscheidung 2008/185/EG
    in Bezug auf den Status als frei von der Aujeszky-Krankheit und die Genehmigung
    der Programme zur Tilgung dieser Krankheit in bestimmten Regionen (Bekannt gegeben
    unter Aktenzeichen C(2021) 1064)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/385 на Комисията
    от 2 март 2021 година за изменение на приложение
    II към Решение 93/52/ЕИО по отношение на статута
    на официално свободни от бруцелоза (B. melitensis),
    на приложения I и II към Решение 2003/467/ЕО по отношение
    на статута на официално свободни от туберкулоза
    и бруцелоза и на приложения I и II към Решение
    2008/185/ЕО по отношение на статута на свободни
    от болестта на Ауески и одобрението на програмите
    за ликвидиране на болестта за някои региони
    (нотифицирано под номерC (2021) 1064)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/385 ze dne 2. března 2021, kterým
    se mění příloha II rozhodnutí 93/52/EHS, pokud jde o status oblastí úředně
    prostých brucelózy (B. melitensis), přílohy I a II rozhodnutí 2003/467/ES,
    pokud jde o status oblastí úředně prostých tuberkulózy a brucelózy, a přílohy
    I a II rozhodnutí 2008/185/ES, pokud jde o status oblastí prostých Aujeszkyho
    choroby a schválení eradikačních programů pro určité oblasti (oznámeno
    pod číslem C (2021) 1064)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/385 af 2. marts 2021
    om ændring af bilag II til beslutning 93/52/EØF for så vidt angår status som
    officielt fri for brucellose (B. melitensis) og af bilag I og II til beslutning
    2003/467/EF for så vidt angår anerkendelse af status som officielt fri for tuberkulose
    og brucellose og af bilag I og II til beslutning 2008/185/EF for så vidt angår
    visse regioners status som fri for Aujeszkys sygdom og godkendelse af udryddelsesprogrammer
    herfor (meddelt under nummer C(2021) 1064)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/385 της Επιτροπής
    της 2ας Μαρτίου 2021 για την τροποποίηση του παραρτήματος
    II της απόφασης 93/52/ΕΟΚ όσον αφορά το καθεστώς
    επίσημης απαλλαγής από τη βρουκέλλωση (B. melitensis),
    των παραρτημάτων I και II της απόφασης 2003/467/ΕΚ
    όσον αφορά το καθεστώς επίσημης απαλλαγής
    από τη φυματίωση και τη βρουκέλλωση, καθώς
    και των παραρτημάτων I και ΙΙ της απόφασης 2008/185/ΕΚ
    όσον αφορά το καθεστώς απαλλαγής από τη νόσο
    Aujeszky (ψευδολύσσα) και την έγκριση προγραμμάτων
    εκρίζωσης της νόσου σε ορισμένες περιφέρειες
    [κοινοποιηθείσα υπό τον αριθμό C(2021) 1064]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/385, 2. märts 2021, millega muudetakse
    otsuse 93/52/EMÜ II lisa seoses teatavate piirkondade ametlikult brutselloosist
    (B. melitensis) vaba staatusega, otsuse 2003/467/EÜ I ja II lisa seoses teatavate
    piirkondade ametlikult tuberkuloosist vaba ja brutselloosist vaba staatusega ning
    otsuse 2008/185/EÜ I ja II lisa seoses teatavate piirkondade Aujeszky haigusest
    vaba staatusega ja heakskiidu andmisega Aujeszky haiguse likvideerimisprogrammi
    jaoks (teatavaks tehtud numbri C(2021) 1064 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/385, annettu 2 päivänä
    maaliskuuta 2021, päätöksen 93/52/ETY liitteen II ja päätöksen 2003/467/EY
    liitteiden I ja II muuttamisesta siltä osin kuin on kyse tiettyjen alueiden tuberkuloosista
    ja luomistaudista (B. melitensis) virallisesti vapaasta asemasta sekä päätöksen
    2008/185/EY liitteiden I ja II muuttamisesta siltä osin kuin on kyse tiettyjen
    alueiden Aujeszkyn taudista vapaasta asemasta ja Aujeszkyn taudin hävittämisohjelmien
    hyväksymisestä (tiedoksiannettu numerolla C(2021) 1064)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/385 оd 2. ožujka 2021. o izmjeni
    Priloga II. Odluci 93/52/EEZ u pogledu statusa „službeno slobodno od bruceloze
    (B. melitensis)”, i priloga I. i II. Odluci 2003/467/EZ u pogledu statusa „službeno
    slobodno od tuberkuloze” i „službeno slobodno od bruceloze” te priloga
    I. i II. Odluci 2008/185/EZ u pogledu statusa „slobodno od bolesti Aujeszkoga”
    i odobravanja programâ iskorjenjivanja te bolesti za određene regije (priopćeno
    pod brojem dokumenta C (2021) 1064)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/385 végrehajtási határozata (2021. március 2.)
    a 93/52/EGK határozat II. mellékletének a hivatalosan brucellózistól (B.
    melitensis) mentes státusz tekintetében, a 2003/467/EK határozat I. és II.
    mellékletének a hivatalosan tuberkulózismentes és brucellózismentes státusz
    tekintetében, valamint a 2008/185/EK határozat I. és II. mellékletének egyes
    régiók tekintetében a mentes státusz, valamint az Aujeszky-féle betegség
    felszámolására irányuló programok jóváhagyása tekintetében történő
    módosításáról (az értesítés a C(2021) 1064. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/385 della Commissione del 2 marzo 2021
    che modifica l’allegato II della decisione 93/52/CEE per quanto riguarda la
    qualifica di ufficialmente indenni da brucellosi (B. melitensis), gli allegati
    I e II della decisione 2003/467/CE per quanto riguarda la qualifica di ufficialmente
    indenni da tubercolosi e brucellosi e gli allegati I e II della decisione 2008/185/CE
    per quanto riguarda la qualifica di indenni e il riconoscimento dei programmi
    di eradicazione della malattia di Aujeszky di alcune regioni [notificata con il
    numero C (2021)1064]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/385 (2021. gada 2. marts), ar
    ko attiecībā uz oficiāli no brucelozes (B. melitensis) brīvu statusu groza
    Lēmuma 93/52/EEK II pielikumu, attiecībā uz oficiāli no tuberkulozes un brucelozes
    brīvu statusu groza Lēmuma 2003/467/EK I un II pielikumu un attiecībā uz atsevišķu
    reģionu kā no Aujeski slimības brīvu reģionu statusu un attiecībā uz Aujeski
    slimības izskaušanas programmu apstiprināšanu atsevišķiem reģioniem groza
    Lēmuma 2008/185/EK I un II pielikumu (izziņots ar dokumenta numuru C(2021) 1064)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/385 2021 m. kovo 2 d. kuriuo
    dėl pripažinimo, kad tam tikruose regionuose bruceliozės (B. melitensis) oficialiai
    nenustatyta, iš dalies keičiamas Sprendimo 93/52/EEB II priedas, dėl pripažinimo,
    kad tam tikruose regionuose tuberkuliozės ir bruceliozės oficialiai nenustatyta,
    iš dalies keičiami Sprendimo 2003/467/EB I ir II priedai ir dėl pripažinimo,
    kad tam tikruose regionuose Aujeskio ligos nenustatyta, ir dėl Aujeskio ligos
    likvidavimo tam tikruose regionuose programų patvirtinimo iš dalies keičiami
    Sprendimo 2008/185/EB I ir II priedai (pranešta dokumentu Nr. C(2021) 1064)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/385 tat-2
    ta’ Marzu 2021 li temenda l-Anness II tad-Deċiżjoni 93/52/KEE fir-rigward
    tal-istatus ta’ ċerti reġjuni bħala uffiċjalment ħielsa mill-bruċellożi
    (B. melitensis), l-Annessi I u II tad-Deċiżjoni 2003/467/KE fir-rigward tal-istatus
    ta’ ċerti reġjuni bħala uffiċjalment ħielsa mit-tuberkulożi u mill-bruċellożi
    u l-Annessi I u II tad-Deċiżjoni 2008/185/KE fir-rigward tal-istatus ta’ ċerti
    reġjuni bħala ħielsa mill-marda ta’ Aujeszky u l-approvazzjoni tal-programmi
    ta’ eradikazzjoni ta’ din il-marda (notifikata bid-dokument C(2021) 1064)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/385 van de Commissie van 2 maart 2021 tot
    wijziging van bijlage II bij Beschikking 93/52/EEG wat betreft de erkenning als
    officieel vrij van brucellose (B. melitensis), de bijlagen I en II bij Beschikking
    2003/467/EG wat betreft de erkenning als officieel vrij van tuberculose en brucellose
    en de bijlagen I en II bij Beschikking 2008/185/EG wat betreft de erkenning als
    officieel vrij van de ziekte van Aujeszky en de goedkeuring van de uitroeiingsprogramma’s
    voor die ziekte voor bepaalde gebieden (Kennisgeving geschied onder nummer C(2021)
    1064)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/385 z dnia 2 marca 2021 r. zmieniająca
    załącznik II do decyzji 93/52/EWG w odniesieniu do statusu „oficjalnie wolne
    od brucelozy (B. melitensis)”, załączniki I i II do decyzji 2003/467/WE w
    odniesieniu do statusu „oficjalnie wolne od gruźlicy i brucelozy” oraz załączniki
    I i II do decyzji 2008/185/WE w odniesieniu do statusu „wolne od choroby Aujeszkyego”
    i zatwierdzenia programów zwalczania tej choroby w odniesieniu do niektórych
    regionów (notyfikowana jako dokument nr C(2021) 1064)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/385 da Comissão de 2 de março de 2021
    que altera o anexo II da Decisão 93/52/CEE no que diz respeito ao estatuto de
    oficialmente indemne de brucelose (B. melitensis), os anexos I e II da Decisão
    2003/467/CE no que diz respeito ao estatuto de oficialmente indemne de tuberculose
    e brucelose e os anexos I e II da Decisão 2008/185/CE no que diz respeito ao
    estatuto de indemnidade e à aprovação dos programas de erradicação da doença
    de Aujeszky de determinadas regiões [notificada com o número C(2021) 1064]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/385 a Comisiei din 2 martie 2021
    de modificare a anexei II la Decizia 93/52/CEE în ceea ce privește statutul
    oficial de indemn de bruceloză (B. melitensis), a anexelor I și II la Decizia
    2003/467/CE în ceea ce privește statutul oficial de indemn de tuberculoză și
    indemn de bruceloză și a anexelor I și II la Decizia 2008/185/CE în ceea ce
    privește statutul de indemn de boala Aujeszky și aprobarea programelor de eradicare
    a acesteia pentru anumite regiuni [notificată cu numărul C(2021) 1064]
  type: main
- language: sk
  script: Latn
