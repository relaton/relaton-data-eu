    sa mení príloha II k rozhodnutiu 93/52/EHS, pokiaľ ide o štatút úradne bez
    výskytu brucelózy (B. melitensis), prílohy I a II k rozhodnutiu 2003/467/ES,
    pokiaľ ide o štatút úradne bez výskytu tuberkulózy a brucelózy, a prílohy
    I a II k rozhodnutiu 2008/185/ES, pokiaľ ide o štatút bez výskytu Aujeszkého
    choroby a schválenie programov na jej eradikáciu v určitých regiónoch [oznámené
    pod číslom C(2021) 1064]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/385 z dne 2. marca 2021 o spremembi
    Priloge II k Odločbi 93/52/EGS glede priznanja statusa, uradno prostega bruceloze
    (B. melitensis), prilog I in II k Odločbi 2003/467/ES glede priznanja statusa,
    uradno prostega tuberkuloze in bruceloze, ter prilog I in II k Odločbi 2008/185/ES
    glede statusa, prostega bolezni, in programov za izkoreninjenje bolezni Aujeszkega
    za nekatere regije (notificirano pod dokumentarno številko C(2021) 1064)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/385 de la Comisión de 2 de marzo de
    2021 por la que se modifican el anexo II de la Decisión 93/52/CEE por lo que
    respecta a la calificación de oficialmente indemne de brucelosis (Brucella melitensis),
    los anexos I y II de la Decisión 2003/467/CE por lo que respecta al estatuto
    de oficialmente indemne de tuberculosis y brucelosis, y los anexos I y II de la
    Decisión 2008/185/CE por lo que respecta al estatuto indemne de la enfermedad
    de Aujeszky y a la aprobación de los programas de erradicación de dicha enfermedad
    para determinadas regiones [notificada con el número C(2021) 1064]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/385 av den 2 mars 2021 om ändring
    av bilaga II till beslut 93/52/EEG vad gäller status som officiellt fri från
    brucellos (B. melitensis), av bilagorna I och II till beslut 2003/467/EG vad gäller
    status som officiellt fri från tuberkulos och brucellos samt av bilagorna I och
    II till beslut 2008/185/EG vad gäller sjukdomsfri status och godkännande av
    utrotningsprogram avseende Aujeszkys sjukdom för vissa regioner (delgivet med
    nr C(2021) 1064)
