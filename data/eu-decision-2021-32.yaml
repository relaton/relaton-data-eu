title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/32 of 13 January 2021 concerning
    the extension of the action taken by the Environment Agency of Luxembourg permitting
    the making available on the market and use of the biocidal product BIOBOR JF in
    accordance with Article 55(1) of Regulation (EU) No 528/2012 of the European Parliament
    and of the Council (notified under document C(2021) 13) (Only the French text
    is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/32 de la Commission du 13 janvier 2021
    concernant la prorogation de la mesure prise par l’Administration de l’environnement
    du Luxembourg autorisant la mise à disposition sur le marché et l’utilisation
    du produit biocide BIOBOR JF conformément à l’article 55, paragraphe 1, du
    règlement (UE) no 528/2012 du Parlement européen et du Conseil [notifiée sous
    le numéro C(2021) 13] (Le texte en langue française est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/32 der Kommission vom 13. Januar 2021
    über die Verlängerung der vom Luxemburger Umweltamt ergriffenen Maßnahme zur
    Gestattung der Bereitstellung auf dem Markt und der Verwendung des Biozidprodukts
    BIOBOR JF gemäß Artikel 55 Absatz 1 der Verordnung (EU) Nr. 528/2012 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2021)13) (Nur der
    französische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
