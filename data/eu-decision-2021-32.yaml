    kapcsolatban a Luxemburgi Környezetvédelmi Ügynökség által az 528/2012/EU
    európai parlamenti és tanácsi rendelet 55. cikke (1) bekezdésével összhangban
    hozott intézkedés meghosszabbításáról (az értesítés a C(2021) 13. számú
    dokumentummal történt) (Csak a francia nyelvű szöveg hiteles)
  type: main
