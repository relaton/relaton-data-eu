    на Люксембург действие, позволяващо предоставянето
    на пазара и употребата на биоцида BIOBOR JF в съответствие
    с член 55, параграф 1 от Регламент (ЕС) № 528/2012
    на Европейския парламент и на Съвета (нотифицирано
    под номер C(2021)13) (само текстът на френски език
