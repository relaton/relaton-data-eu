  script: Latn
  content: Commission Regulation (EEC) No 1999/89 of 5 July 1989 re-establishing the
    levying of customs duties on synthetic camphor, falling within CN code ex 2914
    21 00, originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1999/89 de la Commission du 5 juillet 1989 portant
