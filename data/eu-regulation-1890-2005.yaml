    nałożonego na przywóz niektórych elementów złącznych ze stali nierdzewnej
    oraz ich części pochodzących z Chińskiej Republiki Ludowej, Indonezji, Tajwanu,
    Tajlandii i Wietnamu oraz kończące postępowanie dotyczące przywozu niektórych
