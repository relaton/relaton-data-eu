title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1890/2005 of 14 November 2005 imposing a definitive
    anti-dumping duty and collecting definitively the provisional duty imposed on
    imports of certain stainless steel fasteners and parts thereof originating in
    the People’s Republic of China, Indonesia, Taiwan, Thailand and Vietnam and
    terminating the proceeding on imports of certain stainless steel fasteners and
    parts thereof originating in Malaysia and the Philippines
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1890/2005 du Conseil du 14 novembre 2005 instituant
    un droit antidumping définitif et portant perception définitive du droit provisoire
    institué sur les importations de certains éléments de fixation en acier inoxydable
    et de leur parties originaires de la République populaire de Chine, d’Indonésie,
    de Taïwan, de Thaïlande et du Viêt Nam, et clôturant la procédure relative
    aux importations de certains éléments de fixation en acier inoxydable et de
    leurs parties originaires de Malaisie et des Philippines
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1890/2005 des Rates vom 14. November 2005 zur Einführung
    eines endgültigen Antidumpingzolls und zur endgültigen Vereinnahmung des vorläufigen
    Zolls auf die Einfuhren bestimmter Verbindungselemente und Teile davon aus nicht
    rostendem Stahl mit Ursprung in der Volksrepublik China, Indonesien, Taiwan, Thailand
    und Vietnam und zur Einstellung des Verfahrens gegenüber den Einfuhren bestimmter
    Verbindungselemente und Teile davon aus nicht rostendem Stahl mit Ursprung in
    Malaysia und den Philippinen
  type: main
- language: bg
  script: Cyrl
