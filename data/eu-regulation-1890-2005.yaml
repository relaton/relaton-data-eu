  script: Latn
  content: Regulamentul (CE) nr. 1890/2005 al Consiliului din 14 noiembrie 2005 de
    instituire a unui drept antidumping definitiv și de percepere definitivă a dreptului
    provizoriu instituit asupra importurilor de anumite elemente de fixare din oțel
    inoxidabil, precum și de părți ale acestora, originare din Republica Populară
    Chineză, Indonezia, Taiwan, Thailanda și Vietnam, și de încheiere a procedurii
    referitoare la importul de anumite elemente de fixare din oțel inoxidabil, precum
    și de părți ale acestora, originare din Malaezia și Filipine
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1890/2005 zo 14. novembra 2005, ktorým sa ukladá
