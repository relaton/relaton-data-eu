    на статут на одобрени зони и одобрени ферми,
    разположени в неодобрени зони, по отношение
    на вирусна хеморагична септицемия (VHS) и инфекциозна
    хемопоетична некроза (IHN). (нотифицирано под
    номер С(2004) 1257) (текст от значение за EИП)
  type: main
