title:
- language: en
  script: Latn
  content: '2004/328/EC: Commission Decision of 5 April 2004 amending Annexes I and
    II to Decision 2003/634/EC approving programmes for the purpose of obtaining the
    status of approved zones and of approved farms in non-approved zones with regard
    to viral haemorrhagic septicaemia (VHS) and infectious haematopoietic necrosis
    (IHN) in fish (Text with EEA relevance) (notified under document number C(2004)
    1257)'
  type: main
- language: fr
  script: Latn
  content: '2004/328/CE: Décision de la Commission du 5 avril 2004 modifiant les
    annexes I et II de la décision 2003/634/CE approuvant des programmes visant à
    obtenir le statut de zones agréées et de fermes d''élevage agréées situées
    dans des zones non agréées au regard des maladies des poissons que sont la septicémie
    hémorragique virale (SHV) et la nécrose hématopoïétique infectieuse (NHI)
    (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2004)
    1257]'
  type: main
- language: de
  script: Latn
  content: '2004/328/EG: Entscheidung der Kommission vom 5. April 2004 zur Änderung
    der Anhänge I und II der Entscheidung 2003/634/EG zur Genehmigung von Programmen
    zur Erlangung des Status zugelassener Gebiete und zugelassener Betriebe in nicht
    zugelassenen Gebieten hinsichtlich der Fischseuchen virale hämorrhagische Septikämie
    (VHS) und infektiöse hämatopoetische Nekrose (IHN) (Text von Bedeutung für
    den EWR) (Bekannt gegeben unter Aktenzeichen K(2004) 1257)'
  type: main
