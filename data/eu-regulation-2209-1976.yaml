title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2209/76 of 9 September 1976 re-establishing
    the levying of customs duties on other wood sawn lengthwise, sliced or peeled
    but not further prepared, etc., falling within subheading 44.14 B, originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2209/76 de la Commission, du 9 septembre 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres bois
    simplement sciés longitudinalement, tranchés, etc., de la sous-position tarifaire
    44.14 B, originaires du Brésil bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2209/76 der Kommission vom 9. September 1976 zur Wiedereinführung
    des Zollsatzes für anderes Holz, in der Längsrichtung gesägt, gemessert oder
    geschält usw., der Tarifstelle 44.14 B, mit Ursprung in Brasilien, dem die in
    der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2209/76 af 9. september 1976 om genindførelse
    af opkrævning af toldafgifter for andet træ, savet i længderetningen, skåret
    eller skrællet, etc., under underposition 44.14 B, som har oprindelse i Brasilien,
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2209/76 della Commissione, del 9 settembre 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli altri legni semplicemente
    segati per il lungo, tranciati, ecc., della sottovoce doganale 44.14 B, originari
    del Brasile, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2209/76 van de Commissie van 9 september 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op ander hout,
    enkel overlangs gezaagd of enkel gesneden enz., van onderverdeling 44.14 B, van
    oorsprong uit Brazilië, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75
    van de Raad van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
