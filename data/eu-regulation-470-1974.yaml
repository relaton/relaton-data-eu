title:
- language: en
  script: Latn
  content: Regulation (EEC) No 470/74 of the Commission of 26 February 1974 re-establishing
    the levying of customs duties on knitted or crocheted fabrics, not elastic or
    rubberized, falling within subheading No 60.01 A, originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3505/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 470/74 de la Commission, du 26 février 1974, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fils de coton non conditionnés pour la vente au détail, de la sous-position
    tarifaire 55.05 A, originaires de Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3578/73 du Conseil du 28 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 470/74 der Kommission vom 26. Februar 1974 zur Wiedereinführung
    des Zollsatzes für Gewirke als Meterware, weder gummielastisch noch kautschutiert,
    der Tarifstelle 60.01 A, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3505/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 470/74 af 26. februar 1974 om genindførsel
    af opkrævning af toldafgifter for trikotagestof, ikke elastisk eller gummeret,
    underposition 60.01 A som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3505/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 470/74 della Commissione, del 26 febbraio 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle stoffe a maglia non
    elastica né gommata, in pezza, della sottovoce doganale n. 60.01 A, originari
    dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3505/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 470/74 van de Commissie van 26 februari 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op breiwerk
    en haakwerk, niet elastisch en niet gegummeerd, aan het stuk, van onderverdeling
    60.01 A, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 3505/73 van de Raad van 18 december 1973 tariefpreferenties werden geopend
  type: main
