  content: '2000/320/EC: Commission Decision of 11 April 2000 authorising Member States
    to permit temporarily the marketing of forest reproductive material not satisfying
    the requirements of Council Directive 66/404/EEC (notified under document number
    C(2000) 951)'
  type: main
- language: fr
  script: Latn
  content: '2000/320/CE: Décision de la Commission du 11 avril 2000 autorisant les
    États membres à admettre temporairement la commercialisation de matériels forestiers
