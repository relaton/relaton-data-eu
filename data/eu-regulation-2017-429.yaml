title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/429 of 10 March 2017 concerning
    the authorisation of a preparation of endo-1,3(4)-beta-glucanase produced by Aspergillus
    aculeatinus (formerly classified as Aspergillus aculeatus) (CBS 589.94), endo-1,4-beta-glucanase
    produced by Trichoderma reesei (formerly classified as Trichoderma longibrachiatum)
    (CBS 592.94), alpha-amylase produced by Bacillus amyloliquefaciens (DSM 9553)
    and endo-1,4-beta-xylanase produced by Trichoderma viride (NIBH FERM BP4842) as
    a feed additive for all avian species and amending Regulations (EC) No 358/2005
    and (EC) No 1284/2006 and repealing Regulation (EU) No 516/2010 (holder of the
    authorisation Kemin Europa NV)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2017/429 de la Commission du 10 mars 2017
    concernant l''autorisation d''une préparation d''endo-1,3(4)-bêta-glucanase
    produite par Aspergillus aculeatinus (anciennement classé en tant qu''Aspergillus
    aculeatus) (CBS 589.94), d''endo-1,4-bêta-glucanase produite par Trichoderma
    reesei (anciennement classé en tant que Trichoderma longibrachiatum) (CBS 592.94),
    d''alpha-amylase produite par Bacillus amyloliquefaciens (DSM 9553) et d''endo-1,4-bêta-xylanase
    produite par Trichoderma viride (NIBH FERM BP4842) en tant qu''additif destiné
    à l''alimentation de toutes les espèces aviaires, modifiant les règlements
    (CE) n° 358/2005 et (CE) n° 1284/2006 et abrogeant le règlement (UE) n° 516/2010
    (titulaire de l''autorisation: Kemin Europa NV)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2017/429 der Kommission vom 10. März 2017
    zur Zulassung einer Zubereitung aus Endo-1,3(4)-beta-glucanase, gewonnen aus Aspergillus
    aculeatinus (vormals klassifiziert als Aspergillus aculeatus) (CBS 589.94), Endo-1,4-beta-glucanase,
    gewonnen aus Trichoderma reesei (vormals klassifiziert als Trichoderma longibrachiatum)
    (CBS 592.94), alpha-Amylase, gewonnen aus Bacillus amyloliquefaciens (DSM 9553),
    und Endo-1,4-beta-xylanase, gewonnen aus Trichoderma viride (NIBH FERM BP4842),
    als Zusatzstoff in Futtermitteln für alle Vogelarten und zur Änderung der Verordnungen
    (EG) Nr. 358/2005 und (EG) Nr. 1284/2006 sowie zur Aufhebung der Verordnung (EU)
    Nr. 516/2010 (Zulassungsinhaber: Kemin Europa NV)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/429 на Комисията
    от 10 март 2017 година за разрешаване на употребата
    на препарат от ендо-1,3(4)-бета-глюканаза, получена
    от Aspergillus aculeatinus (класифицирано по-рано като
    Aspergillus aculeatus) (CBS 589.94), ендо-1,4-бета-глюканаза,
    пoлучена от Trichoderma reesei (класифицирано по-рано
    като Trichoderma longibrachiatum) (CBS 592.94), алфа-амилаза, получена
    от Bacillus amyloliquefaciens (DSM 9553), и ендо-1,4-бета-ксиланаза,
    получена от Trichoderma viride (NIBH FERM BP4842), като фуражна
    добавка за всички видове птици, за изменение
    на регламенти (ЕО) № 358/2005 и (ЕО) № 1284/2006 и за
    отмяна на Регламент (ЕС) № 516/2010 (притежател
    на разрешението Kemin Europa NV)
  type: main
- language: cs
  script: Latn
