title:
- language: en
  script: Latn
  content: '91/81/EEC: Commission Decision of 11 February 1991 adopting the 1991 plan
    allocating to the Member States resources to be charged to the 1991 budget year
    for the supply of food from intervention stocks to designated organizations for
    distribution to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '91/81/CEE: Décision de la Commission du 11 février 1991 adoptant le
    plan de 1991 portant attribution aux États membres de ressources imputables à
    l''exercice 1991 pour la fourniture de denrées alimentaires provenant des stocks
    d''intervention à des organisations désignées pour les distribuer aux personnes
    les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 11. Februar 1991 zur Annahme des Plans
    für 1991 über die Bewilligung von Mitteln, die den Mitgliedstaaten für die
    Lieferung von Nahrungsmitteln aus Interventionsbeständen an bestimmte Einrichtungen
    zur Verteilung an Bedürftige in der Gemeinschaft zuzuteilen und im Haushaltsjahr
    1991 zu verbuchen sind (91/81/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 11. februar 1991 om vedtagelse af 1991-planen
    for tildeling til medlemsstaterne af midler, der skal afholdes over 1991-budgettet,
    og som skal dække udgifterne til levering af levnedsmidler fra interventionslagre
    til de udpegede organisationer med henblik på uddeling til de socialt dårligst
    stillede personer i Fællesskabet (91/81/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/81/ΕΟΚ: Απόφαση της Επιτροπής της 11ης Φεβρουαρίου
    1991 για την έγκριση του προγράμματος 1991 για
    την κατανομή στα κράτη μέλη των πόρων που θα
    καταλογισθούν στο έτος προϋπολογισμού 1991 για
    τη χορήγηση τροφίμων που προέρχονται από τα
    αποθέματα παρέμβασης σε οργανισμούς που έχουν
    ορισθεί για τη διανομή τους στους απόρους της
    Κοινότητας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE dell'' 11 febbraio 1991 che approva per il
    1991 il piano di ripartizione agli Stati membri delle risorse da imputare all''
    esercizio finanziario 1991 per la fornitura a determinati organismi di derrate
    alimentari provenienti dalle scorte di intervento e destinate ad essere distribuite
    agli indigenti nella Comunità (91/81/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 11 februari 1991 tot vaststelling van
    het jaarplan voor 1991 voor de toewijzing aan de Lid-Staten van voor het begrotingsjaar
    1991 te boeken financiële middelen voor de levering van voedsel uit interventievoorraden
    aan organisaties die zijn aangewezen voor de verstrekking ervan aan de meest behoeftigen
    in de Gemeenschap (91/81/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 11 de Fevereiro de 1991 que adopta o plano para
    1991 que atribui aos Estados-membros recursos, a incluir no exercício orçamental
    de 1991, para o fornecimento de géneros alimentícios provenientes das existências
    de intervenção a determinadas organizações para distribuição às pessoas
    mais necessitadas na Comunidade (91/81/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 11 de febrero de 1991 por la que se adopta
    el plan para 1991 que establece la asignación a los Estados miembros de recursos
    imputables al ejercicio presupuestario de 1991 para el suministro de alimentos
    procedentes de existencias de intervención, a determinadas organizaciones para
    su distribución entre las personas más necesitadas de la Comunidad (91/81/CEE)
    #'
