title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 965/84 of 9 April 1984 re-establishing the
    levying of customs duties on other footwear, falling within subheading 64.02 B
    and originating in Thailand, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 965/84 de la Commission du 9 avril 1984 portant rétablissement
    de la perception des droits de douane applicables aux autres chaussures, de la
    sous-position 64.02 B du tarif douanier commun, originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 965/84 der Kommission vom 9. April 1984 zur Wiedereinführung
    der Erhebung der Zölle für andere Schuhe der Tarifstelle 64.02 B mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 965/84 af 9. april 1984 om genindførelse
