    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3832/90
    del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1165/92 VAN DE COMMISSIE van 5 mei 1992 houdende
