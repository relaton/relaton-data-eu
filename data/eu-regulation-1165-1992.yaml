title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1165/92 of 5 May 1992 re- establishing the
    levying of customs duties on products categories 1, 9 and 32 (order No 40.0010,
    40.0090 and 40.0320), originating in Indonesia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1165/92 de la Commission du 5 mai 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    1, 9 et 32 (numéros d'ordre 40.0010, 40.0090, 40.0320) originaires de l'Indonésie,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1165/92 DER KOMMISSION vom 5. Mai 1992 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorien 1, 9 und 32 (laufende
    Nrn. 40.0010, 40.0090 und 40.0320) mit Ursprung in Indonesien, dem die in der
    Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt
    werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1165/92 af 5. maj 1992 om genindførelse
    af opkrævning af told for varer under kategori 1, 9 og 32 (løbenummer 40.0010,
    40.0090 og 40.0320), som har oprindelse i Indonesien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
