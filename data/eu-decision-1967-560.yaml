title:
- language: fr
  script: Latn
  content: Décision de la Commission du 31 juillet 1967 autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les "carpes fraîches,
    réfrigérées et congelées", de la position Ex 03.01 A II B du Tarif douanier
    commun, originaires de Yougoslavie et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '67/560/EWG: Entscheidung der Kommission vom 31. Juli 1967, durch welche
    die Bundesrepublik Deutschland ermächtigt wird, aus Jugoslawien stammende und
    in den anderen Mitgliedstaaten in den freien Verkehr gebrachte Karpfen, frisch,
    gefroren oder gekühlt, der Tarifnummer ex 03.01 A II b) des Gemeinsamen Zolltarifs,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/560/CEE: Decisione della Commissione, del 31 luglio 1967, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario le
    carpe fresche, refrigerate e congelate della voce ex 03.01 A II b della tariffa
    doganale comune, originarie della Iugoslavia ed immesse in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/560/EEG: Beschikking van de Commissie van 31 juli 1967 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd karpers, vers, gekoeld of bevroren, van post ex 03.01
    A II b) van het gemeenschappelijk douanetarief, die van oorsprong zijn uit Joegoslavië
    en in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
