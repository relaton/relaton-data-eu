  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1934/81 della Commissione, del 13 luglio 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti per giuochi
    di società della voce 97.04 della tariffa doganale comune, originari di Singapore,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1934/81 van de Commissie van 13 juli 1981 houdende
    wederinstelling van de heffing van invoerrechten die van toepassing zijn op artikelen
