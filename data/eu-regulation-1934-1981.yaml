title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1934/81 of 13 July 1981 re-establishing
    the levying of customs duties on equipment for parlour, table and funfair games
    for adults or children, falling within heading No 97.04 and originating in Singapore,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1934/81 de la Commission, du 13 juillet 1981, portant
    rétablissement de la perception des droits de douane applicables aux articles
    pour jeux de société de la position 97.04 du tarif douanier commun, originaires
    de Singapour, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1934/81 der Kommission vom 13. Juli 1981 zur Wiedereinführung
    der Erhebung der Zölle für Gesellschaftsspiele der Tarifnummer 97.04 mit Ursprung
    in Singapur, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1934/81 af 13. juli 1981 om genindførelse
    af opkrævning af told for selskabsspil henhørende under pos. 97.04 og med oprindelse
    i Singapore, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1934/81 τής Επιτροπής
