title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 685/80 of 20 March 1980 re-establishing
    the levying of customs duties on tapestries, hand-made, products of category 60
    (code 0600), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 685/80 de la Commission, du 20 mars 1980, portant
    rétablissement de la perception des droits de douane applicables aux tapisseries
    faites à la main, de la catégorie 60 (code 0600), originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 685/80 der Kommission vom 20. März 1980 über die
    Wiedereinführung des Zollsatzes für Tapisserien, handgefertigt, der Warenkategorie
    Nr. 60 (Kennziffer 0600), mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 685/80 af 20. marts 1980 om genindførelse
    af opkrævning af toldafgifter for håndfremstillede tapisserier, under varekategori
    60 (kode 0600), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 685/80 della Commissione, del 20 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili agli arazzi fatti a mano della categoria
    di prodotti n. 60 (codice 0600) originari della Cina beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 685/80 van de Commissie van 20 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tapisserieën,
    met de hand geweven, van de categorie van produkten nr. 60 (codenummer 0600),
    van oorsprong uit China, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
