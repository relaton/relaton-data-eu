    des Rindfleischsektors, die Gegenstand von Interventionskäufen im Königreich
    der Niederlande sein können, sowie ihres Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2309/77 af 20. oktober 1977 om ændring
