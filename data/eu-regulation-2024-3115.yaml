  script: Latn
  content: Uredba (EU) 2024/3115 Evropskega parlamenta in Sveta z dne 27. novembra
    2024 o spremembi Uredbe (EU) 2016/2031 v zvezi z večletnimi programi preiskav,
    uradnimi obvestili o navzočnosti nadzorovanih nekarantenskih škodljivih organizmov,
    začasnimi odstopanji od prepovedi uvoza in posebnih uvoznih zahtev ter določitvijo
    postopkov za njihovo odobritev, začasnimi uvoznimi zahtevami za zelo tvegane
    rastline, rastlinske proizvode in druge predmete, določitvijo postopkov za uvrščanje
    zelo tveganih rastlin na seznam, vsebino fitosanitarnih spričeval in uporabo
    rastlinskih potnih listov ter v zvezi z nekaterimi zahtevami glede poročanja
    za razmejena območja in preiskave v zvezi s škodljivimi organizmi ter o spremembi
    Uredbe (EU) 2017/625 v zvezi z nekaterimi uradnimi obvestili o neskladnosti
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2024/3115 del Parlamento Europeo y del Consejo, de 27 de
    noviembre de 2024, por el que se modifica el Reglamento (UE) 2016/2031 en lo que
    respecta a los programas plurianuales de prospección; las notificaciones relativas
    a la presencia de plagas reguladas no cuarentenarias; las excepciones temporales
    a las prohibiciones de importación y a los requisitos especiales de importación,
    así como el establecimiento de procedimientos para su concesión; los requisitos
    temporales de importación de vegetales, productos vegetales y otros objetos de
    alto riesgo; el establecimiento de los procedimientos para la elaboración de
    listas de vegetales de alto riesgo; el contenido de los certificados fitosanitarios
    y el uso de pasaportes fitosanitarios, y en lo que respecta a determinadas obligaciones
    de presentación de informes sobre las zonas demarcadas y las prospecciones de
    plagas y se modifica el Reglamento (UE) 2017/625 en lo que respecta a determinadas
    notificaciones de incumplimiento
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2024/3115 av den 27 november
    2024 om ändring av förordning (EU) 2016/2031 vad gäller fleråriga inventeringsprogram,
    anmälningar om förekomst av reglerade icke-karantänskadegörare, tillfälliga
    undantag från importförbud och från särskilda importkrav samt fastställande
    av förfaranden för att bevilja dessa, tillfälliga importkrav för högriskväxter,
    högriskväxtprodukter och andra högriskföremål, fastställande av förfaranden
    för förtecknande av högriskväxter, innehållet i sundhetscertifikat och användning
    av växtpass samt vad gäller vissa rapporteringskrav för avgränsade områden
    och inventeringar av skadegörare och om ändring av förordning (EU) 2017/625
    vad gäller vissa anmälningar om bristande efterlevnad
  type: main
