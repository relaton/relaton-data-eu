title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1493/75 of the Commission of 11 June 1975 re-establishing
    the levying of customs duties on wrought bars, rods, angles, shapes and sections
    of aluminium; aluminium wire, falling within heading No 76.02, originating in
    Yugoslavia, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1493/75 de la Commission, du 11 juin 1975, portant
    rétablissement de la perception des droits de douane applicables aux barres,
    profilés et fils de section pleine, en aluminium, de la position tarifaire 76.02,
    originaires de la Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1493/75 der Kommission vom 11. Juni 1975 zur Wiedereinführung
    des Zollsatzes für Stäbe, Profile und Draht, aus Aluminium, massiv, der Tarifnummer
    76.02, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3054/74
    des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1493/75 af 11. juni 1975 om genindførelse
    af opkrævning af toldafgifter for stænger, profiler og tråd af aluminium, under
    position 76.02, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1493/75 della Commissione, dell'11 giugno 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle barre, profilati
    e fili di sezione piena, di alluminio, della voce doganale 76.02, originari della
    Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1493/75 van de Commissie van 11 juni 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op staven, profielen
    en draad, massief, van aluminium, van post 76.02, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december
    1974 algemene tariefpreferenties werden geopend
  type: main
