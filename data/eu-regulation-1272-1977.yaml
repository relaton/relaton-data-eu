id: EURegulation12721977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1272/77 of 13 June 1977 re-establishing
    the levying of customs duties on illuminating glassware, signalling glassware
    and optical elements of glass, other, falling within subheading 70.14 B, originating
    in Hong Kong to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1272/77 de la Commission, du 13 juin 1977, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d'éclairage, de signalisation et d'optique commune, autres, de la sous- position
    tarifaire 70.14 B, originaires de Hong-Kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1272/77 der Kommission vom 13. Juni 1977 zur Wiedereinführung
    des Zollsatzes für andere Glaswaren für Beleuchtung usw. als zum Ausstatten
    von elektrischen Beleuchtungskörpern, der Tarifstelle 70.14 B, mit Ursprung in
    Hongkong, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1272/77 af 13. juni 1977 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas; optiske artikler
    af glas, hverken optisk bearbejdet eller af optisk glas, i andre tilfælde, under
    under-position 70.14 B, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1272/77 della Commissione, del 13 giugno 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per l'illuminazione,
    per segnalazione e per ottica comune, altri, della sottovoce doganale 70.14 B,
    originari di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1272/77 van de Commissie van 13 juni 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas; optische elementen van gewoon glas,
    niet optisch bewerkt, andere, van post 70.14 B, van oorsprong uit Hong-Kong, ten
    behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
