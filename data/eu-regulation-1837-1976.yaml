title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1837/76 of 28 July 1976 re-establishing
    the levying of customs duties on heavy oils, falling within subheadings 27.10
    C I c), C II c) and C III c) and d), originating in developing countries, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3010/75
    of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1837/76 de la Commission, du 28 juillet 1976, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole lourdes, des sous-positions tarifaires 27.10 CI c), 27.10 C II c), 27.10
    C III c) et 27.10 C III d), originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1837/76 der Kommission vom 28. Juli 1976 zur Wiedereinführung
    des Zollsatzes für Schweröle der Tarifstellen 27.10 C I c), C II c), C III c)
    und d), mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1837/76 af 28. juli 1976 om genindførelse
    af opkrævning af toldafgifter for tunge olier under underposition 27.10 C I c),
    C II c), C III c) og d), som har oprindelse i udviklingslande og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17.
    november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1837/76 della Commissione, del 28 luglio 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli oli pesanti delle
    sottovoci doganali 27.10 C I c), II c), III c), d) originari dei paesi in via
    di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1837/76 van de Commissie van 28 juli 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zware oliën,
    van onderverdelingen 27.10 C I c), C II c), C III c) en d), van oorsprong uit
    de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75
    van de Raad van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
