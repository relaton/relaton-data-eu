    durchzufuehrenden Verkaufs von Weinalkohol aus Bestaenden der Interventionsstellen
    zur Verwendung in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 142/90 af 19. januar 1990 om ændring
