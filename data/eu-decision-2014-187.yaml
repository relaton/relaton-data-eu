id: EUDecision2014187
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: "(2014/187/EU): Commission Implementing Decision of 3 April 2014 amending Decision 2009/821/EC as regards the lists of border inspection posts and veterinary units in Traces (notified under document C(2014) 2094)"
  type: main
- language: fr
  script: Latn
  content: "(2014/187/UE): Décision d'exécution de la Commission du 3 avril 2014 modifiant la décision 2009/821/CE en ce qui concerne la liste des postes d'inspection frontaliers et celle des unités vétérinaires du système TRACES [notifiée sous le numéro C(2014) 2094]"
  type: main
- language: de
  script: Latn
  content: "(2014/187/EU): Durchführungsbeschluss der Kommission vom 3. April 2014 zur Änderung der Entscheidung 2009/821/EG hinsichtlich des Verzeichnisses der Grenzkontrollstellen und der Veterinäreinheiten in TRACES (Bekanntgegeben unter Aktenzeichen C(2014) 2094)"
  type: main
- language: bg
  script: Cyrl
  content: "(2014/187/ЕС): Решение за изпълнение на Комисията от 3 април 2014 година за изменение на Решение 2009/821/ЕО по отношение на списъците на граничните инспекционни пунктове и на ветеринарните единици в системата TRACES (нотифицирано под номер С(2014) 2094)"
  type: main
- language: cs
  script: Latn
  content: "(2014/187/EU): Prováděcí rozhodnutí Komise ze dne 3. dubna 2014 , kterým se mění rozhodnutí 2009/821/ES, pokud jde o seznamy stanovišť hraniční kontroly a veterinárních jednotek v TRACES (oznámeno pod číslem C(2014) 2094)"
  type: main
- language: da
  script: Latn
  content: "(2014/187/EU): Kommissionens gennemførelsesafgørelse af 3. april 2014 om ændring af beslutning 2009/821/EF for så vidt angår listerne over grænsekontrolsteder og veterinærenheder i Traces (meddelt under nummer C(2014) 2094)"
  type: main
- language: el
  script: Grek
  content: "(2014/187/EΕ): Εκτελεστική απόφαση της Επιτροπής, της 3ης Απριλίου 2014 , για την τροποποίηση της απόφασης 2009/821/ΕΚ όσον αφορά τους καταλόγους συνοριακών σταθμών ελέγχου και κτηνιατρικών μονάδων στο Traces [κοινοποιηθείσα υπό τον αριθμό C(2014) 2094]"
  type: main
- language: et
  script: Latn
  content: "(2014/187/EL): Komisjoni rakendusotsus, 3. aprill 2014 , millega muudetakse otsust 2009/821/EÜ seoses piirikontrollipunktide loetelu ja süsteemi TRACES kuuluvate veterinaarasutuste loeteluga (teatavaks tehtud numbri C(2014) 2094 all)"
  type: main
- language: fi
  script: Latn
  content: "(2014/187/EU): Komission täytäntöönpanopäätös, annettu 3 päivänä huhtikuuta 2014 , päätöksen 2009/821/EY muuttamisesta rajatarkastusasemien ja Traces-järjestelmän eläinlääkintäyksikköjen luetteloiden osalta (tiedoksiannettu numerolla C(2014) 2094)"
  type: main
- language: hr
  script: Latn
  content: "(2014/187/EU): Provedbena odluka Komisije оd 3. travnja 2014. o izmjeni Odluke 2009/821/EZ vezane uz popise graničnih inspekcijskih postaja i veterinarskih jedinica u okviru Tracesa (priopćeno pod brojem dokumenta C(2014) 2094)"
  type: main
- language: hu
  script: Latn
  content: "(2014/187/EU): A Bizottság végrehajtási határozata ( 2014. április 3. ) a 2009/821/EK határozatnak az állat-egészségügyi határállomások listája és a TRACES állat-egészségügyi egységeinek listája tekintetében történő módosításáról (az értesítések a C(2014) 2094. számű dokumentummal történt)"
  type: main
- language: it
  script: Latn
  content: "(2014/187/UE): Decisione di esecuzione della Commissione, del 3 aprile 2014 , che modifica la decisione 2009/821/CE per quanto riguarda l'elenco dei posti d'ispezione frontalieri e delle unità veterinarie del sistema TRACES [notificata con il numero C(2014) 2094]"
  type: main
- language: lv
  script: Latn
  content: "(2014/187/ES): Komisijas Īstenošanas lēmums ( 2014. gada 3. aprīlis ), ar ko groza Lēmumu 2009/821/EK attiecībā uz robežkontroles punktu un veterināro vienību sarakstiem Traces sistēmā (izziņots ar dokumenta numuru C(2014) 2094)"
  type: main
- language: lt
  script: Latn
  content: "(2014/187/ES): 2014 m. balandžio 3 d. Komisijos įgyvendinimo sprendimas, kuriuo dėl pasienio kontrolės postų ir TRACES veterinarijos padalinių sąrašų iš dalies keičiamas Sprendimas 2009/821/EB (pranešta dokumentu Nr. C(2014) 2094)"
  type: main
- language: mt
  script: Latn
  content: "(2014/187/UE): Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni tat- 3 ta' April 2014 li temenda d-Deċiżjoni 2009/821/KE fir-rigward tal-listi ta' postijiet ta' spezzjoni fil-fruntiera u tal-unitajiet veterinarji fi Traces (notifikata bid-dokument C(2014) 2094)"
  type: main
- language: nl
  script: Latn
  content: "(2014/187/EU): Uitvoeringsbesluit van de Commissie van 3 april 2014 tot wijziging van Beschikking 2009/821/EG wat betreft de lijsten van grensinspectieposten en veterinaire eenheden in Traces (Kennisgeving geschied onder nummer C(2014) 2094)"
  type: main
- language: pl
  script: Latn
  content: "(2014/187/UE): Decyzja wykonawcza Komisji z dnia 3 kwietnia 2014 r. zmieniająca decyzję 2009/821/WE w odniesieniu do wykazów punktów kontroli granicznej i jednostek weterynaryjnych w systemie TRACES (notyfikowana jako dokument nr C(2014) 2094)"
  type: main
- language: pt
  script: Latn
  content: "(2014/187/UE): Decisão de Execução da Comissão, de 3 de abril de 2014 , que altera a Decisão 2009/821/CE no que se refere às listas de postos de inspeção fronteiriços e unidades veterinárias no sistema Traces [notificada com o número C(2014) 2094]"
  type: main
- language: ro
  script: Latn
  content: "(2014/187/UE): Decizia de punere în aplicare a Comisiei din 3 aprilie 2014 de modificare a Deciziei 2009/821/CE în ceea ce privește lista punctelor de control la frontieră și lista unităților veterinare din Traces [notificată cu numărul C(2014) 2094]"
  type: main
- language: sk
  script: Latn
  content: "(2014/187/EÚ): Vykonávacie rozhodnutie Komisie z 3. apríla 2014 , ktorým sa mení rozhodnutie 2009/821/ES, pokiaľ ide o zoznamy hraničných inšpekčných staníc a veterinárnych jednotiek v systéme Traces [oznámené pod číslom C(2014) 2094]"
  type: main
- language: sl
  script: Latn
  content: "(2014/187/EU): Izvedbeni sklep Komisije z dne 3. aprila 2014 o spremembi Odločbe 2009/821/ES glede seznama mejnih kontrolnih točk in veterinarskih enot v Traces (notificirano pod dokumentarno številko C(2014) 2094)"
  type: main
- language: es
  script: Latn
  content: "(2014/187/UE): Decisión de Ejecución de la Comisión, de 3 de abril de 2014 , por la que se modifica la Decisión 2009/821/CE en lo relativo a las listas de puestos de inspección fronterizos y unidades veterinarias de Traces [notificada con el número C(2014) 2094]"
  type: main
- language: sv
  script: Latn
  content: "(2014/187/EU): Kommissionens genomförandebeslut av den 3 april 2014 om ändring av beslut 2009/821/EG vad gäller förteckningarna över gränskontrollstationer och veterinärenheter i Traces [delgivet med nr (2014) 2094]"
  type: main
