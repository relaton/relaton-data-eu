  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 1127/2010 od 3. prosinca 2010. o uspostavi prijelaznog
    razdoblja za povlačenje Republike Maldiva s popisa zemalja korisnica posebnog
    dogovora za najnerazvijenije zemlje, u skladu s Uredbom Vijeća (EZ) br. 732/2008
    o primjeni sustava općih carinskih povlastica za razdoblje od 1. siječnja 2009.
    do 31. prosinca 2011.
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1127/2010/EU rendelete ( 2010. december 3. ) az általános
    tarifális preferenciák rendszerének 2009. január 1-jétől 2011. december
    31-ig történő alkalmazásáról szóló 732/2008/EK tanácsi rendelet értelmében
    a legkevésbé fejlett országokra vonatkozó különleges előírásokra jogosult
    kedvezményezett országok listájáról a Maldív Köztársaság levételére
    vonatkozóan átmeneti időszak meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 1127/2010 della Commissione, del 3 dicembre 2010 ,
    che fissa un periodo transitorio per depennare la Repubblica delle Maldive dall’elenco
    dei paesi beneficiari del regime speciale a favore dei paesi meno sviluppati,
    come previsto dal regolamento (CE) n. 732/2008 del Consiglio relativo all’applicazione
    di un sistema di preferenze tariffarie generalizzate per il periodo dal 1 °gennaio
    2009 al 31 dicembre 2011
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 1127/2010 ( 2010. gada 3. decembris ), ar ko
    paredz pārejas laiku Maldīvijas Republikas svītrošanai no saņēmējvalstu
    saraksta, kurām piemēro īpašo režīmu attiecībā uz vismazāk attīstītajām
    valstīm, kā noteikts Padomes Regulā (EK) Nr. 732/2008 par vispārējo tarifa
    preferenču sistēmas piemērošanu laikposmā no 2009. gada 1. janvāra līdz
    2011. gada 31. decembrim
  type: main
- language: lt
  script: Latn
  content: 2010 m. gruodžio 3 d. Komisijos reglamentas (ES) Nr. 1127/2010, kuriuo
    nustatomas pereinamasis laikotarpis, reikalingas pašalinti Maldyvų Respublikai
    iš šalių, gaunančių lengvatas pagal mažiausiai išsivysčiusioms šalims
    taikomą specialiąją priemonę, sąrašo, kaip nustatyta Tarybos reglamente
    (EB) Nr. 732/2008 dėl bendrųjų tarifų lengvatų sistemos taikymo nuo 2009
    m. sausio 1 d. iki 2011 m. gruodžio 31 d.
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 1127/2010 tat- 3 ta’ Diċembru 2010
