    mil-lista ta’ pajjiżi benefiċjarji mill-arranġament speċjali għall-pajjiżi
    l-anqas żviluppati, kif stabbilit fir-Regolament tal-Kunsill (KE) Nru 732/2008
    li japplika skema ta’ preferenzi tariffarji ġeneralizzati għall-perjodu mill-
    1 ta’ Jannar 2009 sal- 31 ta’ Diċembru 2011
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 1127/2010 van de Commissie van 3 december 2010 tot
    instelling van een overgangsperiode voor de verwijdering van de Republiek der
    Maldiven uit de lijst van landen die in aanmerking komen voor de bijzondere regeling
    voor de minst ontwikkelde landen, zoals opgenomen in Verordening (EG) nr. 732/2008
    van de Raad houdende toepassing van een schema van algemene tariefpreferenties
    voor de periode van 1 januari 2009 tot en met 31 december 2011
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 1127/2010 z dnia 3 grudnia 2010 r. ustanawiające
