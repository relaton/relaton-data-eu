    krajín, na ktoré sa vzťahuje osobitné opatrenie pre najmenej rozvinuté krajiny
    podľa nariadenia Rady (ES) č. 732/2008, ktorým sa uplatňuje systém všeobecných
    colných preferencií na obdobie od 1. januára 2009 do 31. decembra 2011
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 1127/2010 z dne 3. decembra 2010 o uvedbi prehodnega
