    okres od dnia 1 stycznia 2009 r. do dnia 31 grudnia 2011 r.
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 1127/2010 da Comissão, de 3 de Dezembro de 2010
