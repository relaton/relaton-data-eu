title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 1127/2010 of 3 December 2010 establishing
    a transitional period for withdrawing the Republic of Maldives from the list of
    beneficiary countries of the special arrangement for least developed countries,
    as set out in Council Regulation (EC) No 732/2008 applying a scheme of generalised
    tariff preferences for the period from 1 January 2009 to 31 December 2011
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 1127/2010 de la Commission du 3 décembre 2010 mettant
    en place une période transitoire pour le retrait de la République des Maldives
    de la liste des bénéficiaires du régime spécial en faveur des pays les moins
    avancés conformément au règlement (CE) n ° 732/2008 du Conseil appliquant
    un schéma de préférences tarifaires généralisées pour la période du 1 er
    janvier 2009 au 31 décembre 2011
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 1127/2010 der Kommission vom 3. Dezember 2010 zur Festlegung
    eines Übergangszeitraums für die Streichung der Republik Malediven von der Liste
    der im Rahmen der Sonderregelung für die am wenigsten entwickelten Länder begünstigten
    Länder nach Maßgabe der Verordnung (EG) Nr. 732/2008 des Rates über ein Schema
    allgemeiner Zollpräferenzen für den Zeitraum vom 1. Januar 2009 bis 31. Dezember
    2011
  type: main
