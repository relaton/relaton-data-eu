    avançados, como previsto no Regulamento (CE) n. ° 732/2008 do Conselho que aplica
    um sistema de preferências pautais generalizadas para o período compreendido
    entre 1 de Janeiro de 2009 e 31 de Dezembro de 2011
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 1127/2010 al Comisiei din 3 decembrie 2010 de stabilire
