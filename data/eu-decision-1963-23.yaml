title:
- language: en
  script: Latn
  content: 'ECSC High Authority: Decision No 23-63 of 11 December 1963 requiring Community
    iron and steel undertakings to make returns to the High Authority of the transactions
    in which they align their quotations on those of undertakings outside the Community'
  type: main
- language: fr
  script: Latn
  content: 'CECA Haute Autorité: Décision n° 23-63, du 11 décembre 1963, faisant
    obligation aux entreprises sidérurgiques de la Communauté de notifier à la
    Haute Autorité les transactions pour lesquelles elles alignent leurs offres sur
    les conditions faites par des entreprises extérieures à la Communauté'
  type: main
- language: de
  script: Latn
  content: 'EGKS Hohe Behörde: Entscheidung Nr. 23/63 vom 11. Dezember 1963 über
    die Verpflichtung der Unternehmen der Stahlindustrie der Gemeinschaft, Geschäfte,
    bei denen sie ihre Angebote nach den Bedingungen ausrichten, die von Unternehmen
    außerhalb der Gemeinschaft gemacht werden, der Hohen Behörde mitzuteilen'
  type: main
- language: da
  script: Latn
  content: 'Høje Myndighed: Beslutning nr. 23/63 af 11. december 1963 om forpligtelsen
    for virksomhederne inden for stålindustrien i Fællesskabet til at give Den høje
    Myndighed meddelelse om forretninger, for hvilke de tilpasser deres tilbud efter
    betingelser, der tilbydes af virksomheder uden for Fællesskabet'
  type: main
- language: el
  script: Grek
  content: 'ΕΚΑΧ Ανωτάτη Αρχή: Απόφαση αριθ. 23—63 της
    11ης Δεκεμβρίου 1963 περί υποχρεώσεως των επιχειρήσεων
    σιδήρου και χάλυβα της Κοινότητας να κοινοποιούν
    στην Ανωτάτη Αρχή τις συναλλαγές για τις οποίες
    ευθυγραμμίζουν τις προσφορές τους με τους
    όρους προσφοράς των εκτός της Κοινότητας επιχειρήσεων'
  type: main
- language: it
  script: Latn
  content: 'CECA Alta Autorità: Décisione n. 23-63 dell''11 dicembre 1963 che obbliga
    le imprese siderurgiche della Comunità a comunicare all''Alta Autorità le transazioni
    per allineamento delle proprie offerte sulle condizioni di imprese esterne alla
    Comunità'
  type: main
- language: nl
  script: Latn
  content: 'EGKS Hoge Autoriteit: Beschikking nr. 23-63 van 11 december 1963 betreffende
    de verplichting der ondernemingen van de staalindustrie der Gemeenschap om transacties
    waarbij zij hun aanbiedingen in overeenstemming brengen met de voorwaarden van
    buiten de Gemeenschap gevestigde ondernemingen, aan de Hoge Autoriteit mede te
    delen'
  type: main
- language: pt
  script: Latn
  content: Decisão nº 23-63, de 11 de Dezembro de 1963, que cria a obrigação de
    as empresas siderúrgicas da Comunidade notificarem à Alta Autoridade as transacções
    relativamente às quais alinhem as suas ofertas pelas condições oferecidas por
    empresas exteriores à Comunidade
  type: main
- language: es
  script: Latn
  content: Decisión n° 23/63, de 11 de diciembre de 1963, por la que se obliga a
    las empresas siderúrgicas de la Comunidad a notificar a la Alta Autoridad las
    transacciones mediante las cuales ajustan sus ofertas con las condiciones presentadas
    por empresas exteriores a la Comunidad
