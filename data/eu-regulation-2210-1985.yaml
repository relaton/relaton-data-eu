  script: Latn
  content: Commission Regulation (EEC) No 2210/85 of 31 July 1985 amending for the
    26th time Regulation (EEC) No 2730/81 establishing a list of agencies in non-member
    importing countries entitled to issue invitations to tender in the milk and milk
    products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2210/85 de la Commission du 31 juillet 1985 modifiant
