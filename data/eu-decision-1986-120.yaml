title:
- language: en
  script: Latn
  content: '86/120/EEC: Commission Decision of 10 March 1986 approving derogations
    provided for by Greece and Italy from certain provisions of Council Directive
    77/93/EEC in respect of seed potatoes originating in Canada (Only the Greek and
    Italian texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/120/CEE: Décision de la Commission du 10 mars 1986 approuvant des
    dérogations prévues par la Grèce et par l''Italie à certaines dispositions
    de la directive 77/93/CEE du Conseil en ce qui concerne les plants de pommes de
    terre originaires du Canada (Les textes en langues grecque et italienne sont les
    seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/120/EWG: Entscheidung der Kommission vom 10. März 1986 zur Genehmigung
    der von Griechenland und Italien für Pflanzkartoffeln mit Ursprung in Kanada
    vorgesehenen Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des
    Rates (Nur der griechische und italienische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/120/EØF: Kommissionens beslutning af 10. marts 1986 om godkendelse
