    kyseisessä asetuksessa annettuun kolmansien maiden luetteloon, jotta voitaisiin
    sallia Valko-Venäjältä tulevien, ihmisravinnoksi tarkoitettujen munien ja munatuotteiden
    kuljetus unionin kautta, sekä muiden kuin sileälastaisten lintujen untuvikoista
    annettavan todistuksen muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 241/2010 od 8. ožujka 2010. o izmjeni Priloga
    I. Uredbi (EZ) br. 798/2008 o uvrštavanju unosa za Bjelarus na popis trećih
    zemalja iz navedene Uredbe kako bi se dozvolio provoz jaja i proizvoda od jaja
    namijenjenih prehrani ljudi iz Bjelarusa kroz Uniju te promjeni certificiranja
    za jednodnevne piliće peradi osim bezgrebenki
  type: main
- language: hu
  script: Latn
  content: A Bizottság 241/2010/EU rendelete ( 2010. március 8.) a 798/2008/EK rendelet
    I. mellékletének az emberi fogyasztásra szánt tojások és tojástermékek
    Belaruszból az Unión keresztül történő szállításának lehetővé tétele,
    valamint a naposcsibék és a keltetőtojások (kivéve a laposmellű futómadarak
    naposcsibéi és keltetőtojásai) állat-egészségügyi bizonyítványai kiállításának
    módosítása érdekében Belarusznak a harmadik országok említett rendeletben
    meghatározott jegyzékébe való felvétele tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 241/2010 della Commissione, dell’ 8 marzo 2010 ,
    che modifica l’allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    l’inclusione della Bielorussia nell’elenco di paesi terzi figurante in detto
    regolamento al fine di consentire il transito dalla Bielorussia nell’UE di uova
    e ovoprodotti destinati al consumo umano e che modifica il certificato relativo
    ai pulcini di un giorno diversi da quelli dei ratiti
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 241/2010 ( 2010. gada 8. marts), ar ko groza
    Regulas (EK) Nr. 798/2008 I pielikumu, iekļaujot Baltkrieviju ar minēto regulu
    izveidotajā trešo valstu sarakstā, lai atļautu lietošanai pārtikā paredzētu
    olu un olu produktu tranzītu caur Savienību no Baltkrievijas un grozītu sertificēšanas
    kārtību diennakti veciem cāļiem, izņemot diennakti vecus skrējējputnu cāļus
  type: main
- language: lt
  script: Latn
  content: 2010 m. kovo 8 d. Komisijos reglamentas (ES) Nr. 241/2010, kuriuo iš dalies
    keičiamos Reglamento (EB) Nr. 798/2008 I priedo nuostatos dėl Baltarusijos įtraukimo
    į tame reglamente pateiktą trečiųjų šalių sąrašą, kad žmonėms vartoti
    skirtus kiaušinius ir kiaušinių produktus iš Baltarusijos būtų leista vežti
    tranzitu per Sąjungą, ir keičiami ne Ratitae genties naminių paukščių vienadienių
    jauniklių sertifikavimo reikalavimai
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 241/2010 tat- 8 ta’ Marzu 2010 li
    jemenda l-Anness I għar-Regolament (KE) Nru 798/2008 fir-rigward tal-inklużjoni
    tal-Belarus fil-lista ta’ pajjiżi terzi stipulati f’dak ir-Regolament sabiex
    jippermetti t-tranżitu mill-Belarus permezz tal-Unjoni ta’ bajd u prodotti
    tal-bajd għall-konsum uman u l-modifika ta’ ċertifikazzjoni għal flieles
    ta’ tjur ta’ ġurnata għajr għal għasafar li ma jtirux
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 241/2010 van de Commissie van 8 maart 2010 tot wijziging
    van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de opname van Belarus
    in de lijst van derde landen in die verordening teneinde de doorvoer uit Belarus
    door de Europese Unie van voor menselijke consumptie bestemde eieren en eiproducten
    toe te staan, en tot wijziging van de certificering van eendagskuikens van pluimvee
    met uitzondering van loopvogels
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 241/2010 z dnia 8 marca 2010 r. zmieniające
    załącznik I do rozporządzenia (WE) nr 798/2008 w zakresie włączenia Białorusi
    do wykazu państw trzecich ustanowionego w tym rozporządzeniu w celu dopuszczenia
    tranzytu z Białorusi przez terytorium Unii jaj i przetworów jajecznych przeznaczonych
    do spożycia przez ludzi oraz zmieniające świadectwo dla jednodniowych piskląt
    pochodzących od drobiu z wyjątkiem ptaków bezgrzebieniowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. o 241/2010 da Comissão, de 8 de Março de 2010 , que
    altera o anexo I do Regulamento (CE) n. o 798/2008 no que respeita à inclusão
    da Bielorrússia na lista de países terceiros estabelecida naquele regulamento
    por forma a permitir o trânsito através da União de ovos e ovoprodutos para
    consumo humano provenientes da Bielorrússia e que altera a certificação aplicável
    aos pintos do dia de aves de capoeira à excepção de ratites
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 241/2010 al Comisiei din 8 martie 2010 de modificare
    a anexei I la Regulamentul (CE) nr. 798/2008 privind includerea Belarusului pe
    lista țărilor terțe prevăzută în regulamentul respectiv pentru a permite
    tranzitul din Belarus prin Uniune al ouălor și produselor din ouă destinate
    consumului uman și de modificare a certificării pentru puii de o zi de păsări
    de curte, altele decât ratite
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 241/2010 z 8. marca 2010 , ktorým sa mení
    a dopĺňa príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o zahrnutie
    Bieloruska do zoznamu tretích krajín ustanoveného v uvedenom nariadení s cieľom
    povoliť tranzit vajec a výrobkov z vajec na ľudskú spotrebu z Bieloruska cez
    územie Únie, a ktorým sa mení a dopĺňa osvedčovanie jednodňových kurčiat
    hydiny inej ako vtáky nadradu bežce
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 241/2010 z dne 8. marca 2010 o spremembi Priloge
    I k Uredbi (ES) št. 798/2008 glede vključitve Belorusije na seznam tretjih držav
    iz navedene uredbe, da se odobri tranzit jajc in jajčnih izdelkov za prehrano
    ljudi iz Belorusije skozi Unijo, ter o spremembi certificiranja za enodnevne piščance
    perutnine razen ratitov
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n o 241/2010 de la Comisión, de 8 de marzo de 2010 , por
    el que se modifica el anexo I del Reglamento (CE) n o 798/2008 en lo que respecta
    a la inclusión de Belarús en la lista de terceros países del citado Reglamento,
    a fin de permitir el tránsito por la Unión de huevos y ovoproductos destinados
    al consumo humano procedentes de Belarús, y por el que se modifica la certificación
    de pollitos de un día de aves de corral distintas de las ratites
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 241/2010 av den 8 mars 2010 om ändring
    av bilaga I till förordning (EG) nr 798/2008 vad gäller införande av Vitryssland
    i förteckningen över tredjeländer i den förordningen för att tillåta transitering
    från Vitryssland genom unionen av ägg och äggprodukter avsedda att användas
    som livsmedel och om ändring av intygskraven för dagsgamla kycklingar av andra
    arter än ratiter
