  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 241/2010, 8. märts 2010 , millega muudetakse
    määruse (EÜ) nr 798/2008 I lisa seoses Valgevene lisamisega kõnealuses määruses
    sätestatud kolmandate riikide loetellu, et lubada vedada läbi Euroopa Liidu
    Valgevenest pärit inimtoiduks ette nähtud munasid ja munatooteid, ning muudetakse
    muude kodulindude kui silerinnaliste lindude ühepäevaste tibude veterinaarsertifikaati
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 241/2010, annettu 8 päivänä maaliskuuta 2010
