title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 241/2010 of 8 March 2010 amending Annex I
    to Regulation (EC) No 798/2008 as regards the inclusion of Belarus in the list
    of third countries set out in that Regulation in order to permit transit from
    Belarus through the Union of eggs and egg products for human consumption and modifying
    certification for day-old chicks of poultry other than ratites
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 241/2010 de la Commission du 8 mars 2010 modifiant
    l’annexe I du règlement (CE) n o 798/2008 pour inscrire le Belarus sur la liste
    des pays tiers qui y est établie, de manière à autoriser le transit par l’Union
    d’œufs et d’ovoproduits destinés à la consommation humaine provenant du
    Belarus, et modifiant les conditions de certification des poussins d’un jour
    autres que de ratites
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 241/2010 der Kommission vom 8. März 2010 zur Änderung
    des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich der Aufnahme von Belarus
    in die Liste von Drittländern der genannten Verordnung, damit für den menschlichen
    Verzehr bestimmte Eier und Eiprodukte aus Belarus durch die Union durchgeführt
    werden dürfen, und zur Änderung der Veterinärbescheinigung für Eintagsküken
    von Geflügel, ausgenommen Eintagsküken von Laufvögeln
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 241/2010 на Комисията от 8 март
    2010 година за изменение на приложение I към Регламент
    (ЕО) № 798/2008 по отношение на включването на Беларус
    в списъка с трети държави, определен в посочения
    регламент, за да се позволи транзитното преминаване
    през Съюза на яйца и яйчни продукти за консумация
    от човека от Беларус и за изменение на сертифицирането
    на еднодневни пилета от домашни птици, различни
    от щраусови птици
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 241/2010 ze dne 8. března 2010 , kterým se
    mění příloha I nařízení (ES) č. 798/2008, pokud jde o zahrnutí Běloruska
    do seznamu třetích zemí stanoveného v uvedeném nařízení s cílem povolit
    tranzit vajec a vaječných výrobků k lidské spotřebě z Běloruska přes
    území Unie, a kterým se mění osvědčování pro jednodenní kuřata jiná
    než ptáků nadřádu běžci
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 241/2010 af 8. marts 2010 om ændring
    af bilag I til forordning (EF) nr. 798/2008 for så vidt angår optagelse af Belarus
    på den i samme forordning fastlagte liste over tredjelande for at tillade transit
    fra Belarus gennem EU af æg og ægprodukter til konsum og om ændring af certifikatudstedelseskravene
    for daggamle kyllinger af fjerkræ, bortset fra strudsefugle
  type: main
- language: el
  script: Grek
