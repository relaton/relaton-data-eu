  content: Commission Implementing Regulation (EU) 2023/725 of 31 March 2023 amending
    Annexes V, XIV and XV to Implementing Regulation (EU) 2021/404 as regards the
    entries for Canada, Chile, the United Kingdom and the United States in the lists
    of third countries authorised for the entry into the Union of consignments of
    poultry and germinal products of poultry and fresh meat of poultry and game birds
    and meat products from ungulates, poultry and game birds
  type: main
- language: fr
  script: Latn
