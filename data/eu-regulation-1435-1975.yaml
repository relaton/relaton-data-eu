  content: Regulation (EEC) No 1435/75 of the Commission of 3 June 1975 amending Regulations
    (EEC) No 2637/70 and (EEC) No 2500/73 on the advance fixing of refunds and the
    period of validity of export licences for milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1435/75 de la Commission, du 3 juin 1975, modifiant
    les règlements (CEE) n° 2637/70 et (CEE) n° 2500/73 en ce qui concerne les
    fixations à l' avance des restitutions et les certificats d' exportation dans
    le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1435/75 der Kommission vom 3. Juni 1975 zur Änderung
    der Verordnungen (EWG) Nr. 2637/70 und Nr. 2500/73 in bezug auf die Vorausfestsetzung
    der Erstattungen und die Ausfuhrlizenzen für Milch und Milcherzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1435/75 af 3. juni 1975 om ændring
