title:
- language: fr
  script: Latn
  content: Règlement n° 106/67/CEE du Conseil, du 31 mai 1967, dérogeant à certaines
    dispositions du règlement n° 13/64/CEE en ce qui concerne la fixation des prix
    de seuil et le calcul des prélèvements ainsi que de la restitution applicables
    à certains fromages
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 106/67/EWG des Rates vom 31. Mai 1967 über die Abweichung
    von einigen Vorschriften der Verordnung Nr. 13/64/EWG in bezug auf die Festsetzung
    der Schwellenpreise und die Berechnung der Abschöpfungsbeträge sowie der Erstattungsbeträge
    für bestimmte Käsesorten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 106/67/CEE del Consiglio, del 31 maggio 1967, che deroga
    a talune disposizioni del regolamento n. 13/64/CEE per quanto riguarda la fissazione
    dei prezzi d'entrata e il calcolo dei prelievi e delle restituzioni applicabili
    a taluni formaggi
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 106/67/EEG van de Raad van 31 mei 1967 houdende afwijking
    van sommige bepalingen van Verordening Nr. 13/64/EEG voor zover deze betrekking
    hebben op de vaststelling van de drempelprijzen en de berekening van de heffingen
    en van de restitutie voor sommige kaassoorten
  type: main
