    2021/403 en ce qui concerne certains modèles de certificat zoosanitaire, de certificat
    zoosanitaire/officiel et de déclaration pour les mouvements entre États membres
    et l’entrée dans l’Union d’envois de certaines espèces et catégories
    d’animaux terrestres et de leurs produits germinaux
  type: main
