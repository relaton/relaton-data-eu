  script: Latn
  content: Commission Implementing Regulation (EU) 2022/497 of 28 March 2022 amending
    and correcting Annexes I and II to Implementing Regulation (EU) 2021/403 as regards
    certain model animal health certificates, animal health/official certificates
    and declarations for the movements between Member States and the entry into the
    Union of consignments of certain species and categories of terrestrial animals
    and germinal products thereof
  type: main
- language: fr
  script: Latn
