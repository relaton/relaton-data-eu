title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 193/84 of 20 January 1984 determining the
    amounts of the variable components and additional duties applicable from 1 February
    to 30 April 1984 on the importation into the Community of goods covered by Regulation
    (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 193/84 de la Commission, du 20 janvier 1984, déterminant
    les montants des éléments mobiles ainsi que les droits additionnels applicables
    pendant la période du 1er février au 30 avril 1984 inclus à l'importation dans
    la Communauté des marchandises relevant du règlement (CEE) n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 193/84 der Kommission vom 20. Januar 1984 zur Festsetzung
    der Höhe der vom 1. Februar bis einschließlich 30. April 1984 bei der Einfuhr
    der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 193/84 af 20. januar 1984 om fastsættelse
    af størrelsen af de variable elementer og tillægstold for indførsel i Fællesskabet
    af varer henhørende under forordning (EØF) nr. 3033/80 for perioden fra den
    1. februar til den 30. april 1984
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 193/84 της Επιτροπής
    της 20ής Ιανουαρίου 1984 περί καθορισμού των ποσών
    των μεταβλητών στοιχείων και των πρόσθετων
    δασμών που εφαρμόζονται κατά την περίοδο από
    1ης Φεβρουαρίου μέχρι και 30ής Απριλίου 1984 κατά
    την εισαγωγή στην Κοινότητα εμπορευμάτων που
    υπάγονται στον κανονισμό (ΕΟΚ) αριθ. 3033/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 193/84 della Commissione, del 20 gennaio 1984, che
