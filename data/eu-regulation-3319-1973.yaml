title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3319/73 of the Commission of 6 December 1973 re-establishing
    Common Customs Tariff duties on handkerchiefs, of cotton, falling within heading
    No ex 61.05, originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2629/73 of 26 September 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3319/73 de la Commission, du 6 décembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux mouchoirs et pochettes, en tissus de coton, de la position tarifaire ex 61.05,
    originaires de la Corée du Sud bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2629/73 du Conseil, du 26 septembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3319/73 der Kommission vom 6. Dezember 1973 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Taschentücher
    und Ziertaschentücher, aus Baumwolle, der Tarifnummer ex 61.05, mit Ursprung
    in Südkorea, dem die in der Verordnung (EWG) Nr. 2629/73 des Rates vom 26. September
    1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3319/73 af 6. december 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for lommetørklæder, af bomuld under
    position ex 61.05, som har oprindelse i Syd-Korea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2629/73 af 26. september 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3319/73 della Commissione, del 6 dicembre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    fazzoletti da naso e da taschino, in tessuti di cotone, della voce doganale n.
    ex 61.05, originari della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2629/73 del Consiglio, del 26 settembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3319/73 van de Commissie van 6 december 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op zakdoeken van katoen van post ex 61.05, van oorsprong uit Zuid-Korea,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2629/73 van de Raad van 26 september 1973
  type: main
