title:
- language: en
  script: Latn
  content: '78/876/EEC: Commission Decision of 12 October 1978 authorizing the French
    Republic not to apply Community treatment to woven fabrics of man-made fibres
    (discontinuous or waste), falling within subheading ex 56.07 B of the Common Customs
    Tariff, originating in the People'' s Republic of China and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/876/CEE: Décision de la Commission, du 12 octobre 1978, autorisant
    la République française à exclure du traitement communautaire les tissus de
    fibres textiles artificielles discontinues de la sous-position ex 56.07 B du tarif
    douanier commun, originaires de République populaire de Chine et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/876/EWG: Entscheidung der Kommission vom 12. Oktober 1978, mit der
    die Französische Republik ermáchtigt wird, aus der Volksrepublik China stammende
    und in den úbrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus synthetischen
    oder kúnstlichen Spinnfasern der Tarifstelle ex 56.07 B des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/876/EØF: Kommissionens beslutning af 12. oktober 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævet stof
    af korte kemofibre eller af affald af kemofibre, som henhører under pos. ex 56.07
    B i den fælles toldtarif, har oprindelse i Den kinesiske Folkerepublik og frit
    kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/876/CEE: Decisione della Commissione, del 12 ottobre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario tessuti di fibre
    tessili artificiali in fiocco della sottovoce ex 56.07 B della tariffa doganale
    comune, originari della Repubblica popolare cinese e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/876/EEG: Beschikking van de Commissie van 12 oktober 1978 waarbij de
    Franse Republiek wordt gemachtigd weefsels van kunstmatige stapelvezels, van post
    ex 56.07 B van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
