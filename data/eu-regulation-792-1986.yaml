title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 792/86 of 18 March 1986 determining the
    extent to which applications lodged in February 1986 for the issue of import licences
    in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 792/86 de la Commission, du 18 mars 1986, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importations déposées au mois de février 1986 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 792/86 der Kommission vom 18. März 1986 über den
    Umfang, in dem den im Monat Februar 1986 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 792/86 af 18. marts 1986 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i februar måned 1986 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 792/86 της Επιτροπής
    της 18ης Μαρτίου 1986 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Φεβρουάριο του 1986, για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 792/86 della Commissione, del 18 marzo 1986, che stabilisce
    in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di febbraio 1986 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 792/86 van de Commissie van 18 maart 1986 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand februari
    1986 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 792/86 da Comissão, de 18 de Março de 1986, que
    determina em que medida pode ser dado seguimento aos pedidos de concessão de
    certificados de importação entregues no mês de Fevereiro de 1986 para as carnes
    de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 792/86 de la Comisión, de 18 de marzo de 1986, que
    determina en que medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de febrero de 1986 para las
    carnes de vacuno congeladas destinadas a la transformación
  type: main
