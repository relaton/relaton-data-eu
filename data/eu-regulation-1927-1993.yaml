title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1927/93 of 16 July 1993 not to accept tenders
    submitted in response to the ninth partial invitation to tender opened as a special
    intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1927/93 de la Commission, du 16 juillet 1993, de ne
    pas donner suite aux offres déposées à la suite de la neuvième adjudication
    partielle effectuée dans le cadre des mesures spéciales d'intervention conformément
    au règlement (CEE) n 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1927/93 der Kommission vom 16. Juli 1993 den Angeboten,
    die aufgrund der neunten Teilausschreibung im Rahmen der mit der Verordnung (EWG)
    Nr. 1627/89 eingeführten besonderen Interventionsmaßnahmen eingereicht wurden,
    nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1927/93 af 16. juli 1993 om ikke at
    tage den niende dellicitation i forbindelse med de særlige interventionsforanstaltninger
    i henhold til forordning (EØF) nr. 1627/89 til følge
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1927/93 της Επιτροπής
    της 16ης Ιουλίου 1993 για να μη δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για τον ένατο
    μερικό διαγωνισμό που πραγματοποιείται στο
    πλαίσιο των ειδικών μέτρων παρεμβάσεως σύμφωνα
    με τον κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1927/93 della Commissione, del 16 luglio 1993, di
    non dare seguito alle offerte presentate per la nona gara parziale effettuata
    nel quadro delle misure speciali di intervento a norma del regolamento (CEE) n.
    1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1927/93 van de Commissie van 16 juli 1993 waarbij
    geen gevolg wordt gegeven aan de offertes voor de negende deelinschrijving die
    overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de speciale interventiemaatregelen
    is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1927/93 da Comissão, de 16 de Julho de 1993, que
    rejeita as propostas apresentadas na sequência do nono concurso parcial realizado
    no âmbito das medidas especiais de intervenção em conformidade com o Regulamento
    (CEE) nº 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1927/93 de la Comisión, de 16 de julio de 1993, de
    no dar curso a las ofertas presentadas para la novena licitación parcial efectuada
    en el marco de las medidas especiales de intervención con arreglo al Reglamento
    (CEE) n 1627/89
  type: main
