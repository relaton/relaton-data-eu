    от 11 август 2017 година за изменение на Регламент
    (ЕС) № 1255/2010 по отношение на тарифната квота
    за внос на продукти от категорията „baby beef“
    с произход от Косово (Това название не засяга
    позициите по отношение на статута и е съобразено
    с Резолюция 1244/1999 на Съвета за сигурност на
    ООН и становището на Международния съд относно
    обявяването на независимост от страна на Косово.
    )
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/1467 ze dne 11. srpna 2017, kterým
    se mění nařízení (EU) č. 1255/2010, pokud jde o dovozní celní kvóty pro
    produkty kategorie „baby beef“ pocházející z Kosova (Tímto označením
    nejsou dotčeny postoje k otázce statusu a označení je v souladu s rezolucí
    Rady bezpečnosti OSN 1244/1999 a se stanoviskem Mezinárodního soudního dvora
    k vyhlášení nezávislosti Kosova. )
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2017/1467 af 11. august 2017
    om ændring af forordning (EU) nr. 1255/2010 for så vidt angår importtoldkontingenterne
    for »baby beef«-produkter med oprindelse i Kosovo (Denne betegnelse indebærer
    ingen stillingtagen til Kosovos status, og den er i overensstemmelse med FN's
    Sikkerhedsråds resolution 1244/1999 og Den Internationale Domstols udtalelse
    om Kosovos uafhængighedserklæring. )
  type: main
