title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1467 of 11 August 2017 amending
    Regulation (EU) No 1255/2010 as regards the import tariff quota for ‘baby beef’
    products originating in Kosovo (This designation is without prejudice to positions
    on status, and is in line with UNSCR 1244/1999 and the ICJ Opinion on the Kosovo
    declaration of independence. )
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/1467 de la Commission du 11 août 2017
    modifiant le règlement (UE) n° 1255/2010 en ce qui concerne le contingent tarifaire
    d'importation pour les produits de la catégorie «baby beef» originaires du
    Kosovo (Cette désignation est sans préjudice des positions sur le statut et
    est conforme à la résolution 1244 (1999) du Conseil de sécurité des Nations
    unies ainsi qu'à l'avis de la Cour internationale de justice sur la déclaration
    d'indépendance du Kosovo. )
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/1467 der Kommission vom 11. August 2017
    zur Änderung der Verordnung (EU) Nr. 1255/2010 hinsichtlich des Einfuhrzollkontingents
    für „Baby-beef“-Erzeugnisse mit Ursprung im Kosovo (Diese Bezeichnung berührt
    nicht die Standpunkte zum Status und steht im Einklang mit der Resolution 1244/1999
    des VN-Sicherheitsrates und dem Gutachten des Internationalen Gerichtshofs zur
    Unabhängigkeitserklärung des Kosovos. )
  type: main
- language: bg
  script: Cyrl
