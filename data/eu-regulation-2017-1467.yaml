    „baby beef“-toodete imporditariifikvootide osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2017/1467, annettu 11 päivänä
    elokuuta 2017, asetuksen (EU) N:o 1255/2010 muuttamisesta siltä osin kuin on
    kyse Kosovosta (Tämä nimitys ei vaikuta asemaa koskeviin kantoihin, ja se on
    YK:n turvallisuusneuvoston päätöslauselman 1244/1999 ja Kansainvälisen tuomioistuimen
    Kosovon itsenäisyysjulistuksesta antaman lausunnon mukainen. ) peräisin olevien
    ”baby beef” -tuotteiden tuontitariffikiintiöstä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2017/1467 оd 11. kolovoza 2017. o izmjeni
    Uredbe (EU) br. 1255/2010 u pogledu uvozne carinske kvote za proizvode od mlade
    govedine podrijetlom s Kosova (Ovim se nazivom ne dovode u pitanje stajališta
    o statusu te je on u skladu s rezolucijom Vijeća sigurnosti Ujedinjenih naroda
    1244/1999 i mišljenjem Međunarodnog suda o proglašenju neovisnosti Kosova.
    )
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1467 végrehajtási rendelete (2017. augusztus 11.)
    az 1255/2010/EU rendeletnek a Koszovóból (Ez a megnevezés nem érinti a jogállással
    kapcsolatos álláspontokat, továbbá összhangban van az 1244 (1999) sz. ENSZ
    BT-határozattal és a Nemzetközi Bíróságnak a koszovói függetlenségi nyilatkozatról
    szóló véleményével. ) származó „baby beef”-termékekre vonatkozóan
    megállapított vámkontingensek tekintetében való módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/1467 della Commissione, dell'11 agosto
    2017, che modifica il regolamento (UE) n. 1255/2010 per quanto riguarda i contingenti
    tariffari per l'importazione di prodotti «baby beef» originari del Kosovo (Tale
    designazione non pregiudica le posizioni riguardo allo status ed è in linea con
    la risoluzione 1244 (1999) dell'UNSC e con il parere della CIG sulla dichiarazione
    di indipendenza del Kosovo. )
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/1467 (2017. gada 11. augusts),
    ar ko Regulu (ES) Nr. 1255/2010 groza attiecībā uz importa tarifa kvotu baby
    beef produktiem, kuru izcelsme ir Kosovā (Šis nosaukums neskar nostājas par
    statusu un atbilst ANO DP Rezolūcijai 1244 (1999) un Starptautiskās Tiesas atzinumam
    par Kosovas neatkarības deklarāciju. )
  type: main
- language: lt
  script: Latn
  content: 2017 m. rugpjūčio 11 d. Komisijos įgyvendinimo reglamentas (ES) 2017/1467,
    kuriuo iš dalies keičiamos Reglamento (ES) Nr. 1255/2010 nuostatos dėl jaučių
    jauniklių mėsos produktų, kurių kilmės šalis – Kosovas (Šis pavadinimas
    nekeičia pozicijų dėl statuso ir atitinka JT ST rezoliuciją 1244/1999 bei
    Tarptautinio Teisingumo Teismo nuomonę dėl Kosovo nepriklausomybės deklaracijos.
    ), importo tarifinių kvotų
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/1467 tal-11 ta'
    Awwissu 2017 li jemenda r-Regolament (UE) Nru 1255/2010 fir-rigward tal-kwota
    tariffarja tal-importazzjoni għall-prodotti tal-“baby beef” li joriġinaw
    fil-Kosovo (Din id-deżinjazzjoni hija mingħajr preġudizzju għall-pożizzjonijiet
    dwar l-istatus, u hija konformi mal-UNSCR 1244/1999 u mal-Opinjoni tal-QIĠ dwar
    id-dikjarazzjoni tal-indipendenza tal-Kosovo. )
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2017/1467 van de Commissie van 11 augustus
    2017 tot wijziging van Verordening (EU) nr. 1255/2010 wat betreft het tariefcontingent
    voor de invoer van „baby beef”-producten van oorsprong uit Kosovo (Deze benaming
    laat de standpunten over de status van Kosovo onverlet en is in overeenstemming
    met Resolutie 1244/1999 van de VN-Veiligheidsraad en het advies van het Internationaal
    Gerechtshof over de onafhankelijkheidsverklaring van Kosovo. )
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2017/1467 z dnia 11 sierpnia 2017
    r. zmieniające rozporządzenie (UE) nr 1255/2010 w odniesieniu do kontyngentów
    taryfowych na produkty z młodej wołowiny pochodzącej z Kosowa (Użycie tej
    nazwy nie wpływa na stanowiska w sprawie statusu Kosowa i jest zgodne z rezolucją
    Rady Bezpieczeństwa ONZ 1244/1999 oraz z opinią Międzynarodowego Trybunału
    Sprawiedliwości w sprawie Deklaracji niepodległości Kosowa. )
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2017/1467 da Comissão, de 11 de agosto
    de 2017, que altera o Regulamento (UE) n.° 1255/2010 no respeitante ao contingente
    pautal de importação dos produtos de «baby beef» originários do Kosovo (Esta
    designação não prejudica as posições relativas ao estatuto, e está conforme
    com a RCSNU 1244/1999 e o parecer do TIJ sobre a declaração de independência
    do Kosovo. )
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2017/1467 al Comisiei din 11 august
    2017 de modificare a Regulamentului (UE) nr. 1255/2010 în ceea ce privește contingentele
    tarifare de import pentru produsele din categoria „baby beef” originare din
    Kosovo (Această denumire nu aduce atingere pozițiilor privind statutul și este
    conformă cu RCSONU 1244/1999, precum și cu Avizul CIJ privind Declarația de
    independență a Kosovo. )
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2017/1467 z 11. augusta 2017, ktorým
    sa mení nariadenie (EÚ) č. 1255/2010, pokiaľ ide o dovoznú colnú kvótu
    na výrobky z mäsa z mladého hovädzieho dobytka („baby beef“) s pôvodom
    v Kosove (Týmto označením nie sú dotknuté pozície k štatútu a označenie
    je v súlade s rezolúciou BR OSN č. 1244/1999 a so stanoviskom Medzinárodného
    súdneho dvora k vyhláseniu nezávislosti Kosova. )
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2017/1467 z dne 11. avgusta 2017 o spremembi
    Uredbe (EU) št. 1255/2010 glede uvozne tarifne kvote za proizvode „baby beef“
    s poreklom s Kosova (To poimenovanje ne posega v stališča glede statusa ter
    je v skladu z RVSZN 1244/1999 in mnenjem Meddržavnega sodišča o razglasitvi
    neodvisnosti Kosova. )
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2017/1467 de la Comisión, de 11 de agosto
    de 2017, que modifica el Reglamento (UE) n.° 1255/2010 en lo que atañe al contingente
    arancelario de importación de los productos de «baby beef» originarios de Kosovo
    (Esta denominación se entiende sin perjuicio de las posiciones sobre su estatuto
    y está en consonancia con la Resolución 1244 (1999) del Consejo de Seguridad
    de las Naciones Unidas y con el Dictamen de la Corte Internacional de Justicia
    sobre la declaración de independencia de Kosovo. )
  type: main
- language: sv
  script: Latn
