    2017 om ändring av förordning (EU) nr 1255/2010 vad gäller importtullkvoter
    för ”baby beef”-produkter med ursprung i Kosovo (Denna beteckning påverkar
    inte ståndpunkter om Kosovos status och är i överensstämmelse med FN:s säkerhetsråds
    resolution 1244/1999 och med Internationella domstolens utlåtande om Kosovos
