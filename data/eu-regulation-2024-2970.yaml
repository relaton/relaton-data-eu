    2024 modifiant le règlement d’exécution (UE) 2019/2072 en ce qui concerne
    les mesures visant à prévenir la présence du Tomato brown rugose fruit virus
    sur les végétaux destinés à la plantation de Solanum lycopersicum L., de ses
    hybrides et de Capsicum annuum L., et établissant les taux de fréquence des
    contrôles officiels
  type: main
- language: de
  script: Latn
