  content: Commission Implementing Regulation (EU) 2024/2970 of 29 November 2024 amending
    Implementing Regulation (EU) 2019/2072 as regards measures to prevent the presence
    of the Tomato brown rugose fruit virus on plants for planting of Solanum lycopersicum
    L. and hybrids thereof and of Capsicum annuum L., and establishing the frequency
    rates of official controls
  type: main
- language: fr
  script: Latn
