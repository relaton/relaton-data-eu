id: EURegulation30711990
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3071/90 of 22 October 1990 again amending articles
    6 and 17 of the Protocol concerning the concept of 'originating products' and
    methods of administrative cooperation to the cooperation Agreement between the
    European economic community and the Lebanese republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3071/90 du Conseil, du 22 octobre 1990, modifiant
    une nouvelle fois les articles 6 et 17 du protocole relatif à la définition
    de la notion de "produits originaires" et aux méthodes de coopération administrative
    de l'accord de coopération entre la Communauté économique européenne et la
    République libanaise
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3071/90 des Rates vom 22. Oktober 1990 zur erneuten
    Änderung der Artikel 6 und 17 des Protokolls über die Bestimmung des Begriffs
    "Erzeugnisse mit Ursprung in" oder "ursprungserzeugnisse" und über die Methoden
    der Zusammenarbeit der Verwaltungen zum kooperationsabkommen zwischen der europäischen
    Wirtschaftsgemeinschaft und der libanesischen Republik
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EHS) č. 3071/90 ze dne 22. října, kterým se znovu
    mění články 6 a 17 protokolu o definici pojmu původní produkty a metodách
    správní spolupráce k Dohodě o spolupráci mezi Evropským hospodářským
    společenstvím a Libanonskou republikou
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3071/90 af 22. oktober 1990 om en ny ændring
    af artikel 6 og 17 i protokollen vedrørende definitionen af begrebet "varer med
    oprindelsesstatus" og vedrørende metoderne for administrativt samarbejde til
    samarbejdsaftalen mellem det europæiske økonomiske Fællesskab og republikken
    Libanon
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3071/90 του Συμβουλίου
    της 22ας Οκτωβρίου 1990 περί νέας τροποποίησης
    των άρθρων 6 και 17 του πρωτοκόλλου σχετικά με
    τον ορισμό της έννοιας «καταγόμενα προϊόντα»
    ή «προϊόντα καταγωγής» και με τις μεθόδους
    διοικητικής συνεργασίας της συμφωνίας συνεργασίας
    μεταξύ της Ευρωπαϊκής Οικονομικής Κοινότητας
    και της Δημοκρατίας του Λιβάνου
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EMÜ) nr 3071/90, 22. oktoober 1990, millega uuesti
    muudetakse Euroopa Majandusühenduse ja Liibanoni Vabariigi vahelise koostöölepingu
    mõiste päritolustaatusega tooted määratlust ja halduskoostöö meetodeid käsitleva
    protokolli artikleid 6 ja 17
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3071/90, annettu 22 päivänä lokakuuta 1990,
    Euroopan talousyhteisön ja Libanonin tasavallan yhteistyösopimuksen käsitteen
    alkuperätuotteet määritelmää ja hallinnollisen yhteistyön menetelmiä koskevan
    pöytäkirjan 6 ja 17 artiklan muuttamisesta uudelleen
  type: main
- language: hu
  script: Latn
  content: A Tanács 3071/90/EGK rendelete (1990. október 22.) az Európai Gazdasági
    Közösség és a Libanoni Köztársaság között létrejött együttműködési
    megállapodáshoz csatolt, a származó termék fogalmának meghatározásáról
    és az igazgatási együttműködés módszereiről szóló jegyzőkönyv 6. és
    17. cikkének ismételt módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3071/90 del Consiglio, del 22 ottobre 1990, che modifica
    di nuovo gli articoli 6 e 17 del protocollo relativo alla definizione della nozione
    di " prodotti originari " ed ai metodi di cooperazione amministrativa dell'accordo
    di cooperazione tra la Comunità economica europea e la repubblica Libanese
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EEK) Nr. 3071/90 (1990. gada 22. oktobris), ar ko atkārtoti
    groza 6. un 17. pantu Eiropas Ekonomikas kopienas un Libānas Republikas Sadarbības
    nolīguma Protokolā par noteiktas izcelsmes izstrādājumu jēdziena definīciju
    un administratīvās sadarbības metodēm
  type: main
- language: lt
  script: Latn
  content: 1990 m. spalio 22 d. Tarybos reglamentas (EEB) Nr. 3071/90 vėl iš dalies
    keičiantis Bendradarbiavimo susitarimo tarp Europos ekonominės bendrijos ir
    Libano Respublikos protokolo dėl sąvokos kilmės produktai apibrėžimo ir administracinio
    bendradarbiavimo metodų 6 ir 17 straipsnius
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KEE) Nru 3071/90 tat-22 ta' Ottubru 1990 li
    jerġa’ jemenda Artikoli 6 u 17 tal-Protokoll li jirrigwarda l-kunċett ta'
    prodotti li joriġinaw u l-metodi tal-kooperazzjoni amministrattiva għall-Ftehim
    ta' Koperazzjoni bejn il-Komunità Ekonomika Ewropea u r-Repubblika Lebaniża
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3071/90 van de raad van 22 oktober 1990 tot hernieuwde
    wijziging van de artikelen 6 en 17 van het protocol betreffende de definitie van
    het begrip "produkten van oorsprong" en de methoden van administratieve samenwerking
    bij de samenwerkingsovereenkomst tussen de Europese economische gemeenschap en
    de Libanese republiek
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (EWG) nr 3071/90 z dnia 22 października 1990 r. zmieniające
    ponownie art. 6 i 17 Protokołu dotyczącego definicji pojęcia produkty pochodzące
    oraz metod współpracy administracyjnej do umowy o współpracy między Europejską
    Wspólnotą Gospodarczą a Republiką Libańską
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3071/90 do conselho, de 22 de outubro de 1990, que
    altera novamente os artigos 6 e 17 do protocolo relativo a definição da nocao
    de "produtos originários" e aos métodos de cooperação administrativa ao acordo
    de cooperação entre a comunidade económica europeia e a republica do Líbano
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EHS) č. 3071/90 z 22. októbra 1990, ktorou sa znova
    menia a dopĺňajú články 6 a 17 Protokolu týkajúceho sa pojmu pôvodné
    výrobky a metód administratívnej spolupráce k Dohode o spolupráci medzi Európskym
    hospodárskym spoločenstvom a Libanonskou republikou
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EGS) št. 3071/90 z dne 22. oktobra 1990 o ponovni spremembi
    členov 6 in 17 Protokola glede pojma izdelki s poreklom in načinih upravnega
    sodelovanja k Sporazumu o sodelovanju med Evropsko gospodarsko skupnostjo in Libanonsko
    republiko
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3071/90 del consejo, de 22 de octubre de 1990, por
    el que se modifican de nuevo los artículos 6 y 17 del protocolo relativo a la
    definición de "productos originarios" y a los métodos de cooperación administrativa
    del acuerdo de cooperación entre la comunidad económica europea y la república
    libanesa
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 3071/90 av den 22 oktober 1990 om ytterligare
    ändring av artiklarna 6 och 17 i protokollet om definitionen av begreppet "ursprungsvaror"
    och om metoder för administrativt samarbete till samarbetsavtalet mellan Europeiska
    ekonomiska gemenskapen och Libanon
  type: main
