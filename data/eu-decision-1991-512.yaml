title:
- language: en
  script: Latn
  content: '91/512/EEC: Commission Decision of 25 July 1991 accepting undertakings
    given in connection with the review of anti-dumping measures concerning imports
    of artificial corundum originating in the Soviet Union, Hungary, Poland, Czechoslovakia
    and the People''s Republic of China and in connection with the anti- dumping proceeding
    concerning imports of artificial corundum originating in Brazil and Yugoslavia,
    and terminating the investigation )'
  type: main
- language: fr
  script: Latn
  content: '91/512/CEE: Décision de la Commission du 25 juillet 1991 portant acceptation
    d''engagements dans le cadre du réexamen de mesures antidumping concernant les
    importations de corindon artificiel originaires de l''Union soviétique, de la
    Hongrie, de la Pologne, de la Tchécoslovaquie et de la République populaire
    de Chine et dans le cadre de la procédure antidumping concernant les importations
    de corindon artificiel originaires du Brésil et de la Yougoslavie et portant
    clôture de l''enquête'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 25. Juli 1991 über die Annahme von Verpflichtungen
    im Rahmen der Überprüfung der Antidumpingmaßnahmen betreffend die Einfuhren
    von künstlichem Korund mit Ursprung in der Sowjetunion, Ungarn, Polen, der Tschechoslowakei
    und der Volksrepublik China und im Rahmen des Antidumpingverfahrens betreffend
    die Einfuhren von künstlichem Korund mit Ursprung in Brasilien und Jugoslawien
    sowie über die Einstellung des Verfahrens (91/512/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 25. juli 1991 om godtagelse af tilsagn afgivet
    i forbindelse med den fornyede undersøgelse af antidumpingforanstaltningerne
    vedrørende importen af kunstig korund med oprindelse i Den Kinesiske Folkerepublik,
    Polen, Sovjetunionen, Tjekkoslovakiet og Ungarn og i forbindelse med antidumpingproceduren
    vedrørende importen af kunstig korund med oprindelse i Brasilien og Jugoslavien
    og om afslutning af undersøgelsen (91/512/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/512/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Ιουλίου 1991 για την αποδοχή των αναλήψεων υποχρεώσεων
    όσον αφορά την επανεξέταση των μέτρων αντιντάμπινγκ
    σχετικά με τις εισαγωγές τεχνητού κορούνδιου
    καταγωγής Σοβιετικής Ένωσης, Ουγγαρίας, Πολωνίας,
    Τσεχοσλαβακίας και Λαϊκής Δημοκρατίας της
    Κίνας, καθώς και για την περάτωση της έρευνας
