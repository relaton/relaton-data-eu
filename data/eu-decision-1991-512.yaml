    με τις εισαγωγές τεχνητού κορούνδιου καταγωγής
    Βραζιλίας και Γιουγκοσλαβίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 25 luglio 1991 recante accettazione degli
    impegni assunti nell'' ambito del riesame di misure antidumping relative alle
    importazioni di corindone artificiale originario dell'' URSS, dell'' Ungheria,
    della Polonia, della Cecoslovacchia e della Repubblica popolare cinese e nell''
    ambito della procedura antidumping relativa alle importazioni di corindone artificiale
    originario del Brasile e della Iugoslavia e recante chiusura dell'' inchiesta
    (91/512/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 25 juli 1991 tot aanvaarding van verbintenissen
