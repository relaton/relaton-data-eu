title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1096/79 of 1 June 1979 re-establishing the
    levying of customs duties on terry towelling and similar terry fabrics of cotton,
    falling within heading No 55.08 and originating in developing countries, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3157/78
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1096/79 de la Commission, du 1er juin 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    coton bouclés du genre éponge, de la position 55.08 du tarif douanier commun,
    originaires des pays et territoires en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1096/79 der Kommission vom 1. Juni 1979 zur Wiedereinführung
    des Zollsatzes für Schlingengewebe (Frottiergewebe) aus Baumwolle der Tarifnummer
    55.08 mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1096/79 af 1. juni 1979 om genindførelse
    af opkrævning af toldafgifter for håndklædefrotterstof og lignende frotterstof
    af bomuld, henhørende under pos. 55.08 i den fælles toldtarif, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1096/79 della Commissione, del 1° giugno 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di cotone ricci
    del tipo spugna, della voce doganale 55.08, originari dei paesi in via di sviluppo,
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3157/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1096/79 van de Commissie van 1 juni 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bad- of
    frotteerstof (lussendoek) van katoen, van post 55.08, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 3157/78 van de Raad tariefpreferenties
    werden geopend
  type: main
