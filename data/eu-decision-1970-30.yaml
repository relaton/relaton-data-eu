title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1969, portant dérogation à
    la recommandation n° 2-64 de la Haute Autorité relative à l'introduction d'une
    protection spécifique frappant les importations de fonte de moulage, trente huitième
    dérogation
  type: main
- language: de
  script: Latn
  content: '70/30/EGKS: Entscheidung der Kommission vom 22. Dezember 1969 betreffend
    Ausnahmen von der Empfehlung Nr. 2/64 der Hohen Behörde über die Einführung
    eines spezifischen Außenschutzes gegenüber Einfuhren von Gießereiroheisen (Achtunddreißigste
    Ausnahmeentscheidung)'
  type: main
- language: it
  script: Latn
  content: '70/30/CECA: Decisione della Commissione, del 22 dicembre 1969, che autorizza
    deroghe alla raccomandazione n. 2-64 dell''Alta Autorità relativa all''instaurazione
    di una protezione speciale che colpisce le importazioni di ghise da fonderia (trentottesima
    deroga)'
  type: main
- language: nl
  script: Latn
  content: '70/30/EGKS: Beschikking van de Commissie van 22 december 1969 houdende
    afwijking van Aanbeveling nr. 2-64 van de Hoge Autoriteit betreffende de invoering
    van een specifieke bescherming bij de invoer van ruw gietijzer (Achtendertigste
    uitzonderingsbeschikking)'
