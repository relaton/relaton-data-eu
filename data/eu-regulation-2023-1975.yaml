  script: Latn
  content: Commission Delegated Regulation (EU) 2023/1975 of 10 August 2023 on temporary
    emergency measures derogating in respect of the year 2023 from certain provisions
    of Commission Delegated Regulation (EU) 2022/126 supplementing Regulation (EU)
    2021/2115 of the European Parliament and of the Council, to resolve specific problems
    in the fruit and vegetables sector caused by adverse meteorological events and
    measures linked to them
  type: main
- language: fr
  script: Latn
