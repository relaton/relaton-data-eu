    à certaines dispositions du règlement délégué (UE) 2022/126 de la Commission
    complétant le règlement (UE) 2021/2115 du Parlement européen et du Conseil,
    en vue de résoudre des problèmes spécifiques dans le secteur des fruits et
    légumes, dus à des événements météorologiques défavorables et à des mesures
    connexes
  type: main
- language: de
  script: Latn
