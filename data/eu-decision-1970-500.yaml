title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 octobre 1970, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les préparations
    et conserves de pommes sans addition d'alcool ni de sucre, de la position Ex 20.06
    du Tarif douanier commun, originaires de la République populaire de Chine et
    mises en libre pratique au Benelux
  type: main
- language: de
  script: Latn
  content: '70/500/EWG: Entscheidung der Kommission vom 30. Oktober 1970, mit der
    die Bundesrepublik Deutschland ermächtigt wird, die aus der Volksrepublik China
    stammenden und in den Beneluxländern im freien Verkehr befindlichen Zubereitungen
    und Konserven von Äpfeln ohne Zusatz von Alkohol und Zucker der Tarifnummer ex
    20.06 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/500/CEE: Decisione della Commissione, del 30 ottobre 1970, che autorizza
    la Repubblica federale tedesca ad escludere dal trattamento comunitario le preparazioni
    e conserve di mele, senza aggiunta di alcole e di zuccheri, della voce ex 20.06
    della tariffa doganale comune, originarie della Repubblica popolare cinese e messe
    in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '70/500/EEG: Beschikking van de Commissie van 30 oktober 1970 waarbij de
    Bondsrepubliek Duitsland wordt gemachtigd bereidingen en conserven van appelen
    zonder toegevoegde alcohol en suiker, van post ex 20.06 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in de Benelux-landen
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
