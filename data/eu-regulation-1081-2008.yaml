    pagalbos teikimo taisykles eksportuojant minkštuosius nokintus karvės pieno
    sūrius, kuriems gali būti taikomas specialus importo į valstybę, kuri nėra
    narė, režimas, ir Reglamentas (EEB) Nr. 1552/80, nustatantis išsamias administracinės
    pagalbos teikimo taisykles eksportuojant tam tikrus sūrius, kuriems gali būti
    taikomas specialusis importo į Australiją režimas
