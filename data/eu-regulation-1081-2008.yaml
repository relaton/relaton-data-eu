    előállított, puhára érlelt sajtok kivitelével kapcsolatos közigazgatási
    segítségre vonatkozó rendelkezés részletes szabályainak megállapításáról
    szóló 2968/79/EGK rendelet és az Ausztráliába importált, különleges elbánásra
    jogosult egyes sajtok kivitelével kapcsolatos közigazgatási segítségre vonatkozó
