- language: en
  script: Latn
  content: Commission Regulation (EC) No 1081/2008 of 4 November 2008 repealing Regulation
    (EEC) No 2968/79 laying down detailed rules for the provision of administrative
    assistance in connection with the export of soft ripened cow’s milk cheeses
    eligible for special treatment on import into a non-member country and Regulation
    (EEC) No 1552/80 laying down detailed rules for the provision of administrative
    assistance in connection with the export of certain cheeses eligible for special
    treatment on import into Australia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1081/2008 de la Commission du 4 novembre 2008 abrogeant
    le règlement (CEE) n o 2968/79 portant modalités d’application de l’assistance
    administrative à l’exportation des fromages à pâte molle affinés provenant
    de lait de vache pouvant bénéficier d’un traitement spécial à l’importation
    dans un pays tiers et le règlement (CEE) n o 1552/80 portant modalités d’application
    de l’assistance administrative à l’exportation de certains fromages pouvant
    bénéficier d’un traitement spécial à l’importation en Australie
  type: main
