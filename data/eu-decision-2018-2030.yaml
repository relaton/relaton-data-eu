title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/2030 of 19 December 2018 determining,
    for a limited period of time, that the regulatory framework applicable to central
    securities depositories of the United Kingdom of Great Britain and Northern Ireland
    is equivalent in accordance with Regulation (EU) No 909/2014 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
