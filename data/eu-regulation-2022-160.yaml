    controles oficiales para comprobar el cumplimiento de los requisitos zoosanitarios
    de la Unión de conformidad con el Reglamento (UE) 2017/625 del Parlamento Europeo
    y del Consejo y se derogan los Reglamentos (CE) n.o 1082/2003 y (CE) n.o 1505/2006
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/160 av den 4 februari
    2022 om fastställande av enhetliga minimifrekvenser för viss offentlig kontroll
    för att verifiera efterlevnaden av unionens djurhälsokrav i enlighet med Europaparlamentets
