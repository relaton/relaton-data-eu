  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/160, annettu 4 päivänä
    helmikuuta 2022, tietyn virallisen valvonnan yhdenmukaisesta vähimmäistiheydestä
