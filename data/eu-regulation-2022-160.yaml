    w celu weryfikacji zgodności z wymaganiami Unii w zakresie zdrowia zwierząt
    zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2017/625 oraz
    uchylające rozporządzenia (WE) nr 1082/2003 i (WE) nr 1505/2006
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/160 da Comissão de 4 de fevereiro
