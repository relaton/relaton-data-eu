    for at verificere overholdelsen af Unionens dyresundhedskrav i overensstemmelse
    med Europa-Parlamentets og Rådets forordning (EU) 2017/625 og om ophævelse af
    forordning (EF) nr. 1082/2003 og (EF) nr. 1505/2006
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/160 της Επιτροπής
