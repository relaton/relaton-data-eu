  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/160 оd 4. veljače 2022. o utvrđivanju
    ujednačene minimalne učestalosti određenih službenih kontrola za verifikaciju
    usklađenosti sa zahtjevima Unije u pogledu zdravlja životinja u skladu s Uredbom
    (EU) 2017/625 Europskog parlamenta i Vijeća te o stavljanju izvan snage uredbi
    (EZ) br. 1082/2003 i (EZ) br. 1505/2006
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/160 végrehajtási rendelete (2022. február 4.)
    az uniós állategészségügyi követelményeknek való megfelelés vizsgálatára
    szolgáló egyes hatósági ellenőrzések egységes minimális gyakoriságának
    az (EU) 2017/625 európai parlamenti és tanácsi rendelettel összhangban történő
    meghatározásáról, valamint az 1082/2003/EK és az 1505/2006/EK rendelet hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/160 della Commissione del 4 febbraio
    2022 che stabilisce frequenze minime uniformi di determinati controlli ufficiali
    intesi a verificare la conformità alle prescrizioni dell’Unione in materia
    di salute animale conformemente al regolamento (UE) 2017/625 del Parlamento europeo
    e del Consiglio e che abroga i regolamenti (CE) n. 1082/2003 e (CE) n. 1505/2006
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/160 (2022. gada 4. februāris),
    ar ko noteic vienotu minimālo biežumu noteiktām oficiālām kontrolēm, kurās
    saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) 2017/625 verificē atbilstību
    Savienības dzīvnieku veselības prasībām, un atceļ Regulas (EK) Nr. 1082/2003
    un (EK) Nr. 1505/2006
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/160 2022 m. vasario 4 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) 2017/625 nustatomas
    vienodas minimalus tam tikros oficialios kontrolės, kuria siekiama patikrinti,
    ar laikomasi Sąjungos gyvūnų sveikatos reikalavimų, dažnumas ir panaikinami
    reglamentai (EB) Nr. 1082/2003 ir (EB) Nr. 1505/2006
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/160 tal-4 ta’
