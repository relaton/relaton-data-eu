    em conformidade com o Regulamento (UE) 2017/625 do Parlamento Europeu e do Conselho
    e que revoga os Regulamentos (CE) n.o 1082/2003 e (CE) n.o 1505/2006
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/160 al Comisiei din 4 februarie
    2022 de stabilire a frecvențelor minime uniforme ale anumitor controale oficiale
    în vederea verificării conformității cu cerințele de sănătate animală
    ale Uniunii, în conformitate cu Regulamentul (UE) 2017/625 al Parlamentului European
    și al Consiliului și de abrogare a Regulamentelor (CE) nr. 1082/2003 și (CE)
    nr. 1505/2006
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/160 zo 4. februára 2022, ktorým
    sa stanovuje jednotná minimálna frekvencia určitých úradných kontrol na
    overenie dodržiavania požiadaviek Únie na zdravie zvierat v súlade s nariadením
    Európskeho parlamentu a Rady (EÚ) 2017/625 a ktorým sa zrušujú nariadenia
    (ES) č. 1082/2003 a (ES) č. 1505/2006
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/160 z dne 4. februarja 2022 o določitvi
    enotne najmanjše pogostosti nekaterih vrst uradnega nadzora za preverjanje skladnosti
    z zahtevami Unije v zvezi z zdravjem živali v skladu z Uredbo (EU) 2017/625 Evropskega
    parlamenta in Sveta ter o razveljavitvi uredb (ES) št. 1082/2003 in (ES) št.
    1505/2006
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/160 de la Comisión de 4 de febrero
