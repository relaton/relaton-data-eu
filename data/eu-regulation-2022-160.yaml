    biex tiġi vverifikata l-konformità mar-rekwiżiti tal-Unjoni dwar is-saħħa
    tal-annimali f’konformità mar-Regolament (UE) 2017/625 tal-Parlament Ewropew
    u tal-Kunsill u li jħassar ir-Regolamenti (KE) Nru 1082/2003 u (KE) Nru 1505/2006
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/160 van de Commissie van 4 februari 2022
    tot vaststelling van eenvormige minimumfrequenties van bepaalde officiële controles
    ter verifiëring van de naleving van diergezondheidsvoorschriften van de Unie
    overeenkomstig Verordening (EU) 2017/625 van het Europees Parlement en de Raad
    en tot intrekking van de Verordeningen (EG) nr. 1082/2003 en (EG) nr. 1505/2006
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/160 z dnia 4 lutego 2022 r.
