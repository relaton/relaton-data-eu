title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/160 of 4 February 2022 laying
    down uniform minimum frequencies of certain official controls to verify compliance
    with Union animal health requirements in accordance with Regulation (EU) 2017/625
    of the European Parliament and of the Council and repealing Regulations (EC) No
    1082/2003 and (EC) No 1505/2006
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/160 de la Commission du 4 février
    2022 établissant des fréquences minimales uniformes pour la réalisation de
    certains contrôles officiels portant sur le respect des exigences de l’Union
    en matière de santé animale conformément au règlement (UE) 2017/625 du Parlement
    européen et du Conseil et abrogeant les règlements (CE) no 1082/2003 et (CE)
    no 1505/2006
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/160 der Kommission vom 4. Februar 2022
    zur Festlegung einheitlicher Mindesthäufigkeiten bestimmter amtlicher Kontrollen
    zur Überprüfung der Einhaltung der Tiergesundheitsanforderungen der Union gemäß
    der Verordnung (EU) 2017/625 des Europäischen Parlaments und des Rates und zur
    Aufhebung der Verordnungen (EG) Nr. 1082/2003 und (EG) Nr. 1505/2006
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/160 на Комисията
    от 4 февруари 2022 година за определяне на еднаква
    минимална честота на някои видове официален
    контрол, извършван с цел проверка на съответствието
    с ветеринарно-здравните изисквания на Съюза
    съгласно Регламент (ЕС) 2017/625 на Европейския
    парламент и на Съвета, и за отмяна на регламенти
    (ЕО) № 1082/2003 и (ЕО) № 1505/2006
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/160 ze dne 4. února 2022, kterým
    se stanoví jednotná minimální četnost některých úředních kontrol za
    účelem ověření souladu s požadavky Unie týkajícími se zdraví zvířat
    podle nařízení Evropského parlamentu a Rady (EU) 2017/625 a kterým se zrušují
    nařízení (ES) č. 1082/2003 a (ES) č. 1505/2006
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/160 af 4. februar 2022
