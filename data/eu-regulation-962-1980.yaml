title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 962/80 of 18 April 1980 re-establishing
    the levying of customs duties in transmission belts, products of category 108
    (code 1080), originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 962/80 de la Commission, du 18 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux courroies
    transporteuses, de la catégorie 108 (code 1080), originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 962/80 der Kommission vom 18. April 1980 über die
    Wiedereinführung des Zollsatzes für Förderbänder der Warenkategorie Nr. 108
    (Kennziffer 1080), mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG)
    Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 962/80 af 18. april 1980 om genindførelse
    af toldafgifter for driv- og transportremme af tekstil, under varekategori 108
    (kode 1080), som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 962/80 della Commissione, del 18 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai nastri trasportatori
    della categoria di prodotti n. 108 (codice 1080), originari della Iugoslavia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 962/80 van de Commissie van 18 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op drijfriemen,
    van de categorie van produkten nr. 108 (codenummer 1080), van oorsprong uit Joegoslavië
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
