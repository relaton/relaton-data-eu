title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 336/94 of 15 February 1994 fixing the number
    of young male bovine animals which may be imported on special terms in the first
    quarter of 1994 and derogating from Regulation (EEC) No 2377/80 in respect of
    that quarter as regards the allocation of the quantities available
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 336/94 de la Commission du 15 février 1994 relatif
    à la fixation de la quantité de jeunes bovins mâles pouvant être importés
    à des conditions spéciales pour le premier trimestre de 1994 et portant dérogation,
    pour ce trimestre, au règlement (CEE) n° 2377/80
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 336/94 DER KOMMISSION vom 15. Februar 1994 zur Festsetzung
    der Anzahl männlicher Jungrinder, die im ersten Vierteljahr 1994 unter Sonderbedingungen
    eingeführt werden können, und zur Abweichung von der Verordnung (EWG) Nr. 2377/80
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 336/94 af 15. februar 1994 om fastsættelse
    af den mængde ungtyre, der kan indføres på særlige betingelser i første kvartal
    af 1994, og om undtagelse for første kvartal fra forordning (EØF) nr. 2377/80
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 336/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 15ης Φεβρουαρίου 1994 για τον καθορισμό των
    ποσοτήτων των νεαρών αρρένων βοοειδών που
    είναι δυνατόν να εισαχθούν με ειδικούς όρους
    κατά το πρώτο τρίμηνο του 1994 και για παρέκκλιση,
    κατά το τρίμηνο αυτό, από τον κανονισμό (ΕΟΚ)
    αριθ. 2377/80 όσον αφορά την απόδοση των διαθέσιμων
    ποσοτήτων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 336/94 DELLA COMMISSIONE del 15 febbraio 1994 che fissa
    il numero di giovani bovini maschi che possono essere importati a condizioni speciali
    nel primo trimestre del 1994 e reca deroga, per tale trimestre, al regolamento
    (CEE) n. 2377/80
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 336/94 VAN DE COMMISSIE van 15 februari 1994 tot vaststelling
    van het aantal jonge mannelijke runderen dat in het eerste kwartaal van 1994 onder
    bijzondere voorwaarden mag worden ingevoerd, en houdende afwijking, voor dat kwartaal,
    van Verordening (EEG) nr. 2377/80
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 336/94 DA COMISSÃO de 15 de Fevereiro de 1994 que
    fixa a quantidade de vitelos machos que podem ser importados em condições especiais
    durante o primeiro trimestre de 1994 e prevê uma derrogação, no que diz respeito
    ao referido trimestre, ao Regulamento (CEE) nº 2377/80
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 336/94 DE LA COMISIÓN de 15 de febrero de 1994 por
    el que se fija la cantidad de machos jóvenes de la especie bovina que podrán
    importarse en condiciones especiales durante el primer trimestre de 1994 y por
    el que se establece una excepción, para este trimestre, al Reglamento (CEE) nº
    2377/80 en lo relativo a la atribución de las cantidades disponibles
  type: main
