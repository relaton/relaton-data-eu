title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3033/78 of 21 December 1978 re-establishing
    the levying of customs duties on melamine, falling within subheading 29.35 ex
    Q and originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3033/78 de la Commission, du 21 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position tarifaire 29.35 ex Q, originaire de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3033/78 der Kommission vom 21. Dezember 1978 zur Wiedereinführung
    des Zollsatzes für Melamin der Tarifstelle 29.35 ex Q mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3033/78 af 21. december 1978 om genindførelse
    af opkrævning af toldafgifter for melamin, under underposition 29.35 ex Q, som
    har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3033/78 della Commissione, del 21 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alla melammina della sottovoce
    doganale 29.35 ex Q, originaria della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3033/78 van de Commissie van 21 december 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op melamine,
    van post 29.35 ex Q, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
