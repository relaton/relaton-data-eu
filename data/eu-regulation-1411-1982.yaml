    εμπορίας 1982/83, τών παραγώγων τιμών παρεμβάσεως
    λευκής ζάχαρης, τής τιμής παρεμβάσεως ακατέργαστης
    ζάχαρης, τών ελαχίστων τιμών τεύτλων Α καί
