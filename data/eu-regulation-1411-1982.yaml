  content: Council Regulation (EEC) No 1411/82 of 18 May 1982 fixing for the 1982/83
    marketing year the derived intervention prices for white sugar, the intervention
    price for raw sugar, the minimum prices for A and B beet, the threshold prices
    and the amount of compensation for storage costs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1411/82 du Conseil, du 18 mai 1982, fixant, pour la
    campagne de commercialisation 1982/1983, les prix d' intervention dérivés du
    sucre blanc, le prix d' intervention du sucre brut, les prix minimaux de la betterave
    A et de la betterave B, les prix de seuil ainsi que le montant du remboursement
    pour la péréquation des frais de stockage
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1411/82 des Rates vom 18. Mai 1982 zur Festsetzung
    der abgeleiteten Interventionspreise für Weißzucker, des Interventionspreises
    für Rohzucker, der Mindestpreise für A- und B-Zuckerrüben, der Schwellenpreise
    sowie der Vergütung zum Ausgleich der Lagerkosten für das Wirtschaftsjahr 1982/83
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1411/82 af 18. maj 1982 om fastsættelse
    for produktionsåret 1982/83 af de afledte interventionspriser for hvidt sukker,
    interventionsprisen for råsukker, minimumspriserne for A-sukkerroer og B-sukkerroer,
    tærskelpriserne samt refusionsbeløbet til udligning af lageromkostninger
  type: main
