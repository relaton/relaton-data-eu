title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1126/94 of 16 May 1994 laying down rates
    of compensatory interest applicable during the second half of 1994 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1126/94 de la Commission du 16 mai 1994 fixant les
    taux d'intérêts compensatoires applicables en cas de naissance d'une dette douanière
    relative aux produits compensateurs ou aux marchandises en l'état (régime du
    perfectionnement actif et de l'admission temporaire) pendant le deuxième semestre
    de 1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1126/94 DER KOMMISSION vom 16. Mai 1994 mit Sätzen
    von Ausgleichszinsen, die im zweiten Halbjahr 1994 bei Entstehung einer Zollschuld
    für Veredelungserzeugnisse oder unveredelte Waren (aktiver Veredelungsverkehr
    und vorübergehende Verwendung) anzuwenden sind
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1126/94 af 16. maj 1994 om fastsættelse
    af udligningsrester, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukterne eller uforædlede varer (aktiv forædling og midlertidig
    indførsel) i andet halvår af 1994
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1126/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 16ης Μαΐου 1994 για τον καθορισμό αντισταθμιστικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή τα αρχικά εμπορεύματα (καθεστώς
    τελειοποίησης προς επανεξαγωγή και προσωρινής
    εισαγωγής) κατά τη διάρκεια του δεύτερου εξαμήνου
    1994
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1126/94 DELLA COMMISSIONE del 16 maggio 1994 che determina
    i tassi di interesse compensatori applicabili ove sorga un' obbligazione doganale
    relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo e ammissione temporanea) nel secondo semestre 1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1126/94 VAN DE COMMISSIE van 16 mei 1994 tot vaststelling
    van de jaarlijkse intrestpercentages van toepassing in geval van het ontstaan
    van een douaneschuld voor veredelingsprodukten of onveredelde goederen (regeling
    actieve veredeling en tijdelijke invoer) tijdens het tweede semester 1994
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1126/94 DA COMISSÃO de 16 de Maio de 1994 que fixa
    as taxas de juros de compensação aplicáveis aos casos de constituição de
    uma dívida aduaneira relativa a produtos compensadores ou a mercadorias no seu
    estado inalterado (regime do aperfeiçoamento activo e importação temporária),
    durante o segundo semestre de 1994
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 1126/94 DE LA COMISIÓN de 16 de mayo de 1994 por el
    que se fijan los tipos de interés compensatorio aplicables en caso de nacimiento
    de una deuda aduanera relativa a los productos compensadores o a las mercancías
    sin transformar (régimen de perfeccionamiento activo e importación temporal)
    durante el segundo semestre de 1994
