title:
- language: en
  script: Latn
  content: '81/502/EEC: Commission Decision of 18 May 1981 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to woven and knitted or crocheted dresses originating
    in Hong Kong (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/502/CEE: Décision de la Commission, du 18 mai 1981, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les robes tissées et les robes de bonneterie
    originaires de Hong-Kong (Les textes en langues française et néerlandaise sont
    les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/502/EWG: Entscheidung der Kommission vom 18. Mai 1981 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande, aus Hongkong stammende Kleider aus Geweben und aus Gewirken von der
    Gemeinschaftsbehandlung auszuschließen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/502/EØF: Kommissionens beslutning af 18. maj 1981 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage vævede kjoler og kjoler af trikotage
    med oprindelse i Hongkong (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/502/ΕΟΚ: Απόφαση τής Επιτροπής τής 18ης
    Μαΐου 1981 περί χορηγήσεως αδείας στό Βασίλειο
    τού Βελγίου, στό Μεγάλο Δουκάτο τού Λουξεμβούργου
    καί στό Βασίλειο τών Κάτω Χωρών νά εξαιρέσουν
    από τήν κοινοτική μεταχείριση τά υφασμένα
    φορέματα καί τά πλεκτά φορέματα καταγωγής
    Χόνγκ Κόνγκ (Τα κείμενα στην γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/502/CEE: Decisione della Commissione, del 18 maggio 1981, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario gli abiti interi tessuti ed a maglia
    originari di Hong Kong (Il testi in lingua francese e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '81/502/EEG: Beschikking van de Commissie van 18 mei 1981 houdende machtiging
    van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der
    Nederlanden om japonnen, geweven en van brei- of haakwerk, van oorsprong uit Hong-Kong
    van de communautaire behandeling uit te sluiten (Slechts de teksten in de Franse
    en de Nederlandse taal zijn authentiek)'
