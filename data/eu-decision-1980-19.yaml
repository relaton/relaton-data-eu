title:
- language: en
  script: Latn
  content: '80/19/EEC: Commission Decision of 6 December 1979 authorizing the Italian
    Republic not to apply Community treatment to woven fabrics of cotton, other than
    gauze, terry fabrics, narrow woven fabrics, pile fabrics, chenille fabrics, tulle
    and other net fabrics, falling within heading No 55.09 of the Common Customs Tariff
    (NIMEXE codes 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29,
    31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65,
    66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93,
    97) (category 2), originating in Romania and in free circulation in the other
    Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/19/CEE: Décision de la Commission, du 6 décembre 1979, autorisant
    la République italienne à exclure du traitement communautaire les tissus de
    coton autres que tissus à point de gaze, bouclés du genre éponge, rubanerie,
    velours, peluches, tissus bouclés, tissus de chenille, tulles et tissus à mailles
    nouées, de la position 55.09 du tarif douanier commun (codes Nimexe: 55.09-01,
    02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39,
    41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71,
    72, 73, 74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97) (catégorie 2), originaires
    de Roumanie et mis en libre pratique dans les autres Etats membres (Le texte en
    langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/19/EWG: Entscheidung der Kommission vom 6. Dezember 1979, mit der die
    Italienische Republik ermächtigt wird, aus Rumänien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle, andere als
    Drehergewebe, Schlingengewebe (Frottiergewebe), Bänder, Samt, Plüsch, Schlingengewebe,
    Chenillegewebe, Tülle und geknüpfte Netzstoffe, der Tarifnummer 55.09 des Gemeinsamen
    Zolltarifs (NIMEXE- Kennziffern 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15,
    16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57,
    59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83,
    84, 86, 87, 92, 93, 97) (Kategorie 2) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/19/EØF: Kommissionens beslutning af 6. december 1979 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage vævet stof
    af bomuld undtagen drejervævet stof, håndklæde-frotterstof og lignende frotterstof,
    bånd, fløjls-, plys- og chenillestoffer, tyl og knyttede netstoffer, som henhører
    under pos. 55.09 i den fælles toldtarif (NIMEXE-nummer 55.09-01, 02, 03, 04,
    05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51,
    52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74,
    76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97; kategori 2), har oprindelse i
    Rumænien og frit kan omsættes i de øvrige medlemsstater (Kun den italienske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/19/CEE: Decisione della Commissione, del 6 dicembre 1979, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i tessuti di cotone,
    diversi da quelli a punto di garza, ricci del tipo spugna, passamaneria, velluti,
    felpe, tessuti di ciniglia, tulli e tessuti a maglie annodate, della voce 55.09
    della tariffa doganale comune (codici Nimexe : 55.09-01, 02, 03, 04, 05, 11, 12,
    13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54,
    55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78,
    81, 82, 83, 84, 86, 87, 92, 93, 97), categoria 2, originari della Romania e messi
    in libera pratica negli altri Stati membri (Il testo in lingua italiana è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/19/EEG: Beschikking van de Commissie van 6 december 1979 waarbij de
    Italiaanse Republiek wordt gemachtigd weefsels van katoen, andere dan weefsels
    met gaasbinding, bad- of frotteerstof (lussendoek), lint, fluweel, pluche, lussenweefsel,
    chenilleweefsel, tule en filetweefsels, van post 55.09 van het gemeenschappelijk
    douanetarief (NIMEXE-code 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17,
    19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61,
    63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83, 84, 86,
    87, 92, 93, 97) (categorie 2), van oorsprong uit Roemenië en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Italiaanse taal is authentiek)'
