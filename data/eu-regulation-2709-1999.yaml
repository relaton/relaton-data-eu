    som omfattas av KN-numren 01041030, 01041080, 01042010, 01042090 och 0204 och
    om undantag från förordning (EG) nr 1439/95 om tillämpningsföreskrifter för
    rådets förordning (EG) nr 2467/98 beträffande import och export av produkter
    inom sektorn för får- och getkött
