    für 2000 und zur Abweichung von der Verordnung (EG) Nr. 1439/95 zur Durchführung
    der Verordnung (EG) Nr. 2467/98 des Rates hinsichtlich der Einfuhr und Ausfuhr
    von Schaf- und Ziegenfleischerzeugnissen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2709/1999 af 17. december 1999 om åbning
