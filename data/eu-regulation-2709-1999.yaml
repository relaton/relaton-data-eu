title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2709/1999 of 17 December 1999 on opening
    Community tariff quotas for 2000 for sheep, goats, sheepmeat and goatmeat falling
    within CN codes 01041030, 01041080, 01042010, 01042090 and 0204 and derogating
    from Regulation (EC) No 1439/95 laying down detailed rules for the application
    of Council Regulation (EC) No 2467/98 as regards the import and export of products
    in the sheepmeat and goatmeat sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2709/1999 de la Commission, du 17 décembre 1999, portant
    ouverture de contingents tarifaires communautaires au titre de 2000 pour les animaux
    vivants des espèces ovine et caprine et pour la viande des animaux des espèces
    ovine et caprine relevant des codes NC 01041030, 01041080, 01042010, 01042090
    et 0204, et portant dérogation au règlement (CE) nº 1439/95 établissant les
    modalités d'application du règlement (CE) nº 2467/98 du Conseil en ce qui concerne
    l'importation et l'exportation de produits du secteur des viandes ovine et caprine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2709/1999 der Kommission vom 17. Dezember 1999 zur
