    schapenvlees en geitenvlees van de GN-codes 01041030, 01041080, 01042010, 01042090
    en 0204 en houdende afwijking van Verordening (EG) nr. 1439/95 tot vaststelling
    van bepalingen van Verordening (EG) nr. 2467/98 van de Raad inzake de invoer en
    de uitvoer van producten van de sector schapen- en geitenvlees
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2709/1999 da Comissão, de 17 de Dezembro de 1999,
    que abre contingentes pautais comunitários, relativos a 2000, para os ovinos
    e caprinos e as carnes de ovino e caprino dos códigos NC 01041030, 01041080,
    01042010, 01042090 e 0204 e derroga o Regulamento (CE) n.o 1439/95 que estabelece
    normas de execução do Regulamento (CE) n.o 2467/98 do Conselho no que respeita
    à importação e exportação de produtos do sector das carnes de ovino e caprino
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2709/1999 de la Comisión, de 17 de diciembre de 1999,
    por el que se abren contingentes arancelarios comunitarios de ganado ovino y caprino
    y de carne de ovino y caprino de los códigos NC 01041030, 01041080, 01042010,
    01042090 y 0204, para el año 2000, y se establecen excepciones al Reglamento
    (CE) nº 1439/95 por el que se establecen disposiciones de aplicación del Reglamento
    (CE) nº 2467/98 del Consejo en lo relativo a la importación y exportación de
    productos del sector de la carne de ovino y caprino
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2709/1999 av den 17 december 1999 om
