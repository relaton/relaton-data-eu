    ja viennin osalta annetusta asetuksesta (EY) N:o 1439/95 poikkeamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2709/1999 della Commissione, del 17 dicembre 1999,
    recante apertura, per il 2000, di contingenti tariffari comunitari di ovini, caprini,
    carni ovine e carni caprine dei codici NC 01041030, 01041080, 01042010, 01042090
    e 0204 e che prevede deroga al regolamento (CE) n. 1439/95, recante modalità
    di applicazione del regolamento (CE) n. 2467/98 del Consiglio in ordine all'importazione
    ed esportazione di prodotti del settore delle carni ovine e caprine
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2709/1999 van de Commissie van 17 december 1999 tot
