  content: A Bizottság 1869/2006/EK rendelete ( 2006. december 15. ) az Európai
    Közösség és a Svájci Államszövetség között létrejött, a mezőgazdasági
    termékek kereskedelméről szóló megállapodásban előírt, Svájcból származó,
    160 kilogrammnál nagyobb tömegű élő szarvasmarhafélékre meghatározott
    behozatali vámkontingens alkalmazására vonatkozó részletes szabályok megállapításáról
    szóló 2172/2005/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1869/2006 della Commissione, del 15 dicembre 2006 ,
    che modifica il regolamento (CE) n. 2172/2005 recante modalità di applicazione
    di un contingente tariffario per l'importazione di bovini vivi di peso superiore
    a 160 kg originari della Svizzera previsto dall'accordo tra la Comunità europea
    e la Confederazione svizzera sul commercio di prodotti agricoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1869/2006 ( 2006. gada 15. decembris ), ar ko
    groza Regulu (EK) Nr. 2172/2005, ar ko nosaka sīki izstrādātus noteikumus par
    importa tarifu kvotu piemērošanu Šveices izcelsmes dzīviem liellopiem, kuru
    svars pārsniedz 160 kg un kā tas paredzēts Eiropas Kopienas un Šveices Konfederācijas
    Nolīgumā par lauksaimniecības produktu tirdzniecību
  type: main
