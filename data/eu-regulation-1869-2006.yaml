  script: Latn
  content: Commission Regulation (EC) No 1869/2006 of 15 December 2006 amending Regulation
    (EC) No 2172/2005 laying down detailed rules for the application of an import
    tariff quota for live bovine animals of a weight exceeding 160 kg and originating
    in Switzerland provided for in the Agreement between the European Community and
    the Swiss Confederation on trade in agricultural products
  type: main
- language: fr
  script: Latn
