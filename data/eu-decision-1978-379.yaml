---
id: EUDecision1978379
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 13 March 1978 authorizing the French Republic not
    to apply Community treatment to men's and boys' woven breeches, shorts and trousers
    (including slacks), women's, girls' and infants' woven trousers and slacks, of
    wool, of cotton or of man-made textile fibres, falling within heading No ex 61.01
    or subheading ex 61.02 B of the Common Customs Tariff, originating in South Korea
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/379/CEE: Décision de la Commission, du 13 mars 1978, autorisant la
    République française à exclure du traitement communautaire les culottes, shorts
    et pantalons tissés pour hommes et garçonnets, pantalons tissés pour femmes,
    fillettes et jeunes enfants, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, de la position Ex 61.01 et de la sous- position Ex 61.02 B du
    Tarif douanier commun, originaires de la Corée du Sud et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. März 1978, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Shorts und andere kurze Hosen und gewebte lange
    Hosen für Männer und Knaben und gewebte lange Hosen für Frauen, Mädchen und
    Kleinkinder, aus Wolle, aus Baumwolle oder aus synthetischen oder künstlichen
    Spinnstoffen der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 13. marts 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage shorts og andre korte benklæder
    til mænd og drenge, vævede; lange benklæder til kvinder, piger og småbørn,
    vævede af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 61.01 og ex 61.02 B i den fælles toldtarif, har oprindelse i Sydkorea,
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 marzo 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario calzoncini e «shorts» e pantaloni
    tessuti per uomo e per ragazzo, pantaloni tessuti, per donna, per ragazza e per
    bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali della
    voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale comune, originari
    della Corea del Sud e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 maart 1978 waarbij de Franse Republiek
    wordt gemachtigd shorts en ander korte broeken, geweven, voor heren en jongens,
    lange broeken, geweven van wol, van katoen of van synthetisch of van kunstmatige
    textielvezels voor dames, meisjes en kinderen, van de posten ex 61.01 en ex 61.02
    B van het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
