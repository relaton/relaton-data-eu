title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 760/81 of 24 March 1981 re-establishing
    the levying of customs duties on sacks and bags, of a kind used for the packing
    of goods, products of category 93 (code 0930), originating in China, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3320/80
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 760/81 de la Commission, du 24 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux sacs et
    sachets d' emballage, de la catégorie de produits n° 93 (code 0930), originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 760/81 der Kommission vom 24. März 1981 über die
    Wiedereinführung des Zollsatzes für Säcke und Beutel zu Verpackungszwecken
    der Warenkategorie Nr. 93 (Kennziffer 0930), mit Ursprung in China, dem die in
    der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 760/81 af 24. marts 1981 om genindførelse
    af opkrævning af toldafgifter for sække og poser til emballage, under kategori
    93 (kode 0930), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 760/81 τής Επιτροπής
    τής 24ης Μαρτίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά σάκους καί
    σακίδια συσκευασίας, τών προϊόντων τής κατηγορίας
    93 (κώδικας 0930), καταγωγής Κίνας, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (ΕΟΚ) αριθ.
    3320/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 760/81 della Commissione, del 24 marzo 1981, che ripristina
    la riscossione dei dazi doqanali applicabili ai sacchi e sacchetti da imballaggio
    della categoria di prodotti n. 93 (codice 0930), originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 760/81 van de Commissie van 24 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakken voor
    verpakkingsdoeleinden, van de categorie van produkten nr. 93 (codenummer 0930),
    van oorsprong uit China, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3320/80 van de Raad
  type: main
