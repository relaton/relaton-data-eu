title:
- language: en
  script: Latn
  content: '79/439/EEC: Commission Decision of 18 April 1979 authorizing the Federal
    Republic of Germany not to apply Community treatment to women''s, girls''and infants''(other
    than babies'') woven and knitted or crocheted dresses, of wool, cotton or man-made
    textile fibres, falling within subheadings ex 60.05 A II and ex 61.02 B of the
    Common Customs Tariff (NIMEXE codes 60.05-41, 42, 43, 44 ; 61.02-48, 52, 53, 54)
    (category 26), originating in Romania and in free circulation in the other Member
    States (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/439/CEE: Décision de la Commission, du 18 avril 1979, autorisant la
    République fédérale d''Allemagne à exclure du traitement communautaire les
    robes tissées et robes de bonneterie, pour femmes, fillettes et jeunes enfants
    (autres que bébés) de laine, de coton ou de fibres textiles synthétiques ou
    artificielles, des sous- positions ex 60.05 A II et ex 61.02 B du tarif douanier
    commun (codes Nimexe: 60.05-41, 42, 43, 44; 61.02-48, 52, 53, 54), catégorie
    26, originaires de Roumanie et mises en libre pratique dans les autres États
    membres (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/439/EWG: Entscheidung der Kommission vom 18. April 1979, mit der die
    Bundesrepublik Deutschland ermächtigt wird, aus Rumänien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Kleider aus Geweben und
    aus Gewirken, für Frauen, Mädchen und Kleinkinder (ausgenommen Säuglinge),
    aus Wolle, Baumwolle oder aus synthetischen oder künstlichen Spinnstoffen, der
    Tarifstellen ex 60.05 A II und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    60.05-41; 42; 43; 44 und 61.02-48; 52; 53; 54) (Kategorie 26) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/439/EØF: Kommissionens beslutning af 18. april 1979 om bemyndigelse
    af Forbundsrepublikken Tyskland til fra fællesskabsbehandling at undtage vævede
    kjoler og kjoler af trikotage, til kvinder, piger og småbørn (undtagen spædbørn),
    af uld, bomuld eller kemofibre, som henhører under pos. ex 60.05 A II og ex 61.02
    B i den fælles toldtarif (NIMEXE-nummer 60.05-41, 42, 43, 44 ; 61.02- 48, 52,
    53, 54 ; kategori 26), har oprindelse i Rumænien og frit kan omsættes i de øvrige
    medlemsstater (Kun den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/439/CEE: Decisione della Commissione, del 18 aprile 1979, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario abiti
    interi tessuti ed a maglia, per donna, per ragazza e per bambini, diversi dai
    bambini piccoli (bébés), di lana, di cotone o di fibre tessili sintetiche o
    artificiali, delle sottovoci ex 60.05 A II e ex 61.02 B della tariffa doganale
    comune (codici Nimexe: 60.05-41, 42, 43, 44 e 61.02-48, 52, 53, 54) (categoria
    26), originari della Romania e messi in libera pratica negli altri Stati membri
    (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/439/EEG: Beschikking van de Commissie van 18 april 1979 waarbij de
    Bondsrepubliek Duitsland wordt gemachtigd japonnen voor dames, meisjes en kinderen
    (andere dan die voor baby''s), geweven en van brei- of haakwerk, van wol, van
    katoen of van synthetische of kunstmatige vezels, van de posten ex 60.05 A II
    en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE- code 60.05-41, 42,
    43, 44 ; 61-02-48, 52, 53, 54) (categorie 26), van oorsprong uit Roemenië en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Duitse taal is authentiek)'
