  script: Latn
  content: COMMISSION REGULATION (EEC) No 1724/93 of 30 June 1993 laying down the
    prices and amounts fixed in ecus applicable in the sugar sector for the 1993/94
    marketing year as a result of the monetary realignments during the 1992/93 marketing
    year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1724/93 de la Commission du 30 juin 1993 déterminant
    les prix et les montants fixés en écus applicables dans le secteur du sucre
    pour la campagne de commercialisation 1993/1994 en conséquence des réalignements
    monétaires intervenus pendant la campagne de commercialisation 1992/1993
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1724/93 DER KOMMISSION vom 30. Juni 1993 zur Bestimmung
    der im Zuckerwirtschaftsjahr 1993/94 geltenden, in Ecu festgesetzten und infolge
    der Währungsneufestsetzung im Wirtschaftsjahr 1992/93 verringerten Preise und
    Beträge
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1724/93 af 30. juni 1993 om fastlæggelse
    af de i ecu fastsatte beløb, der anvendes i sukkersektoren for produktionsåret
    1993/94 som følge af de monetære justeringer i produktionsåret 1992/93
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1724/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 30ής Ιουνίου 1993 για τον καθορισμό των τιμών
    και των ποσών που καθορίζονται σε Ecu που εφαρμόζονται
    στον τομέα της ζάχαρης για την περίοδο εμπορίας
    1993/94 συνεπεία των νομισματικών ευθυγραμμίσεων
    που έλαβαν χώρα κατά την περίοδο εμπορίας 1992/93
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1724/93 DELLA COMMISSIONE del 30 giugno 1993 che stabilisce
    i prezzi e gli importi fissati in ecu applicabili nel settore dello zucchero per
    la campagna di commercializzazione 1993-94 a seguito dei riallineamenti monetari
    della campagna di commercializzazione 1992-93
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1724/93 VAN DE COMMISSIE van 30 juni 1993 tot wijziging,
    als gevolg van de monetaire herschikkingen in het verkoopseizoen 1992/1993, van
    de voor het verkoopseizoen 1993/1994 geldende prijzen en bedragen in ecu in de
    suikersector
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1724/93 DA COMISSÃO de 30 de Junho de 1993 que determina
