    à campanha de comercialização de 1993/1994, na sequência dos realinhamentos
    monetários ocorridos durante a campanha de comercialização de 1992/1993
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1724/93 DE LA COMISIÓN de 30 de junio de 1993 por
