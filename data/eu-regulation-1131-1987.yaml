title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1131/87 of 24 April 1987 amending Regulation
    (EEC) No 152/87 fixing, for the period 1 January to 31 December 1987, the maximum
    quantity of certain products of the oils and fats sector to be released for consumption
    and imported into Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1131/87 de la Commission du 24 avril 1987 modifiant
    le règlement (CEE) n° 152/87, fixant pour la période allant du 1er janvier
    au 31 décembre 1987 la quantité maximale de certains produits du secteur des
    matières grasses à mettre à la consommation et à importer en Espagne et au
    Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1131/87 der Kommission vom 24. April 1987 zur Änderung
    der Verordnung (EWG) Nr. 152/87 zur Festsetzung der Höchstmengen bestimmter Erzeugnisse
    des Fettsektors, die in Spanien und Portugal zum freien Verkehr abzufertigen und
    in diese Länder einzuführen sind, für den Zeitraum vom 1. Januar bis zum 31.
    Dezember 1987
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1131/87 af 24. april 1987 om ændring
    af forordning (EØF) nr. 152/87 om fastsættelse for perioden fra den 1. januar
    til den 31. december 1987 af den største mængde af visse produkter inden for
    fedtstofsektoren, der kan overgå til frit forbrug i og importeres til Spanien
    og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1131/87 της Επιτροπής
    της 24ης Απριλίου 1987 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 152/87 που καθορίζει για την περίοδο
    από 1 Ιανουαρίου έως 31 Δεκεμβρίου 1987 την μεγίστη
    ποσότητα για ορισμένα προϊόντα του τομέα των
    λιπαρών ουσιών που θα τεθούν στην κατανάλωση
    και θα εισαχθούν στην Ισπανία και στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1131/87 della Commissione del 24 aprile 1987 recante
    modifica del regolamento (CEE) n. 152/87 che fissa, per il periodo 1° gennaio
    - 31 dicembre 1987, la quantità massima di taluni prodotti del settore dei grassi
    da mettere in consumo e da importare in Spagna e in Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1131/87 van de Commissie van 24 april 1987 tot wijziging
    van Verordening (EEG) nr. 152/87 tot vaststelling, voor het tijdvak van 1 januari
    tot en met 31 december 1987, van de maximumhoeveelheid van bepaalde in Spanje
    en Portugal in consumptie te brengen of in te voeren produkten van de sector oliën
    en vetten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1131/87 da Comissão de 24 de Abril de 1987 que
    altera o Regulamento (CEE) n.° 152/87 que fixa, para o período compreendido
    entre 1 de Janeiro e 31 de Dezembro de 1987, a quantidade máxima de determinados
    produtos do sector das matérias gordas a introduzir no consumo e a importar em
    Espanha e em Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1131/87 de la Comisión de 24 de abril de 1987 por
    el que se modifica el Reglamento (CEE) n° 152/87, por el que se fija, para el
    período comprendido entre el 1 de enero y el 31 de diciembre de 1987, la cantidad
    máxima de determinados productos del sector de las materias grasas que deben
    despacharse al consumo e importarse en España y en Portugal
  type: main
