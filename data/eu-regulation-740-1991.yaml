- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 740/91 DA COMISSÃO de 25 de Março de 1991 que
    altera o anexo VII do Regulamento (CEE) nº 4135/86 do Conselho, relativo ao regime
    comum aplicável às importações de certos produtos têxteis originários da
    Jugoslávia (categorias 5, 6 e 7) #A COMISSÃO DAS COMUNIDADES EUROPEIAS, # Tendo
    em conta o Tratado que institui a Comunidade Económica Europeia e, nomeadamente,
    o seu artigo 113º, # Tendo em conta a proposta da Comissão, # Considerando que
    a Comunidade e a Jugoslávia concluíram um protocolo complementar ao acordo de
    cooperação, relativo ao comércio de produtos têxteis; # Considerando que,
    pelo Regulamento (CEE) nº 4135/86 (1), com a última redacção que lhe foi dada
    pelo Regulamento (CEE) nº 3059/90 (2), o Conselho submeteu a importação de
    certos produtos têxteis originários da Jugoslávia a um regime comum até 1991;
    # Considerando que surgiram necessidades suplementares de reimportação em certas
    regiões da Comunidade (Itália, Benelux) dos produtos das categorias 5 (camisolas),
    6 (calças) e 7 (camisas para senhoras), após aperfeiçoamento na Jugoslávia,
    em conformidade com o previsto no nº 3 do artigo 5º do referido regulamento;
    # Considerando que, no interesse da indústria comunitária, convém modificar
    os objectivos quantitativos em matéria de tráfego de aperfeiçoamento passivo
    para as categorias 5 (camisolas), 6 (calças) e 7 (camisas para senhoras) referidos
    nos apêndices A e B do anexo VII; # Considerando que as disposições do presente
    regulamento estão em conformidade com o parecer do comité « Jugoslávia »,
    # ADOPTOU O PRESENTE REGULAMENTO: Artigo 1º São alterados, relativamente a 1991,
    os apêndices A e B do anexo VII do Regulamento (CEE) nº 4135/86 em conformidade
    com o anexo do presente regulamento. Artigo 2º O presente regulamento entra em
    vigor na data da sua publicação no Jornal Oficial das Comunidades Europeias.
    O presente regulamento é obrigatório em todos os seus elementos e directamente
    aplicável em todos os Estados-membros. # Feito em Bruxelas, em 25 de Março de
    1991. Pela Comissão # Frans ANDRIESSEN # Vice-Presidente (1) JO nº L 387 de
    31. 12. 1986, p. 1. (2) JO nº L 294 de 25. 10. 1990, p. 20. # ANEXO #O anexo
    VII foi alterado do seguinte modo: # - No apêndice A (categorias 5, 6 e 7), o
    quadro é substituído pelo seguinte: #« Categoria Designação das mercadorias
    Unidade Anos Quantidade CEE 5 Camisolas, pullovers e semelhantes 1 000 peças
    1991 4 622 6 Calças tecidas 1 000 peças 1991 14 311 7 Camisas para senhoras,
    de malha ou tecido 1 000 peças 1991 7 328 »#- No apêndice B (categorias 5,
    6 e 7), o quadro é substituído pelo seguinte: #« Categoria Unidades Estados-membros
    1991 5 1 000 peças D # F # I # BNL # UK # IRL # DK # GR # E # P # CEE 3 780 #
    - # 415 # 427 # - # - # - # - # - # - # 4 622 6 1 000 peças D # F # I # BNL #
    UK # IRL # DK # GR # E # P # CEE 11 453 # 514 # 400 # 1 944 # - # - # - # - #
    - # - # 14 311 7 1 000 peças D # F # I # BNL # UK # IRL # DK # GR # E # P # CEE
    6 444 # - # - # 884 # - # - # - # - # - # - # 7 328 »# BM391R0742REGULAMENTO
    (CEE) Nº 742/91 DA COMISSÃO de 26 de Março de 1991 que fixa, para a campanha
    de comercialização de 1990/1991, o direito nivelador especial aplicável às
    importações de azeite originário da Tunísia #'
  type: main
