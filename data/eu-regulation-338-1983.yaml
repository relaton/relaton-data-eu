title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 338/83 of 10 February 1983 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of porcelain or china (including biscuit
    porcelain and parian) falling within heading No 69.11, and originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 338/83 de la Commission du 10 février 1983 portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en porcelaine, de la position 69.11
    du tarif douanier commun, originaires de la Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 338/83 der Kommission vom 10. Februar 1983 zur Wiedereinführung
    der Erhebung der Zölle für Geschirr, Haushalts- und Toilettengegenstände, aus
    Porzellan, der Tarifnummer 69.11, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 338/83 af 10. februar 1983 om genindførelse
    af opkrævning af told for bordservice samt husholdnings- og toiletartikler, af
    porcelæn, henhørende under pos. 69.11 og med oprindelse i Sydkorea, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 338/83 της Επιτροπής
    της 10ης Φεβρουαρίου 1983 περί αποκαταστάσεως
    της εφαρμογής των δασμών για τα επιτραπέζια
    σκεύη και είδη οικιακής χρήσεως ή ευπρεπισμού,
    εκ πορσελάνης, της κλάσεως 69.11 του Κοινού Δασμολογίου,
    καταγωγής Νοτίου Κορέας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 338/83 della Commissione del 10 febbraio 1983 che
    ripristina la riscossione dei dazi doganali applicabili al vasellame e oggetti
    di uso domestico o da toletta, di porcellana, della voce 69.11 della tariffa doganale
    comune, orginari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 338/83 van de Commissie van 10 februari 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op vaatwerk, huishoudelijke
    artikelen en toiletartikelen, van porselein, van tariefpost 69.11, van oorsprong
    uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
