  content: '2013/426/EU: Commission Implementing Decision of 5 August 2013 on measures
    to prevent the introduction into the Union of the African swine fever virus from
    certain third countries or parts of the territory of third countries in which
    the presence of that disease is confirmed and repealing Decision 2011/78/EU (notified
    under document C(2013) 4951)'
  type: main
- language: fr
  script: Latn
