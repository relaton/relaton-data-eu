  content: Commission Regulation (EC) No 1711/95 of 13 July 1995 concerning the transitional
    adjustment of the special arrangement for the import of durum wheat originating
    in Morocco required in order to implement the Agreement on Agriculture concluded
    during the Uruguay Round of multilateral trade negotiations and derogating from
    Council Regulation (EEC) No 1520/76
  type: main
- language: fr
  script: Latn
