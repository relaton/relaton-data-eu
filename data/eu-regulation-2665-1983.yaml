    bezüglich der auf das gemäß den Verordnungen (EWG) Nr. 368/77, (EWG) Nr. 443/77
    und (EWG) Nr. 1844/77 verkaufte Magermilchpulver anwendbaren Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2665/83 af 22. september 1983 om ændring
