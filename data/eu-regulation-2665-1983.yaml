  content: Commission Regulation (EEC) No 2665/83 of 22 September 1983 amending Regulation
    (EEC) No 1245/83 fixing the monetary compensatory amounts with regard to the coefficients
    applicable to skimmed-milk powder sold under Regulations (EEC) No 368/77, (EEC)
    No 443/77 and (EEC) No 1844/77
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2665/83 de la Commission, du 22 septembre 1983, modifiant
    le règlement (CEE) n 1245/83 fixant les montants compensatoires monétaires en
    ce qui concerne les coefficients applicables au lait écrémé en poudre vendu
    au titre des règlements (CEE) n 368/77, (CEE) n 443/77 et (CEE) n 1844/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2665/83 der Kommission vom 22. September 1983 zur
