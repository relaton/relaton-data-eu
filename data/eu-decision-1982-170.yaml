title:
- language: en
  script: Latn
  content: '82/170/Euratom: Council Decision of 15 March 1982 amending Decision 77/271/Euratom
    as regards the total amount of Euratom loans which the Commission is empowered
    to contract for the purpose of contributing to the financing of nuclear power
    stations'
  type: main
- language: fr
  script: Latn
  content: '82/170/Euratom: Décision du Conseil, du 15 mars 1982, modifiant la décision
    77/271/Euratom en ce qui concerne le montant total des emprunts Euratom que la
    Commission est habilitée à contracter en vue d'' une contribution au financement
    des centrales nucléaires de puissance'
  type: main
- language: de
  script: Latn
  content: '82/170/Euratom: Beschluß des Rates vom 15. März 1982 zur Änderung des
    Beschlusses 77/271/Euratom hinsichtlich des Höchstbetrags der Euratom-Anleihen,
    welche die Kommission im Hinblick auf einen Beitrag für die Finanzierung von
    Kernkraftanlagen aufnehmen kann'
  type: main
- language: da
  script: Latn
  content: '82/170/Euratom: Rådets afgørelse af 15. marts 1982 om ændring af afgørelse
    77/271/Euratom for så vidt angår maksimumsbeløbet for de Euratom-lån, som
    Kommissionen kan optage med henblik på et bidrag til finansieringen af atomkraftværker'
  type: main
- language: el
  script: Grek
  content: '82/170/Ευρατόμ: Απόφαση τού Συμβουλίου τής
