    77/271/Ευρατόμ όσον αφορά τό συνολικό ποσό τών
    δανείων Ευρατόμ πού η Επιτροπή είναι εξουσιοδοτημένη
    νά συνάπτει γιά νά συνεισφέρει στή χρηματοδότηση
    τών πυρηνικών κέντρων ενεργείας'
  type: main
- language: it
  script: Latn
  content: '82/170/Euratom: Decisione del Consiglio, del 15 marzo 1982, recante modifica
    della decisione 77/271/Euratom per quanto concerne l'' importo totale dei prestiti
    Euratom che la Commissione è abilitata a contrarre per contribuire al finanziamento
    delle centrali elettronucleari'
  type: main
- language: nl
  script: Latn
  content: '82/170/Euratom: Besluit van de Raad van 15 maart 1982 tot wijziging van
