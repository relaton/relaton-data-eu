title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1359/93 of 2 June 1993 determining for the
    Member States, for the 1993 marketing year, the estimated loss of income and the
    estimated level of the premium payable per ewe and per female goat and fixing
    the first advance payment for this premium and of the specific aid for sheep and
    goat farming in certain less favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1359/93 de la Commission du 2 juin 1993 déterminant,
    pour les États membres et pour la campagne 1993, la perte estimée de revenu,
    le montant estimé de la prime payable par brebis et par chèvre, ainsi que fixant
    le montant du premier acompte de cette prime ainsi que celui de l'aide spécifique
    à l'élevage ovin et caprin dans certaines zones défavorisées de la Communauté
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1359/93 DER KOMMISSION vom 2. Juni 1993 zur Bestimmung
    des je Mitgliedstaat und für das Wirtschaftsjahr 1993 zu gewährenden Einkommensausfalls
    und der je Mutterschaf und Ziege zu gewährenden Prämie, des ersten Vorschusses
    auf diese Prämie sowie der Sonderbeihilfe für die Schaf- und Ziegenhaltung in
    bestimmten benachteiligten Gebieten der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1359/93 af 2. juni 1993 om fastsættelse
    for medlemsstaterne for produktionsåret 1993 af det anslåede indkomsttab, det
    anslåede præmiebeløb, der skal betales pr. moderfår og moderged, det første
    forskud på dette præmiebeløb samt det første forskud på den særlige støtte
    til fåre- og gedeopdræt i visse ugunstigt stillede områder i Fællesskabet
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1359/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 2ας Ιουνίου 1993 περί προσδιορισμού, για τα
    κράτη μέλη και για την περίοδο εμπορίας 1993,
    της εκτιμώμενης απώλειας εισοδήματος, του
    εκτιμώμενου ποσού της πριμοδότησης που καταβάλλεται
    ανά προβατίνα και ανά αίγα, καθώς και του ποσού
    του της πρώτης προκαταβολής της πριμοδότησης
    αυτής και του ποσού της ειδικής ενίσχυσης στην
    εκτροφή αιγοπροβάτων σε ορισμένες μειονεκτικές
    ζώνες της Κοινότητας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1359/93 DELLA COMMISSIONE del 2 giugno 1993 che determina,
    per gli Stati membri e per la campagna 1993, la perdita stimata di reddito, l'
    importo stimato del premio pagabile per pecora e per capra, l' ammontare del primo
    acconto del premio nonchè quello dell' aiuto specifico per l' allevamento ovocaprino
    in alcune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1359/93 VAN DE COMMISSIE van 2 juni 1993 tot vaststelling,
    voor de Lid-Staten en voor het verkoopseizoen 1993, van het geraamde inkomensverlies
    en van het geraamde premiebedrag per ooi en per vrouwelijke geit alsmede van het
    eerste voorschot op deze premie en op het bedrag van de bijzondere steun voor
    de schappen- en geitenhouderij in bepaalde probleemgebieden van de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1359/93 DA COMISSÃO de 2 de Junho de 1993 que determina,
    para os Estados-membros e em relação à campanha de 1993, a perda estimada de
    rendimento e o montante estimado do prémio pagável por ovelha e por cabra e
    fixa o montante do primeiro pagamento por conta desse prémio, bem como o da ajuda
    específica à criação de ovinos e caprinos em determinadas zonas desfavorecidas
    da Comunidade
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1359/93 DE LA COMISIÓN de 2 de junio de 1993 por el
    que se determinan para los Estados miembros y para la campaña de 1993 la pérdida
    de renta calculada y el importe de la prima pagadera calculado por oveja y cabra,
    y por el que se fija el importe del primer anticipo de dicha prima y la ayuda
    específica a la ganadería ovina y caprina en determinadas zonas desfavorecidas
    de la Comunidad
