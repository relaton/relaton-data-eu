title:
- language: en
  script: Latn
  content: '79/932/EEC: Commission Decision of 19 October 1979 authorizing Ireland
    not to apply Community treatment to men''s and boys''woven under garments other
    than shirts, of wool, of cotton or of man-made textile fibres, falling within
    heading No ex 61.03 of the Common Customs Tariff (NIMEXE codes 61.03-51, 55, 59,
    81, 85, 89) (category 18), originating in Hong Kong and in free circulation in
    the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/932/CEE: Décision de la Commission, du 19 octobre 1979, autorisant
    l''Irlande à exclure du traitement communautaire les sous-vêtements tissés,
    autres que chemises et chemisettes pour hommes et garçonnets, de laine, de coton
    ou de fibres textiles synthétiques ou artificielles de la position ex 61.03 du
    tarif douanier commun (codes Nimexe: 61.03-51, 55, 59, 81, 85, 89) (catégorie
    18), originaires de Hong-kong et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/932/EWG: Entscheidung der Kommission vom 19. Oktober 1979, mit der
    Irland ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Unterkleidung aus Geweben, andere als Oberhemden,
    auch Sport- und Arbeitshemden, für Männer und Knaben, aus Wolle, Baumwolle oder
    synthetischen oder künstlichen Spinnfasern, der Tarifnummer ex 61.03 des Gemeinsamen
    Zolltarifs (NIMEXE- Kennziffern 61.03-51, 55, 59, 81, 85, 89) (Kategorie 18) von
    der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/932/EØF: Kommissionens beslutning af 19. oktober 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage underbeklædningsgenstande,
    vævede andre end skjorter, herunder sports- og arbejdsskjorter til mænd og drenge,
    af uld, bomuld eller kunstige og syntetiske tekstilfibre, som henhører under
    pos. ex 61.03 i den fælles toldtarif (NIMEXE-nummer 61.03-51, 55, 59, 81, 85,
    89 ; kategori 18), har oprindelse i Hongkong og frit kan omsættes i de øvrige
    medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/932/CEE: Decisione della Commissione, del 19 ottobre 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le sottovesti tessute, diverse
    dalle camicie e camicette per uomo e per ragazzo, di lana, di cotone o di fibre
    tessili sintetiche o artificiali, della voce ex 61.03 della tariffa doganale comune
    (codici Nimexe: 61.03-51, 55, 59, 81, 85, 89), categoria 18, originarie di Hong
    Kong e messe in libera pratica negli altri Stati membri (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/932/EEG: Beschikking van de Commissie van 19 oktober 1979 waarbij Ierland
    wordt gemachtigd herenonderkleding en jongensonderkleding, geweven, andere dan
    overhemden en sporthemden van wol, van katoen of van synthetische of van kunstmatige
    textielvezels, van post ex 61.03 van het gemeenschappelijk douanetarief (NIMEXE-code
    61.03- 51, 55, 59, 81, 85, 89) (categorie 18), van oorsprong uit Hong-Kong en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
