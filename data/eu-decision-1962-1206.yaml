title:
- language: fr
  script: Latn
  content: Décision du Conseil du 18 décembre 1962 prorogeant la décision du 28
    juillet 1962 concernant le maintien des restrictions quantitatives à l'importation
    pour les États membres à l'égard des pays à commerce d'état pour les produits
    faisant l'objet des règlements n° 19, 20, 21, 22 et 23 du Conseil
  type: main
- language: de
  script: Latn
  content: Entscheidung des Rats vom 18. Dezember 1962 zur Verlängerung der Entscheidung
    vom 28. Juli 1962 über die Beibehaltung der mengenmäßigen Einfuhrbeschränkungen
    durch die Mitgliedstaaten gegenüber den Staatshandelsländern für die unter
    die Verordnungen Nr. 19, 20, 21, 22 und 23 des Rats fallenden Erzeugnisse
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio del 18 dicembre 1962 che proroga la decisione del
    28 luglio 1962 relativa al mantenimento da parte degli Stati membri delle restrizioni
    quantitative all'importazione nei confronti dei paesi a commercio di Stato per
    i prodotti oggetto dei regolamenti del Consiglio nn. 19, 20, 21, 22 e 23
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Raad van 18 december 1962 tot verlenging van de beschikking
    van 28 juli 1962 betreffende de handhaving van de kwantitatieve invoerbeperkingen
    door de Lid-Staten ten opzichte van de landen met staatshandel voor de produkten
    die het onderwerp vormen van de Verordeningen Nrs. 19, 20, 21, 22 en 23 van de
    Raad
  type: main
