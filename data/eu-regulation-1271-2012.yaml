  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 1271/2012, annettu 21 päivänä
    joulukuuta 2012 , tietyistä asetuksen (EY) N:o 1122/2009 säännöksistä poikkeamisesta
    siltä osin kuin on kyse mahdollisuudesta jättää tilatukijärjestelmän mukaista
    tukea koskevia hakemuksia vuodelta 2012 ja tukioikeuksien myöntämistä tai niiden
