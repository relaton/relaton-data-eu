    no que se refere à declaração dos direitos ao pagamento em 2012, e do Regulamento
    (CE) n. ° 73/2009 do Conselho, no que se refere à verificação das condições
    de elegibilidade antes do pagamento e à data em que as parcelas devem estar à
    disposição dos agricultores
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1271/2012 al Comisiei din
    21 decembrie 2012 de derogare de la anumite dispoziții din Regulamentul (CE)
    nr. 1122/2009 în ceea ce privește posibilitățile de depunere a cererilor de
    ajutor în cadrul schemei de plată unică pentru 2012 și de alocare a drepturilor
    la plată, sau de majorare a valorii unitare a acestora, din rezerva națională
    în 2012, și în ceea ce privește conținutul cererii unice, din Regulamentul
    (CE) nr. 1120/2009, în ceea ce privește declararea drepturilor la plată în
    2012 și din Regulamentul (CE) nr. 73/2009 al Consiliului în ceea ce privește
    verificarea condițiilor de eligibilitate înainte de efectuarea plăților și
    data la care parcelele trebuie să fie la dispoziția fermierilor
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1271/2012 z 21. decembra 2012
    , ktorým sa stanovuje výnimka z určitých ustanovení nariadenia (ES) č. 1122/2009,
    pokiaľ ide o možnosti predkladať žiadosti o pomoc v rámci režimu jednotnej
    platby za rok 2012 a prideľovať v roku 2012 platobné nároky z národnej rezervy
    alebo zvyšovať ich jednotkovú hodnotu a pokiaľ ide o obsah jednotnej žiadosti,
    nariadenia (ES) č. 1120/2009, pokiaľ ide o nahlásenie platobných nárokov
    v roku 2012, a nariadenia Rady (ES) č. 73/2009, pokiaľ ide o overovanie podmienok
    oprávnenosti pred uskutočnením platieb a deň, ku ktorému pozemky musia byť
    k dispozícii poľnohospodárom
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1271/2012 z dne 21. decembra 2012 o
    odstopanju od nekaterih določb Uredbe (ES) št. 1122/2009 glede možnosti za
    vložitev zahtevkov za pomoč v okviru sheme enotnega plačila za leto 2012 in
    za dodelitev pravic do plačila ali povečanje njihovega zneska na enoto iz nacionalne
    rezerve v letu 2012 ter glede vsebine enotnega zahtevka, Uredbe (ES) št. 1120/2009
    glede prijave pravic do plačila v letu 2012 in Uredbe Sveta (ES) št. 73/2009
    glede preverjanja pogojev za upravičenost pred plačili in datuma, ko morajo
    biti parcele na voljo kmetom
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 1271/2012 de la Comisión, de 21 de
    diciembre de 2012 , por el que se establecen excepciones a determinadas disposiciones
    del Reglamento (CE) n ° 1122/2009 con respecto a las posibilidades de presentación
    de solicitudes de ayuda en virtud del régimen de pago único para 2012 y de atribución
    de derechos de pago, o de incremento de su valor unitario, procedentes de la reserva
    nacional en 2012, y con respecto al contenido de la solicitud única; del Reglamento
    (CE) n ° 1120/2009 en lo tocante a la declaración de los derechos de pago en
    2012, y del Reglamento (CE) n ° 73/2009 del Consejo en lo relativo a la verificación
    de las condiciones de admisibilidad antes de los pagos y a la fecha en que las
    parcelas deben estar a disposición de los agricultores
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1271/2012 av den 21 december
    2012 om undantag från vissa bestämmelser i förordning (EG) nr 1122/2009 vad
    gäller möjligheterna att lämna in ansökan om samlat gårdsstöd för 2012
    och om tilldelning av stödrättigheter, eller om ökning av deras enhetsvärde,
