  script: Latn
  content: A Bizottság 1271/2012/EU végrehajtási rendelete ( 2012. december 21.
    ) az 1122/2009/EK rendelet egyes rendelkezéseitől az egységes támogatási
    rendszer keretében a 2012-re vonatkozó támogatási kérelmek és támogatási
    jogosultságoknak a nemzeti tartalékból a 2012-es évben történő kiosztása
    vagy egységenkénti értékének növelése iránti kérelmek lehetőségei,
    valamint az egységes kérelem tartalma tekintetében való eltérésről, az
    1120/2009/EK rendelettől a támogatási jogosultságok 2012-ben való bejelentése
    tekintetében való eltérésről, valamint a 73/2009/EK tanácsi rendelettől
    a jogosultsági feltételek kifizetés előtti ellenőrzése és a mezőgazdasági
    termelők számára a parcellák rendelkezésre állása kapcsán előírt határidő
    tekintetében való eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1271/2012 della Commissione, del 21 dicembre
    2012 , recante deroga a talune disposizioni del regolamento (CE) n. 1122/2009
    per quanto riguarda la possibilità di presentare domanda di aiuto nell’ambito
    del regime di pagamento unico per il 2012 e domanda di assegnazione dei diritti
    all’aiuto provenienti dalla riserva nazionale, o di aumento del loro valore
    unitario, nel 2012, nonché il contenuto della domanda unica; del regolamento
    (CE) n. 1120/2009 per quanto riguarda la dichiarazione dei diritti all’aiuto
    nel 2012 e del regolamento (CE) n. 73/2009 del Consiglio per quanto riguarda la
    verifica delle condizioni di ammissibilità prima dei pagamenti e la data in cui
    le parcelle agricole devono essere a disposizione dell’agricoltore
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1271/2012 ( 2012. gada 21. decembris
    ), ar ko atkāpjas no dažiem noteikumiem Regulā (EK) Nr. 1122/2009 attiecībā
    uz pieteikumu iesniegšanas iespējām atbalsta saņemšanai saskaņā ar vienotā
    maksājuma shēmu 2012. gadam un par tiesību uz maksājumu piešķiršanu vai
