  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1271/2012 van de Commissie van 21 december
    2012 tot afwijking van een aantal bepalingen van Verordening (EG) nr. 1122/2009
    wat betreft de mogelijkheden om voor 2012 steunaanvragen in het kader van de bedrijfstoeslagregeling
    in te dienen en om in 2012 aanvragen in te dienen tot toewijzing van toeslagrechten
    of verhoging van het eenheidsbedrag daarvan uit de nationale reserve en wat betreft
    de inhoud van de verzamelaanvraag, van Verordening (EG) nr. 1120/2009 wat betreft
    de aangifte van toeslagrechten in 2012 en van Verordening (EG) nr. 73/2009 van
    de Raad wat betreft de toetsing van de subsidiabiliteitsvoorwaarden voordat betalingen
    worden verricht en wat betreft de datum waarop de percelen ter beschikking van
    de landbouwers moeten staan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 1271/2012 z dnia 21 grudnia
    2012 r. wprowadzające odstępstwa od niektórych przepisów rozporządzenia (WE)
    nr 1122/2009 w odniesieniu do możliwości składania wniosków o przyznanie pomocy
    w ramach systemu płatności jednolitych na 2012 r. oraz przyznawania uprawnień
    do płatności lub zwiększenia ich wartości jednostkowej, z rezerwy krajowej
    w 2012 r., w odniesieniu do treści pojedynczego wniosku, od przepisów rozporządzenia
    (WE) nr 1120/2009 w odniesieniu do zgłaszania uprawnień do płatności w 2012
    r. oraz rozporządzenia Rady (WE) nr 73/2009 w odniesieniu do weryfikacji warunków
    kwalifikowalności przed dokonaniem płatności oraz daty, z którą działki
    te muszą być w posiadaniu rolników
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 1271/2012 da Comissão, de 21 de dezembro
    de 2012 , que derroga certas disposições do Regulamento (CE) n. ° 1122/2009
    no respeitante à possibilidade de apresentar pedidos de ajuda a título do regime
    de pagamento único para 2012 e pedidos de atribuição ou de aumento do valor
    unitário de direitos ao pagamento a partir da reserva nacional em 2012 e, no
