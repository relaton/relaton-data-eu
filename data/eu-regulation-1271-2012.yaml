    uz atbilstības nosacījumu pārbaudi pirms maksājumiem un datumu, kurā zemes
    gabaliem jābūt lauksaimnieku rīcībā
  type: main
- language: lt
  script: Latn
  content: 2012 m. gruodžio 21 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1271/2012,
