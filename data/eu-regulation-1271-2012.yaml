    sekä yhtenäistukihakemuksen sisällöstä, tietyistä asetuksen (EY) N:o 1120/2009
    säännöksistä poikkeamisesta siltä osin kuin on kyse tukioikeuksien ilmoittamisesta
    vuonna 2012 sekä tietyistä neuvoston asetuksen (EY) N:o 73/2009 säännöksistä
    poikkeamisesta siltä osin kuin on kyse tukikelpoisuusedellytysten tarkastamisesta
