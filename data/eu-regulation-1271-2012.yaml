title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1271/2012 of 21 December 2012
    derogating from certain provisions of Regulation (EC) No 1122/2009 as regards
    the possibilities for lodging applications for aid under the single payment scheme
    for 2012 and for allocation of payment entitlements, or increase of their unit
    value, from the national reserve in 2012, and as regards contents of the single
    application, of Regulation (EC) No 1120/2009 as regards the declaration of payment
    entitlements in 2012 and of Council Regulation (EC) No 73/2009 as regards the
    verification of eligibility conditions before payments and the date at which parcels
    need to be at the disposal of farmers
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 1271/2012 de la Commission du 21 décembre
    2012 dérogeant à certaines dispositions du règlement (CE) n ° 1122/2009 en
    ce qui concerne les possibilités de dépôt de demandes d’aide au titre du
    régime de paiement unique pour l’année 2012 et d’attribution de droits au
    paiement ou d’augmentation de leur valeur unitaire, provenant de la réserve
    nationale en 2012, et en ce qui concerne le contenu de la demande unique, du règlement
    (CE) n ° 1120/2009 en ce qui concerne la déclaration de droits au paiement en
    2012 et du règlement (CE) n ° 73/2009 du Conseil en ce qui concerne la vérification
    des conditions d’admissibilité avant le paiement et la date à laquelle les
    parcelles doivent se trouver à la disposition des agriculteurs
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1271/2012 der Kommission vom 21. Dezember
    2012 zur Abweichung von bestimmten Vorschriften der Verordnung (EG) Nr. 1122/2009
    hinsichtlich der Möglichkeiten für die Einreichung von Beihilfeanträgen im
    Rahmen der Betriebsprämienregelung für das Jahr 2012 und von Anträgen auf Zuweisung
    bzw. Werterhöhung von Zahlungsansprüchen aus der nationalen Reserve sowie hinsichtlich
    des Inhalts des Sammelantrags, zur Abweichung von der Verordnung (EG) Nr. 1120/2009
    hinsichtlich der Anmeldung von Zahlungsansprüchen im Jahr 2012 und zur Abweichung
    von der Verordnung (EG) Nr. 73/2009 des Rates hinsichtlich der Prüfung der Beihilfevoraussetzungen
    vor Leistung der Zahlungen sowie hinsichtlich des Zeitpunkts, zu dem die Parzellen
    den Betriebsinhabern zur Verfügung stehen müssen
  type: main
