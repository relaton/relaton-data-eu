title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/854 of 7 May 2025 concerning
    a coordinated multiannual control programme of the Union for 2026, 2027 and 2028
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
    and repealing Implementing Regulation (EU) 2024/989
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/854 de la Commission du 7 mai 2025
    concernant un programme de contrôle, pluriannuel et coordonné, de l’Union
    pour 2026, 2027 et 2028 destiné à garantir le respect des limites maximales
    de résidus de pesticides dans et sur les denrées alimentaires d’origine végétale
    et animale et à évaluer l’exposition du consommateur à ces résidus, et abrogeant
    le règlement d’exécution (UE) 2024/989
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/854 der Kommission vom 7. Mai 2025 über
    ein mehrjähriges koordiniertes Kontrollprogramm der Union für 2026, 2027 und
    2028 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    und zur Bewertung der Verbraucherexposition gegenüber Pestizidrückständen in
    und auf Lebensmitteln pflanzlichen und tierischen Ursprungs sowie zur Aufhebung
    der Durchführungsverordnung (EU) 2024/989
  type: main
