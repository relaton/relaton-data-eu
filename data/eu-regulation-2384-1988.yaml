title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2384/88 of 29 July 1988 determining the
    extent to which applications lodged in July 1988 for the issue of import licences
    in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2384/88 de la Commission, du 29 juillet 1988, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importations déposées au mois de juillet 1988 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2384/88 der Kommission vom 29. Juli 1988 über den
    Umfang, in dem den im Monat Juli 1988 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2384/88 af 29. juli 1988 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i juli måned 1988 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2384/88 της Επιτροπής
    της 29ης Ιουλίου 1988 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Ιούλιο του 1988, για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2384/88 della Commissione, del 29 luglio 1988, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di luglio 1988 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2384/88 van de Commissie van 29 juli 1988 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand juli
    1988 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2384/88 da Comissão, de 29 de Julho de 1988, que
    determina em que medida pode ser dado seguimento aos pedidos de concessão de
    certificados de importação entregues no mês de Julho de 1988 para as carnes
    de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2384/88 de la Comisión, de 29 de julio de 1988, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación, presentadas en el mes de julio de 1988, para las
    carnes de vacuno congeladas destinadas a la transformación
  type: main
