title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1597/89 of 8 June 1989 re-establishing the
    levying of customs duties on men's jackets, other than knitted or crocheted, products
    of category No 17 (order No 40.0170), and table linen, toilet and kitchen linen,
    other than knitted or crocheted, products of category No 39 (order No 40.0390),
    originating in India to which the preferential tariff arrangements of Council
    Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1597/89 de la Commission du 8 juin 1989 portant rétablissement
    de la perception des droits de douane applicables aux vestes autres qu'en bonneterie
    pour hommes, de la catégorie de produits n° 17 (numéro d'ordre 40.0170), et
    au linge de table, de toilette ou de cuisine, autre qu'en bonneterie, de la catégorie
    de produits n° 39 (numéro d'ordre 40.0390), originaires de l'Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1597/89 DER KOMMISSION vom 8. Juni 1989 zur Wiedereinführung
    des Zollsatzes für Sakkos, andere als aus Gewirken, für Männer, der Warenkategorie
    Nr. 17 (lfd. Nr. 40.0170) sowie Tischwäsche, Wäsche zur Körperpflege und Haushaltswäsche,
    andere als aus Gewirken, der Warenkategorie Nr. 39 (lfd. Nr. 40.0390) mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1597/89 af 8. juni 1989 om genindførelse
    af opkrævning af toldafgifter for jakker, ikke af trikotage, til mænd, under
    varekategori nr. 17 (løbenummer 40.0170) og dækketøj, håndklæder, vaskeklude,
    viskestykker og lignende køkkentekstiler, ikke af trikotage, under varekategori
    nr. 39 (løbenummer 40.0390), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
