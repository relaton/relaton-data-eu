title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 539/68 du Conseil, du 29 avril 1968, fixant pour la
    campagne 1968/1969 les principaux centres de commercialisation des céréales
    et les prix d'intervention dérivés s'y rapportant, ainsi que le prix d'intervention
    pour le maïs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 539/68 des Rates vom 29. April 1968 zur Festlegung
    der wesentlichsten Handelsplätze für Getreide und der für diese Handelsplätze
    geltenden abgeleiteten Interventionspreise sowie des Interventionspreises für
    Mais für das Wirtschaftsjahr 1968/1969
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 539/68 del Consiglio, del 29 aprile 1968, che fissa
    per la campagna 1968/1969, i principali centri di commercializzazione dei cereali
    e i relativi prezzi d'intervento derivati, nonché il prezzo d'intervento per
    il granturco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 539/68 van de Raad van 29 april 1968 tot vaststelling,
    voor het verkoopseizoen 1968/1969, van de voornaamste commercialisatiecentra voor
    granen, de voor deze centra geldende afgeleide interventieprijzen, alsmede de
    interventieprijs voor maïs
