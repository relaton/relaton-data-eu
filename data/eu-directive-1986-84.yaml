title:
- language: en
  script: Latn
  content: Council Directive 86/84/EEC of 25 February 1986 amending, on account of
    the accession of Spain and Portugal, Directive 76/625/EEC concerning the statistical
    surveys to be carried out by the Member States in order to determine the production
    potential of plantations of certain species of fruit trees
  type: main
- language: fr
  script: Latn
  content: Directive 86/84/CEE du Conseil du 25 février 1986 modifiant, en raison
    de l'adhésion de l'Espagne et du Portugal, la directive 76/625/CEE concernant
    les enquêtes statistiques à effectuer par les États membres en vue de déterminer
    le potentiel de production des plantations de certaines espèces d'arbres fruitiers
  type: main
- language: de
  script: Latn
  content: Richtlinie 86/84/EWG des Rates vom 25. Februar 1986 zur durch den Beitritt
    Spaniens und Portugals bedingten Änderung der Richtlinie 76/625/EWG über die
    von den Mitgliedstaaten durchzuführenden statistischen Erhebungen zur Ermittlung
    des Produktionspotentials bestimmter Baumobstanlagen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 86/84/EØF af 25. februar 1986 om ændring, som følge
    af Spaniens og Portugals tiltrædelse, af direktiv 76/625/EØF om statistiske
    undersøgelser, der skal foretages af medlemsstaterne for at bestemme produktionskapaciteten
    for plantager med visse arter af frugttræer
  type: main
- language: el
  script: Grek
  content: Οδηγία 86/84/ΕΟΚ του Συμβουλίου της 25ης Φεβρουαρίου
    1986 για την τροποποίηση, λόγω της προσχώρησης
    της Ισπανίας και της Πορτογαλίας, της οδηγίας
    76/625/ΕΟΚ περί των στατιστικών ερευνών που θα
    διενεργηθούν από τα κράτη μέλη για τον προσδιορισμό
    του δυναμικού παραγωγής των δενδρώνων ορισμένων
    ειδών οπωροφόρων δένδρων
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 86/84/ETY, annettu 25 päivänä helmikuuta 1986,
    tilastotietojen keruusta jäsenvaltioissa tiettyjen hedelmälajien viljelmien
    uotantomahdollisuuksien määrittämiseksi annetun direktiivin 76/625/ETY muuttamisesta
    Espanjan ja Portugalin liittymisen vuoksi
  type: main
- language: it
  script: Latn
  content: Direttiva 86/84/CEE del Consiglio del 25 febbraio 1986 che modifica, a
    seguito dell'adesione della Spagna e del Portogallo, la direttiva 76/625/CEE relativa
    alle indagini statistiche da effettuarsi da parte degli Stati Membri per determinare
    il potenziale di produzione delle piantagioni di alcune specie di alberi da frutto,
    a seguito dell'adesione della Spagna e del Portogallo
  type: main
- language: nl
  script: Latn
  content: Richtlijn 86/84/EEG van de Raad van 25 februari 1986 tot wijziging, in
    verband met de toetreding van Spanje en Portugal, van Richtlijn 76/625/EEG betreffende
    de door de Lid-Staten te houden statistische enquêtes, ten einde het produktiepotentieel
    van bepaalde soorten fruitbomen vast te stellen
  type: main
- language: pt
  script: Latn
  content: Directiva 86/84/CEE do Conselho de 25 de Fevereiro de 1986 que altera,
    na sequência da adesão de Espanha e de Portugal, a Directiva 76/625/CEE relativa
    aos inquéritos estatísticos a efectuar pelos Estados-Membros tendo em vista
    determinar o potencial de produção das plantações de certas espécies de árvores
    de fruta
  type: main
- language: es
  script: Latn
  content: Directiva 86/84/CEE del Consejo de 25 de febrero de 1986 por la que se
    modifica, con motivo de la adhesión de España y de Portugal, la Directiva 76/625/CEE
    relativa a las encuestas estadísticas que habrán de efectuar los Estados Miembros
    para determinar el potencial de producción de las plantaciones de determinadas
    especies de árboles frutales
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 86/84/EEG av den 25 februari 1986 om ändring, med anledning
    av Spaniens och Portugals anslutning, av direktiv 76/625/EEG om de statistiska
    undersökningar som medlemsstaterna skall genomföra för att bestämma produktionskapaciteten
    för odlingar med vissa slag av fruktträd
  type: main
