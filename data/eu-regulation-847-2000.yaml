title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 847/2000 of 27 April 2000 laying down the
    provisions for implementation of the criteria for designation of a medicinal product
    as an orphan medicinal product and definitions of the concepts 'similar medicinal
    product' and 'clinical superiority'
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 847/2000 de la Commission, du 27 avril 2000, établissant
    les dispositions d'application des critères de désignation d'un médicament
    en tant que médicament orphelin et définissant les concepts de «médicament
    similaire» et de «supériorité clinique»
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 847/2000 der Kommission vom 27. April 2000 zur Festlegung
