title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/661 of 28 April 2015 concerning
    the authorisation of the preparation of endo-1,4-beta-xylanase and endo-1,3(4)-beta-glucanase
    produced by Talaromyces versatilis sp. nov. IMI CC 378536 and Talaromyces versatilis
    sp. nov. DSM 26702 as a feed additive for chickens for fattening, chickens reared
    for laying and minor poultry species for fattening and reared for laying (holder
    of the authorisation Adisseo France S.A.S.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2015/661 de la Commission du 28 avril 2015
    concernant l''autorisation d''une préparation d''endo-1,4-β-xylanase et d''endo-1,3(4)-β-glucanase
    produites par Talaromyces versatilis sp. novembre IMI CC 378536 et Talaromyces
    versatilis sp. novembre DSM 26702 en tant qu''additif pour l''alimentation des
    poulets d''engraissement, des poulettes élevées pour la ponte et des espèces
    aviaires mineures destinées à l''engraissement et à la ponte (titulaire de
    l''autorisation: Adisseo France SAS)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2015/661 der Kommission vom 28. April 2015
    zur Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase und Endo-1,3(4)-beta-Glucanase,
    gewonnen aus Talaromyces versatilis sp. nov. IMI CC 378536 und Talaromyces versatilis
    sp. nov. DSM 26702, als Zusatzstoff in Futtermitteln für Masthühner und Junghennen
    sowie Geflügelarten von geringerer wirtschaftlicher Bedeutung für die Mast und
    Jungtiere von Geflügelarten von geringerer wirtschaftlicher Bedeutung für Legezwecke
    (Zulassungsinhaber: Adisseo France S.A.S.)'
