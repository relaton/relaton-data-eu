  content: Council Decision (EU) 2023/940 of 4 May 2023 on the position to be taken
    on behalf of the European Union in the Specialised Committee on Law Enforcement
    and Judicial Cooperation established by the Trade and Cooperation Agreement between
    the European Union and the European Atomic Energy Community, of the one part,
    and the United Kingdom of Great Britain and Northern Ireland, of the other part,
    as regards the establishment of a standard form for requests for mutual assistance
    referred to in Article 635(1) of that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/940 du Conseil du 4 mai 2023 établissant la position
    à prendre au nom de l’Union européenne au sein du comité spécialisé chargé
    de la coopération des services répressifs et judiciaires institué par l’accord
    de commerce et de coopération entre l’Union européenne et la Communauté européenne
    de l’énergie atomique, d’une part, et le Royaume-Uni de Grande-Bretagne et
    d’Irlande du Nord, d’autre part, en ce qui concerne l’établissement du
    formulaire type pour les demandes d’entraide judiciaire visé à l’article
    635, paragraphe 1, dudit accord
  type: main
