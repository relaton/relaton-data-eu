    за бордови системи eCall, основаващи се на телефон
    112, и за допълнение и изменение на Регламент
    (ЕС) 2015/758 на Европейския парламент и на Съвета
    по отношение на освобождаванията и приложимите
    стандарти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2017/79 ze dne 12. září
    2016, kterým se stanoví podrobné technické požadavky a zkušební postupy
    pro ES schválení typu motorových vozidel, pokud jde o jejich palubní systémy
    eCall využívající linku tísňového volání 112 a palubní samostatné technické
    celky a konstrukční části využívající linku tísňového volání 112,
    a kterým se doplňuje a mění nařízení Evropského parlamentu a Rady (EU)
    2015/758, pokud jde o výjimky a použitelné normy
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2017/79 af 12. september 2016
    om fastsættelse af detaljerede tekniske krav og prøvningsprocedurer for EF-typegodkendelse
    af køretøjer med hensyn til deres 112-baserede køretøjsmonterede eCall-systemer,
    af 112-baserede køretøjsmonterede separate tekniske eCall-enheder og -komponenter
    og om supplering og ændring af Europa-Parlamentets og Rådets forordning (EU)
    2015/758 for så vidt angår undtagelser og gældende standarder
  type: main
- language: el
  script: Grek
