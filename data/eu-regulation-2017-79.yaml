  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2017/79, annettu 12 päivänä syyskuuta
    2016, yksityiskohtaisista teknisistä vaatimuksista ja testimenettelyistä moottoriajoneuvojen
    EY-tyyppihyväksyntää varten niiden hätänumeroon 112 perustuvien ajoneuvoon
    asennettavien eCall-järjestelmien osalta ja hätänumeroon 112 perustuvien ajoneuvoon
    asennettavien eCall-järjestelmien erillisten teknisten yksiköiden ja komponenttien
    EY-tyyppihyväksyntää varten sekä Euroopan parlamentin ja neuvoston asetuksen
    (EU) 2015/758 täydentämisestä ja muuttamisesta poikkeusten ja sovellettavien
    standardien osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2017/79 оd 12. rujna 2016. o utvrđivanju
    detaljnih tehničkih zahtjeva i postupaka ispitivanja za EZ homologaciju motornih
    vozila s obzirom na njihove sustave eCall ugrađene u vozilo koji se temelje na
    službi 112 te za EZ homologaciju zasebnih tehničkih jedinica i sastavnih dijelova
    sustava eCall ugrađenih u vozilo koji se temelje na službi 112 te o dopuni i
    izmjeni Uredbe (EU) 2015/758 Europskog parlamenta i Vijeća u pogledu izuzeća
    i primjenjivih normi
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/79 felhatalmazáson alapuló rendelete (2016. szeptember
    12.) a 112-es hívószámú fedélzeti e-segélyhívó rendszer vonatkozásában
    a gépjárművek, valamint a 112-es hívószámú fedélzeti e-segélyhívó alkatrészek
    és önálló műszaki egységek EK-típusjóváhagyására vonatkozó részletes
    műszaki követelmények és vizsgálati eljárások meghatározásáról, valamint
    a mentességek és az alkalmazandó szabványok tekintetében az (EU) 2015/758
    európai parlamenti és tanácsi rendelet kiegészítéséről és módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2017/79 della Commissione, del 12 settembre 2016,
    che stabilisce in dettaglio prescrizioni tecniche e procedure di prova per l'omologazione
    CE dei veicoli a motore per quanto riguarda i relativi sistemi eCall di bordo
    basati sul servizio 112, nonché delle entità tecniche indipendenti e dei componenti
    eCall di bordo basati sul servizio 112, e che integra e modifica il regolamento
    (UE) 2015/758 del Parlamento europeo e del Consiglio per quanto concerne le deroghe
    e le norme applicabili
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2017/79 (2016. gada 12. septembris),
    ar ko nosaka sīki izstrādātas tehniskās prasības un testa procedūras EK
    tipa apstiprinājumam mehāniskajiem transportlīdzekļiem attiecībā uz “112”
    izsaukšanai paredzētām transportlīdzekļa eZvana sistēmām, “112” izsaukšanai
    paredzētām transportlīdzekļa eZvana atsevišķām tehniskām vienībām un
    sastāvdaļām un papildina un groza Eiropas Parlamenta un Padomes Regulu (ES)
    2015/758 attiecībā uz atbrīvojumiem un piemērojamajiem standartiem
  type: main
- language: lt
  script: Latn
  content: 2016 m. rugsėjo 12 d. Komisijos deleguotasis reglamentas (ES) 2017/79,
    kuriuo nustatomi motorinių transporto priemonių EB tipo tvirtinimo išsamūs
    techniniai reikalavimai ir bandymo procedūros, susijusios su jose montuojamomis
    numeriu 112 grindžiamų iškvietų „eCall“ sistemomis ir atskiraisiais techniniais
    jų mazgais bei komponentais, ir kuriuo papildomos ir iš dalies keičiamos Europos
    Parlamento ir Tarybos reglamentas (ES) 2015/758 nuostatos dėl išimčių ir taikomų
    standartų
  type: main
- language: mt
  script: Latn
  content: Regolament delegat tal-Kummissjoni (UE) 2017/79 tat-12 ta' Settembru 2016
    li jistabbilixxi rekwiżiti tekniċi dettaljati u proċeduri ta' ttestjar għall-approvazzjoni
    KE għat-tip ta' vetturi bil-mutur fir-rigward tas-sistemi eCall tagħhom immuntati
    fil-vetturi bbażati fuq is-servizz 112, ta' unitajiet u komponenti tekniċi separati
    tal-eCall immuntati fil-vetturi bbażati fuq is-servizz 112 u li jissupplimenta
    u jemenda r-Regolament (UE) 2015/758 tal-Parlament Ewropew u tal-Kunsill fir-rigward
    tal-eżenzjonijiet u l-istandards applikabbli
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2017/79 van de Commissie van 12 september
    2016 tot vaststelling van gedetailleerde technische voorschriften en testprocedures
    voor de EG-typegoedkeuring van motorvoertuigen met betrekking tot op 112 gebaseerde
    eCall-boordsystemen, op 112 gebaseerde eCall-boordsystemen als technische eenheden,
    evenals onderdelen daarvan, en tot aanvulling en wijziging van Verordening (EU)
    2015/758 van het Europees Parlement en de Raad met betrekking tot de vrijstellingen
    en de toepasselijke normen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2017/79 z dnia 12 września 2016
    r. ustanawiające szczegółowe wymogi techniczne i procedury badań w zakresie
    homologacji typu WE pojazdów silnikowych w odniesieniu do ich systemów pokładowych
    eCall opartych na numerze 112, pokładowych oddzielnych zespołów technicznych
    i komponentów opartych na numerze 112 eCall oraz uzupełniające i zmieniające
    rozporządzenie Parlamentu Europejskiego i Rady (UE) 2015/758 w odniesieniu do
    wyłączeń i mających zastosowanie norm
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2017/79 da Comissão, de 12 de setembro de 2016,
    que estabelece requisitos técnicos e procedimentos de ensaio detalhados para
    a homologação CE de veículos a motor no que diz respeito aos seus sistemas
    eCall a bordo com base no número 112, de unidades técnicas e componentes eCall
    a bordo com base no número 112 e que complementa e altera o Regulamento (UE)
    2015/758 do Parlamento Europeu e do Conselho no que se refere às isenções e
    às normas aplicáveis
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2017/79 al Comisiei din 12 septembrie 2016 de
    stabilire a cerințelor tehnice detaliate și a procedurilor de încercare pentru
    omologarea CE de tip a autovehiculelor în ceea ce privește sistemele eCall bazate
    pe serviciul 112 instalate la bordul vehiculelor, a componentelor și a unităților
    tehnice separate eCall bazate pe serviciul 112 instalate la bordul vehiculelor,
    precum și de completare și de modificare a Regulamentului (UE) 2015/758 al Parlamentului
    European și al Consiliului în ceea ce privește derogările și standardele
    aplicabile
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2017/79 z 12. septembra 2016, ktorým
    sa stanovujú podrobné technické požiadavky a skúšobné postupy pre typové
    schválenie ES motorových vozidiel, pokiaľ ide o ich palubné systémy eCall
    využívajúce tiesňovú linku 112, a samostatných technických jednotiek a
    komponentov palubného systému eCall využívajúceho tiesňovú linku 112, a
    ktorým sa dopĺňa a mení nariadenie Európskeho parlamentu a Rady (EÚ) 2015/758,
    pokiaľ ide o výnimky a uplatniteľné normy
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2017/79 z dne 12. septembra 2016 o določitvi
    podrobnih tehničnih zahtev in preskusnih postopkov za ES-homologacijo motornih
    vozil v zvezi z njihovimi sistemi, samostojnimi tehničnimi enotami in sestavnimi
    deli eCall, vgrajenimi v vozilo, kot storitvijo številke 112 ter o dopolnitvi
    in spremembi Uredbe (EU) 2015/758 Evropskega parlamenta in Sveta v zvezi z izvzetji
    in veljavnimi standardi
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2017/79 de la Comisión, de 12 de septiembre de
    2016, que establece los requisitos técnicos detallados y los procedimientos de
    ensayo para la homologación de tipo CE de los vehículos de motor con respecto
    a sus sistemas eCall basados en el número 112 integrados en el vehículo, así
    como de las unidades técnicas independientes y los componentes eCall basados
    en el número 112 integrados en el vehículo, y que complementa y modifica el
    Reglamento (UE) 2015/758 del Parlamento Europeo y del Consejo en lo relativo a
    las exenciones y las normas aplicables
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2017/79 av den 12 september 2016
    om fastställande av detaljerade tekniska krav och provningsförfaranden för
    EG-typgodkännande av motorfordon med avseende på deras 112-baserade eCall-system
    ombord, av 112-baserade eCall-system som separata tekniska enheter och av komponenter
    till 112-baserade eCall-system samt om komplettering och ändring av Europaparlamentets
    och rådets förordning (EU) 2015/758 vad gäller undantag och tillämpliga standarder
  type: main
