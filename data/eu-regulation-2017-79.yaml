title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2017/79 of 12 September 2016 establishing
    detailed technical requirements and test procedures for the EC type-approval of
    motor vehicles with respect to their 112-based eCall in-vehicles systems, of 112-based
    eCall in-vehicle separate technical units and components and supplementing and
    amending Regulation (EU) 2015/758 of the European Parliament and of the Council
    with regard to the exemptions and applicable standards
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2017/79 de la Commission du 12 septembre 2016
    fixant les exigences techniques détaillées et les essais pour la réception
    CE par type de véhicules en ce qui concerne leurs systèmes eCall embarqués
    fondés sur le numéro 112 et pour la réception CE par type des composants et
    entités techniques des systèmes eCall embarqués fondés sur le numéro 112
    et complétant et modifiant le règlement (UE) 2015/758 du Parlement européen
    et du Conseil eu égard aux exemptions et aux normes applicables
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2017/79 der Kommission vom 12. September 2016
    zur Festlegung detaillierter technischer Anforderungen und Prüfverfahren für
    die EG-Typgenehmigung von Kraftfahrzeugen hinsichtlich ihrer auf dem 112-Notruf
    basierenden bordeigenen eCall-Systeme, von auf dem 112-Notruf basierenden bordeigenen
    selbstständigen technischen eCall-Einheiten und Bauteilen und zur Ergänzung
    und Änderung der Verordnung (EU) 2015/758 des Europäischen Parlaments und des
    Rates im Hinblick auf die Ausnahmen und die anzuwendenden Normen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2017/79 на Комисията
