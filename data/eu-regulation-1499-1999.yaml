title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1499/1999 of 8 July 1999 determining to what
    extent applications for the right to import for bulls, cows and heifers of certain
    Alpine and mountain breeds pursuant to Regulation (EC) No 1081/1999 can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1499/1999 de la Commission, du 8 juillet 1999, déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au titre du règlement (CE) n° 1081/1999 relatif à l'importation
    de taureaux, vaches et génisses de certaines races alpines et de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1499/1999 der Kommission vom 8. Juli 1999 zur Bestimmung
    des Umfangs, in dem den gemäß der Verordnung (EG) Nr. 1081/1999 gestellten Anträgen
    auf Einfuhrrechte für Stiere, Kühe und Färsen bestimmter Höhenrassen stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1499/1999 af 8. juli 1999 om det omfang,
    i hvilket der kan imødekommes ansøgninger om ret til import, som er indgivet
    under forordning (EF) nr. 1081/1999 vedrørende import af tyre, køer og kvier
    af bestemte alpine racer og bjergracer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1499/1999 της Επιτροπής,
    της 8ης Ιουλίου 1999, περί καθορισμού του βαθμού
    στον οποίο μπορεί να δοθεί συνέχεια στις αιτήσεις
    χορήγησης δικαιωμάτων εισαγωγής οι οποίες
    κατατίθενται βάσει του κανονισμού (ΕΚ) αριθ.
    1081/1999 σχετικά με την εισαγωγή ταύρων, αγελάδων
    και δαμάλεων ορισμένων αλπικών και ορεσίβιων
    φυλών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1499/1999, annettu 8 päivänä heinäkuuta 1999,
    asetuksen (EY) N:o 1081/1999 mukaisesti jätettyjen tiettyihin alppi- ja vuoristorotuihin
    kuuluvia sonneja, lehmiä ja hiehoja koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1499/1999 della Commissione, dell'8 luglio 1999, che
    stabilisce in che misura possono essere accolte le domande di diritti d'importazione
    presentate nel quadro del regolamento (CE) n. 1081/1999 relativo all'importazione
    di tori, vacche e giovenche di alcune razze alpine e di montagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1499/1999 van de Commissie van 8 juli 1999 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om rechten op invoer
    die zijn ingediend op grond van Verordening (EG) nr. 1081/1999 betreffende de
    invoer van stieren, koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1499/1999 da Comissão, de 8 de Julho de 1999, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) n° 1081/1999 relativo à importação
    de touros, de vacas e de novilhas de determinadas raças alpinas e de montanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1499/1999 de la Comisión, de 8 de julio de 1999, por
