    agrikoli u li jħassar ir-Regolamenti tal-Kunsill (KEE) Nru 922/72, (KEE) Nru
    234/79, (KE) Nru 1037/2001 u (KE) Nru 1234/2007
  type: main
- language: nl
  script: Latn
