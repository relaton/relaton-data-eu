    продукти и за отмяна на регламенти (ЕИО) № 922/72,
    (ЕИО) № 234/79, (ЕО) № 1037/2001 и (ЕО) № 1234/2007
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) č. 1308/2013 ze dne 17.
