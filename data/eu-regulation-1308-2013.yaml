    de los productos agrarios y por el que se derogan los Reglamentos (CEE) n ° 922/72,
    (CEE) n ° 234/79, (CE) n ° 1037/2001 y (CE) n ° 1234/2007
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) nr 1308/2013 av den 17
