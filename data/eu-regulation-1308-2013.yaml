title:
- language: en
  script: Latn
  content: Regulation (EU) No 1308/2013 of the European Parliament and of the Council
    of 17 December 2013 establishing a common organisation of the markets in agricultural
    products and repealing Council Regulations (EEC) No 922/72, (EEC) No 234/79, (EC)
    No 1037/2001 and (EC) No 1234/2007
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 1308/2013 du Parlement européen et du Conseil du
    17 décembre 2013 portant organisation commune des marchés des produits agricoles
    et abrogeant les règlements (CEE) n ° 922/72, (CEE) n ° 234/79, (CE) n ° 1037/2001
    et (CE) n ° 1234/2007 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 1308/2013 des Europäischen Parlaments und des Rates
    vom 17. Dezember 2013 über eine gemeinsame Marktorganisation für landwirtschaftliche
    Erzeugnisse und zur Aufhebung der Verordnungen (EWG) Nr. 922/72, (EWG) Nr. 234/79,
    (EG) Nr. 1037/2001 und (EG) Nr. 1234/2007
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 1308/2013 на Европейския парламент
