    (EEG) nr. 234/79, (EG) nr. 1037/2001 en (EG) nr. 1234/2007 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 1308/2013 z dnia
    17 grudnia 2013 r. ustanawiające wspólną organizację rynków produktów rolnych
    oraz uchylające rozporządzenia Rady (EWG) nr 922/72, (EWG) nr 234/79, (WE) nr
    1037/2001 i (WE) nr 1234/2007
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 1308/2013 do Parlamento Europeu e do Conselho, de
