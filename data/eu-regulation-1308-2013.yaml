    výrobkami, a ktorým sa zrušujú nariadenia Rady (EHS) č. 922/72, (EHS) č.
    234/79, (ES) č. 1037/2001 a (ES) č. 1234/2007
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) št. 1308/2013 Evropskega parlamenta in Sveta z dne 17. decembra
