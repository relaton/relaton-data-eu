    produkty a zrušují nařízení Rady (EHS) č. 922/72, (EHS) č. 234/79, (ES)
    č. 1037/2001 a (ES) č. 1234/2007
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) nr. 1308/2013 af 17. december
    2013 om en fælles markedsordning for landbrugsprodukter og om ophævelse af Rådets
    forordning (EØF) nr. 922/72, (EØF) nr. 234/79, (EF) nr. 1037/2001 og (EF) nr.
    1234/2007
  type: main
