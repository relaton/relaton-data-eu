    produtos agrícolas e que revoga os Regulamentos (CEE) n. ° 922/72, (CEE) n.
    ° 234/79, (CE) n. ° 103797/2001, (CE) n. ° 1234/2007 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 1308/2013 al Parlamentului European și al Consiliului
    din 17 decembrie 2013 de instituire a unei organizări comune a piețelor produselor
    agricole și de abrogare a Regulamentelor (CEE) nr. 922/72, (CEE) nr. 234/79,
    (CE) nr. 1037/2001 și (CE) nr. 1234/2007 ale Consiliului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) č. 1308/2013 zo 17. decembra
