    és a 922/72/EGK, a 234/79/EK, az 1037/2001/EK és az 1234/2007/EK tanácsi rendelet
    hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 1308/2013 del Parlamento europeo e del Consiglio, del
    17 dicembre 2013 , recante organizzazione comune dei mercati dei prodotti agricoli
    e che abroga i regolamenti (CEE) n. 922/72, (CEE) n. 234/79, (CE) n. 1037/2001
    e (CE) n. 1234/2007 del Consiglio
  type: main
- language: lv
  script: Latn
