    modifiant l'annexe I de la décision 2012/137/UE en ce qui concerne l'inscription
    du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord et de certaines dépendances
    de la Couronne sur les listes des pays tiers ou parties de pays tiers en provenance
    desquels l'introduction dans l'Union de sperme d'animaux de l'espèce porcine
    est autorisée [notifiée sous le numéro C(2019) 2841]
  type: main
