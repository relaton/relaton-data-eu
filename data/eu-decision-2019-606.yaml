title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/606 of 11 April 2019 amending
    Annex I to Decision 2012/137/EU as regards the inclusion of the United Kingdom
    of Great Britain and Northern Ireland and certain of its Crown Dependencies in
    the lists of third countries or parts thereof authorised for the introduction
    into the Union of semen of domestic animals of the porcine species (notified under
    document C(2019) 2841)
  type: main
- language: fr
  script: Latn
