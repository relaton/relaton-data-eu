  content: Règlement (CEE) n° 2820/72 de la Commission, du 22 décembre 1972, déterminant
    les montants des éléments mobiles et les droits additionnels applicables, pendant
    le premier trimestre de l'année 1973, à l'importation dans la Communauté des
    marchandises relevant du règlement (CEE) n° 1059/69 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2820/72 der Kommission vom 22. Dezember 1972 zur Festsetzung
    der Höhe der im ersten Vierteljahr 1973 bei der Einfuhr der unter die Verordnung
    (EWG) Nr. 1059/69 des Rates fallenden Waren in die Gemeinschaft anwendbaren beweglichen
    Teilbeträge und Zusatzzölle
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2820/72 della Commissione, del 22 dicembre 1972, che
