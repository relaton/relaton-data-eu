title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3770/86 of 10 December 1986 derogating,
    for the 1986/87 marketing year, from Regulation (EEC) No 1562/85 in respect of
    the time for concluding contracts for the marketing of products processed from
    lemons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3770/86 de la Commission du 10 décembre 1986 dérogeant
    pour la campagne 1986/1987 au règlement (CEE) n° 1562/85 en ce qui concerne
    la date limite de conclusion des contrats pour la commercialisation des produits
    transformés à base de citrons
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3770/86 der Kommission vom 10. Dezember 1986 zur Abweichung
    für das Wirtschaftsjahr 1986/87 von der Verordnung (EWG) Nr. 1562/85 hinsichtlich
    des Endtermins für den Abschluß der Verträge betreffend die Vermarktung von
    Verarbeitungserzeugnissen aus Zitronen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3770/86 af 10. december 1986 om undtagelse
    fra forordning (EØF) nr. 1562/85 for produktionsåret 1986/87 for så vidt angår
    fristen for indgåelse af kontrakter vedrørende afsætning af produkter forarbejdet
    på basis af citroner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3770/86 της Επιτροπής
    της 10ης Δεκεμβρίου 1986 που παρεκκλίνει, για
    την περίοδο 1986/87 από τον κανονισμό (ΕΟΚ) αριθ.
    1562/85, όσον αφορά την ημερομηνία λήξης της προθεσμίας
    για τη σύναψη συμβάσεων περί των λεπτομερειών
    εμπορίας των μεταποιημένων προϊόντων με βάση
    τα λεμόνια
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3770/86 della Commissione del 10 dicembre 1986 recante
    deroga, per la campagna 1986/1987, al regolamento (CEE) n. 1562/85 per quanto
    concerne il termine ultimo per la stipula dei contratti per la commercializzazione
    dei prodotti trasformati a base di limoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3770/86 van de Commissie van 10 december 1986 waarbij
    voor het verkoopseizoen 1986/1987 wordt afgeweken van Verordening (EEG) nr. 1562/85
    ten aanzien van de uiterste datum voor het sluiten van contracten voor de afzet
    van op basis van citroenen verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3770/86 da Comissão de 10 de Dezembro de 1986 que
    derroga para a campanha de 1986/1987 o Regulamento (CEE) n.° 1562/85 no que respeita
    ao prazo de celebração dos contratos para a comercialização dos produtos transformados
    à base de limões
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3770/86 de la Comisión de 10 de diciembre de 1986
    por el que se introduce, para la campaña de 1986/87, una excepción al Reglamento
    (CEE) n° 1562/85 por lo que se refiere a la fecha límite de celebración de
    contratos para la comercialización de los productos transformados a base de limones
  type: main
