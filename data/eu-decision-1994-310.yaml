  script: Latn
  content: '94/310/EC: Commission Decision of 18 May 1994 amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorize
    imports of bovine animals, swine, equidae, sheep and goats, fresh meat and meat
    products'
  type: main
- language: fr
  script: Latn
  content: '94/310/CE: Décision de la Commission du 18 mai 1994 modifiant la décision
    79/542/CEE du Conseil établissant une liste des pays tiers en provenance desquels
    les États membres autorisent l''importation des animaux des espèces bovine,
    porcine, des équidés, des ovins et des caprins, des viandes fraîches et des
    produits à base de viande'
  type: main
- language: de
  script: Latn
