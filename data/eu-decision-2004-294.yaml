title:
- language: en
  script: Latn
  content: '2004/294/EC: Council Decision of 8 March 2004 authorising the Member States
    which are Contracting Parties to the Paris Convention of 29 July 1960 on Third
    Party Liability in the Field of Nuclear Energy to ratify, in the interest of the
    European Community, the Protocol amending that Convention, or to accede to it'
  type: main
- language: fr
  script: Latn
  content: '2004/294/CE: Décision du Conseil du 8 mars 2004 autorisant les États
    membres qui sont parties contractantes à la convention de Paris du 29 juillet
    1960 sur la responsabilité civile dans le domaine de l''énergie nucléaire à
    ratifier, dans l''intérêt de la Communauté européenne, le protocole portant
    modification de ladite convention, ou à y adhérer'
  type: main
- language: de
  script: Latn
  content: '2004/294/EG: Entscheidung des Rates vom 8. März 2004 zur Ermächtigung
    der Mitgliedstaaten, die Vertragsparteien des Pariser Übereinkommens vom 29.
    Juli 1960 über die Haftung gegenüber Dritten auf dem Gebiet der Kernenergie
    sind, das Änderungsprotokoll zu diesem Übereinkommen im Interesse der Gemeinschaft
    zu ratifizieren oder diesem beizutreten'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 8 март 2004 година за
    упълномощаване на държавите-членки, които
    са договарящи се страни по Парижката конвенция
    от 29 юли 1960 година относно гражданската отговорност
    в областта на атомната енергия, да ратифицират
    в интерес на Европейската общност Протокола
    за изменение на конвенцията или да се присъединят
    към него
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 8. března 2004, kterým se zmocňují členské
