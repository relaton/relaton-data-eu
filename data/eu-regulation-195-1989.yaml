title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 195/89 of 23 January 1989 amending Regulation
    (EEC) No 1581/86 laying down general rules for intervention on the market in cereals
    as regards the conditions under which products may be sold for supply as Community
    food aid
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 195/89 du Conseil du 23 janvier 1989 modifiant le
    règlement (CEE) n° 1581/86 fixant les règles générales de l'intervention
    dans le secteur des céréales, en ce qui concerne les conditions de vente des
    produits à fournir au titre de l'aide alimentaire communautaire
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 195/89 DES RATES vom 23. Januar 1989 zur Änderung
    der Verordnung (EWG) Nr. 1581/86 zur Festlegung der Grundregeln für die Intervention
    bei Getreide hinsichtlich der Bedingungen des Verkaufs von Erzeugnissen, die im
    Rahmen der gemeinschaftlichen Nahrungsmittelhilfe zu liefern sind #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 195/89 af 23. januar 1989 om ændring af
    forordning (EØF) nr. 1581/86 om fastsættelse af de almindelige regler for intervention
    inden for kornsektoren, for så vidt angår betingelserne for salg af produkter,
    der skal leveres som fødevarehjælp fra Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 195/89 του Συμβουλίου
    της 23ης Ιανουαρίου 1989 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1581/86 για τον καθορισμό
    των γενικών όρων παρέμβασης στον τομέα των
    σιτηρών, όσον αφορά τους όρους πώλησης των
    προϊόντων που χορηγούνται ως κοινοτική επισιτιστική
    βοήθεια
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 195/89 DEL CONSIGLIO del 23 gennaio 1989 recante
    modifica del regolamento (CEE) n. 1581/86 che fissa le norme generali dell'' intervento
    nel settore dei cereali, in ordine alle condizioni di vendita dei prodotti destinati
    a forniture di aiuto alimentare comunitario #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 195/89 VAN DE RAAD van 23 januari 1989 tot wijziging
    van Verordening (EEG) nr. 1581/86 tot vaststelling van de algemene voorschriften
    voor interventie in de sector granen, ten aanzien van de verkoopvoorwaarden voor
    in het kader van communautaire voedselhulp te leveren produkten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 195/89 DO CONSELHO de 23 de Janeiro de 1989 que
    altera o Regulamento (CEE) nº 1581/86, que fixa as regras gerais de intervenção
    no sector dos cereais, no que diz respeito às condições de venda dos produtos
    a fornecer ao abrigo da ajuda alimentar comunitária #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 195/89 DEL CONSEJO de 23 de enero de 1989 que modifica
    el Reglamento (CEE) no 1581/86 por el que se fijan las normas generales de intervencion
    en el sector de los cereales, en lo que respecta a las condiciones de venta de
    los productos que vayan a suministrarse en concepto de ayuda alimentaria comunitaria
  type: main
