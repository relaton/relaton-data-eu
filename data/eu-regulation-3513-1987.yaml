    sintetiche, della categoria di prodotti n. 125 A (codice 42.1251), originari del
    Messico beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3513/87 van de Commissie van 23 november 1987 houdende
