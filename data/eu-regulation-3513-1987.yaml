    συνθετικές υφαντικές ίνες, προϊόντα της κατηγορίας
    125 Α (κωδικός 42.1251), καταγωγής Μεξικού, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3925/86 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3513/87 della Commissione del 23 novembre 1987 che
