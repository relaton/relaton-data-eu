title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3513/87 of 23 November 1987 re-establishing
    the levying of customs duties on yarn of synthetic textile fibres, products of
    category 125 A (code 42.1251), originating in Mexico to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3513/87 de la Commission du 23 novembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques de la catégorie de produits n° 125 A (code 42.1251),
    originaires du Mexique, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3513/87 der Kommission vom 23. November 1987 zur Wiedereinführung
    des Zollsatzes für synthetische Spinnfäden der Warenkategorie Nr. 125 A (Kennziffer
    42.1251) mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 3925/86 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3513/87 af 23. november 1987 om genindførelse
    af opkrævning af toldafgifter for garn af syntetiske fibre under varekategori
    nr. 125 A (kode 42.1251), som har oprindelse i Mexico og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
