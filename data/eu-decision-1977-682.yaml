---
id: EUDecision1977682
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 4 July 1977 authorizing the French Republic not
    to apply Community treatment to gloves, knitted or crocheted, not elastic or rubberized,
    falling within heading No 60.02 of the Common Customs Tariff, originating in Taiwan
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/682/CEE: Décision de la Commission, du 4 juillet 1977, autorisant
    la République française à exclure du traitement communautaire les gants de
    bonneterie non élastique ni caoutchoutée, de la position 60.02 du Tarif douanier
    commun, originaires de Taiwan et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. Juli 1977, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch noch
    kautschutiert, der Tarifnummer 60.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. juli 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage handsker, vanter og luffer
    af trikotage, ikke elastiske eller gummerede, der henhører under pos. 60.02 i
    den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 luglio 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i guanti a maglia non elastica
    né gommata della voce 60.02 della tariffa doganale comune, originari di Taiwan
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 juli 1977 waarbij de Franse Republiek
    wordt gemachtigd handschoenen van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk van post nr. 60.02 van het gemeenschappelijk douanetarief, van oorsprong
    uit Taiwan, die in de andere Lid-Staten in het vrije verkeer worden gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
