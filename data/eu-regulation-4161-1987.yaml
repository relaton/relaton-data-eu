title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 4161/87 of 22 December 1987 laying down, consequent
    on the entry into force of the combined nomenclature, the basic duties to be adopted
    within the Community as constituted on 31 December 1985 for the purpose of calculating
    the successive reductions provided for in the Act of Accession of Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 4161/87 du Conseil du 22 décembre 1987 fixant, à
    la suite de l' entrée en vigueur de la nomenclature combinée, les droits de
    base à retenir dans la Communauté dans sa composition au 31 décembre 1985 en
    vue du calcul des réductions successives prévues par l' acte d' adhésion de
    l' Espagne et du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4161/87 des Rates vom 22. Dezember 1987 über die
    Festsetzung der Ausgangszollsätze, die in der Gemeinschaft in ihrer Zusammensetzung
    vom 31. Dezember 1985 infolge des Inkrafttretens der Kombinierten Nomenklatur
    bei der Berechnung der in der Akte über den Beitritt Spaniens und Portugals vorgesehenen
    schrittweise Zollsenkungen zugrunde zu legen sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 4161/87 af 22. december 1987 om fastsættelse,
    efter ikrafttræden af Den Kombinerede Nomenklatur, af de basistoldsatser, som
    skal anvendes i Fællesskabet i dets sammensætning pr. 31. december 1985 ved
    beregning af de successive toldnedsættelser, der er fastsat i Akten vedrørende
    Spaniens og Portugals Tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4161/87 του Συμβουλίου
    της 22ας Δεκεμβρίου 1987 που καθορίζει, κατόπιν
    της ενάρξεως ισχύος της συνδυασμένης ονοματολογίας,
    τους δασμούς βάσης που πρέπει να λαμβάνονται
    υπόψη στην Κοινότητα, με τη σύνθεσή της στις
    31 Δεκεμβρίου 1985, για τον υπολογισμό των διαδοχικών
    μειώσεων που προβλέπονται στην πράξη προσχώρησης
    της Ισπανίας και της Πορτογαλίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 4161/87, annettu 22 päivänä joulukuuta 1987,
    yhdistetyn nimikkeistön voimaantulon johdosta perustulleista vahvistettaviksi
    yhteisössä sellaisena kuin se oli 31 päivänä joulukuuta 1985 Espanjan ja
    Portugalin liittymisasiakirjassa määrättyjen peräkkäisten alennusten laskemista
    varten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4161/87 del Consiglio del 22 dicembre 1987 che stabilisce,
    a seguito dell' entrata in vigore della nomenclatura combinata, i dazi di base
    da adottare nella Comunità nella sua composizione al 31 dicembre 1985 ai fini
    del calcolo delle riduzioni successive previste nell' atto di adesione della Spagna
    e del Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4161/87 van de Raad van 22 december 1987 tot vaststelling
    van de basisrechten die in de Gemeenschap in haar samenstelling per 31 december
    1985 ingevolge de inwerkingtreding van de gecombineerde nomenclatuur moeten worden
    aangehouden bij de berekening van de opeenvolgende verlagingen bedoeld in de Akte
    van Toetreding van Spanje en Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 4161/87 do Conselho de 22 de Dezembro de 1987 relativo
    aos direitos de base na sequência da entrada em vigor da Nomenclatura Combinada
    a considerar na Comunidade, na sua composição em 31 de Dezembro de 1985, com
    vista ao cálculo das reduções sucessivas previstas no Acto de Adesão de Espanha
    e de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 4161/87 del Consejo, de 22 de diciembre de 1987, relativo
    a los derechos de base que se deben tener en cuenta en la Comunidad, en su composición
    al 31 de diciembre de 1985, para el cálculo de las reducciones sucesivas previstas
    en el Acta de adhesión de España y de Portugal, como consecuencia de la entrada
    en vigor de la nomenclatura combinada
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 4161/87 av den 22 december 1987 om fastställande,
    till följd av ikraftträdandet av Gemensamma nomenklaturen, av bastullsatser
    som skall antas inom gemenskapen i dess sammansättning av den 31 december 1985
    för uträkning av de gradvisa sänkningar som föreskrivs i Spaniens och Portugals
    anslutningsakt
  type: main
