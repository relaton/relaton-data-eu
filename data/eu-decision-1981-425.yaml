title:
- language: en
  script: Latn
  content: '81/425/EEC: Commission Decision of 14 April 1981 authorizing the French
    Republic not to apply Community treatment to parkas, anoraks, windcheaters, waisted
    jackets and the like, woven, originating in South Korea and the Philippines (Only
    the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/425/CEE: Décision de la Commission, du 14 avril 1981, autorisant la
    République française à exclure du traitement communautaire les "parkas", anoraks,
    blousons et similaires, tissés, originaires de la Corée du Sud et des Philippines
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/425/EWG: Entscheidung der Kommission vom 14. April 1981 zur Ermächtigung
    der Französischen Republik, aus Südkorea und den Philippinen stammende Parkas,
    Anoraks, Windjacken und dergleichen, aus Geweben, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/425/EØF: Kommissionens beslutning af 14. april 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage parca-coats,
    anorakker, vindjakker, blousonjakker o. l., vævede, med oprindelse i Sydkorea
    og i Philippinerne (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/425/ΕΟΚ: Απόφαση τής Επιτροπής τής 14ης
    Απριλίου 1981 μέ τήν οποία εξουσιοδοτείται η
    Γαλλική Δημοκρατία νά εξαιρέσει από τήν κοινοτική
    μεταχείριση τά parkas, anoraks, μπλουζόν καί τά παρόμοια
    πλεκτά είδη, καταγωγής Νοτίου Κορέας καί Φιλιππίνων
    (Το κείμενο στην γαλλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/425/CEE: Decisione della Commissione, del 14 aprile 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario eskimo, giacche
    a vento e giubbotti, con o senza cappuccio, e simili, tessuti, originari della
    Corea del Sud e delle Filippine (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '81/425/EEG: Beschikking van de Commissie van 14 april 1981 houdende machtiging
    van de Franse Republiek om parka''s, anoraks, windjakken en dergelijke, geweven,
    van oorsprong uit Zuid-Korea en de Filippijnen van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
