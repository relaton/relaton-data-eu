    reikalavimų įgyvendinimo iš dalies keičiamas Reglamentas (ES) Nr. 748/2012
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/1358 tat-2 ta’ Ġunju 2022
