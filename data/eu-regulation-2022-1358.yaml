    přiměřenějších požadavků na letadla používaná pro sportovní a rekreační
    letectví
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1358 af 2. juni 2022 om ændring
    af forordning (EU) nr. 748/2012 for så vidt angår gennemførelsen af mere forholdsmæssigt
    afpassede krav til luftfartøjer, der anvendes til sports- og fritidsflyvning
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/1358
