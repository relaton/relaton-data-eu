  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/1358, annettu 2 päivänä kesäkuuta
    2022, asetuksen (EU) N:o 748/2012 muuttamisesta urheilu- ja harrasteilmailussa
    käytettäviä ilma-aluksia koskevien oikeasuhtaisempien vaatimusten täytäntöönpanon
    osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/1358 ón gCoimisiún an 2 Meitheamh 2022
