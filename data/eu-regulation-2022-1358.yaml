title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1358 of 2 June 2022 amending
    Regulation (EU) No 748/2012 as regards the implementation of more proportionate
    requirements for aircraft used for sport and recreational aviation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1358 de la Commission du 2 juin 2022 modifiant
    le règlement (UE) no 748/2012 en ce qui concerne la mise en œuvre d’exigences
    plus proportionnées pour les aéronefs utilisés pour l’aviation sportive et
    de loisir
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1358 der Kommission vom 2. Juni 2022 zur
    Änderung der Verordnung (EU) Nr. 748/2012 der Kommission im Hinblick auf die
    Umsetzung angemessenerer Anforderungen an Luftfahrzeuge, die im Flugsport und
    in der Freizeitluftfahrt eingesetzt werden
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/1358 на Комисията
