    sportiva u rikreazzjonali
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/1358 van de Commissie van 2 juni 2022
    tot wijziging van Verordening (EU) nr. 748/2012 met betrekking tot de toepassing
    van meer evenredige eisen voor luchtvaartuigen die in de sportieve en recreatieve
    luchtvaart worden gebruikt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/1358 z dnia 2 czerwca 2022
    r. zmieniające rozporządzenie (UE) nr 748/2012 w odniesieniu do wdrożenia bardziej
    proporcjonalnych wymogów dotyczących statków powietrznych wykorzystywanych
    w lotnictwie sportowym i rekreacyjnym
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/1358 da Comissão de 2 de junho de 2022
    que altera o Regulamento (UE) n.o 748/2012 no que respeita à aplicação de requisitos
    mais proporcionados para as aeronaves utilizadas na aviação desportiva e recreativa
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1358 al Comisiei din 2 iunie 2022 de modificare
    a Regulamentului (UE) nr. 748/2012 în ceea ce privește punerea în aplicare
    a unor cerințe mai proporționale pentru aeronavele utilizate în aviația sportivă
    și de agrement
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/1358 z 2. júna 2022, ktorým
    sa mení nariadenie (EÚ) č. 748/2012, pokiaľ ide o vykonávanie primeranejších
    požiadaviek pre lietadlá používané na letecký šport a rekreačné lietanie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1358 z dne 2. junija 2022 o spremembi
    Uredbe (EU) št. 748/2012 glede izvajanja bolj sorazmernih zahtev za zrakoplove,
    ki se uporabljajo v športnem in rekreativnem letalstvu
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/1358 de la Comisión de 2 de junio de 2022
    por el que se modifica el Reglamento (UE) n.o 748/2012 en lo que respecta a la
    aplicación de requisitos más proporcionados para las aeronaves utilizadas en
    la aviación deportiva y recreativa
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1358 av den 2 juni 2022
