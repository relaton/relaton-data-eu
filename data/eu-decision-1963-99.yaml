id: EUDecision196399
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République française à adopter
    des mesures de sauvegarde, en application de l'article 226 du Traité, en faveur
    des réfrigérateurs électro-domestiques; groupes moto-compresseurs hermétiques
    pour réfrigérateurs électro-domestiques; armoires non équipées pour réfrigérateurs
    électro-domestiques; équipements frigorifiques à compression pour réfrigérateurs
    électro-domestiques à éléments constitutifs fixés sur un socle commun ou
    formant corps
  type: main
- language: de
  script: Latn
  content: '63/99/EWG: Entscheidung der Kommission zur Ermächtigung der Französischen
    Republik, in Anwendung von Artikel 226 des Vertrages für elektrische Haushaltskühlschränke,
    hermetische Motorkompressorensätze für elektrische Haushaltskühlschränke,
    nicht eingerichtete Möbel für elektrische Haushaltskühlschränke, Vorrichtungen
    zur Kälteerzeugung mit Kompressionsausrüstung für elektrische Haushaltskühlschränke,
    auf einem gemeinsamen Sockel befestigt oder damit verbunden, Schutzmaßnahmen
    einzuführen'
  type: main
- language: it
  script: Latn
  content: '63/99/CEE: Decisione della Commissione relativa all''autorizzazione alla
    Repubblica francese ad adottare misure di salvaguardia a norma dell''articolo
    226 del Trattato, per i frigoriferi elettrodomestici, per i gruppi motocompressori
    ermetici per frigoriferi elettrodomestici, per gli armadi per frigoriferi elettrodomestici
    non attrezzati di un gruppo frigorifero, per le installazioni frigorifere a compressione
    per frigoriferi elettrodomestici a elementi costitutivi aventi un basamento comune
    o facenti corpo fra loro'
  type: main
- language: nl
  script: Latn
  content: '63/99/EEG: Beschikking van de Commissie houdende machtiging van de Franse
    Republiek op grond van artikel 226 van het Verdrag vrijwaringsmaatregelen te nemen
    ten aanzien van elektrische huishoudkoelkasten, motorcompressoraggregaten in gesloten
    huis voor elektrische huishoudkoelkasten, kasten zonder toebehoren voor elektrische
    huishoudkoelinrichtingen en compressiekoelmachines waarvan de onderdelen op een
    gemeenschappelijk onderstel zijn gemonteerd of een geheel vormen, voor elektrische
    huishoudkoelkasten'
  type: main
