title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 385/90 of 12 February 1990 imposing a definitive
    anti-dumping duty on imports of potassium permanganate originating in Czechoslovakia
    and definitively collecting the provisional anti-dumping duty imposed on those
    imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 385/90 du Conseil du 12 février 1990 instituant un
    droit antidumping définitif sur les importations de permanganate de potassium
    originaire de Tchécoslovaquie et portant perception définitive du droit antidumping
    provisoire institué sur ces importations
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 385/90 DES RATES vom 12. Februar 1990 zur Einfuehrung
    eines endgueltigen Antidumpingzolls auf die Einfuhren von Kaliumpermanganat mit
    Ursprung in der Tschechoslowakei und zur endgueltigen Vereinnahmung des vorlaeufigen
    Antidumpingzolls auf diese Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 385/90 af 12. februar 1990 om indførelse
    af en endelig antidumpingtold på importen af kaliumpermanganat med oprindelse
    i Tjekkoslovakiet og om endelig opkrævning af den midlertidige antidumpingtold
    på denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 385/90 του Συμβουλίου
    της 12ης Φεβρουαρίου 1990 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές υπερμαγγανικού
    καλίου καταγωγής Τσεχοσλοβακίας και την οριστική
    είσπραξη του προσωρινού δασμού αντιντάμπινγκ
    που επιβλήθηκε στις εισαγωγές αυτές
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 385/90, annettu 12 päivänä helmikuuta 1990,
    lopullisen polkumyyntitullin käyttöön ottamisesta Tsekkoslovakiasta peräisin
    olevan kaliumpermanganaatin tuonnissa ja tässä tuonnissa käyttöön otetun
    väliaikaisen polkumyyntitullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 385/90 DEL CONSIGLIO del 12 febbraio 1990 che istituisce
    un dazio antidumping definitivo sulle importazioni di permanganato di potassio
    originario della Cecoslovacchia e che riscuote, a titolo definitivo, il dazio
    antidumping provvisorio istituito su dette importazioni
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 385/90 VAN DE RAAD van 12 februari 1990 houdende
    instelling van een definitief anti-dumpingrecht op de invoer van kaliumpermanganaat
    van oorsprong uit Tsjechoslowakije en definitieve inning van het op deze invoer
    ingestelde voorlopige anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 385/90 DO CONSELHO de 12 de Fevereiro de 1990 que
    institui um direito anti-dumping definitivo sobre as importaçoes de permanganato
    de potassio originarias da Checoslovaquia e determina a cobrança definitiva do
    direito anti-dumping provisorio instituido sobre aquelas importaçoes
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 385/90 DEL CONSEJO de 12 de febrero de 1990 por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    permanganato potasico originarias de Checoslovaquia y se percibe definitivamente
    el derecho antidumping provisional establecido sobre estas importaciones
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 385/90 av den 12 februari 1990 om införande
    av en slutgiltig antidumpningstull på import av kaliumpermanganat med ursprung
    i Tjeckoslovakien och slutgiltigt uttag av den preliminära antidumpningstull
    som fastställts för denna import
  type: main
