title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2474/77 of 9 November 1977 re-establishing
    the levying of customs duties on other articles for electrical lighting fittings
    falling within subheading 70.14 A II, originating in Romania to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2474/77 de la Commission, du 9 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    pour l'équipement des appareils d'éclairage électrique, de la sous-position
    tarifaire 70.14 A II, originaires de Roumanie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2474/77 der Kommission vom 9. November 1977 zur Wiedereinführung
    des Zollsatzes für bestimmte Waren zum Ausstatten von elektrischen Beleuchtungskörpern,
    der Tarifstelle 70.14 A II, mit Ursprung in Rumänien, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2474/77 af 9. november 1977 om genindførelse
    af opkrævning af toldafgifter for bestemte varer, der anvendes som udstyr til
    elektriske belysningsartikler, under pos. 70.14 A II, som har oprindelse i Rumænien
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2474/77 della Commissione, del 9 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli altri oggetti per
    completare gli apparecchi d'illuminazione elettrica della sottovoce doganale 70.14
    A II originari della Romania beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2474/77 van de Commissie van 9 november 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere uitrustingsstukken
    voor elektrische verlichtingsartikelen, van post 70.14 A II, van oorsprong uit
    Roemenië, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
