id: EUDecision1985608
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '85/608/EEC: Commission Decision of 13 December 1985 amending, because
    of the accession of Spain and Portugal, Decision 77/144/EEC laying down the standard
    code and rules governing the transcription into a machine-readable form of the
    data of the surveys of plantations of certain species of fruit trees and laying
    down the boundaries of the production areas for these surveys'
  type: main
- language: fr
  script: Latn
  content: '85/608/CEE: Décision de la Commission du 13 décembre 1985 modifiant
    en raison de l'' adhésion de l'' Espagne et du Portugal la décision 77/144/CEE
    établissant le code et les règles types relatifs à la transcription sous une
    forme lisible par machine des données des enquêtes sur les plantations de certaines
    espèces d'' arbres fruitiers et fixant les limites des zones de production pour
    ces enquêtes'
  type: main
- language: de
  script: Latn
  content: '85/608/EWG: Entscheidung der Kommission vom 13. Dezember 1985 zur Änderung
    nach dem Beitritt Spaniens und Portugals der Entscheidung 77/144/EWG bezüglich
    der Festlegung eines Standardkodes und einer Regelung zur Übertragung der Erhebungsdaten
    über Anlagen gewisser Obstarten in maschinenlesbare Form und zur Festsetzung
    der Abgrenzungen der Produktionszonen'
  type: main
- language: da
  script: Latn
  content: '85/608/EØF: Kommissionens beslutning af 13. december 1985 om ændring
    af beslutning 77/144/EØF om fastsættelse af den standardkode og de regler, der
    gælder for omskrivning til maskinlæsbar form af resultaterne af undersøgelserne
    af plantager med visse arter af frugttræer og om fastsættelse af grænserne
    for produktionszonerne med henblik på disse undersøgelser, på grund af Spaniens
    og Portugals tiltrædelse'
  type: main
- language: el
  script: Grek
  content: '85/608/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Δεκεμβρίου 1985 περί τροποποιήσεως, λόγω της
    προσχώρησης της Ισπανίας και της Πορτογαλίας,
    της απόφασης 77/144/ΕΟΚ που θεσπίζει τον κώδικα
    και τους πρότυπους κανόνες σχετικά με τη μεταγραφή
    σε μορφή αναγνώσιμη από μηχανογραφική μονάδα
    των στοιχείων των ερευνών σχετικά με τις φυτείες
    ορισμένων ειδών οπωροφόρων δένδρων και που
    καθορίζει τα όρια των ζωνών παραγωγής για τις
    έρευνες αυτές'
  type: main
- language: fi
  script: Latn
  content: '85/608/ETY: Komission päätös, tehty 13 päivänä joulukuuta 1985,
    standardikoodista ja -säännöistä, jotka koskevat tiettyjen hedelmälajien
    viljelmiä koskevien tietojen keruiden tulosten siirtoa koneellisesti luettavaan
    muotoon, sekä tuotantoalueiden rajoista tätä tietojen keruuta varten tehdyn
    päätöksen 77/144/ETY muuttamisesta Espanjan ja Portugalin liittymisen vuoksi'
  type: main
- language: it
  script: Latn
  content: '85/608/CEE: Decisione della Commissione del 13 dicembre 1985 che modifica,
    a motivo dell'' adesione della Spagna et del Portogallo, la decisione 77/144/CEE
    che stabilisce il codice standard e le norme per la trascrizione in una forma
    che si presti alla lettura meccanografica dei risultati delle indagini sulle piantagioni
    di alcune specie di alberi da frutto, nonché le delimitazioni delle zone di produzione
    per queste indagini'
  type: main
- language: nl
  script: Latn
  content: '85/608/EEG: Beschikking van de Commissie van 13 december 1985 tot wijziging,
    wegens de toetreding van Spanje en Portugal, van Beschikking 77/144/EEG houdende
    de standaardcode en de voorschriften voor de transcriptie in voor de machine leesbare
    vorm van de gegevens uit de statistische enquêtes ten einde het produktiepotentieel
    van bepaalde soorten fruitbomen vast te stellen, en om de grenzen van de produktiegebieden
    voor deze enquêtes vast te stellen'
  type: main
- language: pt
  script: Latn
  content: '85/608/CEE: Decisão da Comissão, de 13 de Dezembro de 1985, que altera,
    em razão da adesão de Espanha e de Portugal, a Decisão 77/144/CEE que estabelece
    o código e as regras-tipo, relativas à transcrição, em forma legível por
    máquina, dos dados dos inquéritos sobre as plantações de determinadas espécies
    de árvores de fruto e que fixa os limites das zonas de produção para estes
    inquéritos'
  type: main
- language: es
  script: Latn
  content: '85/608/CEE: Decisión de la Comisión, de 13 de diciembre de 1985, por
    la que se modifica, como consecuencia de la adhesión de España y de Portugal,
    la Decisión 77/144/CEE por la que se establecen el código y las normas tipo
    relativas a la transcripción en forma legible por máquina de los datos de las
    encuestas sobre las plantaciones de determinadas especies de frutales y por la
    que se fijan los límites de las zonas de producción de dichas encuestas'
  type: main
- language: sv
  script: Latn
  content: '85/608/EEG: Rådets beslut av den 13 december 1985 om ändring av beslut
    77/144/EEG om fastställandet av en standardkod och bestämmelser för överföring
    till maskinläsbar form av data från de statistiska undersökningarna av odlingar
    med vissa slag av fruktträd samt om fastställandet av produktionsområdenas
    gränser för dessa undersökningar'
  type: main
