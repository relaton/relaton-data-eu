title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1606/76 of 29 June 1976 extending and amending
    Regulation (EEC) No 3576/73 on imports of the wine product exported under the
    label of 'Cyprus Sherry', originating in and coming from Cyprus, and the introduction
    of subsidies for similar wine products produced in the Community as originally
    constituted and exported to Ireland and the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1606/76 du Conseil, du 29 juin 1976, prorogeant et
    modifiant le règlement (CEE) n° 3576/73 relatif à l'importation du produit
    vinicole exporté sous la mention "cyprus sherry", originaire et en provenance
    de Chypre, et instituant des aides pour des produits vinicoles similaires produits
    dans la Communauté dans sa composition originaire et expédiés vers l'Irlande
    et le Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1606/76 des Rates vom 29. Juni 1976 zur Verlängerung
    und Änderung der Verordnung (EWG) Nr. 3576/73 über die Einfuhr des Weinbauerzeugnisses
    mit Ursprung in und Herkunft aus Zypern, das unter der Bezeichnung ,,Cyprus Sherry"
    ausgeführt wird, sowie der Beihilferegelung für gleichartige Weinbauerzeugnisse,
    die in der Gemeinschaft in ihrer ursprünglichen Zusammensetzung erzeugt und nach
    Irland und dem Vereinigten Königreich ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1606/76 af 29. juni 1976 om forlængelse
    og ændring af forordning (EØF) nr. 3576/73 om indførsel af vinprodukter udført
    under betegnelsen »Cyprus Sherry«, der har oprindelse i og indføres fra Cypern,
    og om fastsættelse af en støtteordning for lignende vinprodukter, der er fremstillet
    inden for Fællesskabet i dets oprindelige udstrækning og afsendt til Irland
    og Det forenede Kongerige
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1606/76 del Consiglio, del 29 giugno 1976, che proroga
    e modifica il regolamento (CEE) n. 3576/73 relativo all'importazione del prodotto
    vinicolo esportato sotto la menzione «Cyprus sherry», originario e in provenienza
    da Cipro ed istitutivo di aiuti per prodotti vinicoli simili prodotti nella Comunità
    nella sua composizione originaria e spediti verso l'Irlanda e il Regno Unito
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1606/76 van de Raad van 29 juni 1976 tot verlenging
    en wijziging van Verordening (EEG) nr. 3576/73 betreffende de invoer van het onder
    de naam ,,Cyprus sherry" uitgevoerde wijnbouwprodukt van oorsprong en van herkomst
    uit Cyprus en houdende instelling van steunmaatregelen voor soortgelijke in de
    Gemeenschap in haar oorspronkelijke samenstelling geproduceerde wijnbouwprodukten
    die worden verzonden naar Ierland en het Verenigd Koninkrijk
  type: main
