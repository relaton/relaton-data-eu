id: EURegulation30181978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3018/78 of 21 December 1978 providing for
    a derogation from Regulation (EEC) No 1569/77 with regard to the maximum acceptable
    percentage of 'mitadiné' grains in durum wheat offered to the Italian intervention
    agency during the 1978/79 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3018/78 de la Commission, du 21 décembre 1978, apportant
    une dérogation au règlement (CEE) n° 1569/77 en ce qui concerne le taux maximal
    de grains mitadinés pouvant être accepté lors de la prise en charge du froment
    dur par l' organisme d' intervention en Italie pour la campagne 1978/1979
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3018/78 der Kommission vom 21. Dezember 1978 über
    eine Abweichung von der Verordnung (EWG) Nr. 1569/77 betreffend den Höchstsatz
    von Körnern, die ihr glasiges Aussehen, auch teilweise, verloren haben, der bei
    der Übernahme von Hartweizen durch die italienische Interventionsstelle für
    das Wirtschaftsjahr 1978/79 zugelassen werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3018/78 af 21. december 1978 om en
    undtagelse fra forordning (EØF) nr. 1569/77 for så vidt angår den maksimale
    andel af ikke-glasagtige og delvis ikke-glasagtige kerner, der kan accepteres
    i den hårde hvede, som overtages af det italienske interventionsorgan i produktionsåret
    1978/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3018/78 della Commissione, del 21 dicembre 1978, recante
    una deroga al regolamento (CEE) n. 1569/77 per quanto riguarda la percentuale
    massima di chicchi bianconati che può essere accettata all' atto della presa
    in consegna del frumento duro da parte dell' organismo d' intervento italiano
    per la campagna 1978/1979
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3018/78 van de Commissie van 21 december 1978 houdende
    een afwijking van Verordening (EEG) nr. 1569/77 ten aanzien van het maximaal aandeel
    aan korrels die hun glazig uiterlijk geheel of gedeeltelijk hebben verloren dat
    het Italiaanse interventiebureau tijdens het verkoopseizoen 1978/1979 bij de overneming
    van durum tarwe mag aanvaarden
  type: main
