title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2589/70 du Conseil, du 17 décembre 1970, portant
    ouverture et répartition d'un contingent tarifaire communautaire supplémentaire,
    pour l'année 1970, de ferro-chrome contenant en poids 0,10 % ou moins de carbone
    et plus de 30 % jusqu'à 90 % inclus de chrome (ferro-chrome surrafiné), de la
    sous-position EX 73.02 E I du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2589/70 des Rates vom 17. Dezember 1970 über die
    Eröffnung und Aufteilung eines zusätzlichen Gemeinschaftszollkontingents (für
    das Jahr 1970) für Ferrochrom, mit einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen
    oder weniger und an Chrom von mehr als 30, doch nicht mehr als 90 Gewichtshundertteilen
    (hochraffiniertes Ferrochrom), der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2589/70 del Consiglio, del 17 dicembre 1970, relativo
    all'apertura ed alla ripartizione di un contingente tariffario comunitario supplementare
    di ferro-cromo contenente, in peso, lo 0,10% o meno di carbonio e oltre il 30%
    e sino al 90% incluso di cromo (ferro-cromo superraffinato) della sottovoce ex
    73.02 E I della tariffa doganale comune, per il 1970
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2589/70 van de Raad van 17 december 1970 betreffende
    de opening en de verdeling van een aanvullend communautair tariefcontingent voor
    1970 voor ferrochroom, bevattende 0,10 of minder gewichtspercent koolstof en meer
    dan 30 doch niet meer dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom)
    van onderverdeling ex 73.02 E I van het gemeenschappelijk douanetarief
  type: main
