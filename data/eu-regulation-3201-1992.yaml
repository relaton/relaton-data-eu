title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3201/92 of 27 October 1992 amending Regulation
    (EEC) No 1873/84 authorizing the offer or disposal for direct human consumption
    of certain imported wines which may have undergone oenological processes not provided
    for in Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3201/92 du Conseil, du 27 octobre 1992, modifiant
    le règlement (CEE) n° 1873/84 autorisant l' offre et la livraison à la consommation
    humaine directe de certains vins importés susceptibles d' avoir fait l' objet
    de pratiques ÷nologiques non prévues par le règlement (CEE) n° 822/87
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3201/92 des Rates vom 27. Oktober 1992 zur Änderung
    der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten Weinen,
    bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung (EWG)
    Nr. 822/87 nicht vorgesehenen önologischen Verfahren waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3201/92 af 27. oktober 1992 om ændring af
    forordning (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til direkte
    konsum af visse indførte vine, som eventuelt har været underkastet andre ønologiske
    fremgangsmåder end de i forordning (EØF) nr. 822/87 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3201/92 του Συμβουλίου
    της 27ης Οκτωβρίου 1992 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1873/84 που επιτρέπει την
    προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγόμενων οίνων δυνάμενων
    να αποτελέσουν το αντικείμενο οινολογικών
    πρακτικών που δεν προβλέπονται από τον κανονισμό
    (ΕΟΚ) αριθ. 822/87
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3201/92 del Consiglio, del 27 ottobre 1992, recante
    modifica del regolamento (CEE) n. 1873/84 che autorizza l' offerta e la consegna
    per il consumo umano diretto di taluni vini importati che possono essere stati
    sottoposti a pratiche enologiche non previste dal regolamento (CEE) n. 822/87
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3201/92 van de Raad van 27 oktober 1992 tot wijziging
    van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding of levering
    voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen waarop
    oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij Verordening
    (EEG) nr. 822/87
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3201/92 do Conselho, de 27 de Outubro de 1992, que
    altera o Regulamento (CEE) n° 1873/84, que autoriza a oferta e o fornecimento
    para consumo humano directo de certos vinhos importados susceptíveis de ter sido
    objecto de práticas enológicas não previstas no Regulamento (CEE) n° 822/87
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3201/92 del Consejo, de 27 de octubre de 1992, que
    modifica el Reglamento (CEE) n° 1873/84 por el que se autoriza la oferta y la
    entrega al consumo humano directo de determinados vinos importados que pueden
    haber sido sometidos a prácticas enológicas no prevista en el Reglamento (CEE)
    n° 822/87
  type: main
