  content: 'REGOLAMENTO (CEE) N. 1206/92 DELLA COMMISSIONE dell'' 11 maggio 1992 che
    modifica il regolamento (CEE) n. 3680/91, relativo alla vendita di cereali detenuti
    da alcuni organismi d'' intervento per una fornitura nei territori delle Azzorre
