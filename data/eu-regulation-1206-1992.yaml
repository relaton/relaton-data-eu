  content: Commission Regulation (EEC) No 1206/92 of 11 May 1992 amending Regulation
    (EEC) No 3680/91 on the sale for delivery in Madeira and the Azores of cereals
    held by different intervention agencies, and amending Regulation (EEC) No 3681/91
    fixing the minimum selling prices for the purposes of the standing invitation
    to tender issued by Regulation (EEC) No 3680/91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1206/92 de la Commission du 11 mai 1992 modifiant
    le règlement (CEE) n° 3680/91 relatif à la mise en vente de céréales détenues
    par différents organismes d'intervention en vue d'une livraison dans les territoires
    des Açores et de Madère et modifiant le règlement (CEE) n° 3681/91 relatif
    à la fixation de prix minimaux de vente dans le cadre de l'adjudication permanente
    ouverte par le règlement (CEE) n° 3680/91
  type: main
- language: de
  script: Latn
