title:
- language: en
  script: Latn
  content: '2000/345/EC: Commission Decision of 22 May 2000 setting the date on which
    dispatch from Portugal to Germany of certain products for the purpose of incineration
    may commence by virtue of Article 3(6) of Decision 98/653/EC (notified under document
    number C(2000) 1367)'
  type: main
- language: fr
  script: Latn
  content: '2000/345/CE: Décision de la Commission du 22 mai 2000 fixant la date
    à laquelle peut commencer l''expédition du Portugal vers l''Allemagne de certains
    produits à des fins d''incinération, conformément aux dispositions de l''article
    3, paragraphe 6, de la décision 98/653/CE [notifiée sous le numéro C(2000)
    1367]'
  type: main
- language: de
  script: Latn
  content: '2000/345/EG: Entscheidung der Kommission vom 22. Mai 2000 zur Festsetzung
    des Tages, an dem die Versendung bestimmter Erzeugnisse von Portugal nach Deutschland
    zwecks Verbrennung gemäß Artikel 3 Absatz 6 der Entscheidung 98/653/EG beginnen
    kann (Bekanntgegeben unter Aktenzeichen K(2000) 1367)'
  type: main
- language: da
  script: Latn
  content: '2000/345/EF: Kommissionens beslutning af 22. maj 2000 om fastsættelse
    af datoen for, hvornår forsendelsen fra Portugal til Tyskland af visse produkter
    til forbrænding kan begynde efter artikel 3, stk. 6, i beslutning 98/653/EF (meddelt
    under nummer K(2000) 1367)'
  type: main
- language: el
  script: Grek
  content: '2000/345/ΕΚ: Απόφαση της Επιτροπής, της 22ας
    Μαΐου 2000, περί καθορισμού της ημερομηνίας κατά
    την οποία μπορεί να αρχίσει η αποστολή, από
    την Πορτογαλία προς τη Γερμανία, ορισμένων
    προϊόντων για σκοπούς αποτέφρωσης δυνάμει
    του άρθρου 3 παράγραφος 6 της απόφασης 98/653/ΕΚ
    [κοινοποιηθείσα υπό τον αριθμό Ε(2000) 1367]'
  type: main
- language: fi
  script: Latn
  content: '2000/345/EY: Komission päätös, tehty 22 päivänä toukokuuta 2000,
    sen päivämäärän vahvistamisesta, jolloin tiettyjen tuotteiden toimittaminen
    Portugalista Saksaan poltettaviksi voidaan aloittaa päätöksen 98/653/EY 3 artiklan
    6 kohdan nojalla (tiedoksiannettu numerolla K(2000) 1367)'
  type: main
- language: it
  script: Latn
  content: '2000/345/CE: Decisione della Commissione, del 22 maggio 2000, che stabilisce
    la data alla quale può iniziare la spedizione dal Portogallo alla Germania di
    taluni materiali a scopo di incenerimento, ai sensi dell''articolo 3, paragrafo
    6, della decisione 98/653/CE [notificata con il numero C(2000) 1367]'
  type: main
- language: nl
  script: Latn
  content: '2000/345/EG: Beschikking van de Commissie van 22 mei 2000 tot vaststelling
    van de datum waarop overeenkomstig het bepaalde in artikel 3, lid 6, van Beschikking
    98/653/EG mag worden begonnen met de verzending van bepaalde producten van Portugal
    naar Duitsland voor verbranding (kennisgeving geschied onder nummer C(2000) 1367)'
  type: main
- language: pt
  script: Latn
  content: '2000/345/CE: Decisão da Comissão, de 22 de Maio de 2000, que estabelece
    a data em que pode começar a expedição de Portugal para a Alemanha de certos
    materiais destinados a ser incinerados, ao abrigo do n.o 6 do artigo 3.o da Decisão
    98/653/CE [notificada com o número C(2000) 1367]'
  type: main
- language: es
  script: Latn
  content: '2000/345/CE: Decisión de la Comisión, de 22 de mayo de 2000, por la
    que se fija la fecha en la que, de conformidad con el apartado 6 del artículo
