id: EURegulation6161977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 616/77 of 23 March 1977 re-establishing
    the levying of the customs duties on spoons, forks, fish-eaters, etc. and similar
    kitchen or tableware, of stainless steel, falling within subheading 82.14 A, originating
    in Hong Kong to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 616/77 de la Commission, du 23 mars 1977, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, fourchettes, etc., et articles similaires, en acier inoxydable, de la
    sous-position tarifaire 82.14 A, originaires de Hong-Kong, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 616/77 der Kommission vom 23. März 1977 zur Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen, Gabeln usw. und ähnliche Tischgeräte,
    aus rostfreiem Stahl, der Tarifstelle 82.14 A, mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 616/77 af 23. marts 1977 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler, fiskeknive, etc., og lignende
    artikler, af rustfrit stål, under underposition 82.14 A, som har oprindelse i
    Hongkong og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 616/77 della Commissione, del 23 marzo 1977, che ripristina
    la riscossione dei dazi doganali applicabili ai cucchiai, cucchiaioni, forchette,
    ecc., e oggetti simili, di acciaio inossidabile, della sottovoce doganale 82.14
    A, originari di Hong Kong, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 616/77 van de Commissie van 23 maart 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op lepels,
    pollepels, enz. en dergelijke artikelen, van roestvrij staal, van post 82.14 A,
    van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76
    van de Raad algemene tariefpreferenties werden geopend
  type: main
