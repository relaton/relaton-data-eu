title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1159/78 of 30 May 1978 temporarily suspending
    the autonomous Common Customs Tariff duty for mechanically propelled aircraft
    of an unladen weight exceeding 15 000 kg falling within subheading ex 88.02 B
    II c)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1159/78 du Conseil, du 30 mai 1978, portant suspension
    temporaire du droit autonome du tarif douanier commun pour les avions fonctionnant
    à l'aide d'une machine propulsive d'un poids à vide de plus de 15000 kilogrammes,
    de la sous-position EX 88.02 B II c)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1159/78 des Rates vom 30. Mai 1978 über die zeitweilige
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für Flugzeuge
    für maschinellen Antrieb mit einem Leergewicht von mehr als 15 000 kg der Tarifstelle
    ex 88.02 B II c)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1159/78 af 30. maj 1978 om midlertidig suspension
