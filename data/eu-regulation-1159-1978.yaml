    og med en egenvægt over 15 000 kg, henhørende under pos. ex 88.02 B II c)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1159/78 del Consiglio, del 30 maggio 1978, relativo
    alla sospensione temporanea del dazio autonomo della tariffa doganale comune per
    gli aeroplani funzionanti con macchina propulsiva, del peso a vuoto di più di
    15 000 chilogrammi, della sottovoce ex 88.02 B II c)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1159/78 van de Raad van 30 mei 1978 houdende tijdelijke
    schorsing van het autonome recht van het gemeenschappelijk douanetarief voor vliegtuigen
    functionerende met een voortbewegingsmechanisme, met een leeggewicht van meer
    dan 15 000 kilogram, van post ex 88.02 B II c)
