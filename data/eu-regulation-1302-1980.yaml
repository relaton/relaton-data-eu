    disossate detenute dall' organismo d' intervento irlandese e destinate ad essere
    esportate, recante modifica del regolamento (CEE) n. 1687/76 e abrogazione del
    regolamento (CEE) n. 1023/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1302/80 van de Commissie van 28 mei 1980 betreffende
