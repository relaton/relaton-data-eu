title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1302/80 of 28 May 1980 on the sale at a
    price fixed in advance of boned beef and veal held by the Irish intervention agency
    and intended for export, and amending Regulation (EEC) No 1687/76 and repealing
    Regulation (EEC) No 1023/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1302/80 de la Commission, du 28 mai 1980, relatif
    à la vente à prix fixé forfaitairement à l' avance de certaines viandes bovines
    désossées détenues par l' organisme d' intervention irlandais et destinées
    à être exportées, modifiant le règlement (CEE) n° 1687/76 et abrogeant le
    règlement (CEE) n° 1023/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1302/80 der Kommission vom 28. Mai 1980 über den
    Verkauf von zur Ausfuhr bestimmtem entbeintem Rindfleisch aus Beständen der irischen
    Interventionsstelle zu pauschal im voraus festgesetzten Preisen und zur Änderung
    der Verordnung (EWG) Nr. 1687/76 und zur Aufhebung der Verordnung (EWG) Nr. 1023/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1302/80 af 28. maj 1980 om salg til
    forudfastsat pris med henblik på udførsel af visse former for udbenet oksekød
    fra det irske interventionsorgan, om ændring af forordning (EØF) nr. 1687/76
    og om ophævelse af forordning (EØF) nr. 1023/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1302/80 της Επιτροπής
    της 28ης Μαΐου 1980 περί της πωλήσεως σε τιμή,
    που καθορίζεται κατ’αποκοπή εκ των προτέρων,
    ορισμένων αποστεωμένων βοείων κρεάτων, τα
    οποία κατέχει ο ιρλανδικός οργανισμός παρεμβάσεως
