    laitiers exportés sous forme de marchandises ne relevant pas de l'annexe II du
    traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 830/69 der Kommission vom 30. April 1969 zur Festsetzung
    der ab 1. Mai 1969 geltenden Erstattungssätze bei der Ausfuhr von bestimmten
    Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 830/69 della Commissione, del 30 aprile 1969, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 maggio 1969, a
    taluni prodotti lattiero-caseari esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 830/69 van de Commissie van 30 april 1969 houdende
    vaststelling van de restituties welke vanaf 1 mei 1969 van toepassing zijn op
    bepaalde zuivelprodukten die worden uitgevoerd in de vorm van niet in bijlage
    II van het Verdrag vermelde goederen
