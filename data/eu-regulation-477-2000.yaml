title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 477/2000 of 2 March 2000 fixing the guarantee
    threshold quantities which may be transferred to another group of varieties for
    the 2000 harvest in the raw tobacco sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 477/2000 de la Commission, du 2 mars 2000, fixant les
    quantités de seuil de garantie autorisées à être transférées vers un autre
    groupe de variétés pour la récolte 2000 dans le secteur du tabac brut
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 477/2000 der Kommission vom 2. März 2000 zur Festsetzung
    der Garantieschwellenmengen im Rohtabaksektor, die für die Ernte 2000 auf eine
    andere Sortengruppe übertragen werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 477/2000 af 2. marts 2000 vedrørende
    råtobak og om fastsættelse af de garantitærskelmængder, som det for 2000-høsten
    er tilladt at overføre til en anden sortsgruppe
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 477/2000 της Επιτροπής,
    της 2ας Μαρτίου 2000, για τον καθορισμό των ποσοτήτων
    κατωφλίου εγγύησης που επιτρέπεται να μεταφερθούν
    προς άλλη ομάδα ποικιλιών για τη συγκομιδή
    του 2000 στον τομέα του ακατέργαστου καπνού
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 477/2000, annettu 2 päivänä maaliskuuta 2000,
    toiseen lajikeryhmään siirrettävistä takuukynnysten määristä raakatupakka-alalla
    satovuoden 2000 osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 477/2000 della Commissione, del 2 marzo 2000, che fissa
    i quantitativi del limite di garanzia autorizzati ad essere trasferiti ad un altro
    gruppo di varietà per il raccolto 2000 nel settore del tabacco greggio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 477/2000 van de Commissie van 2 maart 2000 tot vaststelling,
    voor het oogstjaar 2000 in de sector ruwe tabak, van de garantiedrempelhoeveelheden
    die naar een andere soortengroep mogen worden overgedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 477/2000 da Comissão, de 2 de Março de 2000, que
    fixa, em relação à colheita de 2000, as quantidades de limiar de garantia cuja
    transferência para outro grupo de variedades é autorizada, no sector do tabaco
    em rama
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 477/2000 de la Comisión, de 2 de marzo de 2000, por
    el que se fijan, en el sector del tabaco crudo y para la cosecha 2000, las cantidades
    del umbral de garantía que podrán ser transferidas a otro grupo de variedades
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 477/2000 av den 2 mars 2000 om fastställande
    av de garantitröskelkvantiteter som för skörden år 2000 får överföras till
    en annan sortgrupp inom sektorn för råtobak
  type: main
