title:
- language: en
  script: Latn
  content: '80/1236/EEC: Commission Decision of 15 December 1980 amending Decision
    80/266/EEC authorizing Member States to permit temporarily the marketing of forestry
    reproductive material not complying with the requirements of Council Directive
    66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '80/1236/CEE: Décision de la Commission, du 15 décembre 1980, modifiant
    la décision 80/266/CEE autorisant les États membres à admettre temporairement
    la commercialisation de matériels forestiers de reproduction ne répondant pas
    aux exigences de la directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '80/1236/EWG: Entscheidung der Kommission vom 15. Dezember 1980 zur Änderung
    der Entscheidung 80/266/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinie
    66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '80/1236/EØF: Kommissionens beslutning af 15. december 1980 om ændring
    af beslutning 80/266/EØF om bemyndigelse til medlemsstaterne til midlertidigt
    at tillade handel med forstligt formeringsmateriale, der ikke opfylder kravene
    i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '80/1236/ΕΟΚ: Απόφαση τής Επιτροπής τής 15ης
