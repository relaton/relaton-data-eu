    80/266/ΕΟΚ «περί παροχής αδείας στά Κράτη μέλη
    νά αποδέχονται προσωρινά τήν εμπορία δασικού
    πολλαπλασιαστικού υλικού τό οποίο δέν ανταποκρίνεται
    στίς απαιτήσεις τής οδηγίας 66/404/ΕΟΚ τού Συμβουλίου»'
  type: main
- language: it
  script: Latn
  content: '80/1236/CEE: Decisione della Commissione, del 15 dicembre 1980, recante
    modifica della decisione 80/266/CEE, che autorizza gli Stati membri ad ammettere
    temporaneamente la commercializzazione di materiali di riproduzione di alcune
    specie forestali che non corrispondono alle esigenze della direttiva 66/404/CEE
    del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '80/1236/EEG: Beschikking van de Commissie van 15 december 1980 tot wijziging
