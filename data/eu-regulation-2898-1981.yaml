  content: Commission Regulation (EEC) No 2898/81 of 7 October 1981 amending Regulation
    (EEC) No 1371/81 laying down detailed rules for the administrative application
    of monetary compensatory amounts, Regulation (EEC) No 243/78 providing for the
    advance fixing of monetary compensatory amounts and Regulation (EEC) No 52/81
    laying down detailed rules for the application of accession compensatory amounts
