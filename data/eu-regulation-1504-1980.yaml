title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1504/80 of 16 June 1980 re-establishing
    the levying of customs duties on cycles (including delivery tricycles), not motorized,
    falling within heading No 87.10 and originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1504/80 de la Commission, du 16 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux vélocipèdes
    (y compris les triporteurs et similaires), sans moteur, de la position 87.10 du
    tarif douanier commun, originaires de Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1504/80 der Kommission vom 16. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Fahrräder, einschließlich Lastendreiräder und dergleichen,
    ohne Motor, der Tarifnummer 87.10, mit Ursprung in Jugoslawien, dem die in der
    Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1504/80 af 16. juni 1980 om genindførelse
    af opkrævning af toldafgifter for cykler uden motor (herunder trehjulede transportcykler),
    under pos. 87.10, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1504/80 della Commissione, del 16 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai velocipedi (compresi
    i furgoncini a triciclo e simili), senza motore, della voce 87.10 della tariffa
    doganale comune, originari della Iugoslavia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1504/80 van de Commissie van 16 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op rijwielen
    (bakfietsen en dergelijke daaronder begrepen), zonder motor, van post 87.10, van
    oorsprong uit Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad algemene tariefpreferenties werden geopend
  type: main
