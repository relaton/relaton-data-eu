    xi residwi tal-pestiċidji fi u fuq ċereali u xi prodotti li joriġinaw mill-pjanti,
    inklużi frott u ħaxix
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2005/37/EG van de Commissie van 3 juni 2005 tot wijziging van
    de Richtlijnen 86/362/EEG en 90/642/EEG van de Raad wat betreft de maximumgehalten
    aan residuen van bepaalde bestrijdingsmiddelen in en op granen en bepaalde producten
    van plantaardige oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2005/37/WE z dnia 3 czerwca 2005 r. zmieniająca dyrektywy
    Rady 86/362/EWG i 90/642/EWG w sprawie ustalania najwyższych dopuszczalnych poziomów
    pozostałości pestycydów odpowiednio w zbożach i niektórych produktach pochodzenia
    roślinnego, w tym owocach i warzywach, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2005/37/CE da Comissão, de 3 de Junho de 2005, que altera as
