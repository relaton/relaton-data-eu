    daudzumu noteikšanu labībā un uz tās un konkrētos augu izcelsmes produktos,
    ieskaitot augļus un dārzeņus
  type: main
- language: lt
  script: Latn
  content: 2005 m. birželio 3 d. Komisijos direktyva 2005/37/EB, iš dalies keičianti
    Tarybos direktyvas 86/362/EEB ir 90/642/EEB dėl didžiausios leistinos tam tikrų
    pesticidų likučių koncentracijos grūdinėse kultūrose ir kai kuriuose augalinės
    kilmės produktuose ir ant jų, įskaitant vaisius ir daržoves
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kummissjoni 2005/37/KE tat- 3 ta' Ġunju 2005 li temenda
