    φυτικής προέλευσης, συμπεριλαμβανομένων των
    οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2005/37/EÜ, 3. juuni 2005, millega muudetakse nõukogu
    direktiive 86/362/EMÜ ja 90/642/EMÜ teraviljas ja teatavates taimsetes saadustes,
    kaasa arvatud puu- ja köögiviljas, sisalduvate ja nende pinnal esinevate pestitsiidide
    jääkide piirnormide osas
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2005/37/EY, annettu 3 päivänä kesäkuuta 2005,
