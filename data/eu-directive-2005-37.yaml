    pinnassa sekä tietyissä kasviperäisissä tuotteissa, mukaan luettuina hedelmät
    ja vihannekset, ja niiden pinnassa olevien tiettyjen torjunta-ainejäämien enimmäismäärien
    osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2005/37/EK irányelve (2005. június 3.) a 86/362/EGK és
    90/642/EGK tanácsi irányelveknek a gabonafélékben és egyes növényi eredetű
    termékekben – többek között a gyümölcsökben és zöldségekben –, illetve
    azok felületén található egyes növényvédőszer-maradványok megengedett
    legmagasabb mértékének tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
