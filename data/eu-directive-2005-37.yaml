    de resíduos de determinados pesticidas à superfície e no interior dos cereais
    e de determinados produtos de origem vegetal, incluindo frutas e produtos hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2005/37/CE a Comisiei din 3 iunie 2005 de modificare a Directivelor
    86/362/CEE și 90/642/CEE ale Consiliului în ceea ce privește conținuturile
    maxime pentru anumite reziduuri de pesticide de pe și din cereale și anumite
    produse de origine vegetală, inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2005/37/ES z 3. júna 2005, ktorou sa menia a dopĺňajú
    smernice Rady 86/362/EHS a 90/642/EHS, pokiaľ ide o maximálne úrovne rezíduí
    niektorých pesticídov v a na obilninách a niektorých produktoch rastlinného
    pôvodu vrátane ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2005/37/ES z dne 3. junija 2005 o spremembi Direktiv
