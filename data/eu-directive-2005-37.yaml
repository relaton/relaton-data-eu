title:
- language: en
  script: Latn
  content: Commission Directive 2005/37/EC of 3 June 2005 amending Council Directives
    86/362/EEC and 90/642/EEC as regards the maximum levels for certain pesticide
    residues in and on cereals and certain products of plant origin, including fruit
    and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2005/37/CE de la Commission du 3 juin 2005 modifiant les directives
    86/362/CEE et 90/642/CEE du Conseil en ce qui concerne les teneurs maximales pour
    certains résidus de pesticides sur et dans les céréales, et certains produits
    d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/37/EG der Kommission vom 3. Juni 2005 zur Änderung der
    Richtlinien 86/362/EWG und 90/642/EWG des Rates hinsichtlich der Höchstgehalte
    an Rückständen bestimmter Schädlingsbekämpfungsmittel in und auf Getreide
    und bestimmten Erzeugnissen pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2005/37/ЕО на Комисията от 3 юни 2005
    година за изменение на Директиви 86/362/ЕИО и
    90/642/ЕИО на Съвета по отношение на максимално
    допустимите граници на остатъчни вещества
    от пестициди във и върху зърнените култури
    и някои продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2005/37/ES ze dne 3. června 2005, kterou se mění směrnice
    Rady 86/362/EHS a 90/642/EHS o stanovení maximálních limitů reziduí některých
    pesticidů v obilovinách a některých produktech rostlinného původu, včetně
    ovoce a zeleniny, a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2005/37/EF af 3. juni 2005 om ændring af Rådets
    direktiv 86/362/EØF og 90/642/EØF med hensyn til maksimalgrænseværdierne for
    visse pesticidrester i og på korn og visse produkter af vegetabilsk oprindelse,
    herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
