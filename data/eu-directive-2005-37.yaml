    pesticidov v in na žitih in nekaterih proizvodih rastlinskega izvora, vključno
    s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2005/37/CE de la Comisión, de 3 de junio de 2005, por la que
    se modifican las Directivas del Consejo 86/362/CEE y 90/642/CEE, en lo que atañe
    a los contenidos máximos de determinados residuos de plaguicidas sobre y en los
    cereales y en determinados productos de origen vegetal, incluidas las frutas y
    hortalizas
  type: main
