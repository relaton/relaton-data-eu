---
id: EURegulation27231990
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2723/90 of 24 September 1990 replacing the
    codes established on the basis of the Common Customs Tariff nomenclature in force
    on 31 December 1987 with those established on the basis of the Combined Nomenclature
    in certain Regulations concerning the classification of goods
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 2723/90 de la Commission, du 24 septembre 1990, remplaçant
    dans certains règlements relatifs au classement de marchandises les codes établis
    sur la base de la nomenclature du tarif douanier commun en vigueur au 31 décembre
    1987 par ceux établis sur base de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2723/90 der Kommission vom 24. September 1990 mit
    der in bestimmten Verordnungen zur Einreihung von Waren die auf der Basis der
    am 31. Dezember 1987 geltenden Tarifnummern des Schemas des Gemeinsamen Zolltarifs
    durch die Codes der Kombinierten Nomenklatur ersetzt werden
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 2723/90 на Комисията от 24
    септември 1990 година относно замяната на кодовете,
    определени на базата на номенклатурата на
    Общата митническа тарифа, в сила от 31 декември
    1987 година, с кодове, определени на базата на
    Комбинираната номенклатура, в определени регламенти
    относно класирането на стоки
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 2723/90 ze dne 24. září 1990, které v
    některých nařízeních týkajících se zařazení zboží nahrazuje kódy
    stanovené na základě nomenklatury společného celního sazebníku platné
    k 31. prosinci 1987 kódy stanovenými na základě kombinované nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2723/90 af 24. september 1990 om ændring
    i visse forordninger om tarifering af varer af de koder, der er fastlagt på grundlag
    af Den Fælles Toldtarifs nomenklatur pr. 31. december 1987, til de koder, som
    er fastlagt på grundlag af Den Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2723/90 της Επιτροπής
    της 24ης Σεπτεμβρίου 1990 για την αντικατάσταση,
    σε ορισμένους κανονισμούς σχετικούς με την
    κατάταξη εμπορευμάτων, των κωδικών που είχαν
    οριστεί βάσει της ονοματολογίας του κοινού
    δασμολογίου που ίσχυε στις 31 Δεκεμβρίου 1987
    από εκείνους που ορίστηκαν βάσει της συνδυασμένης
    ονοματολογίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 2723/90, 24. september 1990, millega asendatakse
    31. detsembril 1987 jõus olnud ühise tollitariifistiku nomenklatuuri alusel
    kehtestatud koodid kaupade klassifitseerimist käsitlevate teatavate määrustega
    koondnomenklatuuri alusel kehtestatud koodidega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 2723/90, annettu 24 päivänä syyskuuta 1990,
    31 päivänä joulukuuta 1987 voimassa olleen yhteisen tullitariffin nimikkeistön
    perusteella vahvistettujen koodien korvaamisesta yhdistetyn nimikkeistön perusteella
    vahvistetuilla koodeilla tietyissä tavaroiden luokittelua koskevissa asetuksissa
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EEZ) br. 2723/90 od 24. rujna 1990. o zamjeni oznaka utvrđenih
    na temelju nomenklature Zajedničke carinske tarife na snazi 31. prosinca 1987.
    onim oznakama koje su utvrđene na temelju kombinirane nomenklature u određenim
    uredbama o razvrstavanju robe
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2723/90/EGK rendelete (1990. szeptember 24.) az 1987. december
    31-én hatályos közös vámtarifa szerinti nómenklatúra alapján megállapított
    kódoknak az áruk besorolásáról szóló bizonyos rendeletekben a Kombinált
    Nómenklatúra alapján megállapított kódokkal történő felváltásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2723/90 della Commissione, del 24 settembre 1990,
    che sostituisce in taluni regolamenti relativi alla classificazione di merci i
    codici stabiliti in base alla nomenclatura della tariffa doganale comune in vigore
    al 31 dicembre 1987 con quelli stabiliti in base alla nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 2723/90 (1990. gada 24. septembris), ar kuru
    kodus, kas noteikti, pamatojoties uz Kopējo muitas tarifu nomenklatūru, kas
    ir spēkā no 1987. gada 31. decembra, aizstāj ar kodiem, kas, pamatojoties uz
    Kombinēto nomenklatūru, noteikti dažās regulās, kuras attiecas uz preču
    klasifikāciju
  type: main
- language: lt
  script: Latn
  content: 1990 m. rugsėjo 24 d. Komisijos reglamentas (EEB) Nr. 2723/90 kai kuriuose
    reglamentuose dėl prekių klasifikavimo pakeičiantis Bendrojo muitų tarifo
    nomenklatūros, galiojusios 1987 m. gruodžio 31 d., pagrindu nustatytus kodus
    į Kombinuotosios nomenklatūros pagrindu nustatytus kodus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 2723/90 tal-24 ta' Settembru 1990
    li jibdel il-kodiċijiet stabbiliti fuq il-bażi tan-nomenklatura tat-Tariffa
    Doganali Komuni fis-seħħ fil-31 ta' Diċembru 1987 ma' dawk stabbiliti fuq il-bażi
    tan-nomenklatura magħquda f'ċerti Regolamenti li jirrigwardaw il-klassifika
    tal-oġġetti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2723/90 van de Commissie van 24 september 1990 waarbij
    in een aantal verordeningen betreffende de indeling van goederen de codes die
    zijn vastgesteld op basis van de op 31 december 1987 geldende nomenclatuur van
    het gemeenschappelijk douanetarief, worden vervangen door de codes die zijn vastgesteld
    op basis van de gecombineerde nomenclatuur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 2723/90 z dnia 24 września 1990 r. zastępujące
    kody ustanowione na podstawie nomenklatury Wspólnej Taryfy Celnej obowiązujące
    w dniu 31 grudnia 1987 r. kodami ustanowionymi na podstawie Nomenklatury Scalonej
    w niektórych rozporządzeniach dotyczących klasyfikacji towarów
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2723/90 da Comissão, de 24 de Setembro de 1990,
    que substitui, em certos regulamentos relativos à classificação de mercadorias,
    os códigos estabelecidos com base na nomenclatura da Pauta Aduaneira Comum em
    vigor em 31 de Dezembro de 1987, pelos códigos estabelecidos com base na Nomenclatura
    Combinada
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 2723/90 al Comisiei din 24 septembrie 1990 de înlocuire
    în anumite regulamente privind clasificarea mărfurilor a codurilor stabilite
    pe baza nomenclaturii Tarifului Vamal Comun în vigoare la 31 decembrie 1987 cu
    cele stabilite pe baza Nomenclaturii Combinate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 2723/90 z 24. septembra 1990, ktorým sa číselné
    znaky zavedené podľa nomenklatúry Spoločného colného sadzobníka, platnej
    ku dňu 31. decembra 1987, nahrádzajú číselnými znakmi, ktoré sa zavádzajú
    na základe kombinovanej nomenklatúry v určitých nariadeniach týkajúcich
    sa zatrieďovania tovaru
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 2723/90 z dne 24. septembra 1990 o nadomestitvi
    oznak, uvedenih na podlagi nomenklature skupne carinske tarife, ki je veljala
    dne 31. decembra 1987, z oznakami, uvedenimi na podlagi Kombinirane nomenklature
    v določenih uredbah o uvrstitvi blaga
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2723/90 de la Comisión, de 24 de septiembre de 1990,
    por el que se sustituyen en determinados reglamentos relativos a la clasificación
    de las mercancías los códigos establecidos con arreglo a la nomenclatura del
    arancel aduanero común vigente el 31 de diciembre de 1987 por los establecidos
    basándose en la nomenclatura combinada
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 2723/90 av den 24 september 1990 om
    ersättande av nummer som är fastställda på grundval av Gemensamma tulltaxenomenklaturen
    i kraft den 31 december 1987 med KN-nummer som är fastställda på grundval av
    Kombinerade nomenklaturen i vissa förordningar om klassificering av varor
  type: main
