  content: '82/932/EEC: Commission Decision of 20 December 1982 establishing that
    the apparatus described as ''Hewlett Packard - Digital Signal Analyzer, model
    5420 A'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/932/CEE: Décision de la Commission, du 20 décembre 1982, constatant
    que l''importation de l''appareil dénommé "Hewlett Packard - digital signal
    analyzer, model 5420 A" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
