  script: Latn
  content: '82/932/EWG: Entscheidung der Kommission vom 20. Dezember 1982, mit der
    festgestellt wird, daß das Gerät ,,Hewlett Packard - Digital Signal Analyzer,
    model 5420 A" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
