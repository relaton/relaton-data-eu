schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1950 of 14 October 2022 renewing
    the approval of creosote as an active substance for use in biocidal products of
    product-type 8 in accordance with Regulation (EU) No 528/2012 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1950 de la Commission du 14 octobre
    2022 renouvelant l’approbation de la créosote en tant que substance active
    destinée à être utilisée dans les produits biocides relevant du type de produits
    8 conformément au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1950 der Kommission vom 14. Oktober
    2022 zur Verlängerung der Genehmigung von Kreosot als Wirkstoff zur Verwendung
    in Biozidprodukten der Produktart 8 gemäß der Verordnung (EU) Nr. 528/2012 des
    Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1950 на Комисията
    от 14 октомври 2022 година за подновяване на одобрението
    на креозот като активно вещество за употреба
    в биоциди от продуктов тип 8 в съответствие
    с Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1950 ze dne 14. října 2022,
    kterým se obnovuje schválení kreosotu jako účinné látky pro použití v
    biocidních přípravcích typu 8 v souladu s nařízením Evropského parlamentu
    a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1950 af 14. oktober 2022
    om fornyelse af godkendelsen af creosot som et aktivstof til anvendelse i biocidholdige
    produkter af produkttype 8 i henhold til Europa-Parlamentets og Rådets forordning
    (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/1950 της Επιτροπής
    της 14ης Οκτωβρίου 2022 για την ανανέωση της έγκρισης
    του κρεοζώτου ως δραστικής ουσίας για χρήση
    σε βιοκτόνα του τύπου προϊόντων 8 σύμφωνα με
    τον κανονισμό (ΕΕ) αριθ. 528/2012 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/1950, 14. oktoober 2022, millega pikendatakse
    toimeaine kreosoodi kasutamise heakskiitu tooteliiki 8 kuuluvates biotsiidides
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EL) nr 528/2012
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/1950, annettu 14 päivänä
    lokakuuta 2022, kreosootin hyväksynnän uusimisesta käytettäväksi tehoaineena
    valmisteryhmään 8 kuuluvissa biosidivalmisteissa Euroopan parlamentin ja neuvoston
    asetuksen (EU) N:o 528/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/1950 ón gCoimisiún an 14 Deireadh
    Fómhair 2022 lena ndéantar an formheas ar chréasóid mar shubstaint ghníomhach
    lena húsáid i dtáirgí bithicídeacha de chineál táirge 8 a athnuachan i
    gcomhréir le Rialachán (AE) Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón
    gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1950 оd 14. listopada 2022. o obnovi
    odobrenja kreozota kao aktivne tvari za uporabu u biocidnim proizvodima vrste
    8 u skladu s Uredbom (EU) br. 528/2012 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1950 végrehajtási rendelete (2022. október 14.)
    a kreozot mint 8. terméktípusba tartozó biocid termékekben az 528/2012/EU
    európai parlamenti és tanácsi rendelet szerint felhasználható hatóanyag
    jóváhagyásának megújításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1950 della Commissione del 14 ottobre
    2022 che rinnova l’approvazione del creosoto come principio attivo ai fini del
    suo uso nei biocidi del tipo di prodotto 8 conformemente al regolamento (UE) n.
    528/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1950 (2022. gada 14. oktobris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) Nr. 528/2012 atjauno
    kreozota kā 8. produkta veida biocīdos lietojamas aktīvās vielas apstiprinājumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/1950 2022 m. spalio 14 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 528/2012 pratęsiamas
    kreozoto, kaip veikliosios medžiagos, skirtos 8-o tipo biocidiniams produktams
    gaminti, patvirtinimo galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1950 tal-14
    ta’ Ottubru 2022 li jġedded l-approvazzjoni tal-kreożot bħala sustanza attiva
    għall-użu fil-prodotti bijoċidali għat-tip ta’ prodott 8 f’konformità
    mar-Regolament (UE) Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1950 van de Commissie van 14 oktober 2022
    tot verlenging van de goedkeuring van creosoot als werkzame stof voor gebruik
    in biociden van productsoort 8 overeenkomstig Verordening (EU) nr. 528/2012 van
    het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1950 z dnia 14 października
    2022 r. w sprawie odnowienia zatwierdzenia kreozotu jako substancji czynnej przeznaczonej
    do stosowania w produktach biobójczych należących do grupy produktowej 8 zgodnie
    z rozporządzeniem Parlamentu Europejskiego i Rady (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/1950 da Comissão de 14 de outubro
    de 2022 que renova a aprovação do creosoto como substância ativa para utilização
    em produtos biocidas do tipo 8, em conformidade com o Regulamento (UE) n.o 528/2012
    do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1950 al Comisiei din 14 octombrie
    2022 de reînnoire a aprobării creozotului ca substanță activă destinată
    utilizării în produsele biocide aparținând tipului de produs 8, în conformitate
    cu Regulamentul (UE) nr. 528/2012 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1950 zo 14. októbra 2022, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (EÚ) č. 528/2012 obnovuje
    schválenie kreozotu ako účinnej látky na použitie v biocídnych výrobkoch
    typu 8
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/1950 z dne 14. oktobra 2022 o podaljšanju
    odobritve kreozota kot aktivne snovi za uporabo v biocidnih proizvodih vrste proizvodov
    8 v skladu z Uredbo (EU) št. 528/2012 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1950 de la Comisión de 14 de octubre
    de 2022 por el que se renueva la aprobación de la creosota como sustancia activa
    para su uso en biocidas del tipo de producto 8 de conformidad con el Reglamento
    (UE) n.o 528/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/1950 av den 14 oktober
    2022 om förnyelse av godkännandet av kreosot som verksamt ämne för användning
    i biocidprodukter i produkttyp 8 i enlighet med Europaparlamentets och rådets
    förordning (EU) nr 528/2012
  type: main
