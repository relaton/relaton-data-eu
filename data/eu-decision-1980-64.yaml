title:
- language: en
  script: Latn
  content: '80/64/EEC: Commission Decision of 18 December 1979 authorizing the French
    Republic not to apply Community treatment to woven fabrics of regenerated textile
    fibres (discontinuous or waste) other than narrow woven fabrics, pile fabrics
    (including terry fabrics) and chenille fabrics, falling within subheading 56.07
    B of the Common Customs Tariff (NIMEXE codes 56.07-37, 42, 44, 48, 52, 53, 54,
    57, 58, 62, 63, 64, 66, 72, 73, 74, 77, 78, 82, 83, 84, 87) (category 37), originating
    in the People''s Republic of China and in free circulation in the other Member
    States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/64/CEE: Décision de la Commission, du 18 décembre 1979, autorisant
    la République française à exclure du traitement communautaire les tissus de
    fibres textiles artificielles discontinues, autres que rubanerie, velours, peluches,
    tissus bouclés (y compris les tissus bouclés du genre éponge) et tissus de
    chenille de la sous-position 56.07 B du tarif douanier commun (codes Nimexe: 56.07-37,
    42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66, 72, 73, 74, 77, 78, 82, 83, 84,
    87) (catégorie 37), originaires de la République populaire de Chine et mis en
    libre pratique dans les autres États membres (Le texte en langue française est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/64/EWG: Entscheidung der Kommission vom 18. Dezember 1979, mit der
    die Französische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus künstlichen
    Spinnfasern, andere als Bänder, Samt, Plüsch und Schlingengewebe (einschließlich
    Frottiergewebe) und Chenillegewebe der Tarifstelle 56.07 B des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 56.07-37 ; 42 ; 44 ; 48 ; 52 ; 53 ; 54 ; 57 ; 58 ; 62 ; 63
    ; 64 ; 66 ; 72 ; 73 ; 74 ; 77 ; 78 ; 82 ; 83 ; 84 ; 87), Kategorie 37, von der
    Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/64/EØF: Kommissionens beslutning af 18. december 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævet stof
    af endeløse regenererede fibre eller af affald af kemofibre, bortset fra vævede
    bånd, vævede fløjls-, plys- og chenillestoffer (herunder håndklædefrotterstof
    og lignende frotterstof), som henhører under pos. 56.07B i den fælles toldtarif
    (NIMEXE-nummer 56.07-37, 42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66, 72, 73,
    74, 77, 78, 82, 83, 84, 87; kategori 37) har oprindelse i Den kinesiske Folkerepublik
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/64/CEE: Decisione della Commissione, del 18 dicembre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di fibre
    tessili artificiali in fiocco, diversi dai nastri, galloni e simili, velluti,
    felpe, tessuti ricci (compresi i tessuti ricci del tipo spugna) e tessuti di ciniglia,
    della sottovoce 56.07 B della tariffa doganale comune (codici Nimexe : 56.07-37,
    42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66, 72, 73, 74, 77, 78, 82, 83, 84,
    87), categoria 37, originari della Repubblica popolare cinese e messi in libera
    pratica negli altri Stati membri (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/64/EEG: Beschikking van de Commissie van 18 december 1979 waarbij de
    Franse Republiek wordt gemachtigd weefsels van kunstmatige stapelvezels, uitgezonderd
    lint, fluweel, pluche, lussenweefsels (bad- of frotteerstof inbegrepen) en chenilleweefsels,
    van post 56.07 B van het gemeenschappelijk douanetarief (NIMEXE- code 56.07-37,
    42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66, 72, 73, 74, 77, 78, 82, 83, 84,
    87) (categorie 37), van oorsprong uit de Volksrepubliek China en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Franse taal is authentiek)'
