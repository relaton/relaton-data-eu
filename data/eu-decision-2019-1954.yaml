- language: en
  script: Latn
  content: Council Decision (EU) 2019/1954 of 18 November 2019 establishing the position
    to be adopted, on behalf of the European Union, in the EPA Committee set up by
    the Interim Agreement with a view to an Economic Partnership Agreement between
    the European Community and its Member States, of the one part, and the Central
    Africa Party, of the other part, in connection with the adoption of the rules
    of procedure for mediation, the rules of procedure for arbitration and the code
    of conduct for arbitrators
  type: main
- language: fr
  script: Latn
