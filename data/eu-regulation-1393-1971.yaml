title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1393/71 de la Commission, du 30 juin 1971, portant
    abrogation du règlement (CEE) n° 1511/71 relatif à certaines mesures à prendre
    dans le secteur des produits transformés à base de fruits et légumes à la
    suite de la dévaluation du franc français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1393/71 der Kommission vom 30. Juni 1971 zur Aufhebung
    der Verordnung (EWG) Nr. 1511/70 betreffend Maßnahmen auf dem Sektor der Verarbeitungserzeugnisse
    aus Obst und Gemüse infolge der Abwertung des französischen Franken
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1393/71 della Commissione, del 30 giugno 1971, recante
    abrogazione del regolamento (CEE) n. 1511/70 relativo a talune misure da adottare
    nel settore dei prodotti trasformati a base di ortofrutticoli in seguito alla
    svalutazione del franco francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1393/71 van de Commissie van 30 juni 1971 houdende
    intrekking van Verordening (EEG) nr. 1511/70 betreffende ingevolge de devaluatie
    van de Franse frank in de sector op basis van groenten en fruit verwerkte produkten
    te nemen maatregelen
  type: main
