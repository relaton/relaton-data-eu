  content: '72/90/CEE: Décision du Conseil du 8 novembre 1971 portant conclusion
    d''un accord entre la Communauté économique européenne et l''Office de secours
    et de travaux des Nations Unies pour les réfugiés de Palestine relatif à la
    fourniture de farine de froment tendre à titre d''aide alimentaire'
  type: main
- language: de
  script: Latn
  content: '72/90/EWG: Beschluß des Rates vom 8. November 1971 über den Abschluß
    eines Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft und dem Hilfswerk
    der Vereinten Nationen für die Palästinaflüchtlinge im Nahen Osten über die
    Lieferung von Weichweizenmehl im Rahmen der Nahrungsmittelhilfe'
  type: main
- language: it
  script: Latn
