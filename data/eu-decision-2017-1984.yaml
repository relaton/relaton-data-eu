    de periode van 1 januari 2018 tot en met 31 december 2020 voor elke producent
    of invoerder die na 1 januari 2015 rechtmatig fluorkoolwaterstoffen op de markt
    heeft gebracht, zoals gerapporteerd overeenkomstig die verordening (Kennisgeving
