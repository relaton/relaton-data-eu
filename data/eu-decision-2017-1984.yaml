    om fluorholdige drivhusgasser, af referenceværdier for perioden 1. januar 2018
    til 31. december 2020 for hver producent eller importør, der fra den 1. januar
    2015 lovligt har markedsført hydrofluorcarboner som indberettet i medfør af
    nævnte forordning (meddelt under nummer C(2017) 7080)
  type: main
