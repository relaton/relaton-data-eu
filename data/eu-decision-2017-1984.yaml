title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1984 of 24 October 2017 determining,
    pursuant to Regulation (EU) No 517/2014 of the European Parliament and of the
    Council on fluorinated greenhouse gases, reference values for the period 1 January
    2018 to 31 December 2020 for each producer or importer which has lawfully placed
    on the market hydrofluorocarbons from 1 January 2015 as reported under that Regulation
    (notified under document C(2017) 7080)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1984 de la Commission du 24 octobre 2017
    établissant, conformément au règlement (UE) n° 517/2014 du Parlement européen
    et du Conseil relatif aux gaz à effet de serre fluorés, les valeurs de référence
    pour la période allant du 1er janvier 2018 au 31 décembre 2020 pour chaque producteur
    ou importateur ayant légalement mis sur le marché des hydrofluorocarbones à
    partir du 1er janvier 2015 selon les données communiquées en vertu dudit règlement
    [notifiée sous le numéro C(2017) 7080]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/1984 der Kommission vom 24. Oktober 2017
    zur Bestimmung — gemäß der Verordnung (EU) Nr. 517/2014 des Europäischen
    Parlaments und des Rates über fluorierte Treibhausgase — von Referenzwerten
    für den Zeitraum 1. Januar 2018 bis 31. Dezember 2020 für jeden Hersteller oder
    Einführer, der gemäß der Verordnung gemeldete Mengen teilfluorierter Kohlenwasserstoffe
    ab dem 1. Januar 2015 rechtmäßig in Verkehr gebracht hat (Bekannt gegeben unter
    Aktenzeichen C(2017) 7080)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/1984 на Комисията
    от 24 октомври 2017 година за определяне, в съответствие
    с Регламент (ЕС) № 517/2014 на Европейския парламент
    и на Съвета за флуорсъдържащите парникови
    газове, на референтни стойности за периода
    от 1 януари 2018 г. до 31 декември 2020 г. за всеки
    производител или вносител, който законно е
    пускал на пазара флуоровъглеводороди в периода,
    започващ от 1 януари 2015 г., както е докладвано
    съгласно горепосочения регламент (нотифицирано
    под номер С(2017) 7080)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/1984 ze dne 24. října 2017,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) č. 517/2014 o
    fluorovaných skleníkových plynech stanovují referenční hodnoty na období
    od 1. ledna 2018 do 31. prosince 2020 pro každého výrobce nebo dovozce, který
    podle uvedeného nařízení oznámil, že od 1. ledna 2015 zákonně uvedl na
    trh částečně fluorované uhlovodíky (oznámeno pod číslem C(2017) 7080)
  type: main
- language: da
  script: Latn
