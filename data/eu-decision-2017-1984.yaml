    nr 517/2014 w sprawie fluorowanych gazów cieplarnianych, wartości odniesienia
    na okres od dnia 1 stycznia 2018 r. do dnia 31 grudnia 2020 r. dla każdego producenta
    lub importera, który zgodnie z prawem wprowadził do obrotu wodorofluorowęglowodory
    od dnia 1 stycznia 2015 r. zgłoszone zgodnie z tym rozporządzeniem (notyfikowana
