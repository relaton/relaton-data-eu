    jelentésnek megfelelően jogszerűen forgalomba hozó gyártók és importőrök
    tekintetében a 2018. január 1-től 2020. december 31-ig tartó időszakra vonatkozó
    referenciaértékeknek a fluortartalmú üvegházhatású gázokról szóló 517/2014/EU
