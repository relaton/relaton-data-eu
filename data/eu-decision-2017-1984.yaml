    de referință pentru perioada cuprinsă între 1 ianuarie 2018 și 31 decembrie
    2020, pentru fiecare producător sau importator care a introdus hidrofluorcarburi
    în mod legal pe piață începând cu 1 ianuarie 2015, astfel cum s-a raportat
    în conformitate cu acest regulament [notificată cu numărul C(2017) 7080]
