  content: Regulation (EEC) No 2066/73 of the Commission of 27 July 1973 fixing the
    rates of the refunds applicable from 1 August 1973 to sugar and molasses exported
    in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2066/73 de la Commission, du 27 juillet 1973, fixant
    les taux des restitutions applicables, à compter du 1er août 1973, au sucre
