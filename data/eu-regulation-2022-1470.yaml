    ja Aspergillus tubingensis ATCC SD 6740 -organismin tuottaman alfa-galaktosidaasin
    hyväksymisestä broilerien, kananuorikoiden, lihan- ja munantuotantoa varten
    kasvatettavien toissijaisten siipikarjalajien sekä koristetarkoituksessa pidettävien
    lintujen rehun lisäaineena (hyväksynnän haltija Industrial Técnica Pecuaria
    SA)
  type: main
- language: ga
  script: Latn
