    longibrachiatum CBS 139997 e alfa-galattosidasi prodotta da Aspergillus tubingensis
    ATCC SD 6740 come additivo per mangimi destinati a polli da ingrasso, pollastre
    allevate per la produzione di uova, specie avicole minori da ingrasso e allevate
    per la produzione di uova e uccelli ornamentali (titolare dell’autorizzazione
    Industrial Técnica Pecuaria SA)
  type: main
- language: lv
  script: Latn
