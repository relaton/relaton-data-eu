    ta’ Settembru 2022 li jikkonċerna l-awtorizzazzjoni ta’ endo-1,4-beta-ksilanażi
    prodotta mit-Trichoderma longibrachiatum CBS 139997 u ta’ alfa galaktosidażi
    prodotta mill-Aspergillus tubingensis ATCC SD 6740 bħala addittiv fl-għalf tat-tiġieġ
    tas-simna, tat-tiġieġ imrobbi għall-bajd, ta’ speċijiet minuri ta’ pollam
    tas-simna u dawk imrobbija għall-bajd, u tal-għasafar ornamentali (id-detentur
    tal-awtorizzazzjoni huwa Industrial Técnica Pecuaria S.A.)
  type: main
