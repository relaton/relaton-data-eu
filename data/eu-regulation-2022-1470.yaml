    longibrachiatum CBS 139997 agus alfa-galachtóisíodáise arna táirgeadh ag Aspergillus
    tubingensis ATCC SD 6740 mar bhreiseán beathaithe le haghaidh sicíní lena ramhrú,
    sicíní a thógtar le bheith ina mbéaróga, mionspeicis éanlaithe clóis lena
