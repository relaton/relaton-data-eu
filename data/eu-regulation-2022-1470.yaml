  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2022/1470, 5. september 2022, milles käsitletakse
    loa andmist Trichoderma longibrachiatum CBS 139997 abil toodetud endo-1,4-β-ksülanaasi
    ja Aspergillus tubingensis ATCC SD 6740 abil toodetud α-galaktosidaasi kasutamiseks
    broilerkanade, munakanade, vähemlevinud kodulinnuliikide nuum- ja munalindude
    ning dekoratiivlindude söödalisandina (loa hoidja: Industrial Técnica Pecuaria
    S.A.)'
  type: main
