    ir Aspergillus tubingensis ATCC SD 6740 gaminamą alfa-galaktozidazę kaip penimų
    viščiukų, dedeklinių vištaičių, retesnių rūšių penimų ir dedeklinių
    naminių paukščių ir dekoratyvinių paukščių lesalų priedą (leidimo turėtoja
