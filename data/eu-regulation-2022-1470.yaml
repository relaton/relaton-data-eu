    és az Aspergillus tubingensis ATCC SD 6740 által termelt alfa-galaktozidáz
    brojlercsirkék, tojójércék, kevésbé jelentős hízó- és tojóbaromfifajok,
    valamint díszmadarak takarmány-adalékanyagaként történő engedélyezéséről
    (az engedély jogosultja: Industrial Técnica Pecuaria S.A.)'
  type: main
