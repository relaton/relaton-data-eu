id: EURegulation20221470
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1470 of 5 September 2022 concerning
    the authorisation of endo-1,4-beta-xylanase produced by Trichoderma longibrachiatum
    CBS 139997 and alpha-galactosidase produced by Aspergillus tubingensis ATCC SD
    6740 as a feed additive for chickens for fattening, chickens reared for laying,
    minor poultry species for fattening and reared for laying, and ornamental birds
    (holder of the authorisation Industrial Técnica Pecuaria S.A.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2022/1470 de la Commission du 5 septembre
    2022 concernant l’autorisation de l’endo-1,4-β-xylanase produite par Trichoderma
    longibrachiatum CBS 139997 et de l’α-galactosidase produite par Aspergillus
    tubingensis ATCC SD 6740 en tant qu’additif pour l’alimentation des poulets
    d’engraissement, des poulettes destinées à la ponte, des espèces aviaires
    mineures destinées à l’engraissement ou élevées pour la ponte, et des oiseaux
    d’ornement (titulaire de l’autorisation: Industrial Técnica Pecuaria S.A.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2022/1470 der Kommission vom 5. September
    2022 zur Zulassung von Endo-1,4-beta-Xylanase, gewonnen aus Trichoderma longibrachiatum
    CBS 139997, und Alpha-Galactosidase, gewonnen aus Aspergillus tubingensis ATCC
    SD 6740, als Zusatzstoff in Futtermitteln für Masthühner, Junghennen, Geflügelarten
    von geringerer wirtschaftlicher Bedeutung für die Mast und Jungtiere von Geflügelarten
    von geringerer wirtschaftlicher Bedeutung für Legezwecke sowie Ziervögel (Zulassungsinhaber:
    Industrial Técnica Pecuaria S.A.)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1470 на Комисията
    от 5 септември 2022 година за разрешаване на употребата
    на ендо-1,4-бета-ксиланаза, получена от Trichoderma
    longibrachiatum CBS 139997, и алфа-галактозидаза, получена
    от Aspergillus tubingensis ATCC SD 6740, като фуражна добавка
    за пилета за угояване, пилета, отглеждани за
    кокошки носачки, видове домашни птици с по-малко
    стопанско значение, отглеждани за угояване
    и за носачки, и декоративни птици (притежател
    на разрешението Industrial Técnica Pecuaria S.A.)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1470 ze dne 5. září 2022 o
    povolení endo-1,4-beta-xylanázy z Trichoderma longibrachiatum CBS 139997 a alfa-galaktosidázy
    z Aspergillus tubingensis ATCC SD 6740 jako doplňkové látky pro výkrm kuřat,
    odchov kuřat a kuřice, výkrm a odchov menšinových druhů drůbeže a okrasné
    ptáky (držitel povolení Industrial Técnica Pecuaria S.A.)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1470 af 5. september
    2022 om godkendelse af endo-1,4-beta-xylanase produceret af Trichoderma longibrachiatum
    CBS 139997 og alpha-galactosidase produceret af Aspergillus tubingensis ATCC SD
    6740 som tilsætningsstof til foder til slagtekyllinger, hønniker, mindre udbredte
    fjerkræarter bestemt til slagtning og opdrættet til æglægning samt prydfugle
    (indehaver af godkendelsen er Industrial Técnica Pecuaria S.A.)
  type: main
- language: el
