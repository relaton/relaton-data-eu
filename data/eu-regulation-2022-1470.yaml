    un no Aspergillus tubingensis ATCC SD 6740 iegūtu alfa-galaktozidāzi lietot
    par barības piedevu gaļas cāļiem, dējējvistu audzēšanai paredzētiem cāļiem,
    retāk audzētu sugu gaļas mājputniem un dējējputniem un dekoratīvajiem putniem
    (atļaujas turētājs Industrial Técnica Pecuaria S.A.)
  type: main
