id: EURegulation2531979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 253/79 of 9 February 1979 re-establishing
    the levying of customs duties on knives with cutting blades, serrated or not (including
    pruning knives), other than knives falling within heading No 82.06, falling within
    heading No ex 82.09, originating in South Korea to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 253/79 de la Commission, du 9 février 1979, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    à lame tranchante ou dentelée (y compris les serpettes fermantes), autres que
    les couteaux du n° 82.06, de la position tarifaire ex 82.09, originaires de la
    Corée du Sud bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 253/79 der Kommission vom 9. Februar 1979 zur Wiedereinführung
    des Zollsatzes für Messer, andere als Messer der Tarifnummer 82.06, mit schneidender
    oder gezahnter Klinge (einschließlich Klappmesser für den Gartenbau), der Tarifnummer
    ex 82.09, mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3156/78
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 253/79 af 9. februar 1979 om genindførelse
    af opkrævning af toldafgifter for knive, der ikke henhører under nogen anden
    position i dette kapitel, med skærende eller savtakket æg (herunder beskæreknive),
    henhørende under pos. ex 82.09, som har oprindelse i Sydkorea og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 253/79 della Commissione, del 9 febbraio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli a lama trinciante
    o dentata (compresi i roncoli chiudibili), diversi da quelli della voce 82.06,
    della voce doganale ex 82.09, originari della Corea del Sud, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 253/79 van de Commissie van 9 februari 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op messen met
    snijdend lemmet, ook indien getand (andere dan die bedoeld bij post 82.06, doch
    zaksnoeimessen daaronder begrepen), van post 82.09, van oorsprong uit Zuid-Korea
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
