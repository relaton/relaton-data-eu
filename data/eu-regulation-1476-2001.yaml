title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1476/2001 of 18 July 2001 amending Regulation
    (EC) No 1325/2001 as regards safeguard measures with regard to imports from the
    overseas countries and territories of mixtures of sugar and cocoa with ACP/OCT
    originating status for the period 1 July to 1 December 2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1476/2001 de la Commission du 18 juillet 2001 modifiant
    le règlement (CE) n° 1325/2001 en ce qui concerne des mesures de sauvegarde
    concernant les importations à partir des pays et territoires d'outre-mer de mélanges
    de sucre et cacao cumulant l'origine ACP/PTOM pour la période du 1er juillet
    2001 au 1er décembre 2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1476/2001 der Kommission vom 18. Juli 2001 zur Änderung
    der Verordnung (EG) Nr. 1325/2001 betreffend die Schutzmaßnahmen bei der Einfuhr
    von zucker- und kakaohaltigen Mischungen mit Ursprungskumulierung AKP/ÜLG aus
    den überseeischen Ländern und Gebieten im Zeitraum vom 1. Juli bis 1. Dezember
    2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1476/2001 af 18. juli 2001 om ændring
    af forordning (EF) nr. 1325/2001 for så vidt angår beskyttelsesforanstaltninger
    over for indførsel fra de oversøiske lande og territorier af blandinger af sukker
    og kakao, som har AVS-OLT-kumulation af oprindelsen, for perioden 1. juli-1. december
    2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1476/2001 της Επιτροπής,
    της 18ης Ιουλίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1325/2001 σχετικά με τα μέτρα
    διασφάλισης όσον αφορά τις εισαγωγές από τις
    υπερπόντιες χώρες και εδάφη μειγμάτων ζάχαρης
    και κακάο με σώρευση καταγωγής ΑΚΕ/ΥΧΕ για
    την περίοδο από την 1η Ιουλίου 2001 έως την 1η
    Δεκεμβρίου 2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1476/2001, annettu 18 päivänä heinäkuuta
    2001, asetuksen (EY) N:o 1325/2001 muuttamisesta merentakaisista maista ja merentakaisilta
    alueilta 1 päivän heinäkuuta 2001 ja 1 päivän joulukuuta 2001 välisenä
    aikana AKT/MMA-alkuperäkumulaatiota soveltaen tapahtuvan sokerin ja kaakaon sekoitusten
    tuonnin suojatoimenpiteiden osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1476/2001 della Commissione, del 18 luglio 2001, che
    modifica il regolamento (CE) n. 1325/2001 per quanto riguarda le misure di salvaguardia
    per le importazioni in provenienza dai paesi e territori d'oltremare di miscele
    di zucchero e cacao con origine cumulata ACP/PTOM per il periodo dal 1° luglio
    al 1° dicembre 2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1476/2001 van de Commissie van 18 juli 2001 tot wĳziging
    van Verordening (EG) nr. 1325/2001, wat betreft de toepassing van vrĳwaringsmaatregelen
    ten aanzien van de invoer, uit de landen en gebieden overzee, van mengsels van
    suiker en cacaopoeder met oorsprongscumulatie ACS/LGO, voor de periode 1 juli-1
    december 2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1476/2001 da Comissão, de 18 de Julho de 2001, que
    altera o Regulamento (CE) n.° 1325/2001 no que diz respeito às medidas de protecção
    relativas às importações a partir dos países e territórios ultramarinos de
    misturas de açúcar e cacau que acumulam a origem ACP/PTU, relativamente ao período
    compreendido entre 1 de Julho de 2001 e 1 de Dezembro de 2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1476/2001 de la Comisión, de 18 de julio de 2001,
    por el que se modifica el Reglamento (CE) n° 1325/2001 en lo referente a las
    medidas de salvaguardia respecto de las importaciones de mezclas de azúcar y
    cacao de origen acumulado ACP/PTU procedentes de los países y territorios de
    ultramar para el período comprendido entre el 1 de julio y el 1 de diciembre
    de 2001
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1476/2001 av den 18 juli 2001 om ändring
    av förordning (EG) nr 1325/2001 när det gäller skyddsåtgärder rörande import
    från utomeuropeiska länder och territorier av blandningar av socker och kakao
    som omfattas av kumulation mellan AVS och ULT under perioden 1 juli 2001 till
    1 december 2001
