    forme de marchandises ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 386/67/EWG der Kommission vom 28. Juli 1967 zur Festsetzung
    der Erstattungen bei der Ausfuhr von Getreide in Form von nicht unter Anhang II
    des Vertrages fallenden Waren nach dritten Ländern
  type: main
- language: it
  script: Latn
  content: Regolamento n. 386/67/CEE della Commissione, del 28 luglio 1967, che fissa
    gli importi delle restituzioni applicabili per i cereali esportati verso i paesi
    terzi sotto forma di merci non comprese nell'allegato II del Trattato
  type: main
- language: nl
  script: Latn
