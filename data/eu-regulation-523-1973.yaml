title:
- language: en
  script: Latn
  content: Regulation (EEC) No 523/73 of the Commission of 22 February 1973 on the
    restoration of Common Customs Tariff duties on carbides of calcium, of subheading
    28.56 C, originating in Yugoslavia and covered by the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2762/72 of 19 December 1972
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 523/73 de la Commission, du 22 février 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux carbures de calcium, de la sous-position tarifaire 28.56 C, originaires de
    Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 523/73 der Kommission vom 22. Februar 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Kalziumkarbid der Tarifstelle 28.56
    C, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2762/72 des
    Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 523/73 af 22. februar 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for calciumcarbid under underposition
    28.56 C, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 523/73 della Commissione, del 22 febbraio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    carburi di calcio della sottovoce doganale 28.56 C, originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2762/72
    del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 523/73 van de Commissie van 22 februari 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op Calciumcarbiden van onderverdeling 28.56 C, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad
    van 19 december 1972 algemene tariefpreferenties werden geopend
  type: main
