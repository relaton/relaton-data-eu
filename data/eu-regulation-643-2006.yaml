title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 643/2006 of 27 April 2006 amending Regulation
    (EC) No 1622/2000 laying down certain detailed rules for implementing Regulation
    (EC) No 1493/1999 on the common organisation of the market in wine and establishing
    a Community code of oenological practices and processes, and Regulation (EC) No
    884/2001 laying down detailed rules of application concerning the documents accompanying
    the carriage of wine products and the records to be kept in the wine sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 643/2006 de la Commission du 27 avril 2006 modifiant
    le règlement (CE) n o 1622/2000 fixant certaines modalités d'application du
    règlement (CE) n o 1493/1999 portant organisation commune du marché vitivinicole,
    et instituant un code communautaire des pratiques et traitements œnologiques,
    et le règlement (CE) n o 884/2001 portant modalités d’application relatives
    aux documents accompagnant les transports des produits vitivinicoles et aux registres
    à tenir dans le secteur vitivinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 643/2006 der Kommission vom 27. April 2006 zur Änderung
    der Verordnung (EG) Nr. 1622/2000 mit Durchführungsbestimmungen zur Verordnung
    (EG) Nr. 1493/1999 über die gemeinsame Marktorganisation für Wein und zur Einführung
    eines Gemeinschaftskodex der önologischen Verfahren und Behandlungen und der
    Verordnung (EG) Nr. 884/2001 mit Durchführungsbestimmungen zu den Begleitdokumenten
    für die Beförderung von Weinbauerzeugnissen und zu den Ein- und Ausgangsbüchern
    im Weinsektor
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 643/2006 на Комисията от 27
    април 2006 година за изменение на Регламент (ЕО)
    № 1622/2000 относно определяне на някои подробни
    правила за прилагане на Регламент (EО) № 1493/1999
    относно общата организация на пазара на вино
    и за установяване на кодекс на Общността на
    eнологичните практики и обработки, както и
    за изменение на Регламент (ЕО) № 884/2001 относно
    определяне на подробни правила за придружителните
    документи при превоза на лозаро-винарски продукти
    и за регистрите, които е необходимо да се водят
    в лозаро-винарския сектор
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 643/2006 ze dne 27. dubna 2006 , kterým se
    mění nařízení (ES) č. 1622/2000, kterým se stanoví některá prováděcí
    pravidla k nařízení (ES) č. 1493/1999 o společné organizaci trhu s vínem
    a zavádí se kodex Společenství pro enologické postupy a ošetření, a nařízení
    (ES) č. 884/2001, kterým se stanoví prováděcí pravidla pro průvodní doklady
    pro přepravu vinařských produktů a pro evidenční knihy vedené v odvětví
    vína
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 643/2006 af 27. april 2006 om ændring
    af forordning (EF) nr. 1622/2000 om visse gennemførelsesbestemmelser til forordning
    (EF) nr. 1493/1999 om den fælles markedsordning for vin, og om en EF-kodeks for
    ønologiske fremgangsmåder og behandlingsmetoder, og af forordning (EF) nr. 884/2001
    om gennemførelsesbestemmelser for dokumenter, der ledsager vinprodukter ved transport,
    og om til- og afgangsbøger i vinsektoren
  type: main
- language: el
  script: Grek
