  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 643/2006, 27. aprill 2006 , millega muudetakse
    määrust (EÜ) nr 1622/2000, milles sätestatakse veinituru ühist korraldust
    käsitleva määruse (EÜ) nr 1493/1999 üksikasjalikud rakenduseeskirjad ning
    kehtestatakse ühenduse eeskiri veinivalmistustavade ja -menetluste kohta, ning
    määrust (EÜ) nr 884/2001, milles sätestatakse üksikasjalikud rakenduseeskirjad
    veinitoodete veo saatedokumentide ja veinisektoris peetavate registrite kohta
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 643/2006, annettu 27 päivänä huhtikuuta 2006
    , viinin yhteisestä markkinajärjestelystä annetun asetuksen (EY) N:o 1493/1999
    soveltamista koskevista yksityiskohtaisista säännöistä sekä viininvalmistusmenetelmiä
    ja -käsittelyjä koskevista yhteisön säännöistä annetun asetuksen (EY) N:o
    1622/2000 ja viinialan tuotteiden kuljetusten mukana seuraavien asiakirjojen ja
    viinialalla pidettävien rekisterien soveltamista koskevista yksityiskohtaisista
    säännöistä annetun asetuksen (EY) N:o 884/2001 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 643/2006/EK rendelete ( 2006. április 27. ) a borpiac közös
    szervezéséről szóló 1493/1999/EK tanácsi rendelet végrehajtása egyes részletes
    szabályainak megállapításáról, valamint a borászati eljárások és kezelések
    közösségi kódexének létrehozásáról szóló 1622/2000/EK rendelet és
    a borászati termékek fuvarozásához szükséges kísérőokmányokra, valamint
    a borágazatban vezetendő nyilvántartásra vonatkozó részletes alkalmazási
    szabályok megállapításáról szóló 884/2001/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 643/2006 della Commissione, del 27 aprile 2006 , recante
    modifica del regolamento (CE) n. 1622/2000, che fissa talune modalità d’applicazione
    del regolamento (CE) n. 1493/1999 relativo all’organizzazione comune del mercato
    vitivinicolo e che istituisce un codice comunitario delle pratiche e dei trattamenti
    enologici, e del regolamento (CE) n. 884/2001, che stabilisce modalità di applicazione
    relative ai documenti che scortano il trasporto dei prodotti vitivinicoli e alla
    tenuta dei registri nel settore vitivinicolo
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 643/2006 ( 2006. gada 27. aprīlis ), ar kuru
    groza Regulu (EK) Nr. 1622/2000, kas nosaka konkrētus sīki izstrādātus noteikumus
    Regulas (EK) Nr. 1493/1999 par vīna tirgus kopējo organizāciju ieviešanai,
    un kas izveido Kopienas enoloģiskās prakses un procesu kodeksu, un Regulu (EK)
    Nr. 884/2001, ar ko nosaka sīki izstrādātus piemērošanas noteikumus attiecībā
    uz vīna produktu pārvadājumu pavaddokumentiem un vīna nozarē veicamo uzskaites
    reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2006 m. balandžio 27 d. Komisijos reglamentas (EB) Nr. 643/2006, iš dalies
    keičiantis Reglamentą (EB) Nr. 1622/2000, nustatantį tam tikras išsamias Reglamento
    (EB) Nr. 1493/1999 dėl bendro vyno rinkos organizavimo įgyvendinimo taisykles
    ir nustatantį Bendrijos vynininkystės metodų bei procesų kodeksą, ir Reglamentą
    (EB) Nr. 884/2001, nustatantį išsamias vyno produktų vežimo dokumentų ir
    žurnalų, kurie turi būti tvarkomi vyno sektoriuje, taikymo taisykles
  type: main
- language: mt
  script: Latn
  content: '643/2006/KE: Regolament tal-Kummissjoni (KE) Nru 643/2006 tas- 27 ta''
    April 2006 li jemenda r-Regolament (KE) Nru 1622/2000 li jistabbilixxi r-regoli
    dettaljati għall-implimentazzjoni tar-Regolament (KE) Nru 1493/1999 dwar l-organizzazzjoni
    komuni tas-suq tal-inbid u li jistabbilixxi kodiċi tal-Komunità ta’ prattiċi
    u proċessi enoloġiċi, u r-Regolament (KE) Nru 884/2001 li jistabbilixxi regoli
    dettaljati tal-applikazzjoni li jikkonċerna d-dokumenti li jakkumpanjaw il-ġarr
    ta’ prodotti tal-inbid u r-rekords li għandhom ikunu miżmuma fis-settur tal-inbid'
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 643/2006 van de Commissie van 27 april 2006 houdende
    wijziging van Verordening (EG) nr. 1622/2000 tot vaststelling van uitvoeringsbepalingen
    van Verordening (EG) nr. 1493/1999 houdende een gemeenschappelijke ordening van
    de wijnmarkt, en tot instelling van een communautaire regeling inzake oenologische
    procédés en behandelingen, en van Verordening (EG) nr. 884/2001 houdende uitvoeringsbepalingen
    betreffende de begeleidende documenten voor het vervoer van wijnbouwproducten
    en de in de wijnsector bij te houden registers
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 643/2006 z dnia 27 kwietnia 2006 r. zmieniające
    rozporządzenie (WE) nr 1622/2000 ustanawiające szczegółowe zasady wykonywania
    rozporządzenia (WE) nr 1493/1999 w sprawie wspólnej organizacji rynku wina oraz
    ustanawiające wspólnotowy kodeks praktyk i procesów enologicznych oraz rozporządzenie
    (WE) nr 884/2001 ustanawiające szczegółowe zasady stosowania dokumentów towarzyszących
    przewozowi produktów winiarskich i rejestrów prowadzonych w sektorze wina
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 643/2006 da Comissão, de 27 de Abril de 2006 , que
    altera o Regulamento (CE) n. o 1622/2000 que estabelece determinadas normas de
    execução do Regulamento (CE) n. o 1493/1999, que estabelece a organização
    comum do mercado vitivinícola, e constitui um código comunitário das práticas
    e tratamentos enológicos, bem como o Regulamento (CE) n. o 884/2001 que estabelece
    regras de execução relativas aos documentos de acompanhamento do transporte
    de produtos vitivinícolas e aos registos a manter no sector vitivinícola
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 643/2006 al Comisiei din 27 aprilie 2006 de modificare
    a Regulamentului (CE) nr. 1622/2000 de stabilire a anumitor norme de aplicare
    a Regulamentului (CE) nr. 1493/1999 privind organizarea comună a pieței vitivinicole
    și de instituire a unui cod comunitar al practicilor și tratamentelor oenologice
    și a Regulamentului (CE) nr. 884/2001 de stabilire a normelor de aplicare privind
    documentele de însoțire a transporturilor de produse vitivinicole și evidențele
    obligatorii în sectorul vitivinicol
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 643/2006 z 27. apríla 2006 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1622/2000 ustanovujúce niektoré podrobné pravidlá
    na uplatňovanie nariadenia (ES) č. 1493/1999 o spoločnej organizácii trhu
    s vínom a ustanovujúce Zákonník Spoločenstva pre vinárske (enologické)
    postupy a procesy a nariadenie (ES) č. 884/2001 ustanovujúce podrobné pravidlá
    pre používanie sprievodných dokladov na prepravu vinárskych výrobkov a na
    vedenie záznamov vo vinárskom sektore
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 643/2006 z dne 27. aprila 2006 o spremembi Uredbe
    (ES) št. 1622/2000 o določitvi nekaterih podrobnih pravil za izvajanje Uredbe
    (ES) št. 1493/1999 o skupni ureditvi trga za vino in vzpostavitvi kodeksa Skupnosti
    na področju enoloških postopkov in obdelav ter Uredbe (ES) št. 884/2001 o določitvi
    podrobnih pravil za uporabo v zvezi z dokumenti, ki spremljajo prevoz proizvodov
    iz grozdja in vina, in z evidencami, ki se vodijo v vinskem sektorju
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 643/2006 de la Comisión, de 27 de abril de 2006 ,
    que modifica el Reglamento (CE) n o 1622/2000, que fija determinadas disposiciones
    de aplicación del Reglamento (CE) n o 1493/1999, por el que se establece la organización
    común del mercado vitivinícola, e introduce un código comunitario de prácticas
    y tratamientos enológicos, y el Reglamento (CE) n o 884/2001, por el que se establecen
    disposiciones de aplicación para los documentos que acompañan al transporte
    de productos del sector vitivinícola y para los registros que se han de llevar
    en dicho sector
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 643/2006 av den 27 april 2006 om ändring
    av förordning (EG) nr 1622/2000 om vissa tillämpningsföreskrifter för förordning
    (EG) nr 1493/1999 om den gemensamma organisationen av marknaden för vin och införandet
    av en gemenskapskodex för oenologiska metoder och behandlingar, och av förordning
    884/2001 om tillämpningsföreskrifter för följedokument vid transport av vinprodukter
    och för register som skall föras inom vinsektorn
