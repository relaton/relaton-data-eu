  script: Latn
  content: '90/263/EEC: Council Decision of 7 June 1990 concluding an Agreement in
    the form of an exchange of letters concerning the temporary extension from 1 to
    31 March 1990 of the Protocol to the Agreement between the Government of the Republic
    of Senegal and the European Economic Community on fishing off the coast of Senegal'
  type: main
- language: fr
  script: Latn
  content: '90/263/CEE: Décision du Conseil du 7 juin 1990 portant conclusion de
