    Wirtschaftsgemeinschaft ueber die Fischerei vor der senegalesischen Kueste fuer
    die Zeit vom 1. Maerz 1990 bis 31. Maerz 1990 (90/263/EWG)
  type: main
- language: da
  script: Latn
