title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1042/82 of 29 April 1982 laying down for 1982
    certain measures for the conservation and management of fishery resources applicable
    to vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1042/82 du Conseil, du 29 avril 1982, fixant, pour
    l' année 1982, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1042/82 des Rates vom 29. April 1982 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für auf den
    Färöern registrierte Schiffe für 1982
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1042/82 af 29. april 1982 om fastsættelse
    for 1982 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der er registreret på Færøerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1042/82 τού Συμβουλίου
    τής 29ης Απριλίου 1982 περί καθορισμού γιά τό
    έτος 1982 ορισμένων μέτρων διατηρήσεως καί διαχειρίσεως
    τών αλιευτικών πόρων πού εφαρμόζονται στά
    σκάφη πού είναι νηολογημένα στίς νήσους Φερόε
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1042/82 del Consiglio, del 29 aprile 1982, che stabilisce,
    per il 1982, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi immatricolate nelle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1042/82 van de Raad van 29 april 1982 tot vaststelling
    voor 1982 van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden, van toepassing op vaartuigen die op de Faeröer geregistreerd zijn
  type: main
