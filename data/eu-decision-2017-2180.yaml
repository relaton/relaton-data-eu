  script: Latn
  content: Commission Implementing Decision (EU) 2017/2180 of 16 November 2017 extending
    the period of validity of Implementing Decision (EU) 2016/412 authorising Member
    States to provide for a temporary derogation from certain provisions of Council
    Directive 2000/29/EC in respect of ash wood originating or processed in Canada
    (notified under document C(2017) 7488)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/2180 de la Commission du 16 novembre 2017
