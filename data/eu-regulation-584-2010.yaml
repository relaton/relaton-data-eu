    vēstules un apliecinājuma par PVKIU formu un saturu, elektroniskās saziņas
    izmantošanu starp kompetentajām iestādēm paziņošanas nolūkos un kārtību,
    kādā veicamas pārbaudes uz vietas un izmeklēšana, kā arī informācijas
