    auf Form und Inhalt des Standardmodells für das Anzeigeschreiben und die OGAW-Bescheinigung,
    die Nutzung elektronischer Kommunikationsmittel durch die zuständigen Behörden
    für die Anzeige und die Verfahren für Überprüfungen vor Ort und Ermittlungen
    sowie für den Informationsaustausch zwischen zuständigen Behörden
  type: main
