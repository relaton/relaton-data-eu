  type: main
- language: hu
  script: Latn
  content: A Bizottság 584/2010/EU rendelete ( 2010. július 1.) a 2009/65/EK európai
    parlamenti és tanácsi irányelvnek a bejelentő levél és az ÁÉKBV-igazolás
    formája és tartalma, a bejelentés céljára az illetékes hatóságok közötti
    elektronikus kommunikáció használata, valamint a helyszíni ellenőrzésekre
    és vizsgálatokra és az illetékes hatóságok közötti információcserére
    vonatkozó eljárások tekintetében történő végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 584/2010 della Commissione del 1 ° luglio 2010 recante
    modalità di esecuzione della direttiva 2009/65/CE del Parlamento europeo e del
    Consiglio per quanto riguarda la forma e il contenuto del modello standard della
    lettera di notifica e dell’attestato OICVM, l’utilizzo dei mezzi elettronici
    per le comunicazioni tra le autorità competenti ai fini della notifica, nonché
    le procedure per le verifiche sul posto e le indagini e lo scambio di informazioni
    tra le autorità competenti
  type: main
