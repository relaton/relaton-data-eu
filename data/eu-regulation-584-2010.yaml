- language: en
  script: Latn
  content: Commission Regulation (EU) No 584/2010 of 1 July 2010 implementing Directive
    2009/65/EC of the European Parliament and of the Council as regards the form and
    content of the standard notification letter and UCITS attestation, the use of
    electronic communication between competent authorities for the purpose of notification,
    and procedures for on-the-spot verifications and investigations and the exchange
    of information between competent authorities
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 584/2010 de la Commission du 1 er juillet 2010 mettant
    en œuvre la directive 2009/65/CE du Parlement européen et du Conseil en ce qui
    concerne la forme et le contenu de la lettre de notification normalisée et de
    l’attestation OPCVM, l’utilisation des communications électroniques entre
    autorités compétentes aux fins de la notification, ainsi que les procédures
    relatives aux vérifications sur place et aux enquêtes et à l’échange d’informations
    entre autorités compétentes
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 584/2010 der Kommission vom 1. Juli 2010 zur Durchführung
