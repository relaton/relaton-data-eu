  script: Latn
  content: Commission Implementing Decision (EU) 2019/2084 of 28 November 2019 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified soybean A2704-12 (ACS-GMØØ5-3) pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2019) 7483) (Only the German text is authentic)
  type: main
