title:
- language: en
  script: Latn
  content: '91/240/EEC: Commission Decision of 29 April 1991 accepting undertakings
    offered by certain exporters in connection with the review of anti-dumping measures
    concerning imports of ferro-silicon originating in Brazil and terminating the
    investigation as regards those exporters'
  type: main
- language: fr
  script: Latn
  content: '91/240/CEE: Décision de la Commission du 29 avril 1991 portant acceptation
    d''engagements offerts par certains exportateurs dans le cadre de la procédure
    de réexamen des mesures antidumping applicables aux importations de ferrosilicium
    originaire du Brésil et portant clôture de l''enquête en ce qui concerne les
    exportateurs en cause'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 29. April 1991 zur Annahme von Verpflichtungsangeboten
    bestimmter Ausführer im Rahmen der Überprüfung der Antidumpingmaßnahmen gegenüber
    den Einfuhren von Ferrosilicium mit Ursprung in Brasilien und zur Einstellung
    des Verfahrens gegenüber diesen Ausführern (91/240/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 29. april 1991 om godtagelse af tilsagn afgivet
    af visse eksportører i forbindelse med den fornyede undersøgelse af antidumpingforanstaltningerne
    vedrørende importen af ferrosilicium med oprindelse i Brasilien og om afslutning
    af undersøgelsen for så vidt angår de pågældende eksportører (91/240/EØF)
    #'
  type: main
- language: el
  script: Grek
  content: '91/240/ΕΟΚ: Απόφαση της Επιτροπής της 29ης
    Απριλίου 1991 για την αποδοχή των αναλήψεων υποχρεώσεων
    που προτάθηκαν από ορισμένους εξαγωγείς στο
    πλαίσιο της διαδικασίας επανεξέτασης των μέτρων
    αντιντάμπινγκ που εφαρμόζονται στις εισαγωγές
    σιδηροπυριτίου καταγωγής Βραζιλίας και για
    την περάτωση της έρευνας όσον αφορά τους εν
    λόγω εξαγωγείς'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 29 aprile 1991 recante accettazione degli
    impegni offerti da taluni esportatori nel quadro del procedimento di riesame delle
    misure antidumping applicabili alle importazioni di ferrosilicio originario del
    Brasile e chiusura dell'' inchiesta per quanto riguarda tali esportatori (91/240/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 29 april 1991 tot aanvaarding van verbintenissen
    aangeboden door bepaalde exporteurs in het kader van het nieuwe onderzoek van
    de anti-dumpingmaatregelen die van toepassing zijn op de invoer van ferrosilicium
    van oorsprong uit Brazilië en tot beëindiging van het onderzoek naar de betrokken
    exporteurs (91/240/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '91/240/CEE: DECISAO DA COMISSAO, DE 29 DE ABRIL DE 1991, QUE ACEITA COMPROMISSOS
    OFERECIDOS POR CERTOS EXPORTADORES NO AMBITO DO PROCESSO DE REEXAME DAS MEDIDAS
    ANTI-DUMPING APLICAVEIS AS IMPORTACOES DE FERRO-SILICIO ORIGINARIO DO BRASIL E
    QUE ENCERRA O INQUERITO NO QUE RESPEITA AOS EXPORTADORES EM CAUSA'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 29 de abril de 1991 por la que se aceptan
    los compromisos ofrecidos por determinados exportadores en el marco del procedimiento
    de reconsideración de las medidas antidumping aplicables a las importaciones
    de ferrosilicio originario de Brasil, y por la que se finaliza la investigación
    por lo que respecta a dichos exportadores (91/240/CEE) #'
