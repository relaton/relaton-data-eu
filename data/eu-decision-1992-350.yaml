  script: Latn
  content: '92/350/EEC: Council Decision of 15 June 1992 on the conclusion of the
    Agreement in the form of an exchange of letters between the European Economic
    Community and the People'' s Democratic Republic of Algeria fixing the additional
    amount to be deducted from the levy on imports into the Community of untreated
    olive oil, originating in Algeria, for the period 1 November 1987 to 31 December
    1993'
  type: main
- language: fr
  script: Latn
  content: '92/350/CEE: Décision du Conseil, du 15 juin 1992, concernant la conclusion
    de l'' accord sous forme d'' échange de lettres entre la Communauté économique
    européenne et la République algérienne démocratique et populaire fixant, pour
    la période du 1er novembre 1987 au 31 décembre 1993, le montant additionnel
    à déduire du prélèvement applicable à l'' importation, dans la Communauté,
    d'' huile d'' olive non traitée originaire d'' Algérie'
  type: main
- language: de
  script: Latn
  content: '92/350/EWG: Beschluß des Rates vom 15. Juni 1992 über den Abschluß
    des Abkommens in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und der Demokratischen Volksrepublik Algerien zur Festsetzung des vom 1. November
    1987 bis 31. Dezember 1993 geltenden Zusatzbetrags, der bei der Einfuhr in die
    Gemeinschaft von nicht behandeltem Olivenöl mit Ursprung in Algerien von der
    Abschöpfung abzuziehen ist'
  type: main
- language: da
  script: Latn
  content: '92/350/EØF: Rådets afgørelse af 15. juni 1992 om indgåelse af aftalen
    i form af brevveksling mellem Det Europæiske Økonomiske Fællesskab og Den Demokratiske
    Folkerepublik Algeriet om fastsættelse for perioden 1. november 1987 - 31. december
    1993 af det tillægsbeløb, som skal fratrækkes den afgift, der anvendes ved
    indførsel til Fællesskabet af ikke behandlet olivenolie med oprindelse i Algeriet'
  type: main
- language: el
  script: Grek
  content: '92/350/ΕΟΚ: Απόφαση του Συμβουλίου της 15ης
    Ιουνίου 1992 για τη σύναψη της συμφωνίας υπό
    μορφήν ανταλλαγής επιστολών μεταξύ της Ευρωπαϊκής
    Οικονομικής Κοινότητας και της Λαϊκής Δημοκρατίας
    της Αλγερίας που καθορίζει, για την περίοδο
    από 1ης Νοεμβρίου 1987 μέχρι 31 Οκτωβρίου 1993, το
    πρόσθετο ποσό που πρέπει να αφαιρείται από
    την εισφορά που εφαρμόζεται κατά την εισαγωγή
    στην Κοινότητα μη επεξεργασμένου ελαιολάδου,
    καταγωγής Αλγερίας'
  type: main
- language: it
  script: Latn
  content: '92/350/CEE: Decisione del Consiglio, del 15 giugno 1992, relativa alla
    conclusione dell'' accordo in forma di scambio di lettere tra la Comunità economica
    europea e la Repubblica democratica popolare d'' Algeria, che fissa, per il periodo
    1° novembre 1987-31 dicembre 1993, l'' importo aggiuntivo da detrarre dal prelievo
    applicabile all'' importazione nella Comunità di olio d'' oliva non trattato
    originario dell'' Algeria'
  type: main
- language: nl
  script: Latn
  content: '92/350/EEG: Besluit van de Raad van 15 juni 1992 betreffende de sluiting
