id: EURegulation14521998
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1452/98 of 7 July 1998 determining to what
    extent import right applications submitted for live bovine animals weighing between
    80 and 300 kilograms as part of a tariff quota provided for in Regulation (EC)
    No 1149/98 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1452/98 de la Commission du 7 juillet 1998 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de droits d'importation
    introduites pour les animaux vivants de l'espèce bovine d'un poids de 80 à 300
    kilogrammes dans le cadre d'un contingent tarifaire prévu par le règlement (CE)
    n° 1149/98
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1452/98 der Kommission vom 7. Juli 1998 zur Festsetzung
    des Umfangs, in dem die Aufräge auf Einfuhrrechte für lebende, 80 bis 300 kg
    schwere Rinder im Rahmen von Zollkontingenten gemäß der Verordnung (EG) Nr.
    1149/98 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1452/98 af 7. juli 1998 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importrettigheder for
    levende kvæg af en vægt på 80 til 300 kg i forbindelse med et toldkontingent,
    der er fastsat i forordning (EF) nr. 1149/98
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1452/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 7ης Ιουλίου 1998 για τον καθορισμό του βαθμού
    στον οποίο είναι δυνατό να γίνουν αποδεκτές
    οι αιτήσεις δικαιωμάτων εισαγωγής που έχουν
    υποβληθεί για ζωντανά βοοειδή, βάρους από 80
    έως 300 χιλιόγραμμα, στο πλαίσιο μιας δασμολογικής
    ποσόστωσης η οποία προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 1149/98
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1452/98, annettu 7 päivänä heinäkuuta 1998,
    eläviä 80-300 kilogrammaa painavia nautaeläimiä koskevien tuontioikeushakemusten
    hyväksyttävyydestä asetuksessa (EY) N:o 1149/98 määriteltyjen tariffikiintiöiden
    rajoissa
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1452/98 della Commissione del 7 luglio 1998 che stabilisce
    in che misura possono essere accolte le domande di diritti di importazione presentate
    per gli animali vivi della specie bovina, da 80 a 300 chilogrammi, nel quadro
    del contingente tariffario previsto dal regolamento (CE) n. 1149/98
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1452/98 van de Commissie van 7 juli 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de invoerrechtenaanvragen voor
    levende runderen met een gewicht van 80 tot 300 kg, die zijn ingediend op grond
    van een bij Verordening (EG) nr. 1149/98 vastgesteld tariefcontingent
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1452/98 da Comissão de 7 de Julho de 1998 que determina
    em que medida podem ser aceites os pedidos de direitos de importação de animais
    vivos da espécie bovina com peso compreendido entre 80 e 300 quilogramas, apresentados
    ao abrigo de um contingente pautal previsto pelo Regulamento (CE) nº 1149/98
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1452/98 de la Comisión de 7 de julio de 1998 por el
    que se determina la proporción en que se satisfarán las solicitudes de derechos
    de importación de animales vivos de la especie bovina con un peso entre 80 y
    300 kilogramos, presentadas dentro de un contingente arancelario establecido en
    el Reglamento (CE) n° 1149/98
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1452/98 av den 7 juli 1998 om i vilken
    utsträckning ansökningar om importrättigheter inlämnade för levande nötkreatur
    med en vikt på 80-300 kg inom ramen för den avgiftskvot som fastställts i förordning
    (EG) nr 1149/98 kan beviljas
  type: main
