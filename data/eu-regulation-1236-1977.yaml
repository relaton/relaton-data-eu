title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1236/77 of 9 June 1977 re-establishing the
    levying of the customs duties on lead-acid electric accumulators, falling within
    subheading 85.04 A, originating in Yugoslavia to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1236/77 de la Commission, du 9 juin 1977, portant
    rétablissement de la perception des droits de douane applicables aux accumulateurs
    électriques au plomb, de la sous-position tarifaire 85.04 A, originaires de la
    Yougoslavie bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1236/77 der Kommission vom 9. Juni 1977 zur Wiedereinführung
    des Zollsatzes für Blei-Akkumulatoren der Tarifstelle 85.04 A, mit Ursprung in
    Jugoslawien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1236/77 af 9. juni 1977 om genindførelse
    af opkrævning af toldafgifter for elektriske blyakkumulatorer under underposition
    85.04 A, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1236/77 della Commissione, del 9 giugno 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli accumulatori elettrici,
    al piombo, della sottovoce doganale 85.04 A originari della Iugoslavia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1236/77 van de Commissie van 9 juni 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op elektrische
    accumulatoren, accumulatoren met loden platen, van post 85.04 A, van oorsprong
    uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de
    Raad algemene tariefpreferenties werden geopend
  type: main
