    bei der Ausfuhr von Eiern und Eigelb in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3812/89 af 19. december 1989 om berigtigelse
