    de plantes génétiquement modifiées conformément à l''article 6 paragraphe
    5 de la directive 90/220/CEE du Conseil (Les textes en langues espagnole, danoise,
    allemande, anglaise, française, italienne, néerlandaise et portugaise sont les
    seuls faisant foi)'
  type: main
