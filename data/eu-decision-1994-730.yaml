title:
- language: en
  script: Latn
  content: '94/730/EC: Commission Decision of 4 November 1994 establishing simplified
    procedures concerning the deliberate release into the environment of genetically
    modified plants pursuant to Article 6.5 of Council Directive 90/220/EEC (Only
    the Spanish, Danish, German, English, French, Italian, Dutch, and Portuguese texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/730/CE: Décision de la Commission, du 4 novembre 1994, établissant
