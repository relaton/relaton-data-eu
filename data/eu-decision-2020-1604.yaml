    nr 517/2014 w sprawie fluorowanych gazów cieplarnianych, wartości odniesienia
    na okres od dnia 1 stycznia 2021 r. do dnia 31 grudnia 2023 r. dla każdego producenta
    lub importera, który zgodnie z prawem wprowadził wodorofluorowęglowodory do
