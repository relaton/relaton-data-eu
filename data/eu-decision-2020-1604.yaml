    и на Съвета за флуорсъдържащите парникови
    газове, на референтни стойности за периода
    от 1 януари 2021 г. до 31 декември 2023 г. за всеки
    производител или вносител, който законно е
    пускал флуоровъглеводороди на пазара в Съюза,
    считано от 1 януари 2015 г., както е докладвано
