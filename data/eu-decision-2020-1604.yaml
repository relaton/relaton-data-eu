    i Vijeća o fluoriranim stakleničkim plinovima, za razdoblje od 1. siječnja
    2021. do 31. prosinca 2023. za svakog proizvođača ili uvoznika koji je fluorougljikovodike
    zakonito stavio na tržište Unije od 1. siječnja 2015., kako je prijavljeno
