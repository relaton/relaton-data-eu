title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/1604 of 23 October 2020 determining,
    pursuant to Regulation (EU) No 517/2014 of the European Parliament and of the
    Council on fluorinated greenhouse gases, reference values for the period 1 January
    2021 to 31 December 2023 for each producer or importer which has lawfully placed
    hydrofluorocarbons on the market in the Union from 1 January 2015, as reported
    under that Regulation (notified under document C(2020) 9500)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1604 de la Commission du 23 octobre
    2020 établissant, conformément au règlement (UE) no 517/2014 du Parlement européen
    et du Conseil relatif aux gaz à effet de serre fluorés, les valeurs de référence
    pour la période allant du 1er janvier 2021 au 31 décembre 2023 pour chaque producteur
    ou importateur ayant légalement mis sur le marché des hydrofluorocarbones à
    partir du 1er janvier 2015 selon les données communiquées en vertu dudit règlement
    [notifiée sous le numéro C(2020) 9500]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1604 der Kommission vom 23. Oktober 2020
    zur Bestimmung — gemäß der Verordnung (EU) Nr. 517/2014 des Europäischen
    Parlaments und des Rates über fluorierte Treibhausgase — von Referenzwerten
    für den Zeitraum 1. Januar 2021 bis 31. Dezember 2023 für jeden Hersteller oder
    Einführer, der gemäß der Verordnung gemeldete Mengen teilfluorierter Kohlenwasserstoffe
    ab dem 1. Januar 2015 rechtmäßig in der Union in Verkehr gebracht hat (Bekannt
    gegeben unter Aktenzeichen C(2020) 9500)
  type: main
- language: bg
  script: Cyrl
