    om fluorholdige drivhusgasser, af referenceværdier for perioden 1. januar 2021
    til 31. december 2023 for hver producent eller importør, der fra den 1. januar
    2015 i Unionen lovligt har markedsført hydrofluorcarboner som indberettet i medfør
