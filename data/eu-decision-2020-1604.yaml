    под номер C(2020) 9500)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/1604 ze dne 23. října 2020,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) č. 517/2014 o
    fluorovaných skleníkových plynech stanovují referenční hodnoty na období
    od 1. ledna 2021 do 31. prosince 2023 pro každého výrobce nebo dovozce, který
    podle uvedeného nařízení oznámil, že od 1. ledna 2015 zákonně uvedl na
    trh v Unii částečně fluorované uhlovodíky (oznámeno pod číslem C(2020)
    9500)
  type: main
