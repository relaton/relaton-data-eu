  content: Komission asetus (EY) N:o 651/98, annettu 23 päivänä maaliskuuta 1998,
    Norjasta peräisin olevan viljellyn merilohen tuontiin sovellettavia lopullisia
    polkumyynti- ja tasoitustulleja koskevien neuvoston asetusten (EY) N:o 1890/97
    ja (EY) N:o 1891/97 muuttamisesta, Norjasta peräisin olevan viljellyn merilohen
    tuontiin sovellettavia väliaikaisia polkumyynti- ja tasoitustulleja koskevan
    asetuksen (EY) N:o 2529/97 muuttamisesta tiettyjen viejien osalta ja päätöksen
    97/634/EY muuttamisesta Norjasta peräisin olevan viljellyn merilohen tuontia
    koskevien polkumyynnin ja tukien vastaisten menettelyjen yhteydessä esitettyjen
    sitoumusten hyväksymisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 651/98 della Commissione del 23 marzo 1998 recante
    modifica dei regolamenti (CE) n. 1890/97 e (CE) n. 1891/97 del Consiglio, che
    istituiscono dazi antidumping e dazi compensativi definitivi sulle importazioni
    di salmone d'allevamento dell'Atlantico originari della Norvegia, del regolamento
    (CE) n. 2529/97, che istituisce dazi antidumping e dazi compensativi provvisori
    su talune importazioni di salmone d'allevamento dell'Atlantico originario della
    Norvegia nei confronti di determinati esportatori, e della decisione 97/634/CE,
    che accetta gli impegni offerti in relazione ai procedimenti antidumping e antisovvenzioni
    nei confronti delle importazioni di salmone dell'Atlantico di allevamento originario
    della Norvegia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 651/98 van de Commissie van 23 maart 1998 houdende
    wijziging van de Verordeningen (EG) nr. 1890/97 en (EG) nr. 1891/97 van de Raad
    tot instelling van respectievelijk een definitief antidumpingrecht en een definitief
    compenserend recht op de invoer van gekweekte Atlantische zalm van oorsprong uit
    Noorwegen, houdende wijziging van Verordening (EG) nr. 2529/97 tot instelling
    van voorlopige antidumpingrechten en compenserende rechten op de invoer van gekweekte
    Atlantische zalm uit Noorwegen voor bepaalde exporteurs, en houdende wijziging
    van Besluit 97/634/EG tot aanvaardiging van verbintenissen die zijn aangeboden
    in het kader van de antidumping- en antisubsidieprocedures betreffende de invoer
    van gekweekte Atlantische zalm van oorsprong uit Noorwegen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 651/98 da Comissão de 23 de Março de 1998 que altera
    os Regulamentos (CE) nº 1890/97 e (CE) nº 1891/97 do Conselho que instituem
    direitos anti- dumping e de compensação definitivos sobre as importações de
    salmão do Atlântico de viveiro originário da Noruega, o Regulamento (CE) nº
    2529/97 que cria direitos anti-dumping e direitos de compensação provisórios
    sobre certas importações de salmão do Atlântico de viveiro originário da
    Noruega e a Decisão 97/634/CE que aceita os compromissos oferecidos no âmbito
    dos processos anti-dumping e anti-subvenções relativos às importações de
    salmão do Atlântico de viveiro originário da Noruega
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 651/98 de la Comisión de 23 de marzo de 1998 por el
    que se modifican los Reglamentos (CE) n° 1890/97 y (CE) n° 1891/97 del Consejo
    por los que se establecen derechos antidumping y compensatorios definitivos sobre
    las importaciones de salmón atlántico de piscifactoría originario de Noruega,
    por el que se modifica el Reglamento (CE) n° 2529/97 por el que se establecen
    derechos antidumping y compensatorios provisionales sobre determinadas importaciones
    de salmón atlántico de piscifactoría originario de Noruega y por el que se
    modifica la Decisión 97/634/CE por la que se aceptan los compromisos ofrecidos
    con respecto a los procedimientos antidumping y antisubvenciones relativos a las
    importaciones de salmón atlántico de piscifactoría originario de Noruega
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 651/98 av den 23 mars 1998 om ändring
    av rådets förordningar (EG) nr 1890/97 och (EG) nr 1891/97 om införande av
    slutgiltiga antidumpnings- och utjämningstullar på import av odlad atlantlax
    med ursprung i Norge, om ändring, vad beträffar vissa exportörer, av förordning
    (EG) nr 2529/97 om införande av preliminära antidumpnings- och utjämningstullar
    på viss import av odlad atlantlax med ursprung i Norge och om ändring av beslut
    97/634/EG om godtagande av åtaganden som gjorts i samband med antidumpnings-
    och antisubventionsförfararandena rörande import av odlad atlantlax med ursprung
    i Norge
