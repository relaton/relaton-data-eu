title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 651/98 of 23 March 1998 amending Council
    Regulations (EC) No 1890/97 and (EC) No 1891/97 imposing definitive anti-dumping
    and countervailing duties on imports of farmed Atlantic salmon originating in
    Norway, amending Commission Regulation (EC) No 2529/97 imposing provisional anti-
    dumping and countervailing duties on imports of farmed Atlantic salmon originating
    in Norway with regard to certain exporters and amending Commission Decision 97/634/EC
    accepting undertakings offered in connection with the anti-dumping and anti-subsidies
    proceedings concerning imports of farmed Atlantic salmon originating in Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 651/98 de la Commission du 23 mars 1998 modifiant les
    règlements (CE) n° 1890/97 et (CE) n 1891/97 instituant des droits antidumping
    et compensateurs définitifs sur les importations de saumons atlantiques d'élevage
    originaires de Norvège, modifiant le règlement (CE) n° 2529/97 instituant des
    droits antidumping et compensateurs provisoires sur certaines importations de
    saumons atlantiques d'élevage originaires de Norvège et modifiant la décision
    97/634/CE portant acceptation des engagements offerts dans le cadre de la procédure
    antidumping et de la procédure antisubventions concernant les importations de
    saumons atlantiques d'élevage originaires de Norvège
  type: main
