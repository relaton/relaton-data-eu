- language: en
  script: Latn
  content: Council Regulation (EEC) No 2428/89 of 28 July 1989 on the application
    of Decision No 1/89 of the EEC-Cyprus Association Council derogating from the
    provisions concerning the definition of the concept of "originating products"
    laid down in the agreement establishing an association between the European economic
    Community and the Republic of Cyprus
  type: main
- language: fr
  script: Latn
