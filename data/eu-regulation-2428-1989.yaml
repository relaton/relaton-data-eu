    fra bestemmelserne vedrørende definitionen af begrebet »varer med oprindelsesstatus«
    i Aftalen om Oprettelse af en Associering mellem Det Europæiske Økonomiske Fællesskab
    og Republikken Cypern
  type: main
- language: el
  script: Grek
