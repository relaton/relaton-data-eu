id: EURegulation20241170
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1170 of 23 April 2024 amending
    Annexes IV, VIII, XIII, XIV and XV to Implementing Regulation (EU) 2021/404 as
    regards the lists of third countries or territories, or zones thereof, authorised
    for the entry into the Union of consignments of certain animals and products of
    animal origin, and correcting Annex XIV thereto as regards the list of third countries
    or territories, or zones thereof, authorised for the entry into the Union of consignments
    of fresh meat of poultry and game birds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1170 de la Commission du 23 avril 2024
    modifiant les annexes IV, VIII, XIII, XIV et XV du règlement d’exécution (UE)
    2021/404 en ce qui concerne les listes des pays tiers, territoires et zones de
    pays tiers et territoires en provenance desquels l’entrée dans l’Union d’envois
    de certains animaux et produits d’origine animale est autorisée, et rectifiant
    son annexe XIV en ce qui concerne la liste des pays tiers, territoires et zones
    de pays tiers et territoires en provenance desquels l’entrée dans l’Union
    d’envois de viandes fraîches de volailles et de gibier à plumes est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/1170 der Kommission vom 23. April 2024
    zur Änderung der Anhänge IV, VIII, XIII, XIV und XV der Durchführungsverordnung
    (EU) 2021/404 hinsichtlich der Listen der Drittländer, Gebiete oder Zonen derselben,
    aus denen der Eingang von Sendungen von bestimmten Tieren und Erzeugnissen tierischen
    Ursprungs in die Union zulässig ist, und zur Berichtigung des Anhangs XIV hinsichtlich
    der Liste der Drittländer, Gebiete oder Zonen derselben, aus denen der Eingang
    von Sendungen von frischem Fleisch von Geflügel und Federwild die Union zulässig
    ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/1170 на Комисията
    от 23 април 2024 година за изменение на приложения
    IV, VIII, XIII, XIV и XV към Регламент за изпълнение
    (ЕС) 2021/404 по отношение на списъците на трети
    държави или територии или зони от тях, от които
    е разрешено въвеждането в Съюза на пратки с
    определени животни и продукти от животински
    произход, и за поправка на приложение XIV към
    него по отношение на списъка на трети държави
    или територии или зони от тях, от които е разрешено
    въвеждането в Съюза на пратки с прясно месо
    от домашни птици и пернат дивеч
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/1170 ze dne 23. dubna 2024, kterým
    se mění přílohy IV, VIII, XIII, XIV a XV prováděcího nařízení (EU) 2021/404,
    pokud jde o seznamy třetích zemí nebo území nebo jejich oblastí, z nichž
    je povolen vstup zásilek určitých zvířat a produktů živočišného původu
    do Unie, a kterým se opravuje příloha XIV uvedeného nařízení, pokud jde
    o seznam třetích zemí nebo území či jejich oblastí, z nichž je povolen
    vstup zásilek čerstvého masa drůbeže a pernaté zvěře do Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/1170 af 23. april 2024
    om ændring af bilag IV, VIII, XIII, XIV og XV til gennemførelsesforordning (EU)
    2021/404 for så vidt angår listerne over tredjelande eller territorier eller
    zoner deri, hvorfra det er tilladt at indføre sendinger af visse dyr og animalske
    produkter til Unionen, og om berigtigelse af bilag XIV hertil for så vidt angår
    listen over tredjelande eller territorier eller zoner deri, hvorfra det er tilladt
    at indføre sendinger af fersk kød af fjerkræ og fjervildt til Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/1170 της Επιτροπής,
    της 23ης Απριλίου 2024, για την τροποποίηση των
    παραρτημάτων IV, VIII, XIII, XIV και XV του εκτελεστικού
    κανονισμού (ΕΕ) 2021/404 όσον αφορά τους καταλόγους
    τρίτων χωρών ή εδαφών ή ζωνών αυτών από τις
    οποίες / τα οποία επιτρέπεται η είσοδος στην
    Ένωση φορτίων ορισμένων ζώων και προϊόντων
    ζωικής προέλευσης, και για τη διόρθωση του
    παραρτήματος XIV του εν λόγω κανονισμού όσον
    αφορά τον κατάλογο τρίτων χωρών ή εδαφών ή
    ζωνών αυτών από τις οποίες/τα οποία επιτρέπεται
