    πουλερικών και πτερωτών θηραμάτων
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2024/1170, 23. aprill 2024, millega muudetakse
    rakendusmääruse (EL) 2021/404 IV, VIII, XIII, XIV ja XV lisa selliste kolmandate
    riikide või territooriumide või nende tsoonide loetelude osas, millest on lubatud
    liitu tuua teatavate loomade ja loomsete saaduste saadetisi, ning parandatakse
    kõnealuse määruse XIV lisa selliste kolmandate riikide või territooriumide
    või nende tsoonide loetelu osas, millest on lubatud liitu tuua kodulindude ja
    uluklindude värske liha saadetisi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2024/1170, annettu 23 päivänä
    huhtikuuta 2024, täytäntöönpanoasetuksen (EU) 2021/404 liitteiden IV, VIII,
    XIII, XIV ja XV muuttamisesta siltä osin kuin on kyse niiden kolmansien maiden
    tai alueiden tai niiden vyöhykkeiden luetteloista, joista tiettyjen eläinten
    ja eläinperäisten tuotteiden lähetysten saapuminen unioniin on sallittua, ja
    liitteen XIV oikaisemisesta siltä osin kuin on kyse niiden kolmansien maiden
    tai alueiden tai niiden vyöhykkeiden luettelosta, joista siipikarjan ja riistalintujen
    tuoreen lihan saapuminen unioniin on sallittua
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/1170 ón gCoimisiún an 23 Aibreán
    2024 lena leasaítear Iarscríbhinní IV, VIII, XIII, XIV agus XV a ghabhann le
    Rialachán Cur Chun Feidhme (AE) 2021/404 a mhéid a bhaineann leis na liostaí
    de thríú tíortha nó de chríocha, nó de chriosanna de thríú tír nó de
    chríoch, óna n-údaraítear coinsíneachtaí d’ainmhithe áirithe agus de
    tháirgí áirithe de bhunadh ainmhíoch, agus lena gceartaítear Iarscríbhinn
    XIV a ghabhann leis a mhéid a bhaineann leis an liosta de thríú tíortha nó
    de chríocha, nó de chriosanna de thríú tír nó de chríoch, óna n-údaraítear
    coinsíneachtaí d’fheoil úr ó éanlaith chlóis agus ó éanlaith ghéim
    a theacht isteach san Aontas
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/1170 оd 23. travnja 2024. o izmjeni
    priloga IV., VIII., XIII., XIV. i XV. Provedbenoj uredbi (EU) 2021/404 u pogledu
    popisa trećih zemalja ili područja ili njihovih zona iz kojih je odobren ulazak
    u Uniju pošiljaka određenih životinja i proizvoda životinjskog podrijetla
    te o ispravku njezina Priloga XIV. u pogledu popisa trećih zemalja ili područja
    ili njihovih zona iz kojih je odobren ulazak u Uniju pošiljaka svježeg mesa
    peradi i pernate divljači
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/1170 végrehajtási rendelete (2024. április 23.)
    az (EU) 2021/404 végrehajtási rendelet IV., VIII., XIII., XIV. és XV. mellékletének
    az egyes állatok és állati eredetű termékek szállítmányainak az Unióba
    történő beléptetése tekintetében engedélyezett harmadik országok, területek
    vagy azok körzetei jegyzékei tekintetében történő módosításáról, valamint
    az említett rendelet XIV. mellékletének a baromfi és szárnyas vadak friss
    húsát tartalmazó szállítmányok Unióba történő beléptetése tekintetében
    engedélyezett harmadik országok, területek vagy azok körzeteinek jegyzéke
    tekintetében történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/1170 della Commissione, del 23 aprile
    2024, che modifica gli allegati IV, VIII, XIII, XIV e XV del regolamento di esecuzione
    (UE) 2021/404 per quanto riguarda gli elenchi di paesi terzi o territori o loro
    zone da cui è autorizzato l’ingresso nell’Unione di partite di determinati
    animali e prodotti di origine animale e che rettifica l’allegato XIV di tale
    regolamento per quanto riguarda l’elenco di paesi terzi o territori o loro zone
    da cui è autorizzato l’ingresso nell’Unione di partite di carni fresche di
    pollame e selvaggina da penna
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/1170 (2024. gada 23. aprīlis),
    ar ko attiecībā uz tādu trešo valstu, teritoriju vai to zonu sarakstiem, no
    kurām atļauts Savienībā ievest noteiktu dzīvnieku un dzīvnieku izcelsmes
    produktu sūtījumus, groza Īstenošanas regulas (ES) 2021/404 IV, VIII, XIII,
    XIV un XV pielikumu un attiecībā uz tādu trešo valstu, teritoriju vai to zonu
    sarakstu, no kurām Savienībā atļauts ievest svaigu mājputnu un medījamo
    putnu gaļu, labo tās XIV pielikumu
  type: main
- language: lt
  script: Latn
  content: 2024 m. balandžio 23 d. Komisijos įgyvendinimo reglamentas (ES) 2024/1170,
    kuriuo dėl trečiųjų šalių, teritorijų arba jų zonų, iš kurių leidžiama
    į Sąjungą įvežti tam tikrus gyvūnus ir gyvūninius produktus, sąrašų
    iš dalies keičiami Įgyvendinimo reglamento (ES) 2021/404 IV, VIII, XIII, XIV
    ir XV priedai ir dėl trečiųjų šalių, teritorijų arba jų zonų, iš kurių
    leidžiama į Sąjungą įvežti šviežios naminių ir medžiojamųjų paukščių
    mėsos siuntas, sąrašo ištaisomas to reglamento XIV priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/1170 tat-23
    ta’ April 2024 li jemenda l-Annessi IV, VIII, XIII, XIV u XV tar-Regolament
    ta’ Implimentazzjoni (UE) 2021/404 fir-rigward tal-listi ta’ pajjiżi terzi
    jew territorji, jew żoni tagħhom, awtorizzati għad-dħul fl-Unjoni ta’ konsenji
    ta’ ċerti annimali u prodotti li joriġinaw mill-annimali, u li jikkoreġi
    l-Anness XIV tiegħu fir-rigward tal-lista ta’ pajjiżi terzi jew territorji,
    jew żoni tagħhom, awtorizzati għad-dħul fl-Unjoni ta’ konsenji ta’ laħam
    frisk tal-pollam u tal-għasafar tal-kaċċa
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/1170 van de Commissie van 23 april 2024
    tot wijziging van de bijlagen IV, VIII, XIII, XIV en XV bij Uitvoeringsverordening
    (EU) 2021/404 wat betreft de lijsten van derde landen of gebieden of zones daarvan
    waaruit de binnenkomst in de Unie van zendingen van bepaalde dieren en producten
    van dierlijke oorsprong is toegestaan, en tot rectificatie van bijlage XIV bij
    die verordening wat betreft de lijst van derde landen of gebieden of zones daarvan
    waaruit de binnenkomst in de Unie van zendingen vers vlees van pluimvee en vederwild
    is toegestaan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/1170 z dnia 23 kwietnia 2024
    r. w sprawie zmiany załączników IV, VIII, XIII, XIV i XV do rozporządzenia
    wykonawczego (UE) 2021/404 w odniesieniu do wykazów państw trzecich, terytoriów
    lub ich stref, z których dozwolone jest wprowadzanie do Unii przesyłek niektórych
    zwierząt i produktów pochodzenia zwierzęcego oraz w sprawie sprostowania załącznika
