  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/1170 da Comissão, de 23 de abril de
    2024, que altera os anexos IV, VIII, XIII, XIV e XV do Regulamento de Execução
    (UE) 2021/404 no que diz respeito às listas de países terceiros ou territórios,
    ou respetivas zonas, autorizados para a entrada na União de remessas de determinados
    animais e produtos de origem animal e que retifica o anexo XIV no que diz respeito
    à lista de países terceiros ou territórios, ou respetivas zonas, autorizados
    para a entrada na União de remessas de carne fresca de aves de capoeira e aves
    de caça
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/1170 al Comisiei din 23 aprilie
    2024 de modificare a anexelor IV, VIII, XIII, XIV și XV la Regulamentul de punere
    în aplicare (UE) 2021/404 în ceea ce privește listele cu țările terțe, teritoriile
    sau zonele din acestea autorizate pentru introducerea în Uniune a transporturilor
    de anumite animale și produse de origine animală și de rectificare a anexei
    XIV la acesta în ceea ce privește lista cu țările terțe, teritoriile sau
    zonele din acestea autorizate pentru introducerea în Uniune a transporturilor
    de carne proaspătă de păsări de curte și de vânat cu pene
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/1170 z 23. apríla 2024, ktorým
    sa menia prílohy IV, VIII, XIII, XIV a XV k vykonávaciemu nariadeniu (EÚ) 2021/404,
    pokiaľ ide o zoznamy tretích krajín, území alebo ich pásiem, z ktorých
    je povolený vstup zásielok určitých zvierat a produktov živočíšneho pôvodu
    do Únie, a ktorým sa opravuje príloha XIV k uvedenému nariadeniu, pokiaľ
    ide o zoznam tretích krajín, území alebo ich pásiem, z ktorých je povolený
    vstup zásielok čerstvého mäsa z hydiny a pernatej zveri do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/1170 z dne 23. aprila 2024 o spremembi
    prilog IV, VIII, XIII, XIV in XV k Izvedbeni uredbi (EU) 2021/404 glede seznamov
    tretjih držav ali ozemelj ali njihovih območij, s katerih je dovoljen vstop
    pošiljk nekaterih živali in proizvodov živalskega izvora v Unijo, ter o popravku
    Priloge XIV k navedeni uredbi glede seznama tretjih držav ali ozemelj ali njihovih
    območij, s katerih je dovoljen vstop pošiljk svežega mesa perutnine in pernate
    divjadi v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/1170 de la Comisión, de 23 de abril
    de 2024, por el que se modifican los anexos IV, VIII, XIII, XIV y XV del Reglamento
    de Ejecución (UE) 2021/404 en lo que respecta a las listas de terceros países
    o territorios, o zonas de estos, desde los que se autoriza la entrada en la Unión
    de partidas de determinados animales y productos de origen animal, y se corrige
    su anexo XIV en lo que respecta a la lista de terceros países o territorios,
    o zonas de estos, desde los que se autoriza la entrada en la Unión de partidas
    de carne fresca de aves de corral y aves de caza
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/1170 av den 23 april 2024
    om ändring av bilagorna IV, VIII, XIII, XIV och XV till genomförandeförordning
    (EU) 2021/404 vad gäller förteckningarna över tredjeländer, territorier eller
    zoner däri från vilka sändningar av vissa djur och produkter av animaliskt
    ursprung får föras in till unionen och om rättelse av bilaga XIV till den genomförandeförordningen
    vad gäller förteckningen över tredjeländer, territorier eller zoner däri
    från vilka sändningar av färskt kött från fjäderfä och fjädervilt får
    föras in till unionen
