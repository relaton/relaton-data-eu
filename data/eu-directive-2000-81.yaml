    ta' livelli massimi ta' residwi tal-pestiċidi fi u fuq iċ-ċereali, fl-oġġetti
    ta' l-ikel li ġejjin mill-annimali u f'ċerti prodotti li joriġinaw mill-pjanti,
    inklużi l-frott u l-ħxejjex, rispettivamentTest b'relevanza ŻEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2000/81/EG van de Commissie van 18 december 2000 houdende wijziging
    van de bijlagen bij de Richtlijnen 86/362/EEG, 86/363/EEG en 90/642/EEG van de
    Raad tot vaststelling van maximumgehalten aan residuen van bestrijdingsmiddelen
    in en op respectievelijk granen, levensmiddelen van dierlijke oorsprong en bepaalde
    producten van plantaardige oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2000/81/WE z dnia 18 grudnia 2000 r. zmieniająca załączniki
    do dyrektyw Rady 86/362/EWG, 86/363/EWG oraz 90/642/EWG w sprawie ustalania najwyższych
    dopuszczalnych poziomów pozostałości pestycydów w zbożach, środkach spożywczych
    pochodzenia zwierzęcego i w niektórych produktach pochodzenia roślinnego, w
    tym w owocach i warzywach, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/81/CE da Comissão, de 18 de Dezembro de 2000, que altera
    os anexos das Directivas 86/362/CEE, 86/363/CEE e 90/642/CEE do Conselho relativas
    à fixação de teores máximos para os resíduos de pesticidas à superfície
    e no interior dos cereais, dos géneros alimentícios de origem animal e de determinados
    produtos de origem vegetal, incluindo frutas e produtos hortícolas, respectivamente
  type: main
- language: ro
  script: Latn
  content: Directiva 2000/81/CE a Comisiei din 18 decembrie 2000 de modificare a anexelor
    la Directivele 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului de stabilire
    a conținuturilor maxime de reziduuri de pesticide din și de pe cereale, alimente
    de origine animală și anumite produse de origine vegetală, inclusiv fructe
    și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2000/81/ES z 18. decembra 2000, ktorou sa menia a dopĺňajú
    prílohy k smerniciam Rady 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálnych
    úrovní rezíduí pesticídov v a na obilninách, potravinách živočíšneho
    pôvodu a určitých výrobkoch rastlinného pôvodu, vrátane ovocia respektíve
    zeleniny
  type: main
