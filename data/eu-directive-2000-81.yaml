    limitů reziduí pesticidů v obilovinách, v potravinách živočišného původu
    a v některých produktech rostlinného původu, včetně ovoce a zeleniny, a
    na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2000/81/EF af 18. december 2000 om ændring af bilagene
    til Rådets direktiv 86/362/EØF, 86/363/EØF og 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for indholdet af pesticidrester i og på korn, i og
    på levnedsmidler af animalsk oprindelse og på og i visse produkter af vegetabilsk
    oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2000/81/ΕΚ της Επιτροπής, της 18ης Δεκεμβρίου
