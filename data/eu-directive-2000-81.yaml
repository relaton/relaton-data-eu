title:
- language: en
  script: Latn
  content: Commission Directive 2000/81/EC of 18 December 2000 amending the Annexes
    to Council Directives 86/362/EEC, 86/363/EEC and 90/642/EEC on the fixing of maximum
    levels for pesticide residues in and on cereals, foodstuffs of animal origin and
    certain products of plant origin, including fruit and vegetables, respectively
  type: main
- language: fr
  script: Latn
  content: Directive 2000/81/CE de la Commission du 18 décembre 2000 modifiant les
    annexes des directives 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil concernant
    la fixation de teneurs maximales pour les résidus de pesticides respectivement
    sur et dans les céréales, les denrées alimentaires d'origine animale et certains
    produits d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/81/EG der Kommission vom 18. Dezember 2000 zur Änderung
    der Anhänge der Richtlinien 86/362/EWG, 86/363/EWG und 90/642/EWG des Rates über
    die Festsetzung von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln
    auf und in Getreide, Lebensmitteln tierischen Ursprungs und bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/81/ЕО на Комисията от 18 декември
    2000 година за изменение на приложенията към
    Директиви 86/362/ЕИО, 86/363/ЕИО и 90/642/ЕИО на Съвета
    относно определянето на максимални количества
    на остатъци от пестициди във и върху зърнените
    култури, храните от животински произход и някои
    продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2000/81/ES ze dne 18. prosince 2000, kterou se mění
