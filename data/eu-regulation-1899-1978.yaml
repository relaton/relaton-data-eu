title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1899/78 of 2 August 1978 re-establishing
    the levying of the customs duties on parts of electrical generators, motors, etc.,
    falling within subheading 85.01 C and originating in Yugoslavia, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2705/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1899/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux parties
    et pièces détachées de machines génératrices, moteurs, etc., de la sous-
    position 85.01 C du tarif douanier commun, originaires de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1899/78 der Kommission vom 2. August 1978 zur Wiedereinführung
    des Zollsatzes für Teile von elektrischen Generatoren ; Elektromotoren usw. der
    Tarif stelle 85.01 C mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG)
    Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1899/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for dele af elektriske generatorer, motorer, under
    underposition 85.01 C, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1899/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle parti e pezzi staccati
    di macchine generatrici, motori, ecc., della sottovoce doganale 85.01 C, originari
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1899/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op delen en
    onderdelen van generatoren, elektromotoren enz., van post 85.01 C, van oorsprong
    uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de
    Raad algemene tariefpreferenties werden geopend
  type: main
