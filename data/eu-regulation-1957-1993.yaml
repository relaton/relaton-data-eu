  content: COMMISSION REGULATION (EEC) No 1957/93 of 19 July 1993 re-establishing
    the levying of customs duties on products falling within CN code ex 4104, originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
