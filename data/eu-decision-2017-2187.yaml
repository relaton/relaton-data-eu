title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/2187 of 16 November 2017 extending
    the period of validity of Implementing Decision (EU) 2015/179 authorising Member
    States to provide for a derogation from certain provisions of Council Directive
    2000/29/EC in respect of wood packaging material of conifers (Coniferales) in
    the form of ammunition boxes originating in the United States of America under
    the control of the United States Department of Defence (notified under document
    C(2017) 7489)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/2187 de la Commission du 16 novembre 2017
    prolongeant la période de validité de la décision d'exécution (UE) 2015/179
    autorisant les États membres à prévoir une dérogation à certaines dispositions
    de la directive 2000/29/CE du Conseil en ce qui concerne des matériaux d'emballage
    en bois de conifères (Coniferales) sous forme de boîtes à munitions originaires
    des États-Unis d'Amérique et placées sous le contrôle du ministère américain
    de la défense [notifiée sous le numéro C(2017) 7489]
