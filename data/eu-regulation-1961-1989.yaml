    séchées ainsi que le montant de l'aide à la production pour les pruneaux
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1961/89 DER KOMMISSION vom 30. Juni 1989 zur Festsetzung
