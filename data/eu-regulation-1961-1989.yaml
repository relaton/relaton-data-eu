    Produktionsbeihilfe für Trockenpflaumen im Wirtschaftsjahr 1989/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1961/89 af 30. juni 1989 om fastsættelse
