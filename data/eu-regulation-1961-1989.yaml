  content: Commission Regulation (EEC) No 1961/89 of 30 June 1989 fixing for the 1989/90
    marketing year the minimum price to be paid to producers for dried plums and the
    amount of production aid for prunes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1961/89 de la Commission du 30 juin 1989 fixant, pour
