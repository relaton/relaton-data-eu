    τιμής που καταβάλλεται στους παραγωγούς για
    τα ξηρά δαμάσκηνα και της ενίσχυσης στην παραγωγή
    για τα ξηρά δαμάσκηνα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1961/89 DELLA COMMISSIONE del 30 giugno 1989 che
