title:
- language: en
  script: Latn
  content: '93/680/EC: Commission Decision of 15 December 1993 authorizing Greece,
    Spain, Italy and Portugal to provide for derogations from Council Directive 77/93/EEC
    in respect of seed potatoes originating in Canada (Only the Greek, Italian, Spanish
    and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/680/CE: Décision de la Commission du 15 décembre 1993 autorisant
    la Grèce, l''Espagne, l''Italie et le Portugal à prévoir des dérogations à
    la directive 77/93/CEE du Conseil en ce qui concerne les plants de pommes de terre
    originaires du Canada (Les textes en langues espagnole, grecque, italienne et
    portugaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/680/EG: Entscheidung der Kommission vom 15. Dezember 1993 zur Ermächtigung
    Griechenlands, Spaniens, Italiens und Portugals für Pflanzkartoffeln mit Ursprung
    in Kanada Ausnahmen von der Richtlinie 77/93/EWG des Rates vorzusehen (Nur der
    griechische, spanische, italienische und portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/680/EF: Kommissionens beslutning af 15. december 1993 om bemyndigelse
    af Grækenland, Spanien, Italien og Portugal til at fastsætte undtagelser fra
    Rådets direktiv 77/93/EØF for så vidt angår læggekartofler med oprindelse
    i Canada (Kun de græske, spanske, italienske og portugisiske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '93/680/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 15ης Δεκεμβρίου
    1993 με την οποία εξουσιοδοτούνται η Ελλάδα,
    η Ισπανία, η Ιταλία και η Πορτογαλία να προβλέπουν
    παρεκκλίσεις από την οδηγία 77/93/ΕΟΚ του Συμβουλίου
    όσον αφορά τους σπόρους γεώμηλων προς φύτευση
    καταγωγής Καναδά (Τα κείμενα στην ελληνική,
    ισπανική, ιταλική και πορτογαλική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '93/680/CE: Decisione della Commissione del 15 dicembre 1993 che autorizza
    la Grecia, la Spagna, l''Italia e il Portogallo a stabilire deroghe alla direttiva
    77/93/CEE del Consiglio per quanto riguarda i tuberi-seme di patata originari
    del Canada (I testi in lingua greca, spagnola, italiana e portoghese sono i soli
    facenti fede)'
  type: main
- language: nl
