title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 juillet 1972, autorisant la République
    française à exclure du traitement communautaire les poireaux verts en poudre,
    de la position 07.04 Ex B du Tarif douanier commun, originaires de la République
    populaire de Chine et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/267/EWG: Entscheidung der Kommission vom 4. Juli 1972, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammenden
    und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen Lauch in Puderform
    der Tarifnummer 07.04 ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/267/CEE: Decisione della Commissione, del 4 luglio 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i porri verdi
    in polvere della voce n. 07.04 ex B della tariffa doganale comune, originari della
    Repubblica popolare cinese e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/267/EEG: Beschikking van de Commissie van 4 juli 1972 waarbij de Franse
    Republiek wordt gemachtigd groene prei in poedervorm van post 07.04 ex B van het
    gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek China en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
