id: EUDecision1975662
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 July 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to electric motors falling within heading No ex 85.01 of the
    Common Customs Tariff, originating in Bulgaria and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '75/662/CEE: Décision de la Commission, du 29 juillet 1975, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les moteurs électriques, de la position
    Ex 85.01 du Tarif douanier commun, originaires de Bulgarie et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 29. Juli 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Bulgarien stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche elektrische Motoren, der Tarifnummer ex 85.01 des Gemeinsamen
    Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 29. juli 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage elektriske motorer, som henhører under pos. ex 85.01 i den fælles
    toldtarif, har oprindelse i Bulgarien og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 29 luglio 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i motori elettrici della voce ex 85.01 della tariffa
    doganale comune, originari della Bulgaria e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 29 juli 1975 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    elektromotoren van post ex 85.01 A van het gemeenschappelijk douanetarief, van
    oorsprong uit Bulgarije en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
