id: EURegulation13252002
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1325/2002 of 22 July 2002 initiating a "new
    exporter" review of Council Regulation (EC) No 1600/1999 imposing definitive anti-dumping
    duties on imports of stainless steel wires with a diameter of 1 mm or more originating
    in India, repealing the duty with regard to imports from one exporter in this
    country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1325/2002 de la Commission du 22 juillet 2002 portant
    ouverture d'un réexamen au titre de "nouvel exportateur" du règlement (CE) n°
    1600/1999 du Conseil instituant un droit antidumping définitif sur les importations
    de fils en aciers inoxydables d'un diamètre égal ou supérieur à 1 millimètre
    originaires de l'Inde, abrogeant le droit en ce qui concerne les importations
    d'un exportateur de ce pays et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1325/2002 der Kommission vom 22. Juli 2002 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 1600/1999 des Rates zur Einführung
    endgültiger Antidumpingzölle auf die Einfuhren von Draht aus nicht rostendem
    Stahl mit einem Durchmesser von 1 mm oder mehr mit Ursprung in Indien (Überprüfung
    für einen neuen Ausführer), zur Außerkraftsetzung des Zolls gegenüber den
    Einfuhren der Ware von einem Ausführer in diesem Land und zur zollamtlichen Erfassung
    dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1325/2002 af 22. juli 2002 om indledning
    af en fornyet undersøgelse vedrørende en ny eksportør af Rådets forordning
    (EF) nr. 1600/1999 om indførelse af en endelig antidumpingtold på importen af
    tråd af rustfrit stål af diameter 1 mm og derover med oprindelse i Indien og
    om suspension af tolden for så vidt angår importen fra en eksportør i dette
    land og om at gøre denne import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1325/2002 της Επιτροπής,
    της 22ας Ιουλίου 2002, για έναρξη επανεξέτασης
    όσον αφορά έναν "νέο εξαγωγέα" στο πλαίσιο του
    κανονισμού (ΕΚ) αριθ. 1600/1999 του Συμβουλίου περί
    επιβολής οριστικού δασμού αντιντάμπινγκ στις
    εισαγωγές συρμάτων από ανοξείδωτο χάλυβα με
    διάμετρο 1 mm ή μεγαλύτερη, καταγωγής Ινδίας,
    για την κατάργηση του δασμού όσον αφορά τις
    εισαγωγές ενός εξαγωγέα της ως άνω χώρας και
    για την καταγραφή των εν λόγω εισαγωγών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1325/2002, annettu 22 päivänä heinäkuuta
    2002, lopullisten polkumyyntitullien käyttöönotosta Intiasta peräisin olevan,
    läpimitaltaan vähintään 1 mm:n ruostumattoman teräslangan tuonnissa annettuun
    neuvoston asetukseen (EY) N:o 1600/1999 liittyvän "uutta viejää" koskevan tarkastelun
    vireillepanosta, yhden kyseisen maan viejän tuontiin sovellettavan tullin kumoamisesta
    ja tällaisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1325/2002 della Commissione, del 22 luglio 2002, che
    avvia un riesame relativo ai "nuovi esportatori" del regolamento (CE) n. 1600/1999
    del Consiglio che impone un dazio antidumping definitivo sulle importazioni di
    filo di acciaio inossidabile, di diametro pari o superiore a 1 mm, originarie
    dell'India, che abroga il dazio in vigore nei confronti delle importazioni di
    un esportatore di tale paese e stabilisce che tali importazioni sono soggette
    a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1325/2002 van de Commissie van 22 juli 2002 tot inleiding
    van een procedure, ten behoeve van een nieuwe exporteur, voor de herziening van
    Verordening (EG) nr. 1600/1999 van de Raad tot instelling van een definitief antidumpingrecht
    op roestvrĳ staaldraad met een diameter van 1 mm of meer uit India, tot intrekking
    van het recht voor een exporteur in dit land en tot registratie van de invoer
    van het product van deze exporteur
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1325/2002 da Comissão, de 22 de Julho de 2002, que
    inicia um reexame sobre um novo exportador no âmbito do Regulamento (CE) n.°
    1600/1999 do Conselho, que institui direitos anti-dumping definitivos sobre as
    importações de fios de aço inoxidável de diâmetro igual ou superior a 1 mm,
    originários da Índia, e que revoga o direito sobre as importações de um exportador
    indiano, sujeitando-as a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1325/2002 de la Comisión, de 22 de julio de 2002,
    por el que se inicia un procedimiento de reconsideración para "un nuevo exportador"
    del Reglamento (CE) n° 1600/1999 del Consejo por el que se establecen derechos
    antidumping definitivos sobre las importaciones de alambre de acero inoxidable
    de diámetro igual o mayor de 1 mm originario de la India, y por el que se deroga
    el derecho aplicable a las importaciones de un exportador de este país y se someten
    a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1325/2002 av den 22 juli 2002 om inledande
    av en översyn avseende en ny exportör av rådets förordning (EG) nr 1600/1999
    rörande införande av slutgiltiga antidumpningstullar på import av tråd av
    rostfritt stål med en diameter av minst 1 mm med ursprung i Republiken Indien
    och om upphävande av tullen på import från en exportör i det landet och om
    registrering av denna import
  type: main
