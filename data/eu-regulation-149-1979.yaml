title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 149/79 of 26 January 1979 derogating in
    respect of the countries of the Association of South East Asian Nations from Articles
    1, 6 and 13 of Commission Regulation (EEC) No 148/79 of 26 January 1979 on the
    definition of the concept of originating products for purposes of the application
    of tariff preferences granted by the European Economic Community in respect of
    certain products from developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 149/79 de la Commission, du 26 janvier 1979, portant
    dérogation, pour les pays de l' Association des nations de l' Asie du Sud-Est,
    aux articles 1er, 6 et 13 du règlement (CEE) n° 148/79 de la Commission, du
    26 janvier 1979, relatif à la définition de la notion de produits originaires
    pour l' application des préférences tarifaires accordées par la Communauté
    économique européenne à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 149/79 der Kommission vom 26. Januar 1979 über die
    zugunsten der Assoziation der südostasiatischen Länder vorgesehene Abweichung
    von den Artikeln 1, 6 und 13 der Verordnung (EWG) Nr. 148/79 der Kommission vom
    26. Januar 1979 über die Begriffsbestimmung des Warenursprungs bei der Anwendung
    der von der Europäischen Wirtschaftsgemeinschaft für bestimmte Waren aus Entwicklungsländern
    gewährten Zollpräferenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 149/79 af 26. januar 1979 om undtagelse
    for Associeringen af sydøstasiatiske Lande fra artikel 1, 6 og 13 i Kommissionens
    forordning (EØF) nr. 148/79 af 26. januar 1979 om definitionen af begrebet varer
    med oprindelsesstatus til brug ved anvendelsen af de toldpræferencer, der af
    Det europæiske økonomiske Fællesskab indrømmes visse varer fra udviklingslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 149/79 della Commissione, del 26 gennaio 1979, che
    deroga, a favore dell' associazione delle nazioni dell' Asia del Sud-Est, agli
    articoli 1, 6 e 13 del regolamento (CEE) n. 148/79 della Commissione, del 26 gennaio
    1979, relativo alla definizione della nozione di prodotti originari per l' applicazione
    delle preferenze tariffarie accordate dalla Comunità economica europea a taluni
    prodotti di paesi in via di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 149/79 van de Commissie van 26 januari 1979 houdende
    afwijking voor de landen van de Associatie van landen van Zuidoost Azië van de
    artikelen 1, 6 en 13 van Verordening (EEG) nr. 148/79 van de Commissie van 26
    januari 1979 betreffende de definitie van het begrip "produkten van oorsprong"
    voor de toepassing van de door de Europese Economische Gemeenschap voor bepaalde
    produkten uit ontwikkelingslanden verleende tariefpreferenties
