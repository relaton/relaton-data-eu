title:
- language: en
  script: Latn
  content: '98/400/EC: Commission Decision of 10 June 1998 amending Decision 97/830/EC
    imposing special conditions on the import of pistachios and certain products derived
    from pistachios originating in, or consigned from, Iran (notified under document
    number C(1998) 1509)'
  type: main
- language: fr
  script: Latn
  content: '98/400/CE: Décision de la Commission du 10 juin 1998 modifiant la décision
    97/830/CE imposant des conditions particulières à l''importation de pistaches
    et de certains produits dérivés originaires ou en provenance d''Iran [notifiée
    sous le numéro C(1998) 1509]'
  type: main
- language: de
  script: Latn
  content: '98/400/EG: Entscheidung der Kommission vom 10. Juni 1998 zur Änderung
    der Entscheidung 97/830/EG zur Einführung von Sonderbedingungen für die Einfuhr
    von Pistazien und bestimmten hieraus hergestellten Erzeugnissen mit Ursprung in
    oder Herkunft aus dem Iran (Bekanntgegeben unter Aktenzeichen K(1998) 1509)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 10. června 1998, kterým se mění rozhodnutí
