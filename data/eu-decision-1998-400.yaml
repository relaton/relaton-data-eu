    proizvodov s poreklom iz Irana ali poslanih od tam (notificirana pod dokumentarno
    številko K(1998) 1509)
  type: main
- language: es
  script: Latn
  content: '98/400/CE: Decisión de la Comisión de 10 de junio de 1998 por la que
    se modifica la Decisión 97/830/CE, que fija condiciones especiales para la importación
    de pistachos y determinados productos derivados originarios o procedentes de Irán
    [notificada con el número C(1998) 1509]'
  type: main
- language: sv
  script: Latn
