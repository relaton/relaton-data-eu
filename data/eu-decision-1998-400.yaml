    επιβολής ειδικών όρων για την εισαγωγή φιστικιού
    και ορισμένων άλλων παράγωγων προϊόντων καταγωγής
    ή προελεύσεως Ιράν [κοινοποιηθείσα υπό τον
    αριθμό Ε(1998) 1509]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 10. juuni 1998, millega muudetakse otsust 97/830/EÜ eritingimuste
    kehtestamise kohta Iraanist pärinevate või sealt saadetud pistaatsiapähklite
    ja teatud pistaatsiapähklitoodete impordile (teatavaks tehtud numbri K(1998)
    1509 all)
  type: main
- language: fi
  script: Latn
  content: '98/400/EY: Komission päätös, tehty 10 päivänä kesäkuuta 1998, Iranista
    tuotavien tai Iranista peräisin olevien pistaasipähkinöiden ja eräiden niistä
    valmistettujen tuotteiden tuontiin sovellettavista erityisehdoista tehdyn päätöksen
    97/830/EY muuttamisesta (tiedoksiannettu numerolla K(1998) 1509)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1998. június 10.) az Iránból származó vagy
