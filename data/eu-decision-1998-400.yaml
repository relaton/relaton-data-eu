    některých výrobků z pistácií pocházejících nebo zasílaných z Íránu
    (oznámeno v dokumentu číslo C (1998) 1509)
  type: main
- language: da
  script: Latn
  content: '98/400/EF: Kommissionens beslutning af 10. juni 1998 om ændring af beslutning
    97/830/EF om fastsættelse af særlige betingelser for importen af pistacienødder
    og visse afledte produkter med oprindelse i eller hidrørende fra Iran (meddelt
    under nummer K(1998) 1509)'
  type: main
- language: el
  script: Grek
  content: '98/400/ΕΚ: Απόφαση της Επιτροπής της 10ης Ιουνίου
