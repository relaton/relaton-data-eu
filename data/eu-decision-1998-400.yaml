    u xi prodotti magħmula mill-pistaċċi li joriġinaw jew li twasslu mill-Iran
    (notifikat taħt id-dokument nru K (1998) 1509)
  type: main
- language: nl
  script: Latn
  content: '98/400/EG: Beschikking van de Commissie van 10 juni 1998 tot wijziging
    van Beschikking 97/830/EG houdende vaststelling van bijzondere voorwaarden voor
    de invoer van pimpernoten (pistaches) en bepaalde daarvan afgeleide producten
    van oorsprong of herkomst uit Iran (kennisgeving geschied onder nummer C(1998)
    1509)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 10 czerwca 1998 r. zmieniająca decyzję 97/830/WE
    nakładającą specjalne warunki na przywóz pistacji i niektórych produktów
    uzyskanych z pistacji pochodzących lub wysyłanych z Iranu (notyfikowana jako
    dokument nr C(1998) 1509)
  type: main
- language: pt
  script: Latn
  content: '98/400/CE: Decisão da Comissão de 10 de Junho de 1998 que altera a Decisão
    97/830/CE que impõe condições especiais à importação de pistácios e de
    certos produtos derivados originários ou em proveniência do Irão [notificada
    com o número C(1998) 1509]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 10. júna 1998, ktorým sa mení a dopĺňa rozhodnutie
    97/830/ES, ktorým sa stanovujú osobitné podmienky na dovoz pistácií a určitých
    produktov vyrobených z pistácií s pôvodom v Iráne alebo odoslaných z Iránu
    (oznámené pod číslom dokumentu C(1998) 1509)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 10. junija 1998 o spremembi Odločbe 97/830/ES
