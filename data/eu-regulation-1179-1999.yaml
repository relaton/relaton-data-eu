    sovellettavien alennettujen maatalouden maksuosien ja lisätullien määrittämisestä,
    jotka sisältyvät tiettyjen neuvoston asetuksessa (EY) N:o 3448/93 mainittujen
    tavaroiden yhteisöön suuntautuvaan tuontiin Euroopan unionin ja Israelin välisen
    väliaikaisen sopimuksen mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1179/1999 della Commissione, del 4 giugno 1999, che
