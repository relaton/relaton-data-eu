    1. Juli 1999 bis 30. Juni 2000 bei der Einfuhr bestimmter unter die Verordnung
    (EG) Nr. 3448/93 des Rates fallender Waren in die Gemeinschaft im Rahmen eines
    Interimsabkommens zwischen der Europäischen Union und Israel
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1179/1999 af 4. juni 1999 om en nedsættelse
