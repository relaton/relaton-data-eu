title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1179/1999 of 4 June 1999 determining the
    reduced amounts of agricultural components and additional duties applicable from
    1 July 1999 to 30 June 2000 inclusive to imports into the Community of certain
    goods covered by Council Regulation (EC) No 3448/93 under an Interim Agreement
    between the European Union and Israel
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1179/1999 de la Commission, du 4 juin 1999, déterminant
    les montants des éléments agricoles réduits ainsi que les droits additionnels
    applicables pendant la période allant du 1er juillet 1999 au 30 juin 2000 inclus
    à l'importation dans la Communauté de certaines marchandises relevant du règlement
    (CE) n° 3448/93 du Conseil dans le cadre d'un accord intérimaire entre l'Union
    européenne et Israël
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1179/1999 der Kommission vom 4. Juni 1999 zur Festsetzung
