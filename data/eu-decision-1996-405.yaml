---
id: EUDecision1996405
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '96/405/EC: Commission Decision of 21 June 1996 amending Chapter 7 of Annex
    I to Council Directive 92/118/EEC laying down animal health and public health
    requirements governing trade in and imports into the Community of products not
    subject to the said requirements laid down in specific Community rules referred
    to in Annex A, Chapter I to Directive 89/662/EEC and, as regards pathogens, to
    Directive 90/425/EEC'
  type: main
- language: fr
  script: Latn
  content: '96/405/CE: Décision de la Commission du 21 juin 1996 modifiant l''annexe
    I chapitre 7 de la directive 92/118/CEE du Conseil définissant les conditions
    de police sanitaire ainsi que les conditions sanitaires régissant les échanges
    et les importations dans la Communauté de produits non soumis, en ce qui concerne
    lesdites conditions, aux réglementations communautaires spécifiques visées
    à l''annexe A chapitre Ier de la directive 89/662/CEE et, en ce qui concerne
    les pathogènes, de la directive 90/425/CEE'
  type: main
- language: de
  script: Latn
  content: '96/405/EG: Entscheidung der Kommission vom 21. Juni 1996 zur Änderung
    des Anhangs I Kapitel 7 der Richtlinie 92/118/EWG des Rates über die tierseuchenrechtlichen
    und gesundheitlichen Bedingungen für den Handel mit Erzeugnissen tierischen Ursprungs
    in der Gemeinschaft sowie für ihre Einfuhr in die Gemeinschaft, soweit sie diesbezüglich
    nicht den spezifischen Gemeinschaftsregelungen nach Anhang A Kapitel I der Richtlinie
    89/662/EWG und - in bezug auf Krankheitserreger - der Richtlinie 90/425/EWG unterliegen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 21 юни 1996 година
    за изменение на глава 7 от приложение I към Директива
    92/118/ЕИО на Съвета за определяне на ветеринарно-санитарните
    и здравните изисквания относно търговията
    и вноса в Общността на продукти, които не са
    подчинени, по отношение на посочените изисквания,
    на специалните правила на Общността, посочени
    в глава I от приложение А към Директива 89/662/ЕИО
    и, по отношение на патогените, на Директива
    90/425/ЕИО
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 21. června 1996, kterým se mění kapitola
    7 přílohy I směrnice Rady 92/118/EHS o veterinárních a hygienických předpisech
    pro obchod s produkty živočišného původu ve Společenství a jejich dovoz
    do Společenství, pokud se na ně nevztahují zvláštní předpisy Společenství
    uvedené v kapitole I přílohy A směrnice 89/662/EHS, a pokud jde o patogenní
    původce, směrnice 90/425/EHS
  type: main
- language: da
  script: Latn
  content: '96/405/EF: Kommissionens beslutning af 21. juni 1996 om ændring af kapitel
    7 i bilag I til Rådets direktiv 92/118/EØF om dyresundhedsmæssige og sundhedsmæssige
    betingelser for samhandel med og indførsel til Fællesskabet af produkter, der
    for så vidt angår disse betingelser ikke er underlagt specifikke fællesskabsbestemmelser,
    som omhandlet i bilag A, kapitel I, i direktiv 89/662/EØF, og for så vidt angår
    patogener, i direktiv 90/425/EØF'
  type: main
- language: el
  script: Grek
  content: '96/405/ΕΚ: Απόφαση της Επιτροπής της 21ης Ιουνίου
    1996 για την τροποποίηση του παραρτήματος Ι κεφάλαιο
    7 της οδηγίας 92/118/ΕΟΚ του Συμβουλίου για τον
    καθορισμό των όρων υγειονομικού ελέγχου, καθώς
    και των υγειονομικών όρων που διέπουν τις συναλλαγές
    και τις εισαγωγές στην Κοινότητα προϊόντων
    που δεν υπόκεινται, όσον αφορά τους προαναφερόμενους
    όρους, στις ειδικές κοινοτικές ρυθμίσεις που
    αναφέρονται στο παράρτημα Α κεφάλαιο Ι της
    οδηγίας 89/662/ΕΟΚ και, όσον αφορά τους παθογόνους
    παράγοντες, της οδηγίας 90/425/ΕΟΚ'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 21. juuni 1996, millega muudetakse nõukogu direktiivi
    92/118/EMÜ I lisa 7. peatükki, milles sätestatakse selliste toodete ühendusesisest
    kaubandust ja ühendusse importimist reguleerivad loomade ja inimeste tervishoiunõuded,
    mille suhtes ei kohaldata direktiivi 89/662/EMÜ A lisa I peatükis ja patogeenide
    puhul direktiivis 90/425/EMÜ osutatud ühenduse erieeskirjades sätestatud nõudeid
  type: main
- language: fi
  script: Latn
  content: '96/405/EY: Komission päätös, tehty 21 päivänä kesäkuuta 1996, eläinten
    terveyttä ja kansanterveyttä koskevista vaatimuksista sellaisten tuotteiden
    yhteisön sisäisessä kaupassa ja yhteisöön tuonnissa, joita eivät koske direktiivin
    89/662/ETY ja, taudinaiheuttajien osalta, direktiivin 90/425/ETY liitteessä A
    olevassa I luvussa mainittujen erityisten yhteisön säädösten kyseiset vaatimukset,
    annetun neuvoston direktiivin 92/118/ETY liitteessä I olevan 7 luvun muuttamisesta'
  type: main
- language: hr
  script: Latn
  content: '96/405/EZ: Odluka Komisije od 21. lipnja 1996. o izmjeni poglavlja 7.
    Priloga I. Direktivi Vijeća 92/118/EEZ o utvrđivanju zahtjeva za zdravlje životinja
    i zahtjeva za javno zdravlje kojima se uređuje trgovina i uvoz u Zajednicu proizvoda
    koji ne podliježu navedenim zahtjevima utvrđenim u posebnim pravilima Zajednice
    iz Priloga A poglavlja I. Direktivi 89/662/EEZ te, s obzirom na patogene tvari,
    iz Direktive 90/425/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1996. június 21.) a 89/662/EGK irányelv, illetve
    a kórokozók tekintetében a 90/425/EGK irányelv A. mellékletének I. pontjában
    felsorolt külön közösségi szabályokban megállapított állat-egészségügyi
    és közegészségügyi követelmények hatálya alá nem tartozó termékek Közösségen
    belüli kereskedelmére és a Közösségbe történő behozatalára irányadó
    állat-egészségügyi és közegészségügyi követelmények megállapításáról
    szóló, 92/118/EGK tanácsi irányelv I. melléklete 7. fejezetének módosításáról
  type: main
- language: it
  script: Latn
  content: '96/405/CE: Decisione della Commissione del 21 giugno 1996 recante modifica
    dell''allegato I, capitolo 7, della direttiva 92/118/CEE del Consiglio che stabilisce
    le condizioni sanitarie e di polizia sanitaria per gli scambi e le importazioni
    nella Comunità di prodotti non soggetti, per quanto riguarda tali condizioni,
    alle normative comunitarie specifiche di cui all''allegato A, capitolo I della
    direttiva 89/662/CEE e, per quanto riguarda i patogeni, alla direttiva 90/425/CEE'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1996. gada 21. jūnijs), ar ko groza I pielikuma 7.
    nodaļu Padomes Direktīvā 92/118/EEK, ar kuru nosaka dzīvnieku veselības un
    sabiedrības veselības prasības, kas reglamentē to produktu tirdzniecību un
    importu Kopienā, kuri nav pakļauti minētajām prasībām, kas noteiktas īpašos
    Kopienas noteikumos, kuri minēti Direktīvas 89/662/EEK A pielikuma I nodaļā,
    un attiecībā uz patogēniem – Direktīvā 90/425/EEK
  type: main
- language: lt
  script: Latn
  content: 1996 m. birželio 21 d. Komisijos sprendimas, iš dalies keičiantis Tarybos
    direktyvos 92/118/EEB, nustatančios gyvūnų sveikatos ir visuomenės sveikatos
    reikalavimus, reglamentuojančius produktų, kuriems netaikomi reikalavimai, nustatyti
    specialiose Bendrijos taisyklėse, nurodytose Direktyvos 89/662/EEB A priedo I
    dalyje, ir, ligų sukėlėjų atžvilgiu, Direktyvoje 90/425/EEB, prekybą Bendrijoje
    ir jų importą į Bendriją, I priedo 7 skyrių
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-21 ta' Ġunju 1996 li temenda l-Kapitolu
    7 ta' l-Anness I tad-Direttiva tal-Kunsill 92/118/KEE li jistabbilixxi l-ħtiġiet
    għas-saħħa ta' l-annimali u s-saħħa pubblika li jirregolaw il-kummerċ fi
    u l-importazzjoni fil-Komunità tal-prodotti li ma humiex suġġetti għall-ħtiġiet
    stabbiliti fir-regoli speċifiċi tal-Komunità li hemm referenza dwarhom fl-Anness
    A, il-Kapitolu I tad-Direttiva 89/662/KEE u, fir-rigward tal-patoġeni, tad-Direttiva
    90/425/KEETest b'referenza ŻEE
  type: main
- language: nl
  script: Latn
  content: '96/405/EG: Beschikking van de Commissie van 21 juni 1996 houdende wijziging
    van bijlage I, hoofdstuk 7, bij Richtlijn 92/118/EEG van de Raad tot vaststelling
    van de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer
    en de invoer in de Gemeenschap van produkten waarvoor ten aanzien van deze voorschriften
    geen specifieke communautaire regelgeving geldt als bedoeld in bijlage A, hoofdstuk
    I, van Richtlijn 89/662/EEG, en, wat ziekteverwekkers betreft, van Richtlijn 90/425/EEG'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 21 czerwca 1996 r. zmieniająca rozdział 7 załącznika
    I do dyrektywy Rady 92/118/EWG ustanawiającej wymagania dotyczące zdrowia zwierząt
    i ludzi, regulujące handel i przywóz do Wspólnoty produktów nieobjętych wyżej
    wymienionymi warunkami ustanowionymi w szczególnych zasadach wspólnotowych określonych
    w załączniku A do punktu I do dyrektywy 89/662/EWG oraz w zakresie czynników
    chorobotwórczych do dyrektywy 90/425/EWG
  type: main
- language: pt
  script: Latn
  content: '96/405/CE: Decisão da Comissão de 21 de Junho de 1996 que altera o capítulo
    7 do anexo I da Directiva 92/118/CEE do Conselho, que define as condições sanitárias
    e de polícia sanitária que regem o comércio e as importações na Comunidade
    de produtos não sujeitos, no que respeita às referidas condições, às regulamentações
    comunitárias específicas referidas no capítulo I do anexo A da Directiva 89/662/CEE
    e, no que respeita aos agentes patogénicos, da Directiva 90/425/CEE'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 21 iunie 1996 de modificare a capitolului 7 din anexa
    I la Directiva 92/118/CEE a Consiliului de stabilire a condițiilor de sănătate
    animală și publică care reglementează schimburile și importurile în Comunitate
    de produse care nu intră sub incidența condițiilor menționate, stabilite de
    normele comunitare speciale prevăzute în capitolul I din anexa A la Directiva
    89/662/CEE și, în ceea ce privește agenții patogeni, în Directiva 90/425/CEE
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 21. júna 1996, ktorým sa mení a dopĺňa kapitola
    7 prílohy I smernice Rady 92/118/EHS, ktorou sa stanovujú veterinárne a zdravotné
    požiadavky na obchodovanie s výrobkami, na ktoré sa nevzťahujú takéto požiadavky
    ustanovené v osobitných pravidlách spoločenstva uvedených v prílohe A, kapitole
    I, k smernici 89/662/EHS, a pokiaľ ide o patogény, k smernici 90/425/EHS, a
    na ich dovoz do spoločenstva
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 21. junija 1996 o spremembi Poglavja 7 Priloge
    I k Direktivi Sveta 92/118/EGS o zahtevah glede zdravstvenega varstva živali
    in javnozdravstvenega varstva, ki urejajo trgovino in uvoz v Skupnost za proizvode,
    ki niso predmet navedenih zahtev, določenih v posebnih predpisih Skupnosti iz
    Priloge A, Poglavje I, k Direktivi 89/662/EGS, in glede povzročiteljev bolezni,
    k Direktivi 90/425/EGS
  type: main
- language: es
  script: Latn
  content: '96/405/CE: Decisión de la Comisión de 21 de junio de 1996 por la que
    se modifica el capítulo 7 del Anexo I de la Directiva 92/118/CEE del Consejo
    por la que se establecen las condiciones de policía sanitaria y sanitarias aplicables
    a los intercambios y a las importaciones en la Comunidad de productos no sometidos,
    con respecto a estas condiciones, a las normativas comunitarias específicas a
    que se refiere el capítulo I del Anexo A de la Directiva 89/662/CEE y, por lo
    que se refiere a los patógenos, de la Directiva 90/425/CEE'
  type: main
- language: sv
  script: Latn
  content: '96/405/EG: Kommissionens beslut av den 21 juni 1996 om ändring av bilaga
    I kapitel 7 till rådets direktiv 91/118/EEG om djurhälso- och hygienkrav för
    handel inom gemenskapen med produkter som inte omfattas av sådana krav i de särskilda
    gemenskapsbestämmelser som avses i bilaga A.I till direktiv 89/662/EEG och, i
    fråga om patogener, i direktiv 90/425/EEG'
  type: main
