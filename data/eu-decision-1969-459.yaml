title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 1 décembre 1969, autorisant le Royaume
    des Pays-Bas d'admettre, jusqu'au 31 janvier 1970, la commercialisation des semences
    d'une variété de blé d'hiver soumise à des exigences réduites
  type: main
- language: de
  script: Latn
  content: '69/459/EWG: Entscheidung der Kommission vom 1. Dezember 1969 über die
    Ermächtigung des Königreichs der Niederlande, bis zum 31. Januar 1970 Saatgut
    einer Sorte von Winterweizen mit minderen Anforderungen zum Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '69/459/CEE: Decisione della Commissione, del 1 dicembre 1969, che autorizza
    il Regno dei Paesi Bassi ad ammettere fino al 31 gennaio 1970 la commercializzazione
    delle sementi di una varietà di grano invernale soggetta a requisiti ridotti'
  type: main
- language: nl
  script: Latn
  content: '69/459/EEG: Beschikking van de Commissie van 1 december 1969 waarbij het
    Koninkrijk der Nederlanden wordt gemachtigd om tot en met 31 januari 1970 zaad
    van een ras wintertarwe waaraan minder strenge eisen zijn gesteld, tot de handel
    toe te laten'
  type: main
