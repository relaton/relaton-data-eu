title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1349/1999 of 21 June 1999 establishing certain
    measures concerning imports of processed agricultural products from Switzerland
    in order to take account of the results of the Uruguay Round negotiations in the
    agricultural sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1349/1999 du Conseil, du 21 juin 1999, établissant
    certaines mesures concernant l'importation de produits agricoles transformés
    de Suisse pour tenir compte des résultats des négociations du cycle d'Uruguay
    dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1349/1999 des Rates vom 21. Juni 1999 über bestimmte
    Maßnahmen betreffend die Einfuhr landwirtschaftlicher Verarbeitungserzeugnisse
    aus der Schweiz zur Berücksichtigung der Ergebnisse der Verhandlungen der Uruguay-Runde
    im Agrarbereich
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1349/1999 af 21. juni 1999 om visse foranstaltninger
    vedrørende import af forarbejdede landbrugsprodukter fra Schweiz for at tage
    hensyn til resultaterne af Uruguay-rundens forhandlinger på landbrugsområdet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1349/1999 του Συμβουλίου,
    της 21ης Ιουνίου 1999, για τη θέσπιση ορισμένων
    μέτρων σχετικών με την εισαγωγή μεταποιημένων
    γεωργικών προϊόντων από την Ελβετία προκειμένου
    να ληφθούν υπόψη τα αποτελέσματα των διαπραγματεύσεων
    του Γύρου της Ουρουγουάης στον γεωργικό τομέα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1349/1999, annettu 21 päivänä kesäkuuta 1999,
    jalostettujen maataloustuotteiden tuontia Sveitsistä koskevien tiettyjen toimenpiteiden
    toteuttamisesta Uruguayn kierroksen neuvottelujen tulosten huomioon ottamiseksi
    maatalouden alalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1349/1999 del Consiglio, del 21 giugno 1999, che stabilisce
    talune misure relative all'importazione di prodotti agricoli trasformati dalla
    Svizzera per tener conto dei risultati dei negoziati dell'Uruguay Round nel settore
    agricolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1349/1999 van de Raad van 21 juni 1999 tot vaststelling
    van bepaalde maatregelen betreffende de invoer van be- en verwerkte landbouwproducten
    uit Zwitserland om rekening te houden met de resultaten van de in het kader van
    de Uruguay-ronde gevoerde onderhandelingen in de landbouwsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1349/1999 do Conselho, de 21 de Junho de 1999, que
    estabelece certas medidas relativas à importação de produtos agrícolas transformados
    da Suíça de forma a ter em conta o resultado das negociações do «Uruguay
    Round» no sector agrícola
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1349/1999 del Consejo, de 21 de junio de 1999, por
    el que se establecen medidas relativas a las importaciones de productos agrícolas
    transformados de Suiza a fin de tener en cuenta los resultados de las negociaciones
    de la Ronda Uruguay en el sector agrícola
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1349/1999 av den 21 juni 1999 om att fastställa
    vissa åtgärder rörande import av bearbetade jordbruksprodukter från Schweiz
    för att ta hänsyn till resultaten av förhandlingarna i Uruguayrundan inom jordbrukssektorn
