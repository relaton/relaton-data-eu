    добавка за всички видове домашни птици за угояване
    или отглеждани за носачки, или отглеждани за
    разплод'
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/2576 ze dne 18. prosince 2025
    o povolení přípravku Bacillus subtilis DSM 32324, Bacillus subtilis DSM 32325
    a Bacillus amyloliquefaciens DSM 25840 jako doplňkové látky pro všechny druhy
    drůbeže určené ke snášce nebo chovu (držitel povolení Chr. Hansen A/S),
    a kterým se mění prováděcí nařízení (EU) 2020/1762, pokud jde o povolení
    přípravku Bacillus subtilis DSM 32324, Bacillus subtilis DSM 32325 a Bacillus
    amyloliquefaciens DSM 25840 jako doplňkové látky pro výkrm nebo odchov všech
    druhů drůbeže
  type: main
