title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2025/2576 of 18 December 2025
    concerning the authorisation of a preparation of Bacillus subtilis DSM 32324,
    Bacillus subtilis DSM 32325 and Bacillus amyloliquefaciens DSM 25840 as a feed
    additive for all poultry species for laying or for breeding (holder of authorisation:
    Chr. Hansen A/S) and amending Implementing Regulation (EU) 2020/1762 as regards
    the terms of the authorisation of a preparation of Bacillus subtilis DSM 32324,
    Bacillus subtilis DSM 32325 and Bacillus amyloliquefaciens DSM 25840 as a feed
    additive for all poultry species for fattening or reared for laying or reared
    for breeding'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2025/2576 de la Commission du 18 décembre
    2025 concernant l’autorisation d’une préparation de Bacillus subtilis DSM
    32324, Bacillus subtilis DSM 32325 et Bacillus amyloliquefaciens DSM 25840 en
    tant qu’additif pour l’alimentation de toutes les espèces de volailles élevées
    pour la ponte ou la reproduction (titulaire de l’autorisation: Chr. Hansen A/S)
    et modifiant le règlement d’exécution (UE) 2020/1762 en ce qui concerne les
    conditions d’autorisation d’une préparation de Bacillus subtilis DSM 32324,
    Bacillus subtilis DSM 32325 et Bacillus amyloliquefaciens DSM 25840 en tant qu’additif
    pour l’alimentation de toutes les espèces de volailles d’engraissement, ou
    élevées pour la ponte ou pour la reproduction'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2025/2576 der Kommission vom 18. Dezember
    2025 betreffend die Zulassung einer Zubereitung aus Bacillus subtilis DSM 32324,
    Bacillus subtilis DSM 32325 und Bacillus amyloliquefaciens DSM 25840 als Zusatzstoff
    in Futtermitteln für alle Geflügelarten für Lege- oder Zuchtzwecke (Zulassungsinhaber:
    Chr. Hansen A/S) und zur Änderung der Durchführungsverordnung (EU) 2020/1762
    hinsichtlich der Bedingungen für die Zulassung einer Zubereitung aus Bacillus
    subtilis DSM 32324, Bacillus subtilis DSM 32325 und Bacillus amyloliquefaciens
    DSM 25840 als Zusatzstoff in Futtermitteln für alle Geflügelarten für die Mast
    und für Jungtiere aller Geflügelarten für Lege- oder Zuchtzwecke'
  type: main
- language: bg
  script: Cyrl
