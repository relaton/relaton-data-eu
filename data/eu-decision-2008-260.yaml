    udelené podľa nariadenia Komisie (ES) č. 88/97 [oznámené pod číslom K(2008)
    1044]'
  type: main
- language: sl
  script: Latn
  content: '2008/260/ES: Odločba Komisije z dne 18. marca 2008 o odobritvi izvzetja
    od razširitve protidampinške dajatve, uvedene z Uredbo Sveta (EGS) št. 2474/93,
    nazadnje ohranjene in spremenjene z Uredbo (ES) št. 1095/2005, na nekatere dele
    koles nekaterim strankam ter o preklicu opustitve plačila protidampinške dajatve,
