    kiterjesztett dömpingellenes vám kifizetése vonatkozásában a 88/97/EK bizottsági
    rendelet alapján egyes feleknek biztosított felfüggesztés hatálytalanításáról
    (az értesítés a C(2008) 1044. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2008/260/CE: Decisione della Commissione, del 18 marzo 2008 , che concede
    a talune parti interessate un''esenzione dall''estensione ad alcune parti di biciclette
    del dazio antidumping sulle importazioni di biciclette originarie della Repubblica
    popolare cinese istituito dal regolamento (CEE) n. 2474/93 del Consiglio, mantenuto
    in vigore e modificato da ultimo dal regolamento (CE) n. 1095/2005, e revoca la
