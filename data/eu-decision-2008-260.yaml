    на Съвета, последно оставено в сила и изменено
    с Регламент (ЕО) № 1095/2005, и за отмяна на спирането
    на плащането на антидъмпинговото мито за някои
    велосипедни части с произход от Китайската
    народна република, разрешено на определени
    страни съгласно Регламент (ЕО) № 88/97 (нотифицирано
    под номер C(2008) 1044)'
  type: main
- language: cs
  script: Latn
  content: '2008/260/ES: Rozhodnutí Komise ze dne 18. března 2008 , kterým se některé
    strany osvobozují od rozšíření antidumpingového cla z jízdních kol pocházejících
    z Čínské lidové republiky uloženého nařízením Rady (EHS) č. 2474/93,
    naposledy zachovaného a pozměněného nařízením (ES) č. 1095/2005, na některé
    součásti jízdních kol, a kterým se zrušuje pozastavení platby antidumpingového
    cla rozšířeného na některé součásti jízdních kol pocházející z Čínské
    lidové republiky, jež bylo některým stranám přiznáno nařízením Komise
    (ES) č. 88/97 (oznámeno pod číslem K(2008) 1044)'
  type: main
- language: da
  script: Latn
  content: '2008/260/EF: Kommissionens beslutning af 18 March 2008 om indrømmelse
