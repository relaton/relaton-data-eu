    antidumping cu privire la bicicletele originare din Republica Populară Chineză,
    instituit prin Regulamentul (CEE) nr. 2474/93 al Consiliului, menținut și modificat
    ultima dată prin Regulamentul (CE) nr. 1095/2005, și de ridicare a suspendării
