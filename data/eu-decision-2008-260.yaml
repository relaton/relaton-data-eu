    1044)'
  type: main
- language: hu
  script: Latn
  content: '2008/260/EK: A Bizottság határozata ( 2008. március 18. ) a Kínai
    Népköztársaságból származó egyes kerékpárok tekintetében a 2474/93/EGK
    tanácsi rendelettel kivetett és legutóbb az 1095/2005/EK rendelettel fenntartott
    és módosított dömpingellenes vám bizonyos kerékpáralkatrészekre történő
    kiterjesztése vonatkozásában egyes felek számára biztosított mentességről,
