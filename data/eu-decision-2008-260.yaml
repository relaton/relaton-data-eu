type: standard
title:
- language: en
  script: Latn
  content: '2008/260/EC: Commission Decision of 18 March 2008 granting certain parties
    an exemption from the extension to certain bicycle parts of the anti-dumping duty
    on bicycles originating in the People’s Republic of China imposed by Council
    Regulation (EEC) No 2474/93, last maintained and amended by Regulation (EC) No
    1095/2005, and lifting the suspension of the payment of the anti-dumping duty
    extended to certain bicycle parts originating in the People’s Republic of China
    granted to certain parties pursuant to Commission Regulation (EC) No 88/97 (notified
    under document number C(2008) 1044)'
  type: main
- language: fr
  script: Latn
  content: '2008/260/CE: Décision de la Commission du 18 mars 2008 exemptant certaines
    parties de l''extension à certaines parties de bicyclettes du droit antidumping
    institué par le règlement (CEE) n° 2474/93 sur les bicyclettes originaires
    de la République populaire de Chine, maintenu et modifié en dernier lieu par
    le règlement (CE) n° 1095/2005, et levant la suspension du paiement du droit
    antidumping étendu à certaines parties de bicyclettes originaires de la République
    populaire de Chine accordée à certaines parties en vertu du règlement (CE)
    n° 88/97 de la Commission [notifiée sous le numéro C(2008) 1044]'
  type: main
- language: de
  script: Latn
  content: '2008/260/EG: Entscheidung der Kommission vom 18. März 2008 zur Befreiung
    bestimmter Parteien von der Ausweitung des Antidumpingzolls auf Fahrräder mit
    Ursprung in der Volksrepublik China, der mit der Verordnung (EWG) Nr. 2474/93
    des Rates eingeführt und zuletzt mit der Verordnung (EG) Nr. 1095/2005 aufrechterhalten
    und geändert wurde, auf bestimmte Fahrradteile und zur Aufhebung der Befreiung
    von der Entrichtung des auf bestimmte Fahrradteile mit Ursprung in der Volksrepublik
    China ausgeweiteten Antidumpingzolls, die bestimmten Parteien mit der Verordnung
    (EG) Nr. 88/97 der Kommission gewährt wurde (Bekannt gegeben unter Aktenzeichen
    K(2008) 1044)'
  type: main
- language: bg
  script: Cyrl
  content: '2008/260/ЕО: Решение на Комисията от 18 март
    2008 година за освобождаване на определени страни
    от разширяването към някои велосипедни части
    на действието на антидъмпинговото мито за
    велосипеди с произход от Китайската народна
