title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1316/75 of the Commission of 23 May 1975 repealing
    Regulations (EEC) No 1143/75, (EEC) No 3163/74 and (EEC) No 3165/74 on the amount
    of the special export levy and the export charge on certain syrups and processed
    products containing sugar
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1316/75 de la Commission, du 23 mai 1975, portant
    abrogation des règlements (CEE) n° 1143/75, (CEE) n° 3163/74 et (CEE) n 3165/74
    concernant le montant du prélèvement spécial et de la taxe à l'exportation
    applicables respectivement à certains sirops et produits transformés contenant
    du sucre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1316/75 der Kommission vom 23. Mai 1975 zur Aufhebung
    der Verordnungen (EWG) Nr. 1143/75, (EWG) Nr. 3163/74 und (EWG) Nr. 3165/74 über
    den Betrag der besonderen Ausfuhrabschöpfung und der Ausfuhrabgabe, die für
    bestimmte Sirupe beziehungsweise für zuckerhaltige Verarbeitungserzeugnisse gelten
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1316/75 af 23. maj 1975 om ophævelse
    af forordningerne (EØF) nr. 1143/75, (EØF) nr. 3163/74 og (EØF) nr. 3165/74
    vedrørende eksportafgiften og den særlige eksportafgift henholdsvis på visse
    forarbejdede varer indeholdende sukker og på visse sirupper og andre sukkeropløsninger
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1316/75 della Commissione, del 23 maggio 1975, che
    abroga i regolamenti (CEE) n. 1143/75, (CEE) n. 3163/74 e (CEE) n. 3165/74 concernenti
    l'importo del prelievo speciale e della tassa all'esportazione applicabile rispettivamente
    a taluni sciroppi e prodotti trasformati contenenti zucchero
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1316/75 van de Commissie van 23 mei 1975 houdende
    intrekking van de Verordeningen (EEG) nr. 1143/75, (EEG) nr. 3163/74 en (EEG)
    nr. 3165/74 over het bedrag van de speciale heffing en de belasting bij uitvoer
    die van toepassing zijn respectievelijk op bepaalde stropen en verwerkte produkten
    die suiker bevatten
  type: main
