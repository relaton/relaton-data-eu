title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2478/77 of 7 November 1977 on the system for
    guaranteeing the stabilization of earnings from certain commodities exported by
    the ACP States and the overseas countries and territories associated with the
    Community and repealing Regulation (EEC) No 158/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2478/77 du Conseil, du 7 novembre 1977, relatif au
    système visant à garantir la stabilisation des recettes d' exportation de certains
    produits de base en faveur des États ACP et des pays et territoires d' outre-mer
    associés à la Communauté et abrogeant le règlement (CEE) n° 158/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2478/77 des Rates vom 7. November 1977 über das System
    zur Stabilisierung der Erlöse aus der Ausfuhr bestimmter Grundstoffe zugunsten
    der AKP-Staaten und der mit der Gemeinschaft assoziierten überseeischen Länder
    und Gebiete und zur Aufhebung der Verordnung (EWG) Nr. 158/76
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2478/77 af 7. november 1977 om den ordning,
    der skal garantere stabilisering af indtægterne ved udførsel af visse basisprodukter,
    og som skal komme AVS-staterne og de oversøiske lande og territorier, der er
    associeret Fællesskabet, til gode, samt om ophævelse af forordning (EØF) nr.
    158/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2478/77 del Consiglio, del 7 novembre 1977, concernente
    il sistema inteso a garantire la stabilizzazione dei proventi d' esportazione
    di taluni prodotti di base, a favore degli Stati ACP e dei paesi e territori d'
    oltremare associati alla Comunità, e recante abrogazione del regolamento (CEE)
    n. 158/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2478/77 van de Raad van 7 november 1977 inzake het
    systeem dat erop gericht is de stabilisatie van de exportopbrengsten voor bepaalde
    basisprodukten te waarborgen ten gunste van de ACS-Staten en de met de Gemeenschap
    geassocieerde landen en gebieden overzee, en houdende intrekking van Verordening
    (EEG) nr. 158/76
  type: main
