title:
- language: en
  script: Latn
  content: '2006/473/EC: Commission Decision of 5 July 2006 recognising certain third
    countries and certain areas of third countries as being free from Xanthomonas
    campestris (all strains pathogenic to Citrus), Cercospora angolensis Carv. et
    Mendes and Guignardia citricarpa Kiely (all strains pathogenic to Citrus) (notified
    under document number C(2006) 3024)'
  type: main
- language: fr
  script: Latn
