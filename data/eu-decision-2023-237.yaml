    del Consejo por el que se establece el código aduanero de la Unión [notificada
    con el número C(2023) 667] (Los textos en lenguas alemana, checa, danesa, española,
    francesa, griega, húngara, inglesa, lituana, maltesa, neerlandesa, portuguesa,
    rumana y sueca son los únicos auténticos)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2023/237 av den 1 februari 2023
    om beviljande av ett undantag på begäran av vissa medlemsstater för att använda
    andra metoder än elektronisk databehandlingsteknik för utbyte och lagring av
    uppgifter i samband med tulldeklarationen av varor som förs in i unionens tullområde
    enlighet vad som fastställs i artiklarna 158, 162, 163, 166, 167, 170–174,
    201, 240, 250, 254 och 256 i Europaparlamentets och rådets förordning (EU) nr
    952/2013 om fastställande av en tullkodex för unionen (delgivet med nr C(2023)
    667) (Endast de danska, engelska, franska, grekiska, litauiska, maltesiska, nederländska,
    portugisiska, rumänska, spanska, svenska, tjeckiska, tyska och ungerska texterna
    är giltiga)
  type: main
