id: EURegulation27271971
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2727/71 of the Council of 20 December 1971 amending,
    as regards tariff nomenclature, Regulation No 23 on the progressive establishment
    of a common organisation of the market in fruit and vegetables and Regulations
    No 136/66/EEC, No 120/67/EEC, No 121/67/EEC, No 123/67/EEC, No 1009/67/EEC, (EEC)
    No 805/68, (EEC) No 2142/70 and (EEC) No 827/68, on the common organisation of
    the markets respectively in oils and fats, cereals, pigmeat, poultrymeat, sugar,
    beef and veal, fishery products and certain products listed in Annex II to the
    Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2727/71 du Conseil, du 20 décembre 1971, modifiant,
    en matière de nomenclature tarifaire, le règlement n° 23 portant établissement
    graduel d' une organisation commune des marchés dans le secteur des fruits et
    légumes et les règlements n° 136/66/CEE, n° 120/67/CEE, n° 121/67/CEE, n°
    123/67/CEE, n° 1009/67/CEE, (CEE) n° 805/68, (CEE) n° 2142/70 et (CEE) n°
    827/68, portant organisation commune des marchés respectivement dans les secteurs
    des matières grasses, des céréales, de la viande de porc, de la viande de volaille,
    du sucre, de la viande bovine, de la pêche et pour certains produits énumérés
    à l' annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2727/71 des Rates vom 20. Dezember 1971 zur Änderung
    - hinsichtlich des Zolltarifschemas - der Verordnung Nr. 23 über die schrittweise
    Errichtung einer gemeinsamen Marktorganisation für Obst und Gemüse und der Verordnungen
    Nr. 136/66/EWG, Nr. 120/67/EWG, Nr. 121/67/EWG, Nr. 123/67/EWG, Nr. 1009/67/EWG,
    (EWG) Nr. 805/68, (EWG) Nr. 2142/70 und (EWG) Nr. 827/68 über die gemeinsamen
    Marktorganisationen für Fette, Getreide, Schweinefleisch, Geflügelfleisch, Zucker,
    Rindfleisch, Fischereierzeugnisse und für bestimmte in Anhang II des Vertrages
    aufgeführte Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2727/71 af 20. december 1971 om ændring,
    med hensyn til tarifnomenklaturen, af forordning nr. 23 om den gradvise oprettelse
    af en fælles markedsordning for frugt og grønsager og af forordningerne nr.
    136/66/EØF, nr. 120/67/EØF, nr. 121/67/EØF, nr. 123/67/EØF, nr. 1009/67/EØF,
    (EØF) nr. 805/68, (EØF) nr. 2142/70 og (EØF) nr. 827/68 om de fælles markedsordninger
    for fedtstoffer, korn, svinekød, fjerkrækød, sukker, oksekød, fiskerivarer
    og for visse varer, der er anført i traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2727/71 del Consiglio, del 20 dicembre 1971, che modifica,
    in materia di nomenclatura tariffaria, il regolamento n. 23 relativo alla graduale
    attuazione di una organizzazione comune dei mercati nel settore degli ortofrutticoli
    ed i regolamenti nn. 136/66/CEE, 120/67/CEE, 121/67/CEE, 123/67/CEE, 1009/67/CEE,
    (CEE) 805/68, (CEE) 2142/70 e (CEE) 827/68, relativi all' organizzazione comune
    dei mercati rispettivamente nel settore dei grassi, dei cereali, delle carni suine,
    del pollame, dello zucchero, delle carni bovine, della pesca, nonché per taluni
    prodotti elencati nell' allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2727/71 van de Raad van 20 december 1971 tot wijziging,
    wat de tariefnomenclatuur betreft, van Verordening nr. 23 houdende de geleidelijke
    totstandbrenging van een gemeenschappelijke ordening der markten in de sector
    groenten en fruit en van de Verordeningen nr. 136/66/EEG, nr. 120/67/EEG, nr.
    121/67/EEG, nr. 123/67/EEG, nr. 1009/67/EEG, (EEG) nr. 805/68, (EEG) nr. 2142/70
    en (EEG) nr. 827/68 houdende een gemeenschappelijke ordening der markten respectievelijk
    in de sectoren oliën en vetten, granen, varkensvlees, slachtpluimvee, suiker,
    rundvlees en visserijprodukten en voor bepaalde in bijlage II van het Verdrag
    vermelde produkten
  type: main
