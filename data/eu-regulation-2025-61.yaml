title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/61 of 15 January 2025 imposing
    a definitive countervailing duty on imports of certain pneumatic tyres, new or
    retreaded, of rubber, of a kind used for buses or lorries, with a load index exceeding
    121 originating in the People's Republic of China following an expiry review pursuant
    to Article 18 of Regulation (EU) 2016/1037 of the European Parliament and of the
    Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/61 de la Commission du 15 janvier 2025
    instituant un droit compensateur définitif sur les importations de certains pneumatiques
    neufs ou rechapés, en caoutchouc, du type utilisé pour les autobus ou camions,
    ayant un indice de charge supérieur à 121 et originaires de la République populaire
    de Chine à la suite d’un réexamen au titre de l’expiration des mesures effectué
    en vertu de l’article 18 du règlement (UE) 2016/1037 du Parlement européen
    et du Conseil
  type: main
- language: de
