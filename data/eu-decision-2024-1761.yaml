title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/1761 of 21 June 2024 repealing
    Commission Decision 2004/905/EC laying down guidelines for the notification of
    dangerous consumer products to the competent authorities of the Member States
    by producers and distributors, in accordance with Article 5(3) of Directive 2001/95/EC
    of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/1761 de la Commission du 21 juin 2024
    abrogeant la décision 2004/905/CE de la Commission établissant des lignes directrices
    pour la notification des produits de consommation dangereux aux autorités compétentes
    des États membres par les producteurs et les distributeurs, conformément à
    l’article 5, paragraphe 3, de la directive 2001/95/CE du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
