    nuostatos, taikomos afijų (Aphia minuta) žvejybai laivų traukiamaisiais tinklais
    tam tikruose Italijos (Manfredonijos) teritoriniuose vandenyse, galiojimas
  type: main
- language: mt
  script: Latn
