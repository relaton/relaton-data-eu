    guvid străveziu (Aphia minuta) în anumite ape teritoriale ale Italiei (Manfredonia)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1989 z 20. októbra 2022, ktorým
