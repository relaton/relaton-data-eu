    egyes felségvizein (Manfredonia) folytatott halászatában alkalmazott, hajóról
    működtetett kerítőhálók telepítésének parttól számított legkisebb
    távolsága és legkisebb mélysége tekintetében engedélyezett eltérés megújításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1989 della Commissione del 20 ottobre
    2022 che rinnova la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto concerne la distanza minima dalla costa e la profondità minima per le
    sciabiche da natante utilizzate per la pesca del rossetto (Aphia minuta) in talune
    acque territoriali dell'Italia (Manfredonia)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1989 (2022. gada 20. oktobris),
