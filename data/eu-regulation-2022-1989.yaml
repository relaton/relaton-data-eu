    2022 renouvelant une dérogation au règlement (CE) no 1967/2006 du Conseil en
    ce qui concerne la distance de la côte et la profondeur minimales pour les sennes
    de bateau pêchant le gobie transparent (Aphia minuta) dans certaines eaux territoriales
    d’Italie (Manfredonia)
  type: main
- language: de
  script: Latn
