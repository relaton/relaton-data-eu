title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1989 of 20 October 2022 renewing
    a derogation from Council Regulation (EC) No 1967/2006 as regards the minimum
    distance from coast and the minimum sea depth for boat seines fishing for transparent
    goby (Aphia minuta) in certain territorial waters of Italy (Manfredonia)
  type: main
- language: fr
  script: Latn
