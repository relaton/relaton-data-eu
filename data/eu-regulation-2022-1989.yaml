    voor de visserij op glasgrondel (Aphia minuta) in bepaalde territoriale wateren
    van Italië (Manfredonia)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1989 z dnia 20 października
