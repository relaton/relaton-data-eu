    bit-tartaruni għall-makku (Aphia minuta) f’ċerti ibħra territorjali tal-Italja
    (Manfredonia)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1989 van de Commissie van 20 oktober 2022
