id: EURegulation24371976
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2437/76 of 6 October 1976 re-establishing
    the levying of customs duties on other sacks and bags, of a kind used for the
    packing of goods, of cotton, falling within subheading 62.03 B ex II, originating
    in developing countries to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3002/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2437/76 de la Commission, du 6 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres sacs
    et sachets d'emballage en tissus de coton, de la sous- position tarifaire 62.03
    B EX II, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires par le règlement (CEE) n° 3002/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2437/76 der Kommission vom 6. Oktober 1976 über die
    Wiedereinführung des Zollsatzes für andere Säcke und Beutel zu Verpackungszwecken,
    aus Baumwolle, der Tarifstelle 62.03 B ex II, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3002/75 des Rates vom 17. November 1975
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2437/76 af 6. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for andre varer, sække og poser til emballage,
    af bomuldsstof, under underposition 62.03 B ex II, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3002/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2437/76 della Commissione, del 6 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli altri sacchi e sacchetti
    da imballaggio, in tessuti di cotone, della sottovoce doganale 62.03 B ex II,
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3002/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2437/76 van de Commissie van 6 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere zakken
    voor verpakkingsdoeleinden, van weefsels van katoen, van onderverdeling 62.03
    B ex II, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 3002/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
