    und seines Vertreters in der Union für das Inverkehrbringen von Erzeugnissen,
    die aus der genetisch veränderten Zuckerrübensorte H7-1 hergestellt werden (Bekannt
    gegeben unter Aktenzeichen C(2021) 4325) (Nur der deutsche und der niederländische
    Text sind verbindlich)
  type: main
