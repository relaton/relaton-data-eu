    il titolare dell’autorizzazione e il suo rappresentante nell’Unione per l’immissione
    in commercio di prodotti derivati dalla barbabietola da zucchero geneticamente
    modificata H7-1 [notificata con il numero C(2021) 4325] (I testi in lingua neerlandese
    e tedesca sono i soli facenti fede)
