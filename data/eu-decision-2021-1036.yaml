    proizvedenih iz gensko spremenjene sladkorne pese H7-1, in njegovega zastopnika
    v Uniji (notificirano pod dokumentarno številko C(2021) 4325) (Besedilo velja
    za EGP) (Besedilo v nizozemskem in nemškem jeziku je edino verodostojno)
