title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1036 of 22 June 2021 amending
    Implementing Decision (EU) 2018/1113 as regards the authorisation holder and its
    representative in the Union for the placing on the market of products produced
    from genetically modified sugar beet H7-1 (notified under document C(2021) 4325)
    (Only the Dutch and German texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1036 de la Commission du 22 juin 2021
    modifiant la décision d’exécution (UE) 2018/1113 en ce qui concerne le titulaire
    de l’autorisation et son représentant dans l’Union pour la mise sur le marché
    des produits fabriqués à partir de la betterave sucrière génétiquement modifiée
    H7-1 [notifiée sous le numéro C(2021) 4325] (Texte présentant de l’intérêt
    pour l’EEE) (Les textes en langues allemande et néerlandaise sont les seuls
    faisant foi.)
  type: main
- language: de
  script: Latn
