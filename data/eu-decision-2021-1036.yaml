    na umiestnenie na trh výrobkov, ktoré sú vyrobené z geneticky modifikovanej
    cukrovej repy H7-1, a jeho zástupcu v Únii [oznámené pod číslom C(2021)
    4325] (Text s významom pre EHP) (Iba holandské a nemecké znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/1036 z dne 22. junija 2021 o spremembi
