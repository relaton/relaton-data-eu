    titularul autorizației și reprezentantul său în Uniune pentru introducerea
    pe piață a produselor obținute din sfeclă de zahăr modificată genetic H7-1
    [notificată cu numărul C(2021) 4325] (Text cu relevanță pentru SEE) (Numai
    textele în limbile neerlandeză și germană sunt autentice)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/1036 z 22. júna 2021, ktorým
