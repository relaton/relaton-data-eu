title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1060/68 of the Commission of 24 July 1968 adopting
    certain detailed rules for the application of Regulations Nos 367/67/EEC and 371/67/EEC
    regarding production refunds on maize processed into groats and meal and on maize
    and common wheat processed into starch and quellmehl
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1060/68 de la Commission, du 24 juillet 1968, arrêtant
    certaines modalités d' application des règlements n° 367/67/CEE et n° 371/67/CEE
    en ce qui concerne la restitution à la production accordée au maïs transformé
    en gruaux et semoules et au maïs et froment tendre transformés en amidon et
    quellmehl
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1060/68 der Kommission vom 24. Juli 1968 zur Festsetzung
    einiger Durchführungsvorschriften zu den Verordnungen Nr. 367/67/EWG und Nr.
    371/67/EWG betreffend die Erstattung bei der Erzeugung für Mais zur Verarbeitung
    zu Grob- und Feingrieß sowie für Mais und Weichweizen zur Verarbeitung zu Getreidestärke
    und Quellmehl
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1060 af 24. juli 1968 om fastsættelse
    af visse gennemførelsesbestemmelser til forordningerne nr. 367/67/EØF og nr.
    371/67/EØF med hensyn til produktionsrestitution for majs til forarbejdning til
    grove og fine gryn samt for majs og blød hvede til forarbejdning til stivelse
    og kvældemel
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1060/68 della Commissione, del 24 luglio 1968, che
    stabilisce talune modalità di applicazione dei regolamenti n. 367/67/CEE e n.
    371/67/CEE per quanto riguarda la restituzione alla produzione concessa al granturco
    trasformato in semole e semolini, nonché al granturco e frumento tenero trasformati
    in amido e quellmehl
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1060/68 van de Commissie van 24 juli 1968 houdende
    vaststelling van enkele uitvoeringsbepalingen van de Verordeningen nrs. 367/67/EEG
    en 371/67/EEG met betrekking tot de restitutie bij de produktie die wordt verleend
    voor tot grutten, gries en griesmeel verwerkte maïs en voor tot zetmeel en Quellmehl
    verwerkte maïs en zachte tarwe
  type: main
