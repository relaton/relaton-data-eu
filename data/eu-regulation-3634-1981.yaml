title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3634/81 of 17 December 1981 authorizing
    the conclusion of long-term private storage contracts for grape must, concentrated
    grape must and rectified concentrated grape must in respect of the 1981/82 wine
    year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3634/81 de la Commission, du 17 décembre 1981, ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    des moûts de raisins, des moûts de raisins concentrés et des moûts de raisins
    concentrés rectifiés pour la campagne 1981/1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3634/81 der Kommission vom 17. Dezember 1981 zur Ermöglichung
    des Abschlusses von Verträgen für die langfristige private Lagerhaltung von
    Traubenmosten, konzentrierten Traubenmosten und rektifizierten konzentrierten
    Traubenmosten für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3634/81 af 17. december 1981 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af druemost, koncentreret
    druemost og koncentreret rektificeret druemost for produktionsåret 1981/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3634/81 τής Επιτροπής
    τής 17ης Δεκεμβρίου 1981 περί παροχής δυνατότητος
    συνάψεως συμφωνητικών μακροπροθέσμου ιδιωτικής
    αποθεματοποιήσεως γλευκών σταφυλής, συμπυκνωμένων
    γλευκών σταφυλής καί συμπυκνωμένων διορθωμένων
    γλευκών σταφυλής γιά τήν περίοδο εμπορίας
    1981/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3634/81 della Commissione, del 17 dicembre 1981, che
    concede, per la campagna 1981/1982, la possibilità di concludere contratti di
    magazzinaggio privato a lungo termine per i mosti di uve, i mosti di uve concentrati
    e i mosti di uve concentrati rettificati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3634/81 van de Commissie van 17 december 1981 betreffende
    het openen van de mogelijkheid tot het sluiten van langlopende contracten voor
    de particuliere opslag van druivemost, geconcentreerde druivemost en gerectificeerde
    geconcentreerde druivemost voor het wijnoogstjaar 1981/1982
