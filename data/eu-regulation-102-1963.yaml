title:
- language: fr
  script: Latn
  content: Règlement n° 102/63/CEE du Conseil, du 25 septembre 1963, portant fixation
    du montant des prélèvements envers les pays tiers pour le porc et les produits
    à base de viande de porc en ce qui concerne les importations effectuées entre
    le 1er octobre et le 31 décembre 1963
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 102/63/EWG des Rats vom 25. September 1963 über die Festsetzung
    der Abschöpfungsbeträge gegenüber dritten Ländern für Schweine und Schweinefleisch
    enthaltende Erzeugnisse für Einfuhren, die vom 1. Oktober bis zum 31. Dezember
    1963 getätigt werden
  type: main
- language: it
  script: Latn
  content: Regolamento n. 102/63/CEE del Consiglio del 25 settembre 1963 relativo
    alla determinazione dell'ammontare dei prelievi nei confronti dei paesi terzi
    per i suini e i prodotti a base di carne suina per le importazioni effettuate
    dal 1 ottobre al 31 dicembre 1963
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 102/63/EEG van de Raad van 25 september 1963 houdende vaststelling
