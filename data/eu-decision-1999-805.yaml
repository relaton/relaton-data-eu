title:
- language: en
  script: Latn
  content: '1999/805/EC: Council Decision of 29 November 1999 authorising the Federal
    Republic of Germany to apply or to continue to apply reductions in, or exemptions
    from, excise duties on certain mineral oils used for specific purposes, in accordance
    with the procedure provided for in Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '1999/805/CE: Décision du Conseil, du 29 novembre 1999, autorisant la
    République fédérale d''Allemagne à appliquer ou à continuer d''appliquer
    des réductions ou des exonérations de droits d''accise sur certaines huiles
    minérales utilisées à des fins spécifiques, conformément à la procédure
    prévue à l''article 8, paragraphe 4, de la directive 92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '1999/805/EG: Entscheidung des Rates vom 29. November 1999 zur Ermächtigung
    der Bundesrepublik Deutschland, für bestimmte Mineralöle mit besonderen Verwendungszwecken
    Verbrauchsteuerbefreiungen oder -ermäßigungen einzuführen oder beizubehalten
    (Verfahren gemäß Artikel 8 Absatz 4 der Richtlinie 92/81/EWG)'
  type: main
- language: da
  script: Latn
  content: '1999/805/EF: Rådets beslutning af 29. november 1999 om tilladelse til
    Forbundsrepublikken Tyskland til at indføre eller fortsat anvende punktafgiftslempelser
    eller -fritagelser for visse typer mineralolier, der anvendes til særlige formål,
    jf. proceduren i artikel 8, stk. 4 i direktiv 92/81/EØF'
  type: main
- language: el
  script: Grek
  content: '1999/805/ΕΚ: Απόφαση του Συμβουλίου, της 29ης
    Νοεμβρίου 1999, που εξουσιοδοτεί την Ομοσπονδιακή
    Δημοκρατία της Γερμανίας να εφαρμόσει ή να
    συνεχίσει να εφαρμόζει τις μειώσεις ή τις απαλλαγές
    από τους ειδικούς φόρους κατανάλωσης σε ορισμένα
    πετρελαιοειδή που χρησιμοποιούνται για ειδικούς
    σκοπούς, σύμφωνα με τη διαδικασία που προβλέπεται
    στο άρθρο 8 παράγραφος 4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '1999/805/EY: Neuvoston päätös, tehty 29 päivänä marraskuuta 1999,
    luvan antamisesta Saksan liittotasavallalle soveltaa tai edelleen soveltaa tiettyihin
    erityistarkoituksiin käytettyihin kivennäisöljyihin valmisteveron alennuksia
    tai vapautuksia valmisteverosta direktiivin 92/81/ETY 8 artiklan 4 kohdassa säädetyn
    menettelyn mukaisesti'
  type: main
- language: it
  script: Latn
  content: '1999/805/CE: Decisione del Consiglio, del 29 novembre 1999, che autorizza
    la Repubblica federale di Germania ad applicare o a continuare ad applicare ad
    alcuni oli minerali utilizzati a fini specifici riduzioni o esenzioni di accise
    secondo la procedura di cui all''articolo 8, paragrafo 4, della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '1999/805/EG: Beschikking van de Raad van 29 november 1999 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd, overeenkomstig de procedure van artikel 8, lid 4,
    van Richtlijn 92/81/EEG, verlaagde accijnstarieven of vrijstelling van accijns
    toe te passen of te blijven toepassen op bepaalde minerale oliën die gebruikt
    worden voor bijzondere doeleinden'
  type: main
- language: pt
  script: Latn
  content: '1999/805/CE: Decisão do Conselho, de 29 de Novembro de 1999, que autoriza
    a República Federal da Alemanha a aplicar ou a continuar a aplicar reduções
    ou isenções de impostos especiais sobre o consumo de determinados óleos minerais
    utilizados para fins específicos, nos termos do n.o 4 do artigo 8.o da Directiva
    92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '1999/805/CE: Decisión del Consejo, de 29 de noviembre de 1999, por la
    que se autoriza a la República Federal de Alemania a aplicar o seguir aplicando
    reducciones o exenciones del impuesto especial sobre determinados hidrocarburos
    utilizados con fines específicos, de conformidad con el procedimiento previsto
    en el apartado 4 del artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '1999/805/EG: Rådets beslut av den 29 november 1999 om tillåtelse i enlighet
    med förfarandet i artikel 8.4 i direktiv 92/81/EEG för Förbundsrepubliken Tyskland
    att tillämpa eller fortsätta att tillämpa regler om nedsättning av eller befrielse
    från punktskatter på vissa mineraloljor som används för särskilda ändamål'
  type: main
