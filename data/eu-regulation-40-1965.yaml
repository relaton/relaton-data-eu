title:
- language: fr
  script: Latn
  content: Règlement n 40/65/CEE de la Commission, du 26 mars 1965, relatif aux certificats
    d'importation et d'exportation ainsi qu'à la fixation à l'avance du prélèvement
    et de la restitution pour certaines catégories d'aliments composés
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 40/65/EWG der Kommission vom 26. März 1965 betreffend die
    Einfuhr- und Ausfuhrlizenzen sowie die vorherige Festsetzung des Abschöpfungsbeitrags
    und der Erstattung für verschiedene Arten von Mischfuttermitteln
  type: main
- language: it
  script: Latn
  content: Regolamento n. 40/65/CEE della Commissione, del 26 marzo 1965, relativo
    ai titoli d'importazione e d'esportazione, nonché alla fissazione in anticipo
    del prelievo e della restituzione per talune categorie di alimenti composti
  type: main
- language: nl
  script: Latn
  content: Verordening no. 40/65/EEG van de Commissie van 26 maart 1965 betreffende
    de invoer en uitvoercertificaten, alsmede het van te voren vaststellen van de
    heffing en de restitutie voor bepaalde soorten mengvoeders
  type: main
