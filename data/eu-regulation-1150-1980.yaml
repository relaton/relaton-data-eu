title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1150/80 of 6 May 1980 amending Regulation (EEC)
    No 679/80 laying down certain interim measures for the conservation and management
    of fisheries resources off the west coast of Greenland applicable to vessels flying
    the flag of Canada or under charter to companies registered in Canada
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1150/80 du Conseil, du 6 mai 1980, modifiant le règlement
    (CEE) n° 679/80 fixant certaines mesures intérimaires de conservation et de
    gestion des ressources de pêche au large de la côte occidentale du Groenland
    applicables aux navires battant pavillon du Canada ou affrétés par des sociétés
    enregistrées au Canada
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1150/80 des Rates vom 6. Mai 1980 zur Änderung der
    Verordnung (EWG) Nr. 679/80 zur Festlegung bestimmter Übergangsmaßnahmen zur
    Erhaltung und Bewirtschaftung der Fischbestände vor der Westküste Grönlands
    gegenüber Schiffen unter kanadischer Flagge oder unter Chartervertrag mit in
    Kanada registrierten Gesellschaften
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1150/80 af 6. maj 1980 om ændring af forordning
    (EØF) nr. 679/80 om fastsættelse af visse midlertidige foranstaltninger til
    bevaring og forvaltning af fiskeressourcerne ud for Grønlands vestkyst, som skal
    finde anvendelse på fartøjer, der fører canadisk flag, eller som er chartret
    af selskaber registreret i Canada
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1150/80 del Consiglio, del 6 maggio 1980, che modifica
    il regolamento (CEE) n. 679/80, che stabilisce talune misure provvisorie di conservazione
    e di gestione delle risorse di pesca al largo delle coste occidentali della Groenlandia,
    applicabili alle navi battenti bandiera del Canada o noleggiate da società registrate
    in Canada
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1150/80 van de Raad van 6 mei 1980 tot wijziging
    van Verordening (EEG) nr. 679/80 tot vaststelling van bepaalde tussentijdse maatregelen
    voor de instandhouding en het beheer van de visbestanden voor de kust van West-Groenland
    die van toepassing zijn op vaartuigen die de vlag van Canada voeren of die zijn
    gecharterd door in Canada registreerde rederijen
  type: main
