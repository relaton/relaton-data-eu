  content: Council Regulation (EEC) No 1609/77 of 18 July 1977 maintaining in force
    the Arrangements subjecting to authorization imports into Germany, the Benelux
    countries, France and the United Kingdom of certain knitted or crocheted articles
    of clothing originating in the Republic of Singapore
  type: main
