  content: Commission Regulation (EC) No 1058/98 of 20 May 1998 determining to what
    extent applications for import rights lodged pursuant to Regulation (EC) No 546/98
    can be met as regards the tariff quota for certain beef and veal sector products
    originating in the former Yugoslav Republic of Macedonia
  type: main
- language: fr
  script: Latn
