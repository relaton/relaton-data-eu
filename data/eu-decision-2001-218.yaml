type: standard
title:
- language: en
  script: Latn
  content: '2001/218/EC: Commission Decision of 12 March 2001 requiring Member States
    temporarily to take additional measures against the dissemination of Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al. (the pinewood nematode) as regards
    areas in Portugal, other than those in which it is known not to occur (notified
    under document number C(2001) 692)'
  type: main
- language: fr
  script: Latn
  content: '2001/218/CE: Décision de la Commission du 12 mars 2001 exigeant des États
    membres qu''ils prennent provisoirement des mesures supplémentaires contre la
    propagation de Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (nématode
    du pin) à partir des zones du Portugal autres que celles où l''absence de cet
    organisme nuisible est attestée [notifiée sous le numéro C(2001) 692]'
  type: main
- language: de
  script: Latn
  content: '2001/218/EG: Entscheidung der Kommission vom 12. März 2001 zur Verpflichtung
    der Mitgliedstaaten, vorübergehend zusätzliche Maßnahmen gegen die Verbreitung
    von Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (dem Kiefernfadenwurm)
    gegenüber anderen Gebieten Portugals zu treffen als denjenigen, in denen dieser
    Schadorganismus bekanntermaßen nicht vorkommt (Bekannt gegeben unter Aktenzeichen
    K(2001) 692)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 12. března 2001, kterým se po členských státech
    žádá dočasné přijetí doplňujících opatření proti šíření háďátka
    Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. z oblastí Portugalska
    mimo těch, v nichž byla nepřítomnost tohoto škodlivého organismu potvrzena
    (oznámeno pod číslem K(2001) 692)
  type: main
- language: da
  script: Latn
  content: '2001/218/EF: Kommissionens beslutning af 12. marts 2001 om et krav til
    medlemsstaterne om midlertidigt at træffe supplerende foranstaltninger mod spredning
    af Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (fyrretræsnematoden)
    for så vidt angår andre områder i Portugal end dem, hvor den vides ikke at
    forekomme (meddelt under nummer K(2001) 692)'
  type: main
- language: el
  script: Grek
  content: '2001/218/ΕΚ: Απόφαση της Επιτροπής, της 12ης
    Μαρτίου 2001, που απαιτεί προσωρινά από τα κράτη
    μέλη να λάβουν συμπληρωματικά μέτρα κατά της
    εξάπλωσης του Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle
    et al., (νηματώδης σκώληκας των κωνοφόρων) όσον
    αφορά ορισμένες περιοχές στην Πορτογαλία,
    εκτός εκείνων στις οποίες διαπιστώθηκε ότι
    δεν έχει εμφανιστεί ο νηματώδης σκώληκας των
    κωνοφόρων [κοινοποιηθείσα υπό τον αριθμό Ε(2001)
    692]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 12. märts 2001, millega kohustatakse liikmesriike võtma
    ajutiselt haigusetekitaja Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle
    et al. (männi nematood) leviku takistamiseks lisameetmeid muude Portugali alade
    suhtes kui need, kus kõnealust haigusetekitajat teadaolevalt ei esine (teatavaks
    tehtud numbri K(2000) 692 all)
  type: main
- language: fi
  script: Latn
  content: '2001/218/EY: Komission päätös, tehty 12 päivänä maaliskuuta 2001,
    jäsenvaltioille esitetystä vaatimuksesta toteuttaa väliaikaisia lisätoimenpiteitä
    Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. -puuntuhoojan (mäntyankeroisen)
    leviämisen estämiseksi muilla kuin sellaisilla Portugalin alueilla, joista tiedetään,
    ettei sitä esiinny niillä (tiedoksiannettu numerolla K(2001) 692)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2001. március 12.) a Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al. (a fenyőfa fonalférge) elterjedése elleni,
    Portugáliának az attól ismerten mentes területein kívüli más területeire
    vonatkozó ideiglenes kiegészítő intézkedéseknek a tagállamok számára
    történő előírásáról (az értesítés a C(2001) 692. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: '2001/218/CE: Decisione della Commissione, del 12 marzo 2001, che prescrive
    agli Stati membri di adottare, a titolo provvisorio, misure supplementari contro
    la propagazione di Bursaphelenchus xylophilus (Steiner e Buhrer) Nickle et al.
    (nematode del pino) per quanto riguarda le regioni del Portogallo diverse da quelle
    notoriamente indenni da questo organismo [notificata con il numero C(2001) 692]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2001. gada 12. marts), ar ko paredz dalībvalstīm uz
    laiku veikt papildu pasākumus pret Bursaphelenchus xylophilus (Steiner et Buhrer)
    Nickle et al. (priedes koksnes nematode) izplatīšanos attiecībā uz teritorijām
    Portugālē, kas nav teritorijas, kurās tā nav sastopama (izziņots ar dokumenta
    numuru C(2001) 692)
  type: main
- language: lt
  script: Latn
  content: 2001 m. kovo 12 d. Komisijos sprendimas, kuriuo reikalaujama, kad valstybės
    narės laikinai imtųsi papildomų priemonių nuo Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al. (pušų nematodo) platinimo iš Portugalijos rajonų,
    išskyrus tuos, kuriuose šio kenksmingo organizmo nepasitaikė (pranešta dokumentu
    Nr. C(2001) 692)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-12 ta’ Marzu 2001 li jirrikjedi li
    l-Istati Membri jieħdu temporanjament miżuri addizzjonali kontra t-tixrid ta’
    Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (pinewood nematode)
    fir-rigward ta’ żoni fil-Portugall, ħlief għal dawk li fihom huwa magħruf
    li ma teżistix (notifikata bid-dokument numru C(2001) 692)
  type: main
- language: nl
  script: Latn
  content: '2001/218/EG: Beschikking van de Commissie van 12 maart 2001 tot tĳdelĳke
    verplichting van de lidstaten om ten aanzien van andere gebieden in Portugal dan
    die waarvan bekend is dat Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle
    et al. (het dennenaaltje) er niet voorkomt, aanvullende maatregelen te nemen teneinde
    de verspreiding ervan tegen te gaan (kennisgeving geschied onder nummer C(2001)
    692)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 12 marca 2001 r. wymagająca od Państw Członkowskich
    tymczasowego podjęcia dodatkowych środków przeciwko rozprzestrzenianiu się
    Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (węgorek sosnowiec)
    w odniesieniu do obszarów w Portugalii innych niż te, na których nie występuje
    (notyfikowana jako dokument nr C(2001) 692)
  type: main
- language: pt
  script: Latn
  content: '2001/218/CE: Decisão da Comissão, de 12 de Março de 2001, que requer
    que os Estados-Membros adoptem provisoriamente medidas adicionais contra a propagação
    de Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (nemátodo do
    pinheiro) no que diz respeito a zonas de Portugal, com excepção daquelas em
    que a sua ausência é conhecida [notificada com o número C(2001) 692]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 12. marca 2001 ktorým sa určuje, aby členské
    štáty dočasne prijali ďalšie opatrenia proti šíreniu háďatka na lesných
    drevinách Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. v súvislosti
    s oblasťami v Portugalsku, okrem oblastí, v ktorých jeho výskyt nie je známy
    (oznámené v dokumente C(2001) 692)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 12. marca 2001 o zahtevi, da države članice začasno
    sprejmejo dodatne ukrepe proti širjenju borove ogorčice Bursaphelenchus xylophilus
    (Steiner in Buhrer) Nickle in sodelavci v območjih Portugalske, razen območij,
    kjer je znano, da se ne pojavlja (notificirano pod dokumentarno številko K(2001)
    692)
  type: main
- language: es
  script: Latn
  content: '2001/218/CE: Decisión de la Comisión, de 12 de marzo de 2001, por la
    que se exige a los Estados miembros que adopten, con carácter temporal, medidas
    complementarias contra la propagación de Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al. (el nematodo de la madera del pino), en lo que respecta
    a zonas de Portugal distintas de aquéllas en las que se haya comprobado su ausencia
    [notificada con el número C(2001) 692]'
  type: main
- language: sv
  script: Latn
  content: '2001/218/EG: Kommissionens beslut av den 12 mars 2001 om att ålägga
    medlemsstaterna att tillfälligt vidta ytterligare åtgärder mot spridningen
    av Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (tallvedsnematoden)
    när det gäller andra områden i Portugal än sådana där det är känt att
    den inte förekommer [delgivet med nr K(2001) 692]'
  type: main
