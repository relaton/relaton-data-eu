title:
- language: en
  script: Latn
  content: '89/521/EEC: Commission Decision of 13 September 1989 making an initial
    allocation to Belgium of part of the resources to be charged to the 1990 budget
    year for the supply of food from intervention stocks to designated organizations
    for distribution to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '89/521/CEE: Décision de la Commission du 13 septembre 1989 allouant à
    la Belgique une première tranche des ressources imputables à l''exercice 1990
    pour la fourniture de denrées alimentaires provenant des stocks d''intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 13. September 1989 über die anfängliche
    Bewilligung eines Teils der im Haushaltsjahr 1990 für die Zurverfügungstellung
    von Nahrungsmitteln aus Interventionsbeständen an bezeichnete Organisationen
    zur Verteilung an bedürftige Personen in der Gemeinschaft zu verbuchenden Mittel
    für Belgien (89/521/EWG) (89/521/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 13. september 1989 om en første tildeling
    til Belgien af en del af de midler, der skal opføres på 1990-budgettet for levering
    af levnedsmidler fra interventionslagre til nærmere bestemte organisationer med
    henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet
    (89/521/EØF) (89/521/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/521/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Σεπτεμβρίου 1989 για τη χορήγηση στο Βέλγιο μιας
    πρώτης μερίδας πόρων που καταλογίζονται στο
    οικονομικό έτος 1990 για την προμήθεια τροφίμων
    που προέρχονται από τα αποθέματα της παρέμβασης
    στους οργανισμούς που έχουν οριστεί για να
    τα διανείμουν στους απόρους της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 13 settembre 1989 concernente un primo
    stanziamento al Belgio di parte delle risorse da imputare all'' anno di bilancio
    1990 per la fornitura a talune organizzazioni di derrate alimentari provenienti
    dalle scorte d'' intervento e destinate ad essere distribuite agli indigenti nella
    Comunità (89/521/CEE) (89/521/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 13 september 1989 houdende een eerste
    toewijzing aan België van een deel van voor het begrotingsjaar 1990 te boeken
    financiële middelen voor de levering van voedsel uit interventievoorraden aan
    organisaties die zijn aangewezen voor de verstrekking ervan aan behoeftigen in
    de Gemeenschap (89/521/EEG) (89/521/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 13 de Setembro de 1989 relativa à afectação
    inicial à Bélgica de parte dos recursos a imputar ao exercício orçamental
    de 1990 para o fornecimento de alimentos provenientes de existências de intervenção
    às organizações designadas para distribuição às pessoas mais necessitadas
    na Comunidade (89/521/CEE) (89/521/CEE) #'
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 13 de septiembre de 1989 por la que se adjudica
