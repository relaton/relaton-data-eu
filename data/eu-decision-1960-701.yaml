id: EUDecision1960701
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision relative à la circulation des marchandises dans la fabrication
    desquelles sont entrés des produits qui n'ont pas été soumis aux droits de
    douane et taxes d'effet équivalent qui leur étaient applicables ou qui ont bénéficié
    d'une ristourne totale ou partielle de ces droits ou taxes
  type: main
- language: de
  script: Latn
  content: Entscheidung über den Verkehr mit Waren, die unter Verwendung von Erzeugnissen
    hergestellt sind, für welche die auf sie anwendbaren Zölle und Abgaben gleicher
    Wirkung nicht erhoben oder vollständig oder teilweise rückvergütet worden sind
  type: main
- language: it
  script: Latn
  content: Decisione relativa alla circolazione delle merci per la fabbricazione delle
    quali siano stati impiegali prodotti non assoggettali ai dazi doganali ed alle
    tasse di effetto equivalente loro applicabili, o che abbiano beneficiato di un
    ristorno totale o parziale di tali dazi o tasse
  type: main
- language: nl
  script: Latn
  content: Beschikking inzake het verkeer van de goederen waarin produkten zijn verwerkt
    op welke de toepasselijke douanerechten en heffingen van gelijke werking niet
    zijn geheven of waarvoor gehele of gedeeltelijke teruggave van die rechten of
    heffingen is verleend
  type: main
