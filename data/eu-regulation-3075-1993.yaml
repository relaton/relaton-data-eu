    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    allemand
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3075/93 der Kommission vom 8. November 1993 zur Änderung
    der Verordnung (EWG) Nr. 1195/93 und zur Erhöhung der Dauerausschreibung zur
    Ausfuhr von im Besitz der deutschen Interventionsstelle befindlichem Brotweichweizen
    auf 2 350 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3075/93 af 8. november 1993 om ændring
