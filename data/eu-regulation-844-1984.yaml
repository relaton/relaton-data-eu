title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 844/84 of 30 March 1984 re-establishing
    the levying of customs duties on certain watch cases and parts of watch cases,
    falling within heading No 91.09 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 844/84 de la Commission du 30 mars 1984 portant rétablissement
    de la perception des droits de douane applicables à certaines boîtes de montres
    et leurs parties, de la position 91.09 du tarif douanier commun, originaires de
    Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 844/84 der Kommission vom 30. März 1984 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte Gehäuse für Uhren und Teile davon der
    Tarifnummer 91.09 mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr.
    3569/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 844/84 af 30. marts 1984 om genindførelse
    af opkrævning af told for bestemte kasser omhandlede ure samt dele dertil henhørende
    under pos. 91.09 og med oprindelse i Hongkong, som er præferenceberettiget i
    henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 844/84 της Επιτροπής
    της 30ής Μαρτίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ορισμένα κελύφη ωρολογίων
    και μέρη αυτών της κλάσεως 91.09 του Κοινού Δασμολογίου,
    καταγωγής Χονγκ Κονγκ, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 844/84 della Commissione del 30 marzo 1984 che ripristina
    la riscossione dei dazi doganali applicabili a certe casse per orologi e loro
    parti, della voce 91.09 della tariffa doganale comune, originarie di Hong Kong
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 844/84 van de Commissie van 30 maart 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde kasten
    voor horloges, alsmede delen daarvan van tariefpost 91.09, van oorsprong uit Hong-Kong,
    waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
