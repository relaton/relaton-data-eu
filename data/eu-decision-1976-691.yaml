id: EUDecision1976691
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 July 1976 authorizing the United Kingdom not to
    apply Community treatment to women's girls' and infants' outer garments (jackets,
    coats and raincoats of poly-cotton), falling within heading No ex 61.02 of the
    Common Customs Tariff, originating in Poland and in free circulation in the Netherlands
  type: main
- language: fr
  script: Latn
  content: '76/691/CEE: Décision de la Commission, du 6 juillet 1976, autorisant
    le Royaume-Uni à exclure du traitement communautaire certains vêtements de dessus
    pour femmes, fillettes et jeunes enfants (vestes, manteaux et manteaux imperméables
    de polyester coton) de la position Ex 61.02 du Tarif douanier commun, originaires
    de Pologne et mis en libre pratique aux Pays-Bas'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. Juli 1976, mit der das Vereinigte Königreich
    ermächtigt wird, aus Polen stammende und in den Niederlanden im freien Verkehr
    befindliche Oberkleidung für Frauen, Mädchen und Kleinkinder (Jacken, Mäntel
    und Regenmäntel aus Baumwollpolyester) der Tarifnummer ex 61.02 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 6. juli 1976 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage visse yderbeklædningsgenstande
    til kvinder, piger og småbørn (jakker, frakker og regnfrakker af polyesterbomuld)
    som henhører under pos. ex 61.02 i den fælles toldtarif, har oprindelse i Polen
    og frit kan omsættes i Nederlandene
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 luglio 1976, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario taluni indumenti esterni per donna,
    per ragazza e per bambini (giacche, cappotti, soprabiti, mantelli e impermeabili
    di poliestere di cotone) della voce ex 61.02 della tariffa doganale comune originari
    della Polonia e immessi in libera pratica nei Paesi Bassi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 juli 1976 waarbij het Verenigd Koninkrijk
    wordt gemachtigd bepaalde damesbovenkleding, meisjesbovenkleding en kinderbovenkleding
    (jasjes, mantels en waterdichte mantels van polyester-katoen), van post ex 61.02
    van het gemeenschappelijk douanetarief, van oorsprong uit Polen en in Nederland
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
