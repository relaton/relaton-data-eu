---
id: EUDecision2005200
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: "//: Commission Decision of 2 March 2005 authorising Estonia, Latvia, Lithuania and Malta to adopt stricter requirements concerning the presence of Avena fatua in cereal seed (notified under document number C(2005) 462)"
  type: main
- language: fr
  script: Latn
  content: "//: Décision de la Commission du 2 mars 2005 autorisant l'Estonie, la Lettonie, la Lituanie et Malte à adopter des dispositions plus strictes en ce qui concerne la présence d'Avena fatua dans les semences de céréales [notifiée sous le numéro C(2005) 462]"
  type: main
- language: de
  script: Latn
  content: "//: Entscheidung der Kommission vom 2. März 2005 zur Ermächtigung Estlands, Lettlands, Litauens und Maltas, bezüglich des Vorhandenseins von Avena fatua in Getreidesaatgut strengere Vorschriften zu erlassen (Bekannt gegeben unter Aktenzeichen K(2005) 462)"
  type: main
- language: cs
  script: Latn
  content: "//: Rozhodnutí Komise ze dne 2. března 2005, kterým se Estonsku, Lotyšsku, Litvě a Maltě povoluje přijmout přísnější požadavky pro výskyt Avena fatua v osivu obilovin (oznámeno pod číslem K(2005) 462)"
  type: main
- language: da
  script: Latn
  content: "//: Kommissionens beslutning af 2. marts 2005 om bemyndigelse af Estland, Letland, Litauen og Malta til at vedtage strengere krav vedrørende tilstedeværelsen af Avena fatua i sædekorn (meddelt under nummer K(2005) 462)"
  type: main
- language: el
  script: Grek
  content: "//: Απόφαση της Επιτροπής της 2ας Μαρτίου 2005 που επιτρέπει στην Εσθονία, τη Λεττονία, τη Λιθουανία και τη Μάλτα να θεσπίσουν αυστηρότερες απαιτήσεις όσον αφορά την παρουσία της Αvena fatua στους σπόρους δημητριακών προς σπορά [κοινοποιηθείσα υπό τον αριθμό Ε(2005) 462)"
  type: main
- language: et
  script: Latn
  content: "//: KOMISJONI OTSUS, 2. märts 2005, millega lubatakse Eestil, Lätil, Leedul ja Maltal vastu võtta rangemad nõuded tuulekaera (Avena fatua) esinemise suhtes teraviljaseemnes (teatavaks tehtud numbri K(2005) 462 all)"
  type: main
- language: fi
  script: Latn
  content: "//: Komission päätös, tehty 2 päivänä maaliskuuta 2005, luvan antamisesta Virolle, Latvialle, Liettualle ja Maltalle ottaa käyttöön tiukemmat vaatimukset siltä osin kuin on kyse Avena fatuan esiintymisestä viljakasvien siemenissä (tiedoksiannettu numerolla K(2005) 462)"
  type: main
- language: hu
  script: Latn
  content: "//: A Bizottság határozata (2005. március 2.) Észtország, Lettország, Litvánia és Málta számára az Avena fatuának a gabonavetőmagokban való előfordulása vonatkozásában szigorúbb követelmények elfogadásának engedélyezéséről (az értesítés a C(2004) 462. számú dokumentummal történt)"
  type: main
- language: it
  script: Latn
  content: "//: Decisione della Commissione, del 2 marzo 2005, che autorizza l'Estonia, la Lettonia, la Lituania e Malta ad adottare prescrizioni più restrittive per quanto riguarda la presenza di Avena fatua nelle sementi di cereali [notificata con il numero C(2005) 462]"
  type: main
- language: lv
  script: Latn
  content: "//: Komisijas Lēmums (2005. gada 2. marts), ar ko atļauj Igaunijai, Latvijai, Lietuvai un Maltai noteikt stingrākas prasības attiecībā uz vējauzu (Avena fatua) klātbūtni graudaugu sēklās (izziņots ar dokumenta numuru K(2005) 462)"
  type: main
- language: lt
  script: Latn
  content: "//: 2005 m. kovo 2 d.Komisijos sprendimas Leidžiantis Estijai, Latvijai, Lietuvai ir Maltai nustatyti griežtesnius reikalavimus dėl Avena fatua javų sėkloje (pranešta dokumentu Nr. K(2005) 462)"
  type: main
- language: mt
  script: Latn
  content: "//: Id-Deċiżjoni tal-Kummissjoni tat-2 ta' Marzu 2005 li tawtorizza l-Estonja, il-Latvja, il-Litwanja u lil Malta biex jadottaw kondizzjonijiet meħtieġa aktar stretti li jikkonċernaw il-preżenza ta' l-Avena fatua fiż-żerriegħa taċ-ċereali (notifikata bid-dokument numru Ċ(2005) 462)"
  type: main
- language: nl
  script: Latn
  content: "//: Beschikking van de Commissie van 2 maart 2005 tot machtiging van Estland, Letland, Litouwen en Malta om strengere maatregelen te nemen met betrekking tot de aanwezigheid van Avena fatua in zaaigranen (Kennisgeving geschied onder nummer C(2005) 462)"
  type: main
- language: pl
  script: Latn
  content: "//: Decyzja Komisji z dnia 2 marca 2005 r. zezwalająca Estonii, Łotwie, Litwie i Malcie na przyjęcie bardziej rygorystycznych wymogów dotyczących obecności Avena fatua w materiale siewnym roślin zbożowych (notyfikowana jako dokument nr C(2005) 462)"
  type: main
- language: pt
  script: Latn
  content: "//: Decisão da Comissão, de 2 de Março de 2005, que autoriza a Estónia, a Letónia, a Lituânia e Malta a adoptar exigências mais rigorosas no que diz respeito à presença de Avena fatua nas sementes de cereais [notificada com o número C(2005) 462]"
  type: main
- language: sk
  script: Latn
  content: "//: Rozhodnutie Komisie z 2. marca 2005, ktorým sa Estónsku, Lotyšsku, Litve a Malte povoľuje prijať prísnejšie kritériá, pokiaľ ide o prítomnosť druhu Avena fatua v osive obilnín [oznámené pod číslom K(2005) 462]"
  type: main
- language: sl
  script: Latn
  content: "//: Odločba Komisije z dne 2. marca 2005 o odobritvi Estoniji, Latviji, Litvi in Malti, da sprejmejo strožje zahteve glede navzočnosti Avena fatua v semenu žit (notificirano pod dokumentarno številko K(2005) 462)"
  type: main
- language: es
  script: Latn
  content: "//: Decisión de la Comisión de 2 de marzo de 2005, por la que se autoriza a Estonia, Letonia, Lituania y Malta a adoptar requisitos más estrictos en relación con la presencia de Avena fatua en semillas de cereales [notificada con el número C(2005) 462]"
  type: main
- language: sv
  script: Latn
  content: "//: Kommissionens beslut av den 2 mars 2005 om tillstånd för Estland, Lettland, Litauen och Malta att anta strängare krav rörande förekomst av Avena fatua (flyghavre) i utsäde av stråsäd (delgivet med nr K(2005) 462)"
  type: main
