  content: Commission Regulation (EEC) No 3155/80 of 5 December 1980 amending Regulations
    (EEC) No 2226/78 and (EEC) No 1379/80 as regards the products of the beef and
    veal sector which may be bought into intervention in the Federal Republic of Germany
    and their coefficients
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3155/80 de la Commission, du 5 décembre 1980, modifiant
