  script: Latn
  content: Commission Regulation (EEC) No 3387/87 of 11 November 1987 re-establishing
    the levying of customs duties on other toys; working models of a kind used for
    recreational purposes falling within heading No 97.03, originating in Macao, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3924/86 apply
  type: main
