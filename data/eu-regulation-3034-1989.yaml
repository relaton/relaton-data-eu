title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3034/89 of 9 October 1989 re-establishing
    the levying of customs duties on polymers of styrene, in primary and other forms,
    falling within CN code 3903, 3915 and 3920 originating in Brazil and Mexico to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3034/89 de la Commission du 9 octobre 1989 portant
    rétablissement de la perception des droits de douane applicables aux polymères
    du styrène, sous formes primaires et autres, des codes NC 3903, 3915 et 3920,
    originaires du Brésil et du Mexique, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3034/89 DER KOMMISSION vom 9. Oktober 1989 zur Wiedereinführung
    der Erhebung der Zölle für Polymere des Styrols, in Primär- und anderen Formen,
    der KN-Code 3903, 3915 und 3920 mit Ursprung in Brasilien und Mexiko, denen die
    in der Verordnung (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen gewährt
    werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3034/89 af 9. oktober 1989 om genindførelse
    af opkrævning af told for polymere af styren, i ubearbejdet form og andre former,
    henhørende under KN-kode 3903, 3915 og 3920 og med oprindelse i Brasilien og
    i Mexico, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3034/89 της Επιτροπής
    της 9ης Οκτωβρίου 1989 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα πολυμερή
    του στυρολίου σε αρχικές μορφές και άλλες των
    κωδικών ΣΟ 3903, 3915 και 3920, καταγωγής βραζιλίας
    και Μεξικού, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 4257/88 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3034/89 DELLA COMMISSIONE del 9 ottobre 1989 che
    ripristina la riscossione dei dazi doganali applicabili ai polimeri di stirene,
    in forme primarie e altre dei codici NC 3903, 3915 e 3920 originari del Brasile
    e del Messico, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 4257/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3034/89 VAN DE COMMISSIE van 9 oktober 1989 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op polymeren van
    styreen, in primaire en andere vormen, van de GN-codes 3903, 3915 en 3920, van
