title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1226/91 of 8 May 1991 re- establishing the
    levying of customs duties on products falling within CN codes 6401 and 6402, originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1226/91 DE LA COMMISSION du 8 mai 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC 6401
    et 6402, originaires de la Thaïlande, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1226/91 DER KOMMISSION vom 8. Mai 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 6401 und 6402 mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1226/91 af 8. maj 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 6401 og 6402 og med
    oprindelse i Thailand, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1226/91 της Επιτροπής
    της 8ης Μαΐου 1991 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για προϊόντα των κωδικών
    ΣΟ 6401 και 6402, καταγωγής Ταϊλάνδης, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1226/91 DELLA COMMISSIONE dell'' 8 maggio 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti dei codici
    NC 6401 e 6402 originari della Tailandia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1226/91 VAN DE COMMISSIE van 8 mei 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op produkten van
    de GN-codes 6401 en 6402, van oorsprong uit Thailand, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1226/91 DA COMISSÃO de 8 de Maio de 1991 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos dos códigos NC 6401
    e 6402, originários da Tailândia, beneficiários das preferências pautais previstas
    pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1226/91 DE LA COMISIÓN de 8 de mayo de 1991 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos de los códigos NC 6401 y 6402 originarios de Tailandia beneficiarios
    de las preferencias arancelarias previstas por el Reglamento (CEE) no 3831/90
    del Consejo #'
