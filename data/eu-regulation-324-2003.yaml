title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 324/2003 of 20 February 2003 establishing
    the eligibility criteria for the expenditure of the Community reference laboratories
    receiving financial assistance under Article 28 of Decision 90/424/EEC and establishing
    the procedures for the submission of expenditure and the conduct of audits
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 324/2003 de la Commission du 20 février 2003 fixant
    les critères d'éligibilité pour les dépenses des laboratoires communautaires
    de référence bénéficiant d'une aide financière en application de l'article
    28 de la décision 90/424/CEE et établissant les procédures applicables à la
    présentation des dépenses et à la réalisation des audits
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 324/2003 der Kommission vom 20. Februar 2003 zur Festlegung
    der Kriterien für die Zuschussfähigkeit der Ausgaben der gemeinschaftlichen
    Referenzlaboratorien, die Finanzhilfen gemäß Artikel 28 der Richtlinie 90/424/EWG
    erhalten, und der Verfahren zur Geltendmachung der Ausgaben und Durchführung
    von Audits
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 324/2003 af 20. februar 2003 om fastsættelse
    af, til hvilke udgifter, der afholdes af de EF-referencelaboratorier, som modtager
    tilskud i henhold til artikel 28 i beslutning 90/424/EØF, der kan ydes støtte,
    og hvilke procedurer der gælder for indberetning af udgifter og revision
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 324/2003 της Επιτροπής,
    της 20ής Φεβρουαρίου 2003, για καθορισμό των κριτηρίων
    επιλεξιμότητας των δαπανών των κοινοτικών
    εργαστηρίων αναφοράς που λαμβάνουν χρηματοδοτική
    ενίσχυση βάσει του άρθρου 28 της απόφασης 90/424/EΟΚ
    και των διαδικασιών για την υποβολή δαπανών
    και τη διενέργεια ελέγχων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 324/2003, annettu 20 päivänä helmikuuta 2003,
    taloudellista tukea päätöksen 90/424/ETY 28 artiklan mukaisesti saavien yhteisön
    vertailulaboratorioiden kustannusten hyväksymisperusteiden määrittämisestä
    ja kustannusten ilmoittamista ja tilintarkastusten suorittamista koskevien menettelyjen
    vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 324/2003 della Commissione, del 20 febbraio 2003, che
    stabilisce i criteri di ammissibilità per la spesa dei laboratori comunitari
    di riferimento che ricevono assistenza finanziaria ai sensi dell'articolo 28 della
    decisione 90/424/CEE e stabilisce le procedure per la dichiarazione di spesa e
    l'effettuazione di audit
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 324/2003 van de Commissie van 20 februari 2003 tot
    vaststelling van de subsidiecriteria voor de uitgaven van de communautaire referentielaboratoria
    die financiële steun ontvangen overeenkomstig artikel 28 van Beschikking 90/424/EEG
    en van de procedures voor de indiening van uitgaven en het uitvoeren van audits
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 324/2003 da Comissão, de 20 de Fevereiro de 2003,
    que estabelece os critérios de elegibilidade respeitantes às despesas dos laboratórios
    comunitários de referência que beneficiam de uma participação financeira ao
    abrigo do artigo 28.° da Decisão 90/424/CEE e que estabelece os procedimentos
    para a apresentação de despesas e para a realização de auditorias
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 324/2003 de la Comisión, de 20 de febrero de 2003,
