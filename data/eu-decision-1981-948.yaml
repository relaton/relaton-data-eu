    festgestellt wird, daß das Gerät ,,Microspec - Wavelength Dispersive X-ray Spectrometer,
    model WDX-210" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
