  content: '81/948/EEC: Commission Decision of 11 November 1981 establishing that
    the apparatus described as ''Microspec wavelength dispersive X-ray spectrometer,
    model WDX-210'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/948/CEE: Décision de la Commission, du 11 novembre 1981, constatant
    que l''importation de l''appareil dénommé "Microspec - wavelength dispersive
    X-ray spectrometer, model WDX-210" peut être faite en franchise des droits du
    tarif douanier commun'
  type: main
