title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2787/80 of 30 October 1980 re-establishing
    the levying of customs duties on carboxyimide-function compounds, falling within
    subheading 29.26 A I and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2787/80 de la Commission, du 30 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux composés
    à fonction imide, de la sous-position 29.26 A I du tarif douanier commun, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2787/80 der Kommission vom 30. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Verbindungen mit Imiden der Tarifstelle 29.26 A I mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2787/80 af 30. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for imider af carboxylsyrer, under pos. 29.26 A
    I, som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2787/80 della Commissione, del 30 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai composti a funzione
    immide, della sottovoce 29.26 A I della tariffa doganale comune, originari dei
    paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2787/80 van de Commissie van 30 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor imidoverbindingen van
    post 29.26 A I, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
