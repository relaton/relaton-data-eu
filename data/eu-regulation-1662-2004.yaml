    m. rugsėjo mėn. kai kuriems paukštienos ir kiaušinių sektorių produktams
    pagal Reglamentus (EB) Nr. 593/2004 ir (EB) Nr. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1662/2004 van de Commissie van 23 september 2004 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sectoren eieren en slachtpluimvee,
    die in september 2004 worden ingediend op grond van de Verordeningen (EG) nr.
    593/2004 en (EG) nr. 1251/96
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1662/2004 z dnia 23 września 2004 r. określające
    stopień, w jakim mogą zostać przyjęte wnioski złożone w wrześniu 2004 r.
    o pozwolenia na przywóz niektórych produktów z sektorów jaj i mięsa drobiowego
    w ramach rozporządzeń (WE) nr 593/2004 i nr 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1662/2004 da Comissão, de 23 de Setembro de 2004,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Setembro de 2004 ao abrigo dos Regulamentos (CE) n.° 593/2004 e (CE) n.°
    1251/96
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1662/2004 z 23. septembra 2004, ktoré určuje
