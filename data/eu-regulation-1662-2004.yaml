    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 593/2004 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1662/2004/EK rendelete (2004. szeptember 23.) az 593/2004/EK
