  content: Règlement (CEE) n° 2849/72 de la Commission, du 29 décembre 1972, autorisant
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à imposer des conditions
    supplémentaires pour l'octroi de primes pour l'arrachage de pommiers et de poiriers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2849/72 der Kommission vom 29. Dezember 1972 zur Ermächtigung
    des Großherzogtums Luxemburg und des Königreichs der Niederlande, zusätzliche
    Bedingungen für die Gewährung von Prämien für die Rodung von Apfel- und Birnbäumen
    zu stellen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2849/72 della Commissione, del 29 dicembre 1972, che
    autorizza il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad imporre
    condizioni supplementari per la concessione di premi per l'estirpazione di meli
    e di peri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2849/72 van de Commissie van 29 december 1972 waarbij
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    aanvullende voorwaarden te stellen voor de toekenning van premies voor het rooien
    van appelbomen en perebomen
