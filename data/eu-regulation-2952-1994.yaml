title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2952/94 of 5 December 1994 amending Regulation
    (EC) No 2120/94 and increasing to 1 259 357 tonnes the amount of cereals held
    by the French intervention agency for which a standing invitation to tender for
    resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2952/94 DE LA COMMISSION du 5 décembre 1994 modifiant
    le règlement (CE) n° 2120/94 et portant à 1 259 357 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur de céréales détenues par l'organisme
    d'intervention français
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2952/94 der Kommission vom 5. Dezember 1994 zur Änderung
    der Verordnung (EG) Nr. 2120/94 und zur Erweiterung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt auf 1 259 357 Tonnen Getreide aus Beständen
    der französischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2952/94 af 5. december 1994 om ændring
    af forordning (EF) nr. 2120/94 og om forhøjelse til 1 259 357 tons af den løbende
    licitation med henblik på videresalg på det indre marked af korn, som det franske
    interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2952/94 της Επιτροπής
    της 5ης Δεκεμβρίου 1994 που τροποποιεί τον κανονισμό
    (ΕΚ) αριθ. 2120/94 και ορίζει σε 1 259 357 τόνους τη
    διαρκή δημοπρασία για τη μεταπώληση στην εσωτερική
    αγορά σιτηρών που έχει στη διάθεσή του ο γαλλικός
    οργανισμός παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2952/94 della Commissione, del 5 dicembre 1994, che
    modifica il regolamento (CE) n. 2120/94 e che porta a 1 259 357 t il quantitativo
    globale oggetto della gara permanente per la rivendita sul mercato interno di
    cereali detenuti dall'organismo d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2952/94 van de Commissie van 5 december 1994 tot wijziging
    van Verordening (EG) nr. 2120/94 teneinde de hoeveelheid waarop de permanente
    openbare inschrijving voor de verkoop op de interne markt van graan uit de voorraden
    van het Franse interventiebureau betrekking heeft, tot 1 259 357 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2952/94 da Comissão, de 5 de Dezembro de 1994, que
    altera o Regulamento (CE) nº 2120/94 e que eleva para 1 259 357 toneladas o concurso
    permanente para a revenda no mercado interno de cereais detidos pelo organismo
    de intervenção francês
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 2952/94 de la Comisión, de 5 de diciembre de 1994, por
