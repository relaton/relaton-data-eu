    numerolla C(2015) 3790)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/911 оd 11. lipnja 2015. o izmjeni
    Priloga II. Odluci 2007/777/EZ u pogledu unosa za Kanadu na popisu trećih zemalja
    ili dijelova trećih zemalja iz kojih je odobreno unošenje mesnih proizvoda i
    obrađenih želudaca, mjehura i crijeva u Uniju u vezi s visokopatogenom influencom
    ptica (priopćeno pod brojem dokumenta C(2015) 3790)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/911 végrehajtási határozata (2015. június 11.)
    a 2007/777/EK határozat II. mellékletének a húskészítmények, kezelt gyomor,
    hólyag és belek Unióba történő behozatalára engedélyezett harmadik országok
    vagy részeik jegyzékében a Kanadára vonatkozó bejegyzésnek az erősen patogén
    vírustörzsek okozta madárinfluenzával kapcsolatban történő módosításáról
    (az értesítés a C(2015) 3790. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/911 della Commissione, dell'11 giugno
    2015, che modifica l'allegato II della decisione 2007/777/CE per quanto riguarda
    la voce relativa al Canada nell'elenco di paesi terzi o di parti di paesi terzi
    dai quali l'introduzione nell'Unione di prodotti a base di carne e stomaci, vesciche
    e intestini trattati è autorizzata, in relazione all'influenza aviaria ad alta
    patogenicità [notificata con il numero C(2015) 3790]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/911 (2015. gada 11. jūnijs),
    ar ko Lēmuma 2007/777/EK II pielikumu groza attiecībā uz ierakstu par Kanādu
    to trešo valstu vai to daļu sarakstā, no kurām Savienībā atļauts ievest
    gaļas produktus un apstrādātus kuņģus, pūšļus un zarnas, saistībā ar
    augsti patogēno putnu gripu (izziņots ar dokumenta numuru C(2015) 3790)
  type: main
- language: lt
  script: Latn
  content: 2015 m. birželio 11 d. Komisijos įgyvendinimo sprendimas (ES) 2015/911,
