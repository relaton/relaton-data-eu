    a la entrada correspondiente a Canadá en la lista de terceros países y partes
    de los mismos desde los que está autorizada la introducción en la Unión de
    estómagos, vejigas e intestinos tratados, en relación con la gripe aviar altamente
    patógena [notificada con el número C(2015) 3790]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2015/911 av den 11 juni 2015 om
    ändring av bilaga II till beslut 2007/777/EG vad gäller uppgifterna om Kanada
    i förteckningen över tredjeländer och delar av tredjeländer från vilka köttprodukter
