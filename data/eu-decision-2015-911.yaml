    įrašo trečiųjų šalių ir jų dalių, iš kurių leidžiama įvežti į Sąjungą
    mėsos gaminius ir apdorotus skrandžius, pūsles ir žarnas, sąraše iš dalies
    keičiamas Sprendimo 2007/777/EB II priedas (pranešta dokumentu Nr. C(2015) 3790)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/911 tal-11 ta'
    Ġunju 2015 li temenda l-Anness II tad-Deċiżjoni 2007/777/KE rigward l-entrata
    għall-Kanada fil-lista ta' pajjiżi terzi jew partijiet tagħhom, li minnhom
    l-introduzzjoni ta' prodotti tal-laħam u ta' stonkijiet, bżieżaq tal-awrina
    u msaren ittrattati lejn l-Unjoni hija awtorizzata fir-rigward ta' influwenza
    tat-tjur b'patoġeniċità għolja (notifikata bid-dokument C(2015) 3790)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/911 van de Commissie van 11 juni 2015 tot
    wijziging van bijlage II bij Beschikking 2007/777/EG wat betreft de vermelding
    voor Canada in de lijst van derde landen of delen daarvan waaruit vleesproducten
    en behandelde magen, blazen en darmen in de Unie mogen worden binnengebracht in
    verband met hoogpathogene aviaire influenza (Kennisgeving geschied onder nummer
    C(2015) 3790)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2015/911 z dnia 11 czerwca 2015 r. zmieniająca
    załącznik II do decyzji 2007/777/WE w odniesieniu do wpisu dotyczącego Kanady
    w wykazie państw trzecich lub ich części, z których dozwolone jest wprowadzanie
    do Unii produktów mięsnych oraz przetworzonych żołądków, pęcherzy i jelit,
    w związku z wysoce zjadliwą grypą ptaków (notyfikowana jako dokument nr C(2015)
    3790)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/911 da Comissão, de 11 de junho de 2015,
    que altera o anexo II da Decisão 2007/777/CE no que se refere à entrada relativa
    ao Canadá na lista de países terceiros ou de partes de países terceiros a partir
    dos quais é autorizada a introdução na União de produtos à base de carne
    e de estômagos, bexigas e intestinos tratados, relativamente à gripe aviária
    de alta patogenicidade [notificada com o número C(2015) 3790]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/911 a Comisiei din 11 iunie 2015
    de modificare a anexei II la Decizia 2007/777/CE în ceea ce privește rubrica
    referitoare la Canada din lista țărilor terțe sau a părților acestora din
    care se autorizează introducerea în Uniune de produse din carne și stomacuri,
    vezici și intestine tratate în contextul riscului de gripă aviară înalt patogenă
    [notificată cu numărul C(2015) 3790]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/911 z 11. júna 2015, ktorým
    sa mení príloha II k rozhodnutiu 2007/777/ES, pokiaľ ide o zápis týkajúci
    sa Kanady v zozname tretích krajín alebo ich častí, z ktorých je povolený
    vstup mäsových výrobkov a opracovaných žalúdkov, mechúrov a čriev do Únie
    v súvislosti s vysokopatogénnou aviárnou influenzou [oznámené pod číslom
    C(2015) 3790]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2015/911 z dne 11. junija 2015 o spremembi
    Priloge II k Odločbi 2007/777/ES glede vnosa za Kanado na seznamu tretjih držav
    ali njihovih delov, iz katerih je dovoljen vnos mesnih izdelkov ter obdelanih
    želodcev, mehurjev in črev v Unijo v zvezi z visokopatogeno aviarno influenco
    (notificirano pod dokumentarno številko C(2015) 3790)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2015/911 de la Comisión, de 11 de junio de
