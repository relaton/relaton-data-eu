title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/911 of 11 June 2015 amending
    Annex II to Decision 2007/777/EC as regards the entry for Canada in the list of
    third countries or parts thereof from which the introduction of meat products
    and treated stomachs, bladders and intestines into the Union is authorised in
    relation to highly pathogenic avian influenza (notified under document C(2015)
    3790)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/911 de la Commission du 11 juin 2015 modifiant
    l'annexe II de la décision 2007/777/CE en ce qui concerne l'entrée relative
    au Canada sur la liste des pays tiers ou parties de pays tiers à partir desquels
    l'introduction dans l'Union de produits à base de viande et d'estomacs, vessies
    et boyaux traités est autorisée, quant à l'influenza aviaire hautement pathogène
    [notifiée sous le numéro C(2015) 3790]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/911 der Kommission vom 11. Juni 2015
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG hinsichtlich des Eintrags
    zu Kanada in der Liste der Drittländer bzw. der Teile von Drittländern, aus
    denen die Einfuhr von Fleischerzeugnissen und behandelten Mägen, Blasen und Därmen
    in die Europäische Union gestattet ist, in Bezug auf die hochpathogene Aviäre
    Influenza (Bekanntgegeben unter Aktenzeichen C(2015) 3790)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/911 на Комисията
    от 11 юни 2015 година за изменение, във връзка
    с високопатогенна инфлуенца по птиците, на
    приложение II към Решение 2007/777/ЕО по отношение
    на вписването за Канада в списъка с трети държави
    или части от тях, от които е разрешено въвеждането
    в Съюза на месни продукти и обработени стомаси,
    пикочни мехури и черва (нотифицирано под номер
    С(2015) 3790)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/911 ze dne 11. června 2015,
    kterým se mění příloha II rozhodnutí 2007/777/ES, pokud jde položku týkající
    se Kanady na seznamu třetích zemí nebo jejich částí, z nichž je do Unie
    povolen dovoz masných výrobků a opracovaných žaludků, močových měchýřů
    a střev v souvislosti s vysoce patogenní influenzou ptáků (oznámeno pod číslem
    C(2015) 3790)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2015/911 af 11. juni 2015
    om ændring af bilag II til beslutning 2007/777/EF for så vidt angår oplysningerne
    om Canada i listen over tredjelande og dele af tredjelande, hvorfra indførsel
    af kødprodukter og behandlede maver, blærer og tarme til Unionen er tilladt
    i forbindelse med højpatogen aviær influenza (meddelt under nummer C(2015) 3790)
  type: main
- language: el
  script: Grek
