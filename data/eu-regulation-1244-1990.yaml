    των δασμών για προϊόντα του κωδικού ΣΟ 2930 90
    10, (αύξων αριθμός 10.0290), καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3896/89 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1244/90 DELLA COMMISSIONE dell'8 maggio 1990 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti del codice NC 2930 90
    10 (numero d'ordine 10.0290), originari della Cina, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3896/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1244/90 VAN DE COMMISSIE van 8 mei 1990 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op produkten van
    GN-code 2930 90 10 (volgnummer 10.0290), van oorsprong uit China, waarvoor de
    in Verordening (EEG) nr. 3896/89 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1244/90 DA COMISSAO de 8 de Maio de 1990 que restabelece
    a cobrança dos direitos aduaneiros aplicaveis aos produtos do codigo NC 2930
    90 10 (numero de ordem 10.0290), originarios da China, beneficiaria das preferências
    pautais pelo Regulamento (CEE) n* 3896/89 do Conselho
  type: main
- language: es
