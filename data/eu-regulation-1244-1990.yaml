title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1244/90 of 8 May 1990 reintroducing the
    levying of the customs duties applicable to products of the CN code 2930 90 10
    (order No 10.0290) originating in China, to which the preferential arrangements
    of Council Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1244/90 de la Commission du 8 mai 1990 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 2930
    90 10 (numéro d'ordre 10.0290) originaires de la Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1244/90 DER KOMMISSION vom 8. Mai 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer Waren des KN-Code 2930 90 10 (laufende Nummer 10.0290)
    mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1244/90 af 8. maj 1990 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2930 90 10 (løbenummer
    10.0290) og med oprindelse i Kina, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3896/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1244/90 της Επιτροπής
