title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2991/95 of 19 December 1995 amending Regulation
    (EEC) No 334/93 laying down detailed implementing rules for the use of land set
    aside for the Community of products not primarily intended for human or animal
    consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2991/95 de la Commission, du 19 décembre 1995, modifiant
    le règlement (CEE) n° 334/93 portant modalités d'application relatives à l'utilisation
    des terres mises en jachère pour la production de matières premières servant
    à la fabrication, dans la Communauté, de produits destinés à des fins principales
    autres que la consommation humaine ou animale
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2991/95 der Kommission vom 19. Dezember 1995 zur Änderung
    der Verordnung (EWG) Nr. 334/93 mit detaillierten Durchführungsbestimmungen für
    die Nutzung stillgelegter Flächen zur Erzeugung von Ausgangserzeugnissen, die
    in der Gemeinschaft zu nicht in erster Linie für Lebens- oder Futtermittelzwecke
    bestimmten Erzeugnissen verarbeitet werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2991/95 af 19. december 1995 om ændring
    af forordning (EØF) nr. 334/93 om gennemførelsesbestemmelser for anvendelse
    af udtagne landbrugsarealer med henblik på tilvejebringelse af materialer til
    fremstilling i Fællesskabet af produkter, som ikke primært er bestemt til konsum
    eller foderbrug
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2991/95 της Επιτροπής,
    της 19ης Δεκεμβρίου 1995, για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 334/93 περί λεπτομερών
    κανόνων σχετικά με τη χρησιμοποίηση των γαιών
    που βρίσκονται υπό καθεστώς προσωρινής παύσης
    καλλιέργειας για την παραγωγή πρώτων υλών
    που χρησιμεύουν κατά την παρασκευή στην Κοινότητα
    προϊόντων προοριζόμενων καταρχήν για άλλους
    σκοπούς εκτός της κατανάλωσης από τον άνθρωπο
    ή τα ζώα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2991/95, annettu 19 päivänä joulukuuta 1995,
    yksityiskohtaisista säännöistä om kesannointimaan käytön soveltamisesta
    yhteisössä valmistettavien tuotteiden raaka-aineiden tuottamiseen ensisijaisesti
    muihin tarkoituksiin kuin elintarvikkeiksi tai eläinten ravinnoksi annetun asetuksen
    (ETY) N:o 334/93 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2991/95 della Commissione, del 19 dicembre 1995, che
    modifica il regolamento (CEE) n. 334/93 recante modalità d'applicazione relative
    all'uso di superfici ritirate dalla produzione allo scopo di ottenere materiali
    per la fabbricazione, nella Comunità, di prodotti non destinati in primo luogo
    al consumo umano o animale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2991/95 van de Commissie van 19 december 1995 tot
    wijziging van Verordening (EEG) nr. 334/93 tot vaststelling van uitvoeringsbepalingen
    betreffende het gebruik van uit produktie genomen grond voor de produktie van
    grondstoffen voor de vervaardiging, in de Gemeenschap, van niet specifiek voor
    voeding of vervoedering bestemde produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2991/95 da Comissão, de 19 de Dezembro de 1995, que
    altera o Regulamento (CEE) nº 334/93 que estabelece normas de execução para
    a utilização de terras retiradas para a produção de matérias destinadas ao
    fabrico, na Comunidade, de produtos não destinados primariamente ao consumo humano
    ou animal
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2991/95 de la Comisión, de 19 de diciembre de 1995,
    por el que se modifica el Reglamento (CEE) nº 334/93 por el que se establecen
    disposiciones de aplicación relativas a la utilización de las tierras retiradas
    de la producción, con vistas a la obtención de materias para la fabricación
    en la Comunidad de productos que no se destinen principalmente al consumo humano
    o animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2991/95 av den 19 december 1995 om ändring
    av förordning (EEG) nr 334/93 om genomförandebestämmelser för användningen
    av jordbruksmark som tagits ur bruk till produktion av råvaror för tillverkning
    inom gemenskapen av produkter som inte primärt är avsedda till livsmedel eller
    djurfoder
