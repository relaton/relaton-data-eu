title:
- language: en
  script: Latn
  content: '80/751/EEC: Commission Decision of 15 July 1980 authorizing the French
    Republic not to apply Community treatment to men''s and boys''shirts, woven, falling
    within subheading 61.03 A of the Common Customs Tariff (category 8), originating
    in India and in free circulation in the other Member States (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/751/CEE: Décision de la Commission, du 15 juillet 1980, autorisant
    la République française à exclure du traitement communautaire les chemises
    et chemisettes tissées de la sous-position 61.03 A du tarif douanier commun (catégorie
    8), originaires de l''Inde et mises en libre pratique dans les autres Etats membres
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/751/EWG: Entscheidung der Kommission vom 15. Juli 1980 mit der die
    Französische Republik ermächtigt wird, aus Indien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden,
    aus Geweben, für Männer und Knaben, der Tarifstelle 61.03 A des Gemeinsamen
    Zolltarifs (Kategorie 8) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/751/EØF: Kommissionens beslutning af 15. juli 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede skjorter
    (herunder sports- og arbejdsskjorter) til mænd og drenge, som henhører under
    pos. 61.03 A i den fælles toldtarif (kategori 8), har oprindelse i Indien og
    frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/751/CEE: Decisione della Commissione, del 15 luglio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le camicie e le
    camicette tessute, per uomo e per ragazzo, della sottovoce 61.03 A della tariffa
    doganale comune, categoria 8, originarie dell''India e messe in libera pratica
    negli altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/751/EEG: Beschikking van de Commissie van 15 juli 1980 waarbij de Franse
    Republiek wordt gemachtigd overhemden en sporthemden, geweven, van post 61.03
    A van het gemeenschappelijk douanetarief (categorie 8), van oorsprong uit India
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
