id: EUDecision197390
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 16 April 1973 authorizing the Federal Republic of
    Germany not to apply Community treatment to preparations and preserves of beans
    in pod falling within heading No 20.02 ex G of the Common Customs Tariff, originating
    in the People's Republic of China and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: Décision 73/90/CEE de la Commission, du 16 avril 1973, autorisant le République
    fédérale d'Allemagne à exclure du traitement communautaire les préparations
    et conserves de haricots verts, de la position 20.02 Ex G du Tarif douanier commun,
    originaires de la République populaire de Chine et mises en libre pratique dans
    les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 16. April 1973, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der Volksrepublik China stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Konserven von grünen Bohnen
    der Tarifnummer 20.02 ex G des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 16. april 1973 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage grønne bønner, tilberedt
    eller konserveret, som henhører under position 20.02 ex G i den fælles toldtarif,
    har oprindelse i Folkerupublikken Kina og overgår til fri omsætning i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 16 aprile 1973, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario le conserve di fagiolini
    della voce n. 20.02 ex G della tariffa doganale comune, originari della Repubblica
    popolare cinese e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 16 april 1973 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd conserven van sla-, spek-, pronk- en snijbonen van
    post 20.02 ex G van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
