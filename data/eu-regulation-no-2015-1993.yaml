title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2015/93 of 23 July 1993 determining the
    extent to which applications lodged in July 1993 for import licences for certain
    pigmeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2015/93 de la Commission, du 23 juillet 1993, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juillet 1993 pour certains produits du secteur
    de la viande de porc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2015/93 der Kommission vom 23. Juli 1993 über das
    Ausmaß, in dem den im Juli 1993 für die Einfuhr von bestimmten Schweinefleischerzeugnissen
    eingereichten Lizenzanträgen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2015/93 af 23. juli 1993 om fastlæggelse
    af, i hvilket omfang de ansøgninger om udstedelse af importlicenser, der er indgivet
    i juli 1993 for visse varer inden for svinekødsektoren, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2015/93 της Επιτροπής
