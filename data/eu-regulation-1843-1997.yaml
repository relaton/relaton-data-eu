    totales admisibles de capturas (TAC) de determinadas poblaciones y grupos de poblaciones
    de peces para 1997 y determinadas condiciones en que pueden pescarse
  type: main
- language: sv
  script: Latn
  content: RÅDETS FÖRORDNING (EG) nr 1843/97 av den 22 september 1997 om ändring
