---
id: EUDecision20181888
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/1888 of 3 December 2018 determining
    that a temporary suspension of the preferential customs duty pursuant to Article
    15 of Regulation (EU) No 19/2013 of the European Parliament and of the Council
    and pursuant to Article 15 of Regulation (EU) No 20/2013 of the European Parliament
    and of the Council is not appropriate for imports of bananas originating in Guatemala
    and Peru
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/1888 de la Commission du 3 décembre 2018
    déterminant qu'une suspension temporaire du droit de douane préférentiel au
    titre de l'article 15 du règlement (UE) n° 19/2013 du Parlement européen et
    du Conseil et de l'article 15 du règlement (UE) n° 20/2013 du Parlement européen
    et du Conseil n'est pas appropriée dans le cas des importations de bananes originaires
    du Guatemala et du Pérou
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1888 der Kommission vom 3. Dezember 2018
    zur Feststellung, dass eine vorübergehende Aussetzung des Präferenzzolls nach
    Artikel 15 der Verordnung (EU) Nr. 19/2013 des Europäischen Parlaments und des
    Rates und nach Artikel 15 der Verordnung (EU) Nr. 20/2013 des Europäischen Parlaments
    und des Rates für Einfuhren von Bananen mit Ursprung in Guatemala und Peru nicht
    angemessen ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/1888 на Комисията
    от 3 декември 2018 година за определяне на временното
    спиране на прилагането на преференциалното
    мито по член 15 от Регламент (ЕС) № 19/2013 на Европейския
    парламент и на Съвета и по член 15 от Регламент
    (ЕС) № 20/2013 на Европейския парламент и на Съвета
    за нецелесъобразно по отношение на вноса на
    банани с произход от Гватемала и Перу
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/1888 ze dne 3. prosince 2018,
    kterým se stanoví, že dočasné pozastavení preferenční celní sazby podle
    článku 15 nařízení Evropského parlamentu a Rady (EU) č. 20/2013 a podle
    článku 15 nařízení Evropského parlamentu a Rady (EU) č. 19/2013 není vhodné
    pro dovoz banánů pocházejících z Guatemaly a Peru
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/1888 af 3. december 2018
    om fastsættelse af, at en midlertidig suspension af den præferencetold, som
    er fastsat i henhold til artikel 15 i Europa-Parlamentets og Rådets forordning
    (EU) nr. 19/2013 og i henhold til artikel 15 i Europa-Parlamentets og Rådets
    forordning (EU) nr. 20/2013, ikke er hensigtsmæssig for import af bananer med
    oprindelse i Guatemala og Peru
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/1888 της Επιτροπής,
    της 3ης Δεκεμβρίου 2018, με την οποία ορίζεται
    ότι η προσωρινή αναστολή του προτιμησιακού
    δασμού, σύμφωνα με το άρθρο 15 του κανονισμού
    (ΕΕ) αριθ. 19/2013 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου και το άρθρο 15 του κανονισμού
    (ΕΕ) αριθ. 20/2013 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, δεν κρίνεται σκόπιμη για
    τις εισαγωγές μπανανών καταγωγής Γουατεμάλας
    και Περού
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/1888, 3. detsember 2018, milles sätestatakse,
    et Guatemalast ja Peruust pärit banaanide impordi suhtes kehtiva (Euroopa Parlamendi
    ja nõukogu määruse (EL) nr 19/2013 artikli 15 ning Euroopa Parlamendi ja nõukogu
    määruse (EL) nr 20/2013 artikli 15 kohase) soodustollimaksu ajutine peatamine
    ei ole asjakohane
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/1888, annettu 3 päivänä
    joulukuuta 2018, sen määrittämisestä, että Euroopan parlamentin ja neuvoston
    asetuksen (EU) N:o 19/2013 15 artiklan mukainen ja Euroopan parlamentin ja neuvoston
    asetuksen (EU) N:o 20/2013 15 artiklan mukainen etuustullin väliaikainen suspendoiminen
    ei ole aiheellista Guatemalasta ja Perusta peräisin olevien banaanien tuonnissa
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/1888 оd 3. prosinca 2018. kojom se
    utvrđuje da privremena obustava povlaštene carine na temelju članka 15. Uredbe
    (EU) br. 20/2013 Europskog parlamenta i Vijeća i članka 15. Uredbe (EU) br.
    19/2013 Europskog parlamenta i Vijeća nije primjerena za uvoz banana podrijetlom
    iz Gvatemale i Perua
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/1888 végrehajtási határozata (2018. december
    3.) a Guatemalából és Peruból származó banán behozatalára alkalmazott
    kedvezményes vámtételek a 19/2013/EU európai parlamenti és tanácsi rendelet
    15. cikke és a 20/2013/EU európai parlamenti és tanácsi rendelet 15. cikke
    értelmében alkalmazott ideiglenes felfüggesztése nem helyénvaló voltának
    megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/1888 della Commissione, del 3 dicembre
    2018, che stabilisce che una sospensione temporanea del dazio doganale preferenziale
    a norma dell'articolo 15 del regolamento (UE) n. 19/2013 del Parlamento europeo
    e del Consiglio e dell'articolo 15 del regolamento (UE) n. 20/2013 del Parlamento
    europeo e del Consiglio non è appropriata nel caso delle importazioni di banane
    originarie del Guatemala e del Perù
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/1888 (2018. gada 3. decembris),
    ar ko nosaka, ka atvieglotā muitas nodokļa pagaidu atcelšana, kura noteikta
    saskaņā ar Eiropas Parlamenta un Padomes Regulas (ES) Nr. 19/2013 15. pantu
    un Eiropas Parlamenta un Padomes Regulas (ES) Nr. 20/2013 15. pantu, attiecībā
    uz Gvatemalas un Peru izcelsmes banānu importu nav nepieciešama
  type: main
- language: lt
  script: Latn
  content: 2018 m. gruodžio 3 d. Komisijos įgyvendinimo sprendimas (ES) 2018/1888,
    kuriuo nustatoma, kad laikinas lengvatinio muito taikymo sustabdymas pagal Europos
    Parlamento ir Tarybos reglamento (ES) Nr. 19/2013 15 straipsnį ir Europos Parlamento
    ir Tarybos reglamento (ES) Nr. 20/2013 15 straipsnį importuojamiems Gvatemalos
    ir Peru kilmės bananams yra netinkamas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/1888 tat-3 ta'
    Diċembru 2018 li tiddetermina li sospensjoni temporanja tad-dazju doganali preferenzjali
    skont l-Artikolu 15 tar-Regolament (UE) Nru 19/2013 tal-Parlament Ewropew u tal-Kunsill
    u skont l-Artikolu 15 tar-Regolament (UE) Nru 20/2013 tal-Parlament Ewropew u
    tal-Kunsill mhijiex adegwata għall-importazzjonijiet tal-banana li toriġina
    mill-Gwatemala u mill-Perù
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/1888 van de Commissie van 3 december 2018
    waarbij wordt bepaald dat een tijdelijke opschorting van het preferentiële douanerecht
    krachtens artikel 15 van Verordening (EU) nr. 19/2013 van het Europees Parlement
    en de Raad en krachtens artikel 15 van Verordening (EU) nr. 20/2013 van het Europees
    Parlement en de Raad niet passend is voor de invoer van bananen van oorsprong
    uit Guatemala en Peru
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/1888 z dnia 3 grudnia 2018 r. stanowiąca,
    że tymczasowe zawieszenie preferencyjnego cła na podstawie art. 15 rozporządzenia
    Parlamentu Europejskiego i Rady (UE) nr 19/2013 oraz na podstawie art. 15 rozporządzenia
    Parlamentu Europejskiego i Rady (UE) nr 20/2013 nie jest odpowiednie w odniesieniu
    do przywozu bananów pochodzących z Gwatemali i Peru
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/1888 da Comissão, de 3 de dezembro de
    2018, que determina que a suspensão temporária do direito aduaneiro preferencial,
    nos termos do disposto no artigo 15.° do Regulamento (UE) n.° 19/2013 do Parlamento
    Europeu e do Conselho e no artigo 15.° do Regulamento (UE) n.° 20/2013 do Parlamento
    Europeu e do Conselho, não é adequada para as importações de bananas originárias
    da Guatemala e do Peru
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/1888 a Comisiei din 3 decembrie
    2018 de stabilire a faptului că o suspendare temporară a taxei vamale preferențiale
    în temeiul articolului 15 din Regulamentul (UE) nr. 19/2013 al Parlamentului
    European și al Consiliului și în temeiul articolului 15 din Regulamentul (UE)
    nr. 20/2013 al Parlamentului European și al Consiliului nu este adecvată pentru
    importurile de banane originare din Guatemala și Peru
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/1888 z 3. decembra 2018, ktorým
    sa určuje, že dočasné pozastavenie preferenčného cla podľa článku 15
    nariadenia Európskeho parlamentu a Rady (EÚ) č. 20/2013 a článku 15 nariadenia
    Európskeho parlamentu a Rady (EÚ) č. 19/2013 nie je primerané pre dovoz banánov
    s pôvodom v Guatemale a Peru
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/1888 z dne 3. decembra 2018 o ugotovitvi,
    da začasna opustitev preferencialnih carin v skladu s členom 15 Uredbe (EU)
    št. 19/2013 Evropskega parlamenta in Sveta in v skladu s členom 15 Uredbe (EU)
    št. 20/2013 Evropskega parlamenta in Sveta ni primerna za uvoz banan s poreklom
    iz Gvatemale in Peruja
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/1888 de la Comisión, de 3 de diciembre
    de 2018, por la que se determina que una suspensión temporal del arancel aduanero
    preferencial con arreglo al artículo 15 del Reglamento (UE) n.° 20/2013 del
    Parlamento Europeo y del Consejo y al artículo 15 del Reglamento (UE) n.° 19/2013
    del Parlamento Europeo y del Consejo no es apropiada para las importaciones de
    bananas o plátanos originarios de Guatemala y Perú
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/1888 av den 3 december 2018
    om fastställande av att ett tillfälligt upphävande av förmånstullarna i enlighet
    med artikel 15 i Europaparlamentets och rådets förordning (EU) nr 19/2013 och
    i enlighet med artikel 15 i Europaparlamentets och rådets förordning (EU) nr
    20/2013 inte är lämpligt för import av bananer med ursprung i Guatemala och
    Peru
