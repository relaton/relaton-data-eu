title:
- language: en
  script: Latn
  content: Council Decision 2013/320/CFSP of 24 June 2013 in support of physical security
    and stockpile management activities to reduce the risk of illicit trade in small
    arms and light weapons (SALW) and their ammunition in Libya and its region
  type: main
- language: fr
  script: Latn
  content: Decision 2013/320/PESC du Conseil du 24 juin 2013 à l'appui des activités
    de sécurité physique et de gestion des stocks visant à réduire le risque de
    commerce illicite d'armes légères et de petit calibre (ALPC) et de leurs munitions
    en Libye et dans sa région
  type: main
- language: de
  script: Latn
  content: Beschluss 2013/320/GASP des Rates vom 24. Juni 2013 zur Unterstützung
    von Maßnahmen zur physischen Sicherung und Verwaltung von Lagerbeständen, um
    die Gefahr des unerlaubten Handels mit Kleinwaffen und leichten Waffen und der
    dazugehörigen Munition in Libyen und in der Region zu verringern
  type: main
- language: bg
  script: Cyrl
  content: Решение 2013/320/ОВППС на Съвета от 24 юни 2013
    година в подкрепа на действията в областта
    на физическата сигурност и управлението на
    запасите с цел намаляване на риска от незаконна
    търговия с малки оръжия и леки въоръжения (МОЛВ)
    и боеприпаси за тях в Либия и в региона
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2013/320/SZBP ze dne 24. června 2013 na podporu činností
    v oblasti fyzické bezpečnosti a řízení zásob střeliva s cílem snížit
    riziko nedovoleného obchodu s ručními palnými a lehkými zbraněmi a střeliva
    pro ně v Libyi a v okolním regionu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2013/320/FUSP af 24. juni 2013 om aktiviteter til støtte
    for fysisk sikkerhed og lagerforvaltning med henblik på at mindske risikoen for
    ulovlig handel med håndvåben og lette våben (SALW) og ammunition hertil i Libyen
    og den omkringliggende region
  type: main
- language: el
  script: Grek
  content: Απόφαση 2013/320/ΚΕΠΠΑ του Συμβουλίου, της
    24ης Ιουνίου 2013 , για τη στήριξη δραστηριοτήτων
    που αφορούν την υλική ασφάλεια και τη διαχείριση
    αποθεμάτων για τη μείωση του κινδύνου παράνομης
    εμπορίας φορητών όπλων και ελαφρού οπλισμού
    (ΦΟΕΟ) και των πυρομαχικών τους στη Λιβύη και
    την περιοχή της
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2013/320/ÜVJP, 24. juuni 2013 , füüsilise julgeoleku
    ja varude haldamisega seotud tegevuse toetamiseks, et vähendada Liibüas ja selle
    piirkonnas väike- ja kergrelvade ning nende laskemoonaga ebaseaduslikult kauplemise
    ohtu
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2013/320/YUTP, annettu 24 päivänä kesäkuuta 2013
    , pienaseiden ja kevyiden aseiden sekä niissä käytettävien ampumatarvikkeiden
    laittoman kaupan riskin pienentämiseksi Libyassa ja sen lähialueilla toteutettavien
    fyysiseen turvallisuuteen ja varastojen hallintaan liittyvien toimien tukemisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća 2013/320/ZVSP od 24. lipnja 2013. o potpori aktivnostima
    fizičkog osiguranja zaliha i upravljanja zalihama kako bi se smanjio rizik od
    nezakonite trgovine malim i lakim oružjem (SALW) te pripadajućim streljivom
    u Libiji i njezinoj regiji
  type: main
- language: hu
  script: Latn
  content: A Tanács 2013/320/KKBP határozata ( 2013. június 24. ) a Líbiában
    és térségében a kézi- és könnyűfegyverek, valamint az azokhoz szükséges
    lőszerek tiltott kereskedelme kockázatának csökkentését célzó fizikai
    biztonsági és készletkezelési tevékenységek támogatásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2013/320/PESC del Consiglio, del 24 giugno 2013 , a sostegno
    delle attività connesse alla sicurezza fisica e alla gestione delle scorte per
    la riduzione del rischio di traffico illegale di armi leggere e di piccolo calibro
    (SALW) e relative munizioni in Libia e nella sua regione
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2013/320/KĀDP ( 2013. gada 24. jūnijs ) atbalstot fiziskās
    drošības un krājumu apsaimniekošanas pasākumus, lai samazinātu kājnieku
    ieroču un vieglo ieroču (VIKI) nelikumīgas tirdzniecības risku Lībijā un
    tās reģionā
  type: main
- language: lt
  script: Latn
  content: 2013 m. birželio 24 d. Tarybos sprendimas 2013/320/BUSP, kuriuo remiama
    fizinio saugumo ir atsargų valdymo veikla, kad būtų sumažintas neteisėtos
    prekybos šaulių ir lengvaisiais ginklais (ŠLG) bei jų šaudmenimis pavojus
    Libijoje ir regione
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2013/320/PESK tal- 24 ta’ Ġunju 2013 b'appoġġ
    għas-sigurtà fiżika u l-attivitajiet relatati mal-ġestjoni tal-ħażniet biex
    jitnaqqas ir-riskju tal-kummerċ illeċitu fl-armi ħfief u ta' kalibru żgħir
    (SALW) u l-munizzjon tagħhom fil-Libja u r-reġjun tagħha
  type: main
- language: nl
  script: Latn
  content: Besluit 2013/320/GBVB van de Raad van 24 juni 2013 betreffende activiteiten
    ter ondersteuning van de fysieke beveiliging en het voorraadbeheer met het doel
    het risico op illegale handel in handvuurwapens en lichte wapens (SALW) en de
    munitie daarvoor in Libië en de regio te voorkomen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2013/320/WPZiB z dnia 24 czerwca 2013 r. dotycząca wspierania
    działań w zakresie bezpieczeństwa fizycznego i zarządzania zapasami w celu
    ograniczenia ryzyka nielegalnego handlu bronią strzelecką i lekką (BSiL) oraz
    amunicją do tych rodzajów broni w Libii i regionie
  type: main
- language: pt
  script: Latn
  content: Decisão 2013/320/PESC do Conselho, de 24 de junho de 2013 , em apoio às
    atividades no domínio da segurança física e da gestão de arsenais, com vista
    a reduzir o risco de tráfico de armas ligeiras e de pequeno calibre (ALPC) e
    respetivas munições na Líbia e região circundante
  type: main
- language: ro
  script: Latn
  content: Decizia 2013/320/PESC a Consiliului din 24 iunie 2013 de sprijinire a activităților
    de securitate fizică și gestionare a stocurilor pentru reducerea riscului de
    comerț ilicit cu arme de calibru mic și armament ușor (SALW) și muniția aferentă
    în Libia și în regiunea acesteia
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2013/320/SZBP z 24. júna 2013 na podporu činností v
    oblasti fyzickej bezpečnosti a riadenia zásob v záujme zníženia rizika nedovoleného
    obchodovania s ručnými a ľahkými zbraňami (RĽZ) a ich muníciou v Líbyi
    a jej regióne
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2013/320/SZVP z dne 24. junija 2013 o podpori dejavnostim fizične
    zaščite in upravljanja zalog za zmanjšanje nevarnosti nedovoljene trgovine
    z osebnim in lahkim orožjem ter pripadajočim strelivom v Libiji in njeni regiji
  type: main
- language: es
  script: Latn
  content: Decisión 2013/320/PESC del Consejo, de 24 de junio de 2013 , en apoyo
    de las actividades de seguridad física y gestión de arsenales a fin de reducir
    el riesgo de comercio ilícito de armas pequeñas y armas ligeras (APAL) y de
    sus municiones en Libia y su región
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2013/320/Gusp av den 24 juni 2013 till stöd för fysisk
    säkerhet och lagerhantering som minskar risken för olaglig handel med handeldvapen
    och lätta vapen och ammunition i Libyen och dess region
  type: main
