  content: Règlement d’exécution (UE) 2023/973 de la Commission du 15 mai 2023
    modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404 en ce
    qui concerne les mentions relatives au Canada, au Chili, au Royaume-Uni et aux
    États-Unis dans les listes des pays tiers en provenance desquels l’entrée
    dans l’Union d’envois de volailles et de produits germinaux de volailles ainsi
    que de viandes fraîches de volailles et de gibier à plumes est autorisée
  type: main
