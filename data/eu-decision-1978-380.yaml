title:
- language: en
  script: Latn
  content: Commission Decision of 13 March 1978 authorizing the French Republic not
    to apply Community treatment to tents, falling within heading No 62.04 of the
    Common Customs Tariff, originating in South Korea and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '78/380/CEE: Décision de la Commission, du 13 mars 1978, autorisant la
    République française à exclure du traitement communautaire les tentes, de la
    position 62.04 du Tarif douanier commun, originaires de la Corée du Sud et mises
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. März 1978, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Zelte der Tarifnummer 62.04 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 13. marts 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage telte, som henhører under
    pos. 62.04 i den fælles toldtarif, har oprindelse i Sydkorea, og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 marzo 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le tende della voce 62.04 della
    tariffa doganale comune, originarie della Corea del Sud e messe in libera pratica
    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 maart 1978 waarbij de Franse Republiek
    wordt gemachtigd tenten van post 62.04 van het gemeenschappelijk douanetarief,
    van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
