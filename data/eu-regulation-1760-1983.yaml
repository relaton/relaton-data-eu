title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1760/83 of 29 June 1983 on special detailed
    rules for the application of the system of advance-fixing certificates for certain
    agricultural products exported in the form of goods not covered by Annex II to
    the Treaty and derogating from Regulation (EEC) No 2730/79 with regard to payment
    of refunds on butter
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1760/83 de la Commission du 29 juin 1983 portant modalités
    particulières d' application du régime des certificats de préfixation pour
    certains produits agricoles exportés sous forme de marchandises ne relevant pas
    de l' annexe II du traité et dérogeant au règlement (CEE) no 2730/79 en ce
    qui concerne le paiement de la restitution pour le beurre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1760/83 der Kommission vom 29. Juni 1983 über besondere
    Durchführungsvorschriften für Vorausfestsetzungsbescheinigungen für bestimmte
    landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang II des Vertrages
    fallenden Waren ausgeführt werden, und zur Abweichung von der Verordnung (EWG)
    Nr. 2730/79 hinsichtlich der Zahlung der Erstattung für Butter
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1760/83 af 29. juni 1983 om de særlige
    gennemførelsesbestemmelser for ordningen med forudfastsættelsesattester for
    visse landbrugsprodukter, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II, og om fravigelse af forordning (EØF) nr. 2730/79 for så vidt angår
    betaling af restitutioner for smør
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1760/83 της Επιτροπής
    της 29ης Ιουνίου 1983 περί ειδικών λεπτομερειών
    εφαρμογής του καθεστώτος πιστοποιητικών προκαθορισμού
    για ορισμένα γεωργικά προϊόντα εξαγόμενα υπό
    μορφή εμπορευμάτων που δεν υπάγονται στο παράρτημα
    ΙΙ της συνθήκης και περί παρεκκλίσεως από τον
    κανονισμό (ΕΟΚ) αριθ. 2730/79 όσον αφορά την καταβολή
    της επιστροφής για το βούτυρο
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1760/83 della Commissione del 29 giugno 1983 che stabilisce
    le modalità particolari di applicazione del regime dei titoli di fissazione anticipata
    per determinati prodotti agricoli esportati sotto forma di merci non comprese
    nell' allegato II del trattato e deroga al regolamento (CEE) n. 2730/79 per quanto
    riguarda il pagamento della restituzione per il burro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1760/83 van de Commissie van 29 juni 1983 houdende
    bijzondere uitvoeringsbepalingen inzake het stelsel van voorfixatiecertificaten
    voor bepaalde landbouwprodukten die worden uitgevoerd in de vorm van goederen
    die niet onder bijlage II van het Verdrag vallen en houdende afwijking van Verordening
    (EEG) nr. 2730/79 ten aanzien van de betaling van de restitutie voor boter
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1760/83 da Comissão, de 29 de Junho de 1983, que
    estabelece modalidades especiais de aplicação do regime dos certificados de
    prefixação para certos produtos agrícolas exportados sob a forma de mercadorias
    que não constam do Anexo II do Tratado e que derrogam o Regulamento (CEE) n.°
    2730/79 no que diz respeito ao pagamento de restituição para a manteiga
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1760/83 de la Comisión, de 29 de junio de 1983, sobre
    modalidades especiales de aplicación del régimen de los certificados de fijación
    anticipada para determinados productos agrícolas exportados en forma de mercancías
    no incluidas en el Anexo II del Tratado y por el que se concede la excepción
    de lo dispuesto en el Reglamento (CEE) n° 2730/79 en lo que se refiere al pago
    de la restitución para la mantequilla
  type: main
