    Preisen an bestimmte Verarbeitungsbetriebe in der Gemeinschaft hinsichtlich der
    Einzelausschreibung zum Ende des Jahres 1973
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3407/73 af 17. december 1973 om undtagelse
