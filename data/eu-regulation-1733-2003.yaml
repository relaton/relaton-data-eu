  script: Latn
  content: Regulamento (CE) n.° 1733/2003 da Comissão, de 30 de Setembro de 2003,
    que inicia um inquérito sobre a alegada evasão das medidas anti-dumping instituídas
    pelo Regulamento (CE) n.° 119/97 do Conselho sobre as importações de determinados
    mecanismos de argolas para encadernação originários da República Popular da
