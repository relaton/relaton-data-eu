    iš Vietnamo, nepaisant to, ar deklaracijoje nurodyta kilmės šalis Vietnamas,
    ar ne, importas tariamai išvengia antidempingo priemonių, nustatytų Tarybos
    reglamentu (EB) Nr. 119/97 tam tikrų segtuvų su žiedais mechanizmų, kurių
