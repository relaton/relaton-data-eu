title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1733/2003 of 30 September 2003 initiating
    an investigation concerning the alleged circumvention of anti-dumping measures
    imposed by Council Regulation (EC) No 119/97 on imports of certain ring binder
    mechanisms originating in the People's Republic of China by imports of certain
    ring binder mechanisms consigned from Vietnam, whether declared as originating
    in Vietnam or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1733/2003 de la Commission du 30 septembre 2003 ouvrant
    une enquête sur le prétendu contournement des mesures antidumping instituées
    par le règlement (CE) n° 119/97 du Conseil sur les importations de certains
    mécanismes pour reliure à anneaux originaires de la République populaire de
    Chine par des importations de certains mécanismes pour reliure à anneaux expédiés
    du Viêt Nam, qu'ils aient ou non été déclarés originaires de ce pays, et
    rendant obligatoire l'enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1733/2003 der Kommission vom 30. September 2003 zur
    Einleitung einer Untersuchung betreffend die angebliche Umgehung der mit der Verordnung
    (EG) Nr. 119/97 des Rates eingeführten Antidumpingmaßnahmen gegenüber den Einfuhren
    bestimmter Ringbuchmechaniken mit Ursprung in der Volksrepublik China durch Einfuhren
    bestimmter aus Vietnam versandter Ringbuchmechaniken, unabhängig davon, ob ihr
    Ursprung in der Anmeldung mit Vietnam angegeben ist oder nicht, und zur zollamtlichen
    Erfassung der letztgenannten Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1733/2003 ze dne 30. září 2003, o zahájení
    řízení o údajném obcházení antidumpingových opatření uložených nařízením
    Rady (ES) č. 119/97 na dovoz některých mechanizmů kroužkových pořadačů
    pocházejících z Čínské lidové republiky dovozem některých mechanizmů
    kroužkových pořadačů zasílaných z Vietnamu, ať již jsou prohlášené
    za pocházející z Vietnamu či nikoliv, a o zavedení celní evidence těchto
    dovozů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1733/2003 af 30. september 2003 om indledning
    af en undersøgelse vedrørende den påståede omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 119/97 på importen af visse ringmekanismer
