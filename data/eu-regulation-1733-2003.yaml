  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1733/2003, 30. september 2003, millega algatatakse
    nõukogu määrusega (EÜ) nr 119/97 kehtestatud dumpinguvastastest meetmetest
    kõrvalehoidmise uurimine Hiina Rahvavabariigist pärit teatud spiraalköiteseadiste
    impordi kohta Vietnamist saadetavate teatud spiraalköiteseadiste impordi teel,
    sõltumata sellest, kas nende päritolumaana deklareeritud Vietnam või mitte
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1733/2003, annettu 30 päivänä syyskuuta 2003,
    Kiinan kansantasavallasta peräisin olevien rengaskirjamekanismien tuonnissa neuvoston
    asetuksella (EY) N:o 119/97 käyttöön otettujen polkumyyntitoimenpiteiden väitettyä
    kiertämistä Vietnamista lähetettyjen tiettyjen rengaskirjamekanismien tuonnilla,
    riippumatta siitä, onko niiden alkuperämaaksi ilmoitettu Vietnam, koskevan tutkimuksen
    aloittamisesta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1733/2003/EK rendelete (2003. szeptember 30.) a 119/97/EK
    tanácsi rendelettel a Kínai Népköztársaságból származó egyes gyűrűsfűzős
    irattartók behozatalára vonatkozóan bevezetett dömpingellenes intézkedéseknek
    a Vietnamban feladott egyes gyűrűsfűzős irattartók – függetlenül attól,
    hogy azokat Vietnamból származónak jelentik-e be vagy sem – behozatala általi
    állítólagos megkerülésével kapcsolatos vizsgálat kezdeményezéséről,
    valamint ezen behozatalok nyilvántartásba vételi kötelezettségének előírásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1733/2003 della Commissione, del 30 settembre 2003,
    che apre un'inchiesta relativa alla presunta elusione delle misure antidumping
    istituite dal regolamento (CE) n. 119/97 del Consiglio sulle importazioni di alcuni
    tipi di meccanismi per la legatura di fogli originari della Repubblica popolare
    cinese mediante importazioni di alcuni tipi di meccanismi per la legatura di fogli
    spediti dal Vietnam, indipendentemente dal fatto che siano dichiarati o meno originari
    del Vietnam, e che dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1733/2003 (2003. gada 30. septembris), ar ko
    uzsāk izmeklēšanu par to antidempinga pasākumu iespējamo apiešanu, kas ar
    Padomes Regulu (EK) Nr. 119/97 noteikti dažu Ķīnas Tautas Republikas izcelsmes
    gredzenveida stiprinājuma mehānismu importam, ko veic, nosūtot tos no Vjetnamas
    un deklarējot vai nedeklarējot kā Vjetnamas izcelsmes ražojumus, un par šāda
    importa reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2003 m. rugsėjo 30 d. Komisijos Reglamentas (EB) Nr. 1733/2003 inicijuojantis
