    να προβεί σε ενδοκοινοτική επιτήρηση όσον
    αφορά τις εισαγωγές ορισμένων υποδημάτων με
    εξωτερικό πέλμα από σχοινί και ορισμένων παντοφλών
    και άλλων υποδημάτων δωματίου καταγωγής Λαϊκής
