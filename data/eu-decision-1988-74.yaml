    af visse strandsandaler og visse typer hjemmefodtøj med oprindelse i Den Kinesiske
    Folkerepublik (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/74/ΕΟΚ: Απόφαση της Επιτροπής της 14ης Ιανουαρίου
