title:
- language: en
  script: Latn
  content: '88/74/EEC: Commission Decision of 14 January 1988 authorizing the French
    Republic to introduce intra- Community surveillance of imports of certain kinds
    of beach slippers, slippers and other indoor footwear originating in the People''s
    Republic of China (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/74/CEE: Décision de la Commission du 14 janvier 1988 autorisant la
    République française à procéder à une surveillance intracommunautaire à
    l''égard des importations de certaines espadrilles et certaines pantoufles et
    autres chaussures d''intérieur originaires de la République populaire de Chine
    (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/74/EWG: Entscheidung der Kommission vom 14. Januar 1988 zur Ermächtigung
    der Französischen Republik, eine innergemeinschaftliche Überwachung der Einfuhren
    von bestimmten Schuhen des Typs Espadrilles, bestimmten Pantoffeln und anderen
    Hausschuhen mit Ursprung in der Volksrepublik China einzuführen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/74/EØF: Kommissionens beslutning af 14. januar 1988 om bemyndigelse
