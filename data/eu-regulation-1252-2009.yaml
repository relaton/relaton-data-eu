    a Regulamentului (CE) nr. 1338/2006 de instituire a unei taxe antidumping definitive
    la importurile de piei chamois originare din Republica Populară Chineză, de
    percepere retroactivă și de instituire a unei taxe antidumping cu privire la
    importurile care provin de la un exportator din această țară și de încetare
    a înregistrării acestor importuri
  type: main
