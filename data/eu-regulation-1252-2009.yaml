    von Sämischleder mit Ursprung in der Volksrepublik China, zur rückwirkenden
    Erhebung und Einführung eines Antidumpingzolls auf die Einfuhren der Ware von
    einem Ausführer in diesem Land sowie zur Einstellung der zollamtlichen Erfassung
    dieser Einfuhren
  type: main
