  script: Latn
  content: Council Implementing Regulation (EU) No 1252/2009 of 18 December 2009 concluding
    the new exporter review of Regulation (EC) No 1338/2006 imposing a definitive
    anti-dumping duty on imports of chamois leather originating in the People's Republic
    of China, levying retroactively and imposing an anti-dumping duty with regard
    to imports from one exporter in this country and terminating the registration
    of these imports
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n o 1252/2009 du Conseil du 18 décembre 2009
    clôturant le réexamen au titre de nouvel exportateur du règlement (CE) n o
    1338/2006 instituant un droit antidumping définitif sur les importations de cuirs
    et de peaux chamoisés originaires de la République populaire de Chine, portant
    perception rétroactive et institution d'un droit antidumping en ce qui concerne
    les produits d'un exportateur de ce pays et mettant un terme à l'enregistrement
    de ces importations
  type: main
- language: de
