title:
- language: en
  script: Latn
  content: Regulation (EEC) No 474/75 of the Council of 27 February 1975 fixing the
    basic prices and buying-in prices for fruit and vegetables for the 1975/76 marketing
    year and derogating for this marketing year from Article 23 of Regulation (EEC)
    No 1035/72 as regards certain reference prices
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 474/75 du Conseil, du 27 février 1975, fixant les
    prix de base et les prix d'achat valables dans le secteur des fruits et légumes
    pour la campagne 1975/1976 et dérogeant, pour cette campagne, à l'article 23
    du règlement (CEE) n° 1035/72 en ce qui concerne certains prix de référence
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 474/75 des Rates vom 27. Februar 1975 zur Festsetzung
    der Grund- und Ankaufspreise für Obst und Gemüse für das Wirtschaftsjahr 1975/1976
    und zur Abweichung von Artikel 23 der Verordnung (EWG) Nr. 1035/72 für dieses
    Wirtschaftsjahr hinsichtlich bestimmter Referenzpreise
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 474/75 af 27. februar 1975 om fastsættelse
    af basis- og opkøbspriserne for frugt og grønsager for høståret 1975/1976
    og om afvigelse fra artikel 23 i forordning (EØF) nr. 1035/72 i samme høstår
    for så vidt angår visse referencepriser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 474/75 del Consiglio, del 27 febbraio 1975, che fissa
    i prezzi di base e i prezzi d'acquisto validi nel settore degli ortofrutticoli
    per la campagna 1975/1976 e che deroga, per questa campagna, all'articolo 23 del
    regolamento (CEE) n. 1035/72 per alcuni prezzi di riferimento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 474/75 van de Raad van 27 februari 1975 houdende
    vaststelling van de basisprijzen en de aankoopprijzen in de sector groenten en
    fruit voor het verkoopseizoen 1975/1976 en houdende afwijking voor bepaalde referentieprijzen
    voor dit verkoopseizoen van artikel 23 van Verordening (EEG) nr. 1035/72
  type: main
