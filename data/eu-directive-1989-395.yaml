    Etikettierung und Aufmachung von für den Endverbraucher bestimmten Lebensmitteln
    sowie die Werbung hierfür
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 89/395/EØF af 14. juni 1989 om ændring af direktiv 79/112/EØF
