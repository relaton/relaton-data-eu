  script: Latn
  content: Council Directive 89/395/EEC of 14 June 1989 amending Directive 79/112/EEC
    on the approximation of the laws of the Member States relating to labelling, presentation
    and advertising of foodstuffs for sale to the ultimate consumer
  type: main
- language: fr
  script: Latn
  content: Directive 89/395/CEE du Conseil du 14 juin 1989 portant modification de
    la directive 79/112/CEE relative au rapprochement des législations des États
    membres concernant l'étiquetage et la présentation des denrées alimentaires
    destinées au consommateur final ainsi que la publicité faite à leur égard
  type: main
- language: de
  script: Latn
