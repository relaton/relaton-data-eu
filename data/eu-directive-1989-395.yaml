    περί προσέγγισης των νομοθεσιών των κρατών
    μελών σχετικά με την επισήμανση και την παρουσίαση
    τροφίμων που προορίζονται για τον τελικό καταναλωτή
    καθώς επίσης και τη διαφήμισή τους
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 89/395/ETY, annettu 14 päivänä kesäkuuta 1989,
    kuluttajalle myytäväksi tarkoitettujen elintarvikkeiden merkintöjä, esillepanoa
    ja mainontaa koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun
    direktiivin 79/112/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 89/395/CEE del Consiglio del 14 giugno 1989 che modifica la direttiva
