    inzake etikettering en presentatie van levensmiddelen bestemd voor de eindverbruiker
    alsmede inzake de daarvoor gemaakte reclame
  type: main
- language: pt
  script: Latn
  content: Directiva 89/395/CEE do Conselho de 14 de Junho de 1989 que altera a Directiva
