  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 397/72 der Kommission vom 25. Februar 1972 zur Ergänzung
    der Verordnung (EWG) Nr. 279/72 über eine Dauerausschreibung zum Verkauf von
    Weißzucker, der zur Ausfuhr bestimmt ist und sich im Besitz der französischen
    Interventionsstelle befindet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 397/72 della Commissione, del 25 febbraio 1972, che
