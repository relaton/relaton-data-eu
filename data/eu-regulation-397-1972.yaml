    vendita di zucchero bianco destinato all'esportazione e detenuto dall'organismo
    d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 397/72 van de Commissie van 25 februari 1972 tot
    aanvulling van Verordening (EEG) nr. 279/72 betreffende een permanente openbare
    inschrijving voor de verkoop van witte suiker in het bezit van het Franse interventiebureau
    en bestemd voor uitvoer
