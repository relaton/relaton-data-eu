title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2024/73 of the Commission of 25 July 1973 fixing, for
    the 1973/74 marketing year, the variety of long-grained rice representative of
    Community production, the difference in value between this variety and the variety
    of round-grained rice corresponding to standard quality, the threshold price for
    long-grained husked rice and the threshold prices for milled rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2024/73 de la Commission, du 25 juillet 1973, fixant,
    pour la campagne 1973/1974, la variété de riz à grains longs représentative
    de la production communautaire, la différence de valeur entre celle-ci et la
    variété de riz à grains ronds correspondant à la qualité type, le prix de
    seuil du riz décortiqué à grains longs et les prix de seuil du riz blanchi
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2024/73 der Kommission vom 25. Juli 1973 zur Festsetzung
    der für die Gemeinschaftsproduktion repräsentativen langkörnigen Reissorte,
    des Wertunterschieds zwischen dieser Sorte und der der Standardqualität entsprechenden
    rundkörnigen Reissorte, des Schwellenpreises für geschälten langkörnigen Reis
    und der Schwellenpreise für vollständig geschliffenen Reis für das Wirtschaftsjahr
    1973/1974
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2024/73 af 25. juli 1973 om fastsættelse
    for høståret 1973/1974 af den langkornede rissort, der er repræsentativ for
    produktionen i Fællesskabet, af værdiforskellen mellem denne sort og den rundkornede
    rissort, der svarer til standardkvaliteten, af tærskelprisen for afskallet langkornet
    ris og tærskelprisen for sleben ris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2024/73 della Commissione, del 25 luglio 1973, che
    fissa, per la campagna 1973/1974, la varietà di riso a grani lunghi rappresentativa
    della produzione comunitaria, la differenza di valore tra quest'ultima e la varietà
    di riso a grani tondi corrispondente alla qualità tipo, il prezzo d'entrata del
    riso semigreggio a grani lunghi ed i prezzi d'entrata del riso lavorato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2024/73 van de Commissie van 25 juli 1973 tot vaststelling
    voor het verkoopseizon 1973/1974, van de variëteit langkorrelige rijst die representatief
    is voor de communautaire produktie, het waardeverschil tussen deze variëteit
    en de variëteit rondkorrelige rijst die met de standaardkwaliteit overeenkomt,
    de drempelprijs voor langkorrelige gedopte rijst en de drempelprijzen voor volwitte
    rijst
  type: main
