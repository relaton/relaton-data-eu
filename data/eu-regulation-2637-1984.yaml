  content: Commission Regulation (EEC) No 2637/84 of 18 September 1984 re-establishing
    the levying of customs duties on butan-1-ol (normal butyl alcohol), falling within
    subheading 29.04 A III ex b) and originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2637/84 de la Commission du 18 septembre 1984 portant
    rétablissement de la perception des droits de douane applicables au butane-1-ol
    (alcool butylique normal), de la sous-position 29.04 A III ex b) du tarif douanier
    commun, originaire de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
