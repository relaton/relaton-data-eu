type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2089/75 of the Commission of 8 August 1975 re-establishing
    the levying of customs duties on refracting telescopes (monocular and binocular),
    prismatic or not, falling within heading No 90.05, originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3053/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2089/75 de la Commission, du 8 août 1975, portant
    rétablissement de la perception des droits de douane applicables aux jumelles
    et longues-vues avec ou sans prismes, de la position tarifaire 90.05, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3053/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2089/75 der Kommission vom 8. August 1975 zur Wiedereinführung
    des Zollsatzes von Ferngläsern und Fernrohren, mit oder ohne Prismen, der Tarifnummer
    90.05, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3053/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2089/75 af 8. august 1975 om genindførelse
    af opkrævning af toldafgifter for kikkerter med eller uden prismer, under position
    90.05, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3053/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2089/75 della Commissione, dell'8 agosto 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai binocoli e cannocchiali
    con o senza prismi, della voce doganale n. 90.05 originari dei paesi in via di
    sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3053/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2089/75 van de Commissie van 8 augustus 1975 houdende
    wederinstelling van de heffing van de douanerechten voor binocles en verrekijkers,
    ook indien met prisma's, van post 90.05, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3053/74 van de Raad van 2 december
    1974 tariefpreferenties werden geopend
  type: main
