    (ΕΚ) αριθ. 2300/2001 περί καθορισμού των κοινοτικών
    τιμών στην παραγωγή και των κοινοτικών τιμών
    στην εισαγωγή για τα γαρίφαλα και τα τριαντάφυλλα,
    για την εφαρμογή του καθεστώτος κατά την εισαγωγή
