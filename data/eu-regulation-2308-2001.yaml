title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2308/2001 of 27 November 2001 correcting
    Regulation (EC) No 2300/2001 fixing Community producer and import prices for carnations
    and roses with a view to the application of the arrangements governing imports
    of certain floricultural products originating in Cyprus, Israel, Jordan, Morocco
    and the West Bank and Gaza Strip
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2308/2001 de la Commission du 27 novembre 2001 rectifiant
    le règlement (CE) n° 2300/2001 fixant les prix communautaires à la production
    et les prix communautaires à l'importation pour les œillets et les roses pour
    l'application du régime à l'importation de certains produits de la floriculture
    originaires de Chypre, d'Israël, de Jordanie et du Maroc ainsi que de Cisjordanie
    et de la bande de Gaza
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2308/2001 der Kommission vom 27. November 2001 zur
