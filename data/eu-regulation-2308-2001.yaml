  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2308/2001, annettu 27 päivänä marraskuuta
    2001, neilikoiden ja ruusujen yhteisön tuottaja- ja tuontihintojen vahvistamisesta
    tiettyjen Kyproksesta, Israelista, Jordaniasta, Marokosta sekä Länsirannalta
    ja Gazan alueelta peräisin olevien kukkaviljelytuotteiden tuontijärjestelmän
    soveltamiseksi annetun asetuksen (EY) N:o 2300/2001 oikaisemisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2308/2001 della Commissione, del 27 novembre 2001,
