    Erzeugerpreise und Einfuhrpreise für Nelken und Rosen zur Anwendung der Einfuhrregelung
    für bestimmte Waren des Blumenhandels aus Zypern, Israel, Jordanien, Marokko,
    dem Westjordanland und dem Gazastreifen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2308/2001 af 27. november 2001 om berigtigelse
