title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2689/76 of 4 November 1976 temporarily suspending
    the autonomous Common Customs Tariff duty on mushrooms, excluding cultivated mushrooms,
    dried, dehydrated or evaporated, whole or in identifiable pieces or slices, intended
    for the processing industry and falling within subheading ex 07.04 B
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2689/76 du Conseil, du 4 novembre 1976, portant suspension
    temporaire du droit autonome du tarif douanier commun pour les champignons, à
    l'exception des champignons de couche, déssechés, déshydratés ou évaporés,
    présentés entiers, en tranches ou en morceaux identifiables, destinés à l'industrie
    de transformation, de la sous-position EX 07.04B
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2689/76 des Rates vom 4. November 1976 zur zeitweiligen
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für Pilze, ausgenommen
    Zuchtpilze, getrocknet, ganz oder in erkennbaren Stücken oder Scheiben, für
    die Verarbeitungsindustrie, der Tarifstelle ex 07.04 B
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2689/76 af 4. november 1976 om midlertidig
    suspension af den autonome told i den fælles toldtarif for svampe, undtagen champignons,
    tørrede hele eller i identificerbare skiver eller stykker, henhørende under
    pos. ex 07.04 B, bestemt til forarbejdningsindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2689/76 del Consiglio, del 4 novembre 1976, recante
    sospensione temporanea del dazio autonomo della tariffa doganale comune per i
    funghi, ad esclusione dei funghi di coltivazione, disseccati, disidratati od evaporati,
    interi, a fette o in pezzi riconoscibili, destinati all'industria di trasformazione,
    della sottovoce doganale ex 07.04 B
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2689/76 van de Raad van 4 november 1976 houdende
    tijdelijke schorsing van het autonome recht van het gemeenschappelijk douanetarief
    voor paddestoelen, met uitzondering van gekweekte paddestoelen, gedroogd, gedehydreerd
    of geëvaporeerd, in gehele staat of in herkenbare stukken of schijven, bestemd
    voor de verwerkende industrie, van onderverdeling ex 07.04 B
  type: main
