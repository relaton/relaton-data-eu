title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3120/74 of the Commission of 11 December 1974 re-establishing
    the levying of customs duties on terry towelling and similar terry fabrics, of
    cotton, falling within heading No 55.08, originating in developing countries to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3503/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3120/74 de la Commission, du 11 décembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    coton bouclés du genre éponge, de la position tarifaire 55.08, originaires des
    pays en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3120/74 der Kommission vom 11. Dezember 1974 über
    die Wiedereinführung des Zollsatzes für Schlingengewebe (Frottiergewebe) aus
    Baumwolle, der Tarifnummer 55.08, mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3120/74 af 11. december 1974 om genindførelse
    af opkrævning af toldafgifter for håndklædefrotterstof og lignende frotterstof
    af bomuld, under position 55.08 som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3503/73
    af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3120/74 della Commissione, dell'11 dicembre 1974,
    che ripristina la riscossione dei dazi doganali applicabili ai tessuti di cotone
    ricci del tipo spugna, della voce doganale n. 55.08, originari dei paesi in via
    di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3120/74 van de Commissie van 11 december 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bad- en frotteerstof
    (lussendoek) van katoen, van tariefpost 55.08, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3503/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
