type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3739/89 of 13 December 1989 re-establishing
    the levying of customs duties on wadding of textile materials and articles thereof,
    textile fibres, not exceeding 5 mm in length (flock), textile dust and mill neps,
    products of category 94 (order No 40.0940), originating in Indonesia, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 4259/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3739/89 de la Commission du 13 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux ouates de
    matières textiles et articles en ces ouates; fibres textiles d'une largeur n'excédant
    pas 5 millimètres (tontisses); noeuds et noppes (boutons) de matières textiles,
    de la catégorie de produits n° 94 (numéro d'ordre 40.0940), originaires de
    l'Indonésie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3739/89 DER KOMMISSION vom 13. Dezember 1989 zur Wiedereinfuehrung
    des Zollsatzes fuer Watte und Waren daraus, aus Spinnstoffen; Spinnfasern mit
    einer Breite von 5 mm oder weniger (Scherstaub), Knoten und Noppen, aus Spinnstoffen,
    der Warenkategorie Nr. 94 (lfd. Nr. 40.0940) mit Ursprung in Indonesien, dem die
    in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpraeferenzen gewaehrt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3739/89 af 13. december 1989 om genindførelse
    af opkrævning af toldafgifter for vat af tekstilmateriale og varer deraf; tekstilfibre
    af bredde under 5 mm, flok, støv og nopper af tekstilmateriale, under varekategori
    nr. 94 (løbenummer 40.0940), som har oprindelse i Indonesien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3739/89 της Επιτροπής
    της 13ης Δεκεμβρίου 1989 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για βάτα
    από υφαντικές ύλες και είδη από βάτα από υφαντικές
    ίνες με πλάτος που δεν υπερβαίνει τα 5 mm ( χνούδι
    από επεξεργασία των υφασμάτων ), κόμποι και
    σφαιρίδια ( boutons ) από υφαντικές ύλες, προϊόντα
    της κατηγορίας 94 ( αύξων αριθμός 40.0940 ), καταγωγής
    Ινδονησίας, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 4259/88 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3739/89 DELLA COMMISSIONE del 13 dicembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili alle ovatte di materie
    tessili e manufatti di tali ovatte; fibre tessili di larghezza non superiore a
    5 mm (borre di cimatura), nodi e groppetti (bottoni) di materie tessili, della
    categoria di prodotti n. 94 (numero d'ordine 40.0940), beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 4259/88 del Consiglio
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3739/89 VAN DE COMMISSIE van 13 december 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op watten van
    textielstof en artikelen daarvan, textielvezels met een lengte van niet meer dan
    5 mm (scheerhaar), noppen van textielstof, textile dust en mill, van de categorie
    van produkten nr. 94 (volgnummer 40.0940), van oorsprong uit Indonesië, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 4259/88
    van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3739/89 DA COMISSÃO de 13 de Dezembro de 1989 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis às pastas (ouatès)
    de matérias têxteis e respectivas obras; fibras têxteis de uma largura que
    não exceda 5 mm (poeiras) (tontisses), nós e borbotos (boutons) de matérias
    têxteis, da categoria de produtos 94 (número de ordem 40.0940), originários
    da Indonésia, beneficiária das preferências pautais previstas no Regulamento
    (CEE) nº 4259/88 do Conselho #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3739/89 DE LA COMISION de 13 de diciembre de 1989 relativo
    al restablecimiento de la recaudacion de los derechos arancelarios aplicables
    a las guatas de materias textiles y articulos de guata; fibras textiles de una
    anchura de 5 mm como maximo (tundiznos), nudos y motas de materias textiles de
    la categoria de productos no 94 (numero de orden 40.0940) originarios de Indonesia
    beneficiaria de las preferencias arancelarias previstas por el Reglamento (CEE)
    no 4259/88 del Consejo
