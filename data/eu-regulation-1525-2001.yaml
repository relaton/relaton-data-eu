title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1525/2001 of 26 July 2001 amending Regulation
    (EC) No 1101/2001 fixing the reduction percentages to be applied to applications
    for an allocation by non-traditional operators under the tariff quotas for imports
    of bananas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1525/2001 de la Commission du 26 juillet 2001 modifiant
    le règlement (CE) n° 1101/2001 fixant les pourcentages de réduction à appliquer
    aux demandes d'allocation des opérateurs non traditionnels dans le cadre des
    contingents tarifaires à l'importation de bananes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1525/2001 der Kommission vom 26. Juli 2001 zur Änderung
    der Verordnung (EG) Nr. 1101/2001 zur Festsetzung der Verringerungskoeffizienten,
    die auf die Anträge der nicht traditionellen Marktbeteiligten im Rahmen der Zollkontingente
    für die Einfuhr von Bananen anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1525/2001 af 26. juli 2001 om ændring
    af forordning (EF) nr. 1101/2001 om fastsættelse af reduktionssatser til anvendelse
    på ansøgninger om tildelinger til ikke-traditionelle importører under importtoldkontingenter
    for bananer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1525/2001 της Επιτροπής,
    της 26ης Ιουλίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1101/2001 για τον καθορισμό
    των ποσοστών μείωσης που θα εφαρμοστούν στις
    αιτήσεις χορηγήσεως μεριδίων στους μη παραδοσιακούς
    εμπορευόμενους στο πλαίσιο των δασμολογικών
    ποσοστώσεων κατά την εισαγωγή μπανανών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1525/2001, annettu 26 päivänä heinäkuuta
    2001, ei-perinteisten tuottajien banaanien tuontitariffikiintiöiden mukaisia
    määriä koskeviin hakemuksiin sovellettavien vähennyskertoimien vahvistamisesta
    annetun asetuksen (EY) N:o 1101/2001 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1525/2001 della Commissione, del 26 luglio 2001, che
    modifica il regolamento (CE) n. 1101/2001 che fissa le percentuali di riduzione
    applicabili alle domande di assegnazione degli operatori non tradizionali nel
    quadro dei contingenti tariffari per l'importazione di banane
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1525/2001 van de Commissie van 26 juli 2001 houdende
    wĳziging van Verordening (EG) nr. 1101/2001 tot vaststelling van de verminderingspercentages
    die moeten worden toegepast op de toewĳzingsverzoeken van de niet-traditionele
    marktdeelnemers in het kader van de tariefcontingenten voor de invoer van bananen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1525/2001 da Comissão, de 26 de Julho de 2001, que
    altera o Regulamento (CE) n.° 1101/2001 que fixa as percentagens de redução
    a aplicar aos pedidos de atribuição dos operadores não tradicionais no âmbito
    dos contingentes pautais de importação de bananas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1525/2001 de la Comisión, de 26 de julio de 2001,
