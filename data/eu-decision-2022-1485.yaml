id: EUDecision20221485
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1485 of 7 September 2022 postponing
    the expiry date of the approval of IPBC for use in biocidal products of product-type
    8 in accordance with Regulation (EU) No 528/2012 of the European Parliament and
    of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1485 de la Commission du 7 septembre
    2022 reportant la date d’expiration de l’approbation de l’IPBC en vue de
    son utilisation dans les produits biocides relevant du type de produits 8, conformément
    au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1485 der Kommission vom 7. September
    2022 zur Verschiebung des Ablaufdatums der Genehmigung von IPBC zur Verwendung
    in Biozidprodukten der Produktart 8 gemäß der Verordnung (EU) Nr. 528/2012 des
    Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2022/1485 на Комисията
    от 7 септември 2022 година за отлагане на датата
    на изтичане на срока на одобрението на веществото
    йодопропинил бутилкарбамат (IPBC) за употреба
    в биоциди от продуктов тип 8 в съответствие
    с Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1485 ze dne 7. září 2022,
    kterým se odkládá datum skončení platnosti schválení IPBC pro použití
    v biocidních přípravcích typu 8 v souladu s nařízením Evropského parlamentu
    a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1485 af 7. september
    2022 om forlængelse af godkendelsen af IPBC til anvendelse i biocidholdige produkter
    af produkttype 8, jf. Europa-Parlamentets og Rådets forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/1485 της Επιτροπής
    της 7ης Σεπτεμβρίου 2022 για τη μετάθεση της ημερομηνίας
    λήξης της έγκρισης της ουσίας IPBC για χρήση
    σε βιοκτόνα του τύπου προϊόντων 8 σύμφωνα με
    τον κανονισμό (ΕΕ) αριθ. 528/2012 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/1485, 7. september 2022, millega lükatakse
    edasi tooteliiki 8 kuuluvates biotsiidides 3-jodo-2-propünüül-butüülkarbamaadi
    (IPBC) kasutamise heakskiidu aegumiskuupäeva vastavalt Euroopa Parlamendi ja
    nõukogu määrusele (EL) nr 528/2012
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/1485, annettu 7 päivänä
    syyskuuta 2022, IPBC:n käyttöä valmisteryhmään 8 kuuluvissa biosidivalmisteissa
    koskevan hyväksymisen voimassaolon päättymispäivän lykkäämisestä Euroopan
    parlamentin ja neuvoston asetuksen (EU) N:o 528/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/1485 ón gCoimisiún an 7 Meán Fómhair
    2022 lena gcuirtear ar atráth dáta éaga an fhormheasa maidir le IPBC lena úsáid
    i dtáirgí bithicídeacha de chineál táirge 8 i gcomhréir le Rialachán (AE)
    Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1485 оd 7. rujna 2022. o odgodi isteka
    odobrenja IPBC-a za uporabu u biocidnim proizvodima vrste 8 u skladu s Uredbom
    (EU) br. 528/2012 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1485 végrehajtási határozata (2022. szeptember
    7.) az IPBC 8. terméktípusba tartozó biocid termékekben történő felhasználására
    vonatkozó jóváhagyás érvényességi idejének az 528/2012/EU európai parlamenti
    és tanácsi rendelettel összhangban történő meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1485 della Commissione del 7 settembre
    2022 che posticipa la data di scadenza dell'approvazione dell'IPBC ai fini del
    suo uso nei biocidi del tipo di prodotto 8 in conformità al regolamento (UE)
    n. 528/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1485 (2022. gada 7. septembris),
    ar ko uz vēlāku laiku pārceļ datumu, līdz kuram lietošanai 8. produkta veida
    biocīdos saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) Nr. 528/2012
    ir apstiprināts IPBC
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1485 2022 m. rugsėjo 7 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 528/2012 nukeliama
    patvirtinimo, kad IPBC galima naudoti 8-o tipo biocidiniams produktams gaminti,
    galiojimo pabaigos data
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1485 tas-7
    ta’ Settembru 2022 li tipposponi d-data tal-iskadenza tal-approvazzjoni tal-IPBC
    għall-użu fil-prodotti bijoċidali tat-tip ta’ prodott 8 f’konformità mar-Regolament
    (UE) Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1485 van de Commissie van 7 september 2022
    tot verlenging van de termijn voor het verstrijken van de goedkeuring van IPBC
    voor gebruik in biociden van productsoort 8 overeenkomstig Verordening (EU) nr.
    528/2012 van het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1485 z dnia 7 września 2022 r. przedłużająca
    ważność zatwierdzenia IPBC do stosowania w produktach biobójczych należących
    do grupy produktowej 8 zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady
    (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1485 da Comissão de 7 de setembro de
    2022 que prorroga a validade da aprovação do IPBC para utilização em produtos
    biocidas do tipo 8 em conformidade com o Regulamento (UE) n.o 528/2012 do Parlamento
    Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1485 a Comisiei din 7 septembrie
    2022 de amânare a datei de expirare a aprobării substanței IPBC în vederea
    utilizării în produsele biocide din tipul de produs 8 în conformitate cu Regulamentul
    (UE) nr. 528/2012 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1485 zo 7. septembra 2022,
    ktorým sa v súlade s nariadením Európskeho parlamentu a Rady (EÚ) č. 528/2012
    odkladá dátum skončenia platnosti schválenia IPBC na použitie v biocídnych
    výrobkoch typu 8
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1485 z dne 7. septembra 2022 o odložitvi
    datuma izteka odobritve IPBC za uporabo v biocidnih proizvodih vrste proizvodov
    8 v skladu z Uredbo (EU) št. 528/2012 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1485 de la Comisión de 7 de septiembre
    de 2022 por la que se retrasa la fecha de expiración de la aprobación del IPBC
    para su uso en biocidas del tipo de producto 8, de conformidad con el Reglamento
    (UE) n.o 528/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1485 av den 7 september 2022
    om senareläggande av det datum då godkännandet av IPBC för användning i biocidprodukter
    i produkttyp 8 löper ut i enlighet med Europaparlamentets och rådets förordning
    (EU) nr 528/2012
