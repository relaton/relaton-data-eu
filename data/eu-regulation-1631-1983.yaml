title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1631/83 of 15 June 1983 imposing a provisional
    anti-dumping duty on imports of certain glass textile fibres (rovings) originating
    in Czechoslovakia, the German Democratic Republic and Japan, accepting a price
    undertaking from one Japanese exporter and terminating the proceeding in respect
    of imports of certain glass textile fibres (mats), originating in Czechoslovakia
    and the German Democratic Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1631/83 de la Commission du 15 juin 1983 instituant
    un droit anti-"dumping" provisoire sur les importations de certaines fibres de
    verre textiles (rovings) originaires de Tchécoslovaquie, de la République démocratique
    allemande et du Japon, portant acceptation d' un engagement de prix d' un exportateur
    japonais et portant clôture de la procédure pour les importations de certaines
    fibres de verre textiles (mats) originaires de Tchécoslovaquie et de la République
    démocratique allemande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1631/83 der Kommission vom 15. Juni 1983 zur Einführung
    eines vorläufigen Antidumpingzolls auf textile Glasfasern in Form von Glasseidensträngen
    (Rovings) mit Ursprung in der Tschechoslowakei, der Deutschen Demokratischen Republik
    und Japan, zur Annahme einer Preisverpflichtung eines japanischen Ausführers
    und zur Einstellung des Verfahrens betreffend die Einfuhren von bestimmten textilen
    Glasfasern in Form von Matten mit Ursprung in der Tschechoslowakei und der Deutschen
    Demokratischen Republik
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1631/83 af 15. juni 1983 om indførelse
    af en midlertidig antidumpingtold på importen af visse glasfibre (rovings) med
    oprindelse i Tjekkoslovakiet, Den tyske demokratiske Republik og Japan, om godtagelse
    af pristilsagn afgivet af én japansk eksportør og om afslutning af proceduren
    i forbindelse med importen af visse glasfibre (måtter) med oprindelse i Tjekkoslovakiet
    og Den tyske demokratiske Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1631/83 της Επιτροπής
    της 15ης Ιουνίου 1983 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    συνεχών υφαντικών ινών εξ υάλου (rovings), καταγωγής
    Τσεχοσλοβακίας, Λαϊκής Δημοκρατίας της Γερμανίας
    και Ιαπωνίας, για την αποδοχή ανάληψης υποχρεώσεων
    που αφορά τις τιμές από έναν ιάπωνα εξαγωγέα
    και για την περάτωση της διαδικασίας όσον αφορά
    τις εισαγωγές ορισμένων υφαντικών ινών εξ
    υάλου (mats), καταγωγής Τσεχοσλοβακίας και Λαϊκής
    Δημοκρατίας της Γερμανίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1631/83 della Commissione del 15 giugno 1983 che istituisce
    un dazio provvisorio antidumping sulle importazioni di alcuni filati e fibre di
    vetro accoppiati in parallelo senza torsione (rovings) originari della Cecoslovacchia,
    della Repubblica democratica tedesca e del Giappone, che accetta un impegno in
    materia di prezzo da parte di un esportatore giapponese e che conclude la procedura
    relativa alle importazioni di determinati feltri di fibre tessili di vetro (mats)
    originari della Cecoslovacchia e della Repubblica democratica tedesca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1631/83 van de Commissie van 15 juni 1983 tot instelling
    van een voorlopig anti-dumpingrecht op de invoer van bepaalde soorten glastextielvezel
    (rovings) van oorsprong uit Tsjechoslowakije, de Duitse Democratische Republiek
    en Japan, tot aanvaarding van een prijsverbintenis van één Japanse exporteur
    en tot beëindiging van de procedure ten aanzien van de invoer van bepaalde soorten
    glastextielvezel (matten) van oorsprong uit Tsjechoslowakije en de Duitse Democratische
    Republiek
