title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2697/79 of 29 November 1979 re-establishing
    the levying of customs duties on sacks and bags, falling within subheadings 62.03
    B I A), ex B), ex II and originating in Singapore, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2697/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux sacs et
    sachets d'emballage, des sous-positions 62.03 BI a), EX b), EX II du tarif douanier
    commun, originaires de Singapour, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2697/79 DER KOMMISSION VOM 29. NOVEMBER 1979 UEBER
    DIE WIEDEREINFUEHRUNG DES ZOLLSATZES FUER SAECKE UND BEUTEL ZU VERPACKUNGSZWECKEN
    DER TARIFSTELLEN 62.03 B I A), EX B) UND EX II MIT URSPRUNG IN SINGAPUR, DEM DIE
    IN DER VERORDNUNG ( EWG ) NR. 1195/79 DES RATES VORGESEHENEN ZOLLPRAEFERENZEN
    GEWAEHRT WERDEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2697/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for sække og poser til emballage under underposition
    62.03 B I a) ex b), ex II, som har oprindelse i Singapore og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2697/79 DELLA COMMISSIONE, DEL 29 NOVEMBRE 1979,
    CHE RIPRISTINA LA RISCOSSIONE DEI DAZI DOGANALI APPLICABILI AI SACCHI E SACCHETTI
    DA IMBALLAGGIO DELLE SOTTOVOCI DOGANALI 62.03 B I A ), EX B ), EX II, ORIGINARI
    DI SINGAPORE BENEFICIARIO DELLE PREFERENZE TARIFFARIE PREVISTE DAL REGOLAMENTO
    ( CEE ) N. 1195/79 DEL CONSIGLIO
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 2697/79 van de Commissie van 29 november 1979 houdende
