title:
- language: fr
  script: Latn
  content: Décision 66/116/CEE de la Commission, du 28 janvier 1966, relative au
    recours de la République italienne à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire certains produits originaires de pays tiers
    et transformés ou mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/116/EWG: Entscheidung der Kommission vom 28. Januar 1966 über die
    Inanspruchnahme von Artikel 115 Absatz (1) des Vertrages durch die Italienische
    Republik, um bestimmte aus dritten Ländern stammende und in den übrigen Mitgliedstaaten
    verarbeitete oder im freien Verkehr befindliche Waren von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/116/CEE: Decisione della Commissione, del 28 gennaio 1966, relativa
    al ricorso della Repubblica italiana all''articolo 115, primo comma, del Trattato
    per escludere dal trattamento comunitario alcuni prodotti originari dei paesi
    terzi e trasformati o immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/116/EEG: Beschikking van de Commissie van 28 januari 1966 betreffende
    het verzoek van de Italiaanse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten zijn verwerkt of in het vrije verkeer zijn gebracht, van
    de communautaire behandeling uit te sluiten'
  type: main
