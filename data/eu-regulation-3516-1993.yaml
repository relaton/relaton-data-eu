id: EURegulation35161993
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3516/93 of 20 December 1993 establishing
    the operative events for the conversion rates to be applied when calculating certain
    amounts provided for by the mechanisms of the common organization of the market
    in fishery and aquaculture products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3516/93 de la Commission, du 20 décembre 1993, établissant
    les faits générateurs des taux de conversion à appliquer pour le calcul de
    certains montants résultant des mécanismes de l'organisation commune des marchés
    des produits de la pêche et de l'aquaculture
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3516/93 der Kommission vom 20. Dezember 1993 zur Festlegung
    der maßgeblichen Tatbestände der Umrechnungskurse für die Berechnung bestimmter
    Beträge im Rahmen der Mechanismen der gemeinsamen Marktorganisation für Fischereierzeugnisse
    und Erzeugnisse der Aquakultur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3516/93 af 20. december 1993 om fastsættelse
    af de udløsende begivenheder for de omregningskurser, der anvendes ved beregning
    af visse beløb, der er en følge af mekanismerne i den fælles markedsordning
    for fiskerivarer og akvakulturprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3516/93 της Επιτροπής
    της 20ής Δεκεμβρίου 1993 για τον καθορισμό των
    γενεσιουργών αιτίων των ισοτιμιών που εφαρμόζονται
    στον υπολογισμό ορισμένων ποσών που προκύπτουν
    από τους μηχανισμούς της κοινής οργάνωσης
    της αγοράς των προϊόντων της αλιείας και της
    υδατοκαλλιέργειας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3516/93, annettu 20 päivänä joulukuuta 1993,
    kalastus- ja vesiviljelytuotteiden yhteisen markkinajärjestelyn mekanismeista
    johtuvien tiettyjen määrien laskemisessa sovellettavista maatalouden muunto-
    kurssin määräytymisperusteista
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3516/93 della Commissione, del 20 dicembre 1993, che
    stabilisce i fatti generatori per i tassi di conversione da applicare nel calcolo
    di determinati importi risultanti dai meccanismi dell'organizzazione comune dei
    mercati dei prodotti della pesca e dell'acquacoltura
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3516/93 van de Commissie van 20 december 1993 tot
    vaststelling van de ontstaansfeiten van de omrekeningskoersen die moeten worden
    toegepast voor de berekening van bepaalde bedragen die voortvloeien uit de mechanismen
    van de gemeenschappelijke marktordening voor visserijprodukten en produkten van
    de aquacultuur
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3516/93 da Comissão, de 20 de Dezembro de 1993, que
    fixa os factos geradores das taxas de conversão a utilizar para o cálculo de
    determinados montantes resultantes dos mecanismos da organização comum de mercado
    dos produtos da pesca e da aquicultura
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3516/93 de la Comisión, de 20 de diciembre de 1993,
    por el que se establecen los hechos generadores de los tipos de conversión aplicables
    al cálculo de determinados importes resultantes de los mecanismos de la organización
    común de mercados de los productos de la pesca y la acuicultura
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 3516/93 av den 20 december 1993 om fastställande
    av avgörande faktorer för de omräkningskurser som skall tillämpas vid beräkningen
    av vissa belopp som följer av mekanismerna i den gemensamma organisationen av
    marknaden för fiskeri- och vattenbruksprodukter
  type: main
