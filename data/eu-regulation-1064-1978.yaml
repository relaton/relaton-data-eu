title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1064/78 of 22 May 1978 re-establishing the
    levying of customs duties on terry towelling and similar terry fabrics of cotton,
    falling within heading No 55.08 and originating in developing countries, to which
    the preferential tariff arrangements set out in Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1064/78 de la Commission, du 22 mai 1978, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    coton bouclés du genre éponge, de la position tarifaire 55.08, originaires des
    pays et territoires en voie de développement, bénéficiaires de préférences
    tarifaires prévues par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1064/78 der Kommission vom 22. Mai 1978 zur Wiedereinführung
    des Zollsatzes für Schlingengewebe (Frottiergewebe) aus Baumwolle, der Tarifnummer
    55.08, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1064/78 af 22. maj 1978 om genindførelse
    af opkrævning af toldafgifter for håndklædefrotterstof og lignende frotterstof
    af bomuld, under position 55.08, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1064/78 della Commissione, del 22 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di cotone ricci
    del tipo spugna, della voce doganale 55.08, originari dei paesi in via di sviluppo,
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 2706/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1064/78 van de Commissie van 22 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op bad- of
    frotteerstof (lussendoek) van katoen, van post 55.08, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2706/77 van de Raad tariefpreferenties
    werden geopend
  type: main
