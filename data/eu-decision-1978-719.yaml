id: EUDecision1978719
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 1 August 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to unworked drawn or blown glass, falling within heading No
    ex 70.05 of the Common Customs Tariff, originating in Hungary and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/719/CEE: Décision de la Commission, du 1er août 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le verre étiré ou soufflé dit "verre
    à vitres", de la position Ex 70.05 du Tarif douanier commun, originaire de Hongrie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 1. August 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Ungarn stammendes und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliches gezogenes oder geblasenes Flachglas, sogenanntes "Tafelglas", der
    Tarifnummer ex 70.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 1. august 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage planglas, trukket eller blæst, som henhører under pos. ex 70.05 i
    den fælles toldtarif, har oprindelse i Ungarn og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 1 agosto 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario il vetro tirato o soffiato detto vetro per vetrate
    della voce ex 70.05 della tariffa doganale comune, originario dell'Ungheria e
    messo in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 1 augustus 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd getrokken of geblazen glas (zogenaamd vensterglas) van post ex 70.05
    van het gemeenschappelijk douanetarief, van oorsprong uit Hongarije en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
