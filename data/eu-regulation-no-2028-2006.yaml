title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2028/2006 of 18 December 2006 amending Regulation
    (EC) No 600/2005 as regards the authorisation of the feed additive preparation
    of Bacillus licheniformis DSM 5749 and Bacillus subtilis DSM 5750, belonging to
    the group of microorganisms
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 2028/2006 de la Commission du 18 décembre 2006 modifiant
    le règlement (CE) n o 600/2005 concernant l’autorisation en tant qu'additif
    dans l’alimentation animale de la préparation de Bacillus licheniformis DSM
    5749 et de Bacillus subtilis DSM 5750, appartenant au groupe des micro-organismes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2028/2006 der Kommission vom 18. Dezember 2006 zur
    Änderung der Verordnung (EG) Nr. 600/2005 hinsichtlich der Zulassung der zur
