type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1652/79 of 27 July 1979 re-establishing
    the levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, falling within heading No 60.02 and originating in
    Thailand, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1652/79 de la Commission, du 27 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    de bonneterie non élastique ni caoutchoutée, de la position 60.02 du tarif douanier
    commun, originaire de Thaïlande bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1652/79 der Kommission vom 27. Juli 1979 über die
    Wiedereinführung des Zollsatzes für Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, der Tarifnummer 60.02, mit Ursprung in Thailand, dem die in
    der Verordnung (EWG) Nr. 1195/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1652/79 af 27. juli 1979 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer af trikotage, ikke
    elastisk eller gummeret, henhørende under pos. 60.02 i den fælles toldtarif,
    som har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1652/79 della Commissione, del 27 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti a maglia non
    elastica né gommata, della voce 60.02 della tariffa doganale comune, originari
    della Tailandia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1652/79 van de Commissie van 27 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op handschoenen,
    wanten en dergelijke artikelen, van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk, van post 60.02, van oorsprong uit Thailand, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 1195/79 van de
    Raad
  type: main
