  script: Latn
  content: Commission Regulation (EC) No 2946/95 of 18 December 1995 amending Regulation
    (EEC) No 2814/90 laying down detailed rules for the definition of lambs fattened
    as heavy carcases and Regulation (EEC) No 2700/93 on detailed rules for the application
    of the premium in favour of sheepmeat and goatmeat producers
  type: main
- language: fr
  script: Latn
