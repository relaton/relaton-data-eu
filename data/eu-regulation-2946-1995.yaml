  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2946/95 della Commissione, del 18 dicembre 1995, che
    modifica il regolamento (CEE) n. 2814/90 recante modalità di applicazione della
    definizione degli agnelli ingrassati in carcasse pesanti e il regolamento (CEE)
    n. 2700/93 che stabilisce le modalità d'applicazione del premio ai produttori
    di carni ovine e caprine
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2946/95 van de Commissie van 18 december 1995 tot
