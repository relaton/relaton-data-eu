title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2026/196 of 28 January 2026 amending Regulation
    (EC) No 1333/2008 of the European Parliament and of the Council as regards the
    use of carrageenan (E 407), locust bean gum (E 410), guar gum (E 412), gum arabic
    (acacia gum) (E 414), xanthan gum (E 415), pectins (E 440) and starch sodium octenyl
    succinate (E 1450) and Commission Regulation (EU) No 231/2012 as regards specifications
    for locust bean gum (E 410), guar gum (E 412), gum arabic (acacia gum) (E 414),
    xanthan gum (E 415), pectins (E 440) and starch sodium octenyl succinate (E 1450)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2026/196 de la Commission du 28 janvier 2026 modifiant
    le règlement (CE) no 1333/2008 du Parlement européen et du Conseil en ce qui
    concerne l’utilisation des carraghénanes (E 407), de la farine de graines de
    caroube (E 410), de la gomme de guar (E 412), de la gomme arabique (ou gomme d’acacia)
    (E 414), de la gomme xanthane (E 415), des pectines (E 440) et de l’octényle
    succinate d’amidon sodique (E 1450), ainsi que le règlement (UE) no 231/2012
    de la Commission en ce qui concerne les spécifications de la farine de graines
    de caroube (E 410), de la gomme de guar (E 412), de la gomme arabique (ou gomme
    d’acacia) (E 414), de la gomme xanthane (E 415), des pectines (E 440) et de
    l’octényle succinate d’amidon sodique (E 1450)
  type: main
