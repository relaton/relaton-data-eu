title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 392/82 of 19 February 1982 re-establishing
    the levying of customs duties on urea containing more than 45 % by weight of nitrogen
    on the dry anhydrous product, falling within subheading 31.02 B and originating
    in Venezuela, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 392/82 de la Commission, du 19 février 1982, portant
    rétablissement de la perception des droits de douane applicables à l' urée
    d' une teneur en azote supérieure à 45 % en poids du produit anhydre à l' état
    sec, de la sous-position 31.02 B du tarif douanier commun, originaire du Venezuela,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 392/82 der Kommission vom 19. Februar 1982 zur Wiedereinführung
    der Erhebung der Zölle für Harnstoff mit einem Gehalt an Stickstoff von mehr
    als 45 Gewichtshundertteilen, bezogen auf das Gewicht des wasserfreien Stoffes,
    der Tarifstelle 31.02 B, mit Ursprung in Venezuela, dem die in der Verordnung
    (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 392/82 af 19. februar 1982 om genindførelse
    af opkrævning af told for urinstof med et nitrogenindhold på over 45 vægtprocent
    (beregnet på grundlag af tørsubstansen), henhørende under pos. 31.02 B og med
    oprindelse i Venezuela, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 392/82 τής Επιτροπής τής
    19ης Φεβρουαρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τήν ουρία, περιεκτικότητος
    εις άζωτον ανωτέρας τού 45 % κατά βάρος, ανύδρου
    προϊόντος εις ξηράν κατάστασιν τής διακρίσεως
    31. 02 Β τού Κοινού Δασμολογίου καταγωγής Βενεζουέλας
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 392/82 della Commissione, del 19 febbraio 1982, che
    ripristina la riscossione dei dazi doganali applicabili all' urea con tenore di
    azoto superiore a 45 %, in peso, del prodotto anidro allo stato secco, della sottovoce
    31.02 B della tariffa doganale comune, originaria del Venezuela beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 392/82 van de Commissie van 19 februari 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ureum met een
    gehalte aan stikstof van meer dan 45 gewichtspercenten, berekend op het watervrije
    droge produkt, van postonderverdeling 31.02 B, van oorsprong uit Venezuela, waarvoor
    de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
