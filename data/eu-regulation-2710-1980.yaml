title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2710/80 of 23 October 1980 re-establishing
    the levying of customs duties on filament lamps for lighting, falling within subheading
    85.20 A and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2710/80 de la Commission, du 23 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux lampes et
    tubes à incandescence pour l' éclairage, de la sous-position 85.20 A du tarif
    douanier commun, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2710/80 der Kommission vom 23. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für elektrische Glühlampen und Entladungslampen für elektrische
    Beleuchtung der Tarifstelle 85.20 A mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2710/80 af 23. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for glødelamper til belysning, under pos. 85.20
    A, som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2710/80 della Commissione, del 23 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle lampade e ai tubi
    a incandescenza per l' illuminazione, della sottovoce 85.20 A della tariffa doganale
    comune, originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2710/80 van de Commissie van 23 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor elektrische gloeilampen
    en -buizen, voor verlichtingsdoeleinden, van post 85.20 A, van oorsprong uit de
    ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van
    de Raad tariefpreferenties werden geopend
  type: main
