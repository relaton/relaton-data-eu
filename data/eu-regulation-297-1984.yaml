title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 297/84 of 3 February 1984 re-establishing
    the levying of customs duties on other goat and kid skin leather, falling within
    subheading 41.04 B II and originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 297/84 de la Commission du 3 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certaines
    peaux de caprins, de la sous-position 41.04 B II du tarif douanier commun, originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 297/84 der Kommission vom 3. Februar 1984 zur Wiedereinführung
    der Erhebung der Zölle für anderes Ziegen- und Zickelleder der Tarifstelle 41.04
    B II mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 297/84 af 3. februar 1984 om genindførelse
