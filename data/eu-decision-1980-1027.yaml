title:
- language: en
  script: Latn
  content: '80/1027/EEC: Commission Decision of 20 October 1980 on the reimbursement
    by the EAGGF, Guidance Section, to the French Republic of expenditure incurred
    during 1979 on annuities relating to measures to encourage the cessation of farming
    and the reallocation of utilized agricultural area for the purpose of structural
    improvement (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1027/CEE: Décision de la Commission, du 20 octobre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", à la République française des dépenses effectuées
    pendant l''année 1979 pour les indemnités relatives à l''encouragement à la
    cessation de l''activité agricole et à l''affectation de la superficie agricole
    utilisée à des fins d''amélioration des structures (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1027/EWG: Entscheidung der Kommission vom 20. Oktober 1980 über die
    Rückvergütung der während des Jahres 1979 getätigten Ausgaben zur Förderung
    der Einstellung der landwirtschaftlichen Erwerbstätigkeit und der Verwendung
    der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    durch den EAGFL, Abteilung Ausrichtung, an die Französische Republik (Nur der
    französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1027/EØF: Kommissionens beslutning af 20. oktober 1980 om refusion
    gennem EUGFL, udviklingssektionen, til Den franske Republik af de udgifter, som
    er afholdt i løbet af året 1979 til godtgørelser vedrørende støtte til ophør
    af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1027/CEE: Decisione della Commissione, del 20 ottobre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, alla Repubblica francese
    delle spese effettuate nel 1979 per le indennità concernenti l''incoraggiamento
    alla cessazione dell''attività agricola e alla destinazione della superficie
    agricola utilizzata a scopi di miglioramento delle strutture (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1027/EEG: Beschikking van de Commissie van 20 oktober 1980 betreffende
    de vergoeding door het EOGFL, afdeling Oriëntatie, van de in het jaar 1979 door
    de Franse Republiek gedane uitgaven voor uitkeringen ter bevordering van de bedrijfsbeëindiging
