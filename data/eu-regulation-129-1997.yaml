title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 129/97 of 24 January 1997 determining the
    extent to which applications lodged in January 1997 for import licences for certain
    pigmeat sector products under the regime provided for by Council Regulation (EC)
    No 774/94 opening and providing for the administration of certain Community tariff
    quotas for pigmeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 129/97 DE LA COMMISSION du 24 janvier 1997 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    janvier 1997 pour certains produits du secteur de la viande de porc peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande porcine et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 129/97 DER KOMMISSION vom 24. Januar 1997 über die
    Festsetzung des Umfangs, in dem die im Januar 1997 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse des Schweinefleischsektors entsprechend der Regelung
    der Verordnung (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher
    Zollkontingente für Schweinefleisch und bestimmte andere landwirtschaftliche
    Erzeugnisse genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 129/97 af 24. januar 1997 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i januar
    1997 om importlicenser for visse produkter inden for svinekødssektoren i forbindelse
    med Rådets forordning (EF) nr. 774/94 om åbning og forvaltning af en række
    EF-toldkontingenter for oksekød af høj kvalitet, svinekød, fjerkrækød, hvede
    og blandsæd af hvede og rug samt klid og andre restprodukter
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 129/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Ιανουαρίου 1997 για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιανουάριο 1997
    για άδειες εισαγωγής για ορισμένα προϊόντα
    του τομέα του χοιρείου κρέατος βάσει του καθεστώτος
