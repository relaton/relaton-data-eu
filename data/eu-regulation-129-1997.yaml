    άλλα γεωργικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 129/97, annettu 24 päivänä tammikuuta 1997,
    tammikuussa 1997 jätettyjen tiettyjä sianliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä tiettyjen sianlihaa ja tiettyjä muita maataloustuotteita
