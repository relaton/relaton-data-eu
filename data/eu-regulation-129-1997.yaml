    asetuksessa (EY) N:o 774/94 säädetyn järjestelmän mukaisesti
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 129/97 DELLA COMMISSIONE del 24 gennaio 1997 che stabilisce
