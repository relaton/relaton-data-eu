    varietà nel quadro del limite di garanzia per il raccolto 2002 nel settore del
    tabacco greggio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1193/2002 van de Commissie van 3 juli 2002 tot vaststelling,
