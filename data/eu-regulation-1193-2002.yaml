    που μπορούν να μεταφερθούν προς άλλη ομάδα
    ποικιλιών στο πλαίσιο του κατωφλίου εγγύησης
    για τη συγκομιδή του 2002 στον τομέα του ακατέργαστου
    καπνού
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1193/2002, annettu 3 päivänä heinäkuuta 2002,
