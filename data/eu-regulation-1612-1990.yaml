title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1612/90 of 15 June 1990 determining the
    extent to which applications lodged until 8 June 1990 for the issue of import
    licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1612/90 de la Commission, du 15 juin 1990, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées jusqu'au 8 juin 1990 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1612/90 der Kommission vom 15. Juni 1990 über den
    Umfang, in dem den bis zum 8. Juni 1990 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1612/90 af 15. juni 1990 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    indtil 8. juni 1990 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1612/90 της Επιτροπής
    της 15ης Ιουνίου 1990 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν έως τις 8 Ιουνίου 1990, για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1612/90 della Commissione, del 15 giugno 1990, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate fino all'8 giugno 1990 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1612/90 van de Commissie van 15 juni 1990 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de tot en met 8 juni
    1990 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1612/90 da Comissão, de 15 de Junho de 1990, que
    determina em que medida pode ser dado seguimento aos pedidos de concessão de
    certificados de importação entregues até 8 de Junho de 1990 para as carnes
    de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1612/90 de la Comisión, de 15 de junio de 1990, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación, presentadas hasta el 8 de junio de 1990 para las
    carnes de vacuno congeladas destinadas a la transformación
  type: main
