title:
- language: en
  script: Latn
  content: '2005/772/EC: Commission Decision of 3 November 2005 concerning the placing
    on the market, in accordance with Directive 2001/18/EC of the European Parliament
    and of the Council, of a maize product (Zea mays L., line 1507) genetically modified
    for resistance to certain lepidopteran pests and for tolerance to the herbicide
    glufosinate-ammonium (notified under document number C(2005) 4192)'
  type: main
- language: fr
