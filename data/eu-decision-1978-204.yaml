id: EUDecision1978204
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 January 1978 authorizing the Federal Republic
    of Germany not to apply Community treatment to special gloves for sports, of leather,
    falling within heading No ex 42.03 of the Common Customs Tariff, originating in
    the People's Republic of China and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/204/CEE: Décision de la Commission, du 25 janvier 1978, autorisant
    la République fédérale d''Allemagne à exclure du traitement communautaire
    les gants spéciaux de sport en cuir, de la position Ex 42.03 du Tarif douanier
    commun, originaires de la République populaire de Chine et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. Januar 1978, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der Volksrepublik China stammende und in den
    anderen Mitgliedstaaten im freien Verkehr befindliche Spezialsporthandschuhe aus
    Leder, der Tarifnummer ex 42.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 25. januar 1978 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage handsker til sportsbrug af
    læder, som henhører under pos. ex 42.03 i den fælles toldtarif, har oprindelse
    i Den kinesiske Folkerepublik og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 25 gennaio 1978, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario i guanti speciali
    per sport, di cuoio, della voce ex 42.03 della tariffa doganale comune, originari
    della Repubblica popolare cinese e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 januari 1978 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd sporthandschoenen van leder, van post ex 42.03 van
    het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek China
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
