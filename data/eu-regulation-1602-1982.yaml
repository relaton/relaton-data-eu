title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1602/82 of 22 June 1982 amending Regulation
    (EEC) No 1962/81 fixing the coefficients to be applied to the production aid for
    tomato concentrates and prunes and to the minimum price for dried plums (prunes
    d' Ente)i
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1602/82 de la Commission, du 22 juin 1982, modifiant
    le règlement (CEE) n° 1962/1981 fixant les coefficients à appliquer au montant
    de l' aide à la production pour les concentrés de tomates et les pruneaux et
    au prix minimal fixé pour les prunes d' Ente séchées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1602/82 der Kommission vom 22. Juni 1982 zur Änderung
    der Verordnung (EWG) Nr. 1962/81 zur Festsetzung der Koeffizienten, mit denen
    der für Tomatenmark und Trockenpflaumen festgesetzte Betrag der Produktionsbeihilfe
    und der für getrocknete Pflaumen (prunes d' Ente) festgesetzte Mindestpreis zu
    multiplizieren sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1602/82 af 22. juni 1982 om ændring
    af forordning (EØF) nr. 1962/81 om fastsættelse af de koefficienter, hvormed
    producentstøtten for tomatkoncentrater og svesker samt minimumsprisen for tørrede
    blommer "prunes d' Ente" skal multipliceres
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1602/82 τής Επιτροπής
    τής 22ας Ιουνίου 1982 περί τροποποιήσεως τού κανονισμού
    (EOK) αριθ. 1962/81 περί καθορισμού τών συντελεστών
    πού πρέπει νά εφαρμοσθούν στό ποσό τής ενισχύσεως
    στήν παραγωγή γιά τόν τοματοπολτό καί τά αποξηραμένα
    δαμάσκηνα καθώς καί στήν ελάχιστη τιμή πού
    καθορίζεται γιά τά αποξηραμένα δαμάσκηνα d'
    Ente
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1602/82 della Commissione, del 22 giugno 1982, che
    modifica il regolamento (CEE) n. 1962/81, che stabilisce i coefficienti da applicare
    all' aiuto alla produzione per i concentrati di pomodori e per le prugne secche
    ed al prezzo minimo fissato per le susine da innesto (prunes d' Ente)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1602/82 van de Commissie van 22 juni 1982 houdende
    wijziging van Verordening (EEG) nr. 1962/81 tot vaststelling van de coëfficiënten
    die moeten worden toegepast op het bedrag van de steun bij de produktie die voor
    tomatenconcentraat en pruimedanten en op de voor gedroogde geënte pruimen (Prunes
    d' Ente) vastgestelde minimumprijs
  type: main
