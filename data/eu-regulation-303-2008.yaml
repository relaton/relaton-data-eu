title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 303/2008 of 2 April 2008 establishing, pursuant
    to Regulation (EC) No 842/2006 of the European Parliament and of the Council,
    minimum requirements and the conditions for mutual recognition for the certification
    of companies and personnel as regards stationary refrigeration, air conditioning
    and heat pump equipment containing certain fluorinated greenhouse gases
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 303/2008 de la Commission du 2 avril 2008 établissant,
    conformément au règlement (CE) n° 842/2006 du Parlement européen et du Conseil,
    des prescriptions minimales ainsi que des conditions pour une reconnaissance mutuelle
    de la certification des entreprises et du personnel en ce qui concerne les équipements
    fixes de réfrigération, de climatisation et de pompe à chaleur contenant certains
    gaz à effet de serre fluorés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 303/2008 der Kommission vom 2. April 2008 zur Festlegung
    — gemäß der Verordnung (EG) Nr. 842/2006 des Europäischen Parlaments und
    des Rates — der Mindestanforderungen für die Zertifizierung von Unternehmen
    und Personal in Bezug auf bestimmte fluorierte Treibhausgase enthaltende ortsfeste
    Kälteanlagen, Klimaanlagen und Wärmepumpen sowie der Bedingungen für die gegenseitige
    Anerkennung der diesbezüglichen Zertifikate
  type: main
