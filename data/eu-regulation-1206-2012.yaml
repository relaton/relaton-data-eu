    от Aspergillus oryzae (DSM 10287), като фуражна добавка за
    домашни птици за угояване, отбити прасенца
    и свине за угояване и за изменение на регламенти
    (ЕО) № 1332/2004 и (ЕО) № 2036/2005 (притежател на разрешителното
    е DSM Nutritional Products)
  type: main
