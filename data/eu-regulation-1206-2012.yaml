    oryzae (DSM 10287) als Futtermittelzusatzstoff für Mastgeflügel, abgesetzte
    Ferkel und Mastschweine sowie zur Änderung der Verordnungen (EG) Nr. 1332/2004
    und (EG) Nr. 2036/2005 (Zulassungsinhaber DSM Nutritional Products)
