title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1206/2012 of 14 December 2012
    concerning the authorisation of a preparation of endo-1,4-beta-xylanase produced
    by Aspergillus oryzae (DSM 10287) as a feed additive for poultry for fattening,
    weaned piglets and pigs for fattening and amending Regulations (EC) No 1332/2004
    and (EC) No 2036/2005 (holder of the authorisation DSM Nutritional Products)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) n o 1206/2012 de la Commission du 14 décembre
    2012 concernant l’autorisation d’une préparation d’endo-1,4-bêta-xylanase
    produite par Aspergillus oryzae (DSM 10287) comme additif dans l’alimentation
    des volailles d’engraissement, des porcelets sevrés et des porcs d’engraissement
    et modifiant les règlements (CE) n o 1332/2004 et (CE) n o 2036/2005 (titulaire
    de l’autorisation: DSM Nutritional Products)'
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1206/2012 der Kommission vom 14. Dezember
