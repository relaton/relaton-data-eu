    do Conselho no respeitante à importação e exportação de produtos do sector
    das carnes de ovino e caprino e que altera o Regulamento (CE) n.° 1439/95
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 272/2001 al Comisiei din 9 februarie 2001 de modificare
