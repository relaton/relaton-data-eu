  script: Latn
  content: Reglamento (CE) n° 272/2001 de la Comisión, de 9 de febrero de 2001,
    por el que se modifica el Reglamento (CE) n° 2808/2000, que abre, para el año
    2001, los contingentes arancelarios comunitarios de ovejas y cabras y de carne
