  script: Latn
  content: Komisjoni määrus (EÜ) nr 272/2001, 9. veebruar 2001, millega muudetakse
    määrust (EÜ) nr 2808/2000 ühenduse tariifikvootide avamise kohta CN-koodide
    01041030, 01041080, 01042010, 01042090 ja 0204 alla kuuluvate lammaste, kitsede,
    lambaliha ja kitseliha suhtes 2001. aastal ja määruse (EÜ) nr 1439/95 (nõukogu
    määruse (EMÜ) nr 3013/89 üksikasjalike rakenduseeskirjade sätestamise kohta
    seoses lamba- ja kitselihasektori toodete impordi ja ekspordiga) sätetest erandi
    kehtestamise kohta ning muudetakse määrust (EÜ) nr 1439/95
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 272/2001, annettu 9 päivänä helmikuuta 2001,
    yhteisön tariffikiintiöiden avaamisesta CN-koodeihin 01041030, 01041080, 01042010,
    01042090 ja 0204 kuuluville lampaille ja vuohille sekä lampaan- ja vuohenlihalle
    vuodeksi 2001 sekä neuvoston asetuksen (ETY) N:o 3013/89 soveltamista koskevista
    yksityiskohtaisista säännöistä lampaan- ja vuohenliha-alan tuotteiden tuonnin
    ja viennin osalta annetusta asetuksesta (EY) N:o 1439/95 poikkeamisesta annetun
    asetuksen (EY) N:o 2808/2000 ja asetuksen (EY) N:o 1439/95 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 272/2001 od 9. veljače 2001. o izmjeni Uredbe
    (EZ) br. 2808/2000 o otvaranju carinskih kvota Zajednice za 2001. za ovce, koze,
    ovčje i kozje meso obuhvaćeno oznakom KN 01041030 , 01041080 , 01042010 , 01042090
    i 0204 te o odstupanju od Uredbe (EZ) br. 1439/95 o utvrđivanju detaljnih pravila
    za primjenu Uredbe Vijeća (EEZ) br. 3013/89 u pogledu uvoza i izvoza proizvoda
    u sektoru ovčjeg i kozjeg mesa i o izmjeni Uredbe (EZ) br. 1439/95
  type: main
- language: hu
  script: Latn
  content: A Bizottság 272/2001/EK rendelete (2001. február 9.) a 2001. évre a
    01041030, 01041080, 01042010, 01042090 és 0204 KN-kód alá tartozó élő juh
    és kecske, illetve juh- és kecskehús tekintetében közösségi vámkontingensek
    megnyitásáról, továbbá a juhhús- és kecskehúságazat termékeinek kivitele
    és behozatala tekintetében a 3013/89/EGK tanácsi rendelet alkalmazására vonatkozó
    részletes szabályok megállapításáról szóló 1439/95/EK rendelettől való
    eltérésről szóló 2808/2000/EK rendelet módosításáról, valamint az 1439/95/EK
    rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 272/2001 della Commissione, del 9 febbraio 2001, che
    modifica il regolamento (CE) n. 2808/2000 recante apertura, per il 2001, di contingenti
    tariffari comunitari di ovini, caprini, carni ovine e carni caprine dei codici
    NC 01041030, 01041080, 01042010, 01042090 e 0204, che prevede deroga al regolamento
    (CE) n. 1439/95, recante modalità di applicazione del regolamento (CEE) n. 3013/89
    del Consiglio in ordine all'importazione ed esportazione di prodotti del settore
    delle carni ovine e caprine e che modifica il regolamento (CE) n. 1439/95
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 272/2001 (2001. gada 9. februāris), ar ko groza
    Regulu (EK) Nr. 2808/2000, ar kuru atver Kopienas tarifu kvotas par 2001. gadu
    aitām, kazām, aitas gaļai, kazas gaļai ar KN kodiem 01041030, 01041080, 01042010,
    01042090 un 0204, un ar kuru atkāpjas no Regulas (EK) Nr. 1439/95, ar ko nosaka
    sīki izstrādātus noteikumus Padomes Regulas (EEK) Nr. 3013/89 piemērošanai
    attiecībā uz produktu importu un eksportu aitas gaļas un kazas gaļas nozarē,
    un ar ko groza Regulu (EK) Nr. 1439/95
  type: main
- language: lt
  script: Latn
  content: 2001 m. vasario 9 d. Komisijos reglamentas (EB) Nr. 272/2001, iš dalies
    keičiantis Reglamentą (EB) Nr. 2808/2000, atidarantį 2001 m. Bendrijos kvotas
    avims, ožkoms, avienai bei ožkienai, kurios klasifikuojamos pagal KN 01041030,
    01041080, 01042010, 01042090 ir 0204 kodus, ir nukrypstantis nuo Reglamento (EB)
    Nr. 1439/95, nustatančio išsamias Tarybos reglamento (EEB) Nr. 3013/89 taikymo
    taisykles, susijusias su avienos ir ožkienos sektoriaus produktų importu ir
    eksportu, ir iš dalies keičiantis Reglamentą (EB) Nr. 1439/95
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 272/2001 tad-9 ta' Frar 2001 li
    jemenda r-Regolament (KE) Nru 2808/2000 li jiftaħ il-kwoti tat-tariffi tal-Komunità
    għall-2001 għan-nagħaġ, mogħoż, laħam tan-nagħaġ u laħam tal-mogħoż
    li jaqgħu taħt il-kodiċi NM 01041030, 01041080, 01042010, 01042090 u 0204 u
    li jidderoga mir-Regolament (KE) Nru 1439/95 li jippreskrivi r-regoli dettaljati
    għall-applikazzjoni tar-Regolament tal-Kunsill (KEE) Nru 3013/89 fir-rigward
    l-importazzjoni u l-esportazzjoni tal-prodotti fis-settur tal-laħam tan-nagħaġ
    u l-laħam tal-mogħoż u li jemenda r-Regolament (KE) Nru 1439/95
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 272/2001 van de Commissie van 9 februari 2001 tot
    wĳziging van Verordening (EG) nr. 2808/2000 houdende opening, voor 2001, van
    communautaire tariefcontingenten voor schapen, geiten, schapenvlees en geitenvlees
    van de GN-codes 01041030, 01041080, 01042010, 01042090 en 0204 en houdende afwĳking
