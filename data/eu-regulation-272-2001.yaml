  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 272/2001 da Comissão, de 9 de Fevereiro de 2001,
    que altera o Regulamento (CE) n.° 2808/2000 que abre contingentes pautais comunitários,
    relativos a 2001, para ovinos e caprinos e as carnes de ovino e caprino dos códigos
    NC 01041030, 01041080, 01042010, 01042090 e 0204 e derroga o Regulamento (CE)
