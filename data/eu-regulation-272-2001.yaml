title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 272/2001 of 9 February 2001 amending Regulation
    (EC) No 2808/2000 opening Community tariff quotas for 2001 for sheep, goats, sheepmeat
    and goatmeat falling within CN codes 01041030, 01041080, 01042010, 01042090 and
    0204 and derogating from Regulation (EC) No 1439/95 laying down detailed rules
    for the application of Council Regulation (EEC) No 3013/89 as regards the import
    and export of products in the sheepmeat and goatmeat sector and amending Regulation
    (EC) No 1439/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 272/2001 de la Commission du 9 février 2001 modifiant
    le règlement (CE) n° 2808/2000 portant ouverture de contingents tarifaires communautaires
    au titre de l'année 2001 pour les animaux vivants des espèces ovine et caprine
    et pour la viande des animaux des espèces ovine et caprine relevant des codes
    NC 01041030, 01041080, 01042010, 01042090 et 0204, et portant dérogation au règlement
    (CE) n° 1439/95 établissant les modalités d'application du règlement (CEE)
    n° 3013/89 du Conseil en ce qui concerne l'importation et l'exportation de produits
    du secteur des viandes ovine et caprine et modifiant le règlement (CE) n° 1439/95
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 272/2001 der Kommission vom 9. Februar 2001 zur Änderung
    der Verordnung (EG) Nr. 2808/2000 zur Eröffnung von Gemeinschaftszollkontingenten
    für Schafe und Ziegen sowie Schaf- und Ziegenfleisch der KN-Codes 01041030, 01041080,
    01042010, 01042090 und 0204 für 2001 zur Abweichung von der Verordnung (EG) Nr.
    1439/95 zur Durchführung der Verordnung (EWG) Nr. 3013/89 des Rates hinsichtlich
    der Einfuhr und Ausfuhr von Schaf- und Ziegenfleischerzeugnissen und zur Änderung
    der Verordnung (EG) Nr. 1439/95
  type: main
