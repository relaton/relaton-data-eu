title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/2178 of 6 July 2021 supplementing
    Regulation (EU) 2020/852 of the European Parliament and of the Council by specifying
    the content and presentation of information to be disclosed by undertakings subject
    to Articles 19a or 29a of Directive 2013/34/EU concerning environmentally sustainable
    economic activities, and specifying the methodology to comply with that disclosure
    obligation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/2178 de la Commission du 6 juillet 2021
    complétant le règlement (UE) 2020/852 du Parlement européen et du Conseil par
    des précisions concernant le contenu et la présentation des informations que
    doivent publier les entreprises soumises à l’article 19 bis ou à l’article
    29 bis de la directive 2013/34/UE sur leurs activités économiques durables sur
    le plan environnemental, ainsi que la méthode à suivre pour se conformer à
    cette obligation d’information
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/2178 der Kommission vom 6. Juli 2021 zur
    Ergänzung der Verordnung (EU) 2020/852 des Europäischen Parlaments und des Rates
    durch Festlegung des Inhalts und der Darstellung der Informationen, die von Unternehmen,
    die unter Artikel 19a oder Artikel 29a der Richtlinie 2013/34/EU fallen, in Bezug
    auf ökologisch nachhaltige Wirtschaftstätigkeiten offenzulegen sind, und durch
    Festlegung der Methode, anhand deren die Einhaltung dieser Offenlegungspflicht
    zu gewährleisten ist
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/2178 на Комисията
