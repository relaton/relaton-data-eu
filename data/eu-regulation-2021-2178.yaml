    (ЕС) 2020/852 на Европейския парламент и на Съвета
    чрез определяне на съдържанието и представянето
    на информацията, която трябва да бъде оповестявана
    от предприятията, обхванати от член 19а или
    29а от Директива 2013/34/ЕС, по отношение на екологично
    устойчивите икономически дейности, и чрез
    определяне на методиката за изпълнение на
    това задължение за оповестяване
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/2178 ze dne 6. července
    2021, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2020/852
    upřesněním obsahu a struktury informací, které mají zveřejňovat podniky
    podle článků 19a nebo 29a směrnice 2013/34/EU v souvislosti s environmentálně
    udržitelnými hospodářskými činnostmi, a upřesněním metodiky za účelem
    plnění této povinnosti zveřejňování informací
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/2178 af 6. juli 2021 om supplerende
