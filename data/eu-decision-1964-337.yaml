title:
- language: fr
  script: Latn
  content: Décision 64/337/CEE de la Commission, du 19 mai 1964, prorogeant de nouveau
    et modifiant sa décision du 5 août 1963, portant octroi d'un contingent tarifaire
    à la République italienne pour l'alcool éthylique non dénaturé de 95 degrés
    et plus
  type: main
- language: de
  script: Latn
  content: '64/337/EWG: Entscheidung der Kommission vom 19. Mai 1964 über die erneute
    Verlängerung und Änderung ihrer Entscheidung vom 5. August 1963 über die Gewährung
    eines Zollkontingents für Äthylalkohol, unvergällt, von 95 und mehr an die
    Republik Italien'
  type: main
- language: it
  script: Latn
  content: '64/337/CEE: Decisione della Commissione, del 19 maggio 1964, che proroga
    nuovamente e modifica la propria decisione del 5 agosto 1963 relativa alla concessione
    di un contingente tariffario alla Repubblica italiana per l''alcole etilico non
    denaturato di 95 e più'
  type: main
- language: nl
  script: Latn
  content: '64/337/EEG: Beschikking van de Commissie van 19 mei 1964 tot hernieuwde
    verlenging en tot wijziging van haar beschikking van 5 augustus 1963 houdende
    toekenning van een tariefcontingent aan de Italiaanse Republiek voor ethylalcohol,
    niet gedenatureerd, met een sterkte van 95 graden of meer'
  type: main
