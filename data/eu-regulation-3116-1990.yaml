    Customs Tariff and (EEC) No 2915/79 determining the groups of products and the
    special provisions for calculating levies on milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3116/90 du Conseil, du 15 octobre 1990, modifiant
    le règlement (CEE) n° 2658/87 relatif à la nomenclature tarifaire et statistique
    et au tarif douanier commun, ainsi que le règlement (CEE) n° 2915/79 déterminant
