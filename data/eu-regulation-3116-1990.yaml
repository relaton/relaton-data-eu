    dei prelievi nel settore del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3116/90 van de Raad van 15 oktober 1990 tot wijziging
    van Verordening (EEG) nr. 2658/87 met betrekking tot de tarief- en statistieknomenclatuur
    en het gemeenschappelijk douanetarief en van Verordening (EEG) nr. 2915/79 houdende
