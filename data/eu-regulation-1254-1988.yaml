  content: Commission Regulation (EEC) No 1254/88 of 6 May 1988 re-establishing the
    levying of customs duties on shirts, T-shirts and the like, knitted or crocheted,
    products of category No 4 (order No 40.0040), originating in Indonesia to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3783/87
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1254/88 de la Commission du 6 mai 1988 portant rétablissement
    de la perception des droits de douane applicables aux chemis, T-shirts et articles
    similaires, en bonneterie, de la catégorie de produits n° 4 (numéro d' ordre
    40.0040), originaires d' Indonésie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
