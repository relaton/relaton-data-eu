    на предприятията, включително малките и средните
    предприятия, областта на растенията, животните,
    храните и фуражите, и европейската статистика
    (програма „Единен пазар“), и за отмяна на регламенти
    (ЕС) № 99/2013, (ЕС) № 1287/2013, (ЕС) № 254/2014 и (ЕС) № 652/2014
  type: main
