  script: Latn
  content: Regulation (EU) 2021/690 of the European Parliament and of the Council
    of 28 April 2021 establishing a programme for the internal market, competitiveness
    of enterprises, including small and medium-sized enterprises, the area of plants,
    animals, food and feed, and European statistics (Single Market Programme) and
    repealing Regulations (EU) No 99/2013, (EU) No 1287/2013, (EU) No 254/2014 and
    (EU) No 652/2014
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2021/690 du Parlement européen et du Conseil du 28 avril
    2021 établissant un programme en faveur du marché intérieur, de la compétitivité
    des entreprises, dont les petites et moyennes entreprises, du secteur des végétaux,
    des animaux, des denrées alimentaires et des aliments pour animaux et des statistiques
    européennes (programme pour le marché unique), et abrogeant les règlements
    (UE) no 99/2013, (UE) no 1287/2013, (UE) no 254/2014 et (UE) no 652/2014
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2021/690 des Europäischen Parlaments und des Rates vom
    28. April 2021 zur Aufstellung eines Programms für den Binnenmarkt, die Wettbewerbsfähigkeit
    von Unternehmen, einschließlich kleiner und mittlerer Unternehmen, den Bereich
    Pflanzen, Tiere, Lebensmittel und Futtermittel sowie europäische Statistiken
    (Binnenmarktprogramm) und zur Aufhebung der Verordnungen (EU) Nr. 99/2013, (EU)
    Nr. 1287/2013, (EU) Nr. 254/2014 und (EU) Nr. 652/2014
  type: main
