title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/699 of 9 April 2025 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize DP910521 pursuant to Regulation (EC) No 1829/2003 of
    the European Parliament and of the Council (notified under document C(2025) 2114)
  type: main
- language: fr
  script: Latn
