title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1655/70 de la Commission, du 13 août 1970, complétant
    le règlement (CEE) n° 772/70 concernant une adjudication permanente pour la
    vente de sucre blanc destiné à l'exportation et détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1655/70 der Kommission vom 13. August 1970 zur Ergänzung
    der Verordnung (EWG) Nr. 772/70 über eine Dauerausschreibung zum Verkauf von
    Weißzucker, der zur Ausfuhr bestimmt ist und sich im Besitz der französischen
    Interventionsstelle befindet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1655/70 della Commissione, del 13 agosto 1970, che
    completa il regolamento (CEE) n. 772/70 relativo ad una gara permanente per la
    vendita di zucchero bianco destinato all'esportazione e detenuto dall'organismo
    d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1655/70 van de Commissie van 13 augustus 1970 tot
    aanvulling van Verordening (EEG) nr. 772/70 betreffende een permanente openbare
    inschrijving voor de verkoop van witte suiker bestemd voor de uitvoer en in het
    bezit van het Franse interventiebureau
  type: main
