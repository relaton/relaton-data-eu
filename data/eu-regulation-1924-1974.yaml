title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1924/74 of the Commission of 23 July 1974 adjusting
    the compensatory amounts and variable components applicable during the third quarter
    of 1974 on the importation of goods covered by Regulation (EEC) No 1059/69 and
    containing cereals or rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1924/74 de la Commission, du 23 juillet 1974, portant
    rectification des montants compensatoires et des éléments mobiles applicables
    pendant le troisième trimestre de l'année 1974, à l'importation de marchandises
    relevant du règlement (CEE) n 1059/69, contenant des céréales ou du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1924/74 der Kommission vom 23. Juli 1974 zur Berichtigung
    der Ausgleichsbeträge und beweglichen Teilbeträge für das dritte Vierteljahr
    1974 bei der Einfuhr von Waren, die Getreide oder Reis enthalten und unter die
    Verordnung (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1924/74 af 23. juli 1974 om berigtigelse
    af de udligningsbeløb og variable elementer, som i tredje kvartal af 1974 skal
    anvendes ved indførsel af varer, henhørende under forordning (EØF) nr. 1059/69
    og indeholdende korn og ris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1924/74 della Commissione, del 23 luglio 1974, che
    rettifica gli importi compensativi e gli elementi mobili applicabili durante il
    terzo trimestre dell'anno 1974, all'importazione delle merci cui si applica il
    regolamento (CEE) n. 1059/69, contenenti cereali o riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1924/74 van de Commissie van 23 juli 1974 houdende
    verbetering van de variabele elementen en compenserende bedragen, toepasselijk
    gedurende het derde kwartaal van 1974 bij invoer van onder Verordening (EEG) nr.
    1059/69 vallende goederen welke graan of rijst bevatten
  type: main
