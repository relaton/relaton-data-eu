  script: Latn
  content: '95/257/EC: Commission Decision of 23 June 1995 approving the single programming
    document for Community structural measures for improving the processing and marketing
    conditions for agricultural products in Saarland (Federal Republic of Germany),
    in respect of Objective 5a, covering the period between 1994 and 1999 (Only the
    German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/257/CE: Décision de la Commission, du 23 juin 1995, portant approbation
