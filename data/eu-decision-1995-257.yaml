    relatives à l''amélioration des conditions de transformation et de commercialisation
    des produits agricoles en Sarre (République fédérale d''Allemagne), au titre
    de l''objectif n° 5 a), couvrant la période entre 1994 et 1999 (Le texte en
    langue allemande est le seul faisant foi.)'
  type: main
