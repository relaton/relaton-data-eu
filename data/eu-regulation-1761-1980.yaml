title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1761/80 of 4 July 1980 re-establishing the
    levying of customs duties on articles of jewellery and parts thereof, of precious
    metal, falling within subheading 71.12 A and originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1761/80 de la Commission, du 4 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux articles
    de bijouterie et de joaillerie et leurs parties, en métaux précieux, de la sous-position
    71.12 A du tarif douanier commun, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1761/80 der Kommission vom 4. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Schmuckwaren und Teile davon, aus Edelmetallen, der Tarifstelle
    71.12 A, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1761/80 af 4. juli 1980 om genindførelse
    af opkrævning af toldafgifter for bijouteriva2058rer og dele deraf, af ædle
    metaller, under pos. 71.12 A, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1761/80 della Commissione, del 4 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle minuterie e oggetti
    di gioielleria e loro parti, di metalli preziosi, della sottovoce doganale 71.12
    A, originari dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1761/80 van de Commissie van 4 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor bijouterieën en juwelen,
    alsmede delen daarvan, van edele metalen, van post 71.12 A, van oorsprong uit
    de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van
    de Raad tariefpreferenties werden geopend
  type: main
