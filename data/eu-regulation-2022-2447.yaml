    przez określenie liczby i nazwy zmiennych przekazywanych co osiem lat w dziedzinie
    „zasoby pracy” dotyczących tematów „osoby młode na rynku pracy”, „poziom
    wykształcenia – informacje szczegółowe, z uwzględnieniem przypadków przerwania
    lub porzucenia nauki” oraz „praca a obowiązki rodzinne”
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2447 da Comissão de 30 de setembro de 2022
    que complementa o Regulamento (UE) 2019/1700 do Parlamento Europeu e do Conselho,
    especificando o número e a designação das variáveis com periodicidade de oito
    em oito anos no domínio população ativa referentes aos «jovens no mercado
    de trabalho», ao «nível de escolaridade completo — detalhes, incluindo interrupção
    ou abandono da educação» e à «conciliação da vida profissional com a vida
    familiar»
  type: main
