    a munkaerő tárgykörben „a munkaerőpiacon jelen lévő fiatalok”, az „iskolázottság
    – részletek, beleértve a félbeszakított vagy abbahagyott képzéseket is”
    és „a munka és a családi élet összeegyeztethetősége” tekintetében
    a nyolcéves változók számának és megnevezésének meghatározása révén
    történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/2447 della Commissione del 30 settembre
    2022 che integra il regolamento (UE) 2019/1700 del Parlamento europeo e del Consiglio
    specificando il numero e il titolo delle variabili a cadenza di otto anni del
    dominio delle forze di lavoro su «giovani nel mercato del lavoro», «livello
    di istruzione conseguito – dettagli, compresi l’interruzione e l’abbandono
    dell’istruzione» e «conciliazione tra vita familiare e professionale»
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/2447 (2022. gada 30. septembris),
