    darbaspēka jomas detalizēto tematu “jaunieši darba tirgū”, “izglītības
    līmenis – sīka informācija, tostarp pārtraukta vai izbeigta izglītība”
    un “darba un ģimenes dzīves saskaņošana” astoņu gadu mainīgo lielumu
    skaitu un nosaukumu
  type: main
- language: lt
  script: Latn
