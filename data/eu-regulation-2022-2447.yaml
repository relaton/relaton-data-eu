    de completare a Regulamentului (UE) 2019/1700 al Parlamentului European și al
    Consiliului prin precizarea numărului și a titlului variabilelor colectate o
    dată la opt ani în domeniul forței de muncă pentru „tineri pe piața muncii”,
    „nivel de instruire – detalii, inclusiv educație întreruptă sau abandonată”
    și „concilierea vieții profesionale cu cea familială”
  type: main
- language: sk
  script: Latn
