    osmogodišnjih varijabli u području radne snage za teme „mladi na tržištu
    rada”, „obrazovno postignuće – pojedinosti, uključujući prekid ili napuštanje
    obrazovanja” i „usklađivanje poslovnog i obiteljskog života”
  type: main
- language: hu
  script: Latn
