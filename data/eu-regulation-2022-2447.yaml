title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2447 of 30 September 2022 supplementing
    Regulation (EU) 2019/1700 of the European Parliament and of the Council by specifying
    the number and the title of the eight-yearly variables in the labour force domain
    on ‘young people on the labour market’, ‘educational attainment – details,
    including education interrupted or abandoned’ and ‘reconciliation of work
    and family life’
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2447 de la Commission du 30 septembre 2022
    complétant le règlement (UE) 2019/1700 du Parlement européen et du Conseil
    en précisant le nombre et l’intitulé des variables octennales dans le domaine
    de la main-d’œuvre concernant les jeunes sur le marché du travail, le niveau
    d’éducation — détails, y compris interruption ou abandon de l’éducation
    —, et la conciliation de la vie professionnelle et de la vie familiale
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/2447 der Kommission vom 30. September 2022
    zur Ergänzung der Verordnung (EU) 2019/1700 des Europäischen Parlaments und
    des Rates durch die Festlegung der Anzahl und der Titel der achtjährlichen Variablen
    im Bereich Arbeitskräfte zu „Junge Menschen auf dem Arbeitsmarkt“, „Bildungsstand
    — Einzelangaben, einschließlich unter- oder abgebrochener Ausbildung“ und
    „Vereinbarkeit von Beruf und Familie“
  type: main
- language: bg
  script: Cyrl
