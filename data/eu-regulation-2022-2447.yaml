    2022 om komplettering av Europaparlamentets och rådets förordning (EU) 2019/1700
    vad gäller antal och beteckningar för variabler vart åttonde år inom området
    arbetskraft om ”Unga på arbetsmarknaden”, ”Uppnådd utbildningsnivå –
    närmare uppgifter, bland annat om avbruten eller ej slutförd utbildning” och
    ”Möjlighet att förena arbete och familjeliv”
