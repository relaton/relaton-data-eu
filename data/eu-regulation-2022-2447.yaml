    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2019/1700 špecifikovaním
    počtu a názvu premenných zbieraných každých osem rokov v doméne „pracovná
    sila“ týkajúcich sa čiastkových tém „mladí ľudia na trhu práce“,
    „dosiahnuté vzdelanie – podrobnosti vrátane prerušeného alebo predčasne
    ukončeného vzdelávania“ a „zosúladenie práce a rodinného života“
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2447 z dne 30. septembra 2022 o dopolnitvi
    Uredbe (EU) 2019/1700 Evropskega parlamenta in Sveta z določitvijo števila in
    naziva osemletnih spremenljivk na področju delovne sile za podrobne vsebine „mladi
    na trgu dela“, „izobrazba – podrobnosti, vključno s tem, ali je bilo izobraževanje
    prekinjeno ali opuščeno“ ter „uskladitev poklicnega in družinskega življenja“
  type: main
- language: es
  script: Latn
  content: 'Reglamento Delegado (UE) 2022/2447 de la Comisión de 30 de septiembre
    de 2022 por el que se completa el Reglamento (UE) 2019/1700 del Parlamento Europeo
    y del Consejo y se especifica el número y el título de las variables que se
    deben recoger cada ocho años en el ámbito de la población activa sobre «los
    jóvenes en el mercado laboral», «estudios terminados: detalles, incluidos la
    interrupción o abandono de los estudios» y «conciliación de la vida laboral
    con la vida familiar»'
  type: main
