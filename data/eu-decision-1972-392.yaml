  content: Décision de la Commission, du 8 novembre 1972, autorisant le Royaume des
    Pays-Bas à admettre, jusqu'au 31 janvier 1973 inclus, la commercialisation de
    semences de deux variétés de blé d'hiver, soumises à des exigences réduites
  type: main
- language: de
  script: Latn
  content: '72/392/EWG: Entscheidung der Kommission vom 8. November 1972 zur Ermächtigung
    des Königreichs der Niederlande, bis zum 31. Januar 1973 einschließlich Saatgut
    von zwei Sorten von Winterweizen mit minderen Anforderungen zum Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '72/392/CEE: Decisione della Commissione, dell''8 novembre 1972, che autorizza
    il Regno dei Paesi Bassi ad ammettere fino al 31 gennaio 1973 incluso, la commercializzazione
    di sementi di due varietà di grano invernale, soggette a requisiti ridotti'
  type: main
- language: nl
  script: Latn
  content: '72/392/EEG: Beschikking van de Commissie van 8 november 1972 tot machtiging
    van het Koninkrijk der Nederlanden om tot en met 31 januari 1973 zaaizaad van
    twee rassen van wintertarwe, waarvan minder strenge eisen zijn gesteld, tot de
    handel toe te laten'
