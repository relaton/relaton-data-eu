title:
- language: en
  script: Latn
  content: '95/565/EC: Council Decision of 30 November 1995 on the conclusion of the
    Agreement in the form of an exchange of letters concerning the provisional application
    of the Protocol establishing the fishing possibilities and the financial compensation
    provided for in the Agreement between the European Economic Community and the
    Government of the Republic of Guinea-Bissau on fishing off the coast of Guinea-Bissau
    for the period 16 June 1995 to 15 June 1997'
  type: main
- language: fr
  script: Latn
  content: '95/565/CE: Décision du Conseil, du 30 novembre 1995, concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la contrepartie financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Guinée-Bissau concernant la pêche au large de la côte
    de Guinée-Bissau, pour la période du 16 juin 1995 au 15 juin 1997'
  type: main
