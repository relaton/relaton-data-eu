title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2444/78 of 19 October 1978 authorizing the
    Federal Republic of Germany, the French Republic, the Grand Duchy of Luxembourg
    and the United Kingdom to permit under certain conditions an additional increase
    in the alcoholic strength of certain wines and certain products intended for wine-making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2444/78 de la Commission, du 19 octobre 1978, autorisant
    la République fédérale d'Allemagne, la République française, le Grand-Duché
    de Luxembourg et le Royaume-Uni à permettre, sous certaines conditions, une augmentation
    supplémentaire du titre alcoométrique de certains vins et de certains produits
    destinés à l'élaboration des vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2444/78 der Kommission vom 19. Oktober 1978 zur Ermächtigung
    der Bundesrepublik Deutschland, der Franzósischen Republik, des Großherzogtums
    Luxemburg und des Vereinigten Kónigreichs, unter bestimmten Bedingungen eine
    zusátzliche Erhóhung des Alkoholgehalts bestimmter Weine und bestimmter zur
    Herstellung von Wein vorgesehener Erzeugnisse zu gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2444/78 af 19. oktober 1978 om bemyndigelse
    af Forbundsrepublikken Tyskland, Den franske Republik, storhertugdømmet Luxembourg
    og Det forenede Kongerige til under visse omstændigheder at tillade en yderligere
    forhøjelse af alkoholindholdet i visse vine og visse produkter, der er bestemt
    til vinfremstilling
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2444/78 della Commissione, del 19 ottobre 1978, che
    autorizza la Repubblica federale di Germania, la Repubblica francese, il Granducato
    del Lussemburgo e il Regno Unito a permettere in determinate condizioni un aumento
    supplementare della gradazione alcolometrica di taluni vini e di taluni prodotti
    destinati all' elaborazione dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2444/78 van de Commissie van 19 oktober 1978 waarbij
    de Bondsrepubliek Duitsland, de Franse Republiek, het Groothertogdom Luxemburg
    en het Verenigd Koninkrijk gemachtigd worden om op bepaalde voorwaarden een extra
    verhoging van het alcoholgehalte van bepaalde wijnen en van bepaalde voor de bereiding
    van wijn bestemde produkten toe te staan
  type: main
