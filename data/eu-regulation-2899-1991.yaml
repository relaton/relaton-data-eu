  content: Council Regulation (EEC) No 2899/91 of 1 October 1991 amending Regulation
    (EEC) No 3905/88 and repealing the definitive anti-dumping duty imposed on imports
    into the Community of polyester yarn originating in Mexico
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2899/91 DU CONSEIL du 1er octobre 1991 modifiant le
    règlement (CEE) no 3905/88 et abrogeant le droit antidumping définitif institué
    sur les importations dans la Communauté de fils de polyester originaires du Mexique
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2899/91 DES RATES vom 1. Oktober 1991 zur Änderung
    der Verordnung (EWG) Nr. 3905/88 und zur Aufhebung des endgültigen Antidumpingzolls
    auf die Einfuhren von Polyestergarn mit Ursprung in Mexiko in die Gemeinschaft
    #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2899/91 af 1. oktober 1991 om ændring af
    forordning (EØF) nr. 3905/88 og om ophævelse af den endelige antidumpingtold
    på importen til Fællesskabet af garn af polyester med oprindelse i Mexico
  type: main
- language: el
  script: Grek
