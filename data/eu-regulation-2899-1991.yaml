    sulle importazioni nella Comunità di filati di poliesteri originari del Messico
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2899/91 VAN DE RAAD van 1 oktober 1991 tot wijziging
