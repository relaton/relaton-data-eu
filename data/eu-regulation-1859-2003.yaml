title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1859/2003 of 22 October 2003 setting export
    refunds in the processed fruit and vegetable sector other than those granted on
    added sugar (provisionally preserved cherries, peeled tomatoes, sugar-preserved
    cherries, prepared hazelnuts, certain orange juices)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1859/2003 de la Commission du 22 octobre 2003 fixant
    les restitutions à l'exportation dans le secteur des produits transformés à
    base de fruits et légumes, autres que celles octroyées au titre des sucres d'addition
    (cerises conservées provisoirement, tomates pelées, cerises confites, noisettes
    préparées, certains jus d'orange)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1859/2003 der Kommission vom 22. Oktober 2003 zur Festsetzung
    der Ausfuhrerstattungen für Verarbeitungserzeugnisse aus Obst und Gemüse mit
    Ausnahme der für die Verarbeitungserzeugnisse mit Zusatz von Zucker gewährten
    Ausfuhrerstattungen (vorläufig haltbar gemachte Kirschen, geschälte Tomaten/Paradeiser,
    haltbar gemachte Kirschen, zubereitete Haselnüsse, gewisse Orangensäfte)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1859/2003 af 22. oktober 2003 om fastsættelse
    af eksportrestitutioner for forarbejdede frugter og grøntsager undtagen for tilsat
    sukker (foreløbigt konserverede kirsebær, flåede tomater, syltede kirsebær,
    tilberedte hasselnødder og visse former for appelsinsaft)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1859/2003 της Επιτροπής,
    της 22ας Οκτωβρίου 2003, για τον καθορισμό των
    επιστροφών κατά την εξαγωγή στον τομέα των
    μεταποιημένων προϊόντων με βάση τα οπωροκηπευτικά
    εκτός αυτών που χορηγούνται για την προστιθέμενη
    ζάχαρη (κεράσια προσωρινά διατηρημένα, αποφλοιωμένες
    ντομάτες, ζαχαρόπηκτα κεράσια, παρασκευασμένα
    φουντούκια και ορισμένοι χυμοί πορτοκαλιού)
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1859/2003, annettu 22 päivänä lokakuuta 2003,
    vientitukien vahvistamisesta hedelmä- ja vihannesjalostealalla lisättyä sokeria
    koskevaa vientitukea (väliaikaisesti säilötyt kirsikat, kuoritut tomaatit,
    sokeroidut kirsikat, valmistetut hasselpähkinät, tietyt appelsiinimehut) lukuun
    ottamatta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1859/2003 della Commissione, del 22 ottobre 2003, che
    fissa le restituzioni all'esportazione nel settore dei prodotti trasformati a
    base di ortofrutticoli, ad eccezione di quelle concesse per gli zuccheri addizionati
    (ciliegie temporaneamente conservate, pomodori pelati, ciliegie candite, nocciole
    preparate, taluni succhi d'arancia)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1859/2003 van de Commissie van 22 oktober 2003 tot
    vaststelling van de uitvoerrestituties in de sector verwerkte producten op basis
    van groenten en fruit, andere dan voor toegevoegde suiker toegekende restituties
    (voorlopig verduurzaamde kersen, gepelde tomaten, gekonfĳte kersen, bereide hazelnoten
    en sommige sinaasappelsappen)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1859/2003 da Comissão, de 22 de Outubro de 2003,
    que fixa as restituições à exportação no sector dos produtos transformados
    à base de frutas e produtos hortícolas, com exclusão das concedidas a título
    dos açúcares de adição (cerejas conservadas transitoriamente, tomates pelados,
    cerejas cristalizadas, avelãs preparadas, determinados sumos de laranja)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1859/2003 de la Comisión, de 22 de octubre de 2003,
    por el que se fijan las restituciones por exportación en el sector de los productos
    transformados a base de frutas y hortalizas, distintas de las concedidas por azúcares
    añadidos (cerezas conservadas provisionalmente, tomates pelados, cerezas confitadas,
    avellanas preparadas, determinados zumos de naranja)
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1859/2003 av den 22 oktober 2003 om fastställande
    av exportbidrag för bearbetade produkter av frukt och grönsaker, förutom de
