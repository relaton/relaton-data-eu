    αμπελουργικών εκτάσεων των οποίων οι επιτραπέζιοι
    οίνοι δύνανται να έχουν μέγιστο ολικό φυσικό
    αλκοολικό τίτλο 17
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 2319/74, annettu 10 päivänä syyskuuta 1974,
    tiettyjen sellaisten viininviljelyalueiden määrittämisestä, jotka voivat tuottaa
    kokonaisvahvuudeltaan enintään 17° alkoholia sisältäviä pöytäviinejä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2319/74 della Commissione, del 10 settembre 1974,
