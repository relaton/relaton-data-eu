- language: fr
  script: Latn
  content: Règlement (CEE) n° 2319/74 de la Commission, du 10 septembre 1974, déterminant
    certaines superficies agricoles dont les vins de table peuvent avoir un titre
    alcoométrique naturel total maximal de 17°
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2319/74 der Kommission vom 10. September 1974 zur
    Festlegung bestimmter Weinbauflächen zur Erzeugung von Tafelweinen, die einen
    natürlichen Höchst-Gesamtalkoholgehalt von 17 Grad haben können
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2319/74 af 10. september 1974 om fastlæggelse
