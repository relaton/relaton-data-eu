title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 895/2008 of 12 September 2008 amending, for
    the thirteenth time, Regulation (EC) No 1763/2004 imposing certain restrictive
    measures in support of effective implementation of the mandate of the International
    Criminal Tribunal for the former Yugoslavia (ICTY)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 895/2008 de la Commission du 12 septembre 2008 modifiant,
    pour la treizième fois, le règlement (CE) n o 1763/2004 instituant certaines
    mesures restrictives à l'appui d'une mise en œuvre effective du mandat du Tribunal
    pénal international de l'ex-Yougoslavie (TPIY)
  type: main
- language: de
  script: Latn
