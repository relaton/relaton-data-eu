  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 895/2008 da Comissão, de 12 de Setembro 2008 , que
    altera, pela décima terceira vez, o Regulamento (CE) n. o 1763/2004 que impõe
    determinadas medidas restritivas de apoio ao exercício efectivo do mandato do
    Tribunal Penal Internacional para a antiga Jugoslávia (TPIJ)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 895/2008 al Comisiei din 12 septembrie 2008 de modificare,
