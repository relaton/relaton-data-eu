    tikras ribojančias priemones, remiančias veiksmingą Tarptautinio baudžiamojo
    tribunolo buvusiai Jugoslavijai (TBTBJ) mandato vykdymą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 895/2008 tat- 12 ta' Settembru 2008
