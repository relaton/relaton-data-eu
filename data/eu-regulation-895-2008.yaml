    tukemiseksi annetun asetuksen (EY) N:o 1763/2004 muuttamisesta 13. kerran
  type: main
- language: hu
  script: Latn
  content: A Bizottság 895/2008/EK rendelete ( 2008. szeptember 12. ) a volt Jugoszláviával
