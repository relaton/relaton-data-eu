    ċerti miżuri restrittivi biex isostnu l-implimentazzjoni effettiva tal-mandat
    tal-Qorti Kriminali Internazzjonali għal dik li qabel kienet il-Jugoslavja (ICTY)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 895/2008 van de Commissie van 12 september 2008 houdende
    dertiende wijziging van Verordening (EG) nr. 1763/2004 tot vaststelling van bepaalde
    beperkende maatregelen ter ondersteuning van de daadwerkelijke uitvoering van
    het mandaat van het Internationaal Straftribunaal voor het voormalige Joegoslavië
    (ICTY)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 895/2008 z dnia 12 września 2008 r. zmieniające
