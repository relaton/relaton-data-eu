  content: Commission Regulation (EC) No 2569/95 of 31 October 1995 supplementing
    Regulation (EEC) No 2385/91 as regards the geographical areas of Austria where
    producers practising transhumance are regarded as producers in less-favoured areas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2569/95 de la Commission, du 31 octobre 1995, complétant
    le règlement (CEE) n° 2385/91 en ce qui concerne les zones géographiques de
    l'Autriche oð les producteurs de viande ovine pratiquant la transhumance sont
    considérés comme producteurs en zones défavorisées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2569/95 der Kommission vom 31. Oktober 1995 zur Ergänzung
    der Verordnung (EWG) Nr. 2385/91 hinsichtlich der Gebiete in Österreich, in denen
    Wanderschafhaltung betreibende Erzeuger als Erzeuger in benachteiligten Gebieten
    gelten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2569/95 af 31. oktober 1995 om supplering
    af forordning (EØF) nr. 2385/91 for så vidt angår de geografiske områder i
    Østrig, hvor fårekødsproducenter, der foretager græsningsskifte, betragtes
    som producenter i et ugunstigt stillet område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2569/95 της Επιτροπής
    της 31ης Οκτωβρίου 1995 που συμπληρώνει τον κανονισμό
    (ΕΟΚ) αριθ. 2385/91 όσον αφορά τις γεωγραφικές ζώνες
    της Αυστρίας όπου οι παραγωγοί προβείου κρέατος
    που μετακινούν εποχιακά τα ποίμνιά τους θεωρούνται
    ως παραγωγοί σε μειονεκτικές περιοχές
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2569/95, annettu 31 päivänä lokakuuta 1995,
    asetuksen (ETY) N:o 2385/91 täydentämisestä sellaisten Itävallan maantieteellisten
    alueiden osalta, joilla vuorilaiduntamista harjoittavia lampaanlihan tuottajia
    pidetään epäsuotuisten alueiden tuottajina
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2569/95 della Commissione, del 31 ottobre 1995, che
    completa il regolamento (CEE) n. 2385/91 per quanto concerne le zone geografiche
    dell'Austria nelle quali i produttori che praticano la transumanza sono considerati
    produttori di carne ovina di zone svantaggiate
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2569/95 van de Commissie van 31 oktober 1995 tot aanvulling
    van Verordening (EEG) nr. 2385/91 wat betreft de geografische gebieden van Oostenrijk
    waar producenten van schapevlees die het "transhumance"-systeem toepassen, beschouwd
    worden als producenten in probleemgebieden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2569/95 da Comissão, de 31 de Outubro de 1995, que
    completa o Regulamento (CEE) nº 2585/91 no que diz respeito às zonas geográficas
    da Áustria onde os produtores de carne de ovino que praticam a transumância
    são considerados produtores em zonas desfavorecidas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2569/95 de la Comisión, de 31 de octubre de 1995,
