    derivati da cotone geneticamente modificato GHB811 (BCS-GH811-4) in conformità
    al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata
    con il numero C(2022) 1873] (Il testo in lingua tedesca è il solo facente fede)
  type: main
