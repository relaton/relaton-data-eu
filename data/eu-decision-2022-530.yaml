    zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderte
    Baumwolle GHB811 (BCS-GH811-4) enthalten, aus ihr bestehen oder aus ihr gewonnen
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates (Bekannt gegeben unter Aktenzeichen C(2022) 1873) (Nur der deutsche
    Text ist verbindlich)
  type: main
