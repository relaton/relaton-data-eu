    GHB811 (BCS-GH811-4) ili se sastoje ili su proizvedeni od njega, u skladu s Uredbom
    (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2022) 1873) (Vjerodostojan je samo tekst na njemačkom jeziku)
  type: main
- language: hu
  script: Latn
