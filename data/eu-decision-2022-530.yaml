title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/530 of 31 March 2022 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified cotton GHB811 (BCS-GH811-4), pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council (notified under document
    C(2022)1873) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/530 de la Commission du 31 mars 2022
    autorisant la mise sur le marché de produits contenant du coton génétiquement
    modifié GHB811 (BCS-GH811-4), consistant en ce coton ou produits à partir de
    celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2022) 1873] (Le texte en langue allemande
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
