title:
- language: en
  script: Latn
  content: '98/471/EC: Commission Decision of 16 July 1998 establishing priority areas
    for the action plan for the exchange between the administrations of the participating
    countries of national officials who are engaged in the implementation of Community
    legislation required to achieve the internal market, adopted pursuant to Council
    Decision 92/481/EEC (Karolus programme) (notified under document number C(1998)
    2012)'
  type: main
- language: fr
  script: Latn
  content: '98/471/CE: Décision de la Commission du 16 juillet 1998 fixant les domaines
    prioritaires pour le plan d''action pour l''échange, entre les administrations
    des États participants, de fonctionnaires nationaux chargés de la mise en oeuvre
    de la législation communautaire nécessaire à la réalisation du marché intérieur
    faisant l''objet de la décision 92/481/CEE du Conseil (programme Karolus) [notifiée
    sous le numéro C(1998) 2012]'
  type: main
- language: de
  script: Latn
  content: '98/471/EG: Beschluss der Kommission vom 16. Juli 1998 zur Festlegung der
    vorrangigen Bereiche für den mit der Entscheidung 92/481/EWG des Rates beschlossenen
    Aktionsplan für den zwischen den Verwaltungen der Mitgliedstaaten vorzunehmenden
    Austausch nationaler Beamter, die mit der zur Verwirklichung des Binnenmarktes
    erforderlichen Durchführung des Gemeinschaftsrechts betraut sind (Programm Karolus)
    (Bekanntgegeben unter Aktenzeichen K(1998) 2012)'
  type: main
- language: da
  script: Latn
  content: '98/471/EF: Kommissionens afgørelse af 16. juli 1998 vedrørende de prioriterede
    områder i handlingsplanen for udveksling mellem medlemsstaternes forvaltninger
    af nationale embedsmænd, som har til opgave at gennemføre de EF-forskrifter,
    som er nødvendige for virkeliggørelsen af det indre marked, jf. Rådets beslutning
    92/481/EØF (Karolus-programmet) (meddelt under nummer K(1998) 2012)'
  type: main
- language: el
  script: Grek
  content: '98/471/ΕΚ: Απόφαση της Επιτροπής της 16ης Ιουλίου
    1998 για τον καθορισμό των τομέων προτεραιότητας
    που αφορούν το πρόγραμμα δράσης, το οποίο αποτελεί
    αντικείμενο της απόφασης 92/481/ΕΟΚ σχετικά με
    την ανταλλαγή εθνικών υπαλλήλων μεταξύ των
    διοικήσεων των κρατών μελών, οι οποίοι είναι
    επιφορτισμένοι με την εφαρμογή της κοινοτικής
    νομοθεσίας που απαιτείται για την υλοποίηση
    της εσωτερικής αγοράς (πρόγραμμα Karolus) [κοινοποιηθείσα
    υπό τον αριθμό Ε(1998) 2012]'
  type: main
- language: fi
  script: Latn
  content: '98/471/EY: Komission päätös, tehty 16 päivänä heinäkuuta 1998,
    neuvoston päätöksellä 92/481/ETY hyväksytyn sisämarkkinoiden toteuttamiseksi
    tarvittavan yhteisön lainsäädännön täytäntöönpanosta vastaavien kansallisten
    virkamiesten vaihtoa jäsenvaltioiden hallintojen välillä koskevan toimintasuunnitelman
    ensisijaisten alojen vahvistamisesta (Karolus-ohjelma) (tiedoksiannettu numerolla
    K(1998) 2012)'
  type: main
- language: it
  script: Latn
  content: '98/471/CE: Decisione della Commissione del 16 luglio 1998 che stabilisce
    i settori prioritari del piano d''azione per lo scambio, tra le amministrazioni
    degli Stati partecipanti, di funzionari nazionali incaricati dell''applicazione
    della normativa comunitaria necessaria per il completamento del mercato interno,
    oggetto della decisione 92/481/CEE del Consiglio (programma Karolus) [notificata
    con il numero C(1998) 2012]'
  type: main
- language: nl
  script: Latn
  content: '98/471/EG: Besluit van de Commissie van 16 juli 1998 tot vaststelling
    van de prioritaire werkterreinen van het actieprogramma voor de uitwisseling tussen
    ambtelijke diensten van de lidstaten, van nationale ambtenaren die belast zijn
    met de tenuitvoerlegging van communautaire wet- en regelgeving inzake de interne
    markt, dat het onderwerp uitmaakt van Beschikking 92/481/EEG van de Raad (Karolus-programma)
    (kennisgeving geschied onder nummer C(1998) 2012)'
  type: main
- language: pt
  script: Latn
  content: '98/471/CE: Decisão da Comissão de 16 de Julho de 1998 que estabelece
