    encargados de la aplicación de la legislación comunitaria necesaria para la
    realización del mercado interior, contemplado en la Decision 92/481/CEE del Consejo
    (programa Karolus) [notificada con el número C(1998) 2012]'
  type: main
- language: sv
  script: Latn
  content: '98/471/EG: Kommissionens beslut av den 16 juli 1998 om fastställande
