    ορισμένων προϊόντων καταγωγής Μάλτας ( 1989 )
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1638/89 DEL CONSIGLIO dell'' 8 giugno 1989 che modifica
    i regolamenti (CEE) n. 4227/88 e (CEE) n. 4228/88 i quali recano rispettivamente
    sospensione totale o parziale dei dazi applicabili a taluni prodotti dei capitoli
    da 1 a 24 della nomenclatura combinata e stabiliscono dei massimali ed una sorveglianza
    comunitaria per le importazioni di taluni prodotti originari di Malta (1989) #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1638/89 VAN DE RAAD van 8 juni 1989 tot wijziging
    van de Verordeningen (EEG) nr. 4227/88 en (EEG) nr. 4228/88 houdende respectievelijk
    gehele of gedeeltelijke schorsing van de rechten van toepassing op bepaalde produkten
    van de hoofdstukken 1 tot en met 24 van de gecombineerde nomenclatuur, vaststelling
    van maxima en de instelling van communautair toezicht met betrekking tot de invoer
    van bepaalde produkten van oorsprong uit Malta (1989) #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1638/89 DO CONSELHO de 8 de Junho de 1989 que altera
