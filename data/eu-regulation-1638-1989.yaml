    à suspensao total ou parcial dos direitos aplicaveis a determinados produtos
    dos capitulos 1 a 24 da Nomenclatura Combinada originarios de Malta e ao estabelecimento
    de tectos e de uma vigilância comunitaria em relaçao às importaçoes de determinados
    produtos originarios de Malta (1989)
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1638/89 DEL CONSEJO de 8 de junio de 1989 por el que
    se modifican los Reglamentos (CEE) no 4227/88 y no 4228/88 por el que se suspenden
    total o parcialmente los derechos aplicables a determinados productos de los capítulos
    1 a 24 de la Nomenclatura Combinada y por el que se establecen límites máximos
    y una vigilancia comunitaria de las importaciones de determinados productos, originarios
    de Malta (1989) #'
