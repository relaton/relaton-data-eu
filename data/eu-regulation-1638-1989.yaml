title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1638/89 of 8 June 1989 amending Regulations
    (EEC) No 4227/88 and (EEC) No 4228/88 which, respectively, suspended, totally
    or partially, the duties applicable to certain products falling within Chapters
    1 to 24 of the combined nomenclature and originating in Malta (1989) and established
    ceilings and Community surveillance for imports of certain products originating
    in Malta (1989)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1638/89 du Conseil du 8 juin 1989 modifiant les règlements
    (CEE) n° 4227/88 et (CEE) n 4228/88 portant respectivement suspension totale
    ou partielle des droits applicables à certains produits relevant des chapitres
    1 à 24 de la nomenclature combinée et établissement de plafonds et d'une surveillance
    communautaire des importations de certains produits, originaires de Malte (1989)
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1638/89 DES RATES vom 8. Juni 1989 zur Änderung
    der Verordnungen (EWG) Nr. 4227/88 und (EWG) Nr. 4228/88 zur vollständigen oder
    teilweisen Aussetzung der für bestimmte Erzeugnisse der Kapitel 1 bis 24 der
    Kombinierten Nomenklatur geltenden Zollsätze bzw. zur Festsetzung von Plafonds
    und zur Einrichtung einer gemeinschaftlichen Überwachung der Einfuhren bestimmter
    Erzeugnisse mit Ursprung in Malta (1989) #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1638/89 af 8. juni 1989 om ændring af forordning
    (EØF) nr. 4227/88 og (EØF) nr. 4228/88 om fuldstændig eller delvis suspension
    af toldsatserne for visse varer henhørende under kapitel 1 til 24 i Den Kombinerede
    Nomenklatur og om indførelse af lofter for og fællesskabstilsyn med indførsel
    af visse varer med oprindelse i Malta (1989)
  type: main
- language: el
  script: Grek
