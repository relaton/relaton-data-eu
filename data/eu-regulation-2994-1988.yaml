    hinsichtlich der Frist für die Über- oder Entnahme der Butter aus Beständen
    der Interventionsstellen für die Ausfuhr
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2994/88 af 29. september 1988 om ændring
