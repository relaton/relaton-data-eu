    za najudaljenije regije pogođene teškim prirodnim katastrofama i u kontekstu
    razaranja koje je uzrokovao ciklon Chido na Mayotteu
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2025/1276 rendelete (2025. június
    24.) a 228/2013/EU rendeletnek a súlyos természeti katasztrófák által sújtott
    legkülső régióknak nyújtandó kiegészítő támogatás és nagyobb rugalmasság
    tekintetében, valamint a Chido ciklon által Mayotte-on okozott pusztítással
    összefüggésben történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (ue) 2025/1276 del Parlamento europeo e del Consiglio, del
    24 giugno 2025, che modifica il regolamento (UE) n. 228/2013 per quanto riguarda
    l’assistenza integrativa e l’ulteriore flessibilità per le regioni ultraperiferiche
    colpite da gravi calamità naturali e nel contesto delle devastazioni provocate
    dal ciclone Chido a Mayotte
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2025/1276 (2025. gada 24. jūnijs),
    ar ko groza Regulu (ES) Nr. 228/2013 attiecībā uz papildu palīdzību un lielāku
    elastību tālākajiem reģioniem, kurus skārušas skarbas dabas katastrofas,
    un sakarā ar ciklona Čido nodarītajiem postījumiem Majotā
  type: main
- language: lt
  script: Latn
  content: 2025 m. birželio 24 d. Europos Parlamento ir Tarybos reglamentas (ES)
