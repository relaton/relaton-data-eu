title:
- language: en
  script: Latn
  content: Regulation (EU) 2025/1276 of the European Parliament and of the Council
    of 24 June 2025 amending Regulation (EU) No 228/2013 as regards additional assistance
    to, and further flexibility in respect of, outermost regions affected by severe
    natural disasters and in the context of the devastation caused by cyclone Chido
    in Mayotte
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2025/1276 du Parlement européen et du Conseil du 24 juin
    2025 modifiant le règlement (UE) n° 228/2013 en ce qui concerne une aide supplémentaire
    et une flexibilité accrue en faveur des régions ultrapériphériques touchées
    par de graves catastrophes naturelles et dans le contexte de la dévastation causée
    par le cyclone Chido à Mayotte
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2025/1276 des Europäischen Parlaments und des Rates vom
    24. Juni 2025 zur Änderung der Verordnung (EU) Nr. 228/2013 in Bezug auf zusätzliche
    Unterstützung und mehr Flexibilität für Gebiete in äußerster Randlage, die
    von schweren Naturkatastrophen betroffen sind, und angesichts der Zerstörung
    durch den Zyklon Chido auf Mayotte
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2025/1276 на Европейския парламент
    и на Съвета от 24 юни 2025 година за изменение
    на Регламент (ЕС) № 228/2013 по отношение на допълнителна
    помощ и по-голяма гъвкавост за най-отдалечените
    региони, засегнати от природни бедствия, и
    в контекста на опустошението, причинено от
    циклона Чидо в Майот
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2025/1276 ze dne 24. června
    2025, kterým se mění nařízení (EU) č. 228/2013, pokud jde o dodatečnou
    pomoc a větší flexibilitu ve vztahu k nejvzdálenějším regionům postiženým
    závažnými přírodními katastrofami a v souvislosti s devastací způsobenou
    cyklonem Chido na Mayotte
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2025/1276 af 24. juni 2025
    om ændring af forordning (EU) nr. 228/2013 for så vidt angår yderligere bistand
    til, og yderligere fleksibilitet i forhold til, fjernområderne, der er påvirket
    af alvorlige naturkatastrofer, og i forbindelse med ødelæggelserne forårsaget
    af cyklonen Chido i Mayotte
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2025/1276 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 24ης Ιουνίου 2025, για
    την τροποποίηση του κανονισμού (ΕΕ) αριθ. 228/2013
    όσον αφορά την πρόσθετη βοήθεια και την περαιτέρω
    ευελιξία για τις εξόχως απόκεντρες περιοχές
    που πλήττονται από σοβαρές φυσικές καταστροφές
