    kyse lisäavusta ja joustomahdollisuuksista vakavista luonnonkatastrofeista kärsiville
    syrjäisimmille alueille Chido-syklonin Mayottessa aiheuttamien tuhojen yhteydessä
  type: main
- language: ga
  script: Latn
