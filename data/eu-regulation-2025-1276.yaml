    susiję su papildoma pagalba ir didesniu lankstumu atokiausiems regionams, nukentėjusiems
    nuo didelių gaivalinių nelaimių, ir su Majotą nuniokojusiu ciklonu „Chido“
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2025/1276 tal-Parlament Ewropew u tal-Kunsill tal-24 ta’
