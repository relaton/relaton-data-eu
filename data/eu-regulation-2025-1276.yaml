    addizzjonali għar-reġjuni ultraperiferiċi affettwati minn diżastri naturali
    severi, u aktar flessibbiltà fir-rigward tagħhom u fil-kuntest tad-devastazzjoni
    kkawżata miċ-ċiklun Chido f’Mayotte
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2025/1276 van het Europees Parlement en de Raad van 24
    juni 2025 tot wijziging van Verordening (EU) nr. 228/2013 wat betreft aanvullende
    bijstand aan en verdere flexibiliteit met betrekking tot ultraperifere gebieden
    die door een ernstige natuurramp zijn getroffen, en in de context van de verwoesting
    veroorzaakt door cycloon Chido op Mayotte
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2025/1276 z dnia 24
    czerwca 2025 r. zmieniającego rozporządzenie (UE) nr 228/2013 w odniesieniu
    do dodatkowej pomocy i większej elastyczności w odniesieniu do regionów najbardziej
    oddalonych dotkniętych poważnymi klęskami żywiołowymi oraz w kontekście
    zniszczeń spowodowanych przez cyklon Chido na Majotcie
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2025/1276 do Parlamento Europeu e do Conselho, de 24 de
    junho de 2025, que altera o Regulamento (UE) n.° 228/2013 relativamente à assistência
    adicional e a uma maior flexibilidade no que diz respeito às regiões ultraperiféricas
    afetadas por catástrofes naturais graves no contexto da devastação causada
    pelo ciclone Chido em Maiote
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2025/1276 al Parlamentului European și al Consiliului
    din 24 iunie 2025 de modificare a Regulamentului (UE) nr. 228/2013 în ceea ce
    privește asistența suplimentară acordată regiunilor ultraperiferice afectate
    de dezastre naturale grave, precum și gradul mai mare de flexibilitate față
    de acestea, în contextul distrugerilor provocate de ciclonul Chido în Mayotte
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2025/1276 z 24. júna 2025,
    ktorým sa mení nariadenie (EÚ) č. 228/2013, pokiaľ ide o dodatočnú pomoc
    a ďalšiu flexibilitu pre najvzdialenejšie regióny zasiahnuté závažnými
    prírodnými katastrofami, a v súvislosti s ničivými dôsledkami cyklónu Chido
    na Mayotte
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2025/1276 Evropskega parlamenta in Sveta z dne 24. junija 2025
    o spremembi Uredbe (EU) št. 228/2013 v zvezi z dodatno pomočjo in nadaljnjo
    prožnostjo za najbolj oddaljene regije, ki so jih prizadele hude naravne nesreče
    ter v okviru razdejanja, ki ga je povzročil ciklon Chido na Mayottu
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2025/1276 del Parlamento Europeo y del Consejo, de 24 de
    junio de 2025, por el que se modifica el Reglamento (UE) n.° 228/2013 en lo que
    respecta a la ayuda suplementaria y una mayor flexibilidad en favor de las regiones
    ultraperiféricas afectadas por desastres naturales graves y en el contexto de
    la devastación causada por el ciclón Chido en Mayotte
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2025/1276 av den 24 juni
    2025 om ändring av förordning (EU) nr 228/2013 vad gäller ytterligare stöd
    och ökad flexibilitet till förmån för de yttersta randområden som drabbats
    av allvarliga naturkatastrofer och till följd av den förödelse som orsakats
    av cyklonen Chido i Mayotte
