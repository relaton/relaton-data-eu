title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1228/77 of 8 June 1977 re-establishing the
    levying of customs duties on household utensils of wood, falling within heading
    No 44.24, originating in Thailand to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1228/77 de la Commission, du 8 juin 1977, portant
    rétablissement de la perception des droits de douane applicables aux ustensiles
    de ménage en bois, de la position tarifaire 44.24, originaires de la Thaïlande
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1228/77 der Kommission vom 8. Juni 1977 zur Wiedereinführung
    des Zollsatzes für Haushaltsgeräte aus Holz der Tarifnummer 44.24 mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1228/77 af 8. juni 1977 om genindførelse
    af opkrævning af toldafgifter for husholdningsartikler af træ, under position
    44.24, som har oprindelse i Thailand, og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1228/77 della Commissione, dell'8 giugno 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti di uso domestico
    di legno, della voce doganale 44.24, originari della Tailandia, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1228/77 van de Commissie van 8 juni 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op huishoudelijke
    artikelen van hout, van post 44.24, van oorsprong uit Thailand, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
