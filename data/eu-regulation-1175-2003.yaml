  content: Commission Regulation (EC) No 1175/2003 of 1 July 2003 amending Regulations
    (EC) No 883/2001 and (EC) No 2805/95, respectively, laying down detailed rules
    for implementing Council Regulation (EC) No 1493/1999 as regards trade with third
    countries in products in the wine sector and fixing the export refunds in the
    wine sector
  type: main
- language: fr
  script: Latn
