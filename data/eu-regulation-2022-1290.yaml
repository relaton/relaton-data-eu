    Ametoctradin, Chlormequat, Dodin, Nikotin, Profenofos und Spodoptera exigua Multikapsid-Nucleopolyhedrovirus
    (SeMNPV), Isolat BV-0004 in oder auf bestimmten Erzeugnissen
  type: main
