  content: Commission Regulation (EU) 2022/1290 of 22 July 2022 amending Annexes II,
    III and IV to Regulation (EC) No 396/2005 of the European Parliament and of the
    Council as regards maximum residue levels for ametoctradin, chlormequat, dodine,
    nicotine, profenofos and Spodoptera exigua multicapsid nucleopolyhedrovirus (SeMNPV)
    isolate BV-0004 in or on certain products
  type: main
