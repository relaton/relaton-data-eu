    et du Conseil en ce qui concerne les limites maximales applicables aux résidus
    des substances actives amétoctradine, chlorméquat, dodine, nicotine, profenofos
    et Spodoptera exigua — virus de la polyédrose nucléaire à capsides multiples
    (SeMNPV), isolat BV-0004, présents dans ou sur certains produits
  type: main
