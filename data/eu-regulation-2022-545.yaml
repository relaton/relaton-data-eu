    az eseményadat-rögzítőik tekintetében történő típusjóváhagyására,
    valamint e rendszerek önálló műszaki egységként történő típusjóváhagyására
    vonatkozó egyedi vizsgálati eljárásokra és műszaki követelményekre vonatkozó
    részletes szabályok megállapítása tekintetében történő kiegészítéséről,
    valamint az említett rendelet II. mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/545 della Commissione del 26 gennaio 2022
    che integra il regolamento (UE) 2019/2144 del Parlamento europeo e del Consiglio
    stabilendo norme dettagliate sulle procedure di prova e i requisiti tecnici specifici
    per l'omologazione dei veicoli a motore relativamente ai registratori di dati
    di evento e per l'omologazione di tali sistemi come entità tecniche, e che ne
    modifica l'allegato II
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/545 (2022. gada 26. janvāris),
