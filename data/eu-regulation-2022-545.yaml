title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/545 of 26 January 2022 supplementing
    Regulation (EU) 2019/2144 of the European Parliament and of the Council by laying
    down detailed rules concerning the specific test procedures and technical requirements
    for the type-approval of motor vehicles with regard to their event data recorder
    and for the type-approval of those systems as separate technical units and amending
    Annex II to that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/545 de la Commission du 26 janvier 2022
    complétant le règlement (UE) 2019/2144 du Parlement européen et du Conseil
    en établissant des règles détaillées relatives aux procédures d’essai et
    aux prescriptions techniques spécifiques pour la réception par type des véhicules
    à moteur en ce qui concerne leur enregistreur de données d’événements et
    pour la réception par type de ces systèmes en tant qu’entités techniques
    distinctes et modifiant l’annexe II dudit règlement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/545 der Kommission vom 26. Januar 2022
    zur Ergänzung der Verordnung (EU) 2019/2144 des Europäischen Parlaments und
    des Rates durch Festlegung detaillierter Vorschriften für die spezifischen Prüfverfahren
    und technischen Anforderungen für die Typgenehmigung von Kraftfahrzeugen hinsichtlich
    ihrer Ereignisdatenspeicher und für die Typgenehmigung von Ereignisdatenspeichern
    als selbstständige technische Einheiten sowie zur Änderung von Anhang II der
    genannten Verordnung
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/545 на Комисията
    от 26 януари 2022 година за допълнение на Регламент
    (ЕС) 2019/2144 на Европейския парламент и на Съвета
    чрез определяне на подробни правила относно
    специфичните процедури за изпитване и техническите
    изисквания за одобряване на типа на моторни
    превозни средства по отношение на техните
    устройства за записване на данни от инциденти
    и за одобряване на типа на тези системи като
    отделни технически възли и за изменение на
    приложение II към посочения регламент
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/545 ze dne 26. ledna
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2019/2144
    stanovením podrobných pravidel týkajících se zvláštních zkušebních postupů
    a technických požadavků pro schvalování typu motorových vozidel z hlediska
    jejich zapisovače údajů o události a pro schvalování typu těchto systémů
    jako samostatných technických celků a kterým se mění příloha II uvedeného
    nařízení
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/545 af 26. januar 2022 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2019/2144
    med nærmere regler vedrørende de specifikke prøvningsprocedurer og tekniske
    krav til typegodkendelse af motorkøretøjer for så vidt angår kollisionsdatarekorderen
    samt til typegodkendelse af sådanne systemer som separate tekniske enheder og
    om ændring af bilag II til nævnte forordning
