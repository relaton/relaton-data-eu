    noteikumus par specifiskām testa procedūrām un tehniskajām prasībām mehānisko
    transportlīdzekļu tipa apstiprināšanai attiecībā uz to notikuma datu reģistratoru
    un šo sistēmu kā atsevišķu tehnisko vienību tipa apstiprināšanu, un ar
    ko groza minētās regulas II pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/545 2022 m. sausio 26 d. kuriuo
    Europos Parlamento ir Tarybos reglamentas (ES) 2019/2144 papildomas nustatant
    išsamias taisykles dėl variklinių transporto priemonių tipo patvirtinimo pagal
    jų eismo įvykių duomenų savirašius ir tų sistemų, kaip atskirų techninių
    mazgų, tipo patvirtinimo specialiųjų bandymo procedūrų ir techninių reikalavimų
    ir iš dalies keičiamas to reglamento II priedas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/545 tas-26 ta’ Jannar 2022
    li jissupplimenta r-Regolament (UE) 2019/2144 tal-Parlament Ewropew u tal-Kunsill
    billi jistabbilixxi regoli dettaljati dwar il-proċeduri speċifiċi tal-ittestjar
    u r-rekwiżiti tekniċi għall-approvazzjoni tat-tip ta’ vetturi bil-mutur fir-rigward
    tar-reġistratur tagħhom tad-data f’każ ta’ avveniment u għall-approvazzjoni
    tat-tip ta’ dawk is-sistemi bħala unitajiet tekniċi separati, u li jemenda
    l-Anness II ta’ dak ir-Regolament
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/545 van de Commissie van 26 januari
    2022 tot aanvulling van Verordening (EU) 2019/2144 van het Europees Parlement
    en de Raad met uitvoeringsbepalingen voor de specifieke testprocedures en technische
    voorschriften voor de typegoedkeuring van motorvoertuigen wat de gegevensrecorder
    voor incidenten betreft en voor de typegoedkeuring van die systemen als technische
    eenheden en tot wijziging van bijlage II bij die verordening
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/545 z dnia 26 stycznia 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2019/2144
    poprzez określenie szczegółowych przepisów dotyczących konkretnych procedur
    badań i wymogów technicznych w zakresie homologacji typu pojazdów silnikowych
    w odniesieniu do rejestratorów danych na temat zdarzeń i homologacji typu tych
    układów jako oddzielnych zespołów technicznych oraz zmieniające załącznik
    II do tego rozporządzenia
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/545 da Comissão de 26 de janeiro de 2022
    que complementa o Regulamento (UE) 2019/2144 do Parlamento Europeu e do Conselho,
    estabelecendo normas de execução pormenorizadas relativas aos procedimentos
    de ensaio específicos e aos requisitos técnicos para a homologação de veículos
    a motor no que respeita ao seu aparelho de registo de eventos e para a homologação
    desses sistemas enquanto unidades técnicas e que altera o anexo II desse regulamento
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/545 al Comisiei din 26 ianuarie 2022 de
    completare a Regulamentului (UE) 2019/2144 al Parlamentului European și al Consiliului
    prin stabilirea unor norme detaliate privind procedurile specifice de încercare
    și cerințele tehnice pentru omologarea de tip a autovehiculelor în ceea ce
    privește dispozitivul de înregistrare a datelor privind evenimentele și pentru
    omologarea de tip a acestor sisteme ca unități tehnice separate și de modificare
    a anexei II la regulamentul menționat
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/545 z 26. januára 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2019/2144 stanovením
    podrobných pravidiel týkajúcich sa osobitných skúšobných postupov a technických
    požiadaviek na typové schvaľovanie motorových vozidiel vzhľadom na ich zariadenie
    na záznam údajov o udalostiach a na typové schvaľovanie týchto systémov
    ako samostatných technických jednotiek a ktorým sa mení príloha II k uvedenému
    nariadeniu
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/545 z dne 26. januarja 2022 o dopolnitvi
    Uredbe (EU) 2019/2144 Evropskega parlamenta in Sveta z določitvijo podrobnih
    pravil v zvezi s posebnimi preizkuševalnimi postopki in tehničnimi zahtevami
    za homologacijo motornih vozil glede njihovih zapisovalnikov podatkov o dogodku
    in za homologacijo teh sistemov kot samostojnih tehničnih enot ter o spremembi
    Priloge II k navedeni uredbi
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/545 de la Comisión de 26 de enero de 2022
    por el que se completa el Reglamento (UE) 2019/2144 del Parlamento Europeo y del
    Consejo mediante el establecimiento de normas pormenorizadas sobre los procedimientos
    de ensayo y los requisitos técnicos específicos para la homologación de tipo
    de los vehículos de motor en lo que respecta a su registrador de datos de incidencias
    y para la homologación de tipo de tales sistemas como unidades técnicas independientes,
    y por el que se modifica el anexo II de dicho Reglamento
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/545 av den 26 januari 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) 2019/2144
    genom fastställande av närmare bestämmelser om särskilda provningsförfaranden
    och tekniska krav för typgodkännande av motorfordon med avseende på registreringsapparater
    för händelsedata och för typgodkännande av dessa apparater som separata tekniska
    enheter samt om ändring av bilaga II till den förordningen
