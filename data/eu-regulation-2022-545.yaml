  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/545 оd 26. siječnja 2022. o dopuni
    Uredbe (EU) 2019/2144 Europskog parlamenta i Vijeća utvrđivanjem detaljnih pravila
    u pogledu posebnih ispitnih postupaka i tehničkih zahtjeva za homologaciju tipa
    motornih vozila s obzirom na njihove uređaje za snimanje podataka o događaju
    i za homologaciju tipa tih sustava kao zasebnih tehničkih jedinica te o izmjeni
    Priloga II. toj uredbi
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/545 felhatalmazáson alapuló rendelete (2022. január
