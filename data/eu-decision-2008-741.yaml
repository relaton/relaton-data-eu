    и на Съвета от 31 март 2004 година относно координиране
    на процедурите за възлагане на обществени
    поръчки от възложители, извършващи дейност
    във водоснабдяването, енергетиката, транспорта
    и пощенските услуги, не се отнася за производството
    и продажбата на едро на електроенергия в Полша
    (нотифицирано под номер C(2008) 4805)'
  type: main
