title:
- language: en
  script: Latn
  content: '2008/741/EC: Commission Decision of 11 September 2008 establishing that
    Article 30(1) of Directive 2004/17/EC of the European Parliament and of the Council
    of 31 March 2004 coordinating the procurement procedures of entities operating
    in the water, energy, transport and postal services sectors is not applicable
    to the production and wholesale of electricity in Poland (notified under document
    number C(2008) 4805)'
  type: main
- language: fr
  script: Latn
  content: '2008/741/CE: Décision de la Commission du 11 septembre 2008 établissant
    que l’article 30, paragraphe 1, de la directive 2004/17/CE du Parlement européen
    et du Conseil du 31 mars 2004 portant coordination des procédures de passation
    des marchés dans les secteurs de l’eau, de l’énergie, des transports et
    des services postaux ne s’applique pas à la production et au commerce de gros
    de l’électricité en Pologne [notifiée sous le numéro C(2008) 4805]'
  type: main
- language: de
  script: Latn
  content: '2008/741/EG: Entscheidung der Kommission vom 11. September 2008 über
    die Nichtanwendung von Artikel 30 Absatz 1 der Richtlinie 2004/17/EG des Europäischen
    Parlaments und des Rates zur Koordinierung der Zuschlagserteilung durch Auftraggeber
    im Bereich der Wasser-, Energie- und Verkehrsversorgung sowie der Postdienste
    auf die Stromerzeugung und den Stromgroßhandel in Polen (Bekannt gegeben unter
    Aktenzeichen K(2008) 4805)'
  type: main
- language: bg
  script: Cyrl
  content: '2008/741/ЕО: Решение на Комисията от 11 септември
