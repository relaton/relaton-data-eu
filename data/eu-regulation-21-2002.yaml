title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 21/2002 of 28 December 2001 establishing
    the supply balances and Community aid for the outermost regions under Council
    Regulations (EC) No 1452/2001, (EC) No 1453/2001 and (EC) No 1454/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 21/2002 de la Commission du 28 décembre 2001 relatif
    à l'établissement des bilans prévisionnels d'approvisionnement et la fixation
    des aides communautaires pour les régions ultrapériphériques conformément
    aux règlements (CE) n° 1452/2001, (CE) n° 1453/2001 et (CE) n° 1454/2001 du
    Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 21/2002 der Kommission vom 28. Dezember 2001 über
    die Erstellung der Bedarfsvorausschätzungen und die Festsetzung der Gemeinschaftsbeihilfen
    für die Regionen in äußerster Randlage gemäß den Verordnungen (EG) Nr. 1452/2001,
    (EG) Nr. 1453/2001 und (EG) Nr. 1454/2001 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 21/2002 af 28. december 2001 om forsyningsopgørelserne
    for og fællesskabsstøtten til regionerne i den yderste periferi i henhold til
    Rådets forordning (EF) nr. 1452/2001, (EF) nr. 1453/2001 og (EF) nr. 1454/2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 21/2002 της Επιτροπής,
    της 28ης Δεκεμβρίου 2001, για την κατάρτιση των
    ισοζυγίων προβλέψεων εφοδιασμού και του καθορισμού
    των κοινοτικών ενισχύσεων για τις άκρως απόκεντρες
    περιφέρειες σύμφωνα με τους κανονισμούς (ΕΚ)
    αριθ. 1452/2001, (ΕΚ) αριθ. 1453/2001 και (ΕΚ) αριθ. 1454/2001
    του Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 21/2002, annettu 28 päivänä joulukuuta 2001,
    syrjäisimpien alueiden alustavien hankintataseiden ja yhteisön tukien vahvistamisesta
    neuvoston asetusten (EY) N:o 1452/2001, (EY) N:o 1453/2001 ja (EY) N:o 1454/2001
    mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 21/2002 della Commissione, del 28 dicembre 2001, relativo
    alla definizione dei bilanci previsionali d'approvvigionamento e alla fissazione
    degli aiuti comunitari per le regioni ultraperiferiche conformemente ai regolamenti
    (CE) n. 1452/2001, (CE) n. 1453/2001 e (CE) n. 1454/2001 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 21/2002 van de Commissie van 28 december 2001 betreffende
    de vaststelling van de voorzieningsbalansen en van de communautaire steun voor
    de ultraperifere regio's overeenkomstig de Verordeningen (EG) nr. 1452/2001, (EG)
    nr. 1453/2001 en (EG) nr. 1454/2001 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 21/2002 da Comissão, de 28 de Dezembro de 2001,
    relativo ao estabelecimento das estimativas de abastecimento e à fixação das
    ajudas comunitárias para as regiões ultraperiféricas em conformidade com os
    Regulamentos (CE) n.° 1452/2001, (CE) n.° 1453/2001 e (CE) n.° 1454/2001 do
    Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 21/2002 de la Comisión, de 28 de diciembre de 2001,
    relativo a la elaboración de los planes de abastecimiento y a la fijación de
    las ayudas comunitarias de las regiones ultraperiféricas de conformidad con los
    Reglamentos del Consejo (CE) nos 1452/2001, 1453/2001 y 1454/2001
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 21/2002 av den 28 december 2001 om upprättande
    av prognostiserade försörjningsbalanser och fastställande av gemenskapsstöd
    till de yttersta randområdena i enlighet med rådets förordningar (EG) nr 1452/2001,
    (EG) nr 1453/2001 och (EG) nr 1454/2001
  type: main
