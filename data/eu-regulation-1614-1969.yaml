  script: Latn
  content: Verordnung (EWG) Nr. 1614/69 der Kommission vom 14. August 1969 über die
    Durchführung einer Ausschreibung zur Bereitstellung von Hartweizengrieß, Maisgrieß,
    Perlgraupen und Haferflocken für das Diakonische Werk als Hilfeleistung für
    die Bevölkerung Biafras
  type: main
