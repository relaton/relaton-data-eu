    Pseudomonas solanacearum (Smith) Smith -taudinaiheuttajan leviämisen estämiseksi'
  type: main
- language: it
  script: Latn
  content: '96/301/CE: Decisione della Commissione, del 3 maggio 1996, che autorizza
    gli Stati membri ad adottare, a titolo provvisorio, misure supplementari contro
