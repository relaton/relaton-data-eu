title:
- language: en
  script: Latn
  content: '96/301/EC: Commission Decision of 3 May 1996 authorizing Member States
    temporarily to take additional measures against the dissemination of Pseudomonas
    solanacearum (Smith) Smith as regards Egypt'
  type: main
- language: fr
  script: Latn
  content: '96/301/CE: Décision de la Commission, du 3 mai 1996, autorisant les États
    membres à prendre provisoirement des mesures supplémentaires en vue de se protéger
    contre la propagation de Pseudomonas solanacearum (Smith) Smith en provenance
    d''Égypte'
  type: main
- language: de
  script: Latn
  content: '96/301/EG: Entscheidung der Kommission vom 3. Mai 1996 zur befristeten
    Ermächtigung der Mitgliedstaaten, gegen die Ausbreitung von Pseudomonas solanacearum
    (Smith) Smith gegenüber Ägypten zusätzliche Maßnahmen zu treffen'
  type: main
- language: da
  script: Latn
  content: '96/301/EF: Kommissionens beslutning af 3. maj 1996 om bemyndigelse af
    medlemsstaterne til midlertidigt at træffe supplerende foranstaltninger mod spredning
    af Pseudomonas solanacearum (Smith) Smith, for så vidt angår Egypten'
  type: main
- language: el
  script: Grek
  content: '96/301/ΕΚ: Απόφαση της Επιτροπής, της 3ης Μαΐου
