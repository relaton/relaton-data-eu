    της εξάπλωσης της Pseudomonas solanacearum (Smith) Smith όσον
    αφορά την Αίγυπτο'
  type: main
- language: fi
  script: Latn
  content: '96/301/EY: Komission päätös, tehty 3 päivänä toukokuuta 1996, luvan
