title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1520/1999 of 12 July 1999 establishing the
    lists of competent authorities and of aircraft registered in the Federal Republic
    of Yugoslavia and lawfully present in the European Community referred to in Article
    8 of Council Regulation (EC) No 1064/1999 imposing a ban on flights between the
    European Community and the Federal Republic of Yugoslavia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1520/1999 de la Commission du 12 juillet 1999 établissant
    la liste des autorités compétentes et des aéronefs immatriculés dans la République
    fédérale de Yougoslavie et légalement présents dans la Communauté européenne
    visés à l'article 8 du règlement (CE) n° 1064/1999 du Conseil concernant l'interdiction
    des vols entre les territoires de la Communauté européenne et de la République
    fédérale de Yougoslavie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1520/1999 der Kommission vom 12. Juli 1999 zur Erstellung
    des Verzeichnisses der zuständigen Behörden und der in der Bundesrepublik Jugoslawien
    eingetragenen, rechtmäßig in der Gemeinschaft befindlichen Luftfahrzeuge gemäß
    Artikel 8 der Verordnung (EG) Nr. 1064/1999 des Rates zur Verhängung eines Flugverbots
    zwischen den Gebieten der Europäischen Gemeinschaft und der Bundesrepublik Jugoslawien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1520/1999 af 12. juli 1999 om udarbejdelse
    af en liste over kompetente myndigheder og over fly, der er indregistreret i Forbundsrepublikken
    Jugoslavien, og som lovligt befandt sig i Det Europæiske Fællesskab, sådan
    som det er fastsat i artikel 8 i Rådets forordning (EF) nr. 1064/1999 af 21.
    maj 1999 om forbud mod flyvninger mellem Det Europæiske Fællesskab og Forbundsrepublikken
    Jugoslaviens område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1520/1999 της Επιτροπής
    της 12ης Ιουλίου 1999 για την κατάρτιση καταλόγων
    των αρμόδιων αρχών και των αεροσκαφών που είναι
    ταξινομημένα στην Ομοσπονδιακή Δημοκρατία
    της Γιουγκοσλαβίας και νομίμως παρόντα στην
    Ευρωπαϊκή Κοινότητα που ορίζονται στο άρθρο
    8 του κανονισμού (ΕΚ) αριθ. 1064/1999 του Συμβουλίου
    σχετικά με την απαγόρευση πτήσεων μεταξύ των
    εδαφών της Ευρωπαϊκής Κοινότητας και της Ομοσπονδιακής
    Δημοκρατίας της Γιουγκοσλαβίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1520/1999, annettu 12 päivänä heinäkuuta
    1999, lentokiellon käyttöönottamisesta Euroopan yhteisön ja Jugoslavian liittotasavallan
    alueiden välillä annetun neuvoston asetuksen (EY) N:o 1064/1999 8 artiklassa
    tarkoitetun toimivaltaisia viranomaisia ja Jugoslavian liittotasavallassa rekisteröityjä
    lentokoneita koskevan luettelon laatimisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1520/1999 della Commissione del 12 luglio 1999 che
    istituisce gli elenchi delle autorità competenti e degli aeromobili immatricolati
    nella Repubblica federale di Iugoslavia legittimamente presenti nella Comunità
    europea di cui all'articolo 8 del regolamento (CE) n. 1064/1999 del Consiglio
    che impone un divieto di volo tra i territori della Comunità europea e della
    Repubblica federale di Iugoslavia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1520/1999 van de Commissie van 12 juli 1999 tot opstelling
    van de lijst van bevoegde instanties en van de in de Federale Republiek Joegoslavië
    geregistreerde vliegtuigen die zich op wettige wijze in de Europese Gemeenschap
    bevinden als bedoeld in artikel 8 van Verordening (EG) nr. 1064/1999 van de Raad
    houdende een verbod op vluchten tussen het grondgebied van de Europese Gemeenschap
    en het grondgebied van de Federale Republiek Joegoslavië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1520/1999 da Comissão de 12 de Julho de 1999 que
    estabelece a lista das autoridades competentes e das aeronaves registadas na República
    Federativa da Jugoslávia, com presença legal na Comunidade Europeia, referidas
    no artigo 8° do Regulamento (CE) n° 1064/1999 do Conselho relativo à proibição
    de voos entre os territórios da Comunidade Europeia e da República Federativa
    da Jugoslávia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1520/1999 de la Comisión de 12 de julio de 1999 por
    el que se establecen las listas de las autoridades competentes y las aeronaves
    registradas en la República Federativa de Yugoslavia y válidamente presentes
    en la Comunidad Europea a las que se refiere el artículo 8 del Reglamento (CE)
    n° 1064/1999 del Consejo, por el que se establece una prohibición sobre los
    vuelos entre los territorios de la Comunidad Europea y la República Federativa
    de Yugoslavia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1520/1999 av den 12 juli 1999 om upprättande
    av den förteckning över behöriga myndigheter och den förteckning över flygplan
    registrerade i Förbundsrepubliken Jugoslavien och rättsligt sett närvarande
    i Europeiska gemenskapen vilka avses i artikel 8 i rådets förordning (EG) nr
    1064/1999 om att införa ett förbud mot flygningar mellan Europeiska gemenskapen
    och Förbundsrepubliken Jugoslavien
