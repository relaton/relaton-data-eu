title:
- language: fr
  script: Latn
  content: '72/503/CEE: Décision de la Commission du 22 décembre 1972, portant octroi
    du concours du Fonds social européen, prévu à l''article 125 du Traité, au
    bénéfice du Royaume des Pays-Bas, pour des dépenses relatives à des opérations
    de rééducation professionnelle effectuées par le Ministère des affaires sociales'
  type: main
- language: de
  script: Latn
  content: '72/503/EWG: Entscheidung der Kommission vom 22. Dezember 1972 zur Gewährung
    eines Zuschusses nach Artikel 125 EWG aus dem Europäischen Sozialfonds an das
    Königreich der Niederlande zu Aufwendungen für vom "Ministerie van Sociale Zaken"
    durchgeführte Berufsumschulungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/503/CEE: Decisione della Commissione, del 22 dicembre 1972, recante
    la concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore del Regno dei Paesi Bassi per spese concernenti operazioni
    di riqualificazione professionale effettuate dal Ministero degli affari sociali'
  type: main
- language: nl
  script: Latn
  content: '72/503/EEG: Beschikking van de Commissie van 22 december 1972 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel
    125 van het Verdrag ten gunste van het Koninkrijk der Nederlanden voor door het
    Ministerie van Sociale Zaken gemaakte herscholingskosten'
