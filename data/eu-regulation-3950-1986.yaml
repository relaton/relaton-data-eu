    de particuliere opslag van tafelwijn, druivemost, geconcentreerde druivemost en
    gerectificeerde geconcentreerde druivemost voor het wijnoogstjaar 1986/1987
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3950/86 da Comissão de 23 de Dezembro de 1986 que
