    der Möglichkeit des Abschlusses von Verträgen für die langfristige private
    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifiziertem Traubenmost für das Wirtschaftsjahr 1986/87
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3950/86 af 23. december 1986 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost,
    koncentreret druemost og rektificeret koncentreret druemost for produktionsåret
    1986/87
  type: main
- language: el
  script: Grek
