- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3950/86 of 23 December 1986 authorizing
    the conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1986/87 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3950/86 de la Commission du 23 décembre 1986 ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    le vin de table, le moût de raisins, le moût de raisins concentré et le moût
    de raisins concentré rectifié pour la campagne 1986/1987
  type: main
- language: de
  script: Latn
