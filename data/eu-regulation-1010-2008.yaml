  script: Latn
  content: Council Regulation (EC) No 1010/2008 of 13 October 2008 imposing a definitive
    countervailing duty on imports of sulphanilic acid originating in India following
    an expiry review pursuant to Article 18 of Regulation (EC) No 2026/97 and a partial
    interim review pursuant to Article 19 of Regulation (EC) No 2026/97 and amending
    Regulation (EC) No 1000/2008 imposing a definitive anti-dumping duty on imports
    of sulphanilic acid originating in the People’s Republic of China and India
    following an expiry review pursuant to Article 11(2) of Regulation (EC) No 384/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1010/2008 du Conseil du 13 octobre 2008 instituant
    un droit compensateur définitif sur les importations d’acide sulfanilique originaire
    de l’Inde à la suite d’un réexamen au titre de l’expiration des mesures,
    effectué conformément à l’article 18 du règlement (CE) n o 2026/97, et d’un
    réexamen intermédiaire partiel, effectué conformément à l’article 19 du
    règlement (CE) n o 2026/97, et modifiant le règlement (CE) n o 1000/2008 instituant
    un droit antidumping définitif sur les importations d’acide sulfanilique originaire
    de la République populaire de Chine et de l’Inde, à la suite d’un réexamen
    au titre de l’expiration des mesures, effectué conformément à l’article
    11, paragraphe 2, du règlement (CE) n o 384/96
