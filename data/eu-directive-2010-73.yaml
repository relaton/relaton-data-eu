title:
- language: en
  script: Latn
  content: Directive 2010/73/EU of the European Parliament and of the Council of 24
    November 2010 amending Directives 2003/71/EC on the prospectus to be published
    when securities are offered to the public or admitted to trading and 2004/109/EC
    on the harmonisation of transparency requirements in relation to information about
    issuers whose securities are admitted to trading on a regulated market
  type: main
- language: fr
  script: Latn
  content: Directive 2010/73/UE du Parlement européen et du Conseil du 24 novembre
    2010 modifiant la directive 2003/71/CE concernant le prospectus à publier en
    cas d’offre au public de valeurs mobilières ou en vue de l’admission de valeurs
    mobilières à la négociation et la directive 2004/109/CE sur l’harmonisation
    des obligations de transparence concernant l’information sur les émetteurs
    dont les valeurs mobilières sont admises à la négociation sur un marché réglementé
  type: main
- language: de
  script: Latn
  content: Richtlinie 2010/73/EU des Europäischen Parlaments und des Rates vom 24.
    November 2010 zur Änderung der Richtlinie 2003/71/EG betreffend den Prospekt,
    der beim öffentlichen Angebot von Wertpapieren oder bei deren Zulassung zum Handel
    zu veröffentlichen ist, und der Richtlinie 2004/109/EG zur Harmonisierung der
    Transparenzanforderungen in Bezug auf Informationen über Emittenten, deren Wertpapiere
    zum Handel auf einem geregelten Markt zugelassen sind
  type: main
- language: bg
  script: Cyrl
  content: Директива 2010/73/ЕС на Европейския парламент
    и на Съвета от 24 ноември 2010 година за изменение
    на Директива 2003/71/ЕО относно проспекта, който
    следва да се публикува, когато публично се
    предлагат ценни книжа или когато се допускат
    ценни книжа до търгуване, и за изменение на
    Директива 2004/109/ЕО относно хармонизиране изискванията
    за прозрачност по отношение на информацията
    за издателите, чиито ценни книжа са допуснати
    за търгуване на регулиран пазар
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2010/73/EU ze dne 24. listopadu
    2010 , kterou se mění směrnice 2003/71/ES o prospektu, který má být zveřejněn
    při veřejné nabídce nebo přijetí cenných papírů k obchodování, a směrnice
    2004/109/ES o harmonizaci požadavků na průhlednost týkajících se informací
    o emitentech, jejichž cenné papíry jsou přijaty k obchodování na regulovaném
    trhu
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2010/73/EU af 24. november 2010
    om ændring af direktiv 2003/71/EF om det prospekt, der skal offentliggøres,
    når værdipapirer udbydes til offentligheden eller optages til handel, og af
    direktiv 2004/109/EF om harmonisering af gennemsigtighedskrav i forbindelse med
    oplysninger om udstedere, hvis værdipapirer er optaget til handel på et reguleret
    marked
  type: main
- language: el
  script: Grek
  content: Οδηγία 2010/73/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 24ης Νοεμβρίου 2010 , για
    τροποποίηση των οδηγιών 2003/71/ΕΚ σχετικά με
    το ενημερωτικό δελτίο που πρέπει να δημοσιεύεται
    κατά τη δημόσια προσφορά κινητών αξιών ή την
    εισαγωγή τους προς διαπραγμάτευση και 2004/109/ΕΚ
    για την εναρμόνιση των προϋποθέσεων διαφάνειας
    αναφορικά με την πληροφόρηση σχετικά με εκδότες
    των οποίων οι κινητές αξίες έχουν εισαχθεί
    προς διαπραγμάτευση σε ρυθμιζόμενη αγορά
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2010/73/EL, 24. november 2010
    , millega muudetakse direktiivi 2003/71/EÜ väärtpaberite üldsusele pakkumisel
    või kauplemisele lubamisel avaldatava prospekti kohta ja direktiivi 2004/109/EÜ
    läbipaistvuse nõuete ühtlustamise kohta teabele, mis kuulub avaldamisele emitentide
    kohta, kelle väärtpaberid on lubatud reguleeritud turul kauplemisele
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2010/73EU, annettu 24 päivänä
    marraskuuta 2010 , arvopapereiden yleisölle tarjoamisen tai kaupankäynnin kohteeksi
    ottamisen yhteydessä julkistettavasta esitteestä annetun direktiivin 2003/71/EY
    ja säännellyillä markkinoilla kaupankäynnin kohteeksi otettavien arvopaperien
    liikkeeseenlaskijoita koskeviin tietoihin liittyvien avoimuusvaatimusten yhdenmukaistamisesta
    annetun direktiivin 2004/109/EY muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Direktiva 2010/73/EU Europskog parlamenta i Vijeća od 24. studenoga 2010.
    o izmjeni Direktive 2003/71/EZ o prospektu koji je potrebno objaviti prilikom
    javne ponude vrijednosnih papira ili prilikom uvrštenja u trgovanje i o izmjeni
    Direktive 2004/109/EZ o usklađivanju zahtjeva za transparentnošću u vezi s
    podacima o izdavateljima čiji su vrijednosni papiri uvršteni za trgovanje na
    uređenom tržištu
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2010/73/EU irányelve ( 2010. november
    24. ) az értékpapírok nyilvános kibocsátásakor vagy piaci bevezetésekor
    közzéteendő tájékoztatóról szóló 2003/71/EK és a szabályozott piacra
    bevezetett értékpapírok kibocsátóival kapcsolatos információkra vonatkozó
    átláthatósági követelmények harmonizációjáról szóló 2004/109/EK irányelv
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2010/73/UE del Parlamento europeo e del Consiglio, del 24 novembre
    2010 , recante modifica delle direttive 2003/71/CE relativa al prospetto da pubblicare
    per l’offerta pubblica o l’ammissione alla negoziazione di strumenti finanziari
    e 2004/109/CE sull’armonizzazione degli obblighi di trasparenza riguardanti
    le informazioni sugli emittenti i cui valori mobiliari sono ammessi alla negoziazione
    in un mercato regolamentato
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2010/73/ES ( 2010. gada 24. novembris
    ), ar ko groza Direktīvu 2003/71/EK par prospektu, kurš jāpublicē, publiski
    piedāvājot vērtspapīrus vai atļaujot to tirdzniecību, un Direktīvu 2004/109/EK
    par atklātības prasību saskaņošanu attiecībā uz informāciju par emitentiem,
    kuru vērtspapīrus atļauts tirgot regulētajā tirgū
  type: main
- language: lt
  script: Latn
  content: 2010 m. lapkričio 24 d. Europos Parlamento ir Tarybos direktyva 2010/73/ES,
    kuria iš dalies keičiama Direktyva 2003/71/EB dėl prospekto, kuris turi būti
    skelbiamas, kai vertybiniai popieriai siūlomi visuomenei ar įtraukiami į prekybos
    sąrašą, ir Direktyva 2004/109/EB dėl informacijos apie emitentus, kurių vertybiniais
    popieriais leista prekiauti reguliuojamoje rinkoje, skaidrumo reikalavimų suderinimo
  type: main
- language: mt
  script: Latn
  content: Direttiva 2010/73/UE tal-Parlament Ewropew u tal-Kunsill tal- 24 ta' Novembru
    2010 li temenda d-Direttivi 2003/71/KE dwar il-prospett li għandu jiġi ppubblikat
    meta titoli jiġu offruti lill-pubbliku jew jiġu ammessi għall-kummerċ u 2004/109/KE
    dwar l-armonizzazzjoni tar-rekwiżiti ta' trasparenza f'dak li għandu x'jaqsam
    ma' informazzjoni dwar emittenti li t-titoli tagħhom huma ammessi għall-kummerċ
    f'suq regolat
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2010/73/EU van het Europees Parlement en de Raad van 24 november
    2010 tot wijziging van Richtlijn 2003/71/EG betreffende het prospectus dat gepubliceerd
    moet worden wanneer effecten aan het publiek worden aangeboden of tot de handel
    worden toegelaten en Richtlijn 2004/109/EG betreffende de transparantievereisten
    die gelden voor informatie over uitgevende instellingen waarvan effecten tot de
    handel op een gereglementeerde markt zijn toegelaten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2010/73/UE z dnia 24 listopada
    2010 r. zmieniająca dyrektywę 2003/71/WE w sprawie prospektu emisyjnego publikowanego
    w związku z publiczną ofertą lub dopuszczeniem do obrotu papierów wartościowych
    oraz dyrektywę 2004/109/WE w sprawie harmonizacji wymogów dotyczących przejrzystości
    informacji o emitentach, których papiery wartościowe dopuszczane są do obrotu
    na rynku regulowanym
  type: main
- language: pt
  script: Latn
  content: Directiva 2010/73/UE do Parlamento Europeu e do Conselho, de 24 de Novembro
    de 2010 , que altera a Directiva 2003/71/CE, relativa ao prospecto a publicar
    em caso de oferta pública de valores mobiliários ou da sua admissão à negociação,
    e a Directiva 2004/109/CE, relativa à harmonização dos requisitos de transparência
    no que se refere às informações respeitantes aos emitentes cujos valores mobiliários
    estão admitidos à negociação num mercado regulamentado
  type: main
- language: ro
  script: Latn
  content: Directiva 2010/73/UE a Parlamentului European și a Consiliului din 24
    noiembrie 2010 de modificare a Directivei 2003/71/CE privind prospectul care trebuie
    publicat în cazul unei oferte publice de valori mobiliare sau pentru admiterea
    valorilor mobiliare la tranzacționare și a Directivei 2004/109/CE privind armonizarea
    obligațiilor de transparență în ceea ce privește informația referitoare
    la emitenții ale căror valori mobiliare sunt admise la tranzacționare pe o
    piață reglementată
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2010/73/EÚ z 24. novembra 2010
    , ktorou sa menia a dopĺňajú smernice 2003/71/ES o prospekte, ktorý sa zverejňuje
    pri verejnej ponuke cenných papierov alebo ich prijatí na obchodovanie, a 2004/109/ES
    o harmonizácii požiadaviek na transparentnosť v súvislosti s informáciami
    o emitentoch, ktorých cenné papiere sú prijaté na obchodovanie na regulovanom
    trhu
  type: main
- language: sl
  script: Latn
  content: Direktiva 2010/73/EU Evropskega parlamenta in Sveta z dne 24. novembra
    2010 o spremembah direktiv 2003/71/ES o prospektu, ki se objavi ob javni ponudbi
    ali sprejemu vrednostnih papirjev v trgovanje, in 2004/109/ES o uskladitvi zahtev
    v zvezi s preglednostjo informacij o izdajateljih, katerih vrednostni papirji
    so sprejeti v trgovanje na reguliranem trgu
  type: main
- language: es
  script: Latn
  content: Directiva 2010/73/UE del Parlamento Europeo y del Consejo, de 24 de noviembre
    de 2010 , por la que se modifican la Directiva 2003/71/CE sobre el folleto que
    debe publicarse en caso de oferta pública o admisión a cotización de valores
    y la Directiva 2004/109/CE sobre la armonización de los requisitos de transparencia
    relativos a la información sobre los emisores cuyos valores se admiten a negociación
    en un mercado regulado
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2010/73/EU av den 24 november 2010
    om ändring av direktiv 2003/71/EG om de prospekt som ska offentliggöras när
    värdepapper erbjuds till allmänheten eller tas upp till handel och av direktiv
    2004/109/EG om harmonisering av insynskraven angående upplysningar om emittenter
