title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2918/78 of 12 December 1978 opening, allocating
    and providing for the administration of a Community tariff quota for ferro-chromium,
    containing not more than 0*10% by weight of carbon and more than 30% but not more
    than 90% by weight of chromium (super-refined ferro-chromium), falling within
    subheading ex 73.02 E I of the Common Customs Tariff (1979)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2918/78 du Conseil, du 12 décembre 1978, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de ferro-chrome contenant en poids 0,10 % ou moins de carbone et plus de 30 %
    jusqu' à 90 % inclus de chrome (ferro-chrome surraffiné) de la sous-position
    ex 73.02 E I du tarif douanier commun (1979)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2918/78 des Rates vom 12. Dezember 1978 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Ferrochrom mit
    einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und an
    Chrom von mehr als 30 bis 90 Gewichtshundertteilen (hochraffiniertes Ferrochrom)
    der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs (1979)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2918/78 af 12. december 1978 om åbning,
    fordeling og forvaltning af et fællesskabstoldkontingent for ferrochrom med et
    kulstofindhold på 0,10 vægtprocent eller derunder og med indhold af chrom (raffineret
    ferrochrom) på over 30%, men højst 90%, henhørende under pos. ex 73.02 E I
    i den fælles toldtarif (1979)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2918/78 del Consiglio, del 12 dicembre 1978, relativo
    all' apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di ferro-cromo contenente, in peso, lo 0,10% o meno di
    carbonio e oltre il 30% sino al 90% incluso di cromo (ferro-cromo superraffinato)
    della sottovoce ex 73.02 E I della tariffa doganale comune (1979)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2918/78 van de Raad van 12 december 1978 betreffende
    de opening,de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor ferrochroom, bevattende 0,1 of minder gewichtspercent koolstof en meer dan
    30 doch niet meer dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom),
    van postonderverdeling ex 73.02 E I van het gemeenschappelijk douanetarief (1979)
  type: main
