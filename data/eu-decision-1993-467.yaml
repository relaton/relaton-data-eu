title:
- language: en
  script: Latn
  content: '93/467/EEC: Commission Decision of 19 July 1993 authorizing Member States
    to provide for derogations from certain provisions of Council Directive 77/93/EEC,
    in respect of oak (Quercus L.) logs with bark attached, originating in Canada
    or the United States of America'
  type: main
- language: fr
  script: Latn
  content: '93/467/CEE: Décision de la Commission, du 19 juillet 1993, autorisant
    les États membres à prévoir des dérogations à certaines dispositions de la
    directive 77/93/CEE du Conseil en ce qui concerne les grumes de chêne (Quercus
    L.) avec écorce, originaires du Canada ou des États-Unis d''Amérique'
  type: main
- language: de
  script: Latn
  content: '93/467/EWG: Entscheidung der Kommission vom 19. Juli 1993 zur Ermächtigung
    der Mitgliedstaaten, für Eichenstämme (Quercus L.) mit Rinde mit Ursprung in
    Kanada oder den Vereinigten Staaten von Amerika Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates vorzusehen'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 19. července 1993, kterým se členské státy
    opravňují ke stanovení odchylek od některých ustanovení směrnice Rady 77/93/EHS
    ohledně dubové (Quercus L.) kulatiny s kůrou pocházející z Kanady a ze Spojených
    států amerických
  type: main
- language: da
  script: Latn
  content: '93/467/EØF: Kommissionens beslutning af 19. juli 1993 om bemyndigelse
    af medlemsstaterne til at indrømme undtagelser fra visse bestemmelser i Rådets
    direktiv 77/93/EØF for uafbarkede kævler af egetræ (Quercus L.) med oprindelse
    i Canada eller USA'
  type: main
- language: el
  script: Grek
  content: '93/467/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Ιουλίου 1993 που επιτρέπει στα κράτη μέλη να
    παρεκκλίνουν από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ του Συμβουλίου όσον αφορά τους μη αποφλοιωμένους
    κορμούς βελανιδιάς (Quercus L) καταγωγής Καναδά
    ή Ηνωμένων Πολιτειών Αμερικής'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 19. juuli 1993, millega lubatakse liikmesriikidel Kanadast
    või Ameerika Ühendriikidest pärit koorimata tammepalkide (Quercus L.) osas
    ette näha erandeid nõukogu direktiivi 77/93/EMÜ teatavatest sätetest
  type: main
- language: fi
  script: Latn
  content: '93/467/ETY: Komission päätös, tehty 19 päivänä heinäkuuta 1993,
    jäsenvaltioiden oikeuttamisesta säätämään poikkeuksia tiettyihin Kanadasta
    tai Amerikan yhdysvalloista peräisin olevia kuorellisia tammitukkeja (Quercus
    L.) koskevan neuvoston direktiivin 77/93/ETY säännöksiin'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1993. július 19.) a Kanadából vagy az Amerikai
    Egyesült Államokból származó, fakéreggel borított tölgyfa (Quercus L.)
    rönkre vonatkozóan a 77/93/EGK tanácsi irányelv egyes rendelkezéseitől való
    eltérésnek a tagállamok számára történő engedélyezéséről
  type: main
- language: it
  script: Latn
  content: '93/467/CEE: Decisione della Commissione, del 19 luglio 1993, che autorizza
    gli Stati membri a prevedere deroghe a determinate disposizioni della direttiva
    77/93/CEE del Consiglio per quanto riguarda i tronchi di quercia (Quercus L.)
    con corteccia originari del Canada o degli Stati Uniti d''America'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1993. gada 19. jūlijs), ar ko dalībvalstīm atļauts
    noteikt atkāpes no dažiem Padomes Direktīvas 77/93/EEK noteikumiem attiecībā
    uz ozolu (Quercus L.) apaļkokiem ar mizu, kuru izcelsmes valsts ir Kanāda vai
    Amerikas Savienotās Valstis
  type: main
- language: lt
  script: Latn
  content: 1993 m. liepos 19 d. Komisijos sprendimas, leidžiantis valstybėms narėms
    numatyti nukrypimą nuo kai kurių Tarybos direktyvos 77/93/EEB nuostatų dėl
    ąžuolo (Quercus L.) rąstų su žieve iš Kanados ir Jungtinių Amerikos Valstijų
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-19 ta' Lulju 1993 li tawtorizza lill-Istati
