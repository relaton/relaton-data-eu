    s hrastovimi (Quercus L.) hlodi z lubjem, s poreklom iz Kanade ali Združenih
    držav Amerike
  type: main
- language: es
  script: Latn
  content: '93/467/CEE: Decisión de la Comisión, de 19 de julio de 1993, por la
    que se autoriza a los Estados miembros para establecer excepciones a ciertas disposiciones
    de la Directiva 77/93/CEE del Consejo en lo que respecta a los troncos de roble
    (Quercus L.) con corteza originarios de Canadá o de Estados Unidos de América'
  type: main
- language: sv
  script: Latn
  content: '93/467/EEG: Kommissionens beslut av den 19 juli 1993 om bemyndigande för
