    tal-Kunsill 77/93/KEE, fir-rigward taz-zkuk tal-ballut (Quercus L.) li jkollhom
    il-qoxra għadha imqabbda, li ġejjin mill-Kanada jew mill-Istati Uniti ta' l-Amerika
  type: main
- language: nl
  script: Latn
  content: '93/467/EEG: Beschikking van de Commissie van 19 juli 1993 tot machtiging
    van de Lid-Staten om voor de stammen van eikehout (Quercus L.), met bast, van
    oorsprong uit Canada en de Verenigde Staten van Amerika, afwijkingen van sommige
    bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 19 lipca 1993 r. upoważniająca Państwa Członkowskie
    do ustanowienia odstępstw od niektórych przepisów dyrektywy Rady 77/93/EWG
    w odniesieniu do kłód dębowych (Quercus L.) z korą pochodzących z Kanady
    lub Stanów Zjednoczonych Ameryki
  type: main
- language: pt
  script: Latn
  content: '93/467/CEE: Decisão da Comissão, de 19 de Julho de 1993, que autoriza
    os Estados-membros a prever derrogações a certas normas da Directiva 77/93/CEE
    do Conselho relativamente aos toros de carvalho (Quercus L.) com casca, originários
    do Canadá ou dos Estados Unidos da América'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 19. júla 1993, ktoré oprávňuje členské štáty
    ustanoviť výnimky z určitých ustanovení smernice Rady 77/93/EHS, pokiaľ
    ide o dubovú (Quercus L.) guľatinu s kôrou, pochádzajúcu z Kanady alebo Spojených
    štátov amerických
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 19. julija 1993 o pooblastilih državam članicam,
