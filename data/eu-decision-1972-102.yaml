title:
- language: en
  script: Latn
  content: '72/102/EEC: Commission Decision of 4 February 1972 authorizing the Federal
    Republic of Germany to offer rye of bread-making quality held by the German intervention
    agency to a marketing centre at which it has not been stored (Only the German
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '72/102/CEE: Décision de la Commission, du 4 février 1972, autorisant
    la République fédérale d''Allemagne à offrir du seigle panifiable détenu
    par l''organisme d''intervention allemand, pour un centre de commercialisation
    où il n''est pas entreposé (Le texte en langue allemande est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '72/102/EWG: Entscheidung der Kommission vom 4. Februar 1972 zur Ermächtigung
    der Bundesrepublik Deutschland, Brotroggen im Besitz der deutschen Interventionsstelle
    für einen Handelsplatz anzubieten, an dem er nicht gelagert ist (Nur der deutsche
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '72/102/EØF: /* Kommissionens beslutning af 4. februar 1972 om bemyndigelse
    af Forbundsrepublikken Tyskland til at tilbyde brødrug, som det tyske interventionsorgan
    ligger inde med, til et salgscenter, hvor det ikke vil blive oplagret */ (Kun
    den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '72/102/CEE: Decisione della Commissione, del 4 febbraio 1972, che autorizza
    la Repubblica federale di Germania ad offrire segala da panificazione, detenuta
    dall''organismo d''intervento tedesco, per un centro di commercializzazione in
    cui non è immagazzinata (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '72/102/EEG: Beschikking van de Commissie van 4 februari 1972 waarbij de
    Bondsrepubliek Duitsland gemachtigd wordt voor de broodbakkerij geschikte rogge,
    in het bezit van het Duitse interventiebureau, aan te bieden voor een handelscentrum
    waar deze niet is opgeslagen (Slechts de tekst in de Duitse taal is authentiek)'
