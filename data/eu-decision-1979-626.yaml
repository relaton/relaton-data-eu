id: EUDecision1979626
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/626/EEC: Commission Decision of 18 June 1979 authorizing the French
    Republic not to apply Community treatment to umbrellas and sunshades (including
    walking- stick umbrellas, umbrella tents, and garden and similar umbrellas), falling
    within heading No 66.01 of the Common Customs Tariff, originating in Hong Kong
    and in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/626/CEE: Décision de la Commission, du 18 juin 1979, autorisant la
    République française à exclure du traitement communautaire les parapluies,
    parasols et ombrelles, y compris les parapluies-cannes et parasols- tentes et
    similaires, de la position 66.01 du tarif douanier commun, originaires de Hong-kong
    et mis en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/626/EWG: Entscheidung der Kommission vom 18. Juni 1979, mit der die
    Französische Republik ermächtigt wird, aus Hongkong stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Regenschirme und Sonnenschirme,
    einschließlich Stockschirme, Schirmzelte und dergleichen, der Tarifnummer 66.01
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/626/EØF: Kommissionens beslutning af 18. juni 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage shorts og andre
    korte benklæder herunder stokkeparaplyer, paraplytelte, haveparasoller og lignende,
    som henhører under pos. 66.01 i den fælles toldtarif, har oprindelse i Hongkong
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/626/CEE: Decisione della Commissione, del 18 giugno 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli ombrelli,
    compresi gli ombrelli-bastone, i parasole-tende, gli ombrelloni e simili, della
    voce 66.01 della tariffa doganale comune, originari di Hong Kong e messi in libera
    pratica negli altri Stati membri (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/626/EEG: Beschikking van de Commissie van 18 juni 1979 waarbij de Franse
    Republiek wordt gemachtigd paraplu''s en parasols, alsmede wandelstokparaplu''s,
    tuinparasols, parasoltenten en dergelijke, van post 66.01 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Franse taal is authentiek)'
  type: main
