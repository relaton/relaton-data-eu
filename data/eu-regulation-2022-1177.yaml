  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1177 of 7 July 2022 amending
    Implementing Regulation (EU) 2020/683 by introducing and updating, in the templates
    for the information document and certificate of conformity in paper format, the
    entries as regards certain safety systems, and adjusting the numbering system
    for the approval certificates for a type of vehicle, system, component or separate
    technical unit
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1177 de la Commission du 7 juillet
    2022 modifiant le règlement d’exécution (UE) 2020/683 en introduisant et en
    actualisant les modèles de la fiche de renseignements et du certificat de conformité
    sur support papier, les entrées concernant certains systèmes de sécurité,
    et en ajustant le système de numérotation des fiches de réception pour un type
    de véhicule, de système, de composant ou d’entité technique distincte
