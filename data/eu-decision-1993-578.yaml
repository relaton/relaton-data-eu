    structural assistance in Ireland on the improvement of the conditions under which
    agricultural products are processed and marketed (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/578/CEE: Décision de la Commission du 29 octobre 1993 modifiant la
    décision 91/650/CEE concernant l''établissement de l''avenant au cadre communautaire
    d''appui pour les interventions structurelles communautaires en Irlande en matière
    d''amélioration des conditions de transformation et de commercialisation des
    produits agricoles (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
