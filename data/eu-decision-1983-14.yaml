title:
- language: en
  script: Latn
  content: '83/14/EEC: Commission Decision of 11 January 1983 authorizing Italy temporarily
    to take additional measures to protect itself against the introduction of Erwinia
    amylovora (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/14/CEE: Décision de la Commission du 11 janvier 1983 autorisant l''Italie
    à prendre provisoirement des dispositions complémentaires en vue de se préserver
    contre l''introduction d''"Erwinia amylovora" (Le texte en langue italienne est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/14/EWG: Entscheidung der Kommission vom 11. Januar 1983 zur Ermächtigung
    Italiens, vorübergehend ergänzende Maßnahmen zum Schutz gegen die Einschleppung
    von Erwinia amylovora zu treffen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/14/EØF: Kommissionens beslutning af 11. januar 1983 om bemyndigelse
    af Italien til at træffe midlertidige supplerende foranstaltninger til beskyttelse
    mod indslæbning af Erwinia amylovora (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/14/ΕΟΚ: Απόφαση της Επιτροπής της 11ης Ιανουαρίου
    1983 που επιτρέπει στην Ιταλία να λάβει προσωρινά
    συμπληρωματικά μέτρα για να προστατευθεί από
    την εισαγωγή της Erwinia Amylovora (Το κείμενο στην
    ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/14/CEE: Decisione della Commissione dell''11 gennaio 1983 che autorizza
    l''Italia ad adottare provvisoriamente disposizioni complementari per premunirsi
    contro l''introduzione di Erwinia amylovora (Il testo in lingua italiana è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/14/EEG: Beschikking van de Commissie van 11 januari 1983 tot machtiging
    van Italië om voorlopig aanvullende maatregelen te nemen ten einde het binnenbrengen
    op zijn grondgebied van Erwinia amylovora tegen te gaan (Slechts de tekst in de
    Italiaanse taal is authentiek)'
  type: main
