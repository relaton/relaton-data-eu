  script: Latn
  content: '2002/270/EC: Commission Decision of 9 April 2002 amending Decisions 93/24/EEC,
    93/244/EEC and 2001/618/EC as regards the list of Member States and regions free
    of Aujeszky''s disease and regions where approved Aujeszky''s disease eradication
    programmes are in place (Text with EEA relevance) (notified under document number
    C(2002) 1326)'
  type: main
- language: fr
  script: Latn
  content: '2002/270/CE: Décision de la Commission du 9 avril 2002 modifiant les
    décisions 93/24/CEE, 93/244/CEE et 2001/618/CE en ce qui concerne la liste des
    territoires des États membres ou des régions des États membres indemnes de
    la maladie d''Aujeszky ainsi que des régions où des programmes agréés d''éradication
    de la maladie d''Aujeszky sont en place (Texte présentant de l''intérêt pour
    l''EEE) [notifiée sous le numéro C(2002) 1326]'
  type: main
