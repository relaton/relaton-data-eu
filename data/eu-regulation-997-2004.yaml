title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 997/2004 of 17 May 2004 amending Commission
    Decision No 2730/2000/ECSC on imports of coke of coal in pieces with a diameter
    of more than 80 mm originating in the People's Republic of China and terminating
    the interim review of the anti-dumping measures imposed thereby
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 997/2004 du Conseil du 17 mai 2004 modifiant la décision
    n° 2730/2000/CECA de la Commission concernant les importations de coke d'un diamètre
    de plus de 80 millimètres originaire de la République populaire de Chine et
    clôturant le réexamen intermédiaire des mesures antidumping instituées par
    cette décision
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 997/2004 des Rates vom 17. Mai 2004 zur Änderung der
    Entscheidung Nr. 2730/2000/EGKS der Kommission betreffend die Einfuhren von Koks
    aus Steinkohle in Stücken mit einem Durchmesser von mehr als 80 mm mit Ursprung
    in der Volksrepublik China und zur Einstellung der Interimsüberprüfung betreffend
    die mit dieser Entscheidung eingeführten Antidumpingmaßnahmen
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 997/2004 ze dne 17. května 2004, kterým se
    mění rozhodnutí Komise č. 2730/2000/ESUO o dovozech koksu z uhlí uhlí v
    kusech o průměru větším než 80 mm pocházejícího z Čínské lidové republiky
    a kterým se ukončuje prozatímní přezkum konečných antidumpingových opatření
    uložených tímto rozhodnutím
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 997/2004 af 17. maj 2004 om ændring af Kommissionens
    beslutning nr. 2730/2000/EKSF om importen af koks i stykker med en diameter på
    over 80 mm med oprindelse i Folkerepublikken Kina og afslutning af interimsundersøgelsen
    af de herved indførte antidumpingforanstaltninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 997/2004 του Συμβουλίου,
    της 17ης Μαΐου 2004, για την τροποποίηση της απόφασης
    αριθ. 2730/2000/ΕΚΑΧ της Επιτροπής σχετικά με τις
    εισαγωγές τεμαχίων οπτάνθρακα με διάμετρο
    μεγαλύτερη των 80 mm, καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας, και για την περάτωση της ενδιάμεσης
    επανεξέτασης των μέτρων αντιντάμπινγκ που
    επιβλήθηκαν με αυτή την απόφαση
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 997/2004, 17. mai 2004, millega muudetakse komisjoni
    otsust nr 2730/2000/ESTÜ Hiina Rahvavabariigist pärineva kivisöekoksi, tüki
    läbimõõduga üle 80 mm, impordi kohta ja millega lõpetatakse nimetatud otsuses
    kehtestatud dumpinguvastaste meetmete vahepealne läbivaatamine
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 997/2004, annettu 17 päivänä toukokuuta 2004,
    Kiinan kansantasavallasta peräisin olevan, läpimitaltaan yli 80 millimetrin
    kappaleina olevan kivihiilikoksin tuonnista tehdyn komission päätöksen N:o
    2730/2000/EHTY muuttamisesta ja sillä käyttöönotettuja polkumyyntitoimenpiteitä
    koskevan välivaiheen tarkastelun päättämisestä
  type: main
- language: hu
  script: Latn
  content: A Tanács 997/2004/EK rendelete (2004. május 17.) a 80 mm-nél nagyobb
    átmérőjű darabos kokszszén Kínai Népköztársaságból való behozataláról
    szóló 2730/2000/ESZAK bizottsági határozat módosításáról, valamint az
    az által bevezetett dömpingellenes intézkedések időközi felülvizsgálatának
    megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 997/2004 del Consiglio, del 17 maggio 2004, che modifica
    la decisione n. 2730/2000/CECA della Commissione sulle importazioni di coke di
    carbone in pezzi di diametro superiore a 80 mm originario della Repubblica popolare
    cinese e chiude il riesame intermedio delle misure antidumping istituite da detta
    decisione
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 997/2004 (2004. gada 17. maijs), ar ko groza Komisijas
    Lēmumu Nr. 2730/2000/EOTK par koksa ogļu importu gabalos ar diametru, kas lielāks
    par 80 mm, un kuru izcelsme ir Ķīnas Tautas Republikā, un pārtrauc ar šo
    lēmumu ieviesto antidempinga pasākumu starpposma pārbaudi
  type: main
- language: lt
  script: Latn
  content: 2004 m. gegužės 17 d. Tarybos reglamentas (EB) Nr. 997/2004 iš dalies
    keičiantis Komisijos sprendimą Nr. 2730/2000/EAPB dėl didesniais nei 80 mm
    diametro gabalais importuojamo anglių kokso, kurio kilmės šalis yra Kinijos
    Liaudies Respublika, ir nutraukiančio juo nustatytų antidempingo priemonių
    tarpinę peržiūrą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 997/2004 tas- 17 ta' Mejju 2004 li jemenda
    d-Deċiżjoni tal-Kummissjoni Nru 2730/2000/KEFA dwar importazzjonijiet ta' kokk
    tal-faħam f'biċċiet ta' dijametru ta' aktar minn 80 mm li joriġinaw fir-Repubblika
    tal-Poplu taċ-Ċina u li jtemm ir-reviżjoni interim tal-miżuri ta' anti-dumping
    imposti permezz tagħha
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 997/2004 van de Raad van 17 mei 2004 tot wijziging
    van Beschikking nr. 2730/2000/EGKS van de Commissie op de invoer van cokes van
    steenkool in stukken met een diameter van meer dan 80 mm uit de Volksrepubliek
    China en beëindiging van de tussentijdse herziening van de daarbij ingestelde
    antidumpingmaatregelen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 997/2004 z dnia 17 maja 2004 r. zmieniające
    decyzję Komisji nr 2730/2000/EWWiS w sprawie przywozu koksu węglowego w kawałkach
    o średnicy większej niż 80 mm pochodzącego z Chińskiej Republiki Ludowej
    oraz kończącego tymczasowy przegląd środków antydumpingowych nałożonych
    na jego mocy
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 997/2004 do Conselho, de 17 de Maio de 2004, que
    altera a Decisão n.° 2730/2000/CECA da Comissão, relativa às importações
    de coque com granulometria superior a 80 mm, originário da República Popular
    da China e que encerra o reexame intercalar das medidas anti-dumping instituídas
    por essa decisão
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 997/2004 z 17. mája 2004, ktorým sa mení a
    dopĺňa rozhodnutie Komisie č. 2730/2000/ESUO o dovozoch uhoľného koksu v
    kusoch s priemerom väčším ako 80 mm s pôvodom v Čínskej ľudovej republike
    a o ukončení predbežného preskúmania antidumpingových opatrení uložených
    na základe tohto rozhodnutia
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 997/2004 z dne 17. maja 2004 o spremembi Odločbe
    Komisije št. 2730/2000/ESPJ o uvozu koksa iz črnega premoga v kosih s premerom
    več kot 80 mm s poreklom iz Ljudske republike Kitajske in o prekinitvi vmesnega
    pregleda protidampinških ukrepov, uvedenih s to odločbo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 997/2004 del Consejo, de 17 de mayo de 2004, por el
    que se modifica la Decisión n° 2730/2000/CECA de la Comisión relativa a las
    importaciones de coque de carbón en trozos de más de 80 mm de diámetro originarias
    de la República Popular China y por el que se concluye la reconsideración provisional
    de las medidas antidumping impuestas por ella
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 997/2004 av den 17 maj 2004 om ändring av
    beslut nr 2730/2000/EKSG om import av koks av stenkol i bitar med en diameter
    över 80 mm med ursprung i Folkrepubliken Kina och om avslutning av den interimsöversyn
    av antidumpningsåtgärderna som skall göras enligt det beslutet
  type: main
