    der Fischereiressourcen im Regelungsbereich des Übereinkommens über die zukünftige
    multilaterale Zusammenarbeit auf dem Gebiet der Fischerei im Nordwestatlantik
    (1996)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1167/96 af 25. juni 1996 om anden ændring
