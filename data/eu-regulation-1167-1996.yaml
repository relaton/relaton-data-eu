title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1167/96 of 25 June 1996 amending, for the second
    time, Regulation (EC) No 3090/95 laying down for 1996 certain conservation and
    management measures for fishery resources in the Regulatory Area as defined in
    the Convention on Future Multilateral Cooperation in the North West Atlantic Fisheries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1167/96 du Conseil du 25 juin 1996 modifiant, pour la
    deuxième fois, le règlement (CE) nº 3090/95 fixant, pour 1996, certaines mesures
    de conservation et de gestion des ressources halieutiques de la zone de réglementation
    définie dans la convention sur la future coopération multilatérale dans les
    pêches de l'Atlantique du Nord-Ouest
  type: main
- language: de
  script: Latn
