    och klassificering för drivhjulsdäck för regummerade däck, vad gäller förslag
    till ändringar av globala tekniska FN-föreskrifter nr 9, 13, 21, 22 och 24 och
    vad gäller ett förslag till ändring av ömsesidig FN-resolution nr 1
