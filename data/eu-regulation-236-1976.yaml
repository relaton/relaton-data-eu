  content: Council Regulation (EEC) No 236/76 of 3 February 1976 maintaining in effect
    the interim measures adopted with regard to imports of certain textile products
    originating in the Federal Republic of Brazil
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 236/76 du Conseil, du 3 février 1976, portant maintien
