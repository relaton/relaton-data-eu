title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 80/93 of 18 January 1993 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Argentina must be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 80/93 de la Commission, du 18 janvier 1993, fixant le
