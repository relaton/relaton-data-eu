    ubytovacího zařízení (timeshare), o dlouhodobých rekreačních produktech,
    o dalším prodeji a o výměně
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2008/122/EF af 14. januar 2009
    om beskyttelse af forbrugerne i forbindelse med visse aspekter ved timeshareaftaler,
