    timeshare, long-term holiday product, resale and exchange contracts
  type: main
- language: fr
  script: Latn
  content: Directive 2008/122/CE du Parlement européen et du Conseil du 14 janvier
    2009 relative à la protection des consommateurs en ce qui concerne certains aspects
    des contrats d’utilisation de biens à temps partagé, des contrats de produits
    de vacances à long terme et des contrats de revente et d’échange
  type: main
- language: de
  script: Latn
  content: Richtlinie 2008/122/EG des Europäischen Parlaments und des Rates vom 14.
