    2011 imposant des conditions particulières à l’importation de denrées alimentaires
    et d’aliments pour animaux originaires ou en provenance du Japon à la suite
    de l’accident survenu à la centrale nucléaire de Fukushima et abrogeant le
    règlement (UE) n ° 297/2011
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 961/2011 der Kommission vom 27. September
    2011 zum Erlass von Sondervorschriften für die Einfuhr von Lebens- und Futtermitteln,
    deren Ursprung oder Herkunft Japan ist, nach dem Unfall im Kernkraftwerk Fukushima
    und zur Aufhebung der Verordnung (EU) Nr. 297/2011
  type: main
- language: bg
