title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 961/2011 of 27 September 2011
    imposing special conditions governing the import of feed and food originating
    in or consigned from Japan following the accident at the Fukushima nuclear power
    station and repealing Regulation (EU) No 297/2011
  type: main
- language: fr
  script: Latn
