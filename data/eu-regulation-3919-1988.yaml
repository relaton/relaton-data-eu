title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3919/88 of 15 December 1988 laying down
    detailed rules for applying the quota for imports into Portugal of live swine
    from the Community as constituted on 31 December 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3919/88 de la Commission du 15 décembre 1988 fixant
    des modalités d'application du contingent applicable à l'importation au Portugal
    d'animaux vivants de l'espèce porcine en provenance de la Communauté dans sa
    composition au 31 décembre 1985
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3919/88 DER KOMMISSION vom 15. Dezember 1988 zur Festlegung
    der Durchfuehrungsbestimmungen fuer das in Portugal anwendbare Kontingent fuer
    die Einfuhr von lebenden Schweinen aus der Gemeinschaft in ihrer Zusammensetzung
    am 31. Dezember 1985
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3919/88 af 15. december 1988 om fastsættelse
    af gennemførelsesbestemmelserne for kontingentet for indførsel til Portugal
    af levende svin fra Fællesskabet i dets sammensætning pr. 31. december 1985
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3919/88 της Επιτροπής
    της 15ης Δεκεμβρίου 1988 που καθορίζει τις λεπτομέρειες
    εφαρμογής της ποσόστωσης που εφαρμόζεται κατά
    την εισαγωγή στην Πορτογαλία ζωντανών χοιροειδών
    προελεύσεως Κοινότητας, με τη σύνθεσή της στις
    31 Δεκεμβρίου 1985
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3919/88 DELLA COMMISSIONE del 15 dicembre 1988 che
    stabilisce le modalità di applicazione del contingente applicabile in Portogallo
    per gli animali vivi della specie suina provenienti dalla Comunità nella sua
    composizione al 31 dicembre 1985
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3919/88 VAN DE COMMISSIE van 15 december 1988 tot
    vaststelling van de uitvoeringsbepalingen inzake het contingent dat door Portugal
    voor levende varkens van herkomst uit de Gemeenschap in haar samenstelling op
    31 december 1985 mag worden toegepast
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3919/88 DA COMISSAO de 15 de Dezembro de 1988 que
    fixa as modalidades de aplicaçao do contingente aplicavel à importaçao em Portugal
    de animais vivos da espécie suina provenientes da Comunidade na sua composiçao
    em 31 de Dezembro de 1985
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3919/88 DE LA COMISION de 15 de diciembre de 1988 por
    el que se establecen las modalidades de aplicacion del contingente aplicable a
    las importaciones en Portugal de animales vivos de la especie porcina procedentes
    de la Comunidad en su composicion del 31 de diciembre de 1985
  type: main
