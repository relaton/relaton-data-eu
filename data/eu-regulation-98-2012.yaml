title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 98/2012 of 7 February 2012 concerning
    the authorisation of 6-phytase (EC 3.1.3.26) produced by Pichia pastoris (DSM
    23036) as a feed additive for chickens and turkeys for fattening, chickens reared
    for laying, turkeys reared for breeding, laying hens, other avian species for
    fattening and laying, weaned piglets, pigs for fattening and sows (holder of authorisation
    Huvepharma AD)
  type: main
