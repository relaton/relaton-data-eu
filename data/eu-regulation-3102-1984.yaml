title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3102/84 of 7 November 1984 fixing for the
    1984/85 marketing year the Community offer price for mandarins including tangerines
    and satsumas, Wilkings and other similar citrus hybrids, with the exception of
    clementines, applicable as regards Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3102/84 de la Commission du 7 novembre 1984 fixant,
    pour la campagne 1984/1985, le prix d' offre communautaire valable pour les mandarines,
    y compris tangerines et satsumas, wilkings et autres hybrides similaires d' agrumes,
    à l' exclusion des clémentines, applicable vis-à-vis de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3102/84 der Kommission vom 7. November 1984 zur Festsetzung
    des Angebotspreises der Gemeinschaft für Mandarinen, einschließlich Tangerinen
    und Satsumas, Wilkings und andere ähnliche Kreuzungen von Zitrusfrüchten, ausgenommen
    Clementinen, gegenüber Griechenland für das Wirtschaftsjahr 1984/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3102/84 af 7. november 1984 om fastsættelse
    for produktionsåret 1984/85 for så vidt angår Grækenland af fællesskabstilbudsprisen
    på mandariner (herunder tangeriner og satsumas), wilkings og andre lignende krydsninger
    af citrusfrugter bortset fra clementiner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3102/84 της Επιτροπής
