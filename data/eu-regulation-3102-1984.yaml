    περίοδο εμπορίας 1984/85, της ισχύουσας κοινοτικής
    τιμής προσφοράς για τα μανταρίνια, συμπεριλαμβανομένων
    των tangerines, satsumas, wilkings και άλλων παρόμοιων υβριδίων
    εσπεριδοειδών, εξαιρέσει των κλημεντινών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3102/84 della Commissione del 7 novembre 1984 che
    fissa, per la campagna 1984/1985, il prezzo d' offerta comunitario applicabile
    nei confronti della Grecia per i mandarini, compresi i tangerini e i mandarini
    satsuma (o sazuma), wilkings e altri simili ibridi di agrumi, escluse le clementine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3102/84 van de Commissie van 7 november 1984 tot
    vaststelling, voor het verkoopseizoen 1984/1985, van de ten aanzien van Griekenland
    toe te passen communautaire aanbiedingsprijs voor mandarijnen, tangerines en satsuma'
    s daaronder begrepen, wilkings en andere dergelijke kruisingen van citrusvruchten,
    met uitzondering van clementines
