id: EURegulation7492011
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 749/2011 of 29 July 2011 amending Regulation
    (EU) No 142/2011 implementing Regulation (EC) No 1069/2009 of the European Parliament
    and of the Council laying down health rules as regards animal by-products and
    derived products not intended for human consumption and implementing Council Directive
    97/78/EC as regards certain samples and items exempt from veterinary checks at
    the border under that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 749/2011 de la Commission du 29 juillet 2011 modifiant
    le règlement (UE) n o 142/2011 portant application du règlement (CE) n o 1069/2009
    du Parlement européen et du Conseil établissant des règles sanitaires applicables
    aux sous-produits animaux et produits dérivés non destinés à la consommation
    humaine et portant application de la directive 97/78/CE du Conseil en ce qui concerne
    certains échantillons et articles exemptés des contrôles vétérinaires effectués
    aux frontières en vertu de cette directive
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 749/2011 der Kommission vom 29. Juli 2011 zur Änderung
    der Verordnung (EU) Nr. 142/2011 zur Durchführung der Verordnung (EG) Nr. 1069/2009
    des Europäischen Parlaments und des Rates mit Hygienevorschriften für nicht
    für den menschlichen Verzehr bestimmte tierische Nebenprodukte sowie zur Durchführung
    der Richtlinie 97/78/EG des Rates hinsichtlich bestimmter gemäß der genannten
    Richtlinie von Veterinärkontrollen an der Grenze befreiter Proben und Waren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 749/2011 на Комисията от 29
    юли 2011 година за изменение на Регламент (ЕС)
    № 142/2011 на Комисията за прилагане на Регламент
    (ЕО) № 1069/2009 на Европейския парламент и на Съвета
    за установяване на здравни правила относно
    странични животински продукти и производни
    продукти, непредназначени за консумация от
    човека, и за прилагане на Директива 97/78/ЕО на
    Съвета по отношение на някои проби и артикули,
    освободени от ветеринарни проверки на границата
    съгласно посочената директива
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 749/2011 ze dne 29. července 2011 , kterým
    se mění nařízení (EU) č. 142/2011, kterým se provádí nařízení Evropského
    parlamentu a Rady (ES) č. 1069/2009 o hygienických pravidlech pro vedlejší
    produkty živočišného původu a získané produkty, které nejsou určeny k
    lidské spotřebě, a provádí směrnice Rady 97/78/ES, pokud jde o určité
    vzorky a předměty osvobozené od veterinárních kontrol na hranici podle uvedené
    směrnice
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 749/2011 af 29. juli 2011 om ændring
    af forordning (EU) nr. 142/2011 om gennemførelse af Europa-Parlamentets og Rådets
    forordning (EF) nr. 1069/2009 om sundhedsbestemmelser for animalske biprodukter
    og afledte produkter, som ikke er bestemt til konsum, og om gennemførelse af
    Rådets direktiv 97/78/EF for så vidt angår visse prøver og genstande, der
    er fritaget for veterinærkontrol ved grænsen som omhandlet i samme direktiv
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 749/2011 της Επιτροπής,
