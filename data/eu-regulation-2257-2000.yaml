title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2257/2000 of 11 October 2000 amending Regulation
    (EC) No 1451/2000 increasing to 200 000 tonnes the quantity of common wheat of
    breadmaking quality held by the French intervention agency for which a standing
    invitation to tender for export to certain ACP countries has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2257/2000 de la Commission du 11 octobre 2000 modifiant
    le règlement (CE) n° 1451/2000 et portant à 200 000 tonnes l'adjudication permanente
    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    français et destiné à être exporté vers certains pays ACP
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2257/2000 der Kommission vom 11. Oktober 2000 zur Änderung
    der Verordnung (EG) Nr. 1451/2000 und zur Erhöhung der Dauerausschreibung zur
    Ausfuhr in bestimmte AKP-Länder von im Besitz der französischen Interventionsstelle
    befindlichem Brotweichweizen auf 200 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2257/2000 af 11. oktober 2000 om ændring
    af forordning (EF) nr. 1451/2000 og om forhøjelse til 200 000 tons af den løbende
    licitation med henblik på eksport til en række AVS-lande af bageegnet blød
    hvede som er i det franske interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2257/2000 της Επιτροπής,
    της 11ης Οκτωβρίου 2000, για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1451/2000 και για έναρξη διαρκούς διαγωνισμού
    για εξαγωγή 200 000 τόνων μαλακού αρτοποιήσιμου
    σίτου που έχει στη διάθεσή του ο γαλλικός οργανισμός
    παρέμβασης και ο οποίος προορίζεται για εξαγωγή
    προς ορισμένες χώρες ΑΚΕ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2257/2000, annettu 11 päivänä lokakuuta 2000,
    asetuksen (EY) N:o 1451/2000 muuttamisesta ja Ranskan interventioelimen hallussaan
    pitämän leipävehnän vientiä tiettyihin AKT-maihin koskevan pysyvän tarjouskilpailun
    kohteena olevan määrän nostamisesta 200 000 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2257/2000 della Commissione, dell'11 ottobre 2000,
    che modifica il regolamento (CE) n. 1451/2000 e che porta a 200 000 tonnellate
    il quantitativo globale oggetto della gara permanente per l'esportazione in alcuni
    paesi ACP di frumento tenero panificabile detenuto dall'organismo d'intervento
    francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2257/2000 van de Commissie van 11 oktober 2000 tot
    wijziging van Verordening (EG) nr. 1451/2000, teneinde de hoeveelheid waarop de
    permanente openbare inschrijving voor de uitvoer naar sommige ACS-landen van zachte
    tarwe van bakkwaliteit uit Franse interventievoorraden betrekking heeft, tot 200
    000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2257/2000 da Comissão, de 11 de Outubro de 2000,
    que altera o Regulamento (CE) n.° 1451/2000 e eleva a 200 000 toneladas o concurso
    permanente para a exportação para determinados países ACP de trigo mole panificável
    detido pelo organismo de intervenção francês
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2257/2000 de la Comisión, de 11 de octubre de 2000,
    por el que se modifica el Reglamento (CE) n° 1451/2000 y se eleva a 200 000 toneladas
    la licitación permanente para la exportación a determinados países ACP de trigo
    blando panificable en poder del organismo de intervención francés
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2257/2000 av den 11 oktober 2000 om ändring
    av förordning (EG) nr 1451/2000 och om höjning till 200 000 ton av den stående
    anbudsinfordran för export till vissa AVS-länder av vete av brödkvalitet som
    innehas av det franska interventionsorganet
  type: main
