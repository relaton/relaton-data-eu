title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2822/78 of 30 November 1978 establishing
    the list of authorized vine varieties which may be used for new plantings and
    replantings under Regulation (EEC) No 1162/76 and establishing other detailed
    rules for the application of that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2822/78 de la Commission, du 30 novembre 1978, établissant
    la liste des variétés de vigne autorisées pouvant être utilisées pour les
    plantations nouvelles et les replantations en vertu du règlement (CEE) n° 1162/76
    et portant d' autres modalités d' application de ce règlement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2822/78 der Kommission vom 30. November 1978 zur Aufstellung
    des Verzeichnisses der zugelassenen Rebsorten, die aufgrund der Verordnung (EWG)
    Nr. 1162/76 für Neuanpflanzungen und Wiederbepflanzungen verwendet werden dúrfen,
    und weitere Durchfúhrungsbestimmungen zu dieser Verordnung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2822/78 af 30. november 1978 om oprettelse
    af en fortegnelse over godkendte vinstoksorter, der må anvendes til nyplantning
    og genbeplantning i henhold til forordning (EØF) nr. 1162/76 og om andre gennemførelsesbestemmelser
    til denne forordning
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2822/78 della Commissione, del 30 novembre 1978, che
    stabilisce l' elenco delle varietà di viti autorizzate utilizzabili per i nuovi
    impianti e i reimpianti, in virtù del regolamento (CEE) n. 1162/76, e reca altre
    modalità d' applicazione di detto regolamento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2822/78 van de Commissie van 30 november 1978 tot
    vaststelling van de lijst van de toegestane wijnstokrassen die mogen worden gebruikt
    voor aanplant en herbeplanting overeenkomstig Verordening (EEG) nr. 1162/76 tevens
    houdende andere bepalingen voor de toepassing van die verordening
  type: main
