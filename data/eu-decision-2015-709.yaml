---
id: EUDecision2015709
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2015/709 of 21 April 2015 on the position to be adopted
    on behalf of the European Union within the EU-Turkey Association Council as regards
    the replacement of Protocol 3 to Decision No 1/98 of the EC-Turkey Association
    Council on the trade regime for agricultural products, concerning the definition
    of the concept of ‘originating products’ and methods of administrative cooperation,
    by a new protocol which, as regards the rules of origin, refers to the Regional
    Convention on pan-Euro-Mediterranean preferential rules of origin
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/709 du Conseil du 21 avril 2015 relative à la position
    à adopter au nom de l'Union européenne au sein du conseil d'association UE-Turquie
    en ce qui concerne le remplacement du protocole n° 3 de la décision n° 1/98
    du conseil d'association CE-Turquie concernant le régime de commerce pour les
    produits agricoles, relatif à la définition de la notion de «produits originaires»
    et aux méthodes de coopération administrative par un nouveau protocole qui,
    pour ce qui est des règles d'origine, fait référence à la convention régionale
    sur les règles d'origine préférentielles paneuro-méditerranéennes
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2015/709 des Rates vom 21. April 2015 über den Standpunkt,
    der im Namen der Europäischen Union im Assoziationsrat EU-Türkei im Hinblick
    auf die Ersetzung des Protokolls Nr. 3 des Beschlusses Nr. 1/98 des Assoziationsrats
    EG-Türkei über die Handelsregelung für Agrarerzeugnisse über die Bestimmung
    des Begriffs „Erzeugnisse mit Ursprung in“ oder „Ursprungserzeugnisse“
    und die Methoden der Zusammenarbeit der Verwaltungen durch ein neues Protokoll,
    das hinsichtlich der Ursprungsregeln auf das Regionale Übereinkommen über Pan-Europa-Mittelmeer-Präferenzursprungsregeln
    Bezug nimmt, zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2015/709 на Съвета от 21 април 2015
    година относно позицията, която да бъде приета
    от името на Европейския съюз в рамките на Съвета
    за асоцииране ЕС — Турция във връзка със замяната
    на протокол 3 към Решение № 1/98 на Съвета за
    асоцииране ЕО — Турция относно търговския
    режим за селскостопански продукти относно
    определението на понятието „продукти с произход“
    и методите на административно сътрудничество
    с нов протокол, в който по отношение на правилата
    за произход се прави препратка към Регионалната
    конвенция за паневросредиземноморските преференциални
    правила за произход
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2015/709 ze dne 21. dubna 2015 o postoji, který
    má být zaujat jménem Evropské uniev Radě přidružení EU-Turecko, pokud
    jde o nahrazení protokolu č. 3 k rozhodnutí Rady přidružení EU-Turecko č.
    1/98 o obchodním režimu pro zemědělské produkty týkajícího se definice
    pojmu „původní produkty“ a metod správní spolupráce novým protokolem,
    který, pokud jde o pravidla původu, odkazuje na Regionální úmluvu o celoevropsko-středomořských
    preferenčních pravidlech původu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2015/709 af 21. april 2015 om den holdning, der
    skal indtages på vegne af Den Europæiske Union i associeringsrådet EU-Tyrkiet,
    om at erstatte protokol 3 til afgørelse nr. 1/98 truffet af associeringsrådet
    EF-Tyrkiet om handelsordningen for landbrugsprodukter, som vedrører definitionen
    af begrebet »produkter med oprindelsesstatus« og metoder for administrativt
    samarbejde, med en ny protokol, hvori der for så vidt angår oprindelsesreglerne
    henvises til den regionale konvention om pan-Euro-Middelhavsregler for præferenceoprindelse
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2015/709 του Συμβουλίου, της 21ης
    Απριλίου 2015, σχετικά με τη θέση που πρέπει να
    υιοθετηθεί εξ ονόματος της Ευρωπαϊκής Ένωσης
    στο πλαίσιο του Συμβουλίου Σύνδεσης ΕΕ-Τουρκίας
    όσον αφορά την αντικατάσταση του πρωτοκόλλου
    3 της απόφασης αριθ. 1/98 του Συμβουλίου Σύνδεσης
    ΕΚ-Τουρκίας περί του καθεστώτος εμπορίας γεωργικών
    προϊόντων, για τον ορισμό της έννοιας «καταγόμενα
    προϊόντα» ή «προϊόντα καταγωγής» και για τις
    μεθόδους διοικητικής συνεργασίας, με νέο πρωτόκολλο,
    το οποίο, όσον αφορά τους κανόνες καταγωγής,
    παραπέμπει στην περιφερειακή σύμβαση για πανευρωμεσογειακούς
    προτιμησιακούς κανόνες καταγωγής
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2015/709, 21. aprill 2015, seisukoha kohta, mis võetakse
