  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2015/709 tal-21 ta' April 2015 dwar il-pożizzjoni
    li għandha tiġi adottata f'isem l-Unjoni Ewropea fil-Kunsill ta' Assoċjazzjoni
