    UE-Turquia sobre a substituição do Protocolo n.° 3 da Decisão n.° 1/98 do
    Conselho de Associação CE-Turquia, relativa ao regime comercial aplicável aos
    produtos agrícolas, relativo à definição da noção de «produtos originários»
    e aos métodos de cooperação administrativa, por um novo protocolo que, no que
    se refere às regras de origem, remeta para a Convenção Regional sobre Regras
    de Origem Preferenciais Pan-Euro-Mediterrânicas
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2015/709 a Consiliului din 21 aprilie 2015 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Consiliului
    de asociere UE-Turcia privind înlocuirea protocolului 3 la Decizia nr. 1/98 a
    Consiliului de asociere CE-Turcia privind regimul comercial pentru produsele agricole,
    privind definirea noțiunii de „produse originare” și metodele de cooperare
    administrativă, cu un nou protocol care, în ceea ce privește regulile de origine,
    să facă trimitere la Convenția regională cu privire la regulile de origine
    preferențiale paneuro-mediteraneene
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2015/709 z 21. apríla 2015 o pozícii, ktorá sa
    má prijať v mene Európskej únie v Asociačnej rade EÚ – Turecko, pokiaľ
    ide o nahradenie protokolu 3 k rozhodnutiu Asociačnej rady ES – Turecko č.
    1/98 o obchodnom režime pre poľnohospodárske produkty týkajúceho sa vymedzenia
    pojmu „pôvodné výrobky“ a metód administratívnej spolupráce novým protokolom,
    ktorý, pokiaľ ide o pravidlá pôvodu, odkazuje na Regionálny dohovor o paneuro-stredomorských
    preferenčných pravidlách pôvodu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2015/709 z dne 21. aprila 2015 o stališču, ki se v imenu
    Evropske unije sprejme v Pridružitvenem svetu EU-Turčija glede nadomestitve
    Protokola 3 k Sklepu št. 1/98 Pridružitvenega sveta ES-Turčija o trgovinskem
    režimu za kmetijske proizvode o opredelitvi pojma „izdelki s poreklom“ in
    načinih upravnega sodelovanja z novim protokolom, ki se v zvezi s pravili o poreklu
    sklicuje na Regionalno konvencijo o pan-evro-mediteranskih preferencialnih pravilih
    o poreklu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2015/709 del Consejo, de 21 de abril de 2015, relativa a
    la posición que se ha de adoptar en nombre de la Unión Europea en el Consejo
    de Asociación UE-Turquía por lo que respecta a la sustitución del Protocolo
    n° 3 relativo a la definición de la noción de «productos originarios» y a
    los métodos de cooperación administrativa, de la Decisión n° 1/98 del Consejo
    de Asociación CE-Turquía relativa al régimen comercial aplicable a los productos
    agrícolas, por un nuevo protocolo que haga remisión, en cuanto a las normas
    de origen, al Convenio regional sobre las normas de origen preferenciales paneuromediterráneas
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2015/709 av den 21 april 2015 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i associeringsrådet EU–Turkiet vad
    gäller ersättande av protokoll 3 till beslut nr 1/98 av associeringsrådet för
    EG och Turkiet om handelsordningen för jordbruksprodukter, om definition av begreppet
    ursprungsprodukter och om metoder för administrativt samarbete, med ett nytt
    protokoll, som vad gäller ursprungsregler hänvisar till den regionala konventionen
    om Europa–Medelhavstäckande regler om förmånsursprung
