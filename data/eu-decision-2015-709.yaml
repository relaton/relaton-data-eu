    szóló regionális egyezményre hivatkozó jegyzőkönyvvel történő felváltásával
    összefüggésben az Európai Unió nevében képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2015/709 del Consiglio, del 21 aprile 2015, relativa alla
    posizione che deve essere adottata a nome dell'Unione europea in sede di Consiglio
    di associazione UE-Turchia con riguardo alla sostituzione del protocollo n. 3
    della decisione n. 1/98 del Consiglio di associazione CE-Turchia relativa al regime
    applicabile agli scambi di prodotti agricoli, relativo alla definizione della
    nozione di «prodotti originari» e ai metodi di cooperazione amministrativa,
    con un nuovo protocollo che, per quanto riguarda le norme di origine, faccia riferimento
    alla convenzione regionale sulle norme di origine preferenziali paneuromediterranee
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2015/709 (2015. gada 21. aprīlis) par nostāju, kas
