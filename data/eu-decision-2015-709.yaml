    preferenzjali tal-oriġini pan-Ewro-Mediterranji
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2015/709 van de Raad van 21 april 2015 betreffende het namens
    de Europese Unie in te nemen standpunt in de Associatieraad EU-Turkije over de
    vervanging van Protocol nr. 3 bij Besluit nr. 1/98 van de Associatieraad EG-Turkije
    betreffende de handelsregeling voor landbouwproducten, dat betrekking heeft op
    de definitie van het begrip „producten van oorsprong” en methoden van administratieve
    samenwerking, door een nieuw protocol waarin, wat de oorsprongsregels betreft,
    naar de Regionale Conventie betreffende de pan-Euro-mediterrane preferentiële
    oorsprongsregels wordt verwezen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2015/709 z dnia 21 kwietnia 2015 r. w sprawie stanowiska,
    jakie ma zostać przyjęte w imieniu Unii Europejskiej w ramach Rady Stowarzyszenia
    UE–Turcja w odniesieniu do zastąpienia Protokołu 3 do decyzji nr 1/98 Rady
    Stowarzyszenia WE–Turcja w sprawie systemu handlu produktami rolnymi, dotyczącego
    definicji pojęcia „produkty pochodzące” oraz metod współpracy administracyjnej,
    nowym protokołem, który w odniesieniu do reguł pochodzenia odwołuje się do
    Regionalnej konwencji w sprawie paneurośródziemnomorskich preferencyjnych reguł
    pochodzenia
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2015/709 do Conselho, de 21 de abril de 2015, relativa à
