  script: Latn
  content: Odluka Vijeća (EU) 2015/709 od 21. travnja 2015. o stajalištu koje treba
    donijeti u ime Europske unije u okviru Vijeća za pridruživanje EU-Turska u pogledu
    zamjene Protokola 3. uz Odluku br. 1/98 Vijeća za pridruživanje EZ-Turska o
    trgovinskom režimu za poljoprivredne proizvode, o definiciji pojma „proizvodi
