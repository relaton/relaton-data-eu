  script: Latn
  content: Neuvoston päätös (EU) 2015/709, annettu 21 päivänä huhtikuuta 2015,
    EU–Turkki-assosiaationeuvostossa Euroopan unionin puolesta esitettävästä
    kannasta maataloustuotteiden kauppajärjestelmästä tehdyn EY–Turkki-assosiaationeuvoston
    päätöksen N:o 1/98 pöytäkirjan 3, joka koskee käsitteen ”alkuperätuotteet”
    määrittelyä ja hallinnollisen yhteistyön menetelmiä, korvaamiseen uudella
    pöytäkirjalla, jossa alkuperäsääntöjen osalta viitataan etuuskohteluun oikeuttavia
    Paneurooppa–Välimeri-alkuperäsääntöjä koskevaan alueelliseen yleissopimukseen
  type: main
