  script: Latn
  content: A Tanács (EU) 2015/709 határozata (2015. április 21.) az EU–Törökország
    társulási tanácson belül az EU–Törökország társulási tanács mezőgazdasági
    termékek kereskedelmi rendszeréről szóló 1/98 sz. határozatához csatolt,
    a „származó termékek” fogalmának meghatározásáról és az igazgatási
    együttműködés módszereiről szóló 3. jegyzőkönyvnek egy új, a származási
