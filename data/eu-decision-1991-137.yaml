  content: '91/137/EEC: Commission Decision of 18 February 1991 approving derogations
    provided for by Germany from certain provisions of Council Directive 77/93/EEC
    in respect of ware potatoes for human consumption originating in Poland (only
    the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/137/CEE: Décision de la Commission du 18 février 1991 approuvant
    les dérogations prévues par l''Allemagne à certaines dispositions de la directive
    77/93/CEE du Conseil en ce qui concerne les pommes de terre de consommation humaine
    originaires de Pologne (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 18. Februar 1991 zur Ermächtigung Deutschlands,
    für Speisekartoffeln mit Ursprung in Polen Ausnahmen von einigen Vorschriften
    der Richtlinie 77/93/EWG zuzulassen (Nur der deutsche Text ist verbindlich) (91/137/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 18. februar 1991 om godkendelse af Tysklands
