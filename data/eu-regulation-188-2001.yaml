    κανονισμού (ΕΚ) αριθ. 1524/98 όσον αφορά τις λεπτομέρειες
    εφαρμογής σχετικά με τα ειδικά μέτρα τα οποία
    ελήφθησαν υπέρ των γαλλικών υπερποντίων διαμερισμάτων
    στους τομείς των οπωροκηπευτικών, των φυτών
    και ανθέων και τον καθορισμό του προβλεπόμενου
    για το έτος 2001 ισοζυγίου εφοδιασμού
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 188/2001, annettu 30 päivänä tammikuuta 2001,
    hedelmien ja vihannesten, kasvien sekä kukkien aloja koskevien Ranskan merentakaisten
    departementtien hyväksi annettujen erityistoimenpiteiden soveltamista koskevista
    yksityiskohtaisista säännöistä annetun asetuksen (EY) N:o 1524/98 muuttamisesta
    ja arvioidun hankintataseen määrittämisestä vuodeksi 2001
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 188/2001 della Commissione, del 30 gennaio 2001, recante
    modifica del regolamento (CE) n. 1524/98 che stabilisce modalità di applicazione
    delle misure specifiche adottate a favore dei dipartimenti francesi d'oltremare
    nei settori degli ortofrutticoli, delle piante e dei fiori e che fissa il bilancio
    previsionale di approvvigionamento per il 2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 188/2001 van de Commissie van 30 januari 2001 tot
    wĳziging van Verordening (EG) nr. 1524/98 houdende bepalingen ter uitvoering
    van de ten behoeve van de Franse overzeese departementen (DOM) vastgestelde specifieke
    maatregelen voor de sectoren groenten en fruit, bloemen en planten en tot vaststelling
    van de geraamde voorzieningsbalans voor het jaar 2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 188/2001 da Comissão, de 30 de Janeiro de 2001,
    que altera o Regulamento (CE) n.° 1524/98 que fixa as regras de execução relativas
    às medidas específicas decididas a favor dos departamentos franceses ultramarinos
    nos sectores das frutas e produtos hortícolas, das plantas e das flores e determina
    a estimativa de abastecimento para 2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 188/2001 de la Comisión, de 30 de enero de 2001, que
    modifica el Reglamento (CE) n° 1524/98 por el que se establecen las disposiciones
    de aplicación relativas a las medidas específicas adoptadas en favor de los
    departamentos franceses de ultramar en los sectores de las frutas y hortalizas,
    las plantas y las flores, y por el que se establece el plan de previsiones de
    abastecimiento para 2001
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 188/2001 av den 30 januari 2001 om ändring
