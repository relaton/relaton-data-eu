title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 188/2001 of 30 January 2001 amending Regulation
    (EC) No 1524/98 laying down detailed rules for the application of the specific
    measures adopted in respect of fruit and vegetables, plants and flowers for the
    benefit of the French overseas departments and determining the forecast supply
    balance for 2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 188/2001 de la Commission du 30 janvier 2001 modifiant
    le règlement (CE) n° 1524/98 portant modalités d'application relatives aux
    mesures spécifiques arrêtées en faveur des départements français d'outre-mer
    dans les secteurs des fruits et légumes, des plantes et des fleurs et déterminant
    le bilan prévisionnel d'approvisionnement pour l'année 2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 188/2001 der Kommission vom 30. Januar 2001 zur Änderung
    der Verordnung (EG) Nr. 1524/98 mit Durchführungsbestimmungen zu den Sondermaßnahmen
    zugunsten der französischen überseeischen Departements in den Sektoren Obst
    und Gemüse, Pflanzen und Blumen und zur Erstellung der Bedarfsvorausschätzung
    für 2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 188/2001 af 30. januar 2001 om ændring
    af forordning (EF) nr. 1524/98 om gennemførelsesbestemmelser for særlige foranstaltninger
    for frugt, grøntsager, planter og blomster til fordel for de oversøiske franske
    departementer og om foreløbig forsyningsopgørelse for år 2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 188/2001 της Επιτροπής,
