title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 384/82 of 17 February 1982 amending for
    the third time Regulation (EEC) No 2730/81 establishing a list of agencies in
    non-member importing countries entitled to issue invitations to tender in the
    milk and milk products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 384/82 de la Commission, du 17 février 1982, modifiant
