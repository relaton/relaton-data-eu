id: EUDecision1978492
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 19 May 1978 authorizing the French Republic not
    to apply Community treatment to men's and boys' coats and blazers, falling within
    heading No ex 61.01 of the Common Customs Tariff, originating in Czechoslovakia
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/492/CEE: Décision de la Commission, du 19 mai 1978, autorisant la
    République française à exclure du traitement communautaire les manteaux et
    vestes pour hommes et garçonnets, de la position Ex 61.01 du Tarif douanier commun,
    originaires de la Tchécoslovaquie et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. Mai 1978, mit der die Französische
    Republik ermächtigt wird, aus der Tschechoslowakei stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Mäntel und Jacken für Männer
    und Knaben, der Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 19. maj 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage frakker og jakker til mænd
    og drenge, som henhører under pos. ex 61.01 i den fælles toldtarif, har oprindelse
    i Tjekkoslovakiet og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 maggio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i mantelli e giacche per uomo
    e per ragazzo della voce ex 61.01 della tariffa doganale comune, originari della
    Cecoslovacchia e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 mei 1978 waarbij de Franse Republiek
    wordt gemachtigd mantels en jasjes voor heren en jongens, van post ex 61.01 van
    het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
