    and their families moving within the Community and Regulation (EEC) No 574/72
    fixing the procedure for implementing Regulation (EEC) No 1408/71
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2793/81 du Conseil, du 17 septembre 1981, modifiant
