title:
- language: en
  script: Latn
  content: '92/199/EEC: Commission Decision of 24 March 1992 amending Decision 91/409/EEC
    authorizing Member States to permit temporarily the marketing of forest reproductive
    material not satisfying the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '92/199/CEE: Décision de la Commission, du 24 mars 1992, modifiant la
    décision 91/409/CEE autorisant les Etats membres à admettre temporairement la
    commercialisation de matériels forestiers de reproduction ne répondant pas aux
    exigences de la directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '92/199/EWG: Entscheidung der Kommission vom 24. März 1992 zur Änderung
    der Entscheidung 91/409/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinie
    66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '92/199/EØF: Kommissionens beslutning af 24. marts 1992 om ændring af
    beslutning 91/409/EØF om bemyndigelse af medlemsstaterne til midlertidigt at
    tillade handel med forstligt formeringsmateriale, der ikke opfylder kravene i
    Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '92/199/ΕΟΚ: Απόφαση της Επιτροπής της 24ης
    Μαρτίου 1992 που τροποποιεί την απόφαση 91/409/ΕΟΚ
    με την οποία παρέχεται η άδεια στα κράτη μέλη
    να επιτρέψουν προσωρινά την εμπορία δασικού
    πολλαπλασιαστικού υλικού το οποίο δεν ανταποκρίνεται
    στις απαιτήσεις της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '92/199/ETY: Komission päätös, tehty 24 päivänä maaliskuuta 1992,
    luvan antamisesta jäsenvaltioille hyväksyä tilapäisesti sellaisen metsänviljelyaineiston
    pitäminen kaupan, joka ei täytä neuvoston direktiivin 66/404/ETY vaatimuksia,
    tehdyn päätöksen 91/409/ETY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '92/199/CEE: Decisione della Commissione, del 24 marzo 1992, recante modifica
    della decisione 91/409/CEE che autorizza gli Stati membri ad ammettere temporaneamente
    la commercializzazione di materiali forestali di moltiplicazione non rispondenti
    ai requisiti prescritti dalla direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '92/199/EEG: Beschikking van de Commissie van 24 maart 1992 tot wijziging
    van Beschikking 91/409/EEG houdende machtiging van de Lid- Staten om bosbouwkundig
    teeltmateriaal dat niet aan de eisen van Richtlijn 66/404/EEG van de Raad voldoet,
    tijdelijk tot de handel toe te laten'
  type: main
- language: pt
  script: Latn
  content: '92/199/CEE: Decisão da Comissão, de 24 de Março de 1992, que altera
    a Decisão 91/409/CEE, que autoriza os Estados-membros a admitir temporariamente
    a comercialização de materiais florestais de reprodução que não satisfazem
    as exigências da Directiva 66/409/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '92/199/CEE: Decisión de la Comisión, de 24 de marzo de 1992, que modifica
    la Decisión 91/409/CEE por la que se autoriza a los Estados miembros a admitir
    temporalmente la comercialización de materiales forestales de reproducción que
    no se ajusten a las exigencias de la Directiva 66/404/CEE del Consejo'
  type: main
- language: sv
  script: Latn
