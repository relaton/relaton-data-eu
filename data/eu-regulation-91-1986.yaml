    bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur Aufhebung von
    gewissen Artikeln der Verordnung (EWG) Nr. 3210/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 91/86 af 17. januar 1986 om salg til
