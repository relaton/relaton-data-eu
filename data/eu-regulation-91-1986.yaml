    provenienti dalle scorte d'intervento e destinate alla trasformazione nella Comunità
    e recante abrogazione di certi articoli del regolamento (CEE) n. 3210/85
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 91/86 van de Commissie van 17 januari 1986 inzake
