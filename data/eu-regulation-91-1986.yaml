    dans la Communauté, de certaines viandes bovines provenant des stocks d'intervention
    et abrogeant certaines dispositions du règlement (CEE) n 3210/85
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 91/86 der Kommission vom 17. Januar 1986 über den
