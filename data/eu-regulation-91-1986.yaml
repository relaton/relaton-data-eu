  content: Commission Regulation (EEC) No 91/86 of 17 January 1986 on the sale at
    prices fixed at a standard rate in advance of certain beef from intervention stocks
    for processing in the Community and repealing certain Articles of Regulation (EEC)
    No 3210/85
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 91/86 de la Commission, du 17 janvier 1986, relatif
