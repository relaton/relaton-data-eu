  script: Latn
  content: Cinneadh (Euratrom) 2024/1847 ón gComhairle an 25 Meitheamh 2024 maidir
    le buntáistí faoi Chuid III den Chonradh um Chairt Fuinnimh ón gComhphobal
    Eorpach do Fhuinneamh Adamhach (Euratom) a dhiúltú d’aon eintiteas dlíthiúil
    atá faoi úinéireacht nó faoi rialú saoránach nó náisiúnach de Chónaidhm
    na Rúise nó de Phoblacht na Bealarúise agus ar aon infheistíocht de réir
    bhrí an Chonartha um Chairt Fuinnimh ar infheistíocht í de chuid infheisteora
    ó Chónaidhm na Rúise nó ó Phoblacht na Bealarúise
  type: main
