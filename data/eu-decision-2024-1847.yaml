    în temeiul părții III din Tratatul privind Carta energiei oricărei entități
    juridice care este deținută sau controlată de cetățeni sau resortisanți
    ai Federației Ruse sau ai Republicii Belarus, precum și oricărei investiții
    în înțelesul Tratatului privind Carta energiei, care reprezintă o investiție
    a unui investitor din Federația Rusă sau din Republica Belarus
