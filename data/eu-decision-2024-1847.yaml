title:
- language: en
  script: Latn
  content: Council Decision (Euratom) 2024/1847 of 25 June 2024 on the denial of advantages
    under Part III of the Energy Charter Treaty by the European Atomic Energy Community
    (Euratom) to any legal entity that is owned or controlled by citizens or nationals
    of the Russian Federation or of the Republic of Belarus and to any investment
    within the meaning of the Energy Charter Treaty which is an investment of an investor
    of the Russian Federation or of the Republic of Belarus
  type: main
- language: fr
  script: Latn
  content: Décision (Euratom) 2024/1847 du Conseil du 25 juin 2024 concernant le
    refus d’accorder des avantages au titre de la partie III du traité sur la Charte
    de l’énergie par la Communauté européenne de l’énergie atomique (Euratom)
    à toute entité juridique détenue ou contrôlée par des citoyens ou des ressortissants
    de la Fédération de Russie ou de la République de Biélorussie ainsi qu’à
    tout investissement au sens du traité sur la Charte de l’énergie qui est un
    investissement d’un investisseur de la Fédération de Russie ou de la République
    de Biélorussie
  type: main
- language: de
  script: Latn
  content: Beschluss (Euratom) 2024/1847 des Rates vom 25. Juni 2024 betreffend die
    Verweigerung von Vorteilen nach Teil III des Vertrags über die Energiecharta
    durch die Europäische Atomgemeinschaft (Euratom) gegenüber jeder juristischen
    Person, die sich im Eigentum oder unter der Kontrolle von Staatsbürgern oder
    Staatsangehörigen der Russischen Föderation oder der Republik Belarus befindet,
    sowie gegenüber jeder Investition im Sinne des Vertrags über die Energiecharta,
    wenn es sich um die Investition eines Investors der Russischen Föderation oder
    der Republik Belarus handelt
  type: main
