    i inom ramen för del III av energistadgefördraget av Europeiska atomenergigemenskapen
    (Euratom) till juridiska enheter som ägs eller kontrolleras av personer som är
    medborgare i Ryska federationen eller i Republiken Belarus, eller har rysk eller
    belarusisk nationalitet, och varje investering i den mening som avses i energistadgefördraget
    som är en investering som görs av en investerare från Ryska federationen eller
    Republiken Belarus
