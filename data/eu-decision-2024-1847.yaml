    na podlagi dela III Pogodbe o energetski listini s strani Evropske skupnosti za
    atomsko energijo (Euratom) vsem pravnim subjektom, ki so v lasti ali pod nadzorom
    državljanov ali oseb z narodnostjo Ruske federacije ali Republike Belorusije,
    ter vsem naložbam v smislu Pogodbe o energetski listini, ki so naložbe vlagateljev
