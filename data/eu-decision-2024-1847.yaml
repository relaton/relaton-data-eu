    mill-Komunità Ewropea tal-Enerġija Atomika (Euratom) lil kwalunkwe entità ġuridika
    li hija proprjetà ta’ jew ikkontrollata minn persuni biċ-ċittadinanza jew
    in-nazzjonalità tal-Federazzjoni Russa jew tar-Repubblika tal-Belarussja u lil
