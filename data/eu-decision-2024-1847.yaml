    výhod podle části III Smlouvy o energetické chartě ze strany Evropského
    společenství pro atomovou energii (Euratom) vůči kterékoli právnické osobě,
    která je vlastněna nebo kontrolována občany nebo státními příslušníky
    Ruské federace nebo Běloruské republiky, a kterékoli investici ve smyslu Smlouvy
    o energetické chartě, která je investicí investora Ruské federace nebo Běloruské
    republiky
  type: main
