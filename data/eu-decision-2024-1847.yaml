  script: Latn
  content: Odluka Vijeća (Euratom) 2024/1847 od 25. lipnja 2024. o uskraćivanju,
    od strane Europske zajednice za atomsku energiju (Euratom), pogodnosti iz dijela
    III. Ugovora o energetskoj povelji svim pravnim osobama koje su u vlasništvu
    ili pod kontrolom građana ili državljana Ruske Federacije ili Republike Bjelarusa
    i svim ulaganjima u smislu Ugovora o energetskoj povelji koja su ulaganja ulagačâ
    iz Ruske Federacije ili iz Republike Bjelarusa
  type: main
- language: hu
  script: Latn
  content: A Tanács (Euratom) 2024/1847 határozata (2024. június 25.) az Energia
    Charta Egyezmény III. részében szabályozott kedvezmények biztosításának
    az Európai Atomenergia-közösség (Euratom) általi megtagadásáról bármely
    olyan jogi személytől, amely az Oroszországi Föderáció vagy a Belarusz Köztársaság
    állampolgára tulajdonában van, vagy annak ellenőrzése alatt áll, valamint
    az Energia Charta Egyezmény értelmében vett bármely olyan befektetéstől,
    amely az Oroszországi Föderáció vagy a Belarusz Köztársaság befektetőjének
    befektetése
  type: main
