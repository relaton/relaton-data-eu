    pela Comunidade Europeia da Energia Atómica (Euratom) a qualquer pessoa coletiva
    se cidadãos ou nacionais da Federação da Rússia ou da República da Bielorrússia
    forem seus proprietários ou a controlarem, e qualquer investimento na aceção
    do Tratado da Carta da Energia se se tratar de um investimento de um investidor
    da Federação da Rússia ou da República da Bielorrússia
  type: main
