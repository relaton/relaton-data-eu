    al rifiuto da parte della Comunità europea dell’energia atomica (Euratom) dei
    vantaggi ai sensi della parte III del trattato sulla Carta dell’energia a qualsiasi
    persona giuridica di proprietà o controllata da persone aventi la cittadinanza
    o la nazionalità della Federazione russa o della Repubblica di Bielorussia e
    a qualsiasi investimento ai sensi del trattato sulla Carta dell’energia che
    sia un investimento di un investitore della Federazione russa o della Repubblica
    di Bielorussia
  type: main
