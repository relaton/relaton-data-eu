    energiu (Euratom) každej právnickej osobe, ktorá je vlastnená alebo riadená
    občanmi alebo štátnymi príslušníkmi Ruskej federácie alebo Bieloruskej
    republiky, a každej investícii v zmysle Zmluvy o energetickej charte, ktorá
    je investíciou investora Ruskej federácie alebo Bieloruskej republiky
  type: main
