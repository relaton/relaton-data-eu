    pagal Energetikos chartijos sutarties III dalį Rusijos Federacijos arba Baltarusijos
    Respublikos piliečių valdomiems arba kontroliuojamiems juridiniams asmenims
    ir Energetikos chartijos sutartyje apibrėžtoms investicijoms, kurios yra Rusijos
    Federacijos arba Baltarusijos Respublikos investuotojo investicijos
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (Euratom) 2024/1847 tal-25 ta’ Ġunju 2024 dwar
