    paredzētās priekšrocības ikvienai juridiskai personai, kas pieder Krievijas
    Federācijas vai Baltkrievijas Republikas pilsoņiem vai valstspiederīgajiem
    vai ir to uzraudzībā, un jebkuriem ieguldījumiem Enerģētikas hartas nolīguma
    nozīmē, kas ir Krievijas Federācijas vai Baltkrievijas Republikas ieguldītāja
    ieguldījumi
  type: main
