    a la denegación de los beneficios en virtud de la Parte III del Tratado sobre
    la Carta de la Energía por parte de la Comunidad Europea de la Energía Atómica
    (Euratom) a toda entidad jurídica que sea propiedad o esté bajo el control de
    ciudadanos o nacionales de la Federación de Rusia o de la República de Bielorrusia
    y a toda inversión en el sentido del Tratado sobre la Carta de la Energía que
    sea una inversión de un inversor de la Federación de Rusia o de la República
    de Bielorrusia
