    Wspólnotą Energii Atomowej (Euratom) każdej jednostce prawnej, która jest
    własnością lub znajduje się pod kontrolą obywateli lub osób przynależących
    do Federacji Rosyjskiej lub Republiki Białorusi oraz każdej inwestycji w rozumieniu
