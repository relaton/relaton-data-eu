  script: Latn
  content: '81/139/EEC: Commission Decision of 19 February 1981 authorizing the French
    Republic not to apply Community treatment to woven fabrics of synthetic fibres
    (discontinuous or waste) originating in Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/139/CEE: Décision de la Commission, du 19 février 1981, autorisant
    la République française à exclure du traitement communautaire les tissus de
    fibres textiles synthétiques discontinues originaires de T''ai-wan (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/139/EWG: Entscheidung der Kommission vom 19. Februar 1981 zur Ermächtigung
    der Französischen Republik, aus Taiwan stammende Gewebe aus synthetischen Spinnfasern
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/139/EØF: Kommissionens beslutning af 19. februar 1981 om bemyndigelse
