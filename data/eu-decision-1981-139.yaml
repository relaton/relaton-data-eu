    af korte kemofibre med oprindelse i Taiwan og som frit kan omsættes i de øvrige
    medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/139/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης
