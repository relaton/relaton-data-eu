title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1958/89 of 30 June 1989 fixing for the 1989/90
    marketing year the minimum price to be paid to producers for unprocessed sultanas,
    currants and "Moscatel" and the amount of production aid for dried grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1958/89 de la Commission du 30 juin 1989 fixant, pour
    la campagne de commercialisation 1989/1990, le prix minimal à payer aux producteurs
    pour les sultanines, les raisins secs de Corinthe et les variétés Moscatel non
    transformés, ainsi que le montant de l'aide à la production pour ces raisins
    secs
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1958/89 DER KOMMISSION vom 30. Juni 1989 zur Festsetzung
    des den Erzeugern unverarbeiteter Sultaninen, Korinthen und Moscatel zu zahlenden
    Mindestpreises sowie der Produktionsbeihilfe für diese getrockneten Korinthen
    im Wirtschaftsjahr 1989/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1958/89 af 30. juni 1989 om fastsættelse
    af den minimumspris, der skal betales producenten for uforarbejdede sultanas,
    korender og muskateller, samt af producentstøtten for disse tørrede druer i
    produktionsåret 1989/90
  type: main
- language: el
  script: Grek
