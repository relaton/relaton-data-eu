    εμπορίας 1989/90, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για μη μεταποιημένες σουλτανίνες,
    κορινθιακές σταφίδες και σταφίδες Moscatel, καθώς
    και το ποσό της ενίσχυσης στην παραγωγή για
    τις σταφίδες
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1958/89 DELLA COMMISSIONE del 30 giugno 1989 che
