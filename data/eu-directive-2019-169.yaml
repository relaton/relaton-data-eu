    III do dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    w przypadku zastosowania ołowiu w ceramicznych dielektrycznych elementach niektórych
    kondensatorów
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2019/169 da Comissão, de 16 de novembro de 2018,
