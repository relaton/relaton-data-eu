title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2075/82 of 28 July 1982 imposing a definitive
    anti-dumping duty on imports of standardized multi-phase electric motors having
    an output of more than 0*75 kW but not more than 75 kW, originating in the USSR,
    and terminating the proceedings in respect of imports of the said products originating
    in Bulgaria, Czechoslovakia, the German Democratic Republic, Poland and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2075/82 du Conseil, du 28 juillet 1982, portant, d'
    une part, institution d' un droit anti-"dumping" définitif à l' égard des importations
    de moteurs électriques polyphasés normalisés d' une puissance de plus de 0,75
    à 75 kilowatts inclus, originaires d' Union soviétique et, d' autre part, clôture
    de la procédure à l' égard des importations des mêmes produits originaires
    de la République démocratique allemande, de la Roumanie, de la Tchécoslovaquie,
    de la Bulgarie et de la Pologne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2075/82 des Rates vom 28. Juli 1982 über die Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren standardisierter Mehrphasen-Wechselstrommotoren
    mit einer Leistung von mehr als 0,75 bis 75 kW mit Ursprung in der Sowjetunion
    einerseits und die Einstellung des Verfahrens gegenüber der Einfuhren der gleichen
    Waren mit Ursprung in Bulgarien, der Deutschen Demokratischen Republik, Polen,
    Rumänien und der Tschechoslowakei andererseits
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2075/82 af 28. juli 1982 om indførelse af
    en endelig antidumpingtold på importen af standardiserede elektriske motorer,
    flerfasede, med effekt på over 0,75 kW, men højst 75 kW, med oprindelse i Sovjetunionen
    og om afslutning af proceduren for importen af tilsvarende varer med oprindelse
    i Bulgarien, Den tyske demokratiske Republik, Polen, Rumænien og Tjekkoslovakiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2075/82 τού Συμβουλίου
    τής 28ης Ιουλίου 1982 περί επιβολής, αφενός, οριστικού
    δασμού αντιντάμπινγκ στίς εισαγωγές τυποποιημένων
    πολυφασικών ηλεκτρικών κινητήρων ισχύος από
    0, 75 kW μή συμπεριλαμβανομένων έως 75 kW συμπεριλαμβανομένων,
    καταγωγής Σοβιετικής Ένωσης καί, αφετέρου,
    περί περατώσεως τής διαδικασίας γιά τίς εισαγωγές
    τών ίδιων προϊόντων καταγωγής τής Λαϊκής Δημοκρατίας
    τής Γερμανίας, Ρουμανίας Τσεχοσλοβακίας, Βουλγαρίας
    καί Πολωνίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2075/82 del Consiglio, del 28 luglio 1982, che istituisce
    un dazio antidumping definitivo nei confronti delle importazioni di motori elettrici
    polifase normalizzati, di potenza superiore a 0,75 kw ed inferiore o pari a 75
    kw, originari dell' Unione Sovietica, e che termina la procedura nei confronti
    delle importazioni dei medesimi prodotti, originari della Repubblica democratica
    tedesca, della Romania, della Cecoslovacchia, della Bulgaria e della Polonia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2075/82 van de Raad van 28 juli 1982 houdende instelling
    van een definitief anti-dumpingrecht op de invoer van gestandaardiseerde meerfasige
    elektromotoren met een vermogen van meer dan 0,75 kW tot en met 75 kW, van oorsprong
    uit de Sowjetunie en tevens houdende beëindiging van de procedure met betrekking
    tot de invoer van voornoemde produkten van oorsprong uit de Duitse Democratische
    Republiek, Roemenië, Tsjechoslowakije, Bulgarije en Polen
  type: main
