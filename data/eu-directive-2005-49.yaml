---
id: EUDirective200549
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Directive 2005/49/EC of 25 July 2005 amending, for the purposes
    of their adaptation to technical progress, Council Directive 72/245/EEC relating
    to the radio interference (electromagnetic compatibility) of vehicles and Council
    Directive 70/156/EEC on the approximation of the laws of the Member States relating
    to the type-approval of motor vehicles and their trailers
  type: main
- language: fr
  script: Latn
  content: Directive 2005/49/CE de la Commission du 25 juillet 2005 portant adaptation
    au progrès technique de la directive 72/245/CEE du Conseil relative aux parasites
    radioélectriques (compatibilité électromagnétique) des véhicules et portant
    modification de la directive 70/156/CEE du Conseil concernant le rapprochement
    des législations des États membres relatives à la réception des véhicules
    à moteur et de leurs remorques
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/49/EG der Kommission vom 25. Juli 2005 zur Änderung der
    Richtlinie 72/245/EWG des Rates über die Funkentstörung (elektromagnetische
    Verträglichkeit) von Kraftfahrzeugen und der Richtlinie 70/156/EWG des Rates
    zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über die Betriebserlaubnis
    für Kraftfahrzeuge und Kraftfahrzeuganhänger zwecks Anpassung an den technischen
    Fortschritt
  type: main
- language: bg
  script: Cyrl
  content: Директива 2005/49/ЕО на Комисията от 25 юли
    2005 година за изменение с цел тяхното адаптиране
    към техническия прогрес на Директива 72/245/ЕИО
    на Съвета относно радиосмущенията (електромагнитна
    съвместимост) на превозните средства и на Директива
    70/156/ЕИО на Съвета за сближаване на законодателствата
    на държавите-членки относно типовото одобрение
    на моторни превозни средства и техните ремаркета
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2005/49/ES ze dne 25. července 2005, kterou se mění
    směrnice Rady 72/245/EHS týkající se vysokofrekvenčního rušení (elektromagnetická
    kompatibilita) způsobovaného vozidly a směrnice Rady 70/156/EHS o sbližování
    právních předpisů členských států týkajících se schvalování typu
    motorových vozidel a jejich přípojných vozidel za účelem jejich přizpůsobení
    technickému pokroku
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2005/49/EF af 25. juli 2005 om ændring, med henblik
    på tilpasning til den tekniske udvikling, af Rådets direktiv 72/245/EØF om
    radiostøjdæmpning af køretøjer (elektromagnetisk kompabilitet) og om ændring
    af direktiv 70/156/EØF om tilnærmelse af medlemsstaternes lovgivning om godkendelse
    af motordrevne køretøjer og påhængskøretøjer dertil
  type: main
- language: el
  script: Grek
  content: Οδηγία 2005/49/ΕΚ της Επιτροπής, της 25ης Ιουλίου
    2005, την τροποποίηση, με σκοπό την προσαρμογή
    στην τεχνική πρόοδο, της οδηγίας 72/245/EOK του
    Συμβουλίου σχετικά με τα ραδιοηλεκτρικά παράσιτα
    (ηλεκτρομαγνητική συμβατότητα) των οχημάτων
    και για την τροποποίηση της οδηγίας 70/156/EOK του
    Συμβουλίου που αφορά την προσέγγιση των νομοθεσιών
    των κρατών μελών σχετικά με την έγκριση τύπου
    των μηχανοκίνητων οχημάτων και των ρυμουλκουμένων
    τους
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2005/49/EÜ, 25. juuli 2005, millega muudetakse tehnika
    arenguga kohandamiseks nõukogu direktiivi 72/245/EMÜ, mis käsitleb sõidukite
    tekitatud raadiohäireid (elektromagnetilist ühilduvust), ja nõukogu direktiivi
    70/156/EMÜ liikmesriikide mootorsõidukite ja nende haagiste tüübikinnitusega
    seotud õigusaktide ühtlustamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2005/49/EY, annettu 25 päivänä heinäkuuta 2005,
    ajoneuvojen aiheuttamista radiohäiriöistä (sähkömagneettisesta yhteensopivuudesta)
    annetun neuvoston direktiivin 72/245/ETY ja moottoriajoneuvojen ja niiden perävaunujen
    tyyppihyväksyntää koskevan jäsenvaltioiden lainsäädännön lähentämisestä
    annetun neuvoston direktiivin 70/156/ETY muuttamisesta niiden mukauttamiseksi
    tekniikan kehitykseen
  type: main
- language: hr
  script: Latn
  content: Direktiva Komisije 2005/49/EZ od 25. srpnja 2005. o izmjeni, radi njihove
    prilagodbe tehničkom napretku, Direktive Vijeća 72/245/EEZ o radijskim smetnjama
    (elektromagnetskoj kompatibilnosti) vozila i Direktive Vijeća 70/156/EEZ o usklađivanju
    zakonodavstava država članica u odnosu na homologaciju tipa motornih vozila
    i njihovih prikolica
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2005/49/EK irányelve (2005. július 25.) a gépjárművekben
    jelentkező rádiózavarokra (elektromágneses összeférhetőségre) vonatkozó
    72/245/EGK tanácsi irányelvnek, valamint a gépjárművek és pótkocsijaik
    típusjóváhagyására vonatkozó tagállami jogszabályok közelítéséről
    szóló 70/156/EGK irányelvnek a műszaki fejlődéshez való igazításuk érdekében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2005/49/CE della Commissione, del 25 luglio 2005, che modifica,
    per adeguarle al progresso tecnico, la direttiva 72/245/CEE del Consiglio relativa
    alla soppressione delle perturbazioni radioelettriche (compatibilità elettromagnetica)
    dei veicoli e la direttiva 70/156/CEE del Consiglio concernente il ravvicinamento
    delle legislazioni degli Stati Membri relative all’omologazione dei veicoli
    a motore e dei loro rimorchi
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2005/49/EK (2005. gada 25. jūlijs), ar kuru groza
    Padomes Direktīvu 72/245/EEK par radio traucējumiem (elektromagnētiskā saderība)
    autotransportā un Padomes Direktīvu 70/156/EEK par dalībvalstu tiesību aktu
    tuvināšanu attiecībā uz mehānisko transportlīdzekļu un to piekabju tipa
    apstiprinājumu, lai tās pielāgotu tehnikas progresam
  type: main
- language: lt
  script: Latn
  content: 2005 m. liepos 25 d. Komisijos direktyva 2005/49/EB, iš dalies keičianti
    Tarybos direktyvą 72/245/EEB dėl transporto priemonių radijo trukdžių (elektromagnetinio
    suderinamumo) ir Tarybos direktyvą 70/156/EEB dėl valstybių narių įstatymų,
    reglamentuojančių motorinių transporto priemonių ir jų priekabų tipo patvirtinimą,
    suderinimo, siekiant jas suderinti su technikos pažanga
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kummissjoni 2005/49/KE tal- 25 ta' Lulju 2005 li temenda,
    għall finijiet ta’ l-adattament tagħhom għall-progress tekniku, id-Direttiva
    tal-Kunsill 72/245/KEE marbuta ma’ l-interferenza radju (kompatibbiltà elettromanjetika)
    tal-vetturi bil-mutur u d-Direttiva tal-Kunsill 70/156/KE dwar l-approssimazzjoni
    tal-liġijiet ta’ l-Istati Membri dwar l-approvazzjoni tat-tip tal-vetturi bil-mutur
    u t-trejlers tagħhom
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2005/49/EG van de Commissie van 25 juli 2005 tot wijziging van
    Richtlijn 72/245/EEG van de Raad betreffende door voertuigen veroorzaakte radiostoring
    (elektromagnetische compatibiliteit) en van Richtlijn 70/156/EEG inzake de onderlinge
    aanpassing van de wetgevingen van de lidstaten betreffende de goedkeuring van
    motorvoertuigen en aanhangwagens daarvan, met het oog op hun aanpassing aan de
    technische vooruitgang
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2005/49/WE z dnia 25 lipca 2005 r. zmieniająca, w celu
    dostosowania do postępu technicznego, dyrektywę Rady 72/245/EWG odnoszącą
    się do zakłóceń radioelektrycznych (kompatybilności elektromagnetycznej)
    pojazdów i dyrektywę Rady 70/156/EWG w sprawie zbliżenia ustawodawstw Państw
    Członkowskich odnoszących się do homologacji typu pojazdów silnikowych i ich
    przyczep
  type: main
- language: pt
  script: Latn
  content: Directiva 2005/49/CE da Comissão, de 25 de Julho de 2005, que altera,
    para efeitos de adaptação ao progresso técnico, a Directiva 72/245/CEE do Conselho
    relativa às interferências radioeléctricas (compatibilidade electromagnética)
    dos veículos e a Directiva 70/156/CEE do Conselho relativa à aproximação das
    legislações dos Estados-Membros respeitantes à homologação dos veículos
    a motor e seus reboques
  type: main
- language: ro
  script: Latn
  content: Directiva 2005/49/CE a Comisiei din 25 iulie 2005 de modificare, în vederea
    adaptării la progresul tehnic, a Directivei 72/245/CEE a Consiliului privind
    paraziții radioelectrici (compatibilitatea electromagnetică) ai vehiculelor,
    precum și a Directivei 70/156/CEE a Consiliului privind apropierea legislațiilor
    statelor membre referitoare la omologarea de tip a autovehiculelor și a remorcilor
    acestora
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2005/49/ES z 25. júla 2005, ktorou sa mení a dopĺňa,
    za účelom prispôsobenia sa technickému pokroku, smernica Rady 72/245/EHS týkajúca
    sa rádiového odrušenia (elektromagnetickej kompatibility) vozidiel a smernica
    70/156/EHS o aproximácii právnych predpisov členských štátov o typovom schvaľovaní
    motorových vozidiel a ich prípojných vozidiel
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2005/49/ES z dne 25. julija 2005 o spremembi Direktive
    Sveta 72/245/EGS o radijskih motnjah (elektromagnetni združljivosti) vozil in
    Direktive Sveta 70/156/EGS o približevanju zakonodaje držav članic o homologaciji
    motornih in priklopnih vozil zaradi njune prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva 2005/49/CE de la Comisión, de 25 de julio de 2005, por la que
    se modifican, para su adaptación al progreso técnico, la Directiva 72/245/CEE
    del Consejo relativa a las interferencias de radio (compatibilidad electromagnética)
    de los vehículos, y la Directiva 70/156/CEE del Consejo, relativa a la aproximación
    de las legislaciones de los Estados miembros sobre la homologación de vehículos
    a motor y de sus remolques
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2005/49/EG av den 25 juli 2005 om ändring, på
    grund av anpassning till den tekniska utvecklingen, av rådets direktiv 72/245/EEG
    om radiostörningar (elektromagnetisk kompatibilitet) hos fordon och av rådets
    direktiv 70/156/EEG om tillnärmning av medlemsstaternas lagstiftning om typgodkännande
    av motorfordon och släpvagnar till dessa fordon
  type: main
