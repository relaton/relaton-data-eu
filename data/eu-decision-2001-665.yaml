id: EUDecision2001665
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2001/665/EC: Commission Decision of 21 August 2001 prolonging for the
    seventh time the validity of Decision 1999/815/EC concerning measures prohibiting
    the placing on the market of toys and childcare articles intended to be placed
    in the mouth by children under three years of age made of soft PVC containing
    certain phthalates (Text with EEA relevance) (notified under document number C(2001)
    2567)'
  type: main
- language: fr
  script: Latn
  content: '2001/665/CE: Décision de la Commission du 21 août 2001 prolongeant pour
    la septième fois la validité de la décision 1999/815/CE concernant des mesures
    qui interdisent la mise sur le marché de jouets et articles de puériculture
    destinés à être mis en bouche par des enfants de moins de trois ans, fabriqués
    en PVC souple contenant certains phtalates (Texte présentant de l''intérêt
    pour l''EEE) [notifiée sous le numéro C(2001) 2567]'
  type: main
- language: de
  script: Latn
  content: '2001/665/EG: Entscheidung der Kommission vom 21. August 2001 über eine
    siebente Verlängerung der Geltungsdauer der Entscheidung 1999/815/EG über Maßnahmen
    zur Untersagung des Inverkehrbringens von Spielzeug- und Babyartikeln, die dazu
    bestimmt sind, von Kindern unter drei Jahren in den Mund genommen zu werden, und
    aus Weich-PVC bestehen, das bestimmte Weichmacher enthält (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2001) 2567)'
  type: main
- language: da
  script: Latn
  content: '2001/665/EF: Kommissionens beslutning af 21. august 2001 om syvende forlængelse
    af gyldigheden af beslutning 1999/815/EF om forbud mod markedsføring af legetøj
    og småbørnsartikler, der er beregnet til at blive puttet i munden af børn under
    tre år, og som er fremstillet af blød pvc indeholdende visse phthalater (EØS-relevant
    tekst) (meddelt under nummer K(2001) 2567)'
  type: main
- language: el
  script: Grek
  content: '2001/665/ΕΚ: Απόφαση της Επιτροπής, της 21ης
    Αυγούστου 2001, για παράταση για εβδόμη φορά
    της ισχύος της απόφασης 1999/815/ΕΚ σχετικά με
    τα μέτρα που απαγορεύουν την διάθεση στην αγορά
    παιχνιδιών και προϊόντων παιδικής φροντίδας
    κατασκευασμένων από μαλακό PVC που περιέχει
    ορισμένους φθαλικούς εστέρες τα οποία κατά
    τη χρήση μπαίνουν στο στόμα παιδιών ηλικίας
    μικρότερης από τριών ετών (Κείμενο που παρουσιάζει
    ενδιαφέρον για τον ΕΟΧ) [κοινοποιηθείσα υπό
    τον αριθμό Ε(2001) 2567]'
  type: main
- language: fi
  script: Latn
  content: '2001/665/EY: Komission päätös, tehty 21 päivänä elokuuta 2001, toimenpiteistä,
    joilla kielletään tiettyjä ftalaatteja sisältävien, pehmeästä PVC:stä
    valmistettujen, alle kolmivuotiaiden lasten suuhun pantavaksi tarkoitettujen lelujen
    ja lastentarvikkeiden markkinoille saattaminen, tehdyn päätöksen 1999/815/EY
    voimassaoloajan pidentämisestä seitsemännen kerran (ETA:n kannalta merkityksellinen
    teksti) (tiedoksiannettu numerolla K(2001) 2567)'
  type: main
- language: it
  script: Latn
  content: '2001/665/CE: Decisione della Commissione, del 21 agosto 2001, che proroga
    per la settima volta la validità della decisione 1999/815/CE riguardante provvedimenti
    che vietano l''immissione sul mercato di giocattoli e articoli di puericultura
    destinati ad essere messi in bocca da bambini d''età inferiore a tre anni e fabbricati
    in PVC morbido contenente taluni ftalati (Testo rilevante ai fini del SEE) [notificata
    con il numero C(2001) 2567]'
  type: main
- language: nl
  script: Latn
  content: '2001/665/EG: Beschikking van de Commissie van 21 augustus 2001 tot zevende
    verlenging van de geldigheidsduur van Beschikking 1999/815/EG betreffende maatregelen
    houdende verbod op het op de markt brengen van speelgoed- en kinderverzorgingsartikelen
    die bestemd zĳn om door kinderen jonger dan drie jaar in de mond te worden gestopt
    en vervaardigd zĳn van zacht PVC dat bepaalde ftalaten bevat (Voor de EER relevante
    tekst) (kennisgeving geschied onder nummer C(2001) 2567)'
  type: main
- language: pt
  script: Latn
  content: '2001/665/CE: Decisão da Comissão, de 21 de Agosto de 2001, que prorroga
    pela sétima vez o período de validade da Decisão 1999/815/CE relativa a medidas
    de proibição da colocação no mercado de brinquedos e artigos de puericultura
    destinados a ser introduzidos na boca por crianças com menos de três anos de
    idade, fabricados em PVC maleável que contenha determinados ftalatos (Texto relevante
    para efeitos do EEE) [notificada com o número C(2001) 2567]'
  type: main
- language: es
  script: Latn
  content: '2001/665/CE: Decisión de la Comisión, de 21 de agosto de 2001, por la
    que se prolonga por séptima vez la validez de la Decisión 1999/815/CE sobre
    medidas relativas a la prohibición de la comercialización de determinados juguetes
    y artículos de puericultura destinados a ser introducidos en la boca por niños
    menores de tres años y fabricados con PVC blando que contenga ciertos ftalatos
    (Texto pertinente a efectos del EEE) [notificada con el número C(2001) 2567]'
  type: main
- language: sv
  script: Latn
  content: '2001/665/EG: Kommissionens beslut av den 21 augusti 2001 om förlängning
    för sjunde gången av beslut 1999/815/EG om åtgärder för att förbjuda utsläppandet
    på marknaden av leksaker och barnavårdsartiklar som är avsedda att stoppas
    i munnen av barn under tre års ålder, tillverkade i mjuk PVC-plast som innehåller
    vissa ftalater (Text av betydelse för EES) [delgivet med nr K(2001) 2567]'
