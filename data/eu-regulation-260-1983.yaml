title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 260/83 of 31 January 1983 re-establishing
    the levying of customs duties on glazed setts, flags and paving, hearth and wall
    tiles, falling within heading No 69.08 and originating in Thailand, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3377/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 260/83 de la Commission du 31 janvier 1983 portant
    rétablissement de la perception des droits de douane applicables aux autres carreaux,
    pavés et dalles de pavement ou de revêtement, de la position 69.08 du tarif
    douanier commun, originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 260/83 der Kommission vom 31. Januar 1983 zur Wiedereinführung
    der Erhebung der Zölle für Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    glasiert der Tarifnummer 69.08, mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 260/83 af 31. januar 1983 om genindførelse
    af opkrævning af told for glaserede sten og fliser til brolægning, gulvbelægning
    eller beklædning af vægge, kaminer o.l., henhørende under pos. 69.08 og med
    oprindelse i Thailand, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 260/83 της Επιτροπής
    της 31ης Ιανουαρίου 1983 περί αποκαταστάσεως
    της εφαρμογής των δασμών για έτερα πλακίδια,
    κύβους και πλάκες δαπέδου ή επενδύσεως της
    κλάσεως 69.08 του Κοινού Δασμολογίου, καταγωγής
    Ταϋλάνδης, δικαιούχου των προβλεπομένων από
    τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 260/83 della Commissione del 31 gennaio 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle altre piastrelle, blocchetti
    e lastre da pavimentazione o da rivestimento, della voce 69.08 della tariffa doganale
    comune, originari della Tailandia beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 260/83 van de Commissie van 31 januari 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere plavuizen
    en andere vloer- en wandtegels van tariefpost 69.08 van oorsprong uit Thailand,
    waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
