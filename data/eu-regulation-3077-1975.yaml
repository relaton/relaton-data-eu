- language: en
  script: Latn
  content: Regulation (EEC) No 3077/75 of the Council of 17 November 1975 temporarily
    suspending totally the customs duties applicable in the Community as originally
    constituted to a number of chemical products imported from the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3077/75 du Conseil, du 17 novembre 1975, portant suspension
    temporaire et totale des droits de douane applicables dans la Communauté dans
    sa composition originaire sur un certain nombre de produits chimiques importés
    des nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3077/75 des Rates vom 17. November 1975 zur zeitweiligen
    und vollständigen Aussetzung der in der Gemeinschaft in ihrer ursprünglichen
    Zusammensetzung anwendbaren Zollsätze für die Einfuhr von einigen chemischen
    Waren aus den neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3077/75 af 17. november 1975 om midlertidig
    og fuldstændig suspension af de toldsatser, der i Fællesskabet i dets oprindelige
    udstrækning anvendes på visse kemiske produkter, der indføres fra de nye medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3077/75 del Consiglio, del 17 novembre 1975, che sospende
    temporaneamente e totalmente i dazi doganali applicabili nella Comunità nella
    sua composizione originaria a taluni prodotti chimici importati dai nuovi Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3077/75 van de Raad van 17 november 1975 houdende
    tijdelijke en algehele schorsing van de douanerechten van toepassing in de Gemeenschap
    in haar oorspronkelijke samenstelling voor een aantal chemische produkten, ingevoerd
    uit de nieuwe Lid-Staten
