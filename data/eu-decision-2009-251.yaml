title:
- language: en
  script: Latn
  content: '2009/251/EC: Commission Decision of 17 March 2009 requiring Member States
    to ensure that products containing the biocide dimethylfumarate are not placed
    or made available on the market (notified under document number C(2009) 1723)'
  type: main
- language: fr
  script: Latn
  content: '2009/251/CE: Décision de la Commission du 17 mars 2009 exigeant des États
    membres qu’ils veillent à ce que les produits contenant du fumarate de diméthyle
    (produit biocide) ne soient pas commercialisés ou mis à disposition sur le marché
    [notifiée sous le numéro C(2009) 1723]'
  type: main
- language: de
  script: Latn
  content: '2009/251/EG: Entscheidung der Kommission vom 17. März 2009 zur Verpflichtung
    der Mitgliedstaaten, dafür zu sorgen, dass Produkte, die das Biozid Dimethylfumarat
    enthalten, nicht in Verkehr gebracht oder auf dem Markt bereitgestellt werden
    (Bekannt gegeben unter Aktenzeichen K(2009) 1723)'
  type: main
