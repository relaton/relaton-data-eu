title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1526/80 of 18 June 1980 increasing the volume
    of the Community tariff quota opened for 1980 for ferro-chromium, containing not
    less than 4% by weight of carbon and falling within subheading ex 73.02 E I of
    the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1526/80 du Conseil, du 18 juin 1980, portant augmentation
    du volume du contingent tarifaire communautaire ouvert pour l' année 1980 pour
    le ferrochrome contenant en poids 4% ou plus de carbone de la sous-position ex
    73.02 E I du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1526/80 des Rates vom 18. Juni 1980 zur Aufstockung
    des für das Jahr 1980 eröffneten Gemeinschaftszollkontingents für Ferrochrom
    mit einem Gehalt an Kohlenstoff von 4 Gewichtshundertteilen oder mehr der Tarifstelle
    ex 73.02 E I des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1526/80 af 18. juni 1980 om forhøjelse af
    det for 1980 åbnede fællesskabstoldkontingent for ferrochrom indeholdende mindst
    4 vægtprocent kulstof, henhørende under pos. ex 73.02 E I den fælles toldtarif
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1526/80 del Consiglio, del 18 giugno 1980, relativo
    all' aumento del volume del contingente tariffario comunitario aperto per il 1980
    per il ferrocromo contenente, in peso, il 4% o più di carbonio, della sottovoce
    ex 73.02 E I della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1526/80 van de Raad van 18 juni 1980 houdende verhoging
    van het voor 1980 geopende communautaire tariefcontingent voor ferrochroom, bevattende
    4 of meer gewichtspercenten koolstof, van onderverdeling ex 73.02 E I van het
    gemeenschappelijk douanetarief
