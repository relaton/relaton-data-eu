    im Rahmen des Antisubventionsverfahrens betreffend die Einfuhren von Rohrformstücken,
    Rohrverschlußstücken und Rohrverbindungsstücken aus Temperguß mit Ursprung
    in Spanien und zur endgültigen Vereinnahmung des vorläufigen Ausgleichszolls
  type: main
