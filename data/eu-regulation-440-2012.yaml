    αλιείας προς την Ευρωπαϊκή Ένωση
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 440/2012, 24. mai 2012 , millega muudetakse
    rakendusmäärust (EL) nr 439/2011 erandi kohta määrusest (EMÜ) nr 2454/93
    seoses üldise tariifsete soodustuste süsteemi raames kehtestatud päritolustaatusega
    toodete määratlusega, et võtta arvesse Cabo Verde eriolukorda teatavate kalandustoodete
    Euroopa Liitu eksportimisel
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 440/2012, annettu 24 päivänä
    toukokuuta 2012 , yleisessä tullietuusjärjestelmässä käytettävästä asetuksessa
    (ETY) N:o 2454/93 vahvistetusta ”alkuperätuotteiden” käsitteen määritelmästä
    poikkeamisesta Kap Verden erityistilanteen huomioon ottamiseksi tiettyjen Euroopan
    unioniin vietävien kalastustuotteiden osalta annetun täytäntöönpanoasetuksen
    (EU) N:o 439/2011 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 440/2012 od 24. svibnja 2012. o izmjeni
    Provedbene uredbe (EU) br. 439/2011 o odstupanju od Uredbe (EEZ) br. 2454/93 u
    vezi s određenjem pojma proizvoda s podrijetlom koji se koristi za potrebe sustava
    općih carinskih povlastica kako bi se uzela u obzir specifična situacija u Kabo
    Verdeu u pogledu izvoza određenih proizvoda ribarstva u Europsku uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság 440/2012/EU végrehajtási rendelete ( 2012. május 24. )
    a Zöld-foki-szigeteknek az Európai Unióba irányuló egyes halászati termékek
    exportjával kapcsolatos különleges helyzetére figyelemmel a „származó
    termék” általános preferenciarendszer alkalmazásában használt fogalmának
    meghatározása tekintetében a 2454/93/EGK rendelettől való eltérésről szóló
    439/2011/EU végrehajtási rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 440/2012 della Commissione, del 24 maggio
    2012 , recante modifica del regolamento di esecuzione (UE) n. 439/2011 in merito
    a una deroga al regolamento (CEE) n. 2454/93 per quanto riguarda la definizione
    della nozione di «prodotti originari» stabilita nell’ambito dello schema di
    preferenze tariffarie generalizzate per tener conto della particolare situazione
    di Capo Verde relativamente all’esportazione di taluni prodotti della pesca
    nell’Unione europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 440/2012 ( 2012. gada 24. maijs
    ), ar kuru groza Īstenošanas regulu (ES) Nr. 439/2011, ar ko piemēro atkāpi
    no Regulas (EEK) Nr. 2454/93 attiecībā uz to, kā definēt noteiktas izcelsmes
    produktu jēdzienu izmantošanai vispārējo tarifu preferenču sistēmā, lai
    ņemtu vērā Kaboverdes īpašo stāvokli attiecībā uz dažu zvejas produktu
    eksportu uz Eiropas Savienību
  type: main
- language: lt
  script: Latn
  content: 2012 m. gegužės 24 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 440/2012,
    kuriuo iš dalies keičiamas Įgyvendinimo reglamentas (ES) Nr. 439/2011, kuriuo
    dėl kilmės statusą turinčių produktų sąvokos bendrojoje lengvatinių muitų
    tarifų sistemoje apibrėžties leidžiama nukrypti nuo Reglamento (EEB) Nr. 2454/93,
    kad būtų atsižvelgta į ypatingą Žaliojo Kyšulio padėtį, susijusią su
    tam tikrų žuvininkystės produktų eksportu į Europos Sąjungą
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 440/2012 tal-
    24 ta’ Mejju 2012 li jemenda r-Regolament ta’ Implimentazzjoni (UE) Nru 439/2011
    dwar deroga mir-Regolament (KEE) Nru 2454/93 dwar id-definizzjoni tal-kunċett
    tal-prodotti oriġinanti li jintuża għall-finijiet tal-iskema ta’ preferenzi
    tariffarji ġeneralizzati sabiex titqies is-sitwazzjoni speċjali tal-Kap Verde
    fir-rigward tal-esportazzjoni ta’ ċerti prodotti tas-sajd lejn l-Unjoni Ewropea
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 440/2012 van de Commissie van 24 mei 2012
    tot wijziging van Uitvoeringsverordening (EU) nr. 439/2011 houdende afwijking
    van de in Verordening (EEG) nr. 2454/93 opgenomen definitie van het begrip „producten
    van oorsprong” in het kader van het schema van algemene tariefpreferenties in
    verband met de bijzondere situatie van Kaapverdië wat de uitvoer van bepaalde
    visserijproducten naar de Europese Unie betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 440/2012 z dnia 24 maja 2012
    r. zmieniające rozporządzenie wykonawcze Komisji (UE) nr 439/2011 w sprawie
    odstępstwa od rozporządzenia Komisji (EWG) nr 2454/93 w odniesieniu do definicji
    pojęcia produktów pochodzących, używanej do celów ogólnego systemu preferencji,
    w celu uwzględnienia szczególnej sytuacji Republiki Zielonego Przylądka dotyczącej
    wywozu niektórych produktów rybołówstwa do Unii Europejskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 440/2012 da Comissão, de 24 de maio
    de 2012 , que altera o Regulamento de Execução (UE) n. ° 439/2011 que derroga
    o Regulamento (CEE) n. ° 2454/93 no respeitante à definição da noção de
    produtos originários para fins do sistema de preferências generalizadas, de
    forma a ter em conta a situação especial de Cabo Verde em relação às exportações
    de certos produtos da pesca para a União Europeia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 440/2012 al Comisiei din 24
    mai 2012 de modificare a Regulamentului de punere în aplicare (UE) nr. 439/2011
    privind acordarea unei derogări de la Regulamentul (CEE) nr. 2454/93 în ceea
    ce privește definiția conceptului de „produse originare” folosit în cadrul
    sistemului de preferințe tarifare generalizate, pentru a ține seama de situația
    specială din Capul Verde în ceea ce privește exporturile anumitor produse pescărești
    către Uniunea Europeană
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 440/2012 z 24. mája 2012 , ktorým
    sa mení a dopĺňa vykonávacie nariadenie (EÚ) č. 439/2011 o výnimke z nariadenia
    (EHS) č. 2454/93, pokiaľ ide o vymedzenie pojmu pôvodné výrobky používaného
    na účely systému všeobecných colných preferencií, aby sa zohľadnila osobitná
    situácia Kapverdských ostrovov v súvislosti s vývozom určitých rybárskych
    výrobkov do Európskej únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 440/2012 z dne 24. maja 2012 o spremembi
    Izvedbene uredbe (EU) št. 439/2011 o odstopanju od Uredbe (EGS) št. 2454/93
    glede opredelitve pojma „izdelek s poreklom“ , ki se uporablja za splošno
    shemo tarifnih preferencialov, z namenom da se upošteva posebni položaj Zelenortskih
    otokov glede izvoza nekaterih ribiških proizvodov v Evropsko unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 440/2012 de la Comisión, de 24 de mayo
    de 2012 , que modifica el Reglamento de Ejecución (UE) n ° 439/2011 de la Comisión
    por el que se establece una excepción al Reglamento (CEE) n ° 2454/93 en lo
    relativo a la definición de la noción de productos originarios utilizada a los
    efectos del sistema de preferencias arancelarias generalizadas, atendiendo a la
    situación particular de Cabo Verde en lo que respecta a las exportaciones de
    determinados productos de la pesca a la Unión Europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 440/2012 av den 24 maj 2012
    om ändring av genomförandeförordning (EU) nr 439/2011 om undantag från förordning
    (EEG) nr 2454/93 med avseende på definitionen av begreppet ”ursprungsprodukter”
    som fastställs inom ramen för systemet för allmän förmånsbehandling för
    att ta hänsyn till Kap Verdes särskilda situation när det gäller vissa fiskeriprodukter
    som exporteras från detta land till Europeiska unionen
  type: main
