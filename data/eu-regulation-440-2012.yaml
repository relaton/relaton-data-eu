title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 440/2012 of 24 May 2012 amending
    Implementing Regulation (EU) No 439/2011 on a derogation from Regulation (EEC)
    No 2454/93 in respect of the definition of the concept of originating products
    used for the purposes of the scheme of generalised tariff preferences to take
    account of the special situation of Cape Verde regarding exports of certain fisheries
    products to the European Union
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 440/2012 de la Commission du 24 mai
    2012 modifiant le règlement d’exécution (UE) n ° 439/2011 portant dérogation
    au règlement (CEE) n ° 2454/93 en ce qui concerne la définition de la notion
    de «produits originaires» établie dans le cadre du schéma de préférences
    tarifaires généralisées, en vue de prendre en compte la situation particulière
    du Cap-Vert pour l’exportation de certains produits de la pêche vers l’Union
    européenne
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 440/2012 der Kommission vom 24. Mai 2012
    zur Änderung der Durchführungsverordnung (EU) Nr. 439/2011 zur Abweichung von
    der Verordnung (EWG) Nr. 2454/93 in Bezug auf die Bestimmung des Begriffs „Ursprungserzeugnisse“
    im Rahmen des Schemas allgemeiner Zollpräferenzen zur Berücksichtigung der besonderen
    Lage von Kap Verde bei bestimmten in die Europäische Union ausgeführten Fischereierzeugnissen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 440/2012 на Комисията
    от 24 май 2012 година за изменение на Регламент
    за изпълнение (ЕС) № 439/2011 относно дерогация
    от Регламент (ЕИО) № 2454/93 във връзка с определението
    на понятието „продукти с произход“ , установено
    в рамките на схемата на общите тарифни преференции,
    с цел отчитане на специалната ситуация на Кабо
    Верде по отношение на износа на някои рибни
    продукти за Европейския съюз
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 440/2012 ze dne 24. května 2012
    , kterým se mění prováděcí nařízení (EU) č. 439/2011 o odchylce od nařízení
    (EHS) č. 2454/93, pokud jde o definici pojmu „původní produkty“ používanou
    pro účely systému všeobecných celních preferencí s ohledem na zvláštní
    situaci Kapverd v případě některých produktů rybolovu vyvážených z této
    země do Evropské unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 440/2012 af 24. maj 2012
    om ændring af gennemførelsesforordning (EU) nr. 439/2011 om en undtagelse fra
    forordning (EØF) nr. 2454/93, hvad angår definitionen af begrebet »varer med
    oprindelsesstatus« med henblik på den generelle præferenceordning, for at tage
    hensyn til den særlige situation i Kap Verde, når det gælder eksport af visse
    fiskevarer til EU
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 440/2012
    της Επιτροπής, της 24ης Μαΐου 2012 , για την τροποποίηση
    του εκτελεστικού κανονισμού (ΕΕ) αριθ. 439/2011
