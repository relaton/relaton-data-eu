---
id: EURegulation13162014
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1316/2014 of 11 December 2014
    approving the active substance Bacillus amyloliquefaciens subsp. plantarum strain
    D747, in accordance with Regulation (EC) No 1107/2009 of the European Parliament
    and of the Council concerning the placing of plant protection products on the
    market, and amending the Annex to Commission Implementing Regulation (EU) No 540/2011
    and allowing Member States to extend provisional authorisations granted for that
    active substance
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 1316/2014 de la Commission du 11 décembre
    2014 portant approbation de la substance active Bacillus amyloliquefaciens subsp.
    plantarum , souche D747, conformément au règlement (CE) n ° 1107/2009 du Parlement
    européen et du Conseil concernant la mise sur le marché des produits phytopharmaceutiques,
    modifiant l'annexe du règlement d'exécution (UE) n ° 540/2011 de la Commission
    et autorisant les États membres à prolonger les autorisations provisoires accordées
    pour cette substance active
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1316/2014 der Kommission vom 11. Dezember
    2014 zur Genehmigung des Wirkstoffs Bacillus amyloliquefaciens subsp. plantarum
    Stamm D747 gemäß der Verordnung (EG) Nr. 1107/2009 des Europäischen Parlaments
    und des Rates über das Inverkehrbringen von Pflanzenschutzmitteln und zur Änderung
    des Anhangs der Durchführungsverordnung (EU) Nr. 540/2011 der Kommission sowie
    zur Ermächtigung der Mitgliedstaaten, die vorläufigen Zulassungen für diesen
    Wirkstoff zu verlängern
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 1316/2014 на
    Комисията от 11 декември 2014 година за одобряване
    на активното вещество Bacillus amyloliquefaciens subsp. plantarum
    , щам D747 в съответствие с Регламент (ЕО) № 1107/2009
    на Европейския парламент и на Съвета относно
    пускането на пазара на продукти за растителна
    защита, за изменение на приложението към Регламент
    за изпълнение (ЕС) № 540/2011 на Комисията и за
    даване на възможност на държавите членки да
    удължат срока на временните разрешения, предоставени
    за активното вещество
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 1316/2014 ze dne 11. prosince
    2014 , kterým se v souladu s nařízením Evropského parlamentu a Rady (ES)
    č. 1107/2009 o uvádění přípravků na ochranu rostlin na trh schvaluje účinná
    látka Bacillus amyloliquefaciens subsp. plantarum kmen D747, mění příloha
    prováděcího nařízení Komise (EU) č. 540/2011 a povoluje členským státům
    prodloužení dočasných povolení udělených pro uvedenou účinnou látku
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 1316/2014 af 11. december
    2014 om godkendelse af aktivstoffet Bacillus amyloliquefaciens subsp. plantarum
    stamme D747, jf. Europa-Parlamentets og Rådets forordning (EF) nr. 1107/2009
    om markedsføring af plantebeskyttelsesmidler, om ændring af bilaget til Kommissionens
    gennemførelsesforordning (EU) nr. 540/2011 og om medlemsstaternes forlængelse
    af midlertidige godkendelser af dette aktivstof
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 1316/2014
    της Επιτροπής, της 11ης Δεκεμβρίου 2014 , για την
    έγκριση της δραστικής ουσίας Bacillus amyloliquefaciens
    subsp. plantarum στέλεχος D747 σύμφωνα με τον κανονισμό
    (ΕΚ) αριθ. 1107/2009 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου σχετικά με τη διάθεση φυτοπροστατευτικών
    προϊόντων στην αγορά, και για την τροποποίηση
    του παραρτήματος του εκτελεστικού κανονισμού
    (ΕΕ) αριθ. 540/2011 της Επιτροπής και για να επιτραπεί
    στα κράτη μέλη να παρατείνουν τη διάρκεια προσωρινών
    αδειών κυκλοφορίας που έχουν χορηγηθεί για
    την εν λόγω δραστική ουσία
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 1316/2014, 11. detsember 2014 , millega
    kiidetakse heaks toimeaine Bacillus amyloliquefaciens subsp. plantarum 'i tüvi
    D747 kooskõlas Euroopa Parlamendi ja nõukogu määrusega (EÜ) nr 1107/2009
    taimekaitsevahendite turulelaskmise kohta ning muudetakse komisjoni rakendusmääruse
    (EL) nr 540/2011 lisa ja lubatakse liikmesriikidel pikendada selle toimeaine jaoks
    antud ajutisi lube
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 1316/2014, annettu 11 päivänä
    joulukuuta 2014 , tehoaineen Bacillus amyloliquefaciens subsp. plantarum -kanta
    D747 hyväksymisestä kasvinsuojeluaineiden markkinoille saattamisesta annetun
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1107/2009 mukaisesti ja komission
    täytäntöönpanoasetuksen (EU) N:o 540/2011 liitteen muuttamisesta sekä jäsenvaltioiden
    mahdollisuudesta pidentää kyseistä tehoainetta koskevien väliaikaisten lupien
    voimassaoloa
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 1316/2014 оd 11. prosinca 2014. o
    odobravanju aktivne tvari Bacillus amyloliquefaciens subsp. plantarum soj D747
    u skladu s Uredbom (EZ) br. 1107/2009 Europskog parlamenta i Vijeća o stavljanju
    na tržište sredstava za zaštitu bilja i o izmjeni Priloga Provedbenoj uredbi
    Komisije (EU) br. 540/2011 i o dopuštanju državama članicama da produlje privremena
    odobrenja za tu aktivnu tvar
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1316/2014/EU végrehajtási rendelete ( 2014. december 11.
    ) a Bacillus amyloliquefaciens ssp. plantarum D747 törzse hatóanyagnak a növényvédő
    szerek forgalomba hozataláról szóló 1107/2009/EK európai parlamenti és tanácsi
    rendelet szerinti jóváhagyásáról, az 540/2011/EU bizottsági végrehajtási
    rendelet mellékletének módosításáról, továbbá az említett hatóanyag
    ideiglenes engedélyeinek a tagállamok által történő meghosszabbításának
    engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1316/2014 della Commissione, dell' 11
    dicembre 2014 , che approva la sostanza attiva Bacillus amyloliquefaciens sottospecie
    plantarum ceppo D747 a norma del regolamento (CE) n. 1107/2009 del Parlamento
    europeo e del Consiglio relativo all'immissione sul mercato dei prodotti fitosanitari
    e che modifica l'allegato del regolamento di esecuzione (UE) n. 540/2011 della
    Commissione e consente agli Stati membri di prorogare le autorizzazioni provvisorie
    concesse per tale sostanza attiva
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1316/2014 ( 2014. gada 11. decembris
    ), ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1107/2009
    par augu aizsardzības līdzekļu laišanu tirgū apstiprina darbīgās vielas
    Bacillus amyloliquefaciens subsp. plantarum celmu D747 un groza Komisijas Īstenošanas
    regulas (ES) Nr. 540/2011 pielikumu, kā arī atļauj dalībvalstīm pagarināt
    minētajai darbīgajai vielai piešķirto pagaidu atļauju periodu
  type: main
- language: lt
  script: Latn
  content: 2014 m. gruodžio 11 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1316/2014,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 dėl
    augalų apsaugos produktų pateikimo į rinką patvirtinama veiklioji medžiaga
    Bacillus amyloliquefaciens subsp. plantarum (padermė D747), iš dalies keičiamas
    Komisijos įgyvendinimo reglamento (ES) Nr. 540/2011 priedas ir valstybėms narėms
    leidžiama pratęsti šios veikliosios medžiagos laikinųjų registracijų galiojimą
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) Nru 1316/2014 tal-
    11 ta' Diċembru 2014 li japprova s-sustanza attiva Bacillus amyloliquefaciens
    subsp. plantarum razza D747, skont ir-Regolament (KE) Nru 1107/2009 tal-Parlament
    Ewropew u tal-Kunsill dwar it-tqegħid fis-suq ta' prodotti għall-protezzjoni
    tal-pjanti, u li jemenda l-Anness tar-Regolament ta' Implimentazzjoni tal-Kummissjoni
    (UE) Nru 540/2011 u li jippermetti lill-Istati Membri jestendu l-awtorizzazzjonijiet
    proviżorji mogħtija għal dik is-sustanza attiva
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1316/2014 van de Commissie van 11 december
    2014 tot goedkeuring van de werkzame stof Bacillus amyloliquefaciens subsp. plantarum
    stam D747, overeenkomstig Verordening (EG) nr. 1107/2009 van het Europees Parlement
    en de Raad betreffende het op de markt brengen van gewasbeschermingsmiddelen,
    en tot wijziging van de bijlage bij Uitvoeringsverordening (EU) nr. 540/2011 van
    de Commissie en ter verlening van toestemming aan de lidstaten om de geldigheidsduur
    van voorlopige toelatingen voor de werkzame stof te verlengen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 1316/2014 z dnia 11 grudnia
    2014 r. w sprawie zatwierdzenia substancji czynnej Bacillus amyloliquefaciens
    subsp. plantarum , szczep D747 zgodnie z rozporządzeniem Parlamentu Europejskiego
    i Rady (WE) nr 1107/2009 dotyczącym wprowadzania do obrotu środków ochrony
    roślin oraz w sprawie zmiany załącznika do rozporządzenia wykonawczego Komisji
    (UE) nr 540/2011 i umożliwienia państwom członkowskim przedłużenia tymczasowych
    zezwoleń przyznanych na tę substancję czynną
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 1316/2014 da Comissão, de 11 de dezembro
    de 2014 , que aprova a substância ativa Bacillus amyloliquefaciens subsp. plantarum
    estirpe D747, em conformidade com o Regulamento (CE) n. ° 1107/2009 do Parlamento
    Europeu e do Conselho relativo à colocação de produtos fitofarmacêuticos no
    mercado, e que altera o anexo do Regulamento de Execução (UE) n. ° 540/2011
    da Comissão e autoriza os Estados-Membros a prorrogar as autorizações provisórias
    concedidas para essa substância ativa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1316/2014 al Comisiei din
    11 decembrie 2014 de aprobare a substanței active Bacillus amyloliquefaciens
    subsp. plantarum tulpina D747, în conformitate cu Regulamentul (CE) nr. 1107/2009
    al Parlamentului European și al Consiliului privind introducerea pe piață a
    produselor fitosanitare, de modificare a anexei la Regulamentul de punere în
    aplicare (UE) nr. 540/2011 al Comisiei și de acordare a permisiunii statelor
    membre să extindă autorizațiile provizorii pentru substanța activă respectivă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1316/2014 z 11. decembra 2014
    , ktorým sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009
    o uvádzaní prípravkov na ochranu rastlín na trh schvaľuje účinná látka
    Bacillus amyloliquefaciens subsp. plantarum kmeň D747, ktorým sa mení príloha
    k vykonávaciemu nariadeniu Komisie (EÚ) č. 540/2011 a ktorým sa členským
    štátom povoľuje predĺžiť platnosť dočasných autorizácií udelených
    pre uvedenú účinnú látku
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1316/2014 z dne 11. decembra 2014 o
    odobritvi aktivne snovi Bacillus amyloliquefaciens subsp. plantarum sev D747 v
    skladu z Uredbo (ES) št. 1107/2009 Evropskega parlamenta in Sveta o dajanju fitofarmacevtskih
    sredstev v promet ter o spremembi Priloge k Izvedbeni uredbi Komisije (EU) št.
    540/2011 in o dovoljenju državam članicam, da podaljšajo veljavnost začasnih
    registracij, ki so jih izdale za navedeno aktivno snov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n °1316/2014 de la Comisión, de 11 de diciembre
    de 2014 , por el que se aprueba la sustancia activa Bacillus amyloliquefaciens
    subespecie plantarum , cepa D747, con arreglo al Reglamento (CE) n ° 1107/2009
    del Parlamento Europeo y del Consejo, relativo a la comercialización de productos
    fitosanitarios, se modifica el anexo del Reglamento de Ejecución (UE) n ° 540/2011
    de la Comisióny se amplían las autorizaciones provisionales concedidas para
    dicha sustancia activa
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1316/2014 av den 11 december
    2014 om godkännande av det verksamma ämnet Bacillus amyloliquefaciens subsp.
    plantarum stam D747 i enlighet med Europaparlamentets och rådets förordning
    (EG) nr 1107/2009 om utsläppande av växtskyddsmedel på marknaden, och om ändring
    av bilagan till kommissionens genomförandeförordning (EU) nr 540/2011 samt om
    tillstånd för medlemsstaterna att förlänga provisoriska godkännanden som
    beviljats det verksamma ämnet
