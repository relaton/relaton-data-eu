title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 425/78 of 28 February 1978 re-establishing
    the levying of customs duties on spoons, forks, fish-eaters, etc., of stainless
    steel, falling within subheading 82.14 A and originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 425/78 de la Commission, du 28 février 1978, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, fourchettes, pelles à tarte, etc. en acier inoxydable, de la sous-position
    tarifaire 82.14 A, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 425/78 der Kommission vom 28. Februar 1978 zur Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen, Gabeln, Tortenschaufeln usw., aus
    rostfreiem Stahl, der Tarifstelle 82.14 A, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 425/78 af 28. februar 1978 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler, fiskenive etc, af rustfrit stål,
    under underposition 82.14 A, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 425/78 della Commissione, del 28 febbraio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai cucchiai, cucchiaioni,
    forchette, palette da torta, ecc., di acciaio inossidabile, della sottovoce 82.14
    A della tariffa doganale comune, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 425/78 van de Commissie van 28 februari 1978 houdende
    wederinstelling van de heffing van de douanerechten voor lepels, pollepels, vorken,
    taartscheppen, enz., van roestvrij staal, van post 82.14 A, van oorsprong uit
    de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77
    van de Raad tariefpreferenties werden geopend
  type: main
