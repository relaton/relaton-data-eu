title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/1457 of 16 July 2025 amending
    Implementing Decision (EU) 2023/2723 as regards the withdrawal of the reference
    to harmonised standard EN 60335-2-60:2003 on particular requirements for whirlpool
    baths and whirlpool spas, and as regards the publication with restriction of the
    reference to harmonised standards EN 60335-1:2012 on general requirements for
    household and similar electrical appliances, as well as EN 60335-2-27:2013 on
    particular requirements for appliances for skin exposure to ultraviolet and infrared
    radiation
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/1457 de la Commission du 16 juillet
    2025 modifiant la décision d’exécution (UE) 2023/2723 en ce qui concerne le
    retrait de la référence à la norme harmonisée EN 60335-2-60:2003 relative
    aux exigences particulières applicables aux spas et baignoires à système de
    brassage d’eau, et en ce qui concerne la publication avec restriction de la
    référence à la norme harmonisée EN 60335-1:2012 relative aux exigences générales
    applicables aux appareils électrodomestiques et analogues, ainsi qu’à la norme
    EN 60335-2-27:2013 relative aux exigences particulières applicables aux appareils
    d’exposition de la peau aux rayons ultraviolets et infrarouges
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/1457 der Kommission vom 16. Juli 2025
    zur Änderung des Durchführungsbeschlusses (EU) 2023/2723 hinsichtlich der Streichung
    der Fundstelle der harmonisierten Norm EN 60335-2-60:2003 über besondere Anforderungen
    für Sprudelbadgeräte und Sprudelbäder und hinsichtlich der mit Einschränkung
    versehenen Veröffentlichung der Fundstellen der harmonisierten Normen EN 60335-1:2012
    über allgemeine Anforderungen an elektrische Geräte für den Hausgebrauch und
    ähnliche Zwecke sowie EN 60335-2-27:2013 über besondere Anforderungen für Hautbestrahlungsgeräte
    mit Ultraviolett- und Infrarotstrahlung
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2025/1457 на Комисията
    от 16 юли 2025 година за изменение на Решение за
    изпълнение (ЕС) 2023/2723 чрез оттегляне на данните
    за хармонизиран стандарт EN 60335-2-60:2003 за специфичните
    изисквания за вихровите вани и душове и чрез
    публикуване на ограничението на данните за
    хармонизиран стандарт EN 60335-1:2012 за общите изисквания
    за битовите и подобните електрически уреди
    и хармонизиран стандарт EN 60335-2-27:2013 за специфичните
    изисквания за уредите за облъчване на кожата
    с ултравиолетово и инфрачервено лъчение
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2025/1457 ze dne 16. července 2025,
    kterým se mění prováděcí rozhodnutí (EU) 2023/2723, pokud jde o zrušení
    odkazu na harmonizovanou normu EN 60335-2-60:2003 o zvláštních požadavcích
    na vířivé vany a vířivé lázně a o zveřejnění odkazu s omezením na
    harmonizované normy EN 60335-1:2012 o obecných požadavcích na elektrické
    spotřebiče pro domácnost a podobné účely a EN 60335-2-27:2013 o zvláštních
    požadavcích na spotřebiče pro ošetřování pleti použitím ultrafialového
    a infračerveného záření
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2025/1457 af 16. juli 2025
    om ændring af gennemførelsesafgørelse (EU) 2023/2723 for så vidt angår tilbagetrækningen
    af referencen til den harmoniserede standard EN 60335-2-60:2003 vedrørende særlige
    bestemmelser for boblebade og spa samt for så vidt angår offentliggørelse,
    med en begrænsning, af referencen til den harmoniserede standard EN 60335-1:2012
    vedrørende generelle krav til elektriske apparater til husholdningsbrug o.l.
    samt EN 60335-2-27:2013 om særlige krav til apparater til hudbehandling med ultraviolet
    og infrarød bestråling
  type: main
