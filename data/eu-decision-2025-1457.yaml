    των στοιχείων αναφοράς των εναρμονισμένων
    προτύπων EN 60335-1:2012 σχετικά με τις γενικές απαιτήσεις
    για ηλεκτρικές συσκευές οικιακής και παρόμοιας
    χρήσης και EN 60335-2-27:2013 σχετικά με ειδικές απαιτήσεις
    για συσκευές για την έκθεση της επιδερμίδας
    σε υπεριώδη και υπέρυθρη ακτινοβολία
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2025/1457, 16. juuli 2025, millega muudetakse
    rakendusotsust (EL) 2023/2723, kustutades sellest viite harmoneeritud standardile
    EN 60335-2–60:2003, mis käsitleb erinõudeid mullivannidele ja mullibasseinidele,
    ning avaldades piiranguga viite harmoneeritud standardile EN 60335-1:2012, mis
    käsitleb majapidamis- ja muude taoliste elektriseadmete üldnõudeid, ja harmoneeritud
    standardile EN 60335-2–27:2013, mis käsitleb erinõudeid nahakiiritusseadmetele,
    mis põhinevad optilisel kiirgusel
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2025/1457, annettu 16 päivänä
    heinäkuuta 2025, täytäntöönpanopäätöksen (EU) 2023/2723 muuttamisesta
    siltä osin kuin on kyse poreammeita ja porealtaita koskevista erityisvaatimuksista
    annetun yhdenmukaistetun standardin EN 60335-2-60:2003 viitetietojen poistamisesta
    ja kotitaloussähkölaitteita ja vastaavia koskevista yleisistä vaatimuksista
    annetun yhdenmukaistetun standardin EN 60335-1:2012 ja laitteita, joissa iho joutuu
    alttiiksi ultravioletti- ja infrapunasäteilylle, koskevista erityisvaatimuksista
    annetun yhdenmukaistetun standardin EN 60335-2-27:2013 viitetietojen julkaisemisesta
    rajoituksin
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2025/1457 ón gCoimisiún an 16 Iúil 2025
    lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2023/2723 a mhéid a bhaineann
    le tarraingt siar na tagartha do chaighdeán comhchuibhithe EN 60335-2-60:2003
    maidir le ceanglais ar leith maidir le folcadáin ghuairneáin agus spánna guairneáin,
    agus a mhéid a bhaineann leis an tagairt do chaighdeáin chomhchuibhithe EN 60335-1:2012
    maidir le ceanglais ghinearálta maidir le fearais tí agus fearais leictreacha
    dá samhail agus EN 60335-2-27:2013 maidir le ceanglais ar leith maidir le fearais
    chun craiceann a nochtadh do radaíocht ultraivialait agus infridhearg a fhoilsiú
    maille le srian
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2025/1457 оd 16. srpnja 2025. o izmjeni
    Provedbene odluke (EU) 2023/2723 u pogledu povlačenja upućivanja na usklađenu
    normu EN 60335-2-60:2003 o posebnim zahtjevima za vrtložne kupke i u pogledu
    objave s ograničenjem upućivanja na usklađene norme EN 60335-1:2012 o općim
    zahtjevima za kućanske i slične električne aparate te EN 60335-2-27:2013 o
    posebnim zahtjevima za aparate za izlaganje kože ultraljubičastomu i infracrvenomu
    zračenju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1457 végrehajtási határozata (2025. július 16.)
    az (EU) 2023/2723 végrehajtási határozatnak az örvény- és pezsgőgyógyfürdők
    egyedi előírásairól szóló EN 60335-2-60:2003 harmonizált szabványra való
    hivatkozás visszavonása, valamint a háztartási és hasonló jellegű villamos
    készülékek általános követelményeiről szóló EN 60335-1:2012 harmonizált
    szabványra, valamint a bőr ultraibolya és infravörös besugárzására használt
    készülékekre vonatkozó egyedi követelményekről szóló EN 60335-2-27:2013
    harmonizált szabványra való hivatkozás korlátozással történő közzététele
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/1457 della Commissione, del 16 luglio
    2025, recante modifica della decisione di esecuzione (UE) 2023/2723 per quanto
    riguarda il ritiro del riferimento della norma armonizzata EN 60335-2-60:2003
    relativa a norme particolari per vasche e minipiscine idromassaggio e per quanto
    riguarda la pubblicazione con limitazione del riferimento delle norme armonizzate
    EN 60335-1:2012 relativa a norme generali per gli apparecchi elettrici d’uso
    domestico e similare e EN 60335-2-27:2013 relativa a norme particolari per apparecchi
    per il trattamento della pelle con raggi ultravioletti ed infrarossi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2025/1457 (2025. gada 16. jūlijs)
    ar ko Īstenošanas lēmumu (ES) 2023/2723 groza, atsaucot atsauci uz saskaņoto
    standartu EN 60335-2-60:2003 par īpašām prasībām burbuļvannām un publicējot
    atsauci ar ierobežojumu attiecībā uz saskaņotajiem standartiem EN 60335-1:2012
    par vispārīgām prasībām mājsaimniecības un līdzīgām elektroierīcēm,
    kā arī EN 60335-2-27:2013 par īpašām prasībām ierīcēm, kas paredzētas
    ādas apstarošanai ar ultravioletajiem un infrasarkanajiem stariem
  type: main
- language: lt
  script: Latn
  content: 2025 m. liepos 16 d. Komisijos įgyvendinimo sprendimas (ES) 2025/1457,
    kuriuo dėl nuorodos į darnųjį standartą EN 60335-2-60:2003 dėl ypatingųjų
    reikalavimų, keliamų sūkurinėms vonioms ir sūkurinėms spa vonioms, panaikinimo
    ir dėl nuorodos į darniuosius standartus EN 60335-1:2012 dėl bendrųjų reikalavimų,
    keliamų buitiniams ir panašios paskirties elektriniams prietaisams, ir EN 60335-2-27:2013
    dėl ypatingųjų reikalavimų, keliamų odos švitinimo ultravioletine ir infraraudonąja
    spinduliuote prietaisams, paskelbimo su apribojimu iš dalies keičiamas Įgyvendinimo
    sprendimas (ES) 2023/2723
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/1457 tas-16
    ta’ Lulju 2025 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2023/2723
    fir-rigward tal-irtirar tar-referenza għall-istandard armonizzat EN 60335-2-60:2003
    dwar rekwiżiti partikolari għall-banjijiet għall-idromassaġġi u spa idromassaġġi,
    u fir-rigward tal-pubblikazzjoni b’restrizzjoni tar-referenza għall-istandards
    armonizzati EN 60335-1:2012 dwar ir-rekwiżiti ġenerali għall-apparat elettriku
    li jintuża fid-dar u apparat simili, kif ukoll EN 60335-2-27:2013 dwar rekwiżiti
    partikolari għal apparati għal apparati għall-esponiment tal-ġilda għal radjazzjoni
    ultravjola u infraħamra
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2025/1457 van de Commissie van 16 juli 2025 tot
    wijziging van Uitvoeringsbesluit (EU) 2023/2723 wat betreft de schrapping van
    het referentienummer van geharmoniseerde norm EN 60335-2-60:2003 betreffende bijzondere
    eisen voor whirlpoolbaden en whirlpoolbronnen, en wat betreft de bekendmaking
    met beperking van het referentienummer van de geharmoniseerde normen EN 60335-1:2012
    betreffende algemene eisen voor huishoudelijke en soortgelijke elektrische toestellen
    en EN 60335-2-27:2013 betreffende bijzondere eisen voor huidbestralingstoestellen
    met ultraviolette en infraroodstraling
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2025/1457 z dnia 16 lipca 2025 r. zmieniająca
    decyzję wykonawczą (UE) 2023/2723 w odniesieniu do wycofania odniesienia do
    normy zharmonizowanej EN 60335-2-60:2003 w sprawie wymagań szczegółowych dotyczących
    wanien z wirem wodnym do kąpieli i do zabiegów zdrowotnych, a także w odniesieniu
    do opublikowania z ograniczeniem odniesienia do norm zharmonizowanych EN 60335-1:2012
    w sprawie wymagań ogólnych dotyczących elektrycznego sprzętu do użytku domowego
    i podobnego oraz EN 60335-2-27:2013 w sprawie wymagań szczegółowych dotyczących
    urządzeń do naświetlania skóry promieniowaniem podczerwonym i nadfioletowym
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2025/1457 da Comissão, de 16 de julho de 2025,
    que altera a Decisão de Execução (UE) 2023/2723 no que diz respeito à retirada
    da referência da norma harmonizada EN 60335-2-60:2003 relativa a regras particulares
    para as banheiras de hidromassagem e no que diz respeito à publicação com restrições
    da referência da norma harmonizada EN 60335-1:2012 relativa aos requisitos gerais
    aplicáveis aos aparelhos eletrodomésticos e análogos, bem como da referência
    EN 60335-2-27:2013 relativa aos requisitos particulares para aparelhos de tratamento
    de pele por radiações ultravioletas e infravermelhos
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/1457 a Comisiei din 16 iulie 2025
    de modificare a Deciziei de punere în aplicare (UE) 2023/2723 în ceea ce privește
    retragerea trimiterii la standardul armonizat EN 60335-2-60:2003 privind cerințele
    speciale pentru căzile de baie cu sistem de barbotare a apei și în ceea ce
    privește publicarea cu restricții a trimiterii la standardele armonizate EN
    60335-1:2012 privind cerințele generale pentru aparatele electrice pentru uz
    casnic și scopuri similare și EN 60335-2-27:2013 privind cerințele speciale
    pentru aparatele de expunere a pielii la radiații ultraviolete și infraroșii
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2025/1457 zo 16. júla 2025, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2023/2723, pokiaľ ide o vypustenie odkazu
    na harmonizovanú normu EN 60335-2-60:2003 o osobitných požiadavkách na vaňové
    víriče a bazénové víriče a pokiaľ ide o uverejnenie odkazu s obmedzením
    na harmonizované normy EN 60335-1:2012 o všeobecných požiadavkách na elektrické
    spotrebiče pre domácnosť a na podobné účely, ako aj EN 60335-2-27:2013 o
    osobitných požiadavkách na spotrebiče určené na ožarovanie pokožky ultrafialovým
    a infračerveným žiarením
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2025/1457 z dne 16. julija 2025 o spremembi
    Izvedbenega sklepa (EU) 2023/2723 glede umika sklica na harmonizirani standard
    EN 60335-2-60:2003 o posebnih zahtevah za vrtinčne kopeli in vrtinčne bazene
    ter glede objave z omejitvijo sklica na harmonizirana standarda EN 60335-1:2012
    o splošnih zahtevah za gospodinjske in podobne električne aparate ter EN 60335-2-27:2013
    o posebnih zahtevah za aparate za nego kože z ultravijoličnim in infrardečim
    sevanjem
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2025/1457 de la Comisión, de 16 de julio
    de 2025, por la que se modifica la Decisión de Ejecución (UE) 2023/2723 en lo
    que respecta a la retirada de la referencia a la norma armonizada EN 60335-2-60:2003,
    sobre requisitos particulares para spas y bañeras de hidromasaje, y en lo que
    respecta a la publicación con restricciones de la referencia a las normas armonizadas
    EN 60335-1:2012, sobre requisitos generales para aparatos electrodomésticos y
    análogos, y EN 60335-2-27:2013, sobre requisitos particulares para aparatos para
    la exposición de la piel a las radiaciones ultravioletas e infrarrojas
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2025/1457 av den 16 juli 2025 om
    ändring av genomförandebeslut (EU) 2023/2723 vad gäller återkallande av hänvisningen
    till den harmoniserade standarden EN 60335–2-60:2003 om särskilda fordringar
    på bubbelbad och liknande utrustning, och vad gäller offentliggörande med begränsning
    av hänvisningen till de harmoniserade standarderna EN 60335–1:2012 om allmänna
    fordringar på elektriska hushållsapparater och liknande bruksföremål samt
    EN 60335–2-27:2013 om särskilda fordringar på bruksföremål för hudbehandling
    med ultraviolett och infraröd bestrålning
