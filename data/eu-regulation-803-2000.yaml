title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 803/2000 of 17 April 2000 laying down to
    what extent applications for issue of export licences submitted during April 2000
    for beef products which may benefit from special import treatment in a third country
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 803/2000 de la Commission, du 17 avril 2000, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'avril 2000 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 803/2000 der Kommission vom 17. April 2000 über das
    Ausmaß, in dem den im April 2000 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 803/2000 af 17. april 2000 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    april 2000 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    et tredjeland, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 803/2000 της Επιτροπής,
    της 17ης Απριλίου 2000, για καθορισμό σε ποιό βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εξαγωγής που υποβλήθηκαν
    τον Απρίλιο 2000 για τα προϊόντα του τομέα του
    βοείου κρέατος ειδικής μεταχειρίσεως κατά
    την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 803/2000, annettu 17 päivänä huhtikuuta 2000,
    kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden huhtikuussa
    2000 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 803/2000 della Commissione, del 17 aprile 2000, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di aprile 2000 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 803/2000 van de Commissie van 17 april 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in april 2000 ingediende aanvragen
    om uitvoercertificaten voor producten van de sector rundvlees waarvoor een bijzondere
    behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 803/2000 da Comissão, de 17 de Abril de 2000, que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Abril de 2000 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 803/2000 de la Comisión, de 17 de abril de 2000, por
    el que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentadas en el mes de abril de 2000, para los productos del
    sector de la carne de bovino que se beneficien de un trato especial para su importación
    en un tercer país
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 803/2000 av den 17 april 2000 om fastställande
    av i vilken utsträckning ansökningar som lämnats in under april månad 2000
    om exportlicens för nötköttsprodukter som berättigar till särskild behandling
    vid import till tredje land får godkännas
  type: main
