  content: Commission Regulation (EC) No 3034/94 of 13 December 1994 establishing
    a list of products excluded from the application of Council Regulation (EEC) No
    737/90 on the conditions governing imports of agricultural products originating
    in third countries following the accident at the Chernobyl nuclear power station
  type: main
- language: fr
  script: Latn
