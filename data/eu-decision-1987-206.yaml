title:
- language: en
  script: Latn
  content: '87/206/EEC: Commission Decision of 12 March 1987 amending, for the second
    time, Decision 76/806/EEC laying down additional provisions concerning statistical
    surveys to be carried out by the Member States in order to determine production
    potential of plantations of certain species of fruit trees'
  type: main
- language: fr
  script: Latn
  content: '87/206/CEE: Décision de la Commission du 12 mars 1987 modifiant pour
    la deuxième fois la décision 76/806/CEE fixant des dispositions complémentaires
    concernant les enquêtes statistiques à effectuer par les États membres en vue
    de déterminer le potentiel de production des plantations de certaines espèces
    d''arbres fruitiers'
  type: main
- language: de
  script: Latn
  content: '87/206/EWG: Entscheidung der Kommission vom 12. März 1987 zur zweiten
    Änderung der Entscheidung 76/806/EWG zur Festlegung ergänzender Vorschriften
    betreffend die von den Mitgliedstaaten durchzuführenden statistischen Erhebungen
    zur Ermittlung des Produktionspotentials bestimmter Baumobstanlagen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 12 март 1987 година
    за изменение за втори път на Решение 76/806/ЕИО
    за определяне на допълнителни разпоредби,
    отнасящи се до статистическите изследвания,
    които държавите-членки следва да извършат
    с цел определяне на производствения потенциал
    на овощните насаждения от определени видове
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 12. března 1987, kterým se podruhé mění
    rozhodnutí 76/806/EHS, kterým se stanoví doplňující ustanovení pro statistická
    zjišťování prováděná členskými státy pro stanovení produkčního potenciálu
    sadů určitých druhů ovocných stromů
  type: main
- language: da
  script: Latn
  content: '87/206/EØF: Kommissionens beslutning af 12. marts 1987 om anden ændring
    af beslutning 76/806/EØF om fastsættelse af supplerende bestemmelser vedrørende
    undersøgelser, der skal foretages af medlemsstaterne for at bestemme produktionskapaciteten
    for plantager med visse arter af frugttræer'
  type: main
- language: el
  script: Grek
  content: '87/206/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
    Μαρτίου 1987 που τροποποιεί για δεύτερη φορά
    την απόφαση 76/806/ΕΟΚ η οποία καθορίζει συμπληρωματικές
    διατάξεις σχετικά με τις στατιστικές έρευνες
    που θα διενεργηθούν από τα κράτη μέλη για τον
    προσδιορισμό του δυναμικού παραγωγής των δενδρώνων
    ορισμένων ειδών οπωροφόρων δένδρων'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 12. märts 1987, millega muudetakse teist korda otsust
    76/806/EMÜ, millega nähakse ette lisasätted, mis käsitlevad liikmesriikide
    poolt tehtavaid vaatlusi teatavate viljapuuliikide istandike tootmispotentsiaali
    kindlaksmääramiseks
  type: main
- language: fi
  script: Latn
  content: '87/206/ETY: Komission päätös, tehty 12 päivänä maaliskuuta 1987,
    täydentävistä määräyksistä, jotka koskevat tilastotietojen keruuta jäsenvaltioissa
    tiettyjen hedelmälajien viljelmien tuotantomahdollisuuksien määrittämiseksi
    tehdyn päätöksen 76/806/ETY muuttamisesta toisen kerran'
  type: main
- language: hr
  script: Latn
  content: '87/206/EEZ: Odluka Komisije od 12. ožujka 1987. kojom se po drugi put
    izmjenjuje Odluka 76/806/EEZ o utvrđivanju dodatnih odredaba vezanih uz istraživanja
    koja provode države članice radi utvrđivanja proizvodnih potencijala nasada
    određenih vrsta voćaka'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1987. március 12.) az egyes gyümölcsfafajok
    ültetvényei termelési potenciáljának meghatározása céljából a tagállamok
    által végzendő felmérésekre vonatkozó kiegészítő rendelkezések megállapításáról
    szóló 76/806/EGK határozat második módosításáról
  type: main
- language: it
  script: Latn
  content: '87/206/CEE: Decisione della Commissione del 12 marzo 1987 che modifica
    per la seconda volta la decisione 76/806/CEE che stabilisce disposizioni complementari
    relative alle indagini statistiche da effettuarsi da parte degli Stati membri
    per determinare il potenziale di produzione di alcune specie di alberi da frutto'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1987. gada 12. marts), ar kuru otro reizi groza Lēmumu
    76/806/EEK ar ko nosaka papildu noteikumus statistiskajiem apsekojumiem, kas dalībvalstīm
    jāveic, lai noteiktu potenciālo ražību dažu sugu augļu koku stādījumiem
  type: main
- language: lt
  script: Latn
  content: 1987 m. kovo 12 d. Komisijos sprendimas, antrą kartą iš dalies keičiantis
    Sprendimą 76/806/EEB, išdėstantį papildomas nuostatas dėl statistinių tyrimų,
    kuriuos turi atlikti valstybės narės tam tikrų rūšių vaismedžių sodinių
    galimam derlingumui nustatyti
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-12 ta’ Marzu 1987 li temenda, għat-tieni
    darba, id-Deċiżjoni 76/806/KEE li tistabbilixxi dispożizzjonijiet addizjonali
    rigward l-istħarriġ statistiku li għandu jsir mill-Istati Membri sabiex iġi
    stabbilit il-potenzjal produttiv ta’ pjantaġġuni ta’ ċerti speċi ta’
    siġar tal-frott
  type: main
- language: nl
  script: Latn
  content: '87/206/EEG: Beschikking van de Commissie van 12 maart 1987 houdende tweede
    wijziging van Beschikking 76/806/EEG houdende aanvullende bepalingen betreffende
    door de Lid-Staten te houden statistische enquêtes, ten einde het produktiepotentieel
    van bepaalde soorten fruitbomen vast te stellen'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 12 marca 1987 r. zmieniająca, po raz drugi, decyzję
    76/806/EWG ustanawiającą dodatkowe przepisy dotyczące badań statystycznych
    mających na celu ustalenie przez Państwa Członkowskie potencjału produkcyjnego
    plantacji niektórych gatunków drzew owocowych
  type: main
- language: pt
  script: Latn
  content: '87/206/CEE: Decisão da Comissão de 12 de Março de 1987 alterando, pela
    segunda vez, a Decisão 76/806/CEE que fixa as disposições complementares respeitantes
    aos inquéritos estatísticos a efectuar pelos Estados-membros com vista a determinar
    o potencial de produção das plantações de certas árvores de fruto'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 12 martie 1987 de modificare pentru a doua oară a
    Deciziei 76/806/CEE de stabilire a unor dispoziții suplimentare privind anchetele
    statistice care trebuie efectuate de către statele membre pentru stabilirea potențialului
    productiv al plantațiilor de anumite specii de pomi fructiferi
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 12. marca 1987, ktorým sa druhýkrát mení a dopĺňa
    rozhodnutie 76/806/EHS stanovujúce ďalšie opatrenia týkajúce sa prieskumov,
    ktoré majú vykonávať členské štáty kvôli určovaniu produkčného potenciálu
    sadov s určitými druhmi ovocných stromov
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije (EGS) z dne 12. marca 1987 ki že drugič spreminja Odločbo
    76/806 (EGS) o določitvi dopolnilnih predpisov v zvezi s statističnimi raziskovanji
    za določitev proizvodnega potenciala določenih vrst v intenzivnih sadovnjakih,
    ki jih opravijo države članice
  type: main
- language: es
  script: Latn
  content: '87/206/CEE: Decisión de la Comisión de 12 de marzo de 1987 por la que
    se modifica por segunda vez la Decisión 76/806/CEE en la que se establecen las
    disposiciones complementarias referentes a las encuestas estadísticas que han
    de efectuar los Estados miembros para determinar el potencial de producción de
    las plantaciones de determinadas especies de árboles frutales'
  type: main
- language: sv
  script: Latn
  content: '87/206/EEG: Kommissionens beslut av den 12 mars 1987 om en andra ändring
    av beslut 76/806/EEG om fastställande av kompletterande bestämmelser beträffande
    statistiska undersökningar av produktionskapaciteten för odlingar med vissa
    slag av fruktträd som skall utföras av medlemsstaterna'
  type: main
