title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1546/69 de la Commission, du 1er août 1969, relatif
    à la vente à prix fixé forfaitairement à l'avance de quartiers de viande bovine
    congelée provenant de l'intervention et détenus par l'organisme allemand d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1546/69 der Kommission vom 1. August 1969 über den
    Verkauf von aus der Intervention stammendem und bei der deutschen Interventionsstelle
    eingelagertem Rindfleisch in gefrorenen Hintervierteln zu einem im voraus pauschal
    festgesetzten Preis
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1546/69 della Commissione, del 1 agosto 1969, relativo
    alla vendita a prezzo fissato forfettariamente in anticipo di quarti posteriori
    di carni bovine congelate che provengono dall'intervento e che si trovano in possesso
    dell'organismo d'intervento tedesco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1546/69 van de Commissie van 1 augustus 1969 betreffende
    de verkoop voor een vooraf forfaitair vastgestelde prijs van bevroren rundvlees,
    achtervoeten, die afkomstig zijn van interventie en in het bezit zijn van het
    Duitse interventiebureau
  type: main
