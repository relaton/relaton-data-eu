id: EUDecision1980923
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/923/EEC: Commission Decision of 11 September 1980 authorizing Ireland
    not to apply Community treatment to gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, falling within heading No 60.02 of the Common Customs
    Tariff (categories 10 and 11), originating in Hong Kong and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/923/CEE: Décision de la Commission, du 11 septembre 1980, autorisant
    l''Irlande à exclure du traitement communautaire la ganterie de bonneterie non
    élastique ni caoutchoutée, de la position 60.02 du tarif douanier commun (catégories
    10 et 11), originaire de Hong-kong et mise en libre pratique dans les autres Etats
    membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/923/EWG: Entscheidung der Kommission vom 11. September 1980, mit der
    Irland ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch noch
    kautschutiert, der Tarifnummer 60.02 des Gemeinsamen Zolltarifs (Kategorien 10
    und 11) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/923/EØF: Kommissionens beslutning af 11. september 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage handsker, vanter og luffer
    af trikotage, ikke elastisk eller gummeret, som henhører under pos. 60.02 i den
    fælles toldtarif (kategori 10 og 11), har oprindelse i Hongkong og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/923/CEE: Decisione della Commissione, dell''11 settembre 1980, che
    autorizza l''Irlanda ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, della voce 60.02 della tariffa doganale comune, categorie
    10 e 11, originari di Hong Kong e messi in libera pratica negli altri Stati membri
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/923/EEG: Beschikking van de Commissie van 11 september 1980 waarbij
    Ierland wordt gemachtigd handschoenen, wanten en dergelijke artikelen van niet-
    elastisch of van niet-gegummeerd brei- of haakwerk, van post 60.02 van het gemeenschappelijk
    douanetarief (categorieën 10 en 11), van oorsprong uit Hong-Kong en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
