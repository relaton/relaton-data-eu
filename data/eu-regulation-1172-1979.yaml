  content: Commission Regulation (EEC) No 1172/79 of 13 June 1979 fixing for the 1970/80
    marketing year the amount of production aid for tomato concentrates, peeled tomatoes,
    tomato juice, peaches in syrup and prunes and the minimum price to be paid to
    producers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1172/79 de la Commission, du 13 juin 1979, fixant,
    pour la campagne 1979/1980, le montant de l' aide à la production, pour les concentrés
    de tomates, les tomates pelées, les jus de tomates, les pêches au sirop et les
    pruneaux, ainsi que le prix minimal à payer aux producteurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1172/79 der Kommission vom 13. Juni 1979 zur Festsetzung
    der Produktionsbeihilfe für Tomatenkonzentrate, geschälte Tomaten, Tomatensaft,
    Pfirsiche in Sirup und Trockenpflaumen sowie des den Erzeugern zu zahlenden Mindestpreises
    für das Wirtschaftsjahr 1979/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1172/79 af 13. juni 1979 om fastsættelse
    for produktionsåret 1979/80 af producentstøtten og den minimumspris, der betales
