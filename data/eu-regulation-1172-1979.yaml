    concentrati di pomodori, i pomodori pelati, i succhi di pomodori, le pesche allo
    sciroppo e le prugne secche, nonché il prezzo minimo da pagare ai produttori
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1172/79 van de Commissie van 13 juni 1979 tot vaststelling,
