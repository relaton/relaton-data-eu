title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 967/84 of 9 April 1984 re-establishing the
    levying of customs duties on other stranded wire, cables, cordage, ropes, plaited
    bands, slings and the like, falling within subheading 73.25 B and originating
    in South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 967/84 de la Commission du 9 avril 1984 portant rétablissement
    de la perception des droits de douane applicables aux autres câbles, cordages,
    tresses, élingues et similaires, de la sous-position 73.25 B du tarif douanier
    commun, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 967/84 der Kommission vom 9. April 1984 zur Wiedereinführung
    der Erhebung der Zölle für andere Kabel, Seile, Litzen, Seilschlingen und ähnliche
    Waren der Tarifstelle 73.25 B mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 967/84 af 9. april 1984 om genindførelse
    af opkrævning af told for andet snoet tråd, kabler, tovværk, flettede bånd,
    henhørende under pos. 73.25 B og med oprindelse i Sydkorea, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 967/84 της Επιτροπής
    της 9ης Απριλίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για έτερα καλώδια, σχοινία,
    πλεξίδες, περιλάβεια (σαμπάνια) και τα παρόμοια,
    της διακρίσεως 73.25 Β του Κοινού Δασμολογίου,
    καταγωγής Νότιας Κορέας, δικαιούχου των προβλεπόμενων
    από τον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 967/84 della Commissione del 9 aprile 1984 che ripristina
    la riscossione dei dazi doganali applicabili ad altri cavi, corde, trecce, brache
    e simili, della sottovoce 73.25 B della tariffa doganale comune, originari della
    Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 967/84 van de Commissie van 9 april 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere kabels,
    geslagen of gevlochten, lengen en dergelijke kabels, van postonderverdeling 73.25
    B, van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr 3569/83 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
