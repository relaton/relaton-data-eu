  content: Regulation (EEC) No 512/74 of the Commission of 28 February 1974 fixing
    the rates of the refunds applicable from 1 March 1974 to certain cereals and rice
    products exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 512/74 de la Commission, du 28 février 1974, fixant
    les taux des restitutions applicables, à compter du 1er mars 1974, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 512/74 der Kommission vom 28. Februar 1974 zur Festsetzung
