title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 852/70 du Conseil, du 12 mai 1970, portant suspension
    temporaire du droit autonome du tarif douanier commun applicable aux lieus noirs
    (gadus virens) salés, présentés en emballages immédiats, d'un contenu net
    égal ou supérieur à 47 Kg et contenant au maximum 50 moitiés de poisson, de
    la sous-position EX 03.02 A I F)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 852/70 des Rates vom 12. Mai 1970 über die zeitweilige
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für Seelachs (gadus
    virens), gesalzen, in unmittelbaren Umschließungen mit einem Gewicht des Inhalts
    von 47 kg oder mehr und höchstens 50 Seiten enthaltend, der Tarifstelle ex 03.02
    A I f)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 852/70 del Consiglio, del 12 maggio 1970, recante
    sospensione temporanea del dazio autonomo della tariffa doganale comune sui merluzzi
    carbonari (gadus virens) salati, in imballaggi immediati di contenuto netto uguale
    o superiore a 47 kg e contenenti non più di 50 mezzi pesci della sottovoce ex
    03.02 A I f)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 852/70 van de Raad van 12 mei 1970 houdende tijdelijke
    schorsing van het autonome recht van het gemeenschappelijk douanetarief voor zeezalm
    (gadus virens) gezouten, in verpakkingen met een netto-inhoud per onmiddellijke
    verpakking van 47 kg of meer en bevattende ten hoogste 50 halve vissen, van onderverdeling
    ex 03.02 A I f)
  type: main
