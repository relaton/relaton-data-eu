    auf die Einfuhren von Folien aus Polyethylenterephthalat (PET) mit Ursprung in
    Indien nach einer Überprüfung gemäß Artikel 18 der Verordnung (EG) Nr. 2026/97
    und zur Änderung der Verordnung (EG) Nr. 1676/2001 zur Einführung eines endgültigen
    Antidumpingzolls auf die Einfuhren von Folien aus Polyethylenterephthalat (PET)
    mit Ursprung in unter anderem Indien
  type: main
