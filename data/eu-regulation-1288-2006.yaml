  content: Reglamento (CE) n o 1288/2006 del Consejo, de 25 de agosto de 2006 , que
    modifica el Reglamento (CE) n o 367/2006 por el que se establece un derecho compensatorio
    definitivo sobre las importaciones de película de politereftalato de etileno
    (PET) originaria de la India como consecuencia de una reconsideración por expiración
    con arreglo al artículo 18 del Reglamento (CE) n o 2026/97, y el Reglamento n
    o 1676/2001 por el que se establece un derecho antidumping definitivo y se percibe
    definitivamente el derecho provisional establecido sobre las importaciones de
    películas de tereftalato de polietileno originarias de, entre otros países,
    la India
  type: main
