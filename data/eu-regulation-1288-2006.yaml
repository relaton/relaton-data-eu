    származó polietilén-tereftalát (PET) fólia behozatala vonatkozásában végleges
    kiegyenlítő vám kivetéséről szóló 367/2006/EK rendelet módosításáról
    és a többek között Indiából származó polietilén-tereftalát fólia behozatalára
