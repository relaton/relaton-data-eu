title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1288/2006 of 25 August 2006 amending Regulation
    (EC) No 367/2006 imposing a definitive countervailing duty on imports of polyethylene
    terephthalate (PET) film originating in India following an expiry review pursuant
    to Article 18 of Regulation (EC) No 2026/97 and amending Regulation (EC) No 1676/2001
    imposing a definitive anti-dumping duty on imports of polyethylene terephthalate
    (PET) film originating, inter alia , in India
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1288/2006 du Conseil du 25 août 2006 modifiant le
    règlement (CE) n o 367/2006 instituant un droit compensateur définitif sur les
    importations de feuilles en polyéthylène téréphtalate (PET) originaires de
    l'Inde, à l'issue d'un réexamen au titre de l'expiration des mesures mené conformément
    à l'article 18 du règlement (CE) n o 2026/97 et modifiant le règlement (CE)
    n o 1676/2001 instituant un droit antidumping définitif sur les importations
    de polyéthylène téréphtalate (PET) originaires, entre autres, de l'Inde
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1288/2006 des Rates vom 25. August 2006 zur Änderung
