  script: Latn
  content: Regolamento (CE) n. 1288/2006 del Consiglio, del 25 agosto 2006 , che modifica
    il regolamento (CE) n. 367/2006 che istituisce un dazio compensativo definitivo
    sulle importazioni di fogli di polietilene tereftalato (PET) originari dell’India
    in seguito ad un riesame in previsione della scadenza ai sensi dell’articolo
    18 del regolamento (CE) n. 2026/97 e che modifica il regolamento (CE) n. 1676/2001
    che istituisce un dazio antidumping definitivo sulle importazioni di fogli di
    polietilene tereftalato (PET) originari, tra gli altri, dell’India
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1288/2006 ( 2006. gada 25. augusts ), ar kuru groza
    Regulu (EK) Nr. 367/2006, ar ko Indijas izcelsmes polietilēnteraftalāta (PET)
    plēves importam nosaka galīgu kompensācijas maksājumu pēc beigu termiņa
    pārskatīšanas saskaņā ar Regulas (EK) Nr. 2026/97 18. pantu, un Regulu (EK)
    Nr. 1676/2001, ar ko piemēro galīgo antidempinga maksājumu un galīgi iekasē
    pagaidu maksājumu par Indijas un Korejas Republikas izcelsmes polietilēntereftalāta
    plēves importu
  type: main
