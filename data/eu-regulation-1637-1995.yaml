    angår den midlertidige tilpasning af visse bestemmelser for indførsel til Fællesskabet
    af visse mejeriprodukter med oprindelse i Republikken Polen, Republikken Ungarn,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
    med henblik på iværksættelsen af den landbrugsaftale, der er indgået i forbindelse
    med forhandlingerne under Uruguay-runden
