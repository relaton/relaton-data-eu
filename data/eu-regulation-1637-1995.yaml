title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1637/95 of 5 July 1995 amending Regulations
    (EEC) No 584/92, (EC) No 1588/94 and (EC) No 629/95 as regards the transitional
    adjustment of certain rules on imports into the Community of certain products
    in the milk sector from the Republic of Poland, the Republic of Hungary, the Czech
    Republic, the Slovak Republic, the Republic of Bulgaria, and Romania, in order
    to implement the Agreement on Agriculture concluded during the Uruguay Round of
    negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1637/95 de la Commission, du 5 juillet 1995, modifiant
    les règlements (CEE) n° 584/92, (CE) n 1588/94 et (CE) n° 629/95 en ce qui
    concerne l'adaptation transitoire de certaines dispositions relatives aux importations
    dans la Communauté de certains produits du secteur laitier en provenance de la
    République de Pologne, de la République de Hongrie, de la République tchèque,
    de la République slovaque, de la République de Bulgarie et de la Roumanie, en
    vue de la mise en oeuvre de l'accord sur l'agriculture conclu dans le cadre des
    négociations du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1637/95 der Kommission vom 5. Juli 1995 zur Änderung
    der Verordnungen (EWG) Nr. 584/92, (EG) Nr. 1588/94 und (EG) Nr. 629/95 zur übergangsweisen
    Anpassung von Vorschriften über die Einfuhr bestimmter Milcherzeugnisse in die
    Gemeinschaft aus der Republik Polen, der Republik Ungarn, der Tschechischen Republik,
    der Slowakischen Republik, der Republik Bulgarien und der Republik Rumänien zur
    Anwendung des im Rahmen der Uruguay-Runde über die Landwirtschaft getroffenen
    Übereinkommens
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1637/95 af 5. juli 1995 om ændring af
