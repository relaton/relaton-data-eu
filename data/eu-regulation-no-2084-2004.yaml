title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2084/2004 of 6 December 2004 derogating from
    Regulation (EEC) No 2837/93 as regards the period for paying the aid to maintain
    olive groves in traditional olive-growing areas in the smaller Aegean islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2084/2004 de la Commission du 6 décembre 2004 dérogeant
    au règlement (CEE) n° 2837/93 en ce qui concerne le délai de paiement de l’aide
    pour le maintien des oliveraies dans les zones traditionnelles de culture de l’olivier
    dans les îles mineures de la mer Égée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2084/2004 der Kommission vom 6. Dezember 2004 zur Abweichung
    von der Verordnung (EWG) Nr. 2837/93 hinsichtlich der Frist für die Zahlung der
    Beihilfe für die Aufrechterhaltung des Olivenanbaus in den herkömmlichen Erzeugungsgebieten
    auf den kleineren Inseln des Ägäischen Meeres
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2084/2004 ze dne 6. prosince 2004, kterým
    se stanoví odchylka od nařízení (EHS) č. 2837/93, pokud jde o lhůtu pro
    vyplacení podpory pro udržování olivových hájů v tradičních oblastech
    pěstování oliv na menších ostrovech v Egejském moři
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2084/2004 af 6. december 2004 om fravigelse
    af forordning (EØF) nr. 2837/93 for så vidt angår perioden for udbetaling af
    støtten for opretholdelse af olivenlunde i områder, hvor der traditionelt dyrkes
    oliven på de mindre øer i Det Ægæiske Hav
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2084/2004 της Επιτροπής,
    της 6ης Δεκεμβρίου 2004, για την παρέκκλιση από
    τον κανονισμό (ΕΟΚ) αριθ. 2837/93 όσον αφορά την
    προθεσμία πληρωμής της ενίσχυσης για τη διατήρηση
    των ελαιώνων στις παραδοσιακές ζώνες καλλιέργειας
    της ελιάς στα μικρά νησιά του Αιγαίου Πελάγους
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2084/2004, 6. detsember 2004, millega kehtestatakse
    erandid määrusest (EMÜ) nr 2837/93 seoses toetuse maksmisega oliivisalude säilitamiseks
    tavapärastes oliivikasvatuspiirkondades väiksematel Egeuse mere saartel
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2084/2004, annettu 6 päivänä joulukuuta 2004,
    asetuksesta (ETY) N:o 2837/93 poikkeamisesta Egeanmeren pienten saarten perinteisillä
    oliivinviljelyalueilla sijaitsevien oliivitarhojen säilyttämistä koskevan tuen
    maksamisen määräajan osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2084/2004/EK rendelete (2004. december 6.) a kisebb égei-tengeri
    szigeteken a hagyományos olívatermelő területeken található olajfaligetek
    gondozására vonatkozó támogatások kifizetési határideje tekintetében a
    2837/93/EGK rendelettől való eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2084/2004 della Commissione, del 6 dicembre 2004, recante
    deroga al regolamento (CEE) n. 2837/93 per quanto riguarda il termine di pagamento
    dell’aiuto per la conservazione degli oliveti nelle zone tradizionalmente dedite
    all’olivicoltura nelle isole minori del Mar Egeo
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2084/2004 (2004. gada 6. decembris), ar ko paredz
    atkāpi no Regulas (EEK) Nr. 2837/93 attiecībā uz termiņu, kas ir jāievēro,
    izmaksājot atbalstu olīvu biržu uzturēšanai tradicionālajās olīvu audzēšanas
    platībās nelielajās Egejas jūras salās
  type: main
- language: lt
  script: Latn
  content: 2004 m. gruodžio 6 d. Komisijos reglamentas (EB) Nr. 2084/2004, nukrypstantis
