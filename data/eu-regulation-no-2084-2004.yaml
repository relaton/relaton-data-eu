    tradiciniuose alyvų auginimo plotuose mažosiose Egėjo jūros salose nustatyto
    mokėjimo laikotarpio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2084/2004 van de Commissie van 6 december 2004 houdende
    afwijking van Verordening (EEG) nr. 2837/93 ten aanzien van de termijn voor de
    betaling van de steun voor de instandhouding van olijfgaarden in de traditionele
    olijventeeltgebieden op de kleinere eilanden in de Egeïsche Zee
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2084/2004 z dnia 6 grudnia 2004 r. uchylające
    rozporządzenie (EWG) nr 2837/93 w odniesieniu do terminu wypłacania pomocy na
    utrzymanie gajów oliwnych na tradycyjnych obszarach uprawy oliwek na mniejszych
    wyspach Morza Egejskiego
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2084/2004 da Comissão, de 6 de Dezembro de 2004,
    que derroga ao Regulamento (CEE) n.° 2837/93 no que respeita ao prazo de pagamento
    da ajuda destinada à manutenção dos olivais nas zonas tradicionais de cultura
    da oliveira nas ilhas menores do mar Egeu
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2084/2004 zo 6. decembra 2004, ktorým sa stanovuje
    odchýlka od nariadenia (EHS) č. 2837/93, pokiaľ ide o časovú lehotu na vyplatenie
    pomoci na udržiavanie olivových hájov v tradičných oblastiach pestovania
    olív na menších ostrovoch v Egejskom mori
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2084/2004 z dne 6. decembra 2004 o odstopanju
    od Uredbe (EGS) st. 2837/1993 v zvezi z rokom za plačilo pomoči za ohranjanje
    oljčnih nasadov na tradicionalnih območjih pridelovanja oljk na manjših otokih
    v Egejskem morju
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2084/2004 de la Comisión, de 6 de diciembre de 2004,
    por el que se establecen excepciones al Reglamento (CEE) n° 2837/93 en lo relativo
    al plazo de pago de la ayuda para el mantenimiento de los olivares en las zonas
    tradicionales de cultivo del olivo en las islas menores del mar Egeo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2084/2004 av den 6 december 2004 om undantag
    från förordning (EEG) nr 2837/93 när det gäller betalningsfristen för stöd
    till underhåll av olivlundar i områden där oliver traditionellt odlas på de
    mindre Egeiska öarna
