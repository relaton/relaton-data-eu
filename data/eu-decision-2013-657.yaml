    ptáků podtypu H5N1, která mají být použita v případě ohniska této nákazy
    ve Švýcarsku, a o zrušení rozhodnutí 2009/494/ES (oznámeno pod číslem
    C(2013) 7505)'
  type: main
- language: da
  script: Latn
  content: '2013/657/EU: Kommissionens gennemførelsesafgørelse af 12. november 2013
