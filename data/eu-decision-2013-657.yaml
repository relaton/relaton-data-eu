title:
- language: en
  script: Latn
  content: '2013/657/EU: Commission Implementing Decision of 12 November 2013 concerning
    certain protection measures in relation to highly pathogenic avian influenza of
    the subtype H5N1 to be applied in the event of an outbreak of that disease in
    Switzerland and repealing Decision 2009/494/EC (notified under document C(2013)
    7505)'
  type: main
- language: fr
  script: Latn
  content: '2013/657/UE: Décision d’exécution de la Commission du 12 novembre
    2013 concernant certaines mesures de protection relatives à l’influenza aviaire
    hautement pathogène du sous-type H5N1 devant s’appliquer en cas d’apparition
    d’un foyer de cette maladie en Suisse et abrogeant la décision 2009/494/CE
    [notifiée sous le numéro C(2013) 7505]'
  type: main
- language: de
  script: Latn
  content: '2013/657/EU: Durchführungsbeschluss der Kommission vom 12. November 2013
    betreffend bestimmte Maßnahmen zum Schutz vor der hoch pathogenen Aviären Influenza
    des Subtyps H5N1, die bei Ausbruch dieser Seuche in der Schweiz durchzuführen
    sind, und zur Aufhebung der Entscheidung 2009/494/EG (Bekanntgegeben unter Aktenzeichen
    C(2013) 7505)'
  type: main
- language: bg
  script: Cyrl
