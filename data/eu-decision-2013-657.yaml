    по птиците от подтип H5N1, които да се прилагат
    в случай на поява на огнище на болестта в Швейцария,
    и за отмяна на Решение 2009/494/ЕО (нотифицирано
    под номер C(2013) 7505)'
  type: main
- language: cs
  script: Latn
