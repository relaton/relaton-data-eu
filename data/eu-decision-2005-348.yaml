    om oprettelse af Det Europæiske Fællesskab har truffet virkningsfulde foranstaltninger
    til opfølgning af Rådets henstillinger i overensstemmelse med artikel 104, stk.
    7'
  type: main
- language: el
  script: Grek
  content: '2005/348/EK: Απόφαση του Συμβουλίου, της 18ης
