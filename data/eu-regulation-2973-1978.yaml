id: EURegulation29731978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2973/78 of 15 December 1978 re-establishing
    the levying of customs duties on reconstituted wood, being wood shavings, etc.,
    falling within heading No 44.18 and originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2973/78 de la Commission, du 15 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux bois dits
    "artificiels" ou "reconstitués", formés de copeaux, de sciure, etc., de la position
    tarifaire 44.18, originaires de Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2973/78 der Kommission vom 15. Dezember 1978 zur Wiedereinführung
    des Zollsatzes für sogenanntes Kunstholz, aus Holzspänen, Sägespänen, Holzmehl
    oder anderen Abfällen, usw., der Tarifnummer 44.18, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2973/78 af 15. december 1978 om genindførelse
    af opkrævning af toldafgifter for kunstigt træ, fremstillet af spåner, savsmuld,
    etc., under position 44.18, som har oprindelse i Jugoslavien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2973/78 della Commissione, del 15 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili al legno detto "artificiale"
    o "ricostituito", formato con trucioli, segatura, ecc., della voce doganale 44.18,
    originario della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2973/78 van de Commissie van 15 december 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op kunsthout
    verkregen door houtkrullen, zaagsel, van post 44.18, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
