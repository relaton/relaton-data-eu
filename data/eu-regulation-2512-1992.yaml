    Erzeugung des Wirtschaftsjahres 1991/92 und zur Festsetzung des Anpassungsbetrags
    der Beihilfe für Erbsen, Puffbohnen, Ackerbohnen und Süßlupinen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2512/92 af 27. august 1992 om fastsættelse
