  script: Latn
  content: Commission Regulation (EEC) No 2512/92 of 27 August 1992 fixing, for peas,
    field beans and sweet lupins, the level of estimated production for the 1992/93
    marketing year, the level of actual production for the 1991/92 marketing year,
    and the adjustment to be made to the amount of the aid
  type: main
