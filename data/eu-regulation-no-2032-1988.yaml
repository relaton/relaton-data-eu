title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2032/88 of 8 July 1988 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Argentina must be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2032/88 de la Commission, du 8 juillet 1988, fixant
