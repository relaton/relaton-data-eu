    κατά το οποίο πρέπει να μειωθεί το κινητό στοιχείο
    της εισφοράς που εφαρμόζεται στα πίτουρα εν
    γένει καταγωγής Αργεντινής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2032/88 della Commissione, dell'8 luglio 1988, che
