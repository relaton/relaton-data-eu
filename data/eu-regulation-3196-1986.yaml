    den französischen Überseedepartements, der in der Gemeinschaft in der Zeit vom
    1. April bis 30. Juni 1986 raffiniert worden ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3196/86 af 21. oktober 1986 om fastsættelse
    af visse udligningsbeløb for så vidt angår præferenceråsukker og råsukker
    fra de oversøiske franske departementer, raffineret i Fællesskabet i perioden
    1. april til 30. juni 1986
  type: main
- language: el
