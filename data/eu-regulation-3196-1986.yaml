  content: Commission Regulation (EEC) No 3196/86 of 21 October 1986 providing for
    compensation in respect of preferential raw sugar and raw sugar from the French
    overseas departments refined in the Community during the period from 1 April 1986
    to 30 June 1986
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3196/86 de la Commission du 21 octobre 1986 établissant
    certaines compensations en ce qui concerne le sucre brut préférentiel et le
    sucre brut des départements français d' outre-mer, raffinés dans la Communauté
    pendant la période du 1er avril au 30 juin 1986
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3196/86 der Kommission vom 21. Oktober 1986 zur Festlegung
