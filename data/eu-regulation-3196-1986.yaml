    αντισταθμίσεις όσον αφορά την προτιμησιακή
    ακατέργαστη ζάχαρη και την ακατέργαστη ζάχαρη
    των υπερπόντιων γαλλικών διαμερισμάτων, που
    ραφινάρονται στην Κοινότητα από την 1η Απριλίου
    έως τις 30 Ιουνίου 1986
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3196/86 della Commissione del 21 ottobre 1986 che
    determina talune compensazioni per quanto concerne lo zucchero greggio preferenziale
    e lo zucchero greggio dei dipartimenti francesi d' oltremare, raffinati nella
    Comunità nel periodo dal 1° aprile al 30 giugno 1986
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3196/86 van de Commissie van 21 oktober 1986 houdende
