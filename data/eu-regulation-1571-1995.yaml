  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1571/95, annettu 30 päivänä kesäkuuta 1995,
    viitehintojen vahvistamisesta annetun asetuksen (EY) N:o 2027/94, tiettyjen viinialan
    tuotteiden tuontiin sovellettavien vapaasti rajalla -viitehintojen vahvistamisesta
    1 päivästä syyskuuta 1988 annetun asetuksen (ETY) N:o 3418/88, tietyistä kolmansista
    maista peräisin olevien viinialan tuotteiden tuonnin soveltamista koskevista
    yksityiskohtaisista säännöistä annetun asetuksen (ETY) N:o 1393/76, tasoitusmaksujen
    vahvistamisesta viinialalla annetun asetuksen (ETY) N:o 701/84 ja tasoitusmaksun
    kantamatta jättämisestä tuotaessa tiettyjä tietyistä kolmansista maista peräisin
    ja lähtöisin olevia viinejä annetun asetuksen (ETY) N:o 333/88 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1571/95 della Commissione del 30 giugno 1995 recante
    abrogazione dei regolamenti (CE) n. 2027/94, che fissa i prezzi di riferimento
    validi per la campagna 1994/1995 nel settore vitivinicolo, (CEE) n. 3418/88, che
    fissa i prezzi franco frontiera di riferimento applicabili all'importazione di
    taluni prodotti del settore vitivinicolo a decorrere dal 1o settembre 1988, (CEE)
    n. 1393/76, che stabilisce le modalità di applicazione per l'importazione di
    prodotti del settore vitivinicolo originari di taluni paesi terzi, (CEE) n. 701/84,
    che fissa le tasse di compensazione nel settore vitivinicolo e (CEE) n. 333/88,
    relativo alla non riscossione di una tassa di compensazione all'importazione di
    taluni vini originari e in provenienza da taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1571/95 van de Commissie van 30 juni 1995 houdende
    intrekking van de Verordeningen (EG) nr. 2027/94 tot vaststelling van de referentieprijzen,
    (EEG) nr. 3418/88 tot vaststelling van de met ingang van 1 september 1988 bij
    invoer van bepaalde wijnbouwprodukten toe te passen referentieprijzen franco-grens,
    (EEG) nr. 1393/76 houdende uitvoeringsbepalingen voor de invoer van produkten
    uit de wijnsector van oorsprong uit bepaalde derde landen, (EEG) nr. 701/84 tot
    vaststelling van de compenserende heffingen in de wijnsector en (EEG) nr. 333/88
    betreffende het niet-toepassen van een compenserende heffing bij invoer van bepaalde
    wijnen van oorsprong en van herkomst uit sommige derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1571/95 da Comissão de 30 de Junho de 1995 que revoga
    os Regulamento (CE) nº 2027/94, que fixa os preços de referência válidos para
    a campanha de 1994/1995 no sector vitivinícola, (CEE) nº 3418/88, que fixa os
    preços franco-fronteira de referência aplicáveis à importação de certos
    produtos vitivinícolas a partir de 1 de Setembro de 1988, (CEE) nº 1393/76,
    que estabelece as modalidades de aplicação relativas à importação de produtos
    abrangidos pelo sector vitivinícola originários de certos países terceiros,
    (CEE) nº 701/84, que fixa as taxas compensatórias no sector vitivinícola e
    (CEE) nº 333/88, relativo à não cobrança de um direito de compensação sobre
    as importações de certos vinhos originários e provenientes de certos países
    terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1571/95 de la Comisión de 30 de junio de 1995 por
    el que se derogan los Reglamentos (CE) n° 2027/94 por el que se fijan los precios
    de referencia válidos para la campaña 1994/95 en el sector vitivinícola, (CEE)
    n° 3418/88 por el que se fijan los precios franco frontera de referencia aplicables
    a la importación de determinados productos vitivinícolas a partir del 1 de septiembre
    de 1988, (CEE) n° 1393/76 por el que se establecen las modalidades de aplicación
    relativas a la importación de productos del sector vitivinícola originarios
    de determinados terceros países, (CEE) n° 701/84 por el que se establecen los
    gravámenes compensatorios en el sector vitivinícola y (CEE) n° 333/88 relativo
    a la no percepción de un gravamen compensatorio sobre las importaciones de determinados
    vinos originarios y procedentes de determinados terceros países
  type: main
- language: sv
  script: Latn
  content: Komissionens förordning (EG) nr 1571/95 av den 30 juni 1995 om upphävande
    av förordning (EG) nr 2027/94 om fastställande av referenspriserna, förordning
    (EEG) nr 3418/88 om fastställande av de referenspriser fritt gränsen som skall
    tillämpas på export av vissa vinprodukter från och med den 1 september 1988,
    förordning (EEG) nr 1393/76 om närmare bestämmelser om import av vinprodukter
    med ursprung i vissa tredje länder, förordning (EEG) nr 701/84 om fastställande
    av utjämningsavgifter inom vinsektorn och förordning (EEG) nr 333/88 om avstående
    från utjämningsavgiften vid import av vissa viner som har sitt ursprung i och
    kommer från vissa tredje länder
  type: main
