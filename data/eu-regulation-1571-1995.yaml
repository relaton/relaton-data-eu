title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1571/95 of 30 June 1995 repealing Regulations
    (EC) No 2027/94 fixing references prices, (EEC) No 3418/88 fixing the free-at-frontier
    reference prices applicable to imports of certain wine products with effect from
    1 September 1988, (EEC) No 1393/76 laying down detailed rules for the importation
    of products in the wine-growing sector originating in certain third countries,
    (EEC) No 701/84 fixing countervailing charges in the wine sector, and (EEC) No
    333/88 waiving the countervailing charge on imports of certain wines originating
    in and coming from certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1571/95 de la Commission du 30 juin 1995 portant abrogation
    des règlements (CE) n° 2027/94 fixant les prix de référence, (CEE) n° 3418/88
    fixant les prix franco frontière de référence applicables à l'importation
    de certains produits viti-vinicoles à partir du 1er septembre 1988, (CEE) n°
    1393/76 établissant les modalités d'application relatives à l'importation de
    produits relevant du secteur viti- vinicole originaires de pays tiers, (CEE) n°
    701/84 fixant les taxes compensatoires dans le secteur viti- vinicole et (CEE)
    n° 333/88 relatif à la non-perception d'une taxe compensatoire sur les importations
    de certains vins originaires et en provenance de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1571/95 der Kommission vom 30. Juni 1995 zur Aufhebung
    der Verordnung (EG) Nr. 2027/94 betreffend die Referenzpreise, der Verordnung
    (EWG) Nr. 3418/88 betreffend die Referenzpreise frei Grenze für die Einfuhr bestimmter
    Weinerzeugnisse ab 1. September 1988, der Verordnung (EWG) Nr. 1393/76 betreffend
    die Einfuhr von Erzeugnissen des Weinsektors mit Ursprung in bestimmten Drittländern,
    der Verordnung (EWG) Nr. 701/84 betreffend die Ausgleichsabgaben bei Wein und
    der Verordnung (EWG) Nr. 333/88 betreffend die Nichterhebung einer Ausgleichsabgabe
    bei der Einfuhr von Wein mit Ursprung in und Herkunft aus Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1571/95 af 30. juni 1995 om ophævelse
    af forordning (EF) nr. 2027/94 om fastsættelse af referencepriser, (EØF) nr.
    3418/88 om fastsættelse af referencepriserne franko grænse gældende ved indførsel
    af visse produkter fra vinsektoren fra den 1. september 1988, (EØF) nr. 1393/76
    om fastsættelse af de nærmere bestemmelser for indførsel af produkter fra vinsektoren
    med oprindelse i visse tredjelande, (EØF) nr. 701/84 om fastsættelse af udligningsafgifterne
    i vinsektoren og (EØF) nr. 333/88 om undladelse af opkrævning af en udligningsafgift
    ved indførsel af vin, der har oprindelse i eller kommer fra visse tredjelande
  type: main
- language: el
  script: Grek
