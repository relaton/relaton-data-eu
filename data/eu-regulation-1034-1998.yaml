    contingents et plafonds tarifaires communautaires et établissant une surveillance
    communautaire pour certains poissons et produits de la pêche originaires des
    îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1034/98 der Kommission vom 18. Mai 1998 zur Änderung
