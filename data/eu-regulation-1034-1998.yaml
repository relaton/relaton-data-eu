    und -plafonds und zur Einrichtung einer gemeinschaftlichen Überwachung für bestimmte
    Fische und Fischereierzeugnisse mit Ursprung auf den Färöern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1034/98 af 18. maj 1998 om ændring af
