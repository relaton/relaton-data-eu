    kaloille ja kalastustuotteille annetun neuvoston asetuksen (EY) N:o 669/97 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1034/98 della Commissione del 18 maggio 1998 che modifica
