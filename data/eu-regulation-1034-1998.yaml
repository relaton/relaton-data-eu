  script: Latn
  content: Commission Regulation (EC) No 1034/98 of 18 May 1998 amending Council Regulation
    (EC) No 669/97 opening and providing for the administration of Community tariff
    quotas and ceilings and establishing Community surveillance for certain fish and
    fishery products originating in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1034/98 de la Commission du 18 mai 1998 modifiant le
