    di contingenti e massimali tariffari comunitari e che stabilisce una sorveglianza
    comunitaria per taluni pesci e prodotti della pesca originari delle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1034/98 van de Commissie van 18 mei 1998 tot wijziging
