title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1161/70 de la Commission, du 19 juin 1970, relatif
    à la vente à prix fixé forfaitairement à l'avance de quartiers arrière de
    viande bovine congelée provenant de l'intervention et détenus par l'organisme
    allemand d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1161/70 der Kommission vom 19. Juni 1970 über den
    Verkauf von aus der Intervention stammendem und bei der deutschen Interventionsstelle
    eingelagertem Rindfleisch in gefrorenen Hintervierteln zu einem im voraus pauschal
    festgesetzten Preis
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1161/70 della Commissione, del 19 giugno 1970, relativo
    alla vendita a prezzo fissato forfetariamente in anticipo di quarti posteriori
    di carni bovine congelate che provengono dall'intervento e che si trovano in possesso
    dell'organismo d'intervento tedesco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1161/70 van de Commissie van 19 juni 1970 betreffende
    de verkoop voor een vooraf forfaitair vastgestelde prijs van bevroren rundvlees,
    achtervoeten, die afkomstig zijn van interventie en in het bezit van het Duitse
    interventiebureau zijn
  type: main
