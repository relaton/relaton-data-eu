title:
- language: fr
  script: Latn
  content: Décision du Conseil du 16 décembre 1969, portant dérogation à la décision,
    du 9 octobre 1961, relative à l'uniformisation de la durée des accords commerciaux
    pour l'accord à long terme relatif aux échanges commerciaux et économiques
    négocié entre le gouvernement de la République italienne et le gouvernement
    de la République populaire de Bulgarie
  type: main
- language: de
  script: Latn
  content: '69/497/EWG: Entscheidung des Rates vom 16. Dezember 1969 über eine Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen hinsichtlich des zwischen den Regierungen der Italienischen Republik
    und der Volksrepublik Bulgarien ausgehandelten langfristigen Abkommen über die
    Handels- und Wirtschaftsbeziehungen'
  type: main
- language: it
  script: Latn
  content: '69/497/CEE: Decisione del Consiglio, del 16 dicembre 1969, recante deroga
    alla decisione del 9 ottobre 1961, relativa all''uniformazione della durata degli
    accordi commerciali per quanto concerne l''accordo a lungo termine negoziato tra
    il governo della Repubblica italiana e il governo della Repubblica popolare di
    Bulgaria concernente gli scambi commerciali ed economici tra i due paesi'
  type: main
- language: nl
  script: Latn
  content: '69/497/EEG: Beschikking van de Raad van 16 december 1969 houdende afwijking
    van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden, ten aanzien van het akkoord op lange termijn inzake het
    handelsverkeer en de economische betrekkingen tussen de Regering van de Italiaanse
    Republiek en de Regering van de Volksrepubliek Bulgarije'
  type: main
