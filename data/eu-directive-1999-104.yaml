title:
- language: en
  script: Latn
  content: Commission Directive 1999/104/EC of 22 December 1999 amending the Annex
    to Council Directive 81/852/EEC on the approximation of the laws of the Member
    States relating to analytical, pharmacotoxicological and clinical standards and
    protocols in respect of the testing of veterinary medicinal products
  type: main
- language: fr
  script: Latn
  content: Directive 1999/104/CE de la Commission, du 22 décembre 1999, modifiant
    l'annexe de la directive 81/852/CEE du Conseil relative au rapprochement des législations
    des États membres concernant les normes et protocoles analytiques, toxico-pharmacologiques
    et cliniques en matière d'essais de médicaments vétérinaires
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/104/EG der Kommission vom 22. Dezember 1999 zur Änderung
    des Anhangs der Richtlinie 81/852/EWG des Rates zur Angleichung der Rechts- und
    Verwaltungsvorschriften der Mitgliedstaaten über die analytischen, toxikologisch-pharmakologischen
    und ärztlichen oder klinischen Vorschriften und Nachweise über Versuche mit
    Tierarzneimitteln
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 1999/104/EF af 22. december 1999 om ændring af
    bilaget til Rådets direktiv 81/852/EØF om indbyrdes tilnærmelse af medlemsstaternes
