    ja kliinisiä standardeja ja tutkimussuunnitelmia koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun neuvoston direktiivin 81/852/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/104/CE della Commissione, del 22 dicembre 1999, che modifica
    l'allegato della direttiva 81/852/CEE del Consiglio relativa al ravvicinamento
    delle legislazioni degli Stati membri riguardanti le norme ed i protocolli analitici,
    tossico-farmacologici e clinici in materia di prove effettuate su medicinali veterinari
  type: main
- language: nl
  script: Latn
  content: Richtlijn 1999/104/EG van de Commissie van 22 december 1999 houdende wijziging
    van de bijlage van Richtlijn 81/852/EEG van de Raad inzake de analytische, toxicologisch-farmacologische
    en klinische normen en voorschriften betreffende proeven op geneesmiddelen voor
    diergeneeskundig gebruik
  type: main
- language: pt
  script: Latn
  content: Directiva 1999/104/CE da Comissão, de 22 de Dezembro de 1999, que altera
