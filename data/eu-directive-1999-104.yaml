    των νομοθεσιών των κρατών μελών που αφορούν
    τις αναλυτικές, τοξικοφαρμακολογικές και κλινικές
    προδιαγραφές και τα πρωτόκολλα στον τομέα
    των δοκιμών των κτηνιατρικών φαρμάκων
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 1999/104/EY, annettu 22 päivänä joulukuuta 1999,
