title:
- language: en
  script: Latn
  content: '98/528/EC: Commission Decision of 14 August 1998 amending the information
    contained in the list in the Annex to Commission Regulation (EC) No 44/98 establishing,
    for 1998, the list of vessels exceeding 8 m length overall permitted to fish for
    sole in certain Community areas using beam trawls whose aggregate length exceeds
    9 m (notified under document number C(1998) 2432)'
  type: main
- language: fr
  script: Latn
  content: '98/528/CE: Décision de la Commission du 14 août 1998 modifiant certaines
    informations sur la liste figurant à l''annexe du règlement (CE) nº 44/98 établissant,
    pour 1998, la liste des bateaux dont la longueur hors tout dépasse huit mètres,
    autorisés à pêcher la sole dans certaines zones de la Communauté à l''aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres [notifiée
    sous le numéro C(1998) 2432]'
  type: main
- language: de
  script: Latn
  content: '98/528/EG: Entscheidung der Kommission vom 14. August 1998 zur Änderung
    bestimmter Angaben auf der Liste im Anhang zur Verordnung (EG) Nr. 44/98 zur Festlegung
    der Liste der Schiffe mit einer Länge über alles von mehr als 8 m, die 1998
    in bestimmten Seegebieten der Gemeinschaft beim Seezungenfang Baumkurren verwenden
    dürfen, deren Gesamtbaumlänge mehr als 9 m beträgt (Bekanntgegeben unter Aktenzeichen
    K(1998) 2432)'
  type: main
- language: da
  script: Latn
  content: '98/528/EF: Kommissionens beslutning af 14. august 1998 om ændring af
    visse oplysninger på listen i bilaget til forordning (EF) nr. 44/98 om listen
    for 1998 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m (meddelt under nummer K(1998) 2432)'
  type: main
- language: el
  script: Grek
  content: '98/528/ΕΚ: Απόφαση της Επιτροπής της 14ης Αυγούστου
    1998 για την τροποποίηση ορισμένων πληροφοριών
    στον κατάλογο του παραρτήματος του κανονισμού
    (ΕΚ) αριθ. 44/98, που καταρτίζει, για το 1998, τον
    κατάλογο των σκαφών ολικού μήκους άνω των οκτώ
    μέτρων, τα οποία επιτρέπεται να αλιεύουν γλώσσες
    σε ορισμένες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες, των οποίων το συνολικό μήκος υπερβαίνει
    τα εννέα μέτρα [κοινοποιηθείσα υπό τον αριθμό
    Ε(1998) 2432]'
  type: main
- language: fi
  script: Latn
  content: '98/528/EY: Komission päätös, tehty 14 päivänä elokuuta 1998, luettelon
    laatimisesta vuodeksi 1998 kokonaispituudeltaan kahdeksan metriä ylittävistä
    aluksista, joilla on lupa kalastaa kielikampelaa tietyillä yhteisön vyöhykkeillä
    kokonaispituudeltaan yhdeksän metriä ylittävien puomitroolien avulla annetun
    asetuksen (EY) N:o 44/98 liitteessä esitettävien tiettyjen tietojen muuttamisesta
    (tiedoksiannettu numerolla K(1998) 2432)'
  type: main
- language: it
  script: Latn
  content: '98/528/CE: Decisione della Commissione del 14 agosto 1998 che modifica
    alcune informazioni contenute nell''elenco che figura nell''allegato del regolamento
    (CE) n. 44/98 che fissa l''elenco per il 1998 dei pescherecci di lunghezza fuori
    tutto superiore a otto metri autorizzati a pescare la sogliola in determinate
    zone della Comunità con reti a strascico a pali di lunghezza complessiva superiore
    a nove metri [notificata con il numero C(1998) 2432]'
  type: main
- language: nl
  script: Latn
  content: '98/528/EG: Beschikking van de Commissie van 14 augustus 1998 houdende
    wijziging van bepaalde gegevens van de lijst in de bijlage bij Verordening (EG)
    nr. 44/98 tot vaststelling voor 1998 van de lijst van vaartuigen met een lengte
    over alles van meer dan 8 meter die in bepaalde zones van de Gemeenschap met boomkorren
    waarvan de totale boomlengte meer dan 9 meter bedraagt, op tong mogen vissen (kennisgeving
    geschied onder nummer C(1998) 2432)'
  type: main
- language: pt
  script: Latn
  content: '98/528/CE: Decisão da Comissão de 14 de Agosto de 1998 que altera certas
    informações da lista constante do anexo do Regulamento (CE) nº 44/98 que estabelece,
    para 1998, a lista dos navios com mais de oito metros de comprimento de fora a
    fora autorizados a pescar linguado em determinadas zonas da Comunidade, utilizando
    redes de arrasto de vara em que o comprimento total das varas seja superior a
    nove metros [notificada com o número C(1998) 2432]'
  type: main
- language: es
  script: Latn
  content: '98/528/CE: Decisión de la Comisión de 14 de agosto de 1998 que modifica
    algunos datos de la lista que figura en el anexo del Reglamento (CE) nº 44/98
    por el que se establece para 1998 la lista de barcos cuya eslora total excede
    los ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizando artes de arrastre de vara cuya longitud total
    supere los nueve metros [notificada con el número C(1998) 2432]'
  type: main
- language: sv
  script: Latn
  content: '98/528/EG: Kommissionens beslut av den 14 augusti 1998 om ändring av
    vissa uppgifter i förteckningen i bilagan till förordning (EG) nr 44/98 om fastställande
    av förteckningen för år 1998 över fartyg med en största längd som överstiger
    åtta meter vilka vid fiske efter tunga inom vissa av gemenskapens områden har
    tillstånd att använda bomtrålar vars sammanlagda bomlängd överstiger nio
    meter [delgivet med nr K(1998) 2432]'
