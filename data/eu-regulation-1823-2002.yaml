  type: main
- language: hu
  script: Latn
  content: A Bizottság 1823/2002/EK rendelete (2002. október 11.) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK tanácsi rendelet ötödik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1823/2002 della Commissione, dell'11 ottobre 2002,
    recante quinta modifica del regolamento (CE) n. 881/2002 che impone specifiche
    misure restrittive nei confronti di determinate persone ed entità associate a
    Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento (CE)
    n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1823/2002 (2002. gada 11. oktobris), ar ko piekto
