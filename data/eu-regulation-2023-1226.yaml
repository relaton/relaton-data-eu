    hinsichtlich der Einträge für Kanada, Chile und das Vereinigte Königreich in
    den Listen der Drittländer, aus denen der Eingang in die Union von Sendungen
    von Geflügel, Zuchtmaterial von Geflügel sowie frischem Fleisch von Geflügel
    und Wildgeflügel zulässig ist
