    modifiant les annexes V, XIV et XV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives au Canada, au Chili et au Royaume-Uni
    dans les listes des pays tiers en provenance desquels l’entrée dans l’Union
    d’envois de volailles et de produits germinaux de volailles ainsi que de viandes
    fraîches de volailles et de gibier à plumes est autorisée
  type: main
