  content: Commission Implementing Regulation (EU) 2023/1226 of 22 June 2023 amending
    Annexes V, XIV and XV to Implementing Regulation (EU) 2021/404 as regards the
    entries for Canada, Chile and the United Kingdom in the lists of third countries
    authorised for the entry into the Union of consignments of poultry, germinal products
    of poultry and fresh meat of poultry and game birds
  type: main
- language: fr
  script: Latn
