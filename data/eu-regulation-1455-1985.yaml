    (ΕΟΚ) αριθ. 1599/84 περί λεπτομερών κανόνων για
    την εφαρμογή του συστήματος ενίσχυσης στην
    παραγωγή μεταποιημένων προϊόντων από οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1455/85 della Commissione del 31 maggio 1985 che modifica
    il regolamento (CEE) n. 1599/84 che stabilisce le modalità di applicazione del
    regime di aiuti alla produzione per taluni prodotti trasformati a base di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1455/85 van de Commissie van 31 mei 1985 houdende
    wijziging van Verordening (EEG) nr. 1599/84 tot vaststelling van uitvoeringsbepalingen
    inzake de produktiesteunregeling voor verwerkte produkten op basis van groenten
    en fruit
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1455/85 da Comissão, de 31 de Maio de 1985, que
    altera o Regulamento (CEE) n.° 1599/84 que estabelece as modalidades de aplicação
    do regime de ajudas à produção para os produtos transformados à base de frutas
    e produtos hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1455/85 de la Comisión, de 31 de mayo de 1985, por
