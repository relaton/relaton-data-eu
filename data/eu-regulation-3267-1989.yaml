  script: Latn
  content: Commission Regulation (EEC) No 3267/89 of 30 October 1989 re-establishing
    the levying of customs duties on citric acid falling within CN code 2918 14 00
    originating in Indonesia to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
