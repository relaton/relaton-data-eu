    des Rates über Basisinformationsblätter für verpackte Anlageprodukte für Kleinanleger
    und Versicherungsanlageprodukte (PRIIP) durch technische Regulierungsstandards
    in Bezug auf die Darstellung, den Inhalt, die Überprüfung und die Überarbeitung
    dieser Basisinformationsblätter sowie die Bedingungen für die Erfüllung der
    Verpflichtung zu ihrer Bereitstellung
  type: main
- language: bg
  script: Cyrl
