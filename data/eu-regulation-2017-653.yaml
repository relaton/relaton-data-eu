- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2017/653 of 8 March 2017 supplementing
    Regulation (EU) No 1286/2014 of the European Parliament and of the Council on
    key information documents for packaged retail and insurance-based investment products
    (PRIIPs) by laying down regulatory technical standards with regard to the presentation,
    content, review and revision of key information documents and the conditions for
    fulfilling the requirement to provide such documents
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2017/653 de la Commission du 8 mars 2017 complétant
    le règlement (UE) n° 1286/2014 du Parlement européen et du Conseil sur les
    documents d'informations clés relatifs aux produits d'investissement packagés
    de détail et fondés sur l'assurance (PRIIP) par des normes techniques de réglementation
    concernant la présentation, le contenu, le réexamen et la révision des documents
    d'informations clés et les conditions à remplir pour répondre à l'obligation
    de fournir ces documents
  type: main
- language: de
  script: Latn
