title:
- language: en
  script: Latn
  content: '80/537/EEC: Commission Decision of 14 May 1980 on the reimbursement by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of expenditure incurred
    during 1978 on annuities relating to measures to encourage the cessation of farming
    and the reallocation of utilized agricultural area for the purpose of structural
    improvement (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/537/CEE: Décision de la Commission, du 14 mai 1980, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole, section "orientation",
    au Royaume de Belgique, des dépenses effectuées pendant l''année 1978 pour
    les indemnités relatives à l''encouragement à la cessation de l''activité
    agricole et à l''affectation de la superficie agricole utilisée à des fins
    d''amélioration des structures (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/537/EWG: Entscheidung der Kommission vom 14. Mai 1980 über die Rückvergütung
    der im Jahr 1978 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an das Königreich
    Belgien (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/537/EØF: Kommissionens beslutning af 14. maj 1980 om refusion gennem
    EUGFL, udviklingssektionen, til kongeriget Belgien af de udgifter, som er afholdt
    i løbet af året 1978 til godtgørelser vedrørende støtte til ophør af landbrugsvirksomhed
    og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål (Kun
    den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/537/CEE: Decisione della Commissione, del 14 maggio 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio delle
    spese effettuate durante il 1978 per le indennità concernenti l''incoraggiamento
    alla cessazione dell''attività agricola e alla destinazione della superficie
    agricola utilizzata a scopi di miglioramento delle strutture (Il testi in lingua
    francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/537/EEG: Beschikking van de Commissie van 14 mei 1980 betreffende vergoeding
    door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van de gedurende
    het jaar 1978 gedane uitgaven voor de uitkeringen met betrekking tot de bevordering
    van de bedrijfsbeëindiging in de landbouw en van aanwending van cultuurgrond
    tot verbetering van de structuur (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
