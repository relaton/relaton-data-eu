id: EUDecision197654
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 15 December 1975 authorizing the Kingdom of Belgium
    and the Grand Duchy of Luxembourg not to apply Community treatment to tomatoes
    and table grapes, falling within subheadings 07.01 M I and 08.04 A I of the Common
    Customs Tariff, originating in third countries and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '76/54/CEE: Décision de la Commission, du 15 décembre 1975, autorisant
    le Royaume de Belgique et le Grand- Duché de Luxembourg à exclure du traitement
    communautaire les tomates et les raisins de table, des sous-positions 07.01 MI
    et 08.04 AI du Tarif douanier commun, originaires de certains pays tiers et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 15. Dezember 1975, mit der das Königreich
    Belgien und das Großherzogtum Luxemburg ermächtigt werden, aus gewissen dritten
    Ländern stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche
    Tomaten und Tafeltrauben der Tarifnummern 07.01 M I und 08.04 A I des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 15. december 1975 om bemyndigelse af kongeriget
    Belgien og storhertugdømmet Luxembourg til fra fællesskabstoldbehandling at
    undtage tomater og druer til spisebrug, som henhører under positionerne 07.01
    M I og 08.04 A I i den fælles toldtarif, har oprindelse i visse tredjelande og
    som kan omsættes frit i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 15 dicembre 1975, che autorizza il Regno
    del Belgio e il Granducato del Lussemburgo ad escludere dal trattamento comunitario
    i pomodori e le uve da tavola delle sottovoci 07.01 M I e 08.04 A I della tariffa
    doganale comune, originari di taluni paesi terzi e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 15 december 1975 waarbij het Koninkrijk
    België en het Groothertogdom Luxemburg worden gemachtigd tomaten en tafeldruiven
    van post 07.01 M I en 08.04 A I van het gemeenschappelijk douanetarief, van oorsprong
    uit bepaalde derde landen en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
