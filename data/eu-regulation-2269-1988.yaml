title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2269/88 of 19 July 1988 amending Regulation
    (EEC) No 1469/70 fixing the percentages and quantities of tobacco taken over by
    the intervention agencies and the percentage of Community tobacco production above
    which the procedures laid down in Article 13 of Regulation (EEC) No 727/70 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2269/88 du Conseil du 19 juillet 1988 modifiant le
    règlement (CEE) n° 1469/70 fixant les pourcentages et les quantités de tabac
    prises en charge par les organismes d'intervention ainsi que le pourcentage de
    la production communautaire de tabac dont le dépassement déclenche les procédures
    prévues à l'article 13 du règlement (CEE) n° 727/70
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2269/88 des Rates vom 19. Juli 1988 zur Änderung
    der Verordnung (EWG) Nr. 1469/70 zur Festsetzung der Hundertsätze und Mengen
    des von den Interventionsstellen übernommenen Tabaks sowie des Hundertsatzes
    der gemeinschaftlichen Tabakerzeugung, deren Überschreitung die Verfahren nach
    Artikel 13 der Verordnung (EWG) Nr. 727/70 auslöst
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2269/88 af 19. juli 1988 om ændring af forordning
    (EØF) nr. 1469/70 om fastsættelse af procentsatser og mængder af den af interventionsorganerne
    overtagne tobak samt procentsatsen af fællesskabsproduktion af tobak, hvis overskridelse
    udløser foranstaltningerne i medfør af artikel 13 i forordning (EØF) nr. 727/70
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2269/88 του Συμβουλίου
    της 19ης Ιουλίου 1988 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1469/70 περί καθορισμού των ποσοστών
    και των ποσοτήτων καπνού που αναλαμβάνονται
    από τους οργανισμούς παρέμβασης καθώς και
    του ποσοστού της κοινοτικής παραγωγής καπνού
    του οποίου η υπέρβαση συνεπάγεται τη διαδικασία
    που προβλέπεται στο άρθρο 13 του κανονισμού
    (ΕΟΚ) αριθ. 727/70
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2269/88, annettu 19 päivänä heinäkuuta 1988,
    interventioelinten haltuunottaman tupakan prosenttiosuuksista ja määristä sekä
    yhteisön tupakkatuotannon prosenttiosuudesta asetuksen (ETY) N:o 727/70 13 artiklassa
    säädetystä menettelystä annetun asetuksen (ETY) N:o 1469/70 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2269/88 del Consiglio del 19 luglio 1988 recante modifica
    del regolamento (CEE) n. 1469/70 che fissa le percentuali e i quantitativi di
    tabacco presi a carico da parte degli organismi di intervento, nonché la percentuale
    della produzione Comunitària di tabacco il cui superamento è determinante per
    lo scatto delle procedure previste all'articolo 13 del regolamento (CEE) n. 727/70
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2269/88 van de Raad van 19 juli 1988 tot wijziging
    van Verordening (EEG) nr. 1469/70 houdende vaststelling van de percentages en
    de hoeveelheden door de interventiebureaus overgenomen tabak, alsmede van het
    percentage van de tabaksproduktie in de Gemeenschap bij overschrijding waarvan
    de in artikel 13 van Verordening (EEG) nr. 727/70 bedoelde procedures van toepassing
    worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2269/88 do Conselho de 19 de Julho de 1988 que altera
    o Regulamento (CEE) nº 1469/70 que fixa as percentagens e as quantidades de tabaco
    tomadas a cargo pelos organismos de intervenção, bem como a percentagem da produção
    comunitária de tabaco que, a ser excedida, desencadeia os processos previstos
    no artigo 13º do Regulamento (CEE) nº 727/70
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2269/88 del Consejo de 19 de julio de 1988 que modifica
    el Reglamento (CEE) n° 1469/70 por el que se fijan los porcentajes y las cantidades
    de tabaco de las que se harán cargo los organismos de intervención, así como
    el porcentaje de la producción comunitaria de tabaco que, al ser superado, desencadena
    los procedimientos previstos en el artículo 13 del Reglamento (CEE) n° 727/70
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 2269/88 av den 19 juli 1988 om ändring av
    förordning (EEG) nr 1469/70 om fastställande av den andel och de kvantiteter
    tobak som tagits över av interventionsorganen och den andel av tobaksproduktionen
    inom gemenskapen över vilken förfarandet i artikel 13 i förordning nr 727/70
    skall tillämpas
