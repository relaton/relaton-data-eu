  script: Latn
  content: '80/962/EEC: Commission Decision of 29 September 1980 on the reimbursement
    by the EAGGF, Guidance Section, to the French Republic of expenditure incurred
    during 1979, in connection with Community measures for the eradication of brucellosis,
    tuberculosis and leucosis in cattle (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/962/CEE: Décision de la Commission, du 29 septembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole,
    section "orientation", à la République française des dépenses effectuées
    pendant l''année 1979 dans le cadre d''une action de la Communauté en vue de
    l''éradication de la brucellose, de la tuberculose et de la leucose des bovins
    (Le texte en langue française est le seul faisant foi)'
  type: main
