title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 971/76 of 27 April 1976 re-establishing
    the levying of customs duties on image projectors (other than cinematographic
    projectors), photographic (except cinematographic) enlargers and reducers, falling
    within heading No 90.09, originating in Singapore to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November 1975
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 971/76 de la Commission, du 27 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de projection fixé; appareils d'agrandissement ou de réduction photographiques,
    de la position tarifaire 90.09, originaires de Singapour, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 971/76 der Kommission vom 27. April 1976 zur Wiedereinführung
    des Zollsatzes für Stehbildwerfer; photographische Vergrößerungs- oder Verkleinerungsapparate,
    der Tarifnummer 90.09, mit Ursprung in Singapur, dem die in der Verordnung (EWG)
    Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 971/76 af 27. april 1976 om genindførelse
    af opkrævning af toldafgifter for lysbilledapparater; forstørrelses- og formindskelsesapparater
    til fotografisk brug (undtagen kinematografiske), under position 90.09, som har
    oprindelse i Singapore og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 971/76 della Commissione, del 27 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi da proiezione
    fissa, apparecchi fotografici d'ingrandimento o di riduzione della voce doganale
    n. 90.09 originari di Singapore beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 971/76 van de Commissie van 27 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op projectietoestellen
    voor niet bewegende beelden, vergrotings- en verkleiningstoestellen voor de fotografie,
    van post 90.09, van oorsprong uit Singapore, ten behoeve waarvan bij Verordening
    (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
