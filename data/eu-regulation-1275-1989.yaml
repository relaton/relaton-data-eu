schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1275/89 of 10 May 1989 re-establishing the
    levying of customs duties on men' s or boys' suits and ensembles, other than knitted
    or crocheted, products of category No 16 (Order No 40.0160) and women' s or girls'
    skirts, products of category No 27 (Order No 40.0270) originating in India to
    which the preferential tariff arrangements of Council Regulation (EEC) No 4259/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1275/89 de la Commission du 10 mai 1989 portant rétablissement
    de la perception des droits de douane applicables aux costumes, complets etc.
    autres que de bonneterie pour hommes et garçonnets de la catégorie de produits
    nº 16 (numéro d' ordre 40.0160) et aux jupes pour femmes ou fillettes, de la
    catégorie de produits nº 27 (numéro d' ordre 40.0270) originaires de l' Inde,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) nº
    4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1275/89 der Kommission vom 10. Mai 1989 zur Wiedereinführung
    des Zollsatzes für Anzüge und Kombinationen, andere als aus Gewirken, für Männer
    und Knaben, der Warenkategorie Nr. 16 (lfd. Nr. 40.0160) sowie Röcke, für Frauen
    und Mädchen, der Warenkategorie Nr. 27 (lfd. Nr. 40.0270) mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1275/89 af 10. maj 1989 om genindførelse
    af opkrævning af toldafgifter for jakkesæt, ikke af trikotage, til mænd og
    drenge, under varekategori nr. 16 (løbenummer 40.0160) nederdele, til kvinder
    og piger, under varekategori nr. 27 (løbenummer 40.0270), som har oprindelse
    i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1275/89 της Επιτροπής
    της 10ης Μαΐου 1989 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για κοστούμια και σύνολα,
    εκτός από τα πλεκτά για άντρες και αγόρια, προϊόντα
    της κατηγορίας 16 (αύξων αριθμός 40.0160), φούστες
    στις οποίες περιλαμβάνονται και οι φούστες-παντελόνια
    για γυναίκες ή κορίτσια, προϊόντα της κατηγορίας
    27 (αύξων αριθμός 40.0270), καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    4259/88 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1275/89 della Commissione del 10 maggio 1989 che ripristina
    la riscossione dei dazi doganali applicabili a vestiti, completi e insiemi, esclusi
    quelli a maglia, per uomo e per ragazzo, della categoria di prodotti n. 16 (numero
    d' ordine 40.0160), gonne, per donna o per ragazze della categoria di prodotti
    n. 27 (numero d' ordine 40.0270) originari dell' India, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 4259/88 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1275/89 van de Commissie van 10 mei 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kostuums
    en combinaties, andere dan van brei- of haakwerk, voor heren en jongens, van de
    categorie van produkten nr. 16 (volgnummer 40.0160) en rokken voor dames en meisjes,
    van de categorie van produkten nr. 27 (volgnummer 40.0270), van oorsprong uit
    India, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 4259/88 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1275/89 da Comissão de 10 de Maio de 1989 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis ao fatos completos e conjuntos,
    excluindo os de malha, para homens e rapazes, da categoria de produtos nº 16
    (nº de ordem 40.0160), e às saias para senhoras ou raparigas, da categoria de
    produtos nº 27 (nº de ordem 40.0270), originários da Índia, beneficiária
    das preferências pautais previstas no Regulamento (CEE) nº 4259/88 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1275/89 de la Comisión de 10 de mayo de 1989 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los trajes completos y conjuntos, que no sean de punto, para hombres y niños,
    de la categoría nº 16 (número de orden 40.0160), y a las faldas para mujeres,
    de la categoría nº 27 (número de orden 40.0270), originarios de la India, beneficiaria
    de las preferencias arancelarias previstas por el Reglamento (CEE) nº 4259/88
    del Consejo
  type: main
