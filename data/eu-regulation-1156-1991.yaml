title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1156/91 of 3 May 1991 re- establishing the
    levying of customs duties on products of category 159 (order No 42.1590), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1156/91 DE LA COMMISSION du 3 mai 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    159 (numéro d'' ordre 42.1590) originaires de Chine bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1156/91 DER KOMMISSION vom 3. Mai 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 159 (lfd. Nummer
    42.1590) mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3832/90 des
    Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1156/91 af 3. maj 1991 om genindførelse
    af opkrævning af told for varer under kategori nr. 159 (løbenummer 42.1590),
    som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1156/91 της Επιτροπής
    της 3ης Μαΐου 1991 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    159 ( αύξων αριθμός 42.1590 ), καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1156/91 DELLA COMMISSIONE del 3 maggio 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prdotti della categoria n. 159
    (numero d'' ordine 42.1590) originari della Cina, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1156/91 VAN DE COMMISSIE van 3 mei 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op produkten van
    categorie nr. 159 (volgnummer 42.1590), van oorsprong uit China, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90 van de
    Raad #'
  type: main
- language: pt
