title:
- language: en
  script: Latn
  content: Regulation (EEC) No 271/75 of the Commission of 3 February 1975 authorizing
    the United Kingdom partially to suspend as regards certain products of the cereals
    and rice sector the component for the protection of the processing industry
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 271/75 de la Commission, du 3 février 1975, autorisant
    le Royaume-Uni à suspendre partiellement l' élément destiné à assurer la
    protection de l' industrie de transformation pour certains produits relevant des
    secteurs des céréales et du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 271/75 der Kommission vom 3. Februar 1975 zur Ermächtigung
    des Vereinigten Königreichs, den Bestandteil zum Schutz der Verarbeitungsindustrie
    für bestimmte Erzeugnisse, die unter die Sektoren Getreide und Reis fallen, teilweise
    auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 271/75 af 3. februar 1975 om bemyndigelse
    til Det forenede Kongerige til, for visse produkter henhørende under kornsektoren
    og rissektoren, delvis at suspendere det element, der har til formål at sikre
    beskyttelsen af forarbejdningsindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 271/75 della Commissione, del 3 febbraio 1975, che
    autorizza il Regno Unito a sospendere parzialmente l' elemento destinato ad assicurare
    la protezione dell' industria di trasformazione per alcuni prodotti dei settori
    dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 271/75 van de Commissie van 3 februari 1975 houdende
    machtiging van het Verenigd Koninkrijk tot gedeeltelijke schorsing van het element
    ter bescherming van de verwerkende industrie voor bepaalde produkten van de sectoren
    granen en rijst
