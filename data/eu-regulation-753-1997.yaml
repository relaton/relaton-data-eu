  content: COMMISSION REGULATION (EC) No 753/97 of 25 April 1997 determining the extent
    to which applications lodged in April 1997 for import licences for certain pigmeat
    products under the regime provided for by the Agreements concluded by the Community
    with Bulgaria and Romania can be accepted
  type: main
