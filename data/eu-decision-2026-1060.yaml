    veiligheid in het westelijke deel van de Indische Oceaan en in de Rode Zee (EUNAVFOR
    ATALANTA), en tot intrekking van Besluit (GBVB) 2026/310 (EUNAVFOR ATALANTA/2/2026)
  type: main
