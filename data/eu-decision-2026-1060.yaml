  content: Political and Security Committee Decision (CFSP) 2026/1060 of 5 May 2026
    on the appointment of the EU Force Commander for the European Union military operation
    to contribute to maritime security in the West Indian Ocean and in the Red Sea
    (EUNAVFOR ATALANTA) and repealing Decision (CFSP) 2026/310 (EUNAVFOR ATALANTA/2/2026)
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2026/1060 du Comité politique et de sécurité du 5 mai
    2026 portant nomination du commandant de la force de l’UE pour l’opération
    militaire de l’Union européenne en vue d’une contribution à la sûreté
    maritime dans l’ouest de l’océan Indien et en mer Rouge (EUNAVFOR ATALANTA)
    et abrogeant la décision (PESC) 2026/310 (EUNAVFOR ATALANTA/2/2026)
  type: main
- language: de
  script: Latn
