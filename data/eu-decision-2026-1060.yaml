    5. maijs), ar ko ieceļ ES spēku komandieri Eiropas Savienības militārajai
    operācijai ar mērķi veicināt jūras drošību Indijas okeāna rietumdaļā
    un Sarkanajā jūrā (EUNAVFOR ATALANTA) un atceļ Lēmumu (KĀDP) 2026/310 (EUNAVFOR
    ATALANTA/2/2026)
  type: main
- language: lt
  script: Latn
