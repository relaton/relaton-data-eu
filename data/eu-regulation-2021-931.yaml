    gäller tekniska tillsynsstandarder för att specificera metoden för att identifiera
    derivattransaktioner med en eller flera väsentliga riskdrivare vid tillämpning
    av artikel 277.5, formeln för beräkning av regulatoriskt delta för köp- och
    säljoptioner som placerats in i ränteriskkategorin och metoden för att avgöra
    om en transaktion är en lång eller kort position i en primär riskdrivare eller
    i den väsentligaste riskdrivaren i den givna riskkategorin vid tillämpning av
    artikel 279a.3 a och b i schablonmetoden för motpartsrisk
