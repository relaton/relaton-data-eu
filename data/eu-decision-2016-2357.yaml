title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2016/2357 of 19 December 2016 regarding the lack
    of effective compliance with Regulation (EC) No 216/2008 of the European Parliament
    and of the Council and its implementing rules in respect of certificates issued
    by the Hellenic Aviation Training Academy (HATA), and Part-66 licenses issued
    on the basis thereof (notified under document C(2016) 8645)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2016/2357 de la Commission du 19 décembre 2016 relative
    au non-respect effectif du règlement (CE) n° 216/2008 du Parlement européen
    et du Conseil et de ses règles de mise en œuvre en ce qui concerne les certificats
    délivrés par Hellenic Aviation Training Academy (HATA) et les licences relevant
    de la partie 66 délivrées sur la base de ces certificats [notifiée sous le
    numéro C(2016) 8645]
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2016/2357 der Kommission vom 19. Dezember 2016 über die
    nicht wirksame Einhaltung der Verordnung (EG) Nr. 216/2008 des Europäischen Parlaments
    und des Rates und ihrer Durchführungsvorschriften in Bezug auf die Urkunden,
    die von der Hellenic Aviation Training Academy (HATA) ausgestellt wurden, und
    die Teil-66-Lizenzen, die auf der Grundlage dieser Urkunden erteilt wurden (Bekannt
    gegeben unter Aktenzeichen C(2016) 8645)
  type: main
