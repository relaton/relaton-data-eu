title:
- language: en
  script: Latn
  content: '81/382/EEC: Commission Decision of 1 April 1981 authorizing the French
    Republic not to apply Community treatment to toys made of wood or other (except
    motors and movement mechanisms for toys and working models used for recreational
    purposes and parts thereof) originating in Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/382/CEE: Décision de la Commission, du 1er avril 1981, autorisant
    la République française à exclure du traitement communautaire les jouets en
    bois et autres (à l''exclusion des moteurs et mécanismes d''animation pour jouets
    et modèles réduits ainsi que leurs pièces détachées) originaires de T''ai-wan
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/382/EWG: Entscheidung der Kommission vom 1. April 1981 zur Ermächtigung
    der Französischen Republik, aus Taiwan stammende Spielzeuge aus Holz und andere
    (mit Ausnahme der Motor- und Bewegungsmechanismen für Spielzeuge und Modelle
    zum Spielen sowie deren Ersatzteile) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/382/EØF: Kommissionens beslutning af 1. april 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage andet legetøj
    af træ (med undtagelse af motorer og bevægelsesmekanismer til legetøj og arbejdsmodeller
    til fritidsbeskæftigelse og dele dertil) med oprindelse i Taiwan (Kun den franske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/382/ΕΟΚ: Απόφαση τής Επιτροπής τής 1ης Απριλίου
    1981 περί εξουσιοδοτήσεως τής Γαλλικής Δημοκρατίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    τά αθύρματα εκ ξύλου καί λοιπά (εξαιρέσει τών
    κινητήρων καί τών μηχανισμών κινήσεως δι αθύρματα
    καί μικροκατασκευάσματα διαφόρων αντικειμένων
    καθώς καί τά μεμονωμένα των τεμάχια) καταγόμενα
    από τήν Ταϊβάν (Το κείμενο στην γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/382/CEE: Decisione della Commissione, del 1 aprile 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli in
    legno ed altri (eccetto i motori e meccanismi d''animazione per giocattoli e modelli
    ridotti ed i loro pezzi staccati), originari di Taiwan (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/382/EEG: Beschikking van de Commissie van 1 april 1981 houdende machtiging
    van de Franse Republiek om speelgoed uit hout en andere (met uitzondering van
    animatiemotoren en mechanismen voor speelgoed op schaal alsook hun onderdelen)
    van oorsprong uit Taiwan van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
