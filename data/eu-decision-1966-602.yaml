title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 octobre 1966, portant octroi d'un contingent
    tarifaire à la République italienne pour 3.000 taureaux, vaches et génisses,
    des races de Schwyz, du Simmental et de Fribourg, autres que ceux destinés à
    la boucherie
  type: main
- language: de
  script: Latn
  content: '66/602/EWG: Entscheidung der Kommission vom 4. Oktober 1966 über die
    Gewährung eines Zollkontingents für 3000 Stück Stiere, Kühe und Färsen der
    Schwyzer, Simmentaler oder Freiburger Rasse, nicht zum Schlachten, an die Italienische
    Republik'
  type: main
- language: it
  script: Latn
  content: '66/602/CEE: Decisione della Commissione, del 4 ottobre 1966, relativa
    alla concessione di un contingente tariffario alla Repubblica italiana per 3.000
    capi di tori, vacche e giovenche, delle razze di Schwyz, di Simmental e di Friburgo,
    esclusi quelli da macello'
  type: main
- language: nl
  script: Latn
  content: '66/602/EEG: Beschikking van de Commissie van 4 oktober 1966 houdende toekenning
    van een tariefcontingent aan de Italiaanse Republiek voor 3.000 stuks stieren,
    koeien en waarzen van het Schwyzer ras, van het Simmentaler ras en van het Freiburger
    ras, niet bestemd voor de slacht'
  type: main
