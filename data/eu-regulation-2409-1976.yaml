title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2409/76 of 4 October 1976 re-establishing
    the levying of the customs duties on flax or ramie yarn, not put up for retail
    sale, falling within heading No 54.03, originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3004/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2409/76 de la Commission, du 4 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    lin ou de ramie, non conditionnés pour la vente au détail, de la position tarifaire
    54.03, originaires du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3004/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2409/76 der Kommission vom 4. Oktober 1976 über die
    Wiedereinführung des Zollsatzes für Leinengarne und Ramiegarne, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifnummer 54.03, mit Ursprung in Brasilien, dem
    die in der Verordnung (EWG) Nr. 3004/75 des Rates vom 17. November 1975 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2409/76 af 4. oktober 1976 om genindførese
    af opkrævning af toldafgifter for garn af hør eller ramie, ikke i detailsalgsoplægninger,
    under position 54.03, som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3004/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2409/76 della Commissione, del 4 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lino o di
    ramiè, non preparati per la vendita al minuto, della voce doganale 54.03, originari
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3004/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2409/76 van de Commissie van 4 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op garens van
    vlas of ramee, niet gereed voor de verkoop in het klein, van post 54.03, van oorsprong
    uit Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3004/75 van de Raad van 17 november 1975
  type: main
