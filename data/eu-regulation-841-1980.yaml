  content: Commission Regulation (EEC) No 841/80 of 2 April 1980 repealing Regulation
    (EEC) No 1407/78 fixing a countervailing charge on imports into Belgium, the Federal
    Republic of Germany, Luxembourg and the Netherlands of alcohol of agricultural
    origin produced in France and on imports into Belgium and Luxembourg of spirit
    vinegar produced in France
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 841/80 de la Commission, du 2 avril 1980, abrogeant
    le règlement (CEE) n° 1407/78 portant fixation d'une taxe compensatoire sur
    les importations en Belgique, en République fédérale d'Allemagne, au Luxembourg
    et aux Pays-Bas d'alcool éthylique d'origine agricole obtenu en France et sur
    les importations en Belgique et au Luxembourg de vinaigre d'alcool obtenu en France
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 841/80 der Kommission vom 2. April 1980 zur Aufhebung
    der Verordnung (EWG) Nr. 1407/78 zur Festsetzung einer Ausgleichsabgabe für die
    Einfuhr von in Frankreich hergestelltem Äthylalkohol landwirtschaftlichen Ursprungs
    nach Belgien, der Bundesrepublik Deutschland, Luxemburg und den Niederlanden sowie
    für die Einfuhr von in Frankreich hergestelltem Alkoholessig nach Belgien und
    Luxemburg
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 841/80 af 2. april 1980 om ophævelse
