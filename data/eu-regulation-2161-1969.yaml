    Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2161/69 della Commissione, del 30 ottobre 1969, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 novembre 1969,
    a taluni prodotti lattiero-caseari esportati sotto forma di merci non comprese
    nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2161/69 van de Commissie van 30 oktober 1969 houdende
    vaststelling van de restituties welke vanaf 1 november 1969 van toepassing zijn
    op bepaalde zuivelprodukten die worden uitgevoerd in de vorm van niet in bijlage
    II van het Verdrag vermelde goederen
