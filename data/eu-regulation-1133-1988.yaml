title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1133/88 of 27 April 1988 amending Regulation
    (EEC) No 470/88 fixing, for the period 1 January to 31 December 1988 the maximum
    quantity of certain products of the oils and fats sector to be released for consumption
    and imported into Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1133/88 de la Commission du 27 avril 1988 modifiant
    le règlement (CEE) n° 470/88, fixant pour la période allant du 1er janvier
    au 31 décembre 1988 la quantité maximale de certains produits du secteur des
    matières grasses à mettre à la consommation et à importer en Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1133/88 der Kommission vom 27. April 1988 zur Änderung
    der Verordnung (EWG) Nr. 470/88 zur Festsetzung der Höchstmengen bestimmter Erzeugnisse
    des Fettsektors, die in Spanien zum freien Verkehr abzufertigen und in dieses
    Land einzuführen sind, für Zeit vom 1. Januar bis 31. Dezember 1988
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1133/88 af 27. april 1988 om ændring
    af forordning (EØF) nr. 470/88 om fastsættelse for perioden 1. januar til 31.
    december 1988 af den største mængde af visse produkter inden for fedtstofsektoren,
    der kan overgå til frit forbrug i og importeres til Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1133/88 της Επιτροπής
    της 27ης Απριλίου 1988 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 470/88 που καθορίζει, για την περίοδο
    από την 1η Ιανουαρίου έως τις 31 Δεκεμβρίου 1988,
    τη μέγιστη ποσότητα ορισμένων προϊόντων του
    τομέα των λιπαρών ουσιών που διατίθενται στην
    κατανάλωση και εισάγονται στην Ισπανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1133/88 della Commissione del 27 aprile 1988 recante
    modifica del regolamento (CEE) n. 470/88 che fissa, per il periodo 1° gennaio
    - 31 dicembre 1988, la quantità massima di taluni prodotti del settore dei grassi
    da mettere in consumo e da importare in Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1133/88 van de Commissie van 27 april 1988 tot wijziging
    van Verordening (EEG) nr. 470/88 tot vaststelling, voor het tijdvak van 1 januari
    tot en met 31 december 1988, van de maximumhoeveelheid van bepaalde in Spanje
    in consumptie te brengen of in te voeren produkten van de sector oliën en vetten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1133/88 da Comissão de 27 de Abril de 1988 que
    altera o Regulamento (CEE) n.° 470/88, que fixa, para um período compreendido
    entre 1 de Janeiro e 31 de Dezembro de 1988, a quantidade máxima de determinados
    produtos do sector das matérias gordas a introduzir no consumo e a importar em
    Espanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1133/88 de la Comisión de 27 de abril de 1988 por
    el que se modifica el Reglamento (CEE) n° 470/88, que fija, para el período
    comprendido entre el 1 de enero y el 31 de diciembre de 1988, la cantidad máxima
    de ciertos productos del sector de las materias grasas que habrá de despacharse
    al consumo e importarse en España
