title:
- language: en
  script: Latn
  content: Council Decision (CFSP) 2020/792 of 11 June 2020 amending Joint Action
    2008/124/CFSP on the European Union Rule of Law Mission in Kosovo (This designation
    is without prejudice to positions on status, and is in line with UNSCR 1244 (1999)
    and the ICJ Opinion on the Kosovo declaration of independence.) (EULEX KOSOVO)
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2020/792 du Conseil du 11 juin 2020 modifiant l’action
    commune 2008/124/PESC relative à la mission «État de droit» menée par l’Union
    européenne au Kosovo (Cette désignation est sans préjudice des positions sur
    le statut et est conforme à la résolution 1244 (1999) du Conseil de sécurité
    des Nations unies ainsi qu’à l’avis de la CIJ sur la déclaration d’indépendance
    du Kosovo.) (EULEX KOSOVO)
  type: main
- language: de
  script: Latn
  content: Beschluss (GASP) 2020/792 des Rates vom 11. Juni 2020 zur Änderung der
    Gemeinsamen Aktion 2008/124/GASP über die Rechtsstaatlichkeitsmission der Europäischen
    Union im Kosovo (Diese Bezeichnung berührt nicht die Standpunkte zum Status und
    steht im Einklang mit der Resolution 1244 (1999) des VN-Sicherheitsrates und dem
    Gutachten des Internationalen Gerichtshofs zur Unabhängigkeitserklärung des
    Kosovos.) (EULEX KOSOVO)
  type: main
