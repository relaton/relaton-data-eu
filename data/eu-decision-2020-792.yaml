    ao estatuto e está em conformidade com a Resolução 1244 (1999) do CSNU e com
    o parecer do TIJ sobre a declaração de independência do Kosovo.) (EULEX KOSOVO)
  type: main
- language: ro
  script: Latn
  content: Decizia (PESC) 2020/792 a Consiliului din 11 iunie 2020 de modificare a
