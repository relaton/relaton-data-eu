    a supremației legii în Kosovo (Această denumire nu aduce atingere pozițiilor
    privind statutul și este conformă cu RCSONU 1244 (1999), precum și cu Avizul
    CIJ privind Declarația de independență a Kosovo.) (EULEX KOSOVO)
