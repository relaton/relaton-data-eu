    akcije 2008/124/ZVSP o Misiji Europske unije za uspostavu vladavine prava u Kosovu
    (Ovim se nazivom ne dovode u pitanje stajališta o statusu te je on u skladu s
    RVSUN-om 1244 (1999) i mišljenjem Međunarodnog suda o proglašenju neovisnosti
    Kosova.) (EULEX KOSOVO)
  type: main
- language: hu
  script: Latn
