    Unie in Kosovo (Deze benaming laat de standpunten over de status van Kosovo onverlet,
    en is in overeenstemming met Resolutie 1244 (1999) van de VN-Veiligheidsraad en
    het advies van het Internationaal Gerechtshof over de onafhankelijkheidsverklaring
    van Kosovo.) (EULEX KOSOVO)
