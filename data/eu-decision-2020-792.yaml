    koszovói (Ez a megnevezés nem érinti a jogállással kapcsolatos álláspontokat,
    továbbá összhangban van az 1244. (1999) sz. ENSZ BT-határozattal és a Nemzetközi
    Bíróságnak a koszovói függetlenségi nyilatkozatról szóló véleményével.)
    jogállamiság-missziójáról (EULEX Koszovó) szóló 2008/124/KKBP együttes
    fellépés módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione (PESC) 2020/792 del Consiglio dell’11 giugno 2020 che modifica
    l’azione comune 2008/124/PESC relativa alla missione dell’Unione europea sullo
    Stato di diritto in Kosovo (Tale designazione non pregiudica le posizioni riguardo
    allo status ed è in linea con la risoluzione 1244 (1999) dell’UNSC e con il
    parere della CIG sulla dichiarazione di indipendenza del Kosovo.) (EULEX KOSOVO)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (KĀDP) 2020/792 (2020. gada 11. jūnijs), ar ko groza
    Vienoto rīcību 2008/124/KĀDP par Eiropas Savienības Tiesiskuma misiju Kosovā
    (Šis nosaukums neskar nostājas par statusu un atbilst ANO DP Rezolūcijai 1244
    (1999) un Starptautiskās Tiesas atzinumam par Kosovas neatkarības deklarāciju.)
    (EULEX KOSOVO)
  type: main
