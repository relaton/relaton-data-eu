title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1291/88 of 11 May 1988 re-establishing the
    levying of customs duties on woven fabrics of continuous artificial fibres, products
    of category 36 (order No 40.0360), woven fabrics of sheep' s or lambs' wool or
    of fine animal hair, products of category 50 (order No 40.0500), yarn of staple
    synthetic fibres, put up for retail sale, products of category 56 (order No 40.0560),
    originating in China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1291/88 de la Commission du 11 mai 1988 portant rétablissement
    de la perception des droits de douane applicables aux tissus de fibres artificielles
    continues de la catégorie de produits n° 36 (n° d' ordre 40.0360), et aux tissus
    de coton ou de poils fins de la catégorie de produits n° 50 (n° d' ordre 40.0500),
    aux fils de fibres synthétiques discontinues, conditionnés pour la vente au
    détail, de la catégorie de produits n° 56 (n° d' ordre 40.0560), originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1291/88 der Kommission vom 11. Mai 1988 zur Wiedereinführung
    des Zollsatzes für Gewebe aus künstlichen Spinnfäden der Warenkategorie Nr.
    36 (lfd. Nr. 40.0360), Gewebe aus Wolle oder feinen Tierhaaren der Warenkategorie
    Nr. 50 (lfd. Nr. 40.0500) sowie Garne aus synthetischen Spinnfasern, in Aufmachungen
    für den Einzelverkauf, der Warenkategorie Nr. 56 (lfd. Nr. 40.0560) mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1291/88 af 11. maj 1988 om genindførelse
    af opkrævning af toldafgifter for vævet stof af endeløse syntetiske fibre,
    under varekategori nr. 36 (løbenummer 40.0360), vævet stof af uld eller fine
    dyrehår, under varekategori nr. 50 (løbenummer 40.0500) og korte syntetiske
    fibre, i detailsalgsoplægninger under varekategori nr. 56 (løbenummer 40.0560),
    som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
