  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1291/88 della Commissione dell' 11 maggio 1988 che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre artificiali
    continue, della categoria di prodotti n. 36 (numero d' ordine 40.0360), ai tessuti
    di lana o di peli fini, della categoria di prodotti n. 50 (numero d' ordine 40.0500)
    e ai filati di fibre sintetiche in fiocco, preparati per la vendita al minuto,
    della categoria di prodotti n. 56 (numero d' ordine 40.0560), originari della
    Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1291/88 van de Commissie van 11 mei 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van kunstmatige stapelvezels van de categorie van produkten nr. 36 (volgnummer
    40.0360), weefsels van wol of van fijn haar van de categorie van produkten nr.
    50 (volgnummer 40.0500) en garens van synthetische stapelvezels, gereed voor de
    verkoop in het klein, van de categorie van produkten nr. 56 (volgnummer 40.0560),
    van oorsprong uit China, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3783/87 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1291/88 da Comissão de 11 de Maio de 1988 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos tecidos de fibras artificiais
    contínuas, da categoria de produtos n.° 36 (n.° de ordem 40.0360), aos tecidos
    de lã ou de pêlos finos, da categoria de produtos n.° 50 (n.° de ordem 40.0500),
    aos fios de fibras sintéticas descontínuas, acondicionados para venda a retalho,
    da categoria de produtos n.° 56 (n.° de ordem 40.0560), originários da China,
    beneficiária das preferências pautais previstas no Regulamento (CEE) n.° 3783/87
    do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1291/88 de la Comisión de 11 de mayo de 1988 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los tejidos de fibras textiles artificiales continuas, de la categoría n°
    36 (número de orden 40.0360); a los tejidos de algodón o de pelos finos, de
    la categoría n° 50 (número de orden 40.0500), y a los hilados de fibras sintéticas
    discontinuas acondicionados para la venta al por menor, de la categoría n° 56
    (número de orden 40.0560), originarios de China, beneficiaria de las preferencias
    arancelarias previstas por el Reglamento (CEE) n° 3783/87 del Consejo
  type: main
