title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1480/98 of 10 July 1998 amending Regulation
    (EEC) No 1150/90 as regards the transitional adjustment of certain provisions
    relating to imports into the Community of certain milk products originating in
    the African, Caribbean and Pacific States (ACP) or in the overseas countries and
    territories (OCT) in order to implement the Agreement on Agriculture concluded
    during the Uruguay Round of negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1480/98 de la Commission du 10 juillet 1998 modifiant
    le règlement (CEE) nº 1150/90 en ce qui concerne l'adaptation transitoire de
    certaines dispositions relatives aux importations dans la Communauté de certains
    produits laitiers originaires des États d'Afrique, des Caraïbes et du Pacifique
    (ACP) ou des pays et territoires d'outre-mer (PTOM) en vue de la mise en oeuvre
    de l'accord sur l'agriculture conclu dans le cadre des négociations du cycle
    d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1480/98 der Kommission vom 10. Juli 1998 zur Änderung
    der Verordnung (EWG) Nr. 1150/90 zur übergangsweisen Anpassung von Vorschriften
    über die Einfuhr bestimmter Milcherzeugnisse in die Gemeinschaft mit Ursprung
    in den Staaten in Afrika, im karibischen Raum und im Pazifischen Ozean (AKP) oder
    in den überseeischen Ländern und Gebieten (ÜLG) zur Anwendung des im Rahmen
    der Uruguay-Runde über die Landwirtschaft getroffenen Übereinkommens
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1480/98 af 10. juli 1998 om ændring
    af forordning (EØF) nr. 1150/90 for så vidt angår den midlertidige tilpasning
    af visse bestemmelser for indførsel til Fællesskabet af visse mejeriprodukter
    med oprindelse i staterne i Afrika, Vestindien og Stillehavet (AVS) eller de oversøiske
    lande og territorier (OLT) med henblik på iværksættelsen af den landbrugsaftale,
    der er indgået i forbindelse med forhandlingerne under Uruguay-runden
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1480/98 της Επιτροπής
