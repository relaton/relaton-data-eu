  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1480/98, annettu 10 päivänä heinäkuuta 1998,
    asetuksen (ETY) N:o 1150/90 muuttamisesta tiettyjä Afrikan, Karibian ja Tyynenmeren
    valtioista (AKT) tai merentakaisista maista ja merentakaisilta alueilta (MMA)
    peräisin olevia maitotuotteita koskevien yksityiskohtaisten sääntöjen mukauttamiseksi
    siirtymäkaudeksi Uruguayn kierroksen neuvottelujen osana tehdyn maataloussopimuksen
    täytäntöönpanemiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1480/98 della Commissione del 10 luglio 1998 che modifica
    il regolamento (CEE) n. 1150/90 in ordine all'adattamento transitorio di talune
    disposizioni relative alle importazioni, nella Comunità, di prodotti lattiero-caseari
    originari degli Stati dell'Africa, dei Caraibi e del Pacifico (ACP) o dei paesi
    e territori d'oltremare (PTOM), ai fini dell'attuazione dell'accordo agricolo
    concluso nel quadro dell'Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1480/98 van de Commissie van 10 juli 1998 waarbij,
    bij wijze van overgangsmaatregel ter uitvoering van de Overeenkomst inzake de
    landbouw in het kader van de Uruguay-ronde, Verordening (EEG) nr. 1150/90 wordt
    gewijzigd ten aanzien van sommige bepalingen voor de invoer van melk en zuivelproducten,
    van oorsprong uit de staten in Afrika, het Caribische gebied en de Stille Oceaan
    (ACS-staten) of uit de landen en gebieden overzee (LGO)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1480/98 da Comissão de 10 de Julho de 1998 que altera
