    vid import till gemenskapen av vissa produkter inom mjölksektorn med ursprung
    i staterna i Afrika, Karibien och Stilla havet (AVS) eller i de utomeuropeiska
    länderna och territorierna (ULT) inför genomförandet av det jordbruksavtal
    som slutits inom ramen för förhandlingarna i Uruguayrundan
