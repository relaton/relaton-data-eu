    certas disposições relativas às importações para a Comunidade de determinados
    produtos lácteos originários dos Estados de África, das Caraíbas e do Pacífico
    (ACP) ou de países e territórios ultramarinos (PTU), com vista à execução
    do acordo sobre a agricultura concluído no âmbito das negociações do «Uruguay
    Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1480/98 de la Comisión de 10 de julio de 1998 por
    el que se modifica el Reglamento (CEE) nº 1150/90 en lo referente a la adaptación
    transitoria de algunas disposiciones aplicables a las importaciones en la Comunidad
    de ciertos productos lácteos procedentes de los Estados de África, del Caribe
    y del Pacífico (ACP) o de los países y territorios de Ultramar (PTU) con vistas
    a la aplicación del Acuerdo agrícola celebrado en el marco de las negociaciones
    de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1480/98 av den 10 juli 1998 om ändring
