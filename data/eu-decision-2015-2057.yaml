  script: Latn
  content: Decisión de Ejecución (UE) 2015/2057 de la Comisión, de 13 de noviembre
    de 2015, por la que se amplía el período de aplicación de la Decisión de Ejecución
    2013/413/UE de la Comisión, por la que se autoriza a los Estados miembros a conceder
    excepciones a determinadas disposiciones de la Directiva 2000/29/CE del Consejo
    en relación con las patatas originarias de las regiones de Akkar y Bekaa del
    Líbano que no sean patatas de siembra [notificada con el número C(2015) 7793]
  type: main
