    за прилагане на Решение за изпълнение 2013/413/ЕС,
    с което на държавите членки се разрешава да
    предвидят дерогации от някои разпоредби на
    Директива 2000/29/ЕО по отношение на картофи, с
    изключение на картофи, предназначени за засаждане,
    с произход от регионите Akkar и Bekaa в Ливан (нотифицирано
    под номер С(2015) 7793)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/2057 ze dne 13. listopadu 2015,
    kterým se prodlužuje doba použitelnosti prováděcího rozhodnutí 2013/413/EU,
    kterým se členským státům povoluje stanovit odchylky od některých ustanovení
    směrnice Rady 2000/29/ES, pokud jde o brambory pocházející z libanonských
    regionů Akkar a Bekaa, s výjimkou brambor určených k výsadbě (oznámeno
    pod číslem C(2015) 7793)
  type: main
