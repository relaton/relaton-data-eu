    számára a Libanon Akkar és Bekaa régiójából származó, nem vetőburgonyának
    szánt burgonya tekintetében történő engedélyezéséről szóló 2013/413/EU
    végrehajtási határozat alkalmazási időszakának meghosszabbításáról (az
    értesítés a C(2015) 7793. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/2057 della Commissione, del 13 novembre
    2015, che proroga il periodo di applicazione della decisione di esecuzione 2013/413/UE
    che autorizza gli Stati membri a prevedere deroghe ad alcune disposizioni della
    direttiva 2000/29/CE del Consiglio in relazione alle patate non destinate alla
    piantagione originarie delle regioni di Akkar e Bekaa in Libano [notificata con
    il numero C(2015) 7793]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/2057 (2015. gada 13. novembris),
    ar kuru pagarina Īstenošanas lēmuma 2013/413/ES, ar ko dalībvalstīm atļauj
    noteikt atkāpes no dažiem Padomes Direktīvas 2000/29/EK noteikumiem attiecībā
    uz kartupeļiem, kuri nav paredzēti stādīšanai un kuru izcelsme ir Akaras
    un Bekaa reģionos Libānā, piemērošanas periodu (izziņots ar dokumenta numuru
    C(2015) 7793)
  type: main
