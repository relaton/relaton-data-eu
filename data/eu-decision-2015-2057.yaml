    que autoriza os Estados-Membros a prever derrogações de certas disposições
    da Diretiva 2000/29/CE do Conselho relativamente às batatas, com exceção das
    batatas destinadas à plantação, originárias das regiões de Akkar e Bekaa,
    no Líbano [notificada com o número C(2015) 7793]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/2057 a Comisiei din 13 noiembrie
    2015 de prelungire a perioadei de aplicare a Deciziei de punere în aplicare 2013/413/UE
    de autorizare a statelor membre să prevadă derogări de la anumite dispoziții
    ale Directivei 2000/29/CE a Consiliului în ceea ce privește cartofii, alții
    decât cartofii destinați plantării, originari din regiunile Akkar și Bekaa
    din Liban [notificată cu numărul C(2015) 7793]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/2057 z 13. novembra 2015 o
    predĺžení obdobia uplatňovania vykonávacieho rozhodnutia 2013/413/EÚ, ktorým
    sa členským štátom udeľuje oprávnenie poskytovať výnimky z určitých
    ustanovení smernice Rady 2000/29/ES, pokiaľ ide o zemiaky pochádzajúce z regiónov
