  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/2057 оd 13. studenoga 2015. o produljenju
    razdoblja primjene Provedbene odluke 2013/413/EU kojom se države članice ovlašćuju
    da odobre izuzeća od određenih odredbi Direktive Vijeća 2000/29/EZ u odnosu
    na krumpire, osim za krumpire namijenjene sadnji, a koji potječu iz regija Akkar
    i Bekaa u Libanonu (priopćeno pod brojem dokumenta C(2015) 7793)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/2057 végrehajtási határozata (2015. november
