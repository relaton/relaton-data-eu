title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/2057 of 13 November 2015 extending
    the period of application of Implementing Decision 2013/413/EU authorising Member
    States to provide for derogations from certain provisions of Council Directive
    2000/29/EC in respect of potatoes, other than potatoes intended for planting,
    originating in the regions of Akkar and Bekaa of Lebanon (notified under document
    C(2015) 7793)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/2057 de la Commission du 13 novembre 2015
    prolongeant la période d'application de la décision d'exécution 2013/413/UE
    autorisant les États membres à prévoir des dérogations à certaines dispositions
    de la directive 2000/29/CE du Conseil en ce qui concerne les pommes de terre,
    autres que les pommes de terre destinées à la plantation, originaires des régions
    de l'Akkar et de la Bekaa, au Liban [notifiée sous le numéro C(2015) 7793]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/2057 der Kommission vom 13. November
    2015 über die Verlängerung des Geltungszeitraums des Durchführungsbeschlusses
    2013/413/EU zur Ermächtigung der Mitgliedstaaten, für nicht als Pflanzgut bestimmte
    Kartoffeln/Erdäpfel mit Ursprung in den libanesischen Regionen Akkar und Bekaa
    Ausnahmen von einigen Vorschriften der Richtlinie 2000/29/EG des Rates zuzulassen
    (Bekanntgegeben unter Aktenzeichen C(2015) 7793)
  type: main
- language: bg
  script: Cyrl
