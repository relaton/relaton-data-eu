    pod číslom C(2015) 7793]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2015/2057 z dne 13. novembra 2015 o podaljšanju
    obdobja uporabe Izvedbenega sklepa 2013/413/EU o dovoljenju državam članicam,
    da določijo odstopanja od nekaterih določb Direktive Sveta 2000/29/ES v zvezi
    s krompirjem, ki ni namenjen saditvi, s poreklom iz regij Akkar in Bekaa v Libanonu
