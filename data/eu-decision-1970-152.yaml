title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 6 février 1970, autorisant la République
    italienne à exclure du traitement communautaire les moûts de raisins de la position
    Ex 20.07 du Tarif douanier commun, originaires d'Algérie et mis en libre pratique
    en France
  type: main
- language: de
  script: Latn
  content: '70/152/EWG: Entscheidung der Kommission vom 6. Februar 1970, mit der die
    Italienische Republik ermächtigt wird, die aus Algerien stammenden und in Frankreich
    im freien Verkehr befindlichen Traubensäfte der Tarifnummer ex 20.07 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/152/CEE: Decisione della Commissione, del 6 febbraio 1970, con cui
    si autorizza la Repubblica italiana ad escludere dal trattamento comunitario i
    mosti di vino della voce ex 20.07 della tariffa doganale comune, originari dell''Algeria
    e messi in libera pratica in Francia'
  type: main
- language: nl
  script: Latn
  content: '70/152/EEG: Beschikking van de Commissie van 6 februari 1970 waarbij de
    Italiaanse Republiek wordt gemachtigd druivenmost van post ex 20.07 van het gemeenschappelijk
    douanetarief, van oorsprong uit Algerije en in Frankrijk in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten'
  type: main
