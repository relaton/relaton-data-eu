title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3780/85 of 31 December 1985 establishing, for
    1986, certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of Portugal in waters falling under the
    sovereignty or within the jurisdiction of other Member States, apart from Spain
    and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3780/85 du Conseil du 31 décembre 1985 fixant, pour
    1986, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon du Portugal dans les eaux relevant de
    la souveraineté ou de la juridiction des États membres, à l' exception de l'
    Espagne et du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3780/85 des Rates vom 31. Dezember 1985 zur Festsetzung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für Schiffe unter portugiesischer Flagge in den Gewässern unter der Hoheitsgewalt
    oder der Gerichtsbarkeit der Mitgliedstaaten mit Ausnahme von Spanien und Portugal
    für 1986
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3780/85 af 31. december 1985 om fastsættelse
    for 1986 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører portugisisk flag, i de farvande,
    der henhører under medlemsstaternes højhedsområde eller jurisdiktion, med undtagelse
    af spanske og portugisiske farvande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3780/85 του Συμβουλίου
    της 31ης Δεκεμβρίου 1985 για τον καθορισμό, για
    το 1986, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται για
    τα σκάφη με πορτογαλική σημαία, στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    των κρατών μελών, εκτός της Ισπανίας και της
    Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3780/85 del Consiglio del 31 dicembre 1985 che fissa,
    per il 1986, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera del Portogallo nelle acque soggette alla
    sovranità o alla giurisdizione degli stati membri, esclusi la Spagna e il Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3780/85 van de Raad van 31 december 1985 tot vaststelling,
    voor 1986, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op vaartuigen welke de vlag van Portugal
    voeren, in de wateren die onder de soevereiniteit of de jurisdictie van de Lid-Staten,
    met uitzondering van Spanje en Portugal, vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3780/85 do Conselho, de 31 de Dezembro de 1985,
    que fixa, para 1986, certas medidas de conservação e de gestão dos recursos
    da pesca, aplicáveis aos navios que arvoram pavilhão de Portugal nas águas
    sob soberania ou jurisdição dos Estados-membros, com excepção de Espanha e
    de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3780/85 del Consejo, de 31 de diciembre de 1985, por
    el que se fijan, para 1986, determinadas medidas de conservación y de gestión
    de los recursos de pesca aplicables a los buques que enarbolen pabellón de Portugal
    en las aguas dependientes de la soberanía o de la jurisdicción de los Estados
    miembros, excepto España y Portugal
  type: main
