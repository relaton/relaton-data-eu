  content: Décision de la Commission, du 30 novembre 1971, portant publication de
    la version actuelle de l'annexe du règlement (CEE) n° 109/70 du Conseil aux
    importations de pays à commerce d'état
  type: main
- language: de
  script: Latn
  content: '71/395/EWG: Beschluß der Kommission vom 30. November 1971 zur Bekanntmachung
    der geltenden Fassung des Anhangs der Verordnung (EWG) Nr. 109/70 des Rates vom
    19. Dezember 1969 zur Festlegung einer gemeinsamen Regelung für die Einfuhr aus
    Staatshandelsländern'
  type: main
- language: it
  script: Latn
  content: '71/395/CEE: Decisione della Commissione, del 30 novembre 1971, recante
    pubblicazione della versione attuale dell''allegato al regolamento (CEE) n. 109/70
    del Consiglio, del 19 dicembre 1969, che istituisce un regime comune applicabile
    alle importazioni dai paesi a commercio di Stato'
  type: main
- language: nl
  script: Latn
  content: '71/395/EEG: Besluit van de Commissie van 30 november 1971 houdende bekendmaking
    van de geldige versie van de bijlage bij Verordening (EEG) nr. 109/70 van de Raad
    van 19 december 1969 houdende totstandbrenging van een gemeenschappelijke regeling
    voor de invoer uit landen met staatshandel'
