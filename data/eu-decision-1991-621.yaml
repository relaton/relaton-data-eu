title:
- language: en
  script: Latn
  content: '91/621/EEC: Commission Decision of 15 November 1991 amending Decision
    91/409/EEC authorizing Member States to permit temporarily the marketing of forest
    reproductive material not satisfying the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '91/621/CEE: Décision de la Commission du 15 novembre 1991 modifiant la
    décision 91/409/CEE autorisant les États membres à admettre temporairement
    la commercialisation de matériels forestiers de reproduction ne répondant pas
    aux exigences de la directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 15. November 1991 zur Änderung der Entscheidung
    91/409/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut
    zum Verkehr zuzulassen, das den Anforderungen der Richtlinie 66/404/EWG des Rates
    nicht entspricht (91/621/EWG) #'
  type: main
- language: da
  script: Latn
  content: '91/621/EØF: Kommissionens beslutning af 15. november 1991 om ændring
    af beslutning 91/409/EØF om bemyndigelse af medlemsstaterne til midlertidigt
    at tillade handel med forstligt formeringsmateriale, der ikke opfylder kravene
    i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '91/621/ΕΟΚ: Απόφαση της Επιτροπής της 15ης
    Νοεμβρίου 1991 που τροποποιεί την απόφαση 91/409/ΕΟΚ
    που δίνει την άδεια στα κράτη μέλη να επιτρέπουν
    προσωρινά την εμπορία δασικού πολλαπλασιαστικού
    υλικού το οποίο δεν ανταποκρίνεται στις απαιτήσεις
    της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 15 novembre 1991 che modifica la decisione
    91/409/CEE che autorizza gli Stati membri ad ammettere temporaneamente la commercializzazione
    di materiali forestali di moltiplicazione non rispondenti ai requisiti prescritti
    dalla direttiva 66/404/CEE del Consiglio (91/621/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 15 november 1991 tot wijziging van Beschikking
    91/409/EEG houdende machtiging van de Lid-Staten om bosbouwkundig teeltmateriaal
    dat niet aan de eisen van Richtlijn 66/404/EEG van de Raad voldoet, tijdelijk
    tot de handel toe te laten (91/621/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 15 de Novembro de 1991 que altera a Decisão
    91/409/CEE, que autoriza os Estados-membros a admitir temporariamente a comercialização
    de materiais florestais de reprodução que não satisfazem as exigências da
    Directiva 66/404/CEE do Conselho (91/621/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 15 de noviembre de 1991 por la que se modifica
    la Decisión 91/409/CEE por la que se autoriza a los Estados miembros a admitir
    temporalmente la comercialización de materiales forestales de reproducción que
    no se ajusten a las exigencias de la Directiva 66/404/CEE del Consejo (91/621/CEE)
    #'
