  content: Décision de la Commission, du 10 avril 1963, portant prorogation et nouvelle
    modification de sa décision du 5 juillet 1962, autorisant la perception d'une
    taxe compensatoire sur les importations, en République fédérale d'Allemagne,
    de biscuits et de gaufres en provenance du Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '63/279/EWG: Entscheidung der Kommission vom 10. April 1963 zur Verlängerung
    und erneuten Änderung ihrer Entscheidung vom 5. Juli 1962 über die Erhebung
    einer Ausgleichsabgabe bei der Einfuhr von Waffeln und Keksen aus dem Königreich
    der Niederlande in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '63/279/CEE: Decisione della Commissione del 10 aprile 1963 recante proroga
    e nuova modifica della propria decisione del 5 luglio 1962, relativa alla autorizzazione
    a riscuotere una tassa di compensazione sulle importazioni, nella Repubblica federale
    di Germania, di biscotti e cialde in provenienza dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '63/279/EEG: Beschikking van de Commissie van 10 april 1963 houdende verlenging
    en nadere wijziging van haar beschikking van 5 juli 1962, betreffende de toepassing
    van een compenserende heffing bij invoer in de Bondsrepubliek Duitsland van biscuits
    en wafels uit het Koninkrijk der Nederlanden'
  type: main
