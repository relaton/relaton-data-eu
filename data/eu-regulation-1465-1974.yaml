- language: en
  script: Latn
  content: Regulation (EEC) No 1465/74 of the Commission of 12 June 1974 amending
    Regulation (EEC) No 3499/73 authorizing the United Kingdom to suspend temporarily
    customs duties on some flax and flaxtow imported from other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1465/74 de la Commission du 12 juin 1974 modifiant
    le règlement (CEE) n° 3499/73 autorisant le Royaume-Uni à suspendre temporairement
    les droits de douane applicables à certains lins et étoupes de lin importés
    en provenance d'autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1465/74 der Kommission vom 12. Juni 1974 zur Änderung
    der Verordnung (EWG) Nr. 3499/73 zur Ermächtigung des Vereinigten Königreichs,
    die Zollsätze für bestimmten Flachs und Flachswerg bei der Einfuhr aus anderen
    Mitgliedstaaten vorübergehend auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1465/74 af 12. juni 1974 om ændring
    af forordning (EØF) nr. 3499/73 om bemyndigelse af Det forenede Kongerige til
    en foreløbig suspension for bestemte slags hør og blår ved import fra andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1465/74 della Commissione, del 12 giugno 1974, che
    modifica il regolamento (CEE) n. 3499/73 che autorizza il Regno Unito a sospendere
    temporaneamente i dazi doganali applicabili ad alcuni tipi di lino e stoppa di
    lino importati in provenienza dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1465/74 van de Commissie van 12 juni 1974 tot wijziging
    van Verordening (EEG) nr. 3499/73 waarbij het Verenigd Koninkrijk wordt gemachtigd
    de douanerechten van toepassing op bepaalde soorten vlas en vlaswerk die uit de
    andere Lid-Staten worden ingevoerd tijdelijk te schorsen
