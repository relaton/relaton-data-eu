title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/2769 of 30 May 2024 supplementing
    Regulation (EU) No 305/2011 of the European Parliament and of the Council by laying
    down the applicable systems to assess and verify constancy of performance of construction
    products in relation to the essential characteristics on environmental sustainability
    and amending that Regulation as regards the assessment and verification of constancy
    of performance of construction products based on a modelling approach
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/2769 de la Commission du 30 mai 2024 complétant
    le règlement (UE) no 305/2011 du Parlement européen et du Conseil en établissant
    les systèmes applicables pour évaluer et vérifier la constance des performances
    des produits de construction en ce qui concerne les caractéristiques essentielles
    de durabilité environnementale et modifiant ledit règlement en ce qui concerne
    l’évaluation et la vérification de la constance des performances des produits
    de construction sur la base d’une approche de modélisation
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/2769 der Kommission vom 30. Mai 2024 zur
    Ergänzung der Verordnung (EU) Nr. 305/2011 des Europäischen Parlaments und des
    Rates durch Festlegung der anzuwendenden Systeme zur Bewertung und Überprüfung
    der Leistungsbeständigkeit von Bauprodukten in Bezug auf die Wesentlichen Merkmale
    im Zusammenhang mit der ökologischen Nachhaltigkeit und zur Änderung der genannten
    Verordnung in Bezug auf die Bewertung und Überprüfung der Leistungsbeständigkeit
    von Bauprodukten auf der Grundlage eines Modellierungsansatzes
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/2769 на Комисията
    от 30 май 2024 година за допълнение на Регламент
    (ЕС) № 305/2011 на Европейския парламент и на Съвета
    чрез определяне на приложимите системи за
    оценяване и проверка на постоянството на експлоатационните
    показатели на строителните продукти във връзка
    с основните характеристики по отношение на
    екологичната устойчивост и за изменение на
    посочения регламент по отношение на оценяването
    и проверката на постоянството на експлоатационните
    показатели на строителните продукти въз основа
    на подход на моделиране
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/2769 ze dne 30. května
    2024, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    305/2011 stanovením použitelných systémů pro posuzování a ověřování
    stálosti vlastností stavebních výrobků ve vztahu k základním charakteristikám
    souvisejícím s environmentální udržitelností a kterým se uvedené nařízení
    mění, pokud jde o posuzování a ověřování stálosti vlastností stavebních
    výrobků na základě modelovacího přístupu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/2769 af 30. maj 2024 om supplerende
    regler til Europa-Parlamentets og Rådets forordning (EU) nr. 305/2011 for så
    vidt angår fastlæggelse af de gældende systemer til vurdering og kontrol af
    konstansen af byggevarers ydeevne med hensyn til de væsentlige egenskaber vedrørende
    miljømæssig bæredygtighed og om ændring af nævnte forordning for så vidt
    angår vurdering og kontrol af konstansen af byggevarers ydeevne på grundlag
    af en modelmetode
  type: main
- language: el
  script: Grek
