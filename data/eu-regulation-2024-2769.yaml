    2024, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 305/2011 täydentämisestä
    vahvistamalla sovellettavat järjestelmät rakennustuotteiden suoritustason pysyvyyden
    arvioimiseksi ja varmentamiseksi ympäristökestävyyttä koskevien perusominaisuuksien
    osalta ja kyseisen asetuksen muuttamisesta siltä osin kuin on kyse rakennustuotteiden
    suoritustason pysyvyyden arvioinnista ja varmentamisesta mallintamisen avulla
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2024/2769 ón gCoimisiún an 30 Bealtaine 2024
    lena bhforlíontar Rialachán (AE) Uimh. 305/2011 ó Pharlaimint na hEorpa agus
    ón gComhairle trí na córais is infheidhme a leagan síos chun seasmhacht feidhmíochta
    táirgí foirgníochta a mheasúnú agus a fhíorú i ndáil leis na saintréithe
    sár-riachtanacha maidir le hinbhuanaitheacht chomhshaoil agus lena leasaítear
    an Rialachán sin a mhéid a bhaineann le seasmhacht feidhmíochta táirgí foirgníochta
    a mheasúnú agus a fhíorú bunaithe ar chur chuige samhaltaithe
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/2769 оd 30. svibnja 2024. o dopuni
    Uredbe (EU) br. 305/2011 Europskog parlamenta i Vijeća utvrđivanjem sustavâ
    ocjenjivanja i provjere stalnosti svojstava građevnih proizvoda koji se primjenjuju
    na bitne značajke okolišne održivosti i o izmjeni te uredbe u pogledu ocjenjivanja
    i provjere stalnosti svojstava građevnih proizvoda na temelju pristupa modeliranja
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/2769 felhatalmazáson alapuló rendelete (2024.
    május 30.) a 305/2011/EU európai parlamenti és tanácsi rendeletnek az építési
    termékek teljesítménye állandóságának a környezeti fenntarthatóságra
    vonatkozó alapvető jellemzők tekintetében történő értékelésére és
    ellenőrzésére alkalmazandó rendszerek meghatározása tekintetében történő
    kiegészítéséről, valamint az említett rendeletnek az építési termékek
    teljesítménye állandóságának modellalapú megközelítésen alapuló értékelése
    és ellenőrzése tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2024/2769 della Commissione, del 30 maggio 2024,
    che integra il regolamento (UE) n. 305/2011 del Parlamento europeo e del Consiglio
    stabilendo i sistemi applicabili per valutare e verificare la costanza della prestazione
    dei prodotti da costruzione in relazione alle caratteristiche essenziali riguardanti
    la sostenibilità ambientale e che modifica tale regolamento per quanto riguarda
    la valutazione e la verifica della costanza della prestazione dei prodotti da
    costruzione in base a un approccio di modellizzazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2024/2769 (2024. gada 30. maijs), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 305/2011 papildina, nosakot piemērojamās
    sistēmas būvizstrādājumu ekspluatācijas īpašību noturības novērtēšanai
    un pārbaudei attiecībā uz būtiskajiem raksturlielumiem, kas attiecas uz vidisko
    ilgtspēju, un minēto regulu groza attiecībā uz būvizstrādājumu ekspluatācijas
    īpašību noturības novērtēšanu un pārbaudi, kas balstītas modelēšanas
    pieejā
  type: main
- language: lt
  script: Latn
  content: 2024 m. gegužės 30 d. Komisijos deleguotasis reglamentas (ES) 2024/2769,
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 305/2011 papildomas
    nustatant statybos produktų eksploatacinių savybių pastovumo vertinimo ir tikrinimo
    sistemas, susijusias su aplinkos tvarumui poveikio turinčiomis esminėmis charakteristikomis,
    ir iš dalies keičiamos to reglamento nuostatos dėl statybos produktų eksploatacinių
    savybių pastovumo vertinimo ir tikrinimo remiantis modeliavimo metodu
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2024/2769 tat-30 ta’ Mejju 2024
    li jissupplimenta r-Regolament (UE) Nru 305/2011 tal-Parlament Ewropew u tal-Kunsill
    billi jistabbilixxi s-sistemi applikabbli għall-valutazzjoni u l-verifika tal-kostanza
    tal-prestazzjoni tal-prodotti għall-kostruzzjoni fir-rigward tal-karatteristiċi
    essenzjali dwar is-sostenibbiltà ambjentali u li jemenda dak ir-Regolament fir-rigward
    tal-valutazzjoni u l-verifika tal-kostanza tal-prestazzjoni tal-prodotti għall-kostruzzjoni
    abbażi ta’ approċċ ta’ mmudellar
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2024/2769 van de Commissie van 30 mei 2024
    tot aanvulling van Verordening (EU) nr. 305/2011 van het Europees Parlement en
    de Raad door de vaststelling van de toepasselijke systemen voor de beoordeling
    en verificatie van de prestatiebestendigheid van bouwproducten met betrekking
    tot de essentiële kenmerken van milieuduurzaamheid en tot wijziging van die verordening
    wat betreft de beoordeling en verificatie van de prestatiebestendigheid van bouwproducten
    op basis van een modelleringsbenadering
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2024/2769 z dnia 30 maja 2024 r.
    uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 305/2011
    przez ustanowienie systemów oceny i weryfikacji stałości właściwości użytkowych
    wyrobów budowlanych mających zastosowanie w odniesieniu do zasadniczych charakterystyk
    dotyczących zrównoważenia środowiskowego oraz zmieniające to rozporządzenie
    w odniesieniu do oceny i weryfikacji stałości właściwości użytkowych wyrobów
    budowlanych w oparciu o podejście modelowe
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2024/2769 da Comissão, de 30 de maio de 2024,
    que complementa o Regulamento (UE) n.o 305/2011 do Parlamento Europeu e do Conselho,
    estabelecendo os sistemas aplicáveis para avaliar e verificar a regularidade
    do desempenho dos produtos de construção em relação às características essenciais
    relativas à sustentabilidade ambiental, e que altera o referido regulamento no
    que respeita à avaliação e verificação da regularidade do desempenho dos
    produtos de construção com base numa abordagem de modelização
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2024/2769 al Comisiei din 30 mai 2024 de completare
    a Regulamentului (UE) nr. 305/2011 al Parlamentului European și al Consiliului
    prin stabilirea sistemelor aplicabile pentru evaluarea și verificarea constanței
    performanței produselor pentru construcții în ceea ce privește caracteristicile
    esențiale legate de sustenabilitatea din punctul de vedere al mediului și de
    modificare a regulamentului respectiv în ceea ce privește evaluarea și verificarea
    constanței performanței produselor pentru construcții pe baza unei abordări
    de modelare
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2024/2769 z 30. mája 2024, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 305/2011 stanovením
    uplatniteľných systémov posudzovania a overovania nemennosti parametrov stavebných
    výrobkov z hľadiska podstatných vlastností súvisiacich s environmentálnou
    udržateľnosťou a zmenou uvedeného nariadenia, pokiaľ ide o posudzovanie a
    overovanie nemennosti parametrov stavebných výrobkov na základe prístupu modelovania
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/2769 z dne 30. maja 2024 o dopolnitvi
    Uredbe (EU) št. 305/2011 z določitvijo veljavnih sistemov ocenjevanja in preverjanja
    nespremenljivosti lastnosti gradbenih proizvodov glede bistvenih značilnosti
    v zvezi z okoljsko trajnostnostjo ter spremembi navedene uredbe v zvezi z ocenjevanjem
    in preverjanjem nespremenljivosti lastnosti gradbenih proizvodov na podlagi pristopa
    modeliranja
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2024/2769 de la Comisión, de 30 de mayo de 2024,
    por el que se completa el Reglamento (UE) n.o 305/2011 del Parlamento Europeo
    y del Consejo mediante el establecimiento de los sistemas aplicables de evaluación
    y verificación de la constancia de las prestaciones de los productos de construcción
    en relación con las características esenciales en materia de sostenibilidad
    medioambiental y por el que se modifica dicho Reglamento en lo que respecta a
    la evaluación y verificación de la constancia de las prestaciones de los productos
    de construcción sobre la base de un enfoque de modelización
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2024/2769 av den 30 maj 2024
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 305/2011
    genom fastställande av tillämpliga system för bedömning och fortlöpande kontroll
    av byggprodukters prestanda i förhållande till de väsentliga egenskaperna för
    miljömässig hållbarhet och om ändring av den förordningen vad gäller bedömning
    och fortlöpande kontroll av byggprodukters prestanda på grundval av en modelleringsmetod
  type: main
