title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 7/2012 of 5 January 2012 amending
    Council Regulation (EC) No 1183/2005 imposing certain specific restrictive measures
    directed against persons acting in violation of the arms embargo with regard to
    the Democratic Republic of the Congo
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 7/2012 de la Commission du 5 janvier
    2012 modifiant le règlement (CE) n ° 1183/2005 du Conseil instituant certaines
    mesures restrictives spécifiques à l’encontre des personnes agissant en violation
    de l’embargo sur les armes imposé à la République démocratique du Congo
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 7/2012 der Kommission vom 5. Januar 2012
    zur Änderung der Verordnung (EG) Nr. 1183/2005 des Rates über die Anwendung
    spezifischer restriktiver Maßnahmen gegen Personen, die gegen das Waffenembargo
    betreffend die Demokratische Republik Kongo verstoßen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 7/2012 на Комисията
    от 5 януари 2012 година за изменение на Регламент
    (ЕО) № 1183/2005 на Съвета за налагане на някои специфични
    ограничителни мерки, насочени срещу лица, нарушаващи
    оръжейното ембарго по отношение на Демократична
    република Конго
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 7/2012 ze dne 5. ledna 2012 ,
    kterým se mění nařízení Rady (ES) č. 1183/2005, kterým se ukládají některá
    zvláštní omezující opatření namířená proti osobám, které porušují
    zbrojní embargo vůči Konžské demokratické republice
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 7/2012 af 5. januar 2012
    om ændring af Rådets forordning (EF) nr. 1183/2005 om indførelse af visse specifikke
    restriktive foranstaltninger mod personer, der bryder våbenembargoen over for
    Den Demokratiske Republik Congo
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 7/2012 της
    Επιτροπής, της 5ης Ιανουάριου 2012 , σχετικά με
    την τροποποίηση του κανονισμού (ΕΚ) αριθ. 1183/2005
    του Συμβουλίου για την επιβολή συγκεκριμένων
    περιοριστικών μέτρων κατά των προσώπων που
    παραβιάζουν το εμπάργκο όπλων έναντι της Λαϊκής
    Δημοκρατίας του Κονγκό
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 7/2012, 5. jaanuar 2012 , millega muudetakse
    nõukogu määrust (EÜ) nr 1183/2005, millega kehtestatakse Kongo Demokraatliku
    Vabariigi suhtes kehtestatud relvaembargot rikkuvate isikute vastu suunatud teatud
    eripiirangud
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 7/2012, annettu 5 päivänä
    tammikuuta 2012 , tiettyjen rajoittavien erityistoimenpiteiden käyttöönotosta
    Kongon demokraattista tasavaltaa koskevaa aseidenvientikieltoa rikkovia henkilöitä
    vastaan annetun neuvoston asetuksen (EY) N:o 1183/2005 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 7/2012 od 5. siječnja 2012. o izmjeni
    Uredbe Vijeća (EZ) br. 1183/2005 o uvođenju određenih posebnih mjera ograničavanja
    protiv osoba koje krše embargo na oružje u odnosu na Demokratsku Republiku Kongo
  type: main
- language: hu
  script: Latn
  content: A Bizottság 7/2012/EU végrehajtási rendelete ( 2012. január 5. ) a
    Kongói Demokratikus Köztársaság tekintetében a fegyverembargót megsértő
    személyekkel szemben meghatározott, egyedi korlátozó intézkedések bevezetéséről
    szóló 1183/2005/EK tanácsi rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 7/2012 della Commissione, del 5 gennaio
    2012 , recante modifica del regolamento (CE) n. 1183/2005 del Consiglio che istituisce
    misure restrittive specifiche nei confronti delle persone che violano l’embargo
    sulle armi per quanto riguarda la Repubblica democratica del Congo
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 7/2012 ( 2012. gada 5. janvāris
    ), ar kuru groza Padomes Regulu (EK) Nr. 1183/2005, ar ko nosaka dažus īpašus
    ierobežojošus pasākumus, kas vērsti pret personām, kuras pārkāpj ieroču
    embargo attiecībā uz Kongo Demokrātisko Republiku
  type: main
- language: lt
  script: Latn
  content: 2012 m. sausio 5 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 7/2012,
    kuriuo iš dalies keičiamas Tarybos reglamentas (EB) Nr. 1183/2005, nustatantis
    tam tikras konkrečias ribojančias priemones asmenims, kurie savo veiksmais pažeidžia
    ginklų embargą Kongo Demokratinei Respublikai
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 7/2012 tal-
    5 ta’ Jannar 2012 li jemenda r-Regolament tal-Kunsill (KE) Nru 1183/2005 li
    jimponi ċerti miżuri speċifiċi restrittivi diretti kontra persuni li jaġixxu
    bi ksur għall-embargo tal-armi fir-rigward tar-Repubblika Demokratika tal-Kongo
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 7/2012 van de Commissie van 5 januari 2012
    tot wijziging van Verordening (EG) nr. 1183/2005 van de Raad tot vaststelling
    van bepaalde specifieke beperkende maatregelen tegen bepaalde personen die handelen
    in strijd met het wapenembargo tegen de Democratische Republiek Congo
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 7/2012 z dnia 5 stycznia 2012
    r. zmieniające rozporządzenie Rady (WE) nr 1183/2005 wprowadzające niektóre
    szczególne środki ograniczające skierowane przeciwko osobom naruszającym embargo
    na broń w odniesieniu do Demokratycznej Republiki Konga
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 7/2012 da Comissão, de 5 de janeiro
    de 2012 , que altera o Regulamento (CE) n. ° 1183/2005 do Conselho que institui
    certas medidas restritivas específicas contra as pessoas que atuem em violação
    do embargo ao armamento imposto à República Democrática do Congo
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 7/2012 al Comisiei din 5 ianuarie
    2012 de modificare a Regulamentului (CE) nr. 1183/2005 al Consiliului de instituire
    a anumitor măsuri speciale împotriva persoanelor ale căror acțiuni încalcă
    embargoul asupra armelor impus Republicii Democratice Congo
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 7/2012 z 5. januára 2012 , ktorým
    sa mení a dopĺňa nariadenie Rady (ES) č. 1183/2005, ktorým sa zavádzajú
    určité osobitné reštriktívne opatrenia namierené proti osobám, ktoré porušujú
    zbrojné embargo voči Konžskej demokratickej republike
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 7/2012 z dne 5. januarja 2012 o spremembi
    Uredbe Sveta (ES) št. 1183/2005 o uvedbi določenih posebnih omejevalnih ukrepov
    za osebe, ki kršijo embargo na orožje glede Demokratične republike Kongo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 7/2012 de la Comisión, de 5 de enero
    de 2012 , que modifica el Reglamento (CE) n ° 1183/2005 del Consejo, por el que
    se imponen medidas restrictivas específicas dirigidas contra personas que incurren
    en violación del embargo de armas en relación con la República Democrática
    del Congo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 7/2012 av den 5 januari
    2012 om ändring av rådets förordning (EG) nr 1183/2005 om införande av vissa
    särskilda restriktiva åtgärder mot personer som bryter vapenembargot mot Demokratiska
    republiken Kongo
  type: main
