title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 175/2010 of 2 March 2010 implementing Council
    Directive 2006/88/EC as regards measures to control increased mortality in oysters
    of the species Crassostrea gigas in connection with the detection of Ostreid herpesvirus
    1 μvar (OsHV-1 μvar)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 175/2010 de la Commission du 2 mars 2010 portant application
    de la directive 2006/88/CE du Conseil en ce qui concerne des mesures de lutte
    contre la surmortalité des huîtres de l'espèce Crassostrea gigas associée
    à la détection de l'herpès virus de l’huître 1 μvar (OsHV-1 μvar)
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 175/2010 der Kommission vom 2. März 2010 zur Durchführung
    der Richtlinie 2006/88/EG des Rates hinsichtlich Maßnahmen zur Überwachung der
    erhöhten Mortalität bei Austern der Art Crassostrea gigas im Zusammenhang mit
    der Entdeckung des Ostreiden Herpesvirus 1 μvar (OsHV-1 μvar)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 175/2010 на Комисията от 2 март
    2010 година за прилагане на Директива 2006/88/ЕО
    на Съвета по отношение на мерките за борба
    с повишената смъртност при стридите от вида
    Crassostrea gigas във връзка с откриването на Ostreid herpesvirus
    1 μvar (OsHV-1 μvar)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 175/2010 ze dne 2. března 2010 , kterým se
    provádí směrnice Rady 2006/88/ES, pokud jde o opatření pro omezení zvýšeného
    úhynu ústřic druhu Crassostrea gigas v souvislosti se zjištěním nákazy
    Ostreid herpesvirus 1 μvar (OsHV-1 μvar)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 175/2010 af 2. marts 2010 om gennemførelse
    af Rådets direktiv 2006/88/EF for så vidt angår foranstaltninger til bekæmpelse
    af øget dødelighed hos østers af arten Crassostrea gigas i tilfælde af påvisning
    af ostreid herpesvirus 1 μvar (OsHV-1 μvar)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 175/2010 της Επιτροπής,
    της 2ας Μαρτίου 2010 , για την εφαρμογή της οδηγίας
    2006/88/ΕΚ του Συμβουλίου όσον αφορά τα μέτρα για
    τον περιορισμό της αυξημένης θνησιμότητας
    στα στρείδια του είδους Crassostrea gigas σε συνδυασμό
    με την ανίχνευση του ερπητοϊού των στρειδιών
    1 μvar (OsHV-1 μvar)
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 175/2010, 2. märts 2010 , millega rakendatakse
    nõukogu direktiivi 2006/88/EÜ seoses suurte hiidaustrite ( Crassostrea gigas)
    suurenenud suremuse tõrjeks võetavate meetmetega ja austrite herpesviiruse 1
    μvar (OsHV-1 μvar) avastamisega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 175/2010, annettu 2 päivänä maaliskuuta 2010
    , neuvoston direktiivin 2006/88/EY täytäntöönpanemisesta Crassostrea gigas
    -lajin ostereiden lisääntyneen kuolleisuuden torjuntatoimenpiteiden osalta ostereiden
    herpesviruksen 1 μvar (OsHV-1 μvar) toteamisen yhteydessä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 175/2010/EU rendelete ( 2010. március 2.) az Ostreid herpeszvírus
    1 μvar (OsHV-1 μvar) észlelésével kapcsolatban a Crassostrea gigas fajba
    tartozó osztrigák megnövekedett arányú elhullása elleni védekezésre irányuló
    intézkedések tekintetében a 2006/88/EK tanácsi irányelv végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 175/2010 della Commissione, del 2 marzo 2010 , che
    attua la direttiva 2006/88/CE del Consiglio per quanto riguarda le misure di lotta
    all'aumento della mortalità delle ostriche della specie Crassostrea gigas in
    relazione al rilevamento dell'Ostreid herpesvirus 1 μvar (OsHV-1 μvar)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 175/2010 ( 2010. gada 2. marts), ar ko īsteno
    Padomes Direktīvu 2006/88/EK attiecībā uz pasākumiem, lai kontrolētu Crassostrea
    gigas sugas austeru paaugstinātu mirstību saistībā ar austeru herpesvīrusa
    1 μvar (OsHV-1 μvar) konstatēšanu
  type: main
- language: lt
  script: Latn
  content: 2010 m. kovo 2 d. Komisijos reglamentas (ES) Nr. 175/2010, kuriuo įgyvendinamos
    Tarybos direktyvos 2006/88/EB nuostatos dėl padidėjusio Crassostrea gigas rūšies
    austrių mirtingumo, siejamo su virusu Ostreid herpesvirus 1 μvar (OsHV-1 μvar),
    kontrolės priemonių
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 175/2010 tat- 2 ta’ Marzu 2010 li
    jimplimenta d-Direttiva tal-Kunsill 2006/88/KE fir-rigward ta’ miżuri għall-kontroll
    taż-żieda fil-mortalità fil-gajdri tal-ispeċi Crassostrea gigas b’rabta
    mas-sejbien tal-Ostreid herpesvirus 1 μvar (OsHV-1 μvar)
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 175/2010 van de Commissie van 2 maart 2010 ter uitvoering
    van Richtlijn 2006/88/EG van de Raad wat betreft maatregelen ter bestrijding van
    de verhoogde mortaliteit bij oesters van de soort Crassostrea gigas in samenhang
    met de detectie van het Ostreid herpesvirus 1 μvar (OsHV-1 μvar)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 175/2010 z dnia 2 marca 2010 r. w sprawie
    wykonania dyrektywy Rady 2006/88/WE w zakresie środków mających na celu zwalczanie
    podwyższonej śmiertelności ostryg z gatunku Crassostrea gigas w związku z
    wykryciem herpeswirusa 1 μvar u ostryg (OsHV-1 μvar)
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. o 175/2010 da Comissão, de 2 de Março de 2010 , que
    dá execução à Directiva 2006/88/CE no que se refere a medidas de controlo
    do aumento da mortalidade em ostras da espécie Crassostrea gigas na sequência
    da detecção do vírus Ostreid herpesvirus 1 μvar (OsHV-1 μvar)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 175/2010 al Comisiei din 2 martie 2010 de punere
    în aplicare a Directivei 2006/88/CE a Consiliului în ceea ce privește măsurile
    pentru controlul creșterii mortalității stridiilor din specia Crassostrea gigas
    în legătură cu detectarea Ostreid herpesvirus 1 μvar (OsHV-1 μvar)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 175/2010 z 2. marca 2010 , ktorým sa vykonáva
    smernica Rady 2006/88/ES, pokiaľ ide o opatrenia na kontrolu zvýšenej mortality
    ustríc druhu Crassostrea gigas v súvislosti so zistením herpetického vírusu
    ustríc ( Ostreid herpesvirus) 1 μvar (OsHV-1 μvar)
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 175/2010 z dne 2. marca 2010 o izvajanju Direktive
    Sveta 2006/88/ES glede ukrepov za nadzor povečanega pogina ostrig vrste Crassostrea
    gigas v povezavi z odkrivanjem ostreidnega herpesvirusa 1 μvar (OsHV-1 μvar)
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n o 175/2010 de la Comisión, de 2 de marzo de 2010 , por
    el que se aplica la Directiva 2006/88/CE del Consejo en lo referente a las medidas
    de lucha contra el aumento de la mortalidad de los ostiones de la especie Crassostrea
    gigas en relación con la detección del herpesvirus de los ostreidos tipo 1 μvar
    (OsHV-1 μvar)
  type: main
- language: sv
  script: Latn
