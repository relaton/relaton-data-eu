title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1979/76 of 6 August 1976 concerning the
    issue of an invitation to tender for the supply, as food aid, of vitaminized skimmed-milk
    powder to be purchased on the Community market and addressed to the International
    Committee of the Red Cross for the benefit of Bolivia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1979/76 de la Commission, du 6 août 1976, relatif
    à l'adjudication pour la fourniture, au titre de l'aide alimentaire, de lait
    écrémé en poudre vitaminé acheté sur le marché de la Communauté et destiné
    au Comité international de la Croix-Rouge en faveur de la Bolivie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1979/76 der Kommission vom 6. August 1976 über die
    Ausschreibung für die Lieferung von auf dem Markt der Gemeinschaft angekauftem
    mit Vitaminen angereichertem Magermilchpulver im Rahmen der Nahrungsmittelhilfe
    an das Internationale Komitee vom Roten Kreuz für Bolivien
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1979/76 af 6. august 1976 om licitation
    med henblik på levering af vitaminiseret skummetmælkspulver, der er opkøbt
    på Fællesskabets marked og bestemt til Den Internationale Røde Kors Komité
    til fordel for Bolivia som fødevarehjælp
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1979/76 della Commissione, del 6 agosto 1976, che
    indice una gara per la fornitura a titolo di aiuto alimentare di latte scremato
    in polvere vitaminizzato acquistato sul mercato della Comunità destinato al comitato
    internazionale della Croce Rossa in favore della Bolivia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1979/76 van de Commissie van 6 augustus 1976 met
