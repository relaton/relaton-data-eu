title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1078/68 de la Commission, du 26 juillet 1968, portant
    détermination de la taxe et de la subvention applicables, à titre transitoire,
    aux échanges d'aliments composés à base de céréales entre l'Italie et les
    autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1078/68 der Kommission vom 26. Juli 1968 über die
    Festsetzung der Abgabe und der Subvention, die vorübergehend auf den Handel mit
    Getreidemischfutter zwischen Italien und den übrigen Mitgliedstaaten anzuwenden
    sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1078/68 della Commissione, del 26 luglio 1968, relativo
    alla determinazione della tassa e della sovvenzione applicabili, a titolo transitorio,
    agli scambi di alimenti composti a base di cereali tra l'Italia e gli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1078/68 van de Commissie van 26 juli 1968 houdende
    vaststelling van de belasting en de subsidie die bij wijze van overgangsmaatregel
    gelden voor het handelsverkeer in mengvoeders op basis van granen tussen Italië
    en de overige Lid-Staten
  type: main
