title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1024/85 of 22 April 1985 re-establishing
    the levying of customs duties on diodes, transistors and similar devices; parts,
    falling within subheadings 85.21 D and E originating in South Korea, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3562/84
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1024/85 de la Commission du 22 avril 1985 portant rétablissement
    de la perception des droits de douane applicables aux diodes, transistors et dispositifs
    similaires, parties et pièces détachées des sous-positions 85.21 D et E du
    tarif douanier commun, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1024/85 der Kommission vom 22. April 1985 zur Wiedereinführung
    der Erhebung der Zölle für Dioden, Transistoren und ähnliche Halbleiter und
    Teile der Tarifstellen 85.21 D und E mit Ursprung in Südkorea, dem die in der
    Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1024/85 af 22. april 1985 om genindførelse
    af opkrævning af told for dioder, transistorer og lignende halvlederkomponenter,
    dele henhørende under pos. 85.21 D og E og med oprindelse i Sydkorea, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1024/85 της Επιτροπής
    της 22ας Απριλίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για διόδους, κρυσταλλολυχνίας
    και παρομοίας διατάξεις, μέρη και μεμονωμένα
    τεμάχια, των διακρίσεων 85.21 Δ και Ε του Κοινού
    Δασμολογίου, καταγωγής Νοτίου Κορέας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3562/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1024/85 della Commissione del 22 aprile 1985 che ripristina
    la riscossione dei dazi doganali applicabili a diodi, transistori e simili, parti
    e pezzi staccati, delle sottovoci 85.21 D, E della tariffa doganale comune, originari
    della Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1024/85 van de Commissie van 22 april 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dioden, transistors
    en dergelijke halfgeleiderelementen, delen en onderdelen, van postonderverdelingen
    85.21 D en E, van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr.
    3562/84 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
