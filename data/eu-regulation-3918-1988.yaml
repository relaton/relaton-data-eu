title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3918/88 of 15 December 1988 fixing, from
    1989, the quota for imports into Portugal of live swine from Spain and certain
    detailed rules for the application thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3918/88 de la Commission du 15 décembre 1988 fixant,
    pour l'année 1989, le contingent applicable à l'importation d'animaux vivants
    de l'espèce porcine au Portugal en provenance d'Espagne et certaines modalités
    pour son application
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3918/88 DER KOMMISSION vom 15. Dezember 1988 zur Festlegung
    des 1989 in Portugal anwendbaren Kontingents fuer die Einfuhr von lebenden Schweinen
    aus Spanien und diesbezueglicher Durchfuehrungsbestimmungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3918/88 af 15. december 1988 om fastsættelse
    af kontingentet for 1989 for indførsel til Portugal af levende svin fra Spanien
    og visse bestemmelser for dets anvendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3918/88 της Επιτροπής
    της 15ης Δεκεμβρίου 1988 που καθορίζει, για το
    1989, την ποσόστωση που εφαρμόζεται κατά την
    εισαγωγή στην Πορτογαλία ζωντανών χοιροειδών
    προέλευσης Ισπανίας, και ορισμένες λεπτομέρειες
    για την εφαρμογή της
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3918/88 DELLA COMMISSIONE del 15 dicembre 1988 che
    fissa per il 1989 il contingente applicabile alle importazioni in Portogallo di
    animali vivi della specie suina provenienti dalla Spagna e stabilisce talune modalità
    per la sua applicazione
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3918/88 VAN DE COMMISSIE van 15 december 1988 tot
    vaststelling van het contingent voor 1989 dat Portugal voor levende varkens uit
    Spanje mag toepassen, en van enige uitvoeringsbepalingen ter zake
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3918/88 DA COMISSAO de 15 de Dezembro de 1988 que
    fixa o contingente para o ano de 1989 aplicavel em Portugal em relaçao aos animais
    vivos da espécie suina provenientes de Espanha e determinadas regras para a sua
    aplicaçao
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3918/88 DE LA COMISION de 15 de diciembre de 1988 por
    el que se establece para 1989 el contingente aplicable a las importaciones en
    Portugal de animales vivos de la especie porcina procedentes de Espana y determinadas
    normas para su aplicacion
  type: main
