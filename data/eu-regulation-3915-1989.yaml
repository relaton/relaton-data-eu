    del meccanismo complementare applicabile agli scambi per i prodotti trasformati
    a base di ortofrutticoli importati in Portogallo che figurano nell'allegato XXII
    dell'atto di adesione
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3915/89 VAN DE COMMISSIE van 20 december 1989 tot
