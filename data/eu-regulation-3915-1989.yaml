    Handelsmechanismus fuer die in Anhang XXII der Beitrittsakte aufgefuehrten, in
    Portugal eingefuehrten Erzeugnisse des Sektors Verarbeitungserzeugnisse aus Obst
    und Gemuese
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3915/89 af 20. december 1989 om ændring
    af forordning (EØF) nr. 641/86 om gennemførelsesbestemmelser til den supplerende
    mekanisme for samhandelen for så vidt angår produkter forarbejdet på basis
    af frugt og grønsager, der indføres til Portugal og er omhandlet i bilag XXII
    til tiltrædelsesakten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3915/89 της Επιτροπής
