title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 484/84 of 24 February 1984 re-establishing
    the levying of customs duties on babies' under garments of knitted or crocheted
    fabrics, not elastic or rubberized, products of category 68 (code 0680) originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 484/84 de la Commission du 24 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    sous-vêtements de bonneterie non élastique ni caoutchoutée, pour bébés, de
    la catégorie 68 (code 0680), originaires de Thaïlande, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 484/84 der Kommission vom 24. Februar 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Unterkleidung aus Gewirken, weder
    gummielastisch noch kautschutiert, für Säuglinge, der Warenkategorie Nr. 68
    (Kennziffer 0680), mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr.
    3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 484/84 af 24. februar 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte underbeklædningsgenstande af trikotage,
    ikke elastisk eller gummeret, til spædbørn under varekategori nr. 68 (kode 0680),
    som har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 484/84 της Επιτροπής
    της 24ης Φεβρουαρίου 1984 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένα
    έτοιμα ενδύματα εσωτερικά (εσώρουχα) πλεκτά,
    μη ελαστικά ουδέ συνδεδυασμένα μετά καουτσούκ,
    για βρέφη, προϊόντα της κατηγορίας 68 (κωδικός
    0680), καταγωγής Ταϋλάνδης, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 484/84 della Commissione del 24 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili a talune sottovesti a
    maglia non elastica né gommata, per bambini piccoli, della categoria di prodotti
    n. 68 (codice 0680), originari della Tailandia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 484/84 van de Commissie van 24 februari 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    onderkleding van niet-elastisch of van niet-gegummeerd brei- of haakwerk, voor
    baby' s, van de categorie van produkten nr. 68 (codenummer 0680), van oorsprong
    uit Thailand, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3570/83 van de Raad
  type: main
