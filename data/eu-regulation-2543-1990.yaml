title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2543/90 of 31 August 1990 reintroducing
    the levying of the customs duties applicable to men's or boys'shirts, other than
    knitted or crocheted, products of category No 8 (order No 40.0080), terry towelling
    and similar woven terry fabrics of cotton, products of category No 9 (order No
    40.0090), men's or boys'jackets excluding waister jackets and blazers, other than
    knitted or crocheted, products of category No 17 (order No 40.0170), women's or
    girls'dresses, products of category No 26 (order No 40.0260), table linen, toilet
    and kitchen products of category No 39 (order No 40.0390) originating in India,
    to which the preferential tariff arrangements of Council Regulation (EEC) No 3897/89
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2543/90 de la Commission du 31 août 1990 portant
    rétablissement de la perception des droits de douane applicables aux chemises
    et chemisettes, autres qu'en bonneterie, pour hommes ou garçonnets, de la catégorie
    de produits n° 8 (numéro d'ordre 40.0080), aux tissus de coton bouclé du genre
    éponge, de la catégorie de produits n° 9 (numéro d'ordre 40.0090), aux vestes
    et vestons autres que de bonneterie pour hommes et garçonnets, de la catégorie
    de produits n° 17 (numéro d'ordre 40.0170), aux robes pour femmes ou fillettes,
    de la catégorie de produits n° 26 (numéro d'ordre 40.0260) et au linge de table,
    de toilette ou de cuisine, de la catégorie de produits n° 39 (numéro d'ordre
    40.0390) originaires de l'Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2543/90 DER KOMMISSION vom 31. August 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Oberhemden, andere als aus Gewirken, fuer
    Maenner und Knaben der Warenkategorie Nr. 8 (laufende Nummer 40.0080), Schlingengewebe
    der Warenkategorie Nr. 9 (laufende Nummer 40.0090), Sakkos und Jacken, andere
    als aus Gewirken, fuer Maenner und Knaben der Warenkategorie Nr. 17 (laufende
    Nummer 40.0170), Kleider fuer Frauen und Maedchen der Warenkategorie Nr. 26 (laufende
    Nummer 40.0260), Tischwaesche, Waesche zur Koerperpflege und Haushaltswaesche
    der Warenkategorie Nr. 39 (laufende Nummer 40.0390) mit Ursprung in Indien, dem
    die in der Verordnung (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2543/90 af 31. august 1990 om genindførelse
    af opkrævning af toldafgifter for skjorter, ikke af trikotage, til mænd og drenge,
    under varekategori 8 (løbenummer 40.0080), håndklædefrottestof og lignende
    frottestof af bomuld, under varekategori 9 (løbenummer 40.0090), jakker og blazere,
    ikke af trikotage, til mænd og drenge, under varekategori 17 (løbenummer 40.0170),
    kjoler til kvinder og piger, under varekategori 26 (løbenummer 40.0260) og dækketøj,
    håndklæder køkkentekstiler, under varekategori 39 (løbenummer 40.0390), som
    har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
