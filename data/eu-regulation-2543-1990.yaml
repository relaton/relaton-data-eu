  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2543/90 DELLA COMMISSIONE del 31 agosto 1990 che ripristina
    la riscossione dei dazi doganali applicabili alle camicie e camicette, escluse
    quelle a maglia, per uomo e per ragazzo, della categoria di prdotti n. 8 (numero
    d'ordine 40.0080), ai tessuti di cotone ricci del tipo spugna, della categoria
    di prodotti n. 9 (numero d'ordine 40.0090), alle giacche e giacchette, escluse
    quelle a maglia, per uomo e per ragazzo della categoria di prodotti n. 17 (numero
    d'ordine 40.0170), gli abiti interi per donna o per ragazza, della categoria di
    prodotti n. 26 (numero d'ordine 40.0260) e alla biancheria de tavola, da toletta
    o da cucina della categoria di prodotti n. 39 (numero d'ordine 40.0390) originari
    dell'India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2543/90 VAN DE COMMISSIE van 31 augustus 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op: overhemden
    en sporthemden, andere dan van brei- of haakwerk, voor heren en jongens, van de
    categorie van produkten nr. 8 (volgnummer 40.0080); bad- of frotteerstof (lussendoek)
    van katoen, van de categorie van produkten nr. 9 (volgnummer 40.0090); colbertjassen,
    blazers en dergelijke, andere dan van brei- of haakwerk, voor heren en jongens,
    van de categorie van produkten nr. 17 (volgnummer 40.0170); japonnen voor dames
    en meisjes, van de categorie van produkten nr. 26 (volgnummer 40.0260), en tafellinnen
    en huishoudlinnen, van de categorie van produkten nr. 39 (volgnummer 40.0390),
    van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3897/89 van de Raad'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2543/90 DA COMISSAO de 31 de Agosto de 1990 que restabelece
    a cobrança dos direitos aduaneiros aplicaveis às camisas e camisetas tecidas,
    para homens e rapazes, com excepçao das de malha, da categoria de produtos n*
    8 (numero de ordem 40.0080), aos tecidos de algodao com argolas, da categoria
    de produtos n* 9 (numero de ordem 40.0090), aos casacos e jaquetoes excluindo
    os de malha, para homens e rapazes, da categoria de produtos n* 17 (numero de
    ordem 40.0170), aos roupoes para senhoras ou raparigas, da categoria de produtos
    n* 26 (numero de ordem 40.0260), e às roupas de mesa, de toucador ou de cozinha,
    da categoria de produtos n* 39 (numero de ordem 40.0390), originarios da India,
    beneficiaria das preferências pautais previstas no Regulamento (CEE) n* 3897/89
    do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2543/90 DE LA COMISION de 31 de agosto de 1990 relativo
    al restablecimiento de la recaudacion de los derechos arancelarios aplicables
    a las camisas y camisetas, que no sean de punto, para hombres y ninos, de la categoria
    de productos numero 8 (numero de orden 40.0080), a los tejidos de algodon con
    bucles de la clase esponja, de la categoria de productos numero 9 (numero de orden
    40.0090), a las chaquetas y chaquetones, que no sean de punto, para hombres y
    ninos, de la categoria de productos numero 17 (numero de orden 40.0170), a los
    vestidos para mujeres o ninas, de la categoria de productos numero 26 (numero
    de orden 40.0260), a la ropa de mesa, de tocador o de cocina de la categoria de
    productos numero 39 (numero de orden 40.0390) originarios de la India beneficiaria
    de las preferencias arancelarias previstas por el Reglamento (CEE) no 3897/89
    del Consejo
