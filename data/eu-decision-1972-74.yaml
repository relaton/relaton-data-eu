title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 décembre 1971, portant octroi du concours
    du FSE au bénéfice de la République italienne pour des dépenses relatives
    à des opérations de rééducation professionnelle effectuées par le "Ministero
    del lavoro e della previdenza sociale" et plusieurs organismes italiens
  type: main
- language: de
  script: Latn
  content: '72/74/EWG: Entscheidung der Kommission vom 23. Dezember 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Italienische
    Republik zu Aufwendungen für vom "Ministero del Lavoro e della Previdenza Sociale"
    und mehreren italienischen Körperschaften durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '72/74/CEE: Decisione della Commissione, del 23 dicembre 1971, che concede
    un contributo del Fondo sociale europeo alla Repubblica italiana per spese concernenti
    operazioni di riqualificazione effettuate dal « Ministero del lavoro e della
    previdenza sociale» e da vari enti italiani'
  type: main
- language: nl
  script: Latn
  content: '72/74/EEG: Beschikking van de Commissie van 23 december 1971 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Italiaanse
    Republiek voor door het "Ministero del Lavoro e della Previdenza Sociale" en verschillende
    Italiaanse instellingen gemaakte herscholingen'
  type: main
