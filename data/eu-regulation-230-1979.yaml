  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 230/79 della Commissione, del 7 febbraio 1979, che
    fissa per le carni bovine acquistate dagli organismi d' intervento, il coefficiente
    di deprezzamento e il limite di tolleranza per le perdite di quantità dovute
    all' ammasso, e che abroga il regolamento (CEE) n. 221/72
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 230/79 van de Commissie van 7 februari 1979 tot vaststelling,
    voor door de interventiebureaus gekocht rundvlees, van de kwaliteitsverminderingscoëfficiënt
    en van de maximale tolerantie voor gewichtsverliezen bij de opslag, en tot intrekking
    van Verordening (EEG) nr. 221/72
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 230/79 da Comissão, de 7 de Fevereiro de 1979,
    que fixa para a carne de bovino comprada à intervenção o coeficiente de depreciação,
    bem como o limite de tolerância para as quebras resultantes da armazenagem, e
    revoga o Regulamento (CEE) n.° 221/72
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 230/79 de la Comisión, de 7 de febrero de 1979, por
    el que se fijan, para la carne de vacuno comprada por los organismos de intervención,
    el coeficiente de depreciación y el límite de tolerancia para las pérdidas
    de cantidad resultantes del almacenamiento, y por el que se deroga el Reglamento
    (CEE) n° 221/72
