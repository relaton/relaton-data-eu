title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 230/79 of 7 February 1979 fixing the depreciation
    coefficient and the maximum tolerance for storage losses for beef bought into
    intervention and repealing Regulation (EEC) No 221/72
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 230/79 de la Commission, du 7 février 1979, fixant,
    pour la viande bovine achetée à l' intervention, le coefficient de dépréciation,
    ainsi que la limite de tolérance pour les pertes de quantités résultant du
    stockage, et abrogeant le règlement (CEE) n° 221/72
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 230/79 der Kommission vom 7. Februar 1979 zur Festsetzung
    des Koeffizienten für die schwächere Bewertung von Interventionsrindfleisch
    sowie der Toleranzgrenze für Mengenverluste, die bei der Lagerung entstanden
    sind, und zur Aufhebung der Verordnung (EWG) Nr. 221/72
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 230/79 af 7. februar 1979 om fastsættelse
    af værdiforringelseskoefficienten og tolerancen for svind som følge af oplagring
    for oksekød opkøbt til intervention, samt om ophævelse af forordning (EØF)
    nr. 221/72
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 230/79 τής Επιτροπής
    τής 7ης Φεβρουαρίου 1979 περί προσδιορισμού γιά
    τό βόειο κρέας, τό αγορασθέν κατά τήν παρέμβαση,
    τού συντελεστού υποτιμήσεως, ως καί τού ορίου
