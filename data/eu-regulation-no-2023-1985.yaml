title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2023/85 of 22 July 1985 fixing for the 1985/86
    marketing year the minimum price to be paid to producers for dried plums and the
    amount of production aid for prunes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2023/85 de la Commission du 22 juillet 1985 fixant,
    pour la campagne 1985/1986, le prix minimal à payer aux producteurs pour les
    prunes séchées ainsi que le montant de l' aide à la production pour les pruneaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2023/85 der Kommission vom 22. Juli 1985 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises für getrocknete Pflaumen sowie
    des Betrages der Produktionsbeihilfe für Trockenpflaumen für das Wirtschaftsjahr
    1985/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2023/85 af 22. juli 1985 om fastsættelse
    for produktionsåret 1985/86 af den minimumspris, der skal betales til producenterne
    for tørrede blommer, og af producentstøtten for svesker
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2023/85 της Επιτροπής
    της 22ας Ιουλίου 1985 που καθορίζει, για την περίοδο
    εμπορίας 1985/86, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για τα ξηρά δαμάσκηνα και
    το ποσό της ενίσχυσης στην παραγωγή για τα
    δαμάσκηνα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2023/85 della Commissione del 22 luglio 1985 che fissa,
    per la campagna di commercializzazione 1985/1986, il prezzo minimo da pagare ai
    produttori per le prugne secche e l' importo dell' aiuto alla produzione per le
    prugne
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2023/85 van de Commissie van 22 juli 1985 tot vaststelling,
    voor het verkoopseizoen 1985/1986, van de aan de telers te betalen minimumprijs
    voor gedroogde pruimen (basisprodukt), alsmede van het bedrag van de produktiesteun
    voor gedroogde pruimen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2023/85 da Comissão, de 22 de Julho de 1985, que
    fixa, para a campanha de 1985/1986, o preço mínimo a pagar aos produtores para
    as ameixas secas bem como o montante da ajuda à produção para as ameixas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2023/85 de la Comisión, de 22 de julio de 1985, por
    el que se fijan, para la campaña 1985/86, el precio mínimo que se deberá pagar
    a los productores por las ciruelas secas y el importe de la ayuda a la producción
    para las ciruelas pasas
  type: main
