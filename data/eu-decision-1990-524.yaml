title:
- language: en
  script: Latn
  content: '90/524/EEC: Commission Decision of 9 October 1990 recognizing that the
    production of certain quality wines produced in specified regions, because of
    their qualitative features, is far below demand (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/524/CEE: Décision de la Commission, du 9 octobre 1990, reconnaissant
    que la production de certains vins de qualité produits dans des régions déterminées
    est, du fait des caractéristiques qualitatives de ces vins, largement inférieure
    à la demande (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/524/EWG: Entscheidung der Kommission vom 9. Oktober 1990 zur Anerkennung,
    daß die nachfrage die Erzeugung an bestimmten qualitätsweinen b.a. wegen der
    qualitativen Merkmale weit überschreitet (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/524/EØF: Kommissionens beslutning af 9. oktober 1990 om anerkendelse
    af at produktionen af visse kvalitetsvine fra bestemte dyrkningsområder på grund
    af disse vines kvalitative egenskaber langt fra er tilstrækkelig til at dække
    efterspørgslen (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/524/ΕΟΚ: Απόφαση της Επιτροπής της 9ης Οκτωβρίου
    1990 που αναγνωρίζει ότι η παραγωγή ορισμένων
    οίνων ποιότητας που παράγονται σε καθορισμένες
    περιοχές λόγω των ποιοτικών χαρακτηριστικών
    των οίνων αυτών, είναι πολύ μικρότερη από τη
    ζήτηση (Το κείμενο στην γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '90/524/CEE: Decisione della Commissione, del 9 ottobre 1990, che riconosce
    che la produzione di taluni vini di qualita prodotti in regioni determinate, in
    considerazione delle loro caratteristiche qualitative, e ampiamente inferiore
    alla domanda (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '90/524/EEG: Beschikking van de Commissie van 9 oktober 1990 houdende erkenning
    van het feit dat de produktie van bepaalde V. Q. P. R. D., gezien haar kwaliteitskenmerken,
    ver bij de vraag achterblijft (Slechts de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/524/CEE: Decisão da Comissão, de 9 de outubro de 1990, que reconhece
    que a produção de determinados vinhos de qualidade produzidos em regiões determinadas
    e, devido as características qualitativas destes vinhos, largamente inferior
    a procura (Apenas faz fé o texto em língua francesa)'
  type: main
- language: es
  script: Latn
  content: '90/524/CEE: Decisión de la Comisión, de 9 de octubre de 1990, por la
    que se reconoce que la producción de determinados vinos de calidad producidos
    en regiones determinadas, debido a las características cualitativas de dichos
    vinos, es ampliamente inferior a la demanda (El texto en lengua francesa es el
    único auténtico)'
  type: main
