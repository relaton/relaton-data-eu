title:
- language: en
  script: Latn
  content: '79/971/EEC: Commission Decision of 26 October 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to jerseys, pullovers, slip- overs, waistcoats, twinsets,
    cardigans, bedjackets and jumpers, knitted or crocheted, not elastic or rubberized,
    of wool, of cotton or of man-made textile fibres, falling within subheading ex
    60.05 A of the Common Customs Tariff (NIMEXE codes 60.05-01, 27, 28, 29, 30, 33,
    36, 37, 38) (category 5), originating in Romania and in free circulation in the
    other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/971/CEE: Décision de la Commission, du 26 octobre 1979, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chandails, "pull-overs" (avec ou sans
    manches), "slip-overs", "twinsets", gilets [à l''exclusion des vestes visées
    à la sous-position 60.05 A II b) 4 hh)], de bonneterie non élastique ni caoutchoutée,
    de laine, de coton ou de fibres textiles synthétiques ou artificielles, de la
    sous-position ex 60.05 A du tarif douanier commun (codes Nimexe: 60.05- 01, 27,
    28, 29, 30, 33, 36, 37, 38) (catégorie 5), originaires de Roumanie et mis en
    libre pratique dans les autres États membres (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/971/EWG: Entscheidung der Kommission vom 26. Oktober 1979, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Pullover, Slipover, Twinsets, Westen und Strickjacken,
    aus Gewirken, aus Wolle, Baumwolle, synthetischen und künstlichen Spinnstoffen
    (weder gummielastisch noch kautschutiert), der Tarifstelle ex 60.05 A des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38) (Kategorie
    5) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische und
    niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/971/EØF: Kommissionens beslutning af 26. oktober 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage sweatere, pullovere, slipovere, cardigans,
    cardigansæt, jumpere, trøjer og veste af uld, bomuld eller syntetiske eller
    regenererede fibre, som henhører under pos. ex 60.05 A i den fælles toldtarif
    (NiMEXE-nummer 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38 ; kategori 5), har oprindelse
    i Rumænien og frit kan omsættes i de øvrige medlemsstater (Kun den franske
    og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/971/CEE: Decisione della Commissione, del 26 ottobre 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario maglie, pullover (con o senza maniche),
    slip-over, twinset, giubbetti e giacche [escluse quelle della sottovoce 60.05
    A II b) 4 hh)] e bluse a maglia non elastica né gommata, di lana, di cotone o
    di fibre tessili sintetiche o artificiali, della sottovoce ex 60.05 A della tariffa
    doganale comune (codici Nimexe: 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38), categoria
    5, originari della Romania e messi in libera pratica negli altri Stati membri
    (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/971/EEG: Beschikking van de Commissie van 26 oktober 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd truien, jumpers, pullovers, slipovers, twinsets, vesten en jasjes
    (met uitzondering van jasjes bedoeld bij post 60.05 A II b) 4 hh)) van niet-elastisch
    of niet-gegummeerd brei- of haakwerk, van wol, van katoen of van synthetische
    of van kunstmatige textielvezels van post ex 60.05 A van het gemeenschappelijk
    douanetarief (NIMEXE-code 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38) (categorie
    5), van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
