    kterým se mění Vídeňská úmluva o občanskoprávní odpovědnosti za jaderné
    škody ze dne 21. května 1963 , nebo k němu přistoupily, jakož i učinily
    prohlášení ohledně uplatňování příslušných vnitřních pravidel práva
    Unie'
