title:
- language: en
  script: Latn
  content: '2013/434/EU: Council Decision of 15 July 2013 authorising certain Member
    States to ratify, or to accede to, the Protocol amending the Vienna Convention
    on Civil Liability for Nuclear Damage of 21 May 1963 , in the interest of the
    European Union, and to make a declaration on the application of the relevant internal
    rules of Union law'
  type: main
- language: fr
  script: Latn
  content: '2013/434/UE: Décision du Conseil du 15 juillet 2013 autorisant certains
    États membres à ratifier le protocole d''amendement de la convention de Vienne
    du 21 mai 1963 relative à la responsabilité civile en matière de dommages nucléaires,
    ou à y adhérer, dans l''intérêt de l''Union européenne, et à faire une déclaration
    relative à l''application des dispositions internes pertinentes du droit de l''Union'
  type: main
- language: de
  script: Latn
  content: '2013/434/EU: Beschluss des Rates vom 15. Juli 2013 zur Ermächtigung bestimmter
    Mitgliedstaaten, das Protokoll zur Änderung des Wiener Übereinkommens vom 21.
    Mai 1963 über die zivilrechtliche Haftung für nukleare Schäden im Interesse
    der Europäischen Union zu ratifizieren oder ihm beizutreten und eine Erklärung
    über die Anwendung der einschlägigen internen Vorschriften des Unionsrechts
    abzugeben'
  type: main
- language: bg
  script: Cyrl
