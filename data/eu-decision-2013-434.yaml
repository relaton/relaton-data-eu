    на Европейския съюз към Протокола за изменение
    на Виенската конвенция за гражданска отговорност
    за ядрена вреда от 21 май 1963 г. и да направят
    декларация относно прилагането на съответните
    вътрешни правила от правото на Съюза'
  type: main
- language: cs
  script: Latn
