  content: '2013/434/UE: Decisione del Consiglio, del 15 luglio 2013 , che autorizza
    taluni Stati membri a ratificare o a aderire al protocollo recante modifica della
    convenzione di Vienna relativa alla responsabilità civile in materia di danni
    nucleari del 21 maggio 1963 , nell''interesse dell''Unione europea, e a formulare
    una dichiarazione sull''applicazione delle pertinenti norme interne del diritto
    dell''Unione'
  type: main
- language: lv
  script: Latn
  content: '2013/434/ES: Padomes Lēmums ( 2013. gada 15. jūlijs ), ar ko pilnvaro
