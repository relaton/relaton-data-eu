    lisäämisen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2134/95 della Commissione, del 7 settembre 1995, recante
    modifica del regolamento (CEE) n. 2814/90, nonché talune modalità di applicazione
    del regolamento (CEE) n. 3013/89 del Consiglio in ordine al trasferimento dei
    diritti al premio tra i soci di un'associazione di produttori e all'aumento dei
    diritti al premio a favore di taluni prodotti in Italia e in Grecia nel settore
    delle carni ovine e caprine
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2134/95 van de Commissie van 7 september 1995 tot
    wijziging van Verordening (EEG) nr. 2814/90 en houdende uitvoeringsbepalingen
    van Verordening (EEG) nr. 3013/89 van de Raad inzake de overdracht van premierechten
