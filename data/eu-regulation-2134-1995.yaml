title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2134/95 of 7 September 1995 amending Regulation
    (EEC) No 2814/90 and laying down certain detailed rules for the application of
    Council Regulation (EEC) No 3013/89 as regards the transfer of premium rights
    between members of the same producer groups and increasing the premium rights
    of certain sheepmeat and goatmeat producers in Italy and Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2134/95 de la Commission, du 7 septembre 1995, modifiant
    le règlement (CEE) n° 2814/90 et portant certaines modalités d'application
    du règlement (CEE) n° 3013/89 du Conseil en ce qui concerne le transfert de
    droits à prime entre membres d'un même groupement de producteurs ainsi que l'augmentation
    des droits à primes au bénéfice de certains producteurs en Italie et en Grèce
    dans le secteur de la viande ovine et caprine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2134/95 der Kommission vom 7. September 1995 zur Änderung
    der Verordnung (EWG) Nr. 2814/90 und mit bestimmten Durchführungsbestimmungen
    zur Verordnung (EWG) Nr. 3013/89 des Rates hinsichtlich der Übertragung des Prämienanspruchs
    zwischen Mitgliedern ein und derselben Erzeugergemeinschaft sowie der Erhöhung
    des Prämienanspruchs zugunsten bestimmter Erzeuger in Italien und in Griechenland
    im Sektor Schaf- und Ziegenfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2134/95 af 7. september 1995 om ændring
    af forordning (EØF) nr. 2814/90 og om visse gennemførelsesbestemmelser til Rådets
    forordning (EØF) nr. 3013/89 for så vidt angår overførsel af præmierettigheder
    mellem medlemmer af en og samme producentsammenslutning samt forhøjelse af præmierettighederne
    til fordel for visse producenter i Italien og Grækenland i sektoren for fåre-
    og gedekød
  type: main
- language: el
  script: Grek
