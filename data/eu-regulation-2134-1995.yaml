    voor sommige Italiaanse en Griekse producenten in de sector schape- en geitevlees
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2134/95 da Comissão, de 7 de Setembro de 1995, que
    altera o Regulamento (CEE) nº 2814/90 e que estabelece determinadas regras de
    aplicação do Regulamento (CEE) nº 3013/89 do Conselho no que diz respeito à
    transferência de direitos ao prémio entre membros de um mesmo agrupamento de
