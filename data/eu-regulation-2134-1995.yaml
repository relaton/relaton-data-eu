  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2134/95, annettu 7 päivänä syyskuuta 1995,
    asetuksen (ETY) N:o 2814/90 muuttamisesta ja neuvoston asetuksen (ETY) N:o 3013/89
    tietyistä soveltamista koskevista yksityiskohtaisista säännöistä lampaanliha-alalla
    saman tuottajaryhmittymän jäsenten välillä tapahtuvan palkkio-oikeuksien siirron
