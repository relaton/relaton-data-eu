    produtores em Itália e na Grécia no sector das carnes de ovino e caprino
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2134/95 de la Comisión, de 7 de septiembre de 1995,
    por el que se modifica el Reglamento (CEE) nº 2814/90 y se establecen disposiciones
    de aplicación del Reglamento (CEE) nº 3013/89 del Consejo en lo relativo a la
    transferencia de derechos de prima entre miembros de una misma agrupación de
    productos y al aumento de esos derechos en favor de algunos productores de Italia
    y Grecia en el sector de la carne de ovino y de caprino
  type: main
