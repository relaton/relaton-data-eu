title:
- language: en
  script: Latn
  content: '89/119/EEC: Commission Decision of 18 January 1989 authorizing the Italian
    Republic to apply intra- Community surveillance to imports of textile products
    falling within category 3, originating in Pakistan, which have been put into free
    circulation in the Community (only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/119/CEE: Décision de la Commission du 18 janvier 1989 autorisant la
    République italienne à procéder à une surveillance intracommunautaire des
    importations des produits textiles de la catégorie 3 originaires du Pakistan
    et mis en libre pratique dans la Communauté (Le texte en langue italienne est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 18. Januar 1989 zur Ermächtigung der
    Italienischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren bestimmer aus Pakistan stammender und in der Gemeinschaft im freien
    Verkehr befindlicher Textilwaren der Kategorie 3 (Nur der italienische Text ist
    verbindlich) (89/119/EWG) (89/119/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 18. januar 1989 om bemyndigelse af Den Italienske
    Republik til at indføre tilsyn inden for Fællesskabet med indførslen af tekstilvarer,
    henhørende under kategori 3, der har oprindelse i Pakistan og er overgået til
    fri omsætning i Fællesskabet (Kun den italienske udgave er autentisk) (89/119/EØF)
    (89/119/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/119/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Ιανουαρίου 1989 που εξουσιοδοτεί την Ιταλική
    Δημοκρατία να θεσπίσει ενδοκοινοτική επιτήρηση
    των εισαγωγών ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής πακιστάν που υπάγονται
    στην κατηγορία 3 και που βρίσκονται σε ελεύθερη
    κυκλοφορία στην Κοινότητα'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 18 gennaio 1989 che autorizza la Repubblica
    italiana ad istituire una sorveglianza intracomunitaria delle importazioni di
    prodotti tessili della categoria 3 originari del Pakistan messi in libera pratica
    nella Comunità (Il testo in lingua italiana è il solo facente fede) (89/119/CEE)
    (89/119/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 18 januari 1989 houdende machtiging van
    de Italiaanse Republiek tot toepassing van een intracommunautair toezicht ten
    aanzien van de invoer van textielprodukten van categorie 3 van oorsprong uit Pakistan,
    die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de tekst in
    de Italiaanse taal is authentiek) (89/119/EEG) (89/119/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 18 de Janeiro de 1989 que autoriza a República
    Italiana a proceder a uma vigilância intracomunitária das importações dos
    produtos têxteis da categoria 3, originários do Paquistão e introduzidos em
    livre prática na Comunidade (Apenas faz fé o texto em língua italiana) (89/119/CEE)
    #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 18 de enero de 1989 por la que se autoriza
    a la República Italiana a establecer medidas de vigilancia intracomunitaria en
    relación con las importaciones de determinados productos textiles de la categoría
    3 originarios de Paquistán y despachados a libre práctica en la Comunidad (El
    texto en lengua italiana es el único auténtico) (89/119/CEE) (89/119/CEE) #'
