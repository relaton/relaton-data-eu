title:
- language: fr
  script: Latn
  content: Décision 66/54/CEE de la Commission, du 14 décembre 1965, portant nouvelle
    modification de sa décision du 30 novembre 1964, autorisant la perception de
    taxes compensatoires à l'importation, dans la République française, de glucose
    (dextrose) en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '66/54/EWG: Entscheidung der Kommission vom 14. Dezember 1965 zur erneuten
    Änderung ihrer Entscheidung vom 30. November 1964 über die Erhebung einer Ausgleichsabgabe
    bei der Einfuhr von Glukose (Dextrose) aus verschiedenen Mitgliedstaaten in die
    Französische Republik'
  type: main
- language: it
  script: Latn
  content: '66/54/CEE: Decisione della Commissione, del 14 dicembre 1965, che modifica
    nuovamente la decisione del 30 novembre 1964 con cui si autorizza la riscossione
    di tasse di compensazione sull''importazione nella Repubblica francese di glucosio
    (destrosio) da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/54/EEG: Beschikking van de Commissie van 14 december 1965 tot nieuwe
    wijziging van haar beschikking van 30 november 1964, houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Franse Republiek van glucose
    (dextrose) uit bepaalde Lid-Staten'
  type: main
