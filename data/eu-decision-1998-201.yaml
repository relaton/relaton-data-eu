    dei frutti, originarie dell''Ungheria e della Romania'
  type: main
- language: nl
  script: Latn
  content: '98/201/EG: Beschikking van de Commissie van 4 maart 1998 tot machtiging
    van de lidstaten om bij wijze van uitzondering voor planten van Vitis L., met
    uitzondering van vruchten, van oorsprong uit Hongarije of Roemenië, afwijking
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan'
  type: main
- language: pt
  script: Latn
  content: '98/201/CE: Decisão da Comissão de 4 de Março de 1998 que autoriza os
