title:
- language: en
  script: Latn
  content: '98/201/EC: Commission Decision of 4 March 1998 authorising the Member
    States exceptionally to provide for derogations from certain provisions of Council
    Directive 77/93/EEC in respect of plants of Vitis L., other than fruits, originating
    in Hungary or Romania'
  type: main
- language: fr
  script: Latn
  content: '98/201/CE: Décision de la Commission du 4 mars 1998 autorisant les États
    membres à prévoir à titre exceptionnel des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour les végétaux de Vitis L., à l''exception
    des fruits, originaires de Hongrie ou de Roumanie'
  type: main
- language: de
  script: Latn
  content: '98/201/EG: Entscheidung der Kommission vom 4. März 1998 zur Ermächtigung
    der Mitgliedstaaten, für Pflanzen von Vitis L., außer Früchten, mit Ursprung
    in Ungarn und Rumänien Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG
    des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '98/201/EF: Kommissionens beslutning af 4. marts 1998 om bemyndigelse af
    medlemsstaterne til undtagelsesvis at indrømme undtagelser fra visse bestemmelser
    i Rådets direktiv 77/93/EØF for planter af Vitis L., dog ikke frugter, med oprindelse
    i Ungarn eller Rumænien'
  type: main
- language: el
  script: Grek
  content: '98/201/ΕΚ: Απόφαση της Επιτροπής της 4ης Μαρτίου
