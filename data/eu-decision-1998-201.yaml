    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου σχετικά
    με τα φυτά Vitis L., με εξαίρεση τους καρπούς, καταγωγής
    Ουγγαρίας ή Ρουμανίας'
  type: main
- language: fi
  script: Latn
  content: '98/201/EY: Komission päätös, tehty 4 päivänä maaliskuuta 1998, luvan
    antamisesta jäsenvaltioille säätää erityistapauksissa poikkeuksia Unkarista
