title:
- language: en
  script: Latn
  content: '97/649/EC: Commission Decision of 26 September 1997 amending Decision
    95/506/EC authorizing Member States temporarily to take additional measures against
    the dissemination of Pseudomonas solanacearum (Smith) Smith as regards the Kingdom
    of the Netherlands'
  type: main
- language: fr
  script: Latn
  content: '97/649/CE: Décision de la Commission du 26 septembre 1997 modifiant la
    décision 95/506/CE autorisant les États membres à prendre provisoirement des
    mesures supplémentaires en vue de se protéger contre la propagation de Pseudomonas
    solanacearum (Smith) Smith en provenance du Royaume des Pays-Bas'
  type: main
- language: de
  script: Latn
  content: '97/649/EG: Entscheidung der Kommission vom 26. September 1997 zur Änderung
    der Entscheidung 95/506/EG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    zusätzliche Maßnahmen gegen die Verbreitung von Pseudomonas solanacearum (Smith)
    Smith gegenüber dem Königreich der Niederlande zu treffen'
  type: main
- language: da
  script: Latn
  content: '97/649/EF: Kommissionens beslutning af 26. september 1997 om ændring
    af beslutning 95/506/EF om bemyndigelse af medlemsstaterne til midlertidigt at
    træffe supplerende foranstaltninger mod spredning af Pseudomonas solanacearum
    (Smith) Smith, for så vidt angår Kongeriget Nederlandene'
  type: main
- language: el
  script: Grek
  content: '97/649/ΕΚ: Απόφαση της Επιτροπής της 26ης Σεπτεμβρίου
    1997 για τροποποίηση της απόφασης 95/506/ΕΚ η οποία
    επιτρέπει προσωρινά στα κράτη μέλη να λάβουν
    πρόσθετα μέτρα κατά της εξάπλωσης της Pseudomonas
    solanacearum (Smith) Smith όσον αφορά το Βασίλειο των Κάτω
    Χωρών'
  type: main
- language: fi
  script: Latn
  content: '97/649/EY: Komission päätös, tehty 26 päivänä syyskuuta 1997, luvan
    antamisesta jäsenvaltioille toteuttaa väliaikaisesti Alankomaiden kuningaskuntaa
    koskevia lisätoimenpiteitä Pseudomonas solanacearum (Smith) Smith -taudinaiheuttajan
    leviämisen estämiseksi tehdyn päätöksen 95/506/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '97/649/CE: Decisione della Commissione del 26 settembre 1997 recante modifica
    della decisione 95/506/CE che autorizza gli Stati membri ad adottare, a titolo
    provvisorio, misure supplementari contro la propagazione dello Pseudomonas solanacearum
    (Smith) Smith relativamente al Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '97/649/EG: Beschikking van de Commissie van 26 september 1997 houdende
    wijziging van Beschikking 95/506/EG tot machtiging van bepaalde lidstaten om ten
    aanzien van het Koninkrijk der Nederlanden tijdelijk aanvullende maatregelen te
    nemen tegen de verspreiding van Pseudomonas solanacearum (Smith) Smith'
  type: main
- language: pt
  script: Latn
  content: '97/649/CE: Decisão da Comissão de 26 de Setembro de 1997 que altera
    a Decisão 95/506/CE que autoriza os Estados- membros a adoptar provisoriamente
    medidas adicionais contra a propagação de Pseudomonas solanacearum (Smith) Smith
    proveniente do Reino dos Países Baixos'
  type: main
- language: es
  script: Latn
  content: '97/649/CE: Decisión de la Comisión de 26 de septiembre de 1997 que modifica
    la Decisión 95/506/CE por la que se autoriza a los Estados miembros para adoptar
    temporalmente, en lo que respecta al Reino de los Países Bajos, medidas complementarias
    contra la propagación de Pseudomonas solanacearum (Smith) Smith'
  type: main
- language: sv
  script: Latn
  content: '97/649/EG: Kommissionens beslut av den 26 september 1997 om ändring av
