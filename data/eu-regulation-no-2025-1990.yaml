title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2025/90 of 16 July 1990 amending Regulation
    (EEC) No 1562/85 laying down detailed rules for the application of measures to
    encourage the processing of oranges and the marketing of products processed from
    lemons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2025/90 de la Commission du 16 juillet 1990 modifiant
    le règlement (CEE) n° 1562/85 portant modalités d'application des mesures visant
    à promouvoir la transformation de certains agrumes et la commercialisation des
    produits transformés à base de citrons
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2025/90 DER KOMMISSION vom 16. Juli 1990 zur Aenderung
    der Verordnung (EWG) Nr. 1562/85 mit Durchfuehrungsbestimmungen zu den Massnahmen
    zur Foerderung der Apfelsinenverarbeitung und der Vermarktung von Verarbeitungserzeugnissen
    aus Zitronen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2025/90 af 16. juli 1990 om ændring
    af forordning (EØF) nr. 1562/85 om gennemførelsesbestemmelser til foranstaltningerne
    til fremme af forarbejdning af visse citrusfrugter og afsætning af produkter
    forarbejdet på basis af citroner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αιθ. 2025/90 της Επιτροπής
    της 16ης Ιουλίου 1990 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1562/85 για λεπτομέρειες εφαρμογής
    των μέτρων που αποσκοπούν στην προώθηση της
    μεταποιήσεως ορισμένων εσπεριδοειδών και
    της εμπορίας των μεταποιημένων προϊόντων με
    βάση τα λεμόνια
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2025/90 DELLA COMMISSIONE del 16 luglio 1990 che modifica
    il regolamento (CEE) n. 1562/85 che stabilisce le modalità di applicazione delle
    misure intese a promuovere la trasformazione delle arance e la commercializzazione
    dei prodotti trasformati a base di limoni
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2025/90 VAN DE COMMISSIE van 16 juli 1990 tot wijziging
    van Verordening (EEG) nr. 1562/85 houdende uitvoeringsbepalingen ten aanzien van
    de maatregelen ter bevordering van de verwerking van bepaalde citrusvruchten en
    de afzet van produkten op basis van citroenen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2025/90 DA COMISSAO de 16 de Julho de 1990 que altera
    o Regulamento (CEE) n* 1562/85, que estabelece normas de execuçao das medidas
    destinadas a promover a transformaçao de determinados citrinos e a comercializaçao
    dos produtos transformados à base de limoes
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2025/90 DE LA COMISION de 16 de julio de 1990 por el
    que se modifica el Reglamento (CEE) no 1562/85 por el que se establecen las modalidades
    de aplicacion de las medidas destinadas a promover la transformacion de determinados
    citricos y la comercializacion de productos transformados a base de limones
  type: main
