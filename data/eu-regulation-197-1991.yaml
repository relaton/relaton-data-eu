  content: Council Regulation (EEC) No 197/91 of 21 January 1991 modifying Annex II
    to Council Regulation (EEC) No 288/82 on common rules for imports with regard
    to products subject to surveillance
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 197/91 DU CONSEIL du 21 janvier 1991 modifiant l''
    annexe II du règlement (CEE) no 288/82 relatif au régime commun applicable aux
    importations en ce qui concerne les produits soumis à surveillance #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 197/91 DES RATES vom 21. Januar 1991 zur Änderung
    des Anhangs II der Verordnung (EWG) Nr. 288/82 hinsichtlich der einer Überwachung
    unterliegenden Waren #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 197/91 af 21. januar 1991 om ændring af
    bilag II til forordning (EØF) nr. 288/82 om den fælles importordning, for så
    vidt angår produkter, der er underlagt tilsyn
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 197/91 του Συμβουλίου
    της 21ης Ιανουαρίου 1991 για την τροποποίηση του
    παραρτήματος ΙΙ του κανονισμού (ΕΟΚ) αριθ. 288/82
    σχετικά με το κοινό καθεστώς εισαγωγών όσον
    αφορά τα προϊόντα που υπόκεινται σε επιτήρηση
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 197/91 DEL CONSIGLIO del 21 gennaio 1991 che modifica
    l'' allegato II del regolamento (CEE) n. 288/82 relativo al regime comune applicabile
    alle importazioni, per quanto riguarda i prodotti soggetti a vigilanza #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 197/91 VAN DE RAAD van 21 januari 1991 tot wijziging
    van bijlage II van Verordening (EEG) nr. 288/82 inzake de gemeenschappelijke regeling
    voor de invoer, voor wat betreft produkten die aan toezicht onderworpen zijn #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) N°.197/91 DO CONSELHO de 21 de Janeiro de 1991 que
    altera o anexo II do Regulamento (CEE) n°.288/82, relativo ao regime comum aplicável
    às importações no que respeita aos produtos sujeitos a vigilância #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 197/91 DEL CONSEJO de 21 de enero de 1991 por el que
    se modifica el Anexo II del Reglamento (CEE) no 288/82, relativo al régimen común
    aplicable a las importaciones, respecto de los productos sometidos a vigilancia
    #'
