type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 August 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's and boys' shirts, woven, of wool, of cotton or of
    man-made textile fibres, falling within heading No ex 61.03 (NIMEXE codes 61.03-11,
    15, 19) of the Common Customs Tariff, originating in Yugoslavia and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/745/CEE: Décision de la Commission, du 11 août 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises et chemisettes tissées, pour
    hommes et garçonnets, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, de la position Ex 61.03 du Tarif douanier commun (codes Nimexe
    : 61.03-11; 15; 19), originaires de Yougoslavie et mis en libre pratique dans
    les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. August 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Jugoslawien stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, aus Geweben, für
    Männer und Knaben, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.03-11; 15; 19) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 11. august 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage vævede skjorter (herunder sports- og arbejdsskjorter) til mænd og
    drenge, af uld, bomuld eller syntetiske regenererede fibre som henhører under
    pos. ex 61.03 (NIMEXE-kode: 61.03-11, 15, 19) i den fælles toldtarif, har oprindelse
    i Jugoslavien og frit kan omsættes i de andre medlemstater'
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, dell''11 agosto 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario camicie e camicette, tessute, per uomo e per ragazzo,
    di lana, di cotone o di fibre tessili sintetiche o artificiali della voce ex 61.03
    (codice Nimexe: 61.03-11, 15, 19) della tariffa doganale comune, originarie della
    Iugoslavia e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 augustus 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd overhemden en sporthemden voor heren en jongens, geweven van wol of
    katoen of van synthetische of van kunstmatige textielvezels, van post ex 61.03
    van het gemeenschappelijk douanetarief (NIMEXE-code 61.03-11, 15, 19), van oorsprong
    uit Joegoslavië en in de overige Lid-Staten in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten
  type: main
