  content: Commission Regulation (EC) No 1473/94 of 27 June 1994 fixing the limits
    applicable in France to irrigated areas under the support system for producers
    of certain arable crops for the 1993/94 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1473/94 de la Commission du 27 juin 1994 fixant les
    plafonds applicables en France aux superficies irriguées dans le cadre du régime
    de soutien aux producteurs de certaines cultures arables pour la campagne 1993/1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1473/94 DER KOMMISSION vom 27. Juni 1994 zur Festsetzung
    der in Frankreich im Wirtschaftsjahr 1993/94 gemäß der Stützungsregelung für
    Erzeuger bestimmter landwirtschaftlicher Kulturpflanzen anzuwendenden Obergrenzen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1473/94 af 27. juni 1994 om fastsættelse
    af de lofter, der for produktionsåret 1993/94 skal anvendes i Frankrig for vandede
    arealer som led i støtteordningen for producenter af visse markafgrøder
  type: main
- language: el
  script: Grek
