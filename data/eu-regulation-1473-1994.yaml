    που εφαρμόζονται στη Γαλλία στις αρδευόμενες
    εκτάσεις στο πλαίσιο του καθεστώτος στήριξης
    των παραγωγών ορισμένων αροτραίων καλλιεργειών
    για την περίοδο 1993/94
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1473/94 DELLA COMMISSIONE del 27 giugno 1994 che fissa
