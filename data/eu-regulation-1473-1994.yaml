    di sostegno ai coltivatori di taluni seminativi per la campagna 1993/1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1473/94 VAN DE COMMISSIE van 27 juni 1994 tot vaststelling,
    voor het verkoopseizoen 1993/1994, van de maximale geïrrigeerde oppervlakten
    in Frankrijk in het kader van de steunregeling voor producenten van bepaalde akkerbouwgewassen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1473/94 DA COMISSÃO de 27 de Junho de 1994 que fixa,
