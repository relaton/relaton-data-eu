title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1309/72 de la Commission, du 23 juin 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux plaques pour construction, de la position tarifaire 48.09, originaires du
    Brésil bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1309/72 der Kommission vom 23. Juni 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Bauplatten aus Papierhalbstoff,
    aus Fasern von Holz oder von anderen pflanzlichen Stoffen, auch mit natürlichen
    oder künstlichen Harzen oder ähnlichen Bindemitteln hergestellt, der Tarifnummer
    48.09, mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 2795/71
    des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1309/72 della Commissione, del 23 giugno 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    lastre per costruzione della voce doganale n. 48.09 originarie del Brasile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2795/71 del Consiglio,
    del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1309/72 van de Commissie van 23 juni 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op platen voor constructiedoeleinden, van papierstof, van houtvezels
    of van andere plantaardige vezels, ook indien gebonden met natuurlijke hars, met
    kunsthars of met andere dergelijke bindmiddelen, van post 48.09, van oorsprong
    uit Brazilië, ten behoeve waarvan bij Verordening (EEG) nr. 2795/71 van de Raad
    van 20 december 1971 algemene tariefpreferenties werden geopend
  type: main
