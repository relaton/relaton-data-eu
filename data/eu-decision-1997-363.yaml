title:
- language: en
  script: Latn
  content: '97/363/EC: Commission Decision of 28 May 1997 amending certain decisions
    authorizing France to restrict the marketing of seed of certain varieties of agricultural
    plant species (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/363/CE: Décision de la Commission du 28 mai 1997 modifiant certaines
    décisions autorisant la France à restreindre la commercialisation des semences
    de certaines variétés des espèces de plantes agricoles (Le texte en langue
    française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/363/EG: Entscheidung der Kommission vom 28. Mai 1997 zur Änderung
    bestimmter Entscheidungen zur Ermächtigung der Französischen Republik, den Verkehr
    mit Saatgut einiger Sorten landwirtschaftlicher Pflanzenarten zu beschränken
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/363/EF: Kommissionens beslutning af 28. maj 1997 om ændring af visse
    beslutninger om bemyndigelse af Frankrig til at begrænse handel med frø af visse
    sorter af landbrugsplantearter (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/363/ΕΚ: Απόφαση της Επιτροπής της 28ης Μαΐου
    1997 για τροποποίηση ορισμένων αποφάσεων που
    επιτρέπουν στη Γαλλία να περιορίσει την εμπορία
    σπόρων προς σπορά ορισμένων ποικιλιών καλλιεργούμενων
    φυτικών ειδών (Το κείμενο στη γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/363/EY: Komission päätös, tehty 28 päivänä toukokuuta 1997, luvan
    antamisesta Ranskan tasavallalle rajoittaa tiettyjen viljelykasvilajikkeiden siementen
    pitämistä kaupan tehtyjen tiettyjen päätösten muuttamisesta (Ainoastaan ranskankielinen
    teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/363/CE: Decisione della Commissione del 28 maggio 1997 che modifica
    alcune decisioni che autorizzano la Francia a limitare la commercializzazione
    delle sementi di alcune varietà di specie di piante agricole (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/363/EG: Beschikking van de Commissie van 28 mei 1997 houdende wijziging
    van bepaalde beschikkingen tot machtiging van Frankrijk om de handel in zaaizaad
    van bepaalde rassen van landbouwgewassen te beperken (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '97/363/CE: Decisão da Comissão de 28 de Maio de 1997 que altera algumas
    decisões que autorizam a República Francesa a restringir a comercialização
    de sementes de determinadas variedades de espécies de plantas agrícolas (Apenas
    faz fé o texto em língua francesa)'
  type: main
- language: es
  script: Latn
  content: '97/363/CE: Decisión de la Comisión de 28 de mayo de 1997 que modifica
    algunas Decisiones por las que se autoriza a Francia a limitar la comercialización
    de semillas de determinadas variedades de especies de plantas agrícolas (El texto
    en lengua francesa es el único auténtico)'
  type: main
- language: sv
  script: Latn
