title:
- language: fr
  script: Latn
  content: Règlement n° 33/63/CEE de la Commission, du 10 avril 1963, portant modification
    du prélèvement spécial et du prix d'écluse spécial pour les échines et cous
    de volailles et unification des prix d'écluse pour les parties de toutes les
    espèces de volailles de basse-cour
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 33/63/EWG der Kommission vom 10. April 1963 zur Änderung
    des besonderen Abschöpfungsbetrags und des besonderen Einschleusungspreises für
    Rücken und Hälse von Hausgeflügel sowie zur Vereinheitlichung der Einschleusungspreise
    für Teile aller Hausgeflügelarten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 33/63/CEE della Commissione del 10 aprile 1963 relativo
    alla modifica del prelievo speciale e del prezzo limite speciale per i dorsi e
    i colli di volatili da cortile e alla unificazione dei prezzi limite per le parti
    di tutte le specie di volatili da cortile
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 33/63/EEG van de Commissie van 10 april 1963 houdende wijziging
    van het speciale heffingsbedrag en de speciale sluisprijs voor ruggen en halzen
    van pluimvee, alsmede tot eenmaking van de sluisprijzen voor delen van alle soorten
    pluimvee
  type: main
