  content: Delegirana uredba Komisije (EU) 2024/3215 z dne 28. junija 2024 o popravku
    nekaterih jezikovnih različic Delegirane uredbe (EU) 2021/2139 o dopolnitvi Uredbe
    (EU) 2020/852 Evropskega parlamenta in Sveta z določitvijo tehničnih meril za
    pregled za določitev pogojev, pod katerimi se šteje, da gospodarska dejavnost
    bistveno prispeva k blažitvi podnebnih sprememb ali prilagajanju podnebnim spremembam,
