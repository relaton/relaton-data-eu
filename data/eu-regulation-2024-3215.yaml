title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/3215 of 28 June 2024 correcting
    certain language versions of Delegated Regulation (EU) 2021/2139 supplementing
    Regulation (EU) 2020/852 of the European Parliament and of the Council by establishing
    the technical screening criteria for determining the conditions under which an
    economic activity qualifies as contributing substantially to climate change mitigation
    or climate change adaptation and for determining whether that economic activity
    causes no significant harm to any of the other environmental objectives
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/3215 de la Commission du 28 juin 2024 rectifiant
    certaines versions linguistiques du règlement délégué (UE) 2021/2139 complétant
    le règlement (UE) 2020/852 du Parlement européen et du Conseil par les critères
    d’examen technique permettant de déterminer à quelles conditions une activité
    économique peut être considérée comme contribuant substantiellement à l’atténuation
    du changement climatique ou à l’adaptation à celui-ci et si cette activité
    économique ne cause de préjudice important à aucun des autres objectifs environnementaux
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/3215 der Kommission vom 28. Juni 2024 zur
    Berichtigung bestimmter Sprachfassungen der Delegierten Verordnung (EU) 2021/2139
    der Kommission zur Ergänzung der Verordnung (EU) 2020/852 des Europäischen Parlaments
    und des Rates durch Festlegung der technischen Bewertungskriterien, anhand deren
    bestimmt wird, unter welchen Bedingungen davon auszugehen ist, dass eine Wirtschaftstätigkeit
    einen wesentlichen Beitrag zum Klimaschutz oder zur Anpassung an den Klimawandel
    leistet, und anhand deren bestimmt wird, ob diese Wirtschaftstätigkeit erhebliche
    Beeinträchtigungen eines der übrigen Umweltziele vermeidet
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/3215 на Комисията
    от 28 юни 2024 година за поправка на някои езикови
    версии на Делегиран регламент (ЕС) 2021/2139 за
    допълнение на Регламент (ЕС) 2020/852 на Европейския
    парламент и на Съвета чрез установяване на
    техническите критерии за проверка с цел определяне
    на условията, при които дадена икономическа
    дейност се квалифицира като допринасяща съществено
    за смекчаването на изменението на климата
    или за адаптирането към изменението на климата,
    и с цел определяне дали тази икономическа дейност
    не нанася значителни вреди във връзка с постигането
    на някоя от другите екологични цели
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/3215 ze dne 28. června
    2024, kterým se opravují některá jazyková znění nařízení v přenesené
    pravomoci (EU) 2021/2139, kterým se doplňuje nařízení Evropského parlamentu
    a Rady (EU) 2020/852, pokud jde o stanovení technických screeningových kritérií
    pro určení toho, za jakých podmínek se hospodářská činnost kvalifikuje
    jako významně přispívající ke zmírňování změny klimatu nebo k přizpůsobování
    se změně klimatu, a toho, zda tato hospodářská činnost významně nepoškozuje
    některý z dalších environmentálních cílů
  type: main
