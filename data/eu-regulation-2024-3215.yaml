    (UE) 2021/2139 uzupełniającego rozporządzenie Parlamentu Europejskiego i Rady
    (UE) 2020/852 poprzez ustanowienie technicznych kryteriów kwalifikacji służących
    określeniu warunków, na jakich dana działalność gospodarcza kwalifikuje się
    jako wnosząca istotny wkład w łagodzenie zmian klimatu lub w adaptację do
    zmian klimatu, a także określeniu, czy ta działalność gospodarcza nie wyrządza
    poważnych szkód względem żadnego z pozostałych celów środowiskowych
  type: main
