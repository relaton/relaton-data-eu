  script: Latn
  content: Gedelegeerde Verordening (EU) 2024/3215 van de Commissie van 28 juni 2024
    tot rectificatie van bepaalde taalversies van Gedelegeerde Verordening (EU) 2021/2139
    tot aanvulling van Verordening (EU) 2020/852 van het Europees Parlement en de
    Raad door technische screeningcriteria vast te stellen om de voorwaarden te bepalen
