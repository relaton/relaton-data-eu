  script: Latn
  content: Regulamento Delegado (UE) 2024/3215 da Comissão, de 28 de junho de 2024,
    que retifica determinadas versões linguísticas do Regulamento Delegado (UE)
    2021/2139, que completa o Regulamento (UE) 2020/852 do Parlamento Europeu e do
    Conselho mediante o estabelecimento de critérios técnicos de avaliação para
    determinar em que condições uma atividade económica é qualificada como contribuindo
    substancialmente para a mitigação das alterações climáticas ou para a adaptação
    às alterações climáticas e estabelecer se essa atividade económica não prejudica
    significativamente o cumprimento de nenhum dos outros objetivos ambientais
  type: main
