    od drugih okoljskih ciljev
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2024/3215 de la Comisión, de 28 de junio de 2024,
    que corrige determinadas versiones lingüísticas del Reglamento Delegado (UE)
    2021/2139, por el que se completa el Reglamento (UE) 2020/852 del Parlamento Europeo
    y del Consejo y por el que se establecen los criterios técnicos de selección
    para determinar las condiciones en las que se considera que una actividad económica
    contribuye de forma sustancial a la mitigación del cambio climático o a la adaptación
    al mismo, y para determinar si esa actividad económica no causa un perjuicio
    significativo a ninguno de los demás objetivos ambientales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2024/3215 av den 28 juni 2024
    om rättelse av vissa språkversioner av delegerad förordning (EU) 2021/2139
    om komplettering av Europaparlamentets och rådets förordning (EU) 2020/852 genom
    fastställande av tekniska granskningskriterier för att avgöra under vilka villkor
    en ekonomisk verksamhet ska anses bidra väsentligt till begränsningen av eller
    anpassningen till klimatförändringarna och för att avgöra om den ekonomiska
    verksamheten inte orsakar någon betydande skada för något av de andra miljömålen
