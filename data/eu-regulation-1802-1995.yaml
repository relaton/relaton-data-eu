type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1802/95 of 25 July 1995 amending the Regulations
    that fixed, prior to 1 February 1995, certain prices and amounts in the market
    in milk and milk products of which the value in ecus was adapted as a result of
    the abolition of the correction factor for agricultural conversion rates
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1802/95 de la Commission, du 25 juillet 1995, ajustant
    et modifiant les règlements du secteur du lait et des produits laitiers qui ont
    fixé avant le 1er février 1995 certains prix et montants dont les valeurs en
    écus ont été adaptées en raison de la suppression du facteur de correction
    des taux de conversion agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1802/95 der Kommission vom 25. Juli 1995 zur Ausgleichung
    und Änderung bestimmter Preise und Beträge in den vor dem 1. Februar 1995 in
    Kraft getretenen Verordnungen für Milch und Milcherzeugnisse, deren Wert in Ecu
    wegen der Abschaffung des Korrekturfaktors der landwirtschaftlichen Umrechnungskurse
    angepaßt wurde
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1802/95 на Комисията от 25 юли
    1995 година за изменение на регламентите от сектора
    на млякото и млечните продукти, които определяха
    преди 1 февруари 1995 година някои цени и суми,
    чиято стойност в екю беше променена в резултат
    от премахването на коригиращия фактор за селскостопанските
    обменни курсове
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1802/95 ze dne 25. července 1995, kterým
    se mění nařízení, která před 1. únorem 1995 stanovila některé ceny a
    částky v odvětví mléka a mléčných výrobků, jejichž hodnota v ECU byla
    upravena v důsledku zrušení opravného faktoru pro zemědělské přepočítací
    koeficienty
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1802/95 af 25. juli 1995 om tilpasning
    og ændring af de forordninger om mælk og mejeriprodukter, ved hvilke der før
    den 1. februar 1995 blev fastsat visse priser og beløb, hvis værdi i ecu er
    blevet tilpasset som følge af afskaffelsen af justeringsfaktoren for landbrugsomregningskurserne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1802/95 της Επιτροπής
    της 25ης Ιουλίου 1995 για προσαρμογή και τροποποίηση
    των κανονισμών του τομέα του γάλακτος και των
    γαλακτοκομικών προϊόντων οι οποίοι καθόρισαν
    πριν από την 1η Φεβρουαρίου 1995, ορισμένες τιμές
    και ποσά, η αξία των οποίων σε Ecu προσαρμόστηκε
    λόγω της κατάργησης του διορθωτικού συντελεστή
    των γεωργικών ισοτιμιών
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1802/95, 25. juuli 1995, millega muudetakse
    määrusi, millega enne 1. veebruari 1995 on piima- ja piimatooteturul kindlaks
    määratud teatavad hinnad ja summad, mille väärtust eküüdes on põllumajanduslike
    ümberarvestuskursside paranduskoefitsiendi tühistamise tõttu korrigeeritud
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1802/95, annettu 25 päivänä heinäkuuta 1995,
    tietyistä hinnoista ja määristä, joiden arvoa ecuina on maatalouden muuntokurssien
    korjaustekijän poistamisen vuoksi mukautettu, ennen 1 päivää heinäkuuta 1995
    annettujen maito- ja maitotuotealan asetusten tarkistamisesta ja muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1802/95/EK rendelete (1995. július 25.) egyes tej- és tejtermékek
    piaci árát és összegét, amelyek ECU-ben kifejezett értékét a mezőgazdasági
    átváltási arányok korrekciós tényezőjének eltörlése következtében
    kiigazították, 1995. február 1-je előtt rögzítő rendeletek módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1802/95 della Commissione, del 25 luglio 1995, recante
    adeguamento e modifica dei regolamenti del settore del latte e dei prodotti lattiero-caseari
    che hanno fissato, anteriormente al 1ºfebbraio 1995, alcuni prezzi e importi
    i cui valori in ecu sono stati adattati a seguito della soppressione del coefficiente
    correttore dei tassi di conversione agricoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1802/95 (1995. gada 25. jūlijs), ar ko groza
    regulas, kas līdz 1995. gada 1. februārim piena un piena produktu tirgū noteica
    dažas cenas un summas, kuru vērtību izteica Eiropas valūtas vienībās pēc
    lauksaimniecības konversijas likmju korekcijas koeficienta atcelšanas
  type: main
- language: lt
  script: Latn
  content: 1995 m. liepos 25 d. Komisijos reglamentas (EB) Nr. 1802/95, iš dalies
    keičiantis reglamentus, kurie iki 1995 m. vasario 1 d. nustatė tam tikras pieno
    ir pieno produktų rinkos kainas ir sumas, kurių vertė, išreikšta ekiu, yra
    pakoreguota dėl žemės ūkio perskaičiavimo kurso korekcijos koeficiento panaikinimo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissijoni (KEE) Nru 1802/95 tal-25 ta’ Lulju 1995
    li jemenda r-Regolament li ffissa, qabel l-1 ta’ Frar 1995, ċerti prezzijiet
    u ammonti fis-suq tal-ħalib u prodotti tal-ħalib li tagħhom il-valur f’ECUs
    ġie addattat bħala riżultat ta’ l-abolizzjoni tal-fattur korrettiv għar-rati
    ta’ konverżjoni agrikoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1802/95 van de Commissie van 25 juli 1995 tot aanpassing
    en wijziging van de verordeningen in de sector melk en zuivelprodukten waarbij
    vóór 1 februari 1995 bepaalde prijzen en bedragen zijn vastgesteld waarvan de
    waarde in ecu wegens de afschaffing van de correctiefactor voor de landbouwomrekeningskoersen
    is aangepast
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1802/95 z dnia 25 lipca 1995 r. zmieniające
    rozporządzenia ustalające przed dniem 1 lutego 1995 r. niektóre ceny i kwoty
    na rynku mleka i przetworów mlecznych, których wartość w ecu została dostosowana
    w wyniku zniesienia współczynnika poprawkowego dla rolniczych kursów przeliczeniowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1802/95 da Comissão, de 25 de Julho de 1995, que
    ajusta e altera os regulamentos do sector do leite e dos produtos lácteos que
    fixaram, antes de 1 de Fevereiro de 1995, determinados preços e montantes cujos
    valores em ecus foram adaptados devido à supressão do factor de correcção
    das taxas de conversão agrícolas
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1802/95 al Comisiei din 25 iulie 1995 de modificare
    a regulamentelor din sectorul laptelui și produselor lactate care au stabilit,
    înainte de 1 februarie 1995, anumite prețuri și sume totale a căror valoare
    în ECU a fost adaptată ca urmare a eliminării factorului de corecție a cursului
    de schimb agricol
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1802/95 z 25. júla 1995, ktorým sa menia
    a dopĺňajú nariadenia, ktoré určovali pred 1. februárom 1995 niektoré ceny
    a čiastky na trhu s mliekom a mliečnymi výrobkami, ktorých hodnota v ECU bola
    upravená po zrušení korekčného koeficientu pre poľnohospodárske prepočítacie
    kurzy
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1802/95 z dne 25. julija 1995 o spremembah uredb,
    ki so pred 1. februarjem 1995, določale nekatere cene in zneske na trgu z mlekom
    in mlečnimi proizvodi, katerih vrednost v ekujih je bila spremenjena kot posledica
    odprave korekcijskega faktorja za kmetijska menjalna razmerja
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1802/95 de la Comisión, de 25 de julio de 1995, por
    el que se ajustan y se modifican los Reglamentos del sector de la leche y los
    productos lácteos que fijan, antes del 1 de febrero de 1995, determinados precios
    e importes cuyos valores en ecus se han adaptado debido a la supresión del factor
    de corrección de los tipos de conversión agrarios
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1802/95 av den 25 juli 1995 om anpassning
    och ändring av de bestämmelser inom sektorn för mjölk och mjölkprodukter
    som innan den 1 februari 1995 fastställde vissa priser och belopp vars värde
    i ecu har ändrats till följd av avskaffandet av korrigeringsfaktorn för jordbruksomräkningskurserna
  type: main
