title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3871/91 of 16 December 1991 suspending for
    the 1992 fishing year the duties applicable to fresh fishery products originating
    in Morocco and coming from joint fisheries ventures set up between natural or
    legal persons from Portugal and Morocco, on the direct landing of such products
    in Portugal
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3871/91 DE LA COMMISSION du 16 décembre 1991 portant,
    pour la campagne 1992, suspension des droits applicables aux produits de la pêche
    fraîche originaires du Maroc et provenant des entreprises communes de pêche
    constituées entre personnes physiques ou morales du Portugal et du Maroc, à
    l'' occasion de leur débarquement direct au Portugal #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3871/91 DER KOMMISSION vom 16. Dezember 1991 zur
    Aussetzung der bei der Direktanlandung in Portugal anzuwendenden Zölle auf frische
    Fischereierzeugnisse mit Ursprung in Marokko von gemeinsamen Fischereiunternehmen
    zwischen natürlichen oder juristischen Personen Portugals und Marokkos für das
    Wirtschaftsjahr 1992 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3871/91 af 16. december 1991 om suspension
    for fangstsæsonen 1992 af tolden på ferske fiskerivarer med oprindelse i Marokko
    og hidhørende fra fællesforetagender, der er oprettet mellem fysiske eller juridiske
    personer i Portugal og i Marokko, i anledning af sådanne varers direkte landing
    i Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3871/91 της Επιτροπής
    της 16ης Δεκεμβρίου 1991 για την αναστολή, για
    την περίοδο εμπορίας 1992, των δασμών που εφαρμόζονται
    σε νωπά προϊόντα αλιείας καταγωγής Μαρόκου
    τα οποία προέρχονται από κοινές αλιευτικές
    επιχειρήσεις που έχουν συσταθεί μεταξύ φυσικών
    ή νομικών προσώπων της Πορτογαλίας και του
    Μαρόκου, κατά την απευθείας εκφόρτωση αυτών
    των προϊόντων στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3871/91 DELLA COMMISSIONE del 16 dicembre 1991 che
    sospende, per la campagna 1992, i dazi applicabili ai prodotti freschi della pesca
    originari del Marocco e provenienti da imprese comuni di pesca costituite tra
    persone fisiche o giuridiche del Portogallo e del Marocco, all'' atto del loro
    sbarco diretto in Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3871/91 VAN DE COMMISSIE van 16 december 1991 tot
    schorsing voor het visseizoen 1992 van de rechten voor verse visserijprodukten
    van oorsprong uit Marokko en afkomstig van gemeenschappelijke visserijondernemingen
    van natuurlijke of rechtspersonen uit Portugal en uit Marokko, bij rechtstreekse
    aanvoer in Portugal #'
  type: main
