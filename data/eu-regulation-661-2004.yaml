title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 661/2004 of 7 April 2004 initiating an investigation
    concerning the possible circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 769/2002 on imports of coumarin originating in the People's
    Republic of China by imports of coumarin consigned from India and from Thailand,
    whether declared as originating in India or Thailand or not, and making such imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 661/2004 de la Commission du 7 avril 2004 portant ouverture
    d'une enquête sur un éventuel contournement des mesures antidumping instituées
    par le règlement (CE) n° 769/2002 du Conseil sur les importations de coumarine
    originaire de la République populaire de Chine par des importations de coumarine
    expédiée de l'Inde et de Thaïlande, qu'elle ait ou non été déclarée originaire
    de ces pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 661/2004 der Kommission vom 7. April 2004 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung
    (EG) Nr. 769/2002 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren von Kumarin mit Ursprung in der Volksrepublik China durch Einfuhren
    von aus Indien und Thailand versandtem Kumarin, ob als Ursprungserzeugnis Indiens
    oder Thailands angemeldet oder nicht, und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 661/2004 ze dne 7. dubna 2004, kterým se zahajuje
