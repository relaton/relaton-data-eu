    aloittamisesta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 661/2004/EK rendelete (2004. április 7.) a 769/2002/EK tanácsi
    rendelettel a Kínai Népköztársaságból származó kumarin behozatalával
    szemben bevezetett dömpingellenes intézkedéseknek az Indiában és Thaiföldön
    feladott – függetlenül attól, hogy Indiából vagy Thaiföldről származónak
    nyilvánították-e – kumarin behozatalával való feltételezhető kijátszására
    vonatkozó vizsgálat kezdeményezéséről, valamint e behozatalok nyilvántartásbavételi
    kötelezettségének előírásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 661/2004 della Commissione, del 7 aprile 2004, che
    apre un'inchiesta relativa alla possibile elusione delle misure antidumping istituite
    dal regolamento (CE) n. 769/2002 del Consiglio sulle importazioni di cumarina
    originaria della Repubblica popolare cinese mediante importazioni di cumarina
    spedita dall'India e dalla Thailandia, indipendentemente dal fatto che sia dichiarata
    o meno originaria dell'India o della Thailandia, e che dispone la registrazione
    di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 661/2004 (2004. gada 7. aprīlis), ar ko uzsāk
    izmeklēšanu attiecībā uz Padomes Regulā (EK) Nr. 769/2002 noteikto Ķīnas
    Tautas Republikas izcelsmes kumarīna importam piemērojamo antidempinga pasākumu
    iespējamo apiešanu, ievedot no Indijas un Taizemes sūtīto kumarīnu, deklarējot
    vai nedeklarējot to kā Indijas vai Taizemes izcelsmes ražojumu, un ar ko uz
    šādu importu attiecina reģistrāciju
  type: main
- language: lt
  script: Latn
