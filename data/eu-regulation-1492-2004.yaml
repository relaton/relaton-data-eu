    osin kuin se koskee nautaeläinten, lampaiden ja vuohien tarttuvien spongiformisten
    enkefalopatioiden hävittämistoimenpiteitä, lampaiden ja vuohien siemennesteen
    ja alkioiden kauppaa ja tuontia sekä erikseen määriteltyä riskiainesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1492/2004 od 23. kolovoza 2004. o izmjeni Uredbe
