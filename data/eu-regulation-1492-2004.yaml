title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1492/2004 of 23 August 2004 amending Regulation
    (EC) No 999/2001 of the European Parliament and of the Council as regards eradication
    measures for transmissible spongiform encephalopathies in bovine, ovine and caprine
    animals, the trade and importation of semen and embryos of ovine and caprine animals
    and specified risk material
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1492/2004 de la Commission du 23 août 2004 modifiant
    le règlement (CE) n° 999/2001 du Parlement européen et du Conseil en ce qui
    concerne les mesures d'éradication d'encéphalopathies spongiformes transmissibles
    chez les bovins, les ovins et les caprins, les échanges et l'importation de sperme
    et d'embryons d'ovins et de caprins et de matériels à risque spécifiés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1492/2004 der Kommission vom 23. August 2004 zur Änderung
    der Verordnung (EG) Nr. 999/2001 des Europäischen Parlaments und des Rates hinsichtlich
    der Maßnahmen zur Tilgung transmissibler spongiformer Enzephalopathien bei Rindern,
    Schafen und Ziegen, hinsichtlich des Handels mit und der Einfuhr von Samen und
    Embryonen von Schafen und Ziegen sowie hinsichtlich des spezifizierten Risikomaterials
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1492/2004 на Комисията от 23
    август 2004 година за изменение на Регламент
    (ЕО) № 999/2001 на Европейския парламент и на Съвета
    по отношение на мерките за ликвидиране на трансмисивни
    спонгиформни енцефалопатии при животните
    от рода на едрия рогат добитък, овцете и козите,
    търговията и вноса на сперма и яйцеклетки от
    животни от рода на овцете и козите и специфичен
    рисков материал
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1492/2004 ze dne 23. srpna 2004 měnící nařízení
    (ES) č. 999/2001 Evropského parlamentu a Rady, pokud jde o eradikační opatření
    u přenosných spongiformních encefalopatií skotu, ovcí a koz, obchodování
    se spermatem a embryi ovcí a koz a jejich dovoz a o specifický rizikový materiál
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1492/2004 af 23. august 2004 om ændring
    af Europa-Parlamentets og Rådets forordning (EF) nr. 999/2001 for så vidt angår
    foranstaltninger til udryddelse af transmissible spongiforme encephalopatier hos
    kvæg, får og geder, handel med og import af sæd og embryoner fra får og geder
    og specificeret risikomateriale
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1492/2004 της Επιτροπής,
