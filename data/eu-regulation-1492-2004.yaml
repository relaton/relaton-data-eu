    spongiformnih encefalopatija u goveda, ovaca i koza u vezi s trgovinom i uvozom
    sjemena i zametaka ovaca i koza te specificiranog rizičnog materijala
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1492/2004/EK rendelete (2004. augusztus 23.) az Európai Parlament
    és a Bizottság 999/2001/EK rendeletének módosításáról a szarvasmarha-,
    juh- és kecskefélék fertőző szivacsos agyvelőbántalmának felszámolására
    irányuló intézkedések, a juh- és kecskefélék spermájának és embrióinak
    valamint meghatározott kockázatú anyagoknak a kereskedelme és importja vonatkozásában
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1492/2004 della Commissione, del 23 agosto 2004, che
    modifica il regolamento (CE) n. 999/2001 del Parlamento europeo e del Consiglio
    per quanto riguarda le misure di eradicazione delle encefalopatie spongiformi
    trasmissibili negli animali delle specie bovina, ovina e caprina, il commercio
    e l’importazione di sperma ed embrioni degli ovini e dei caprini e i materiali
    specifici a rischio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1492/2004 (2004. gada 23. augusts), ar kuru tiek
    mainīta Eiropas Parlamenta un Padomes Regula (EK) Nr. 999/2001, kas attiecas
    uz transmisīvās sūkļveida encefalopātijas apkarošanas pasākumiem liellopiem,
    aitām un kazām, aitu un kazu spermas un embriju, un speciālā riska materiāla
    tirdzniecību un ievešanu
  type: main
- language: lt
  script: Latn
  content: 2004 m. rugpjūčio 23 d. Komisijos reglamentas (EB) Nr. 1492/2004, iš
    dalies keičiantis Europos Parlamento ir Tarybos reglamentą (EB) Nr. 999/2001
    dėl galvijų, ožkų ir avių užkrečiamųjų spongiforminių encefalopatijų
    likvidavimo priemonių, prekybos avių ir ožkų sėkla ir embrionais ir nurodyta
    pavojinga medžiaga bei jų įvežimo
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1492/2004 tat- 23 ta' Awissu 2004 jemenda
    r-Regolament (KE) Nru 999/2001 tal-Parlament Ewropew u l-Kunsill dwar il-miżuri
    ta’ qerda għal enċefalopatiji sponġiformi li jittieħdu f’annimali bovini,
    nagħaġ u mogħoż, il-kummerċ u l-importazzjoni tas-semen u l-embrijoni tan-nagħaġ
    u l-mogħoż u l-materjal ta’ riskju speċifikat
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1492/2004 van de Commissie van 23 augustus 2004 tot
    wijziging van Verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad
    wat betreft uitroeiingsmaatregelen voor overdraagbare spongiforme encefalopathieën
    bij runderen, schapen en geiten, de handel in en invoer van sperma en embryo's
    van schapen en geiten en gespecificeerd risicomateriaal
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1492/2004 z dnia 23 sierpnia 2004 r. dotyczące
    zmiany rozporządzenia (WE) nr 999/2001 Parlamentu Europejskiego i Rady Europy,
    co do środków wyeliminowania pasażowalnej encefalopatii gąbczastej u bydła
    oraz grupy zwierząt obejmującej owce i kozy, handlu i importu nasienia i embrionów
    owiec i kóz oraz określonego materiału ryzyka
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1492/2004 da Comissão, de 23 de Agosto de 2004,
    que altera o Regulamento (CE) n.° 999/2001 do Parlamento Europeu e do Conselho
    no que se refere a medidas de erradicação de encefalopatias espongiformes transmissíveis
    em bovinos, ovinos e caprinos, ao comércio e à importação de sémen e embriões
    de ovinos e caprinos, bem como a matérias de risco especificadas
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1492/2004 al Comisiei din 23 august 2004 de modificare
    a Regulamentului (CE) nr. 999/2001 al Parlamentului European și al Consiliului
    în ceea ce privește măsurile de eradicare a encefalopatiilor spongiforme transmisibile
    la bovine, ovine și caprine, schimburile și importul de material seminal și
    de embrioni de ovine și de caprine și de materiale specificate cu grad ridicat
    de risc
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1492/2004 z 23. augusta 2004, ktorým sa mení
