    butyricum (FERM BP-2789) als Futtermittelzusatzstoff für Masthühner und für
    Vogelarten von geringerer wirtschaftlicher Bedeutung (außer Legevögeln) (Zulassungsinhaber:
    Miyarisan Pharmaceutical Co. Ltd., vertreten durch Miyarisan Pharmaceutical Europe
    S.L.U.)'
