title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 357/2013 of 18 April 2013 amending
    Regulation (EC) No 903/2009 and Implementing Regulation (EU) No 373/2011 as regards
    the minimum content of a preparation of Clostridium butyricum (FERM BP-2789) as
    a feed additive for chickens for fattening and minor avian species (excluding
    laying birds) (holder of authorisation Miyarisan Pharmaceutical Co. Ltd represented
    by Miyarisan Pharmaceutical Europe S.L.U.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) n ° 357/2013 de la Commission du 18 avril
    2013 modifiant le règlement (CE) n ° 903/2009 et le règlement d’exécution
    (UE) n ° 373/2011 en ce qui concerne la teneur minimale d’une préparation
    de Clostridium butyricum (FERM BP-2789) utilisée en tant qu’additif pour l’alimentation
    des poulets d’engraissement et des espèces aviaires mineures (à l’exception
    des oiseaux pondeurs) (titulaire de l’autorisation: Miyarisan Pharmaceutical
    Co. Ltd, représenté par Miyarisan Pharmaceutical Europe S.L.U.)'
  type: main
- language: de
