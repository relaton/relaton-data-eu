  content: Commission Regulation (EEC) No 3636/83 of 19 December 1983 introducing
    retrospective surveillance of the reimportation after outward processing of certain
    textile products originating in Morocco, Portugal, Spain and Tunisia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3636/83 de la Commission du 19 décembre 1983 instaurant
