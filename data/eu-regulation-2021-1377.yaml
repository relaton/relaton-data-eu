    dervingojo aliejaus iš Haematococcus pluvialis dumblių naudojimo sąlygas pagal
    Europos Parlamento ir Tarybos reglamentą (ES) 2015/2283 ir kuriuo iš dalies
    keičiamas Komisijos įgyvendinimo reglamentas (ES) 2017/2470
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/1377 tad-19
    ta’ Awwissu 2021 li jawtorizza l-bidla fil-kundizzjonijiet tal-użu tal-ikel
    ġdid “oleoreżina li fiha ħafna astaksantina” mill-algi Haematococcus pluvialis
    skont ir-Regolament (UE) 2015/2283 tal-Parlament Ewropew u tal-Kunsill, u li jemenda
    r-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2017/2470
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/1377 van de Commissie van 19 augustus
    2021 tot goedkeuring van een wijziging van de gebruiksvoorwaarden voor het nieuwe
    voedingsmiddel “astaxanthine-rijke oleohars uit de alg Haematococcus pluvialis”
    krachtens Verordening (EU) 2015/2283 van het Europees Parlement en de Raad, en
    tot wijziging van Uitvoeringsverordening (EU) 2017/2470 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/1377 z dnia 19 sierpnia 2021
    r. zezwalające na zmianę w warunkach stosowania nowej żywności „bogata w
    astaksantynę oleożywica z alg Haematococcus pluvialis” na podstawie rozporządzenia
    Parlamentu Europejskiego i Rady (UE) 2015/2283 oraz zmieniające rozporządzenie
    wykonawcze Komisji (UE) 2017/2470
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/1377 da Comissão de 19 de agosto de
    2021 que autoriza uma alteração das condições de utilização do novo alimento
    oleorresina rica em astaxantina da alga Haematococcus pluvialis ao abrigo do Regulamento
    (UE) 2015/2283 do Parlamento Europeu e do Conselho e que altera o Regulamento
    de Execução (UE) 2017/2470 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/1377 al Comisiei din 19 august
    2021 de autorizare a modificării condițiilor de utilizare a alimentului nou
    oleorășină bogată în astaxantină obținută din alga Haematococcus pluvialis
    în temeiul Regulamentului (UE) 2015/2283 al Parlamentului European și al Consiliului
    și de modificare a Regulamentului de punere în aplicare (UE) 2017/2470 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/1377 z 19. augusta 2021, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (EÚ) 2015/2283 povoľuje zmena
    podmienok používania novej potraviny oleorezínu s vysokým obsahom astaxantínu
    z rias Haematococcus pluvialis a ktorým sa mení vykonávacie nariadenie Komisie
    (EÚ) 2017/2470
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/1377 z dne 19. avgusta 2021 o odobritvi
    spremembe pogojev uporabe novega živila terpentin iz alg Haematococcus pluvialis,
    bogat z astaksantinom, v skladu z Uredbo (EU) 2015/2283 Evropskega parlamenta
    in Sveta ter o spremembi Izvedbene uredbe Komisije (EU) 2017/2470
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/1377 de la Comisión de 19 de agosto
    de 2021 por el que se autoriza la modificación en las condiciones de uso del
    nuevo alimento «oleorresina rica en astaxantina del alga Haematococcus pluvialis»
    con arreglo al Reglamento (UE) 2015/2283 del Parlamento Europeo y del Consejo
    y se modifica el Reglamento de Ejecución (UE) 2017/2470 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/1377 av den 19 augusti
