    Haematococcus pluvialis u skladu s Uredbom (EU) 2015/2283 Europskog parlamenta
    i Vijeća te o izmjeni Provedbene uredbe Komisije (EU) 2017/2470
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1377 végrehajtási rendelete (2021. augusztus 19.)
