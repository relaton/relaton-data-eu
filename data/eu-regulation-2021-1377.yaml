title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1377 of 19 August 2021 authorising
    the change of the conditions of use of the novel food astaxanthin-rich oleoresin
    from Haematococcus pluvialis algae under Regulation (EU) 2015/2283 of the European
    Parliament and of the Council and amending Commission Implementing Regulation
    (EU) 2017/2470
  type: main
- language: fr
  script: Latn
