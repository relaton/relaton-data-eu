    új élelmiszer (EU) 2015/2283 európai parlamenti és tanácsi rendelet szerinti
    felhasználási feltételeire vonatkozó módosítás engedélyezéséről és
    az (EU) 2017/2470 bizottsági végrehajtási rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/1377 della Commissione del 19 agosto
    2021 che autorizza una modifica delle condizioni d’uso del nuovo alimento «oleoresina
    ricca di astaxantina derivata dall’alga Haematococcus pluvialis» a norma del
    regolamento (UE) 2015/2283 del Parlamento europeo e del Consiglio e che modifica
    il regolamento di esecuzione (UE) 2017/2470 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/1377 (2021. gada 19. augusts),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (ES) 2015/2283 atļauj
    mainīt jaunā pārtikas produkta “No Haematococcus pluvialis sugas aļģēm
    iegūti oleosveķi, kas bagāti ar astaksantīnu” lietošanas nosacījumus un
    groza Komisijas Īstenošanas regulu (ES) 2017/2470
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/1377 2021 m. rugpjūčio
