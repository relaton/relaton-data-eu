title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 16 décembre 1970, portant octroi du concours
    du Fonds social européen au bénéfice de la République italienne pour des dépenses
    relatives à des opérations de réinstallation effectuées par le "Ministero
    del lavoro et della previdenza sociale"
  type: main
- language: de
  script: Latn
  content: '71/63/EWG: Entscheidung der Kommission vom 16. Dezember 1970 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Republik
    Italien zu Aufwendungen für vom "Ministero del Lavoro e della Previdenza Sociale"
    durchgeführte Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '71/63/CEE: Decisione della Commissione, del 16 dicembre 1970, che concede
    un contributo del Fondo sociale europeo a favore della Repubblica italiana per
    spese concernenti operazioni di nuova sistemazione effettuate dal «Ministero
    del lavoro e della previdenza sociale»'
  type: main
- language: nl
  script: Latn
  content: '71/63/EEG: Beschikking van de Commissie van 16 december 1970 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Italiaanse
    Republiek voor door het "Ministero del Lavoro e della Previdenza Sociale" gemaakte
    verplaatsingskosten'
