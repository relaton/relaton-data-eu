title:
- language: en
  script: Latn
  content: Regulation (EEC) No 232/73 of the Council of 31 January 1973 on the implementation
    of Article 47 of the Act concerning the Conditions of Accession and the Adjustments
    to the Treaties, concerning the system of trade applicable to the goods covered
    by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 232/73 du Conseil, du 31 janvier 1973, fixant les
    modalités d' application de l' article 47 de l' acte relatif aux conditions d'
    adhésion et aux adaptations des traités concernant le régime d' échanges applicable
    aux marchandises relevant du règlement (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 232/73 des Rates vom 31. Januar 1973 über die Durchführungsbestimmungen
    zu Artikel 47 der Akte über die Beitrittsbedingungen und die Anpassungen der
    Verträge betreffend die Handelsregelung der Waren, die unter die Verordnung (EWG)
    Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 232/73 af 31. januar 1973 om gennemførelsesbestemmelserne
    til artikel 47 i Akten vedrørende tiltrædelsesvilkårene og tilpasningerne af
    traktaterne for så vidt angår ordningen for handelen med varer, der omfattes
    af forordning (EØF) nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 232/73 del Consiglio, del 31 gennaio 1973, che stabilisce
    le modalità di applicazione dell' articolo 47 dell' atto relativo alle condizioni
    di adesione e agli adattamenti dei trattati in materia di regime di scambi applicabile
    alle merci di cui al regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 232/73 van de Raad van 31 januari 1973 tot vaststelling
    van de bepalingen ter uitvoering van artikel 47 van de Akte betreffende de toetredingsvoorwaarden
    en de aanpassing der Verdragen, met betrekking tot de handelsregeling die van
    toepassing is op goederen die onder Verordening (EEG) nr. 1059/69 vallen
  type: main
