title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1871/83 of 8 July 1983 fixing the minimum
    price payable to producers for dried plums derived from prunes d' Ente and the
    amount of production aid for prunes for the 1983/84 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1871/83 de la Commission du 8 juillet 1983 fixant,
    pour la campagne 1983/1984, le prix minimal à payer aux producteurs pour les
    prunes d' Ente séchées ainsi que le montant de l' aide à la production pour
    les pruneaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1871/83 der Kommission vom 8. Juli 1983 zur Festsetzung
    des für das Wirtschaftsjahr 1983/84 den Erzeugern von getrockneten Pflaumen (,,prunes
    d' Ente' ' ) zu zahlenden Mindestpreises sowie der Produktionsbeihilfe für Trockenpflaumen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1871/83 af 8. juli 1983 om fastsættelse
    for produktionsåret 1983/84 af den minimumspris, der skal betales til producenterne
    for tørrede "prunes d' Ente" af producentstøtten for svesker
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1871/83 της Επιτροπής
