  content: Council Decision (EU) 2023/983 of 15 May 2023 on the position to be adopted
    on behalf of the European Union within the Group of Experts of the European Agreement
    concerning the work of crews of vehicles engaged in international road transport
    (AETR), within the Working Party on Road Transport of the United Nations Economic
    Commission for Europe and, if relevant, in relation to a communication by the
    United Nations Secretary-General pursuant to Article 21(1) of the AETR, as regards
    an amendment to introduce a ‘force majeure’ clause
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/983 du Conseil du 15 mai 2023 relative à la position
    à adopter au nom de l’Union européenne au sein du groupe d’experts de l’accord
    européen relatif au travail des équipages des véhicules effectuant des transports
    internationaux par route (AETR) et au sein du groupe de travail des transports
    routiers de la Commission économique pour l’Europe des Nations unies, et, le
    cas échéant, relative à la communication du secrétaire général de l’Organisation
    des Nations unies, conformément à l’article 21, paragraphe 1, de l’AETR
    en ce qui concerne un amendement visant à introduire une clause de «force majeure»
  type: main
- language: de
