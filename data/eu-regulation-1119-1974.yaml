title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1119/74 of the Council of 29 April 1974 amending the
    Annex to Regulation (EEC) No 2358/71 on the common organization of the market
    in seeds and Regulation (EEC) No 1674/72 laying down general rules for granting
    and financing aid for seeds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1119/74 du Conseil, du 29 avril 1974, modifiant l'
    annexe du règlement (CEE) n° 2358/71 portant organisation commune des marchés
    dans le secteur des semences et l' article 1er du règlement (CEE) n° 1674/72
    fixant les règles generales de l' octroi et du financement de l'aide dans le
    secteur des semences
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1119/74 des Rates vom 29. April 1974 zur Änderung
    des Anhangs zur Verordnung (EWG) Nr. 2358/71 zur Errichtung einer gemeinsamen
    Marktorganisation für Saatgut und zur Änderung des Artikels 1 der Verordnung
    (EWG) Nr. 1674/72 zur Festlegung der Grundregeln für die Gewährung und die Finanzierung
    der Beihilfe für Saatgut
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1119/74 af 29. april 1974 om ændring af
    bilaget til forordning (EØF) nr. 2358/71 om den fælles markedsordning for frø
    og af artikel 1 i forordning (EØF) nr. 1674/72 om fastsættelse af almindelige
    regler om ydelse og finansiering af støtte, inden for frøsektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1119/74 τού Συμβουλίου
    τής 29ης Απριλίου 1974 περί τροποποιήσεως τού
    παραρτήματος τού κανονισμού (ΕΟΚ) αριθ. 2358/71
    «περί κοινής οργανώσεως τών αγορών στόν τομέα
    τών σπόρων πρός σπορά καί τού άρθρου 1 τού κανονισμού
    (ΕΟΚ) αριθ. 1674/72, περί καθορισμού τών γενικών
    κανόνων χορηγήσεως καί χρηματοδοτήσεως τής
    ενισχύσεως στόν τομέα τών σπόρων πρός σπορά»
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1119/74, annettu 29 päivänä huhtikuuta 1974,
    siemenalan yhteisestä markkinajärjestelystä annetun neuvoston asetuksen (ETY)
    N:o 2358/71 liitteen sekä tukien myöntämisen ja rahoituksen yleisten sääntöjen
    vahvistamisesta siemenalalla annetun asetuksen (ETY) N:o 1674/72 1 artiklan muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1119/74 del Consiglio, del 29 aprile 1974, che modifica
    l' allegato del regolamento (CEE) n. 2358/71 relativo all' organizzazione comune
    dei mercati nel settore delle sementi e l' articolo 1 del regolamento (CEE) n.
    1674/72 che fissa le regole generali per la concessione e il finanziamento dell'
    aiuto nel settore delle sementi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1119/74 van de Raad van 29 april 1974 houdende wijziging
    van de bijlage van Verordening (EEG) nr. 2358/71, houdende een gemeenschappelijke
    ordening der markten in de sector zaaizaad, en van artikel 1 van Verordening (EEG)
