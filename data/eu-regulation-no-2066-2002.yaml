    di alcune denominazioni nel Registro delle denominazioni di origine protette e
    delle indicazioni geografiche protette di cui al regolamento (CEE) n. 2081/92
    del Consiglio relativo alla protezione delle indicazioni geografiche e delle denominazioni
    di origine dei prodotti agricoli e alimentari (Carne de Bovino Cruzado dos Lameiros
    do Barroso, Pruneaux d'Agen — Pruneaux d'Agen mi-cuits, Carciofo romanesco del
    Lazio, Aktinidio Pierias, Milo Kastorias, Welsh Beef)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2066/2002 (2002. gada 21. novembris), ar kuru
    papildina pielikumu Regulai (EK) Nr. 2400/96 par konkrētu nosaukumu iekļaušanu
    “Aizsargāto cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes
    norāžu reģistrā”, kas paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības
    produktu un pārtikas produktu ģeogrāfiskās izcelsmes norāžu un cilmes vietu
