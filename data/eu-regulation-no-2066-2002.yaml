title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2066/2002 of 21 November 2002 supplementing
    the Annex to Regulation (EC) No 2400/96 on the entry of certain names in the Register
    of protected designations of origin and protected geographical indications provided
    for in Council Regulation (EEC) No 2081/92 on the protection of geographical indications
    and designations of origin for agricultural products and foodstuffs (Carne de
    Bovino Cruzado dos Lameiros do Barroso, Pruneaux d'Agen — Pruneaux d'Agen mi-cuits,
    Carciofo romanesco del Lazio, Aktinidio Pierias, Milo Kastorias, Welsh Beef)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2066/2002 de la Commission du 21 novembre 2002 complétant
