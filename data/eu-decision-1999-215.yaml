    lyhdelangan ja paalinarun tuontia koskevan polkumyyntimenettelyn yhteydessä esitettyjen
    hyväksymisestä ja menettelyn sellaisen Saudi-Arabiasta peräisin olevan tuonnin
    osalta päättämisestä (tiedoksiannettu numerolla K(1999) 479)'
  type: main
- language: it
  script: Latn
  content: '1999/215/CE: Decisione della Commissione del 16 marzo 1999 che accetta
