title:
- language: en
  script: Latn
  content: '1999/215/EC: Commission Decision of 16 March 1999 accepting undertakings
    offered in connection with the anti-dumping proceedings concerning imports of
    polypropylene binder or baler twine originating in Poland, the Czech Republic
    and Hungary and terminating the proceeding in respect of such imports originating
    in Saudi Arabia (notified under document number C(1999) 479)'
  type: main
- language: fr
  script: Latn
  content: '1999/215/CE: Décision de la Commission du 16 mars 1999 portant acceptation
    des engagements offerts dans le cadre de la procédure antidumping concernant
    les importations de ficelle lieuse ou botteleuse en polypropylène originaire
    de Pologne, de République tchèque et de Hongrie et clôturant la procédure
    concernant les importations originaires d''Arabie saoudite [notifiée sous le
    numéro C(1999) 479]'
  type: main
- language: de
  script: Latn
  content: '1999/215/EG: Beschluß der Kommission vom 16. März 1999 zur Annahme von
    Verpflichtungsangeboten im Zusammenhang mit dem Antidumpingverfahren betreffend
    die Einfuhren von Binde- oder Pressengarnen aus Polypropylen mit Ursprung in Polen,
    der Tschechischen Republik und Ungarn und zur Einstellung des Verfahrens gegenüber
    solchen Einfuhren mit Ursprung in Saudi-Arabien (Bekanntgegeben unter Aktenzeichen
    K(1999) 479)'
  type: main
- language: da
  script: Latn
  content: '1999/215/EF: Kommissionens afgørelse af 16. marts 1999 om godtagelse
    af tilsagn afgivet i forbindelse med antidumpingproceduren vedrørende importen
    af binde- og pressegarn af polypropylen med oprindelse i Polen, Tjekkiet og Ungarn
    og om afslutning af proceduren med hensyn til importen af sådanne varer med oprindelse
    i Saudi-Arabien (meddelt under nummer K(1999) 479)'
  type: main
- language: el
  script: Grek
