    e che chiude il procedimento nei riguardi di tali importazioni originarie dell''Arabia
    Saudita [notificata con il numero C(1999) 479]'
  type: main
- language: nl
  script: Latn
  content: '1999/215/EG: Besluit van de Commissie van 16 maart 1999 tot aanvaarding
