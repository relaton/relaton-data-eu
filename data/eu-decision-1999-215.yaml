    Μαρτίου 1999 για την αποδοχή των αναλήψεων υποχρεώσεων
    που προτάθηκαν σε συνδυασμό με τη διαδικασία
    αντιντάμπινγκ όσον αφορά τις εισαγωγές σπάγκων
    για δεσίματα ή δεματιάσματα από πολυπροπυλένιο
    καταγωγής Πολωνίας, Τσεχίας και Ουγγαρίας
    και για την περάτωση της διαδικασίας όσον αφορά
    αυτές τις εισαγωγές καταγωγής Σαουδικής Αραβίας
    [κοινοποιηθείσα υπό τον αριθμό Ε(1999) 479]'
  type: main
- language: fi
  script: Latn
  content: '1999/215/EY: Komission päätös, tehty 16 päivänä maaliskuuta 1999,
