    de chuid na Spáinne (na hOileáin Bhailéaracha)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/755 оd 29. veljače 2024. o produljenju
    odstupanja od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu minimalne udaljenosti
    od obale i minimalne dubine mora za potegače otvorenog mora koje love mliječa
    ružičnog i mliječa pučinskog (Aphia minuta i Pseudaphia ferreri) te giru oblicu
    (Spicara smaris) u određenim teritorijalnim vodama Španjolske (Balearski otoci)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/755 végrehajtási rendelete (2024. február 29.)
    az 1967/2006/EK tanácsi rendelettől a Spanyolország egyes felségvizein (Baleár-szigetek)
    az üveggébre és a Ferrer-gébre (Aphia minuta és Pseudaphia ferreri), valamint
    a nyurga durbincsra (Spicara smaris) irányuló halászatban alkalmazott, hajóról
    működtetett kerítőhálók telepítésének mélysége és parttól számított
    távolsága tekintetében való eltérés meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/755 della Commissione, del 29 febbraio
    2024, che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto concerne la distanza minima dalla costa e la profondità minima per le
    sciabiche da natante utilizzate per la pesca del rossetto e del ghiozzo di Ferrer
    (Aphia minuta e Pseudaphia ferreri) e dello zerro (Spicara smaris) in talune acque
    territoriali della Spagna (Isole Baleari)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/755 (2024. gada 29. februāris),
    ar kuru attiecībā uz minimālo attālumu no krasta un minimālo jūras dziļumu,
    kas dažos Spānijas (Baleāru salu) teritoriālo ūdeņu apgabalos jāievēro
    stikla jūrasgrunduļa (Aphia minuta), Ferreri jūrasgrunduļa (Pseudaphya ferreri)
    un smarīdas (Spicara smaris) zvejā ar laivas velkamajiem vadiem, pagarina atkāpi
    no Padomes Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: 2024 m. vasario 29 d. Komisijos įgyvendinimo reglamentas (ES) 2024/755,
    kuriuo pratęsiamas nuostatos, leidžiančios nukrypti nuo Tarybos reglamento
    (EB) Nr. 1967/2006 nuostatų dėl minimalaus atstumo nuo kranto ir minimalaus
    jūros gylio reikalavimų, galiojimas laivų traukiamaisiais tinklais žvejojant
    afijas bei Ferero grundalus (Aphia minuta ir Pseudaphya ferreri) ir paprastąsias
    smarides (Spicara smaris) tam tikruose Ispanijos (Balearų salų) teritoriniuose
    vandenyse
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/755 tad-29
    ta’ Frar 2024 li testendi d-deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    fir-rigward tad-distanza minima mill-kosta u l-fond minimu tal-baħar għat-tartaruni
    li jistadu għall-makku u l-makku ferreri (Aphia minuta u Pseudaphia ferreri)
    u għall-arżnell (Spicara smaris) f’ċerti ilmijiet territorjali ta’ Spanja
    (il-Gżejjer Baleariċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/755 van de Commissie van 29 februari 2024
    tot verlenging van de afwijking van Verordening (EG) nr. 1967/2006 van de Raad
    wat betreft de minimumafstand van de kust en de minimumzeediepte voor bootzegens
    voor de visserij op glasgrondel (Aphia minuta), Ferrer’s grondel (Pseudaphia
    ferreri) en picarel (Spicara smaris) in bepaalde territoriale wateren van Spanje
    (Balearen)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/755 z dnia 29 lutego 2024
    r. w sprawie przedłużenia odstępstwa od rozporządzenia Rady (WE) nr 1967/2006
    w odniesieniu do minimalnych odległości od brzegu i minimalnej głębokości
    morza dla niewodów pełnomorskich do połowu babki przezroczystej i babki Ferrera
    (Aphia minuta and Pseudaphia ferreri) oraz pysonia smukłego (Spicara smaris)
    na niektórych wodach terytorialnych Hiszpanii (Baleary)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/755 da Comissão, de 29 de fevereiro
    de 2024, que prorroga a derrogação do Regulamento (CE) n.o 1967/2006 do Conselho
    no respeitante à distância mínima da costa e à profundidade mínima para as
    redes envolventes-arrastantes de alar para bordo utilizadas na pesca do caboz-transparente
    e do caboz-de-ferrer (Aphia minuta e Pseudaphia ferreri) e do trombeiro-boga (Spicara
    smaris) em determinadas águas territoriais de Espanha (Ilhas Baleares)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/755 al Comisiei din 29 februarie
    2024 de prelungire a derogării de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește distanța minimă față de coastă și adâncimea minimă
    a mării pentru năvoadele de navă utilizate pentru pescuitul de guvid alb și
    guvid Ferrer (Aphia minuta și Pseudaphia ferreri) și de smarid comun (Spicara
    smaris) în anumite ape teritoriale ale Spaniei (Insulele Baleare)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/755 z 29. februára 2024 o predĺžení
    platnosti výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ ide o minimálnu
    vzdialenosť od pobrežia a minimálnu hĺbku mora pri love afie priesvitnej (Aphia
    minuta), afie Ferrerovej (Pseudaphia ferreri) a spikáry štíhlej (Spicara smaris)
    záťahovými sieťami ovládanými z lode v určitých pobrežných vodách Španielska
    (Baleárske ostrovy)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/755 z dne 29. februarja 2024 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede najmanjše oddaljenosti od
    obale in najmanjše morske globine za potegalke odprtega morja za lovljenje belega
    in ferrerjevega glavača (Aphia minuta in Pseudaphia ferreri) ter girice (Spicara
    smaris) v določenih teritorialnih vodah Španije (Balearski otoki)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/755 de la Comisión, de 29 de febrero
    de 2024, por el que se prorroga la excepción a lo dispuesto en el Reglamento
    (CE) n.o 1967/2006 del Consejo en lo concerniente a la distancia mínima de la
    costa y la profundidad marina mínima en el caso de las redes de tiro desde embarcación
    para la pesca de chanquete y cabotí (Aphia minuta y Pseudaphia ferreri) y de
    caramel (Spicara smaris) en determinadas aguas territoriales de España (Illes
    Balears)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/755 av den 29 februari
    2024 om förlängning av undantaget från rådets förordning (EG) nr 1967/2006
    vad gäller minsta avstånd från kusten och minsta djup för fartyg som använder
    vad-/notredskap vid fiske efter klarbult och Ferrers smörbult (Aphia minuta och
    Pseudaphia ferreri) samt menolapikarell (Spicara Smaris) i vissa av Spaniens territorialvatten
    (Balearerna)
