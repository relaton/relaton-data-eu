    на дерогацията от Регламент (ЕО) № 1967/2006 на
    Съвета по отношение на минималното разстояние
    от брега и минималната дълбочина за улов на
    стъкленка (Аphia minuta), на Ферерово попче (Pseudaphia
    ferreri) и на смарид (Spicara smaris) с корабни грибове
    в част от териториалните води на Испания (Балеарски
    острови)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/755 ze dne 29. února 2024, kterým
    se prodlužuje odchylka od nařízení Rady (ES) č. 1967/2006, pokud jde o minimální
    vzdálenost od pobřeží a minimální hloubku moře pro lodní nevody k lovu
    hlaváče průsvitného (Aphia minuta), hlaváče Ferrerova (Pseudaphia ferreri)
