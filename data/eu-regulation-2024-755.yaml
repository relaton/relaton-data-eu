    så vidt angår mindsteafstanden fra kysten og mindstedybden for anvendelsen af
    vod brugt fra fartøjer, der fisker efter glaskutling (Aphia minuta), Ferrers
    kutling (Pseudaphia ferreri) og slank pikarel (Spicara smaris) i visse spanske
    territorialfarvande (Balearerne)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/755 της Επιτροπής,
