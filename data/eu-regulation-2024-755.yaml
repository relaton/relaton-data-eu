    ón gComhairle a mhéid a bhaineann leis an bhfad íosta ón gcósta agus doimhneacht
    íosta na mara a dheonaítear do shaighní báid lena ndéantar iascaireacht ar
    an mac siobháin trédhearcach agus ar mhac siobháin Ferrer (Aphia minuta agus
