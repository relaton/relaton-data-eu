title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/755 of 29 February 2024 on
    extending the derogation from Council Regulation (EC) No 1967/2006 as regards
    the minimum distance from the coast and the minimum sea depth for boat seines
    fishing for transparent and Ferrer’s gobies (Aphia minuta and Pseudaphia ferreri)
    and Lowbody picarel (Spicara smaris) in certain territorial waters of Spain (Balearic
    Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/755 de la Commission du 29 février
    2024 portant prolongation de la dérogation au règlement (CE) no 1967/2006 du
    Conseil en ce qui concerne la distance minimale de la côte et la profondeur minimale
    pour les sennes de bateau pêchant le gobie transparent et le gobie de Ferrer
    (Aphia minuta et Pseudaphia ferreri) ainsi que le picarel commun (Spicara smaris)
    dans certaines eaux territoriales de l’Espagne (îles Baléares)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/755 der Kommission vom 29. Februar 2024
    zur Verlängerung der Ausnahme von der Verordnung (EG) Nr. 1967/2006 des Rates
    hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe für
    Bootswaden für den Fang von Glas- und Ferrer-Grundeln (Aphia minuta und Pseudaphia
    ferreri) sowie Pikarels (Spicara smaris) in bestimmten Hoheitsgewässern Spaniens
    (Balearen)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/755 на Комисията
