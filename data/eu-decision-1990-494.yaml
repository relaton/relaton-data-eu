    διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    σχετικά με φυτά του Picea A. που προέρχονται από
    τις Ηνωμένες Πολιτείες της Αμερικής (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '90/494/CEE: Decisione della Commissione del 26 settembre 1990 che autorizza
