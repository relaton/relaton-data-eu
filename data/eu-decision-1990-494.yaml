title:
- language: en
  script: Latn
  content: '90/494/EEC: Commission Decision of 26 September 1990 authorizing France
    provisionally to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of plants of Picea A. originating in the United States of
    America (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/494/CEE: Décision de la Commission du 26 septembre 1990 autorisant
    la France à prévoir provisoirement des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour les végétaux de Picea A. originaires
    des Etats-Unis d''Amérique (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '90/494/EWG: Entscheidung der Kommission vom 26. September 1990 ueber die
    Ermaechtigung Frankreichs, voruebergehend Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates in bezug auf Pflanzen von Picea A. aus den
    Vereinigten Staaten von Amerika vorzusehen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/494/EØF: Kommissionens beslutning af 26. september 1990 om bemyndigelse
