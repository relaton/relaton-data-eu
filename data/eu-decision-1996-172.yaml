  script: Latn
  content: '96/172/EC: Decision No 160 of 28 November 1995 concerning the scope of
    Article 71 (1) (b) (ii) of Council Regulation (EEC) No 1408/71 relating to the
    right to unemployment benefits of workers, other than frontier workers, who, during
    their last employment, were residing in the territory of a Member State other
    than the competent State'
  type: main
- language: fr
  script: Latn
