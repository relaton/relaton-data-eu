title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 juin 1967, portant prorogation de la
    durée de validité et augmentation du volume du contingent tarifaire que le Royaume
    des Pays- Bas a été autorisé à ouvrir pour le plomb
  type: main
- language: de
  script: Latn
  content: '67/465/EWG: Entscheidung der Kommission vom 30. Juni 1967 zur Verlängerung
    der Geltungsdauer und Erhöhung der Kontingentsmenge des dem Königreich der Niederlande
    gewährten Zollkontingents für Rohblei'
  type: main
- language: it
  script: Latn
  content: '67/465/CEE: Decisione della Commissione, del 30 giugno 1967, che proroga
    la validità ed aumenta il volume del contingente tariffario che il Regno dei
    Paesi Bassi è stato autorizzato ad aprire per il piombo greggio'
  type: main
- language: nl
  script: Latn
  content: '67/465/EEG: Beschikking van de Commissie van 30 juni 1967 houdende verlenging
    van de periode van geldigheid, alsmede vergroting van het tariefcontingent dat
    het Koninkrijk der Nederlanden gemachtigd is in te stellen voor ruw lood'
  type: main
