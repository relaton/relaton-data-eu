title:
- language: en
  script: Latn
  content: '79/325/EEC: Commission Decision of 14 March 1979 authorizing the Italian
    Republic not to apply Community treatment to shirts, T-shirts, lightweight fine
    knit roll, polo or turtle neck jumpers and pullovers, undervests and the like,
    knitted or crocheted, not elastic or rubberized, other than babies''garments,
    of cotton or synthetic textile fibres; T-shirts and lightweight fine knit roll,
    polo or turtle neck jumpers and pullovers of regenerated textile fibres, falling
    within heading No ex 60.04 of the Common Customs Tariff (NIMEXE codes 60.04-01,
    05, 13, 18, 28, 29, 30, 41, 50, 58) (category 4), originating in Macao and in
    free circulation in the other Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/325/CEE: Décision de la Commission, du 14 mars 1979, autorisant la
    République italienne à exclure du traitement communautaire les chemises, chemisettes,
    "T- shirts", sous-"pulls", maillots de corps et articles similaires autres que
    vêtements pour bébés, de coton ou de fibres textiles synthétiques; "T-shirts"
    et sous- "pulls" de fibres artificielles, de la position ex 60.04 du tarif douanier
    commun (codes Nimexe: 60.04-01, 05, 13, 18, 28, 29, 30, 41, 50, 58) catégorie
    4, originaires de Macao et mis en libre pratique dans les autres Etats membres
    (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/325/EWG: Entscheidung der Kommission vom 14. März 1979, mit der die
    Italienische Republik ermächtigt wird, aus Macau stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Oberhemden, T-Shirts, Unterziehpullis,
    Unterhemden und dergleichen, aus Gewirken, weder gummielastisch noch kautschutiert,
    andere als Säuglingskleidung, aus Baumwolle oder synthetischen Spinnstoffen;
    T-Shirts und Unterziehpullis aus künstlichen Spinnstoffen der Tarifnummer ex
    60.04 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.04-01, 05, 13, 18, 28,
    29, 30, 41, 50, 58) (Kategorie 4) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/325/EØF: Kommissionens beslutning af 14. marts 1979 om bemyndigelse
    af Den italienske Republik fra fællesskabsbehandling at undtage skjorter, herunder
    sports- og arbejdsskjorter, T-shirts, T-shirts med rullekrave, undertrøjer o.lign.,
    bortset fra beklædningsgenstande til spædbørn, af bomuld eller syntetiske fibre,
    T-shirts og T-shirts med rullekrave af regenererede fibre, som henhører under
    pos. ex 60.04 i den fælles toldtarif (NIMEXE-nummer 60.04-01, 05, 13, 18, 28,
    29, 30, 41, 50, 58; kategori 4), har oprindelse i Macao og frit kan omsættes
    i de øvrige medlemsstater (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/325/CEE: Decisione della Commissione, del 14 marzo 1979, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario camicie, camicette,
    T- shirts, magliette a collo alto, camiciole e articoli affini, a maglia non elastica
    né gommata, diversi dagli indumenti per bambini piccoli (bébés), di cotone
    o di fibre tessili sintetiche, T-shirts e magliette a collo alto di fibre artificiali,
    della voce ex 60.04 della tariffa doganale comune (codice Nimexe: 60.04-01, 05,
    13, 18, 28, 29, 30, 41, 50, 58), categoria 4, originari di Macao e messi in libera
    pratica negli altri Stati membri (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/325/EEG: Beschikking van de Commissie van 14 maart 1979 waarbij de
    Italiaanse Republiek wordt gemachtigd overhemden en sporthemden, T-shirts, onderjumpers,
    hemdtruien, sous-pulls, tricotpakken, maillots de corps en dergelijke artikelen
    van niet-elastisch of van niet- gegummeerd brei- of haakwerk, andere dan kledingstukken
    voor baby''s, van katoen of van synthetische textielvezels, T-shirts en sous-pulls
    van kunstmatige vezels, van post ex 60.04, van het gemeenschappelijk douanetarief
    (NIMEXE-code : 60.04-01, 05, 13, 18, 28, 29, 30, 41, 50, 58) categorie 4, van
    oorsprong uit Macao en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Italiaanse
    taal is authentiek)'
