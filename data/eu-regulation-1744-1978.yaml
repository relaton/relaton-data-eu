title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1744/78 of 24 July 1978 extending certain interim
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of Spain, to 30 September 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1744/78 du Conseil, du 24 juillet 1978, prorogeant
    jusqu'au 30 septembre 1978 certaines mesures intérimaires de conservation et
    de gestion des ressources de pêche applicables aux navires battant pavillon de
    l'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1744/78 des Rates vom 24. Juli 1978 zur Verlängerung
    bestimmter Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    gegenüber Schiffen, die die Flagge Spaniens führen, bis zum 30. September 1978
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1744/78 af 24. juli 1978 om forlængelse
    indtil den 30. september 1978 af en række midlertidige foranstaltninger til bevarelse
    og forvaltning af fiskeressourcerne, som skal finde anvendelse på fartøjer,
    der fører Spaniens flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1744/78 del Consiglio, del 24 luglio 1978, che proroga
    fino al 30 settembre 1978 talune misure provvisorie per la conservazione e la
    gestione delle risorse ittiche da applicare alle navi battenti bandiera della
    Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1744/78 van de Raad van 24 juli 1978 houdende verlenging
    tot en met 30 september 1978 van bepaalde overgangsmaatregelen voor de instandhouding
    en het beheer van de visbestanden, die van toepassing zijn op vaartuigen die de
    vlag van Spanje voeren
