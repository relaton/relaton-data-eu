    des Rates im Hinblick auf die Festlegung der Kosten je Einheit und der Beträge
    der nicht mit Kosten verknüpften Finanzierungen für bestimmte Vorhaben zur besseren
    Eingliederung junger Menschen in den Arbeitsmarkt, das Bildungssystem und die
    Gesellschaft im Rahmen der Initiative ALMA (Aim, Learn, Master, Achieve — Anvisieren,
    Lernen, Meistern, Ankommen)
  type: main
