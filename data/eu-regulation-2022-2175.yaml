title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2175 of 5 August 2022 supplementing
    Regulation (EU) 2021/1060 of the European Parliament and of the Council regarding
    the definition of unit costs and establishment of amounts for financing not linked
    to costs for certain operations facilitating the integration of young persons
    into the labour market, education and society in the framework of the ‘Aim,
    Learn, Master, Achieve’ (ALMA) initiative
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2175 de la Commission du 5 août 2022 complétant
    le règlement (UE) 2021/1060 du Parlement européen et du Conseil en ce qui concerne
    la définition des coûts unitaires et l’établissement de montants pour un
    financement non lié aux coûts de certaines opérations facilitant l’intégration
    des jeunes sur le marché du travail, l’éducation et la société dans le cadre
    de l’initiative «Aim, Learn, Master, Achieve» (ALMA)
  type: main
- language: de
  script: Latn
