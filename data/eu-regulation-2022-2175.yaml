    kas nav saistīts ar izmaksām par konkrētām darbībām, ar kurām iniciatīvas
    “Aim, Learn, Master, Achieve – Orientācija, Mācības, Meistarība, Rezultāts”
    (ALMA) ietvaros veicina jauniešu integrāciju darba tirgū, izglītībā un sabiedrībā,
