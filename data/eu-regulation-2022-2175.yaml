    che integra il regolamento (UE) 2021/1060 del Parlamento europeo e del Consiglio
    per quanto riguarda la definizione dei costi unitari e la fissazione degli importi
    per i finanziamenti non collegati ai costi di alcune operazioni che facilitano
    l’inserimento dei giovani nel mercato del lavoro, nell’istruzione e nella
    società nell’ambito dell’iniziativa ALMA (Aim, Learn, Master, Achieve - Aspirare,
    Imparare, Conoscere, Conseguire)
  type: main
- language: lv
  script: Latn
