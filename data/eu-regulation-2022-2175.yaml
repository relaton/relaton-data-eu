    integracijai į darbo rinką, švietimą ir visuomenę, vieneto įkainių apibrėžties
    ir su išlaidomis nesiejamo finansavimo sumų nustatymo įgyvendinant iniciatyvą
    ALMA (Siekti, mokytis, išmokti ir pasiekti), papildomas Europos Parlamento ir
