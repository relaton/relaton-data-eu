title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 167/96 of 29 January 1996 renewing measures
    laid down in Annex I and II to Regulation (EC) No 1917/95 establishing certain
    measures concerning imports of processed agricultural products from Iceland, Norway
    and Switzerland in order to take account of the results of the Uruguay Round negotiations
    in the agricultural sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 167/96 du Conseil, du 29 janvier 1996, portant reconduction
    des mesures prévues aux annexes I et II du règlement (CE) n 1917/95 établissant
    certaines mesures concernant l'importation de produits agricoles transformés
    d'Islande, de Norvège et de Suisse pour tenir compte des résultats des négociations
    de l'Uruguay Round dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 167/96 des Rates vom 29. Januar 1996 zur Verlängerung
    der Maßnahmen in den Anhängen I und II der Verordnung (EG) Nr. 1917/95 über
    bestimmte Maßnahmen betreffend die Einfuhr von landwirtschaftlichen Verarbeitungserzeugnissen
    aus Island, Norwegen und der Schweiz im Hinblick auf die Ergebnisse der Verhandlungen
    der Uruguay-Runde im Agrarbereich
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 167/96 af 29. januar 1996 om videreførelse
    af foranstaltningerne i bilag I og II til forordning (EF) nr. 1917/95 om visse
    foranstaltninger vedrørende import af forarbejdede landbrugsprodukter fra Island,
    Norge og Schweiz for at tage hensyn til resultaterne af Uruguay-rundens forhandlinger
    på landbrugsområdet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 167/96 του Συμβουλίου,
    της 29ης Ιανουαρίου 1996, περί παρατάσεως των
    μέτρων που προβλέπονται στα παραρτήματα Ι
    και ΙΙ του κανονισμού (ΕΚ) αριθ. 1917/95 για τη θέσπιση
    ορισμένων μέτρων σχετικών με την εισαγωγή
    μεταποιημένων γεωργικών προϊόντων από την
    Ισλανδία, τη Νορβηγία και την Ελβετία προκειμένου
    να ληφθούν υπόψη τα αποτελέσματα των διαπραγματεύσεων
    του Γύρου της Ουρουγουάης στο γεωργικό τομέα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 167/96, annettu 29 päivänä tammikuuta 1996,
    jalostettujen maataloustuotteiden tuontia Islannista, Norjasta ja Sveitsistä
    koskevien tiettyjen toimenpiteiden toteuttamisesta Uruguayn kierroksen neuvottelujen
    tulosten huomioon ottamiseksi maatalouden alalla annetun asetuksen (EY) N:o 1917/95
    liitteissä I ja II määrättyjen toimenpiteiden jatkamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 167/96 del Consiglio, del 29 gennaio 1996, che proroga
    le misure previste dagli allegati I e II del regolamento (CE) n. 1917/95 che stabilisce
    talune misure relative alle importazioni di prodotti agricoli trasformati provenienti
    dell'Islanda, dalla Norvegia e dalla Svizzera per tener conto dei risultati dei
    negoziati dell'Uruguay Round nel settore agricolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 167/96 van de Raad van 29 januari 1996 tot verlenging
    van de maatregelen bedoeld in de bijlagen I en II van Verordening (EG) nr. 1917/95
    tot vaststelling van bepaalde maatregelen betreffende de invoer van be- en verwerkte
    landbouwprodukten uit IJsland, Noorwegen en Zwitserland om rekening te houden
    met de resultaten van de in het kader van de Uruguay- Ronde gevoerde onderhandelingen
    in de landbouwsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 167/96 do Conselho, de 29 de Janeiro de 1996, que
    prorroga as medidas previstas nos anexos I e II do Regulamento (CE) nº 1917/95
    que estabelece certas medidas relativas à importação de produtos agrícolas
    transformados da Islândia, da Noruega e da Suíça de forma a ter em conta o
    resultado das negociações do «Uruguay Round» no sector agrícola
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 167/96 del Consejo, de 29 de enero de 1996, que prorroga
    las medidas establecidas en los Anexos I y II del Reglamento (CE) nº 1917/95
    por el que se establecen medidas relativas a las importaciones de productos agrícolas
    transformados de Islandia, de Noruega y de Suiza, a fin de tener en cuenta los
    resultados de las negociaciones de la Ronda Uruguay en el sector agrícola
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 167/96 av den 29 januari 1996 om förlängning
    av åtgärder som avses i bilaga I och II till förordning (EG) nr 1917/95 om
    vissa åtgärder vid import av bearbetade jordbruksprodukter från Island, Norge
    och Schweiz med hänsyn tagen till resultaten från Uruguayrundans förhandlingar
    på jordbruksområdet
  type: main
