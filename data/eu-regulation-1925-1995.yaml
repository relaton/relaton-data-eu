title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1925/95 of 3 August 1995 determining the
    extent to which applications lodged in July 1995 for certain milk and milk products
    covered by the arrangements provided for in the free-trade Agreements concluded
    by the Community with the Republic of Estonia, the Republic of Latvia and the
    Republic of Lithuania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1925/95 de la Commission, du 3 août 1995, déterminant
    la mesure dans laquelle les demandes de licences d' importation introduites en
    juillet 1995 pour certains produits dans le secteur du lait et des produits laitiers
    dans le cadre du régime prévu par les accords sur la libéralisation des échanges
    conclus par la Communauté avec les pays baltes peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1925/95 der Kommission vom 3. August 1995 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im Juli 1995 für
    die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    einerseits und den Republiken Estland, Lettland und Litauen andererseits geschlossenen
    Abkommen über Freihandel und Handelsfragen beantragt wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1925/95 af 3. august 1995 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i juli 1995 for visse
    produkter i sektoren for mælk og mejeriprodukter kan imødekommes under den ordning,
    der er fastsat i frihandelsaftalerne mellem Fællesskabet og Republikken Estland,
    Republikken Letland og Republikken Litauen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1925/95 της Επιτροπής
