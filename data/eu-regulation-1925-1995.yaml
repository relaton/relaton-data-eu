    αποδοχής των αιτήσεων για άδειες εισαγωγής
    που υποβάλλονται τον Ιούλιο 1995, για ορισμένα
    προϊόντα στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων στα πλαίσια του καθεστώτος που προβλέπεται
    από τις συμφωνίες απελευθέρωσης των συναλλαγών
    που έχει συνάψει η Κοινότητα με τη Δημοκρατία
    της Εσθονίας, τη Δημοκρατία της Λετονίας και
    τη Δημοκρατία της Λιθουανίας
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1925/95, annettu 3 päivänä elokuuta 1995,
    yhteisön sekä Viron tasavallan, Latvian tasavallan ja Liettuan tasavallan kanssa
    tehdyissä vapaakauppasopimuksissa määrätyn järjestelmän mukaisesti heinäkuussa
    1995 esitettyjen tiettyjen maito- ja maitotuotealan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1925/95 della Commissione, del 3 agosto 1995, che stabilisce
    entro quali limiti possono essere accettate le domande di titoli di importazione
    presentate nel mese di luglio 1995 per taluni prodotti del settore lattiero-caseario
    nel quadro del regime previsto dagli accordi di liberalizzazione degli scambi
    conclusi tra la Comunità e la Repubblica estone, la Repubblica lettone e la Repubblica
    lituana
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1925/95 van de Commissie van 3 augustus 1995 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de invoercertificaataanvragen
    voor bepaalde produkten in de sector melk en zuivelprodukten, die in juli 1995
    zijn ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Overeenkomsten betreffende vrijhandel met de Republiek Estland, de Republiek
    Letland en de Republiek Litouwen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1925/95 da Comissão, de 3 de Agosto de 1995, que
    determina a medida em que podem ser aceites os pedidos de licença de importação,
    apresentados em Julho de 1995, para determinados produtos do sector do leite e
    dos produtos lácteos, no âmbito do regime previsto nos acordos de comércio
    livre concluídos pela Comunidade com a República da Estónia, a República da
    Letónia e a República da Lituânia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1925/95 de la Comisión, de 3 de agosto de 1995, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación presentadas en julio de 1995 de algunos productos del sector de
    la leche y de los productos lácteos al amparo del régimen previsto en los Acuerdos
    de libre comercio celebrados por la Comunidad con la República de Estonia, la
    República de Letonia y la República de Lituania
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1925/95 av den 3 augusti 1995 om fastställande
    av i vilken utsträckning det är möjligt att godkänna ansökningar, som har
    lämnats in i juli 1995, om importlicenser för vissa mjölkprodukter och produkter
    som omfattas av den ordning som fastställs i avtalen om frihandel mellan gemenskapen
    å ena sidan och Estland, Lettland och Litauen å andra sidan
