    Rates durch Festlegung der technischen Bedingungen und Verfahren, unter denen
    die Anbieter sehr großer Online-Plattformen und sehr großer Online-Suchmaschinen
    zugelassenen Forschenden Daten zur Verfügung stellen müssen
  type: main
- language: bg
