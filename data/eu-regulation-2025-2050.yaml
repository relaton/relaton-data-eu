- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/2050 of 1 July 2025 supplementing
    Regulation (EU) 2022/2065 of the European Parliament and of the Council by laying
    down the technical conditions and procedures under which providers of very large
    online platforms and of very large online search engines are to share data with
    vetted researchers
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/2050 de la Commission du 1er juillet 2025
    complétant le règlement (UE) 2022/2065 du Parlement européen et du Conseil
    en établissant les conditions et procédures techniques selon lesquelles les
    fournisseurs de très grandes plateformes en ligne et de très grands moteurs
    de recherche en ligne doivent partager des données avec des chercheurs agréés
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/2050 der Kommission vom 1. Juli 2025 zur
