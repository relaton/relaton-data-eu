    par le Bureau du surintendant des institutions financières avec certaines des
    exigences de l’article 11 du règlement (UE) no 648/2012 du Parlement européen
    et du Conseil sur les produits dérivés de gré à gré, les contreparties centrales
    et les référentiels centraux
