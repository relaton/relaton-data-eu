title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1104 of 5 July 2021 on the recognition
    of the legal, supervisory and enforcement arrangements of Canada for derivatives
    transactions supervised by the Office of the Superintendent of Financial Institutions
    as equivalent to certain requirements of Article 11 of Regulation (EU) No 648/2012
    of the European Parliament and of the Council on OTC derivatives, central counterparties
    and trade repositories
  type: main
- language: fr
