type: standard
title:
- language: en
  script: Latn
  content: '2004/212/EC: Commission Decision of 6 January 2004 on Community health
    conditions on imports of animals and fresh meat including minced meat from third
    countries and amending Decisions 79/542/EEC, 2000/572/EC and 2000/585/EC (notified
    under document number C(2003) 5248)'
  type: main
- language: fr
  script: Latn
  content: '2004/212/CE: Décision de la Commission du 6 janvier 2004 relative aux
    conditions sanitaires communautaires applicables aux importations d''animaux et
    de viandes fraîches, y compris de viandes hachées, en provenance des pays tiers,
    et modifiant les décisions 79/542/CEE, 2000/572/CE et 2000/585/CE [notifée sous
    le numéro C(2003) 5248]'
  type: main
- language: de
  script: Latn
  content: '2004/212/EG: Entscheidung der Kommission vom 6. Januar 2004 über die
    Veterinärbedingungen der Gemeinschaft für die Einfuhr von lebenden Tieren und
    frischem Fleisch, einschließlich Hackfleisch/Faschiertem, aus Drittländern und
    zur Änderung der Entscheidungen 79/542/EWG, 2000/572/EG und 2000/585/EG (Bekannt
    gegeben unter Aktenzeichen K(2003) 5248)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 6 януари 2004 година
    относно здравните условия на Общността, приложими
    при внос на животни и прясно месо, включително
    мляно месо от трети страни, и за изменение на
    Решения 79/542/ЕИО, 2000/572/ЕО и 2000/585/ЕО (нотифицирано
    под номер С(2003)5248)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 6. ledna 2004 o veterinárních podmínkách
    Společenství pro dovoz živých zvířat a čerstvého masa včetně mletého
    masa ze třetích zemí a o změně rozhodnutí 79/542/EHS, 2000/572/ES a 2000/585/ES
    (oznámeno pod číslem K(2003) 5248)
  type: main
- language: da
  script: Latn
  content: '2004/212/EF: Kommissionens beslutning af 6. januar 2004 om EF-sundhedsbetingelser
    for import af dyr og fersk kød, herunder hakket kød, fra tredjelande og om ændring
    af beslutning 79/542/EØF, 2000/572/EF og 2000/585/EF (meddelt under nummer K(2003)
    5248)'
  type: main
- language: el
  script: Grek
  content: '2004/212/ΕΚ: Απόφαση της Επιτροπής, της 6ης
    Ιανουαρίου 2004, για τους κοινοτικούς υγειονομικούς
    όρους σχετικά με την εισαγωγή ζώων και νωπών
    κρεάτων, συμπεριλαμβανομένων των κιμάδων,
    από τρίτες χώρες και για τροποποίηση των αποφάσεων
    79/542/ΕΟΚ, 2000/572/ΕΚ και 2000/585/ΕΚ [κοινοποιηθείσα
    υπό τον αριθμό Ε(2003) 5248]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 6. jaanuar 2004, ühenduse tervishoiunõuete kohta loomade
    ja värske liha, sealhulgas hakkliha, importimisel kolmandatest riikidest, millega
    muudetakse otsuseid 79/542/EMÜ, 2000/572/EÜ ja 2000/585/EÜ (teatavaks tehtud
    numbri K(2003) 5248 all)
  type: main
- language: fi
  script: Latn
  content: '2004/212/EY: Komission päätös, tehty 6 päivänä tammikuuta 2004,
    yhteisön terveysvaatimuksista eläinten ja tuoreen lihan, jauheliha mukaan luettuna,
    tuonnissa kolmansista maista ja päätösten 79/542/ETY, 2000/572/EY ja 2000/585/EY
    muuttamisesta (tiedoksiannettu numerolla K(2003) 5248)'
  type: main
- language: hr
  script: Latn
  content: '2004/212/EZ: Odluka Komisije od 6. siječnja 2004. o zdravstvenim uvjetima
    Zajednice za uvoz životinja i svježeg mesa uključujući mljeveno meso iz trećih
    zemalja te o izmjeni odluka 79/542/EEZ, 2000/572/EZ i 2000/585/EZ (priopćena
    pod brojem dokumenta C(2003) 5248)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2004. január 6.) az állatok és a friss hús,
    ezen belül a darált hús harmadik országokból történő behozatalának közösségi
    egészségügyi feltételeiről, valamint a 79/542/EGK, a 2000/572/EK és a 2000/585/EK
    határozat módosításáról (az értesítés a C(2003) 5248. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: '2004/212/CE: Decisione della Commissione, del 6 gennaio 2004, relativa
    alle condizioni sanitarie comunitarie applicabili alle importazioni di animali
    e di carni fresche, incluse le carni macinate, in provenienza dai paesi terzi
    e recante modifica delle decisioni 79/542/CEE, 2000/572/CE e 2000/585/CE [notificata
    con il numero C(2003) 5248]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2004. gada 6. janvāris), ar ko nosaka Kopienas veselības
    nosacījumus attiecībā uz dzīvniekiem un svaigu gaļu, ietverot maltu gaļu,
    no trešām valstīm un ar ko groza Lēmumus 79/542/EEK, 2000/572/EK un 2000/585/EK
    (izziņots ar dokumenta numuru C(2003) 5248)
  type: main
- language: lt
  script: Latn
  content: 2004 m. sausio 6 d. Komisijos sprendimas dėl Bendrijos sveikatos reikalavimų
    iš trečiųjų šalių importuojant gyvūnus ir šviežią mėsą, įskaitant
    maltą mėsą, iš dalies keičiantis Sprendimus 79/542/EEB, 2000/572/EB ir 2000/585/EB
    (pranešta dokumentu Nr. C(2003) 5248)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-6 ta' Jannar 2004 dwar il-kondizzjonijiet
    tas-saħħa tal-Komunità ta' l-importi ta' l-annimali u l-laħam frisk, inkluż
    l-ikkapuljat minn pajjiżi terzi, u li temenda d-Deċiżjonijiet 79/542/KEE, 2000/572/KE
    u 2000/585/KE (innotifikata bid-dokument numru K(2003) 5248)
  type: main
- language: nl
  script: Latn
  content: '2004/212/EG: Beschikking van de Commissie van 6 januari 2004 tot vaststelling
    van gezondheidsvoorschriften van de Gemeenschap voor de invoer van dieren en van
    vers vlees, met inbegrip van gehakt vlees, uit derde landen en tot wijziging van
    de Beschikkingen 79/542/EEG, 2000/572/EG en 2000/585/EG (Kennisgeving geschied
    onder nummer C(2003) 5248)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 6 stycznia 2004 r. w sprawie wspólnotowych warunków
    zdrowotnych dla przywozu zwierząt oraz świeżego mięsa łącznie z mięsem
    mielonym z państw trzecich i zmieniająca decyzje 79/542/EWG, 2000/572/WE i 2000/585/WE
    (notyfikowana jako dokument nr C(2003) 5248)
  type: main
- language: pt
  script: Latn
  content: '2004/212/CE: Decisão da Comissão, de 6 de Janeiro de 2004, que diz respeito
    às condições sanitárias comunitárias aplicáveis às importações de animais
    e de carne fresca, incluindo a carne picada, de países terceiros e que altera
    as Decisões 79/542/CEE, 2000/572/CE e 2000/585/CE [notificada com o número C(2003)
    5248]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 6 ianuarie 2004 privind condițiile de sănătate
    comunitare referitoare la importurile de animale și carne proaspătă, inclusiv
    carne tocată, provenite din țări terțe, și de modificare a Deciziilor 79/542/CEE,
    2000/572/CE și 2000/585/CE [notificată cu numărul C(2003) 5248]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 6. januára 2004 o zdravotných podmienkach Spoločenstva
    týkajúcich sa dovozu zvierat a čerstvého mäsa vrátane mletého mäsa z tretích
    krajín, ktorým sa menia a dopĺňajú rozhodnutia 79/542/EHS, 2000/572/ES a
    2000/585/ES [oznámené pod číslom K(2003) 5248]
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 6. januarja 2004 o zdravstvenih pogojih Skupnosti
    za uvoz živali in svežega mesa, vključno z mletim mesom, iz tretjih držav,
    in o spremembi odločb 79/542/EGS, 2000/572/ES in 2000/585/ES (notificirano pod
    dokumentarno številko K(2003) 5248)
  type: main
- language: es
  script: Latn
  content: '2004/212/CE: Decisión de la Comisión, de 6 de enero de 2004, relativa
    a las condiciones sanitarias comunitarias aplicables a las importaciones de animales
    y carne fresca, incluida la carne picada, procedentes de terceros países, y por
    la que se modifican las Decisiones 79/542/CEE, 2000/572/CE y 2000/585/CE (notificada
    con el número C(2003) 5248)'
  type: main
- language: sv
  script: Latn
  content: '2004/212/EG: Kommissionens beslut av den 6 januari 2004 om gemenskapens
    hälsovillkor för import av djur och färskt kött inbegripet malet kött från
    tredje land och om ändring av besluten 79/542/EEG, 2000/572/EG och 2000/585/EG
    [delgivet med nr K(2003) 5248]'
  type: main
