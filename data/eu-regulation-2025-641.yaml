  content: Commission Implementing Regulation (EU) 2025/641 of 25 March 2025 amending
    Annexes V, XIV and XV to Implementing Regulation (EU) 2021/404 as regards the
    entries for Bosnia and Herzegovina, Canada, the Republic of North Macedonia, the
    United Kingdom and the United States in the lists of third countries, territories
    or zones thereof authorised for the entry into the Union of consignments of poultry
    and germinal products of poultry, of fresh meat of poultry and game birds, and
    of meat products from poultry
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/641 de la Commission du 25 mars 2025
    modifiant les annexes V, XIV et XV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives à la Bosnie-Herzégovine, au Canada,
    à la République de Macédoine du Nord, au Royaume-Uni et aux États-Unis dans
    les listes de pays tiers, de territoires ou de zones de pays tiers en provenance
    desquels l’entrée dans l’Union d’envois de volailles et de produits germinaux
    de volailles, de viandes fraîches de volailles et de gibier à plumes, ainsi
    que de produits à base de viande de volailles est autorisée
  type: main
