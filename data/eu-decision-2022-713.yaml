    que altera a Decisão de Execução (UE) 2019/1956 no que diz respeito às normas
    harmonizadas aplicáveis aos equipamentos de aquecimento de líquidos, carregadores
    de bateria, aparelhos de aquecimento de água instantâneos, aparelhos de aquecimento
    por acumulação, aparelhos de casa de banho, cabinas de duche multifunções,
    aparelhos de tratamento de pele por radiações ultravioletas e infravermelhos
    e outros equipamentos elétricos destinados a ser utilizados dentro de certos
    limites de tensão
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/713 a Comisiei din 4 mai 2022
    de modificare a Deciziei de punere în aplicare (UE) 2019/1956 în ceea ce privește
    standardele armonizate pentru aparate de încălzit lichidele, încărcătoare
    de baterii, încălzitoare de apă instantanee, aparate de încălzit încăperi
    cu acumulare, toalete, cabine de duș multifuncționale, aparate de expunere a
    pielii la radiații ultraviolete și infraroșii și alte echipamente electrice
    destinate utilizării în cadrul unor anumite limite de tensiune
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/713 zo 4. mája 2022, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2019/1956, pokiaľ ide o harmonizované
    normy pre spotrebiče na ohrievanie kvapalín, nabíjačky batérií, prietokové
    ohrievače vody, akumulačné kachle, toalety, multifunkčné sprchové kúty,
    ožarovanie pokožky ultrafialovým a infračerveným žiarením a iné elektrické
    zariadenia určené na používanie v rámci určitých limitov napätia
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/713 z dne 4. maja 2022 o spremembi Izvedbenega
    sklepa (EU) 2019/1956 glede harmoniziranih standardov za aparate za gretje tekočin,
    polnilnike baterij, pretočne grelnike vode, termoakumulacijske grelnike prostorov,
    stranišča, večnamenske kabine za prhanje, nego kože z ultravijoličnim in
    infrardečim sevanjem ter drugo električno opremo, ki je načrtovana za uporabo
    znotraj določenih napetostnih mej
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/713 de la Comisión de 4 de mayo de 2022
    por la que se modifica la Decisión de Ejecución (UE) 2019/1956 en lo que respecta
    a las normas armonizadas sobre los aparatos de calentamiento de líquidos, los
    cargadores de baterías, los calentadores de agua instantáneos, los aparatos
    de calefacción por acumulación, los aparatos inodoros eléctricos, las cabinas
    de ducha multifunción, los aparatos para la exposición de la piel a las radiaciones
    ultravioletas e infrarrojas, y otro material eléctrico destinado a utilizarse
    con determinados límites de tensión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/713 av den 4 maj 2022 om ändring
    av genomförandebeslut (EU) 2019/1956 vad gäller harmoniserade standarder för
    bruksföremål för uppvärmning av vätskor, batteriladdare, vattenvärmare av
    genomströmningstyp, ackumulerande rumsuppvärmningsapparater, elektriska toaletter,
    duschkabiner med flera funktioner, bruksföremål för hudbehandling med ultraviolett
    och infraröd bestrålning, och annan elektrisk utrustning avsedd för användning
    inom vissa spänningsgränser
