title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/713 of 4 May 2022 amending Implementing
    Decision (EU) 2019/1956 as regards harmonised standards for appliances for heating
    liquids, battery chargers, instantaneous water heaters, thermal-storage room heaters,
    toilets, multifunctional shower cabinets, skin exposure to ultraviolet and infrared
    radiation, and other electrical equipment designed for use within certain voltage
    limits
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/713 de la Commission du 4 mai 2022 modifiant
    la décision d’exécution (UE) 2019/1956 en ce qui concerne les normes harmonisées
    relatives aux appareils de chauffage des liquides, aux chargeurs de batterie,
    aux chauffe-eau instantanés, aux appareils de chauffage à accumulation, aux
    toilettes, aux cabines de douche multifonctions, aux appareils d’exposition
    de la peau aux rayonnements ultraviolets et infrarouges et à d’autres matériels
    électriques conçus pour être employés dans certaines limites de tension
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/713 der Kommission vom 4. Mai 2022 zur
    Änderung des Durchführungsbeschlusses (EU) 2019/1956 in Bezug auf harmonisierte
    Normen für Geräte zur Flüssigkeitserhitzung, Batterieladegeräte, Durchflusserwärmer,
    Speicherheizgeräte, Toiletten, multifunktionelle Duscheinrichtungen, Hautbestrahlungsgeräte
    mit Ultraviolett- und Infrarotstrahlung und andere elektrische Betriebsmittel
    zur Verwendung innerhalb bestimmter Spannungsgrenzen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/713 на Комисията
    от 4 май 2022 година за изменение на Решение за
    изпълнение (ЕС) 2019/1956 по отношение на хармонизираните
    стандарти за уреди за нагряване на течности,
    зарядни устройства за акумулаторни батерии,
    проточни водонагреватели, акумулиращи отоплителни
    уреди, електрически тоалетни, многофункционални
    душ-кабини, уреди за облъчване на кожата с ултравиолетово
    и инфрачервено лъчение и други електрически
    съоръжения, предназначени за използване в
    определени граници на напрежението
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/713 ze dne 4. května 2022, kterým
    se mění prováděcí rozhodnutí (EU) 2019/1956, pokud jde o harmonizované
    normy pro spotřebiče pro ohřev kapalin, nabíječe baterií, průtokové ohřívače
    vody, akumulační topidla pro vytápění místností, toalety, multifunkční
    sprchové kouty, ošetřování pleti použitím ultrafialového a infračerveného
    záření a ostatní elektrická zařízení určená pro používání v určitých
    mezích napětí
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/713 af 4. maj 2022 om
    ændring af gennemførelsesafgørelse (EU) 2019/1956 for så vidt angår harmoniserede
    standarder for apparater til opvarmning af væsker, batteriladere, gennemstrømningsvandvarmere,
    termisk akkumulerende varmeapparater, toiletter, multifunktionelle brusekabinetter,
    hudpleje med ultraviolet og infrarød bestråling og andet elektrisk materiel
    bestemt til anvendelse inden for visse spændingsgrænser
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/713 της Επιτροπής
