    sprzętu do ogrzewania cieczy, ładowarek akumulatorów, przepływowych ogrzewaczy
    wody, akumulacyjnych ogrzewaczy pomieszczeń, toalet, wielofunkcyjnych kabin prysznicowych,
    urządzeń do naświetlania skóry promieniowaniem podczerwonym i nadfioletowym
