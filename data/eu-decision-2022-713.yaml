  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/713, 4. mai 2022, millega muudetakse
    rakendusotsust (EL) 2019/1956 seoses harmoneeritud standarditega, mis käsitlevad
    vedelike kuumutamise seadmeid, akulaadureid, vee kiirkeetjaid, termiliste laoruumide
    küttekehasid, tualettruume, mitmeotstarbelisi dušikabiine, naha ultraviolett-
    ja infrapunakiiritusseadmeid ning muid teatavates pingevahemikes kasutatavaid
    elektriseadmeid
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/713, annettu 4 päivänä
    toukokuuta 2022, täytäntöönpanopäätöksen (EU) 2019/1956 muuttamisesta siltä
    osin kuin on kyse yhdenmukaistetuista standardeista, jotka koskevat nesteiden
    lämmittämiseen tarkoitettuja laitteita, akkuvaraajia, läpivirtauskuumentimia,
    varaavia huonelämmittimiä, käymälöitä, monitoimisuihkukaappeja, ihon ultravioletti-
    ja infrapunasäteilylle altistumista sekä muita tietyllä jännitealueella toimivia
    sähkölaitteita
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/713 ón gCoimisiún an 4 Bealtaine
    2022 lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2019/1956 a mhéid a bhaineann
    le caighdeáin chomhchuibhithe le haghaidh fearas chun leachtanna a théamh, luchtairí
    ceallraí, prapthéitheoirí uisce, téitheoirí teirmeacha seomra stórais, leithreas,
    caibinéid cithfholcadáin ilfheidhmeacha, craiceann a nochtadh do radaíocht
    ultraivialait agus infridhearg, agus trealamh leictreach eile a dheartar lena
    úsáid laistigh de theorainneacha áirithe voltais
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/713 оd 4. svibnja 2022. o izmjeni
    Provedbene odluke (EU) 2019/1956 u pogledu usklađenih normi za aparate za grijanje
    tekućina, punilice baterija, protočne vodogrijalice, termoakumulacijske peći,
    zahode, višenamjenske tuševe, aparate za izlaganje kože ultraljubičastomu
    i infracrvenomu zračenju te drugu električnu opremu namijenjenu za uporabu unutar
    određenih naponskih granica
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/713 végrehajtási határozata (2022. május 4.)
    az (EU) 2019/1956 végrehajtási határozatnak a folyadékmelegítők, az akkumulátortöltők,
    az átfolyórendszerű vízmelegítők, a hőtároló rendszerű, helyiségfűtő
    készülékek, az illemhelyek, a sokfunkciós zuhanyozófülkék, a bőr ultraibolya
    és infravörös besugárzására használt készülékek, valamint a meghatározott
    feszültséghatáron belüli használatra tervezett egyéb elektromos berendezésekre
    vonatkozó harmonizált szabványok tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/713 della Commissione del 4 maggio 2022
    che modifica la decisione di esecuzione (UE) 2019/1956 per quanto riguarda le
    norme armonizzate per apparecchi per il riscaldamento di liquidi, caricabatterie,
    scaldacqua istantanei, apparecchi elettrici ad accumulo per il riscaldamento dei
    locali, toilette elettriche, cabine con doccia multifunzione, apparecchi per il
    trattamento della pelle con raggi ultravioletti ed infrarossi e altro materiale
    elettrico destinato a essere adoperato entro taluni limiti di tensione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/713 (2022. gada 4. maijs) par
    Īstenošanas lēmuma (ES) 2019/1956 grozījumiem, kas attiecas uz saskaņotajiem
    standartiem par šķidrumu sildīšanas ierīcēm, akumulatoru lādētājiem,
    caurteces ūdens sildītājiem, siltumenerģiju akumulējošiem telpu sildītājiem,
    tualetes elektroierīcēm, daudzfunkcionālām dušas kabīnēm, ādas apstarošanu
    ar ultravioleto un infrasarkano starojumu un uz citām elektroierīcēm, kas paredzētas
    lietošanai noteiktās sprieguma robežās
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/713 2022 m. gegužės 4 d.
    kuriuo iš dalies keičiamos Įgyvendinimo sprendimo (ES) 2019/1956 nuostatos
    dėl skysčių šildymo prietaisų, baterijų įkroviklių, akimirkinių vandens
    šildytuvų, akumuliacinių patalpų šildytuvų, tualetų, daugiafunkcių dušo
    kabinų, odos švitinimo ultravioletine ir infraraudonąja spinduliuote prietaisų
    ir kitų tam tikrose įtampos ribose skirtų naudoti elektros įrenginių darniųjų
    standartų
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/713 tal-4
    ta’ Mejju ta’ 2022 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2019/1956
    fir-rigward tal-istandards armonizzati għall-apparati għat-tisħin tal-likwidi,
    għaċ-ċarġers tal-batteriji, għall-ħiters tal-ilma istantanji, għall-ħiters
    tal-kmamar b’akkumulu termali, għat-tojlits, għall-kabini għal doċoċ multifunzjonali,
    għall-esponiment tal-ġilda għar-radjazzjoni ultravjola u infraħamra, u tagħmir
    elettriku ieħor iddisinjat għall-użu fi ħdan ċerti limiti tal-vultaġġ
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/713 van de Commissie van 4 mei 2022 tot wijziging
    van Uitvoeringsbesluit (EU) 2019/1956 wat betreft geharmoniseerde normen voor
    toestellen voor verwarming van vloeistoffen, batterijlaadtoestellen, doorstroomverwarmers
    voor vloeistoffen, accumulatorkachels, toiletten, multifunctionele douchecellen,
    huidbestralingstoestellen met ultraviolette en infraroodstraling en ander elektrisch
    materiaal bestemd voor gebruik binnen bepaalde spanningsgrenzen
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/713 z dnia 4 maja 2022 r. zmieniająca
