    απόφασης (ΕΕ) 2019/1956 όσον αφορά τα εναρμονισμένα
    πρότυπα για συσκευές θέρμανσης υγρών, φορτιστές
    μπαταριών, θερμαντήρες νερού στιγμιαίας θέρμανσης,
    θερμοσυσσωρευτές, τουαλέτες, πολυλειτουργικές
