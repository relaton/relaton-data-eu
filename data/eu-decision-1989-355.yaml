title:
- language: en
  script: Latn
  content: '89/355/EEC: Commission Decision of 23 May 1989 amending Decision 84/248/EEC
    authorizing the Federal Republic of Germany to adopt, when introducing into its
    territory plants or plant products, special plant health provisions laid down
    for home-grown production of certain fruit plants intended for planting (only
    the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/355/CEE: Décision de la Commission du 23 mai 1989 modifiant la décision
    84/248/CEE autorisant la République fédérale d''Allemagne à arrêter, lors
    de l''introduction sur son territoire de végétaux ou de produits végétaux,
    des dispositions sanitaires fixées pour la production indigène de certains végétaux
    d''espèces fruitières destinés à être plantés (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
