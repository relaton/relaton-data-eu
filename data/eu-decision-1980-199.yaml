id: EUDecision1980199
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/199/EEC: Commission Decision of 24 January 1980 authorizing Ireland
    not to apply Community treatment to shirts, T-shirts, lightweight fine knit roll,
    polo or turtlenecked jumpers and pullovers, undervests and the like, falling within
    heading No ex 60.04 of the Common Customs Tariff (category 4), originating in
    the Philippines and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/199/CEE: Décision de la Commission, du 24 janvier 1980, autorisant
    l''Irlande à exclure du traitement communautaire les chemises, chemisettes, "T-shirts",
    sous-"pulls", maillots de corps et articles similaires, de la position ex 60.04
    du tarif douanier commun (catégorie 4), originaires des Philippines et mis en
    libre pratique dans les autres Etats membres (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/199/EWG: Entscheidung der Kommission vom 24. Januar 1980, mit der Irland
    ermächtigt wird, aus den Philippinen stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, T-Shirts, Unterziehpullis, Unterhemden
    und dergleichen der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs, Kategorie
    4, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/199/EØF: Kommissionens beslutning af 24. januar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage skjorter, herunder sports-
    og arbejdsskjorter, T-shirts, T-shirts med rullekrave, undertrøjer og lignende,
    som henhører under pos. ex 60.04 i den fælles toldtarif (kategori 4), har oprindelse
    på Filippinerne og frit kan omsættes i de øvrige medlemsstater (Kun den engelske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/199/CEE: Decisione della Commissione, del 24 gennaio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, camicette, T-shirts,
    magliette a collo alto, camiciole e articoli affini, della voce n. ex 60.04 della
    tariffa doganale comune, categoria 4, originari delle Filippine e messi in libera
    pratica negli altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/199/EEG: Beschikking van de Commissie van 24 januari 1980 waarbij Ierland
    wordt gemachtigd overhemden en sporthemden, T-shirts, onderjumpers, hemdtruien,
    sous- pulls, tricotpakken, maillots de corps en dergelijke artikelen, van post
    ex 60.04 van het gemeenschappelijk douanetarief (categorie 4), van oorsprong uit
    de Filippijnen en in de overige Lid-Staten in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse taal
    is authentiek)'
  type: main
