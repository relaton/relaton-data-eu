    intézkedéseknek a Kínai Népköztársaságban és az Egyesült Királyságban
    feladott, akár a Kínai Népköztársaságból és az Egyesült Királyságból
    származóként, akár nem ilyenként bejelentett biodízel behozatalával történő
    esetleges kijátszására vonatkozó vizsgálat megszüntetéséről, valamint
    a behozatalok nyilvántartásba vételének megszüntetéséről
  type: main
