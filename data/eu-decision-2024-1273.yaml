    sulle importazioni di biodiesel originario dell’Indonesia mediante importazioni
    di biodiesel spedito dalla Repubblica popolare cinese e dal Regno Unito, a prescindere
    che sia dichiarato o no originario della Repubblica popolare cinese o del Regno
    Unito, e che pone termine alla registrazione delle importazioni
  type: main
