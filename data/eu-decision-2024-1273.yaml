title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/1273 of 7 May 2024 terminating
    the investigation of the possible circumvention, by imports of biodiesel consigned
    from the People’s Republic of China and the United Kingdom, whether declared
    as originating in the People’s Republic of China and the United Kingdom or not,
    of the countervailing measures concerning imports of biodiesel originating in
    Indonesia, and terminating the registration of imports
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/1273 de la Commission du 7 mai 2024
    mettant un terme à l’enquête relative à un éventuel contournement des mesures
    compensatoires applicables aux importations de biodiesel originaire d’Indonésie
    par les importations de biodiesel expédié de la République populaire de Chine
    et du Royaume-Uni, qu’il ait ou non été déclaré originaire de ces pays,
    et mettant un terme à l’enregistrement des importations
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/1273 der Kommission vom 7. Mai 2024 zur
    Einstellung der Untersuchung betreffend die mutmaßliche Umgehung der Ausgleichsmaßnahmen
    gegenüber den Einfuhren von Biodiesel mit Ursprung in Indonesien durch aus der
    Volksrepublik China und aus dem Vereinigten Königreich versandte Einfuhren von
    Biodiesel, ob als Ursprungserzeugnisse der Volksrepublik China oder des Vereinigten
    Königreichs angemeldet oder nicht, und zur Einstellung der zollamtlichen Erfassung
    der Einfuhren
  type: main
