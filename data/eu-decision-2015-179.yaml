    der Richtlinie 2000/29/EG des Rates zu gewähren für Verpackungsmaterial aus
    Holz von Nadelbäumen ( Coniferales ) in Form von Munitionskisten mit Ursprung
    in den Vereinigten Staaten von Amerika, die unter Kontrolle des Verteidigungsministeriums
    der Vereinigten Staaten stehen (Bekanntgegeben unter Aktenzeichen C(2015) 445)
  type: main
