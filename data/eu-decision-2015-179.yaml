    az Amerikai Egyesült Államokból származó és az Amerikai Védelmi Minisztérium
    által ellenőrzött lőszeres ládák formájában kiszerelt, tűlevelűek (Coniferales)
    fájából készült fa csomagolóanyag tekintetében való eltérés engedélyezése
