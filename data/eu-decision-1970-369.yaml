title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 14 juillet 1970, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les conserves d'asperges
    (avec pointes) de la position Ex 20.02 du Tarif douanier commun, originaires de
    Taiwan et mises en libre pratique dans les pays du Benelux
  type: main
- language: de
  script: Latn
  content: '70/369/EWG: Entscheidung der Kommission vom 14. Juli 1970, mit der die
    Bundesrepublik Deutschland ermächtigt wird, die aus Taiwan stammenden und in
    den Beneluxländern im freien Verkehr befindlichen Spargelkonserven, mit Köpfen
    (Brechspargel, Stangenspargel), der Tarifnummer ex 20.02 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/369/CEE: Decisione della Commissione, del 14 luglio 1970, che autorizza
    la Repubblica federale tedesca ad escludere dal trattamento comunitario le conserve
    di asparagi (con punte) della voce ex 20.02 della tariffa doganale comune, originarie
    di Taiwan e messe in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '70/369/EEG: Beschikking van de Commissie van 14 juli 1970 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd conserven van asperges (met punten) van post ex 20.02
    van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in de Benelux-landen
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
