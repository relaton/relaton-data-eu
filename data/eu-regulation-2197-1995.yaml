    szóló 837/90/EGK, valamint a tagállamok által a gabonaféléken kívüli növényi
    termékekről szolgáltatandó statisztikai adatokról szóló 959/93/EGK tanácsi
    rendelet mellékleteinek módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2197/95 della Commissione, del 18 settembre 1995, che
    modifica gli allegati ai regolamenti del Consiglio (CEE) n. 837/90, relativo alle
    informazioni statistiche che gli Stati membri devono fornire in merito alla produzione
    di cereali, e (CEE) n. 959/93, relativo alle informazioni statistiche che gli
    Stati membri devono fornire circa i prodotti diversi dai cereali
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2197/95 (1995. gada 18. septembris), ar kuru
    groza pielikumus Padomes Regulai (EEK) Nr. 837/90 par statistisko informāciju,
    kas dalībvalstīm jāiesniedz attiecībā uz labības audzēšanu, un Padomes
    Regulai (EEK) Nr. 959/93 par statistisko informāciju, kas dalībvalstīm jāpiegādā
    par augkopības kultūru produktiem, izņemot labību
  type: main
- language: lt
  script: Latn
  content: 1995 m. rugsėjo 18 d. Komisijos reglamentas (EB) Nr. 2197/95, iš dalies
    keičiantis Tarybos reglamentų (EEB) Nr. 837/90 dėl statistinės informacijos,
    kurią valstybės narės turi teikti apie javų produkciją, ir (EEB) Nr. 959/93
    dėl statistinės informacijos, kurią valstybės narės turi teikti apie augalininkystės
    produktus, išskyrus javus, priedus
  type: main
- language: mt
  script: Latn
