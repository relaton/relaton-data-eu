title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2197/95 of 18 September 1995 amending the
    Annexes to Council Regulations (EEC) No 837/90 concerning statistical information
    to be supplied by the Member States on cereal production and (EEC) No 959/93 concerning
    statistical information to be supplied by the Member States on crop products other
    than cereals
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2197/95 de la Commission, du 18 septembre 1995, modifiant
    les annexes des règlements du Conseil (CEE) nº 837/90 concernant les informations
    statistiques à fournir par les États membres sur la production de céréales
    et (CEE) nº 959/93 concernant les informations statistiques à fournir par les
    États membres sur les produits végétaux autres que les céréales
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2197/95 der Kommission vom 18. September 1995 zur Änderung
    der Anhänge der Verordnung (EWG) Nr. 837/90 des Rates über die von den Mitgliedstaaten
    zu liefernden statistischen Informationen über die Getreideerzeugung und der
    Anhänge der Verordnung (EWG) Nr. 959/93 des Rates über die von den Mitgliedstaaten
    zu liefernden statistischen Informationen über pflanzliche Erzeugnisse außer
    Getreide
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2197/95 на Комисията от 18 септември
    1995 година за изменение на приложенията към
    Регламенти (ЕИО) № 837/90 на Съвета относно статистическата
    информация, която трябва да бъде предоставена
    от държавите-членки за производството на зърнени
    култури и (ЕИО) № 959/93 на Съвета относно статистическата
    информация, която следва да се предоставя от
    държавите-членки относно растителните продукти,
    различни от зърнени култури
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2197/95 ze dne 18. září 1995, kterým se
    mění přílohy nařízení Rady (EHS) č. 837/90 o statistických informacích
    poskytovaných členskými státy o produkci obilovin a nařízení č. 959/93
    o statistických informacích poskytovaných členskými státy o rostlinných
    produktech s výjimkou obilovin
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2197/95 af 18. september 1995 om ændring
    af bilagene til Rådets forordning (EØF) nr. 837/90 om statistiske oplysninger,
    der skal tilvejebringes af medlemsstaterne vedrørende kornproduktion, og Rådets
    forordning (EØF) nr. 959/93 om statistiske oplysninger, der skal tilvejebringes
    af medlemsstaterne vedrørende andre afgrøder end korn
  type: main
