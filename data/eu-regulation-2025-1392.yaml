    látky pro výkrm a odchov druhů drůbeže, chov menšinových druhů drůbeže,
    nosnice a výkrm prasat všech druhů čeledi prasatovití (Suidae) (držitel
    povolení: Fertinagro Biotech S.L.)'
  type: main
- language: da
