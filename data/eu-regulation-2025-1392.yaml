title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2025/1392 of 15 July 2025 concerning
    the authorisation of a preparation of 3-phytase produced with Komagataella phaffii
    CECT 13171 as a feed additive for poultry species for fattening or reared for
    laying or for breeding, minor poultry species for breeding, laying hens and pigs
    for fattening of all Suidae species (holder of authorisation: Fertinagro Biotech
    S.L.)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2025/1392 de la Commission du 15 juillet
    2025 concernant l’autorisation d’une préparation de 3-phytase produite avec
    Komagataella phaffii CECT 13171 en tant qu’additif pour l’alimentation des
    espèces de volailles d’engraissement ou élevées pour la ponte ou la reproduction,
    des espèces mineures de volailles destinées à la reproduction, des poules pondeuses
    et des porcs d’engraissement de toutes les espèces de suidés (titulaire de
    l’autorisation: Fertinagro Biotech S.L.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2025/1392 der Kommission vom 15. Juli 2025
    zur Zulassung einer Zubereitung von 3-Phytase, gewonnen aus Komagataella phaffii
    CECT 13171, als Futtermittelzusatzstoff für Geflügelarten für Mastzwecke oder
    Jungtiere von Geflügelarten für Lege- oder Zuchtzwecke, Geflügelarten von geringerer
    wirtschaftlicher Bedeutung für Zuchtzwecke, Legehennen und Mastschweine aller
    Suidae-Arten (Zulassungsinhaber: Fertinagro Biotech S.L.)'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2025/1392 на Комисията
    от 15 юли 2025 година за разрешаване на употребата
    на препарат от 3-фитаза, получена с Komagataella phaffii
    CECT 13171, като фуражна добавка за видове домашни
    птици за угояване или отглеждани за носачки
    или за разплод, видове домашни птици с по-малко
    стопанско значение за разплод, кокошки носачки
    и свине за угояване от всички видове от семейство
    Suidae (притежател на разрешението: Fertinagro Biotech
    S.L.)'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2025/1392 ze dne 15. července 2025
