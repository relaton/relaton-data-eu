title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 1008/2011 of 10 October 2011 imposing
    a definitive anti-dumping duty on imports of hand pallet trucks and their essential
    parts originating in the People’s Republic of China as extended to imports of
    hand pallet trucks and their essential parts consigned from Thailand, whether
    declared as originating in Thailand or not, following an expiry review pursuant
    to Article 11(2) of Regulation (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n o 1008/2011 du Conseil du 10 octobre 2011
    instituant un droit antidumping définitif sur les importations de transpalettes
    à main et de leurs parties essentielles originaires de la République populaire
    de Chine, tel qu’étendu aux importations de transpalettes à main et de leurs
    parties essentielles expédiés de Thaïlande, déclarés ou non originaires de
    Thaïlande, à la suite d’un réexamen au titre de l’expiration des mesures,
    conformément à l’article 11, paragraphe 2, du règlement (CE) n o 1225/2009
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1008/2011 des Rates vom 10. Oktober 2011
    zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren manueller
    Palettenhubwagen und wesentlicher Teile davon mit Ursprung in der Volksrepublik
    China, ausgeweitet auf aus Thailand versandte Einfuhren manueller Palettenhubwagen
    und wesentlicher Teile davon, ob als Ursprungserzeugnis Thailands angemeldet oder
    nicht, im Anschluss an eine Auslaufüberprüfung nach Artikel 11 Absatz 2 der
    Verordnung (EG) Nr. 1225/2009
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 1008/2011 на
    Съвета от 10 октомври 2011 година за налагане
    на окончателно антидъмпингово мито върху вноса
    на ръчни колички за палети и основните им части
    с произход от Китайската народна република,
    приложимо и към вноса на ръчни колички за палети
    и основните им части, доставяни от Тайланд,
    независимо от това дали са декларирани с произход
    от Тайланд, след преразглеждане с оглед изтичане
    на срока на действие съгласно член 11, параграф
    2 от Регламент (ЕО) № 1225/2009
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 1008/2011 ze dne 10. října 2011
    o uložení konečného antidumpingového cla na dovoz ručních paletových vozíků
    a jejich základních dílů pocházejících z Čínské lidové republiky rozšířeného
    na dovoz ručních paletových vozíků a jejich základních dílů zasílaných
    z Thajska, bez ohledu na to, zda je u něj deklarován původ z Thajska či nikoli,
    na základě přezkumu před pozbytím platnosti podle čl. 11 odst. 2 nařízení
    (ES) č. 1225/2009
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 1008/2011 af 10. oktober 2011
    om indførelse af en endelig antidumpingtold på importen af håndbetjente palletrucks
    og væsentlige dele dertil med oprindelse i Folkerepublikken Kina, udvidet til
    at omfatte importen af håndbetjente palletrucks og væsentlige dele dertil afsendt
    fra Thailand, uanset om varen er angivet med oprindelse i Thailand eller ej efter
    en udløbsundersøgelse i henhold til artikel 11, stk. 2, i forordning (EF) nr.
    1225/2009
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (EE) αριθ. 1008/2011
    του Συμβουλίου, της 10ης Οκτωβρίου 2011 , για την
    επιβολή οριστικού δασμού αντιντάμπινγκ στις
    εισαγωγές τροχοφόρων φορείων και των βασικών
    μερών τους καταγωγής Λαϊκής Δημοκρατίας της
