    το άρθρο 11 παράγραφος 2 του κανονισμού (ΕΚ) αριθ.
    1225/2009
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusmäärus (EL) nr 1008/2011, 10. oktoober 2011 , millega
    pärast määruse (EÜ) nr 1225/2009 artikli 11 lõike 2 kohast aegumise läbivaatamist
    kehtestatakse Hiina Rahvavabariigist pärit kaubaaluste käsivedukite ja nende
    oluliste osade impordi suhtes lõplik dumpinguvastane tollimaks ning laiendatakse
    seda Taist pärit kaubaaluste käsivedukite ja nende oluliste osade impordile,
    olenemata sellest, kas need on deklareeritud Taist pärinevatena või mitte
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 1008/2011, annettu 10 päivänä
    lokakuuta 2011 , Kiinan kansantasavallasta peräisin olevien käsikäyttöisten
    haarukkatrukkien sekä niiden keskeisten osien tuonnissa käyttöön otettavasta
    lopullisesta polkumyyntitullista, sellaisena kuin se on laajennettuna koskemaan
    Thaimaasta lähetettyjen käsikäyttöisten haarukkatrukkien sekä niiden keskeisten
    osien tuontia riippumatta siitä, onko niiden alkuperämaaksi ilmoitettu Thaimaa,
    asetuksen (EY) N:o 1225/2009 11 artiklan 2 kohdan mukaisen toimenpiteiden voimassaolon
    päättymistä koskevan tarkastelun seurauksena
  type: main
- language: hr
  script: Latn
  content: Provedbena Uredba Vijeća (EU) br. 1008/2011 od 10. listopada 2011. o uvođenju
    konačne antidampinške pristojbe na uvoz ručnih paletnih viličara i njihovih
    osnovnih dijelova podrijetlom iz Narodne Republike Kine kako je proširena na
    uvoz ručnih paletnih viličara i njihovih osnovnih dijelova poslanih iz Tajlanda,
    bez obzira na to imaju li deklarirano podrijetlo iz Tajlanda ili ne, nakon revizije
    po isteku mjere prema članku 11. stavku 2. Uredbe (EZ) br. 1225/2009
  type: main
- language: hu
  script: Latn
  content: A Tanács 1008/2011/EU végrehajtási rendelete ( 2011. október 10. )
    az 1225/2009/EK rendelet 11. cikkének (2) bekezdése szerinti hatályvesztési
    felülvizsgálatot követően a Kínai Népköztársaságból származó kézi
    emelőkocsik és alapvető részegységeik behozatalára vonatkozó, a Thaiföldön
    feladott – függetlenül attól, hogy Thaiföldről származóként jelentették-e
    be – kézi emelőkocsik és alapvető részegységeik behozatalára kiterjesztett
    végleges dömpingellenes vám kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1008/2011 del Consiglio, del 10 ottobre
    2011 , che istituisce un dazio antidumping definitivo sulle importazioni di transpallet
    manuali e dei loro componenti essenziali originari della Repubblica popolare cinese
    esteso alle importazioni di transpallet manuali e dei loro componenti essenziali
    spediti dalla Thailandia, a prescindere che siano dichiarati o no originari della
    Thailandia, in seguito ad un riesame in previsione della scadenza a norma dell’articolo
    11, paragrafo 2, del regolamento (CE) n. 1225/2009
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 1008/2011 ( 2011. gada 10. oktobris
    ), ar ko pēc termiņa beigu pārskata saskaņā ar Regulas (EK) Nr. 1225/2009
    11. panta 2. punktu uzliek galīgo antidempinga maksājumu, ko piemēro Ķīnas
    Tautas Republikas izcelsmes ar roku darbināmu paliktņu autokrāvēju un to galveno
    daļu importam un ko attiecina arī uz tādu ar roku darbināmu paliktņu autokrāvēju
    un to galveno daļu importu, kuras nosūtītas no Taizemes, neatkarīgi no tā,
    vai Taizeme ir deklarēta kā šo ražojumu izcelsmes valsts
  type: main
- language: lt
  script: Latn
  content: 2011 m. spalio 10 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 1008/2011,
    kuriuo, pagal Reglamento (EB) Nr. 1225/2009 11 straipsnio 2 dalį atlikus priemonių
    galiojimo termino peržiūrą, importuojamiems Kinijos Liaudies Respublikos kilmės
    rankiniams padėklų krautuvams ir jų pagrindinėms dalims nustatomas galutinis
    antidempingo muitas, kurio taikymas išplėstas importuojamiems iš Tailando siunčiamiems
    rankiniams padėklų krautuvams ir jų pagrindinėms dalims, deklaruojamiems kaip
    Tailando kilmės arba ne
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kunsill (UE) Nru 1008/2011 tal- 10
    ta’ Ottubru 2011 li jimponi dazju anti-dumping definittiv fuq importazzjonijiet
    ta’ pallet trucks tal-idejn u l-partijiet essenzjali tiegħhom li joriġinaw
    mir-Repubblika Popolari taċ-Ċina kif estiż għal importazzjonijiet ta’ pallet
    trucks tal-idejn u l-partijiet essenzjali tiegħu mibgħutin mit-Tajlandja, sew
    jekk dikjarati li joriġinaw mit-Tajlandja u sew jekk le, wara reviżjoni tal-iskadenza
    skont l-Artikolu 11(2) tar-Regolament (KE) Nru 1225/2009
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1008/2011 van de Raad van 10 oktober 2011
    tot instelling van een definitief antidumpingrecht op handpallettrucks en essentiële
    onderdelen daarvan, van oorsprong uit de Volksrepubliek China, zoals uitgebreid
    tot handpallettrucks en essentiële onderdelen daarvan verzonden uit Thailand,
    al dan niet aangegeven als van oorsprong uit Thailand, na een nieuw onderzoek
    bij het vervallen van de maatregelen overeenkomstig artikel 11, lid 2, van Verordening
    (EG) nr. 1225/2009
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 1008/2011 z dnia 10 października
    2011 r. nakładające ostateczne cło antydumpingowe na przywóz ręcznych wózków
    paletowych oraz ich zasadniczych części pochodzących z Chińskiej Republiki
    Ludowej, rozszerzone na przywóz ręcznych wózków paletowych oraz ich zasadniczych
    części wysyłanych z Tajlandii, zgłoszonych lub niezgłoszonych jako pochodzące
    z Tajlandii, w następstwie przeglądu wygaśnięcia na podstawie art. 11 ust.
    2 rozporządzenia (WE) nr 1225/2009
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. o 1008/2011 do Conselho, de 10 de Outubro
    de 2011 , que institui um direito anti-dumping definitivo sobre as importações
    de porta-paletes manuais e dos seus componentes essenciais originários da República
    Popular da China, tornado extensivo às importações de porta-paletes manuais
    e dos seus componentes essenciais expedidos da Tailândia, quer sejam ou não
    declarados originários da Tailândia, na sequência de um reexame da caducidade
    iniciado ao abrigo do artigo 11. o , n. o 2, do Regulamento (CE) n. o 1225/2009
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1008/2011 al Consiliului din
    10 octombrie 2011 de instituire a unei taxe antidumping definitive la importurile
    de transpalete manuale și componente de bază ale acestora originare din Republica
    Populară Chineză, astfel cum a fost extinsă la importurile de transpalete manuale
    și componente de bază ale acestora expediate din Thailanda, indiferent dacă
    acestea sunt declarate ca originare din Thailanda sau nu, în urma unei reexaminări
    în perspectiva expirării măsurilor, în temeiul articolului 11 alineatul (2)
    din Regulamentul (CE) nr. 1225/2009
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 1008/2011 z 10. októbra 2011 ,
    ktorým sa po preskúmaní pred uplynutím platnosti podľa článku 11 ods. 2
    nariadenia (ES) č. 1225/2009 ukladá konečné antidumpingové clo na dovoz ručných
    paletovacích vozíkov a ich hlavných častí s pôvodom v Čínskej ľudovej
    republike, rozšírené na dovoz ručných paletovacích vozíkov a ich hlavných
    častí zasielaných z Thajska, bez ohľadu na to, či sú alebo nie sú deklarované
    ako výrobky s pôvodom v Thajsku
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 1008/2011 z dne 10. oktobra 2011 o uvedbi
    dokončne protidampinške dajatve na uvoz ročnih vozičkov za premeščanje palet
    in njihovih osnovnih delov s poreklom iz Ljudske republike Kitajske, kakor je
    bila razširjena na uvoz ročnih vozičkov za premeščanje palet in njihovih
    osnovnih delov, poslanih iz Tajske, ne glede na to, ali so deklarirani kot izdelek
    s poreklom iz Tajske ali ne, po pregledu zaradi izteka ukrepov na podlagi člena
    11(2) Uredbe (ES) št. 1225/2009
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n o 1008/2011 del Consejo, de 10 de octubre
    de 2011 , por el que se establece un derecho antidumping definitivo respecto a
    las importaciones de transpaletas manuales y sus partes esenciales originarias
    de la República Popular China, ampliado a las importaciones del mismo producto
    procedentes de Tailandia, hayan sido o no declaradas originarias de Tailandia,
    a raíz de una reconsideración por expiración de conformidad con el artículo
    11, apartado 2, del Reglamento (CE) n o 1225/2009
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 1008/2011 av den 10 oktober 2011
    om införande av en slutgiltig antidumpningstull på import av gaffelvagnar och
    väsentliga delar till dessa med ursprung i Folkrepubliken Kina, utvidgad till
    att omfatta import av gaffelvagnar och väsentliga delar till dessa som avsänts
    från Thailand, oavsett om produktens deklarerade ursprung är Thailand eller
    inte, efter en översyn vid giltighetstidens utgång enligt artikel 11.2 i förordning
    (EG) nr 1225/2009
