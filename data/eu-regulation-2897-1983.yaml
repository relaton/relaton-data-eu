  script: Latn
  content: Commission Regulation (EEC) No 2897/83 of 18 October 1983 amending for
    the 18th time Regulation (EEC) No 2730/81 establishing a list of agencies in non-member
    importing countries entitled to issue invitations to tender in the milk and milk
    products sector
  type: main
- language: fr
  script: Latn
