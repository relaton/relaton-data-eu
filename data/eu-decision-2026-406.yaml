title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/406 of 24 February 2026 recognising
    that the report submitted by the United Kingdom under Article 31(3) of Directive
    (EU) 2018/2001 of the European Parliament and of the Council contains accurate
    data for the purposes of measuring the greenhouse gas emissions associated with
    the cultivation of winter wheat, oilseed rape and sugar beet in that country
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/406 de la Commission du 24 février
    2026 reconnaissant que le rapport soumis par le Royaume-Uni au titre de l’article
    31, paragraphe 3, de la directive (UE) 2018/2001 du Parlement européen et du
    Conseil contient des données précises aux fins de la mesure des émissions de
    gaz à effet de serre associées à la culture du blé d’hiver, du colza et
    de la betterave sucrière dans ledit pays
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/406 der Kommission vom 24. Februar 2026
    zur Anerkennung, dass der vom Vereinigten Königreich gemäß Artikel 31 Absatz
    3 der Richtlinie (EU) 2018/2001 des Europäischen Parlaments und des Rates vorgelegte
    Bericht genaue Daten für die Messung der auf den Anbau von Winterweizen, Raps
    und Zuckerrüben in diesem Land zurückgehenden Treibhausgasemissionen enthält
  type: main
- language: bg
