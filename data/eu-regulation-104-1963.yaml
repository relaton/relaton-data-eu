  content: Règlement n° 104/63/CEE du Conseil, du 25 septembre 1963, relatif à
    la détermination de la quantité de céréales fourragères nécessaire pour
    la production d'un kilogramme d'oeufs de volaille en coquille, destinés à la
    consommation, et pour la production d'un kilogramme d'oeufs à couver de volaille
    de basse-cour
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 104/63/EWG des Rats vom 25. September 1963 über die Festsetzung
    der Futtergetreidemenge, die zur Erzeugung von einem Kilogramm zum Verbrauch bestimmter
    Geflügeleier in der Schale und zur Erzeugung von einem Kilogramm Bruteier von
    Hausgeflügel erforderlich ist
  type: main
- language: it
  script: Latn
