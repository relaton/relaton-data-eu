title:
- language: en
  script: Latn
  content: '98/621/EC: Commission Decision of 27 October 1998 amending for the third
    time Decision 95/109/EC, concerning additional guarantees relating to infectious
    bovine rhinotracheitis for bovines destined for Member States or regions of Member
    States free from the disease, in relation to Italy (notified under document number
    C(1998) 3237)'
  type: main
- language: fr
  script: Latn
  content: '98/621/CE: Décision de la Commission du 27 octobre 1998 portant troisième
    modification de la décision 95/109/CE relative à des garanties supplémentaires
    concernant la rhinotrachéite infectieuse bovine pour les bovins destinés aux
    États membres ou à des régions d''États membres indemnes de la maladie, en
    relation avec l''Italie [notifiée sous le numéro C(1998) 3237]'
  type: main
- language: de
  script: Latn
  content: '98/621/EG: Entscheidung der Kommission vom 27. Oktober 1998 zur dritten
    Änderung der Entscheidung 95/109/EG über ergänzende Garantien hinsichtlich
    der infektiösen bovinen Rhinotracheitis für Rinder, die für bestimmte Teile
    des Gemeinschaftsgebiets bestimmt sind, in bezug auf Italien (Bekanntgegeben unter
    Aktenzeichen K(1998) 3237)'
  type: main
- language: da
  script: Latn
  content: '98/621/EF: Kommissionens beslutning af 27. oktober 1998 om tredje ændring
