    σχετικά με τη μολυσματική ρινοτραχειίτιδα
    των βοοειδών για τα βοοειδή που προορίζονται
    για κράτη μέλη ή περιφέρειες των κρατών μελών
    απαλλαγμένες από τη νόσο, όσον αφορά την Ιταλία
