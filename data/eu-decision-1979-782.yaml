title:
- language: en
  script: Latn
  content: '79/782/EEC: Commission Decision of 31 August 1979 authorizing the French
    Republic not to apply Community treatment to woven pile fabrics and chenille fabrics
    (other than terry fabrics of cotton and narrow woven fabrics) of wool, of cotton
    or or man-made textile fibres, falling within heading No ex 58.04 of the Common
    Customs Tariff (NIMEXE codes 58.04-07, 11, 15, 18, 41, 43, 45, 61, 63, 67, 69,
    71, 75, 77, 78) (category 32), originating in South Korea and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/782/CEE: Décision de la Commission, du 31 août 1979, autorisant la
    République française à exclure du traitement communautaire les velours, peluches,
    tissus bouclés et tissus de chenille, à l'' exclusion des tissus de coton bouclés
    du genre éponge et de rubanerie, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, de la position ex 58.04 du tarif douanier commun (codes Nimexe
    : 58.04-07, 11, 15, 18, 41, 43, 45, 61, 63, 67, 69, 71, 75, 77, 78) (catégorie
    32), originaires de Corée du Sud et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: '79/782/EWG: Entscheidung der Kommission vom 31. August 1979, mit der die
    Französische Republik ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Samt, Plüsch, Schlingengewebe und
    Chenillegewebe, ausgenommen Frottiergewebe aus Baumwolle und Bänder, aus Wolle,
    Baumwolle oder synthetischen oder künstlichen Spinnstoffen der Tarifnummer ex
    58.04 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 58.04-07 ; 11 ; 15 ; 18 ;
    41 ; 43 ; 45 ; 61 ; 63 ; 67 ; 69 ; 71 ; 75 ; 77 ; 78), Kategorie 32, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/782/EØF: Kommissionens beslutning af 31. august 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede fløjls-,
    plys- og chenillestoffer, bortset fra håndklædefrotterstof og lignende frotterstof
    af bomuld samt vævede bånd af uld, bomuld eller kemofibre, som henhører under
    pos. ex 58.04 i den fælles toldtarif (NIMEXE-nummer 58.04-07, 11, 15, 18, 41,
    43, 45, 61, 63, 67, 69, 71, 75, 77, 78; kategori 32), har oprindelse i Sydkorea
    og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/782/CEE: Decisione della Commissione, del 31 agosto 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario velluti, felpe,
    tessuti ricci e tessuti di ciniglia, esclusi i tessuti di cotone ricci di tipo
    spugna e i nastri, galloni e simili, di lana, di cotone o di fibre tessili sentetiche
    o artificiali, della voce ex 58.04 della tariffa doganale comune (codici Nimexe:
    58.04-07, 11, 15, 18, 41, 43, 45, 61, 63, 67, 69, 71, 75, 77, 78), categoria 32,
    originari della Corea del Sud e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/782/EEG: Beschikking van de Commissie van 31 augustus 1979 waarbij
    de Franse Republiek wordt gemachtigd fluweel, pluche, lussenweefsel en chenilleweefsel,
    met uitzondering van katoen weefsel, en lint van wol, katoen of van synthetische
    of kunstmatige weefsels, van post ex 58.04 van het gemeenschappelijk douanetarief
    (NIMEXE-code 58.04-07, 11, 15, 18, 41, 43, 45, 61, 63, 67, 69, 71, 75, 77, 78)
    (categorie 32), van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
