    2786. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2003/575/CE: Decisione della Commissione, del 1° agosto 2003, che modifica
    la decisione 2001/618/CE per inserire alcuni dipartimenti della Francia e una
    provincia dell''Italia nell''elenco degli Stati membri e loro regioni indenni
    dalla malattia di Aujeszky e in quello delle regioni in cui si applicano programmi
    riconosciuti di eradicazione di tale malattia (Testo rilevante ai fini del SEE)
    [notificata con il numero C(2003) 2786]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2003. gada 1. augusts), ar ko groza Lēmumu 2001/618/EK
    par dažu Francijas departamentu un Itālijas provinces iekļaušanu tādu dalībvalstu
    un reģionu sarakstos, kuri nav Aujeski slimības skarti, un reģionu sarakstos,
    kuros ir apstiprinātas Aujeski slimības izskaušanas programmas (izziņots ar
    dokumenta numuru C(2003) 2786)
  type: main
- language: lt
  script: Latn
