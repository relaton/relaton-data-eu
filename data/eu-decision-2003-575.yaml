title:
- language: en
  script: Latn
  content: '2003/575/EC: Commission Decision of 1 August 2003 amending Decision 2001/618/EC
    to include certain departments of France and a Province in Italy in the lists
    of Member States and regions free of Aujeszky''s disease and regions where approved
    Aujeszky''s disease eradication programmes are in place (Text with EEA relevance)
    (notified under document number C(2003) 2786)'
  type: main
- language: fr
  script: Latn
  content: '2003/575/CE: Décision de la Commission du 1er août 2003 modifiant la
    décision 2001/618/CE afin d''inclure certains départements français et une
    province italienne dans la liste des États membres ou régions des États membres
    indemnes de la maladie d''Aujeszky, ainsi que des régions dans lesquelles des
    programmes d''éradication de la maladie d''Aujeszky approuvés ont été instaurés
    (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2003)
    2786]'
  type: main
- language: de
  script: Latn
  content: '2003/575/EG: Entscheidung der Kommission vom 1. August 2003 zur Änderung
    der Entscheidung 2001/618/EG im Hinblick auf die Aufnahme bestimmter französischer
    Departements und einer italienischen Provinz in die Liste der Mitgliedstaaten
    und Regionen, die frei von der Aujeszky-Krankheit sind, bzw. in die Liste der
    Regionen, in denen genehmigte Tilgungsprogramme eingeleitet worden sind (Text
    von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2003) 2786)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 1 август 2003 година
    за изменение на Решение 2001/618/ЕО относно включването
    на някои департаменти във Франция и една провинция
    в Италия в списъците на държавите-членки или
    на региони на държавите-членки, свободни от
    болестта на Ауески, както и региони, в които
    има одобрени програми за ликвидиране на болестта
    (нотифицирано под номер С(2003)2786)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 1. srpna 2003, kterým se mění rozhodnutí
    2001/618/ES tak, aby se některé departementy Francie a jedna provincie v Itálii
    zahrnuly do seznamů členských států a oblastí prostých Aujezskyho choroby
    a oblastí, ve kterých jsou zavedeny schválené programy eradikace Aujezskyho
    choroby (oznámeno pod číslem K(2003) 2786)
  type: main
- language: da
