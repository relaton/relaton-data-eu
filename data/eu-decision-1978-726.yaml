id: EUDecision1978726
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 August 1978 authorizing the Italian Republic
    not to apply Community treatment to man-made fibres, falling within heading No
    ex 56.04 of the Common Customs Tariff, originating in Romania and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/726/CEE: Décision de la Commission, du 11 août 1978, autorisant la
    République italienne à exclure du traitement communautaire les fibres textiles
    synthétiques et artificielles discontinues et déchets de fibres textiles synthétiques
    de la position Ex 56.04 du Tarif douanier commun, originaires de Roumanie et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. August 1978, mit der die Italienische
    Republik ermächtigt wird, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche synthetische und künstliche Spinnfasern und Abfälle
    von synthetischen Spinnstoffen der Tarifnummer ex 56.04 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 11. august 1978 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage korte kemofibre og affald af
    kemofibre, som henhører under pos. ex 56.04 i den fælles toldtarif, har oprindelse
    i Rumænien og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 agosto 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le fibre tessili sintetiche
    o artificiali in fiocco e i cascami di fibre tessili sintetiche, della voce ex
    56.04 della tariffa doganale comune, originari della Romania e messi in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 augustus 1978 waarbij de Italiaanse
    Republiek wordt gemachtigd synthetische en kunstmatige stapelvezels en afval van
    synthetische vezels, van post ex 56.04 van het gemeenschappelijk douanetarief,
    van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
