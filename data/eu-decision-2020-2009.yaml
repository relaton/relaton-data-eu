title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/2009 of 22 June 2020 establishing
    the best available techniques (BAT) conclusions, under Directive 2010/75/EU of
    the European Parliament and of the Council on industrial emissions, for surface
    treatment using organic solvents including preservation of wood and wood products
    with chemicals (notified under document C(2020) 4050)
  type: main
- language: fr
  script: Latn
