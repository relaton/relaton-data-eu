    Richtlinie 2010/75/EU des Europäischen Parlaments und des Rates über Industrieemissionen
    in Bezug auf die Behandlung von Oberflächen unter Verwendung von organischen
    Lösungsmitteln, einschließlich der Konservierung von Holz und Holzerzeugnissen
    mit Chemikalien (Bekannt gegeben unter Aktenzeichen C(2020) 4050)
  type: main
