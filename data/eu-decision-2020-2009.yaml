    irányelv szerinti elérhető legjobb technikákkal (BAT) kapcsolatos következtetéseknek
    a szerves oldószerekkel történő felületkezelés, többek között a faanyagok
    és a faipari termékek vegyi anyagokkal történő tartósítása tekintetében
    történő meghatározásáról (az értesítés a C(2020) 4050. számú dokumentummal
    történt)
  type: main
