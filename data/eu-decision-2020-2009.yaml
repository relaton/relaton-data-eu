    établissant les meilleures techniques disponibles (MTD), au titre de la directive
    2010/75/UE du Parlement européen et du Conseil relative aux émissions industrielles,
    pour le traitement de surface à l’aide de solvants organiques, y compris pour
    la préservation du bois et des produits dérivés du bois au moyen de produits
    chimiques [notifiée sous le numéro C(2020) 4050]
  type: main
