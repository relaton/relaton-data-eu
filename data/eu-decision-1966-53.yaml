title:
- language: fr
  script: Latn
  content: Décision 66/53/CEE de la Commission, du 14 décembre 1965, portant nouvelle
    modification de sa décision du 21 décembre 1964, autorisant la perception de
    taxes compensatoires à l'importation, dans la République française, de dextrines,
    d'amidons et fécules solubles ou torréfiés, ainsi que de parements préparés
    et apprêts préparés, à base de matières amylacées, en provenance de certains
    États membres
  type: main
- language: de
  script: Latn
  content: '66/53/EWG: Entscheidung der Kommission vom 14. Dezember 1965 zur erneuten
    Änderung ihrer Entscheidung vom 21. Dezember 1964 über die Erhebung von Ausgleichsabgaben
    bei der Einfuhr von Dextrin, löslicher und gerösteter Stärke, zubereiteten
    Zurichtemitteln und zubereiteten Appreturen auf der Grundlage von Stärke aus
    verschiedenen Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '66/53/CEE: Decisione della Commissione, del 14 dicembre 1965, che modifica
    nuovamente la decisione del 21 dicembre 1964 con cui si autorizza la riscossione
    di tasse di compensazione sull''importazione nella Repubblica francese di destrine,
    amidi e fecole solubili o torrefatte, nonché di bozzime e appretti preparati
    a base di materie amidacee, provenienti da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/53/EEG: Beschikking van de Commissie van 14 december 1965 tot nieuwe
    wijziging van haar beschikking van 21 december 1964 houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Franse Republiek van dextrine,
    oplosbaar of geroost zetmeel en preparaten voor het appreteren op basis van zetmeel
    of van zetmeelderivaten, uit bepaalde Lid-Staten'
  type: main
