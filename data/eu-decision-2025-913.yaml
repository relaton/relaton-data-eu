    av genomförandebeslut (EU) 2021/1067 vad gäller en uppdatering av de tekniska
    villkoren för harmoniserad användning av radiospektrum i frekvensbandet 5945
    – 6425 MHz för införande av Wireless Access System med Radio Local Area Network
    (WAS/RLAN) [delgivet med nr C(2025) 3032]
