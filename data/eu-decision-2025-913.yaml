id: EUDecision2025913
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/913 of 20 May 2025 amending
    Implementing Decision (EU) 2021/1067 as regards an update of technical conditions
    for the harmonised use of radio spectrum in the 5945–6425 MHz frequency band
    for the implementation of wireless access systems including radio local area networks
    (WAS/RLANs) (notified under document C(2025) 3032)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/913 de la Commission du 20 mai 2025
    modifiant la décision d’exécution (UE) 2021/1067 en ce qui concerne une mise
    à jour des conditions techniques de l’utilisation harmonisée du spectre radioélectrique
    dans la bande de fréquences 5945 — 6425 MHz pour la mise en œuvre des systèmes
    d’accès sans fil, y compris les réseaux locaux radioélectriques (WAS/RLAN)
    [notifiée sous le numéro C(2025) 3032]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/913 der Kommission vom 20. Mai 2025 zur
    Änderung des Durchführungsbeschlusses (EU) 2021/1067 im Hinblick auf die Aktualisierung
    technischer Bedingungen für die harmonisierte Nutzung von Funkfrequenzen im Frequenzband
    5945-6425 MHz für die Einführung drahtloser Zugangssysteme einschließlich lokaler
    Funknetze (WAS/Funk-LANs) (Bekannt gegeben unter Aktenzeichen C(2025) 3032)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2025/913 на Комисията
    от 20 май 2025 година за изменение на Решение за
    изпълнение (ЕС) 2021/1067 по отношение на актуализация
    на техническите условия за хармонизираното
    използване на радиочестотния спектър в честотната
    лента 5945 — 6425 MHz за внедряване на безжични системи
    за достъп, включително местни радиомрежи (WAS/RLAN)
    (нотифицирано под номер С(2025) 3032)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2025/913 ze dne 20. května 2025,
    kterým se mění prováděcí rozhodnutí (EU) 2021/1067, pokud jde o aktualizaci
    technických podmínek pro harmonizované využívání rádiového spektra v
    kmitočtovém pásmu 5945–6425 MHz pro zavádění bezdrátových přístupových
    systémů, jejichž součástí jsou rádiové místní sítě (WAS/RLAN) (oznámeno
    pod číslem C(2025) 3032)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2025/913 af 20. maj 2025 om
    ændring af gennemførelsesafgørelse (EU) 2021/1067 for så vidt angår en ajourføring
    af de tekniske betingelser for samordnet anvendelse af frekvensressourcer i 5945
    — 6425 MHz-båndet med sigte på indførelse af trådløse adgangssystemer,
    herunder radiobaserede lokalnet (WAS/RLAN) (meddelt under nummer C(2025) 3032)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2025/913 της Επιτροπής,
    της 20ής Μαΐου 2025, για την τροποποίηση της εκτελεστικής
    απόφασης (ΕΕ) 2021/1067 όσον αφορά τροποποίηση των
    τεχνικών όρων σχετικά με την εναρμονισμένη
    χρήση ραδιοφάσματος στη ζώνη συχνοτήτων των
    5945 – 6425 MHz για την υλοποίηση συστημάτων ασύρματης
    πρόσβασης, συμπεριλαμβανομένων τοπικών δικτύων
    ραδιοεπικοινωνιών (WAS/RLAN) [κοινοποιηθείσα υπό
    τον αριθμό C(2025) 3032]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2025/913, 20. mai 2025, millega muudetakse
    rakendusotsust (EL) 2021/1067 seoses tehniliste tingimuste ajakohastamisega raadiospektri
    sagedusala 5945 – 6425 MHz ühtlustatud kasutamiseks traadita juurdepääsusüsteemide,
    sealhulgas raadio-kohtvõrkude (WAS/RLANide) rakendamiseks (teatavaks tehtud numbri
    C(2025) 3032 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2025/913, annettu 20 päivänä
    toukokuuta 2025, radiotaajuuksien yhdenmukaisesta käytöstä 5945 – 6425 MHz:n
    taajuusalueella langattomien liityntäjärjestelmien, kuten langattomien lähiverkkojen
    (WAS/RLAN-verkkojen) toteuttamista varten annetun täytäntöönpanopäätöksen
    (EU) 2021/1067 muuttamisesta teknisten ehtojen päivittämisen osalta (tiedoksiannettu
    numerolla C(2025) 3032)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2025/913 ón gCoimisiún an 20 Bealtaine
    2025 lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2021/1067 a mhéid a bhaineann
    le coinníollacha teicniúla a thabhairt cothrom le dáta maidir le húsáid chomhchuibhithe
    speictrim raidió i mbanda minicíochta 5945 — 6425 MHz le haghaidh cur chun
    feidhme córas rochtana gan sreang lena n-áirítear líonraí achair logánta
    raidió (WAS/RLANanna) (tugadh fógra faoi leis an doiciméad C(2025) 3032)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2025/913 оd 20. svibnja 2025. o izmjeni
    Provedbene odluke (EU) 2021/1067 u pogledu tehničkih uvjeta za usklađenu uporabu
    radiofrekvencijskog spektra u frekvencijskom pojasu 5945 – 6425 MHz za uvođenje
    sustavâ bežičnog pristupa, uključujući radijske lokalne mreže (WAS/RLAN)
    (priopćeno pod brojem dokumenta C(2025) 3032)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/913 végrehajtási határozata (2025. május 20.)
    az (EU) 2021/1067 végrehajtási határozatnak a rádióspektrum 5945 – 6425
    MHz frekvenciasávjának vezeték nélküli hozzáférési rendszerek – többek
    között rádiós helyi hálózatok – (WAS/RLAN-ok) megvalósítására történő
    harmonizált használatára vonatkozó műszaki feltételek aktualizálása tekintetében
    való módosításáról (az értesítés a C(2025) 3032. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/913 della Commissione, del 20 maggio
    2025, che modifica la decisione di esecuzione (UE) 2021/1067 per quanto riguarda
    un aggiornamento delle condizioni tecniche per l’uso armonizzato dello spettro
    radio nella banda di frequenze 5945 — 6425 MHz per l’implementazione di sistemi
    di accesso senza fili, comprese le reti locali in radiofrequenza (WAS/RLAN) [notificata
    con il numero C(2025) 3032]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2025/913 (2025. gada 20. maijs) par
    Īstenošanas lēmuma (ES) 2021/1067 grozījumiem, kas atjaunina tehniskos nosacījumus
    radiofrekvenču spektra saskaņotai lietošanai 5945 – 6425 MHz radiofrekvenču
    joslā bezvadu piekļuves sistēmu, ieskaitot lokālos tīklus (WAS/RLAN), darbības
    nodrošināšanai (izziņots ar dokumenta numuru C(2025) 3032)
  type: main
- language: lt
  script: Latn
  content: 2025 m. gegužės 20 d. Komisijos įgyvendinimo sprendimas (ES) 2025/913,
    kuriuo dėl techninių sąlygų atnaujinimo iš dalies keičiamas Įgyvendinimo
    sprendimas (ES) 2021/1067 dėl suderinto 5945–6425 MHz dažnių juostos radijo
    spektro naudojimo belaidės prieigos sistemoms, įskaitant vietinius radijo ryšio
    tinklus, (belaidės prieigos sistemoms, įskaitant RLAN) diegti (pranešta dokumentu
    Nr. C(2025) 3032)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/913 tal-20
    ta’ Mejju 2025 li temenda d-Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni
    (UE) 2021/1067 dwar l-aġġornament tal-kundizzjonijiet tekniċi għall-użu armonizzat
    tal-ispettru tar-radju fil-banda tal-frekwenzi 5945–6425 MHz għall-implimentazzjoni
    ta’ sistemi tal-aċċess mingħajr fili inkluż networks ta’ żona lokali
    bir-radju (WAS/RLANs) (notifikata bid-dokument C(2025) 3032)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2025/913 van de Commissie van 20 mei 2025 tot wijziging
    van Uitvoeringsbesluit (EU) 2021/1067 van de Commissie betreffende een actualisering
    van de technische voorwaarden voor het geharmoniseerde gebruik van het radiospectrum
    in de frequentieband 5945 — 6425 MHz voor de implementatie van draadloze toegangssystemen
    met inbegrip van radio local area networks (WAS/RLAN’s) (Kennisgeving geschied
    onder nummer C(2025) 3032)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2025/913 z dnia 20 maja 2025 r. zmieniająca
    decyzję wykonawczą Komisji (UE) 2021/1067 w odniesieniu do aktualizacji warunków
    technicznych zharmonizowanego wykorzystania widma radiowego w paśmie częstotliwości
    5945 – 6425 MHz celem wdrożenia systemów dostępu bezprzewodowego, w tym lokalnych
    sieci radiowych (WAS/RLANs) (notyfikowana jako dokument nr C(2025) 3032)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2025/913 da Comissão, de 20 de maio de 2025,
    que altera a Decisão de Execução (UE) 2021/1067 no respeitante à atualização
    das condições técnicas da utilização harmonizada do espetro de radiofrequências
    na faixa de frequências dos 5945 — 6425 MHz para a implementação de sistemas
    de acesso sem fios, incluindo redes locais via rádio (WAS/RLAN) [notificada com
    o número C(2025) 3032]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/913 a Comisiei din 20 mai 2025
    de modificare a Deciziei de punere în aplicare (UE) 2021/1067 în ceea ce privește
    o actualizare a condițiilor tehnice pentru utilizarea armonizată a spectrului
    radio din banda de frecvențe de 5945 – 6425 MHz pentru instalarea sistemelor
    de acces pe suport radio, inclusiv a rețelelor locale cu acces pe suport radio
    (WAS/RLAN) [notificată cu numărul C(2025) 3032]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2025/913 z 20. mája 2025, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2021/1067, pokiaľ ide o aktualizáciu
    technických podmienok harmonizovaného využívania rádiového frekvenčného
    spektra vo frekvenčnom pásme 5945 – 6425 MHz na zavedenie bezdrôtových prístupových
    systémov vrátane miestnych rádiových sietí (WAS/RLAN) [oznámené pod číslom
    C(2025) 3032]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2025/913 z dne 20. maja 2025 o spremembi
    Izvedbenega sklepa (EU) 2021/1067 glede posodobitve tehničnih pogojev za harmonizirano
    uporabo radiofrekvenčnega spektra v frekvenčnem pasu 5945–6425 MHz za izvedbo
    brezžičnih dostopovnih sistemov, vključno z radijskimi lokalnimi omrežji (WAS/RLAN)
    (notificirano pod dokumentarno številko C(2025) 3032)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2025/913 de la Comisión, de 20 de mayo de
