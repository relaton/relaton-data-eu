    respecta a una actualización de las condiciones técnicas para la utilización
    armonizada del espectro radioeléctrico en la banda de frecuencias de 5945 —
    6425 MHz con vistas a la aplicación de los sistemas de acceso inalámbrico, incluidas
    las redes radioeléctricas de área local (WAS/RLAN) [notificada con el número
    C(2025) 3032]
  type: main
- language: sv
  script: Latn
