title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2447/83 of 30 August 1983 re-establishing
    the levying of customs duties on camphor, natural refined and synthetic, falling
    within subheading 29.13 B I b) and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2447/83 de la Commission du 30 août 1983 portant rétablissement
    de la perception des droits de douane applicables au camphre naturel raffiné
    et synthétique, de la sous-position 29.13 B I b) du tarif douanier commun, originaire
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2447/83 der Kommission vom 30. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für Kampfer, natürliches, raffiniert, sowie synthetisches,
    der Tarifstelle 29.13 B I b), mit Ursprung in China, dem die in der Verordnung
    (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2447/83 af 30. august 1983 om genindførelse
    af opkrævning af told for campher raffinieret naturlig og syntetisk henhørende
    under pos. 29.13 B I b) og med oprindelse i Kina, som præferenceberettiget i
    henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2447/83 της Επιτροπής
    της 30ής Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για την καφουρά φυσική
    κεκαθαρμένη και συνθετική, της διακρίσεως
    29.13 Β Ι β) του Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου των προβλεπομένων από τον
    κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2447/83 della Commissione del 30 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili alla canfora naturale raffinata o
    sintetica, della sottovoce 29.13 B I b), della tariffa doganale comune, originaria
    della Cina, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2447/83 van de Commissie van 30 augustus 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kamfer, natuurlijke,
    andere dan ruwe, alsmede synthetische, van tariefpostonderverdeling 29.13 B I
    b), van oorsprong uit China, waarvoor de in Verordening (EEG) nr. 3377/82 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
