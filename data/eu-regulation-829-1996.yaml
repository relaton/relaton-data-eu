---
id: EURegulation8291996
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 829/96 of 6 May 1996 amending Regulation
    (EEC) No 1727/92 laying down detailed rules for implementation of the specific
    arrangements for the supply of cereal products to the Azores and Madeira and establishing
    the forecast supply balance and Regulation (EC) No 2883/94 establishing a forecast
    balance for the supply to the Canary Islands of agricultural products covered
    by the specific measures provided for in Articles 2, 3, 4 and 5 of Council Regulation
    (EEC) No 1601/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 829/96 de la Commission, du 6 mai 1996, modifiant d'une
    part le règlement (CEE) n° 1727/92 portant modalités d'application du régime
    spécifique pour l'approvisionnement en produits céréaliers des Açores et de
    Madère et établissant le bilan prévisionnel d'approvisionnement et, d'autre
    part, le règlement (CE) n 2883/94 établissant le bilan prévisionnel d'approvisionnement
    des îles Canaries pour les produits agricoles qui bénéficient du régime spécifique
    prévu aux articles 2 à 5 du règlement (CEE) n° 1601/92 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 829/96 der Kommission vom 6. Mai 1996 zur Änderung
    der Verordnung (EWG) Nr. 1727/92 mit besonderen Durchführungsbestimmungen zur
    Versorgung der Azoren und Madeiras mit Getreideerzeugnissen und zur Erstellung
    der vorläufigen Versorgungsbilanz sowie zur Änderung der Verordnung (EG) Nr.
    2883/94 mit der Bedarfsvorausschätzung für die Kanarischen Inseln für die landwirtschaftlichen
    Erzeugnisse, die unter die Sonderregelung gemäß den Artikeln 2 bis 5 der Verordnung
    (EWG) Nr. 1601/92 des Rates fallen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 829/96 на Комисията от 6 май
    1996 година за изменение на Регламент (ЕИО) №
    1727/92 относно определяне на подробни правила
    за прилагане на специален режим за снабдяване
    със зърнени продукти на Азорските острови
    и Мадейра и изготвяне на прогнозен баланс и
    Регламент (ЕО) № 2883/94 относно изготвяне на прогнозен
    баланс на снабдяване на Канарските острови
    със селскостопански продукти, предмет на специални
    мерки, предвидени в членове 2, 3, 4 и 5 от Регламент
    (ЕИО) № 1601/92 на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 829/96 ze dne 6. května 1996, kterým se mění
    nařízení (EHS) č. 1727/92, kterým se stanoví prováděcí pravidla ke zvláštnímu
    režimu dodávek produktů z obilovin na Azory a Madeiru a příslušné předběžné
    odhady dodávek, a nařízení (ES) č. 2883/94 o stanovení předběžného odhadu
    dodávek na Kanárské ostrovy pro zemědělské produkty, na které se vztahují
    zvláštní opatření upravená v článcích 2, 3, 4 a 5 nařízení Rady (EHS)
    č. 1601/92
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 829/96 af 6. maj 1996 om ændring af
    forordning (EØF) nr. 1727/92 om gennemførelsesbestemmelser for den særlige
    forsyningsordning for Azorerne og Madeira vedrørende kornprodukter og om udarbejdelse
    af opgørelsen over forsyningsbehovene og af forordning (EF) nr. 2883/94 om den
    foreløbige forsyningsopgørelse for De Kanariske Øer for de landbrugsprodukter,
    der er omfattet af den ordning, som er fastsat i artikel 2 til 5 i Rådets forordning
    (EØF) nr. 1601/92
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 829/96 της Επιτροπής,
    της 6ης Μαΐου 1996, για τροποποίηση, αφενός μεν,
    του κανονισμού (ΕΟΚ) αριθ. 1727/92 περί λεπτομερών
    κανόνων εφαρμογής του ειδικού καθεστώτος για
    τον εφοδιασμό σε προϊόντα σιτηρών των Αζορών
    και της Μαδέρας και περί καθορισμού του προβλεπόμενου
    ισοζυγίου εφοδιασμού και, αφετέρου, του κανονισμού
    (ΕΚ) αριθ. 2883/94 για τον καθορισμό του ισοζυγίου
    προβλέψεων εφοδιασμού των Καναρίων Νήσων σε
    γεωργικά προϊόντα που υπάγονται στο ειδικό
    καθεστώς που προβλέπεται στα άρθρα 2 έως 5 του
    κανονισμού (ΕΟΚ) αριθ. 1601/92 του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 829/96, 6. mai 1996, millega muudetakse määrust
    (EMÜ) nr 1727/92, millega sätestatakse teraviljasaaduste Assooridele ja Madeirale
    tarnimise erikorra üksikasjalikud rakenduseeskirjad ja kehtestatakse prognoositav
    tarnebilanss, ning määrust (EÜ) nr 2883/94, millega kehtestatakse nõukogu
    määruse (EMÜ) nr 1601/92 artiklites 2, 3, 4 ja 5 sätestatud erimeetmetega
    hõlmatud põllumajandussaaduste ja -toodete prognoositav tarnebilanss Kanaari
    saarte jaoks
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 829/96, annettu 6 päivänä toukokuuta 1996,
    Azorien ja Madeiran viljatuotteiden erityistä hankintajärjestelmää koskevista
    yksityiskohtaisista säännöistä ja arvioidun hankintataseen vahvistamisesta
    annetun asetuksen (ETY) N:o 1727/92 sekä Kanariansaarten arvioidun hankintataseen
    vahvistamisesta neuvoston asetuksen (ETY) N:o 1601/92 2-5 artiklassa säädettyyn
    erityiseen järjestelmään kuuluvien maataloustuotteiden osalta annetun neuvoston
    asetuksen (EY) N:o 2883/94 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 829/96/EK rendelete (1996. május 6.) az Azori-szigetek és
    Madeira gabonatermékekkel történő ellátására vonatkozó különleges rendelkezések
    részletes végrehajtási szabályainak megállapításáról és a várható
    ellátási mérleg létrehozásáról szóló 1727/92/EGK rendelet, valamint a
    Kanári-szigeteknek az 1601/92/EGK tanácsi rendelet 2., 3., 4. és 5. cikkében
    előírt különleges intézkedések hatálya alá tartozó mezőgazdasági termékekkel
    történő ellátása várható mérlegének létrehozásáról szóló 2883/94/EK
    rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 829/96 della Commissione, del 6 maggio 1996, che modifica
    il regolamento (CEE) n. 1727/92 relativo alle modalità di applicazione del regime
    specifico dell'approvvigionamento cerealicolo delle Azzorre e di Madera e al bilancio
    previsionale di approvvigionamento, da un lato, e dall'altro, il regolamento n.
    2883/94 che stabilisce il bilancio previsionale di approvvigionamento delle isole
    Canarie per i prodotti agricoli che beneficiano del regime specifico previsto
    dagli articoli 2 a 5 del regolamento (CEE) n. 1601/92 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 829/96 (1996. gada 6. maijs), ar ko groza Regulu
    (EEK) Nr. 1727/92, ar ko paredz sīki izstrādātus noteikumus par to, kā īstenot
    īpašo režīmu labības produktu piegādei Azoru un Madeiras salām un ar ko
    izveido piegādes bilanču prognozes, kā arī groza Regulu (EK) Nr. 2883/94,
    ar ko izveido bilanču prognozes to lauksaimniecības produktu piegādei Kanāriju
    salām, uz kuriem attiecas Padomes Regulas (EEK) Nr. 1601/92 2., 3., 4. un 5.
    pantā paredzētie īpašie pasākumi
  type: main
- language: lt
  script: Latn
  content: 1996 m. gegužės 6 d. Komisijos reglamentas (EB) Nr. 829/96, iš dalies
    keičiantis Reglamentą (EEB) Nr. 1727/92, nustatantį išsamias konkrečių priemonių
    dėl grūdų produktų tiekimo į Azorų ir Madeiros salas įgyvendinimo taisykles
    ir prognozuojamą tiekimo balansą, bei Reglamentą (EB) Nr. 2883/94, nustatantį
    prognozuojamą žemės ūkio produktų, kuriems taikomos konkrečios priemonės,
    numatytos Reglamento (EEB) Nr. 1601/92 2, 3, 4 ir 5 straipsniuose, tiekimo balansą
    Kanarų saloms
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 829/96 tas-6 ta’ Mejju 1996 li
    jemenda r-Regolament (KEE) Nru 1727/92 li jistipula regoli dettaljati għall-implimentazzjoni
    ta’ arranġamenti speċifiċi għall-provvista ta’ prodotti taċ-ċereali
    għall-Ażores u l-Madejra u jistabbilixxi l-bilanċ tal-provvista mbassar u prodotti
    agrikoli koperti minn miżuri speċifiċi msemmija fl-Artikoli 2, 3, 4 u 5 tar-
    Regolament tal-Kunsill (KEE) Nru 1601/92
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 829/96 van de Commissie van 6 mei 1996 tot wijziging
    van, enerzijds, Verordening (EEG) nr. 1727/92 houdende bepalingen ter uitvoering
    van de specifieke regeling voor de voorziening van de Azoren en Madeira met graanprodukten,
    en tot vaststelling van de voorzieningsbalans en, anderzijds, Verordening (EG)
    nr. 2883/94 tot vaststelling van een geraamde balans voor de voorziening van de
    Canarische eilanden met landbouwprodukten waarvoor de in de artikelen 2 tot en
    met 5 van Verordening (EEG) nr. 1601/92 van de Raad bedoelde specifieke regeling
    geldt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 829/96 z dnia 6 maja 1996 r. zmieniające
    rozporządzenie (EWG) nr 1727/92 określające szczegółowe zasady wykonania
    szczególnych ustaleń w odniesieniu do dostaw produktów zbożowych na Azory
    i Maderę oraz ustanawiające przewidywany bilans dostaw oraz rozporządzenie
    (WE) nr 2883/94 ustanawiające prognozę bilansu dostaw na Wyspy Kanaryjskie produktów
    rolnych objętych szczególnymi środkami przewidzianymi w art. 2, 3, 4 i 5 rozporządzenia
    Rady (EWG) nr 1601/92
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 829/96 da Comissão, de 6 de Maio de 1996, que altera,
    por um lado, o Regulamento (CEE) nº 1727/92 que estabelece normas de execução
    do regime específico para o abastecimento em produtos cerealíferos dos Açores
    e da Madeira e que estabelece a estimativa das necessidades de abastecimento,
    e, por outro, o Regulamento (CE) nº 2883/94, que estabelece a estimativa das
    necessidades de abastecimento das Ilhas Canárias em produtos agrícolas que beneficiam
    do regime específico previsto nos artigos 2º a 5º do Regulamento (CEE) nº
    1601/92 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 829/96 al Comisiei din 6 mai 1996 de modificare a
    unei părți din Regulamentul (CEE) nr. 1727/92 de stabilire a normelor de aplicare
    a măsurilor specifice privind aprovizionarea cu produse cerealiere a insulelor
    Azore și Madeira și a bilanțului previzional de aprovizionare și, pe de altă
    parte, a Regulamentului (CE) nr. 2883/94 privind bilanțului previzional de aprovizionare
    a Insulelor Canare cu anumite produse agricole aflate sub incidența măsurilor
    speciale prevăzute la articolele 2-5 din Regulamentul (CEE) nr. 1601/92 al Consiliului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 829/96 zo 6. mája 1996, ktorým sa mení a
    dopĺňa nariadenie (EHS) č. 1727/92 ustanovujúce podrobné pravidlá pre zavedenie
    osobitných opatrení pre dodávku obilninových výrobkov na Azory a Madeiru
    a ktorým sa ustanovuje bilancia prognózovaných dodávok a ktorým sa ďalej
    mení a dopĺňa nariadenie (ES) č. 2883/94 ustanovujúce bilanciu prognózovaných
    dodávok poľnohospodárskych výrobkov pre Kanárske ostrovy, ktoré sú zahrnuté
    pod osobitné opatrenia ustanovené v článkoch 2, 3, 4 a 5 nariadenia Rady (EHS)
    č. 1601/92
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 829/96 z dne 6. maja 1996 o spremembah Uredbe
    (EGS) št. 1727/92 o podrobnih pravilih za izvajanje posebnega režima za dobavo
    žitnih proizvodov Azorom in Madeiri in o sestavi načrtovane bilance oskrbe in
    Uredbe (ES) št. 2883/94 o določitvi načrtovane bilance oskrbe Kanarskih otokov
    s kmetijskimi proizvodi, ki so zajeti v posebnih ukrepih iz členov 2, 3, 4 in
    5 Uredbe Sveta (EGS) št. 1601/92
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 829/96 de la Comisión, de 6 de mayo de 1996, que modifica
    el Reglamento (CEE) nº 1727/92 por el que se establecen las disposiciones de
    aplicación del régimen específico para el abastecimiento de productos del sector
    de los cereales a las Azores y Madeira y el plan de previsiones de abastecimiento,
    y el Reglamento (CE) nº 2883/94 por el que se establece el plan de previsiones
    de abastecimiento a las islas Canarias de productos agrícolas acogidos al régimen
    específico establecido en los artículos 2, 3, 4 y 5 del Reglamento (CEE) nº
    1601/92 del Consejo
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens förordning (EG) nr 829/96 av den 6 maj 1996 om ändring
    dels av förordning (EEG) nr 1727/92 om fastställande av närmare bestämmelser
    för tillämpning av den särskilda ordningen för tillförsel av spannmålsprodukter
    till Azorerna och Madeira och om upprättande av den prognostiserade försörjningsbalansen
    och dels av förordning (EG) nr 2883/94 om upprättande av en prognostiserad försörjningsbalans
    för försörjningen av Kanarieöarna med de jordbruksprodukter som omfattas av
    den särskilda ordning som föreskrivs i artiklarna 2, 3, 4 och 5 i rådets förordning
    (EEG) nr 1601/92 #'
