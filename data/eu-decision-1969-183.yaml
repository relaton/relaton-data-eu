- language: fr
  script: Latn
  content: Décision du Conseil du 26 juin 1969, autorisant la tacite reconduction
    au-delà de la période transitoire de certains accords commerciaux conclus par
    les États membres avec les pays tiers
  type: main
- language: de
  script: Latn
  content: '69/183/EWG: Entscheidung des Rates vom 26. Juni 1969, durch die die stillschweigende
    Verlängerung bestimmter von den Mitgliedstaaten mit dritten Ländern geschlossener
    Handelsabkommen über die Übergangszeit hinaus genehmigt wird'
  type: main
- language: it
  script: Latn
  content: '69/183/CEE: Decisione del Consiglio, del 26 giugno 1969, che autorizza
    la tacita proroga oltre la fine del periodo transitorio di taluni accordi commerciali
    conclusi dagli Stati membri con i paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '69/183/EEG: Beschikking van de Raad van 26 juni 1969 houdende machtiging
    tot stilzwijgende verlenging tot na de overgangsperiode van bepaalde handelsakkoorden
    welke door de Lid-Staten met derde landen zijn gesloten'
