id: EURegulationNo20711980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2071/80 of 1 August 1980 re-establishing
    the levying of customs duties on elastic fabrics and trimmings (other than knitted
    or crocheted goods), products of category 105 (code 1050), originating in Hong
    Kong, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2071/80 de la Commission, du 1er août 1980, portant
    rétablissement de la perception des droits de douane applicables aux tissus (autres
    que de bonneterie) élastiques, de la catégorie 105 (code 1050), originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2071/80 der Kommission vom 1. August 1980 über die
    Wiedereinführung des Zollsatzes für gummielastische Gewebe, ausgenommen Gewirke,
    der Warenkategorie Nr. 105 (Kennziffer 1050), mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2071/80 af 1. august 1980 om genindførelse
    af opkrævning af toldafgifter for elastiske tekstilstoffer (undtagen trikotagestof),
    under kategori 105 (kode 1050), som har oprindelse i Hongkong og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2071/80 della Commissione, del 1° agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti (diversi da
    quelli a maglia) elastici, della categoria di prodotti n. 105 (codice 1050), originari
    di Hong Kong, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2071/80 van de Commissie van 1 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elastische
    weefsels (met uitzondering van brei- en haakwerk) van met rubberdraden verbonden
    textielstoffen, van de categorie van produkten nr. 105 (codenummer 1050) van oorsprong
    uit Hong-Kong, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 2894/79 van de Raad
  type: main
