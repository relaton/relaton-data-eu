title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1318/94 of 6 June 1994 terminating the review
    of anti-dumping measures concerning imports of certain acrylic fibres originating
    in Mexico and repealing the measures applying to such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1318/94 du Conseil du 6 juin 1994 clôturant la procédure
    de réexamen des mesures antidumping concernant les importations de certaines
    fibres acryliques originaires du Mexique et abrogeant les mesures applicables
    à ces importations
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1318/94 DES RATES vom 6. Juni 1994 zur Einstellung
    der Überprüfung der Antidumpingmaßnahmen betreffend die Einfuhren bestimmter
    Polyacrylfasern mit Ursprung in Mexiko und zur Aufhebung der für diese Einfuhren
    geltenden Maßnahmen
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 1318/94 af 6. juni 1994 om afslutning af den
    fornyede undersøgelse af antidumpingforanstaltningerne vedrørende importen af
    visse acrylfibre med oprindelse i Mexico og om ophævelse af gældende foranstaltninger
    vedrørende denne import
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1318/94 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 6ης Ιουνίου 1994 για την περάτωση της διαδικασίας
    επανεξέτασης των μέτρων αντιντάμπινγκ όσον
    αφορά τις εισαγωγές ορισμένων ακρυλικών ινών
    καταγωγής Μεξικού και για την κατάργηση των
    μέτρων που εφαρμόζονται σ' αυτές τις εισαγωγές
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1318/94 DEL CONSIGLIO del 6 giugno 1994 che chiude
    la procedura di riesame delle misure antidumping applicabili alle importazioni
    di alcuni tipi di fibre acriliche originarie del Messico e che abroga le misure
    applicabili a tali importazioni
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1318/94 VAN DE RAAD van 6 juni 1994 tot beëindiging
    van het nieuwe onderzoek van anti-dumpingmaatregelen betreffende de invoer van
    bepaalde acrylvezels van oorsprong uit Mexico en tot intrekking van de op dergelijke
    invoer van toepassing zijnde maatregelen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1318/94 DO CONSELHO de 6 de Junho de 1994 que encerra
    o processo de reexame das medidas anti-dumping relativas às importações de
    certas fibras acrílicas originárias do México e que revoga as medidas aplicáveis
    a essas importações
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 1318/94 DEL CONSEJO de 6 de junio de 1994 por el que
    se da por concluida la reconsideración de las medidas antidumping aplicables
    a las importaciones de determinadas fibras acrílicas originarias de México y
    por el que se derogan las medidas aplicables a dichas importaciones
  type: main
