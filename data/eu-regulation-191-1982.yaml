title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 191/82 of 19 January 1982 determining the
    amounts of the variable components, accession compensatory amounts and additional
    duties applicable from 1 February to 30 April 1982 on the importation into the
    Community of goods covered by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 191/82 de la Commission, du 19 janvier 1982, déterminant
    les montants des éléments mobiles et les montants compensatoires "adhésion",
    ainsi que les droits additionnels applicables pendant la période du 1er février
    au 30 avril 1982 inclus à l' importation dans la Communauté des marchandises
    relevant du règlement (CEE) n° 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 191/82 der Kommission vom 19. Januar 1982 zur Festsetzung
    der Höhe der vom 1. Februar bis einschließlich 30. April 1982 bei der Einfuhr
    der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    geltenden beweglichen Teilbeträge, Beitrittsausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 191 af 19. januar 1982 om fastsættelse
    af størrelsen af de variable elementer, tiltrædelsesudligningsbeløb og tillægstold
    for indførsel i Fællesskabet af varer henhørende under forordning (EØF) nr.
    3033/80 for perioden fra den 1. februar til den 30. april 1982
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 191/82 τής Επιτροπής τής
    19ης Ιανουαρίου 1982 περί καθορισμού τών ποσών
    τών κινητών στοιχείων καί τών εξισωτικών ποσών
    προσχωρήσεως, καθώς καί τών πρόσθετων δασμών
    πού εφαρμόζονται κατά τήν περίοδο από 1ης Φεβρουαρίου
    μέχρι καί 30ής Απριλίου 1982 κατά τήν εισαγωγή
