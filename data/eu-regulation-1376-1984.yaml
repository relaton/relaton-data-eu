title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1376/84 of 17 May 1984 re-establishing the
    levying of customs duties on certain artificial flowers, foliage or fruit and
    parts thereof, falling within heading No 67.02 and originating in Hong Kong, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1376/84 de la Commission du 17 mai 1984 portant rétablissement
    de la perception des droits de douane applicables à certains fleurs, feuillages,
    fruits artificiels et leurs parties, de la position 67.02 du tarif douanier commun,
    originaires de Hong-kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1376/84 der Kommission vom 17. Mai 1984 zur Wiedereinführung
    der Erhebung der Zölle für bestimmtes künstliches Blattwerk, künstliche Blumen
    und Früchte sowie Teile davon der Tarifnummer 67.02 mit Ursprung in Hongkong,
    dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1376/84 af 17. maj 1984 om genindførelse
    af opkrævning af told for bestemte kunstige blomster, blade og frugter samt dele
    deraf, henhørende under pos. 67.02 og med oprindelse i Hongkong, som præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1376/84 της Επιτροπής
    της 17ης Μαΐου 1984 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα άνθη, φυλλώματα,
    καρπούς, τεχνητά και τα μέρη τούτων της δασμολογικής
    κλάσεως 67.02 καταγωγής Χονγκ Κονγκ, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1376/84 della Commissione del 17 maggio 1984 che ripristina
    la riscossione dei dazi doganali applicabili a certi fiori, foglie, frutti artificiali
    e loro parti, della voce 67.02 della tariffa doganale comune, originari di Hong
    Kong beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n.
    3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1376/84 van de Commissie van 17 mei 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde kunstbloemen,
    kunstloofwerk en kunstvruchten, alsmede delen daarvan, van tariefpost 67.02 van
    oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
