title:
- language: en
  script: Latn
  content: '82/93/EEC: Commission Decision of 15 January 1982 amending Decision 80/1238/EEC
    authorizing certain Member States to provide for derogations from certain provisions
    of Council Directive 77/93/EEC in respect of oak wood originating in the United
    States of America (Only the French, German, Danish, Italian and Dutch texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/93/CEE: Décision de la Commission, du 15 janvier 1982, modifiant la
    décision 80/1238/CEE autorisant certains Etats membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil, pour le bois de
    chêne originaire des Etats-Unis d''Amérique (Les textes en langues française,
    allemande, danoise, italienne et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/93/EWG: Entscheidung der Kommission vom 15. Januar 1982 zur Änderung
    der Entscheidung 80/1238/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für
    Eichenholz mit Ursprung in den Vereinigten Staaten von Amerika, Ausnahmen von
    bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen (Nur der
    französische, deutsche, dänische, italienische und niederländische Text sind
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/93/EØF: Kommissionens beslutning af 15. januar 1982 om ændring af
    beslutning 80/1238/EØF om bemyndigelse af visse medlemsstater til at undtage
    egetræ med oprindelse i USA fra visse bestemmelser i Rådets direktiv 77/93/EØF
    (Kun den franske, tyske, danske, italienske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/93/EOK: Απόφαση τής Επιτροπής τής 15ης Ιανουαρίου
    1982 περί τροποποιήσεως τής αποφάσεως 80/1238/EOK
    περί παροχής αδείας σέ ορισμένα Κράτη μέλη
    νά προβλέψουν παρεκκλίσεις από ορισμένες διατάξεις
    τής οδηγίας 77/93/EOK τού Συμβουλίου γιά τό ξύλο
    δρυός καταγωγής Ηνωμένων Πολιτειών τής Αμερικής
    (Τα κείμενα στην γαλλική, γερμανική, δανέζικη,
    ιταλική και ολλανδική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '82/93/CEE: Decisione della Commissione, del 15 gennaio 1982, che modifica
    la decisione 80/1238/CEE della Commissione che autorizza taluni Stati membri a
    prevedere deroghe a determinate disposizioni della direttiva 77/93/CEE del Consiglio
