  script: Latn
  content: Commission Regulation (EU) No 502/2012 of 13 June 2012 initiating an investigation
    concerning the possible circumvention of anti-dumping measures imposed by Council
    Implementing Regulation (EU) No 2/2012 on imports of certain stainless steel fasteners
    and parts thereof originating in the People’s Republic of China by imports of
    certain stainless steel fasteners and parts thereof consigned from Malaysia, Thailand
    and the Philippines, whether declared as originating in Malaysia, Thailand and
    the Philippines or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 502/2012 de la Commission du 13 juin 2012 portant
    ouverture d’une enquête sur un éventuel contournement des mesures antidumping
    instituées par le règlement d'exécution (UE) n ° 2/2012 du Conseil sur les
    importations de certains éléments de fixation en acier inoxydable et de leurs
    parties originaires de la République populaire de Chine par des importations
    de certains éléments de fixation en acier inoxydable et de leurs parties expédiés
    de Malaisie, de Thaïlande et des Philippines, qu’ils aient ou non été déclarés
    originaires de ces pays, et soumettant ces importations à enregistrement
  type: main
