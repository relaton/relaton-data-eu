title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3466/80 of 30 December 1980 amending Regulation
    (EEC) No 2374/79 on the sale at reduced prices of certain products in the beef
    and veal sector held by intervention agencies to certain welfare institutions
    and bodies, as a result of Greek accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3466/80 de la Commission, du 30 décembre 1980, modifiant
    le règlement (CEE) n° 2374/79, relatif à la vente à prix réduit de certains
    produits du secteur de la viande bovine, détenus par les organismes d' intervention,
    à certaines institutions et collectivités à caractère social, à la suite
    de l' adhésion de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3466/80 der Kommission vom 30. Dezember 1980 zur Änderung
    der Verordnung (EWG) Nr. 2374/79 über den Verkauf von bestimmten durch die Interventionsstellen
    gelagerten Erzeugnissen des Rindfleischsektors zu herabgesetzten Preisen an bestimmte
    soziale Einrichtungen infolge des Beitritts Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3466/80 af 30. december 1980 om ændring
    af forordning (EØF) nr. 2374/79 om salg til nedsat pris af visse oksekødprodukter,
    som interventionsorganerne ligger inde med, til visse institutioner og organer
    med socialt formål, som følge af Grækenlands tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3466/80 της Επιτροπής
    της 30ής Δεκεμβρίου 1980 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 2374/79 «περί πωλήσεως σε
    μειωμένη τιμή ορισμένων προϊόντων του τομέως
    του βοείου κρέατος που κατέχουν οι οργανισμοί
    παρεμβάσεως, σε ορισμένα ιδρύματα και οργανισμούς
    κοινωνικού χαρακτήρος, λόγω της προσχωρήσεως
    της Ελλάδος»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3466/80 della Commissione, del 30 dicembre 1980, che
    modifica, in seguito all' adesione della Grecia, il regolamento (CEE) n. 2374/79
    relativo alla vendita a prezzo ridotto di taluni prodotti del settore delle carni
    bovine detenuti dagli organismi d' intervento a determinate istituzioni ed enti
    di carattere sociale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3466/80 van de Commissie van 30 december 1980 tot
    wijziging van Verordening (EEG) nr. 2374/79 inzake de verkoop tegen verlaagde
    prijs van bepaalde produkten van de rundvleessector die door de interventiebureaus
    zijn opgeslagen, aan bepaalde sociale instellingen en gemeenschappen, als gevolg
    van de toetreding van Griekenland
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3466/80 de la Comisión, de 30 de diciembre de 1980,
    por el que se modifica el Reglamento (CEE) n° 2374/79, relativo a la venta a
    precio reducido de determinados productos del sector de la carne de vacuno, en
    poder de los organismos de intervención, a determinadas instituciones y colectividades
    de carácter social, como consecuencia de la adhesión de Grecia
