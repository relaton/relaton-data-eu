    на техническите и оперативните спецификации,
    позволяващи търговската услуга, предлагана
    от създадената в рамките на програмата „Галилео“
    система, да изпълнява функцията, предвидена
    в член 2, параграф 4, буква в) от Регламент (ЕС)
    № 1285/2013 на Европейския парламент и на Съвета
  type: main
