title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/321 of 2 March 2018 amending
    Implementing Decision (EU) 2017/224 setting out the technical and operational
    specifications allowing the commercial service offered by the system established
    under the Galileo programme to fulfil the function referred to in Article 2(4)(c)
    of Regulation (EU) No 1285/2013 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/321 de la Commission du 2 mars 2018 modifiant
    la décision d'exécution (UE) 2017/224 déterminant les spécifications techniques
    et opérationnelles permettant au service commercial offert par le système issu
    du programme Galileo de répondre à la fonction visée à l'article 2, paragraphe
    4, point c), du règlement (UE) n° 1285/2013 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/321 der Kommission vom 2. März 2018
    zur Änderung des Durchführungsbeschlusses (EU) 2017/224 zur Festlegung der technischen
    und operativen Spezifikationen, durch die es ermöglicht wird, dass der kommerzielle,
    von dem System, das im Rahmen des Programms Galileo errichtet wurde, erbrachte
    Dienst die in Artikel 2 Absatz 4 Buchstabe c der Verordnung (EU) Nr. 1285/2013
    des Europäischen Parlaments und des Rates genannte Aufgabe erfüllen kann
  type: main
