title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 281/76 of 10 February 1976 re-establishing
    the levying of the customs duties on gloves, including mittens and mitts, protective,
    for all trades falling within subheading 42.03 B I, originating in Hong Kong,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 281/76 de la Commission, du 10 février 1976, portant
    rétablissement de la perception des droits de douane applicables aux gants, y
    compris les moufles de protection pour tous métiers, de la sous- position tarifaire
    42.03 B I, originaires de Hong-Kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 281/76 der Kommission vom 10. Februar 1976 zur Wiedereinführung
    des Zollsatzes für Handschuhe, einschließlich Schutzhandschuhe für alle Berufe,
    der Tarifstelle 42.03 B I, mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 281/76 af 10. februar 1976 om genindførelse
    af opkrævning af toldafgifter for beklædningsgenstande og tilbehør dertil,
    af læder eller kunstlæder, under underposition 42.03 B I, som har oprindelse
    i Hong Kong og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 281/76 della Commissione, del 10 febbraio 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, comprese le
    muffole, di protezione per qualunque mestiere, della sottovoce doganale 42.03
    B I, originari di Hong Kong, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 281/76 van de Commissie van 10 februari 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op handschoenen
    en wanten, werkhandschoenen en wanten, van onderverdeling 42.03 B I, van oorsprong
    uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad
    van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
