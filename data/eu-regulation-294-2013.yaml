  script: Latn
  content: Komission asetus (EU) N:o 294/2013, annettu 14 päivänä maaliskuuta 2013
    , muiden kuin ihmisravinnoksi tarkoitettujen eläimistä saatavien sivutuotteiden
    ja niistä johdettujen tuotteiden terveyssäännöistä sekä asetuksen (EY) N:o
    1774/2002 kumoamisesta annetun Euroopan parlamentin ja neuvoston asetuksen (EY)
    N:o 1069/2009 täytäntöönpanosta sekä neuvoston direktiivin 97/78/EY täytäntöönpanosta
    tiettyjen näytteiden ja tuotteiden osalta, jotka vapautetaan kyseisen direktiivin
    mukaisista eläinlääkärintarkastuksista rajatarkastusasemilla, annetun asetuksen
    (EU) N:o 142/2011 muuttamisesta ja oikaisemisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 294/2013 od 14. ožujka 2013. o izmjeni i ispravku
    Uredbe (EU) br. 142/2011 o provedbi Uredbe (EZ) br. 1069/2009 Europskog parlamenta
    i Vijeća o utvrđivanju zdravstvenih pravila za nusproizvode životinjskog podrijetla
    i od njih dobivene proizvode koji nisu namijenjeni prehrani ljudi te o provedbi
    Direktive Vijeća 97/78/EZ u pogledu određenih uzoraka i predmeta koji su izuzeti
    od veterinarskih pregleda na granici na temelju te Direktive
  type: main
- language: hu
  script: Latn
  content: A Bizottság 294/2013/EU rendelete ( 2013. március 14. ) a nem emberi
    fogyasztásra szánt állati melléktermékekre és a belőlük származó termékekre
    vonatkozó egészségügyi szabályok megállapításáról szóló 1069/2009/EK
    európai parlamenti és tanácsi rendelet végrehajtásáról, valamint a 97/78/EK
    tanácsi irányelvnek az egyes minták és tételek határon történő állat-egészségügyi
    ellenőrzése alóli, az irányelv szerinti mentesítése tekintetében történő
    végrehajtásáról szóló 142/2011/EU rendelet módosításáról és helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 294/2013 della Commissione, del 14 marzo 2013 , che
    modifica e rettifica il regolamento (UE) n. 142/2011 recante disposizioni di applicazione
    del regolamento (CE) n. 1069/2009 del Parlamento europeo e del Consiglio recante
    norme sanitarie relative ai sottoprodotti di origine animale e ai prodotti derivati
    non destinati al consumo umano e della direttiva 97/78/CE del Consiglio per quanto
    riguarda taluni campioni e articoli non sottoposti a controlli veterinari alla
    frontiera
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 294/2013 ( 2013. gada 14. marts ), ar ko groza
    Regulu (ES) Nr. 142/2011, ar kuru īsteno Eiropas Parlamenta un Padomes Regulu
    (EK) Nr. 1069/2009, ar ko nosaka veselības aizsardzības noteikumus attiecībā
    uz dzīvnieku izcelsmes blakusproduktiem un atvasinātajiem produktiem, kuri nav
    paredzēti cilvēku patēriņam, un īsteno Padomes Direktīvu 97/78/EK attiecībā
    uz dažiem paraugiem un precēm, kam uz robežas neveic veterinārās pārbaudes
    atbilstﾫgi minētajai direktīvai
  type: main
- language: lt
  script: Latn
  content: 2013 m. kovo 14 d. Komisijos reglamentas (ES) Nr. 294/2013, kuriuo iš
    dalies keičiamas ir ištaisomas Reglamentas (ES) Nr. 142/2011, kuriuo įgyvendinami
    Europos Parlamento ir Tarybos reglamentas (EB) Nr. 1069/2009, kuriuo nustatomos
    žmonėms vartoti neskirtų šalutinių gyvūninių produktų ir jų gaminių
    sveikumo taisyklės, ir Tarybos direktyva 97/78/EB dėl tam tikrų mėginių ir
    priemonių, kuriems netaikomi veterinariniai tikrinimai pasienyje pagal tą direktyvą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 294/2013 tal- 14 ta’ Marzu 2013 li
    jemenda u jikkoreġi r-Regolament (UE) Nru 142/2011 li jimplimenta r-Regolament
    (KE) Nru 1069/2009 tal-Parlament Ewropew u tal-Kunsill li jistabbilixxi regoli
    tas-saħħa li jirrigwardaw prodotti sekondarji tal-annimali jew derivati minnhom
    mhux maħsuba għall-konsum mill-bniedem u li jimplimenta d-Direttiva tal-Kunsill
    97/78/KE fir-rigward ta’ ċerti kampjuni u oġġetti li huma eżentati mill-verifiki
    veterinarji fil-fruntiera skont dik id-Direttiva
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 294/2013 van de Commissie van 14 maart 2013 tot wijziging
    en rectificatie van Verordening (EU) nr. 142/2011 tot uitvoering van Verordening
    (EG) nr. 1069/2009 van het Europees Parlement en de Raad tot vaststelling van
    gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke
    bijproducten en afgeleide producten en tot uitvoering van Richtlijn 97/78/EG van
    de Raad wat betreft bepaalde monsters en producten die vrijgesteld zijn van veterinaire
    controles aan de grens krachtens die richtlijn
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 294/2013 z dnia 14 marca 2013 r. w sprawie
    zmiany i sprostowania rozporządzenia (UE) nr 142/2011 w sprawie wykonania rozporządzenia
    Parlamentu Europejskiego i Rady (WE) nr 1069/2009 określającego przepisy sanitarne
    dotyczące produktów ubocznych pochodzenia zwierzęcego, nieprzeznaczonych do
    spożycia przez ludzi, oraz w sprawie wykonania dyrektywy Rady 97/78/WE w odniesieniu
    do niektórych próbek i przedmiotów zwolnionych z kontroli weterynaryjnych na
    granicach w myśl tej dyrektywy
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 294/2013 da Comissão, de 14 de março de 2013 ,
    que altera e corrige o Regulamento (UE) n. ° 142/2011 que aplica o Regulamento
    (CE) n. ° 1069/2009 do Parlamento Europeu e do Conselho que define regras sanitárias
    relativas a subprodutos animais e produtos derivados não destinados ao consumo
    humano e que aplica a Diretiva 97/78/CE do Conselho no que se refere a certas
    amostras e certos artigos isentos de controlos veterinários nas fronteiras ao
    abrigo da referida diretiva
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 294/2013 al Comisiei din 14 martie 2013 de modificare
    și rectificare a Regulamentului (UE) nr. 142/2011 de punere în aplicare a Regulamentului
    (CE) nr. 1069/2009 al Parlamentului European și al Consiliului de stabilire a
    unor norme sanitare privind subprodusele de origine animală și produsele derivate
    care nu sunt destinate consumului uman și de punere în aplicare a Directivei
    97/78/CE a Consiliului în ceea ce privește anumite probe și produse care sunt
    scutite de la controalele sanitar-veterinare la frontieră în conformitate cu
    directiva menționată
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 294/2013 zo 14. marca 2013 , ktorým sa mení,
    dopĺňa a opravuje nariadenie (EÚ) č. 142/2011, ktorým sa vykonáva nariadenie
    Európskeho parlamentu a Rady (ES) č. 1069/2009, ktorým sa ustanovujú zdravotné
    predpisy týkajúce sa vedľajších živočíšnych produktov a odvodených produktov
    neurčených na ľudskú spotrebu a ktorým sa vykonáva smernica Rady 97/78/ES,
    pokiaľ ide o určité vzorky a predmety vyňaté spod povinnosti veterinárnych
    kontrol na hraniciach podľa danej smernice
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 294/2013 z dne 14. marca 2013 o spremembi in
    popravku Uredbe Komisije (EU) št. 142/2011 o izvajanju Uredbe (ES) št. 1069/2009
    Evropskega parlamenta in Sveta o določitvi zdravstvenih pravil za živalske stranske
    proizvode in pridobljene proizvode, ki niso namenjeni prehrani ljudi, ter o izvajanju
    Direktive Sveta 97/78/ES glede nekaterih vzorcev in predmetov, ki so izvzeti iz
    veterinarskih pregledov na meji v skladu z navedeno direktivo
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 294/2013 de la Comisión, de 14 de marzo de 2013 ,
    que modifica el Reglamento (UE) n ° 142/2011, por el que se establecen las disposiciones
    de aplicación del Reglamento (CE) n ° 1069/2009 del Parlamento Europeo y del
    Consejo, por el que se establecen las normas sanitarias aplicables a los subproductos
    animales y los productos derivados no destinados al consumo humano, y la Directiva
    97/78/CE del Consejo en cuanto a determinadas muestras y unidades exentas de los
    controles veterinarios en la frontera en virtud de la misma
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 294/2013 av den 14 mars 2013 om ändring
    och rättelse av förordning (EU) nr 142/2011 om genomförande av Europaparlamentets
    och rådets förordning (EG) nr 1069/2009 om hälsobestämmelser för animaliska
    biprodukter och därav framställda produkter som inte är avsedda att användas
    som livsmedel och om genomförande av rådets direktiv 97/78/EG vad gäller vissa
    prover och produkter som enligt det direktivet är undantagna från veterinärkontroller
    vid gränsen
