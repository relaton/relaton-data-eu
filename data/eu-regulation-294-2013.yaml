title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 294/2013 of 14 March 2013 amending and correcting
    Regulation (EU) No 142/2011 implementing Regulation (EC) No 1069/2009 of the European
    Parliament and of the Council laying down health rules as regards animal by-products
    and derived products not intended for human consumption and implementing Council
    Directive 97/78/EC as regards certain samples and items exempt from veterinary
    checks at the border under that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 294/2013 de la Commission du 14 mars 2013 portant
    modification et rectification du règlement (UE) n ° 142/2011 portant application
    du règlement (CE) n ° 1069/2009 du Parlement européen et du Conseil établissant
    des règles sanitaires applicables aux sous-produits animaux et produits dérivés
    non destinés à la consommation humaine et portant application de la directive
    97/78/CE du Conseil en ce qui concerne certains échantillons et articles exemptés
    des contrôles vétérinaires effectués aux frontières en vertu de cette directive
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 294/2013 der Kommission vom 14. März 2013 zur Änderung
    und Berichtigung der Verordnung (EU) Nr. 142/2011 zur Durchführung der Verordnung
    (EG) Nr. 1069/2009 des Europäischen Parlaments und des Rates mit Hygienevorschriften
    für nicht für den menschlichen Verzehr bestimmte tierische Nebenprodukte sowie
    zur Durchführung der Richtlinie 97/78/EG des Rates hinsichtlich bestimmter gemäß
    der genannten Richtlinie von Veterinärkontrollen an der Grenze befreiter Proben
    und Waren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 294/2013 на Комисията от 14
    март 2013 година за изменение и поправка на Регламент
    (ЕС) № 142/2011 за прилагане на Регламент (ЕО) №
    1069/2009 на Европейския парламент и на Съвета
    за установяване на здравни правила относно
    странични животински продукти и производни
    продукти, непредназначени за консумация от
    човека, и за прилагане на Директива 97/78/ЕО на
    Съвета по отношение на някои проби и артикули,
    освободени от ветеринарни проверки на границата
    съгласно посочената директива
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 294/2013 ze dne 14. března 2013 , kterým
    se mění a opravuje nařízení (EU) č. 142/2011, kterým se provádí nařízení
    Evropského parlamentu a Rady (ES) č. 1069/2009 o hygienických pravidlech pro
    vedlejší produkty živočišného původu a získané produkty, které nejsou
    určeny k lidské spotřebě, a provádí směrnice Rady 97/78/ES, pokud jde o
    určité vzorky a předměty osvobozené od veterinárních kontrol na hranici
    podle uvedené směrnice
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 294/2013 af 14. marts 2013 om ændring
    og berigtigelse af forordning (EU) nr. 142/2011 om gennemførelse af Europa-Parlamentets
    og Rådets forordning (EF) nr. 1069/2009 om sundhedsbestemmelser for animalske
    biprodukter og afledte produkter, som ikke er bestemt til konsum, og om gennemførelse
    af Rådets direktiv 97/78/EF for så vidt angår visse prøver og genstande, der
    er fritaget for veterinærkontrol ved grænsen som omhandlet i samme direktiv
  type: main
- language: el
  script: Grek
