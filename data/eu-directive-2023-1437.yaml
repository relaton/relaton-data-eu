title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2023/1437 of 4 May 2023 amending, for
    the purposes of adapting to scientific and technical progress, Annex IV to Directive
    2011/65/EU of the European Parliament and of the Council as regards an exemption
    for mercury in melt pressure transducers for capillary rheometers under certain
    conditions
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2023/1437 de la Commission du 4 mai 2023 modifiant,
    aux fins de son adaptation au progrès scientifique et technique, l’annexe IV
    de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative au mercure utilisé dans les transducteurs de pression
    de fusion pour rhéomètres capillaires dans certaines conditions
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2023/1437 der Kommission vom 4. Mai 2023 zur
    Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs IV der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von Quecksilber in Schmelzdruckwandlern
    für Kapillarrheometer unter bestimmten Bedingungen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2023/1437 на Комисията
    от 4 май 2023 година за изменение, с цел привеждане
    в съответствие с научно-техническия напредък,
    на приложение IV към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета по отношение на освобождаването
    на употребата на живак в преобразуватели за
    налягане на стопилка за капилярни реометри
    при определени условия
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2023/1437 ze dne 4. května
    2023, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití rtuti v převodnících tlaku taveniny určených
    pro kapilární reometry za určitých podmínek
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2023/1437 af 4. maj 2023 om tilpasning
    til den videnskabelige og tekniske udvikling af bilag IV til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for anvendelsen
    af kviksølv i smeltetryktransducere til kapillarreometre under nærmere bestemte
    betingelser
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2023/1437 της
    Επιτροπής της 4ης Μαΐου 2023 για την τροποποίηση,
    με σκοπό την προσαρμογή στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος IV της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τη χρήση υδραργύρου σε μορφοτροπείς πίεσης
    τήξης για τριχοειδή ροόμετρα υπό ορισμένες
    προϋποθέσεις
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2023/1437, 4. mai 2023, millega muudetakse
    teaduse ja tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga elavhõbeda kasutamiseks kapillaarreomeetrite
    sulatusrõhuandurites teatavatel tingimustel
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2023/1437, annettu 4 päivänä toukokuuta
    2023, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen elohopean käyttöä kapillaarireometrien
    sulapaineenmuuntimissa tietyissä olosuhteissa koskevan poikkeuksen osalta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2023/1437 ón gCoimisiún an 4 Bealtaine 2023 lena
    leasaítear, chun í a chur in oiriúint don dul chun cinn eolaíoch agus teicniúil,
    Iarscríbhinn IV a ghabhann le Treoir 2011/65/AE ó Pharlaimint na hEorpa agus
    ón gComhairle a mhéid a bhaineann le díolúine maidir le mearcair i dtrasduchtóirí
    brú leáite le haghaidh réiméadair ribeacha faoi choinníollacha áirithe
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2023/1437 оd 4. svibnja 2023. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za živu u pretvaračima tlaka
    taljevine za kapilarne reometre pod određenim uvjetima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1437 felhatalmazáson alapuló irányelve (2023.
    május 4.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a higany kapilláris reométerek olvadéknyomás-jelátalakítóiban, bizonyos
    feltételek mellett történő használatára vonatkozó mentesség tekintetében,
    a tudományos és műszaki fejlődéshez történő hozzáigazítás céljából
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2023/1437 della Commissione del 4 maggio 2023 che
    modifica, adeguandolo al progresso scientifico e tecnico, l’allegato IV della
    direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione relativa all’uso del mercurio nei trasduttori di pressione di
    fusione per i reometri capillari a determinate condizioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2023/1437 (2023. gada 4. maijs),
    ar ko attiecībā uz atbrīvojumu dzīvsudraba izmantošanai kapilārajiem reometriem
    paredzētos kušanas spiediena devējos noteiktos apstākļos Eiropas Parlamenta
    un Padomes Direktīvas 2011/65/ES IV pielikumu groza, to pielāgojot zinātnes
    un tehnikas attīstībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2023/1437 2023 m. gegužės 4 d. kuria,
    derinant prie mokslo ir technikos pažangos, dėl išimties taikymo gyvsidabriui,
    tam tikromis sąlygomis naudojamam kapiliarinių reometrų lydalo slėgio keitliuose,
    iš dalies keičiamas Europos Parlamento ir Tarybos direktyvos 2011/65/ES IV priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2023/1437 4 ta’ Mejju 2023 li
    temenda, għall-finijiet ta’ adattament għall-progress xjentifiku u tekniku,
    l-Anness IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu tal-merkurju fit-trasdutturi tal-pressjoni tat-tidwib
    għal reometri kapillari f’ċerti kundizzjonijiet
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2023/1437 van de Commissie van 4 mei 2023 tot
    wijziging, met het oog op aanpassing aan de wetenschappelijke en technische vooruitgang,
    van bijlage IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad
    betreffende een vrijstelling voor kwik in smeltdrukomzetters voor capillaire rheometers
    onder bepaalde voorwaarden
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2023/1437 z dnia 4 maja 2023 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik IV do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    rtęci w przetwornikach ciśnienia topnienia do reometrów kapilarnych w określonych
    warunkach
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2023/1437 da Comissão de 4 de maio de 2023 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    IV da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante a
    uma isenção relativa à utilização de mercúrio em transdutores de pressão
    de fusão para reómetros capilares em determinadas condições
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2023/1437 a Comisiei din 4 mai 2023 de modificare,
    în scopul adaptării la progresele științifice și tehnice, a anexei IV la
    Directiva 2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește
    o derogare pentru mercurul din traductoarele de presiune la topire pentru reometre
    capilare în anumite condiții
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2023/1437 zo 4. mája 2023, ktorou sa
    na účely prispôsobenia technickému a vedeckému pokroku mení príloha IV
    k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku na
    používanie ortuti v prevodníkoch tlaku taveniny pre kapilárne reometre za
    určitých podmienok
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2023/1437 z dne 4. maja 2023 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo živega srebra v pretvornikih tlaka taline za kapilarne reometre pod
    določenimi pogoji zaradi prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2023/1437 de la Comisión de 4 de mayo de 2023
    por la que se modifica, para adaptarlo al progreso científico y técnico, el
    anexo IV de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo por lo
    que respecta a una exención relativa al uso de mercurio en transductores de presión
    de fusión para reómetros capilares en ciertas condiciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2023/1437 av den 4 maj 2023 om ändring,
    för anpassning till den vetenskapliga och tekniska utvecklingen, av bilaga IV
    till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller undantag för
    kvicksilver i smälttryckgivare för kapillärreometrar under vissa förhållanden
