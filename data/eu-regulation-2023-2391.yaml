    (EU) nr 360/2012 vad gäller stöd av mindre betydelse för beredning och saluföring
    av fiskeri- och vattenbruksprodukter samt förordning (EU) nr 717/2014 vad gäller
    det totala beloppet för stöd av mindre betydelse som beviljas ett enskilt företag,
    dess tillämpningsperiod och andra frågor
