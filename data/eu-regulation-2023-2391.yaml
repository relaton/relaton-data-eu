    glede pomoči de minimis za predelavo in trženje ribiških proizvodov in proizvodov
    iz akvakulture ter Uredbe (EU) št. 717/2014 glede skupnega zneska pomoči de
    minimis, dodeljene enemu podjetju, obdobja njene uporabe in drugih zadev
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2023/2391 de la Comisión, de 4 de octubre de 2023, por
    el que se modifican los Reglamentos (UE) n.o 717/2014, (UE) n.o 1407/2013, (UE)
    n.o 1408/2013 y (UE) n.o 360/2012, en lo que atañe a las ayudas de minimis para
    la transformación y comercialización de productos de la pesca y de la acuicultura,
    y el Reglamento (UE) n.o 717/2014, en lo que respecta al importe total de las
    ayudas de minimis concedidas a una única empresa, su período de aplicación
    y otros asuntos
  type: main
