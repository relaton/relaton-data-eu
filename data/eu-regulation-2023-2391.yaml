    Nru 360/2012 fir-rigward tal-għajnuna de minimis għall-ipproċessar u l-kummerċjalizzazzjoni
    ta’ prodotti tas-sajd u tal-akkwakultura, u r-Regolament (UE) Nru 717/2014 fir-rigward
