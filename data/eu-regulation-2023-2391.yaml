    n.o 360/2012 no que diz respeito aos auxílios de minimis a favor da transformação
    e comercialização dos produtos da pesca e da aquicultura e o Regulamento (UE)
    n.o 717/2014 no que diz respeito ao montante total dos auxílios de minimis concedidos
