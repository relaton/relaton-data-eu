    č. 360/2012, pokiaľ ide o pomoc de minimis na spracovanie a marketing produktov
    rybolovu a akvakultúry, a nariadenie (EÚ) č. 717/2014, pokiaľ ide o celkovú
    výšku pomoci de minimis poskytnutú jedinému podniku, obdobie jeho uplatňovania
    a iné záležitosti
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2023/2391 z dne 4. oktobra 2023 o spremembi uredb
