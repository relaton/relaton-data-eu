    groza Regulas (ES) Nr. 717/2014, (ES) Nr. 1407/2013, (ES) Nr. 1408/2013 un (ES)
    Nr. 360/2012 un attiecībā uz vienam vienotam uzņēmumam piešķirtā de minimis
    atbalsta kopējo summu, tā piemērošanas periodu un citiem jautājumiem groza
    Regulu (ES) Nr. 717/2014
  type: main
