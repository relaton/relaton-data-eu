    (UE) nr. 360/2012 în ceea ce privește ajutoarele de minimis pentru prelucrarea
    și comercializarea produselor pescărești și de acvacultură, precum și a
    Regulamentului (UE) nr. 717/2014 în ceea ce privește valoarea totală a ajutoarelor
    de minimis acordate unei singure întreprinderi, perioada de aplicare a acestuia
    și alte aspecte
  type: main
