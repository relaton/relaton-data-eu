    en (EU) nr. 360/2012 wat betreft de-minimissteun voor de verwerking en de afzet
    van visserij- en aquacultuurproducten, en van Verordening(EU) nr. 717/2014 wat
    betreft het totale bedrag aan de-minimissteun dat aan één onderneming wordt
    verleend, de periode van toepassing ervan en andere aangelegenheden
  type: main
