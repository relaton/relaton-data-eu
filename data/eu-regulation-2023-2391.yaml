title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2023/2391 of 4 October 2023 amending Regulations
    (EU) No 717/2014, (EU) No 1407/2013, (EU) No 1408/2013 and (EU) No 360/2012 as
    regards de minimis aid for the processing and marketing of fishery and aquaculture
    products, and Regulation (EU) No 717/2014 as regards the total amount of de minimis
    aid granted to a single undertaking, its period of application and other matters
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2023/2391 de la Commission du 4 octobre 2023 modifiant
    les règlements (UE) no 717/2014, (UE) no 1407/2013, (UE) no 1408/2013 et (UE)
    no 360/2012 en ce qui concerne les aides de minimis en faveur de la transformation
    et de la commercialisation des produits de la pêche et de l’aquaculture, ainsi
    que le règlement (UE) no 717/2014 en ce qui concerne le montant total des aides
    de minimis octroyées à une entreprise unique, sa période d’application et
    d’autres aspects
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2023/2391 der Kommission vom 4. Oktober 2023 zur Änderung
    der Verordnungen (EU) Nr. 717/2014, (EU) Nr. 1407/2013, (EU) Nr. 1408/2013 und
    (EU) Nr. 360/2012 hinsichtlich De-minimis-Beihilfen für die Verarbeitung und
    Vermarktung von Erzeugnissen der Fischerei und der Aquakultur und der Verordnung
    (EU) Nr. 717/2014 hinsichtlich des Gesamtbetrags der einem einzigen Unternehmen
    gewährten De-minimis-Beihilfen, ihrer Geltungsdauer und anderer Aspekte
  type: main
