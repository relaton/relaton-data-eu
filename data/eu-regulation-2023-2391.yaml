    agus (AE) 360/2012 a mhéid a bhaineann le cabhair de minimis le haghaidh próiseáil
    agus margú táirgí iascaigh agus dobharshaothraithe, agus Rialachán (AE) Uimh.
    717/2014 a mhéid a bhaineann le méid iomlán na cabhrach de minimis a dheonaítear
    do ghnóthas aonair, a tréimhse cur i bhfeidhm agus ábhair eile
  type: main
