    muuttamisesta kalastus- ja vesiviljelytuotteiden jalostukseen ja kaupan pitämiseen
    myönnettävän vähämerkityksisen tuen osalta sekä asetuksen (EU) N:o 717/2014
    muuttamisesta yksittäiselle yritykselle myönnetyn vähämerkityksisen tuen kokonaismäärän,
    keston ja muiden seikkojen osalta
  type: main
