  script: Latn
  content: A Bizottság (EU) 2023/2391 rendelete (2023. október 4.) a 717/2014/EU
    rendeletnek, az 1407/2013/EU rendeletnek, az 1408/2013/EU és a 360/2012/EU rendeletnek
    a halászati és akvakultúra-termékek feldolgozásához és forgalmazásához
    nyújtott csekély összegű támogatás tekintetében, valamint a 717/2014/EU
    rendeletnek az egy és ugyanazon vállalkozásnak nyújtható csekély összegű
    támogatás teljes összege, az alkalmazási időszaka és egyéb kérdések tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2023/2391 della Commissione, del 4 ottobre 2023, che modifica
    i regolamenti (UE) n. 717/2014, (UE) n. 1407/2013, (UE) n. 1408/2013 e (UE) n.
    360/2012 per quanto riguarda gli aiuti de minimis per la trasformazione e la commercializzazione
    dei prodotti della pesca e dell’acquacoltura e il regolamento (UE) n. 717/2014
    per quanto riguarda l’importo complessivo degli aiuti de minimis concessi a
    un’impresa unica, il relativo periodo di applicazione ed altri aspetti
  type: main
- language: lv
