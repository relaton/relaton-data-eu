    u pogledu de minimis potpora za preradu i stavljanje na tržište proizvoda ribarstva
    i akvakulture te Uredbe (EU) br. 717/2014 u pogledu ukupnog iznosa de minimis
    potpora dodijeljenih jednom poduzetniku, njezina razdoblja primjene i drugih pitanja
  type: main
