    nr 360/2012 w odniesieniu do pomocy de minimis przyznawanej na przetwarzanie i
    wprowadzanie do obrotu produktów rybołówstwa i akwakultury oraz rozporządzenie
    (UE) nr 717/2014 w odniesieniu do całkowitej kwoty pomocy de minimis przyznawanej
    jednemu przedsiębiorstwu, do okresu stosowania takiej pomocy i do innych kwestii
  type: main
