    der Einfuhren aus der Deutschen Demokratischen Republik stammender und in einigen
    Mitgliedstaaten im freien Verkehr befindlicher Waren (Nur der französische Text
    ist verbindlich) (87/157/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 18. februar 1987 om bemyndigelse af Den franske
