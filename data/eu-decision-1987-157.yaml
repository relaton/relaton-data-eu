title:
- language: en
  script: Latn
  content: '87/157/EEC: Commission Decision of 18 February 1987 authorizing the French
    Republic to apply intra-Community surveillance to imports of certain products
    originating in the German Democratic Republic, which have been put into free circulation
    in certain Member States (only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/157/CEE: Décision de la Commission du 18 février 1987 autorisant
    la République française à procéder à une surveillance intracommunautaire
    des importations de certains produits, originaires de la République démocratique
    allemande et mis en libre pratique dans certains États membres (Le texte en langue
    française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
