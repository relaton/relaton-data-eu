    Wspólnoty składających się na panoński region biogeograficzny (notyfikowana
    jako dokument nr C(2022) 871)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/224 da Comissão de 16 de fevereiro de
    2022 que adota a décima terceira atualização da lista dos sítios de importância
    comunitária da região biogeográfica Panónica [notificada com o número C(2022)
    871]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/224 a Comisiei din 16 februarie
