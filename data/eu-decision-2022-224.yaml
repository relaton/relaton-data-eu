    871 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/224, annettu 16 päivänä
    helmikuuta 2022, Pannonian vyöhykkeen luonnonmaantieteellisellä alueella olevista
