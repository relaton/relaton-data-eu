    δέκατου τρίτου επικαιροποιημένου καταλόγου
    τόπων κοινοτικής σημασίας για την παννονική
    βιογεωγραφική περιοχή [κοινοποιηθείσα υπό
    τον αριθμό C(2022) 871]
  type: main
- language: et
  script: Latn
