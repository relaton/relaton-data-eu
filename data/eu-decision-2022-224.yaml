title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/224 of 16 February 2022 adopting
    the thirteenth update of the list of sites of Community importance for the Pannonian
    biogeographical region (notified under document C(2022) 871)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/224 de la Commission du 16 février
    2022 arrêtant la treizième actualisation de la liste des sites d’importance
    communautaire pour la région biogéographique pannonique [notifiée sous le numéro
    C(2022) 871]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/224 der Kommission vom 16. Februar 2022
    zur Annahme einer dreizehnten aktualisierten Liste von Gebieten von gemeinschaftlicher
    Bedeutung in der pannonischen biogeografischen Region (Bekannt gegeben unter Aktenzeichen
    C(2022) 871)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/224 на Комисията
