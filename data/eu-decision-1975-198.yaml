title:
- language: en
  script: Latn
  content: Commission Decision of 4 March 1975 authorizing the United Kingdom of the
    Netherlands until 30 June 1975 to permit the marketing of seed of runner bean
    satisfying less stringent requirements
  type: main
- language: fr
  script: Latn
  content: '75/198/CEE: Décision de la Commission, du 4 mars 1975, autorisant le
    Royaume-Uni et le Royaume des Pays-Bas à admettre, pour une période expirant
    le 30 juin 1975, la commercialisation de semences de haricots d''Espagne, soumises
    à des exigences réduites'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. März 1975 zur Ermächtigung des Vereinigten
    Königreichs und des Königreichs der Niederlande, für einen Zeitraum, der am
    30. Juni 1975 abläuft, Saatgut von Prunkbohnen mit minderen Anforderungen zum
    gewerbsmäßigen Verkehr zuzulassen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. marts 1975 om bemyndigelse til Det forenede
    Kongerige og kongeriget Nederlandene til at tillade, at frø af pralbønner, der
    opfylder mindre strenge krav, bringes i handelen i et tidsrum, der udløber den
    30. juni 1975
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 marzo 1975, che autorizza il Regno Unito
    e il Regno dei Paesi Bassi ad ammettere, per un periodo che scade il 30 giugno
    1975, la commercializzazione di sementi di fagiolo di Spagna, soggette a requisiti
    ridotti
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 maart 1975 waarbij het Verenigd Koninkrijk
    en het Koninkrijk der Nederlanden worden gemachtigd om voor een periode eindigend
    op 30 juni 1975 zaad van pronkbomen, waaraan minder strenge eisen zijn gesteld,
    tot de handel toe te laten
