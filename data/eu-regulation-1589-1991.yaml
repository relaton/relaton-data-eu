title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1589/91 of 12 June 1991 re-establishing
    the levying of customs duties on products of category 20 (order No 40.0200), originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1589/91 de la Commission, du 12 juin 1991, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 20 (numéro d' ordre 40.0200), originaires de la Thaïlande,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) nº
    3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1589/91 der Kommission vom 12. Juni 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 20 (laufende
    Nummer 40.0200) mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1589/91 af 12. juni 1991 om genindførelse
    af opkrævning af told for varer under kategori nr. 20 (løbenummer 40.0200),
    som har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1589/91 της Επιτροπής
    της 12ης Ιουνίου 1991 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    20 (αύξων αριθμός 40.0200), καταγωγής Ταϊλάνδης,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1589/91 della Commissione, del 12 giugno 1991, che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 20 (numero d' ordine 40.0200), originari della Tailandia beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1589/91 van de Commissie van 12 juni 1991 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van categorie 20 (volgnummer 40.0200), van oorsprong uit Thailand, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1589/91 da Comissão, de 12 de Junho de 1991, que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria
    20 (número de ordem 40.0200), originários da Tailândia, beneficiários das
    preferências pautais previstas no Regulamento (CEE) nº 3832/90 do Conselho
  type: main
- language: es
  script: Latn
