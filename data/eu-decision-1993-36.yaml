title:
- language: en
  script: Latn
  content: '93/36/EEC: Commission Decision of 18 December 1992 amending Decision 89/152/EEC
    authorizing certain Member States to provide for exceptions from certain provisions
    of Council Directive 77/93/EEC in respect of potatoes for human consumption originating
    in Cuba (Only the German, French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/36/CEE: Décision de la Commission, du 18 décembre 1992, modifiant
    la décision 89/152/CEE autorisant certains Etats membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil pour les pommes
    de terre de consommation originaires de Cuba (Les textes en langues allemande,
    française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/36/EWG: Entscheidung der Kommission vom 18. Dezember 1992 zur Änderung
    der Entscheidung 89/152/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für
    Speisekartoffeln mit Ursprung in Kuba Ausnahmen von bestimmten Vorschriften der
    Richtlinie 77/93/EWG des Rates vorzusehen (Nur der deutsche, französische und
    niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/36/EØF: Kommissionens beslutning af 18. december 1992 om ændring
    af beslutning 89/152/EØF om bemyndigelse af visse medlemsstater til at fastsætte
    undtagelser fra visse bestemmelser i Rådets direktiv 77/93/EØF for spisekartofler
    med oprindelse i Cuba (Kun den tyske, franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '93/36/ΕΟΚ: Απόφαση της Επιτροπής της 18ης Δεκεμβρίου
    1992 που τροποποιεί την απόφαση 89/152/ΕΟΚ η οποία
    επιτρέπει σε ορισμένα κράτη μέλη να προβλέψουν
    παρεκκλίσεις από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ του Συμβουλίου σχετικά με τις πατάτες
    για ανθρώπινη κατανάλωση, καταγωγής Κούβας
    (Τα κείμενα στην γερμανική, γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '93/36/CEE: Decisione della Commissione, del 18 dicembre 1992, recante
    modifica della decisione 89/152/CEE che autorizza taluni Stati membri a prevedere
    deroghe, per le patate da consumo originarie di Cuba, ad alcune disposizioni della
    direttiva 77/93/CEE (Il testi in lingua tedesca, francese e olandese sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '93/36/EEG: Beschikking van de Commissie van 18 december 1992 tot wijziging
    van Beschikking 89/152/EEG waarbij bepaalde Lid- Staten worden gemachtigd om voor
    consumptieaardappelen van oorsprong uit Cuba uitzonderingen op sommige bepalingen
    van Richtlijn 77/93/EEG van de Raad toe te staan (Slechts de teksten in de Duitse,
    Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/36/CEE: Decisão da Comissão, de 18 de Dezembro de 1992, que altera
    a Decisão 89/152/CEE, que autoriza certos Estados-membros a derrogar a determinadas
    normas da Directiva 77/93/CEE do Conselho em relação à batata de consumo originária
    de Cuba (Apenas fazem fé os textos nas línguas alemã, francesa e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '93/36/CEE: Decisión de la Comisión, de 18 de diciembre de 1992, por
    la que se modifica la Decisión 89/152/CEE por la que se autoriza a determinados
    Estados miembros para prever excepciones a determinadas disposiciones de la Directiva
    77/93/CEE respecto de las patatas destinadas al consumo humano, originarias de
    Cuba (Los textos en lenguas alemana, francesa y neerlandesa son los únicos auténticos)'
  type: main
