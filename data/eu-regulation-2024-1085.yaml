title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/1085 of 13 March 2024 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards on the assessment methodology under which
    competent authorities verify an institution’s compliance with the requirements
    to use internal models for market risk
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/1085 de la Commission du 13 mars 2024 complétant
    le règlement (UE) no 575/2013 du Parlement européen et du Conseil par des normes
    techniques de réglementation concernant la méthode d’évaluation à utiliser
    par les autorités compétentes pour vérifier le respect par un établissement
    des exigences relatives à l’utilisation de modèles internes pour risque de
    marché
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/1085 der Kommission vom 13. März 2024
    zur Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und
    des Rates im Hinblick auf technische Regulierungsstandards für die Beurteilungsmethode,
    nach der die zuständigen Behörden prüfen, ob ein Institut die Anforderungen
    bezüglich der Verwendung interner Modelle für das Marktrisiko erfüllt
  type: main
- language: bg
  script: Cyrl
