title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 830/2014 of 30 July 2014 amending
    Council Regulation (EC) No 1890/2005, Council Implementing Regulation (EU) No
    2/2012 and Council Implementing Regulation (EU) No 205/2013 as regards the product
    scope of the current anti-dumping measures concerning stainless steel fasteners
    and parts thereof, and as regards newcomer review requests, and providing for
    the possibility of repayment or remission of duties in certain cases
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 830/2014 de la Commission du 30 juillet
    2014 modifiant le règlement (CE) n ° 1890/2005 du Conseil, le règlement d'exécution
    (UE) n ° 2/2012 du Conseil et le règlement d'exécution (UE) n ° 205/2013 du
    Conseil en ce qui concerne la définition des produits soumis aux mesures antidumping
    en vigueur applicables aux éléments de fixation en acier inoxydable et leurs
    parties ainsi qu'en ce qui concerne les demandes de réexamen au titre de nouvel
    exportateur, et prévoyant la possibilité du remboursement ou de la remise des
    droits dans certains cas
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 830/2014 der Kommission vom 30. Juli
    2014 zur Änderung der Verordnung (EG) Nr. 1890/2005 des Rates, der Durchführungsverordnung
    (EU) Nr. 2/2012 des Rates und der Durchführungsverordnung (EU) Nr. 205/2013 des
    Rates in Bezug auf die Warendefinition der geltenden Antidumpingmaßnahmen gegenüber
    Verbindungselementen und Teilen davon aus nicht rostendem Stahl und in Bezug auf
    Anträge auf Neuausführerüberprüfung sowie zur Eröffnung der Möglichkeit
    der Erstattung oder des Erlasses von Zöllen in bestimmten Fällen
  type: main
