    Regulamentului de punere în aplicare (UE) nr. 2/2012 al Consiliului și a Regulamentului
    de punere în aplicare (UE) nr. 205/2013 al Consiliului în ceea ce privește
    definiția produselor vizate de actualele măsuri antidumping aplicabile elementelor
    de fixare din oțel inoxidabil și părților acestora, precum și în ceea ce
    privește cererile de reexaminare în calitate de nou exportator și de oferire
    a posibilității de rambursare sau de remitere a taxelor în anumite cazuri
  type: main
