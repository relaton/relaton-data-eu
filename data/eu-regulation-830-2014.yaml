  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 830/2014 ze dne 30. července
    2014 , kterým se mění nařízení Rady (ES) č. 1890/2005, prováděcí nařízení
    Rady (EU) č. 2/2012 a prováděcí nařízení Rady (EU) č. 205/2013, pokud
    jde o oblast působnosti stávajících antidumpingových opatření týkajících
    se spojovacích prostředků a jejich částí z korozivzdorné oceli a pokud
    jde o žádosti o přezkum pro nové vývozce, a kterým se stanoví možnost
