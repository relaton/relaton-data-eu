    uredbe Sveta (EU) št. 205/2013 glede obsega izdelka iz veljavnih protidampinških
    ukrepov za pritrdilne elemente iz nerjavnega jekla in njihove dele in glede zahtevkov
    za pregled novih izvoznikov ter o zagotovitvi možnosti za vračilo ali odpust
