title:
- language: en
  script: Latn
  content: '83/525/EEC: Commission Decision of 14 October 1983 amending Decision 81/888/EEC
    extending, as regards certain non-member countries, the periods relating to the
    checks on practices for the maintenance of varieties laid down in Council Directives
    70/457/EEC and 70/458/EEC'
  type: main
- language: fr
  script: Latn
  content: '83/525/CEE: Décision de la Commission du 14 octobre 1983 modifiant la
    décision 81/888/CEE, visant à proroger, en ce qui concerne certains pays tiers,
    le délai concernant les contrôles des sélections conservatrices prévu par
    les directives 70/457/CEE et 70/458/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '83/525/EWG: Entscheidung der Kommission vom 14. Oktober 1983 zur Änderung
    der Entscheidung 81/888/EWG zwecks Verlängerung der in den Richtlinien 70/457/EWG
    und 70/458/EWG vorgesehenen Fristen für die Kontrolle der Erhaltungszüchtungen
    für einige Drittländer'
  type: main
- language: da
  script: Latn
  content: '83/525/EØF: Kommissionens beslutning af 14. oktober 1983 om ændring
    af beslutning 81/888/EØF om forlængelse for visse tredjelandes vedkommende af
    fristerne for kontrol med vedligeholdelsesavl i direktiv 70/457/EØF og 70/458/EØF'
  type: main
- language: el
  script: Grek
  content: '83/525/ΕΟΚ: Απόφαση της Επιτροπής της 14ης
    Οκτωβρίου 1983 που τροποποιεί την απόφαση 81/888/ΕΟΚ
    περί παρατάσεως, όσον αφορά ορισμένες τρίτες
    χώρες, της προθεσμίας η οποία προβλέπεται σχετικά
    με τους ελέγχους των διατηρητέων ποικιλιών
    στις οδηγίες του Συμβουλίου 70/457/ΕΟΚ και 70/458/ΕΟΚ'
  type: main
- language: it
  script: Latn
  content: '83/525/CEE: Decisione della Commissione del 14 ottobre 1983 recante modifica
    della decisione 81/888/CEE che proroga, per quanto riguarda taluni paesi terzi,
    il termine concernente i controlli delle selezioni conservatrici previsto dalle
    direttive 70/457/CEE e 70/458/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '83/525/EEG: Beschikking van de Commissie van 14 oktober 1983 tot wijziging
