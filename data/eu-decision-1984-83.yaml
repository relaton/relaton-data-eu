  script: Latn
  content: '84/83/EEC: Council Decision of 31 January 1984 on the conclusion of an
    Agreement in the form of an exchange of letters concerning an interim extension
    of the Protocol annexed to the Agreement between the Government of the Republic
    of Senegal and the European Economic Community on fishing off the coast of Senegal
    for the period 16 November 1983 to 15 January 1984'
  type: main
- language: fr
  script: Latn
  content: '84/83/CEE: Décision du Conseil du 31 janvier 1984 concernant la conclusion
    de l''accord sous forme d''échange de lettres sur la prorogation intérimaire
    du protocole annexé à l''accord entre le gouvernement de la République du Sénégal
    et la Communauté économique européenne concernant la pêche au large de la
    côte sénégalaise, pour la période allant du 16 novembre 1983 au 15 janvier
    1984'
  type: main
- language: de
  script: Latn
  content: '84/83/EWG: Beschluß des Rates vom 31. Januar 1984 über den Abschluß
    des Abkommens in Form eines Briefwechsels über die vorläufige Verlängerung
    des Protokolls im Anhang des Abkommens zwischen der Regierung der Republik Senegal
    und der Europäischen Wirtschaftsgemeinschaft über die Fischerei vor der senegalesischen
    Küste für die Zeit vom 16. November 1983 bis zum 15. Januar 1984'
  type: main
- language: da
  script: Latn
  content: '84/83/EØF: Rådets afgørelse af 31. januar 1984 om indgåelse af aftalen
    i form af brevveksling om foreløbig forlængelse for perioden fra den 16. november
    1983 til den 15. januar 1984 af gyldigheden af protokollen, der er knyttet som
    bilag til aftalen mellem regeringen for republikken Senegal og Det europæiske
    økonomiske Fællesskab om fiskeri ud for Senegals kyst'
  type: main
- language: el
  script: Grek
