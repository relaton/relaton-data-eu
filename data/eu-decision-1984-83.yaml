    ανταλλαγής επιστολών για την ενδιάμεση παράταση
    του πρωτοκόλλου που προσαρτάται στη συμφωνία
    μεταξύ της κυβερνήσεως της Δημοκρατίας της
    Σενεγάλης και της Ευρωπαϊκής Οικονομικής Κοινότητας
    περί της αλιείας στα ανοικτά των ακτών της
