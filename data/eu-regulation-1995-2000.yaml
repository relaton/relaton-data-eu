title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1995/2000 of 18 September 2000 imposing a definitive
    anti-dumping duty and collecting definitively the provisional duties imposed on
    imports of solutions of urea and ammonium nitrate originating in Algeria, Belarus,
    Lithuania, Russia and Ukraine, and terminating the anti-dumping proceeding in
    respect of imports originating in the Slovak Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1995/2000 du Conseil du 18 septembre 2000 instituant
    un droit antidumping définitif et portant perception définitive des droits provisoires
    sur les importations de solutions d'urée et de nitrate d'ammonium originaires
    d'Algérie, du Belarus, de Lituanie, de Russie et d'Ukraine et clôturant la procédure
    antidumping concernant les importations en provenance de la République slovaque
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1995/2000 des Rates vom 18. September 2000 zur Einführung
    eines endgültigen Antidumpingzolls und zur endgültigen Vereinnahmung der vorläufigen
    Zölle auf die Einfuhren von Lösungen von Harnstoff und Ammoniumnitrat mit Ursprung
    in Algerien, Belarus, Litauen, Russland und der Ukraine und zur Einstellung des
    Antidumpingverfahrens betreffend die Einfuhren mit Ursprung in der Slowakischen
    Republik
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1995/2000 ze dne 18. září 2000 o uložení
    konečného antidumpingového cla z dovozu směsí močoviny a dusičnanu amonného
    pocházejících z Alžírska, Běloruska, Litvy, Ruska a Ukrajiny a konečném
    výběru uložených prozatímních cel a o zastavení antidumpigového řízení
    týkajícího se dovozů ze Slovenské republiky
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1995/2000 af 18. september 2000 om indførelse
    af en endelig antidumpingtold og endelig opkrævning af den midlertidige told
    på importen af opløsninger af urinstof og ammoniumnitrat med oprindelse i Algeriet,
    Belarus, Litauen, Rusland og Ukraine og om afslutning af antidumpingproceduren,
    for så vidt angår importen med oprindelse i Slovakiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1995/2000 του Συμβουλίου,
    της 18ης Σεπτεμβρίου 2000, για την επιβολή οριστικού
    δασμού αντιντάμπινγκ και την οριστική είσπραξη
    των προσωρινών δασμών αντιντάμπινγκ που επιβάλλονται
    στις εισαγωγές διαλυμάτων ουρίας και νιτρικού
    αμμωνίου, καταγωγής Αλγερίας, Λευκορωσίας,
    Λιθουανίας, Ρωσίας και Ουκρανίας και για την
