    αφορά τις εισαγωγές, καταγωγής Δημοκρατίας
    της Σλοβακίας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1995/2000, 18. september 2000, millega kehtestatakse
    Alžeeriast, Leedust, Ukrainast, Valgevenest ja Venemaalt pärit uurea ja ammooniumnitraadi
    lahuste impordi suhtes lõplik dumpinguvastane tollimaks ja nõutakse lõplikult
    sisse nende suhtes kehtestatud ajutine tollimaks ning lõpetatakse Slovaki Vabariigist
    pärineva impordi suhtes kohaldatav dumpinguvastane menetlus
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1995/2000, annettu 18 päivänä syyskuuta 2000,
    Algeriasta, Liettuasta, Valko-Venäjältä, Venäjältä ja Ukrainasta peräisin
    olevan urean ja ammoniumnitraatin liuosseoksen tuontia koskevan lopullisen polkumyyntitullin
    käyttöönotosta ja väliaikaisten polkumyyntitullien kantamisesta lopullisesti
    sekä polkumyyntimenettelyn päättämisestä Slovakiasta peräisin olevan tuonnin
    osalta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1995/2000/EK rendelete (2000. szeptember 18.) az Algériából,
    Fehéroroszországból, Litvániából, Oroszországból és Ukrajnából származó
    karbamid- és ammóniumnitrát-oldatok importjára vonatkozó végleges dömpingellenes
    vám kivetéséről és a kivetett ideiglenes vámok végleges beszedéséről,
    valamint a Szlovák Köztársaságból származó importra vonatkozó dömpingellenes
    eljárás megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1995/2000 del Consiglio, del 18 settembre 2000, che
    istituisce un dazio antidumping definitivo e riscuote definitivamente i dazi provvisori
    istituiti sulle importazioni di soluzioni di urea e nitrato di ammonio originarie
    dell'Algeria, della Bielorussia, della Lituania, della Russia e dell'Ucraina e
    chiude il procedimento antidumping per le importazioni originarie della Repubblica
    slovacca
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1995/2000 (2000. gada 18. septembris), ar ko piemēro
    galīgo antidempinga maksājumu un galīgi iekasē uzlikto pagaidu maksājumu
    attiecībā uz Alžīrijas, Baltkrievijas, Lietuvas, Krievijas un Ukrainas izcelsmes
    urīnvielas un amonija nitrāta šķīdumu importu un izbeidz antidempinga procedūru
    attiecībā uz Slovākijas Republikas izcelsmes importu
  type: main
- language: lt
  script: Latn
  content: 2000 m. rugsėjo 18 d. Tarybos reglamentas (EB) Nr. 1995/2000, nustatantis
    galutinius antidempingo muitus ir galutinai surenkantis laikinuosius muitus už
    Alžyro, Baltarusijos, Lietuvos, Rusijos ir Ukrainos kilmės karbamido ir amonio
    nitrato tirpalų importą ir nutraukiantis antidempingo tyrimą dėl Slovakijos
    Respublikos kilmės importo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 1995/2000 tat-18 ta' Settembru 2000
    li jimponi dazju definittiv kontra d-dumping u li jiġbor b'mod definittiv id-dazji
    proviżorji imposti fuq l-importazzjonijiet ta' soluzzjonijiet ta' urea u nitrati
    ta' l-ammonja li joriġinaw mill-Alġerija, il-Belarus, il-Lituwanja, ir-Russja
    u l-Ukrajna, u li jtemmu l-proċedura kontra d-dumping fir-rigward ta' l-importazzjonijiet
    li joriġinaw mir-Repubblika Slovakka
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1995/2000 van de Raad van 18 september 2000 tot instelling
    van een definitief antidumpingrecht en tot definitieve invordering van de voorlopige
    rechten op de invoer van oplossingen van ureum en ammoniumnitraat uit Algerije,
    Wit-Rusland, Litouwen, Rusland en Oekraïne, en tot beëindiging van de antidumpingprocedure
    betreffende de invoer uit Slowakije
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1995/2000 z dnia 18 września 2000 r. nakładające
    ostateczne cło antydumpingowe i ostatecznie pobierające tymczasowe cło antydumpingowe
    nałożone na przywóz roztworów mocznika i azotanu amonu, pochodzących z Algierii,
    Białorusi, Litwy, Rosji i Ukrainy i kończące postępowanie antydumpingowe w
    odniesieniu do przywozu pochodzącego z Republiki Słowackiej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1995/2000 do Conselho, de 18 de Setembro de 2000,
    que cria um direito anti-dumping definitivo e que estabelece a cobrança definitiva
    dos direitos provisórios criados sobre as importações de soluções de ureia
    e de nitrato de amónio originárias da Argélia, da Bielorrússia, da Lituânia,
    da Rússia e da Ucrânia, e que encerra o processo anti-dumping relativo às importações
    originárias da República Eslovaca
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1995/2000 z 18. septembra 2000, ktorým sa ukladá
    konečné antidumpingové clo, vyberá s konečnou platnosťou dočasné clo uložené
    na dovozy roztokov močoviny a dusičnanu amónneho s pôvodom v Alžírsku, Bielorusku,
    Litve, Rusku a na Ukrajine a ktorým sa ukončuje antidumpingové konanie pre
    dovozy s pôvodom v Slovenskej republike
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1995/2000 z dne 18. septembra 2000 o uvedbi dokončne
    protidampinške dajatve in o dokončnem pobiranju začasnih dajatev, uvedenih
    na uvoz raztopin sečnine in amonijevega nitrata s poreklom iz Alžirije, Belorusije,
    Litve, Rusije in Ukrajine, ter o ustavitvi protidampinškega postopka v zvezi
    z uvozom s poreklom iz Slovaške republike
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1995/2000 del Consejo, de 18 de septiembre de 2000,
    por el que se establece un derecho antidumping definitivo, por el que se perciben
    definitivamente los derechos provisionales impuestos sobre las importaciones de
    soluciones de urea y nitrato de amonio originarias de Argelia, Bielorrusia, Lituania,
    Rusia y Ucrania, y por el que se da por concluido el procedimiento antidumping
    por lo que se refiere a las importaciones originarias de la República Eslovaca
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1995/2000 av den 18 september 2000 om införande
    av en slutgiltig antidumpningstull och om slutgiltigt uttag av de preliminära
    tullar som införts på import av karbamidammoniumnitratlösningar med ursprung
    i Demokratiska folkrepubliken Algeriet, Republiken Vitryssland, Republiken Litauen,
    Ryska federationen och Ukraina och om avslutande av antidumpningsförfarandet
    beträffande import med ursprung i Slovakiska republiken
