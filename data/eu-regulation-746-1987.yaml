    ou confectionnées (fourrures) de la sous-position 43.03 B du tarif douanier commun,
    originaires de Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3924/86 du Conseil
  type: main
