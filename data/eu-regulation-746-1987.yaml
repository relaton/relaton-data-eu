  content: Commission Regulation (EEC) No 746/87 of 16 March 1987 re-establishing
    the levying of customs duties on other articles of furskin falling within subheading
    43.03 B, originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
