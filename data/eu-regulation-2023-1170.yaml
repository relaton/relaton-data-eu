    concernant l’autorisation d’une préparation de Saccharomyces cerevisiae CNCM
    I-1077 en tant qu’additif pour l’alimentation des vaches laitières, des bovins
    d’engraissement, des espèces mineures de ruminants à l’engraissement et
    des camélidés à l’engraissement (titulaire de l’autorisation: Danstar Ferment
    AG, représentée par Lallemand SAS) et abrogeant le règlement (CE) no 1200/2005'
  type: main
