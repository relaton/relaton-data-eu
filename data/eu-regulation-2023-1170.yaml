title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/1170 of 15 June 2023 concerning
    the authorisation of a preparation of Saccharomyces cerevisiae CNCM I-1077 as
    a feed additive for dairy cows, cattle for fattening, minor ruminant species for
    fattening and camelids for fattening (holder of the authorisation: Danstar Ferment
    AG represented by Lallemand SAS) and repealing Regulation (EC) No 1200/2005'
  type: main
- language: fr
  script: Latn
