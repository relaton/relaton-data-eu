title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 novembre 1963, autorisant la République
    française à différer le rapprochement des droits de son tarif national vers
    celui du Tarif douanier commun en ce qui concerne certains poissons et crustacés
  type: main
- language: de
  script: Latn
  content: '63/640/EWG: Entscheidung der Kommission vom 19. November 1963, mit der
    die Republik Frankreich ermächtigt wird, für einige Fisch- und Krebstierarten
    die Angleichung ihrer Zollsätze an die des Gemeinsamen Zolltarifs aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '63/640/CEE: Decisione della Commissione del 19 novembre 1963 con cui si
    autorizza la Repubblica francese a differire il ravvicinamento dei dazi della
    tariffa nazionale a quelli della tariffa doganale comune per quanto riguarda alcuni
    pesci e crostacei'
  type: main
- language: nl
  script: Latn
  content: '63/640/EEG: Beschikking van de Commissie van 19 november 1963 waarbij
    de Franse Republiek wordt gemachtigd de aanpassing van de rechten van haar nationale
    douanetarief voor sommige vissoorten en schaaldieren uit te stellen'
  type: main
