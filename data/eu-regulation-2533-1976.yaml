type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2533/76 of 19 October 1976 re-establishing
    the levying of customs duties on other wood sawn lengthwise, sliced or peeled,
    etc., falling within subheading 44.14 B, originating in developing countries to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2533/76 de la Commission, du 19 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres bois
    simplement sciés longitudinalement, tranchés ou déroulés, etc., de la sous-position
    tarifaire 44.14 B, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2533/76 der Kommission vom 19. Oktober 1976 zur Wiedereinführung
    des Zollsatzes für anderes Holz, in der Längsrichtung gesägt, gemessert oder
    geschält, usw., der Tarifstelle 44.14 B, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November 1975
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2533/76 af 19. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for andet træ, savet i længderetningen, skåret
    eller skrællet, men ikke yderligere bearbejdet, etc., under underposition 44.14
    B, som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2533/76 della Commissione, del 19 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili all'altro legno semplicemente
    segato per il lungo, tranciato o sfogliato, ecc., della sottovoce doganale 44.14
    B, originario dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2533/76 van de Commissie van 19 oktober 1976 houdende
    wederinstelling van de heffing van de douanerechten voor ander hout, enkel overlangs
    gezaagd of enkel gesneden of geschild, enz., van onderverdeling 44.14 B, van oorsprong
    uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3010/75
    van de Raad van 17 november 1975 tariefpreferenties werden geopend
  type: main
