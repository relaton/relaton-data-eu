---
id: EUDecision20221400
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1400 of 11 August 2022 amending
    Council Directive 2008/72/EC to extend the period during which Member States may
    decide on the import conditions for vegetable propagating and planting material,
    other than seed, from third countries (notified under document C(2022) 5723)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1400 de la Commission du 11 août 2022
    modifiant la directive 2008/72/CE du Conseil afin de prolonger la période pendant
    laquelle les États membres peuvent décider des conditions d’importation des
    plants de légumes et des matériels de multiplication de légumes autres que
    les semences en provenance de pays tiers [notifiée sous le numéro C(2022) 5723]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1400 der Kommission vom 11. August 2022
    zur Änderung der Richtlinie 2008/72/EG des Rates betreffend die Verlängerung
    des Zeitraums, in dem die Mitgliedstaaten die Bedingungen für die Einfuhr von
    Gemüsevermehrungsmaterial und Gemüsepflanzgut — mit Ausnahme von Saatgut —
    aus Drittländern festgelegen dürfen (Bekannt gegeben unter Aktenzeichen C(2022)
    5723)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/1400 на Комисията
    от 11 август 2022 година за изменение на Директива
    2008/72/ЕО на Съвета с цел удължаване на срока,
    през който държавите членки могат да вземат
    решение относно условията за внос от трети
    страни на зеленчуков размножителен и посадъчен
    материал, различен от семена (нотифицирано
    под номер C(2022) 5723)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1400 ze dne 11. srpna 2022, kterým
    se mění směrnice Rady 2008/72/ES za účelem prodloužení období, během
    něhož mohou členské státy rozhodnout o podmínkách dovozu sadby a rozmnožovacího
    materiálu zeleniny mimo osivo ze třetích zemí (oznámeno pod číslem C(2022)
    5723)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1400 af 11. august 2022
    om ændring af Rådets direktiv 2008/72/EF for at forlænge den periode, hvori
    medlemsstaterne kan træffe afgørelse om betingelserne for indførsel af plantemateriale
    og formeringsmateriale af grøntsagsplanter bortset fra frø fra tredjelande (meddelt
    under nummer C(2022) 5723)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/1400 της Επιτροπής
    της 11ης Αυγούστου 2022 για την τροποποίηση της
    οδηγίας 2008/72/ΕΚ του Συμβουλίου ώστε να παραταθεί
    η περίοδος κατά την οποία τα κράτη μέλη μπορούν
    να αποφασίζουν σχετικά με τους όρους εισαγωγής
    πολλαπλασιαστικού υλικού και φυταρίων κηπευτικών,
    εκτός των σπόρων προς σπορά, από τρίτες χώρες
    [κοινοποιηθείσα υπό τον αριθμό C(2022) 5723]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus 2022/1400, 11. august 2022, millega muudetakse
    nõukogu direktiivi 2008/72/EÜ, et pikendada ajavahemikku, mille jooksul liikmesriigid
    võivad otsustada köögiviljade paljundus- ja istutusmaterjali, välja arvatud
    seemne, kolmandatest riikidest importimise tingimuste üle (teatavaks tehtud numbri
    C(2022) 5723 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/1400, annettu 11 päivänä
    elokuuta 2022, neuvoston direktiivin 2008/72/EY muuttamisesta sen ajanjakson pidentämiseksi,
    jonka aikana jäsenvaltiot voivat päättää kolmansista maista tuotavan vihannesten
    lisäys- ja taimiaineiston, lukuun ottamatta siemeniä, tuontia koskevista edellytyksistä
    (tiedoksiannettu numerolla C(2022) 5723)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/1400 ón gCoimisiún an 11 Lúnasa
    2022 lena leasaítear Treoir 2008/72/CE ón gComhairle chun síneadh a chur leis
    an tréimhse ina bhféadfaidh na Ballstáit cinneadh a dhéanamh maidir leis na
    coinníollacha allmhairiúcháin le haghaidh ábhar iomadaithe agus plandaithe
    glasraí, seachas síol, ó thríú tíortha (a bhfuil fógra tugtha ina leith
    faoi dhoiciméad C(2022) 5723)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1400 od 11. kolovoza 2022. o izmjeni
    Direktive Vijeća 2008/72/EZ radi produljenja razdoblja tijekom kojeg države
    članice mogu odlučivati o uvjetima uvoza reprodukcijskog sadnog materijala povrća,
    osim sjemena, iz trećih zemalja (priopćeno pod brojem dokumenta C(2022) 5723)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1400 végrehajtási határozata (2022. augusztus
    11.) a 2008/72/EK tanácsi irányelvnek a harmadik országokból származó, vetőmagokon
    kívüli zöldségszaporító és -ültetési anyagok behozatalára vonatkozó
    feltételekkel kapcsolatos döntéshozatal tekintetében a tagállamok számára
    biztosított időszak meghosszabbítása céljából történő módosításáról
    (az értesítés a C(2022) 5723. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1400 della Commissione dell'11 agosto
    2022 che modifica la direttiva 2008/72/CE del Consiglio al fine di estendere il
    periodo durante il quale gli Stati membri possono decidere le condizioni d’importazione
    delle piantine di ortaggi e dei materiali di moltiplicazione di ortaggi, ad eccezione
    delle sementi, provenienti da paesi terzi [notificata con il numero C(2022) 5723]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1400 (2022. gada 11. augusts),
    ar ko groza Padomes Direktīvu 2008/72/EK, lai pagarinātu periodu, kurā dalībvalstis
    var izlemt par nosacījumiem attiecībā uz dārzeņu pavairošanas un stādāmā
    materiāla, kas nav sēklas, importu no trešām valstīm (izziņots ar dokumenta
    numuru C(2022) 5723)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1400 2022 m. rugpjūčio 11
    d. kuriuo, siekiant pratęsti laikotarpį, per kurį valstybės narės gali nuspręsti
    dėl daržovių dauginamosios ir sodinamosios medžiagos, išskyrus sėklą, importo
    iš trečiųjų šalių sąlygų, iš dalies keičiama Tarybos direktyva 2008/72/EB
    (pranešta dokumentu Nr. C(2022) 5723)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1400 tal-11
    ta’ Awwissu 2022 li temenda d-Direttiva tal-Kunsill 2008/72/KE biex testendi
    l-perjodu li matulu l-Istati Membri jistgħu jiddeċiedu dwar il-kundizzjonijiet
    tal-importazzjoni għall-materjal tal-propagazzjoni u taż-żrigħ tal-ħxejjex,
    barra ż-żerriegħa, minn pajjiżi terzi (notifikata bid-dokument C(2022) 5723)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1400 van de Commissie van 11 augustus 2022
    tot wijziging van Richtlijn 2008/72/EG van de Raad om de periode te verlengen
    waarin de lidstaten kunnen beslissen over de invoervoorwaarden van teeltmateriaal
    en plantgoed van groentegewassen, met uitzondering van zaad, uit derde landen
    (Kennisgeving geschied onder nummer C(2022) 5723)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1400 z dnia 11 sierpnia 2022 r. zmieniająca
    dyrektywę Rady 2008/72/WE w celu przedłużenia okresu, w którym państwa członkowskie
    mogą podejmować decyzje w sprawie warunków przywozu materiału rozmnożeniowego
    i nasadzeniowego warzyw, innego niż nasiona, z państw trzecich (notyfikowana
    jako dokument nr C(2022) 5723)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1400 da Comissão de 11 de agosto de 2022
    que altera a Diretiva 2008/72/CE do Conselho a fim de prorrogar o período durante
    o qual os Estados-Membros podem tomar decisões sobre as condições aplicáveis
    à importação de materiais de propagação e plantação de produtos hortícolas,
    com exceção das sementes, provenientes de países terceiros [notificada com
    o número C(2022) 5723]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1400 a Comisiei din 11 august
    2022 de modificare a Directivei 2008/72/CE a Consiliului în vederea prelungirii
    perioadei în care statele membre pot decide cu privire la condițiile de import
    pentru materialul de înmulțire și plantare legumicol, altul decât semințele,
    provenind din țări terțe [notificată cu numărul C(2022) 5723]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1400 z 11. augusta 2022, ktorým
    sa mení smernica Rady 2008/72/ES s cieľom predĺžiť obdobie, počas ktorého
    môžu členské štáty rozhodnúť o podmienkach dovozu množiteľského a sadivového
    zeleninového materiálu iného ako osivo z tretích krajín [oznámené pod číslom
    C(2022) 5723]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1400 z dne 11. avgusta 2022 o spremembi
    Direktive Sveta 2008/72/ES za podaljšanje obdobja, v katerem lahko države članice
    določijo uvozne pogoje za razmnoževalni in sadilni material zelenjadnic, razen
    semena, iz tretjih držav (notificirano pod dokumentarno številko C(2022) 5723)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1400 de la Comisión de 11 de agosto
    de 2022 por la que se modifica la Directiva 2008/72/CE del Consejo para prorrogar
    el período durante el cual los Estados miembros pueden decidir las condiciones
    de importación de plantones de hortalizas y de materiales de multiplicación
    de hortalizas, distintos de las semillas, procedentes de terceros países [notificada
    con el número C(2022) 5723]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1400 av den 11 augusti 2022
    om ändring av rådets direktiv 2008/72/EG för att förlänga den period under
    vilken medlemsstaterna får besluta om importvillkor för annat föröknings-
    och plantmaterial av grönsaker än utsäde från tredjeländer (delgivet med
    nr C(2022) 5723)
