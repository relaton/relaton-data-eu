title:
- language: en
  script: Latn
  content: '75/64/EEC: Commission Decision of 20 December 1974 amending the Commission
    Decision of 23 January 1973 authorizing the Federal Republic of Germany to apply
    special health guarantees for the prevention of leucosis in the case of bovine
    animals imported for breeding or production (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '75/64/CEE: Décision de la Commission, du 20 décembre 1974, portant modification
    de la décision de la Commission, du 23 janvier 1973, autorisant la République
    fédérale d''Allemagne à appliquer des garanties sanitaires particulières relatives
    à la lutte contre la leucose, en cas d''introduction sur son territoire de bovins
    d''élevage ou de rente (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '75/64/EWG: Entscheidung der Kommission vom 20. Dezember 1974 zur Änderung
    der Entscheidung der Kommission vom 23. Januar 1973, mit der die Bundesrepublik
    Deutschland ermächtigt wird, beim Verbringen von Zucht- und Nutzrindern in ihr
    Hoheitsgebiet zur Bekämpfung der Leukose besondere gesundheitspolizeiliche Garantien
    (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '75/64/EØF: Kommissionens Beslutning af 20. december 1974 om ændring
    af Kommissionens beslutning af 23. januar 1973 om bemyndigelse af Forbundsrepublikken
    Tyskland til ved indbringelse på dens område af avls- eller brugskvæg at anvende
    særlige sundhedsmæssige garantier med henblik på bekæmpelse af leukose (Kun
    den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '75/64/CEE: Decisione della Commissione, del 20 dicembre 1974, recante
    modifica della decisione della Commissione del 23 gennaio 1973, che autorizza
    la Repubblica federale di Germania ad applicare all''introduzione di bovini di
    allevamento e da produzione nel proprio territorio speciali garanzie sanitarie
    con riferimento alla lotta contro la leucosi (Il testo in lingua tedesca è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '75/64/EEG: Beschikking van de Commissie van 20 december 1974 tot wijziging
    van de beschikking van de Commissie van 23 januari 1973 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd om bij invoer van fok- en gebruiksrunderen bijzondere
    gezondheidsgaranties in het kader van de leukosebestrijding toe te passen (Slechts
    de tekst in de Duitse taal is authentiek)'
  type: main
