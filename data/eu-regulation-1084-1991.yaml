title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1084/91 of 29 April 1991 specifying the
    extent to which applications lodged in April 1991 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1084/91 de la Commission, du 29 avril 1991, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'avril 1991 pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1084/91 der Kommission vom 29. April 1991 über das
    Ausmaß, in dem den im April 1991 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1084/91 af 29. april 1991 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i april
    1991 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1084/91 της Επιτροπής
    της 29ης Απριλίου 1991 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν τον Απρίλιο 1991 για τα νεαρά άρρενα
    βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1084/91 della Commissione, del 29 aprile 1991, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1991 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1084/91 van de Commissie van 29 april 1991 tot bepaling
    van de mate waarin de in april 1991 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mannelijke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1084/91 da Comissão, de 29 de Abril de 1991, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Abril de 1991 para os bovinos machos jovens
    destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1084/91 de la Comisión, de 29 de abril de 1991, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de abril de 1991 para los machos
    jóvenes de la especie bovina destinados al engorde
  type: main
