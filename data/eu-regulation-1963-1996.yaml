    (ΕΚ) αριθ. 1396/96 που καθορίζει την ελάχιστη τιμή
    στην εισαγωγή, που εφαρμόζεται στις σταφίδες
    κατά τη διάρκεια της περιόδου εμπορίας 1996/97,
    καθώς και την εξισωτική εισφορά που εισπράττεται
    στις περιπτώσεις που δεν τηρείται η τιμή αυτή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1963/96, annettu 11 päivänä lokakuuta 1996,
