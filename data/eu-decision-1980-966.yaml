title:
- language: en
  script: Latn
  content: '80/966/EEC: Commission Decision of 29 September 1980 on the reimbursement
    by the EAGGF, Guidance Section, to the United Kingdom of expenditure incurred
    during 1979, in connection with Community measures for the eradication of brucellosis,
    tuberculosis and leucosis in cattle (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/966/CEE: Décision de la Commission, du 29 septembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole,
    section "orientation", au Royaume-Uni des dépenses effectuées pendant l''année
    1979 dans le cadre d''une action de la Communauté en vue de l''éradication de
    la brucellose, de la tuberculose et de la leucose des bovins (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/966/EWG: Entscheidung der Kommission vom 29. September 1980 über die
    Erstattung der Ausgaben des Jahres 1979 für die Einführung von Maßnahmen der
    Gemeinschaft zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder
    an das Vereinigte Königreich (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/966/EØF: Kommissionens beslutning af 29. september 1980 om refusion
    gennem EUGFL, udviklingssektionen, til Det forenede Kongerige af udgifter afholdt
    i 1979 i forbindelse med en fællesskabsaktion med henblik på udryddelse af brucellose,
    tuberkulose og leukose hos kvæg (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/966/CEE: Decisione della Commissione, del 29 settembre 1980, relativa
