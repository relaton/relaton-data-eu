    d'intervention allemand, pour un centre de commercialisation ou il n'est pas entreposé
  type: main
- language: de
  script: Latn
  content: '71/111/EWG: Entscheidung der Kommission vom 15. Februar 1971 zur Ermächtigung
    der Bundesrepublik Deutschland, Brotroggen im Besitz der deutschen Interventionsstelle
    für einen Handelsplatz anzubieten, an dem er nicht gelagert ist'
  type: main
- language: it
  script: Latn
  content: '71/111/CEE: Decisione della Commissione, del 15 febbraio 1971, che autorizza
    la Repubblica federale di Germania ad offrire della segala da panificazione, detenuta
    dall''organismo d''intervento tedesco, per un centro di commercializzazione in
    cui è immagazzinata'
  type: main
- language: nl
  script: Latn
  content: '71/111/EEG: Beschikking van de Commissie van 15 februari 1971 waarbij
    de Bondsrepubliek Duitsland gemachtigd wordt voor de broodbakkerij geschikte rogge
    in het bezit van het Duitse interventiebureau, aan te bieden voor een handelscentrum
    waar deze niet is opgeslagen'
