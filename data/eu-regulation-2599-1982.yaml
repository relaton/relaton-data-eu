title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2599/82 of 28 September 1982 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of porcelain or china, falling within heading
    No 69.11 and originating in Chile, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2599/82 de la Commission, du 28 septembre 1982, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en porcelaine, de la position 69.11
    du tarif douanier commun, originaires du Chili, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2599/82 der Kommission vom 28. September 1982 zur
    Wiedereinführung der Erhebung der Zölle für Geschirr, Haushalts- und Toilettengegenstände,
    aus Porzellan, der Tarifnummer 69.11, mit Ursprung in Chile, dem die in der Verordnung
    (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2599/82 af 28. september 1982 om genindførelse
    af opkrævning af told for bordservice samt husholdnings- og toiletartikler, af
    porcelæn, henhørende under pos. 69.11 og med oprindelse i Chile, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3601/81i
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2599/82 τής Επιτροπής
    τής 28ης Σεπτεμβρίου 1982 περί αποκαταστάσεως
    τής εφαρμογής τών δασμών γιά τά επιτραπέζια
    σκεύη καί είδη οικιακής χρήσεως ή ευτρεπισμού,
    εκ πορσελάνης, τής κλάσεως 69. 11 τού Κοινού Δασμολογίου,
    καταγωγής Χιλής, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2599/82 della Commissione, del 28 settembre 1982,
    che ripristina la riscossione dei dazi doganali applicabili al vasellame e agli
    oggetti di uso domestico o da toletta, di porcellana, della voce 69.11 della tariffa
    doganale comune, originari del Cile, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3601/81 del Consiglio,
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2599/82 van de Commissie van 28 september 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op vaatwerk, huishoudelijke
    artikelen en toiletartikelen, van porselein, van tariefpost 69.11, van oorsprong
    uit Chili, waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
