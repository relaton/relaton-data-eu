title:
- language: en
  script: Latn
  content: '81/870/EEC: Commission Decision of 17 September 1981 authorizing Ireland
    not to apply Community treatment to men''s and boys''underpants and briefs, women''s,
    girls''and infants''knickers and briefs originating in Hong Kong (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/870/CEE: Décision de la Commission, du 17 septembre 1981, autorisant
    l''Irlande à exclure du traitement communautaire les "slips" et caleçons pour
    hommes et garçonnets, les "slips" et culottes pour femmes, fillettes et jeunes
    enfants, originaires de Hong-kong (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '81/870/EWG: Entscheidung der Kommission vom 17. September 1981 zur Ermächtigung
    Irlands, aus Hongkong stammende Unterhosen und Slips, für Männer und Knaben;
    Schlüpfer und dergleichen für Frauen, Mädchen und Kleinkinder von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/870/EØF: Kommissionens beslutning af 17. september 1981 om bemyndigelse
    til Irland til fra fællesskabsbehandling at undtage trusser og andre underbenklæder
    til mænd og drenge, trusser og andre underbenklæder til kvinder, piger og småbørn
    med oprindelse i Hongkong (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/870/EOK: Απόφαση τής Επιτροπής τής 17ης Σεπτεμβρίου
    1981 περί χορηγήσεως αδείας στήν Ιρλανδία νά
    εξαιρέσει από τήν κοινοτική μεταχείριση τά
    σλίπς καί εσώβρακα διά άνδρας καί παίδας, τά
    σλίπς καί κυλόττες διά γυναίκας, κορασίδας
    καί μικρούς παίδας, καταγωγής Χόνγκ Κόνγκ (Το
    κείμενο στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/870/CEE: Decisione della Commissione, del 17 settembre 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le mutandine e slip per uomo
