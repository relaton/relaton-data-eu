title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/473 of 12 March 2025 recognising
    that the report submitted by Czechia under Article 31(2) of Directive (EU) 2018/2001
    of the European Parliament and of the Council contains accurate data for the purposes
    of measuring the greenhouse gas emissions associated with the cultivation of winter
    wheat grain, sugar beet, maize grain, maize silage, spring barley grain and winter
    barley grain in that Member State
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/473 de la Commission du 12 mars 2025
    reconnaissant que le rapport soumis par la Tchéquie au titre de l’article 31,
    paragraphe 2, de la directive (UE) 2018/2001 du Parlement européen et du Conseil
    contient des données précises aux fins de la mesure des émissions de gaz à
    effet de serre associées à la culture du blé d’hiver, de la betterave sucrière,
    du maïs-grain, du maïs ensilé, de l’orge de printemps et de l’orge d’hiver
    dans ledit État membre
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/473 der Kommission vom 12. März 2025
    zur Anerkennung, dass der von Tschechien gemäß Artikel 31 Absatz 2 der Richtlinie
    (EU) 2018/2001 des Europäischen Parlaments und des Rates vorgelegte Bericht genaue
    Daten für die Messung der auf den Anbau von Winterweizen, Zuckerrüben, Körnermais,
    Silomais, Sommergerste und Wintergerste in diesem Mitgliedstaat zurückgehenden
    Treibhausgasemissionen enthält
  type: main
- language: bg
