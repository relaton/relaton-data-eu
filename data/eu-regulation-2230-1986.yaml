    B II des Gemeinsamen Zolltarifs mit Ursprung in Indien, dem die in der Verordnung
    (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
