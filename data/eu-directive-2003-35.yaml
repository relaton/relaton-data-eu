    et programmes relatifs à l'environnement, et modifiant, en ce qui concerne la
    participation du public et l'accès à la justice, les directives 85/337/CEE et
    96/61/CE du Conseil - Déclaration de la Commission
  type: main
- language: de
  script: Latn
