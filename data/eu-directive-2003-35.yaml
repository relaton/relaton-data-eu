  script: Latn
  content: Directive 2003/35/EC of the European Parliament and of the Council of 26
    May 2003 providing for public participation in respect of the drawing up of certain
    plans and programmes relating to the environment and amending with regard to public
    participation and access to justice Council Directives 85/337/EEC and 96/61/EC
    - Statement by the Commission
  type: main
- language: fr
  script: Latn
