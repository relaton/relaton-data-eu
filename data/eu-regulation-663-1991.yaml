  content: Commission Regulation (EEC) No 663/91 of 19 March 1991 amending Regulation
    (EEC) No 3814/90 laying down the level of the accession compensatory amounts for
    milk and milk products in trade between Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 663/91 DE LA COMMISSION du 19 mars 1991 modifiant
    le règlement (CEE) no 3814/90 arrêtant dans le secteur du lait et des produits
    laitiers le niveau des montants compensatoires « adhésion » dans les échanges
    entre l'' Espagne et le Portugal #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 663/91 DER KOMMISSION vom 19. März 1991 zur Änderung
    der Verordnung (EWG) Nr. 3814/90 zur Festsetzung der Beitrittsausgleichsbeträge
    für Milch und Milcherzeugnisse im Handel zwischen Spanien und Portugal #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 663/91 af 19. marts 1991 om ændring
    af forordning (EØF) nr. 3814/90 om fastsættelse af tiltrædelsesudligningsbeløb
    for mælk og mejeriprodukter i samhandelen mellem Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 663/91 της Επιτροπής
    της 19ης Μαρτίου 1991 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3814/90 με τον οποίο αποφασίζεται
    στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων, το ύψος των εξισωτικών ποσών προσχώρησης
    στις εμπορικές συναλλαγές μεταξύ της Ισπανίας
    και της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 663/91 DELLA COMMISSIONE del 19 marzo 1991 recante
    modifica del regolamento (CEE) n. 3814/90 che fissa, nel settore del latte e dei
    prodotti lattiero-caseari, il livello degli importi compensativi adesione negli
    scambi tra la Spagna e il Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 663/91 VAN DE COMMISSIE van 19 maart 1991 tot wijziging
    van Verordening (EEG) nr. 3814/90 tot vaststelling van het niveau van de in het
    handelsverkeer tussen Spanje en Portugal toe te passen compenserende bedragen
    toetreding in de sector melk en zuivelprodukten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 663/91 DA COMISSÃO de 19 de Março de 1991 que
    altera o Regulamento (CEE) nº 3814/90, que adopta, no sector do leite e dos produtos
    lácteos, o nível dos montantes compensatórios de adesão aplicáveis nas trocas
    comerciais entre Espanha e Portugal #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 663/91 DE LA COMISIÓN de 19 de marzo de 1991 por
    el que se modifica el Reglamento (CEE) nº 3814/90 por el que se adopta el nivel
    de los montantes compensatorios de adhesión en los intercambios entre España
    y Portugal en el sector de la leche y de los productos lácteos #'
