title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2792/98 of 22 December 1998 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1999
    fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2792/98 de la Commission du 22 décembre 1998 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1999 intervenant dans le calcul de la compensation financière
    et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2792/98 der Kommission vom 22. Dezember 1998 zur Festsetzung
    des Pauschalwerts für das Fischwirtschaftsjahr 1999 für die aus dem Handel genommenen
    Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs und des entsprechenden
    Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2792/98 af 22. december 1998 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2792/98 της Επιτροπής
    της 22ας Δεκεμβρίου 1998 για καθορισμό της κατ’αποκοπήν
    αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1999
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2792/98, annettu 22 päivänä joulukuuta 1998,
    kalastusvuoden 1999 aikana markkinoilta vedettyjen kalastustuotteiden taloudellisen
    korvauksen ja sen ennakon laskennassa käytettävästä kiinteästä arvosta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2792/98 della Commissione del 22 dicembre 1998 che
    fissa, ai fini del calcolo della compensazione finanziaria e dell'anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2792/98 van de Commissie van 22 december 1998 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1999 voor de uit
    de markt genomen visserijproducten voor de berekening van de financiële vergoeding
    en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2792/98 da Comissão de 22 de Dezembro de 1998 que
    fixa, para efeitos do cálculo da compensação financeira e do adiantamento que
    lhe diz respeito, o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2792/98 de la Comisión de 22 de diciembre de 1998
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 1999 que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2792/98 av den 22 december 1998 om fastställande
