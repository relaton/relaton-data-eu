title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 724/84 of 20 March 1984 re-establishing
    the levying of customs duties on sodium dichromate, falling within subheading
    28.47 B ex II and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 724/84 de la Commission du 20 mars 1984 portant rétablissement
    de la perception des droits de douane applicables au dichromate de sodium, de
    la sous-position 28.47 B ex II du tarif douanier commun, originaire de Roumanie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 724/84 der Kommission vom 20. März 1984 zur Wiedereinführung
    der Erhebung der Zölle für Natriumdichromat der Tarifstelle 28.47 B ex II mit
    Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 724/84 af 20. marts 1984 om genindførelse
