title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2289/89 of 27 July 1989 amending Regulation
    (EEC) No 1314/89 authorizing Greece not to apply in certain areas the measures
    provided for in Council Regulation (EEC) No 1442/88 as regards the granting of
    permanent abandonment premiums in respect of wine-growing areas for the 1989/90
    to 1995/96 wine years
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2289/89 de la Commission, du 27 juillet 1989, modifiant
    le règlement (CEE) n 1314/89 autorisant la Grèce à ne pas appliquer dans certaines
    zones les mesures prévues au règlement (CEE) n 1442/88 du Conseil, relatif à
    l'octroi de primes d'abandon définitif de superficies viticoles pour les campagnes
    viticoles 1989/1990 à 1995/1996
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2289/89 der Kommission vom 27. Juli 1989 zur Änderung
    der Verordnung (EWG) Nr. 1314/89 zur Ermächtigung Griechenlands, in bestimmten
    Gebieten die mit der Verordnung (EWG) Nr. 1442/88 des Rates über die Gewährung
    von Prämien zur endgültigen Aufgabe von Rebflächen in den Weinwirtschaftsjahren
    1989/90 bis 1995/96 vorgesehenen Maßnahmen nicht anzuwenden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2289/89 af 27. juli 1989 om ændring
