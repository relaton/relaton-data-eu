    και σχετικά με τον τόπο διεξαγωγής των επίσημων
    ελέγχων για τα εν λόγω προϊόντα, και για την
    τροποποίηση των κατ’ εξουσιοδότηση κανονισμών
    (ΕΕ) 2019/2123 και (ΕΕ) 2019/2124 της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2021/2305, 21. oktoober 2021, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2017/625 eeskirjadega
    selle kohta, millistel juhtudel ja tingimustel vabastatakse teatavad mahepõllumajanduslikud
    ja üleminekuaja tooted piiripunktis tehtavast ametlikust kontrollist ning kus
    tuleb teha selliste vabastatud toodete ametlik kontroll, ning millega muudetakse
    komisjoni delegeeritud määrusi (EL) 2019/2123 ja (EL) 2019/2124
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2021/2305, annettu 21 päivänä lokakuuta
    2021, asetuksen (EU) 2017/625 täydentämisestä säännöillä siitä, missä
    tapauksissa ja millä edellytyksin luonnonmukaiset tuotteet ja siirtymävaiheen
    tuotteet vapautetaan virallisesta valvonnasta rajatarkastusasemilla, tällaisten
    tuotteiden virallisen valvonnan suorittamispaikasta sekä komission delegoitujen
    asetusten (EU) 2019/2123 ja (EU) 2019/2124 muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2021/2305 ón gCoimisiún an 21 Deireadh Fómhair
    2021 lena bhforlíontar Rialachán (AE) 2017/625 ó Pharlaimint na hEorpa agus
    ón gComhairle le rialacha maidir leis na cásanna ina ndíolmhaítear táirgí
    orgánacha agus táirgí atá á dtiontú ó rialuithe oifigiúla ag poist rialaithe
    teorann, agus na coinníollacha faoina ndíolmhaítear iad, mar aon le rialacha
    maidir leis an áit ina ndéantar rialuithe oifigiúla ar na táirgí sin, agus
    lena leasaítear Rialacháin Tharmligthe (AE) 2019/2123 agus (AE) 2019/2124 ón
    gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/2305 оd 21. listopada 2021. o dopuni
    Uredbe (EU) 2017/625 Europskog parlamenta i Vijeća pravilima o slučajevima u
    kojima i uvjetima pod kojima se ekološki proizvodi i proizvodi iz prijelaznog
    razdoblja izuzimaju iz službenih kontrola na graničnim kontrolnim postajama
    i o mjestu na kojem se provode službene kontrole tih proizvoda te o izmjeni delegiranih
    uredbi Komisije (EU) 2019/2123 i (EU) 2019/2124
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/2305 felhatalmazáson alapuló rendelete (2021.
    október 21.) az (EU) 2017/625 európai parlamenti és tanácsi rendeletnek az
    ökológiai termékek és az átállási termékek határállomásokon végzett
    hatósági ellenőrzések alóli mentességének eseteire és feltételeire, az
    ilyen termékek hatósági ellenőrzéseinek helyére vonatkozó kiegészítéséről,
    valamint az (EU) 2019/2123 és az (EU) 2019/2124 felhatalmazáson alapuló bizottsági
    rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/2305 della Commissione del 21 ottobre 2021
    che integra il regolamento (UE) 2017/625 del Parlamento europeo e del Consiglio
    con norme riguardanti i casi e le condizioni in cui i prodotti biologici e i prodotti
    in conversione sono esenti da controlli ufficiali ai posti di controllo frontalieri
    e il luogo dei controlli ufficiali per tali prodotti e che modifica i regolamenti
    delegati (UE) 2019/2123 e (UE) 2019/2124 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/2305 (2021. gada 21. oktobris),
    ar ko Eiropas Parlamenta un Padomes Regulu (ES) 2017/625 papildina ar noteikumiem
    par to, kādos gadījumos un ar kādiem nosacījumiem bioloģiskie produkti un
    pārejas produkti ir atbrīvoti no oficiālajām kontrolēm robežkontroles punktos,
    par šādu produktu oficiālo kontroļu vietu un ar ko groza Komisijas Deleģētās
    regulas (ES) 2019/2123 un (ES) 2019/2124
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2021/2305 2021 m. spalio 21 d.
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2017/625 papildomas taisyklėmis,
    reglamentuojančiomis atvejus ir sąlygas, kuriais ekologiškiems produktams ir
    perėjimo prie ekologinės gamybos laikotarpio produktams netaikoma oficiali kontrolė
    pasienio kontrolės postuose, ir vietą, kurioje vykdoma tokių produktų oficiali
    kontrolė, ir kuriuo iš dalies keičiami Komisijos deleguotieji reglamentai (ES)
    2019/2123 ir (ES) 2019/2124
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2021/2305 tal-21 ta’ Ottubru
    2021 li jissupplimenta r-Regolament (UE) 2017/625 tal-Parlament Ewropew u tal-Kunsill
    b’regoli dwar il-każijiet meta u l-kundizzjonijiet li fihom il-prodotti organiċi
    u l-prodotti fil-fażi ta’ konverżjoni huma eżentati mill-kontrolli uffiċjali
    fil-postijiet ta’ kontroll fuq il-fruntiera, fil-post tal-kontrolli uffiċjali
    għal tali prodotti, u li jemenda r-Regolamenti Delegati tal-Kummissjoni (UE)
    2019/2123 u (UE) 2019/2124
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2021/2305 van de Commissie van 21 oktober
    2021 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en
    de Raad met regels inzake de gevallen waarin en de voorwaarden waaronder biologische
    producten en omschakelingsproducten zijn vrijgesteld van officiële controles
    aan grenscontroleposten en inzake de plaats van officiële controles voor dergelijke
    producten, en tot wijziging van de Gedelegeerde Verordeningen (EU) 2019/2123 en
    (EU) 2019/2124 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2021/2305 z dnia 21 października
    2021 r. w sprawie uzupełnienia rozporządzenia Parlamentu Europejskiego i Rady
    (UE) 2017/625 przepisami określającymi, w jakich przypadkach i na jakich warunkach
    produkty ekologiczne i produkty w okresie konwersji są zwolnione z kontroli urzędowych
    w punktach kontroli granicznej, i dotyczącymi miejsca kontroli urzędowych takich
    produktów oraz w sprawie zmiany rozporządzeń delegowanych Komisji (UE) 2019/2123
    i (UE) 2019/2124
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/2305 da Comissão de 21 de outubro de 2021
    que completa o Regulamento (UE) 2017/625 do Parlamento Europeu e do Conselho com
    regras relativas aos casos e condições em que os produtos biológicos e os produtos
    em conversão estão isentos dos controlos oficiais nos postos de controlo fronteiriços
    e ao local dos controlos oficiais desses produtos, e que altera os Regulamentos
    Delegados (UE) 2019/2123 e (UE) 2019/2124 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/2305 al Comisiei din 21 octombrie 2021 de
    completare a Regulamentului (UE) 2017/625 al Parlamentului European și al Consiliului
    cu norme privind cazurile și condițiile în care produsele ecologice și produsele
    în conversie sunt scutite de controalele oficiale la posturile de control la
    frontieră, locul de efectuare a controalelor oficiale pentru astfel de produse
    și de modificare a Regulamentelor delegate (UE) 2019/2123 și (UE) 2019/2124
    ale Comisiei
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/2305 z 21. októbra 2021, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2017/625 o pravidlá
    týkajúce sa toho, v ktorých prípadoch a za akých podmienok sú produkty ekologickej
    poľnohospodárskej výroby a produkty z konverzie oslobodené od úradných kontrol
    na hraničných kontrolných staniciach, ako aj o pravidlá týkajúce sa miesta
    úradných kontrol takýchto produktov, a ktorým sa menia delegované nariadenia
    Komisie (EÚ) 2019/2123 a (EÚ) 2019/2124
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/2305 z dne 21. oktobra 2021 o dopolnitvi
    Uredbe (EU) 2017/625 Evropskega parlamenta in Sveta s pravili o primerih in pogojih,
    v katerih oz. pod katerimi so ekološki proizvodi in proizvodi iz preusmeritve
    izvzeti iz uradnega nadzora na mejnih kontrolnih točkah, ter kraju uradnega nadzora
    ter o spremembi delegiranih uredb Komisije (EU) 2019/2123 in (EU) 2019/2124
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/2305 de la Comisión de 21 de octubre de
    2021 por el que se completa el Reglamento (UE) 2017/625 del Parlamento Europeo
    y del Consejo con normas relativas a los casos y las condiciones en que los productos
    ecológicos y los productos en conversión quedan exentos de controles oficiales
    en los puestos de control fronterizos y al lugar de los controles oficiales paras
    dichos productos y por el que se modifican los Reglamentos Delegados (UE) 2019/2123
    y (UE) 2019/2124 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/2305 av den 21 oktober 2021
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/625 med
    bestämmelser om i vilka fall och på vilka villkor ekologiska produkter och produkter
    under omställning är undantagna från offentlig kontroll vid gränskontrollstationer
    och på vilken plats den offentliga kontrollen av sådana produkter ska utföras
    samt om ändring av kommissionens delegerade förordningar (EU) 2019/2123 och
    (EU) 2019/2124
