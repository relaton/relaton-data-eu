id: EURegulation20212305
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/2305 of 21 October 2021 supplementing
    Regulation (EU) 2017/625 of the European Parliament and of the Council with rules
    on the cases where and conditions under which organic products and in-conversion
    products are exempted from official controls at border control posts, the place
    of official controls for such products and amending Commission Delegated Regulations
    (EU) 2019/2123 and (EU) 2019/2124
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/2305 de la Commission du 21 octobre 2021
    complétant le règlement (UE) 2017/625 du Parlement européen et du Conseil par
    des règles relatives aux cas et aux conditions dans lesquels les produits biologiques
    et les produits en conversion sont exemptés des contrôles officiels aux postes
    de contrôle frontaliers, au lieu des contrôles officiels pour ces produits,
    et modifiant les règlements délégués (UE) 2019/2123 et (UE) 2019/2124 de la
    Commission
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/2305 der Kommission vom 21. Oktober 2021
    zur Ergänzung der Verordnung (EU) 2017/625 des Europäischen Parlaments und des
    Rates durch Vorschriften darüber, in welchen Fällen und unter welchen Bedingungen
    ökologische/biologische Erzeugnisse und Umstellungserzeugnisse von amtlichen
    Kontrollen an Grenzkontrollstellen ausgenommen sind, und Vorschriften über den
    Ort der amtlichen Kontrollen solcher Erzeugnisse sowie zur Änderung der Delegierten
    Verordnungen (EU) 2019/2123 und (EU) 2019/2124 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/2305 на Комисията
    от 21 октомври 2021 година за допълнение на Регламент
    (ЕС) 2017/625 на Европейския парламент и на Съвета
    с правила относно случаите и условията, при
    които биологични продукти и продукти, произведени
    при преход към биологично производство, се
    освобождават от официалния контрол на граничните
    контролни пунктове, относно мястото на извършване
    на официалния контрол на такива продукти и
    за изменение на делегирани регламенти (ЕС)
    2019/2123 и (ЕС) 2019/2124 на Комисията
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/2305 ze dne 21. října
    2021, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2017/625
    o pravidla týkající se toho, ve kterých případech a za jakých podmínek
    jsou ekologické produkty a produkty z přechodného období osvobozeny od úředních
    kontrol na stanovištích hraniční kontroly, o pravidla týkající se místa
    úředních kontrol u těchto produktů, a kterým se mění nařízení Komise
    v přenesené pravomoci (EU) 2019/2123 a (EU) 2019/2124
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/2305 af 21. oktober 2021
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2017/625
    med regler om, i hvilke tilfælde og på hvilke betingelser økologiske produkter
    og omlægningsprodukter er undtaget fra offentlig kontrol på grænsekontrolsteder
    og stedet for offentlig kontrol af sådanne produkter og om ændring af Kommissionens
    delegerede forordning (EU) 2019/2123 og (EU) 2019/2124
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2021/2305
    της Επιτροπής της 21ης Οκτωβρίου 2021 για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2017/625 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου με κανόνες σχετικά με τις
