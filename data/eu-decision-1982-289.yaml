title:
- language: en
  script: Latn
  content: '82/289/EEC: Commission Decision of 13 April 1982 establishing that the
    apparatus described as ''Perkin Elmer - Gas Chromatography System, model Sigma
    1, with Lab Data System, model Sigma 10'', may not be imported free of Common
    Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/289/CEE: Décision de la Commission, du 13 avril 1982, constatant que
    l''importation de l''appareil dénommé "Perkin Elmer - gas chromatography system,
    model Sigma 1 with lab data system, model Sigma 10" ne peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/289/EWG: Entscheidung der Kommission vom 13. April 1982, mit der festgestellt
    wird, daß das Gerät ,,Perkin Elmer-Gas Chromatography System, model Sigma 1
    with Lab Data System, model Sigma 10" nicht unter Befreiung von den Zöllen des
    Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/289/EØF: Kommissionens beslutning af 13. april 1982 om fastslåelse
    af, at indførsel af apparatet "Perkin Elmer - gas chromatography system, model
    Sigma 1 with lab data system, model Sigma 10" ikke kan ske med fritagelse for
    told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/289/EOK: Απόφαση τής Επιτροπής τής 13ης Απριλίου
