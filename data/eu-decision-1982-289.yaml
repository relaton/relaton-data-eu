    μέ τήν ονομασία «Perkin Elmer-Gas Chromatography System, model Sigma
    1 with Lab Data System, model Sigma 10» δέν δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/289/CEE: Decisione della Commissione, del 13 aprile 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Perkin Elmer - Gas Chromatography
    System, model Sigma 1 with Lab Data System, model Sigma 10" non può avvenire
    in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/289/EEG: Beschikking van de Commissie van 13 april 1982 waarbij wordt
