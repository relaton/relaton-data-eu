    und vorläufige Anwendung des Abkommens zwischen der Europäischen Union und der
    Republik Kroatien über die Beteiligung der Republik Kroatien an der Militäroperation
    der Europäischen Union als Beitrag zur Abschreckung, Verhütung und Bekämpfung
    von seeräuberischen Handlungen und bewaffneten Raubüberfällen vor der Küste
    Somalias (Operation Atalanta)
  type: main
