    uplatňování Dohody mezi Evropskou unií a Chorvatskou republikou o účasti
    Chorvatské republiky na vojenské operaci Evropské unie s cílem přispět k
    odvrácení, prevenci a potlačení pirátství a ozbrojených loupeží u pobřeží
    Somálska (operace Atalanta)
  type: main
