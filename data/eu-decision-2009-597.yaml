    Sąjungos karinėje operacijoje, skirtoje prisidėti prie atgrasymo nuo piratavimo
    veiksmų ir ginkluotų plėšimų jūroje prie Somalio krantų ir jų prevencijos
    bei sustabdymo (operacija Atalanta ) pasirašymo ir laikino taikymo
  type: main
