    Republike Hrvatske u vojnoj operaciji Europske unije radi pridonošenja odvraćanju,
    prevenciji i sprečavanju djela piratstva i oružane pljačke uz obalu Somalije
    (Operacija Atalanta)
  type: main
- language: hu
  script: Latn
  content: A Tanács 2009/597/KKBP határozata ( 2009. július 27. ) az Európai Unió
    és a Horvát Köztársaság között a Horvát Köztársaságnak a Szomália
    partjainál folytatott kalóztámadásoktól és fegyveres rablásoktól való
    elrettentéshez, azok megelőzéséhez és visszaszorításához való hozzájárulás
    céljából folytatott európai uniós katonai műveletben (Atalanta-művelet)
    történő részvételéről szóló megállapodás aláírásáról és ideiglenes
    alkalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2009/597/PESC del Consiglio, del 27 luglio 2009 , relativa alla
    firma e all’applicazione provvisoria dell’accordo tra l’Unione europea e
    la Repubblica di Croazia sulla partecipazione della Repubblica di Croazia all’operazione
    militare dell’Unione europea volta a contribuire alla dissuasione, alla prevenzione
    e alla repressione degli atti di pirateria e delle rapine a mano armata al largo
    della Somalia (operazione Atalanta)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2009/597/KĀDP ( 2009. gada 27. jūlijs ) par to, lai parakstītu
    un provizoriski piemērotu Nolīgumu starp Eiropas Savienību un Horvātijas Republiku
    par Horvātijas Republikas piedalīšanos Eiropas Savienības militārajā operācijā
    ar mērķi palīdzēt Somālijas piekrastē novērst un apkarot pirātismu un
    bruņotas laupīšanas, un atturēt no šādiem nodarījumiem (operācija Atalanta
    )
  type: main
