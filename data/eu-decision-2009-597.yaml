title:
- language: en
  script: Latn
  content: Council Decision 2009/597/CFSP of 27 July 2009 on the signing and provisional
    application of the Agreement between the European Union and the Republic of Croatia
    on the participation of the Republic of Croatia in the European Union military
    operation to contribute to the deterrence, prevention and repression of acts of
    piracy and armed robbery off the Somali coast (Operation Atalanta)
  type: main
- language: fr
  script: Latn
  content: Décision 2009/597/PESC du Conseil du 27 juillet 2009 relative à la signature
    et à l’application provisoire de l’accord entre l’Union européenne et
    la République de Croatie sur la participation de la République de Croatie à
    l’opération militaire de l’Union européenne en vue d’une contribution
    à la dissuasion, à la prévention et à la répression des actes de piraterie
    et de vols à main armée au large des côtes de la Somalie (opération Atalanta)
  type: main
- language: de
  script: Latn
