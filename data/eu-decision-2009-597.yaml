    Republikken Kroatiens deltagelse i Den Europæiske Unions militæroperation med
    henblik på at bidrage til at afskrække fra, forebygge og bekæmpe piratvirksomhed
    og væbnede røverier ud for Somalias kyster (operation Atalanta)
  type: main
- language: el
  script: Grek
  content: Απόφαση 2009/597/ΚΕΠΠΑ του Συμβουλίου, της
    27ης Ιουλίου 2009 , για την υπογραφή και την προσωρινή
    εφαρμογή της συμφωνίας μεταξύ της Ευρωπαϊκής
    Ένωσης και της Δημοκρατίας της Κροατίας σχετικά
