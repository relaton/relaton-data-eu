title:
- language: en
  script: Latn
  content: '79/161/EEC: Commission Decision of 21 December 1978 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of Belgium of premiums paid
    during 1977 for the conversion of dairy herds to meat production (Only the French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/161/CEE: Décision de la Commission, du 21 décembre 1978, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume de Belgique des primes versées pendant
    l''année 1977 pour la reconversion vers la production de viande de troupeaux
    bovins à orientation laitière (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/161/EWG: Entscheidung der Kommission vom 21. Dezember 1978 über die
    Erstattung der im Jahr 1977 gewährten Prämien für die Umstellung von Milchkuhbeständen
    auf Bestände zur Fleischerzeugung durch den EAGFL, Abteilung Ausrichtung, an
    das Königreich Belgien (Nur der französische und niederländische Text sind
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/161/EØF: Kommissionens beslutning af 21. december 1978 om refusion
