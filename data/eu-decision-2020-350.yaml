    от първа линия и тестовете за потвърждение
    и по отношение на изискванията към изделията
    за самотестване и изискванията към бързите
    тестове, тестовете за потвърждение и допълнителните
    тестове за HIV и HCV (нотифицирано под номер С(2020)
    1086)
  type: main
