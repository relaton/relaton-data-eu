title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/350 of 28 February 2020 amending
    Decision 2002/364/EC as regards definitions of first–line assays and confirmatory
    assays, requirements for devices for self-testing and requirements for HIV and
    HCV rapid tests, confirmatory and supplementary assays (notified under document
    C(2020) 1086)
  type: main
- language: fr
  script: Latn
  content: Décision d’Exécution (UE) 2020/350 de la Commission du 28 février
    2020 modifiant la décision 2002/364/CE en ce qui concerne les définitions des
    tests de première ligne et des tests de confirmation, les exigences applicables
    aux dispositifs d’autodiagnostic et les exigences applicables aux tests rapides,
    tests de confirmation et tests complémentaires pour le VIH et le VHC [notifiée
    sous le numéro C(2020) 1086]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/350 der Kommission vom 28. Februar 2020
    zur Änderung der Entscheidung 2002/364/EG in Bezug auf die Begriffsbestimmungen
    für erstmalige Tests und für Bestätigungstests, die Anforderungen an Produkte
    zur Eigenanwendung und die Anforderungen an HIV- und HCV-Schnell-, Bestätigungs-
    und Ergänzungstests (Bekannt gegeben unter Aktenzeichen C(2020) 1086)
  type: main
