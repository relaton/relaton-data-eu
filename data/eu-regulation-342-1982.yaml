title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 342/82 of 12 February 1982 re-establishing
    the levying of customs duties on handkerchiefs, products of category 89 (code
    0890), originating in Malaysia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 342/82 de la Commission, du 12 février 1982, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes de la catégorie 89 (code n° 0890), originaires de Malaysia, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 342/82 der Kommission vom 12. Februar 1982 über die
    Wiedereinführung des Zollsatzes für Taschentücher der Warenkategorie Nr. 89
    (Kennziffer 0890), mit Ursprung in Malaysia, dem die in der Verordnung (EWG) Nr.
    3602/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 342/82 af 12. februar 1982 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder under kategori 89 (kode 0890),
    som har oprindelse i Malaysia og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 342/82 τής Επιτροπής τής
    12ης Φεβρουαρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά τά ρινόμακτρα
    καί μανδηλάκια θυλακίου τής κατηγορίας προϊόντων
    89 (κώδικας 0890), καταγωγής Μαλαισίας, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (EOK) αριθ.
    3602/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 342/82 della Commissione, del 12 febbraio 1982, che
    ripristina la riscossione dei dazi doganali applicabili ai fazzoletti da naso
    e da taschino, della categoria di prodotti n. 89 (codice 0890), originari della
    Malaysia beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3602/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 342/82 van de Commissie van 12 februari 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakdoeken,
    van de categorie produkten nr. 89 (codenummer 0890), van oorsprong uit Maleisië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3602/81 van de Raad
  type: main
