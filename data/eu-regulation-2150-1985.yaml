title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2150/85 of 30 July 1985 re-establishing
    the levying of customs duties on polyethylene falling within subheading 39.02
    C I originating in Saudi Arabia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2150/85 de la Commission du 30 juillet 1985 portant
    rétablissement de la perception des droits de douane applicables au polyéthylène,
    de la sous-position 39.02 C I du tarif douanier commun, originaire de l' Arabie
    Saoudite, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2150/85 der Kommission vom 30. Juli 1985 zur Wiedereinführung
    der Erhebung der Zölle für Polyäthylen der Tarifstelle 39.02 C I mit Ursprung
    in Saudi-Arabien, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2150/85 af 30. juli 1985 om genindførelse
    af opkrævning af told for polyethylen henhørende under pos. 39.02 C I og med
    oprindelse i Saudi Arabien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
