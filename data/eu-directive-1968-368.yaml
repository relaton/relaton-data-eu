title:
- language: en
  script: Latn
  content: 'Council Directive 68/368/EEC of 15 October 1968 laying down detailed provisions
    concerning transitional measures in respect of activities of self-employed persons
    in the personal services sector (ISIC ex Major Group 85): 1. Restaurants, cafes,
    taverns and other drinking and eating places (ISIC Group 852), 2. Hotels, rooming
    houses, camps and other lodging places (ISIC Group 853)'
  type: main
- language: fr
  script: Latn
  content: 'Directive 68/368/CEE du Conseil, du 15 octobre 1968, relative aux modalités
    des mesures transitoires dans le domaine des activités non salariées relevant
    des services personnels (ex classe 85 CITI): 1. restaurants et débits de boissons
    (groupe 852 CITI), 2. hôtels meublés et établissements analogues, terrains
    de camping (groupe 853 CITI)'
  type: main
- language: de
  script: Latn
  content: 'Richtlinie 68/368/EWG des Rates vom 15. Oktober 1968 über die Einzelheiten
    der Übergangsmaßnahmen auf dem Gebiet der selbständigen Tätigkeiten der persönlichen
    Dienste (aus CITI-Hauptgruppe 85): 1. Restaurations- und Schankgewerbe (CITI-Gruppe
    852) 2. Beherbergungsgewerbe und Zeltplatzbetriebe (CITI-Gruppe 853)'
  type: main
- language: da
  script: Latn
  content: 'Rådets direktiv 68/368/EØF af 15. oktober 1968 om de nærmere overgangsforanstaltninger
    for selvstændig erhvervsvirksomhed inden for de personlige tjenesteydelser (ex
    CITI-hovedgruppe 85): 1. Restaurations- og udskænkningsvirksomhed (CITI-gruppe
    852) 2. Hotel- og campingpladsvirksomhed (CITI-gruppe 853)'
  type: main
- language: el
  script: Grek
  content: 'Οδηγία 68/368/ΕΟΚ του Συμβουλίου της 15ης Οκτωβρίου
    1968 περί των λεπτομερειών εφαρμογής των μεταβατικών
    μέτρων στον τομέα των μη μισθωτών δραστηριοτήτων
    που υπάγονται στις προσωπικές υπηρεσίες (ex
    κλάση ΔΤΤΒ): 1. Εστιατόρια και καταστήματα καταναλώσεως
    ποτών (ομάδα 852 ΔΤΤΒ) 2. Ξενοδοχεία επιπλωμένα
    και παρεμφερή καταστήματα, χώροι κατασκηνώσεως
    (ομάδα 853 ΔΤΤΒ)'
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 68/368/ETY, annettu 15 päivänä lokakuuta 1968,
    itsenäisten ammatinharjoittajien henkilöasiakaspalvelualan toimintaan (ISIC
    -pääryhmästä 85) ; 1. Ravintolat, kahvilat, baarit sekä muut anniskelu- ja
    ruokailupaikat (ISIC-ryhmä 852) 2. Hotellit, majatalot, leirintäalueet ja muut
    majoituspaikat (ISIC-ryhmä 853) sovellettavista, siirtymätoimenpiteitä koskevista
    yksityiskohtaisista säännöksistä
  type: main
- language: it
  script: Latn
  content: Direttiva 68/368/CEE del Consiglio, del 15 ottobre 1968, relativa alle
    modalità delle misure transitorie nel settore delle attività non salariate attinenti
    ai servizi personali (ex classe 85 CITI) 1. ristoranti e spacci di bevande (gruppo
    852 CITI) 2. alberghi e simili, terreni per campeggio (gruppo 853 CITI)
  type: main
- language: nl
  script: Latn
  content: 'Richtlijn 68/368/EEG van de Raad van 15 oktober 1968 betreffende de overgangsmaatregelen
    op het gebied van de anders dan in loondienst verrichte werkzaamheden welke onder
    de persoonlijke diensten ressorteren (ex klasse 85 C.I.T.I.): 1. restaurants en
    slijterijen (groep 852 C.I.T.I.) 2. hotels, pensions en dergelijke inrichtingen,
    kampeerterreinen (groep 853 C.I.T.I.)'
  type: main
- language: pt
  script: Latn
  content: 'Directiva 68/368/CEE do Conselho, de 15 de Outubro de 1968, relativa às
