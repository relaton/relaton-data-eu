    inseridas nos serviços pessoais (ex classe 85 CITI): 1. Restaurantes e estabelecimentos
    de bebidas (grupo 852 CITI), 2. Hotéis e estabelecimentos similares, parques
    de campismo (grupo 853 CITI)'
  type: main
- language: es
  script: Latn
  content: 'Directiva 68/368/CEE del Consejo, de 15 de octubre de 1968, relativa a
