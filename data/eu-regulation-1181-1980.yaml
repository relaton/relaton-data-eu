id: EURegulation11811980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1181/80 of 12 May 1980 re-establishing the
    levying of customs duties on other carpets and floor coverings, products of category
    59 (code 0590), originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1181/80 de la Commission, du 12 mai 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres tapis
    et revêtements de sol de la catégorie de produits n° 59 (code 0590), originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1181/80 der Kommission vom 12. Mai 1980 über die
    Wiedereinführung des Zollsatzes für andere Teppiche und Bodenbeläge der Warenkategorie
    Nr. 59 (Kennziffer 0590), mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1181/80 af 12. maj 1980 om genindførelse
    af opkrævning af toldafgifter for andre gulvtæpper, håndfremstillede tapisserier,
    under varekategori 59 (kode 0590), som har oprindelse i Hongkong og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1181/80 della Commissione, del 12 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli altri tappeti e rivestimenti
    per pavimenti, della categoria di prodotti n. 59 (codice 0590), originari di Hong
    Kong, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1181/80 van de Commissie van 12 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere tapijten
    en vloerbedekking, van de categorie van produkten nr. 59 (codenummer 0590), van
    oorsprong uit Hong-Kong, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
