  content: Commission Regulation (EEC) No 1616/92 of 24 June 1992 laying down detailed
    rules applicable to the free supply of food products to the population of Albania
    as provided for in Council Regulation (EEC) No 1567/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1616/92 de la Commission, du 24 juin 1992, définissant
