    af levnedsmidler bestemt til befolkningen i Albanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1616/92 της Επιτροπής
    της 24ης Ιουνίου 1992 που καθορίζει τις λεπτομέρειες
    εφαρμογής για τη δωρεάν προμήθεια τροφίμων
    που προορίζονται για τους πληθυσμούς της Αλβανίας,
    που προβλέπεται στον κανονισμό (ΕΟΚ) αριθ. 1567/92
    του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1616/92 della Commissione, del 24 giugno 1992, che
    stabilisce le modalità della fornitura gratuita di derrate alimentari alla popolazione
    dell'Albania, conformemente al regolamento (CEE) n. 1567/92 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1616/92 van de Commissie van 24 juni 1992 tot vaststelling
    van de uitvoeringsbepalingen voor de kosteloze levering van levensmiddelen, bestemd
    voor de bevolking van Albanië, in het kader van Verordening (EEG) nr. 1567/92
    van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1616/92 da Comissão, de 24 de Junho de 1992, que
