    destinées aux populations de l'Albanie prévue par le règlement (CEE) n° 1567/92
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1616/92 der Kommission vom 24. Juni 1992 mit Einzelbestimmungen
    zur unentgeltlichen Lieferung von Nahrungsmitteln an die Bevölkerung von Albanien
    nach der Verordnung (EWG) Nr. 1567/92 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1616/92 af 24. juni 1992 om gennemførelsesbestemmelser
