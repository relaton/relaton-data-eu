title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1200/79 of 15 June 1979 authorizing the
    German intervention agency to sell forequarters of bovine animals for processing
    into preserves with a view to constituting security stocks
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1200/79 de la Commission, du 15 juin 1979, autorisant
    l'organisme d'intervention allemand à vendre des quartiers avant de bovins en
    vue de leur transformation en conserves destinées à constituer des stocks de
    sécurité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1200/79 der Kommission vom 15. Juni 1979 zur Ermächtigung
    der deutschen Interventionsstelle, Vorderviertel von Rindern im Hinblick auf ihre
    Verarbeitung zu Konserven zu verkaufen, die zur Schaffung von Notvorräten bestimmt
    sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1200/79 af 15. juni 1979 om bemyndigelse
    af det tyske interventionsorgan til at sælge okseforfjerdinger med henblik på
    forarbejdning til konserves, som skal udgøre sikkerhedslagre
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1200/79 della Commissione, del 15 giugno 1979, che
    autorizza l'organismo d'intervento tedesco a vendere quarti anteriori di bovini
    ai fini della loro trasformazione in conserve destinate a costituire scorte di
    sicurezza
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1200/79 van de Commissie van 15 juni 1979 tot machtiging
