  script: Latn
  content: Besluit (EU) 2022/2572 van de Raad van 19 december 2022 waarbij de Commissie
    wordt verzocht met een studie te komen ter aanvulling van de effectbeoordeling
    bij het voorstel voor een verordening van het Europees Parlement en de Raad inzake
    het duurzaam gebruik van gewasbeschermingsmiddelen en tot wijziging van Verordening
