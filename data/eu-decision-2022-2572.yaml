  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/2572 z dnia 19 grudnia 2022 r. za pomocą której
    zwraca się ona do Komisji o przedłożenie analizy uzupełniającej ocenę skutków
    wniosku dotyczącego rozporządzenia Parlamentu Europejskiego i Rady w sprawie
    zrównoważonego stosowania środków ochrony roślin i w sprawie zmiany rozporządzenia
    Parlamentu Europejskiego i Rady (UE) 2021/2115, i o zaproponowanie kolejnych działań,
    w stosownych przypadkach i w zależności od wyników analizy
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/2572 do Conselho de 19 de dezembro de 2022 pela qual
    se solicita à Comissão que apresente um estudo que complemente a avaliação
    de impacto da proposta para um regulamento do Parlamento Europeu e do Conselho
    relativo à utilização sustentável dos produtos fitofarmacêuticos e que altera
    o Regulamento (UE) 2021/2115 do Parlamento Europeu e do Conselho e que proponha
    medidas de seguimento, se for caso disso, tendo em conta os resultados do estudo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/2572 a Consiliului din 19 decembrie 2022 prin care se
    solicită Comisiei să prezinte un studiu care să completeze evaluarea impactului
    propunerii de regulament al Parlamentului European și al Consiliului privind
    utilizarea durabilă a produselor de protecție a plantelor și de modificare
    a Regulamentului (UE) 2021/2115 al Parlamentului European și al Consiliului,
    precum și să propună acțiuni ulterioare, după caz, având în vedere rezultatele
    studiului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/2572 z 19. decembra 2022, ktorým sa Komisia
    žiada, aby predložila štúdiu dopĺňajúcu posúdenie vplyvu návrhu nariadenia
    Európskeho parlamentu a Rady o udržateľnom používaní prípravkov na ochranu
    rastlín a ktorým sa mení nariadenie Európskeho parlamentu a Rady (EÚ) 2021/2115,
    a navrhla nadväzujúce opatrenia, ak to bude vhodné podľa výsledku štúdie
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/2572 z dne 19. decembra 2022 o pozivu Komisiji, naj
    predloži študijo, ki bo dopolnila oceno učinka predloga uredbe Evropskega parlamenta
    in Sveta o trajnostni rabi fitofarmacevtskih sredstev in spremembi Uredbe (EU)
    2021/2115 Evropskega parlamenta in Sveta, in predlaga nadaljnje ukrepe, če je
    to ustrezno glede na rezultate študije
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/2572 del Consejo de 19 de diciembre de 2022 por la
    que se solicita a la Comisión que presente un estudio como complemento de la
    evaluación de impacto de la propuesta de Reglamento del Parlamento Europeo y
    del Consejo relativo al uso sostenible de los productos fitosanitarios y por el
    que se modifica el Reglamento (UE) 2021/2115 del Parlamento Europeo y del Consejo,
    y que proponga medidas ulteriores, si los resultados del estudio lo justifican
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/2572 av den 19 december 2022 om en begäran till
    kommissionen att lägga fram en studie som kompletterar konsekvensbedömningen
    av förslaget till Europaparlamentets och rådets förordning om hållbar användning
    av växtskyddsmedel och om ändring av Europaparlamentets och rådets förordning
    (EU) 2021/2115, och att föreslå uppföljningsåtgärder, om så är lämpligt
    mot bakgrund av studiens resultat
