title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/2572 of 19 December 2022 requesting the Commission
    to submit a study complementing the impact assessment of the proposal for a Regulation
    of the European Parliament and of the Council on the sustainable use of plant
    protection products and amending Regulation (EU) 2021/2115 of the European Parliament
    and of the Council, and to propose follow-up actions, if appropriate in view of
    the outcomes of the study
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2572 du Conseil du 19 décembre 2022 invitant la Commission
    à soumettre une étude complétant l’analyse d’impact de la proposition de
    règlement du Parlement européen et du Conseil concernant une utilisation des
    produits phytopharmaceutiques compatible avec le développement durable et modifiant
    le règlement (UE) 2021/2115 du Parlement européen et du Conseil, et à proposer
    des actions de suivi, le cas échéant, pour tenir compte des résultats de l’étude
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/2572 des Rates vom 19. Dezember 2022 mit dem Ersuchen
    an die Kommission, eine Studie zur Ergänzung der Folgenabschätzung des Vorschlags
    für eine Verordnung des Europäischen Parlaments und des Rates über die nachhaltige
    Verwendung von Pflanzenschutzmitteln und zur Änderung der Verordnung (EU) 2021/2115
    des Europäischen Parlaments und des Rates vorzulegen, und gegebenenfalls im Hinblick
    auf die Ergebnisse der Studie Folgemaßnahmen vorzuschlagen
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/2572 на Съвета от 19 декември
    2022 година за отправяне на искане към Комисията
    да представи проучване, допълващо оценката
    на въздействието на предложението за регламент
    на Европейския парламент и на Съвета относно
    устойчивата употреба на продукти за растителна
    защита и за изменение на Регламент (ЕС) 2021/2115
    на Европейския парламент и на Съвета, и да предложи
    последващи действия, ако е целесъобразно с
    оглед на резултатите от проучването
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/2572 ze dne 19. prosince 2022, kterým se Komise
    žádá, aby předložila studii doplňující posouzení dopadů návrhu nařízení
    Evropského parlamentu a Rady o udržitelném používání přípravků na ochranu
    rostlin a změně nařízení Evropského parlamentu a Rady (EU) 2021/2115 a aby
    případně navrhla následná opatření s ohledem na výsledky studie
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/2572 af 19. december 2022 om anmodning til
    Kommissionen om at forelægge en undersøgelse, der supplerer konsekvensanalysen
    til forslaget til Europa-Parlamentets og Rådets forordning om bæredygtig anvendelse
    af plantebeskyttelsesmidler og om ændring af Europa-Parlamentets og Rådets forordning
    (EU) 2021/2115, og om at foreslå opfølgende foranstaltninger, hvis det er relevant
    i lyset af resultaterne af undersøgelsen
  type: main
- language: el
  script: Grek
