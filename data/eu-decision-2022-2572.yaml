  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/2572 od 19. prosinca 2022. o zahtjevu Komisiji
    da podnese studiju kojom se dopunjuje procjena učinka Prijedloga uredbe Europskog
    parlamenta i Vijeća o održivoj upotrebi sredstava za zaštitu bilja i izmjeni
