    ako je to primjereno s obzirom na rezultate studije
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/2572 határozata (2022. december 19.) a Bizottságnak
    a növényvédő szerek fenntartható használatáról és az (EU) 2021/2115 európai
    parlamenti és tanácsi rendelet módosításáról szóló európai parlamenti
    és tanácsi rendeletjavaslat hatásvizsgálatát kiegészítő tanulmány benyújtására,
    valamint adott esetben a tanulmány eredményeinek fényében nyomonkövetési
    intézkedésekre irányuló javaslat megtételére történő felkéréséről
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/2572 del Consiglio del 19 dicembre 2022 che invita
    la Commissione a presentare uno studio che integri la valutazione d’impatto
    della proposta di regolamento del Parlamento europeo e del Consiglio relativo
    all’uso sostenibile dei prodotti fitosanitari e recante modifica del regolamento
    (UE) 2021/2115 del Parlamento europeo e del Consiglio, e a proporre azioni di
    follow-up, se del caso, alla luce dei risultati dello studio
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2022/2572 (2022. gada 19. decembris), ar ko lūdz
