    Eiropas Parlamenta un Padomes Regulai par augu aizsardzības līdzekļu ilgtspējīgu
    lietošanu un ar ko groza Eiropas Parlamentam un Padomes Regulu (ES) 2021/2115,
    un vajadzības gadījumā ierosināt turpmākus pasākumus, ņemot vērā pētījuma
    rezultātus
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2022/2572 2022 m. gruodžio 19 d. kuriuo Komisijos
