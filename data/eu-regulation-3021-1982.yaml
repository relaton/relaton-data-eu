title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3021/82 of 12 November 1982 re-establishing
    the levying of customs duties on carbonate of barium, falling within subheading
    28.42 A ex VII and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3021/82 de la Commission, du 12 novembre 1982, portant
    rétablissement de la perception des droits de douane applicables au carbonate
    de baryum de la sous-position 28.42 A ex VII du tarif douanier commun, originaire
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3021/82 der Kommission vom 12. November 1982 zur Wiedereinführung
    der Erhebung der Zölle für Carbonate des Bariums der Tarifstelle 28.42 A ex
    VII, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3021/82 af 12. november 1982 om genindførelse
    af opkrævning af told for carbonater af barium, henhørende under pos. 28.42
    A ex VII og med oprindelse i Kina, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3601/81r
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3021/82 τής Επιτροπής
    τής 12ης Νοεμβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τό ανθρακικό τού βαρίου
    τής διακρίσεως 28. 42 A ex VII τού Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3021/82 della Commissione, del 12 novembre 1982, che
    ripristina la riscossione dei dazi doganali applicabili al carbonato di bario,
    della sottovoce 28.42 A ex VII della tariffa doganale comune, originario della
    Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    3601/81 del Consiglion
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3021/82 van de Commissie van 12 november 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bariumcarbonaat
    van postonderverdeling 28.42 A ex VII, van oorsprong uit China, waarvoor de in
    Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
