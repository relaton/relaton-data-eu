title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 132/2001 of 22 January 2001 imposing a definitive
    anti-dumping duty and collecting definitively the provisional duty imposed on
    imports of ammonium nitrate originating in Poland and Ukraine, and terminating
    the anti-dumping proceeding in respect of imports originating in Lithuania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 132/2001 du Conseil du 22 janvier 2001 instituant un
    droit antidumping définitif et portant perception définitive du droit provisoire
    institué sur les importations de nitrate d'ammonium originaire de Pologne et
    d'Ukraine et clôturant la procédure antidumping à l'encontre des importations
    originaires de Lituanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 132/2001 des Rates vom 22. Januar 2001 zur Einführung
    eines endgültigen Antidumpingzolls und zur endgültigen Vereinnahmung des vorläufigen
    Zolls auf die Einfuhren von Ammoniumnitrat mit Ursprung in Polen und der Ukraine
    und zur Einstellung des Antidumpingverfahrens betreffend die Einfuhren mit Ursprung
    in Litauen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 132/2001 на Съвета от 22 януари
    2001 година за налагане на окончателно антидъмпингово
    мито и окончателно събиране на временното
    мито, наложено при вноса на амониев нитрат
    с произход от Полша и Украйна и за прекратяване
    на антидъмпинговото разследване по отношение
    на вноса с произход от Литва
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 132/2001 ze dne 22. ledna 2001 o uložení konečného
    antidumpingového cla z dovozu dusičnanu amonného pocházejícího z Polska
    a Ukrajiny a o konenčém výběru uloženého prozatímního cla a o zastavení
    antidumpingového řízení týkajícího se dovozu z Litvy
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 132/2001 af 22. januar 2001 om indførelse
    af en endelig antidumpingtold og om endelig opkrævning af den midlertidige told
    på import af ammoniumnitrat med oprindelse i Polen og Ukraine og om afslutning
    af antidumpingproceduren for så vidt angår import med oprindelse i Litauen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 132/2001 του Συμβουλίου,
    της 22ας Ιανουαρίου 2001, για την επιβολή οριστικού
    δασμού αντιντάμπινγκ και την οριστική είσπραξη
    του προσωρινού δασμού αντιντάμπινγκ στις εισαγωγές
    νιτρικού αμμωνίου καταγωγής Πολωνίας και Ουκρανίας
    καθώς και για την περάτωση της διαδικασίας
    αντιντάμπινγκ όσον αφορά τις εισαγωγές καταγωγής
    Λιθουανίας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 132/2001, 22. jaanuar 2001, millega kehtestatakse
    Poolast ja Ukrainast pärit ammooniumnitraadi impordi suhtes lõplik dumpinguvastane
    tollimaks ja nõutakse lõplikult sisse selle suhtes kehtestatud ajutine tollimaks
    ning lõpetatakse Leedust pärineva impordi suhtes kohaldatav dumpinguvastane
    menetlus
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 132/2001, annettu 22 päivänä tammikuuta 2001,
    lopullisen polkumyyntitullin käyttöönotosta ja väliaikaisen tullin lopullisesta
    kantamisesta Puolasta ja Ukrainasta peräisin olevan ammoniumnitraatin tuonnissa
    sekä polkumyynnin vastaisen menettelyn päättämisestä Liettuasta peräisin
    olevan tuonnin osalta
  type: main
- language: hu
  script: Latn
  content: A Tanács 132/2001/EK rendelete (2001. január 22.) a Lengyelországból
    és Ukrajnából származó ammónium-nitrát behozatalára vonatkozó végleges
    dömpingellenes vám kivetéséről és a kivetett ideiglenes vám végleges beszedéséről,
    valamint a Litvániából származó behozatal tekintetében a dömpingellenes
    eljárás megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 132/2001 del Consiglio, del 22 gennaio 2001, che istituisce
    un dazio antidumping definitivo, riscuote definitivamente il dazio provvisorio
    istituito sulle importazioni di nitrato d'ammonio originario della Polonia e dell'Ucraina,
    e chiude il procedimento antidumping per quanto riguarda le importazioni originarie
    della Lituania
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 132/2001 (2001. gada 22. janvāris), ar ko piemēro
    galīgo antidempinga maksājumu un galīgi iekasē pagaidu maksājumu, kurš uzlikts
    attiecībā uz Polijas un Ukrainas izcelsmes amonija nitrāta importu, un izbeidz
    antidempinga procedūru attiecībā uz Lietuvas izcelsmes importu
  type: main
- language: lt
  script: Latn
  content: 2001 m. sausio 22 d. Tarybos Reglamentas (EB) Nr. 132/2001 įvedantis galutinius
    antidempingo muitus ir galutinai surenkantis laikinuosius muitus, taikomus amonio
    nitrato, kurio kilmės šalys Lenkija ir Ukraina, importui ir nutraukiantis antidempingo
    procedūrų taikymą prekėms, kurių kilmės šalis Lietuva
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 132/2001 tat-22 ta' Jannar 2001 li jimponi
    dazju definittiv kontra d-dumping u li jiġbor definittivament id-dazju provviżorju
    impost fuq l-importazzjoni ta' nitrat ta' l-ammonju li joriġina fil-Polonja u
    fl-Ukrajna, u li jtemm il-proċedura kontra d-dumping dwar l-importazzjonijiet
    li joriġinaw fil -Lituwanja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 132/2001 van de Raad van 22 januari 2001 tot instelling
    van definitieve antidumpingrechten en tot definitieve inning van de voorlopige
    antidumpingrechten op ammoniumnitraat uit Polen en Oekraïne en tot beëindiging
    van de antidumpingprocedure ten aanzien van Litouwen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 132/2001 z dnia 22 stycznia 2001 r. nakładające
    ostateczne cło antydumpingowe i ustanawiające ostateczne pobranie tymczasowego
    cła nałożonego na przywóz azotanu amonu pochodzącego z Polski i Ukrainy oraz
    kończące postępowanie antydumpingowe w odniesieniu do przywozu pochodzącego
    z Litwy
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 132/2001 do Conselho, de 22 de Janeiro de 2001, que
    cria um direito anti-dumping definitivo e que estabelece a cobrança definitiva
    do direito provisório instituído sobre as importações de nitrato de amónio
    originárias da Polónia e da Ucrânia, e que encerra o processo anti-dumping
    relativo às importações originárias da Lituânia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 132/2001 al Consiliului din 22 ianuarie 2001 privind
    instituirea unui drept antidumping definitiv și perceperea cu titlu definitiv
    a dreptului provizoriu instituit la importurile de nitrat de amoniu originar din
    Polonia și Ucraina și închiderea procedurii antidumping referitoare la importurile
    originare din Lituania
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 132/2001 z 22. januára 2001, ktorým sa ukladá
    konečné antidumpingové clo a s konečnou platnosťou vyberá dočasné clo
    uložené na dovozy dusičnanu amónneho s pôvodom v Poľsku a na Ukrajine a
    ktorým sa zastavuje antidumpingové konanie týkajúce sa dovozov s pôvodom
    v Litve
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 132/2001 z dne 22. januarja 2001 o uvedbi dokončne
    protidampinške dajatve za uvoz in o dokončnem pobiranju začasne dajatve, uvedene
    za uvoz amonijevega nitrata s poreklom iz Poljske in Ukrajine ter o ustavitvi
    protidampinškega postopka v zvezi z uvozom blaga s poreklom iz Litve
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 132/2001 del Consejo, de 22 de enero de 2001, por el
    que se establece un derecho antidumping definitivo, por el que se perciben definitivamente
    los derechos provisionales impuestos sobre las importaciones de nitrato de amonio
    originarias de Polonia y Ucrania, y por el que se da por concluido el procedimiento
    antidumping por lo que se refiere a las importaciones originarias de Lituania
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 132/2001 av den 22 januari 2001 om införande
    av en slutgiltig antidumpningstull och slutgiltigt uttag av den preliminära antidumpningstull
    som införts på import av ammoniumnitrat med ursprung i Polen och Ukraina och
    om avslutande av antidumpningsförfarandet rörande import med ursprung i Litauen
