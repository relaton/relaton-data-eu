    do euro em unidade monetária nacional ou das taxas de câmbio aplicáveis em
    1 e 3 de Janeiro de 1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 755/1999 de la Comisión, de 12 de abril de 1999, por
