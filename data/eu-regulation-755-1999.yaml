    το ανώτατο ποσό της αντισταθμιστικής ενίσχυσης
    που προκύπτει από το συντελεστή μετατροπής
    του ευρώ σε μονάδες εθνικού νομίσματος ή τις
    ισοτιμίες που εφαρμόζονται στις 1 και 3 Ιανουαρίου
    1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 755/1999, annettu 12 päivänä huhtikuuta 1999,
    euron muuntokursseista kansalliseksi rahayksiköksi tai 1 ja 3 päivänä tammikuuta
    1999 sovellettavista valuuttakursseista johtuvien tasaustukien enimmäismäärän
    vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 755/1999 della Commissione, del 12 aprile 1999, che
    stabilisce il massimale dell'aiuto compensativo relativo ai tassi di conversione
    dell'euro in moneta nazionale o ai tassi di cambio applicabili il 1° e il 3 gennaio
    1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 755/1999 van de Commissie van 12 april 1999 tot vaststelling
