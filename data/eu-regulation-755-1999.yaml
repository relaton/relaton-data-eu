    in nationale Währungseinheiten oder der am 1. bzw. 3. Januar 1999 geltenden Wechselkurse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 755/1999 af 12. april 1999 om fastsættelse
    af maksimumsbeløbet for den udligningsstøtte, der ydes som følge af kurserne
    for euroens omregning til nationale valutaenheder og de vekselkurser, der var
    gældende pr. 1. og 3. januar 1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 755/1999 της Επιτροπής,
