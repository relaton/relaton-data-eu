  content: Commission Regulation (EC) No 755/1999 of 12 April 1999 fixing the maximum
    compensatory aid resulting from the rates for the conversion of the euro into
    national currency units and the exchange rates applicable on 1 and 3 January 1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 755/1999 de la Commission, du 12 avril 1999, fixant
    le montant maximal de l'aide compensatoire résultant des taux de conversion de
    l'euro en unité monétaire nationale ou des taux de change applicables le 1er
    et le 3 janvier 1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 755/1999 der Kommission vom 12. April 1999 zur Festsetzung
