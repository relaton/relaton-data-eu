title:
- language: en
  script: Latn
  content: '98/603/EC: Council Decision of 19 October 1998 amending Decision 95/408/EC
    on the conditions for drawing up, for an interim period, provisional lists of
    third-country establishments from which Member States are authorised to import
    certain products of animal origin, fishery products or live bivalve molluscs'
  type: main
- language: fr
  script: Latn
  content: '98/603/CE: Décision du Conseil du 19 octobre 1998 modifiant la décision
    95/408/CE concernant les modalités d''établissement pour une période transitoire,
    de listes provisoires des établissements de pays tiers dont les États membres
    sont autorisés à importer certains produits d''origine animale, produits de
    la pêche et mollusques bivalves vivants'
  type: main
- language: de
  script: Latn
  content: '98/603/EG: Entscheidung des Rates vom 19. Oktober 1998 zur Änderung der
    Entscheidung 95/408/EG über die Bedingungen für die Aufstellung vorläufiger
    Listen der Drittlandbetriebe, aus denen die Mitgliedstaaten bestimmte tierische
    Erzeugnisse, Fischereierzeugnisse oder lebende Muscheln einführen dürfen, während
    einer Übergangszeit'
  type: main
- language: da
  script: Latn
  content: '98/603/EF: Rådets beslutning af 19. oktober 1998 om ændring af beslutning
