title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 26 août 1970, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les préparations
    et conserves de fraises de la position Ex 20.06 du Tarif douanier commun, originaires
    du Brésil et mises en libre pratique au Benelux
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 26. August 1970, mit der die Bundesrepublik
    Deutschland ermächtigt wird, die aus Brasilien stammenden und in den Beneluxländern
    im freien Verkehr befindlichen Zubereitungen und Konserven von Erdbeeren der Tarifnummer
    ex 20.06 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 26 agosto 1970, che autorizza la Repubblica
    federale tedesca ad escludere dal trattamento comunitario le preparazioni e conserve
    di fragole della voce ex 20.06 della tariffa doganale comune, originarie del Brasile
    e messe in libera pratica nei paesi del Benelux
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 26 augustus 1970 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd bereidingen en conserven van aardbeien van post ex
    20.06 van het gemeenschappelijk douanetarief, van oorsprong uit Brazilië en in
    de Benelux-landen in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
