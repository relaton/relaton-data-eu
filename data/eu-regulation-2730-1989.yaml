  content: Commission Regulation (EEC) No 2730/89 of 8 September 1989 amending Regulation
    (EEC) No 2729/81 as regards the period of validity of export licences with advance
    fixing of the refund for cheese exported to Zone E and Canada
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2730/89 de la Commission du 8 septembre 1989 modifiant
