    d'exportation avec fixation à l'avance de la restitution de fromages exportés
    vers la zone E et le Canada
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2730/89 DER KOMMISSION vom 8. September 1989 zur
    Änderung der Verordnung (EWG) Nr. 2729/81 hinsichtlich der Gültigkeitsdauer
    der Ausfuhrlizenzen mit Vorausfestsetzung der Erstattung für Käse bei der Ausfuhr
    nach der Zone E und Kanada #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2730/89 af 8. september 1989 om ændring
