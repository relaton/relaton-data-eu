    διάρκεια ισχύος των πιστοποιητικών εξαγωγής
    με εκ των προτέρων καθορισμό της επιστροφής
    για τα τυριά που εξάγονται προς τη ζώνη Ε και
    τον Καναδά
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 2730/89, annettu 8 päivänä syyskuuta 1989,
