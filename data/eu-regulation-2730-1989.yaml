    anticipata della restituzione per i formaggi esportati verso la zona E ed il Canada
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2730/89 VAN DE COMMISSIE van 8 september 1989 tot
