  content: Commission Delegated Regulation (EU) 2025/1246 of 18 June 2025 amending
    the regulatory technical standards laid down in Delegated Regulations (EU) 2017/583
    and (EU) 2017/587 as regards transparency requirements for trading venues and
    investment firms in respect of bonds, structured finance products, emission allowances,
    and equity instruments
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1246 de la Commission du 18 juin 2025 modifiant
    les normes techniques de réglementation définies dans les règlements délégués
    (UE) 2017/583 et (UE) 2017/587 en ce qui concerne les obligations de transparence
    applicables aux plates-formes de négociation et aux entreprises d’investissement
    pour les obligations, les produits financiers structurés et les quotas d’émission
    et pour les actions et instruments assimilés
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/1246 der Kommission vom 18. Juni 2025 zur
