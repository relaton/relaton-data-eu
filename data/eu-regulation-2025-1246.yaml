    festgelegten technischen Regulierungsstandards hinsichtlich der Transparenzanforderungen
    für Handelsplätze und Wertpapierfirmen in Bezug auf Anleihen, strukturierte
    Finanzprodukte, Emissionszertifikate und Eigenkapitalinstrumente
  type: main
