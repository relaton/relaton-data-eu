title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 791/86 of 18 March 1986 specifying the extent
    to which applications lodged in February 1986 for import licences in respect of
    young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 791/86 de la Commission, du 18 mars 1986, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de février 1986 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 791/86 der Kommission vom 18. März 1986 über das
    Ausmaß, in dem den im Februar 1986 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 791/86 af 18. marts 1986 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i februar
    1986 for ungtyre bestemt til opfedning, kan imødkommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 791/86 της Επιτροπής
    της 18ης Μαρτίου 1986 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Φεβρουάριο του 1986, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 791/86 della Commissione, del 18 marzo 1986, che stabilisce
    in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di febbraio 1986 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 791/86 van de Commissie van 18 maart 1986 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in februari 1986
    ingediende aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 791/86 da Comissão, de 18 de Março de 1986, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Fevereiro de 1986 para os bovinos machos
    jovens destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 791/86 de la Comisión, de 18 de marzo de 1986, que
    determina en que medida podrá darse curso a las solicitues de expedición de
    certificados de importación presentadas en el mes de febrero de 1986 respecto
    a los jóvenes bovinos machos destinados al engorde
  type: main
