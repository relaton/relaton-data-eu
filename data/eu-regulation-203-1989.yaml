  content: Commission Regulation (EEC) No 203/89 of 27 January 1989 amending Regulation
    (EEC) No 1787/87 introducing the buying in of beef in respect of certain Member
    States and qualities and fixing the buying-in prices for beef
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 203/89 de la Commission, du 27 janvier 1989, modifiant
    le règlement (CEE) n 1787/87 ouvrant, pour certains États membres et groupes
    de qualité, l'achat à l'intervention et fixant les prix d'achat dans le secteur
    de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 203/89 der Kommission vom 27. Januar 1989 zur Änderung
    der Verordnung (EWG) Nr. 1787/87 zur Eröffnung des Interventionsankaufs für
    bestimmte Mitgliedstaaten und Qualitäten und zur Festsetzung der Ankaufspreise
    für Rindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 203/89 af 27. januar 1989 om ændring
