    e grupos de qualidades, a compra à intervenção e fixa os preços de compra
    no sector da carne de bovino
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 203/89 de la Comisión, de 27 de enero de 1989, que
    modifica el Reglamento (CEE) n 1787/87, por el que se abre para determinados Estados
    miembros y calidades la compra en intervención y se fijan los precios de compra
    en el sector de la carne de vacuno
