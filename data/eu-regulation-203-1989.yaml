    αγοράς στον τομέα του βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 203/89 della Commissione, del 27 gennaio 1989, che
    modifica il regolamento (CEE) n. 1787/87 recante apertura dell'acquisto di intervento
    di determinate qualità di carni bovine in determinati Stati membri e fissazione
    dei prezzi di acquisto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 203/89 van de Commissie van 27 januari 1989 tot wijziging
    van Verordening (EEG) nr. 1787/87 inzake het openen van de mogelijkheid tot interventieaankopen
