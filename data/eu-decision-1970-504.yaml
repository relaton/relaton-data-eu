title:
- language: en
  script: Latn
  content: '70/504/EEC: Commission decision of 5 November 1970 amending the decision
    of 3 June 1970 authorising the federal republic of Germany to approve, for marketing
    purposes, seed of pseudotsuga menziesii ( mirb. ) franco, of picea sitchensis
    trautv. and mey and of pinus strobus l., satisfying less stringent conditions
    (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '70/504/CEE: Décision de la Commission, du 5 novembre 1970, modifiant
    la décision du 3 juin 1970, autorisant la République fédérale d''Allemagne
    a admettre, à la commercialisation, des semences de pseudotsuga menziesii (mirb.)
    franco, de picea sitchensis trautv. et mey. et de pinus strobus l., soumises a
    des exigences réduites (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '70/504/EWG: Entscheidung der Kommission vom 5. November 1970 zur Änderung
    der Entscheidung vom 3. Juni 1970, mit der die Bundesrepublik Deutschland ermächtigt
    wird, Saatgut von pseudotsuga menziesii ( mirb. ) franco, von picea sitchensis
    trautv. und mey. und von pinus strobus l. mit minderen Anforderungen zum gewerbsmäßigen
    Verkehr zuzulassen (Nur der deutsche Text ist verbindlich)'
  type: main
- language: it
  script: Latn
  content: '70/504/CEE: Decisione della commissione, del 5 novembre 1970, che modifica
    la decisione del 3 giugno 1970, che autorizza la repubblica federale di Germania
    ad ammettere alla commercializzazione le sementi di pseudotsuga menziesii ( mirb.
    ) franco, di picea sitchensis trautv. e mey e di pinus strobus l., sottoposte
    a requisiti ridotti (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '70/504/EEG: beschikking van de commissie van 5 november 1970 tot wijziging
    van de beschikking van 3 juni 1970 houdende machtiging van de bondsrepubliek Duitsland
    om zaden van pseudotsuga menziesii ( mirb. ) franco, van picea sitchensis trautv.
    en mey., en van pinus strobus l., waaraan minder strenge eisen zijn gesteld, tot
    de handel toe te laten ( slechts de tekst in de Duitse taal is authentiek )'
