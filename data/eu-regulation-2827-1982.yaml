title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2827/82 of 22 October 1982 authorizing the
    Federal Republic of Germany and the Grand Duchy of Luxembourg to permit under
    certain conditions an additional increase in the alcoholic strength of certain
    wines and certain products intended for wine-making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2827/82 de la Commission, du 22 octobre 1982, autorisant
    la République fédérale d'Allemagne et le Grand-Duché de Luxembourg à permettre,
    sous certaines conditions, une augmentation supplémentaire du titre alcoométrique
    de certains vins et de certains produits destinés à l'élaboration des vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2827/82 der Kommission vom 22. Oktober 1982 zur Ermächtigung
    der Bundesrepublik Deutschland und des Großherzogtums Luxemburg, unter bestimmten
    Voraussetzungen eine zusätzliche Erhöhung des Alkoholgehalts bestimmter Weine
    und bestimmter zur Weinherstellung vorgesehener Erzeugnisse zu gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2827/82 af 22. oktober 1982 om bemyndigelse
    til Forbundsrepublikken Tyskland og storhertugdømmet Luxembourg til under visse
    omstændigheder at tillade en yderligere forhøjelse af alkoholindholdet i visse
    vine og visse produkter, der er bestemt til vinfremstilling
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2827/82 τής Επιτροπής
    τής 22ας Οκτωβρίου 1982 πού εξουσιοδοτεί τήν Ομοσπονδιακή
    Δημοκρατία τής Γερμανίας καί τό Μεγάλο Δουκάτο
    τού Λουξεμβούργου νά επιτρέπουν υπό ορισμένες
    προϋποθέσεις τή συμπληρωματική αύξηση τού
    αλκοολικού τίτλου ορισμένων οίνων καί ορισμένων
    προϊόντων προοριζομένων γιά τήν παραγωγή οίνων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2827/82 della Commissione, del 22 ottobre 1982, che
    autorizza la Repubblica federale di Germania e il Granducato del Lussemburgo a
    permettere in determinate condizioni un aumento supplementare della gradazione
    alcolometrica di taluni vini e di taluni prodotti destinati all' elaborazione
    dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2827/82 van de Commissie van 22 oktober 1982 waarbij
    de Bondsrepubliek Duitsland en het Groothertogdom Luxemburg gemachtigd worden
    om op bepaalde voorwaarden een extra verhoging van het alcoholgehalte van bepaalde
    wijnen en van bepaalde voor de bereiding van wijn bestemde produkten toe te staan
  type: main
