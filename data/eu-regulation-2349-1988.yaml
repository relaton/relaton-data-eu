  script: Latn
  content: Commission Regulation (EEC) No 2349/88 of 28 July 1988 re-establishing
    the levying of customs duties on other footwear falling within CN codes 6404 and
    6405 90 10 originating in India to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
