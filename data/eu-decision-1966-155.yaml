title:
- language: fr
  script: Latn
  content: Décision 66/155/CEE de la Commission, du 14 février 1966, portant nouvelle
    modification de sa décision du 6 novembre 1964, autorisant la perception de taxes
    compensatoires sur les importations, en République fédérale d'Allemagne, de
    pain et de produits similaires, en provenance du Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '66/155/EWG: Entscheidung der Kommission vom 14. Februar 1966 zur erneuten
    Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Brot und ähnlichen Erzeugnissen aus dem Königreich der Niederlande
    in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '66/155/CEE: Decisione della Commissione, del 14 febbraio 1966, che modifica
    nuovamente la decisione del 6 novembre 1964 che autorizza la riscossione di una
    tassa compensativa all''importazione, nella Repubblica federale di Germania, di
    pane e prodotti analoghi provenienti dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '66/155/EEG: Beschikking van de Commissie van 14 februari 1966 tot nieuwe
    wijziging van haar beschikking van 6 november 1964 houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Bondsrepubliek Duitsland
    van brood en soortgelijke produkten uit het Koninkrijk der Nederlanden'
  type: main
