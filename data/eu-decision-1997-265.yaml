title:
- language: en
  script: Latn
  content: '97/265/EC: Commission Decision of 16 April 1997 on the recognition of
    the international standard ISO 14001:1996 and the European standard EN ISO 14001:1996,
    establishing specification for environmental management systems, in accordance
    with Article 12 of Council Regulation (EEC) No 1836/93 of 29 June 1993, allowing
    voluntary participation by companies in the industrial sector in a Community eco-management
    and audit scheme'
  type: main
- language: fr
  script: Latn
  content: '97/265/CE: Décision de la Commission du 16 avril 1997 concernant la reconnaissance
    de la norme internationale ISO 14001:1996 et de la norme européenne EN ISO 14001:1996,
    établissant des spécifications applicables aux systèmes de management environnemental,
    conformément à l''article 12 du règlement (CEE) nº 1836/93 du Conseil, permettant
    la participation volontaire des entreprises du secteur industriel à un système
    communautaire de management environnemental et d''audit'
  type: main
- language: de
  script: Latn
  content: '97/265/EG: Entscheidung der Kommission vom 16. April 1997 zur Anerkennung
    der Internationalen Norm ISO 14001:1996 und der Europäischen Norm EN ISO 14001:1996
    für Umweltmanagementsysteme gemäß Artikel 12 der Verordnung (EWG) Nr. 1836/93
    des Rates über die freiwillige Beteiligung gewerblicher Unternehmen an einem
    Gemeinschaftssystem für das Umweltmanagement und die Umweltbetriebsprüfung'
  type: main
- language: cs
  script: Latn
  content: 'Rozhodnutí Komise ze dne 16. dubna 1997 o uznání mezinárodní normy
    ISO 14001: 1996 a evropské normy EN ISO 14001: 1996, které stanoví specifikaci
    pro systémy řízení podniků z hlediska ochrany životního prostředí, v
    souladu s článkem 12 nařízení Rady (ES) č. 1836/93 ze dne 29. června 1993
    o dobrovolné účasti průmyslových podniků v systému řízení podniků a
    auditu z hlediska ochrany životního prostředí'
  type: main
- language: da
  script: Latn
  content: '97/265/EF: Kommissionens Beslutning af 16. april 1997 om anerkendelse
    af den internationale standard ISO 14001:1996 og den europæiske standard EN ISO
    14001:1996, som fastlægger specifikationer for miljøstyringssystemer, i overensstemmelse
    med artikel 12 i Rådets forordning (EØF) nr. 1836/93 om industrivirksomheders
    frivillige deltagelse i en fællesskabsordning for miljøstyring og miljørevision'
  type: main
- language: el
  script: Grek
  content: '97/265/ΕΚ: Απόφαση της Επιτροπής της 16ης Απριλίου
    1997 για την αναγνώριση του διεθνούς προτύπου
    ISO 14001:1996 και του ευρωπαϊκού προτύπου EN ISO 14001:1996,
    που θεσπίζουν προδιαγραφές για συστήματα περιβαλλοντικής
    διαχείρισης, σε συμφωνία με το άρθρο 12 του κανονισμού
    (ΕΟΚ) αριθ. 1836/93 της 29ης Ιουνίου 1993 σχετικά με
    την εκούσια συμμετοχή επιχειρήσεων του βιομηχανικού
    τομέα σε κοινοτικό σύστημα οικολογικής διαχείρισης
    και οικολογικού ελέγχου'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 16. aprill 1997, keskkonnajuhtimissüsteemide spetsifikatsiooni
    kehtestavate rahvusvahelise standardi ISO 14001:1996 ja Euroopa standardi EN ISO
    14001:1996 tunnustamise kohta vastavalt 29. juuni 1993. aasta nõukogu määruse
    (EMÜ) nr 1836/93 (tööstusettevõtjate vabatahtliku osalemise võimaldamise
    kohta ühenduse keskkonnajuhtimis- ja -auditeerimissüsteemis) artiklile 12
  type: main
- language: fi
  script: Latn
  content: '97/265/EY: Komission päätös, tehty 16 päivänä huhtikuuta 1997, ympäristöjärjestelmän
    spesifikaation määrittävien kansainvälisen standardin ISO 14001:1996 ja eurooppalaisen
    standardin EN ISO 14001:1996 tunnustamisesta teollisuusyritysten vapaaehtoisesta
    osallistumisesta yhteisön ympäristöasioiden hallinta- ja auditointijärjestelmään
    29 päivänä kesäkuuta 1993 annetun neuvoston asetuksen (ETY) N:o 1836/93 12
    artiklan mukaisesti'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1997. április 16.) a környezetvédelmi vezetési
    rendszerek meghatározását megállapító ISO 14001:1996 nemzetközi szabványnak
    és EN ISO 14001:1996 európai szabványnak az ipari vállalkozásoknak a közösségi
    környezetvédelmi vezetési és hitelesítési rendszerben történő önkéntes
    részvételének lehetővé tételéről szóló, 1993. június 29-i 1836/93/EGK
    tanácsi rendelet 12. cikkével összhangban történő elismeréséről
  type: main
- language: it
  script: Latn
  content: '97/265/CE: Decisione della Commissione del 16 aprile 1997 concernente
    il riconoscimento della norma internazionale ISO 14001:1996 e della norma europea
    EN ISO: 14001:1996, che stabiliscono regole per i sistemi di gestione ambientale
    in conformità dell''articolo 12 del regolamento (CEE) n. 1836/93 del Consiglio,
    del 29 giugno 1993, sull''adesione volontaria delle imprese del settore industriale
    a un sistema comunitario di ecogestione e audit'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1997. gada 16. aprīlis) par starptautiskā standarta
    ISO 14001:1996 un Eiropas standarta EN ISO 14001:1996 atzīšanu, ar ko izveido
    vides apsaimniekošanas sistēmu specifikāciju, saskaņā ar 12. pantu Padomes
    1993. gada 29. jūnija Regulā (EEK) Nr. 1836/93, ar ko rūpniecības uzņēmumiem
    ļauj brīvprātīgi piedalīties Kopienas vides vadības un kontroles sistēmā
  type: main
- language: lt
  script: Latn
  content: 1997 m. balandžio 16 d. Komisijos sprendimas dėl tarptautinio standarto
    ISO 14001:1996 ir Europos standarto EN ISO 14001:1996, nustatančių aplinkos
    apsaugos vadybos sistemų specifikacijas, pripažinimo pagal 1993 m. birželio
    29 d. Tarybos reglamento (EEB) Nr. 1836/93, leidžiančio pramonės sektoriuje
    dirbančioms įmonėms savanoriškai dalyvauti Bendrijos aplinkos apsaugos vadybos
    ir audito sistemoje, 12 straipsnį
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-16 ta’ April 1997 dwar ir-rikonoxximent
    ta’ l-istandard internazzjonali ISO 14001:1996 u l-istandard Ewropew EN ISO
    14001:1996, li jistabbilixxu l-ispeċifikazzjoni għas-sistemi għall-immaniġġjar
    ta’ l-ambjent, skond l-Artikolu 12 tar-Regolament tal-Kunsill (KEE) Nru 1836/93
    tad-29 ta’ Ġunju 1993, li jippermetti l-parteċipazzjoni volontarja mis-settur
    industrijali fi skema Komunitarja għall-immaniġġjar ta’ l-ambjent u verifika
  type: main
- language: nl
  script: Latn
  content: '97/265/EG: Beschikking van de Commissie van 16 april 1997 betreffende
    de erkenning van de internationale norm ISO 14001:1996 en de Europese norm EN
    ISO 14001:1996 tot vaststelling van de specificaties voor milieubeheersystemen,
    overeenkomstig artikel 12 van Verordening (EEG) nr. 1836/93 van de Raad inzake
    de vrijwillige deelneming van bedrijven uit de industriële sector aan een communautair
    milieubeheer- en milieuauditsysteem'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 16 kwietnia 1997 r. w sprawie uznania międzynarodowych
    norm ISO 14001:1996 i europejskich norm EN ISO 14001:1996, ustanawiających specyfikacje
    dla systemów zarządzania środowiskiem, zgodnie z art. 12 rozporządzenia Rady
    (EWG) nr 1836/93 z dnia 29 czerwca 1993 r. dopuszczającego dobrowolny udział
    spółek sektora przemysłowego w systemie zarządzania środowiskiem i audytu
    środowiskowego we Wspólnocie
  type: main
- language: pt
  script: Latn
  content: '97/265/CE: Decisão da Comissão de 16 de Abril de 1997 relativa ao reconhecimento
    da norma internacional ISO 14001:1996 e da norma europeia EN ISO 14001:1996, que
    estabelecem especificações para os sistemas de gestão do ambiente, em conformidade
    com o artigo 12º do Regulamento (CEE) nº 1836/93 do Conselho que permite a participação
    voluntária das empresas do sector industrial num sistema comunitário de ecogestão
    e auditoria'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 16. apríla 1997 o uznávaní medzinárodnej normy
    ISO 14001:1996 a európskej normy EN ISO 14001:1996, ktoré zriaďujú špecifikácie
    pre environmentálne riadiace systémy v súlade s článkom 12 nariadenia Rady
    (EHS) č. 1836/93 z 29. júna 1993, ktorým sa umožňuje dobrovoľná účasť
    obchodných spoločností priemyselného sektora v eko-manažmente a audite spoločenstva
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 16. aprila 1997 o priznavanju mednarodnega standarda
    ISO 14001:1996 in evropskega standarda EN ISO 14001:1996, ki določata specifikacijo
    za sisteme okoljskega upravljanja v skladu s členom 12 Uredbe Sveta (EGS) št.
    1836/93 z dne 29. junija 1993 o prostovoljni udeležbi podjetij industrijskega
    sektorja v sistemu Skupnosti za upravljanje in pregledovanje okolja
  type: main
- language: es
  script: Latn
  content: '97/265/CE: Decisión de la Comisión de 16 de abril de 1997 sobre el reconocimiento
    de la norma internacional ISO 14001:1996 y de la norma Europea EN ISO 14001:1996
    que establecen especificaciones para sistemas de gestión medioambiental de conformidad
    con el artículo 12 del Reglamento (CEE) nº 1836/93 del Consejo, de 29 de junio
    de 1993, por el que se permite que las empresas del sector industrial se adhieran
    con carácter voluntario a un sistema comunitario de gestión y auditoría medioambientales
    (EMAS)'
  type: main
- language: sv
  script: Latn
  content: '97/265/EG: Kommissionens beslut av den 16 april 1997 om erkännande av
    den internationella standarden ISO 14001:1996 och den europeiska standarden EN
    ISO 14001:1996 om fastställandet av närmare anvisningar för miljöstyrningssystem
    enligt artikel 12 i rådets förordning (EEG) nr 1836/93 om frivilligt deltagande
    för industriföretag i gemenskapens miljöstyrnings- och miljörevisionsordning'
