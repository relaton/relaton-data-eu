title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1562/84 of 5 June 1984 amending Regulation
    (EEC) No 431/84 as regards the granting of aid for butter and concentrated butter
    which are available on the market and which are used in the manufacture of pastry
    products, ice-cream and other foodstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1562/84 de la Commission du 5 juin 1984 abrogeant le
    règlement (CEE) no 431/84 en ce qui concerne l' octroi d' une aide au beurre
    et au beurre concentré se trouvant sur le marché utilisés pour la fabrication
    de produits de pâtisserie, de glaces alimentaires et autres produits alimentaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1562/84 der Kommission vom 5. Juni 1984 zur Aufhebung
    der Verordnung (EWG) Nr. 431/84 hinsichtlich der Gewährung einer Beihilfe für
    Butter und Butterfett vom Markt, die zur Herstellung von Backwaren, Speiseeis
    und anderen Lebensmitteln verwendet werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1562/84 af 5. juni 1984 om ophævelse
    af forordning (EØF) nr. 431/84 for så vidt angår støtte til smør og smørkoncentrat
    på markedet, der anvendes til fremstilling af konditorvarer, konsumis og andre
    levnedsmiddelprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1562/84 της Επιτροπής
    της 5ης Ιουνίου 1984 για την κατάργηση του κανονισμού
    (ΕΟΚ) αριθ. 431/84 όσον αφορά τη χορήγηση ενίσχυσης
    στο βούτυρο και στο συμπυκνωμένο βούτυρο που
    βρίσκονται στην αγορά και χρησιμοποιούνται
    για την παρασκευή προϊόντων ζαχαροπλαστικής,
    παγωτών και άλλων προϊόντων διατροφής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1562/84 della Commissione del 5 giugno 1984 che abroga
    il regolamento (CEE) n. 431/84 per quanto riguarda la concessione di un aiuto
    per il burro e il burro concentrato destinati alla fabbricazione di prodotti della
    pasticceria, di gelati e di altri prodotti alimentari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1562/84 van de Commissie van 5 juni 1984 tot intrekking
    van Verordening (EEG) nr. 431/84 ten aanzien van de toekenning van steun voor
    op de markt beschikbare boter en boterconcentraat bestemd voor de vervaardiging
    van banketbakkerswerk, consumptie-ijs en andere voedingsmiddelen
