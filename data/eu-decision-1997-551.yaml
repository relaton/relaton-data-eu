title:
- language: en
  script: Latn
  content: '97/551/EC: Commission Decision of 12 February 1997 on the compatibility
    with the common market of Germany''s proposed extension of the investment-allowance
    and special-depreciation schemes to west Berlin, in so far as these schemes do
    not concern the agricultural products processing and marketing sector (Only the
    German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/551/CE: Décision de la Commission du 12 février 1997 sur la compatibilité
    avec le marché commun de l''extension à Berlin-Ouest du régime des amortissements
    spéciaux et du régime de la prime fiscale à l''investissement, dans la mesure
    où ces régimes ne concernent pas le secteur de la transformation et de la commercialisation
    des produits agricoles (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/551/EG: Entscheidung der Kommission vom 12. Februar 1997 über die
    Vereinbarkeit der von Deutschland geplanten Ausdehnung der Sonderabschreibungsregelung
    und der Investitionszulageregelung auf West-Berlin, soweit diese Regelungen nicht
    den Sektor der Verarbeitung und Vermarktung landwirtschaftlicher Erzeugnisse betreffen,
    mit dem Gemeinsamen Markt (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/551/EF: Kommissionens beslutning af 12. februar 1997 om, hvorvidt Tysklands
    planer om at udvide ordningen med særlige afskrivninger og ordningen med skattemæssige
    investeringspræmier til at omfatte Vestberlin, i det omfang ordningen ikke vedrører
    forarbejdning og afsætning af landbrugsprodukter, er forenelig med fællesmarkedet
    (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
