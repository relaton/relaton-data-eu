    1997 σχετικά με το συμβιβάσιμο της επέκτασης
    του καθεστώτος επενδυτικών επιδοτήσεων και
    εκτάκτων αποσβέσεων για επενδύσεις στο Δυτικό
    Βερολίνο που προγραμματίζει η Γερμανία, στο
    βαθμό που το καθεστώς αυτό δεν αφορά τον τομέα
    της μεταποίησης και εμπορίας γεωργικών προϊόντων,
    με την κοινή αγορά (το κείμενο στη γερμανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/551/EY: Komission päätös, tehty 12 päivänä helmikuuta 1997, Saksan
    suunnitteleman tuen soveltuvuudesta yhteismarkkinoille, joka tuki myönnettäisiin
    laajentamalla erityispoistojärjestelmä sekä investointien verohelpotusjärjestelmä
    Länsi-Berliiniin, jos näitä järjestelmiä ei sovelleta maataloustuotteiden
    jalostamiseen ja kauppaan (Ainoastaan saksankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/551/CE: Decisione della Commissione del 12 febbraio 1997 riguardante
    la compatibilità con il mercato comune della progettata estensione a Berlino
    Ovest del regime tedesco del premio fiscale agli investimenti e del regime degli
    ammortamenti speciali degli investimenti, con esclusione del settore della trasformazione
    e commercializzazione di prodotti agricoli (Il testo in lingua tedesca è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/551/EG: Beschikking van de Commissie van 12 februari 1997 betreffende
