title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1122/80 of 6 May 1980 re-establishing the
    levying of customs duties on wicks, of woven, plaited or knitted textile materials,
    products of category 106 (code 1060), originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1122/80 de la Commission, du 6 mai 1980, portant rétablissement
    de la perception des droits de douane applicables aux mèches tissées, tressées
    ou tricotées, en matières textiles, de la catégorie de produits n° 106 (code
    1060), originaires de l' Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1122/80 der Kommission vom 6. Mai 1980 über die Wiedereinführung
    des Zollsatzes für gewebte, geflochtene oder gewirkte Dochte aus Spinnstoffen
    der Warenkategorie Nr. 106 (Kennziffer 1060), mit Ursprung in Indien, dem die
    in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1122/80 af 6. maj 1980 om genindførelse
    af opkrævning af toldafgifter for væger af tekstil, vævede, flettede eller
    strikkede, under varekategori 106 (kode 1060), som har oprindelse i Indien og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1122/80 della Commissione, del 6 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai lucignoli tessuti,
    intrecciati o a maglia, di materie tessili, della categoria di prodotti n. 106
    (codice 1060), originari dell' India beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1122/80 van de Commissie van 6 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op lampe- en
    kaarsepit, geweven, gevlochten of gebreid, van de categorie van produkten nr.
    106 (codenummer 1060), van oorsprong uit India waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
