    των ελαχίστων προδιαγραφών για ορισμένα δεξαμενόπλοια
    που εισέρχονται ή εξέρχονται από κοινοτικούς
    λιμένες»
  type: main
- language: it
  script: Latn
  content: Direttiva 79/1034/CEE del Consiglio, del 6 dicembre 1979, che modifica
    la direttiva 79/116/CEE relativa alle condizioni minime necessarie per talune
    navi cisterna che entrano nei porti della Comunità o che ne escono
  type: main
- language: nl
  script: Latn
  content: Richtlijn 79/1034/EEG van de Raad van 6 december 1979 houdende wijziging
    van Richtlijn 79/116/EEG inzake de minimumeisen waaraan bepaalde tankers moeten
    voldoen bij het in- en uitvaren van de zeehavens van de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Directiva 79/1034/CEE do Conselho, de 6 de Dezembro de 1979, que altera
    a Directiva 79/116/CEE relativa às condições mínimas exigidas a certos navios-tanque
    que entrem nos portos marítimos da Comunidade ou deles saiam
  type: main
- language: es
  script: Latn
  content: Directiva 79/1034/CEE del Consejo, de 6 de diciembre de 1979, por la que
