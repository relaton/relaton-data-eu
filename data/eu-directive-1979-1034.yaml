  script: Latn
  content: Council Directive 79/1034/EEC of 6 December 1979 amending Directive 79/116/EEC
    concerning minimum requirements for certain tankers entering or leaving Community
    ports
  type: main
- language: fr
  script: Latn
  content: Directive 79/1034/CEE du Conseil, du 6 décembre 1979, modifiant la directive
    79/116/CEE relative aux conditions minimales exigées pour certains navires- citernes
    entrant dans les ports de la Communauté ou en sortant
  type: main
- language: de
  script: Latn
  content: Richtlinie 79/1034/EWG des Rates vom 6. Dezember 1979 zur Änderung der
    Richtlinie 79/116/EWG über Mindestanforderungen an das Einlaufen von bestimmten
    Tankschiffen in Seehäfen der Gemeinschaft und das Auslaufen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 79/1034/EØF af 6. december 1979 om ændring af direktiv
    79/116/EØF om de mindstekrav visse tankskibe skal opfylde, når de anløber eller
    forlader Fællesskabets søhavne
  type: main
- language: el
  script: Grek
  content: Οδηγία 79/1034/ΕΟΚ του Συμβουλίου της 6ης Δεκεμβρίου
