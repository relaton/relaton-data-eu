title:
- language: en
  script: Latn
  content: '80/517/EEC: Commission Decision of 6 May 1980 authorizing the Kingdom
    of Denmark not to apply Community treatment to parkas, anoraks, windcheaters,
    waisted jackets and the like, woven, falling within subheadings ex 61.01 B IV
    and ex 61.02 B II of the Common Customs Tariff (category 21), originating in Thailand
    and in free circulation in the other Member States (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/517/CEE: Décision de la Commission, du 6 mai 1980, autorisant le Royaume
    du Danemark à exclure du traitement communautaire les "parkas", anoraks, blousons
    et similaires, tissés, des sous-positions ex 61.01 B IV et ex 61.02 B II du tarif
    douanier commun (catégorie 21), originaires de Thaïlande et mis en libre pratique
    dans les autres États membres (Le texte en langue danoise est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '80/517/EWG: Entscheidung der Kommission vom 6. Mai 1980, mit der das Königreich
    Dänemark ermächtigt wird, aus Thailand stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Parkas, Anoraks, Windjacken und dergleichen, aus
    Geweben, der Tarifstellen ex 61.01 B IV und ex 61.02 B II des Gemeinsamen Zolltarifs
    (Kategorie 21) von der Gemeinschaftsbehandlung auszuschließen (Nur der dänische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/517/EØF: Kommissionens beslutning af 6. maj 1980 om bemyndigelse af
    kongeriget Danmark til fra fællesskabsbehandling at undtage parca-coats, anorakker,
    vindjakker, blousonjakker o.lign., vævede, som henhører under pos. ex 61.01
    B IV og ex 61.02 B II i den fælles toldtarif (kategori 21), har oprindelse i
    Thailand og frit kan omsættes i de øvrige medlemsstater (Kun den danske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/517/CEE: Decisione della Commissione, del 6 maggio 1980, che autorizza
    il Regno di Danimarca ad escludere dal trattamento comunitario gli eskimo, le
    giacche a vento e i giubbotti, con o senza cappuccio e simili, tessuti, delle
    sottovoci ex 61.01 B IV e ex 61.02 B II della tariffa doganale comune, categoria
    21, originari della Tailandia e messi in libera pratica negli altri Stati membri
    (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/517/EEG: Beschikking van de Commissie van 6 mei 1980 waarbij het Koninkrijk
    Denemarken wordt gemachtigd parka''s, anoraks, windjakken en dergelijke, geweven,
    van de posten ex 61.01 B IV en ex 61.02 B II van het gemeenschappelijk douanetarief
    (categorie 21), van oorsprong uit Thailand en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Deense taal is authentiek)'
  type: main
