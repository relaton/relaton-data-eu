---
id: EUDecision1973110
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 30 April 1973 authorizing the French Republic not
    to apply Community treatment to garments of textiles other than cotton falling
    within heading Nos ex 61.01, ex 61.02 and ex 61.03 of the Common Customs Tariff,
    originating in Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 avril 1973, autorisant la République
    française à exclure du traitement communautaire les vêtements en matières
    textiles autres que le coton, des positions Ex 61.01, Ex 61.02 et Ex 61.03 du
    Tarif douanier commun, originaires de Hong-Kong et mis en libre pratique dans
    les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. April 1973, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidung aus anderen Spinnstoffen als aus Baumwolle
    der Tarifnummern ex 61.01, ex 61.02 und ex 61.03 des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 30. april 1973 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage beklædningsgenstande af tekstilstoffer
    (dog ikke bomuld), som henhører under position ex 61.01, ex 61.02 og ex 61.03
    i den fælles toldtarif, har oprindelse i Hong Kong og overgår til fri omsætning
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 aprile 1973, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli indumenti di materie tessili
    diverse dal cotone delle voci nn. ex. 61.01, ex 61.02 e ex 61.03 della tariffa
    doganale comune, originari di Hong Kong e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 april 1973 waarbij de Franse Republiek
    wordt gemachtigd kleding uit textielstoffen andere dan katoen van posten ex 61.01,
    ex 61.02 en ex 61.03 van het gemeenschappelijk douanetarief, van oorsprong uit
    Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
