    της 25ης Ιουλίου 1996 για τον καθορισμό σε ποιό
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιούλιο 1996 για τις συμπληρωματικές δασμολογικές
