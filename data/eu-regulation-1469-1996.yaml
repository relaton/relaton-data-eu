title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1469/96 of 25 July 1996 determining the percentages
    of quantities which may be allowed in respect of import licence applications lodged
    in July 1996 under tariff quotas for meat provided for in Regulation (EC) No 1221/96
    for the Republic of Poland, the Republic of Hungary, the Czech Republic, Slovakia,
    Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1469/96 DE LA COMMISSION du 25 juillet 1996 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en juillet 1996 pour les contingents tarifaires de viandes bovines
    prévus par le règlement (CE) n° 1221/96 pour la république de Pologne, la
    république de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1469/96 DER KOMMISSION vom 25. Juli 1996 zur Bestimmung
    des Prozentsatzes, zu dem den im Juli 1996 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Fleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien im Rahmen der Zollkontingente gemäß Verordnung (EG)
    Nr. 1221/96 stattgegeben wird
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1469/96 af 25. juli 1996 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i juli 1996 om
    importlicenser for kød i forbindelse med de toldkontingenter for oksekød, der
    i forordning (EF) nr. 1221/96 er fastsat for Republikken Polen, Republikken Ungarn,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
