  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1469/96, annettu 25 päivänä heinäkuuta 1996,
    asetuksessa (EY) N:o 1221/96 säädettyjä naudanlihan tariffikiintiöitä koskevien,
    heinäkuussa 1996 esitettyjen tuontitodistushakemusten hyväksyttävyydestä Puolan
    tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian, Bulgarian ja Romanian
    osalta
  type: main
