  content: Commission Delegated Directive (EU) 2026/74 of 12 January 2026 amending
    Annex II to Directive (EU) 2024/1799 of the European Parliament and of the Council
    promoting the repair of goods to include domestic local space heaters as provided
    in Commission Regulation (EU) 2024/1103 as regards ecodesign requirements for
    local space heaters and separate related controls
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2026/74 de la Commission du 12 janvier 2026
    modifiant l’annexe II de la directive (UE) 2024/1799 du Parlement européen
    et du Conseil visant à promouvoir la réparation des biens afin d’y inclure
    les dispositifs de chauffage décentralisés domestiques comme le prévoit le
    règlement (UE) 2024/1103 de la Commission en ce qui concerne les exigences d’écoconception
    applicables aux dispositifs de chauffage décentralisés et aux dispositifs de
    contrôle connexes indépendants
  type: main
