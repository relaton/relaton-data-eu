type: standard
title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 301/96 of 19 February 1996 determining to
    what extent licence applications submitted during February 1996 for live bovine
    animals weighing between 160 and 300 kg as part of a tariff quota provided for
    pursuant to Regulation (EC) No 39/96
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 301/96 DE LA COMMISSION du 19 février 1996 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en février 1996 pour les animaux vivants de l'espèce bovine d'un
    poids de 160 à 300 kilogrammes dans le cadre d'un contingent tarifaire prévu
    par le règlement (CE) n° 39/96
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 301/96 DER KOMMISSION vom 19. Februar 1996 zur Festsetzung
    des Umfangs, in dem die im Februar 1996 für die Einfuhr lebender, 160 bis 300
    kg schwerer Rinder im Rahmen von Zollkontingenten gemäß der Verordnung (EG)
    Nr. 39/96 beantragten Lizenzen genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 301/96 af 19. februar 1996 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i februar 1996 om
    importlicenser for levende kvæg af en vægt på 160 til 300 kg i forbindelse
    med et toldkontingent, der er fastsat i forordning (EF) nr. 39/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 301/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 19ης Φεβρουαρίου 1996 για τον καθορισμό του
    βαθμού στον οποίο είναι δυνατόν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Φεβρουάριο 1996 για ζωντανά ζώα
    του βοείου είδους, βάρους από 160 έως 300 χιλιόγραμμα,
    στο πλαίσιο μιας δασμολογικής ποσόστωσης η
    οποία προβλέπεται από τον κανονισμό (ΕΚ) αριθ.
    39/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 301/96, annettu 19 päivänä helmikuuta 1996,
    eläviä 160-300 kilogrammaa painavia nautaeläimiä koskevien helmikuussa 1996
    jätettyjen tuontilupahakemusten hyväksyttävyydestä asetuksessa (EY) N:o 39/96
    määriteltyjen tariffikiintiöiden rajoissa
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 301/96 DELLA COMMISSIONE del 19 febbraio 1996 che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nel mese di febbraio 1996 per gli animali vivi della specie bovina, dai 160 ai
    300 chilogrammi, nel quadro del contingente tariffario previsto dal regolamento
    (CE) n. 39/96
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 301/96 VAN DE COMMISSIE van 19 februari 1996 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor levende runderen met een gewicht van 160 tot 300 kg, die in februari 1996
    zijn ingediend op grond van een tariefcontingent dat is vastgesteld bij Verordening
    (EG) nr. 39/96
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 301/96 DA COMISSÃO de 19 de Fevereiro de 1996 que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de animais vivos da espécie bovina com peso compreendido entre 160 e 300 quilogramas,
    apresentados em Fevereiro de 1996 ao abrigo de um contingente tarifário previsto
    pelo Regulamento (CE) nº 39/96
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 301/96 DE LA COMISIÓN de 19 de febrero de 1996 por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de animales vivos de la especie bovina con un peso entre 160 y
    300 kilogramos, presentadas en febrero de 1996 dentro de un contingente arancelario
    establecido en el Reglamento (CE) n° 39/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 301/96 av den 19 februari 1996 om i vilken
    utsträckning licensansökningar inlämnade under februari 1996 för levande nötkreatur
    med en vikt på 160-300 kg inom ramen för den avgiftskvot som fastställts i
    förordning (EG) nr 39/96
  type: main
