title:
- language: en
  script: Latn
  content: '79/562/EEC: Commission Decision of 16 May 1979 authorizing the Federal
    Republic of Germany not to apply Community treatment to special gloves for sport,
    of leather, falling within heading No ex 42.03 of the Common Customs Tariff, originating
    in the People''s Republic of China and in free circulation in the other Member
    States (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/562/CEE: Décision de la Commission, du 16 mai 1979, autorisant la
    République fédérale d''Allemagne à exclure du traitement communautaire les
    gants spéciaux de sport en cuir, de la position ex 42.03 du tarif douanier commun,
    originaires de la République populaire de Chine et mis en libre pratique dans
    les autres États membres (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/562/EWG: Entscheidung der Kommission vom 16. Mai 1979, mit der die
    Bundesrepublik Deutschland ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Spezialsporthandschuhe
    aus Leder der Tarifnummer ex 42.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/562/EØF: Kommissionens beslutning af 16. maj 1979 om bemyndigelse
    af Forbundsrepublikken Tyskland til fra fællesskabsbehandling at undtage handsker
    til sportsbrug af læder, som henhører under pos. ex 42.03 i den fælles toldtarif
    har oprindelse i Den kinesiske Folkerepublik og frit kan omsættes i de øvrige
    medlemsstater (Kun den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/562/CEE: Decisione della Commissione, del 16 maggio 1979, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario i
    guanti speciali per sport di cuoio, della voce ex 42.03 della tariffa doganale
    comune, originari della Repubblica popolare cinese e messi in libera pratica negli
    altri Stati membri (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/562/EEG: Beschikking van de Commissie van 16 mei 1979 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd sporthandschoenen van leder, van post ex 42.03 van
    het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek China
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Duitse taal is authentiek)'
  type: main
