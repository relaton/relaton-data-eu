title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 487/78 of 8 March 1978 amending Regulation
    (EEC) No 588/77 as regards the list of authorized vine varieties which may be
    used for new plantings and replantings until 30 November 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 487/78 de la Commission, du 8 mars 1978, modifiant
    le règlement (CEE) n° 588/77 en ce qui concerne la liste des variétés de vigne
    autorisées pouvant être utilisées pour les plantations nouvelles et les replantations
    jusqu' au 30 novembre 1978
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 487/78 der Kommission vom 8. März 1978 zur Änderung
    der Verordnung (EWG) Nr. 588/77 hinsichtlich des Verzeichnisses der zugelassenen
    Rebsorten, die bis 30. November 1978 für Neuanpflanzungen und Wiederbepflanzungen
    verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) 487/78 af 8. marts 1978 om ændring af
    forordning (EØF) nr. 588/77 for så vidt angår listen over godkendte vinstoksorter,
    der må anvendes til nyplantning og genplantning indtil den 30. november 1978
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 487/78 della Commissione, dell' 8 marzo 1978, che
    modifica il regolamento (CEE) n. 588/77 per quanto riguarda l' elenco delle varietà
    di viti autorizzate utilizzabili per i nuovi impianti e i reimpianti fino al 30
    novembre 1978
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 487/78 van de Commissie van 8 maart 1978 tot wijziging
    van Verordening (EEG) nr. 588/77 ten aanzien van de lijst van de toegestane wijnstokrassen
    die tot en met 30 november 1978 mogen worden gebruikt bij aanplant en herbeplanting
