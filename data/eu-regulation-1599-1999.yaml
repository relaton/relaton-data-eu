  script: Latn
  content: Verordening (EG) nr. 1599/1999 van de Raad van 12 juli 1999 tot instelling
    van een definitief compenserend recht en tot definitieve invordering van het voorlopige
    recht op de invoer van roestvrij staaldraad met een diameter van 1 mm of meer
    uit India en tot beëindiging van de procedure ten aanzien van de invoer van roestvrij
    staaldraad met een diameter van 1 mm of meer uit de Republiek Korea
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1599/1999 z dnia 12 lipca 1999 r. nakładające
    ostateczne cło wyrównawcze i stanowiące o ostatecznym poborze cła tymczasowego
    nałożonego na drut ze stali nierdzewnej o średnicy 1 mm lub większej pochodzący
