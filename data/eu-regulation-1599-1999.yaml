    iz nerjavnega jekla premera 1 mm ali več s poreklom iz Indije ter o ustavitvi
    postopka v zvezi z uvozom žice iz nerjavnega jekla premera 1 mm ali več s poreklom
    iz Republike Koreje
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1599/1999 del Consejo de 12 de julio de 1999 por el
    que se establece un derecho compensatorio definitivo y se percibe definitivamente
