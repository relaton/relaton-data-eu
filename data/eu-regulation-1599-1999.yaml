title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1599/1999 of 12 July 1999 imposing a definitive
    countervailing duty and collecting definitively the provisional duty imposed on
    stainless steel wires with a diameter of 1 mm or more originating in India and
    terminating the proceeding concerning imports of stainless steel wires with a
    diameter of 1 mm or more originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1599/1999 du Conseil du 12 juillet 1999 instituant
    un droit compensateur définitif et portant perception définitive du droit provisoire
    institué sur les fils en aciers inoxydables d'un diamètre égal ou supérieur
    à un millimètre originaires de l'lnde et clôturant la procédure concernant
    les importations de fils en aciers inoxydables d'un diamètre égal ou supérieur
    à un millimètre originaires de la République de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1599/1999 des Rates vom 12. Juli 1999 zur Einführung
    endgültiger Ausgleichszölle auf die Einfuhren von Draht aus nichtrostendem Stahl
    mit einem Durchmesser von 1 mm oder mehr mit Ursprung in Indien, zur endgültigen
    Vereinnahmung der vorläufigen Zölle auf diese Einfuhren und zur Einstellung
    des Verfahrens gegenüber den Einfuhren von Draht aus nichtrostendem Stahl mit
    einem Durchmesser von 1 mm oder mehr mit Ursprung in der Republik Korea
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1599/1999 ze dne 12. července 1999 o uložení
    konečného vyrovnávacího cla z dovozu drátů z korozivzdorné oceli o průměru
    nejméně 1 mm pocházejících z Indie a konečném výběru uloženého prozatímního
    cla a o zastavení řízení týkajícího se dovozu drátů z korozivzdorné
    oceli o průměru nejméně 1 mm pocházejících z Korejské republiky
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1599/1999 af 12. juli 1999 om indførelse af
    en endelig udligningstold og endelig opkrævning af den midlertidige told på
    importen af tråd af rustfrit stål af diameter 1 mm og derover med oprindelse
