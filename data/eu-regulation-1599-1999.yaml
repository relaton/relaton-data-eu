    o średnicy 1 mm lub większej pochodzącego z Republiki Korei
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1599/1999 do Conselho de 12 de Julho de 1999 que institui
    um direito de compensação definitivo e que estabelece a cobrança definitiva
    do direito provisório instituído sobre as importações de fios de aço inoxidável
    de diâmetro igual ou superior a 1 mm originários da Índia e que encerra o processo
    relativo às importações de fios de aço inoxidável de diâmetro igual ou superior
    a 1 mm, originários da República da Coreia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1599/1999 z 12. júla 1999, ktorým sa uplatňuje
    konečné vyrovnávacie clo a konečné vyberané dočasné clo uložené na drôty
    z nehrdzavejúcej ocele s priemerom 1 mm alebo väčším, s pôvodom v Indii,
    a ktorým sa ukončuje konanie týkajúce sa dovozu drôtov z nehrdzavejúcej
    ocele s priemerom 1 mm alebo väčším s pôvodom v Kórejskej republike
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1599/1999 z dne 12. julija 1999 o uvedbi dokončne
