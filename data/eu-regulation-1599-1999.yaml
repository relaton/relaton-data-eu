  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1599/1999 del Consiglio del 12 luglio 1999 che istituisce
    un dazio compensativo definitivo e dispone la riscossione definitiva del dazio
    provvisorio istituito sul filo di acciaio inossidabile di diametro pari o superiore
    a 1 mm originario dell'India e chiude il procedimento relativo alle importazioni
    di filo di acciaio inossidabile di diametro pari o superiore a 1 mm originario
    della Repubblica di Corea
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1599/1999 (1999. gada 12. jūlijs), ar kuru piemēro
    galīgo kompensācijas maksājumu un galīgi iekasē pagaidu maksājumu, kas piemērots
    par Indijas izcelsmes nerūsējošā tērauda stieplēm, kuru diametrs ir 1 mm
    vai vairāk, un izbeidz procedūru par tādu Korejas Republikas izcelsmes nerūsējošā
    tērauda stiepļu importu, kuru diametrs ir 1 mm vai vairāk
  type: main
- language: lt
  script: Latn
  content: 1999 m. liepos 12 d. Tarybos reglamentas (EB) Nr. 1599/1999 dėl importuojamos
