    οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1011/94 DELLA COMMISSIONE del 29 aprile 1994 che stabilisce
    le modalità complementari di applicazione del meccanismo complementare agli scambi
    (MCS) fra la Spagna e la Comunità nella sua composizione al 31 dicembre 1985
    per quanto riguarda taluni prodotti
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1011/94 VAN DE COMMISSIE van 29 april 1994 tot vaststelling
