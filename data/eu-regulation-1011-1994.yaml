    het handelsverkeer (ARH) tussen Spanje en de Gemeenschap in haar samenstelling
    op 31 december 1985, ten aanzien van bepaalde produkten van de groenten- en fruitsector
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1011/94 DA COMISSÃO de 29 de Abril de 1994 que fixa
