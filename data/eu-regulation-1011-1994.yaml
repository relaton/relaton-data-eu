title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1011/94 of 29 April 1994 laying down certain
    additional detailed rules for the application of the Supplementary Trade Mechanism
    (STM) between Spain and the Community as constituted on 31 December 1985 as regards
    certain fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1011/94 de la Commission du 29 avril 1994 fixant certaines
    modalités additionnelles pour l'application du mécanisme complémentaire aux
    échanges (MCE) dans le secteur des fruits et légumes entre l'Espagne et la Communauté
    dans sa composition au 31 décembre 1985 en ce qui concerne certains fruits et
    légumes
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1011/94 DER KOMMISSION vom 29. April 1994 mit zusätzlichen
    Bestimmungen zur Anwendung des ergänzenden Handelsmechanismus (EHM) zwischen
    Spanien und der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember 1985 hinsichtlich
    bestimmter Obst- und Gemüsesorten
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1011/94 af 29. april 1994 om visse yderligere
    gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen (SMS)
    mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985 for
    så vidt angår visse frugter og grøntsager
  type: main
- language: el
  script: Grek
