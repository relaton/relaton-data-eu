    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών (ΣΜΣ) μεταξύ
    της Ισπανίας και της Κοινότητας με τη σύνθεσή
