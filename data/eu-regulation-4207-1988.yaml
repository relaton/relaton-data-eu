    mit Ursprung in Marokko von gemeinsamen Fischereiunternehmen zwischen natuerlichen
    oder juristischen Personen Portugals und Marokkos fuer das Wirtschaftsjahr 1989
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4207/88 af 21. december 1988 om suspension
    for fangstsæsonen 1989 af tolden på ferske fiskerivarer med oprindelse i Marokko
    og hidhørende fra fællesforetagender, der er oprettet mellem fysiske eller juridiske
    personer i Portugal og i Marokko, i anledning af sådanne varers direkte landing
    i Portugal
  type: main
- language: el
  script: Grek
