title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 4207/88 of 21 December 1988 suspending for
    the 1989 fishing year the duties applicable to fresh fishery products originating
    in Morocco and coming from joint fisheries ventures set up between natural or
    legal persons from Portugal and Morocco, on the direct landing of such products
    in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4207/88 de la Commission du 21 décembre 1988 portant,
    pour la campagne 1989, suspension des droits applicables aux produits de la pêche
    fraîche originaires du Maroc et provenant des entreprises communes de pêche
    constituées entre personnes physiques ou morales du Portugal et du Maroc, à
    l'occasion de leur débarquement direct au Portugal
  type: main
- language: de
  script: Latn
