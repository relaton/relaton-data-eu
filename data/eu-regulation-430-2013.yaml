title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 430/2013 of 13 May 2013 imposing
    a definitive anti-dumping duty and collecting definitively the provisional duty
    imposed on imports of threaded tube or pipe cast fittings, of malleable cast iron,
    originating in the People’s Republic of China and Thailand and terminating the
    proceeding with regard to Indonesia
  type: main
- language: fr
  script: Latn
