    vakautusmekanismin mukaisen etuustullin väliaikainen suspendoiminen ei ole tarpeen
    Perusta peräisin olevien banaanien tuonnissa vuonna 2016
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/2100 оd 30. studenoga 2016. kojom
