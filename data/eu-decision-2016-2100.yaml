title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/2100 of 30 November 2016 determining
    that the temporary suspension of the preferential customs duty established under
    the stabilisation mechanism for bananas of the Trade Agreement between the European
    Union and its Member States, of the one part, and Colombia and Peru, of the other
    part, is not appropriate for imports of bananas originating in Peru for the year
    2016
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/2100 de la Commission du 30 novembre 2016
    déterminant que la suspension temporaire du droit de douane préférentiel établi
    au titre du mécanisme de stabilisation pour les bananes prévu par l'accord commercial
    entre l'Union européenne et ses États membres, d'une part, et la Colombie et
    le Pérou, d'autre part, n'est pas appropriée dans le cas des importations de
    bananes originaires du Pérou pour l'année 2016
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/2100 der Kommission vom 30. November
    2016 zur Feststellung, dass die vorübergehende Aussetzung des Präferenzzolls,
    der im Rahmen des Stabilisierungsmechanismus für Bananen des Handelsübereinkommens
    zwischen der Europäischen Union und ihren Mitgliedstaaten einerseits und Kolumbien
    und Peru andererseits festgesetzt wurde, für Einfuhren von Bananen mit Ursprung
    in Peru für das Jahr 2016 nicht angebracht ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/2100 на Комисията
    от 30 ноември 2016 година за определяне на временното
    спиране на прилагането на преференциалното
    мито, въведено по силата на механизма за стабилизиране
    по отношение на бананите от Споразумението
    за търговия между Европейския съюз и неговите
    държави членки, от една страна, и Колумбия и
    Перу, от друга страна, за нецелесъобразно по
    отношение на вноса на банани с произход от
    Перу за 2016 година
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/2100 ze dne 30. listopadu 2016,
    kterým se stanoví, že pro rok 2016 není vhodné dočasné pozastavení preferenční
    celní sazby pro dovoz banánů pocházejících z Peru podle mechanismu stabilizace
    pro banány Obchodní dohody mezi Evropskou unií a jejími členskými státy
    na jedné straně a Kolumbií a Peru na straně druhé
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/2100 af 30. november
    2016 om fastsættelse af, at den midlertidige suspension af den præferencetold,
