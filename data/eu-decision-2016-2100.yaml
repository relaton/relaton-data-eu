    vámtételeknek az egyrészről az Európai Unió és tagállamai, másrészről
    Kolumbia és Peru közötti kereskedelmi megállapodásban foglalt banánkereskedelmi
    stabilizációs mechanizmus keretében történő 2016. évi ideiglenes felfüggesztése
    nem helyénvaló voltának megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/2100 della Commissione, del 30 novembre
    2016, che stabilisce che la sospensione temporanea del dazio doganale preferenziale
    istituito in virtù del meccanismo di stabilizzazione per le banane previsto dall'accordo
    commerciale tra l'Unione europea e i suoi Stati membri, da una parte, e la Colombia
    e il Perù, dall'altra, non è appropriata per quanto riguarda le importazioni
    di banane originarie del Perù per l'anno 2016
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/2100 (2016. gada 30. novembris),
    ar ko nosaka, ka tā atvieglotā muitas nodokļa pagaidu atcelšana, kurš noteikts
    saskaņā ar stabilizācijas mehānismu banāniem Tirdzniecības nolīgumā starp
    Eiropas Savienību un tās dalībvalstīm, no vienas puses, un Kolumbiju un Peru,
    no otras puses, attiecībā uz Peru izcelsmes banānu importu 2016. gadā nav
    atbilstīga
  type: main
- language: lt
  script: Latn
  content: 2016 m. lapkričio 30 d. Komisijos įgyvendinimo sprendimas (ES) 2016/2100,
    kuriuo nustatoma, kad pagal Europos Sąjungos bei jos valstybių narių ir Kolumbijos
    bei Peru prekybos susitarimo bananų importo stabilizavimo priemonę nustatyto
    lengvatinio muito laikinas taikymo nutraukimas Peru kilmės importuojamiems bananams
    2016 m. yra netinkamas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/2100 tat-30
    ta' Novembru 2016 li tiddetermina li s-sospensjoni temporanja tad-dazji tad-dwana
    preferenzjali stabbilita taħt il-mekkaniżmu ta' stabbilizzazzjoni għall-banana
    tal-Ftehim ta' Kummerċ bejn l-Unjoni Ewropea u l-Istati Membri tagħha, min-naħa
    l-waħda, u l-Kolombja u l-Perù, min-naħa l-oħra, mhix xierqa għall-importazzjoni
    tal-banana li toriġina mill-Perù għas-sena 2016
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/2100 van de Commissie van 30 november 2016
    waarbij wordt bepaald dat de tijdelijke opschorting van het preferentiële douanerecht
    dat is vastgesteld in het kader van het stabilisatiemechanisme voor bananen in
    de handelsovereenkomst tussen de Europese Unie en haar lidstaten, enerzijds, en
    Colombia en Peru, anderzijds, niet passend is voor de invoer van bananen van oorsprong
    uit Peru voor het jaar 2016
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/2100 z dnia 30 listopada 2016 r. w
    sprawie ustalenia, że tymczasowe zawieszenie preferencyjnego cła ustanowionego
    w ramach mechanizmu stabilizacyjnego dotyczącego bananów, zawartego w Umowie
    o handlu między Unią Europejską i jej państwami członkowskimi, z jednej strony,
    a Kolumbią i Peru, z drugiej strony, nie jest odpowiednie dla przywozu bananów
    pochodzących z Peru w 2016 r.
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/2100 da Comissão, de 30 de novembro de
    2016, que determina que a suspensão temporária do direito aduaneiro preferencial
    estabelecido ao abrigo do mecanismo de estabilização para as bananas do Acordo
    Comercial entre a União Europeia e os seus Estados-Membros, por um lado, e a
    Colômbia e o Peru, por outro lado, não é adequada para as importações de
    bananas originárias do Peru no ano de 2016
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/2100 a Comisiei din 30 noiembrie
    2016 de stabilire a faptului că suspendarea temporară a taxei vamale preferențiale
    instituite în temeiul mecanismului de stabilizare pentru banane prevăzut de
    Acordul comercial între Uniunea Europeană și statele membre ale acesteia, pe
    de o parte, și Columbia și Peru, pe de altă parte, nu este adecvată pentru
    importurile de banane originare din Peru pentru anul 2016
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/2100 z 30. novembra 2016, ktorým
    sa určuje, že dočasné pozastavenie preferenčného cla stanoveného na základe
    stabilizačného mechanizmu pre banány v rámci Dohody o obchode medzi Európskou
    úniou a jej členskými štátmi na jednej strane a Kolumbiou a Peru na strane
    druhej nie je pre rok 2016 pre dovoz banánov s pôvodom v Peru vhodné
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/2100 z dne 30. novembra 2016 o ugotovitvi,
    da začasna opustitev preferencialnih carin, vzpostavljenih v okviru stabilizacijskega
    mehanizma za banane iz Trgovinskega sporazuma med Evropsko unijo in njenimi državami
    članicami na eni strani ter Kolumbijo in Perujem na drugi strani, za uvoz banan
    s poreklom iz Peruja za leto 2016 ni primerna
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/2100 de la Comisión, de 30 de noviembre
    de 2016, por la que se determina que la suspensión temporal del arancel aduanero
    preferencial establecido en el marco del mecanismo de estabilización para el
    banano del Acuerdo comercial entre la Unión Europea y sus Estados miembros, por
    una parte, y Colombia y el Perú, por otra, no es apropiada para las importaciones
    de plátanos (bananas) originarios del Perú para el año 2016
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/2100 av den 30 november 2016
    om fastställande av att det tillfälliga upphävandet av förmånstullarna enligt
    stabiliseringsmekanismen för bananer i avtalet om upprättande av en associering
    mellan Europeiska unionen och dess medlemsstater, å ena sidan, och Colombia och
    Peru, å andra sidan, inte är lämpligt för import av bananer med ursprung i
    Peru under 2016
