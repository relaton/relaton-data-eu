    mehanizmom stabilizacije za banane iz Sporazuma o trgovini između Europske unije
    i njezinih država članica, s jedne strane, i Kolumbije i Perua, s druge strane,
    nije primjerena za uvoz banana podrijetlom iz Perua za 2016.
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/2100 végrehajtási határozata (2016. november
