    Den Europæiske Union og dens medlemsstater på den ene side og Colombia og Peru
    på den anden side, ikke er hensigtsmæssig for import af bananer med oprindelse
    i Peru for 2016
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/2100 της Επιτροπής,
