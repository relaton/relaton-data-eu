    Colombia ja Peruu vahelise kaubanduslepingu banaane käsitlevas stabiilsusmehhanismis
    kehtestatud soodustollimaksu ajutine peatamine ei ole Peruust pärit banaanide
    impordi suhtes aastal 2016 asjakohane
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/2100, annettu 30 päivänä
