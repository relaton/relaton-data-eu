title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 880/2004 of 29 April 2004 authorising without
    time limit the use of beta-carotene and canthaxanthin as additives in feedingstuffs
    belonging to the group of colouring matters including pigments
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 880/2004 de la Commission du 29 avril 2004 concernant
    l'autorisation sans limitation dans le temps du bêta-carotène et de la canthaxanthine
    en tant qu'additifs dans l'alimentation des animaux appartenant au groupe des
    matières colorantes, y compris les pigments
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 880/2004 der Kommission vom 29. April 2004 zur unbefristeten
