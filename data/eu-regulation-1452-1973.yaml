  content: Regulation (EEC) No 1452/73 of the Commission of 30 May 1973 fixing the
    rates of the refunds applicable from 1 June 1973 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1452/73 de la Commission, du 30 mai 1973, fixant les
    taux des restitutions applicables, à compter du 1er juin 1973, à certains produits
    des secteurs de céréales et du riz exportés sous forme de marchandises ne relevant
    pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1452/73 der Kommission vom 30. Mai 1973 zur Festsetzung
    der ab 1. Juni 1973 geltenden Erstattungssätze bei der Ausfuhr bestimmter Getreide-
    und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages fallenden
    Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1452/73 af 30. maj 1973 om fastsættelse
    af de restitutionssatser, der fra 1. juni 1973 skal anvendes for visse produkter
    fra korn- og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1452/73 della Commissione, del 30 maggio 1973, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 giugno 1973, a
    taluni prodotti dei settori dei cereali e del riso esportati sotto forma di merci
    non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1452/73 van de Commissie van 30 mei 1973 houdende
    vaststelling van de restituties die met ingang van 1 juni 1973 worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goederen
