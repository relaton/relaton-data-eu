title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 252/79 of 9 February 1979 re-establishing
    the levying of customs duties on tarpaulins, sails, awnings, sunblinds, tents
    and camping goods, falling within heading No 62.04, originating in South Korea
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 252/79 de la Commission, du 9 février 1979, portant
    rétablissement de la perception des droits de douane applicables aux bâches,
    voiles d' embarcations, stores d' extérieur, tentes et articles de campement,
    de la position tarifaire 62.04, originaires de la Corée du Sud bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 252/79 der Kommission vom 9. Februar 1979 über die
    Wiedereinführung des Zollsatzes für Planen, Segel, Markisen, Zelte und Zeltlagerausrüstungen
    der Tarifnummer 62.04, mit Ursprung in Südkorea, dem die in der Verordnung (EWG)
    Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 252/79 af 9. februar 1979 om genindførelse
    af opkrævning af toldafgifter for presenninger, sejl, etc., henhørende under
    pos. 62.04, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 252/79 della Commissione, del 9 febbraio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai copertoni, vele per
    imbarcazioni, ecc., della voce doganale 62.04, originari della Corea del Sud,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3157/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 252/79 van de Commissie van 9 februari 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op dekkleden,
    scheepszeilen, zonneschermen voor winkelpuien en dergelijke, tenten en kampeerartikelen,
    van post 62.04, van oorsprong uit Zuid-Korea waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3157/78 van de Raad
  type: main
