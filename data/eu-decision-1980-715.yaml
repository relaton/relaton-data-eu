title:
- language: en
  script: Latn
  content: '80/715/EEC: Commission Decision of 3 July 1980 on the reimbursement by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of expenditure incurred
    during 1977 on aids and premiums relating to the modernization of farms including
    those in the less-favoured farming areas (Only the French and Dutch texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/715/CEE: Décision de la Commission, du 3 juillet 1980, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole, section
    "orientation", au Royaume de Belgique des dépenses effectuées pendant l''année
    1977 pour les aides et primes relatives à la modernisation des exploitations
    agricoles, y compris dans les zones agricoles défavorisées (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/715/EWG: Entscheidung der Kommission vom 3. Juli 1980 über die Rückvergütung
    durch den EAGFL, Abteilung Ausrichtung, der im Jahr 1977 zur Modernisierung landwirtschaftlicher
    Betriebe für Beihilfen und Prämien - einschließlich der Hilfen für benachteiligte
    landwirtschaftliche Gebiete - getätigten Ausgaben an das Königreich Belgien
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/715/EØF: Kommissionens beslutning af 3. juli 1980 om refusion gennem
    EUGFL, udviklingssektionen, til kongeriget Belgien af udgifter, som er afholdt
    i løbet af året 1977 til støtte og præmier vedrørende modernisering af landbrugsbedrifter,
    også i ugunstigt stillede områder (Kun den franske og nederlandske udgave er
    autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/715/CEE: Decisione della Commissione, del 3 luglio 1980, relativa al
    rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio delle spese
    effettuate durante il 1977 per gli aiuti ed i premi relativi all''ammodernamento
    delle aziende agricole, comprese quelle nelle zone agricole svantaggiate (Il testi
    in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/715/EEG: Beschikking van de Commissie van 3 juli 1980 betreffende vergoeding
    door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België voor de in 1977
    verrichte uitgaven voor steun en premies met betrekking tot de modernisering van
    landbouwbedrijven waaronder mede begrepen die in probleemgebieden in de landbouw
    (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
