title:
- language: fr
  script: Latn
  content: Décision 64/605/CEE de la Commission, du 12 octobre 1964, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire le café, non décaféiné, non torréfié,
    de la position 09.01 A I A du Tarif douanier commun, originaire des pays autres
    que les états africains et malgache et les pays et territoires d'outre-mer, associés
    à la CEE et mis en libre pratique dans les pays du Benelux
  type: main
- language: de
  script: Latn
  content: '64/605/EWG: Entscheidung der Kommission vom 12. Oktober 1964 über den
    Antrag der Republik Frankreich gemäß Artikel 115 Absatz (1) des Vertrages, nicht
    entkoffeinierten nicht gerösteten Kaffee der Tarifnummer 09.01 A I a des Gemeinsamen
    Zolltarifs aus anderen Ländern als den assoziierten afrikanischen Staaten und
    Madagaskar und den mit der EWG assoziierten überseeischen Ländern und Gebieten,
    der sich in den Benelux-Ländern im freien Verkehr befindet, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '64/605/CEE: Decisione della Commissione, del 12 ottobre 1964, relativa
    al ricorso della Repubblica francese all''articolo 115, comma 1, del Trattato,
    al fine di escludere dal trattamento comunitario il caffè non decaffeinizzato,
    non torrefatto della voce 09.01 A I a della Tariffa doganale comune, originario
    dei paesi diversi dagli Stati africani e malgascio e dai paesi e territori d''oltremare
    associati alla CEE, ed immesso in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '64/605/EEG: Beschikking van de Commissie van 12 oktober 1964 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag ongebrande koffie, waaruit geen cafeïne is verwijderd, van post
    09.01 A I a van het gemeenschappelijk douanetarief, die van oorsprong is uit andere
    landen dan de met de EEG geassocieerde Afrikaanse staten en Madagaskar en de met
    de EEG geassocieerde landen en gebieden overzee en die in de Benelux-landen in
    het vrije verkeer is gebracht, van de communautaire behandeling uit te sluiten'
  type: main
