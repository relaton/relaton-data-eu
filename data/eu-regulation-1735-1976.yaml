title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1735/76 of July 1976 re- establishing the
    levying of customs duties on women' s, girls' , and infants' under garments of
    cotton fabric, falling within heading No ex 61.04, originating in India, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3002/75
    of November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1735/76 de la Commission, de 19 juillet 1976, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous (linge de corps) pour femmes, fillettes et jeunes enfants, de coton,
    de la position tarifaire ex 61.04, originaires de l' Inde bénéficiaire des préférences
    tarifaires prévues par le réglement (CEE) n° 3002/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1735/76 der Kommission vom 19. Juli 1976 zur Wiedereinführung
    des Zollsatzes für Unterkleidung (Leibwäsche) für Frauen, Mädchen und Kleinkinder,
    aus Baumwolle, der Tarifnummer ex 61.04, mit Ursprung in Indien, dem die in der
    Verordnung (EWG) Nr. 30002/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1735/76 af 19. juli 1976 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande, til kvinder, piger
    og småbørn, af bomuld, under position ex 61.04, som har oprindelse i Indien
    og omfattes af toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3002/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1735/76 della Commissione, del 19 luglio 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti (biancheria
    da dosso) per donna, per ragazza e per bambini, di cotone della voce doganale
    n. ex 61.04 originarie dell' India beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3002/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr.1735/76 van de Commissie van 19 juli 1976 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op dames-onderkleding,
    meisjesonderkleding en kinderonderkleding, van katoen, van post ex 61.04, van
    oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3002/75 van de Raad van 17 november 1975
  type: main
