    Erzeugung im Wirtschaftsjahr 1988/89 und zur Festsetzung des Anpassungsbetrags
    der Beihilfe für Sojabohnen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3303/89 af 31. oktober 1989 om fastsættelse
