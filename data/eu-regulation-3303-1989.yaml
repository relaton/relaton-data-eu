title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3303/89 of 31 October 1989 fixing the estimated
    soya bean production for the 1989/90 marketing year, the actual soya bean production
    for the 1988/89 marketing year and the adjustment to be made in the aid for soya
    beans for the 1989/90 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3303/89 de la Commission du 31 octobre 1989 fixant,
