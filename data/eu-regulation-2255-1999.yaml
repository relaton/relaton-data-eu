  content: Commission Regulation (EC) No 2255/1999 of 25 October 1999 amending Regulation
    (EC) No 1040/1999 adopting a protective measure applying to imports of garlic
    originating in China and derogating from Regulation (EEC) No 1859/93 on the application
    of the system of import licences for garlic imported from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2255/1999 de la Commission, du 25 octobre 1999, modifiant
