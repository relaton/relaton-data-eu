    die Einfuhr von Knoblauch mit Ursprung in China und zur Abweichung von der Verordnung
    (EWG) Nr. 1859/93 zur Anwendung von Lizenzen für die Einfuhr von Knoblauch aus
    Drittländern
  type: main
- language: da
  script: Latn
