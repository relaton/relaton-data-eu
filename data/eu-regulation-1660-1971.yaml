title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1660/71 of the Commission of 28 July 1971 amending
    Regulation (EEC) No 1054/68 determining the list of agencies certifying the admissibility
    to certain tariff headings of certain milk products from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1660/71 de la Commission, du 28 juillet 1971, modifiant
    le règlement (CEE) n° 1054/68 établissant la liste des organismes émetteurs
    de certificats destinés à permettre l' admission de certains produits laitiers
    en provenance des pays tiers dans certaines positions tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1660/71 der Kommission vom 28. Juli 1971 zur Änderung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Liste der Stellen für die
    Erteilung von Bescheinigungen für die Zulassung bestimmter Milcherzeugnisse aus
    dritten Ländern zu bestimmten Tarifnummern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1660/71 af 28. juli 1971 om ændring
    af forordning (EØF) nr. 1054/68 om udarbejdelse af en fortegnelse over de organer,
    der er kompetente til udstedelse af certifikater vedrørende visse fra tredjelande
    udførte mejeriprodukters henførelse under bestemte toldpositioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1660/71 τής Επιτροπής
    τής 28ης Ιουλίου 1971 περί τροποποιήσεως τού κανονισμού
    (ΕΟΚ) αριθ. 1054/68 «περί καταρτίσεως τού καταλόγου
    τών οργανισμών εκδόσεως πιστοποιητικών πού
    προορίζονται νά επιτρέπουν τήν υπαγωγή γαλακτοκομικών
    προϊόντων προελεύσεως τρίτων χωρών σέ ορισμένες
    δασμολογικές κλάσεις»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1660/71 della Commissione, del 28 luglio 1971, che
    modifica il regolamento (CEE) n. 1054/68 che stabilisce l' elenco degli organismi
    emittenti dei certificati destinati a permettere l' ammissione in alcune voci
    tariffarie di alcuni prodotti lattiero-caseari in provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1660/71 van de Commissie van 28 juli 1971 tot wijziging
    van Verordening (EEG) nr. 1054/68 houdende vaststelling van de lijst van organisaties
    voor de afgifte van certificaten ten behoeve van de indeling van sommige zuivelprodukten
    uit derde landen onder bepaalde tariefposten
