    poslovni nastan, a isporučuju telekomunikacijske usluge, usluge radijskog i televizijskog
    emitiranja ili elektroničke usluge osobama koje nisu porezni obveznici
  type: main
- language: hu
  script: Latn
  content: A Tanács 967/2012/EU rendelete ( 2012. október 9. ) a 282/2011/EU végrehajtási
    rendeletnek a nem adóalanyok számára távközlési, rádió- és televízióműsor-,
    valamint elektronikus szolgáltatásokat nyújtó, nem letelepedett adóalanyokra
    vonatkozó különös szabályozás tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 967/2012 del Consiglio, del 9 ottobre 2012 , che modifica
    il regolamento di esecuzione (UE) n. 282/2011 per quanto riguarda i regimi speciali
    applicabili ai soggetti passivi non stabiliti che forniscono servizi di telecomunicazione,
    servizi di teleradiodiffusione o servizi elettronici a persone non soggetti passivi
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (ES) Nr. 967/2012 ( 2012. gada 9. oktobris ), ar ko Īstenošanas
    regulu (ES) Nr. 282/2011 groza attiecībā uz īpašajiem režīmiem nodokļa
    maksātājiem, kas neveic uzņēmējdarbību attiecīgā dalībvalstī un kas
    sniedz telekomunikāciju pakalpojumus, apraides pakalpojumus vai elektroniskos
    pakalpojumus personām, kuras nav nodokļa maksātājas
  type: main
- language: lt
  script: Latn
  content: 2012 m. spalio 9 d. Tarybos reglamentas (ES) Nr. 967/2012, kuriuo iš dalies
    keičiamas Įgyvendinimo reglamentas (ES) Nr. 282/2011, kiek tai susiję su specialiomis
    schemomis neįsisteigusiems apmokestinamiesiems asmenims, teikiantiems telekomunikacijų,
    transliavimo ar elektronines paslaugas neapmokestinamiesiems asmenims
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (UE) Nru 967/2012 tad- 9 ta’ Ottubru 2012 li jemenda
