    televiestintäpalveluja, radio- ja televisiolähetyspalveluja tai sähköisiä
    palveluja suorittaviin sijoittautumattomiin verovelvollisiin sovellettavien erityisjärjestelmien
    osalta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EU) br. 967/2012 od 9. listopada 2012. o izmjeni Provedbene
