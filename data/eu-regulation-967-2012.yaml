    elettroniċi lil persuni mhux taxxabbli
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 967/2012 van de Raad van 9 oktober 2012 tot wijziging
    van Uitvoeringsverordening (EU) nr. 282/2011 wat betreft de bijzondere regelingen
    voor niet-gevestigde belastingplichtigen die telecommunicatiediensten, omroepdiensten
    of elektronische diensten verrichten voor niet-belastingplichtigen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (UE) nr 967/2012 z dnia 9 października 2012 r. zmieniające
    rozporządzenie wykonawcze (UE) nr 282/2011 w odniesieniu do procedur szczególnych
    dotyczących podatników niemających siedziby, którzy świadczą usługi telekomunikacyjne,
    usługi nadawcze lub usługi elektroniczne na rzecz osób niebędących podatnikami
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 967/2012 do Conselho, de 9 de outubro de 2012 ,
