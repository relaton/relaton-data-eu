title:
- language: en
  script: Latn
  content: Council Regulation (EU) No 967/2012 of 9 October 2012 amending Implementing
    Regulation (EU) No 282/2011 as regards the special schemes for non-established
    taxable persons supplying telecommunications services, broadcasting services or
    electronic services to non-taxable persons
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 967/2012 du Conseil du 9 octobre 2012 modifiant le
    règlement d’exécution (UE) n ° 282/2011 en ce qui concerne les régimes particuliers
    applicables aux assujettis non établis qui fournissent des services de télécommunication,
    de radiodiffusion et de télévision ou des services électroniques à des personnes
    non assujetties
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 967/2012 des Rates vom 9. Oktober 2012 zur Änderung
    der Durchführungsverordnung (EU) Nr. 282/2011 hinsichtlich der Sonderregelungen
    für nicht ansässige Steuerpflichtige, die Telekommunikationsdienstleistungen,
    Rundfunk- und Fernsehdienstleistungen oder elektronische Dienstleistungen an Nichtsteuerpflichtige
    erbringen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 967/2012 на Съвета от 9 октомври
    2012 година за изменение на Регламент за изпълнение
    (ЕС) № 282/2011 по отношение на специалните режими
    за неустановени данъчнозадължени лица, предоставящи
    телекомуникационни услуги, услуги за радио-
    и телевизионно излъчване или електронни услуги
    на данъчно незадължени лица
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EU) č. 967/2012 ze dne 9. října 2012 , kterým se
    mění prováděcí nařízení (EU) č. 282/2011, pokud jde o zvláštní režimy
    pro neusazené osoby povinné k dani, které poskytují telekomunikační služby,
    služby rozhlasového a televizního vysílání nebo elektronické služby osobám
    nepovinným k dani
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EU) nr. 967/2012 af 9. oktober 2012 om ændring af
    gennemførelsesforordning (EU) nr. 282/2011 for så vidt angår særordninger
    for ikke-etablerede afgiftspligtige personer, der leverer teleydelser, radio-
    og tv-spredningstjenester eller elektroniske tjenesteydelser til ikke-afgiftspligtige
    personer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 967/2012 του Συμβουλίου,
