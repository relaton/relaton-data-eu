    aos regimes especiais aplicáveis a sujeitos passivos não estabelecidos que prestem
    serviços de telecomunicações, de radiodifusão e televisão ou serviços eletrónicos
    a pessoas que não sejam sujeitos passivos
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 967/2012 al Consiliului din 9 octombrie 2012 de modificare
    a Regulamentului de punere în aplicare (UE) nr. 282/2011 în ceea ce privește
    regimurile speciale pentru persoanele impozabile nestabilite care prestează servicii
    de telecomunicații, servicii de radiodifuziune și de televiziune sau servicii
    electronice către persoane neimpozabile
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EÚ) č. 967/2012 z 9. októbra 2012 , ktorým sa mení
    a dopĺňa vykonávacie nariadenie (EÚ) č. 282/2011, pokiaľ ide o osobitné
    úpravy pre neusadené zdaniteľné osoby, ktoré poskytujú telekomunikačné
    služby, služby rozhlasového a televízneho vysielania alebo elektronické služby
    nezdaniteľným osobám
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EU) št. 967/2012 z dne 9. oktobra 2012 o spremembi Izvedbene
    uredbe (EU) št. 282/2011 glede posebnih ureditev za davčne zavezance, ki nimajo
    sedeža in opravljajo telekomunikacijske storitve, storitve oddajanja ali elektronske
    storitve za osebe, ki niso davčni zavezanci
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 967/2012 del Consejo, de 9 de octubre de 2012 , por
    el que se modifica el Reglamento de Ejecución (UE) n ° 282/2011 en lo que atañe
    a los regímenes especiales de los sujetos pasivos no establecidos que presten
    servicios de telecomunicaciones, de radiodifusión y televisión, o por vía electrónica
    a personas que no tengan la condición de sujetos pasivos
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EU) nr 967/2012 av den 9 oktober 2012 om ändring
    av rådets genomförandeförordning (EU) nr 282/2011 vad gäller de särskilda
    ordningarna för icke-etablerade beskattningsbara personer som tillhandahåller
    telekommunikationstjänster, radio- och televisionssändningar och elektroniska
    tjänster till icke beskattningsbara personer
