title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1226/96 of 28 June 1996 amending Regulation
    (EC) No 865/90 laying down detailed rules for the application of the special arrangements
    for imports of grain sorghum and millet originating in the African, Caribbean
    and Pacific States (ACP) or in the overseas countries and territories (OCT) in
    order to implement the agreement on agriculture concluded during the Uruguay Round
    of negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1226/96 de la Commission du 28 juin 1996 modifiant le
    règlement (CEE) nº 865/90 portant modalités d'application du régime particulier
    d'importation du sorgho et du millet originaires des États d'Afrique, des Caraïbes
    et du Pacifique (ACP) ou des pays et territoires d'outre-mer (PTOM) en vue de
    la mise en oeuvre de l'accord sur l'agriculture conclu dans le cadre des négociations
    du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1226/96 der Kommission vom 28. Juni 1996 zur Änderung
    der Verordnung (EWG) Nr. 865/90 mit Durchführungsbestimmungen für die besondere
    Regelung der Einfuhr von Sorghum und Hirse mit Ursprung in den Staaten in Afrika,
    in der Karibik und im Pazifischen Ozean (AKP-Staaten) und den Überseeischen Ländern
    und Gebieten (ÜLG) im Hinblick auf die Durchführung des Übereinkommens über
    die Landwirtschaft im Rahmen der Verhandlungen der Uruguay-Runde
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1226/96 af 28. juni 1996 om ændring
    af forordning (EØF) nr. 865/90 om gennemførelsesbestemmelser for den særlige
    importordning for sorghum og hirse med oprindelse i staterne i Afrika, Vestindien
    og Stillehavet (AVS) eller de oversøiske lande og territorier (OLT)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1226/96 της Επιτροπής
    της 28ης Ιουνίου 1996 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 865/90 για λεπτομέρειες εφαρμογής του
    ειδικού καθεστώτος εισαγωγής σόργου και κεχριού
    που κατάγονται από τα κράτη της Αφρικής, της
    Καραϊβικής και του Ειρηνικού (ΑΚΕ) ή από τις
    υπερπόντιες χώρες και εδάφη (ΥΧΕ) για την εφαρμογή
    της συμφωνίας επί της γεωργίας που έγινε στο
    πλαίσιο των διαπραγματεύσεων του Γύρου της
    Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1226/96, annettu 28 päivänä kesäkuuta 1996,
    yksityiskohtaisista säännöistä Afrikan, Karibian ja Tyynenmeren valtioista
    (AKT) tai merentakaisista maista ja alueilta (MMA) peräisin olevien durran ja
    hirssin erityisen tuontijärjestelmän soveltamiseksi annetun asetuksen (ETY)
    N:o 865/90 muuttamisesta Uruguayn kierroksen monenvälisten neuvottelujen osana
    tehdyn maataloutta koskevan sopimuksen täytäntöön panemiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1226/96 della Commissione del 28 giugno 1996 che modifica
    il regolamento (CEE) n. 865/90 recante modalità di applicazione del regime speciale
    di importazione di sorgo et di miglio originari degli Stati dell'Africa, dei Caraibi,
    del Pacifico (ACP) o dei paesi e territori d'oltremare (PTOM), ai fini dell'attuazione
    dell'accordo agricolo concluso nel quadro dell'Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1226/96 van de Commissie van 28 juni 1996 tot wijziging
    van Verordening (EEG) nr. 865/90 houdende uitvoeringsbepalingen van de bijzondere
    invoerregeling voor sorgho en gierst van oorsprong uit de Staten in Afrika, het
    Caribische gebied en de Stille Oceaan (ACS-Staten) of uit de landen en gebieden
    overzee (LGO), ter uitvoering van de overeenkomst inzake de landbouw die is gesloten
    in het kader van de Uruguay- Ronde
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n 1226/96 da Comissão de 28 de Junho de 1996 que altera
    o Regulamento (CEE) nº 865/90, que estabelece regras de execução do regime
    especial de importação de sorgo e de milho painço originários dos Estados
    de África, das Caraíbas e do Pacífico (ACP) ou de países e territórios ultramarinos
    (PTU), com vista à execução do acordo sobre a agricultura concluído no âmbito
    das negociações do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1226/96 de la Comisión de 28 de junio de 1996 por el
    que se modifica el Reglamento (CEE) nº 865/90, por el que se establecen las disposiciones
    de aplicación del régimen especial de importación de sorgo y mijo originarios
    de los Estados de África, del Caribe y del Pacífico (ACP) o de los países y
    territorios de Ultramar (PTUM), para la aplicación del Acuerdo agrícola celebrado
    en el marco de las negociaciones de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1226/96 av den 28 juni 1996 om ändring
    av (EEG) nr 865/90 om fastställande av tillämpningsföreskrifter för de särskilda
    importbestämmelserna om sorghum och hirs som har sitt ursprung i Afrika, Västindien
    och Stilla havet (AVS-staterna) eller i de utomeuropeiska länderna och territorierna
    (ULT) för att genomföra det jordbruksavtal som slöts inom ramen för handelsförhandlingarna
    i Uruguayrundan
  type: main
