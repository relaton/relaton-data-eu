title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 juin 1971, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure du traitement
    communautaire les pyjamas en coton pour femmes et enfants, de la position 60.04
    Ex A du Tarif douanier commun, originaires de Tchécoslovaquie et mis en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/239/EWG: Entscheidung der Kommission vom 10. Juni 1971, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die aus der Tschechoslowakei stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Baumwollschlafanzüge für Frauen
    und Kinder der Tarifnummer 60.04 ex A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/239/CEE: Decisione della Commissione, del 10 giugno 1971, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i pigiama per donna e bambini, della
    voce 60.04 ex A della tariffa doganale comune, originari della Cecoslovacchia
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/239/EEG: Beschikking van de Commissie van 10 juni 1971 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd katoenen dames- en kinderpyjama''s, van de post 60.04 ex A van
    het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije en in de
    overige Lid- Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
