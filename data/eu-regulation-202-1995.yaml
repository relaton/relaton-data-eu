title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 202/95 of 31 January 1995 determining the
    extent to which applications lodged on 31 January 1995 for import licences for
    certain pigmeat sector products under the regime provided for by Council Regulation
    (EC) No 774/94 opening and providing for the administration of certain Community
    tariff quotas for pigmeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 202/95 DE LA COMMISSION du 31 janvier 1995 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites le
    31 janvier 1995 pour certains produits du secteur de la viande de porc peuvent
    être acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94
    du Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande porcine et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 202/95 DER KOMMISSION vom 31. Januar 1995 über die
    Festsetzung des Umfangs, in dem die am 31. Januar 1995 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Erzeugnisse des Schweinefleischsektors entsprechend
    der Regelung der Verordnung (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung
    gemeinschaftlicher Zollkontingente für Schweinefleisch und bestimmte andere landwirtschaftliche
    Erzeugnisse genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 202/95 af 31. januar 1995 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet den 31.
    januar 1995 om importlicencer for visse produkter inden for svinekødsektoren
    i forbindelse med Rådets forordning (EF) nr. 774/94 om åbning og forvaltning
    af en række EF-toldkontingenter for oksekød af høj kvalitet, svinekød, fjerkrækød,
    hvede og blandsæd af hvede og rug samt klid og andre restprodukter
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 202/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 31ης Ιανουαρίου 1995 για καθορισμό ορίων εντός
    των οποίων δύναται να γίνει αποδεκτή η αίτηση
    που υποβλήθηκε στις 31 Ιανουαρίου 1995 για άδειες
    εισαγωγής για ορισμένα προϊόντα του τομέα
    του χοιρείου κρέατος θα γίνουν αποδεκτές βάσει
    του καθεστώτος που προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 774/94 του Συμβουλίου για το άνοιγμα
    και τον τρόπο διαχείρισης ορισμένων κοινοτικών
    δασμολογικών ποσοστώσεων για το χοίρειο κρέας,
    και για ορισμένα άλλα γεωργικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 202/95, annettu 31 päivänä tammikuuta 1995,
    tammikuussa 1995 jätettyjen tiettyjä sianliha-alan tuotteita koskevien tuontitodistushakemusten
