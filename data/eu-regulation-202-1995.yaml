    carni suine e di taluni altri prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 202/95 VAN DE COMMISSIE van 31 januari 1995 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector varkensvlees, die op 31 januari 1995 worden
    ingediend op grond van Verordening (EG) nr. 774/94 van de Raad houdende opening
