    asetuksessa (EY) N:o 774/94 säädetyn järjestelmän mukaisesti
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 202/95 DELLA COMMISSIONE del 31 gennaio 1995 che stabilisce
