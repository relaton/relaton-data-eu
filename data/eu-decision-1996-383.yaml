title:
- language: en
  script: Latn
  content: '96/383/EC: Council Decision of 10 June 1996 on the conclusion of the Agreement
    in the form of an Exchange of Letters concerning the provisional application of
    the Protocol defining, for the period from 18 January 1996 to 17 January 1999,
    the fishing opportunities and financial contribution provided for by the Agreement
    between the European Economic Community and the Republic of Seychelles on fishing
    off Seychelles'
  type: main
- language: fr
  script: Latn
