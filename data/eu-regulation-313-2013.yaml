    et du Conseil, pour ce qui concerne les états financiers consolidés, les partenariats
    et les informations à fournir sur les intérêts détenus dans d''autres entités:
    dispositions transitoires (modifications des normes internationales d''information
    financière IFRS 10, IFRS 11 et IFRS 12)'
  type: main
