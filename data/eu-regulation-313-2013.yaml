title:
- language: en
  script: Latn
  content: 'Commission Regulation (EU) No 313/2013 of 4 April 2013 amending Regulation
    (EC) No 1126/2008 adopting certain international accounting standards in accordance
    with Regulation (EC) No 1606/2002 of the European Parliament and of the Council
    as regards Consolidated Financial Statements, Joint Arrangements and Disclosure
    of Interest in Other Entities: Transition Guidance (Amendments to International
    Financial Reporting Standards 10, 11, and 12)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement (UE) n ° 313/2013 de la Commission du 4 avril 2013 modifiant
