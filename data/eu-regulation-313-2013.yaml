    Rates im Hinblick auf Konzernabschlüsse, Gemeinsame Vereinbarungen und Angaben
    zu Anteilen an anderen Unternehmen: Übergangsleitlinien (Änderungen an IFRS
    10, IFRS 11 und IFRS 12)'
