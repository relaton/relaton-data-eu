    žemės ūkio sąnaudoms skirtų tam tikrų pagrindinių produktų tiekimui bei
    gyvų gyvūnų ir kiaušinių tiekimui atokiausiems regionams pagal Tarybos reglamentus
    (EB) Nr. 1452/2001, (EB) Nr. 1453/2001 ir (EB) Nr. 1454/2001
  type: main
