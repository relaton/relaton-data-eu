title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 14/2004 of 30 December 2003 establishing
    the supply balances and Community aid for the supply of certain essential products
    for human consumption, for processing and as agricultural inputs and for the supply
    of live animals and eggs to the outermost regions under Council Regulations (EC)
    No 1452/2001, (EC) No 1453/2001 and (EC) No 1454/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 14/2004 de la Commission du 30 décembre 2003 relatif
    à l'établissement des bilans prévisionnels et la fixation des aides communautaires
    pour l'approvisionnement en certains produits essentiels à la consommation humaine,
    à la transformation et en tant qu'intrants agricoles et pour la fourniture d'animaux
    vivants et d'œufs aux régions ultrapériphériques conformément aux règlements
    (CE) n° 1452/2001, (CE) n° 1453/2001 et (CE) n° 1454/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 14/2004 der Kommission vom 30. Dezember 2003 zur Festsetzung
    der Bedarfsvorausschätzungen und der Gemeinschaftsbeihilfen für die Versorgung
    der Regionen in äußerster Randlage mit bestimmten zum Direktverbrauch, zur Verarbeitung
    oder als Produktionsmittel benötigten Agrarerzeugnissen einschließlich lebenden
    Tieren und Eiern gemäß den Verordnungen (EG) Nr. 1452/2001, 1453/2001 und 1454/2001
    des Rates
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 14/2004 ze dne 30. prosince 2003, kterým se
    stanoví odhady dodávek a podpora Společenství pro dodávky některých základních
    produktů určených k lidské spotřebě, ke zpracování a k použití jako
    zemědělské vstupy a pro dodávky živých zvířat a vajec do nejvzdálenějších
    regionů podle nařízení Rady (ES) č. 1452/2001, (ES) č. 1453/2001 a (ES)
    č. 1454/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 14/2004 af 30. december 2003 om fastsættelse
    af foreløbige forsyningsopgørelser og EF-støtte til levering af vigtige produkter
    til konsum, forarbejdning og anvendelse som rå- og hjælpestoffer og til levering
    af levende dyr og æg til regionerne i den yderste periferi i henhold til Rådets
    forordning (EF) nr. 1452/2001, (EF) nr. 1453/2001 og (EF) nr. 1454/2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 14/2004 της Επιτροπής,
