    των κοινοτικών ενισχύσεων για τον εφοδιασμό
    με ορισμένα βασικά προϊόντα για κατανάλωση
    από τον άνθρωπο, για μεταποίηση και ως γεωργικές
    εισροές καθώς και για την προμήθεια ζώντων
