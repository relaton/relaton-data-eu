    určených na ľudskú spotrebu, na spracovanie a na poľnohospodárske vstupy
    a pre dodávky živých zvierat a vajec do najvzdialenejších regiónov podľa
    nariadenia Rady (ES) č. 1452/2001, (ES) č. 1453/2001 a (ES) č. 1454/2001
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 14/2004 z dne 30. decembra 2003 o določitvi
    bilanc oskrbe in pomoči Skupnosti za oskrbo z nekaterimi osnovnimi proizvodi
    za prehrano ljudi in za predelavo, kot kmetijskimi vložki in za dobavo živih
    živali in jajc najbolj oddaljenim regijam skladno z Uredbami Sveta (ES) št.
    1452/2001, (ES) št. 1453/2001 in (ES) št. 1454/2001
  type: main
