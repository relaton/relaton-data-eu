  content: Verordening (EG) nr. 14/2004 van de Commissie van 30 december 2003 tot
    vaststelling van de voorzieningsbalansen en van de communautaire steun voor de
    voorziening van bepaalde essentiële producten voor menselĳke consumptie, voor
