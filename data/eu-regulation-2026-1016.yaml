    endo-1,3(4)-β-glucanase, geproduceerd door Talaromyces versatilis IMI 378536
    en Talaromyces versatilis DSM 26702, als toevoegingsmiddel voor diervoeding voor
    mestkippen en kippen opgefokt voor legdoeleinden, legkippen, mestkalkoenen en
    opfokkalkoenen, minder gangbare pluimveesoorten gehouden voor mestdoeleinden en
    minder gangbare pluimveesoorten opgefokt voor legdoeleinden, tot verlening van
    een vergunning voor een preparaat van endo-1,4-β-xylanase en endo-1,3(4)-β-glucanase,
    geproduceerd door Talaromyces versatilis IMI 378536 en Talaromyces versatilis
    DSM 26702, als toevoegingsmiddel voor diervoeding voor kippen opgefokt voor fokdoeleinden,
    kippen gehouden voor fokdoeleinden, kalkoenen gehouden voor fokdoeleinden, minder
    gangbare pluimveesoorten opgefokt voor fokdoeleinden en minder gangbare pluimveesoorten
    gehouden voor leg- en fokdoeleinden (vergunninghouder: Adisseo France S.A.S.),
    en tot intrekking van de Uitvoeringsverordeningen (EU) 2015/661, (EU) 2015/2304
    en (EU) 2017/210'
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2026/1016 z dnia 7 maja 2026 r.
    dotyczące przedłużenia zezwolenia na stosowanie preparatu endo-1,4-beta-ksylanazy
    i endo-1,3(4)-beta-glukanazy wytwarzanych przez Talaromyces versatilis IMI 378536
    i Talaromyces versatilis DSM 26702 jako dodatku paszowego dla kurcząt rzeźnych
    i odchowywanych na kury nioski, kur niosek, indyków rzeźnych i odchowywanych
    do celów hodowlanych oraz podrzędnych gatunków drobiu rzeźnego i odchowywanego
    na nioski, zezwolenia na stosowanie preparatu endo-1,4-beta-ksylanazy i endo-1,3(4)-beta-glukanazy
    wytwarzanych przez Talaromyces versatilis IMI 378536 i Talaromyces versatilis
    DSM 26702 jako dodatku paszowego dla kurcząt odchowywanych do celów hodowlanych,
    kurcząt hodowlanych, indyków hodowlanych, podrzędnych gatunków drobiu odchowywanego
    do celów hodowlanych oraz podrzędnych gatunków drobiu nieśnego i hodowlanego
    (posiadacz zezwolenia: Adisseo France S.A.S.) i uchylające rozporządzenia wykonawcze
    (UE) 2015/661, (UE) 2015/2304 i (UE) 2017/210'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2026/1016 da Comissão, de 7 de maio de
    2026, relativo à renovação da autorização de uma preparação de endo-1,4-beta-xilanase
    e endo-1,3(4)-beta-glucanase produzidas com Talaromyces versatilis IMI 378536
    e Talaromyces versatilis DSM 26702 como aditivo em alimentos para frangos de engorda
    e frangas criadas para postura, galinhas poedeiras, perus de engorda e criados
    para reprodução e espécies menores de aves de capoeira de engorda e criadas
    para postura, à autorização de uma preparação de endo-1,4-beta-xilanase e
    endo-1,3(4)-beta-glucanase produzidas com Talaromyces versatilis IMI 378536 e
    Talaromyces versatilis DSM 26702 como aditivo em alimentos para frangos criados
    para reprodução, frangos de reprodução, perus de reprodução, espécies menores
    de aves de capoeira criadas para reprodução e espécies menores de aves de capoeira
    de postura e reprodução (detentor da autorização: Adisseo France S.A.S.),
    e que revoga os Regulamentos de Execução (UE) 2015/661, (UE) 2015/2304 e (UE)
    2017/210'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2026/1016 al Comisiei din 7 mai
    2026 privind reînnoirea autorizației unui preparat de endo-1,4-beta-xilanază
    și endo-1,3(4)-beta-glucanază produse cu Talaromyces versatilis IMI 378536 și
    Talaromyces versatilis DSM 26702 ca aditiv în hrana puilor pentru îngrășare
    și a puicuțelor pentru ouat, a găinilor ouătoare, a curcanilor pentru îngrășare
    și a celor crescuți pentru reproducere, precum și a speciilor minore de păsări
    de curte pentru îngrășare și a celor crescute pentru ouat, a autorizației
    unui preparat de endo-1,4-beta-xilanază și endo-1,3(4)-beta-glucanază produse
    de Talaromyces versatilis IMI 378536 și de Talaromyces versatilis DSM 26702 ca
    aditiv în hrana puicuțelor crescute pentru reproducere, a puilor pentru reproducere,
    a curcanilor pentru reproducere, a speciilor minore de păsări de curte crescute
    pentru reproducere și a speciilor minore de păsări de curte pentru ouat și
    pentru reproducere (titularul autorizației: Adisseo France S.A.S.) și de abrogare
    a Regulamentelor de punere în aplicare (UE) 2015/661, (UE) 2015/2304 și (UE)
    2017/210'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2026/1016 zo 7. mája 2026 o obnovení
    povolenia prípravku s obsahom endo-1,4-β-xylanázy a endo-1,3(4)-β-glukanázy
    produkovaných kmeňom Talaromyces versatilis IMI 378536 a Talaromyces versatilis
    DSM 26702 ako kŕmnej doplnkovej látky pre kurčatá vo výkrme a chované na
    znášku, nosnice, morky vo výkrme a chované na reprodukciu a menej významné
    druhy hydiny vo výkrme a chované na znášku, o povolení prípravku s obsahom
    endo-1,4-β-xylanázy a endo-1,3(4)-β-glukanázy produkovaných kmeňom Talaromyces
    versatilis IMI 378536 a Talaromyces versatilis DSM 26702 ako kŕmnej doplnkovej
    látky pre kurčatá chované na reprodukciu, kurčatá na reprodukciu, morky
    na reprodukciu, menej významné druhy hydiny chované na reprodukciu a menej
    významné druhy hydiny chované na znášku a na reprodukciu (držiteľ povolenia:
    Adisseo France S.A.S.) a o zrušení vykonávacích nariadení (EÚ) 2015/661,
    (EÚ) 2015/2304 a (EÚ) 2017/210'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2026/1016 z dne 7. maja 2026 o podaljšanju
    dovoljenja za pripravek iz endo-1,4-beta-ksilanaze in endo-1,3(4)-beta-glukanaze,
    proizvedenih s Talaromyces versatilis IMI 378536 in Talaromyces versatilis DSM
    26702, kot krmni dodatek za pitovne piščance in piščance, rejene za nesnice,
    kokoši nesnice, pitovne purane in purane, rejene za razplod, ter manj pomembne
    vrste perutnine za pitanje in manj pomembne vrste perutnine, rejene za nesnice,
    o dovoljenju za pripravek iz endo-1,4-beta-ksilanaze in endo-1,3(4)-beta-glukanaze,
    proizvedenih s Talaromyces versatilis IMI 378536 in Talaromyces versatilis DSM
    26702, kot krmni dodatek za piščance, rejene za razplod, piščance za razplod,
    purane za razplod, manj pomembne vrste perutnine, rejene za razplod, ter manj
    pomembne vrste perutnine za nesnice in razplod (imetnik dovoljenja: Adisseo France
    S.A.S.) ter o razveljavitvi izvedbenih uredb (EU) 2015/661, (EU) 2015/2304 in
    (EU) 2017/210'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2026/1016 de la Comisión, de 7 de mayo
    de 2026, relativo a la renovación de la autorización de un preparado de endo-1,4-beta-xilanasa
    y endo-1,3(4)-beta-glucanasa producidas con Talaromyces versatilis IMI 378536
    y Talaromyces versatilis DSM 26702 como aditivo para piensos destinado a pollos
    de engorde y criados para puesta, gallinas ponedoras, pavos de engorde y criados
    para reproducción, y especies menores de aves de corral de engorde y criadas
    para puesta, a la autorización de un preparado de endo-1,4-beta-xilanasa y endo-1,3(4)-beta-glucanasa
    producidas con Talaromyces versatilis IMI 378536 y Talaromyces versatilis DSM
    26702 como aditivo para piensos destinado a pollos criados para reproducción,
    pollos para reproducción, pavos para reproducción, especies menores de aves
    de corral criadas para reproducción y especies menores de aves de corral para
    puesta y reproducción (titular de la autorización: Adisseo France S.A.S.), y
    por el que se derogan los Reglamentos de Ejecución (UE) 2015/661, (UE) 2015/2304
    y (UE) 2017/210'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2026/1016 av den 7 maj 2026
    om förlängning av godkännandet av ett preparat av endo-1,4-beta-xylanas och
    endo-1,3(4)-beta-glukanas framställt med Talaromyces versatilis IMI 378536 och
    Talaromyces versatilis DSM 26702 som fodertillsats för slaktkycklingar och kycklingar
    som föds upp för värpning, värphöns, slaktkalkoner och kalkoner som föds
    upp för avel samt för mindre vanligt förekommande fjäderfäarter för slakt
    och mindre vanligt förekommande fjäderfäarter som föds upp för värpning,
    om godkännande av ett preparat av endo-1,4-beta-xylanas och endo-1,3(4)-beta-glukanas
    framställt med Talaromyces versatilis IMI 378536 och Talaromyces versatilis DSM
    26702 som fodertillsats för kycklingar som föds upp för avel, kycklingar för
    avel, avelskalkoner, mindre vanligt förekommande fjäderfäarter som föds upp
    för avel och mindre vanligt förekommande fjäderfäarter för värpning eller
    avel (innehavare av godkännandet: Adisseo France S.A.S.), och om upphävande
    av genomförandeförordningarna (EU) 2015/661, (EU) 2015/2304 och (EU) 2017/210'
