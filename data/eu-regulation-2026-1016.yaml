  script: Latn
  content: 'Commission Implementing Regulation (EU) 2026/1016 of 7 May 2026 concerning
    the renewal of the authorisation of a preparation of endo-1,4-beta-xylanase and
    endo-1,3(4)-beta-glucanase produced with Talaromyces versatilis IMI 378536 and
    Talaromyces versatilis DSM 26702 as a feed additive for chickens for fattening
    and reared for laying, laying hens, turkeys for fattening and reared for breeding,
    and minor poultry species for fattening and reared for laying, the authorisation
    of a preparation of endo-1,4-beta-xylanase and endo-1,3(4)-beta-glucanase produced
    with Talaromyces versatilis IMI 378536 and Talaromyces versatilis DSM 26702 as
    a feed additive for chickens reared for breeding, chickens for breeding, turkeys
    for breeding, minor poultry species reared for breeding, and minor poultry species
    for laying and breeding (holder of authorisation: Adisseo France S.A.S.), and
    repealing Implementing Regulations (EU) 2015/661, (EU) 2015/2304 and (EU) 2017/210'
  type: main
- language: fr
