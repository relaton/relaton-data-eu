    от човека и по отношение на вписванията за
    Израел и Южна Африка в списъка на третите страни
    и територии
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 166/2014 ze dne 17. února 2014
