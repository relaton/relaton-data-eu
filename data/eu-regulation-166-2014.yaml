    osvědčení pro dovoz masa farmových ptáků nadřádu běžci k lidské spotřebě
    do Unie a o položky pro Izrael a Jihoafrickou republiku v seznamu třetích zemí
    nebo území
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 166/2014 af 17. februar
