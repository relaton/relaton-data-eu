title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 166/2014 of 17 February 2014
    amending Regulation (EC) No 798/2008 as regards certification requirements for
    imports into the Union of meat of farmed ratites for human consumption and the
    entries for Israel and South Africa in the list of third countries or territories
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 166/2014 de la Commission du 17 février
    2014 modifiant le règlement (CE) n ° 798/2008 en ce qui concerne les exigences
    de certification applicables à l’importation dans l’Union de viandes de ratites
    d’élevage destinées à la consommation humaine et les inscriptions relatives
    à Israël et à l’Afrique du Sud figurant sur la liste des pays tiers ou territoires
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 166/2014 der Kommission vom 17. Februar
    2014 zur Änderung der Verordnung (EG) Nr. 798/2008 hinsichtlich der Bescheinigungsanforderungen
    für die Einfuhr von Fleisch von Nutzlaufvögeln für den menschlichen Verzehr
    in die Union und der Einträge für Israel und Südafrika in der Liste der Drittländer
    und Drittlandsgebiete
  type: main
- language: bg
  script: Cyrl
