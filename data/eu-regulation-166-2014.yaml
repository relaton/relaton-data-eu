    szánt húsának az Unióba történő behozatala, valamint a harmadik országok
    és területek jegyzékében az Izraelre és Dél-Afrikára vonatkozó bejegyzések
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 166/2014 della Commissione, del 17 febbraio
    2014 , che modifica il regolamento (CE) n. 798/2008 per quanto riguarda le condizioni
    di certificazione per le importazioni nell’Unione di carni di ratiti d’allevamento
    destinate al consumo umano e le voci relative a Israele e al Sud Africa nell’elenco
    di paesi terzi o loro territori
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 166/2014 ( 2014. gada 17. februāris
    ), ar ko groza Regulu (EK) Nr. 798/2008 attiecībā uz sertifikācijas prasībām,
    kas piemērojamas lietošanai pārtikā paredzētas saimniecībās audzētu skrējējputnu
    gaļas importam Savienībā, un ierakstiem par Izraēlu un Dienvidāfriku trešo
    valstu vai teritoriju sarakstā
  type: main
- language: lt
  script: Latn
  content: 2014 m. vasario 17 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 166/2014,
    kuriuo dėl sertifikavimo reikalavimų, taikomų importuojant į Sąjungą ūkiuose
    auginamų žmonėms vartoti skirtų Ratitae genties paukščių mėsą, ir dėl
    Izraeliui ir Pietų Afrikai skirtų įrašų trečiųjų šalių arba teritorijų
    sąraše iš dalies keičiamas Reglamentas (EB) Nr. 798/2008
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 166/2014 tas-
    17 ta’ Frar 2014 li jemenda r-Regolament (KE) Nru 798/2008 fir-rigward tar-rekwiżiti
    ta’ ċertifikazzjoni għall-importazzjonijiet fl-Unjoni ta’ laħam ta’ għasafar
    li ma jtirux imrobbija fl-irziezet għall-konsum mill-bniedem, u l-entrati tal-Iżrael
    u tal-Afrika t’Isfel fil-lista ta’ pajjiżi terzi jew territorji
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 166/2014 van de Commissie van 17 februari
    2014 tot wijziging van Verordening (EG) nr. 798/2008 wat betreft de certificeringsvoorschriften
    voor de invoer in de Unie van vlees van gekweekte loopvogels voor menselijke consumptie
    en de gegevens voor Israël en Zuid-Afrika in de lijst van derde landen en gebieden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 166/2014 z dnia 17 lutego 2014
    r. zmieniające rozporządzenie (WE) nr 798/2008 w odniesieniu do wymogów dotyczących
    świadectw wystawianych w związku z przywozem do Unii mięsa ptaków bezgrzebieniowych
    utrzymywanych w warunkach fermowych przeznaczonego do spożycia przez ludzi oraz
    wpisów dotyczących Izraela i Republiki Południowej Afryki w wykazie państw
    trzecich lub terytoriów
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 166/2014 da Comissão, de 17 de fevereiro
    de 2014 , que altera o Regulamento (CE) n. ° 798/2008 no que se refere aos requisitos
    de certificação aplicáveis às importações para a União de carne de ratites
    de criação para consumo humano e as entradas relativas a Israel e à África
    do Sul na lista de países terceiros e territórios
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 166/2014 al Comisiei din 17
    februarie 2014 de modificare a Regulamentului (CE) nr. 798/2008 în ceea ce privește
    cerințele de certificare aplicabile importurilor în Uniune de carne de ratite
    de crescătorie destinată consumului uman și rubricile referitoare la Israel
    și la Africa de Sud din lista țărilor terțe sau a teritoriilor
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 166/2014 zo 17. februára 2014
    , ktorým sa mení nariadenie (ES) č. 798/2008, pokiaľ ide o požiadavky na
    certifikáciu týkajúce sa dovozu mäsa vtákov nadradu bežce z farmových chovov
    na ľudskú spotrebu a položky týkajúce sa Izraela a Južnej Afriky v zozname
    tretích krajín alebo území
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 166/2014 z dne 17. februarja 2014 o
    spremembi Uredbe (ES) št. 798/2008 v zvezi z zahtevami za izdajanje spričeval
    za uvoz mesa gojenih ratitov za prehrano ljudi v Unijo in vnosoma za Izrael in
    Južno Afriko na seznamu tretjih držav in ozemelj
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 166/2014 de la Comisión, de 17 de febrero
    de 2014 , por el que se modifica el Reglamento (CE) n ° 798/2008 en lo relativo
    a los requisitos de certificación aplicables a las importaciones en la Unión
    de carne de ratites de granja destinada al consumo humano y a la entrada de Israel
    y Sudáfrica en la lista de terceros países o territorios
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 166/2014 av den 17 februari
    2014 om ändring av förordning (EG) nr 798/2008 vad gäller intygskrav för import
    av kött av hägnade ratiter avsett som livsmedel till unionen och uppgifterna
    om Israel och Sydafrika i förteckningen över tredjeländer eller områden
