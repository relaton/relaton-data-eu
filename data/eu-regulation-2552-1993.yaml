    Venäjän federaatiosta ja Ukrainasta peräisin olevan keinotekoisen korundin
    tuonnissa, lukuun ottamatta niiden yritysten yhteisöön vietäväksi myytyä
    tuontia, joiden sitoumukset on hyväksytty
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2552/93 del Consiglio, del 13 settembre 1993, che
