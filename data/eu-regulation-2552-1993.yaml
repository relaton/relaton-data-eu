    δασμού αντιντάμπινγκ στις εισαγωγές τεχνητού
    κορούνδιου καταγωγής Λαϊκής Δημοκρατίας της
    Κίνας, Ρωσικής Ομοσπονδίας και Ουκρανίας, με
    εξαίρεση τις εισαγωγές που πωλούνται για εξαγωγή
    στην Κοινότητα από εταιρείες των οποίων έχουν
    γίνει αποδεκτές οι αναλήψεις υποχρεώσεων
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2552/93, annettu 13 päivänä syyskuuta 1993,
