title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2552/93 of 13 September 1993 imposing a definitive
    anti-dumping duty on imports of artificial corundum originating in the People's
    Republic of China, the Russian Federation and Ukraine, with the exception of those
    imports sold for export to the Community by companies whose undertakings have
    been accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2552/93 du Conseil, du 13 septembre 1993, instituant
    un droit antidumping définitif sur les importations de corindon artificiel originaires
    de la République populaire de Chine, de la fédération de Russie et de l'Ukraine,
    à l'exception des importations vendues à l'exportation dans la Communauté par
    les entreprises dont les engagements ont été acceptés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2552/93 des Rates vom 13. September 1993 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von künstlichem Korund
    mit Ursprung in der Volksrepublik China, der Russischen Föderation und der Ukraine
    mit Ausnahme der Ausfuhren der Unternehmen, deren Verpflichtungen angenommen wurden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2552/93 af 13. september 1993 om indførelse
    af en endelig antidumpingtold på importen af kunstig korund med oprindelse i
    Den Kinesiske Folkerepublik, Rusland og Ukraine med undtagelse af import af den
    pågældende vare, som sælges til eksport til Fællesskabet af selskaber, hvis
    tilsagn er blevet godtaget
  type: main
- language: el
  script: Grek
