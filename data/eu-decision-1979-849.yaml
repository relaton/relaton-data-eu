id: EUDecision1979849
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 September 1979 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to unglazed setts, flags and paving, hearth and wall tiles,
    falling within heading Nos ex 69.07 and ex 69.08 of the Common Customs Tariff,
    originating in Japan and in free circulation in the other Member States (Only
    the French and Dutch texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 septembre 1979, autorisant le Royaume
    de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les carreaux, pavés et dalles de pavement ou de revêtement
    des positions ex 69.07 et ex 69.08 du tarif douanier commun, originaires du Japon
    et mis en libre pratique dans les autres États membres (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. September 1979, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Japan stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Fliesen, gebrannte Pflastersteine sowie Boden- und Wandplatten der
    Tarifnummern ex 69.07 und ex 69.08 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische und niederländische Text sind verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 28. september 1979 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage uglaserede sten og fliser til brolægning, gulvbelægning eller beklædning
    af vægge, som henhører under pos. ex 69.07 og ex 69.08 i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i de øvrige medlemsstater (Kun den
    franske og nederlandske udgave er autentiske)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 settembre 1979, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le piastrelle, i blocchetti e le lastre da pavimentazione
    o da rivestimento, delle voci ex 69.07 e ex 69.08 della tariffa doganale comune,
    originari del Giappone e messi in libera pratica negli altri Stati membri (I testi
    in lingua francese e olandese sono i soli facenti fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 september 1979 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd plavuizen, vloer- en wandtegels, van de posten ex 69.07 en ex 69.08
    van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)
  type: main
