title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2016/805 of 20 May 2016 amending Annex IV to
    Regulation (EC) No 396/2005 of the European Parliament and of the Council as regards
    Streptomyces K61 (formerly S. griseoviridis), Candida oleophila strain O, FEN
    560 (also called fenugreek or fenugreek seed powder), methyl decanoate (CAS 110-42-9),
    methyl octanoate (CAS 111-11-5) and terpenoid blend QRD 460
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2016/805 de la Commission du 20 mai 2016 modifiant l'annexe
    IV du règlement (CE) n° 396/2005 du Parlement européen et du Conseil en ce
    qui concerne les substances actives Streptomyces K61 (anciennement S. griseoviridis),
    Candida oleophila souche O, FEN 560 (également dénommée fenugrec ou graines
    de fenugrec en poudre), décanoate de méthyle (CAS 110-42-9), octanoate de méthyle
    (CAS 111-11-5) et mélange de terpénoïdes QRD 460
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2016/805 der Kommission vom 20. Mai 2016 zur Änderung
    von Anhang IV der Verordnung (EG) Nr. 396/2005 des Europäischen Parlaments und
    des Rates hinsichtlich Streptomyces K61 (ehemals S. griseoviridis), Candida oleophila
    Stamm O, FEN 560 (auch bezeichnet als Bockshornklee oder Bockshornkleesamen-Pulver),
    Methyldecanoat (CAS 110-42-9), Methyloctanoat (CAS 111-11-5) und Terpen-Gemisch
    QRD 460
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2016/805 на Комисията от 20 май
    2016 година за изменение на приложение IV към
    Регламент (ЕО) № 396/2005 на Европейския парламент
    и на Съвета по отношение на Streptomyces K61 (известнo
    по-рано като S. griseoviridis), Candida oleophila щам O, FEN 560
    (наричано също така сминдух или прах от семена
    от сминдух), метил деканоат (CAS 110-42-9), метил октаноат
    (CAS 111-11-5) и смес от терпеноиди QRD 460
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2016/805 ze dne 20. května 2016, kterým se mění
    příloha IV nařízení Evropského parlamentu a Rady (ES) č. 396/2005, pokud
    jde o Streptomyces K61 (dříve S. griseoviridis), Candida oleophila kmen O, FEN
    560 (také řecké seno nebo prášek ze semen pískavice), methyl-dekanoát (CAS
    110-42-9), methyl-oktanoát (CAS 111-11-5) a terpenovou směs QRD 460
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2016/805 af 20. maj 2016 om ændring af bilag
    IV til Europa-Parlamentets og Rådets forordning (EF) nr. 396/2005 for så vidt
    angår Streptomyces K61 (tidligere S. griseoviridis), Candida oleophila stamme
    O, FEN 560 (også kaldet bukkehorn eller bukkehornsfrøpulver), methyldecanoat
    (CAS-nr. 110-42-9), methyloctanoat (CAS-nr. 111-11-5) og terpenoidblanding QRD
    460
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2016/805 της Επιτροπής, της
