    IV του κανονισμού (ΕΚ) αριθ. 396/2005 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
    τις δραστικές ουσίες Streptomyces K61 (πρώην S. griseoviridis),
    Candida oleophila στέλεχος O, FEN 560 (αποκαλείται και μοσχοσίταρο
    ή σπόροι μοσχοσίταρου σε σκόνη), δεκανοϊκό
    μεθύλιο (αριθ. CAS 110-42-9), οκτανοϊκό μεθύλιο (αριθ.
    CAS 111-11-5) και μείγμα τερπενοειδών QRD 460
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) 2016/805, 20. mai 2016, millega muudetakse Euroopa
    Parlamendi ja nõukogu määruse (EÜ) nr 396/2005 IV lisa seoses Streptomyces
    K61 (varem S. griseoviridis), Candida oleophila O-tüve, FEN 560 (lambaläätse
    seemnetest jahvatatud pulber), metüüldekanaadi (CAS 110-42-9), metüüloktanaadi
    (CAS 111-11-5) ja terpenoidide seguga QRD 460
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2016/805, annettu 20 päivänä toukokuuta 2016,
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 396/2005 liitteen IV muuttamisesta
    tehoaineiden Streptomyces K61 (aiemmin S. griseoviridis), Candida oleophilan O-kanta,
    FEN 560 (jota kutsutaan myös sarviapilaksi tai sarviapilan siemenjauheeksi),
    metyylidekanoaatti (CAS-nro 110-42-9), metyylioktanoaatti (CAS-nro 111-11-5) ja
    terpenoidiseos QRD 460 osalta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) 2016/805 оd 20. svibnja 2016. o izmjeni Priloga IV.
    Uredbi (EZ) br. 396/2005 Europskog parlamenta i Vijeća u pogledu Streptomycesa
    K61 (prije S. griseoviridis), Candide oleophile soja O, FEN-a 560 (poznat i pod
    nazivom grozdasta piskavica/grčka djetelina odnosno sjeme u prahu grozdaste piskavice/grčke
    djeteline), metil dekanoata (CAS 110-42-9), metil oktanoata (CAS 111-11-5) te
    mješavine terpenoida QRD 460
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2016/805 rendelete (2016. május 20.) a 396/2005/EK
    európai parlamenti és tanácsi rendelet IV. mellékletének a Streptomyces K61
    (korábban S. griseoviridis), a Candida oleophila O törzse, a FEN 560 (más néven
    görögszéna vagy görögszénamagpor), a metil-dekanoát (CAS-szám: 110-42-9),
    a metil-oktanoát (CAS-szám: 111-11-5) és a QRD 460 terpenoid keverék tekintetében
    történő módosításáról'
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2016/805 della Commissione, del 20 maggio 2016, che modifica
    l'allegato IV del regolamento (CE) n. 396/2005 del Parlamento europeo e del Consiglio
    per quanto riguarda le sostanze Streptomyces K61 (precedentemente S. griseoviridis),
    Candida oleophila di ceppo O, FEN 560 (denominata anche fieno greco o semi di
    fieno greco in polvere), decanoato di metile (CAS 110-42-9), ottanoato di metile
    (CAS 111-11-5) e terpenoid blend QRD 460
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2016/805 (2016. gada 20. maijs), ar ko attiecībā
    uz Streptomyces K61 (agrāk S. griseoviridis), Candida oleophila celmu O, FEN
    560 (sauktu arī par grieķu sierāboliņu vai grieķu sierāboliņa sēklu pulveri),
    metildekanoātu (CAS 110-42-9), metiloktanoātu (CAS 111-11-5) un terpenoīdu
    maisījumu QRD 460 groza Eiropas Parlamenta un Padomes Regulas (EK) Nr. 396/2005
    IV pielikumu
  type: main
- language: lt
  script: Latn
  content: 2016 m. gegužės 20 d. Komisijos reglamentas (ES) 2016/805, kuriuo dėl
    Streptomyces K61 (buv. S. griseoviridis), Candida oleophila O padermės, FEN 560
    (kitaip – vaistinės ožragės arba vaistinės ožragės sėklų miltelių),
    metildekanoato (CAS 110-42-9), metiloktanoato (CAS 111-11-5) ir terpenoidų mišinio
    QRD 460 įrašų iš dalies keičiamas Europos Parlamento ir Tarybos reglamento
    (EB) Nr. 396/2005 IV priedas
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2016/805 tal-20 ta' Mejju 2016 li jemenda
    l-Anness IV tar-Regolament (KE) Nru 396/2005 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta' Streptomyces K61 (qabel magħruf bħala S. griseoviridis), ir-razza
    O ta' Candida oleophila, FEN 560 (magħruf ukoll bħala ħelba jew għabra taż-żerriegħa
    tal-ħelba), Dekanoat tal-metil (CAS 110-42-9), Ottanoat tal-Metil (CAS 111-11-5)
    u t-taħlita tat-terpenojd QRD 460
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2016/805 van de Commissie van 20 mei 2016 tot wijziging
    van bijlage IV bij Verordening (EG) nr. 396/2005 van het Europees Parlement en
    de Raad wat betreft Streptomyces K61 (voorheen S. griseoviridis), Candida oleophila
    stam O, FEN 560 (ook fenegriek of fenegriekzaadpoeder genoemd), methyldecanoaat
    (CAS 110-42-9), methyloctanoaat (CAS 111-11-5) en terpenoïdenmengsel QRD 460
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie Komisji (UE) 2016/805 z dnia 20 maja 2016 r. zmieniające
    załącznik IV do rozporządzenia (WE) nr 396/2005 Parlamentu Europejskiego i
    Rady w odniesieniu do Streptomyces K61 (wcześniejsza nazwa: S. griseoviridis),
    Candida oleophila szczep O, FEN 560 (zwanego także kozieradką pospolitą lub
    sproszkowanymi nasionami kozieradki pospolitej), dekanianu metylu (nr CAS 110-42-9),
    oktanianu metylu (nr CAS 111-11-5) i mieszanki terpenoidów QRD 460'
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2016/805 da Comissão, de 20 de maio de 2016, que altera
    o anexo IV do Regulamento (CE) n.° 396/2005 do Parlamento Europeu e do Conselho
    no que se refere a Streptomyces K61 (anteriormente S. griseoviridis), Candida
    oleophila estirpe O, FEN 560 (também denominado feno-grego ou sementes de feno-grego
    em pó), decanoato de metilo (CAS 110-42-9), octanoato de metilo (CAS 111-11-5)
    e mistura de terpenoides QRD 460
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2016/805 al Comisiei din 20 mai 2016 de modificare a
    anexei IV la Regulamentul (CE) nr. 396/2005 al Parlamentului European și al Consiliului
    în ceea ce privește Streptomyces K61 (anterior S. griseoviridis), Candida oleophila
    tulpina O, FEN 560 (denumită, de asemenea, schinduf sau pulbere de semințe de
    schinduf), decanoatul de metil (CAS 110-42-9), octanoatul de metil (CAS 111-11-5)
    și amestecul de terpenoide QRD 460
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2016/805 z 20. mája 2016, ktorým sa mení príloha
    IV k nariadeniu Európskeho parlamentu a Rady (ES) č. 396/2005 E, pokiaľ ide
    o Streptomyces K61 (predtým S. griseoviridis), Candida oleophila, kmeň O, FEN
    560 (tiež nazývanú senovka grécka alebo prášok zo semien senovky gréckej),
    metyl-dekanoát (CAS č. 110-42-9), metyl-oktanoát (CAS č. 111-11-5) a terpenoidnú
    zmes QRD 460
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2016/805 z dne 20. maja 2016 o spremembi Priloge IV
    k Uredbi Evropskega parlamenta in Sveta (ES) št. 396/2005 glede Streptomyces
    K61 (prej S. griseoviridis), Candida oleophila, sev O, FEN 560 (ki se imenuje
    tudi sabljasti triplat ali seme sabljastega triplata v prahu), metil dekanoata
    (CAS 110-42-9), metil oktanoata (CAS 111-11-5) in mešanice terpenoidov QRD 460
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2016/805 de la Comisión, de 20 de mayo de 2016, por el
    que se modifica el anexo IV del Reglamento (CE) n.° 396/2005 del Parlamento Europeo
    y del Consejo en lo que respecta a las sustancias activas Streptomyces K61 (anteriormente
    S. griseoviridis), Candida oleophila, cepa O, FEN 560 (también denominado fenogreco
    o semillas de fenogreco en polvo), decanoato de metilo (CAS 110-42-9), octanoato
    de metilo (CAS 111-11-5) y mezcla de terpenoides QRD 460
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2016/805 av den 20 maj 2016 om ändring
    av bilaga IV till Europaparlamentets och rådets förordning (EG) nr 396/2005
    vad gäller Streptomyces K61 (tidigare S. griseoviridis), Candida oleophila stam
    O, FEN 560 (även kallat bockhornsklöver eller bockhornsklöverfrö i pulverform),
    metyldekanoat (CAS 110-42-9), metyloktanoat (CAS 111-11-5) och terpenoidblandning
    QRD 460
