title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1617/74 of the Council of 25 June 1974 on the temporary
    total suspension of the customs duties applicable in the Community as originally
    constituted on D- and DL-calcium pantothenate falling within subheading 29.38
    B II of the Common Customs Tariff and imported from the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1617/74 du Conseil, du 25 juin 1974, portant suspension
    temporaire et totale des droits de douane applicables dans la Communauté dans
    sa composition originaire au D- et DL- pantothénate de calcium, de la sous-position
    EX 29.38 B II du tarif douanier commun, importé des nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1617/74 des Rates vom 25. Juni 1974 zur zeitweiligen,
    vollständigen Aussetzung der in der Gemeinschaft in ihrer ursprünglichen Zusammensetzung
    anwendbaren Zollsätze für die Einfuhr von D- und DL-Kalziumpantothenat der Tarifstelle
    ex 29.38 B II des Gemeinsamen Zolltarifs aus den neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1617/74 af 25. juni 1974 om midlertidig og
    fuldstændig suspension af de toldsatser, der i Fællesskabet i dets oprindelige
    udstrækning anvendes på D- og DL-calciumpantothenat, henhørende under pos.
    ex 29.38 B II i den fælles toldtarif, der indføres fra de nye medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1617/74 del Consiglio, del 25 giugno 1974, che sospende
    temporaneamente e totalmente i dazi doganali applicabili nella Comunità nella
    sua composizione originaria al D- e DL-pantotenato di calcio della sottovoce ex
    29.38 B II della tariffa doganale importato nei nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1617/74 van de Raad van 25 juni 1974 houdende tijdelijke
    en algehele schorsing van de douanerechten van toepassing in de Gemeenschap in
    haar oorspronkelijke samenstelling voor D- en DL-calciumpantothenaat van onderverdeling
    ex 29.38 B II van het gemeenschappelijk douanetarief, ingevoerd uit de nieuwe
    Lid-Staten
