id: EUDecision1978531
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 2 June 1978 authorizing Ireland not to apply Community
    treatment to outer garments and clothing accessories, other than blouses and shirt
    blouses, knitted or crocheted (not elastic or rubberized), or woven, for women,
    girls and infants, of wool, of cotton or of man-made textile fibres, falling within
    subheadings ex 60.05 A II or ex 61.02 B of the Common Customs Tariff (NIMEXE codes
    60.05-22, 23, 24, 25 - 61.02-78, 82, 84) originating in India and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/531/CEE: Décision de la Commission, du 2 juin 1978, autorisant l''Irlande
    à exclure du traitement communautaire les vêtements de dessus et accessoires
    du vêtement, autres, et les chemisiers, blouses-chemisiers et blouses de bonneterie
    (non élastique ni caoutchoutée) ou tissés, pour femmes, fillettes et jeunes
    enfants, de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    des sous-positions Ex 60.05 A II et Ex 61.02 B du Tarif douanier commun (codes
    Nimexe : 60.05- 22, 23, 24, 25; 61.02-78, 82, 84), originaires de l''Inde et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 2. Juni 1978, mit der Irland ermächtigt
    wird, aus Indien stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Oberkleidung und Bekleidungszubehör, andere; Blusen und Hemdblusen
    aus Gewirken (weder gummielastisch noch kautschutiert) oder Geweben für Frauen,
    Mädchen und Kleinkinder, aus Wolle, Baumwolle, synthetischen oder künstlichen
    Spinnstoffen, der Tarifnummern ex 60.05 A II und ex 61.02 B des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 60.05-22; 23; 24; 25 - 61.02-78; 82; 84) von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 2. juni 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage yderbeklædningsgenstande og tilbehør til
    beklædningsgenstande, andre tilfælde, skjorter, skjortebluser og bluser, af
    trikotage (ikke elastisk eller gummeret) eller vævede, til kvinder, piger og
    småbørn, af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 60.05 A II og ex 61.02 B (NIMEXE-kode 60.05-22, 23, 24, 25; 61.02-78,
    82, 84) i den fælles toldtarif, har oprindelse i Indien og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 giugno 1978, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario indumenti esterni ed accessori di abbigliamento,
    altri, e camicie, camicette e bluse (a maglia non elastica, né gommata) o tessuti
    per donna, per ragazza e per bambini, di lana, di cotone o di fibre tessili sintetiche
    o artificiali delle voci ex 60.05 A II e ex 61.02 B della tariffa doganale comune
    (codice Nimexe 60.05-22, 23, 24, 25; 61.02-78, 82, 84), originari dell'India e
    messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 juni 1978 waarbij Ierland wordt gemachtigd
    bovenkleding, kledingtoebehoren andere dan blouses, overhemdblouses van breiof
    haakwerk (niet-elastisch, niet-gegummeerd) of geweven, voor dames, meisjes en
    kinderen, van wol, van katoen, of van synthetische of van kunstmatige textielvezels,
    van de posten ex 60.05 A II en ex 61.02 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 60.05-22, 23, 24, 25; 61.02-78, 82, 84), van oorsprong uit India
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
