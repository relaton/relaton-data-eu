title:
- language: en
  script: Latn
  content: Council Decision (EU) 2026/1070 of 5 May 2026 on the position to be taken
    on behalf of the European Union within the CETA Joint Committee established under
    the Comprehensive Economic and Trade Agreement (CETA) between Canada, of the one
    part, and the European Union and its Member States, of the other part, as regards
    the inclusion of active pharmaceutical ingredients as medicinal products or drugs
    listed in paragraph 2 of Annex 1 to the Protocol on the mutual recognition of
    the compliance and enforcement programme regarding good manufacturing practices
    for pharmaceutical products
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/1070 du Conseil du 5 mai 2026 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité mixte de l’AECG
    institué au titre de l’accord économique et commercial global (AECG) entre
    le Canada, d’une part, et l’Union européenne et ses États membres, d’autre
    part, en ce qui concerne l’inclusion de principes pharmaceutiques actifs en
    tant que médicaments et drogues énumérés au paragraphe 2 de l’annexe 1 du
    protocole sur la reconnaissance mutuelle du programme de conformité et d’application
    relatif aux bonnes pratiques de fabrication pour les produits pharmaceutiques
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/1070 des Rates vom 5. Mai 2026 über den Standpunkt,
    der im Namen der Europäischen Union in dem mit dem umfassenden Wirtschafts- und
    Handelsabkommen (CETA) zwischen Kanada einerseits und der Europäischen Union
    und ihren Mitgliedstaaten andererseits eingesetzten Gemischten CETA-Ausschuss
    zur Aufnahme pharmazeutischer Wirkstoffe als Arzneimittel in Anhang 1 Nummer 2
    des Protokolls über die gegenseitige Anerkennung des Programms für die Einhaltung
    und Durchsetzung der Guten Herstellungspraxis für pharmazeutische Erzeugnisse
    zu vertreten ist
  type: main
