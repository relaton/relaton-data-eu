    kas nav Eiropas Kopienas dalībvalstis, un Regulu (EK) Nr. 2026/97 par aizsardzību
    pret subsidētu importu no valstīm, kas nav Eiropas Kopienas dalībvalstis
  type: main
- language: lt
  script: Latn
