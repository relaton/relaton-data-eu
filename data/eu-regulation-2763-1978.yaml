  content: Council Regulation (EEC) No 2763/78 of 23 November 1978 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and the Kingdom of Morocco fixing the additional amount to be deducted
    from the levy on imports into the Community of untreated olive oil, originating
    in Morocco, for the period 1 November 1978 to 31 October 1979
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2763/78 du Conseil, du 23 novembre 1978, concernant
    la conclusion de l'accord sous forme d'échange de lettres entre la Communauté
    économique européenne et le Royaume du Maroc fixant, pour la période du 1er
    novembre 1978 au 31 octobre 1979, le montant additionnel à déduire du prélèvement
    applicable à l'importation dans la Communauté d'huile d'olive non traitée originaire
    du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2763/78 des Rates vom 23. November 1978 über den
    Abschluß des Abkommens in Form eines Briefwechsels zwischen der Europáischen
    Wirtschaftsgemeinschaft und dem Kónigreich Marokko zur Festsetzung des vom 1.
    November 1978 bis 31. Oktober 1979 geltenden Zusatzbetrags, der bei der Einfuhr
    in die Gemeinschaft von nicht behandeltem Olivenól mit Ursprung in Marokko von
    der Abschópfung abzuziehen ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2763/78 af 23. november 1978 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og kongeriget Marokko vedrørende fastsættelse for perioden 1. november 1978
    - 31. oktober 1979 af det tillægsbeløb, som skal fratrækkes den afgift, der
    anvendes ved indførsel til Fællesskabet af ikke-behandlet olivenolie med oprindelse
    i Marokko
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2763/78 del Consiglio, del 23 novembre 1978, relativo
    alla conclusione, dell' accordo sotto forma di scambio di lettere tra la Comunità
    economica europea e il Regno del Marocco, che fissa, per il periodo 1° novembre
    1978 - 31 ottobre 1979, l' importo aggiuntivo da detrarre al prelievo applicabile
    all' importazione nella Comunità di olio d' oliva non trattato originario del
    Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2763/78 van de Raad van 23 november 1978 houdende
    sluiting van een Overeenkomst in de vorm van een briefwisseling tussen de Europese
    Economische Gemeenschap en het Koninkrijk Marokko tot vaststelling, voor het tijdvak
    van 1 november 1978 tot en met 31 oktober 1979, van het aanvullend bedrag dat
    in mindering moet worden gebracht op de heffing die bij invoer in de Gemeenschap
    van toepassing is op niet-behandelde olijfolie van oorsprong uit Marokko
