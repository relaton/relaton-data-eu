  script: Latn
  content: Regolamento delegato (UE) 2022/2060 della Commissione del 14 giugno 2022
    che integra il regolamento (UE) n. 575/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano i criteri
    per valutare la modellizzabilità dei fattori di rischio nell’ambito del metodo
    dei modelli interni nonché la frequenza di tale valutazione a norma dell’articolo
    325 octoquinquagies, paragrafo 3, di tale regolamento
  type: main
- language: lv
  script: Latn
