title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2060 of 14 June 2022 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the criteria for assessing
    the modellability of risk factors under the internal model approach (IMA) and
    specifying the frequency of that assessment under Article 325be(3) of that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2060 de la Commission du 14 juin 2022 complétant
    le règlement (UE) no 575/2013 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les critères d’évaluation du caractère
    modélisable des facteurs de risque dans le cadre de l’approche fondée sur
    les modèles internes (IMA) ainsi que la fréquence de cette évaluation en application
    de l’article 325 octoquinquagies, paragraphe 3, dudit règlement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/2060 der Kommission vom 14. Juni 2022 zur
    Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung der Kriterien für
    die Bewertung der Modellierbarkeit von Risikofaktoren im Rahmen des auf einem
    internen Modell basierenden Ansatzes (IMA) und zur Festlegung der Häufigkeit
    dieser Bewertung gemäß Artikel 325be Absatz 3 der Verordnung
  type: main
- language: bg
  script: Cyrl
