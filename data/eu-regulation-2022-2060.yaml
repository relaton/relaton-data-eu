  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2060 de la Comisión de 14 de junio de 2022
    por el que se completa el Reglamento (UE) n.o 575/2013 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    los criterios para evaluar la modelizabilidad de los factores de riesgo en el
    marco del método de modelos internos (MMI) así como la frecuencia de dicha evaluación
    con arreglo al artículo 325 ter sexies, apartado 3, de dicho Reglamento
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/2060 av den 14 juni 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 575/2013
