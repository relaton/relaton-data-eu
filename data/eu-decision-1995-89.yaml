title:
- language: en
  script: Latn
  content: Commission Decision of 17 March 1995 amending Decision 94/621/EC on protective
    measures with regard to certain live animals and animal products originating in
    or coming from Albania
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 17 mars 1995 modifiant la décision 94/621/CE
    relative à des mesures de protection à l'égard de certains animaux vivants
    et produits animaux originaires ou en provenance d'Albanie
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. März 1995 zur Änderung der Entscheidung
    94/621/EG über Schutzmaßnahmen im Zusammenhang mit bestimmten lebenden Tieren
    und tierischen Erzeugnissen mit Ursprung in oder Herkunft aus Albanien
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 17. března 1995, kterým se mění rozhodnutí
    94/621/ES o ochranných opatřeních, pokud jde o některá živá zvířata a
    živočišné produkty pocházející nebo dovážené z Albánie
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 17. marts 1995 om ændring af beslutning 94/621/EF
    om beskyttelsesforanstaltninger over for bestemte levende dyr og animalske produkter,
    der har oprindelse i eller kommer fra Albanien
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 17ης Μαρτίου 1995
    που τροποποιεί για τρίτη φορά την απόφαση 94/621/ΕΚ
    όσον αφορά τα μέτρα προστασίας σχετικά με ορισμένα
    ζώντα προϊόντα καταγωγής ή προελεύσεως Αλβανίας
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 17. märts 1995, millega muudetakse otsust teatavate kaitsemeetmete
    kohta seoses Albaaniast pärit või sealt toodavate elusloomade ja loomsete saadustega
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 17 päivänä maaliskuuta 1995, tiettyihin Albaniasta
    peräisin tai lähtöisin oleviin eläviin eläimiin ja eläinperäisiin tuotteisiin
    liittyviä suojatoimenpiteitä koskevan päätöksen 94/621/EY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 95/89/EK határozata (1995. március 17.) a 94/621/EK határozatnak
    az Albániából származó vagy onnan érkező egyes élő állatokkal és állati
    termékekkel kapcsolatos védekezési intézkedések tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione del 17 marzo 1995 che modifica la decisione
    94/621/CE recante misure di protezione per quanto riguarda certi animali vivi
    e prodotti animali originari o provenienti dall'Albania
  type: main
- language: lv
  script: Latn
  content: Komisijas lēmums (1995. gada 17. marts), ar kuru groza Lēmumu 94/621/EK
    par aizsardzības pasākumiem attiecībā uz dažiem dzīviem dzīvniekiem un
    dzīvnieku produktiem, kam izcelsme ir Albānijā vai ko no tās ieved
  type: main
- language: lt
  script: Latn
  content: Komisijos Sprendimas 1995 m. kovo 17 d. dėl apsaugos priemonių, taikomų
    Albanijos kilmės ar iš jos atvežamiems gyviems gyvūnams ir gyvūninės kilmės
    produktams
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-17 ta’ Marzu 1995 li temenda d-Deċiżjoni
    94/621/KE fuq miżuri prottettivi fir-rigward ta’ ċerti annimali ħajjin u
    prodotti tal-annimali li joriġinaw fi jew jiġu mill-Albanija (Test b’relevanza
    ŻEE)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 maart 1995 tot wijziging van Beschikking
    94/621/EG tot vaststelling van beschermende maatregelen ten aanzien van bepaalde
    levende dieren en dierlijke produkten van oorsprong of van herkomst uit Albanië
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 17 marca 1995 r. zmieniająca decyzję 94/621/WE
    w sprawie środków ochronnych w odniesieniu do niektórych zwierząt żywych
    oraz produktów zwierzęcych pochodzących z Albanii lub dostarczanych z Albanii
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 17 de Março de 1995 que altera a Decisão 94/621/CE
    relativa a medidas de protecção respeitantes a determinados animais vivos e
    produtos de animais originários ou provenientes da Albânia
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 17. marca 1995, ktorým sa mení a dopĺňa rozhodnutie
    94/621/ES o ochranných opatreniach v súvislosti s určitými živými zvieratami
    a živočíšnymi výrobkami s pôvodom v Albánsku alebo pochádzajúcich z Albánska
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 17. marca 1995 o spremembi Odločbe 94/621/ES glede
    zaščitnih ukrepov v zvezi z nekaterimi živimi živalmi in živalskimi proizvodi
    s poreklom iz ali ki prihajajo iz Albanije (Besedilo velja za EGS)
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión de 17 de marzo de 1995 por la que se modifica
    la Decisión 94/621/CE sobre medidas de protección con respecto a determinados
    animales vivos y productos animales originarios o procedentes de Albania
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut av den 17 mars 1995 om ändring av beslut 94/621/EG
    om skyddsåtgärder beträffande vissa levande djur och djurprodukter som har
