id: EUDecision1978199
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 19 January 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to industrial and occupational clothing of mixed synthetic
    textile fibres and of cotton for men and women, falling within heading Nos ex
    61.01 and ex 61.02 of the Common Customs Tariff, originating in Hong Kong and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/199/CEE: Décision de la Commission, du 19 janvier 1978, autorisant
    le Royaume de Belgique, Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les vêtements de travail tissés de fibres
    textiles synthétiques mélangées et de coton pour hommes et pour femmes des
    positions Ex 61.01 et Ex 61.02 du Tarif douanier commun, originaires de Hong-Kong
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. Januar 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, bestimmte aus Hongkong stammende und in den anderen Mitgliedstaaten im
    freien Verkehr befindliche Arbeits- und Berufskleidung aus gemischten synthetischen
    Spinnstoffen und aus Baumwolle für Männer und Frauen, der Tarifstellen ex 61.01
    und ex 61.02 des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 19. februar 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage arbejds- og beskyttelsesbeklædning af blandede syntetiske fibre og
    af bomuld til mænd og kvinder, som henhører under pos. ex 61.01 og ex 61.02
    i den fælles toldtarif, har oprindelse i Hongkong og frit kan omsættes i de
    andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 gennaio 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario gli indumenti da lavoro di fibre tessili sintetiche
    miste e di cotone per uomo e per donna, delle voci ex 61.01 e ex 61.02 della tariffa
    doganale comune, originari di Hong Kong e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 januari 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd werk- en bedrijfskleding voor heren en dames van gemengde synthetische
    textielvezels, geweven en van katoen van post ex 61.01 en ex 61.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
