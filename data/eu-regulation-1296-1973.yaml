title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1296/73 of the Commission of 15 May 1973 re-establishing
    Common Customs Tariff duties on other kinds of leather falling within subheading
    No 41.05 B II, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1296/73 de la Commission, du 15 mai 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux peaux préparées d' autres animaux, de la sous-position tarifaire 41.05 B
    II, originaires de Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1296/73 der Kommission vom 15. Mai 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Leder aus Häuten oder Fellen von
    anderen Tieren, der Tarifstelle 41.05 B II, mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1296/73 af 15. maj 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for læder af andre dyrehuder og dyreskind
    under underposition 41.05 B II, som har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2762/72 af
    19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1296/73 della Commissione, del 15 maggio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    pelli preparate di altri animali della sottovoce doganale n. 41.05 B II, originarie
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1296/73 van de Commissie van 15 mei 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op leder en voorgelooide huiden en vellen, van andere dieren, van
    onderverdeling 41.05 B II, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties
    werden geopend
  type: main
