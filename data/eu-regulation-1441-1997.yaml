    της 23ης Ιουλίου 1997 για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιούλιο 1997 για τις συμπληρωματικές δασμολογικές
