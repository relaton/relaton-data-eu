title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 15/78 of 4 January 1978 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Algeria, Morocco and Tunisia is to be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 15/78 de la Commission, du 4 janvier 1978, fixant le
    montant dont doit être diminué l'élément mobile du prélèvement applicable
    aux sons et remoulages originaires d'Algérie, du Maroc et de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 15/78 der Kommission vom 4. Januar 1978 zur Festsetzung
    des Betrages, um den der bewegliche Teilbetrag der Abschöpfung auf Kleie mit
    Ursprung in Algerien, Marokko und Tunesien vermindert wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 15/78 af 4. januar 1978 om fastsættelse
    af det beløb, hvormed det variable element i importafgiften for klid med oprindelse
    i Algeriet, Marokko og Tunesien skal nedsættes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 15/78 della Commissione, del 4 gennaio 1978, che fissa
    l'importo di cui deve essere diminuito l'elemento mobile del prelievo applicabile
    alle crusche e stacciature originarie dell'Algeria, del Marocco e della Tunisia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 15/78 van de Commissie van 4 januari 1978 tot vaststelling
    van het bedrag waarmee het variabele element van de heffing die van toepassing
    is op zemelen en slijpsel van oorsprong uit Algerije, Marokko en Tunesië moeten
    worden verminderd
