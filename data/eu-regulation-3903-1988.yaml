title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3903/88 of 9 December 1988 laying down for
    1989 certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of certain non- member countries in the
    200 nautical mile zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3903/88 du Conseil du 9 décembre 1988 fixant, pour
    1989, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon de certains pays tiers dans la zone de
    200 milles située au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3903/88 DES RATES vom 9. Dezember 1988 ueber Massnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestaende in der 200-Meilen-Zone vor
    der Kueste des franzoesischen Departements Guyana gegenueber Schiffen unter der
    Flagge bestimmter Drittlaender (1989)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3903/88 af 9. december 1988 om fastsættelse
    af en række foranstaltninger for 1989 til bevarelse og forvaltning af fiskeressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3903/88 του Συμβουλίου
    της 9ης Δεκεμβρίου 1988 για τον καθορισμό, για
    το 1989, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων τα οποία εφαρμόζονται
    στα σκάφη με σημαία ορισμένων τρίτων χωρών
    εντός της ζώνης 20 μιλίων η οποία ευρίσκεται
    στα ανοικτά των ακτών του γαλλικού διαμερίσματος
    της Γουιάνας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3903/88 DEL CONSIGLIO del 9 dicembre 1988 che stabilisce,
    per il 1989, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3903/88 VAN DE RAAD van 9 december 1988 houdende
    maatregelen voor 1989 voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    in de 200-mijlszone voor de kust van het Franse departement Guyana van toepassing
    zijn
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3903/88 DO CONSELHO de 9 de Dezembro de 1988 que fixa,
    para 1989, certas medidas de conservaçao e de gestao dos recursos da pesca aplicaveis
    aos navios que arvoram pavilhao de certos paises terceiros na zona de 200 milhas
    situada ao largo do departamento francês da Guiana
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3903/88 DEL CONSEJO de 9 de diciembre de 1988 por el
    que se establecen, para 1989, determinadas medidas de conservacion y gestion de
    los recursos pesqueros aplicables a los buques que enarbolen pabellon de determinados
    terceros paises en la zona de 200 millas situada frente a las costas del departamento
    francés de Guyana
  type: main
