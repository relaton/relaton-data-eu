title:
- language: en
  script: Latn
  content: Council Decision No 448/2011/EU of 19 July 2011 amending Decision 2004/162/EC
    as regards the products that may benefit from exemption from or a reduction in
    dock dues
  type: main
- language: fr
  script: Latn
  content: Décision n ° 448/2011/UE du Conseil du 19 juillet 2011 modifiant la décision
    2004/162/CE en ce qui concerne les produits pouvant bénéficier d’une exonération
    ou d’une réduction de l’octroi de mer
  type: main
- language: de
  script: Latn
  content: Beschluss Nr. 448/2011/EU des Rates vom 19. Juli 2011 zur Änderung der
    Entscheidung 2004/162/EG betreffend Erzeugnisse, die ganz oder teilweise von der
    Sondersteuer „octroi de mer“ befreit werden können
  type: main
- language: bg
  script: Cyrl
  content: Решение № 448/2011/ЕС на Съвета от 19 юли 2011
    година за изменение на Решение 2004/162/ЕО във
    връзка с продуктите, за които е допустимо пълно
    или частично освобождаване по режима на „octroi
    de mer“
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady č. 448/2011/EU ze dne 19. července 2011 , kterým se
    mění rozhodnutí 2004/162/ES, co se týče produktů, jež mohou být osvobozeny
    od tzv. „octroi de mer“ (námořní daně) nebo jimž může být tato daň
    snížena
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse nr. 448/2011/EU af 19. juli 2011 om ændring af beslutning
    2004/162/EF for så vidt angår de varer, for hvilke der kan indrømmes fritagelse
    for eller nedsættelse af særtolden »octroi de mer«
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 448/2011/ΕΕ του Συμβουλίου, της
    19ης Ιουλίου 2011 , για την τροποποίηση της απόφασης
    2004/162/ΕΚ όσον αφορά τα προϊόντα τα οποία δύνανται
    να τύχουν απαλλαγής από την εισφορά θαλάσσης
    ή μείωσης της εισφοράς θαλάσσης
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus nr 448/2011/EL, 19. juuli 2011 , millega muudetakse otsust
    2004/162/EÜ seoses toodetega, mille suhtes võib kohaldada dokimaksuvabastust
    või -vähendust
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös N:o 448/2011/EU, annettu 19 päivänä heinäkuuta
    2011 , päätöksen 2004/162/EY muuttamisesta niiden tuotteiden osalta, joihin
    voidaan soveltaa vapautusta meriverosta tai meriveron alennusta
  type: main
- language: hu
  script: Latn
  content: A Tanács 448/2011/EU határozata ( 2011. július 19. ) a 2004/162/EK határozatnak
    az „octroi de mer” elnevezésű adó vonatkozásában adómentességre vagy
    adókedvezményre jogosult termékek tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione n. 448/2011/UE del Consiglio, del 19 luglio 2011 , recante modifica
    della decisione 2004/162/CE per quanto riguarda i prodotti che possono beneficiare
    di un’esenzione totale o parziale dai «dazi di mare»
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums Nr. 448/2011/ES ( 2011. gada 19. jūlijs ), ar ko groza
    Lēmumu 2004/162/EK attiecībā uz precēm, kurām var piemērot atbrīvojumus
    no ostu nodevām vai to samazinājumus
  type: main
- language: lt
  script: Latn
  content: 2011 m. liepos 19 d. Tarybos sprendimas Nr. 448/2011/ES, kuriuo dėl produktų,
    kuriems galima taikyti mažesnį naudojimosi doku mokestį arba kuriuos galima
    nuo jo atleisti, iš dalies keičiamas Sprendimas 2004/162/EB
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill Nru 448/2011/UE tad- 19 ta’ Lulju 2011 li temenda
    d-Deċiżjoni 2004/162/KE fir-rigward tal-prodotti li jistgħu jibbenefikaw minn
    eżenzjoni jew tnaqqis relattivament għad-dazji tal-baħar
  type: main
- language: nl
  script: Latn
  content: Besluit nr. 448/2011/EU van de Raad van 19 juli 2011 tot wijziging van
    Beschikking 2004/162/EG wat betreft de producten die een vrijstelling of een vermindering
    van de „octroi de mer” kunnen genieten
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady nr 448/2011/UE z dnia 19 lipca 2011 r. zmieniająca decyzję
    2004/162/WE w odniesieniu do produktów uprawnionych do korzystania ze zwolnienia
    lub obniżki podatku od dokowania
  type: main
- language: pt
  script: Latn
  content: Decisão n. ° 448/2011/UE do Conselho, de 19 de Julho de 2011 , que altera
    a Decisão 2004/162/CE no que diz respeito aos produtos que podem beneficiar de
    uma isenção ou de uma redução do «octroi de mer»
  type: main
- language: ro
  script: Latn
  content: Decizia nr. 448/2011/UE a Consiliului din 19 iulie 2011 de modificare a
    Deciziei 2004/162/CE privind produsele care pot beneficia de o scutire sau de
    o reducere a taxelor de andocare
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady č. 448/2011/EÚ z 19. júla 2011 , ktorým sa mení a
    dopĺňa rozhodnutie 2004/162/ES o výrobkoch, na ktoré sa môže vzťahovať
    oslobodenie od dane nazývanej „octroi de mer“ (námorná daň) alebo jej
    zníženie
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta št. 448/2011/EU z dne 19. julija 2011 o spremembah Sklepa
    2004/162/ES glede izdelkov upravičenih do oprostitve ali znižanja pristaniških
    pristojbin
  type: main
- language: es
  script: Latn
  content: Decisión n ° 448/2011/UE del Consejo, de 19 de julio de 2011 , por la
    que se modifica la Decisión 2004/162/CE en lo relativo a los productos que pueden
    ser objeto de una exención o una reducción del arbitrio insular
  type: main
- language: sv
  script: Latn
  content: Rådets beslut nr 448/2011/EU av den 19 juli 2011 om ändring av beslut
    2004/162/EG vad gäller vilka produkter som kan komma att omfattas av befrielse
    från eller nedsättning av sjötull
