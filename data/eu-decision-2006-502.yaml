title:
- language: en
  script: Latn
  content: '2006/502/EC: Commission Decision of 11 May 2006 requiring Member States
    to take measures to ensure that only lighters which are child-resistant are placed
    on the market and to prohibit the placing on the market of novelty lighters (notified
    under documents number C(2006) 1887 and number C(2006) 1887 COR) (This text annuls
    and replaces the text published in Official Journal L 197 of 19 July 2006, p.
    9 )'
  type: main
- language: fr
  script: Latn
  content: '2006/502/CE: Décision de la Commission du 11 mai 2006 exigeant des États
    membres qu''ils prennent des mesures destinées à faire en sorte que seuls les
    briquets présentant des caractéristiques de sécurité enfants soient mis sur
    le marché et à interdire la mise sur le marché de briquets fantaisie [notifiée
    sous les numéros C(2006) 1887 et C(2006) 1887 COR] (Ce texte annule et remplace
    le texte publié au Journal officiel L 197 du 19 juillet 2006, p. 9 )'
  type: main
- language: de
  script: Latn
  content: '2006/502/EG: Entscheidung der Kommission vom 11. Mai 2006 zur Verpflichtung
    der Mitgliedstaaten, Maßnahmen zu treffen, damit nur kindergesicherte Feuerzeuge
    in Verkehr gebracht werden und das Inverkehrbringen von Feuerzeugen mit Unterhaltungseffekten
    untersagt wird (Bekannt gegeben unter den Aktenzeichen K(2006) 1887 und K(2006)
    1887 COR) (Dieser Text annulliert und ersetzt den im Amtsblatt L 197 vom 19. Juli
    2006, S. 9 , veröffentlichten Text)'
  type: main
- language: bg
