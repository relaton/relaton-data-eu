  content: Council Regulation (EEC) No 2301/78 of 29 September 1978 establishing the
    number of licences that may be issued to vessels flying the flag of Norway for
    fishing within the 200 mile fishing zones of the Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2301/78 du Conseil, du 29 septembre 1978, fixant le
    nombre de licences pouvant être délivrées aux navires battant pavillon de la
    Norvège pour l'exercice d'une activité de pêche dans les zones de pêche de
    200 milles des États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2301/78 des Rates vom 29. September 1978 zur Festlegung
