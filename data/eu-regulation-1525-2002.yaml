  content: Commission Regulation (EC) No 1525/2002 of 26 August 2002 amending Regulation
    (EC) No 1899/97 laying down rules for the application in the poultrymeat and egg
    sectors of the arrangements under the Europe Agreements with central and east
    European countries provided for by Council Regulations (EC) No 1727/2000, (EC)
    No 2290/2000, (EC) No 2433/2000, (EC) No 2434/2000, (EC) No 2435/2000 and (EC)
    No 2851/2000 and repealing Regulations (EEC) No 2699/93 and (EC) No 1559/94
  type: main
