    les secteurs de la viande de volaille et des œufs du régime prévu dans le cadre
    des accords européens avec les pays de l'Europe centrale et orientale par les
    règlements (CE) n° 1727/2000, (CE) n° 2290/2000, (CE) n° 2433/2000, (CE) n°
    2434/2000, (CE) n° 2435/2000 et (CE) n° 2851/2000 du Conseil et abrogeant les
