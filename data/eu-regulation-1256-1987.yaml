title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1256/87 of 6 may 1987 re- establishing the
    levying of the customs duties applicable to other receivers, whether or not combined
    with a sound recorder or reproducer and other parts falling under subheadings
    85.15 a III ex b) and C II c) of the Common Customs Tariff, originating in Malaysia,
    benefiting from the tariff preferences provided for by Council Regulation (EEC)
    No 3924/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1256/87 de la Commission du 6 mai 1987 portant rétablissement
    de la perception des droits de douane applicables aux autres appareils récepteurs,
    même combinés avec un appareil d'enregistrement ou de reproduction du son et
    autres parties et pièces détachées, des sous-positions 85.15 A III ex b) et
    C II c) du tarif douanier commun, originaires de Malaysia, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1256/87 DER KOMMISSION vom 6. Mai 1987 zur Wiedereinführung
    der Erhebung der Zölle für andere Empfangsgeräte, auch mit Tonaufnahme- oder
    Tonwiedergabegeräten kombiniert, andere Teile, der Tarifstellen 85.15 A III ex
    b) und C II c) des Gemeinsamen Zolltarifs, mit Ursprung in Malaysia, dem die in
    der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt
    werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1256/87 af 6. maj 1987 om genindførelse
    af opkrævning af told for andre modtagere, også kombineret med lydoptagere eller
    lydgengivere, andre dele, henhørende under pos. 85.15 A III ex b) og C II c)
    i den fælles toldtarif og med oprindelse i Malaysia, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1256/87 της Επιτροπής
    της 6ης Μαΐου 1987 περί αποκαταστάσεως της εφαρμογής
    των δασμών για άλλες συσκευές λήψης έστω και
    συνδυασμένες με συσκευή εγγραφής ή αναπαραγωγής
