  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1256/87 DELLA COMMISSIONE del 6 maggio 1987 che ripristina
    la riscossione dei dazi doganali applicabili agli altri apparecchi riceventi,
    anche combinati con un apparecchio di registrazione o di riproduzione del suono
    e altri parti e pezzi staccati, delle sottovoci 85.15 A III ex b) e C II c) della
    tariffa doganale comune, originari della Malaysia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3924/86 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1256/87 VAN DE COMMISSIE van 6 mei 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere ontvangtoestellen,
    ook indien met ingebouwd toestel voor het opnemen of voor het weergeven van geluid,
    andere delen en onderdelen, van postonderverdelingen 85.15 A III ex b) en C II
    c) van het gemeenschappelijk douanetarief van oorsprong uit Maleisië, waarvoor
    de in Verordening (EEG) nr. 3924/86 van de Raad vermelde tariefpreferenties zijn
    verleend #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1256/87 da Comissão de 6 de Maio de 1987 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis a outros aparelhos receptores,
    mesmo combinados com um aparelho de registo ou de reprodução de som e outras
    partes e peças separadas das subposições 85.15 A III ex b), C II c) da pauta
