title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2290/82 of 19 August 1982 laying down detailed
    rules for the application of the additional measures applicable to holders of
    long-term storage contracts for table wine for the 1981/82 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2290/82 de la Commission, du 19 août 1982, établissant
    les modalités d' application des mesures complémentaires réservées aux détenteurs
    de contrats de stockage à long terme des vins de table pour la campagne 1981/1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2290/82 der Kommission vom 19. August 1982 zur Festlegung
    der Durchführungsbestimmungen für die Inhabern langfristiger Lagerverträge
    für Tafelweine vorbehaltenen ergänzenden Maßnahmen für das Wirtschaftsjahr
    1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2290/82 af 19. august 1982 om gennemførelsesbestemmelser
    for de supplerende foranstaltninger, der er forbeholdt indehavere af langfristede
    oplagringskontrakter for bordvin for produktionsåret 1981/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2290/82 τής Επιτροπής
    τής 19ης Αυγούστου 1982 περί καθορισμού τών λεπτομερειών
    εφαρμογής τών συμπληρωματικών μέτρων τά οποία
    επιφυλάσσονται στούς έχοντες υπογράψει συμβάσεις
    μακροπρόθεσμης αποθεματοποιήσεως επιτραπέζιων
    οίνων γιά τήν περίοδο εμπορίας 1981/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2290/82 della Commissione, del 19 agosto 1982, che
    stabilisce le modalità di applicazione delle misure complementari riservate ai
    titolari di contratti di magazzinaggio a lungo termine dei vini da tavola per
    la campagna 1981/1982e
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2290/82 van de Commissie van 19 augustus 1982 tot
    vaststelling van de bepalingen ter uitvoering van de aanvullende maatregelen ten
    behoeve van degenen die voor het wijnoogstjaar 1981/1982 langlopende opslagcontracten
    voor tafelwijn hebben gesloten
  type: main
