  content: COMMISSION REGULATION (EEC) No 1907/93 of 14 July 1993 re-establishing
    the levying of customs duties on products falling within CN code 2817 00 00, originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1907/93 de la Commission du 14 juillet 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2817 00 00, originaires de Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
