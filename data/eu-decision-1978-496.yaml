id: EUDecision1978496
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 May 1978 authorizing the French Republic not
    to apply Community treatment to women's, girls' and infants' (other than babies')
    dresses, of woven fabric or knitted or crocheted, falling within subheading ex
    60.05 A II or heading No ex 61.02 of the Common Customs Tariff (NIMEXE codes 60.05-41,
    42, 43, 44; 61.02-48, 52, 53, 54), originating in Taiwan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/496/CEE: Décision de la Commission, du 24 mai 1978, autorisant la
    République française à exclure du traitement communautaire les robes tissées
    et robes de bonneterie pour femmes, fillettes et jeunes enfants, autres que bébés,
    de la sous-position Ex 60.05 A II et de la position Ex 61.02 du Tarif douanier
    commun (code Nimexe 60.05-41, 42, 43, 44, 48, 52, 53, 54, - 61.02-48, 52, 53,
    54), originaires de Taiwan et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. Mai 1978, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Kleider aus Geweben und Kleider aus Gewirken für
    Frauen, Mädchen und Kleinkinder (ausgenommen Säuglinge), der Tarifnummern ex
    60.05 A II und ex 61.02 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-41,
    42, 43, 44; 61.02-48, 52, 53, 54) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 24. maj 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage kjoler, vævede eller af trikotage,
    til kvinder, piger og småbørn (bortset fra spædbørn), som henhører under
    pos. ex 60.05 A II og ex 61.02 (NIMEXE-kode 60.05-41, 42, 43, 44; 61.02-48, 52,
    53, 54) i den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 maggio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli abiti interi tessuti ed
    abiti interi a maglia per donna, per ragazza e per bambini, diversi dai bambini
    piccoli, della sottovoce ex 60.05 A II e della voce ex 61.02 della tariffa doganale
    comune (codice Nimexe 60.05-41, 42, 43, 44, 48, 52, 54 - 61.02-48, 52, 53, 54),
    originari di Taiwan e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 mei 1978 waarbij de Franse Republiek
    wordt gemachtigd japonnen, geweven en van brei- of haakwerk, voor dames, meisjes
    en kinderen (andere dan baby's), van de posten ex 60.05 A II en ex 61.02 van het
    gemeenschappelijk douanetarief (NIMEXE-code 60.05-41, 42, 43, 44; 61.02-48, 52,
    53, 54), van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
