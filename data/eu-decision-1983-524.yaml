title:
- language: en
  script: Latn
  content: '83/524/EEC: Commission Decision of 13 October 1983 amending Decision 81/983/EEC
    approving certain food-aid operations carried out by humanitarian organizations
    and exempting them from monetary compensatory amounts (Only the English text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/524/CEE: Décision de la Commission du 13 octobre 1983 modifiant la
    décision 81/983/CEE relative à l''agrément d''opérations d''aide alimentaire
    réalisées par des organismes à but humanitaire, les dispensant de l''application
    des montants compensatoires monétaires (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/524/EWG: Entscheidung der Kommission vom 13. Oktober 1983 zur Änderung
    der Entscheidung 81/983/EWG zur Anerkennung von Nahrungsmittelhilfemaßnahmen
    humanitärer Organisationen und zu deren Freistellung von Währungsausgleichsbeträgen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/524/EØF: Kommissionens beslutning af 13. oktober 1983 om ændring
    af beslutning 81/983/EØF om godkendelse af humanitære organisationers fødevarehjælpeaktioner
    med henblik på deres fritagelse for anvendelsen af monetære udligningsbeløb
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/524/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Οκτωβρίου 1983 για την τροποποίηση της απόφασης
    81/983/ΕΟΚ περί εγκρίσεως πράξεων επισιτιστικής
    βοήθειας που πραγματοποιούνται από οργανισμούς
    με φιλανθρωπικό σκοπό και οι οποίες εξαιρούνται
    από την εφαρμογή νομισματικών εξισωτικών ποσών
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
