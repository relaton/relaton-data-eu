title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 84/91 of 5 December 1990 on the application
    of Article 85 (3) of the Treaty to certain categories of Agreements, Decisions
    and concerted practices concerning joint planning and coordination of capacity,
    consultations on passenger and cargo tariffs rates on scheduled air services and
    slot allocation at airports
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 84/91 DE LA COMMISSION du 5 décembre 1990 concernant
    l'' application de l'' article 85 paragraphe 3 du traité à des catégories d''
    accords, de décisions ou de pratiques concertées ayant pour objet la planification
    conjointe et la coordination des capacités, les consultations tarifaires sur
    les services aériens réguliers et la répartition des créneaux horaires dans
    les aéroports #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 84/91 DER KOMMISSION vom 5. Dezember 1990 zur Anwendung
    von Artikel 85 Absatz 3 des Vertrages auf Gruppen von Vereinbarungen zwischen
    Unternehmen, Beschlüssen von Unternehmensvereinigungen oder aufeinander abgestimmten
    Verhaltensweisen zur gemeinsamen Planung und Koordinierung der Kapazität, der
    Aufteilung der Einnahmen, der Tarifkonsultationen im Fluglinienverkehr sowie der
    Zuweisung von Zeitnischen auf Flughäfen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 84/91 af 5. december 1990 om anvendelse
    af Traktatens artikel 85, stk. 3, på visse kategorier af aftaler, vedtagelser
    og samordnet praksis vedrørende fælles planlægning og samordning af kapacitet,
    konsultationer om passager- og fragttakster inden for ruteflyvning samt fordeling
    af ankomst- og afgangstider i lufthavne (»slots«)
  type: main
- language: el
  script: Grek
