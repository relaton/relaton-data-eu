  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 84/91 DELLA COMMISSIONE del 5 dicembre 1990 relativo
    all'' applicazione dell'' articolo 85, paragrafo 3 del trattato CEE ad alcune
    categorie di accordi, decisioni o pratiche concordate aventi per oggetto, sui
    servizi aerei di linea, la programmazione in comune e il coordinamento della capacità,
