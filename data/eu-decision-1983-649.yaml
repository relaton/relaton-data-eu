  content: '83/649/EEC: Commission Decision of 19 December 1983 accepting undertakings
    in connection with the anti-dumping procedure in respect of certain imports of
    hardboard originating in Sweden and terminating that procedure'
  type: main
- language: fr
  script: Latn
  content: '83/649/CEE: Décision de la Commission du 19 décembre 1983 portant acceptation
