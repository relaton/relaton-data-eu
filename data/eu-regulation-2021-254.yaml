title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/254 of 18 February 2021 amending
    Implementing Regulations (EU) 2020/761 and (EU) 2020/1988 and Regulations (EC)
    No 218/2007 and (EC) No 1518/2007 as regards imports of products originating in
    the United Kingdom and excluding those products from the tariff quotas with ongoing
    quota periods
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/254 de la Commission du 18 février
    2021 modifiant les règlements d’exécution (UE) 2020/761 et (UE) 2020/1988
    ainsi que les règlements (CE) no 218/2007 et (CE) no 1518/2007 en ce qui concerne
    les importations de produits originaires du Royaume-Uni et excluant ces produits
    des contingents tarifaires dont les périodes contingentaires sont en cours
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/254 der Kommission vom 18. Februar 2021
    zur Änderung der Durchführungsverordnungen (EU) 2020/761 und (EU) 2020/1988
    sowie der Verordnungen (EG) Nr. 218/2007 und (EG) Nr. 1518/2007 hinsichtlich der
    Einfuhren von Erzeugnissen mit Ursprung im Vereinigten Königreich und des Ausschlusses
    dieser Erzeugnisse aus den Zollkontingenten mit laufenden Kontingentszeiträumen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/254 на Комисията
