    218/2007/EK és az 1518/2007/EK rendeletnek az Egyesült Királyságból származó
    termékek behozatala tekintetében történő módosításáról és e termékeknek
    a folyamatban lévő kontingensidőszakok hatálya alá tartozó vámkontingensekből
    való kizárásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/254 della Commissione del 18 febbraio
    2021 che modifica i regolamenti di esecuzione (UE) 2020/761 e (UE) 2020/1988 e
    i regolamenti (CE) n. 218/2007 e (CE) n. 1518/2007 per quanto riguarda le importazioni
    di prodotti originari del Regno Unito ed esclude tali prodotti dai contingenti
    tariffari il cui periodo contingentale è in corso
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/254 (2021. gada 18. februāris),
