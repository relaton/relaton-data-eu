    a produselor respective din contingentele tarifare cu perioade contingentare în
    curs
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/254 z 18. februára 2021, ktorým
    sa menia vykonávacie nariadenia (EÚ) 2020/761 a (EÚ) 2020/1988 a nariadenia
    (ES) č. 218/2007 a (ES) č. 1518/2007, pokiaľ ide o dovoz výrobkov s pôvodom
