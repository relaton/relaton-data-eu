    218/2007 un (EK) Nr. 1518/2007 groza attiecībā uz Apvienotās Karalistes izcelsmes
    produktu importu un minētos produktus izslēdz no tarifa kvotām, kuru kvotas
    periods turpinās
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/254 2021 m. vasario 18 d.
