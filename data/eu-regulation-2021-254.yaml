    e os Regulamentos (CE) n.o 218/2007 e (CE) n.o 1518/2007 no respeitante às importações
    de produtos originários do Reino Unido e que exclui esses produtos dos contingentes
    pautais com períodos de contingentamento em curso
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/254 al Comisiei din 18 februarie
