    μπορούν να γίνουν δεκτές οι αιτήσεις πιστοποιητικών
    εισαγωγής που υπεβλήθησαν τον Ιούλιο του 1995
    για ορισμένα τυριά στο πλαίσιο ορισμένων δασμολογικών
    ποσοστώσεων υπέρ της Ουγγαρίας και της Βουλγαρίας
    που θεσπίσθηκαν με τον κανονισμό (ΕΚ) αριθ.
    3379/94 του Συμβουλίου
  type: main
