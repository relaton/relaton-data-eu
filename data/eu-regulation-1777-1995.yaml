  content: COMMISSION REGULATION (EC) No 1777/95 of 24 July 1995 determining the extent
    to which the applications for import licences submitted in July 1995 for certain
    cheeses under certain tariff quotas for Hungary and Bulgaria opened by Council
    Regulation (EC) No 3379/94 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1777/95 DE LA COMMISSION du 24 juillet 1995 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1995 pour certains fromages dans le cadre de certains contingents tarifaires
    en faveur de la Hongrie et de la Bulgarie ouverts par le règlement (CE) n° 3379/94
    du Conseil peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1777/95 DER KOMMISSION vom 24. Juli 1995 zur Festlegung
    des Umfangs, in dem den im Juli 1995 gestellten Anträgen auf Erteilung von Lizenzen
    für die Einfuhr von Käse im Rahmen der durch die Verordnung (EG) Nr. 3379/94
    zugunsten von Ungarn und Bulgarien eröffneten Zollkontingente stattgegeben werden
    kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1777/95 af 24. juli 1995 om i hvilket
    omfang de ansøgninger om importlicenser, som er indgivet i juli 1995 vedrørende
    visse oste inden for de toldkontingenter til fordel for Ungarn og Bulgarien, der
    blev åbnet ved Rådets forordning (EF) nr. 3379/94, kan imødekommes
  type: main
- language: el
  script: Grek
