  content: Commission Regulation (EC) No 16/2000 of 5 January 2000 repealing Regulation
    (EC) No 2558/1999 derogating temporarily from certain provisions on the issuing
    of export licences with advance fixing of the refund for agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 16/2000 de la Commission, du 5 janvier 2000, abrogeant
    le règlement (CE) nº 2558/1999 dérogeant temporairement à certaines dispositions
    relatives à la délivrance des certificats d'exportation comportant fixation
    à l'avance de la restitution pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 16/2000 der Kommission vom 5. Januar 2000 zur Aufhebung
    der Verordnung (EG) Nr. 2558/1999 zur befristeten Abweichung von mehreren Bestimmungen
    betreffend die Erteilung von Ausfuhrlizenzen mit Vorausfestsetzung der Erstattung
    für landwirtschaftliche Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 16/2000 af 5. januar 2000 om ophævelse
    af forordning (EF) nr. 2558/1999 om midlertidig fravigelse af visse bestemmelser
    om udstedelse af eksportlicenser med forudfastsættelse af restitutionen for landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 16/2000 της Επιτροπής,
