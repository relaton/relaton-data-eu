    κανονισμού (ΕΚ) αριθ. 2558/1999 για την προσωρινή
    παρέκκλιση από ορισμένες διατάξεις σχετικά
    με την έκδοση των πιστοποιητικών εξαγωγής
    που συνεπάγονται προκαθορισμό της επιστροφής
    για τα γεωργικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 16/2000, annettu 5 päivänä tammikuuta 2000,
    poikkeamisesta tilapäisestä maataloustuotteiden tuen ennakkovahvistuksen sisältävien
    vientitodistusten antamista koskevista eräistä säännöksistä asetuksen (EY)
    N:o 2558/1999 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 16/2000 della Commissione, del 5 gennaio 2000, recante
    abrogazione del regolamento (CE) n. 2558/1999 che deroga temporaneamente a talune
    disposizioni relative al rilascio dei titoli d'esportazione recanti fissazione
    anticipata della restituzione per i prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 16/2000 van de Commissie van 5 januari 2000 tot intrekking
    van Verordening (EG) nr. 2558/1999 houdende tijdelijke afwijking van een aantal
    bepalingen betreffende de afgifte van uitvoercertificaten met vaststelling vooraf
    van de restitutie voor landbouwproducten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 16/2000 da Comissão, de 5 de Janeiro de 2000, que
    revoga o Regulamento (CE) n.o 2558/1999, que derroga temporariamente determinadas
    disposições relativas à emissão dos certificados de exportação com prefixação
    da restituição para os produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 16/2000 de la Comisión, de 5 de enero de 2000, que
