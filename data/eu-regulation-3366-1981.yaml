    Fangquoten für 1981 für Fischereifahrzeuge unter der Flagge eines Mitgliedstaats,
    die im Regelungsbereich des NAFO-Übereinkommens fischen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3366/81 af 24. november 1981 om ændring
    af forordning (EØF) nr. 2228/81 om forvaltning af og kontrol med visse fangstkvoter
    for 1981 for fartøjer, som fører en medlemsstats flag, og som udøver fiskeri
    i det regulerede område, der er defineret i NAFO-konventionen
  type: main
- language: el
  script: Grek
