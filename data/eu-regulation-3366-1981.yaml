  content: Council Regulation (EEC) No 3366/81 of 24 November 1981 amending Regulation
    (EEC) No 2228/81 concerning the management and control of certain catch quotas
    for 1981 for vessels flying the flag of a Member State and fishing in the regulatory
    area defined in the NAFO Convention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3366/81 du Conseil, du 24 novembre 1981, modifiant
    le règlement (CEE) n° 2228/81 concernant la gestion et le contrôle de certains
    quotas de capture alloués pour 1981 aux navires battant pavillon d' un des États
    membres et pêchant dans la zone de réglementation définie par la convention
    NAFO
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3366/81 des Rates vom 24. November 1981 zur Änderung
